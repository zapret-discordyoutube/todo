<svg xmlns="http://www.w3.org/2000/svg" class="dsa-multisplit" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="dsa-multisplit-t dsa-multisplit-d">
<title id="dsa-multisplit-t">multisplit: три сегмента по порядку</title>
<desc id="dsa-multisplit-d">Карта потока для multisplit с pos=1,midsld: ClientHello уходит тремя сегментами по порядку — 1 байт, байты до середины имени, остаток. Имя youtube.com разрезано между вторым и третьим сегментом, сервер собирает поток по seq.</desc>
