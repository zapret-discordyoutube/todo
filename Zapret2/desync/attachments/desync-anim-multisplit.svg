<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t d">
<title id="t">multisplit: ClientHello разрезан на три TCP-сегмента</title>
<desc id="d">Анимация: Zapret 2 режет TLS ClientHello по позициям 1 и midsld на три сегмента и отправляет их по порядку. ТСПУ видит имя youtube.com разрезанным между пакетами и не находит сигнатуру, сервер собирает поток целиком.</desc>
<style>.mono{font-family:ui-monospace,'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:Onest,Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','DejaVu Sans',sans-serif}.a{animation-duration:7.77s;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.a{animation:none!important}.pk{display:none}}@keyframes k1{0.0%{opacity:0}21.414%{opacity:0}22.958%{opacity:0.95}28.621%{opacity:0}31.348%{opacity:0}32.892%{opacity:0.95}38.555%{opacity:0}41.113%{opacity:0}42.657%{opacity:0.95}48.32%{opacity:0}100%{opacity:0}}@keyframes k2{0.0%{opacity:0}22.186%{opacity:0}26.047%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k3{0.0%{opacity:0}32.12%{opacity:0}35.981%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k4{0.0%{opacity:0}41.885%{opacity:0}45.746%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k5{0.0%{opacity:0}46.39%{opacity:0}50.251%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k6{0.0%{opacity:0}48.964%{opacity:0}52.825%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k7{0.0%{opacity:0}51.538%{opacity:0}55.399%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k8{0.0%{opacity:0}36.65%{opacity:0}40.511%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k9{0.0%{opacity:0}45.578%{opacity:0}49.439%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k10{0.0%{opacity:0}53.668%{opacity:0}57.529%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k11{0.0%{opacity:0}62.033%{opacity:0}65.894%{opacity:1}90.991%{opacity:1}96.782%{opacity:0}100%{opacity:0}}@keyframes k12{0.0%{opacity:0;transform:translate(199.0px,292.0px)}7.722%{opacity:0;transform:translate(199.0px,292.0px)}10.296%{opacity:1;transform:translate(249.0px,292.0px)}36.65%{opacity:1;transform:translate(761.0px,292.0px)}40.511%{opacity:0;transform:translate(773.0px,292.0px)}100%{opacity:0;transform:translate(773.0px,292.0px)}}@keyframes k13{0.0%{opacity:0;transform:translate(218.6px,292.0px)}18.662%{opacity:0;transform:translate(218.6px,292.0px)}21.236%{opacity:1;transform:translate(268.6px,292.0px)}45.578%{opacity:1;transform:translate(741.4px,292.0px)}49.439%{opacity:0;transform:translate(753.4px,292.0px)}100%{opacity:0;transform:translate(753.4px,292.0px)}}@keyframes k14{0.0%{opacity:0;transform:translate(251.1px,292.0px)}30.102%{opacity:0;transform:translate(251.1px,292.0px)}32.676%{opacity:1;transform:translate(301.1px,292.0px)}53.668%{opacity:1;transform:translate(708.9px,292.0px)}57.529%{opacity:0;transform:translate(720.9px,292.0px)}100%{opacity:0;transform:translate(720.9px,292.0px)}}</style>
<rect x="1" y="1" width="958" height="670" rx="26" fill="#0b1020" stroke="#1f2a48" stroke-width="2"/>
<text x="36" y="58" class="mono" font-size="30" font-weight="700" fill="#4fd1ff">multisplit</text>
<text x="240" y="57" class="sans" font-size="19" fill="#8d99bd">режем по порядку</text>
<text x="36" y="90" class="mono" font-size="15" fill="#7d8bb0">--payload=tls_client_hello --lua-desync=multisplit:pos=1,midsld</text>
<line x1="150" y1="292" x2="810" y2="292" stroke="rgba(151,166,201,.4)" stroke-width="2" stroke-dasharray="6 10"/>
<rect x="30" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="90.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">ваш ПК</text>
<text x="90.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">Zapret 2</text>
<rect x="810" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="870.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">сервер</text>
<text x="870.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">youtube.com</text>
<text x="480" y="214" class="sans" font-size="21" font-weight="800" letter-spacing="2" fill="#ff3b5c" text-anchor="middle">ТСПУ</text>
<rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,59,92,.14)" stroke="#ff3b5c" stroke-width="2"/>
<g class="a pk" style="animation-name:k1"><rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,176,32,.55)" stroke="#ffb020" stroke-width="5"/></g>
<text x="36" y="384" class="sans" font-size="15" fill="#8d99bd">каждый пакет — настоящий кусок того же ClientHello, фейков нет</text>
<text x="36" y="144" class="sans" font-size="16" fill="#8d99bd">что отправляет браузер:</text>
<rect x="270.8" y="118" width="47.1" height="40" rx="6" fill="#4fd1ff" fill-opacity=".13" stroke="#4fd1ff" stroke-width="1.6"/>
<text x="294.3" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">16</tspan></text>
<line x1="317.9" y1="110" x2="317.9" y2="166" stroke="#ff3b5c" stroke-width="2.4" stroke-dasharray="4 3"/>
<text x="317.9" y="180" class="mono" font-size="13" fill="#ff3b5c" text-anchor="middle">pos=1</text>
<rect x="317.9" y="118" width="184.1" height="40" rx="6" fill="#9b7bff" fill-opacity=".13" stroke="#9b7bff" stroke-width="1.6"/>
<text x="409.9" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">03 01 … SNI you</tspan></text>
<line x1="502.0" y1="110" x2="502.0" y2="166" stroke="#ff3b5c" stroke-width="2.4" stroke-dasharray="4 3"/>
<text x="502.0" y="180" class="mono" font-size="13" fill="#ff3b5c" text-anchor="middle">midsld</text>
<rect x="502.0" y="118" width="131.4" height="40" rx="6" fill="#ffb020" fill-opacity=".13" stroke="#ffb020" stroke-width="1.6"/>
<text x="567.7" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">tube.com …</tspan></text>
<rect x="30" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="50" y="452" class="sans" font-size="18" font-weight="700" fill="#ff3b5c">что видит ТСПУ</text>
<rect x="490" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="510" y="452" class="sans" font-size="18" font-weight="700" fill="#37e39a">что собирает сервер</text>
<g class="a fin" style="animation-name:k2"><g transform="translate(66.6,492)"><rect x="-16.6" y="-20.0" width="33.2" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">①</tspan></text></g></g>
<g class="a fin" style="animation-name:k3"><g transform="translate(137.6,492)"><rect x="-44.5" y="-20.0" width="89.0" height="40" rx="11" fill="#0e1630" stroke="#9b7bff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#9b7bff">② …you</tspan></text></g></g>
<g class="a fin" style="animation-name:k4"><g transform="translate(264.5,492)"><rect x="-72.4" y="-20.0" width="144.8" height="40" rx="11" fill="#0e1630" stroke="#ffb020" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#ffb020">③ tube.com…</tspan></text></g></g>
<g class="a fin" style="animation-name:k5"><text x="50" y="548" class="sans" font-size="18" font-weight="700" fill="#ffb020">имя youtube.com разрезано</text></g>
<g class="a fin" style="animation-name:k6"><text x="50" y="575" class="sans" font-size="18" font-weight="400" fill="#e8edff">между пакетами — сигнатура</text></g>
<g class="a fin" style="animation-name:k7"><text x="50" y="602" class="sans" font-size="18" font-weight="400" fill="#e8edff">не нашлась, соединение идёт</text></g>
<g transform="translate(533.2,492)"><rect x="-23.2" y="-20" width="46.3" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k8"><g transform="translate(533.2,492)"><rect x="-23.2" y="-20.0" width="46.3" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">16</tspan></text></g></g>
<g transform="translate(604.2,492)"><rect x="-39.9" y="-20" width="79.8" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k9"><g transform="translate(604.2,492)"><rect x="-39.9" y="-20.0" width="79.8" height="40" rx="11" fill="#0e1630" stroke="#9b7bff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">… you</tspan></text></g></g>
<g transform="translate(719.9,492)"><rect x="-67.8" y="-20" width="135.6" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k10"><g transform="translate(719.9,492)"><rect x="-67.8" y="-20.0" width="135.6" height="40" rx="11" fill="#0e1630" stroke="#ffb020" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">tube.com …</tspan></text></g></g>
<g class="a fin" style="animation-name:k11"><text x="510" y="628" class="sans" font-size="20" font-weight="700" fill="#37e39a">собрано: … youtube.com … ✓</text></g>
<g class="a pk" style="animation-name:k12"><rect x="-41.0" y="-23.0" width="82.1" height="46" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">① </tspan><tspan fill="#e8edff">16</tspan></text></g>
<g class="a pk" style="animation-name:k13"><rect x="-60.6" y="-23.0" width="121.1" height="46" rx="11" fill="#0e1630" stroke="#9b7bff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#9b7bff">② </tspan><tspan fill="#e8edff">… you</tspan></text></g>
<g class="a pk" style="animation-name:k14"><rect x="-93.1" y="-23.0" width="186.2" height="46" rx="11" fill="#0e1630" stroke="#ffb020" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#ffb020">③ </tspan><tspan fill="#e8edff">tube.com …</tspan></text></g>
</svg>
