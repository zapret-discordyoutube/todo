<g class="a fin" style="animation-name:k14"><text x="510" y="552" class="sans" font-size="17" fill="#ff3b5c">фейки: неверный ACK (tcp_ack=-66000)</text></g>
<g class="a fin" style="animation-name:k15"><text x="510" y="579" class="sans" font-size="17" fill="#ff3b5c">→ отброшены, настоящие части приняты</text></g>
<g class="a fin" style="animation-name:k16"><text x="510" y="628" class="sans" font-size="20" font-weight="700" fill="#37e39a">собрано: … youtube.com … ✓</text></g>
