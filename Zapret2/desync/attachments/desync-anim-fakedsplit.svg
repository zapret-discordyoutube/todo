<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t d">
<title id="t">fakedsplit: части ClientHello вперемешку с фейками</title>
<desc id="d">Анимация: Zapret 2 режет ClientHello по midsld на две части и окружает каждую фейком того же размера и с тем же seq: фейк, часть 1, фейк, фейк, часть 2, фейк. ТСПУ видит по три копии каждой части, сервер отбрасывает фейки по неверному ACK.</desc>
