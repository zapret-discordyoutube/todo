<g class="a fin" style="animation-name:k9"><text x="50" y="548" class="sans" font-size="18" font-weight="700" fill="#ffb020">каждая часть пришла трижды</text></g>
<g class="a fin" style="animation-name:k10"><text x="50" y="575" class="sans" font-size="18" font-weight="400" fill="#e8edff">с одним и тем же seq — какая</text></g>
