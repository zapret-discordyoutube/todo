<svg xmlns="http://www.w3.org/2000/svg" class="dsh-segments" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="dsh-segments-t dsh-segments-d">
<title id="dsh-segments-t">multisplit: pos=100,300,450 делит 600 байт на четыре сегмента</title>
<desc id="dsh-segments-d">Данные длиной 600 байт режутся в позициях 100, 300 и 450 на четыре куска: 0–99, 100–299, 300–449, 450–599. Сегменты уходят по порядку, seq каждого равен смещению его первого байта.</desc>
