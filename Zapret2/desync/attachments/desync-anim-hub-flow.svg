<svg xmlns="http://www.w3.org/2000/svg" class="dsh-flow" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="dsh-flow-t dsh-flow-d">
<title id="dsh-flow-t">Путь одного пакета через цепочку инстансов</title>
<desc id="dsh-flow-d">Пакет проходит перехват и разбор в ядре, фильтры профиля, первый инстанс fake и второй инстанс multisplit. Каждая функция отправляет свои пакеты в сеть сразу, а оригиналу возвращает вердикт: fake — PASS, multisplit — DROP. Итог по цепочке — DROP: оригинал выброшен, в сети уже фейк и три куска.</desc>
<style>.dsh-flow{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-flow{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-flow .dsh-flow-bg{fill:var(--bg)}.dsh-flow text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-flow .dsh-flow-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-flow .dsh-flow-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-flow .dsh-flow-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-flow .dsh-flow-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-flow .dsh-flow-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-flow .dsh-flow-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-flow .dsh-flow-sm{font-size:14.5px}.dsh-flow .dsh-flow-mu{fill:var(--mute)}.dsh-flow .dsh-flow-fg{fill:var(--fg)}.dsh-flow .dsh-flow-acc{fill:var(--acc)}.dsh-flow .dsh-flow-rej{fill:var(--rej)}.dsh-flow .dsh-flow-c{text-anchor:middle}.dsh-flow .dsh-flow-r{text-anchor:end}.dsh-flow .dsh-flow-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-flow .dsh-flow-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-flow .dsh-flow-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-flow .dsh-flow-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-flow .dsh-flow-bxn{fill:none;stroke:none}.dsh-flow .dsh-flow-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-flow .dsh-flow-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-flow .dsh-flow-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-flow .dsh-flow-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-flow .dsh-flow-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-flow .dsh-flow-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-flow .dsh-flow-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-flow .dsh-flow-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-flow .dsh-flow-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-flow .dsh-flow-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-flow .dsh-flow-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-flow .dsh-flow-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-flow .dsh-flow-bxbg{fill:var(--bg);stroke:none}.dsh-flow .dsh-flow-hd-a{fill:var(--acc)}.dsh-flow .dsh-flow-hd-f{fill:var(--fg2)}.dsh-flow .dsh-flow-hd-r{fill:var(--rej)}.dsh-flow .dsh-flow-dot{fill:var(--acc)}.dsh-flow .dsh-flow-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-flow .dsh-flow-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-flow .dsh-flow-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-flow .dsh-flow-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-flow .a{animation-duration:12.5s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-flow .a{animation:none}.dsh-flow .tr{display:none}}figure.dsh-flow-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-flow-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-flow-k1{0.0%{opacity:0;transform:translate(0px,0px)}4.0%{opacity:0;transform:translate(0px,0px)}6.0%{opacity:1;transform:translate(0px,0px)}16.8%{opacity:1;transform:translate(0px,0px)}19.2%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-flow .dsh-flow-e1{animation-name:dsh-flow-k1}@keyframes dsh-flow-k2{0.0%{opacity:0;transform:translate(0px,0px)}19.2%{opacity:0;transform:translate(0px,0px)}21.2%{opacity:1;transform:translate(0px,0px)}28.8%{opacity:1;transform:translate(0px,0px)}31.2%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-flow .dsh-flow-e2{animation-name:dsh-flow-k2}@keyframes dsh-flow-k3{0.0%{opacity:0;transform:translate(0px,0px)}31.2%{opacity:0;transform:translate(0px,0px)}33.2%{opacity:1;transform:translate(0px,0px)}40.8%{opacity:1;transform:translate(0px,0px)}43.2%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-flow .dsh-flow-e3{animation-name:dsh-flow-k3}@keyframes dsh-flow-k4{0.0%{opacity:0;transform:translate(0px,0px)}43.2%{opacity:0;transform:translate(0px,0px)}45.2%{opacity:1;transform:translate(0px,0px)}52.8%{opacity:1;transform:translate(0px,0px)}55.2%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-flow .dsh-flow-e4{animation-name:dsh-flow-k4}@keyframes dsh-flow-k5{0.0%{opacity:0;transform:translate(0px,0px)}56.0%{opacity:0;transform:translate(0px,0px)}58.4%{opacity:1;transform:translate(0px,0px)}95.6%{opacity:1;transform:translate(0px,0px)}98.8%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-flow .dsh-flow-e5{animation-name:dsh-flow-k5}@keyframes dsh-flow-k6{0.0%{opacity:0;transform:translate(-78px,94px)}32.0%{opacity:0;transform:translate(-78px,94