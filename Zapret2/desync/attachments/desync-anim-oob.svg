<svg xmlns="http://www.w3.org/2000/svg" class="dsa-oob" viewBox="0 0 960 282" width="960" height="282" role="img" aria-labelledby="dsa-oob-t dsa-oob-d">
<title id="dsa-oob-t">oob: байт срочных данных внутри имени сайта</title>
<desc id="dsa-oob-d">Карта потока для oob с urp=midsld: сначала SYN с номером последовательности на единицу меньше, затем ClientHello с байтом срочных данных (флаг URG) посреди имени youtube.com. TCP-стек сервера вынимает этот байт, и имя смыкается.</desc>
<style>.dsa-oob{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8)}@media (prefers-color-scheme:dark){.dsa-oob{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618)}}.dsa-oob .dsa-oob-bg{fill:var(--bg)}.dsa-oob text{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13.5px;fill:var(--fg2)}.dsa-oob .dsa-oob-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsa-oob .dsa-oob-tick{font-size:11px;fill:var(--mute)}.dsa-oob .dsa-oob-rule{stroke:var(--mute);stroke-width:1}.dsa-oob .dsa-oob-brace{fill:none;stroke:var(--acc);stroke-width:1.3}.dsa-oob .dsa-oob-cut{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 4;opacity:.55}.dsa-oob .dsa-oob-win{stroke:var(--fg2);stroke-width:1.4}.dsa-oob .dsa-oob-sep{stroke:var(--line);stroke-width:1}.dsa-oob .dsa-oob-no{fill:var(--mute)}.dsa-oob .dsa-oob-k{fill:var(--fg);font-weight:600}.dsa-oob .dsa-oob-kfk{fill:var(--mute);font-weight:600}.dsa-oob .dsa-oob-meta{fill:var(--mute)}.dsa-oob .dsa-oob-arrow{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--fg2)}.dsa-oob .dsa-oob-rl{fill:var(--tint);stroke:var(--acc);stroke-width:1}.dsa-oob .dsa-oob-fk{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:2 2}.dsa-oob .dsa-oob-dim{fill:none;stroke:var(--line);stroke-width:1}.dsa-oob .dsa-oob-mk{fill:none;stroke:var(--fg);stroke-width:1.8}.dsa-oob .dsa-oob-slot{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.dsa-oob .dsa-oob-ch{font-size:14px;fill:var(--fg);text-anchor:middle}.dsa-oob .dsa-oob-ch-fk{font-size:14px;fill:var(--mute);text-anchor:middle}.dsa-oob .dsa-oob-ch-mu{font-size:14px;fill:var(--mute);text-anchor:middle}.dsa-oob .dsa-oob-strike{stroke:var(--fg2);stroke-width:1.4;transform-box:fill-box;transform-origin:left center}.dsa-oob .dsa-oob-uline{stroke:var(--acc);stroke-width:2;transform-box:fill-box;transform-origin:left center}.dsa-oob .dsa-oob-srv{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--fg)}.dsa-oob .dsa-oob-srv-no{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--mute)}.dsa-oob .dsa-oob-note{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;fill:var(--fg2)}.dsa-oob .dsa-oob-who{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--acc)}.dsa-oob .a{animation-duration:6.35s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsa-oob .a{animation:none}}figure.dsa-oob-fig{margin:1.6rem 0;overflow-x:auto}figure.dsa-oob-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsa-oob-k1{0.0%{opacity:0}7.874%{opacity:0}13.386%{opacity:1}91.339%{opacity:1}97.638%{opacity:0}100%{opacity:0}}.dsa-oob .dsa-oob-e1{animation-name:dsa-oob-k1}@keyframes dsa-oob-k2{0.0%{opacity:0;transform:translateX(-14px)}7.874%{opacity:0;transform:translateX(-14px)}13.386%{opacity:1;transform:translateX(0px)}91.339%{opacity:1;transform:translateX(0px)}97.638%{opacity:0;transform:translateX(-14px)}100%{opacity:0;transform:translateX(-14px)}}.dsa-oob .dsa-oob-e2{animation-name:dsa-oob-k2}@keyframes dsa-oob-k3{0.0%{opacity:0}16.535%{opacity:0}22.047%{opacity:1}91.339%