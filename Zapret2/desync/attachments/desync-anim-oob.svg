.0%{opacity:0}53.543%{opacity:0}59.055%{opacity:1}91.339%{opacity:1}97.638%{opacity:0}100%{opacity:0}}.dsa-oob .dsa-oob-e12{animation-name:dsa-oob-k12}</style>
