<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-tcpseg-drop" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="dsh-z2-tcpseg-drop-t dsh-z2-tcpseg-drop-d">
<title id="dsh-z2-tcpseg-drop-t">tcpseg без drop и с drop</title>
<desc id="dsh-z2-tcpseg-drop-d">tcpseg отправляет сегмент и вердикта не выносит. Без drop цепочка заканчивается VERDICT_PASS по умолчанию, оригинал уходит тоже и сервер получает данные дважды. С drop вердикт DROP блокирует оригинал: сервер получает только то, что отправил tcpseg.</desc>
