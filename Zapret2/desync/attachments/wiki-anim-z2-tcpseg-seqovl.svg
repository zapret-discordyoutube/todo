<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-tcpseg-seqovl" viewBox="0 0 960 230" width="960" height="230" role="img" aria-labelledby="dsh-z2-tcpseg-seqovl-t dsh-z2-tcpseg-seqovl-d">
<title id="dsh-z2-tcpseg-seqovl-t">tcpseg с pos=0,midsld и seqovl=5: уходит начало с паттерном</title>
<desc id="dsh-z2-tcpseg-seqovl-d">Отправляется только начало payload — от первого байта до midsld. Перед ним дописаны 5 байт паттерна, seq на 5 меньше. Оригинальный пакет не блокируется: нужен drop.</desc>
