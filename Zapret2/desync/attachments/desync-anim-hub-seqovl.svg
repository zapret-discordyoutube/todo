<svg xmlns="http://www.w3.org/2000/svg" class="dsh-seqovl" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="dsh-seqovl-t dsh-seqovl-d">
<title id="dsh-seqovl-t">seqovl: лишние байты слева от окна приёма</title>
<desc id="dsh-seqovl-d">Без seqovl сегмент начинается с seq=1000 — именно с него сервер ждёт данные. С seqovl=10 слева дописано 10 байт паттерна, а seq сдвинут на 990. DPI читает сегмент целиком, вместе с паттерном; сервер выбрасывает байты левее 1000 как устаревшие и принимает реальную часть.</desc>
<style>.dsh-seqovl{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-seqovl{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-seqovl .dsh-seqovl-bg{fill:var(--bg)}.dsh-seqovl text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-seqovl .dsh-seqovl-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-seqovl .dsh-seqovl-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-seqovl .dsh-seqovl-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-seqovl .dsh-seqovl-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-seqovl .dsh-seqovl-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-seqovl .dsh-seqovl-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-seqovl .dsh-seqovl-sm{font-size:14.5px}.dsh-seqovl .dsh-seqovl-mu{fill:var(--mute)}.dsh-seqovl .dsh-seqovl-fg{fill:var(--fg)}.dsh-seqovl .dsh-seqovl-acc{fill:var(--acc)}.dsh-seqovl .dsh-seqovl-rej{fill:var(--rej)}.dsh-seqovl .dsh-seqovl-c{text-anchor:middle}.dsh-seqovl .dsh-seqovl-r{text-anchor:end}.dsh-seqovl .dsh-seqovl-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-seqovl .dsh-seqovl-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-seqovl .dsh-seqovl-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-seqovl .dsh-seqovl-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-seqovl .dsh-seqovl-bxn{fill:none;stroke:none}.dsh-seqovl .dsh-seqovl-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-seqovl .dsh-seqovl-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-seqovl .dsh-seqovl-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-seqovl .dsh-seqovl-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-seqovl .dsh-seqovl-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-seqovl .dsh-seqovl-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-seqovl .dsh-seqovl-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-seqovl .dsh-seqovl-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-seqovl .dsh-seqovl-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-seqovl .dsh-seqovl-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-seqovl .dsh-seqovl-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-seqovl .dsh-seqovl-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-seqovl .dsh-seqovl-bxbg{fill:var(--bg);stroke:none}.dsh-seqovl .dsh-seqovl-hd-a{fill:var(--acc)}.dsh-seqovl .dsh-seqovl-hd-f{fill:var(--fg2)}.dsh-seqovl .dsh-seqovl-hd-r{fill:var(--rej)}.dsh-seqovl .dsh-seqovl-dot{fill:var(--acc)}.dsh-seqovl .dsh-seqovl-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-seqovl .dsh-seqovl-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-seqovl .dsh-seqovl-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-seqovl .dsh-seqovl-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-seqovl .a{animation-duration:15s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-seqovl .a{animation:none}.dsh-seqovl .tr{display:none}}figure.dsh-seqovl-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-seqovl-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-seqovl-k1{0.0%{opacity:0;transform:translate(0px,0px)}9.333%{opacity:0;transform:translate(0px,0px)}11.667%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqovl .dsh-seqovl-e1{animation-name:dsh-seqovl-k1}@keyframes dsh-seqovl-k2{0.0%{opacity:0;transform:translate(60px,0px)}20.0%{opacity:0;transform:translate(60px,0px)}21.333%{opacity:0;transform:translate(60px,0px)}28.0%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqovl .dsh-seqovl-e2{animation-name:dsh-seqovl-k2}@keyframes dsh-seqovl-k3{0.0%{opacity:0;transform:translate(0px,0px)}29.333%{opacity:0;transform:translate(0px,0px)}31.667%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqovl .dsh-seqovl-e3{animation-name:dsh-seqovl-k3}@keyframes dsh-seqovl-k4{0.0%{opacity:0;transform:translate(0px,0px)}40.0%{opacity:0;transform:translate(0px,0px)}42.333%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqovl .dsh-seqovl-e4{animation-name:dsh-seqovl-k4}@keyframes dsh-seqovl-k5{0.0%{opacity:0;transform:translate(0px,0px)}53.333%{opacity:0;transform:translate(0px,0px)}55.667%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqovl .dsh-seqovl-e5{animation-name:dsh-seqovl-k5}@keyframes dsh-seqovl-k6{0.0%{opacity:0;transform:translate(0px,0px)}61.333%{opacity:0;transform:translate(0px,0px)}63.667%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqovl .dsh-seqovl-e6{animation-name:dsh-seqovl-k6}@keyframes dsh-seqovl-k7{0.0%{opacity:0;transform:translate(0px,0px)}70.667%{opacity:0;transform:translate(0px,0px)}73.0%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqovl .dsh-seqovl-e7{animation-name:dsh-seqovl-k7}.dsh-seqovl .dsh-seqovl-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-seqovl-bg" x="0" y="0" width="960" height="452"/>
<line class="dsh-seqovl-lfd" x1="410" y1="40" x2="410" y2="262"/>
<text class="dsh-seqovl-acc dsh-seqovl-tk dsh-seqovl-c dsh-seqovl-sm" x="410" y="30">сервер ждёт seq=1000</text>
<text class="dsh-seqovl-tk" x="2" y="89">без seqovl</text>
<rect class="dsh-seqovl-bxa" x="410" y="64" width="390" height="40" rx="7"/>
<text class="dsh-seqovl-mk dsh-seqovl-c dsh-seqovl-sm" x="605.0" y="89">реальная первая часть, seq=1000</text>
<g class="a dsh-seqovl-e1"><text class="dsh-seqovl-acc dsh-seqovl-tk dsh-seqovl-sm" x="810" y="89">принят</text></g>
<text class="dsh-seqovl-tk" x="2" y="195">seqovl=10</text>
<rect class="dsh-seqovl-bxa" x="410" y="170" width="390" height="40" rx="7"/>
<text class="dsh-seqovl-mk dsh-seqovl-c dsh-seqovl-sm" x="605.0" y="195">реальная первая часть</text>
<g class="a dsh-seqovl-e2"><rect class="dsh-seqovl-bxd" x="250" y="170" width="160" height="40" rx="7"/><text class="dsh-seqovl-mu dsh-seqovl-c dsh-seqovl-sm" x="330.0" y="195">паттерн, 10 байт</text><text class="dsh-seqovl-mk dsh-seqovl-sm" x="250" y="160">seq=990</text></g>
<g class="a dsh-seqovl-e3"><text class="dsh-seqovl-mu dsh-seqovl-sm" x="810" y="187">один обычный</text><text class="dsh-seqovl-mu dsh-seqovl-sm" x="810" y="205">TCP-сегмент</text></g>
<g class="a dsh-seqovl-e4"><line class="dsh-seqovl-la" x1="250" y1="266" x2="800" y2="266"/><line class="dsh-seqovl-la" x1="250" y1="260" x2="250" y2="272"/><line class="dsh-seqovl-la" x1="800" y1="260" x2="800" y2="272"/><text class="dsh-seqovl-acc dsh-seqovl-tk dsh-seqovl-c dsh-seqovl-sm" x="525.0" y="292">DPI читает сегмент целиком, от начала — и паттерн тоже</text></g>
<g class="a dsh-seqovl-e5"><line class="dsh-seqovl-lr" x1="250" y1="320" x2="410" y2="320"/><text class="dsh-seqovl-rej dsh-seqovl-tk dsh-seqovl-c dsh-seqovl-sm" x="330.0" y="344">левее 1000: выброшено</text></g>
<g class="a dsh-seqovl-e6"><line class="dsh-seqovl-la" x1="410" y1="320" x2="800" y2="320"/><text class="dsh-seqovl-acc dsh-seqovl-tk dsh-seqovl-c dsh-seqovl-sm" x="605.0" y="344">принято: сервер собрал нужные байты</text></g>
<text class="dsh-seqovl-tk" x="2" y="320">сервер</text>
<text class="dsh-seqovl-tk" x="2" y="292">DPI</text>
<g class="a dsh-seqovl-e7"><text class="dsh-seqovl-t" x="2" y="410">Заголовки не искажены, пакет выглядит честным — этим seqovl отличается от fooling.</text></g>
</svg>
