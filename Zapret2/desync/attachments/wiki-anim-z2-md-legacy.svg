z2-md-legacy .dsh-z2-md-legacy-hd-r{fill:var(--rej)}.dsh-z2-md-legacy .dsh-z2-md-legacy-dot{fill:var(--acc)}.dsh-z2-md-legacy .dsh-z2-md-legacy-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-z2-md-legacy .dsh-z2-md-legacy-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-z2-md-legacy .dsh-z2-md-legacy-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-z2-md-legacy .dsh-z2-md-legacy-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-z2-md-legacy .a{animation-duration:22s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-z2-md-legacy .a{animation:none}.dsh-z2-md-legacy .tr{display:none}}figure.dsh-z2-md-legacy-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-z2-md-legacy-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-z2-md-legacy-k1{0.0%{opacity:0;transform:translate(0px,0px)}3.636%{opacity:0;transform:translate(0px,0px)}5.227%{opacity:1;transform:translate(0px,0px)}97.5%{opacity:1;transform:translate(0px,0px)}99.318%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-md-legacy .dsh-z2-md-legacy-e1{animation-name:dsh-z2-md-legacy-k1}@keyframes dsh-z2-md-legacy-k2{0.0%{opacity:0;transform:translate(0px,0px)}9.091%{opacity:0;transform:translate(0px,0px)}10.682%{opacity:1;transform:translate(0px,0px)}97.5%{opacity:1;transform:translate(0px,0px)}99.318%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-md-legacy .dsh-z2-md-legacy-e2{animation-name:dsh-z2-md-legacy-k2}@keyframes dsh-z2-md-legacy-k3{0.0%{opacity:0;transform:translate(0px,-20px)}13.636%{opacity:0;transform:translate(0px,-20px)}14.545%{opacity:1;transform:translate(0px,-20px)}17.273%{opacity:1;transform:translate(0px,0px)}97.5%{opacity:1;transform:translate(0px,0px)}99.318%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh