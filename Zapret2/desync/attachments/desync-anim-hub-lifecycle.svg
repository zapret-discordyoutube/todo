(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-lifecycle .dsh-lifecycle-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-lifecycle .dsh-lifecycle-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-lifecycle .a{animation-duration:13s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-lifecycle .a{animation:none}.dsh-lifecycle .tr{display:none}}figure.dsh-lifecycle-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-lifecycle-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-lifecycle-k1{0.0%{opacity:0;transform:translate(0px,0px)}4.615%{opacity:0;transform:translate(0px,0px)}6.538%{opacity:1;transform:translate(0px,0px)}12.308%{opacity:1;transform:translate(0px,0px)}14.615%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-lifecycle .dsh-lifecycle-e1{animation-name:dsh-lifecycle-k1}@keyframes dsh-lifecycle-k2{0.0%{opacity:0;transform:translate(0px,0px)}4.615%{opacity:0;transform:translate(0px,0px)}6.538%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-lifecycle .dsh-lifecycle-e2{animation-name:dsh-lifecycle-k2}@keyframes dsh-lifecycle-k3{0.0%{opacity:0;transform:translate(0px,0px)}5.385%{opacity:0;transform:translate(0px,0px)}6.923%{opacity:1;transform:translate(0px,0px)}12.308%{opacity:1;transform:translate(0px,0px)}14.615%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-lifecycle .dsh-lifecycle-e3{animation-name:dsh-lifecycle-k3}@keyframes dsh-lifecycle-k4{0.0%{opacity:0;transform:translate(0px,0px)}12.308%{opacity:0;transform:translate(0px,0px)}14.231%{opacity:1;transform:translate(0px,0px)}20.0%{opacity:1;transform:translate(0px,0px)}22.308%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:t