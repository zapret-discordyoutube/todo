<svg xmlns="http://www.w3.org/2000/svg" class="dsh-lifecycle" viewBox="0 0 960 494" width="960" height="494" role="img" aria-labelledby="dsh-lifecycle-t dsh-lifecycle-d">
<title id="dsh-lifecycle-t">Восемь стадий desync-функции</title>
<desc id="dsh-lifecycle-d">Любая desync-функция по очереди проходит восемь стадий: проверка транспорта, направления, аргументов, выбор данных, три гварда, развилка replay, собственно техника и вердикт. Отказ почти всегда происходит на одной из ранних стадий.</desc>
<style>.dsh-lifecycle{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-lifecycle{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-lifecycle .dsh-lifecycle-bg{fill:var(--bg)}.dsh-lifecycle text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;fill:var(--fg2)}.dsh-lifecycle .dsh-lifecycle-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-lifecycle .dsh-lifecycle-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-lifecycle .dsh-lifecycle-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-lifecycle .dsh-lifecycle-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}.dsh-lifecycle .dsh-lifecycle-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-lifecycle .dsh-lifecycle-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-lifecycle .dsh-lifecycle-sm{font-size:13.5px}.dsh-lifecycle .dsh-lifecycle-mu{fill:var(--mute)}.dsh-lifecycle .dsh-lifecycle-fg{fill:var(--fg)}.dsh-lifecycle .dsh-lifecycle-acc{fill:va