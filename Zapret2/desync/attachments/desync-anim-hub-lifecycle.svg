<g class="a dsh-lifecycle-e16"><circle class="dsh-lifecycle-nda" cx="30" cy="339.0" r="15"/></g>
<text class="dsh-lifecycle-mk dsh-lifecycle-c" x="30" y="344.0">6</text>
<text class="dsh-lifecycle-tk" x="62" y="344.0">Replay</text>
<text class="dsh-lifecycle-t" x="200" y="344.0">это первый кусок запроса?</text>
<text class="dsh-lifecycle-mu dsh-lifecycle-sm" x="600" y="344.0">не первый: дроп, данные уже ушли</text>
<g class="a dsh-lifecycle-e17 tr"><text class="dsh-lifecycle-rej dsh-lifecycle-tk dsh-lifecycle-c" x="578" y="344.0">✕</text></g>
