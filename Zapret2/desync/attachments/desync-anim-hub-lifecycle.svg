<text class="dsh-lifecycle-tk" x="62" y="294.0">Три гварда</text>
<text class="dsh-lifecycle-t" x="200" y="294.0">данные есть, направление и payload подходят?</text>
<text class="dsh-lifecycle-mu dsh-lifecycle-sm" x="600" y="294.0">иначе: ничего не делать</text>
<g class="a dsh-lifecycle-e14 tr"><text class="dsh-lifecycle-rej dsh-lifecycle-tk dsh-lifecycle-c" x="578" y="294.0">✕</text></g>
