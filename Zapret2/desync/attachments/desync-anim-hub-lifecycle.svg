<text class="dsh-lifecycle-cap" x="70" y="30">стадия и что она проверяет</text>
<text class="dsh-lifecycle-cap" x="600" y="30">если не так</text>
<line class="dsh-lifecycle-lf" x1="2" y1="64" x2="950" y2="64"/>
<g class="a dsh-lifecycle-e1 tr"><rect class="dsh-lifecycle-bxa" x="2" y="66" width="946" height="46" rx="8"/></g>
<circle class="dsh-lifecycle-nd" cx="30" cy="89.0" r="15"/>
<g class="a dsh-lifecycle-e2"><circle class="dsh-lifecycle-nda" cx="30" cy="89.0" r="15"/></g>
<text class="dsh-lifecycle-mk dsh-lifecycle-c" x="30" y="94.0">1</text>
<text class="dsh-lifecycle-tk" x="62" y="94.0">Транспорт</text>
<text class="dsh-lifecycle-t" x="200" y="94.0">пакет TCP? (у multisplit — только TCP)</text>
<text class="dsh-lifecycle-mu dsh-lifecycle-sm" x="600" y="94.0">иначе: отключиться от потока</text>
<g class="a dsh-lifecycle-e3 tr"><text class="dsh-lifecycle-rej dsh-lifecycle-tk dsh-lifecycle-c" x="578" y="94.0">✕</text></g>
<line class="dsh-lifecycle-lf" x1="2" y1="114" x2="950" y2="114"/>
<g class="a dsh-lifecycle-e4 tr"><rect class="dsh-lifecycle-bxa" x="2" y="116" width="946" height="46" rx="8"/></g>
<circle class="dsh-lifecycle-nd" cx="30" cy="139.0" r="15"/>
<g class="a dsh-lifecycle-e5"><circle class="dsh-lifecycle-nda" cx="30" cy="139.0" r="15"/></g>
<text class="dsh-lifecycle-mk dsh-lifecycle-c" x="30" y="144.0">2</text>
<text class="dsh-lifecycle-tk" x="62" y="144.0">Направление</text>
<text class="dsh-lifecycle-t" x="200" y="144.0">исходящий? противоположное не нужно</text>
<text class="dsh-lifecycle-mu dsh-lifecycle-sm" x="600" y="144.0">иначе: отключиться от направления</text>
<g class="a dsh-lifecycle-e6 tr"><text class="dsh-lifecycle-rej dsh-lifecycle-tk dsh-lifecycle-c" x="578" y="144.0">✕</text></g>
<line class="dsh-lifecycle-lf" x1="2" y1="164" x2="950" y2="164"/>
<g class="a dsh-lifecycle-e7 tr"><rect class="dsh-lifecycle-bxa" x="2" y="166" width="946" height="46" rx="8"/></g>
<circle class="dsh-lifecycle-nd" cx="30" cy="189.0" r="15"/>
<g class="a dsh-lifecycle-e8"><circle class="dsh-lifecycle-nda" cx="30" cy="189.0" r="15"/></g>
<text class="dsh-lifecycle-mk dsh-lifecycle-c" x="30" y="194.0">3</text>
<text class="dsh-lifecycle-tk" x="62" y="194.0">Аргументы</text>
<text class="dsh-lifecycle-t" x="200" y="194.0">обязательные аргументы на месте?</text>
<text class="dsh-lifecycle-mu dsh-lifecycle-sm" x="600" y="194.0">иначе: выйти с ошибкой</text>
<g class="a dsh-lifecycle-e9 tr"><text class="dsh-lifecycle-rej dsh-lifecycle-tk dsh-lifecycle-c" x="578" y="194.0">✕</text></g>
<line class="dsh-lifecycle-lf" x1="2" y1="214" x2="950" y2="214"/>
<g class="a dsh-lifecycle-e10 tr"><rect class="dsh-lifecycle-bxa" x="2" y="216" width="946" height="46" rx="8"/></g>
<circle class="dsh-lifecycle-nd" cx="30" cy="239.0" r="15"/>
<g class="a dsh-lifecycle-e11"><circle class="dsh-lifecycle-nda" cx="30" cy="239.0" r="15"/></g>
<text class="dsh-lifecycle-mk dsh-lifecycle-c" x="30" y="244.0">4</text>
<text class="dsh-lifecycle-tk" x="62" y="244.0">Данные</text>
<text class="dsh-lifecycle-t" x="200" y="244.0">что резать: blob → reasm_data → payload</text>
<text class="dsh-lifecycle-mu dsh-lifecycle-sm" x="600" y="244.0">берётся первое, что есть</text>
<line class="dsh-lifecycle-lf" x1="2" y1="264" x2="950" y2="264"/>
<g class="a dsh-lifecycle-e12 tr"><rect class="dsh-lifecycle-bxa" x="2" y="266" width="946" height="46" rx="8"/></g>
<circle class="dsh-lifecycle-nd" cx="30" cy="289.0" r="15"/>
<g class="a dsh-lifecycle-e13"><circle class="dsh-lifecycle-nda" cx="30" cy="289.0" r="15"/></g>
