<g class="a dsh-lifecycle-e18 tr"><rect class="dsh-lifecycle-bxa" x="2" y="366" width="946" height="46" rx="8"/></g>
<circle class="dsh-lifecycle-nd" cx="30" cy="389.0" r="15"/>
<g class="a dsh-lifecycle-e19"><circle class="dsh-lifecycle-nda" cx="30" cy="389.0" r="15"/></g>
<text class="dsh-lifecycle-mk dsh-lifecycle-c" x="30" y="394.0">7</text>
