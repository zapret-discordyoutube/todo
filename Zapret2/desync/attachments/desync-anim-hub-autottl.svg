<text class="dsh-autottl-mu dsh-autottl-sm dsh-autottl-c" x="471.2" y="134">старт 128</text>
<rect class="dsh-autottl-bxa" x="794.1999999999999" y="82" width="108.8" height="28" rx="4"/>
<text class="dsh-autottl-mu dsh-autottl-sm dsh-autottl-c" x="903.0" y="134">старт 255</text>
<line class="dsh-autottl-lm" x1="36.0" y1="88" x2="36.0" y2="104"/>
<text class="dsh-autottl-mk dsh-autottl-c dsh-autottl-sm dsh-autottl-mu" x="36.0" y="74">0</text>
<line class="dsh-autottl-lm" x1="253.6" y1="88" x2="253.6" y2="104"/>
<text class="dsh-autottl-mk dsh-autottl-c dsh-autottl-sm dsh-autottl-mu" x="253.6" y="74">64</text>
<line class="dsh-autottl-lm" x1="471.2" y1="88" x2="471.2" y2="104"/>
<text class="dsh-autottl-mk dsh-autottl-c dsh-autottl-sm dsh-autottl-mu" x="471.2" y="74">128</text>
