<path class="dsh-autottl-ln-a a dsh-autottl-e2" pathLength="100" d="M232.79999999999998 150L253.6 150"/><g class="a dsh-autottl-e3"><polygon class="dsh-autottl-hd-a" points="253.6,150.0 243.6,155.0 243.6,145.0"/></g><text class="dsh-autottl-acc dsh-autottl-tk dsh-autottl-sm" x="259.6" y="174">угадали: сервер стартовал с 64</text>
<text class="dsh-autottl-cap" x="2" y="196">2. Считаем</text>
<g class="a dsh-autottl-e4"><text class="dsh-autottl-ml" x="2" y="226">хопов до сервера = 64 − 52 = 12</text></g>
<g class="a dsh-autottl-e5"><text class="dsh-autottl-ml" x="2" y="258">TTL фейка = 12 + (−1) = 11</text><text class="dsh-autottl-mu dsh-autottl-sm" x="420" y="258">← delta из ip_autottl=-1,3-20</text></g>
<g class="a dsh-autottl-e6"><text class="dsh-autottl-ml dsh-autottl-acc" x="2" y="290">рамки 3–20: 11 помещается → TTL = 11</text></g>
<line class="dsh-autottl-lf" x1="2" y1="316" x2="950" y2="316"/>
