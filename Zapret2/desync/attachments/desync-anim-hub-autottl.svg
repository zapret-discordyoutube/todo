<svg xmlns="http://www.w3.org/2000/svg" class="dsh-autottl" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="dsh-autottl-t dsh-autottl-d">
<title id="dsh-autottl-t">Как ip_autottl считает TTL фейка</title>
<desc id="dsh-autottl-d">Из TTL ответа сервера (52) угадывается стартовое значение 64, число хопов до сервера равно 64 − 52 = 12. К нему прибавляется delta (−1), получается 11, результат зажимается в диапазон min–max. Фейк с TTL 11 умирает на 11-м хопе — на один раньше сервера, но после DPI.</desc>
<style>.dsh-autottl{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-autottl{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-autottl .dsh-autottl-bg{fill:var(--bg)}.dsh-autottl text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-autottl .dsh-autottl-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-autottl .dsh-autottl-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-autottl .dsh-autottl-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-autottl .dsh-autottl-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-autottl .dsh-autottl-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-autottl .dsh-autottl-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-autottl .dsh-autottl-sm{font-size:14.5px}.dsh-autottl .dsh-autottl-mu{fill:var(--mute)}.dsh-autottl .dsh-autottl-fg{fill:var(--fg)}.dsh-autottl .dsh-autottl-acc{fill:var(--acc)}.dsh-autottl .dsh-autottl-rej{fill:var(--rej)}.dsh-autottl .dsh-autottl-c{text-anchor:middle}.dsh-autottl .dsh-autottl-r{text-anchor:end}.dsh-autottl .dsh-autottl-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-autottl .dsh-autottl-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-autottl .dsh-autottl-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-autottl .dsh-autottl-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-autottl .dsh-autottl-bxn{fill:none;stroke:none}.dsh-autottl .dsh-autottl-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-autottl .dsh-autottl-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-autottl .dsh-autottl-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-autottl .dsh-autottl-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-autottl .dsh-autottl-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-autottl .dsh-autottl-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-autottl .dsh-autottl-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-autottl .dsh-autottl-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-autottl .dsh-autottl-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-autottl .dsh-autottl-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-autottl .dsh-autottl-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-autottl .dsh-autottl-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-autottl .dsh-autottl-bxbg{fill:var(--bg);stroke:none}.dsh-autottl .dsh-autottl-hd-a{fill:var(--acc)}.dsh-autottl .dsh-autottl-hd-f{fill:var(--fg2)}.dsh-autottl .dsh-autottl-hd-r{fill:var(--rej)}.dsh-autottl .dsh-autottl-dot{fill:var(--acc)}.dsh-autottl .dsh-autottl-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-autottl .dsh-autottl-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-autottl .dsh-autottl-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-autottl .dsh-autottl-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-autottl .a{animation-duration:18s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-autottl .a{animation:none}.dsh-autottl .tr{display:none}}figure.dsh-autottl-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-autottl-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-autottl-k1{0.0%{opacity:0;transform:translate(0px,-40px)}5.556%{opacity:0;transform:translate(0px,-40px)}7.778%{opacity:1;transform:translate(0px,-40px)}12.222%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e1{animation-name:dsh-autottl-k1}@keyframes dsh-autottl-k2{0.0%{opacity:0;stroke-dashoffset:100}17.778%{opacity:0;stroke-dashoffset:100}17.833%{opacity:1;stroke-dashoffset:100}20.556%{opacity:1;stroke-dashoffset:0}96.944%{opacity:1;stroke-dashoffset:0}99.167%{opacity:0;stroke-dashoffset:100}100%{opacity:0;stroke-dashoffset:100}}.dsh-autottl .dsh-autottl-e2{animation-name:dsh-autottl-k2}@keyframes dsh-autottl-k3{0.0%{opacity:0;transform:translate(0px,0px)}20.0%{opacity:0;transform:translate(0px,0px)}21.111%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e3{animation-name:dsh-autottl-k3}@keyframes dsh-autottl-k4{0.0%{opacity:0;transform:translate(0px,0px)}24.444%{opacity:0;transform:translate(0px,0px)}26.389%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e4{animation-name:dsh-autottl-k4}@keyframes dsh-autottl-k5{0.0%{opacity:0;transform:translate(0px,0px)}33.333%{opacity:0;transform:translate(0px,0px)}35.278%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e5{animation-name:dsh-autottl-k5}@keyframes dsh-autottl-k6{0.0%{opacity:0;transform:translate(0px,0px)}42.222%{opacity:0;transform:translate(0px,0px)}44.167%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e6{animation-name:dsh-autottl-k6}@keyframes dsh-autottl-k7{0.0%{opacity:0;transform:translate(-770.0px,0px)}50.0%{opacity:0;transform:translate(-770.0px,0px)}51.667%{opacity:1;transform:translate(-770.0px,0px)}72.222%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e7{animation-name:dsh-autottl-k7}@keyframes dsh-autottl-k8{0.0%{opacity:0;transform:translate(0px,0px)}73.333%{opacity:0;transform:translate(0px,0px)}74.444%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e8{animation-name:dsh-autottl-k8}@keyframes dsh-autottl-k9{0.0%{opacity:0;transform:translate(0px,0px)}74.444%{opacity:0;transform:translate(0px,0px)}76.389%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e9{animation-name:dsh-autottl-k9}@keyframes dsh-autottl-k10{0.0%{opacity:0;transform:translate(0px,0px)}61.111%{opacity:0;transform:translate(0px,0px)}63.056%{opacity:1;transform:translate(0px,0px)}96.944%{opacity:1;transform:translate(0px,0px)}99.167%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-autottl .dsh-autottl-e10{animation-name:dsh-autottl-k10}.dsh-autottl .dsh-autottl-dsh{stroke-dasharray:5 5}</style>
