<svg xmlns="http://www.w3.org/2000/svg" class="dsa-syndata" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="dsa-syndata-t dsa-syndata-d">
<title id="dsa-syndata-t">syndata: фейковый ClientHello в SYN-пакете</title>
<desc id="dsa-syndata-d">Карта потока для syndata с blob=fake_default_tls: к SYN приклеен фейковый ClientHello с именем www.w3.org на тех же позициях потока. Сервер отвечает SYN-ACK, данные из SYN игнорирует, после рукопожатия принимает настоящий ClientHello.</desc>
<style>.dsa-syndata{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8)}@media (prefers-color-scheme:dark){.dsa-syndata{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618)}}.dsa-syndata .dsa-syndata-bg{fill:var(--bg)}.dsa-syndata text{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13.5px;fill:var(--fg2)}.dsa-syndata .dsa-syndata-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsa-syndata .dsa-syndata-tick{font-size:11px;fill:var(--mute)}.dsa-syndata .dsa-syndata-rule{stroke:var(--mute);stroke-width:1}.dsa-syndata .dsa-syndata-brace{fill:none;stroke:var(--acc);stroke-width:1.3}.dsa-syndata .dsa-syndata-cut{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 4;opacity:.55}.dsa-syndata .dsa-syndata-win{stroke:var(--fg2);stroke-width:1.4}.dsa-syndata .dsa-syndata-sep{stroke:var(--line);stroke-width:1}.dsa-syndata .dsa-syndata-no{fill:var(--mute)}.dsa-syndata .dsa-syndata-k{fill:var(--fg);font-weight:600}.dsa-syndata .dsa-syndata-kfk{fill:var(--mute);font-weight:600}.dsa-syndata .dsa-syndata-meta{fill:var(--mute)}.dsa-syndata .dsa-syndata-arrow{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--fg2)}.dsa-syndata .dsa-syndata-rl{fill:var(--tint);stroke:var(--acc);stroke-width:1}.dsa-syndata .dsa-syndata-fk{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:2 2}.dsa-syndata .dsa-syndata-dim{fill:none;stroke:var(--line);stroke-width:1}.dsa-syndata .dsa-syndata-mk{fill:none;stro