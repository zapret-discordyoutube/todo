<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t d">
<title id="t">syndata: фейковые данные в SYN-пакете</title>
<desc id="d">Анимация: syndata добавляет в первый пакет соединения SYN фейковый ClientHello с именем www.w3.org. Сервер отвечает SYN-ACK и отбрасывает данные из SYN, а ТСПУ может принять их за начало потока. Затем уходит настоящий ClientHello.</desc>
<style>.mono{font-family:ui-monospace,'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:Onest,Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','DejaVu Sans',sans-serif}.a{animation-duration:10.57s;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.a{animation:none!important}.pk{display:none}}@keyframes k1{0.0%{opacity:0}11.553%{opacity:0}12.688%{opacity:0.95}16.851%{opacity:0}57.95%{opacity:0}59.085%{opacity:0.95}63.248%{opacity:0}100%{opacity:0}}@keyframes k2{0.0%{opacity:0}12.121%{opacity:0}14.959%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k3{0.0%{opacity:0}58.518%{opacity:0}61.356%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k4{0.0%{opacity:0}61.829%{opacity:0}64.667%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k5{0.0%{opacity:0}63.721%{opacity:0}66.559%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k6{0.0%{opacity:0}65.613%{opacity:0}68.451%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k7{0.0%{opacity:0}65.947%{opacity:0}68.786%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k8{0.0%{opacity:0}18.565%{opacity:0}21.403%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k9{0.0%{opacity:0}18.565%{opacity:0}21.403%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k10{0.0%{opacity:0}72.097%{opacity:0}74.935%{opacity:1}93.377%{opacity:1}97.635%{opacity:0}100%{opacity:0}}@keyframes k11{0.0%{opacity:0;transform:translate(309.7px,292.0px)}5.676%{opacity:0;transform:translate(309.7px,292.0px)}7.569%{opacity:1;transform:translate(359.7px,292.0px)}18.565%{opacity:1;transform:translate(650.3px,292.0px)}21.876%{opacity:0;transform:translate(650.3px,322.0px)}100%{opacity:0;transform:translate(650.3px,322.0px)}}@keyframes k12{0.0%{opacity:0;transform:translate(741.4px,292.0px)}28.382%{opacity:0;transform:translate(741.4px,292.0px)}30.274%{opacity:1;transform:translate(691.4px,292.0px)}48.169%{opacity:1;transform:translate(218.6px,292.0px)}51.007%{opacity:0;transform:translate(206.6px,292.0px)}100%{opacity:0;transform:translate(206.6px,292.0px)}}@keyframes k13{0.0%{opacity:0;transform:translate(283.7px,292.0px)}51.088%{opacity:0;transform:translate(283.7px,292.0px)}52.98%{opacity:1;transform:translate(333.7px,292.0px)}65.947%{opacity:1;transform:translate(676.3px,292.0px)}68.786%{opacity:0;transform:translate(688.3px,292.0px)}100%{opacity:0;transform:translate(688.3px,292.0px)}}</style>
<rect x="1" y="1" width="958" height="670" rx="26" fill="#0b1020" stroke="#1f2a48" stroke-width="2"/>
<text x="36" y="58" class="mono" font-size="30" font-weight="700" fill="#4fd1ff">syndata</text>
<text x="184" y="57" class="sans" font-size="19" fill="#8d99bd">данные прямо в SYN</text>
<text x="36" y="90" class="mono" font-size="15" fill="#7d8bb0">--lua-desync=syndata:blob=fake_default_tls</text>
<line x1="150" y1="292" x2="810" y2="292" stroke="rgba(151,166,201,.4)" stroke-width="2" stroke-dasharray="6 10"/>
<rect x="30" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="90.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">ваш ПК</text>
<text x="90.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">Zapret 2</text>
<rect x="810" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="870.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">сервер</text>
<text x="870.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">youtube.com</text>
<text x="480" y="214" class="sans" font-size="21" font-weight="800" letter-spacing="2" fill="#ff3b5c" text-anchor="middle">ТСПУ</text>
<rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,59,92,.14)" stroke="#ff3b5c" stroke-width="2"/>
<g class="a pk" style="animation-name:k1"><rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,176,32,.55)" stroke="#ffb020" stroke-width="5"/></g>
<text x="36" y="384" class="sans" font-size="15" fill="#8d99bd">пунктир — фейковые данные, приклеенные к первому пакету соединения (SYN)</text>
<text x="36" y="144" class="sans" font-size="16" fill="#8d99bd">первый пакет соединения:</text>
<rect x="280.4" y="118" width="57.6" height="40" rx="6" fill="#8d99bd" fill-opacity=".13" stroke="#8d99bd" stroke-width="1.6"/>
<text x="309.2" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">SYN</tspan></text>
<rect x="338.0" y="118" width="342.2" height="40" rx="6" fill="#8d99bd" fill-opacity=".13" stroke="#8d99bd" stroke-width="1.6"/>
<text x="509.1" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">+ фейковый ClientHello из blob</tspan></text>
<rect x="30" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="50" y="452" class="sans" font-size="18" font-weight="700" fill="#ff3b5c">что видит ТСПУ</text>
<rect x="490" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="510" y="452" class="sans" font-size="18" font-weight="700" fill="#37e39a">что собирает сервер</text>
<g class="a fin" style="animation-name:k2"><g transform="translate(150.3,492)"><rect x="-100.3" y="-20.0" width="200.6" height="40" rx="11" fill="#161a2a" stroke="#7d8bb0" stroke-width="2.4" stroke-dasharray="7 6"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#7d8bb0">SYN + www.w3.org</tspan></text></g></g>
<g class="a fin" style="animation-name:k3"><g transform="translate(355.3,492)"><rect x="-94.7" y="-20.0" width="189.4" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">SNI youtube.com</tspan></text></g></g>
<g class="a fin" style="animation-name:k4"><text x="50" y="548" class="sans" font-size="18" font-weight="700" fill="#ffb020">мог принять данные из SYN</text></g>
<g class="a fin" style="animation-name:k5"><text x="50" y="575" class="sans" font-size="18" font-weight="400" fill="#e8edff">за начало потока — и уже не</text></g>
<g class="a fin" style="animation-name:k6"><text x="50" y="602" class="sans" font-size="18" font-weight="400" fill="#e8edff">искать имя в настоящем</text></g>
<g transform="translate(661.5,492)"><rect x="-151.5" y="-20" width="303.0" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k7"><g transform="translate(661.5,492)"><rect x="-151.5" y="-20.0" width="303.0" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">ClientHello · youtube.com</tspan></text></g></g>
<g class="a fin" style="animation-name:k8"><text x="510" y="552" class="sans" font-size="17" fill="#8d99bd">SYN принят, данные из него</text></g>
<g class="a fin" style="animation-name:k9"><text x="510" y="579" class="sans" font-size="17" fill="#8d99bd">большинство стеков отбрасывает</text></g>
<g class="a fin" style="animation-name:k10"><text x="510" y="628" class="sans" font-size="20" font-weight="700" fill="#37e39a">соединение установлено ✓</text></g>
<g class="a pk" style="animation-name:k11"><rect x="-151.7" y="-23.0" width="303.4" height="46" rx="11" fill="#161a2a" stroke="#7d8bb0" stroke-width="2.4" stroke-dasharray="7 6"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#e8edff">SYN + </tspan><tspan fill="#7d8bb0">фейк www.w3.org</tspan></text></g>
<g class="a pk" style="animation-name:k12"><rect x="-60.6" y="-23.0" width="121.1" height="46" rx="11" fill="#0e1630" stroke="#e8edff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#e8edff">SYN-ACK</tspan></text></g>
<g class="a pk" style="animation-name:k13"><rect x="-125.7" y="-23.0" width="251.3" height="46" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">① </tspan><tspan fill="#e8edff">SNI youtube.com</tspan></text></g>
</svg>
