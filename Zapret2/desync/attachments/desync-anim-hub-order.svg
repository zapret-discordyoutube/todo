<title id="dsh-order-t">Порядок инстансов — это порядок отправки</title>
<desc id="dsh-order-d">Если fake стоит перед multisplit, в сеть уходит сначала фейк, потом три куска настоящего запроса. Если наоборот, фейк уходит после кусков — настоящие данные к этому моменту уже ушли.</desc>
