<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t d">
<title id="t">multidisorder: части ClientHello в обратном порядке</title>
<desc id="d">Анимация: Zapret 2 режет ClientHello по позиции midsld на две части и отправляет сначала вторую, потом первую. ТСПУ получает поток задом наперёд, сервер расставляет части по номерам и собирает ClientHello целиком.</desc>
