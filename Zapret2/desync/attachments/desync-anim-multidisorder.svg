<svg xmlns="http://www.w3.org/2000/svg" class="dsa-multidisorder" viewBox="0 0 960 282" width="960" height="282" role="img" aria-labelledby="dsa-multidisorder-t dsa-multidisorder-d">
<title id="dsa-multidisorder-t">multidisorder: части в обратном порядке</title>
<desc id="dsa-multidisorder-d">Карта потока для multidisorder с pos=midsld: сначала уходит вторая часть ClientHello (seq=14), затем первая (seq=0). Сервер держит вторую часть в буфере и собирает поток по seq.</desc>
<style>.dsa-multidisorder{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8)}@media (prefers-color-scheme:dark){.dsa-multidisorder{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618)}}.dsa-multidisorder .dsa-multidisorder-bg{fill:var(--bg)}.dsa-multidisorder text{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13.5px;fill:var(--fg2)}.dsa-multidisorder .dsa-multidisorder-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsa-multidisorder .dsa-multidisorder-tick{font-size:11px;fill:var(--mute)}.dsa-multidisorder .dsa-multidisorder-rule{stroke:var(--mute);stroke-width:1}.dsa-multidisorder .dsa-multidisorder-brace{fill:none;stroke:var(--acc);stroke-width:1.3}.dsa-multidisorder .dsa-multidisorder-cut{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 4;opacity:.55}.dsa-multidisorder .dsa-multidisorder-win{stroke:var(--fg2);stroke-width:1.4}.dsa-multidisorder .dsa-multidisorder-sep{stroke:var(--line);stroke-width:1}.dsa-multidisorder .dsa-multidisorder-no{fill:var(--mute)}.dsa-multidisorder .dsa-multidisorder-k{fill:var(--fg);font-weight:600}.dsa-multidisorder .dsa-multidisorder-kfk{fill:var(--mute);font-weight:600}.dsa-multidisorder .dsa-multidisorder-meta{fill:var(--mute)}.dsa-multidisorder .dsa-multidisorder-arrow{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--fg2)}.dsa-multidisorder .dsa-multidisorder-rl{fill:var(--tint);stroke:var(--acc);stroke-width:1}.dsa-multidisorder .dsa-m