pacity:0;transform:translate(720.9px,292.0px)}100%{opacity:0;transform:translate(720.9px,292.0px)}}@keyframes k13{0.0%{opacity:0;transform:translate(277.2px,292.0px)}24.527%{opacity:0;transform:translate(277.2px,292.0px)}27.417%{opacity:1;transform:translate(327.2px,292.0px)}47.977%{opacity:1;transform:translate(682.8px,292.0px)}52.312%{opacity:0;transform:translate(694.8px,292.0px)}100%{opacity:0;transform:translate(694.8px,292.0px)}}</style>
<rect x="1" y="1" width="958" height="670" rx="26" fill="#0b1020" stroke="#1f2a48" stroke-width="2"/>
<text x="36" y="58" class="mono" font-size="30" font-weight="700" fill="#4fd1ff">multidisorder</text>
<text x="296" y="57" class="sans" font-size="19" fill="#8d99bd">режем и шлём с конца</text>
<text x="36" y="90" class="mono" font-size="15" fill="#7d8bb0">--payload=tls_client_hello --lua-desync=multidisorder:pos=midsld</text>
<line x1="150" y1="292" x2="810" y2="292" stroke="rgba(151,166,201,.4)" stroke-width="2" stroke-dasharray="6 10"/>
<rect x="30" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="90.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">ваш ПК</text>
<text x="90.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">Zapret 2</text>
<rect x="810" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="870.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">сервер</text>
<text x="870.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">youtube.com</text>
<text x="480" y="214" class="sans" font-size="21" font-weight="800" letter-spacing="2" fill="#ff3b5c" text-anchor="middle">ТСПУ</text>
<rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,59,92,.14)" stroke="#ff3b5c" stroke-width="2"/>
<g class="a pk" style="animation-name:k1"><rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,176,32,.55)" stroke="#ffb020" stroke-width="5"/></g>
<text x="36" y="384" class="sans" font-size="15" fill="#8d99bd">части настоящие, но уходят в обратном порядке: сначала ②, потом ①</text>
<text x="36" y="144" class="sans" font-size="16" fill="#8d99bd">что отправляет браузер:</text>
<rect x="270.8" y="118" width="215.7" height="40" rx="6" fill="#4fd1ff" fill-opacity=".13" stroke="#4fd1ff" stroke-width="1.6"/>
<text x="378.7" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">16 03 01 … SNI you</tspan></text>
<line x1="486.5" y1="110" x2="486.5" y2="166" stroke="#ff3b5c" stroke-width="2.4" stroke-dasharray="4 3"/>
<text x="486.5" y="180" class="mono" font-size="13" fill="#ff3b5c" text-anchor="middle">midsld</text>
<rect x="486.5" y="118" width="131.4" height="40" rx="6" fill="#9b7bff" fill-opacity=".13" stroke="#9b7bff" stroke-width="1.6"/>
<text x="552.2" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">tube.com …</tspan></text>
<rect x="30" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="50" y="452" class="sans" font-size="18" font-weight="700" fill="#ff3b5c">что видит ТСПУ</text>
<rect x="490" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="510" y="452" class="sans" font-size="18" font-weight="700" fill="#37e39a">что собирает сервер</text>
<g class="a fin" style="animation-name:k2"><g transform="translate(122.4,492)"><rect x="-72.4" y="-20.0" width="144.8" height="40" rx="11" fill="#0e1630" stroke="#9b7bff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#9b7bff">② tube.com…</tspan></text></g></g>
<g class="a fin" style="animation-name:k3"><g transform="translate(249.2,492)"><rect x="-44.5" y="-20.0" width="89.0" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">① …you</tspan></text></g></g>
<g class="a fin" style="animation-name:k4"><text x="50" y="548" class="sans" font-size="18" font-weight="700" fill="#ffb020">конец пришёл раньше начала,</text></g>
<g class="a fin" style="animation-name:k5"><text x="50" y="575" class="sans" font-size="18" font-weight="400" fill="#e8edff">а поток задом наперёд DPI</text></g>
<g class="a fin" style="animation-name:k6"><text x="50" y="602" class="sans" font-size="18" font-weight="400" fill="#e8edff">обычно не пересобирает</text></g>
<g transform="translate(600.1,492)"><rect x="-90.1" y="-20" width="180.2" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k7"><g transform="translate(600.1,492)"><rect x="-90.1" y="-20.0" width="180.2" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">16 03 01 … you</tspan></text></g></g>
<g transform="translate(766.0,492)"><rect x="-67.8" y="-20" width="135.6" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k8"><g transform="translate(766.0,492)"><rect x="-67.8" y="-20.0" width="135.6" height="40" rx="11" fill="#0e1630" stroke="#9b7bff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">tube.com …</tspan></text></g></g>
<g class="a fin" style="animation-name:k9"><text x="510" y="552" class="sans" font-size="17" fill="#8d99bd">② пришёл первым — ждёт в буфере</text></g>
<g class="a fin" style="animation-name:k10"><text x="510" y="579" class="sans" font-size="17" fill="#8d99bd">① встал перед ним по номеру seq</text></g>
<g class="a fin" style="animation-name:k11"><text x="510" y="628" class="sans" font-size="20" font-weight="700" fill="#37e39a">собрано: … youtube.com … ✓</text></g>
<g class="a pk" style="animation-name:k12"><rect x="-93.1" y="-23.0" width="186.2" height="46" rx="11" fill="#0e1630" stroke="#9b7bff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#9b7bff">② </tspan><tspan fill="#e8edff">tube.com …</tspan></text></g>
<g class="a pk" style="animation-name:k13"><rect x="-119.2" y="-23.0" width="238.3" height="46" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">① </tspan><tspan fill="#e8edff">16 03 01 … you</tspan></text></g>
</svg>
