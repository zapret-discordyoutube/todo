<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-tcpseg-host" viewBox="0 0 960 200" width="960" height="200" role="img" aria-labelledby="dsh-z2-tcpseg-host-t dsh-z2-tcpseg-host-d">
<title id="dsh-z2-tcpseg-host-t">tcpseg с pos=host,endhost: уходит только имя сайта</title>
<desc id="dsh-z2-tcpseg-host-d">Payload состоит из заголовков, имени example.com и остального. Диапазон между host и endhost уходит отдельным сегментом, seq равен смещению host. Оригинальный пакет не блокируется: у tcpseg вердикта нет.</desc>
<style>.dsh-z2-tcpseg-host{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-z2-tcpseg-host{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-bg{fill:var(--bg)}.dsh-z2-tcpseg-host text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-sm{font-size:14.5px}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-mu{fill:var(--mute)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-fg{fill:var(--fg)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-acc{fill:var(--acc)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-rej{fill:var(--rej)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-c{text-anchor:middle}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-r{text-anchor:end}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-bxn{fill:none;stroke:none}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-bxbg{fill:var(--bg);stroke:none}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-hd-a{fill:var(--acc)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-hd-f{fill:var(--fg2)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-hd-r{fill:var(--rej)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-dot{fill:var(--acc)}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-z2-tcpseg-host .a{animation-duration:8s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-z2-tcpseg-host .a{animation:none}.dsh-z2-tcpseg-host .tr{display:none}}figure.dsh-z2-tcpseg-host-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-z2-tcpseg-host-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-z2-tcpseg-host-k1{0.0%{opacity:0;transform:translate(0px,0px)}7.5%{opacity:0;transform:translate(0px,0px)}11.875%{opacity:1;transform:translate(0px,0px)}93.125%{opacity:1;transform:translate(0px,0px)}98.125%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-e1{animation-name:dsh-z2-tcpseg-host-k1}@keyframes dsh-z2-tcpseg-host-k2{0.0%{opacity:0;transform:translate(0px,-20px)}25.0%{opacity:0;transform:translate(0px,-20px)}27.5%{opacity:1;transform:translate(0px,-20px)}35.0%{opacity:1;transform:translate(0px,0px)}93.125%{opacity:1;transform:translate(0px,0px)}98.125%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-e2{animation-name:dsh-z2-tcpseg-host-k2}@keyframes dsh-z2-tcpseg-host-k3{0.0%{opacity:0;transform:translate(0px,0px)}50.0%{opacity:0;transform:translate(0px,0px)}54.375%{opacity:1;transform:translate(0px,0px)}93.125%{opacity:1;transform:translate(0px,0px)}98.125%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-e3{animation-name:dsh-z2-tcpseg-host-k3}.dsh-z2-tcpseg-host .dsh-z2-tcpseg-host-dsh{stroke-dasharray:5 5}</style>
