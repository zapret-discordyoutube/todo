<g class="a dsh-z2-tcpseg-host-e1"><line class="dsh-z2-tcpseg-host-la" x1="400" y1="30" x2="400" y2="78"/><line class="dsh-z2-tcpseg-host-la" x1="560" y1="30" x2="560" y2="78"/><text class="dsh-z2-tcpseg-host-acc dsh-z2-tcpseg-host-tk dsh-z2-tcpseg-host-c dsh-z2-tcpseg-host-sm" x="400" y="94">host</text><text class="dsh-z2-tcpseg-host-acc dsh-z2-tcpseg-host-tk dsh-z2-tcpseg-host-c dsh-z2-tcpseg-host-sm" x="560" y="94">endhost</text></g>
