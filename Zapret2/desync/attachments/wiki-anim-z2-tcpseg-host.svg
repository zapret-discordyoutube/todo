<text class="dsh-z2-tcpseg-host-cap" x="2" y="24">payload, 600 байт</text>
<rect class="dsh-z2-tcpseg-host-bx" x="150" y="36" width="246" height="34" rx="5"/><text class="dsh-z2-tcpseg-host-mu dsh-z2-tcpseg-host-c dsh-z2-tcpseg-host-sm" x="273.0" y="58">заголовки</text>
