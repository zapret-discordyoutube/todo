<svg xmlns="http://www.w3.org/2000/svg" class="dsh-reasm" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="dsh-reasm-t dsh-reasm-d">
<title id="dsh-reasm-t">reasm: большой ClientHello приходит несколькими пакетами</title>
<desc id="dsh-reasm-d">ClientHello не помещается в один TCP-сегмент и приходит тремя пакетами. nfqws2 придерживает их и собирает в reasm_data, затем перепроигрывает: на первой части функция режет и отправляет весь собранный буфер, а вторую и третью части выбрасывает — их содержимое уже ушло.</desc>
<style>.dsh-reasm{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-reasm{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-reasm .dsh-reasm-bg{fill:var(--bg)}.dsh-reasm text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;fill:var(--fg2)}.dsh-reasm .dsh-reasm-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-reasm .dsh-reasm-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-reasm .dsh-reasm-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-reasm .dsh-reasm-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}.dsh-reasm .dsh-reasm-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-reasm .dsh-reasm-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-reasm .dsh-reasm-sm{font-size:13.5px}.dsh-reasm .dsh-reasm-mu{fill:var(--mute)}.dsh-reasm .dsh-reasm-fg{fill:var(--fg)}.dsh-reasm .dsh-reasm-acc{fill:var(--acc)}.dsh-reasm .dsh-reasm-rej{fill:var(--rej)}.dsh-reasm .dsh-reasm-c{text-anchor:middle}.dsh-reasm .dsh-reasm-r{text-anchor:end}.dsh-reasm .dsh-reasm-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-reasm .dsh-reasm-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-reasm .dsh-reasm-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-reasm .dsh-reasm-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-reasm .dsh-reasm-bxn{fill:none;stroke:none}.dsh-reasm .dsh-reasm-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-reasm .dsh-reasm-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-reasm .dsh-reasm-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-reasm .dsh-reasm-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-reasm .dsh-reasm-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-reasm .dsh-reasm-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-reasm .dsh-reasm-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-reasm .dsh-reasm-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-reasm .dsh-reasm-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-reasm .dsh-reasm-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-reasm .dsh-reasm-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-reasm .dsh-reasm-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-reasm .dsh-reasm-bxbg{fill:var(--bg);stroke:none}.dsh-reasm .dsh-reasm-hd-a{fill:var(--acc)}.dsh-reasm .dsh-reasm-hd-f{fill:var(--fg2)}.dsh-reasm .dsh-reasm-hd-r{fill:var(--rej)}.dsh-reasm .dsh-reasm-dot{fill:var(--acc)}.dsh-reasm .dsh-reasm-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-reasm .dsh-reasm-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-reasm .dsh-reasm-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-reasm .dsh-reasm-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-reasm .a{animation-duration:15s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-reasm .a{animation:none}.dsh-reasm .tr{display:none}}figure.dsh-reasm-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-reasm-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-reasm-k1{0.0%{opacity:0;transform:translate(-100px,0px)}3.333%{opacity:0;transform:translate(-100px,0px)}4.0%{opacity:1;transform:translate(-100px,0px)}9.333%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-reasm .dsh-reasm-e1{animation-name:dsh-reasm-k1}@keyframes dsh-reasm-k2{0.0%{opacity:0;transform:translate(-100px,0px)}8.667%{opacity:0;transform:translate(-100px,0px)}9.333%{opacity:1;transform:translate(-100px,0px)}14.667%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-reasm .dsh-reasm-e2{animation-name:dsh-reasm-k2}@keyframes dsh-reasm-k3{0.0%{opacity:0;transform:translate(-100px,0px)}14.0%{opacity:0;transform:translate(-100px,0px)}14.667%{opacity:1;transform:translate(-100px,0px)}20.0%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-reasm .dsh-reasm-e3{animation-name:dsh-reasm-k3}@keyframes dsh-reasm-k4{0.0%{opacity:0;transform:translate(0px,0px)}21.333%{opacity:0;transform:translate(0px,0px)}23.667%{opacity:1;transform:translate(0px,0px)}96.333%{opacity:1;transform:translate(0px,0px)}99.0%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-reasm .dsh-reasm-e4{animation-name:dsh-reasm-k4}@keyframes dsh-reasm-k5{0.0%{opacity:0;transform:translate(0px,0px)}24.0%{opacity:0;transform:translate(0px,0px)}26.333%{opacity:1;transform:translate(0px,0px)}96.333%{opacity