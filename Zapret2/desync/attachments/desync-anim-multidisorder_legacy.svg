<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t d">
<title id="t">multidisorder_legacy: обратный порядок внутри каждого пакета</title>
<desc id="d">Анимация: ClientHello занимает два пакета A и B. multidisorder_legacy режет каждый пакет отдельно и отправляет части задом наперёд внутри пакета: A2, A1, затем B2, B1. Сервер собирает A1 A2 B1 B2.</desc>
