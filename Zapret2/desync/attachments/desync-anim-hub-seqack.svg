<svg xmlns="http://www.w3.org/2000/svg" class="dsh-seqack" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="dsh-seqack-t dsh-seqack-d">
<title id="dsh-seqack-t">badseq и badack меняют разные поля TCP</title>
<desc id="dsh-seqack-d">Сверху: tcp_seq сдвигает номер последовательности — настоящий пакет попадает в окно приёма сервера и принимается, фейк со сдвигом на −10000 оказывается далеко за окном и отбрасывается. Снизу: tcp_ack сдвигает номер подтверждения на −66000 — подтверждение не сходится с тем, что отправлял сервер.</desc>
<style>.dsh-seqack{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-seqack{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-seqack .dsh-seqack-bg{fill:var(--bg)}.dsh-seqack text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;fill:var(--fg2)}.dsh-seqack .dsh-seqack-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-seqack .dsh-seqack-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-seqack .dsh-seqack-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-seqack .dsh-seqack-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}.dsh-seqack .dsh-seqack-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-seqack .dsh-seqack-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-seqack .dsh-seqack-sm{font-size:13.5px}.dsh-seqack .dsh-seqack-mu{fill:var(--mute)}.dsh-seqack .dsh-seqack-fg{fill:var(--fg)}.dsh-seqack .dsh-seqack-acc{fill:var(--acc)}.dsh-seqack .dsh-seqack-rej{fill:var(--rej)}.dsh-seqack .dsh-seqack-c{text-anchor:middle}.dsh-seqack .dsh-seqack-r{text-anchor:end}.dsh-seqack .dsh-seqack-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-seqack .dsh-seqack-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-seqack .dsh-seqack-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-seqack .dsh-seqack-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-seqack .dsh-seqack-bxn{fill:none;stroke:none}.dsh-seqack .dsh-seqack-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-seqack .dsh-seqack-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-seqack .dsh-seqack-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-seqack .dsh-seqack-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-seqack .dsh-seqack-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-seqack .dsh-seqack-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-seqack .dsh-seqack-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-seqack .dsh-seqack-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-seqack .dsh-seqack-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-seqack .dsh-seqack-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-seqack .dsh-seqack-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-seqack .dsh-seqack-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-seqack .dsh-seqack-bxbg{fill:var(--bg);stroke:none}.dsh-seqack .dsh-seqack-hd-a{fill:var(--acc)}.dsh-seqack .dsh-seqack-hd-f{fill:var(--fg2)}.dsh-seqack .dsh-seqack-hd-r{fill:var(--rej)}.dsh-seqack .dsh-seqack-dot{fill:var(--acc)}.dsh-seqack .dsh-seqack-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-seqack .dsh-seqack-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-seqack .dsh-seqack-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-seqack .dsh-seqack-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-seqack .a{animation-duration:14s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-seqack .a{animation:none}.dsh-seqack .tr{display:none}}figure.dsh-seqack-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-seqack-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-seqack-k1{0.0%{opacity:0;transform:translate(0px,-30px)}7.143%{opacity:0;transform:translate(0px,-30px)}10.0%{opacity:1;transform:translate(0px,-30px)}15.714%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e1{animation-name:dsh-seqack-k1}@keyframes dsh-seqack-k2{0.0%{opacity:0;transform:translate(0px,0px)}17.143%{opacity:0;transform:translate(0px,0px)}19.643%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e2{animation-name:dsh-seqack-k2}@keyframes dsh-seqack-k3{0.0%{opacity:0;transform:translate(0px,-30px)}25.714%{opacity:0;transform:translate(0px,-30px)}28.571%{opacity:1;transform:translate(0px,-30px)}34.286%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e3{animation-name:dsh-seqack-k3}@keyframes dsh-seqack-k4{0.0%{opacity:0;transform:translate(0px,0px)}35.714%{opacity:0;transform:translate(0px,0px)}38.214%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e4{animation-name:dsh-seqack-k4}@keyframes dsh-seqack-k5{0.0%{opacity:0;transform:translate(0px,0px)}45.714%{opacity:0;transform:translate(0px,0px)}48.214%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e5{animation-name:dsh-seqack-k5}@keyframes dsh-seqack-k6{0.0%{opacity:0;transform:translate(0px,0px)}47.143%{opacity:0;transform:translate(0px,0px)}49.643%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e6{animation-name:dsh-seqack-k6}@keyframes dsh-seqack-k7{0.0%{opacity:0;transform:translate(570px,0px)}60.0%{opacity:0;transform:translate(570px,0px)}61.429%{opacity:1;transform:translate(570px,0px)}71.429%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e7{animation-name:dsh-seqack-k7}@keyframes dsh-seqack-k8{0.0%{opacity:0;transform:translate(0px,0px)}72.857%{opacity:0;transform:translate(0px,0px)}75.357%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e8{animation-name:dsh-seqack-k8}@keyframes dsh-seqack-k9{0.0%{opacity:0;transform:translate(0px,0px)}82.857%{opacity:0;transform:translate(0px,0px)}85.357%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-seqack .dsh-seqack-e9{animation-name:dsh-seqack-k9}.dsh-seqack .dsh-seqack-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-seqack-bg" x="0" y="0" width="960" height="452"/>
<text class="dsh-seqack-cap" x="2" y="26">badseq: tcp_seq=-10000 сдвигает номер последовательности (seq)</text>
<line class="dsh-seqack-lm" x1="40" y1="132" x2="920" y2="132"/>
<text class="dsh-seqack-mu dsh-seqack-sm dsh-seqack-r" x="920" y="160">номера байтов потока →</text>
<rect class="dsh-seqack-bxa" x="430" y="106" width="290" height="52" rx="6"/>
<text class="dsh-seqack-acc dsh-seqack-tk dsh-seqack-c dsh-seqack-sm" x="575" y="214">окно приёма сервера: сюда пускают</text>
<g class="a dsh-seqack-e1"><rect class="dsh-seqack-bxbg" x="375.0" y="61.0" width="190" height="30" rx="6"/><rect class="dsh-seqack-bxa" x="375.0" y="61.0" width="190" height="30" rx="6"/><text class="dsh-seqack-mk dsh-seqack-sm dsh-seqack-c" x="470" y="81">настоящий: seq=1000</text><line class="dsh-seqack-la" x1="470" y1="92" x2="470" y2="126"/></g>
<g class="a dsh-seqack-e2"><text class="dsh-seqack-acc dsh-seqack-tk dsh-seqack-c dsh-seqack-sm" x="470" y="182">принят</text></g>
<g class="a dsh-seqack-e3"><rect class="dsh-seqack-bxbg" x="75.0" y="61.0" width="150" height="30" rx="6"/><rect class="dsh-seqack-bxd" x="75.0" y="61.0" width="150" height="30" rx="6"/><text class="dsh-seqack-mk dsh-seqack-sm dsh-seqack-c" x="150" y="81">фейк: seq − 10000</text><line class="dsh-seqack-lr" x1="150" y1="92" x2="150" y2="126"/></g>
<g class="a dsh-seqack-e4"><text class="dsh-seqack-rej dsh-seqack-tk dsh-seqack-c dsh-seqack-sm" x="150" y="162">далеко за окном</text><text class="dsh-seqack-rej dsh-seqack-tk dsh-seqack-c dsh-seqack-sm" x="150" y="182">отброшен</text></g>
<line class="dsh-seqack-lf" x1="2" y1="236" x2="950" y2="236"/>
<text class="dsh-seqack-cap" x="2" y="266">badack: tcp_ack=-66000 сдвигает номер подтверждения (ack)</text>
<rect class="dsh-seqack-bx" x="300" y="312" width="400" height="36" rx="6"/>
<text class="dsh-seqack-mu dsh-seqack-c" x="500" y="336">что сервер отправил клиенту</text>
<g class="a dsh-seqack-e5"><line class="dsh-seqack-la" x1="700" y1="306" x2="700" y2="354"/><text class="dsh-seqack-acc dsh-seqack-tk dsh-seqack-c dsh-seqack-sm" x="700" y="296">ack: «получил всё до сюда»</text></g>
<g class="a dsh-seqack-e6"><text class="dsh-seqack-acc dsh-seqack-sm dsh-seqack-c" x="700" y="376">нормальный ack</text></g>
<g class="a dsh-seqack-e7"><line class="dsh-seqack-lr" x1="130" y1="306" x2="130" y2="354"/><text class="dsh-seqack-rej dsh-seqack-tk dsh-seqack-c dsh-seqack-sm" x="130" y="296">ack − 66000</text></g>
<g class="a dsh-seqack-e8"><text class="dsh-seqack-rej dsh-seqack-sm dsh-seqack-c" x="130" y="376">подтверждает то,</text><text class="dsh-seqack-rej dsh-seqack-sm dsh-seqack-c" x="130" y="393">чего сервер не слал</text></g>
<g class="a dsh-seqack-e9"><text class="dsh-seqack-t" x="2" y="438">Это разные поля: badseq — seq, badack — ack. Для ack на Linux нужен ещё tcp_ts_up — схема в разделе ниже.</text></g>
</svg>
