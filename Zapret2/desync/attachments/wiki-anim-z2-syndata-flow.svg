<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-syndata-flow" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="dsh-z2-syndata-flow-t dsh-z2-syndata-flow-d">
<title id="dsh-z2-syndata-flow-t">syndata: логика обработки пакета</title>
<desc id="dsh-z2-syndata-flow-d">Не TCP — instance cutoff, кроме ICMP. TCP с флагом SYN, но не SYN+ACK — копия диссекта, добавление payload, fooling, tls_mod, rawsend и VERDICT_DROP. Любой другой TCP-пакет — instance cutoff: миссия завершена.</desc>
<style>.dsh-z2-syndata-flow{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-z2-syndata-flow{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-bg{fill:var(--bg)}.dsh-z2-syndata-flow text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-z2-syndata-flow .dsh-z2-syndata-flow-sm{font-size:14.5px}.dsh-z2-syndata-flow 