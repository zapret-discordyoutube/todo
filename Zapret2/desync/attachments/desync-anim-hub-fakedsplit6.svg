<svg xmlns="http://www.w3.org/2000/svg" class="dsh-fakedsplit6" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="dsh-fakedsplit6-t dsh-fakedsplit6-d">
<title id="dsh-fakedsplit6-t">fakedsplit: каждая настоящая часть зажата между фейками</title>
<desc id="dsh-fakedsplit6-d">fakedsplit отправляет до шести пакетов: фейк первой части, настоящая первая часть, повтор фейка, фейк второй части, настоящая вторая часть, повтор фейка. У трёх пакетов каждой тройки один и тот же seq, DPI не может понять, какой настоящий; сервер отбрасывает фейки и принимает настоящие части.</desc>
