<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-fakeddisorder6" viewBox="0 0 960 478" width="960" height="478" role="img" aria-labelledby="dsh-z2-fakeddisorder6-t dsh-z2-fakeddisorder6-d">
<title id="dsh-z2-fakeddisorder6-t">fakeddisorder: сначала вторая часть в тройке фейков, потом первая</title>
<desc id="dsh-z2-fakeddisorder6-d">100 байт режутся по midsld на часть 1 (39 байт, seq 0) и часть 2 (61 байт, seq 39). Уходят шесть пакетов: фейк, настоящая часть 2, фейк, затем фейк, настоящая часть 1, фейк. С seqovl=10 перед настоящей частью 2 дописывается паттерн и seq становится 29. Флаги nofake2 и nofake4 убирают два фейка: остаётся четыре пакета.</desc>
