<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-oob-bytes" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="dsh-z2-oob-bytes-t dsh-z2-oob-bytes-d">
<title id="dsh-z2-oob-bytes-t">OOB-байт: сервер его удаляет, DPI читает как данные</title>
<desc id="dsh-z2-oob-bytes-d">В payload GET /path вставляется срочный OOB-байт 0x00 перед первым символом; в заголовке th_urp=0 и флаг URG. TCP-стек сервера вынимает OOB-байт и видит исходный запрос. DPI его не удаляет и видит сдвинутую строку: сигнатура GET сломана.</desc>
