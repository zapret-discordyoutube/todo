<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t d">
<title id="t">fake: поддельный ClientHello перед настоящим</title>
<desc id="d">Анимация: перед настоящим ClientHello с именем youtube.com Zapret 2 отправляет фейк с именем www.w3.org и испорченной подписью tcp_md5. ТСПУ читает фейк первым, сервер его отбрасывает и принимает только настоящий пакет.</desc>
