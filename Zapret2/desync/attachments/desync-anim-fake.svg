<title id="dsa-fake-t">fake: фейковый ClientHello перед оригиналом</title>
<desc id="dsa-fake-d">Карта потока для fake с blob=fake_default_tls и tcp_md5: сначала уходит фейковый ClientHello с именем www.w3.org на тех же позициях потока, затем оригинал с youtube.com. Сервер отбрасывает фейк по неверной подписи TCP MD5 и принимает оригинал.</desc>
