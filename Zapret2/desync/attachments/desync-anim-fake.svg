nsform:translate(650.3px,322.0px)}100%{opacity:0;transform:translate(650.3px,322.0px)}}@keyframes k13{0.0%{opacity:0;transform:translate(283.7px,292.0px)}25.28%{opacity:0;transform:translate(283.7px,292.0px)}28.17%{opacity:1;transform:translate(333.7px,292.0px)}47.977%{opacity:1;transform:translate(676.3px,292.0px)}52.312%{opacity:0;transform:translate(688.3px,292.0px)}100%{opacity:0;transform:translate(688.3px,292.0px)}}</style>
<rect x="1" y="1" width="958" height="670" rx="26" fill="#0b1020" stroke="#1f2a48" stroke-width="2"/>
<text x="36" y="58" class="mono" font-size="30" font-weight="700" fill="#4fd1ff">fake</text>
<text x="128" y="57" class="sans" font-size="19" fill="#8d99bd">сначала подсунуть подделку</text>
<text x="36" y="90" class="mono" font-size="15" fill="#7d8bb0">--payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:tcp_md5</text>
<line x1="150" y1="292" x2="810" y2="292" stroke="rgba(151,166,201,.4)" stroke-width="2" stroke-dasharray="6 10"/>
<rect x="30" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="90.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">ваш ПК</text>
<text x="90.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">Zapret 2</text>
<rect x="810" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="870.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">сервер</text>
<text x="870.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">youtube.com</text>
<text x="480" y="214" class="sans" font-size="21" font-weight="800" letter-spacing="2" fill="#ff3b5c" text-anchor="middle">ТСПУ</text>
<rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,59,92,.14)" stroke="#ff3b5c" stroke-width="2"/>
<g class="a pk" style="animation-name:k1"><rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,176,32,.55)" stroke="#ffb020" stroke-width="5"/></g>
<g class="a pk" style="animation-name:k2"><rect x="810" y="248" width="120" height="88" rx="16" fill="rgba(255,59,92,.18)" stroke="#ff3b5c" stroke-width="4"/><text x="870.0" y="236" class="sans" font-size="18" font-weight="700" fill="#ff3b5c" text-anchor="middle">✕ фейк</text></g>
<text x="36" y="384" class="sans" font-size="15" fill="#8d99bd">сплошная рамка — настоящие данные · пунктир — фейк, который сервер отбросит</text>
<text x="36" y="144" class="sans" font-size="16" fill="#8d99bd">что отправляет браузер:</text>
<rect x="270.8" y="118" width="331.7" height="40" rx="6" fill="#4fd1ff" fill-opacity=".13" stroke="#4fd1ff" stroke-width="1.6"/>
<text x="436.6" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">ClientHello · SNI youtube.com</tspan></text>
<rect x="30" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="50" y="452" class="sans" font-size="18" font-weight="700" fill="#ff3b5c">что видит ТСПУ</text>
<rect x="490" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="510" y="452" class="sans" font-size="18" font-weight="700" fill="#37e39a">что собирает сервер</text>
<g class="a fin" style="animation-name:k3"><g transform="translate(139.1,492)"><rect x="-89.1" y="-20.0" width="178.2" height="40" rx="11" fill="#161a2a" stroke="#7d8bb0" stroke-width="2.4" stroke-dasharray="7 6"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#7d8bb0">SNI www.w3.org</tspan></text></g></g>
<g class="a fin" style="animation-name:k4"><g transform="translate(332.9,492)"><rect x="-94.7" y="-20.0" width="189.4" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">SNI youtube.com</tspan></text></g></g>
<g class="a fin" style="animation-name:k5"><text x="50" y="548" class="sans" font-size="18" font-weight="700" fill="#ffb020">первым прочитал фейк с www.w3.org</text></g>
<g class="a fin" style="animation-name:k6"><text x="50" y="575" class="sans" font-size="18" font-weight="400" fill="#e8edff">и мог решить, что поток разрешён —</text></g>
<g class="a fin" style="animation-name:k7"><text x="50" y="602" class="sans" font-size="18" font-weight="400" fill="#e8edff">настоящий пакет идёт следом</text></g>
<g transform="translate(661.5,492)"><rect x="-151.5" y="-20" width="303.0" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k8"><g transform="translate(661.5,492)"><rect x="-151.5" y="-20.0" width="303.0" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">ClientHello · youtube.com</tspan></text></g></g>
<g class="a fin" style="animation-name:k9"><text x="510" y="552" class="sans" font-size="17" fill="#ff3b5c">фейк: неверная подпись tcp_md5</text></g>
<g class="a fin" style="animation-name:k10"><text x="510" y="579" class="sans" font-size="17" fill="#ff3b5c">→ отброшен, настоящий принят</text></g>
<g class="a fin" style="animation-name:k11"><text x="510" y="628" class="sans" font-size="20" font-weight="700" fill="#37e39a">собрано: только настоящий ✓</text></g>
<g class="a pk" style="animation-name:k12"><rect x="-151.7" y="-23.0" width="303.4" height="46" rx="11" fill="#161a2a" stroke="#7d8bb0" stroke-width="2.4" stroke-dasharray="7 6"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#7d8bb0">фейк · SNI www.w3.org</tspan></text></g>
<g class="a pk" style="animation-name:k13"><rect x="-125.7" y="-23.0" width="251.3" height="46" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">① </tspan><tspan fill="#e8edff">SNI youtube.com</tspan></text></g>
</svg>
