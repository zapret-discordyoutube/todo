<svg xmlns="http://www.w3.org/2000/svg" class="dsh-contract" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="dsh-contract-t dsh-contract-d">
<title id="dsh-contract-t">Связь ядра на C и Lua-функции</title>
<desc id="dsh-contract-d">Ядро вызывает Lua-функцию, передавая таблицу desync с данными о пакете и потоке. Функция читает данные, через ctx просит ядро отправить сырые пакеты (они уходят в сеть сразу) и в конце возвращает вердикт для оригинала. Ядро сводит вердикты всех инстансов и решает судьбу оригинала.</desc>
<style>.dsh-contract{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-contract{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-contract .dsh-contract-bg{fill:var(--bg)}.dsh-contract text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;fill:var(--fg2)}.dsh-contract .dsh-contract-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-contract .dsh-contract-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-contract .dsh-contract-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-contract .dsh-contract-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}.dsh-contract .dsh-contract-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-contract .dsh-contract-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-contract .dsh-contract-sm{font-size:13.5px}.dsh-contract .dsh-contract-mu{fill:var(--mute)}.dsh-contract .dsh-contract-fg{fill:var(--fg)}.dsh-contract .dsh-contract-acc{fill:var(--acc)}.dsh-contract .dsh-contract-rej{fill:var(--rej)}.dsh-contract .dsh-contract-c{text-anchor:middle}.dsh-contract .dsh-contract-r{text-anchor:end}.dsh-contract .dsh-contract-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-contract .dsh-contract-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-contract .dsh-contract-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-contract .dsh-contract-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-contract .dsh-contract-bxn{fill:none;stroke:none}.dsh-contract .dsh-contract-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-contract .dsh-contract-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-contract .dsh-contract-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-contract .dsh-contract-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-contract .dsh-contract-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-contract .dsh-contract-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-contract .dsh-contract-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-contract .dsh-contract-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-contract .dsh-contract-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-contract .dsh-contract-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-contract .dsh-contract-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-contract .dsh-contract-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-contract .dsh-contract-bxbg{fill:var(--bg);stroke:none}.dsh-contract .dsh-contract-hd-a{fill:var(--acc)}.dsh-contract .dsh-contract-hd-f{fill:var(--fg2)}.dsh-contract .dsh-contract-hd-r{fill:var(--rej)}.dsh-contract .dsh-contract-dot{fill:var(--acc)}.dsh-contract .dsh-contract-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-contract .dsh-contract-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-contract .dsh-contract-ndr{fill