<title id="t">hostfakesplit: имя сайта в окружении фейковых имён</title>
<desc id="d">Анимация: Zapret 2 режет ClientHello по границам имени youtube.com и отправляет перед и после него фейковое имя u9a7bk2.org той же длины. ТСПУ видит несколько имён на одном месте потока, сервер отбрасывает фейки по неверной подписи tcp_md5.</desc>
