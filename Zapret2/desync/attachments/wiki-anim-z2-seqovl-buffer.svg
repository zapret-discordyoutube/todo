<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-seqovl-buffer" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="dsh-z2-seqovl-buffer-t dsh-z2-seqovl-buffer-d">
<title id="dsh-z2-seqovl-buffer-t">seqovl в disorder: ЧАСТЬ_1 перезаписывает паттерн в буфере</title>
<desc id="dsh-z2-seqovl-buffer-d">Сначала приходит ЧАСТЬ_2 с приклеенным слева паттерном на 49 байт, seq=50, длина 249: данные приложению не выдаются, нет непрерывности от нуля. Затем ЧАСТЬ_1, seq=0, длина 100. Linux и BSD позднее перезаписывает раннее: паттерн уничтожен, 0–299 отдаются корректно. Windows сохраняет раннее: байты 50–98 остаются от паттерна, приложение получает повреждённые данные.</desc>
<style>.dsh-z2-seqovl-buffer{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-z2-seqovl-buffer{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-bg{fill:var(--bg)}.dsh-z2-seqovl-buffer text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-sm{font-size:14.5px}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-mu{fill:var(--mute)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-fg{fill:var(--fg)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-acc{fill:var(--acc)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-rej{fill:var(--rej)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-c{text-anchor:middle}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-r{text-anchor:end}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-bxn{fill:none;stroke:none}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-bxbg{fill:var(--bg);stroke:none}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-hd-a{fill:var(--acc)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-hd-f{fill:var(--fg2)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-hd-r{fill:var(--rej)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-dot{fill:var(--acc)}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-z2-seqovl-buffer .a{animation-duration:20s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-z2-seqovl-buffer .a{animation:none}.dsh-z2-seqovl-buffer .tr{display:none}}figure.dsh-z2-seqovl-buffer-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-z2-seqovl-buffer-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-z2-seqovl-buffer-k1{0.0%{opacity:0;transform:translate(0px,0px)}2.0%{opacity:0;transform:translate(0px,0px)}3.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-e1{animation-name:dsh-z2-seqovl-buffer-k1}@keyframes dsh-z2-seqovl-buffer-k2{0.0%{opacity:0;transform:translate(0px,20px)}5.0%{opacity:0;transform:translate(0px,20px)}6.5%{opacity:1;transform:translate(0px,20px)}10.0%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-e2{animation-name:dsh-z2-seqovl-buffer-k2}@keyframes dsh-z2-seqovl-buffer-k3{0.0%{opacity:0;transform:translate(0px,0px)}13.0%{opacity:0;transform:translate(0px,0px)}14.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-e3{animation-name:dsh-z2-seqovl-buffer-k3}@keyframes dsh-z2-seqovl-buffer-k4{0.0%{opacity:0;transform:translate(0px,0px)}23.0%{opacity:0;transform:translate(0px,0px)}24.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-e4{animation-name:dsh-z2-seqovl-buffer-k4}@keyframes dsh-z2-seqovl-buffer-k5{0.0%{opacity:0;transform:translate(0px,20px)}26.0%{opacity:0;transform:translate(0px,20px)}27.5%{opacity:1;transform:translate(0px,20px)}31.0%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-e5{animation-name:dsh-z2-seqovl-buffer-k5}@keyframes dsh-z2-seqovl-buffer-k6{0.0%{opacity:0;transform:translate(0px,0px)}35.0%{opacity:0;transform:translate(0px,0px)}36.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-seqovl-buffer .dsh-z2-seqovl-buffer-e6{animation-name:dsh-z2-seqovl-buffer-k6}@keyframes dsh-z2-seqovl-buffer-k7{0.0%{opacity:0;transform:translate(0px,0px)}52.0%{opacity:0;transform:translate(0px,0px)}53.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-seqov