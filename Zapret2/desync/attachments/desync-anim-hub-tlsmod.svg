<svg xmlns="http://www.w3.org/2000/svg" class="dsh-tlsmod" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="dsh-tlsmod-t dsh-tlsmod-d">
<title id="dsh-tlsmod-t">tls_mod: что меняется в фейковом ClientHello</title>
<desc id="dsh-tlsmod-d">Опции tls_mod правят поля фейкового ClientHello перед отправкой: rnd делает случайными Random и Session ID, rndsni и sni= заменяют имя сайта, dupsid копирует Session ID из настоящего запроса, padencap раздувает padding extension под настоящий запрос.</desc>
<style>.dsh-tlsmod{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-tlsmod{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-tlsmod .dsh-tlsmod-bg{fill:var(--bg)}.dsh-tlsmod text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;fill:var(--fg2)}.dsh-tlsmod .dsh-tlsmod-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-tlsmod .dsh-tlsmod-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-tlsmod .dsh-tlsmod-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-tlsmod .dsh-tlsmod-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}.dsh-tlsmod .dsh-tlsmod-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-tlsmod .dsh-tlsmod-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-tlsmod .dsh-tlsmod-sm{font-size:13.5px}.dsh-tlsmod .dsh-tlsmod-mu{fill:var(--mute)}.dsh-tlsmod .dsh-tlsmod-fg{fill:var(--fg)}.dsh-tlsmod .dsh-tlsmod-acc{fill:var(--acc)}.dsh-tlsmod .dsh-tlsmod-rej{fill:var(--rej)}.dsh-tlsmod .dsh-tlsmod-c{text-anchor:middle}.dsh-tlsmod .dsh-tlsmod-r{text-anchor:end}.dsh-tlsmod .dsh-tlsmod-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-tlsmod .dsh-tlsmod-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-tlsmod .dsh-tlsmod-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-tlsmod .dsh-tlsmod-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-tlsmod .dsh-tlsmod-bxn{fill:none;stroke:none}.dsh-tlsmod .dsh-tlsmod-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-tlsmod .dsh-tlsmod-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-tlsmod .dsh-tlsmod-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-tlsmod .dsh-tlsmod-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-tlsmod .dsh-tlsmod-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-tlsmod .dsh-tlsmod-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-tlsmod .dsh-tlsmod-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-tlsmod .dsh-tlsmod-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-tlsmod .dsh-tlsmod-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-tlsmod .dsh-tlsmod-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-tlsmod .dsh-tlsmod-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-tlsmod .dsh-tlsmod-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-tlsmod .dsh-tlsmod-bxbg{fill:var(--bg);stroke:none}.dsh-tlsmod .dsh-tlsmod-hd-a{fill:var(--acc)}.dsh-tlsmod .dsh-tlsmod-hd-f{fill:var(--fg2)}.dsh-tlsmod .dsh-tlsmod-hd-r{fill:var(--rej)}.dsh-tlsmod .dsh-tlsmod-dot{fill:var(--acc)}.dsh-tlsmod .dsh-tlsmod-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-tlsmod .dsh-tlsmod-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-tlsmod .dsh-tlsmod-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-tlsmod .dsh-tlsmod-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-tlsmod .a{animation-duration:20s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-tlsmod .a{animation:none}.dsh-tlsmod .tr{display:none}}figure.dsh-tlsmod-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-tlsmod-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-tlsmod-k1{0.0%{opacity:0;transform:translate(0px,0px)}2.0%{opacity:0;transform:translate(0px,0px)}3.75%{opacity:1;transform:translate(0px,0px)}20.0%{opacity:1;transform:translate(0px,0px)}21.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e1{animation-name:dsh-tlsmod-k1}@keyframes dsh-tlsmod-k2{0.0%{opacity:0;transform:translate(0px,0px)}3.5%{opacity:0;transform:translate(0px,0px)}5.0%{opacity:1;transform:translate(0px,0px)}20.0%{opacity:1;transform:translate(0px,0px)}21.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e2{animation-name:dsh-tlsmod-k2}@keyframes dsh-tlsmod-k3{0.0%{opacity:0;transform:translate(0px,0px)}3.5%{opacity:0;transform:translate(0px,0px)}5.0%{opacity:1;transform:translate(0px,0px)}20.0%{opacity:1;transform:translate(0px,0px)}21.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e3{animation-name:dsh-tlsmod-k3}@keyframes dsh-tlsmod-k4{0.0%{opacity:0;transform:translate(0px,0px)}4.5%{opacity:0;transform:translate(0px,0px)}6.25%{opacity:1;transform:translate(0px,0px)}20.0%{opacity:1;transform:translate(0px,0px)}21.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e4{animation-name:dsh-tlsmod-k4}@keyframes dsh-tlsmod-k5{0.0%{opacity:0;transform:translate(0px,0px)}21.0%{opacity:0;transform:translate(0px,0px)}22.75%{opacity:1;transform:translate(0px,0px)}39.0%{opacity:1;transform:translate(0px,0px)}40.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e5{animation-name:dsh-tlsmod-k5}@keyframes dsh-tlsmod-k6{0.0%{opacity:0;transform:translate(0px,0px)}22.5%{opacity:0;transform:translate(0px,0px)}24.0%{opacity:1;transform:translate(0px,0px)}39.0%{opacity:1;transform:translate(0px,0px)}40.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e6{animation-name:dsh-tlsmod-k6}@keyframes dsh-tlsmod-k7{0.0%{opacity:0;transform:translate(0px,0px)}23.5%{opacity:0;transform:translate(0px,0px)}25.25%{opacity:1;transform:translate(0px,0px)}39.0%{opacity:1;transform:translate(0px,0px)}40.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e7{animation-name:dsh-tlsmod-k7}@keyframes dsh-tlsmod-k8{0.0%{opacity:0;transform:translate(0px,0px)}40.0%{opacity:0;transform:translate(0px,0px)}41.75%{opacity:1;transform:translate(0px,0px)}58.0%{opacity:1;transform:translate(0px,0px)}59.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e8{animation-name:dsh-tlsmod-k8}@keyframes dsh-tlsmod-k9{0.0%{opacity:0;transform:translate(0px,0px)}41.5%{opacity:0;transform:translate(0px,0px)}43.0%{opacity:1;transform:translate(0px,0px)}58.0%{opacity:1;transform:translate(0px,0px)}59.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e9{animation-name:dsh-tlsmod-k9}@keyframes dsh-tlsmod-k10{0.0%{opacity:0;transform:translate(0px,0px)}42.5%{opacity:0;transform:translate(0px,0px)}44.25%{opacity:1;transform:translate(0px,0px)}58.0%{opacity:1;transform:translate(0px,0px)}59.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e10{animation-name:dsh-tlsmod-k10}@keyframes dsh-tlsmod-k11{0.0%{opacity:0;transform:translate(0px,0px)}59.0%{opacity:0;transform:translate(0px,0px)}60.75%{opacity:1;transform:translate(0px,0px)}77.0%{opacity:1;transform:translate(0px,0px)}78.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e11{animation-name:dsh-tlsmod-k11}@keyframes dsh-tlsmod-k12{0.0%{opacity:0;transform:translate(0px,0px)}60.5%{opacity:0;transform:translate(0px,0px)}62.0%{opacity:1;transform:translate(0px,0px)}77.0%{opacity:1;transform:translate(0px,0px)}78.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e12{animation-name:dsh-tlsmod-k12}@keyframes dsh-tlsmod-k13{0.0%{opacity:0;transform:translate(0px,0px)}61.5%{opacity:0;transform:translate(0px,0px)}63.25%{opacity:1;transform:translate(0px,0px)}77.0%{opacity:1;transform:translate(0px,0px)}78.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e13{animation-name:dsh-tlsmod-k13}@keyframes dsh-tlsmod-k14{0.0%{opacity:0;transform:translate(0px,0px)}63.5%{opacity:0;transform:translate(0px,0px)}65.25%{opacity:1;transform:translate(0px,0px)}77.0%{opacity:1;transform:translate(0px,0px)}78.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e14{animation-name:dsh-tlsmod-k14}@keyframes dsh-tlsmod-k15{0.0%{opacity:0;transform:translate(0px,0px)}78.0%{opacity:0;transform:translate(0px,0px)}79.75%{opacity:1;transform:translate(0px,0px)}96.0%{opacity:1;transform:translate(0px,0px)}97.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e15{animation-name:dsh-tlsmod-k15}@keyframes dsh-tlsmod-k16{0.0%{opacity:0;transform:translate(0px,0px)}79.5%{opacity:0;transform:translate(0px,0px)}81.0%{opacity:1;transform:translate(0px,0px)}96.0%{opacity:1;transform:translate(0px,0px)}97.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e16{animation-name:dsh-tlsmod-k16}@keyframes dsh-tlsmod-k17{0.0%{opacity:0;transform:translate(0px,0px)}80.5%{opacity:0;transform:translate(0px,0px)}82.25%{opacity:1;transform:translate(0px,0px)}96.0%{opacity:1;transform:translate(0px,0px)}97.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e17{animation-name:dsh-tlsmod-k17}@keyframes dsh-tlsmod-k18{0.0%{opacity:0;transform:translate(0px,0px)}82.5%{opacity:0;transform:translate(0px,0px)}84.25%{opacity:1;transform:translate(0px,0px)}96.0%{opacity:1;transform:translate(0px,0px)}97.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e18{animation-name:dsh-tlsmod-k18}@keyframes dsh-tlsmod-k19{0.0%{opacity:0;transform:translate(0px,0px)}1.0%{opacity:0;transform:translate(0px,0px)}2.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:1;transform:translate(0px,0px)}99.25%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tlsmod .dsh-tlsmod-e19{animation-name:dsh-tlsmod-k19}.dsh-tlsmod .dsh-tlsmod-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-tlsmod-bg" x="0" y="0" width="960" height="360"/>
<rect class="dsh-tlsmod-bx" x="30" y="120" width="100" height="44" rx="6"/><text class="dsh-tlsmod-mu dsh-tlsmod-c dsh-tlsmod-sm" x="80.0" y="147">заголовки</text>
<rect class="dsh-tlsmod-bx" x="134" y="120" width="120" height="44" rx="6"/><text class="dsh-tlsmod-mk dsh-tlsmod-c dsh-tlsmod-sm" x="194.0" y="147">Random 32 Б</text>
<rect class="dsh-tlsmod-bx" x="258" y="120" width="110" height="44" rx="6"/><text class="dsh-tlsmod-mk dsh-tlsmod-c dsh-tlsmod-sm" x="313.0" y="147">Session ID</text>
<rect class="dsh-tlsmod-bx" x="372" y="120" width="190" height="44" rx="6"/><text class="dsh-tlsmod-mu dsh-tlsmod-c dsh-tlsmod-sm" x="467.0" y="147">другие расширения</text>
<rect class="dsh-tlsmod-bx" x="566" y="120" width="170" height="44" rx="6"/><text class="dsh-tlsmod-mk dsh-tlsmod-c dsh-tlsmod-sm" x="651.0" y="147">SNI: имя сайта</text>
<rect class="dsh-tlsmod-bx" x="740" y="120" width="100" height="44" rx="6"/><text class="dsh-tlsmod-mk dsh-tlsmod-c dsh-tlsmod-sm" x="790.0" y="147">padding</text>
<text class="dsh-tlsmod-cap" x="2" y="28">фейковый ClientHello</text>
<g class="a dsh-tlsmod-e1 tr"><text class="dsh-tlsmod-ml dsh-tlsmod-acc" x="2" y="70">tls_mod=rnd</text></g>
<g class="a dsh-tlsmod-e2 tr"><rect class="dsh-tlsmod-bxa" x="131" y="117" width="126" height="50" rx="8"/></g>
<g class="a dsh-tlsmod-e3 tr"><rect class="dsh-tlsmod-bxa" x="255" y="117" width="116" height="50" rx="8"/></g>
<g class="a dsh-tlsmod-e4 tr"><text class="dsh-tlsmod-tk" x="2" y="244">Random и Session ID заполнены случайными байтами</text></g>
<g class="a dsh-tlsmod-e5 tr"><text class="dsh-tlsmod-ml dsh-tlsmod-acc" x="2" y="70">tls_mod=rndsni</text></g>
<g class="a dsh-tlsmod-e6 tr"><rect class="dsh-tlsmod-bxa" x="563" y="117" width="176" height="50" rx="8"/></g>
<g class="a dsh-tlsmod-e7 tr"><text class="dsh-tlsmod-tk" x="2" y="244">имя сайта в SNI заменено случайным доменом</text></g>
<g class="a dsh-tlsmod-e8 tr"><text class="dsh-tlsmod-ml dsh-tlsmod-acc" x="2" y="70">tls_mod=sni=&lt;домен&gt;</text></g>
<g class="a dsh-tlsmod-e9 tr"><rect class="dsh-tlsmod-bxa" x="563" y="117" width="176" height="50" rx="8"/></g>
<g class="a dsh-tlsmod-e10 tr"><text class="dsh-tlsmod-tk" x="2" y="244">в SNI стоит ваш домен; длины внутри TLS пересчитаны</text></g>
<g class="a dsh-tlsmod-e11 tr"><text class="dsh-tlsmod-ml dsh-tlsmod-acc" x="2" y="70">tls_mod=dupsid</text></g>
<g class="a dsh-tlsmod-e12 tr"><rect class="dsh-tlsmod-bxa" x="255" y="117" width="116" height="50" rx="8"/></g>
<g class="a dsh-tlsmod-e13 tr"><text class="dsh-tlsmod-tk" x="2" y="244">Session ID скопирован из настоящего запроса (после rnd)</text></g>
<g class="a dsh-tlsmod-e14 tr"><rect class="dsh-tlsmod-bxa" x="258" y="276" width="110" height="40" rx="6"/><text class="dsh-tlsmod-mk dsh-tlsmod-c dsh-tlsmod-sm" x="313.0" y="301">Session ID</text><text class="dsh-tlsmod-mu dsh-tlsmod-sm" x="30" y="292">настоящий запрос</text><path class="dsh-tlsmod-sl-a" d="M313.0 272L313.0 172"/><polygon class="dsh-tlsmod-hd-a" points="313.0,172.0 318.0,182.0 308.0,182.0"/></g>
<g class="a dsh-tlsmod-e15 tr"><text class="dsh-tlsmod-ml dsh-tlsmod-acc" x="2" y="70">tls_mod=padencap</text></g>
<g class="a dsh-tlsmod-e16 tr"><rect class="dsh-tlsmod-bxa" x="737" y="117" width="106" height="50" rx="8"/></g>
<g class="a dsh-tlsmod-e17 tr"><text class="dsh-tlsmod-tk" x="2" y="244">padding увеличен на длину настоящего запроса: он может выглядеть его частью</text></g>
<g class="a dsh-tlsmod-e18 tr"><rect class="dsh-tlsmod-bxa" x="746" y="276" width="190" height="40" rx="6"/><text class="dsh-tlsmod-mk dsh-tlsmod-c dsh-tlsmod-sm" x="841" y="301">настоящий запрос</text><path class="dsh-tlsmod-sl-a" d="M790.0 272L790.0 172"/><polygon class="dsh-tlsmod-hd-a" points="790.0,172.0 795.0,182.0 785.0,182.0"/></g>
<g class="a dsh-tlsmod-e19"><text class="dsh-tlsmod-mu" x="2" y="350">Нет образца настоящего запроса (reasm_data) — tls_mod молча пропускается, и фейк уходит как есть.</text></g>
</svg>
