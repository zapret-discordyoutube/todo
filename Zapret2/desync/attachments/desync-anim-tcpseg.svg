<svg xmlns="http://www.w3.org/2000/svg" class="dsa-tcpseg" viewBox="0 0 960 282" width="960" height="282" role="img" aria-labelledby="dsa-tcpseg-t dsa-tcpseg-d">
<title id="dsa-tcpseg-t">tcpseg: ClientHello одним сегментом с seqovl</title>
<desc id="dsa-tcpseg-d">Карта потока для tcpseg с pos=0,-1 и seqovl=1 в связке с drop: оригинальный пакет выбрасывается, вместо него уходит сегмент с seq=-1 и одним байтом мусора спереди. Сервер отрезает байт левее окна приёма и принимает ClientHello целиком.</desc>
<style>.dsa-tcpseg{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8)}@media (prefers-color-scheme:dark){.dsa-tcpseg{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618)}}.dsa-tcpseg .dsa-tcpseg-bg{fill:var(--bg)}.dsa-tcpseg text{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13.5px;fill:var(--fg2)}.dsa-tcpseg .dsa-tcpseg-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsa-tcpseg .dsa-tcpseg-tick{font-size:11px;fill:var(--mute)}.dsa-tcpseg .dsa-tcpseg-rule{stroke:var(--mute);stroke-width:1}.dsa-tcpseg .dsa-tcpseg-brace{fill:none;stroke:var(--acc);stroke-width:1.3}.dsa-tcpseg .dsa-tcpseg-cut{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 4;opacity:.55}.dsa-tcpseg .dsa-tcpseg-win{stroke:var(--fg2);stroke-width:1.4}.dsa-tcpseg .dsa-tcpseg-sep{stroke:var(--line);stroke-width:1}.dsa-tcpseg .dsa-tcpseg-no{fill:var(--mute)}.dsa-tcpseg .dsa-tcpseg-k{fill:var(--fg);font-weight:600}.dsa-tcpseg .dsa-tcpseg-kfk{fill:var(--mute);font-weight:600}.dsa-tcpseg .dsa-tcpseg-meta{fill:var(--mute)}.dsa-tcpseg .dsa-tcpseg-arrow{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--fg2)}.dsa-tcpseg .dsa-tcpseg-rl{fill:var(--tint);stroke:var(--acc);stroke-width:1}.dsa-tcpseg .dsa-tcpseg-fk{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:2 2}.dsa-tcpseg .dsa-tcpseg-dim{fill:none;stroke:var(--line);stroke-width:1}.dsa-tcpseg .dsa-tcpseg-mk{fill:none;stroke:var(--fg);stroke-width:1.8}.dsa-tcpseg .dsa-tcpseg-slot{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.dsa-tcpseg .dsa-tcpseg-ch{font-size:14px;fill:var(--fg);text-anchor:middle}.dsa-tcpseg .dsa-tcpseg-ch-fk{font-size:14px;fill:var(--mute);text-anchor:middle}.dsa-tcpseg .dsa-tcpseg-ch-mu{font-size:14px;fill:var(--mute);text-anchor:middle}.dsa-tcpseg .dsa-tcpseg-strike{stroke:var(--fg2);stroke-width:1.4;transform-box:fill-box;transform-origin:left center}.dsa-tcpseg .dsa-tcpseg-uline{stroke:var(--acc);stroke-width:2;transform-box:fill-box;transform-origin:left center}.dsa-tcpseg .dsa-tcpseg-srv{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--fg)}.dsa-tcpseg .dsa-tcpseg-srv-no{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;fill:var(--mute)}.dsa-tcpseg .dsa-tcpseg-note{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;fill:var(--fg2)}.dsa-tcpseg .dsa-tcpseg-who{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--acc)}.dsa-tcpseg .a{animation-duration:6.35s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsa-tcpseg .a{animation:none}}figure.dsa-tcpseg-fig{margin:1.6rem 0;overflow-x:auto}figure.dsa-tcpseg-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsa-tcpseg-k1{0.0%{opacity:0}7.874%{opacity:0}13.386%{opacity:1}91.339%{opacity:1}97.638%{opacity:0}100%{opacity:0}}.dsa-tcpseg .dsa-tcpseg-e1{animation-name:dsa-tcpseg-k1}@keyframes dsa-tcpseg-k2{0.0%{opacity:0;transform:translateX(-14px)}7.874%{opacity:0;transform:translateX(-14px)}13.386%{opacity:1;transform:translateX(0px)}22.047%{opacity:.55;transform:translateX(0px)}91.339%{opacity:.