<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="t d">
<title id="t">tcpseg: ClientHello одним сегментом с seqovl</title>
<desc id="d">Анимация: второй инстанс drop выбрасывает оригинальный пакет, а tcpseg отправляет вместо него тот же ClientHello с одним лишним байтом спереди (seqovl=1). ТСПУ видит поток, начинающийся с мусора, сервер отрезает байт левее окна TCP.</desc>
<style>.mono{font-family:ui-monospace,'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:Onest,Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','DejaVu Sans',sans-serif}.a{animation-duration:7.11s;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.a{animation:none!important}.pk{display:none}}@keyframes k1{0.0%{opacity:0}39.986%{opacity:0}41.674%{opacity:0.95}47.863%{opacity:0}100%{opacity:0}}@keyframes k2{0.0%{opacity:0}40.83%{opacity:0}45.05%{opacity:1}90.155%{opacity:1}96.484%{opacity:0}100%{opacity:0}}@keyframes k3{0.0%{opacity:0}45.753%{opacity:0}49.972%{opacity:1}90.155%{opacity:1}96.484%{opacity:0}100%{opacity:0}}@keyframes k4{0.0%{opacity:0}48.566%{opacity:0}52.785%{opacity:1}90.155%{opacity:1}96.484%{opacity:0}100%{opacity:0}}@keyframes k5{0.0%{opacity:0}51.379%{opacity:0}55.598%{opacity:1}90.155%{opacity:1}96.484%{opacity:0}100%{opacity:0}}@keyframes k6{0.0%{opacity:0}49.312%{opacity:0}53.531%{opacity:1}90.155%{opacity:1}96.484%{opacity:0}100%{opacity:0}}@keyframes k7{0.0%{opacity:0}49.312%{opacity:0}53.531%{opacity:1}90.155%{opacity:1}96.484%{opacity:0}100%{opacity:0}}@keyframes k8{0.0%{opacity:0}58.454%{opacity:0}62.673%{opacity:1}90.155%{opacity:1}96.484%{opacity:0}100%{opacity:0}}@keyframes k9{0.0%{opacity:0}16.174%{opacity:0}18.284%{opacity:1}29.536%{opacity:1}30.942%{opacity:0}100%{opacity:0}}@keyframes k10{0.0%{opacity:0;transform:translate(329.2px,292.0px)}8.439%{opacity:0;transform:translate(329.2px,292.0px)}11.955%{opacity:1;transform:translate(329.2px,292.0px)}25.316%{opacity:1;transform:translate(329.2px,292.0px)}29.536%{opacity:0;transform:translate(329.2px,318.0px)}100%{opacity:0;transform:translate(329.2px,318.0px)}}@keyframes k11{0.0%{opacity:0;transform:translate(329.2px,292.0px)}32.349%{opacity:0;transform:translate(329.2px,292.0px)}35.162%{opacity:1;transform:translate(379.2px,292.0px)}49.312%{opacity:1;transform:translate(630.8px,292.0px)}53.531%{opacity:0;transform:translate(642.8px,292.0px)}100%{opacity:0;transform:translate(642.8px,292.0px)}}</style>
<rect x="1" y="1" width="958" height="670" rx="26" fill="#0b1020" stroke="#1f2a48" stroke-width="2"/>
<text x="36" y="58" class="mono" font-size="30" font-weight="700" fill="#4fd1ff">tcpseg</text>
<text x="166" y="57" class="sans" font-size="19" fill="#8d99bd">сегмент с лишним байтом спереди</text>
<text x="36" y="90" class="mono" font-size="15" fill="#7d8bb0">--lua-desync=tcpseg:pos=0,-1:seqovl=1 --lua-desync=drop</text>
<line x1="150" y1="292" x2="810" y2="292" stroke="rgba(151,166,201,.4)" stroke-width="2" stroke-dasharray="6 10"/>
<rect x="30" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="90.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">ваш ПК</text>
<text x="90.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">Zapret 2</text>
<rect x="810" y="248" width="120" height="88" rx="16" fill="#111a33" stroke="#2d3b66" stroke-width="2"/>
<text x="870.0" y="288" class="sans" font-size="20" font-weight="700" fill="#e8edff" text-anchor="middle">сервер</text>
<text x="870.0" y="316" class="mono" font-size="14" fill="#8d99bd" text-anchor="middle">youtube.com</text>
<text x="480" y="214" class="sans" font-size="21" font-weight="800" letter-spacing="2" fill="#ff3b5c" text-anchor="middle">ТСПУ</text>
<rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,59,92,.14)" stroke="#ff3b5c" stroke-width="2"/>
<g class="a pk" style="animation-name:k1"><rect x="466" y="226" width="28" height="132" rx="8" fill="rgba(255,176,32,.55)" stroke="#ffb020" stroke-width="5"/></g>
<text x="36" y="384" class="sans" font-size="15" fill="#8d99bd">▒ — байт seqovl: seq сдвинут на 1 назад, сервер его отрежет</text>
<text x="36" y="144" class="sans" font-size="16" fill="#8d99bd">что отправляет браузер:</text>
<rect x="270.8" y="118" width="321.1" height="40" rx="6" fill="#4fd1ff" fill-opacity=".13" stroke="#4fd1ff" stroke-width="1.6"/>
<text x="431.4" y="144.0" font-size="17" text-anchor="middle" class="mono"><tspan fill="#e8edff">16 03 01 … SNI youtube.com …</tspan></text>
<rect x="30" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="50" y="452" class="sans" font-size="18" font-weight="700" fill="#ff3b5c">что видит ТСПУ</text>
<rect x="490" y="420" width="440" height="232" rx="18" fill="#0f1730" stroke="#243056" stroke-width="1.6"/>
<text x="510" y="452" class="sans" font-size="18" font-weight="700" fill="#37e39a">что собирает сервер</text>
<g class="a fin" style="animation-name:k2"><g transform="translate(128.0,492)"><rect x="-78.0" y="-20.0" width="155.9" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#ffb020">▒</tspan><tspan fill="#e8edff"> 16 03 01 …</tspan></text></g></g>
<g class="a fin" style="animation-name:k3"><text x="50" y="548" class="sans" font-size="18" font-weight="700" fill="#ffb020">поток начинается с лишнего</text></g>
<g class="a fin" style="animation-name:k4"><text x="50" y="575" class="sans" font-size="18" font-weight="400" fill="#e8edff">байта ▒ — разбор ClientHello</text></g>
<g class="a fin" style="animation-name:k5"><text x="50" y="602" class="sans" font-size="18" font-weight="400" fill="#e8edff">может сбиться</text></g>
<g transform="translate(644.8,492)"><rect x="-134.8" y="-20" width="269.5" height="40" rx="10" fill="none" stroke="#33406a" stroke-width="1.6" stroke-dasharray="4 4"/></g>
<g class="a fin" style="animation-name:k6"><g transform="translate(644.8,492)"><rect x="-134.8" y="-20.0" width="269.5" height="40" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="18" text-anchor="middle" class="mono"><tspan fill="#e8edff">16 03 01 … youtube.com</tspan></text></g></g>
<g class="a fin" style="animation-name:k7"><text x="510" y="552" class="sans" font-size="17" fill="#ffb020">▒ лежит левее окна TCP → отрезан</text></g>
<g class="a fin" style="animation-name:k8"><text x="510" y="628" class="sans" font-size="20" font-weight="700" fill="#37e39a">собрано: ClientHello целиком ✓</text></g>
<g class="a pk" style="animation-name:k10"><rect x="-171.2" y="-23.0" width="342.5" height="46" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#4fd1ff">① </tspan><tspan fill="#e8edff">16 03 01 … youtube.com</tspan></text><g class="a" style="animation-name:k9"><line x1="-177.2" y1="-26" x2="177.2" y2="26" stroke="#ff3b5c" stroke-width="5"/><text x="0" y="-34" class="sans" font-size="17" font-weight="700" fill="#ff3b5c" text-anchor="middle">drop: оригинал не уйдёт</text></g></g>
<g class="a pk" style="animation-name:k11"><rect x="-171.2" y="-23.0" width="342.5" height="46" rx="11" fill="#0e1630" stroke="#4fd1ff" stroke-width="2.4"/><text x="0.0" y="7.0" font-size="21" text-anchor="middle" class="mono"><tspan fill="#ffb020">▒</tspan><tspan fill="#e8edff"> 16 03 01 … youtube.com</tspan></text></g>
</svg>
