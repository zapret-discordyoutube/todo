opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tsup .dsh-tsup-e5{animation-name:dsh-tsup-k5}@keyframes dsh-tsup-k6{0.0%{opacity:0;transform:translate(0px,0px)}35.714%{opacity:0;transform:translate(0px,0px)}37.857%{opacity:1;transform:translate(0px,0px)}50.0%{opacity:1;transform:translate(0px,0px)}57.143%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tsup .dsh-tsup-e6{animation-name:dsh-tsup-k6}@keyframes dsh-tsup-k7{0.0%{opacity:0;transform:translate(0px,0px)}60.0%{opacity:0;transform:translate(0px,0px)}62.5%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tsup .dsh-tsup-e7{animation-name:dsh-tsup-k7}@keyframes dsh-tsup-k8{0.0%{opacity:0;transform:translate(0px,0px)}67.143%{opacity:0;transform:translate(0px,0px)}69.643%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-tsup .dsh-tsup-e8{animation-name:dsh-tsup-k8}.dsh-tsup .dsh-tsup-dsh{stroke-dasharray:5 5}</style>
