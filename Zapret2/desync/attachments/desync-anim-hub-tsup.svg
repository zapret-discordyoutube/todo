<svg xmlns="http://www.w3.org/2000/svg" class="dsh-tsup" viewBox="0 0 960 388" width="960" height="388" role="img" aria-labelledby="dsh-tsup-t dsh-tsup-d">
<title id="dsh-tsup-t">Зачем tcp_ts_up: Linux смотрит на первую опцию</title>
<desc id="dsh-tsup-d">Linux отбрасывает пакет с плохим ack, только если опция timestamp стоит первой в списке TCP-опций. Без tcp_ts_up timestamp не первая, и пакет принимается. С tcp_ts_up она переносится на первое место, и пакет отбрасывается.</desc>
<style>.dsh-tsup{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-tsup{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-tsup .dsh-tsup-bg{fill:var(--bg)}.dsh-tsup text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;fill:var(--fg2)}.dsh-tsup .dsh-tsup-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-tsup .dsh-tsup-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-tsup .dsh-tsup-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-tsup .dsh-tsup-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}.dsh-tsup .dsh-tsup-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-tsup .dsh-tsup-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-tsup .dsh-tsup-sm{font-size:13.5px}.dsh-tsup .dsh-tsup-mu{fill:var(--mute)}.dsh-tsup .dsh-tsup-fg{fill:var(--fg)}.dsh-tsup .dsh-tsup-acc{fill:var(--acc)}.dsh-tsup .dsh-tsup-rej{fill:var(--rej)}.dsh-tsup .dsh-tsup-c{text-anchor:middle}.dsh-tsup .dsh-tsup-r{text-anchor:end}.dsh-tsup .dsh-tsup-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-tsup .dsh-tsup-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-tsup .dsh-tsup-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-tsup .dsh-tsup-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-tsup .dsh-tsup-bxn{fill:none;stroke:none}.dsh-tsup .dsh-tsup-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-tsup .dsh-tsup-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-tsup .dsh-tsup-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-tsup .dsh-tsup-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-tsup .dsh-tsup-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-tsup .dsh-tsup-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-tsup .dsh-tsup-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-tsup .dsh-tsup-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-tsup .dsh-tsup-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-tsup .dsh-tsup-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-tsup .dsh-tsup-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-tsup .dsh-tsup-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-tsup .dsh-tsup-bxbg{fill:var(--bg);stroke:none}.dsh-tsup .dsh-tsup-hd-a{fill:var(--acc)}.dsh-tsup .dsh-tsup-hd-f{fill:var(--fg2)}.dsh-tsup .dsh-tsup-hd-r{fill:var(--rej)}.dsh-tsup .dsh-tsup-dot{fill:var(--acc)}.dsh-tsup .dsh-tsup-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-tsup .dsh-tsup-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-tsup .dsh-tsup-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-tsup .dsh-tsup-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-tsup .a{animation-duration:14s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-tsup .a{