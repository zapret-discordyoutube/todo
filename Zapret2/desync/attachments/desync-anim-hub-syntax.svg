<svg xmlns="http://www.w3.org/2000/svg" class="dsh-syntax" viewBox="0 0 960 292" width="960" height="292" role="img" aria-labelledby="dsh-syntax-t dsh-syntax-d">
<title id="dsh-syntax-t">Как разобрать строку --lua-desync</title>
<desc id="dsh-syntax-d">Строка --lua-desync=fake:blob=fake_default_tls:tcp_md5:ip_ttl=3 состоит из флага, имени функции и параметров через двоеточие. Параметр со значением пишется как имя=значение, параметр без значения — просто имя, это то же самое, что true.</desc>
