<svg xmlns="http://www.w3.org/2000/svg" class="dsh-mss" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="dsh-mss-t dsh-mss-d">
<title id="dsh-mss-t">Автосегментация по MSS: кусок больше MSS режется сам</title>
<desc id="dsh-mss-d">Если кусок данных вместе с заголовками не помещается в MSS соединения, хелпер rawsend_payload_segmented дорезает его на под-сегменты и увеличивает seq на длину предыдущего. Fooling достаётся всем под-сегментам одинаково, ip_id считается для каждого отдельно.</desc>
<style>.dsh-mss{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-mss{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-mss .dsh-mss-bg{fill:var(--bg)}.dsh-mss text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;fill:var(--fg2)}.dsh-mss .dsh-mss-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-mss .dsh-mss-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-mss .dsh-mss-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-mss .dsh-mss-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}.dsh-mss .dsh-mss-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-mss .dsh-mss-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-mss .dsh-mss-sm{font-size:13.5px}.dsh-mss .dsh-mss-mu{fill:var(--mute)}.dsh-mss .dsh-mss-fg{fill:var(--fg)}.dsh-mss .dsh-mss-acc{fill:var(--acc)}.dsh-mss .dsh-mss-rej{fill:var(--rej)}.dsh-mss .dsh-mss-c{text-anchor:middle}.dsh-mss .dsh-mss-r{text-anchor:end}.dsh-mss .dsh-mss-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-mss .dsh-mss-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-mss .dsh-mss-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-mss .dsh-mss-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-mss .dsh-mss-bxn{fill:none;stroke:none}.dsh-mss .dsh-mss-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-mss .dsh-mss-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-mss .dsh-mss-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-mss .dsh-mss-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-mss .dsh-mss-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-mss .dsh-mss-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-mss .dsh-mss-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-mss .dsh-mss-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-mss .dsh-mss-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-mss .dsh-mss-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-mss .dsh-mss-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-mss .dsh-mss-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-mss .dsh-mss-bxbg{fill:var(--bg);stroke:none}.dsh-mss .dsh-mss-hd-a{fill:var(--acc)}.dsh-mss .dsh-mss-hd-f{fill:var(--fg2)}.dsh-mss .dsh-mss-hd-r{fill:var(--rej)}.dsh-mss .dsh-mss-dot{fill:var(--acc)}.dsh-mss .dsh-mss-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-mss .dsh-mss-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-mss .dsh-mss-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-mss .dsh-mss-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-mss .a{animation-duration:13s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-mss .a{animation:none}.dsh-mss .tr{display:none}}figure.dsh-mss-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-mss-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-mss-k1{0.0%{opacity:0;transform:translate(0px,0px)}10.769%{opacity:0;transform:translate(0px,0px)}12.692%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-mss .dsh-mss-e1{animation-name:dsh-mss-k1}@keyframes dsh-mss-k2{0.0%{opacity:0;transform:translate(0px,0px)}13.846%{opacity:0;transform:translate(0px,0px)}15.769%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-mss .dsh-mss-e2{animation-name:dsh-mss-k2}@keyframes dsh-mss-k3{0.0%{opacity:0;transform:translate(0px,-40px)}23.077%{opacity:0;transform:translate(0px,-40px)}24.615%{opacity:1;transform:translate(0px,-40px)}29.231%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-mss .dsh-mss-e3{animation-name:dsh-mss-k3}@keyframes dsh-mss-k4{0.0%{opacity:0;transform:translate(0px,-40px)}30.769%{opacity:0;transform:translate(0px,-40px)}32.308%{opacity:1;transform:translate(0px,-40px)}36.923%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-mss .dsh-mss-e4{animation-name:dsh-mss-k4}@keyframes dsh-mss-k5{0.0%{opacity:0;transform:translate(0px,-40px)}38.462%{opacity:0;transform:translate(0px,-40px)}40.0%{opacity:1;transform:translate(0px,-40px)}44.615%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-mss .dsh-mss-e5{animation-name:dsh-mss-k5}@keyframes dsh-mss-k6{0.0%{opacity:0;transform:translate(0px,0px)}53.846%{opacity:0;transform:translate(0px,0px)}56.538%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-mss .dsh-mss-e6{animation-name:dsh-mss-k6}.dsh-mss .dsh-mss-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-mss-bg" x="0" y="0" width="960" height="320"/>
<text class="dsh-mss-cap" x="2" y="28">кусок данных от функции</text>
<rect class="dsh-mss-bx" x="40" y="44" width="880" height="34" rx="5"/>
<text class="dsh-mss-mu dsh-mss-c dsh-mss-sm" x="480.0" y="66">больше, чем влезает в один сегмент</text>
<g class="a dsh-mss-e1"><line class="dsh-mss-la" x1="340" y1="36" x2="340" y2="86"/><text class="dsh-mss-acc dsh-mss-tk dsh-mss-c dsh-mss-sm" x="340" y="106">MSS</text></g>
<g class="a dsh-mss-e2"><line class="dsh-mss-la" x1="640" y1="36" x2="640" y2="86"/><text class="dsh-mss-acc dsh-mss-tk dsh-mss-c dsh-mss-sm" x="640" y="106">MSS</text></g>
<text class="dsh-mss-cap" x="2" y="146">что уходит в сеть</text>
<g class="a dsh-mss-e3"><rect class="dsh-mss-bxa" x="41" y="162" width="298" height="34" rx="5"/><text class="dsh-mss-mk dsh-mss-c dsh-mss-sm" x="190.0" y="184">seq = s</text><text class="dsh-mss-mu dsh-mss-sm dsh-mss-c" x="190.0" y="220">то же fooling</text><text class="dsh-mss-mu dsh-mss-sm dsh-mss-c" x="190.0" y="240">свой ip_id</text></g>
<g class="a dsh-mss-e4"><rect class="dsh-mss-bxa" x="341" y="162" width="298" height="34" rx="5"/><text class="dsh-mss-mk dsh-mss-c dsh-mss-sm" x="490.0" y="184">seq = s + MSS</text><text class="dsh-mss-mu dsh-mss-sm dsh-mss-c" x="490.0" y="220">то же fooling</text><text class="dsh-mss-mu dsh-mss-sm dsh-mss-c" x="490.0" y="240">свой ip_id</text></g>
<g class="a dsh-mss-e5"><rect class="dsh-mss-bxa" x="641" y="162" width="278" height="34" rx="5"/><text class="dsh-mss-mk dsh-mss-c dsh-mss-sm" x="780.0" y="184">seq = s + 2·MSS</text><text class="dsh-mss-mu dsh-mss-sm dsh-mss-c" x="780.0" y="220">то же fooling</text><text class="dsh-mss-mu dsh-mss-sm dsh-mss-c" x="780.0" y="240">свой ip_id</text></g>
<g class="a dsh-mss-e6"><text class="dsh-mss-tk" x="2" y="300">Думать о размере сегментов не нужно: MSS берётся из desync.tcp_mss.</text></g>
</svg>
