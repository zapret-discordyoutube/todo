<svg xmlns="http://www.w3.org/2000/svg" class="dsh-preset-builtin-update" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="dsh-preset-builtin-update-t dsh-preset-builtin-update-d">
<title id="dsh-preset-builtin-update-t">Правка встроенного пресета живёт копией — до первого обновления этого пресета</title>
<desc id="dsh-preset-builtin-update-d">Встроенный пресет лежит в presets\winws2_builtin. Правка сохраняется копией в presets\winws2, и дальше работает копия. Если после обновления программы номер BuiltinVersion у встроенного пресета стал больше, копия заменяется новой версией, а прежняя копия сохраняется в presets\replaced.</desc>
