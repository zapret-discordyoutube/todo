<g class="a dsh-z2-circular-e19"><text class="dsh-z2-circular-cap" x="2" y="384">сброс счётчика</text><text class="dsh-z2-circular-t" x="180" y="384">если последняя неудача старше 300 с (time=300)</text></g>
<g class="a dsh-z2-circular-e20"><text class="dsh-z2-circular-cap" x="2" y="414">память</text><text class="dsh-z2-circular-t" x="180" y="414">по каждому хосту, в таблице autostate: переживает отдельные соединения</text></g>
<g class="a dsh-z2-circular-e21"><text class="dsh-z2-circular-mu dsh-z2-circular-sm" x="2" y="450">На каждом пакете выполняются только инстансы с номером текущей стратегии; несколько инстансов</text><text class="dsh-z2-circular-mu dsh-z2-circular-sm" x="2" y="469">одной стратегии идут по порядку.</text></g>
</svg>
