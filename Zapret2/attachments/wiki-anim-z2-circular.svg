<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-circular" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="dsh-z2-circular-t dsh-z2-circular-d">
<title id="dsh-z2-circular-t">circular: стратегия сменяется после неудачи</title>
<desc id="dsh-z2-circular-d">Оркестратор circular выполняет только инстансы текущей стратегии. После fails неудач переходит к следующей по формуле (N % total) + 1, а на стратегии с флагом final ротация останавливается. Состояние хранится для каждого хоста в таблице autostate.</desc>
