<svg xmlns="http://www.w3.org/2000/svg" class="dsh-wf-pipeline" viewBox="0 0 960 482" width="960" height="482" role="img" aria-labelledby="dsh-wf-pipeline-t dsh-wf-pipeline-d">
<title id="dsh-wf-pipeline-t">Порядок фильтрации: сначала WinDivert, потом фильтры nfqws</title>
<desc id="dsh-wf-pipeline-d">Все пакеты сетевого стека сначала проходят фильтр WinDivert --wf-* на уровне драйвера: остальные идут мимо nfqws напрямую в сеть. Захваченные пакеты проходят фильтры nfqws по портам, IP и доменам, и к ним применяются desync-действия.</desc>
<style>.dsh-wf-pipeline{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-wf-pipeline{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-wf-pipeline .dsh-wf-pipeline-bg{fill:var(--bg)}.dsh-wf-pipeline text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-wf-pipeline .dsh-wf-pipeline-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-wf-pipeline .dsh-wf-pipeline-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-wf-pipeline .dsh-wf-pipeline-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-wf-pipeline .dsh-wf-pipeline-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-wf-pipeline .dsh-wf-pipeline-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-wf-pipeline .dsh-wf-pipeline-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-wf-pipeline .dsh-wf-pipeline-sm{font-size:14.5px}.dsh-wf-pipeline .dsh-wf-pipeline-mu{fill:var(--mute)}.dsh-wf-pipeline .dsh-wf-pipeline-fg{fill:v