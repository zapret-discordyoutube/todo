-wf-pipeline-dot{fill:var(--acc)}.dsh-wf-pipeline .dsh-wf-pipeline-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-wf-pipeline .dsh-wf-pipeline-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-wf-pipeline .dsh-wf-pipeline-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-wf-pipeline .dsh-wf-pipeline-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-wf-pipeline .a{animation-duration:11.3s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-wf-pipeline .a{animation:none}.dsh-wf-pipeline .tr{display:none}}figure.dsh-wf-pipeline-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-wf-pipeline-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-wf-pipeline-k1{0.0%{opacity:0;transform:translate(-10px,0px)}3.54%{opacity:0;transform:translate(-10px,0px)}6.195%{opacity:1;transform:translate(0px,0px)}95.133%{opacity:1;transform:translate(0px,0px)}98.673%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-wf-pipeline .dsh-wf-pipeline-e1{animation-name:dsh-wf-pipeline-k1}@keyframes dsh-wf-pipeline-k2{0.0%{opacity:0;transform:translate(0px,0px)}7.08%{opacity:0;transform:translate(0px,0px)}8.85%{opacity:1;transform:translate(0px,0px)}95.133%{opacity:1;transform:translate(0px,0px)}98.673%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wf-pipeline .dsh-wf-pipeline-e2{animation-name:dsh-wf-pipeline-k2}@keyframes dsh-wf-pipeline-k3{0.0%{opacity:0;transform:translate(-10px,0px)}14.159%{opacity:0;transform:translate(-10px,0px)}16.814%{opacity:1;transform:translate(0px,0px)}95.133%{opacity:1;transform:translate(0px,0px)}98.673%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-wf-pipeline .dsh-wf-pipeline-e3{animation-name:dsh-wf-pipeline-k3}@keyframes dsh-wf-pipeline-k4{0.0%{opacity:0;transform:translat