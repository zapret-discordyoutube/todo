<svg xmlns="http://www.w3.org/2000/svg" class="dsh-mtproto-conntrack" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="dsh-mtproto-conntrack-t dsh-mtproto-conntrack-d">
<title id="dsh-mtproto-conntrack-t">Как распознаётся MTProto: протокол запоминается, тип пакета нет</title>
<desc id="dsh-mtproto-conntrack-d">Первые три пакета TCP не несут данных. Первый пакет с данными даёт payload mtproto_initial и протокол MTProto. Последующие пакеты выглядят как зашифрованный мусор, payload у них unknown, но протокол потока MTProto уже сохранён в conntrack.</desc>
