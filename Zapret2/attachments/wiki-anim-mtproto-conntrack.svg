font-size:14.5px}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-mu{fill:var(--mute)}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-fg{fill:var(--fg)}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-acc{fill:var(--acc)}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-rej{fill:var(--rej)}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-c{text-anchor:middle}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-r{text-anchor:end}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-bxn{fill:none;stroke:none}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-mtproto-conntrack .dsh-mtproto-conntrack-sl-f