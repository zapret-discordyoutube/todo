<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-pipeline" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="dsh-z2-pipeline-t dsh-z2-pipeline-d">
<title id="dsh-z2-pipeline-t">Путь пакета через nfqws2</title>
<desc id="dsh-z2-pipeline-d">Пакет проходит перехват в ядре ОС, диссекцию, conntrack, определение типа пейлоада, при необходимости сборку reasm, выбор профиля, цепочку Lua-инстансов и сведение вердиктов, после чего уходит, изменяется или выбрасывается. Cutoff отключает инстанс от потока.</desc>
