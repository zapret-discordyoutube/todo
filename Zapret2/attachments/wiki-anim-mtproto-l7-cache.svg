<svg xmlns="http://www.w3.org/2000/svg" class="dsh-mtproto-l7-cache" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="dsh-mtproto-l7-cache-t dsh-mtproto-l7-cache-d">
<title id="dsh-mtproto-l7-cache-t">Conntrack запоминает протокол: на втором пакете детекция не нужна</title>
<desc id="dsh-mtproto-l7-cache-d">На первом пакете mtproto_initial conntrack-запись по ip:port имеет l7proto UNKNOWN, срабатывает IsMTProto() и сохраняется l7proto = MTPROTO. На втором пакете, зашифрованном мусоре, l7proto уже MTPROTO, детекция не нужна.</desc>
