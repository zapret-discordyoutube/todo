<g class="a dsh-profile-lists-timing-e16"><text class="dsh-profile-lists-timing-t" x="2" y="360">Пока имени нет, профиль 1 пропускается целиком, и первые пакеты обрабатывает профиль 2 своей</text><text class="dsh-profile-lists-timing-t" x="2" y="382">стратегией. С приветствия TLS движок знает имя и отдаёт соединение профилю 1 — выбор</text><text class="dsh-profile-lists-timing-t" x="2" y="404">пересматривается не больше двух раз.</text></g>
