<svg xmlns="http://www.w3.org/2000/svg" class="dsh-profile-lists-timing" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="dsh-profile-lists-timing-t dsh-profile-lists-timing-d">
<title id="dsh-profile-lists-timing-t">Профиль со списком сайтов ждёт имя сайта, профиль по адресам — нет</title>
<desc id="dsh-profile-lists-timing-d">Пока в соединении не пришло приветствие TLS с именем сайта, профиль со списком сайтов в выборе не участвует, и первые пакеты достаются профилю ниже. Когда имя появилось, движок пересматривает выбор, и соединение переходит к профилю со списком сайтов.</desc>
