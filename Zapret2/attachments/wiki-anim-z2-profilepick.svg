<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-profilepick" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="dsh-z2-profilepick-t dsh-z2-profilepick-d">
<title id="dsh-z2-profilepick-t">Как движок выбирает профиль: сверху вниз, первый совпавший</title>
<desc id="dsh-z2-profilepick-d">Для нового соединения движок проверяет профили сверху вниз и отдаёт соединение первому, у которого совпали все фильтры. Если не подошёл ни один, соединение достаётся скрытому профилю no_action, который ничего не делает. Выбор кэшируется в conntrack.</desc>
<style>.dsh-z2-profilepick{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-z2-profilepick{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-z2-profilepick .dsh-z2-profilepick-bg{fill:var(--bg)}.dsh-z2-profilepick text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-z2-profilepick .dsh-z2-profilepick-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-profilepick .dsh-z2-profilepick-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-profilepick .dsh-z2-profilepick-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-profilepick .dsh-z2-profilepick-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-z2-profilepick .dsh-z2-profilepick-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-z2-profilepick .dsh-z2-profilepick-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-z2-profilepick .dsh-z2-profilepick-sm{font-size:14.5px}.dsh-z2-profilepick .dsh-z2-profilepick-mu{fill:var(--mute)}.dsh-z2-profilepick .dsh-z2-profilepick-fg{fill:var(--fg)}.dsh-z2-profilepick .dsh-z2-profilepick-acc{fill:var(--acc)}.dsh-z2-profilepick .dsh-z2-profilepick-rej{fill:var(--rej)}.dsh-z2-profilepick .dsh-z2-profilepick-c{text-anchor:middle}.dsh-z2-profilepick .dsh-z2-profilepick-r{text-anchor:end}.dsh-z2-profilepick .dsh-z2-profilepick-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-z2-profilepick .dsh-z2-profilepick-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-z2-profilepick .dsh-z2-profilepick-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-z2-profilepick .dsh-z2-profilepick-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-z2-profilepick .dsh-z2-profilepick-bxn{fill:none;stroke:none}.dsh-z2-profilepick .dsh-z2-profilepick-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-z2-profilepick .dsh-z2-profilepick-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-z2-profilepick .dsh-z2-profilepick-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-z2-profilepick .dsh-z2-profilepick-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-z2-profilepick .dsh-z2-profilepick-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-profilepick .dsh-z2-profilepick-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-profilepick .dsh-z2-profilepick-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-z2-profilepick .dsh-z2-profilepick-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-z2-profilepick .dsh-z2-profilepick-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-z2-profilepick .dsh-z2-profilepick-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-profilepick .dsh-z2-profilepick-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-z2-profilepick .dsh-z2-profilepick-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-profilepick .dsh-z2-profilepick-bxbg{fill:var(--bg);stroke:none}.dsh-z2-profilepick .dsh-z2-profilepick-hd-a{fill:var(--acc)}.dsh-z2-profilepick .dsh-z2-profilepick-hd-f{fill:var(--fg2)}.dsh-z2-profilepick .dsh-z2-profilepick-hd-r{fill:var(--rej)}.dsh-z2-profilepick .dsh-z2-profilepick-dot{fill:var(--acc)}.dsh-z2-profilepick .dsh-z2-profilepick-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-z2-profilepick .dsh-z2-profilepick-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-z2-profilepick .dsh-z2-profilepick-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-z2-profilepick .dsh-z2-profilepick-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-z2-profilepick .a{animation-duration:17s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-z2-profilepick .a{animation:none}.dsh-z2-profilepick .tr{display:none}}figure.dsh-z2-profilepick-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-z2-profilepick-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-z2-profilepick-k1{0.0%{opacity:0;transform:translate(0px,0px)}2.941%{opacity:0;transform:translate(0px,0px)}5.0%{opacity:1;transform:translate(0px,0px)}25.294%{opacity:1;transform:translate(0px,0px)}27.059%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profilepick .dsh-z2-profilepick-e1{animation-name:dsh-z2-profilepick-k1}@keyframes dsh-z2-profilepick-k2{0.0%{opacity:0;transform:translate(0px,0px)}5.882%{opacity:0;transform:translate(0px,0px)}7.059%{opacity:1;transform:translate(0px,0px)}25.294%{opacity:1;transform:translate(0px,0px)}27.059%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profilepick .dsh-z2-profilepick-e2{animation-name:dsh-z2-profilepick-k2}@keyframes dsh-z2-profilepick-k3{0.0%{opacity:0;transform:translate(0px,0px)}10.0%{opacity:0;transform:translate(0px,0px)}12.059%{opacity:1;transform:translate(0px,0px)}2