<rect class="dsh-z2-profilepick-bg" x="0" y="0" width="960" height="470"/>
<text class="dsh-z2-profilepick-cap" x="2" y="30">профили пресета, пример</text>
<text class="dsh-z2-profilepick-cap" x="590" y="30">новое соединение</text>
<rect class="dsh-z2-profilepick-bx" x="2" y="96" width="520" height="50" rx="7"/>
<text class="dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="118">Профиль 1</text>
<text class="dsh-z2-profilepick-tk dsh-z2-profilepick-sm" x="110" y="118">Исключения (pass)</text>
<text class="dsh-z2-profilepick-m dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="137">--hostlist=ru-sites.txt</text>
<rect class="dsh-z2-profilepick-bx" x="2" y="158" width="520" height="50" rx="7"/>
<text class="dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="180">Профиль 2</text>
<text class="dsh-z2-profilepick-tk dsh-z2-profilepick-sm" x="110" y="180">youtube.com</text>
<text class="dsh-z2-profilepick-m dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="199">--filter-tcp=443  --hostlist=youtube.txt</text>
<rect class="dsh-z2-profilepick-bx" x="2" y="220" width="520" height="50" rx="7"/>
<text class="dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="242">Профиль 3</text>
<text class="dsh-z2-profilepick-tk dsh-z2-profilepick-sm" x="110" y="242">Весь TLS</text>
<text class="dsh-z2-profilepick-m dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="261">--filter-tcp=443  --filter-l7=tls</text>
<rect class="dsh-z2-profilepick-bxd" x="2" y="282" width="520" height="50" rx="7"/>
<text class="dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="304">№ 0</text>
<text class="dsh-z2-profilepick-tk dsh-z2-profilepick-sm" x="110" y="304">no_action (скрытый)</text>
<text class="dsh-z2-profilepick-m dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="16" y="323">фильтров нет — совпадает со всем</text>
<text class="dsh-z2-profilepick-mu dsh-z2-profilepick-sm" x="2" y="354">поиск идёт строго по порядку: первое совпадение побеждает, остальные профили не смотрят</text>
