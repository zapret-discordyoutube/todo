<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-fakedies" viewBox="0 0 960 424" width="960" height="424" role="img" aria-labelledby="dsh-z2-fakedies-t dsh-z2-fakedies-d">
<title id="dsh-z2-fakedies-t">У фейка две аудитории с противоположными требованиями</title>
<desc id="dsh-z2-fakedies-d">Для DPI фейк должен выглядеть настоящим: его нужно успеть разобрать как TLS, HTTP или QUIC. Для сервера он должен быть плохим и умереть. Fooling — ровно такая порча, которая убивает фейк до сервера, но не мешает DPI. Если фейк дошёл до сервера живым, поток развалится.</desc>
