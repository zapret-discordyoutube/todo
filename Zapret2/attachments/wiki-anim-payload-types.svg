<svg xmlns="http://www.w3.org/2000/svg" class="dsh-payload-types" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="dsh-payload-types-t dsh-payload-types-d">
<title id="dsh-payload-types-t">Тип пакета меняется, протокол соединения — нет</title>
<desc id="dsh-payload-types-d">Пакеты одного TLS-соединения: SYN и пустые ACK имеют тип empty, приветствие браузера — tls_client_hello, ответ сервера — tls_server_hello, зашифрованные данные — unknown. Протокол соединения tls ставится на первом распознанном пакете и не меняется. С --payload=tls_client_hello стратегия получает только приветствие браузера.</desc>
