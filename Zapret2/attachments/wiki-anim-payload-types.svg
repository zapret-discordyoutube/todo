<g class="a dsh-payload-types-e20"><text class="dsh-payload-types-tk" x="2" y="392">--payload=tls_client_hello: стратегия получает только выделенный пакет</text></g>
<g class="a dsh-payload-types-e21"><text class="dsh-payload-types-mu dsh-payload-types-sm" x="2" y="424">Протокол tls держится на всём соединении, поэтому --filter-l7=tls выбирает профиль для всех его пакетов, а</text><text class="dsh-payload-types-mu dsh-payload-types-sm" x="2" y="443">--payload внутри профиля отбирает из них нужные.</text></g>
