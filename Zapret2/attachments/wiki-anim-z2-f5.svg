<rect class="dsh-z2-f5-bg" x="0" y="0" width="960" height="452"/>
<text class="dsh-z2-f5-cap" x="2" y="28">что происходит</text>
<g class="a dsh-z2-f5-e1"><rect class="dsh-z2-f5-bx" x="2" y="44" width="520" height="56" rx="7"/><circle class="dsh-z2-f5-nd" cx="22" cy="72.0" r="12"/><text class="dsh-z2-f5-mk dsh-z2-f5-c dsh-z2-f5-sm" x="22" y="77.0">1</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="77.0">Меняю стратегию на рабочую</text></g>
<g class="a dsh-z2-f5-e2"><rect class="dsh-z2-f5-bx" x="2" y="106" width="520" height="56" rx="7"/><circle class="dsh-z2-f5-nd" cx="22" cy="134.0" r="12"/><text class="dsh-z2-f5-mk dsh-z2-f5-c dsh-z2-f5-sm" x="22" y="139.0">2</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="139.0">Жму F5</text></g>
<g class="a dsh-z2-f5-e3"><rect class="dsh-z2-f5-bx" x="2" y="168" width="520" height="56" rx="7"/><circle class="dsh-z2-f5-nd" cx="22" cy="196.0" r="12"/><text class="dsh-z2-f5-mk dsh-z2-f5-c dsh-z2-f5-sm" x="22" y="201.0">3</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="191.0">Браузер шлёт запрос по уже открытому соединению:</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="210.0">нового SYN нет</text></g>
<g class="a dsh-z2-f5-e4"><rect class="dsh-z2-f5-bx" x="2" y="230" width="520" height="56" rx="7"/><circle class="dsh-z2-f5-nd" cx="22" cy="258.0" r="12"/><text class="dsh-z2-f5-mk dsh-z2-f5-c dsh-z2-f5-sm" x="22" y="263.0">4</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="253.0">Новая стратегия работает только при установке</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="272.0">соединения — здесь не применяется</text></g>
<g class="a dsh-z2-f5-e5"><rect class="dsh-z2-f5-bx" x="2" y="292" width="520" height="56" rx="7"/><circle class="dsh-z2-f5-nd" cx="22" cy="320.0" r="12"/><text class="dsh-z2-f5-mk dsh-z2-f5-c dsh-z2-f5-sm" x="22" y="325.0">5</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="315.0">ТСПУ помнит это соединение как плохое и продолжает</text><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="334.0">блокировать</text></g>
<g class="a dsh-z2-f5-e6"><rect class="dsh-z2-f5-bxr" x="2" y="354" width="520" height="56" rx="7"/><circle class="dsh-z2-f5-nd" cx="22" cy="382.0" r="12"/><text class="dsh-z2-f5-mk dsh-z2-f5-c dsh-z2-f5-sm" x="22" y="387.0">6</text><text class="dsh-z2-f5-rej dsh-z2-f5-tk dsh-z2-f5-sm" x="44" y="387.0">Сайт «не открывается», хотя стратегия уже рабочая</text></g>
<text class="dsh-z2-f5-cap" x="580" y="28">как получить новое соединение</text>
<g class="a dsh-z2-f5-e7"><rect class="dsh-z2-f5-bxa" x="580" y="48" width="122" height="48" rx="6"/><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="594" y="69">Ctrl+F5</text><text class="dsh-z2-f5-mu dsh-z2-f5-sm" x="594" y="88">чаще, но без гарантии</text></g>
<g class="a dsh-z2-f5-e8"><rect class="dsh-z2-f5-bxa" x="580" y="122" width="184" height="48" rx="6"/><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="594" y="143">Новая вкладка</text><text class="dsh-z2-f5-mu dsh-z2-f5-sm" x="594" y="162">лучше — закрыв старую</text></g>
<g class="a dsh-z2-f5-e9"><rect class="dsh-z2-f5-bxa" x="580" y="196" width="246" height="48" rx="6"/><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="594" y="217">Инкогнито</text><text class="dsh-z2-f5-mu dsh-z2-f5-sm" x="594" y="236">отдельный контекст и пустой кэш</text></g>
<g class="a dsh-z2-f5-e10"><rect class="dsh-z2-f5-bxa" x="580" y="270" width="308" height="48" rx="6"/><text class="dsh-z2-f5-tk dsh-z2-f5-sm" x="594" y="291">Закрыть браузер совсем</text><text class="dsh-z2-f5-mu dsh-z2-f5-sm" x="594" y="310">самое надёжное</text></g>
<g class="a dsh-z2-f5-e11"><text class="dsh-z2-f5-mu dsh-z2-f5-sm" x="580" y="362">чем длиннее полоса, тем надёжнее способ</text></g>
<g class="a dsh-z2-f5-e12"><text class="dsh-z2-f5-mu" x="2" y="436">Для приложений (Discord, игры) то же правило: закрыть целиком, вплоть до трея.</text></g>
</svg>
