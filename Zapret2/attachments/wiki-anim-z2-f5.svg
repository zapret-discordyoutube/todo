<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-f5" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="dsh-z2-f5-t dsh-z2-f5-d">
<title id="dsh-z2-f5-t">Почему F5 не показывает новую стратегию</title>
<desc id="dsh-z2-f5-d">После смены стратегии F5 шлёт запрос по уже открытому keep-alive соединению, нового SYN нет. Дурение работает только при установке соединения, а ТСПУ помнит старое соединение как плохое. Чтобы браузер открыл новое соединение, нужны Ctrl+F5, новая вкладка, режим инкогнито или перезапуск браузера.</desc>
