<rect class="dsh-z2-outrange-bg" x="0" y="0" width="960" height="504"/>
<text class="dsh-z2-outrange-cap" x="2" y="28">исходящие (--out-range)</text>
<text class="dsh-z2-outrange-cap" x="520" y="28">входящие (--in-range)</text>
<g class="a dsh-z2-outrange-e1"><rect class="dsh-z2-outrange-bx" x="2" y="56" width="250" height="34" rx="6"/><text class="dsh-z2-outrange-tk dsh-z2-outrange-sm" x="14" y="78">SYN</text><text class="dsh-z2-outrange-m dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-r" x="250" y="78">n=1  d=0</text></g>
<g class="a dsh-z2-outrange-e2"><rect class="dsh-z2-outrange-bx" x="2" y="100" width="250" height="34" rx="6"/><text class="dsh-z2-outrange-tk dsh-z2-outrange-sm" x="14" y="122">ACK, пустой</text><text class="dsh-z2-outrange-m dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-r" x="250" y="122">n=2  d=0</text></g>
<g class="a dsh-z2-outrange-e3"><rect class="dsh-z2-outrange-bxa" x="2" y="144" width="250" height="34" rx="6"/><text class="dsh-z2-outrange-tk dsh-z2-outrange-sm" x="14" y="166">ClientHello / HTTP</text><text class="dsh-z2-outrange-m dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-r" x="250" y="166">n=3  d=1</text></g>
<g class="a dsh-z2-outrange-e4"><rect class="dsh-z2-outrange-bx" x="520" y="56" width="250" height="34" rx="6"/><text class="dsh-z2-outrange-tk dsh-z2-outrange-sm" x="532" y="78">SYN-ACK</text><text class="dsh-z2-outrange-m dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-r" x="768" y="78">n=1  d=0</text></g>
<g class="a dsh-z2-outrange-e5"><text class="dsh-z2-outrange-mu dsh-z2-outrange-sm" x="520" y="126">для --out-range не считается:</text><text class="dsh-z2-outrange-mu dsh-z2-outrange-sm" x="520" y="146">это входящий пакет</text></g>
<g class="a dsh-z2-outrange-e6"><text class="dsh-z2-outrange-t" x="2" y="214">data-пакет (d) — тот, где есть данные приложения; пустые ACK, FIN и RST d не получают.</text></g>
