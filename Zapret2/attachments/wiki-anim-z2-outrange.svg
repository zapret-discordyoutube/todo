<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-outrange" viewBox="0 0 960 504" width="960" height="504" role="img" aria-labelledby="dsh-z2-outrange-t dsh-z2-outrange-d">
<title id="dsh-z2-outrange-t">Как считаются пакеты в --out-range: n и d</title>
<desc id="dsh-z2-outrange-d">Счётчик n считает все пакеты нужного направления, счётчик d — только пакеты с данными. SYN и пустой ACK дают d=0, ClientHello — d=1. --out-range считает только исходящие пакеты, --in-range — только входящие. Ниже — какие d попадают под -d10, d1-d10, d1&lt;d10 и d5-.</desc>
<style>.dsh-z2-outrange{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-z2-outrange{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-z2-outrange .dsh-z2-outrange-bg{fill:var(--bg)}.dsh-z2-outrange text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-z2-outrange .dsh-z2-outrange-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-outrange .dsh-z2-outrange-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-outrange .dsh-z2-outrange-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-outrange .dsh-z2-outrange-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-z2-outrange .dsh-z2-outrange-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-z2-outrange .dsh-z2-outrange-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-z2-outrange .dsh-z2-outrange-sm{font-size:14.5px}.dsh-z2-outrange .dsh-z2-outrange-mu{fill:var(--mute)}.dsh-z2-outrange .dsh-z2-outrange-fg{fill:var(--fg)}.dsh-z2-outrange .dsh-z2-outrange-acc{fill:var(--acc)}.dsh-z2-outrange .dsh-z2-outrange-rej{fill:var(--rej)}.dsh-z2-outrange .dsh-z2-outrange-c{text-anchor:middle}.dsh-z2-outrange .dsh-z2-outrange-r{text-anchor:end}.dsh-z2-outrange .dsh-z2-outrange-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-z2-outrange .dsh-z2-outrange-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-z2-outrange .dsh-z2-outrange-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-z2-outrange .dsh-z2-outrange-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-z2-outrange .dsh-z2-outrange-bxn{fill:none;stroke:none}.dsh-z2-outrange .dsh-z2-outrange-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-z2-outrange .dsh-z2-outrange-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-z2-outrange .dsh-z2-outrange-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-z2-outrange .dsh-z2-outrange-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-z2-outrange .dsh-z2-outrange-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-outrange .dsh-z2-outrange-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-outrange .dsh-z2-outrange-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-z2-outrange .dsh-z2-outrange-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-z2-outrange .dsh-z2-outrange-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-z2-outrange .dsh-z2-outrange-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-outrange .dsh-z2-outrange-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-z2-outrange .dsh-z2-outrange-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-outrange .dsh-z2-outrange-bxbg{fill:var(--bg);stroke:none}.dsh-z2-outrange .dsh-z2-outrange-hd-a{fill:var(--acc)}.dsh-z2-outrange .dsh-z2-outrange-hd-f{fill:var(--fg2)}.dsh-z2-outrange .dsh-z2-outrange-hd-r{fill:var(--rej)}.dsh-z2-outrange .dsh-z2-outrange-dot{fill:var(--acc)}.dsh-z2-outrange .dsh-z2-outrange-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-z2-outrange .dsh-z2-outrange-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-z2-outrange .dsh-z2-outrange-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-z2-outrange .dsh-z2-outrange-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-z2-outrange .a{animation-duration:16s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-z2-outrange .a{animation:none}.dsh-z2-outrange .tr{display:none}}figure.dsh-z2-outrange-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-z2-outrange-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-z2-outrange-k1{0.0%{opacity:0;transform:translate(-30px,0px)}3.75%{opacity:0;transform:translate(-30px,0px)}5.0%{opacity:1;transform:translate(-30px,0px)}8.75%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-outrange .dsh-z2-outrange-e1{animation-name:dsh-z2-outrange-k1}@keyframes dsh-z2-outrange-k2{0.0%{opacity:0;transform:translate(-30px,0px)}10.625%{opacity:0;transform:translate(-30px,0px)}11.875%{opacity:1;transform:translate(-30px,0px)}15.625%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-outrange .dsh-z2-outrange-e2{animation-name:dsh-z2-outrange-k2}@keyframes dsh-z2-outrange-k3{0.0%{opacity:0;transform:translate(-30px,0px)}17.5%{opacity:0;transform:translate(-30px,0px)}18.75%{opacity:1;transform:translate(-30px,0px)}22.5%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)