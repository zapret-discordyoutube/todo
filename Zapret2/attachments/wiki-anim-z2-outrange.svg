<text class="dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-c" x="646.0" y="308">d9</text>
<text class="dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-c" x="702.0" y="308">d10</text>
<text class="dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-c" x="758.0" y="308">d11</text>
<text class="dsh-z2-outrange-mu dsh-z2-outrange-sm dsh-z2-outrange-c" x="814.0" y="308">d12</text>
