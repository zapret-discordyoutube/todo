<svg xmlns="http://www.w3.org/2000/svg" class="dsh-z2-profile" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="dsh-z2-profile-t dsh-z2-profile-d">
<title id="dsh-z2-profile-t">Анатомия профиля: три роли флагов</title>
<desc id="dsh-z2-profile-d">Флаги профиля делятся на три роли. Фильтры профиля решают, какие соединения ему достаются; если не совпали — проверяется следующий профиль. Внутрипрофильные условия решают, к каким пакетам применять стратегию; если не подошли — пакет остаётся в этом профиле, но стратегия его пропускает. Стратегия — это вызовы --lua-desync по порядку.</desc>
<style>.dsh-z2-profile{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-z2-profile{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-z2-profile .dsh-z2-profile-bg{fill:var(--bg)}.dsh-z2-profile text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-z2-profile .dsh-z2-profile-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-profile .dsh-z2-profile-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-profile .dsh-z2-profile-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-z2-profile .dsh-z2-profile-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-z2-profile .dsh-z2-profile-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-z2-profile .dsh-z2-profile-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-z2-profile .dsh-z2-profile-sm{font-size:14.5px}.dsh-z2-profile .dsh-z2-profile-mu{fill:var(--mute)}.dsh-z2-profile .dsh-z2-profile-fg{fill:var(--fg)}.dsh-z2-profile .dsh-z2-profile-acc{fill:var(--acc)}.dsh-z2-profile .dsh-z2-profile-rej{fill:var(--rej)}.dsh-z2-profile .dsh-z2-profile-c{text-anchor:middle}.dsh-z2-profile .dsh-z2-profile-r{text-anchor:end}.dsh-z2-profile .dsh-z2-profile-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-z2-profile .dsh-z2-profile-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-z2-profile .dsh-z2-profile-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-z2-profile .dsh-z2-profile-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-z2-profile .dsh-z2-profile-bxn{fill:none;stroke:none}.dsh-z2-profile .dsh-z2-profile-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-z2-profile .dsh-z2-profile-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-z2-profile .dsh-z2-profile-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-z2-profile .dsh-z2-profile-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-z2-profile .dsh-z2-profile-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-profile .dsh-z2-profile-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-profile .dsh-z2-profile-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-z2-profile .dsh-z2-profile-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-z2-profile .dsh-z2-profile-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-z2-profile .dsh-z2-profile-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-z2-profile .dsh-z2-profile-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-z2-profile .dsh-z2-profile-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-z2-profile .dsh-z2-profile-bxbg{fill:var(--bg);stroke:none}.dsh-z2-profile .dsh-z2-profile-hd-a{fill:var(--acc)}.dsh-z2-profile .dsh-z2-profile-hd-f{fill:var(--fg2)}.dsh-z2-profile .dsh-z2-profile-hd-r{fill:var(--rej)}.dsh-z2-profile .dsh-z2-profile-dot{fill:var(--acc)}.dsh-z2-profile .dsh-z2-profile-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-z2-profile .dsh-z2-profile-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-z2-profile .dsh-z2-profile-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-z2-profile .dsh-z2-profile-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-z2-profile .a{animation-duration:16s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-z2-profile .a{animation:none}.dsh-z2-profile .tr{display:none}}figure.dsh-z2-profile-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-z2-profile-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-z2-profile-k1{0.0%{opacity:0;transform:translate(0px,0px)}1.875%{opacity:0;transform:translate(0px,0px)}3.438%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e1{animation-name:dsh-z2-profile-k1}@keyframes dsh-z2-profile-k2{0.0%{opacity:0;transform:translate(0px,0px)}3.125%{opacity:0;transform:translate(0px,0px)}4.688%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e2{animation-name:dsh-z2-profile-k2}@keyframes dsh-z2-profile-k3{0.0%{opacity:0;transform:translate(0px,0px)}4.062%{opacity:0;transform:translate(0px,0px)}5.625%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e3{animation-name:dsh-z2-profile-k3}@keyframes dsh-z2-profile-k4{0.0%{opacity:0;transform:translate(0px,0px)}6.25%{opacity:0;transform:translate(0px,0px)}7.812%{opacity:1;transform:translate(0px,0px)}96.562%{opacity: