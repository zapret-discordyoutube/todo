le .dsh-z2-profile-e9{animation-name:dsh-z2-profile-k9}@keyframes dsh-z2-profile-k10{0.0%{opacity:0;transform:translate(0px,0px)}35.0%{opacity:0;transform:translate(0px,0px)}36.875%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e10{animation-name:dsh-z2-profile-k10}@keyframes dsh-z2-profile-k11{0.0%{opacity:0;transform:translate(0px,0px)}36.25%{opacity:0;transform:translate(0px,0px)}38.125%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e11{animation-name:dsh-z2-profile-k11}@keyframes dsh-z2-profile-k12{0.0%{opacity:0;transform:translate(0px,0px)}50.0%{opacity:0;transform:translate(0px,0px)}51.875%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e12{animation-name:dsh-z2-profile-k12}@keyframes dsh-z2-profile-k13{0.0%{opacity:0;transform:translate(0px,0px)}51.25%{opacity:0;transform:translate(0px,0px)}53.125%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e13{animation-name:dsh-z2-profile-k13}@keyframes dsh-z2-profile-k14{0.0%{opacity:0;transform:translate(0px,0px)}66.25%{opacity:0;transform:translate(0px,0px)}68.438%{opacity:1;transform:translate(0px,0px)}96.562%{opacity:1;transform:translate(0px,0px)}99.062%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-z2-profile .dsh-z2-profile-e14{animation-name:dsh-z2-profile-k14}.dsh-z2-profile .dsh-z2-profile-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-z2-profile-bg" x="0" y="0" width="960" height="410"/>
<g class="a dsh-z2-profile-e1"><text class="dsh-z2-profile-m dsh-z2-profile-fg" x="24" y="72">--name=youtube.com (интерфейс)</text></g>
<g class="a dsh-z2-profile-e2"><text class="dsh-z2-profile-mu dsh-z2-profile-sm" x="430" y="72">подпись в GUI и логах, на трафик не влияет</text></g>
<g class="a dsh-z2-profile-e3"><text class="dsh-z2-profile-m dsh-z2-profile-fg" x="24" y="116">--filter-tcp=80,443</text></g>
<g class="a dsh-z2-profile-e4"><text class="dsh-z2-profile-m dsh-z2-profile-fg" x="24" y="160">--hostlist=lists/youtube.txt</text></g>
<g class="a dsh-z2-profile-e5"><text class="dsh-z2-profile-m dsh-z2-profile-fg" x="24" y="204">--out-range=-d8</text></g>
<g class="a dsh-z2-profile-e6"><text class="dsh-z2-profile-m dsh-z2-profile-fg" x="24" y="248">--payload=tls_client_hello</text></g>
<g class="a dsh-z2-profile-e7"><text class="dsh-z2-profile-m dsh-z2-profile-fg" x="24" y="292">--lua-desync=multisplit:pos=1,host+2,…:seqovl=1</text></g>
<g class="a dsh-z2-profile-e8"><rect class="dsh-z2-profile-bxa" x="2" y="92" width="410" height="82" rx="8"/></g>
<g class="a dsh-z2-profile-e9"><line class="dsh-z2-profile-la" x1="414" y1="96" x2="414" y2="170"/><text class="dsh-z2-profile-tk dsh-z2-profile-sm" x="430" y="131.0">1. Какие соединения достаются</text><text class="dsh-z2-profile-mu dsh-z2-profile-sm" x="430" y="151.0">не совпало — проверяется следующий профиль</text></g>
<g class="a dsh-z2-profile-e10"><rect class="dsh-z2-profile-bxa" x="2" y="180" width="410" height="82" rx="8"/></g>
<g class="a dsh-z2-profile-e11"><line class="dsh-z2-profile-la" x1="414" y1="184" x2="414" y2="258"/><text class="dsh-z2-profile-tk dsh-z2-profile-sm" x="430" y="219.0">2. К каким пакетам применять</text><text class="dsh-z2-profile-mu dsh-z2-profile-sm" x="430" y="239.0">не подошло — пакет остаётся в профиле,</text><text class="dsh-z2-profile-mu dsh-z2-profile-sm" x="430" y="257.0">стратегия его пропускает</text></g>
<g class="a dsh-z2-profile-e12"><rect class="dsh-z2-profile-bxa" x="2" y="268" width="548" height="38" rx="8"/></g>
<g class="a dsh-z2-profile-e13"><line class="dsh-z2-profile-la" x1="560" y1="272" x2="560" y2="302"/><text class="dsh-z2-profile-tk dsh-z2-profile-sm" x="575" y="285.0">3. Что делать</text><text class="dsh-z2-profile-mu dsh-z2-profile-sm" x="575" y="305.0">вызовы по порядку</text></g>
<g class="a dsh-z2-profile-e14"><text class="dsh-z2-profile-mu dsh-z2-profile-sm" x="2" y="372">Условия второй группы в выбор профиля не участвуют: они действуют на идущие после них --lua-desync</text><text class="dsh-z2-profile-mu dsh-z2-profile-sm" x="2" y="391">внутри уже выбранного профиля.</text></g>
</svg>
