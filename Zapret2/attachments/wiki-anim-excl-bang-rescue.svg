<svg xmlns="http://www.w3.org/2000/svg" class="dsh-excl-bang-rescue" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="dsh-excl-bang-rescue-t dsh-excl-bang-rescue-d">
<title id="dsh-excl-bang-rescue-t">«!» возвращает заблокированный сайт из профиля-исключения в обход</title>
<desc id="dsh-excl-bang-rescue-d">Профиль «Исключения домены» со стратегией pass ловит всю зону ru, кроме строки !torrents.ru. mail.ru попадает в pass и идёт без изменений. torrents.ru из этого списка исключён, поэтому профиль его не берёт, и соединение достаётся профилю «Все сайты» с обходом.</desc>
