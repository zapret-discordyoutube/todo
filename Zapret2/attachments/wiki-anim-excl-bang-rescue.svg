<g class="a dsh-excl-bang-rescue-e3 tr"><text class="dsh-excl-bang-rescue-tk" x="2" y="270">mail.ru не трогаем: он открывается и так</text></g>
<g class="a dsh-excl-bang-rescue-e4 tr"><rect class="dsh-excl-bang-rescue-bxbg" x="685.0" y="9.0" width="230" height="34" rx="6"/><rect class="dsh-excl-bang-rescue-bxa" x="685.0" y="9.0" width="230" height="34" rx="6"/><text class="dsh-excl-bang-rescue-mk dsh-excl-bang-rescue-sm dsh-excl-bang-rescue-c" x="800" y="31">torrents.ru:443</text></g>
<g class="a dsh-excl-bang-rescue-e5 tr"><rect class="dsh-excl-bang-rescue-bxd" x="2" y="50" width="470" height="70" rx="10"/><text class="dsh-excl-bang-rescue-rej dsh-excl-bang-rescue-sm" x="500" y="92">✕ «!torrents.ru» — не в этом списке</text></g>
<g class="a dsh-excl-bang-rescue-e6 tr"><rect class="dsh-excl-bang-rescue-bxa" x="2" y="142" width="470" height="70" rx="10"/><text class="dsh-excl-bang-rescue-acc dsh-excl-bang-rescue-sm" x="500" y="184">✓ совпал — стратегия обхода</text></g>
<g class="a dsh-excl-bang-rescue-e7 tr"><text class="dsh-excl-bang-rescue-tk" x="2" y="270">torrents.ru заблокирован — и получает обход</text></g>
<g class="a dsh-excl-bang-rescue-e8"><text class="dsh-excl-bang-rescue-t" x="2" y="330">Строку «!torrents.ru» пишут в список самого профиля-исключения: исключение действует только</text><text class="dsh-excl-bang-rescue-t" x="2" y="352">внутри своего файла, поэтому дописывать её в другие профили не нужно.</text></g>
