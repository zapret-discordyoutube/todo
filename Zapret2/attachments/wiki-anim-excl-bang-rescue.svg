<rect class="dsh-excl-bang-rescue-bx" x="2" y="142" width="470" height="70" rx="10"/><text class="dsh-excl-bang-rescue-tk dsh-excl-bang-rescue-sm" x="20" y="172">Все сайты · стратегия обхода</text><text class="dsh-excl-bang-rescue-m dsh-excl-bang-rescue-mu dsh-excl-bang-rescue-sm" x="20" y="196">--filter-tcp=443</text>
