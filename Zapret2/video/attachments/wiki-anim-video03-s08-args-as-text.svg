-args-as-text-k10}@keyframes v03-s08-args-as-text-k11{0.0%{opacity:0}41.562%{opacity:0}42.969%{opacity:1}96.562%{opacity:1}98.438%{opacity:0}100%{opacity:0}}.v03-s08-args-as-text .e11{animation-name:v03-s08-args-as-text-k11}@keyframes v03-s08-args-as-text-k12{0.0%{opacity:0}46.875%{opacity:0}48.281%{opacity:1}96.562%{opacity:1}98.438%{opacity:0}100%{opacity:0}}.v03-s08-args-as-text .e12{animation-name:v03-s08-args-as-text-k12}@keyframes v03-s08-args-as-text-k13{0.0%{opacity:0}54.375%{opacity:0}55.781%{opacity:1}96.562%{opacity:1}98.438%{opacity:0}100%{opacity:0}}.v03-s08-args-as-text .e13{animation-name:v03-s08-args-as-text-k13}@keyframes v03-s08-args-as-text-k14{0.0%{opacity:0}65.625%{opacity:0}67.031%{opacity:1}96.562%{opacity:1}98.438%{opacity:0}100%{opacity:0}}.v03-s08-args-as-text .e14{animation-name:v03-s08-args-as-text-k14}@keyframes v03-s08-args-as-text-k15{0.0%{opacity:0}72.5%{opacity:0}73.906%{opacity:1}96.562%{opacity:1}98.438%{opacity:0}100%{opacity:0}}.v03-s08-args-as-text .e15{animation-name:v03-s08-args-as-text-k15}</style>
<rect class="bg" x="0" y="0" width="960" height="548"/>
<g class="a e1"><text class="cap" x="10" y="22">аргументы вызова приходят в Lua текстом</text></g>
<g class="a e2"><text class="sm mu" x="10" y="56">в нашем тесте блоб создала команда:</text><rect class="bxa" x="300" y="36" width="290" height="30" rx="6"/><text class="mk" x="312" y="57">--blob=myblob:0xAABBCCDD</text></g>
<g class="a e3"><path class="la" d="M592 51L604.0 51.0"/><polygon class="ha" points="614,51 604.0,56.0 604.0,46.0"/><rect class="bxa" x="620" y="36" width="48" height="30" rx="5"/><text class="mk c" x="644" y="57">AA</text><rect class="bxa" x="674" y="36" width="48" height="30" rx="5"/><text class="mk c" x="698" y="57">BB</text><rect class="bxa" x="728" y="36" width="48" height="30" rx="5"/><text class="mk c" x="752" y="57">CC</text><rect class="bxa" x="782" y="36" width="48" height="30" rx="5"/><text class="mk c" x="806" y="57">DD</text></g>
<g class="a e4"><text class="sm mu" x="620" y="84">блоб myblob: четыре байта</text></g>
<g class="a e5"><path class="lm" d="M10 98L950 98"/><text class="cap" x="10" y="119">записано в опции</text><text class="cap" x="250" y="119">функция получила</text><text class="cap" x="520" y="119">почему</text></g>
<g class="a e6"><rect class="bx" x="10" y="130" width="940" height="30" rx="6"/><text class="mk" x="22" y="150">a=1</text><path class="lm" d="M196 145L222.0 145.0"/><polygon class="hm" points="232,145 222.0,150.0 222.0,140.0"/><text class="mk" x="250" y="150">&quot;1&quot;</text><text class="sm" x="520" y="150">строка из одного символа, не число</text></g>
<g class="a e7"><rect class="bx" x="10" y="166" width="940" height="30" rx="6"/><text class="mk" x="22" y="186">b</text><path class="lm" d="M196 181L222.0 181.0"/><polygon class="hm" points="232,181 222.0,186.0 222.0,176.0"/><text class="mk" x="250" y="186">&quot;&quot;</text><text class="sm" x="520" y="186">нет знака «=»: пустая строка</text></g>
<g class="a e8"><rect class="bx" x="10" y="202" width="940" height="30" rx="6"/><text class="mk" x="22" y="222">c=</text><path class="lm" d="M196 217L222.0 217.0"/><polygon class="hm" points="232,217 222.0,222.0 222.0,212.0"/><text class="mk" x="250" y="222">&quot;&quot;</text><text class="sm" x="520" y="222">знак «=» и пустое значение: пустая строка</text></g>
<g class="a e9"><rect class="bxa" x="10" y="238" width="940" height="30" rx="6"/><text class="mk" x="22" y="258">d=%myblob</text><path class="lm" d="M196 253L222.0 253.0"/><polygon class="hm" points="232,253 222.0,258.0 222.0,248.0"/><text class="mk" x="250" y="258">AA BB CC DD</text><text class="sm" x="520" y="258">«%» подставляет сам блоб: четыре байта</text></g>
<g class="a e10"><rect class="bxa" x="10" y="274" width="940" height="30" rx="6"/><text class="mk" x="22" y="294">e=#myblob</text><path class="lm" d="M196 289L222.0 289.0"/><polygon class="hm" points="232,289 222.0,294.0 222.0,284.0"/><text class="mk" x="250" y="294">&quot;4&quot;</text><text class="sm" x="520" y="294">«#» подставляет длину блоба, тоже текстом</text></g>
<g class="a e11"><rect class="bx" x="10" y="310" width="940" height="30" rx="6"/><text class="mk" x="22" y="330">f=\%myblob</text><path class="lm" d="M196 325L222.0 325.0"/><polygon class="hm" points="232,325 222.0,330.0 222.0,320.0"/><text class="mk" x="250" y="330">&quot;%myblob&quot;</text><text class="sm" x="520" y="330">косая черта отключила подстановку и ушла</text></g>
<g class="a e12"><rect class="bx" x="10" y="346" width="940" height="30" rx="6"/><text class="mk" x="22" y="366">g=\#myblob</text><path class="lm" d="M196 361L222.0 361.0"/><polygon class="hm" points="232,361 222.0,366.0 222.0,356.0"/><text class="mk" x="250" y="366">&quot;#myblob&quot;</text><text class="sm" x="520" y="366">то же для «#»</text></g>
<g class="a e13"><rect class="bxr" x="10" y="392" width="940" height="76" rx="8"/><text class="mk" x="22" y="414">x=%nope</text><text class="sm" x="150" y="414">блоба с таким именем нет:</text><text class="m rej" x="22" y="438">blob &#x27;nope&#x27; unavailable</text><text class="m rej" x="300" y="438">desync ERROR. passing packet unmodified.</text><text class="sm" x="22" y="460">функция не запускается, остальные вызовы этого пакета тоже, пакет проходит без изменений</text></g>
<g class="a e14"><text class="sm" x="10" y="494">Три готовых блоба есть в программе всегда: они нужны стратегиям с подделкой пакетов.</text></g>
<g class="a e15"><text class="tk" x="10" y="522">Всё приходит текстом: «%» подставляет блоб, «#» его длину, «\» отключает подстановку.</text></g>
</svg>
