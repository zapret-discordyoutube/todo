<svg xmlns="http://www.w3.org/2000/svg" class="v03-s08-args-as-text" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="v03-s08-args-as-text-t v03-s08-args-as-text-d">
<title id="v03-s08-args-as-text-t">Что получает функция: аргументы текстом</title>
<desc id="v03-s08-args-as-text-d">Что получает функция: всё записанное в опции приходит в Lua текстом; в лабораторном опыте a=1 пришло строкой «1», аргумент без знака равно и с пустым значением пустой строкой, d=%myblob четырьмя байтами блоба AA BB CC DD, e=#myblob строкой «4» (длиной блоба), а косая черта перед процентом или решёткой отключила подстановку; если блоба с таким именем нет, программа пишет, что блоб недоступен, и пакет проходит без изменений (nfq2/lua.c:1788-1849).</desc>
<style>
.v03-s08-args-as-text{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v03-s08-args-as-text{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v03-s08-args-as-text .bg{fill:var(--bg)}
.v03-s08-args-as-text text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v03-s08-args-as-text .tk{font-weight:600;fill:var(--fg)}
.v03-s08-args-as-text .sm{font-size:14.5px}
.v03-s08-args-as-text .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v03-s08-args-as-text .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v03-s08-args-as-text .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v03-s08-args-as-text .cd{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;fill:var(--fg);stroke:none}
.v03-s08-args-as-text .ln{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--mute);stroke:none}
.v03-s08-args-as-text .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v03-s08-args-as-text .mu{fill:var(--mute)}.v03-s08-args-as-text .fg{fill:var(--fg)}.v03-s08-args-as-text .acc{fill:var(--acc)}.v03-s08-args-as-text .rej{fill:var(--rej)}.v03-s08-args-as-text .ok{fill:var(--ok)}.v03-s08-args-as-text .amb{fill:var(--amb)}
.v03-s08-args-as-text .inv{fill:var(--bg);stroke:none}
.v03-s08-args-as-text .nst{stroke:none}
.v03-s08-args-as-text .c{text-anchor:middle}.v03-s08-args-as-text .r{text-anchor:end}
.v03-s08-args-as-text .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v03-s08-args-as-text .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v03-s08-args-as-text .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v03-s08-args-as-text .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v03-s08-args-as-text .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v03-s08-args-as-text .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v03-s08-args-as-text .bxk{fill:var(--fg2);stroke:var(--fg);stroke-width:1.4}
.v03-s08-args-as-text .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v03-s08-args-as-text .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v03-s08-args-as-text .hl{fill:var(--tint);stroke:none}
.v03-s08-args-as-text .hlb{fill:var(--ambt);stroke:none}
.v03-s08-args-as-text .dim{fill:var(--bg);fill-opacity:.62;stroke:none}
.v03-s08-args-as-text .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v03-s08-args-as-text .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v03-s08-args-as-text .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v03-s08-args-as-text .la{fill:none;stroke:var(--acc);stroke-width:2}
.v03-s08-args-as-text .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v03-s08-args-as-text .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s08-args-as-text .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s08-args-as-text .hf{fill:var(--fg2)}.v03-s08-args-as-text .ha{fill:var(--acc)}.v03-s08-args-as-text .hr{fill:var(--rej)}.v03-s08-args-as-text .hm{fill:var(--mute)}.v03-s08-args-as-text .hb{fill:var(--amb)}.v03-s08-args-as-text .ho{fill:var(--ok)}
.v03-s08-args-as-text .dot{fill:var(--mute);stroke:none}.v03-s08-args-as-text .dota{fill:var(--acc);stroke:none}.v03-s08-args-as-text .doto{fill:var(--ok);stroke:none}.v03-s08-args-as-text .dotr{fill:var(--rej);stroke:none}
.v03-s08-args-as-text .a{animation-duration:32s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v03-s08-args-as-text .a{animation:none}.v03-s08-args-as-text .tr{display:none}}
