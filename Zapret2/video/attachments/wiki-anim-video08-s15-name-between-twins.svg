<svg xmlns="http://www.w3.org/2000/svg" class="v08-s15-name-between-twins" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="v08-s15-name-between-twins-t v08-s15-name-between-twins-d">
<title id="v08-s15-name-between-twins-t">Имя между двойниками: пять пакетов</title>
<desc id="v08-s15-name-between-twins-d">Имя между двойниками, функция сама ставит разрезы по меткам host и endhost и не читает pos: на проводе пять пакетов, настоящая часть до имени с номером 1 и длиной 97, двойник с номером 98 и длиной 15, настоящее имя с тем же номером и теми же 15 байтами, тот же двойник ещё раз и настоящий хвост с номером 113 и длиной 138, сервер отвечает «жду байт номер 98» после первого пакета и «жду байт номер 251» после последнего, на двойников не отвечает, 97 плюс 15 плюс 138 дают 250 байт, пакетов пять, а не шесть, потому что двойник один и отправлен дважды, приложение читает оригинал, а счётчик ядра насчитал два отброшенных пакета.</desc>
