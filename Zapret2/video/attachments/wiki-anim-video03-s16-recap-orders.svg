<svg xmlns="http://www.w3.org/2000/svg" class="v03-s16-recap-orders" viewBox="0 0 960 820" width="960" height="820" role="img" aria-labelledby="v03-s16-recap-orders-t v03-s16-recap-orders-d">
<title id="v03-s16-recap-orders-t">Итог выпуска: чтение строки</title>
<desc id="v03-s16-recap-orders-d">Итог выпуска: шесть карточек (профили, три вида опций, стратегия как вызовы функций, условия профиля, диапазоны, способ чтения), три вида порядка (вызовы профиля идут все по порядку записи, из повторных аргументов побеждает записанный первым, из подходящих профилей побеждает первый подошедший), опыт на одиннадцати пакетах (самописец записал все, multisplit сработал один раз на приветствии) и вопрос к следующему выпуску про метки в аргументе pos=midsld.</desc>
<style>.v03-s16-recap-orders{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v03-s16-recap-orders{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
