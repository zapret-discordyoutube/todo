.v03-s16-recap-orders .hb{fill:var(--acc);font-weight:700}.v03-s16-recap-orders .hbr{fill:var(--rej);font-weight:700}.v03-s16-recap-orders .hbo{fill:var(--ok);font-weight:700}.v03-s16-recap-orders .hbb{fill:var(--amb);font-weight:700}
