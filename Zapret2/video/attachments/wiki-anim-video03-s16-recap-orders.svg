<rect class="bg" x="0" y="0" width="960" height="820"/>
<g class="a e1"><text class="cap" x="10" y="24">итог выпуска: что мы научились читать в командной строке</text></g>
<g class="a e2"><rect class="bx" x="10" y="40" width="306" height="96" rx="8"/><text class="tk" x="24" y="66">профили</text><text class="sm" x="24" y="89">профиль 1 есть до первой опции;</text><text class="sm" x="24" y="107">--new начинает чистый лист;</text><text class="sm" x="24" y="125">в конце пустой no_action</text></g>
<g class="a e3"><rect class="bx" x="327" y="40" width="306" height="96" rx="8"/><text class="tk" x="341" y="66">три вида опций</text><text class="sm" x="341" y="89">общие, профильные и «ручка»;</text><text class="sm" x="341" y="107">ручка копируется в вызов правее:</text><text class="sm" x="341" y="125">порядок слов важен</text></g>
<g class="a e4"><rect class="bx" x="644" y="40" width="306" height="96" rx="8"/><text class="tk" x="658" y="66">стратегия: вызовы функций</text><text class="sm" x="658" y="89">вызовы идут в порядке записи;</text><text class="sm" x="658" y="107">у каждого своё имя; аргументы</text><text class="sm" x="658" y="125">приходят текстом</text></g>
<g class="a e5"><rect class="bx" x="10" y="146" width="306" height="96" rx="8"/><text class="tk" x="24" y="172">условия профиля</text><text class="sm" x="24" y="195">порт сервера, протокол, списки</text><text class="sm" x="24" y="213">имён и адресов; один фильтр</text><text class="sm" x="24" y="231">транспорта отключает остальные</text></g>
<g class="a e6"><rect class="bx" x="327" y="146" width="306" height="96" rx="8"/><text class="tk" x="341" y="172">диапазоны</text><text class="sm" x="341" y="195">n, d, b: «-» включает верхнюю</text><text class="sm" x="341" y="213">границу, «&lt;» исключает;</text><text class="sm" x="341" y="231">d1-d1: пока счётчик равен 1</text></g>
<g class="a e7"><rect class="bx" x="644" y="146" width="306" height="96" rx="8"/><text class="tk" x="658" y="172">способ чтения</text><text class="sm" x="658" y="195">шесть шагов: служебное, профили,</text><text class="sm" x="658" y="213">условия, слева направо, вызовы,</text><text class="sm" x="658" y="231">сверка с журналом</text></g>
<g class="a e8"><text class="cap" x="10" y="280">порядок встречается в строке трижды</text></g>
<g class="a e9"><rect class="bx" x="10" y="292" width="940" height="50" rx="8"/><text class="tk" x="24" y="323">вызовы внутри профиля</text><text class="sm" x="290" y="323">идут в порядке записи, все</text><rect class="bxo" x="600" y="304" width="48.9" height="28" rx="6"/><text class="m fg" x="607" y="322.5">pcap</text><path class="lm" d="M654.9 318L662.9 318.0"/><polygon class="hm" points="672.9,318 662.9,323.0 662.9,313.0"/><rect class="bxo" x="676.9" y="304" width="101.3" height="28" rx="6"/><text class="m fg" x="683.9" y="322.5">multisplit</text><text class="sm" x="788.1999999999999" y="323">оба</text></g>
<g class="a e10"><rect class="bx" x="10" y="350" width="940" height="50" rx="8"/><text class="tk" x="24" y="381">повторный аргумент</text><text class="sm" x="290" y="381">побеждает записанный первым</text><rect class="bxo" x="600" y="362" width="57.6" height="28" rx="6"/><text class="m fg" x="607" y="380.5">pos=2</text><rect class="bxg" x="665.6" y="362" width="101.3" height="28" rx="6"/><text class="m mu" x="672.6" y="380.5">pos=midsld</text><text class="sm" x="776.9" y="381">→ 2 + 248</text></g>
<g class="a e11"><rect class="bx" x="10" y="408" width="940" height="50" rx="8"/><text class="tk" x="24" y="439">подходящие профили</text><text class="sm" x="290" y="439">побеждает первый подошедший</text><rect class="bxo" x="600" y="420" width="92.6" height="28" rx="6"/><text class="m fg" x="607" y="438.5">профиль 1</text><rect class="bxg" x="700.6" y="420" width="92.6" height="28" rx="6"/><text class="m mu" x="707.6" y="438.5">профиль 2</text><text class="sm" x="803.2" y="439">→ 2 + 248</text></g>
<g class="a e12"><text class="cap" x="10" y="484">опыт на одиннадцати пакетах</text></g>
<g class="a e13"><rect class="bxa" x="10" y="496" width="36" height="36" rx="5"/><text class="tk c" x="28.0" y="519.0">1</text><rect class="bxa" x="54" y="496" width="36" height="36" rx="5"/><text class="tk c" x="72.0" y="519.0">2</text><rect class="bxa" x="98" y="496" width="36" height="36" rx="5"/><text class="tk c" x="116.0" y="519.0">3</text><rect class="bxo" x="142" y="496" width="36" height="36" rx="5"/><text class="tk c" x="160.0" y="519.0">4</text><rect class="bxa" x="186" y="496" width="36" height="36" rx="5"/><text class="tk c" x="204.0" y="519.0">5</text><rect class="bxa" x="230" y="496" width="36" height="36" rx="5"/><text class="tk c" x="248.0" y="519.0">6</text><rect class="bxa" x="274" y="496" width="36" height="36" rx="5"/><text class="tk c" x="292.0" y="519.0">7</text><rect class="bxa" x="318" y="496" width="36" height="36" rx="5"/><text class="tk c" x="336.0" y="519.0">8</text><rect class="bxa" x="362" y="496" width="36" height="36" rx="5"/><text class="tk c" x="380.0" y="519.0">9</text><rect class="bxa" x="406" y="496" width="36" height="36" rx="5"/><text class="tk c" x="424.0" y="519.0">10</text><rect class="bxa" x="450" y="496" width="36" height="36" rx="5"/><text class="tk c" x="468.0" y="519.0">11</text><text class="tk" x="520" y="514">самописец записал все одиннадцать;</text><text class="sm" x="520" y="534">разрезальщик сработал один раз, на приветствии</text></g>
<g class="a e14"><text class="sm mu" x="10" y="552">синее: pcap записал; зелёное: multisplit разрезал пакет № 4</text></g>
<g class="a e15"><text class="sm mu" x="10" y="582">за кадром остались автоматические списки имён и режим сервера; устройство программы разбирают другие выпуски</text></g>
<g class="a e16"><text class="cap" x="10" y="614">в нашей строке осталось слово, которое мы только произносили</text></g>
<g class="a e17"><rect class="bxb" x="10" y="628" width="101.3" height="28" rx="6"/><text class="m fg" x="17" y="646.5"><tspan class="mu">pos=</tspan>midsld</text><text class="sm" x="131.3" y="647">какие ещё бывают метки, например host и endhost?</text></g>
<g class="a e18"><text class="sm" x="131.3" y="671">можно ли резать запрос в нескольких местах сразу?</text></g>
<g class="a e19"><text class="tk" x="10" y="706">следующий выпуск: «Где резать: метки»</text></g>
<g class="a e20"><text class="sm mu" x="10" y="742">дальше пойдут сами приёмы:</text><rect class="bxg" x="250" y="722" width="150" height="30" rx="7"/><text class="sm c" x="325" y="742">разрез на части</text><rect class="bxg" x="410" y="722" width="150" height="30" rx="7"/><text class="sm c" x="485" y="742">перестановка</text><rect class="bxg" x="570" y="722" width="150" height="30" rx="7"/><text class="sm c" x="645" y="742">подделка</text></g>
<g class="a e21"><rect class="bxb" x="10" y="770" width="940" height="38" rx="8"/><text class="sm tk" x="24" y="794">настоящее оборудование на пути пакетов не обсуждалось: только код программы и наша лаборатория</text></g>
</svg>
