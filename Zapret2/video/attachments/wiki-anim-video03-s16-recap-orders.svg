.v03-s16-recap-orders .la{fill:none;stroke:var(--acc);stroke-width:2}
.v03-s16-recap-orders .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s16-recap-orders .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s16-recap-orders .hf{fill:var(--fg2)}.v03-s16-recap-orders .ha{fill:var(--acc)}.v03-s16-recap-orders .hr{fill:var(--rej)}.v03-s16-recap-orders .hm{fill:var(--mute)}.v03-s16-recap-orders .ho{fill:var(--ok)}
.v03-s16-recap-orders .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v03-s16-recap-orders .a{animation-duration:33s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v03-s16-recap-orders .a{animation:none}.v03-s16-recap-orders .tr{display:none}}
