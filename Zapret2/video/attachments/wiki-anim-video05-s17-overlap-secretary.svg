<rect class="bg" x="0" y="0" width="960" height="612"/>
<g><text class="cap" x="40" y="24">накладка: лишние байты с номерами левее начала письма</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="280" height="30" rx="5"/><text class="sm c" x="180" y="54">midsld: разрез после 104 байт</text></g>
<g class="a e2"><rect class="bx" x="340" y="34" width="280" height="30" rx="5"/><text class="sm c" x="480" y="54">две части, оригинал выброшен</text></g>
<g class="a e3"><rect class="bx" x="640" y="34" width="280" height="30" rx="5"/><text class="sm c" x="780" y="54">сервер прочитал те же 250 байт</text></g>
<g class="a e4"><text class="sm tk" x="40" y="92">вопрос части: можно ли добавить в первый пакет лишнее так, чтобы сервер не заметил?</text></g>
<g class="a e5"><text class="sm" x="40" y="120">выдуманный пример: письмо из страниц, одна страница = один байт; секретарь начинает с номера 1</text></g>
<g class="a e6"><rect class="bxa" x="256" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="292" y="157">1</text><rect class="bxa" x="328" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="364" y="157">2</text><rect class="bxa" x="400" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="436" y="157">3</text><rect class="bxa" x="472" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="508" y="157">4</text><rect class="bxa" x="544" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="580" y="157">5</text><rect class="bxa" x="616" y="132" width="72" height="40" rx="0"/><text class="mk c" x="652" y="157">…</text></g>
<g class="a e7"><rect class="bxd" x="40" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="76" y="157">-3</text><rect class="bxd" x="112" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="148" y="157">-2</text><rect class="bxd" x="184" y="132" width="72" height="40" rx="0"/><text class="ix c fg tk" x="220" y="157">-1</text></g>
<g class="a e8"><text class="sm c amb" x="148" y="192">подкладка</text></g>
<g class="a e9"><text class="sm c acc" x="472" y="192">настоящие страницы</text></g>
<g class="a e10"><rect class="bx" x="40" y="212" width="880" height="74" rx="6"/><text class="sm tk" x="52" y="234">секретарь получателя</text><text class="sm" x="52" y="256">смотрит на номера</text><text class="sm" x="52" y="276">начинает с номера 1</text></g>
<g class="a e11"><rect class="bxd" x="320" y="224" width="40" height="30" rx="0"/><text class="ix c tk" x="340" y="244">-3</text><rect class="bxd" x="366" y="224" width="40" height="30" rx="0"/><text class="ix c tk" x="386" y="244">-2</text><rect class="bxd" x="412" y="224" width="40" height="30" rx="0"/><text class="ix c tk" x="432" y="244">-1</text><path class="lr" d="M450 239L474.0 239.0"/><polygon class="hr" points="484,239 474.0,244.0 474.0,234.0"/><rect class="bxr" x="490" y="220" width="150" height="40" rx="6"/><text class="sm c" x="565" y="245">корзина: 3 листа</text><text class="sm" x="320" y="278">меньше 1: выбрасывает</text></g>
<g class="a e12"><text class="sm tk" x="670" y="234">собирает письмо:</text><rect class="bxo" x="670" y="244" width="40" height="30" rx="0"/><text class="ix c tk" x="690" y="264">1</text><rect class="bxo" x="714" y="244" width="40" height="30" rx="0"/><text class="ix c tk" x="734" y="264">2</text><rect class="bxo" x="758" y="244" width="40" height="30" rx="0"/><text class="ix c tk" x="778" y="264">3</text><rect class="bxo" x="802" y="244" width="40" height="30" rx="0"/><text class="ix c tk" x="822" y="264">4</text><rect class="bxo" x="846" y="244" width="40" height="30" rx="0"/><text class="ix c tk" x="866" y="264">5</text></g>
<g class="a e13"><rect class="bx" x="40" y="300" width="880" height="74" rx="6"/><text class="sm tk" x="52" y="322">помощник проверяющего</text><text class="sm" x="52" y="344">номера не смотрит,</text><text class="sm" x="52" y="364">читает по порядку прихода</text></g>
<g class="a e14"><text class="sm tk" x="320" y="322">читает:</text><rect class="bxd" x="320" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="340" y="352">-3</text><rect class="bxd" x="366" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="386" y="352">-2</text><rect class="bxd" x="412" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="432" y="352">-1</text><rect class="bxo" x="458" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="478" y="352">1</text><rect class="bxo" x="504" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="524" y="352">2</text><rect class="bxo" x="550" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="570" y="352">3</text><rect class="bxo" x="596" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="616" y="352">4</text><rect class="bxo" x="642" y="332" width="40" height="30" rx="0"/><text class="ix c tk" x="662" y="352">5</text><text class="sm" x="700" y="352">начинает с подкладки</text></g>
<g class="a e15"><rect class="bxa" x="40" y="384" width="880" height="30" rx="5"/><text class="sm tk" x="52" y="404">главное: подкладка слева, настоящие страницы на своих номерах, первая под 1</text></g>
<g class="a e16"><rect class="bx" x="40" y="428" width="880" height="74" rx="6"/><text class="tk big" x="52" y="454">накладка</text><text class="mk" x="190" y="454">seqovl=N</text><text class="sm" x="310" y="454">N: сколько байт подложить перед первой частью</text><text class="sm mu" x="52" y="478">по-видимому, от английского sequence overlap («сиквенс оверлэп»); в коде расшифровки нет</text><text class="sm" x="52" y="496">подкладка = сами подложенные байты; накладка = приём</text></g>
<g class="a e17"><text class="cap" x="40" y="528">план части</text></g>
<g class="a e18"><rect class="bxb" x="40" y="538" width="280" height="58" rx="6"/><text class="sm" x="50" y="558">1 · накладка: код, провод, ответ</text><text class="sm" x="50" y="580">сервера, значения</text></g>
<g class="a e19"><rect class="bx" x="340" y="538" width="280" height="58" rx="6"/><text class="sm" x="350" y="558">2 · ответ движку; когда резать</text><text class="sm" x="350" y="580">нечего</text></g>
<g class="a e20"><rect class="bx" x="640" y="538" width="280" height="58" rx="6"/><text class="sm" x="650" y="558">3 · игрушечные проверяющие,</text><text class="sm" x="650" y="580">повторы клиента, итог</text></g>
</svg>
