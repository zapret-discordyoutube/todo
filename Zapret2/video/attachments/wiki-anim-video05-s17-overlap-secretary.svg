<svg xmlns="http://www.w3.org/2000/svg" class="v05-s17-overlap-secretary" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="v05-s17-overlap-secretary-t v05-s17-overlap-secretary-d">
<title id="v05-s17-overlap-secretary-t">Накладка: подкладка перед первой частью</title>
<desc id="v05-s17-overlap-secretary-d">Идея накладки на выдуманном письме из пронумерованных страниц: перед первой страницей отправитель подкладывает три листа с номерами минус три, минус два и минус один, секретарь получателя начинает с номера один и выбрасывает листы с меньшими номерами в корзину, а помощник проверяющего, который номера не смотрит и читает всё в порядке прихода, начинает чтение с этих трёх листов, при этом настоящие страницы остаются на своих номерах; приём называется накладкой, его задаёт аргумент seqovl с числом байт, подложенных перед первой частью, по-видимому от английского sequence overlap, но в коде расшифровки нет, а сами подложенные байты называются подкладкой; внизу план части из трёх пунктов: накладка в коде, на проводе и в ответе сервера, затем ответ движку и случаи когда резать нечего, затем два игрушечных проверяющих с повторами клиента и итог выпуска.</desc>
