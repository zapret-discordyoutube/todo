<svg xmlns="http://www.w3.org/2000/svg" class="v08-s19-two-instances-command" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="v08-s19-two-instances-command-t v08-s19-two-instances-command-d">
<title id="v08-s19-two-instances-command-t">Два экземпляра в одном профиле</title>
<desc id="v08-s19-two-instances-command-d">Два экземпляра в одном профиле: в игрушке на конвейере первый станок кладёт подложное письмо, второй режет настоящее, и у каждого станка своя табличка настроек; в строке запуска первый экземпляр это fake с заготовкой fake_default_tls и условием tcp_md5, второй это multisplit со списком из двух меток, один и midsld, они идут в порядке командной строки; журнал называет их функцией, профилем и позицией, поэтому fake стоит на позиции 2, а multisplit на позиции 3, потому что позицию 1 занимает запись трафика лаборатории; у каждого экземпляра свои аргументы, и условие tcp_md5 написано у fake, поэтому не переходит к multisplit, а настоящие части идут без опции MD5, тогда как условие у самого multisplit попало бы на настоящие части.</desc>
