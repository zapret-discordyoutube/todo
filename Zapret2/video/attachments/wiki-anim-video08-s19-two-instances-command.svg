<rect class="bg" x="0" y="0" width="960" height="668"/>
<g><text class="cap" x="40" y="22">два экземпляра в одном профиле: fake, а после него multisplit</text></g>
<g class="a e1"><text class="sm tk" x="40" y="48">игрушка (выдуманный пример): конвейер из двух станков, у каждого своя табличка настроек</text></g>
<g class="a e2"><rect class="bxb" x="40" y="60" width="250" height="44" rx="8"/><text class="sm tk c" x="165" y="79">станок 1</text><text class="sm c" x="165" y="96">кладёт подложное письмо</text><rect class="bx" x="48" y="112" width="234" height="26" rx="4"/><text class="ix c mu" x="165" y="130">табличка: заготовка, условие</text></g>
<g class="a e3"><path class="la" d="M294 86L340.0 86.0"/><polygon class="ha" points="350,86 340.0,91.0 340.0,81.0"/><text class="ix mu c" x="322" y="74">затем</text></g>
<g class="a e4"><rect class="bxa" x="356" y="60" width="250" height="44" rx="8"/><text class="sm tk c" x="481" y="79">станок 2</text><text class="sm c" x="481" y="96">режет настоящее письмо</text><rect class="bx" x="364" y="112" width="234" height="26" rx="4"/><text class="ix c mu" x="481" y="130">табличка: где резать</text></g>
<g class="a e5"><text class="sm tk" x="630" y="79">станок</text><text class="sm" x="630" y="98">= экземпляр = одна запись</text><text class="m" x="630" y="117">lua-desync в строке запуска</text></g>
<g class="a e6"><text class="cap" x="40" y="168">строка запуска по кускам</text><rect class="bxa" x="804.2" y="153" width="115.8" height="20" rx="10"/><text class="ix c fg" x="862.1" y="167">в нашем тесте</text></g>
<g class="a e7"><circle class="bxa" cx="54" cy="197" r="13"/><text class="tk c ns" x="54" y="202">1</text><rect class="bx" x="78" y="182" width="131.5" height="30" rx="6"/><text class="m fg c" x="143.8" y="202">--lua-desync=</text><rect class="bxa" x="215.5" y="182" width="52.9" height="30" rx="6"/><text class="m fg c" x="242" y="202">fake</text><text class="ix mu c" x="242" y="229">функция</text><text class="m fg" x="274.5" y="202">:</text><rect class="bxb" x="286.5" y="182" width="201.4" height="30" rx="6"/><text class="m fg c" x="387.2" y="202">blob=fake_default_tls</text><text class="ix mu c" x="387.2" y="229">заготовка</text><text class="m fg" x="493.9" y="202">:</text><rect class="bxr" x="505.9" y="182" width="79.1" height="30" rx="6"/><text class="m fg c" x="545.5" y="202">tcp_md5</text><text class="ix mu c" x="545.5" y="229">условие</text></g>
<g class="a e8"><path class="lmd" d="M40 262L920 262"/><text class="ix mu c" x="480" y="256">разделитель экземпляров: следующая опция lua-desync</text></g>
<g class="a e9"><circle class="bxa" cx="54" cy="289" r="13"/><text class="tk c ns" x="54" y="294">2</text><rect class="bx" x="78" y="274" width="131.5" height="30" rx="6"/><text class="m fg c" x="143.8" y="294">--lua-desync=</text><rect class="bxa" x="215.5" y="274" width="105.3" height="30" rx="6"/><text class="m fg c" x="268.2" y="294">multisplit</text><text class="ix mu c" x="268.2" y="321">функция</text><text class="m fg" x="326.9" y="294">:</text><rect class="bxb" x="338.9" y="274" width="122.8" height="30" rx="6"/><text class="m fg c" x="400.3" y="294">pos=1,midsld</text><text class="ix mu" x="338.9" y="321">список из двух меток: 1 и midsld</text></g>
<g class="a e10"><text class="sm tk" x="40" y="340">экземпляры идут в порядке командной строки</text></g>
<g class="a e11"><text class="cap" x="40" y="374">журнал называет экземпляр: функция, профиль, позиция</text><rect class="bxa" x="804.2" y="359" width="115.8" height="20" rx="10"/><text class="ix c fg" x="862.1" y="373">в нашем тесте</text></g>
<g class="a e12"><rect class="bx" x="40" y="388" width="340" height="28" rx="6"/><text class="m fg" x="52" y="407">* lua &#x27;fake_1_2&#x27; : desync</text><text class="sm" x="400" y="407">функция fake, профиль 1, позиция 2</text></g>
<g class="a e13"><rect class="bx" x="40" y="426" width="340" height="28" rx="6"/><text class="m fg" x="52" y="445">* lua &#x27;multisplit_1_3&#x27; : desync</text><text class="sm" x="400" y="445">функция multisplit, профиль 1, позиция 3</text></g>
<g class="a e14"><text class="sm mu" x="40" y="476">позицию 1 занимает запись трафика лаборатории, поэтому fake на позиции 2, multisplit на позиции 3</text></g>
<g class="a e15"><text class="cap" x="40" y="508">у каждого экземпляра свои аргументы</text></g>
<g class="a e16"><rect class="bxb" x="40" y="520" width="380" height="56" rx="8"/><text class="mk" x="54" y="541">fake</text><text class="m fg" x="130" y="541">blob, tcp_md5</text><text class="sm" x="54" y="564">условие касается только фейка</text></g>
<g class="a e17"><rect class="bxa" x="540" y="520" width="380" height="56" rx="8"/><text class="mk" x="554" y="541">multisplit</text><text class="m fg" x="670" y="541">pos</text><text class="sm" x="554" y="564">настоящие части без опции MD5</text></g>
<g class="a e18"><path class="lr" d="M424 548L524.0 548.0"/><polygon class="hr" points="534,548 524.0,553.0 524.0,543.0"/><text class="ix rej c" x="479" y="538">tcp_md5</text><path class="lr" d="M473 542L485 554M485 542L473 554"/><text class="ix rej c" x="479" y="570">не переходит</text></g>
<g class="a e19"><rect class="bxs" x="40" y="590" width="880" height="56" rx="8"/><text class="sm tk" x="54" y="611">ловушка из выпуска «multisplit: резать на части»:</text><text class="sm" x="54" y="633">условие, написанное у самого multisplit, попало бы на настоящие части</text></g>
</svg>
