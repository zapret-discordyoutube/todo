<title id="v01-s07-toy-inspector-t">Игрушечный инспектор смотрит на каждый пакет отдельно</title>
<desc id="v01-s07-toy-inspector-d">Игрушечный инспектор (модель) читает каждый пакет отдельно: «www.exa» и «mple.com» не совпадают с именем, оба пакета проходят, а обычный запрос в одном пакете совпал бы и был бы выброшен или сброшен.</desc>
