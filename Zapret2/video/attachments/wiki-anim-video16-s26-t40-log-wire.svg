<rect class="bg" x="0" y="0" width="960" height="672"/>
<g><text class="cap" x="40" y="26">опыт t40, стратегия syndata: первый пакет соединения</text></g>
<g class="a e1"><rect class="bxa" x="40" y="42" width="580" height="30" rx="4"/><text class="ix" x="52" y="62">52</text><text class="m" x="92" y="62">packet: id=1 len=60</text><path class="lf" d="M624 57L642 57"/><polygon class="hf" points="652,57 642,62 642,52"/><text class="sm" x="662" y="62">SYN: 60 = 20 + 40</text></g>
<g class="a e2"><rect class="bxb" x="40" y="80" width="580" height="30" rx="4"/><text class="ix" x="52" y="100">65</text><text class="m" x="92" y="100">rawsend_dissect repeats=1 size=76 … fwmark=40000000</text><path class="lf" d="M624 95L642 95"/><polygon class="hf" points="652,95 642,100 642,90"/><text class="sm" x="662" y="100">вставка: 76 = 60 + 16</text></g>
<g class="a e3"><rect class="bxb" x="40" y="118" width="580" height="30" rx="4"/><text class="ix" x="52" y="138">66</text><text class="m" x="92" y="138">applying linux postnat conntrack workaround</text><path class="lf" d="M624 133L642 133"/><polygon class="hf" points="652,133 642,138 642,128"/><text class="sm" x="662" y="138">обходной путь</text></g>
<g class="a e4"><rect class="bxo" x="40" y="156" width="580" height="30" rx="4"/><text class="ix" x="52" y="176">67</text><text class="m" x="92" y="176">packet: id=1 pass modified. len 60 =&gt; 60</text><path class="lf" d="M624 171L642 171"/><polygon class="hf" points="652,171 642,176 642,166"/><text class="sm" x="662" y="176">изменён, но та же длина</text></g>
<g class="a e5"><text class="sm" x="40" y="214">Стратегия вернула DROP, а приёмщик отдал ядру изменённый пакет той же длины:</text><text class="sm mu" x="40" y="234">копируется весь пакет и меняются два поля. Слева номера строк журнала опыта, не исходного кода.</text></g>
<g class="a e6"><text class="cap" x="40" y="268">что записано на проводе: четыре точки по пути пакета</text></g>
<g class="a e7"><rect class="bxb" x="40" y="280" width="204" height="146" rx="8"/><text class="sm tk" x="54" y="304">провод клиента</text><text class="sm" x="54" y="328">сначала вставленный</text><text class="sm" x="54" y="348">SYN, 76 Б; через</text><text class="sm" x="54" y="368">3,708 мс исходный:</text><text class="sm" x="54" y="388">протокол 255, TTL 1,</text><text class="sm" x="54" y="408">кадр 74 Б</text><path class="lf" d="M247 336L252.3 336"/><polygon class="hf" points="262.3,336 252.3,341 252.3,331"/></g>
<g class="a e8"><rect class="bxo" x="265.3" y="280" width="204" height="146" rx="8"/><text class="sm tk" x="279.3" y="304">вход роутера</text><text class="sm" x="279.3" y="328">исходный записан</text><path class="lf" d="M472.3 336L477.7 336"/><polygon class="hf" points="487.7,336 477.7,341 477.7,331"/></g>
<g class="a e9"><rect class="bxr" x="490.7" y="280" width="204" height="146" rx="8"/><text class="sm tk" x="504.7" y="304">интерфейс 2 роутера</text><text class="sm" x="504.7" y="328">исходного нет</text><path class="lf" d="M697.7 336L703 336"/><polygon class="hf" points="713,336 703,341 703,331"/></g>
<g class="a e10"><rect class="bxr" x="716" y="280" width="204" height="146" rx="8"/><text class="sm tk" x="730" y="304">сервер</text><text class="sm" x="730" y="328">исходного нет</text></g>
<g class="a e11"><text class="sm mu" x="40" y="448">74 = 60 + 14 (14 байт заголовка Ethernet). Времена от начала записи в нашем опыте.</text></g>
<g class="a e12"><rect class="bxb" x="40" y="464" width="880" height="84" rx="8"/><text class="sm tk amb" x="56" y="490">Причина остановки на роутере не установлена.</text><text class="sm" x="56" y="512">Известно два факта: у пакета неверная контрольная сумма заголовка IP, и сообщение</text><text class="sm" x="56" y="532">об ошибке (ICMP time-exceeded) на клиент не пришло. Причину они не показывают.</text></g>
<g class="a e13"><rect class="bxs" x="40" y="560" width="880" height="96" rx="8"/><text class="sm tk" x="56" y="586">Два пакета без следа: номер 2 (ACK) и номер 3 (запрос) пропущены без изменений,</text><text class="sm tk" x="56" y="608">но ни в одной точке записи они не появились.</text><text class="sm" x="56" y="630">Запрос клиент, похоже, повторил на отметке около 294 мс; ответ сервера в итоге пришёл.</text><text class="sm mu" x="56" y="648">Куда делись эти два пакета, мы не выяснили.</text></g>
</svg>
