<svg xmlns="http://www.w3.org/2000/svg" class="v16-s26-t40-log-wire" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="v16-s26-t40-log-wire-t v16-s26-t40-log-wire-d">
<title id="v16-s26-t40-log-wire-t">Опыт t40: журнал и провод</title>
<desc id="v16-s26-t40-log-wire-d">Опыт t40, стратегия syndata: выброшен самый первый пакет соединения, SYN длиной 60 байт (60 = 20 байт IP + 40 байт TCP с параметрами). Журнал, четыре строки: packet id=1 len=60; rawsend_dissect repeats=1 size=76 и fwmark=40000000 (вставлен другой SYN с 16 байтами данных, 76 = 60 + 16); запись о применении обходного пути applying linux postnat conntrack workaround; packet id=1 pass modified, длина 60 и после изменения 60: стратегия вернула DROP, а приёмщик отдал ядру изменённый пакет той же длины, ведь копируется весь пакет и меняются два поля. Что записано на проводе: на проводе клиента сначала вставленный SYN, через 3,708 мс исходный пакет уже не как TCP SYN, а как пакет IPv4 с протоколом 255 и временем жизни 1 (кадр 74 байта, 74 = 60 + 14 байт Ethernet); на входе роутера он записан; на втором интерфейсе роутера и на сервере его нет. Причина остановки не установлена: известно только, что у пакета неверная контрольная сумма заголовка IP и сообщение об ошибке ICMP time-exceeded на клиент не пришло; поэтому мы не говорим, что его остановило время жизни, равное единице. Открытое наблюдение: следующие два пакета очереди, подтверждение (номер 2) и запрос (номер 3), программа пропустила без изменений, но ни в одной точке записи они не появились; запрос клиент, похоже, повторил на отметке около 294 мс от начала записи, и ответ сервера в итоге пришёл. Куда делись эти два пакета, мы не выяснили.</desc>
