.v02-s12-before-after-keys .pl{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.v02-s12-before-after-keys .fb{fill:var(--ambt);stroke:none}
.v02-s12-before-after-keys .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
