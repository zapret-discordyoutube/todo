<svg xmlns="http://www.w3.org/2000/svg" class="v02-s12-before-after-keys" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="v02-s12-before-after-keys-t v02-s12-before-after-keys-d">
<title id="v02-s12-before-after-keys-t">До ключа и после ключа</title>
<desc id="v02-s12-before-after-keys-d">Наши 250 байт запроса с номерами TCP от 1 до 250 и есть сообщение ClientHello, имя сайта в нём занимает байты 98–112 (с нуля 97–111); защищённое соединение делится на «до ключа» и «после ключа»: до ключа идёт рукопожатие TLS из трёх действий (клиент здоровается сообщением ClientHello, сервер отвечает и доказывает, кто он, стороны договариваются о ключе), и первое сообщение шифровать нечем, поэтому оно открыто; после ключа данные зашифрованы, и ключ знают только клиент и сервер.</desc>
<style>.v02-s12-before-after-keys{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
