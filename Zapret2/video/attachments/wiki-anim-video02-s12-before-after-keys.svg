.v02-s12-before-after-keys .hf{fill:var(--fg2)}.v02-s12-before-after-keys .ha{fill:var(--acc)}.v02-s12-before-after-keys .hr{fill:var(--rej)}.v02-s12-before-after-keys .hm{fill:var(--mute)}.v02-s12-before-after-keys .ho{fill:var(--ok)}
.v02-s12-before-after-keys .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v02-s12-before-after-keys .a{animation-duration:36s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
.v02-s12-before-after-keys .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
