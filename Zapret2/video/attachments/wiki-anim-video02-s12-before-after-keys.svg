<rect class="bg" x="0" y="0" width="960" height="440"/>
<g class="a e1"><text class="cap" x="10" y="24">наши 250 байт запроса: это и есть первое сообщение защищённого соединения</text></g>
<g class="a e2"><rect class="bxa" x="10" y="36" width="940" height="30" rx="5"/><text class="mk" x="18" y="56">1</text><text class="mk r" x="942" y="56">250</text></g>
<g class="a e3"><rect class="bxb" x="374.7" y="36" width="56.4" height="30" rx="3"/><text class="sm c" x="402.9" y="88">имя сайта: байты 98–112 (с нуля 97–111)</text></g>
<g class="a e4"><text class="tk c" x="190" y="56">250 байт = ClientHello</text></g>
<g class="a e5"><text class="cap" x="10" y="126">защищённое соединение делится на две части: до ключа и после ключа</text><rect class="bx" x="10" y="138" width="580" height="246" rx="10"/><rect class="bxo" x="660" y="138" width="290" height="246" rx="10"/></g>
<g class="a e6"><rect class="pl" x="26" y="160" width="46" height="30" rx="3"/><path class="lm" d="M26 160L49 140L72 160"/><path class="lm" d="M26 190L44 174M72 190L54 174"/><text class="tk" x="88" y="166">До ключа: рукопожатие TLS</text><text class="sm mu" x="88" y="186">ключа ещё нет, шифровать нечем</text></g>
<g class="a e7"><rect class="bxb" x="24" y="204" width="542" height="46" rx="8"/><circle class="dot" cx="48" cy="227" r="12"/><text class="tk c ns" x="48" y="232">1</text><text class="tk" x="72" y="224">Клиент здоровается: сообщение ClientHello</text><text class="sm mu" x="72" y="242">первый пакет с данными; что клиент умеет</text></g>
<g class="a e8"><rect class="bx" x="24" y="260" width="542" height="46" rx="8"/><circle class="dot" cx="48" cy="283" r="12"/><text class="tk c ns" x="48" y="288">2</text><text class="tk" x="72" y="288">Сервер отвечает и доказывает, кто он</text></g>
<g class="a e9"><rect class="bx" x="24" y="316" width="542" height="46" rx="8"/><circle class="dot" cx="48" cy="339" r="12"/><text class="tk c ns" x="48" y="344">3</text><text class="tk" x="72" y="344">Стороны договариваются о ключе</text></g>
<g class="a e10"><rect class="bxr" x="428" y="226" width="130" height="20" rx="6"/><text class="sm c rej" x="493" y="241">не зашифрован</text></g>
<g class="a e11"><path class="lf" d="M596 340L644.0 340.0"/><polygon class="hf" points="654,340 644.0,345.0 644.0,335.0"/><circle class="pl" cx="612" cy="300" r="9"/><path class="lf" d="M621 300H650M640 300V309M646 300V307"/><text class="sm c" x="625" y="334">ключ</text><text class="sm c mu" x="625" y="362">готов</text></g>
<g class="a e12"><rect class="pl" x="684" y="208" width="50" height="38" rx="4"/><path class="lf" d="M692 208V196a17 17 0 0 1 34 0V208"/><circle cx="709" cy="224" r="5" class="hf"/><path class="lf" d="M709 227V236"/><text class="tk" x="678" y="166">После ключа: данные</text><text class="tk" x="678" y="272">Данные зашифрованы.</text><text class="sm" x="678" y="296">Ключ знают только клиент</text><text class="sm" x="678" y="316">и сервер. На пути виден</text><text class="sm" x="678" y="336">поток бессмысленных байтов.</text></g>
<g class="a e13"><text class="tk" x="10" y="414">ClientHello идёт до появления ключа, поэтому открыт: чтобы прочитать, расшифровывать нечего.</text><text class="sm mu" x="10" y="436">Как правило, наблюдатель на пути может прочитать его; настоящее оборудование мы не разбираем.</text></g>
</svg>
