<g><text class="cap" x="40" y="22">итог для</text><text class="mk mu ns" x="132.2353125" y="22">fakedsplit</text><text class="cap" x="229.5321875" y="22">наш тест, один приёмник на Linux, наша игрушечная модель</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="880" height="40" rx="6"/><circle class="pl" cx="60" cy="54.0" r="11"/><text class="sm tk c ns" x="60" y="59.0">1</text><text class="sm ns" x="84" y="59.0">шесть пакетов: фейк, настоящая, фейк, фейк, настоящая, фейк; оригинал выброшен</text><rect class="bxo" x="770" y="43" width="138" height="22" rx="5"/><text class="sm c ns ok" x="839" y="59">в нашем тесте</text></g>
<g class="a e2"><rect class="bx" x="40" y="78" width="880" height="56" rx="6"/><circle class="pl" cx="60" cy="106.0" r="11"/><text class="sm tk c ns" x="60" y="111.0">2</text><text class="sm ns" x="84" y="100">фейк на тех же номерах и той же длины, пока часть не режут заново по пределу</text><text class="sm mu ns" x="84" y="121">ломтики: MD5 сдвигает, срок жизни 1 нет (измерено); плохая сумма: по счёту</text><rect class="bxo" x="770" y="84" width="138" height="22" rx="5"/><text class="sm c ns ok" x="839" y="100">в нашем тесте</text><rect class="bx" x="770" y="109" width="138" height="22" rx="5"/><text class="sm c ns mu" x="839" y="125">по счёту</text></g>
<g class="a e3"><rect class="bx" x="40" y="138" width="880" height="40" rx="6"/><circle class="pl" cx="60" cy="158.0" r="11"/><text class="sm tk c ns" x="60" y="163.0">3</text><text class="sm ns" x="84" y="163.0">по умолчанию в фейке нули; можно задать узор</text><rect class="bxo" x="770" y="147" width="138" height="22" rx="5"/><text class="sm c ns ok" x="839" y="163">в нашем тесте</text></g>
<g class="a e4"><rect class="bx" x="40" y="182" width="880" height="40" rx="6"/><circle class="pl" cx="60" cy="202.0" r="11"/><text class="sm tk c ns" x="60" y="207.0">4</text><text class="sm ns" x="84" y="207.0">MD5, плохая сумма: фейк умирает на сервере (счётчик 4); TTL 1: в роутере (ICMP 4)</text><rect class="bxo" x="770" y="191" width="138" height="22" rx="5"/><text class="sm c ns ok" x="839" y="207">в нашем тесте</text></g>
<g class="a e5"><rect class="bx" x="40" y="226" width="880" height="40" rx="6"/><circle class="pl" cx="60" cy="246.0" r="11"/><text class="sm tk c ns" x="60" y="251.0">5</text><text class="sm ns" x="84" y="251.0">сервер: ACK 105, молчит на фейки, читает оригинал; ответы как у обычного разреза</text><rect class="bxo" x="770" y="235" width="138" height="22" rx="5"/><text class="sm c ns ok" x="839" y="251">в нашем тесте</text></g>
