<svg xmlns="http://www.w3.org/2000/svg" class="video08-s10-what-we-know-table" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="video08-s10-what-we-know-table-t video08-s10-what-we-know-table-d">
<title id="video08-s10-what-we-know-table-t">Итог по fakedsplit</title>
<desc id="video08-s10-what-we-know-table-d">Что мы знаем про fakedsplit по нашему тесту, одному приёмнику на Linux и нашей игрушечной модели, девятью строками: шесть пакетов и выброшенный оригинал; фейк лежит на тех же номерах и той же длины, пока часть не режут заново по пределу; в фейке по умолчанию нули, но можно задать узор; MD5 и испорченная сумма убивают фейк на сервере, срок жизни 1 убивает его в роутере; сервер отвечает подтверждением 105 и читает оригинал; без условия в приложении нули и четыре дублирующих блока; четыре выключателя убирают фейки по одному, при всех выключенных остаётся обычный разрез; накладка только числом; метка pos одна, ноль и значение за концом приветствия оставляют оригинал целым; внизу три серые плашки с замками о том, чего мы не знаем: другие получатели, настоящий инспектор и игрушечные читатели на этой серии.</desc>
