<g class="a e10"><text class="cap" x="40" y="460">чего мы не знаем</text></g>
<g class="a e11"><rect class="bxd" x="40" y="472" width="280" height="78" rx="8"/><rect class="bxs" x="290" y="492" width="16" height="12" rx="2"/><path class="lm" d="M293 492L293 488Q298 482 303 488L303 492"/><text class="smk ns" x="54" y="496">другие получатели</text><text class="sm ns" x="54" y="518">Windows, BSD, встроенные</text><text class="sm mu ns" x="54" y="540">не проверяли</text><rect class="bxd" x="340" y="472" width="280" height="78" rx="8"/><rect class="bxs" x="590" y="492" width="16" height="12" rx="2"/><path class="lm" d="M593 492L593 488Q598 482 603 488L603 492"/><text class="smk ns" x="354" y="496">настоящий инспектор</text><text class="sm ns" x="354" y="518">что читает, видит ли фейки</text><text class="sm mu ns" x="354" y="540">неизвестно</text><rect class="bxd" x="640" y="472" width="280" height="78" rx="8"/><rect class="bxs" x="890" y="492" width="16" height="12" rx="2"/><path class="lm" d="M893 492L893 488Q898 482 903 488L903 492"/><text class="smk ns" x="654" y="496">игрушечные читатели</text><text class="sm ns" x="654" y="518">как справятся с этой серией</text><text class="sm mu ns" x="654" y="540">впереди в выпуске</text></g>
