<g class="a e16"><text class="sm mu" x="40" y="476">двойник без MD5 для сервера обычный пакет; отдельного ответа на него в нашем тесте нет:</text><text class="sm mu" x="40" y="494">Linux иногда откладывает подтверждения</text></g>
