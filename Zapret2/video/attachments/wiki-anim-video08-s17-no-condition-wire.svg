<svg xmlns="http://www.w3.org/2000/svg" class="v08-s17-no-condition-wire" viewBox="0 0 960 840" width="960" height="840" role="img" aria-labelledby="v08-s17-no-condition-wire-t v08-s17-no-condition-wire-d">
<title id="v08-s17-no-condition-wire-t">Без условия сервер получает чужое имя</title>
<desc id="v08-s17-no-condition-wire-d">Имя между двойниками без условия: в игрушке кладовщик принимает на место первую пришедшую карточку, поэтому подложный адрес побеждает, а настоящая карточка становится дублем; на проводе те же пять пакетов, но двойники теперь обычные пакеты, сервер на часть до имени отвечает «жду байт номер 98», на двойника отдельного ответа нет, на настоящее имя и на повтор двойника отвечает «жду байт номер 113» с дублирующим блоком с 98-го по 112-й, на хвост отвечает «жду байт номер 251», приложение сервера прочитало 250 байт, но 15 байт имени заменены двойником, и сервер нашёл в приветствии случайное имя, а не настоящее; с условием ответов было два, а без условия четыре.</desc>
