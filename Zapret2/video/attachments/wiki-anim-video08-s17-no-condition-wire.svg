<g><text class="cap" x="40" y="22">без условия: двойник приходит первым и по порядку</text></g>
<g class="a e1"><text class="sm tk" x="40" y="48">игрушка (выдуманный пример): кладовщик принимает на место первую пришедшую карточку</text></g>
<g class="a e2"><rect class="bxb" x="40" y="60" width="280" height="30" rx="6"/><text class="sm tk c" x="180" y="80">карточка 1: подложный адрес</text><path class="la" d="M324 75L334.0 75.0"/><polygon class="ha" points="344,75 334.0,80.0 334.0,70.0"/><rect class="bxo" x="350" y="60" width="210" height="30" rx="6"/><text class="sm tk c" x="455" y="80">принята на место</text><text class="sm" x="574" y="80">письмо уйдёт по подложному адресу</text></g>
<g class="a e3"><rect class="bxa" x="40" y="100" width="280" height="30" rx="6"/><text class="sm tk c" x="180" y="120">карточка 2: настоящий адрес</text><path class="la" d="M324 115L334.0 115.0"/><polygon class="ha" points="344,115 334.0,120.0 334.0,110.0"/><rect class="bxr" x="350" y="100" width="210" height="30" rx="6"/><text class="sm tk c" x="455" y="120">штамп «дубль»</text><text class="sm" x="574" y="120">настоящая карточка лишняя</text></g>
<g class="a e4"><rect class="bx" x="40" y="156" width="570" height="28" rx="6"/><text class="m fg" x="52" y="175">--payload=tls_client_hello --lua-desync=hostfakesplit</text><text class="sm tk rej" x="626" y="175">условия tcp_md5 нет</text></g>
<g class="a e5"><text class="cap c" x="410" y="216">клиент</text><text class="cap c" x="500" y="216">роутер</text><text class="cap c" x="590" y="216">сервер</text><path class="lmd" d="M410 224L410 458"/><path class="lmd" d="M500 224L500 458"/><path class="lmd" d="M590 224L590 458"/></g>
<g class="a e6"><rect class="fa" x="40" y="226" width="880" height="42" rx="6"/><circle class="bxa" cx="56" cy="246" r="12"/><text class="tk c ns" x="56" y="251">1</text><text class="sm tk" x="78" y="243">часть до имени</text><text class="ix fg" x="78" y="261">номер 1 · длина 97</text><text class="ix mu" x="418" y="240">IP 149 Б</text><path class="la" d="M410 246L580.0 255.4"/><polygon class="ha" points="590,256 579.7,260.4 580.3,250.5"/></g>
