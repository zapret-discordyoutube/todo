<g class="a e4"><rect class="bx" x="340" y="104" width="280" height="176" rx="8"/><text class="sm tk" x="354" y="134">таблица с полями</text><rect class="bxa" x="355" y="152" width="250" height="28" rx="4"/><text class="sm" x="367" y="171">заголовок IP</text><text class="m mu r" x="595" y="171">…</text><rect class="bxa" x="355" y="184" width="250" height="28" rx="4"/><text class="sm" x="367" y="203">порядковый номер</text><text class="m mu r" x="595" y="203">…</text><rect class="bxb" x="355" y="216" width="250" height="28" rx="4"/><text class="sm" x="367" y="235">контрольная сумма</text><text class="m mu r" x="595" y="235">…</text><text class="sm mu" x="354" y="268">с ней работают скрипты Lua</text></g>
<g class="a e5"><rect class="bx" x="640" y="104" width="280" height="176" rx="8"/><text class="sm tk" x="654" y="134">контрольная сумма</text><rect class="bx" x="655" y="170" width="70" height="40" rx="4"/><text class="sm c" x="690" y="195">байты</text><path class="lf" d="M728 190L738 190"/><polygon class="hf" points="748,190 738,195 738,185"/><rect class="bxb" x="752" y="170" width="70" height="40" rx="4"/><text class="sm tk c" x="787" y="195">сумма</text><path class="lf" d="M825 190L835 190"/><polygon class="hf" points="845,190 835,195 835,185"/><rect class="bxo" x="849" y="170" width="56" height="40" rx="4"/><text class="sm c" x="877" y="195">число</text><text class="sm mu" x="654" y="268">пересчитывается при сборке</text></g>
<g class="a e6"><text class="sm" x="40" y="318">Мы говорили о пакете как о наборе байтов, но брали готовые слова: «заголовок IP»,</text><text class="sm" x="40" y="338">«порядковый номер», «контрольная сумма». Что движок делает с байтами, мы ещё не видели.</text></g>
<g class="a e7"><text class="sm tk" x="40" y="372">Дальше: как из байтов получается таблица для скриптов на Lua и как собрать её обратно,</text><text class="sm tk" x="40" y="392">пересчитав длины и контрольные суммы.</text></g>
