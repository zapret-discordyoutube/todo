<svg xmlns="http://www.w3.org/2000/svg" class="v16-s28-next-bytes-to-table" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="v16-s28-next-bytes-to-table-t v16-s28-next-bytes-to-table-d">
<title id="v16-s28-next-bytes-to-table-t">Дальше: из байтов в таблицу</title>
<desc id="v16-s28-next-bytes-to-table-d">Что дальше: следующий выпуск называется «Из байтов в таблицу». Три пиктограммы. Первая: заголовки как лента с указателем, лента из заголовка IP, заголовка TCP и данных (в масштабе вставки номер один из t10: 20, 32 и 104 байта). Вторая: таблица с полями, например заголовок IP, порядковый номер, контрольная сумма. Третья: контрольная сумма, число, посчитанное по байтам. Мы говорили о пакете как о наборе байтов, но брали готовые слова: заголовок IP, порядковый номер, контрольная сумма. Что движок делает с этими байтами, мы ещё не видели. В следующем выпуске: как из байтов получается таблица, с которой работают скрипты на Lua, и как собрать её обратно в байты, пересчитав длины и контрольные суммы.</desc>
