<g class="a e1"><text class="bn" x="40" y="76">Из байтов в таблицу</text></g>
<g class="a e2"><rect class="bx" x="40" y="104" width="280" height="176" rx="8"/><rect class="bxa" x="55" y="160" width="32" height="40" rx="4"/><text class="sm tk c" x="71" y="185">IP</text><rect class="bxb" x="87" y="160" width="51" height="40" rx="4"/><text class="sm tk c" x="112.5" y="185">TCP</text><rect class="bx" x="138" y="160" width="167" height="40" rx="4"/><text class="sm tk c" x="221.5" y="185">данные</text><text class="sm tk" x="54" y="134">заголовки как лента</text><text class="sm mu" x="54" y="270">масштаб: 20, 32 и 104 байта</text></g>
