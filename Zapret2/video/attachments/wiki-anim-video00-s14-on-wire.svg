<title id="v00-s14-on-wire-t">Что ушло на провод при строке из коробки</title>
<desc id="v00-s14-on-wire-d">В нашем тесте профиль для TLS отправил с клиента сначала поддельное приветствие в 680 байт с опцией MD5, потом настоящее приветствие тремя кусками хвостом вперёд, 146, 103 и 1 байт, а сервер всё равно получил ровно 250 байт, и подделка в его данные не попала.</desc>
