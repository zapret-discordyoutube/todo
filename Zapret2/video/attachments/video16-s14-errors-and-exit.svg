<svg xmlns="http://www.w3.org/2000/svg" class="v16-s14-errors-and-exit" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="v16-s14-errors-and-exit-t v16-s14-errors-and-exit-d">
<title id="v16-s14-errors-and-exit-t">Ошибки чтения и выход</title>
<desc id="v16-s14-errors-and-exit-d">Ошибки чтения и выход из главного цикла. Ошибки: select прерван сигналом (EINTR) просто повторяет ожидание, любая другая ошибка select завершает программу с кодом 1 (nfqws.c:549-554); recv вернул ноль байт: фатально, код 1 (568-572); recv прерван сигналом (EINTR): возврат к началу внешнего цикла и проверка флага bQuit (591-592); ENOBUFS, ядро сообщает о переполнении буфера: запись в журнал и работа продолжается (593-597); любая другая ошибка recv: выход с кодом 1 (597, 599-601). ENOBUFS в нашей лаборатории не наблюдался. Остановка: сигналы SIGINT и SIGTERM взводят флаг bQuit и вызывают lua_req_quit (обработчики onint и onterm, nfqws.c:114-131; sa_flags = 0 без SA_RESTART, :139, поэтому ждущий вызов прерывается; lua_req_quit ставит в Lua ловушку, которая прервёт работающий скрипт ошибкой INTERRUPT, lua.c:4651-4660, это чтение кода, мы так программу не останавливали). Выход, строки 599-618, лесенкой: запись quit requested (604), освобождение буферов (609-610), nfq_deinit (611, пишет unbinding from queue 200 и closing nfq library handle), close вспомогательного сокета (612), lua_shutdown (613), rawsend_cleanup (617), код возврата 0 при чистом выходе и 1 при ошибке. В опыте t10 хвост журнала повторяет этот порядок: quit requested, unbinding from queue 200, closing nfq library handle, LUA SHUTDOWN; в файле консоли после kill (SIGTERM) строка TERM received !.</desc>
