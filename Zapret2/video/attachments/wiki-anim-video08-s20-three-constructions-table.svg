<g><text class="cap" x="40" y="22">три конструкции: что отправляют, что отвечает сервер, что запомнить</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="174" rx="8"/><circle class="bxa" cx="60" cy="58" r="12"/><text class="tk c ns" x="60" y="63">1</text><text class="sm tk" x="84" y="63">перемешивание с фейками (fakeddisorder)</text><rect class="bxb" x="56" y="76" width="96" height="36" rx="6"/><text class="sm tk c" x="104" y="92">146 Б</text><text class="ix c" x="104" y="109">фейк второй</text><rect class="bxa" x="158" y="76" width="96" height="36" rx="6"/><text class="sm tk c" x="206" y="92">146 Б</text><text class="ix c" x="206" y="109">вторая</text><rect class="bxb" x="260" y="76" width="96" height="36" rx="6"/><text class="sm tk c" x="308" y="92">146 Б</text><text class="ix c" x="308" y="109">фейк второй</text><rect class="bxb" x="362" y="76" width="96" height="36" rx="6"/><text class="sm tk c" x="410" y="92">104 Б</text><text class="ix c" x="410" y="109">фейк первой</text><rect class="bxa" x="464" y="76" width="96" height="36" rx="6"/><text class="sm tk c" x="512" y="92">104 Б</text><text class="ix c" x="512" y="109">первая</text><rect class="bxb" x="566" y="76" width="96" height="36" rx="6"/><text class="sm tk c" x="614" y="92">104 Б</text><text class="ix c" x="614" y="109">фейк первой</text><text class="sm tk" x="56" y="130">сервер:</text><text class="m fg" x="130" y="130">ack 1 + блок [105,251), затем ack 251</text><text class="sm" x="56" y="152">сервер молчит на фейки; выключатели 1…4 нумеруются со второй половины</text><text class="sm" x="56" y="172">все четыре выключены: провод multidisorder; без условия 250 нулей</text><text class="sm" x="56" y="192">seqovl здесь метка внутри окна: 243 байта со смещения 7</text><rect class="bxa" x="790.2" y="44" width="115.8" height="20" rx="10"/><text class="ix c fg" x="848.1" y="58">в нашем тесте</text></g>
<g class="a e2"><rect class="bx" x="40" y="222" width="880" height="174" rx="8"/><circle class="bxa" cx="60" cy="244" r="12"/><text class="tk c ns" x="60" y="249">2</text><text class="sm tk" x="84" y="249">имя между двойниками (hostfakesplit)</text><rect class="bxa" x="56" y="262" width="112" height="36" rx="6"/><text class="sm tk c" x="112" y="278">97 Б</text><text class="ix c" x="112" y="295">до имени</text><rect class="bxb" x="174" y="262" width="112" height="36" rx="6"/><text class="sm tk c" x="230" y="278">15 Б</text><text class="ix c" x="230" y="295">двойник</text><rect class="bxa" x="292" y="262" width="112" height="36" rx="6"/><text class="sm tk c" x="348" y="278">15 Б</text><text class="ix c" x="348" y="295">имя</text><rect class="bxb" x="410" y="262" width="112" height="36" rx="6"/><text class="sm tk c" x="466" y="278">15 Б</text><text class="ix c" x="466" y="295">двойник</text><rect class="bxa" x="528" y="262" width="112" height="36" rx="6"/><text class="sm tk c" x="584" y="278">138 Б</text><text class="ix c" x="584" y="295">хвост</text><text class="sm tk" x="56" y="316">сервер:</text><text class="m fg" x="130" y="316">ack 98, затем ack 251</text><text class="sm" x="56" y="338">двойник той же длины, один на вызов, уходит дважды; шаблон host под длину</text><text class="sm" x="56" y="358">без условия сервер видит чужое имя; pos функция не читает</text><text class="sm" x="56" y="378">midhost режет настоящее имя (смещения 98…111); disorder_after: хвост наоборот (с 113)</text><rect class="bxa" x="790.2" y="230" width="115.8" height="20" rx="10"/><text class="ix c fg" x="848.1" y="244">в нашем тесте</text></g>
<g class="a e3"><rect class="bx" x="40" y="408" width="880" height="154" rx="8"/><circle class="bxa" cx="60" cy="430" r="12"/><text class="tk c ns" x="60" y="435">3</text><text class="sm tk" x="84" y="435">два экземпляра: fake, а после него multisplit</text><rect class="bxb" x="56" y="448" width="112" height="36" rx="6"/><text class="sm tk c" x="112" y="464">680 Б</text><text class="ix c" x="112" y="481">фейк</text><rect class="bxa" x="174" y="448" width="112" height="36" rx="6"/><text class="sm tk c" x="230" y="464">1 Б</text><text class="ix c" x="230" y="481">часть 1</text><rect class="bxa" x="292" y="448" width="112" height="36" rx="6"/><text class="sm tk c" x="348" y="464">103 Б</text><text class="ix c" x="348" y="481">часть 2</text><rect class="bxa" x="410" y="448" width="112" height="36" rx="6"/><text class="sm tk c" x="466" y="464">146 Б</text><text class="ix c" x="466" y="481">часть 3</text><text class="sm tk" x="56" y="502">сервер:</text><text class="m fg" x="130" y="502">ack 2, затем ack 251</text><text class="sm" x="56" y="524">условие у fake не касается частей: настоящие части идут без MD5</text><text class="sm" x="56" y="544">оригинал выбрасывается один раз, поэтому его на проводе нет</text><rect class="bxa" x="790.2" y="416" width="115.8" height="20" rx="10"/><text class="ix c fg" x="848.1" y="430">в нашем тесте</text></g>
<g class="a e4"><text class="cap" x="40" y="580">откуда знаем</text></g>
<g class="a e5"><rect class="bxa" x="40" y="590" width="115.8" height="20" rx="10"/><text class="ix c fg" x="97.9" y="604">в нашем тесте</text><text class="sm" x="200" y="605">провод и ответы сервера в нашем тесте</text></g>
<g class="a e6"><rect class="bxb" x="40" y="618" width="123.6" height="20" rx="10"/><text class="ix c fg" x="101.8" y="632">прогон функций</text><text class="sm" x="200" y="633">границы значений</text></g>
<g class="a e7"><rect class="bxs" x="40" y="646" width="154.9" height="20" rx="10"/><text class="ix c fg" x="117.5" y="660">по общим сведениям</text><text class="sm" x="200" y="661">про настоящие серверы и настоящее оборудование проверить нечем</text></g>
<g class="a e8"><text class="sm mu" x="40" y="692">всё про наш приёмник (Linux) и нашу игрушечную модель; другие приёмники и настройки не проверены</text></g>
</svg>
