<g class="a e3"><text class="ix fg" x="40" y="110">hostfakesplit:tcp_md5</text><rect class="bxa" x="300" y="92" width="88" height="26" rx="5"/><text class="m fg c" x="344" y="110">R97@0</text><rect class="bxw" x="394" y="92" width="88" height="26" rx="5"/><text class="m fg c" x="438" y="110">F15@97m</text><rect class="bxa" x="488" y="92" width="88" height="26" rx="5"/><text class="m fg c" x="532" y="110">R15@97</text><rect class="bxw" x="582" y="92" width="88" height="26" rx="5"/><text class="m fg c" x="626" y="110">F15@97m</text><rect class="bxa" x="676" y="92" width="88" height="26" rx="5"/><text class="m fg c" x="720" y="110">R138@112</text></g>
<g class="a e4"><text class="sm tk" x="790" y="96">те же пять</text><text class="sm tk" x="790" y="114">пакетов</text><text class="big tk c" x="280" y="86">=</text></g>
<g class="a e5"><rect class="bx" x="40" y="128" width="880" height="24" rx="5"/><text class="ix fg" x="50" y="145">lua/zapret-antidpi.lua:721   local pos = resolve_range(data, desync.l7payload, &quot;host,endhost-1&quot;, true)</text></g>
<g class="a e6"><text class="sm tk" x="40" y="186">2. ipfrag: у трёх функций фрагментов IP нет</text></g>
<g class="a e7"><text class="ix mu" x="300" y="204">что на проводе клиента</text><text class="ix mu" x="640" y="204">фрагментов IP</text></g>
<g class="a e8"><text class="ix fg" x="40" y="226">fakedsplit:ipfrag</text><text class="sm" x="300" y="226">6 пакетов целиком</text><text class="mk" x="640" y="226">0</text></g>
<g class="a e9"><text class="ix fg" x="40" y="250">fakeddisorder:ipfrag</text><text class="sm" x="300" y="250">6 пакетов целиком</text><text class="mk" x="640" y="250">0</text></g>
<g class="a e10"><text class="ix fg" x="40" y="274">hostfakesplit:ipfrag</text><text class="sm" x="300" y="274">5 пакетов целиком</text><text class="mk" x="640" y="274">0</text></g>
<g class="a e11"><text class="ix fg" x="40" y="298">multisplit:ipfrag</text><text class="sm" x="300" y="298">для сравнения: нарезка работает</text><text class="mk rej" x="640" y="298">4</text></g>
<g class="a e12"><rect class="bx" x="40" y="312" width="880" height="66" rx="5"/><text class="ix fg" x="50" y="329">lua/zapret-antidpi.lua:850-851   ipfrag = {}  (в таблицах настроек пустое значение)</text><text class="ix fg" x="50" y="348">lua/zapret-lib.lua:1198   if options and options.ipfrag and options.ipfrag.ipfrag ... нарезчик запускается</text><text class="ix fg" x="50" y="367">docs/manual.en.md:4189   ipfrag_opts are not used for either fakes or originals</text></g>
<g class="a e13"><text class="sm mu" x="40" y="396">комментарий в hostfakesplit (строка 754) этому противоречит; на проводе фрагментов нет</text></g>
<g class="a e14"><text class="sm tk" x="40" y="438">3. repeats и badsum касаются только фейков: repeats=2, десять пакетов вместо шести</text></g>
