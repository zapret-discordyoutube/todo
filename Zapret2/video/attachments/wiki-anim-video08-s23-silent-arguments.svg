<svg xmlns="http://www.w3.org/2000/svg" class="v08-s23-silent-arguments" viewBox="0 0 960 740" width="960" height="740" role="img" aria-labelledby="v08-s23-silent-arguments-t v08-s23-silent-arguments-d">
<title id="v08-s23-silent-arguments-t">Аргументы, которые молчат</title>
<desc id="v08-s23-silent-arguments-d">Аргументы, которые молчат: pos у hostfakesplit не читается, потому что функция сама ищет имя метками host и endhost минус один, и с pos равным два на проводе те же пять пакетов, что и без него; ipfrag не работает у fakedsplit, fakeddisorder и hostfakesplit, на проводе клиента ноль фрагментов IP, а у multisplit с тем же ipfrag четыре фрагмента, потому что в таблицах настроек этих функций для ipfrag пустое значение; repeats равное двум отправляет каждый фейк дважды, а настоящие части один раз, получается десять пакетов вместо шести; seqovl словом host даёт ошибку после первого фейка и приветствие уходит целым, а числом пять даёт настоящую часть в 109 байт, начатую на пять байт раньше приветствия.</desc>
