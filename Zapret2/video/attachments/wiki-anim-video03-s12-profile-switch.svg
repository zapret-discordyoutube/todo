<svg xmlns="http://www.w3.org/2000/svg" class="v03-s12-profile-switch" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v03-s12-profile-switch-t v03-s12-profile-switch-d">
<title id="v03-s12-profile-switch-t">Выбор профиля и его повтор</title>
<desc id="v03-s12-profile-switch-d">Профиль выбирается на первом пакете и запоминается: на SYN не подходят ни профиль 1 (список имён), ни профиль 2 (протокол tls), берётся пустой no_action, на SYN-ACK и ACK выбор берётся из памяти, а на приветствии, когда выяснились протокол tls и имя, выбор повторяется: профиль 1 отвечает «нет», профиль 2 подходит, журнал пишет «desync profile changed by revealed l7 protocol or hostname !» и сервер получает куски 104 и 146 байт.</desc>
<style>.v03-s12-profile-switch{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v03-s12-profile-switch{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v03-s12-profile-switch .bg{fill:var(--bg)}
.v03-s12-profile-switch text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v03-s12-profile-switch .tk{font-weight:600;fill:var(--fg)}
.v03-s12-profile-switch .sm{font-size:14.5px}
.v03-s12-profile-switch .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v03-s12-profile-switch .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v03-s12-profile-switch .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v03-s12-profile-switch .mt{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px}
.v03-s12-profile-switch .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v03-s12-profile-switch .mu{fill:var(--mute)}.v03-s12-profile-switch .fg{fill:var(--fg)}.v03-s12-profile-switch .acc{fill:var(--acc)}.v03-s12-profile-switch .rej{fill:var(--rej)}.v03-s12-profile-switch .ok{fill:var(--ok)}.v03-s12-profile-switch .amb{fill:var(--amb)}
.v03-s12-profile-switch .hb{fill:var(--acc);font-weight:700}.v03-s12-profile-switch .hbr{fill:var(--rej);font-weight:700}.v03-s12-profile-switch .hbo{fill:var(--ok);font-weight:700}.v03-s12-profile-switch .hbb{fill:var(--amb);font-weight:700}
.v03-s12-profile-switch .c{text-anchor:middle}.v03-s12-profile-switch .r{text-anchor:end}
.v03-s12-profile-switch .nos{stroke:none}
.v03-s12-profile-switch .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v03-s12-profile-switch .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v03-s12-profile-switch .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v03-s12-profile-switch .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v03-s12-profile-switch .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v03-s12-profile-switch .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v03-s12-profile-switch .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v03-s12-profile-switch .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v03-s12-profile-switch .fa{fill:var(--acc);stroke:none}
.v03-s12-profile-switch .fo{fill:var(--ok);stroke:none}
.v03-s12-profile-switch .fr{fill:var(--rej);stroke:none}
.v03-s12-profile-switch .fm{fill:var(--line);stroke:none}
.v03-s12-profile-switch .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v03-s12-profile-switch .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v03-s12-profile-switch .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v03-s12-profile-switch .la{fill:none;stroke:var(--acc);stroke-width:2}
.v03-s12-profile-switch .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s12-profile-switch .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s12-profile-switch .hf{fill:var(--fg2)}.v03-s12-profile-switch .ha{fill:var(--acc)}.v03-s12-profile-switch .hr{fill:var(--rej)}.v03-s12-profile-switch .hm{fill:var(--mute)}.v03-s12-profile-switch .ho{fill:var(--ok)}
.v03-s12-profile-switch .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v03-s12-profile-switch .a{animation-duration:30s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v03-s12-profile-switch .a{animation:none}.v03-s12-profile-switch .tr{display:none}}
