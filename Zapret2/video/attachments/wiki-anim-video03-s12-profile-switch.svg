<rect class="bg" x="0" y="0" width="960" height="480"/>
<g class="a e1"><text class="cap" x="10" y="24">когда выбирается профиль и когда выбор повторяется</text></g>
<g class="a e2"><text class="tk" x="10" y="136">профиль 1</text><text class="sm mu" x="10" y="155">список имён</text><text class="tk" x="10" y="192">профиль 2</text><text class="sm mu" x="10" y="211">протокол tls</text><text class="tk" x="10" y="254">выбран</text><text class="sm mu" x="10" y="273">для этого пакета</text></g>
<g class="a e3"><rect class="bxa" x="160" y="42" width="180" height="30" rx="15"/><text class="tk c" x="250" y="63">SYN</text></g>
<g class="a e4"><text class="sm mu c" x="250" y="88">протокол и имя</text><text class="sm mu c" x="250" y="104">неизвестны</text></g>
<g class="a e5"><rect class="bxr" x="160" y="116" width="180" height="48" rx="7"/><text class="tk c rej" x="250" y="137">нет</text><text class="sm mu c" x="250" y="156">нужно имя, его нет</text></g>
<g class="a e6"><rect class="bxr" x="160" y="172" width="180" height="48" rx="7"/><text class="tk c rej" x="250" y="193">нет</text><text class="sm mu c" x="250" y="212">протокол неизвестен</text></g>
<g class="a e7"><rect class="bx" x="160" y="232" width="180" height="54" rx="7"/><text class="tk c fg" x="250" y="253">no_action</text><text class="sm mu c" x="250" y="276">выбор запоминается</text></g>
<g class="a e8"><rect class="bxa" x="360" y="42" width="180" height="30" rx="15"/><text class="tk c" x="450" y="63">SYN-ACK</text></g>
<g class="a e9"><text class="sm mu c" x="450" y="88">протокол и имя</text><text class="sm mu c" x="450" y="104">неизвестны</text></g>
<g class="a e10"><rect class="bxd" x="360" y="116" width="180" height="48" rx="7"/><text class="tk c mu" x="450" y="137">не проверяется</text><text class="sm mu c" x="450" y="156">выбор из памяти</text></g>
<g class="a e11"><rect class="bxd" x="360" y="172" width="180" height="48" rx="7"/><text class="tk c mu" x="450" y="193">не проверяется</text><text class="sm mu c" x="450" y="212">выбор из памяти</text></g>
<g class="a e12"><rect class="bx" x="360" y="232" width="180" height="54" rx="7"/><text class="tk c fg" x="450" y="253">no_action</text><text class="sm mu c" x="450" y="276">взят из памяти</text></g>
<g class="a e13"><rect class="bxa" x="560" y="42" width="180" height="30" rx="15"/><text class="tk c" x="650" y="63">ACK</text></g>
<g class="a e14"><text class="sm mu c" x="650" y="88">протокол и имя</text><text class="sm mu c" x="650" y="104">неизвестны</text></g>
<g class="a e15"><rect class="bxd" x="560" y="116" width="180" height="48" rx="7"/><text class="tk c mu" x="650" y="137">не проверяется</text><text class="sm mu c" x="650" y="156">выбор из памяти</text></g>
<g class="a e16"><rect class="bxd" x="560" y="172" width="180" height="48" rx="7"/><text class="tk c mu" x="650" y="193">не проверяется</text><text class="sm mu c" x="650" y="212">выбор из памяти</text></g>
<g class="a e17"><rect class="bx" x="560" y="232" width="180" height="54" rx="7"/><text class="tk c fg" x="650" y="253">no_action</text><text class="sm mu c" x="650" y="276">взят из памяти</text></g>
<g class="a e18"><rect class="bxa" x="760" y="42" width="180" height="30" rx="15"/><text class="tk c" x="850" y="63">приветствие</text></g>
<g class="a e19"><text class="sm mu c" x="850" y="88">протокол tls,</text><text class="sm mu c" x="850" y="104">имя www.example.com</text></g>
<g class="a e20"><rect class="bxr" x="760" y="116" width="180" height="48" rx="7"/><text class="tk c rej" x="850" y="137">нет</text><text class="sm mu c" x="850" y="156">три пробы negative</text></g>
<g class="a e21"><rect class="bxo" x="760" y="172" width="180" height="48" rx="7"/><text class="tk c ok" x="850" y="193">подходит</text><text class="sm mu c" x="850" y="212">протокол tls</text></g>
<g class="a e22"><rect class="bxo" x="760" y="232" width="180" height="54" rx="7"/><text class="tk c ok" x="850" y="253">профиль 2</text><text class="sm mu c" x="850" y="276">выбор повторён</text></g>
<g class="a e23 tr"><rect class="bxn" x="756" y="228" width="188" height="62" rx="9"/></g>
<g class="a e24"><rect class="bx" x="10" y="300" width="940" height="60" rx="7"/><text class="m" x="24" y="324"><tspan class="hb">desync profile changed by revealed l7 protocol or hostname !</tspan></text><text class="sm" x="24" y="347">в журнале: профиль изменился из-за открывшегося протокола или имени; дальше соединение ведёт профиль 2</text></g>
<g class="a e25"><text class="sm mu" x="10" y="394">сервер получил запрос кусками</text></g>
<g class="a e26"><rect class="bxa" x="10" y="404" width="166.4" height="32" rx="5"/><text class="tk c" x="93.2" y="426">104 байта</text><rect class="bxb" x="178.4" y="404" width="231.60000000000002" height="32" rx="5"/><text class="tk c" x="295.20000000000005" y="426">146 байт</text></g>
<g class="a e27"><text class="tk" x="430.0" y="426">104 + 146 = 250 байт</text></g>
<g class="a e28"><text class="tk" x="10" y="466">Профиль, которому нужно имя или протокол, видит соединение только с приветствия.</text></g>
</svg>
