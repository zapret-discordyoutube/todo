<svg xmlns="http://www.w3.org/2000/svg" class="v16-s02-detour" viewBox="0 0 960 574" width="960" height="574" role="img" aria-labelledby="v16-s02-detour-t v16-s02-detour-d">
<title id="v16-s02-detour-t">Окошко в ядре и программа за стеной</title>
<desc id="v16-s02-detour-d">Выдуманная картинка: слева ядро с лентой, на которой едут пакеты, справа отдельные программы (браузер, редактор, nfqws2). Двери между зданиями нет. У ленты пункт досмотра, окошко: пакеты, не выбранные правилом, едут мимо; выбранный пакет подъезжает к окошку, оригинал ждёт, копию уносят программе nfqws2, программа возвращает листок с решением, и ядро поступает с оригиналом по этому решению; следующий выбранный пакет ждёт очереди (упрощение, внутри ядра очередь не открывали). В документации сказано, что nfqws2 работает не в ядре, а передача пакетов из ядра в программу отнимает много ресурсов, поэтому лучше отфильтровать как можно больше прямо в ядре.</desc>
