<g><text class="cap" x="40" y="28">Как пакет попадает из ядра в программу и обратно</text></g>
<g><rect class="bxd" x="730" y="12" width="200" height="26" rx="6"/><text class="sm c" x="830" y="30">выдуманная картинка</text></g>
<g class="a e1"><rect class="bxs" x="30" y="52" width="530" height="218" rx="8"/><text class="tk" x="48" y="80">ЯДРО</text><text class="sm mu" x="112" y="80">сетевая часть ОС, лента пакетов</text><rect class="fs" x="48" y="188" width="496" height="12" rx="3"/><rect class="bxs" x="620" y="52" width="310" height="218" rx="8"/><text class="tk" x="638" y="80">ПРОГРАММЫ</text><text class="sm mu" x="638" y="102">снаружи ядра, user space</text></g>
<g class="a e2"><rect class="bx" x="636" y="138" width="84" height="78" rx="5"/><text class="sm c" x="678" y="202">браузер</text><rect class="bx" x="728" y="138" width="84" height="78" rx="5"/><text class="sm c" x="770" y="202">редактор</text><rect class="bxa" x="820" y="138" width="100" height="78" rx="5"/><text class="mk c ns" x="870" y="205">nfqws2</text></g>
<g class="a e3"><rect class="bxd" x="380" y="146" width="52" height="60" rx="4"/><text class="tk sm c" x="406" y="138">пункт досмотра</text></g>
<g class="a e4"><text class="sm c mu" x="580" y="160">нет</text><text class="sm c mu" x="590" y="178">двери</text></g>
<g class="a e5"><rect class="bx" x="56" y="156" width="36" height="30" rx="3"/><rect class="bx" x="106" y="156" width="36" height="30" rx="3"/></g>
<g class="a e6"><rect class="bx" x="500" y="156" width="36" height="30" rx="3"/></g>
<g class="a e7"><rect class="bxa" x="440" y="156" width="36" height="30" rx="3"/></g>
<g class="a e8"><rect class="bxs" x="440" y="156" width="36" height="30" rx="3"/></g>
<g class="a e9"><rect class="bxa" x="852" y="156" width="36" height="30" rx="3"/></g>
<g class="a e10"><rect class="bxb" x="388" y="214" width="40" height="22" rx="3"/></g>
<g class="a e11 tr"><text class="tk sm r" x="372" y="232">оригинал ждёт</text></g>
<g class="a e12 tr"><text class="tk sm c" x="870" y="126">копия</text></g>
<g class="a e13"><text class="tk sm amb" x="436" y="232">решение</text></g>
<g class="a e14 tr"><text class="sm r mu" x="372" y="252">следующий ждёт</text></g>
<g class="a e15"><circle class="bxa" cx="52" cy="293" r="11"/><text class="tk c ns" x="52" y="298">1</text><text class="sm" x="74" y="298">Выбранный пакет подъезжает к окошку, остальные едут мимо.</text></g>
<g class="a e16"><circle class="bxa" cx="52" cy="321" r="11"/><text class="tk c ns" x="52" y="326">2</text><text class="sm" x="74" y="326">Оригинал ждёт у окошка, копию уносят программе.</text></g>
<g class="a e17"><circle class="bxa" cx="52" cy="349" r="11"/><text class="tk c ns" x="52" y="354">3</text><text class="sm" x="74" y="354">Программа пишет листок «решение»; пока его нет, пакет стоит.</text></g>
<g class="a e18"><circle class="bxa" cx="52" cy="377" r="11"/><text class="tk c ns" x="52" y="382">4</text><text class="sm" x="74" y="382">Ядро поступает с оригиналом по листку; следующий выбранный ждёт очереди.</text></g>
<g class="a e19"><text class="sm mu" x="74" y="412">Что ядро делает с очередью внутри, мы не открывали: это упрощение.</text></g>
<g class="a e20"><rect class="bx" x="30" y="432" width="900" height="124" rx="8"/><text class="cap" x="48" y="458">Из документации zapret2</text><text class="sm" x="48" y="484">«Процесс перенаправления трафика из ядра <tspan class="tk acc">отнимает достаточно много ресурсов</tspan>, поэтому лучше всего</text><text class="sm" x="48" y="504"><tspan class="tk acc">отфильтровать как можно больше прямо в нём</tspan>.»  <tspan class="mu">docs/readme.md:74</tspan></text><text class="sm" x="48" y="532">«nfqws2 does not run in kernel mode; it is a <tspan class="tk acc">user-mode process</tspan>.»  <tspan class="mu">docs/manual.en.md:324</tspan></text></g>
</svg>
