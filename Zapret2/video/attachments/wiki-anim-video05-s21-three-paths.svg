<svg xmlns="http://www.w3.org/2000/svg" class="v05-s21-three-paths" viewBox="0 0 960 896" width="960" height="896" role="img" aria-labelledby="v05-s21-three-paths-t v05-s21-three-paths-d">
<title id="v05-s21-three-paths-t">Три пути оригинала целым</title>
<desc id="v05-s21-three-paths-d">Три пути, при которых оригинал уходит целым: тихий, громкий и сбой отправки; тихий путь, когда после разбора меток и вычёркивания единицы позиций не осталось, в нашем тесте дали pos=0 (перед первым байтом резать нельзя), пустой pos, pos=1220 и pos=250 при данных в 250 байт (позиция должна быть меньше длины данных) и pos=method на приветствии TLS (метка не того протокола), во всех пяти журнал пишет multisplit: no valid split positions и packet: id=4 pass unmodified, на проводе один пакет 1+250, побайтно равный тому, что видел nfqws2, а сервер прочитал 250 байт, равные оригиналу; громкий путь, pos=foo, даёт ошибку Lua bad marker list в строке 500 с записями LUA ERROR и desync ERROR. passing packet unmodified, на проводе тот же один пакет, так же выглядят неверный seqovl и пропавший узор, и после такой ошибки движок пропускает оригинал целым даже если другой вызов уже сказал «выбросить», а тихий выход цепочку не прерывает; третий путь виден только в прогоне функций с заглушкой вместо отправки: если не ушла первая часть, вердикт «пропустить» и пакетов 0, а при pos=2,midsld,endhost с частями 2, 102, 8 и 138 первая ушла, вторая отказала, вердикт «пропустить» и оригинал идёт следом за первой частью, настоящий сбой сырого сокета мы не воспроизводили; проверка: pos=249 на приветствии в 250 байт допустима, потому что меньше длины данных, и на проводе два пакета 1+249 и 250+1.</desc>
