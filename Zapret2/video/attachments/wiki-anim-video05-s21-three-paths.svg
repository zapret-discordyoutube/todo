1-three-paths-k20}@keyframes v05-s21-three-paths-k21{0.0%{opacity:0}75.758%{opacity:0}76.439%{opacity:1}97.424%{opacity:1}98.333%{opacity:0}100%{opacity:0}}.v05-s21-three-paths .e21{animation-name:v05-s21-three-paths-k21}@keyframes v05-s21-three-paths-k22{0.0%{opacity:0}84.848%{opacity:0}85.53%{opacity:1}97.424%{opacity:1}98.333%{opacity:0}100%{opacity:0}}.v05-s21-three-paths .e22{animation-name:v05-s21-three-paths-k22}</style>
<rect class="bg" x="0" y="0" width="960" height="896"/>
<g><text class="cap" x="40" y="24">нечего резать или всё сломано: оригинал уходит целым</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="300" rx="8"/><circle class="bxo" cx="62" cy="64" r="13"/><text class="tk c ns" x="62" y="69">1</text><text class="sm tk" x="86" y="69">путь 1, тихий: после разбора меток позиций не осталось</text></g>
<g class="a e2"><rect class="bxb" x="54" y="84" width="160" height="108" rx="6"/><text class="mk" x="64" y="106">pos=0</text><text class="sm" x="64" y="126">перед первым</text><text class="sm" x="64" y="143">байтом резать</text><text class="sm" x="64" y="160">нельзя: единицу</text><text class="sm" x="64" y="177">вычёркивают</text></g>
<g class="a e3"><rect class="bxb" x="224" y="84" width="160" height="108" rx="6"/><text class="mk" x="234" y="106">pos= (пусто)</text><text class="sm" x="234" y="126">в списке нет</text><text class="sm" x="234" y="143">ни одной метки</text></g>
<g class="a e4"><rect class="bxb" x="394" y="84" width="160" height="108" rx="6"/><text class="mk" x="404" y="106">pos=1220</text><text class="sm" x="404" y="126">позиция должна</text><text class="sm" x="404" y="143">быть меньше</text><text class="sm" x="404" y="160">длины данных</text></g>
<g class="a e5"><rect class="bxb" x="564" y="84" width="160" height="108" rx="6"/><text class="mk" x="574" y="106">pos=250</text><text class="sm" x="574" y="126">данные 250 байт:</text><text class="sm" x="574" y="143">позиция равна</text><text class="sm" x="574" y="160">длине, не меньше</text></g>
<g class="a e6"><rect class="bxb" x="734" y="84" width="160" height="108" rx="6"/><text class="mk" x="744" y="106">pos=method</text><text class="sm" x="744" y="126">метка не того</text><text class="sm" x="744" y="143">протокола ничего</text><text class="sm" x="744" y="160">не находит на TLS</text></g>
<g class="a e7"><text class="sm tk" x="54" y="218">журнал (во всех пяти):</text><text class="m" x="54" y="240">multisplit: no valid split positions</text><text class="m" x="54" y="260">packet: id=4 pass unmodified</text></g>
<g class="a e8"><text class="sm tk" x="500" y="218">провод и сервер:</text><rect class="bx" x="500" y="230" width="120" height="26" rx="4"/><text class="mk c" x="560" y="248">1+250</text><text class="sm" x="632" y="248">один пакет, побайтно равен тому,</text><text class="sm" x="632" y="266">что видел nfqws2</text><text class="sm" x="500" y="296">сервер: одно чтение 250 байт, равно оригиналу</text></g>
<g class="a e9"><text class="sm mu" x="54" y="296">выход без значения: движок считает это «пропустить»</text><text class="ix" x="54" y="318">desync.c:849-850, 867-868 · nfqws.c:337</text></g>
<g class="a e10"><rect class="bx" x="40" y="354" width="880" height="186" rx="8"/><circle class="bxr" cx="62" cy="378" r="13"/><text class="tk c ns" x="62" y="383">2</text><text class="sm tk" x="86" y="383">путь 2, громкий: неверный аргумент</text></g>
<g class="a e11"><rect class="bxr" x="54" y="398" width="200" height="28" rx="5"/><text class="mk c" x="154" y="417">pos=foo</text></g>
<g class="a e12"><path class="lr" d="M256 412L282.0 412.0"/><polygon class="hr" points="292,412 282.0,417.0 282.0,407.0"/><text class="m" x="300" y="417">resolve_multi_pos: bad marker list</text></g>
<g class="a e13"><text class="m" x="54" y="452">LUA ERROR: …zapret-antidpi.lua:500: bad marker list</text><text class="m" x="54" y="471">desync ERROR. passing packet unmodified.</text><text class="m" x="54" y="490">packet: id=4 pass unmodified</text></g>
<g class="a e14"><rect class="bx" x="690" y="398" width="110" height="26" rx="4"/><text class="mk c" x="745" y="416">1+250</text><text class="sm" x="812" y="417">один пакет</text><text class="sm mu" x="690" y="452">так же выглядят:</text><text class="sm mu" x="690" y="471">неверный seqovl,</text><text class="sm mu" x="690" y="490">пропавший узор</text></g>
<g class="a e15"><text class="sm tk" x="54" y="514">громкий: после ошибки движок пропускает оригинал целым, даже если раньше был DROP</text><text class="sm" x="54" y="532">тихий: цепочка стратегии идёт дальше</text></g>
<g class="a e16"><rect class="bx" x="40" y="550" width="880" height="226" rx="8"/><circle class="bxb" cx="62" cy="574" r="13"/><text class="tk c ns" x="62" y="579">3</text><text class="sm tk" x="86" y="579">путь 3, сбой отправки</text><text class="sm mu r" x="906" y="579">прогон функций: отправка заменена записью</text></g>
<g class="a e17"><text class="sm tk" x="54" y="610">первая часть не ушла (pos=midsld)</text><rect class="bxr" x="54" y="622" width="110" height="26" rx="4"/><text class="sm c" x="109" y="640">часть 1</text><text class="sm" x="176" y="640">→ PASS, пакетов 0, оригинал целый</text></g>
<g class="a e18"><text class="sm tk" x="54" y="676">pos=2,midsld,endhost: четыре части 2, 102, 8, 138; вторая отказала</text></g>
<g class="a e19"><rect class="bxo" x="54" y="688" width="46" height="26" rx="0"/><text class="ix c" x="77" y="706">2</text><rect class="bxr" x="104" y="688" width="138" height="26" rx="0"/><text class="ix c" x="173" y="706">102</text><rect class="bxd" x="246" y="688" width="58" height="26" rx="0"/><text class="ix c" x="275" y="706">8</text><rect class="bxd" x="308" y="688" width="190" height="26" rx="0"/><text class="ix c" x="403" y="706">138</text><text class="sm" x="54" y="734">вердикт PASS: оригинал идёт следом за первой частью</text></g>
<g class="a e20"><text class="sm mu" x="54" y="758">настоящий сбой сырого сокета мы не воспроизводили</text><text class="ix" x="620" y="758">antidpi:522-524</text></g>
<g class="a e21"><rect class="bxd" x="40" y="790" width="880" height="90" rx="8"/><text class="sm tk" x="54" y="814">проверь себя: pos=249 на приветствии в 250 байт, что на проводе?</text></g>
<g class="a e22"><rect class="bxa" x="54" y="830" width="330" height="26" rx="4"/><text class="mk c" x="219" y="848">1+249</text><rect class="bxo" x="392" y="830" width="60" height="26" rx="4"/><text class="ix c" x="422" y="848">250+1</text><text class="sm" x="466" y="843">два пакета: позиция 249 меньше длины 250, допустима</text><text class="ix mu" x="54" y="870">в нашем тесте так и вышло: сервер прочитал 249 и 1</text></g>
</svg>
