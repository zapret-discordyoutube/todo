<rect class="bg" x="0" y="0" width="960" height="804"/>
<g><text class="cap" x="40" y="22">итог части: срочный байт и ложное окно</text><rect class="pl" x="722.9" y="4" width="197.1" height="24" rx="12"/><text class="sm c" x="821.5" y="21">наш Linux и наш стенд</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="84" rx="8"/><text class="sm tk" x="54" y="64">срочный байт</text><text class="ix mu" x="54" y="84">oob</text><text class="sm" x="268" y="64">сдвиг на единицу; пакет PAU на 251 байт; наш Linux</text><text class="sm" x="268" y="82">вынимает байт; подстрока слепа посередине имени;</text><text class="sm" x="268" y="100">ловушки убивают соединение</text><rect class="pl" x="786.2" y="52" width="119.8" height="22" rx="11"/><text class="ix c fg" x="846.1" y="68">в нашем тесте</text></g>
<g class="a e2"><rect class="bx" x="40" y="134" width="880" height="84" rx="8"/><text class="sm tk" x="54" y="158">зажим окна у клиента</text><text class="ix mu" x="54" y="178">wssize</text><text class="sm" x="268" y="158">SYN, ACK и приветствие с окном 1; SYN со множителем 6;</text><text class="sm" x="268" y="176">первый кусок 64; 40 кусков вместо 5; цена в 5 раз по</text><text class="sm" x="268" y="194">времени, без отключения в 14</text><rect class="pl" x="786.2" y="146" width="119.8" height="22" rx="11"/><text class="ix c fg" x="846.1" y="162">в нашем тесте</text><rect class="pl" x="801.9" y="174" width="104.1" height="22" rx="11"/><text class="ix c fg" x="853.9" y="190">руководство</text></g>
<g class="a e3"><rect class="bx" x="40" y="228" width="880" height="66" rx="8"/><text class="sm tk" x="54" y="252">зажим на сервере</text><text class="ix mu" x="54" y="272">wsize на сервере</text><text class="sm" x="268" y="252">клиент режет своё приветствие 1 / 107 / 72 / 70 после</text><text class="sm" x="268" y="270">паузы около 0,2 с</text><rect class="pl" x="786.2" y="240" width="119.8" height="22" rx="11"/><text class="ix c fg" x="846.1" y="256">в нашем тесте</text></g>
<g class="a e4"><rect class="bx" x="40" y="304" width="880" height="66" rx="8"/><text class="sm tk" x="54" y="328">зажим на клиенте</text><text class="ix mu" x="54" y="348">wsize на клиенте</text><text class="sm" x="268" y="328">мёртв, пока не спрятать исходящие; тогда душит самого</text><text class="sm" x="268" y="346">клиента: 223,4 мс вместо 11,1</text><rect class="pl" x="786.2" y="316" width="119.8" height="22" rx="11"/><text class="ix c fg" x="846.1" y="332">в нашем тесте</text><rect class="pl" x="801.9" y="344" width="104.1" height="22" rx="11"/><text class="ix c fg" x="853.9" y="360">руководство</text></g>
<g class="a e5"><text class="cap" x="40" y="392">чего не знаем</text></g>
<g class="a e6"><rect class="bxg" x="40" y="400" width="280" height="66" rx="8"/><rect class="bxs" x="54" y="422" width="18" height="14" rx="3"/><path class="lm" d="M58 422L58 418Q63 410 68 418L68 422"/><text class="sm tk" x="84" y="426">другие получатели</text><text class="sm" x="84" y="448">не проверяли</text><rect class="bxg" x="340" y="400" width="280" height="66" rx="8"/><rect class="bxs" x="354" y="422" width="18" height="14" rx="3"/><path class="lm" d="M358 422L358 418Q363 410 368 418L368 422"/><text class="sm tk" x="384" y="426">настоящий инспектор</text><text class="sm" x="384" y="448">неизвестно</text><rect class="bxg" x="640" y="400" width="280" height="66" rx="8"/><rect class="bxs" x="654" y="422" width="18" height="14" rx="3"/><path class="lm" d="M658 422L658 418Q663 410 668 418L668 422"/><text class="sm tk" x="684" y="426">причина размеров и паузы</text><text class="sm" x="684" y="448">107 / 72 / 70: не нашли</text></g>
<g class="a e7"><rect class="bx" x="40" y="484" width="880" height="96" rx="8"/><text class="cap" x="54" y="508">проверь себя 1</text><text class="sm tk" x="54" y="532">wssize:wsize=1:scale=6: на каком исходящем отключается, какое окно потом?</text></g>
<g class="a e8 tr"><rect class="bxd" x="54" y="546" width="200" height="26" rx="6"/><text class="mk c" x="154" y="564">?</text></g>
<g class="a e9"><rect class="bxo" x="54" y="546" width="60" height="26" rx="6"/><text class="mk c" x="84" y="564">№ 3</text><rect class="bxo" x="124" y="546" width="50" height="26" rx="6"/><text class="mk c" x="149" y="564">63</text><text class="sm" x="190" y="564">SYN, ACK, приветствие; дальше окно, что записало ядро</text></g>
<g class="a e10"><rect class="bx" x="40" y="592" width="880" height="96" rx="8"/><text class="cap" x="54" y="616">проверь себя 2</text><text class="sm tk" x="54" y="640">что нужно, чтобы wsize сработала на клиенте?</text></g>
<g class="a e11 tr"><rect class="bxd" x="54" y="654" width="200" height="26" rx="6"/><text class="mk c" x="154" y="672">?</text></g>
<g class="a e12"><rect class="bxo" x="54" y="654" width="300" height="26" rx="6"/><text class="mk c" x="204" y="672">--in-range=a --out-range=x</text><text class="sm" x="370" y="672">иначе выключится на своём SYN или не увидит SYN-ACK</text></g>
<g class="a e13"><text class="cap" x="40" y="708">дальше в выпуске</text><rect class="pl" x="726.8" y="686" width="193.2" height="24" rx="12"/><text class="sm c" x="823.4" y="703">выпуск продолжается</text></g>
<g class="a e14"><rect class="bxb" x="40" y="716" width="280" height="44" rx="8"/><text class="sm tk c" x="180" y="744">ловушки окна</text></g>
<g class="a e15"><rect class="bxa" x="340" y="716" width="280" height="44" rx="8"/><text class="sm tk c" x="480" y="744">серверная сторона</text></g>
<g class="a e16"><rect class="bxo" x="640" y="716" width="280" height="44" rx="8"/><text class="sm tk c" x="780" y="744">код</text></g>
<g class="a e17"><text class="sm tk" x="40" y="786">все выводы относятся к нашему Linux и нашей модели</text></g>
