<svg xmlns="http://www.w3.org/2000/svg" class="v09-s20-part-summary-table" viewBox="0 0 960 804" width="960" height="804" role="img" aria-labelledby="v09-s20-part-summary-table-t v09-s20-part-summary-table-d">
<title id="v09-s20-part-summary-table-t">Итог части про срочный байт и ложное окно</title>
<desc id="v09-s20-part-summary-table-d">Итог части в четырёх строках: срочный байт даёт сдвиг на единицу, пакет с флагом и указателем, наш Linux вынимает байт и подстрока слепа посередине имени, зажим окна у клиента правит три пакета, первый кусок ответа 64 байта, ответ идёт в 5 раз дольше, а без отключения в 14, зажим в ответе сервера заставляет клиента резать приветствие на 1, 107, 72 и 70 после паузы около 0,2 с, а на клиенте функция мертва, пока не спрятать исходящие, и три вещи мы не знаем: других получателей, настоящий инспектор и причину размеров 107, 72, 70 и паузы, а на проверку ответы третий исходящий пакет с окном 63 в следующем и диапазоны входящих «всегда» и исходящих «никогда».</desc>
