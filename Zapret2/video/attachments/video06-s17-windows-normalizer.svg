ormalizer-k19{0.0%{opacity:0}74.405%{opacity:0}74.762%{opacity:1}92.857%{opacity:1}93.214%{opacity:0}100%{opacity:0}}.v06-s17-windows-normalizer .e19{animation-name:v06-s17-windows-normalizer-k19}@keyframes v06-s17-windows-normalizer-k20{0.0%{opacity:0}80.952%{opacity:0}81.488%{opacity:1}97.976%{opacity:1}98.69%{opacity:0}100%{opacity:0}}.v06-s17-windows-normalizer .e20{animation-name:v06-s17-windows-normalizer-k20}</style>
<rect class="bg" x="0" y="0" width="960" height="932"/>
<g><text class="cap" x="40" y="24">у каждого куска проигрыша своё окно позиций</text><text class="ix mu r" x="920" y="24">lua/zapret-antidpi.lua</text></g>
<g class="a e1"><text class="sm" x="40" y="48">зачем пересчёт: функция получает байты только своего куска, а метки посчитаны на всей сборке</text></g>
<g class="a e2"><rect class="bxa" x="40" y="68" width="858.7" height="26" rx="0"/><text class="ix c fg tk" x="469.3" y="86">кусок 1: 1448 байт</text><rect class="bxb" x="898.7" y="68" width="21.3" height="26" rx="0"/><path class="lcut" d="M898.7 64L898.7 98"/></g>
<g class="a e3"><path class="la" d="M41 104L41 111L897.7 111L897.7 104"/><text class="sm tk" x="40" y="132">окно куска 1: [1, 1449)</text></g>
<g class="a e4"><path class="lb" d="M899.7 104L899.7 111L919 111L919 104"/><text class="sm tk r" x="920" y="132">окно куска 2 (36 байт): [1449, 1485)</text></g>
<g class="a e5"><text class="sm mu" x="40" y="158">нижняя граница входит, верхняя нет; в коде позиции с единицы, в журнале с нуля: смещение = Lua − 1</text></g>
<g class="a e6"><rect class="bx" x="40" y="178" width="560" height="122" rx="6"/><path class="lm" d="M90 184L90 294"/><text class="ix mu r" x="82" y="208">542</text><text class="ix fg" x="100" y="208">function pos_normalize(pos, low, hi)</text><text class="ix mu r" x="82" y="244">543</text><text class="ix fg" x="100" y="244">    return (pos&gt;=low and pos&lt;hi) and (pos-low+1) or nil</text><text class="ix mu r" x="82" y="280">544</text><text class="ix fg" x="100" y="280">end</text></g>
<g class="a e7"><rect class="bx" x="620" y="178" width="300" height="122" rx="6"/><text class="sm tk" x="632" y="206">1 · pos в окне: low ≤ pos &lt; hi</text><text class="sm tk" x="632" y="240">2 · да: pos − low + 1</text><text class="sm" x="632" y="262">    это номер внутри куска</text><text class="sm tk" x="632" y="290">3 · нет: nil, пусто</text></g>
<g class="a e8 tr"><rect class="fa" x="43" y="221" width="554" height="34" rx="3"/></g>
<g class="a e9"><text class="cap" x="52" y="324">метка</text><text class="cap" x="160" y="324">смещение → код</text><text class="cap" x="340" y="324">кусок 1: [1, 1449)</text><text class="cap" x="600" y="324">кусок 2: [1449, 1485)</text></g>
<g class="a e10"><rect class="bx" x="40" y="334" width="110" height="34" rx="6"/><text class="mk" x="52" y="356">midsld</text><rect class="bx" x="160" y="334" width="160" height="34" rx="6"/><text class="m" x="172" y="356">104 → 105</text><rect class="bxo" x="330" y="334" width="250" height="34" rx="6"/><text class="sm tk ok" x="342" y="356">105 − 1 + 1 = 105</text><rect class="bx" x="590" y="334" width="330" height="34" rx="6"/><text class="sm tk mu" x="602" y="356">пусто</text></g>
<g class="a e11"><rect class="bx" x="40" y="376" width="110" height="34" rx="6"/><text class="mk" x="52" y="398">−1</text><rect class="bx" x="160" y="376" width="160" height="34" rx="6"/><text class="m" x="172" y="398">1483 → 1484</text><rect class="bx" x="330" y="376" width="250" height="34" rx="6"/><text class="sm tk mu" x="342" y="398">пусто</text><rect class="bxo" x="590" y="376" width="330" height="34" rx="6"/><text class="sm tk ok" x="602" y="398">1484 − 1449 + 1 = 36, в журнале 35</text></g>
<g class="a e12"><text class="cap" x="40" y="440">список позиций: pos_array_normalize</text><text class="ix mu r" x="920" y="440">строки 545-556</text></g>
<g class="a e13"><rect class="bx" x="40" y="450" width="470" height="134" rx="6"/><path class="lm" d="M90 456L90 578"/><text class="ix mu r" x="82" y="477">548</text><text class="ix fg" x="100" y="477">while i&lt;=#pos do</text><text class="ix mu r" x="82" y="507">549</text><text class="ix fg" x="100" y="507">  pos[i] = pos_normalize(pos[i], low, hi)</text><text class="ix mu r" x="82" y="537">551</text><text class="ix fg" x="100" y="537">    i = i + 1</text><text class="ix mu r" x="82" y="567">553</text><text class="ix fg" x="100" y="567">    table.remove(pos, i);</text></g>
<g class="a e14"><rect class="bx" x="530" y="450" width="390" height="134" rx="6"/><text class="sm" x="542" y="474">идёт по списку и пересчитывает</text><text class="sm tk" x="542" y="498">пусто: ячейку удалить</text><text class="sm tk" x="542" y="522">и счётчик i не двигать</text><text class="sm" x="542" y="546">список правится на месте</text></g>
<g class="a e15"><rect class="bx" x="40" y="600" width="430" height="130" rx="6"/><text class="sm tk" x="52" y="624">кусок 1 · окно [1, 1449)</text><text class="sm mu" x="52" y="648">список {105, 1484}</text><text class="sm" x="52" y="672">i=1: 105 остаётся</text><text class="sm" x="52" y="696">i=2: 1484 → nil, ячейка удалена</text><text class="sm tk ok" x="52" y="720">итог: {105}</text></g>
<g class="a e16"><rect class="bx" x="490" y="600" width="430" height="130" rx="6"/><text class="sm tk" x="502" y="624">кусок 2 · окно [1449, 1485)</text><text class="sm mu" x="502" y="648">список {105, 1484}</text><text class="sm" x="502" y="672">i=1: 105 → nil, ячейка удалена, i на месте</text><text class="sm" x="502" y="696">снова i=1: 1484 → 36, потом i=2: конец</text><text class="sm tk ok" x="502" y="720">итог: {36}</text></g>
<g class="a e17"><text class="sm mu" x="40" y="752">потом delete_pos_1 (669) убирает позицию 1: разрез перед первым байтом куска не считается</text></g>
<g class="a e18"><rect class="bxd" x="40" y="776" width="880" height="34" rx="6"/><text class="sm tk" x="52" y="798">проверь себя: метка на смещении 1448, это первый байт куска 2; что с ней сделает пересчётчик?</text></g>
<g class="a e19 tr"><text class="sm r rej tk" x="890.7" y="60">метка на смещении 1448 ▼</text></g>
<g class="a e20"><rect class="bxo" x="40" y="820" width="880" height="92" rx="6"/><text class="sm tk" x="52" y="844">в коде позиция 1449. Кусок 1: 1449 &lt; 1449 неверно, результат пусто</text><text class="sm tk" x="52" y="868">Кусок 2: 1449 − 1449 + 1 = 1, и позицию 1 убирает delete_pos_1</text><text class="sm tk" x="52" y="892">метка пропала на обоих кусках: разреза нет нигде (по коду, проверим в опыте)</text></g>
</svg>
