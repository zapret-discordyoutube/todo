<svg xmlns="http://www.w3.org/2000/svg" class="v06-s17-windows-normalizer" viewBox="0 0 960 932" width="960" height="932" role="img" aria-labelledby="v06-s17-windows-normalizer-t v06-s17-windows-normalizer-d">
<title id="v06-s17-windows-normalizer-t">Окно куска и пересчётчик</title>
<desc id="v06-s17-windows-normalizer-d">Окна кусков проигрыша и пересчётчик окна pos_normalize (zapret-antidpi.lua, строки 542-544): окно куска 1 это позиции от 1 до 1448 (нижняя граница входит, верхняя 1449 нет), окно куска 2 от 1449 до 1484, позиция в коде равна смещению плюс один, и метка midsld (смещение 104, позиция 105) даёт на куске 1 номер 105 и пусто на куске 2, а метка минус один (смещение 1483, позиция 1484) даёт на куске 1 пусто и на куске 2 номер 1484 − 1449 + 1 = 36 (в журнале 35); пересчёт списка pos_array_normalize (545-556) для списка из 105 и 1484 оставляет на куске 1 одно значение 105, а на куске 2 удаляет 105 без сдвига счётчика и оставляет 36; по счёту в коде, а не по запуску, метка на смещении 1448 пропадает на обоих кусках: на куске 1 она равна верхней границе и даёт пусто, на куске 2 она становится позицией 1 и её убирает delete_pos_1.</desc>
<style>.v06-s17-windows-normalizer{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
