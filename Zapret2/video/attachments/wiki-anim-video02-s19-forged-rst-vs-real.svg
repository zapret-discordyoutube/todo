<g class="a e1"><rect class="bx" x="15" y="14" width="170" height="50" rx="8"/><text class="tk c sm" x="100" y="36">клиент</text><text class="mt mu c" x="100" y="55">10.1.0.1</text><path class="lmd" d="M100 66L100 214"/><rect class="bx" x="395" y="14" width="170" height="50" rx="8"/><text class="tk c sm" x="480" y="36">роутер с правилом</text><text class="mt mu c" x="480" y="55">игрушечный инспектор</text><path class="lmd" d="M480 66L480 214"/><rect class="bx" x="775" y="14" width="170" height="50" rx="8"/><text class="tk c sm" x="860" y="36">сервер</text><text class="mt mu c" x="860" y="55">10.2.0.2</text><path class="lmd" d="M860 66L860 214"/></g>
<g class="a e2"><path class="lf" d="M108 94L462.0 94.0"/><polygon class="hf" points="472,94 462.0,99.0 462.0,89.0"/><text class="sm c" x="290" y="86">запрос, 250 Б</text></g>
<g class="a e3 tr"><rect class="dot" x="-7" y="-7" width="14" height="14" rx="7"/></g>
<g class="a e4"><path class="lr" d="M494 86L510 102"/><path class="lr" d="M494 102L510 86"/><text class="sm rej" x="520" y="99">выброшен</text></g>
