<g class="a e6 tr"><rect class="dotr" x="-7" y="-7" width="14" height="14" rx="7"/></g>
<g class="a e7"><text class="sm" x="502" y="145">через 0,010 мс; отправитель: адрес сервера</text></g>
<g class="a e8"><path class="lf" d="M852 190L498.0 190.0"/><polygon class="hf" points="488,190 498.0,185.0 498.0,195.0"/><path class="lf" d="M472 190L118.0 190.0"/><polygon class="hf" points="108,190 118.0,185.0 118.0,195.0"/><text class="sm c" x="670" y="182">TTL 64</text><text class="sm c hb" x="290" y="182">TTL 63</text><text class="sm mu" x="10" y="222">для сравнения: настоящие пакеты сервера, дошедшие до клиента, роутер вычитает единицу</text></g>
<g class="a e9 tr"><rect class="dot" x="-7" y="-7" width="14" height="14" rx="7"/></g>
<g class="a e10"><text class="tk sm" x="214" y="262">поддельный RST (54 Б)</text><text class="tk sm" x="580" y="262">настоящие пакеты сервера</text><path class="lm" d="M10 272L950 272"/></g>
<g class="a e11"><rect class="bxo" x="8" y="280" width="944" height="30" rx="5"/><text class="sm tk" x="18" y="301">отправитель</text><text class="sm" x="214" y="301">10.2.0.2, адрес сервера</text><text class="sm" x="580" y="301">10.2.0.2</text></g>
<g class="a e12"><rect class="bxo" x="8" y="314" width="944" height="30" rx="5"/><text class="sm tk" x="18" y="335">номер seq</text><text class="sm" x="214" y="335">1859754862 = начальный номер сервера + 1</text><text class="sm" x="580" y="335">тот же номер отправил бы сервер</text></g>
<g class="a e13"><rect class="bxb" x="8" y="348" width="944" height="30" rx="5"/><text class="sm tk" x="18" y="369">время жизни TTL</text><text class="sm tk" x="214" y="369">64</text><text class="sm tk" x="580" y="369">63</text></g>
<g class="a e14"><rect class="bxb" x="8" y="382" width="944" height="30" rx="5"/><text class="sm tk" x="18" y="403">опции TCP</text><text class="sm tk" x="214" y="403">нет (заголовок 20 байт)</text><text class="sm tk" x="580" y="403">есть, метка времени</text></g>
<g class="a e15"><rect class="bxb" x="8" y="416" width="944" height="30" rx="5"/><text class="sm tk" x="18" y="437">окно</text><text class="sm tk" x="214" y="437">0</text><text class="sm tk" x="580" y="437">64 или 65160</text></g>
<g class="a e16"><rect class="bxb" x="8" y="450" width="944" height="30" rx="5"/><text class="sm tk" x="18" y="471">флаг ACK</text><text class="sm tk" x="214" y="471">нет, только RST</text><text class="sm tk" x="580" y="471">стоит</text></g>
<g class="a e17"><text class="sm tk" x="10" y="504">Совпадает то, что нужно, чтобы клиент принял сброс; отличается всё остальное.</text></g>
<g class="a e18"><text class="sm" x="10" y="528">Клиент получил «Connection reset by peer», сервер получил 0 байт.</text></g>
<g class="a e19"><text class="sm mu" x="10" y="552">Это наблюдение нашей лаборатории: в настоящей сети числа могут быть другими.</text></g>
