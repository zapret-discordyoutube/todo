<svg xmlns="http://www.w3.org/2000/svg" class="v02-s19-forged-rst" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="v02-s19-forged-rst-t v02-s19-forged-rst-d">
<title id="v02-s19-forged-rst-t">Поддельный сброс и настоящие пакеты</title>
<desc id="v02-s19-forged-rst-d">Подделанный сброс из лаборатории: роутер с игрушечным правилом выбрасывает запрос и сам присылает клиенту RST на 54 байта с адресом сервера и номером, который сервер отправил бы следующим (1859754862), но у подделки время жизни 64 против 63 у настоящих пакетов сервера, нет опций TCP (у настоящих есть метка времени), окно 0 против 64 или 65160 и нет флага ACK; клиент получил Connection reset by peer, сервер получил 0 байт; это наблюдение нашей лаборатории, в настоящей сети числа могут быть другими.</desc>
