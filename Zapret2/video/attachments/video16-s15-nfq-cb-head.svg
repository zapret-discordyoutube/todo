<svg xmlns="http://www.w3.org/2000/svg" class="v16-s15-nfq-cb-head" viewBox="0 0 960 628" width="960" height="628" role="img" aria-labelledby="v16-s15-nfq-cb-head-t v16-s15-nfq-cb-head-d">
<title id="v16-s15-nfq-cb-head-t">Приёмщик nfq_cb: начало</title>
<desc id="v16-s15-nfq-cb-head-d">Приёмщик nfq_cb (nfqws.c:285-339, 55 строк): библиотека зовёт его один раз на каждый пакет, положенный ядром в очередь. Карточка функции. Вход: qh, ручка очереди, нужна только чтобы отправить вердикт; nfmsg, заголовок сообщения, тело его не использует; nfa, пакет в виде структуры библиотеки; cookie, блок данных из создания очереди (вспомогательный сокет и буфер для изменённого пакета). Выход: результат nfq_set_verdict2, вердикт уходит ядру, или 0. Вызывает: nfq_get_msg_packet_hdr, nfq_get_nfmark, nfq_get_payload, ioctl, processPacketData, nfq_set_verdict2. Вызывается библиотекой из nfq_handle_packet (nfqws.c:578). Начало функции по строкам: 296 заголовок пакета (если его нет, return 0, автор: так не бывает); 297 номер пакета в очереди id; 299 метка пакета mark; 300 содержимое и его длина ilen; 306-314 имена интерфейсов через ioctl на одном постоянном вспомогательном сокете, комментарий автора в 302-304 говорит, что это экономит процессор в 5-10 раз (мы не измеряли), нулевой номер или ошибка дают пустое имя; 316 строка журнала packet: id=… len=… mark=… ifin=… ifout=…. Всё это приёмщик делает до того, как кому-либо покажет пакет.</desc>
