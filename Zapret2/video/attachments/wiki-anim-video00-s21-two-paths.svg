<svg xmlns="http://www.w3.org/2000/svg" class="v00-s21-two-paths" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="v00-s21-two-paths-t v00-s21-two-paths-d">
<title id="v00-s21-two-paths-t">Два пути по курсу</title>
<desc id="v00-s21-two-paths-d">Есть два пути по курсу: путь для тех, кто хочет пользоваться, идёт через основы, пару про язык, разрезание на части, фейк, выпуск про blockcheck2 и выпуск про установку и запуск, а остальное по мере нужды, а путь для тех, кто хочет понять, идёт по всем выпускам по порядку, потом читаем и отлаживаем стратегии, а блок под капотом в самом конце, и это наше предложение, которое мы на зрителях не проверяли.</desc>
