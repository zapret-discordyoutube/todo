<rect class="bg" x="0" y="0" width="960" height="508"/>
<g><text class="cap" x="24" y="24">два пути по курсу</text></g>
<g class="a e1"><rect class="bxa" x="24" y="40" width="446" height="32" rx="8"/><text class="tk" x="38" y="62">хочу пользоваться</text></g>
<g class="a e2"><rect class="bx" x="24" y="80" width="446" height="38" rx="6"/><rect class="bxa" x="24" y="80" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="104">основы</text><text class="sm" x="162" y="105">«Письмо в сортировочном центре»</text></g>
<g class="a e3"><rect class="bx" x="24" y="124" width="446" height="38" rx="6"/><rect class="bxa" x="24" y="124" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="148">основы</text><text class="sm" x="162" y="149">«Что видит наблюдатель»</text></g>
<g class="a e4"><rect class="bx" x="24" y="168" width="446" height="38" rx="6"/><rect class="bxo" x="24" y="168" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="192">язык</text><text class="sm" x="162" y="193">«Читаем командную строку zapret2»</text></g>
<g class="a e5"><rect class="bx" x="24" y="212" width="446" height="38" rx="6"/><rect class="bxo" x="24" y="212" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="236">язык</text><text class="sm" x="162" y="237">«Где резать: метки»</text></g>
<g class="a e6"><rect class="bx" x="24" y="256" width="446" height="38" rx="6"/><rect class="bxo" x="24" y="256" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="280">приёмы</text><text class="sm" x="162" y="281">«multisplit: резать на части»</text></g>
<g class="a e7"><rect class="bx" x="24" y="300" width="446" height="38" rx="6"/><rect class="bxo" x="24" y="300" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="324">приёмы</text><text class="sm" x="162" y="325">«Фейк и его условия»</text></g>
<g class="a e8"><rect class="bx" x="24" y="344" width="446" height="38" rx="6"/><rect class="bxb" x="24" y="344" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="368">инструменты</text><text class="sm" x="162" y="369">выпуск про blockcheck2</text></g>
<g class="a e9"><rect class="bx" x="24" y="388" width="446" height="38" rx="6"/><rect class="bxb" x="24" y="388" width="126" height="38" rx="6"/><text class="sm tk c" x="87" y="412">инструменты</text><text class="sm" x="162" y="413">выпуск про установку и запуск</text></g>
<g class="a e10"><rect class="bxs" x="24" y="432" width="446" height="32" rx="6"/><text class="sm tk" x="38" y="453">остальное по мере нужды</text></g>
<g class="a e11"><rect class="bxo" x="490" y="40" width="446" height="32" rx="8"/><text class="tk" x="504" y="62">хочу понять</text></g>
<g class="a e12"><rect class="bx" x="490" y="80" width="446" height="52" rx="6"/><text class="sm tk" x="504" y="102">все выпуски по порядку</text><text class="sm mu" x="504" y="122">блоки подряд, один за другим</text></g>
<g class="a e13"><rect class="bxo" x="490" y="148" width="446" height="52" rx="6"/><text class="sm tk" x="504" y="170">«Читаем и отлаживаем стратегии»</text><text class="sm mu" x="504" y="190">проверка своими руками</text></g>
<g class="a e14"><path class="lf" d="M713 133L713.0 136.0"/><polygon class="hf" points="713,146 708.0,136.0 718.0,136.0"/></g>
<g class="a e15"><rect class="bxg" x="490" y="216" width="446" height="52" rx="6"/><text class="sm tk" x="504" y="238">блок «под капотом»</text><text class="sm mu" x="504" y="258">в самом конце</text></g>
<g class="a e16"><path class="lf" d="M713 201L713.0 204.0"/><polygon class="hf" points="713,214 708.0,204.0 718.0,204.0"/></g>
<g class="a e17"><rect class="bxb" x="490" y="292" width="446" height="138" rx="8"/><text class="sm tk" x="504" y="318">если вы хорошо знаете TCP и TLS,</text><text class="sm tk" x="504" y="340">«Что видит наблюдатель» можно</text><text class="sm tk" x="504" y="362">смотреть выборочно</text><text class="sm" x="504" y="390">риск: дальше звучит словарь именно этого выпуска</text><text class="sm" x="504" y="414">сомневаетесь, с чего начать: начните с основ</text></g>
<g class="a e18"><rect class="bxd" x="490" y="442" width="446" height="52" rx="8"/><text class="sm tk c" x="713" y="463">наше предложение,</text><text class="sm tk c" x="713" y="483">на зрителях мы его не проверяли</text></g>
