<title id="v00-s05-may-help-t">Может помочь, но не гарантирует</title>
<desc id="v00-s05-may-help-d">Программа zapret2 может помочь, а не обходит и не снимает блокировки, и слово может означает возможно, но без гарантий и всегда с проверкой; три случая нельзя назвать ни да, ни нет, это замедление, протоколы и белые списки.</desc>
