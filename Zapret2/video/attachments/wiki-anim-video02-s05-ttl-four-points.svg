.v02-s05-ttl .hf{fill:var(--fg2)}.v02-s05-ttl .ha{fill:var(--acc)}.v02-s05-ttl .hr{fill:var(--rej)}.v02-s05-ttl .hm{fill:var(--mute)}.v02-s05-ttl .hb{fill:var(--amb)}
.v02-s05-ttl .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
