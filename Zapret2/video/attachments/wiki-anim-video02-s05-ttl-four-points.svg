<rect class="bg" x="0" y="0" width="960" height="492"/>
<g><text class="cap" x="40" y="26">Время жизни: один и тот же пакет (IP id 64005) в четырёх точках записи</text></g>
<g><text class="tk" x="40" y="54">запрос клиента</text></g>
<g><rect class="bxd" x="266" y="66" width="428" height="134" rx="10"/><text class="cap" x="280" y="83">РОУТЕР</text></g>
<g class="a e1"><rect class="bx" x="40" y="92" width="170" height="100" rx="8"/><text class="tk sm" x="54" y="116">клиент</text><text class="big" x="54" y="152">TTL 64</text><text class="m" x="54" y="178">сумма IP 2bbf</text></g>
<g class="a e2"><rect class="bx" x="276.7" y="92" width="170" height="100" rx="8"/><text class="tk sm" x="290.7" y="116">вход роутера</text><text class="big" x="290.7" y="152">TTL 64</text><text class="m" x="290.7" y="178">сумма IP 2bbf</text></g>
<g class="a e3"><rect class="bxb" x="513.3" y="92" width="170" height="100" rx="8"/><text class="tk sm" x="527.3" y="116">выход роутера</text><text class="big" x="527.3" y="152">TTL 63</text><text class="m" x="527.3" y="178">сумма IP 2cbf</text></g>
<g class="a e4"><rect class="bxb" x="750" y="92" width="170" height="100" rx="8"/><text class="tk sm" x="764" y="116">сервер</text><text class="big" x="764" y="152">TTL 63</text><text class="m" x="764" y="178">сумма IP 2cbf</text></g>
<g><path class="lmd" d="M125 192L125 212"/><path class="lmd" d="M361.7 192L361.7 212"/><path class="lmd" d="M598.3 192L598.3 212"/><path class="lmd" d="M835 192L835 212"/><path class="lmd" d="M125 212L835 212"/></g>
<g class="a e5 tr"><circle class="bxa" cx="0" cy="0" r="8"/></g>
<g class="a e6"><path class="la" d="M450 140L500.0 140.0"/><polygon class="ha" points="510,140 500.0,145.0 500.0,135.0"/><text class="big c" x="480" y="126">−1</text></g>
<g class="a e7"><text class="sm mu" x="40" y="246">сумма заголовка IP изменилась вместе с TTL: 2bbf → 2cbf (как её считают, дальше)</text></g>
<g class="a e8"><text class="tk" x="40" y="284">ответ сервера, в обратную сторону</text></g>
<g class="a e9"><rect class="bx" x="750" y="296" width="170" height="66" rx="8"/><text class="tk sm" x="764" y="320">сервер</text><text class="big" x="764" y="349">TTL 64</text></g>
<g class="a e10"><path class="la" d="M744 329L226.0 329.0"/><polygon class="ha" points="216,329 226.0,324.0 226.0,334.0"/><text class="tk sm c" x="480" y="317">роутер: −1</text></g>
<g class="a e11"><rect class="bxb" x="40" y="296" width="170" height="66" rx="8"/><text class="tk sm" x="54" y="320">клиент</text><text class="big" x="54" y="349">TTL 63</text></g>
<g class="a e12"><text class="tk sm" x="40" y="400">TTL это запас переходов: каждый роутер вычитает единицу, а пакет с нулём выбрасывают.</text><text class="sm" x="40" y="422">Так сеть защищается от пакетов, которые ходят по кругу вечно.</text></g>
<g class="a e13"><text class="sm mu" x="40" y="450">Начальное значение выбирает отправитель: у нашего клиента и сервера оно 64.</text><text class="sm mu" x="40" y="470">Обычно это значение операционной системы по умолчанию, а не закон.</text></g>
</svg>
