<svg xmlns="http://www.w3.org/2000/svg" class="v02-s05-ttl" viewBox="0 0 960 492" width="960" height="492" role="img" aria-labelledby="v02-s05-ttl-t v02-s05-ttl-d">
<title id="v02-s05-ttl-t">Время жизни в четырёх точках</title>
<desc id="v02-s05-ttl-d">Время жизни одного и того же пакета (IP id 64005) в четырёх точках записи в нашей лаборатории: на клиенте 64, на входе в роутер 64, на выходе из роутера 63, на сервере 63; роутер вычитает единицу, а контрольная сумма IP заодно меняется с 2bbf на 2cbf; пакет сервера идёт в обратную сторону так же: на сервере 64, на клиенте 63.</desc>
