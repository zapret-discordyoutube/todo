ations .e10{animation-name:v00-s18-two-rotations-k10}@keyframes v00-s18-two-rotations-k11{0.0%{opacity:0}56.25%{opacity:0}57.188%{opacity:1}96.458%{opacity:1}97.708%{opacity:0}100%{opacity:0}}.v00-s18-two-rotations .e11{animation-name:v00-s18-two-rotations-k11}</style>
<rect class="bg" x="0" y="0" width="960" height="496"/>
<g><text class="cap" x="24" y="24">ротация: два разных механизма</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bxo" x="24" y="46" width="410" height="124" rx="8"/><text class="big tk" x="40" y="76">Lua: circular</text><text class="sm tk ok" x="40" y="104">следующая стратегия</text><text class="sm" x="40" y="130">после нескольких неудач переключается</text><text class="sm" x="40" y="152">на следующую стратегию из списка</text></g>
<g class="a e2"><rect class="bxa" x="526" y="46" width="410" height="124" rx="8"/><text class="big tk" x="542" y="76">Си-часть: список имён</text><text class="sm tk acc" x="542" y="104">автоматический список имён</text><text class="sm" x="542" y="130">после повторных неудач записывает</text><text class="sm" x="542" y="152">имя сайта в файл, стратегию не меняет</text></g>
<g class="a e3"><circle class="bxr" cx="480" cy="92" r="26"/><text class="big tk c ns" x="480" y="100">≠</text><text class="sm tk rej c" x="480" y="142">не путать</text></g>
<g class="a e4"><rect class="bx" x="24" y="192" width="912" height="214" rx="8"/><text class="sm tk" x="40" y="218">вот журнал из нашего теста: так Lua доходит до смены стратегии</text></g>
<g class="a e5"><rect class="bx" x="38" y="230" width="440" height="26" rx="5"/><text class="lg" x="46" y="248">LUA: standard_failure_detector: retransmission 3/3</text><path class="lm" d="M486 243L510.0 243.0"/><polygon class="hm" points="520,243 510.0,248.0 510.0,238.0"/><text class="sm" x="530" y="248">повторные отправки: три из трёх</text></g>
<g class="a e6"><rect class="bx" x="38" y="262" width="440" height="26" rx="5"/><text class="lg" x="46" y="280">LUA: automate: failure detected</text><path class="lm" d="M486 275L510.0 275.0"/><polygon class="hm" points="520,275 510.0,280.0 510.0,270.0"/><text class="sm" x="530" y="280">обнаружен сбой</text></g>
<g class="a e7"><rect class="bx" x="38" y="294" width="440" height="26" rx="5"/><text class="lg" x="46" y="312">LUA: automate: failure counter 3/3</text><path class="lm" d="M486 307L510.0 307.0"/><polygon class="hm" points="520,307 510.0,312.0 510.0,302.0"/><text class="sm" x="530" y="312">счётчик сбоев: три из трёх</text></g>
<g class="a e8"><rect class="bxo" x="38" y="326" width="440" height="26" rx="5"/><text class="lgk" x="46" y="344">LUA: circular: rotate strategy to 2</text><path class="lm" d="M486 339L510.0 339.0"/><polygon class="hm" points="520,339 510.0,344.0 510.0,334.0"/><text class="sm tk" x="530" y="344">переключаемся на вторую стратегию</text></g>
<g class="a e9"><rect class="bxr" x="40" y="362" width="170" height="30" rx="6"/><text class="sm tk c" x="125" y="382">стратегия 1: сбой</text><path class="lf" d="M214 377L256.0 377.0"/><polygon class="hf" points="266,377 256.0,382.0 256.0,372.0"/><rect class="bxo" x="270" y="362" width="232" height="30" rx="6"/><text class="sm tk c" x="386" y="382">стратегия 2: теперь она</text></g>
<g class="a e10"><rect class="bxd" x="24" y="420" width="440" height="52" rx="8"/><text class="sm tk c" x="244" y="441">о настоящих блокировках</text><text class="sm tk c" x="244" y="461">мы не утверждаем, помогает ли это</text></g>
<g class="a e11"><rect class="bxd" x="480" y="420" width="456" height="52" rx="8"/><text class="sm tk c" x="708" y="441">подробно автоматику разбирает</text><text class="sm tk c" x="708" y="461">выпуск про автоматическую смену стратегий</text></g>
</svg>
