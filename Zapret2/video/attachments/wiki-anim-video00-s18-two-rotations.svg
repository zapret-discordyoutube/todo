<svg xmlns="http://www.w3.org/2000/svg" class="v00-s18-two-rotations" viewBox="0 0 960 496" width="960" height="496" role="img" aria-labelledby="v00-s18-two-rotations-t v00-s18-two-rotations-d">
<title id="v00-s18-two-rotations-t">Два механизма ротации</title>
<desc id="v00-s18-two-rotations-d">Ротация это два разных механизма, которые нельзя путать: на Lua переключение на следующую стратегию после нескольких неудач, а в Си-части автоматический список имён с записью в файл, и в нашем тесте журнал показывает три из трёх повторных отправок, обнаруженный сбой, счётчик три из трёх и переключение на вторую стратегию, а о настоящих блокировках мы ничего не утверждаем.</desc>
