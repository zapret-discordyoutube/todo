<svg xmlns="http://www.w3.org/2000/svg" class="v16-s26-toy-call-site" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v16-s26-toy-call-site-t v16-s26-toy-call-site-d">
<title id="v16-s26-toy-call-site-t">Первый пакет: игрушка и вызов в конце обработки</title>
<desc id="v16-s26-toy-call-site-d">Игрушечная картинка, наша иллюстрация к комментарию автора, не проверенный факт: ядро заводит запись о разговоре по первому пакету; если изъять его совсем (штамп DROP), по словам автора, запись может развалиться; тогда клерк подкладывает вместо него нарочно испорченную копию: по комментарию автора, у неё недопустимый протокол и малое время жизни. Код: в конце обработки TCP-пакета, desync.c:1660, стоит условие: пакет нашей стороны соединения (не ps.bReverseFixed) и стратегия вернула DROP; тогда вызывается ct_new_postnat_fix, иначе вердикт возвращается как есть. Анимация: штамп DROP на пакете номер один заменяется янтарным штампом MODIFY. Такая же строка есть в функции для UDP, desync.c:1993. DROP единственный штамп, при котором пакет исчезает, поэтому проверка только для него: это наше понимание.</desc>
