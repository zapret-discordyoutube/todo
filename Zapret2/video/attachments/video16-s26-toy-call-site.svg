nslate(0px,-6px)}}.v16-s26-toy-call-site .e4{animation-name:v16-s26-toy-call-site-k4}@keyframes v16-s26-toy-call-site-k5{0.0%{opacity:0;transform:translate(0px,-6px)}32.353%{opacity:0;transform:translate(0px,-6px)}34.706%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e5{animation-name:v16-s26-toy-call-site-k5}@keyframes v16-s26-toy-call-site-k6{0.0%{opacity:0;transform:translate(0px,-6px)}35.294%{opacity:0;transform:translate(0px,-6px)}37.647%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e6{animation-name:v16-s26-toy-call-site-k6}@keyframes v16-s26-toy-call-site-k7{0.0%{opacity:0;transform:translate(0px,-6px)}37.647%{opacity:0;transform:translate(0px,-6px)}40%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e7{animation-name:v16-s26-toy-call-site-k7}@keyframes v16-s26-toy-call-site-k8{0.0%{opacity:0;transform:translate(0px,-6px)}39.706%{opacity:0;transform:translate(0px,-6px)}42.059%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e8{animation-name:v16-s26-toy-call-site-k8}@keyframes v16-s26-toy-call-site-k9{0.0%{opacity:0}42.647%{opacity:0}43.676%{opacity:1}54.412%{opacity:1}55.441%{opacity:0}100%{opacity:0}}.v16-s26-toy-call-site .e9{animation-name:v16-s26-toy-call-site-k9}@keyframes v16-s26-toy-call-site-k10{0.0%{opacity:0;transform:translate(0px,-6px)}55.294%{opacity:0;transform:translate(0px,-6px)}57.647%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e10{animation-name:v16-s26-toy-call-site-k10}@keyframes v16-s26-toy-call-site-k11{0.0%{opacity:0;transform:translate(0px,-6px)}56.765%{opacity:0;transform:translate(0px,-6px)}59.118%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e11{animation-name:v16-s26-toy-call-site-k11}@keyframes v16-s26-toy-call-site-k12{0.0%{opacity:0;transform:translate(0px,-6px)}61.765%{opacity:0;transform:translate(0px,-6px)}64.118%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e12{animation-name:v16-s26-toy-call-site-k12}@keyframes v16-s26-toy-call-site-k13{0.0%{opacity:0;transform:translate(0px,-6px)}73.529%{opacity:0;transform:translate(0px,-6px)}75.882%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}96.765%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v16-s26-toy-call-site .e13{animation-name:v16-s26-toy-call-site-k13}</style>
<rect class="bg" x="0" y="0" width="960" height="560"/>
<g><text class="cap" x="40" y="26">наша картинка к комментарию автора, не проверенный факт</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="280" height="188" rx="8"/><text class="sm tk" x="54" y="66">1. первое письмо заводит</text><text class="sm tk" x="54" y="86">запись о разговоре</text><rect class="bxa" x="58" y="136" width="76" height="44" rx="5"/><text class="sm tk c" x="96" y="163">пакет 1</text><path class="lf" d="M138 158L160 158"/><polygon class="hf" points="170,158 160,163 160,153"/><rect class="bxo" x="174" y="136" width="130" height="44" rx="5"/><text class="sm tk ok c" x="239" y="163">запись есть</text><text class="sm mu" x="54" y="210">так бывает при обычной работе</text></g>
<g class="a e2"><rect class="bxr" x="340" y="40" width="280" height="188" rx="8"/><text class="sm tk" x="354" y="66">2. письмо изъято (DROP):</text><text class="sm" x="354" y="86">запись, по словам автора,</text><text class="sm" x="354" y="106">может развалиться</text><rect class="bxa" x="358" y="136" width="76" height="44" rx="5"/><text class="sm tk c" x="396" y="163">пакет 1</text><rect class="bxrd" x="474" y="136" width="130" height="44" rx="5"/><text class="sm tk rej c" x="539" y="163">запись?</text><text class="sm mu" x="354" y="210">письмо не дошло до записи</text><rect class="bxr" x="368" y="122" width="56" height="24" rx="4"/><text class="ix tk rej c" x="396" y="139">DROP</text></g>
<g class="a e3"><rect class="bxb" x="640" y="40" width="280" height="188" rx="8"/><text class="sm tk" x="654" y="66">3. клерк подкладывает</text><text class="sm tk" x="654" y="86">негодную копию</text><rect class="bxb" x="658" y="136" width="76" height="44" rx="5"/><text class="sm tk amb c" x="696" y="163">копия</text><path class="lf" d="M738 158L760 158"/><polygon class="hf" points="770,158 760,163 760,153"/><rect class="bxo" x="774" y="136" width="130" height="44" rx="5"/><text class="sm tk ok c" x="839" y="163">запись цела</text><text class="sm" x="654" y="106">протокол 255, время жизни 1</text><text class="sm mu" x="654" y="210">по комментарию автора</text></g>
<g class="a e4"><text class="cap" x="40" y="256">что стоит в конце обработки TCP-пакета: desync.c:1659-1660</text></g>
<g class="a e5"><rect class="bx" x="40" y="270" width="700" height="30" rx="4"/><text class="ix" x="52" y="290">1659</text><text class="m" x="104" y="290">pass:</text></g>
<g class="a e6"><rect class="bxa" x="40" y="306" width="700" height="106" rx="4"/><text class="ix" x="52" y="332">1660</text><text class="m" x="104" y="332">return (!ps.bReverseFixed &amp;&amp; (ps.verdict &amp; VERDICT_MASK)</text><text class="m" x="124" y="354">== VERDICT_DROP)</text><text class="m" x="124" y="376">? ct_new_postnat_fix(ps.ctrack, dis, mod_pkt, len_mod_pkt)</text><text class="m" x="124" y="398">: ps.verdict;</text></g>
<g class="a e7"><text class="sm mu" x="52" y="434">строка 1660 перенесена на несколько строк для показа</text></g>
<g class="a e8"><rect class="bxa" x="770" y="276" width="150" height="60" rx="6"/><text class="sm tk c" x="845" y="312">пакет 1</text></g>
<g class="a e9 tr"><rect class="bxr" x="795" y="348" width="100" height="32" rx="5"/><text class="mk rej c" x="845" y="370">DROP</text></g>
<g class="a e10"><rect class="bxb" x="795" y="348" width="100" height="32" rx="5"/><text class="mk amb c" x="845" y="370">MODIFY</text></g>
<g class="a e11"><text class="sm c" x="845" y="404">штамп DROP стал</text><text class="sm c" x="845" y="424">янтарным MODIFY</text></g>
<g class="a e12"><text class="sm tk" x="40" y="462">Условие: пакет нашей стороны (не обратное направление) и стратегия вернула DROP.</text><text class="sm" x="40" y="484">Тогда вызывается ct_new_postnat_fix; иначе вердикт возвращается как есть.</text></g>
<g class="a e13"><text class="sm" x="40" y="512">Такая же строка есть в функции для UDP: desync.c:1993.</text><text class="sm mu" x="40" y="534">Проверка только для DROP: по нашему пониманию, это единственный штамп, при котором пакет исчезает.</text></g>
</svg>
