<g class="a e5"><path class="lad" d="M206 96L206 172"/><rect class="bxda" x="206" y="172" width="42" height="26" rx="5"/><text class="sm tk acc c" x="227" y="190">sld</text><path class="lad" d="M338 96L338 172"/><rect class="bxda" x="338" y="172" width="72.4" height="26" rx="5"/><text class="sm tk acc c" x="374.2" y="190">midsld</text><path class="lad" d="M514 96L514 172"/><rect class="bxda" x="514" y="172" width="72.5" height="26" rx="5"/><text class="sm tk acc c" x="550.2" y="190">endsld</text><text class="sm mu" x="206" y="222">слово example: второе справа слово имени</text></g>
<g class="a e6"><rect class="bxa" x="30" y="252" width="290" height="120" rx="8"/><text class="tk" x="44" y="278">abs, host, endhost</text><text class="sm" x="44" y="304">abs: просто число</text><text class="sm" x="44" y="324">host: начало имени</text><text class="sm" x="44" y="344">endhost: первый байт сразу</text><text class="sm" x="44" y="364">после имени</text></g>
<g class="a e7"><rect class="bxd" x="335" y="252" width="290" height="120" rx="8"/><text class="tk" x="349" y="278">sld, midsld, endsld</text><text class="sm" x="349" y="304">sld: начало слова example</text><text class="sm" x="349" y="324">midsld: его середина</text><text class="sm" x="349" y="344">endsld: его конец</text><text class="sm" x="349" y="364">числа для них: дальше в серии</text></g>
<g class="a e8"><rect class="bxb" x="640" y="252" width="290" height="120" rx="8"/><text class="tk" x="654" y="278">method, extlen, sniext</text><text class="sm" x="654" y="304">зависят от типа пакета:</text><text class="sm" x="654" y="324">method: начало слова GET и т. п.</text><text class="sm" x="654" y="344">в запросе HTTP;</text><text class="sm" x="654" y="364">extlen, sniext: в приветствии TLS</text></g>
<g class="a e9"><text class="cap" x="30" y="404">метод в запросе HTTP: девять слов, заглавными, после слова пробел</text></g>
<g class="a e10"><rect class="bx" x="30" y="418" width="42.2" height="28" rx="5"/><text class="mk c" x="51.1" y="437">GET</text><rect class="bx" x="80.2" y="418" width="50.9" height="28" rx="5"/><text class="mk c" x="105.7" y="437">POST</text><rect class="bx" x="139.1" y="418" width="50.9" height="28" rx="5"/><text class="mk c" x="164.5" y="437">HEAD</text><rect class="bx" x="198" y="418" width="77.1" height="28" rx="5"/><text class="mk c" x="236.6" y="437">OPTIONS</text><rect class="bx" x="283.1" y="418" width="42.2" height="28" rx="5"/><text class="mk c" x="304.2" y="437">PUT</text><rect class="bx" x="333.3" y="418" width="68.4" height="28" rx="5"/><text class="mk c" x="367.5" y="437">DELETE</text><rect class="bx" x="409.7" y="418" width="77.1" height="28" rx="5"/><text class="mk c" x="448.3" y="437">CONNECT</text><rect class="bx" x="494.8" y="418" width="59.7" height="28" rx="5"/><text class="mk c" x="524.7" y="437">TRACE</text><rect class="bx" x="562.5" y="418" width="59.7" height="28" rx="5"/><text class="mk c" x="592.4" y="437">PATCH</text></g>
<g class="a e11"><rect class="bxr" x="690" y="418" width="42.2" height="28" rx="5"/><text class="mk c" x="711.1" y="437">get</text><path class="lr" d="M741.2 425L755.2 439M741.2 439L755.2 425"/><text class="sm tk rej" x="764.2" y="437">не из девяти</text></g>
<g class="a e12"><text class="sm tk" x="30" y="478">Запрос с «get» маленькими буквами получит ярлык «неизвестно»:</text><text class="sm" x="30" y="500">для такого пакета работают только числа, слова-метки не понимаются (по коду: nfq2/protocol.c:251).</text></g>
</svg>
