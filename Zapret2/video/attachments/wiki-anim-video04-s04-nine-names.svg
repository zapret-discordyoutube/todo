.v04-s04-nine-names .hf{fill:var(--fg2)}.v04-s04-nine-names .ha{fill:var(--acc)}.v04-s04-nine-names .hr{fill:var(--rej)}.v04-s04-nine-names .hm{fill:var(--mute)}
