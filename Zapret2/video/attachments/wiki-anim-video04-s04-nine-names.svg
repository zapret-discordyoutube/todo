<svg xmlns="http://www.w3.org/2000/svg" class="v04-s04-nine-names" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v04-s04-nine-names-t v04-s04-nine-names-d">
<title id="v04-s04-nine-names-t">Девять имён меток</title>
<desc id="v04-s04-nine-names-d">Девять имён меток. Верхняя схема на имени www.example.com: host это начало имени, endhost первый байт сразу после имени; sld, midsld и endsld это начало, середина и конец слова example (второго справа слова имени). Три карточки: abs это просто число; sld, midsld, endsld про слово example; method, extlen и sniext зависят от типа пакета. Внизу девять слов-методов запроса HTTP (GET, POST, HEAD, OPTIONS, PUT, DELETE, CONNECT, TRACE, PATCH, заглавными, после слова пробел); «get» маленькими буквами не из девяти, пакет получит ярлык «неизвестно» и для него работают только числа.</desc>
<style>
.v04-s04-nine-names{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
