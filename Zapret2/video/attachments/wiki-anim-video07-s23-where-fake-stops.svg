<g><text class="cap" x="40" y="26">по строке на условие: что меняется и где подделка остановилась</text></g>
<g class="a e1"><text class="sm tk c" x="424" y="62">клиент</text><text class="sm tk c" x="504" y="50">вход</text><text class="sm tk c" x="504" y="68">роутера</text><text class="sm tk c" x="584" y="50">выход</text><text class="sm tk c" x="584" y="68">роутера</text><text class="sm tk c" x="664" y="62">сервер</text><text class="sm tk" x="740" y="62">сервер получил</text></g>
<g class="a e2"><text class="tk sm amb" x="40" y="92">умирает в пути</text></g>
<g class="a e3"><rect class="bxb" x="40" y="100" width="880" height="46" rx="6"/><text class="tk sm" x="52" y="120">срок жизни</text><text class="sm" x="52" y="138">ip_ttl=1: в заголовке IP срок жизни 1</text><circle class="bxo" cx="424" cy="123" r="9"/><circle class="bxo" cx="504" cy="123" r="9"/><circle class="bxd" cx="584" cy="123" r="9"/><circle class="bxd" cx="664" cy="123" r="9"/><text class="tk sm" x="740" y="120">250 B чисто</text><text class="sm" x="740" y="138">роутер вернул ICMP</text></g>
<g class="a e4"><text class="tk sm ok" x="40" y="172">доезжает и умирает у получателя</text></g>
<g class="a e5"><rect class="bx" x="40" y="180" width="880" height="46" rx="6"/><text class="tk sm" x="52" y="200">MD5</text><text class="sm" x="52" y="218">заголовок TCP вырос с 32 до 52 байт</text><circle class="bxo" cx="424" cy="203" r="9"/><circle class="bxo" cx="504" cy="203" r="9"/><circle class="bxo" cx="584" cy="203" r="9"/><circle class="bxo" cx="664" cy="203" r="9"/><text class="tk sm" x="740" y="208">250 B чисто</text></g>
<g class="a e6"><rect class="bx" x="40" y="232" width="880" height="46" rx="6"/><text class="tk sm" x="52" y="252">плохая сумма</text><text class="sm" x="52" y="270">неверно одно поле, остальное в порядке</text><circle class="bxo" cx="424" cy="255" r="9"/><circle class="bxo" cx="504" cy="255" r="9"/><circle class="bxo" cx="584" cy="255" r="9"/><circle class="bxo" cx="664" cy="255" r="9"/><text class="tk sm" x="740" y="260">250 B чисто</text></g>
<g class="a e7"><rect class="bx" x="40" y="284" width="880" height="46" rx="6"/><text class="tk sm" x="52" y="304">плохой номер</text><text class="sm" x="52" y="322">tcp_seq=−10000: подделка вся в прошлом</text><circle class="bxo" cx="424" cy="307" r="9"/><circle class="bxo" cx="504" cy="307" r="9"/><circle class="bxo" cx="584" cy="307" r="9"/><circle class="bxo" cx="664" cy="307" r="9"/><text class="tk sm" x="740" y="312">250 B чисто</text></g>
<g class="a e8"><rect class="bx" x="40" y="336" width="880" height="46" rx="6"/><text class="tk sm" x="52" y="356">плохое подтверждение</text><text class="sm" x="52" y="374">tcp_ack=−1000: номер ACK на 1000 назад</text><circle class="bxo" cx="424" cy="359" r="9"/><circle class="bxo" cx="504" cy="359" r="9"/><circle class="bxo" cx="584" cy="359" r="9"/><circle class="bxo" cx="664" cy="359" r="9"/><text class="tk sm" x="740" y="364">250 B чисто</text></g>
<g class="a e9"><rect class="bx" x="40" y="388" width="880" height="46" rx="6"/><text class="tk sm" x="52" y="408">снят ACK</text><text class="sm" x="52" y="426">флаги подделки: остался один PSH</text><circle class="bxo" cx="424" cy="411" r="9"/><circle class="bxo" cx="504" cy="411" r="9"/><circle class="bxo" cx="584" cy="411" r="9"/><circle class="bxo" cx="664" cy="411" r="9"/><text class="tk sm" x="740" y="416">250 B чисто</text></g>
