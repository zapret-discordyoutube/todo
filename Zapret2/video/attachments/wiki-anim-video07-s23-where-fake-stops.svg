<title id="v07-s23-where-fake-stops-t">Где подделка остановилась</title>
<desc id="v07-s23-where-fake-stops-d">Матрица условий, первая половина: по семи строкам видно, что меняется в пакете подделки и в каких из четырёх точек съёма она появилась, срок жизни 1 даёт подделку только на клиенте и на входе в роутер и роутер возвращает сообщение об ошибке, а остальные шесть условий доезжают до сервера, и при каждом из них сервер получил чистые 250 байт.</desc>
