<svg xmlns="http://www.w3.org/2000/svg" class="v16-s13-one-turn" viewBox="0 0 960 632" width="960" height="632" role="img" aria-labelledby="v16-s13-one-turn-t v16-s13-one-turn-d">
<title id="v16-s13-one-turn-t">Один оборот главного цикла</title>
<desc id="v16-s13-one-turn-d">Один оборот главного цикла nfq_main (nfqws.c:530-598), как рабочий день клерка по кругу: ждать (строки 537-561), подмести (lua_do_gc, 562), посмотреть записку «перечитай списки» (ReloadCheck, 563), взять письмо и разобрать (recv, 566, и nfq_handle_packet, 578), и снова с начала. Скелет кода: внешний цикл for на строке 532, в нём проверка флага завершения (534) и внутренний цикл for на строке 535 с этими четырьмя делами; если чтение не удалось, внутренний цикл выходит, причину разбирают отдельно (567, 591-598). Ожидание в двух режимах: если у скриптов есть таймеры, цикл ждёт вызовом select (547) до данных в сокете или срока ближайшего таймера, и при нуле recv пропускается (564); если таймеров нет, select не вызывается (bt_next = bt = 0; res = 1, строки 558-560), и цикл сидит в блокирующем recv. Какой режим работает в наших опытах, не проверяли: это устройство кода.</desc>
