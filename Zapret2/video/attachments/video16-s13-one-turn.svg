<g class="a e27"><rect class="bxa" x="520" y="226" width="400" height="136" rx="8"/><text class="tk" x="536" y="250">есть таймеры у скриптов</text><text class="ix r" x="906" y="250">:537</text><text class="m" x="536" y="274">select(fd+1, &amp;fdset, NULL, NULL, &amp;tv)</text><text class="ix r" x="906" y="274">:547</text><text class="sm" x="536" y="298">вернётся: данные в сокете или</text><text class="sm" x="536" y="318">срок ближайшего таймера (будильник)</text><text class="sm mu" x="536" y="344">res == 0: recv пропускается (:564)</text></g>
<g class="a e28"><rect class="bx" x="520" y="376" width="400" height="112" rx="8"/><text class="tk" x="536" y="400">таймеров нет</text><text class="ix r" x="906" y="400">:556</text><text class="m" x="536" y="424">bt_next = bt = 0;  res = 1;</text><text class="ix r" x="906" y="424">:558-560</text><text class="sm" x="536" y="450">select не вызывается совсем: цикл сидит</text><text class="sm" x="536" y="470">в recv, он блокируется до данных</text></g>
<g class="a e29"><text class="sm mu" x="520" y="510">Какой режим в наших опытах, не проверяли.</text></g>
<g class="a e30"><text class="sm" x="40" y="548">Уборка и записка стоят до чтения: с таймерами после select,</text><text class="sm" x="40" y="568">без таймеров прямо перед recv, где цикл потом и ждёт.</text></g>
<g class="a e31"><text class="sm" x="40" y="596">Приёмщик nfq_cb вызывается из этого же цикла, следующее чтение после его возврата.</text><text class="sm mu" x="40" y="614">Вывод из кода: потоков нет; саму библиотеку не читали.</text></g>
</svg>
