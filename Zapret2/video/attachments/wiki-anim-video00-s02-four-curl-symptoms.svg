<g class="a e2"><text class="cap" x="740" y="26">что видит человек</text></g>
<g class="a e3"><rect class="bx" x="40" y="44" width="660" height="48" rx="8"/><circle class="fa" cx="64" cy="68.0" r="12"/><text class="mk c" x="64" y="73">1</text><text class="mn" x="88" y="73">curl: (28) Operation timed out after 1002 milliseconds with 0 bytes received</text></g>
