<svg xmlns="http://www.w3.org/2000/svg" class="v00-s02-four-curl-symptoms" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="v00-s02-four-curl-symptoms-t v00-s02-four-curl-symptoms-d">
<title id="v00-s02-four-curl-symptoms-t">Четыре примера curl и симптомы</title>
<desc id="v00-s02-four-curl-symptoms-d">Четыре примера вывода программы curl из документации при блокировке только по имени сайта: два тайм-аута это зависание, ответ 307 с адресом другой страницы это заглушка, сброс соединения другой стороной это быстрая ошибка, а примера замедления среди них нет, причём заглушку и замедление в лаборатории не воспроизводили.</desc>
