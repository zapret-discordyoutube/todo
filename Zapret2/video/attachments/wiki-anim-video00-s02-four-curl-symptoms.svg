<g class="a e6"><rect class="bx" x="40" y="230" width="660" height="48" rx="8"/><circle class="fa" cx="64" cy="254.0" r="12"/><text class="mk c" x="64" y="259">4</text><text class="mn" x="88" y="259">curl: (35) Recv failure: Connection reset by peer</text></g>
