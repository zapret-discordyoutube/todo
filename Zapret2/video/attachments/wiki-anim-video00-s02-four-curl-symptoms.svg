<g class="a e15"><rect class="bxd" x="40" y="300" width="660" height="56" rx="8"/><text class="sm tk" x="56" y="324">заглушку и замедление в лаборатории не воспроизводили:</text><text class="sm" x="56" y="344">о них говорим только по документации и общим сведениям</text></g>
<g class="a e16"><rect class="bxb" x="40" y="376" width="220.5" height="24" rx="5"/><text class="cap amb" x="50" y="392.5">ПО ОБЩИМ СВЕДЕНИЯМ</text><text class="sm" x="272.5" y="394">по симптому действие угадывается лишь приблизительно:</text><text class="sm" x="272.5" y="414">обычные сбои выглядят так же</text></g>
