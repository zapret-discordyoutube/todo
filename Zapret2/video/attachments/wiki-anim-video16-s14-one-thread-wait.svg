<g><text class="cap" x="40" y="26">один поток: поиск по исходникам и опыт t10</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="400" height="128" rx="8"/><text class="tk sm" x="54" y="64">поиск по исходникам nfq2/*.c, *.h</text><text class="m" x="60" y="90">pthread</text><text class="mk" x="300" y="90">0 совпадений</text><text class="m" x="60" y="112">thrd_create</text><text class="mk" x="300" y="112">0 совпадений</text><text class="m" x="60" y="134">CreateThread</text><text class="mk" x="300" y="134">0 совпадений</text><text class="sm mu" x="54" y="158">fork(): только daemonize, sec.c:344</text></g>
<g class="a e2"><rect class="bxa" x="460" y="40" width="460" height="128" rx="8"/><text class="tk" x="476" y="64">значит, пакеты строго по одному</text><text class="sm" x="476" y="90">в порядке прихода; пока один пакет внутри</text><text class="sm" x="476" y="110">скрипта на Lua, остальные ждут в очереди</text><text class="sm" x="476" y="130">ядра: по настройке до 4096 (Q_MAXLEN)</text><text class="ix" x="476" y="152">params.h:27</text></g>
<g class="a e3"><text class="cap" x="40" y="202">опыт t10: пакеты 4, 5 и 6</text></g>
<g class="a e4"><rect class="bxs" x="40" y="214" width="420" height="100" rx="8"/><text class="tk sm" x="54" y="236">очередь ядра</text><rect class="bxd" x="48" y="250" width="64" height="50" rx="6"/><rect class="bxd" x="124" y="250" width="64" height="50" rx="6"/><rect class="bxd" x="200" y="250" width="64" height="50" rx="6"/><rect class="bxd" x="276" y="250" width="64" height="50" rx="6"/><rect class="bxd" x="352" y="250" width="100" height="50" rx="6"/><text class="ix r" x="452" y="236">голова очереди</text></g>
<g class="a e5"><rect class="bxb" x="560" y="214" width="360" height="100" rx="8"/><text class="tk sm" x="574" y="236">nfqws2: один поток</text><text class="sm" x="574" y="258">пакет 4 в скрипте Lua:</text><text class="sm" x="574" y="278">запрос режется на две части,</text><text class="sm" x="574" y="298">обе уходят на провод</text></g>
