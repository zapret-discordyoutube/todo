<svg xmlns="http://www.w3.org/2000/svg" class="v16-s14-one-thread-wait" viewBox="0 0 960 652" width="960" height="652" role="img" aria-labelledby="v16-s14-one-thread-wait-t v16-s14-one-thread-wait-d">
<title id="v16-s14-one-thread-wait-t">Один поток: остальные ждут</title>
<desc id="v16-s14-one-thread-wait-d">Программа nfqws2 обрабатывает пакеты строго по одному. Поиск по исходным текстам (nfq2/*.c и nfq2/*.h): pthread, thrd_create и CreateThread дают 0 совпадений; единственный fork стоит в функции daemonize (sec.c:344) и параллельной обработки пакетов не создаёт. Значит, пока один пакет находится внутри скрипта на Lua, остальные ждут в очереди ядра; по настройке очереди ждать может до 4096 пакетов (Q_MAXLEN, params.h:27). Анимация по опыту t10: пакет 4, запрос, программа держит и разрезает на две части; пакеты 5 и 6, ответы сервера, стоят в очереди. Порядок событий на ленте: часть 1 вышла на провод, ответы 5 и 6 пришли на интерфейс клиента почти сразу, программа увидела ответы заметно позже, по нашему объяснению потому, что ещё дописывала обработку запроса; расстояния не в масштабе, величину ожидания не называем: на неё влиял диск журнала. Подтверждение второй части (7) пришло позже: это пауза до ответа сервера, а не ожидание в очереди. Номера в очереди в каждом из 92 журналов идут подряд с единицы без пропусков: ни один пакет из попавших в очередь не остался без записи, очередь одна; о потоках номера ничего не говорят, о потоках говорит только код.</desc>
