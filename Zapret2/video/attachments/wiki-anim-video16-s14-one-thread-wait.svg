<g class="a e12"><text class="cap" x="40" y="372">порядок событий на ленте времени (расстояния не в масштабе)</text></g>
<g class="a e13"><path class="lf" d="M40 408L910.0 408.0"/><polygon class="hf" points="920,408 910.0,413.0 910.0,403.0"/></g>
<g class="a e14"><rect class="bxa" x="112" y="398" width="16" height="20" rx="3"/><text class="tk c" x="120" y="444">1</text><text class="sm c" x="120" y="466">часть 1 вышла</text><text class="sm c" x="120" y="484">на провод</text></g>
<g class="a e15"><rect class="bxo" x="392" y="398" width="16" height="20" rx="3"/><text class="tk c" x="400" y="444">2</text><text class="sm c" x="400" y="466">ответы 5 и 6 на интерфейсе</text><text class="sm c" x="400" y="484">клиента, почти сразу</text></g>
<g class="a e16"><rect class="bxb" x="752" y="398" width="16" height="20" rx="3"/><text class="tk c" x="760" y="444">3</text><text class="sm c" x="760" y="466">программа увидела 5 и 6,</text><text class="sm c" x="760" y="484">заметно позже</text></g>
<g class="a e17"><text class="sm" x="40" y="518">Почему позже: по нашему объяснению, программа ещё дописывала</text><text class="sm" x="40" y="538">обработку запроса. Это объяснение, не измерение.</text></g>
<g class="a e18"><text class="sm mu" x="40" y="562">Величину ожидания не называем: на неё влиял диск журнала. Важен порядок.</text></g>
<g class="a e19"><rect class="bx" x="40" y="580" width="880" height="56" rx="6"/><text class="sm" x="54" y="604">Номера в очереди в каждом из 92 журналов идут подряд с 1: пропусков среди попавших</text><text class="sm" x="54" y="624">в очередь нет, очередь одна. О потоках номера не говорят, о потоках говорит только код.</text></g>
