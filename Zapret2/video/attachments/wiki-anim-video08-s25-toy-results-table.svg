<svg xmlns="http://www.w3.org/2000/svg" class="v08-s25-toy-results-table" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="v08-s25-toy-results-table-t v08-s25-toy-results-table-d">
<title id="v08-s25-toy-results-table-t">Таблица остановок живых игрушек</title>
<desc id="v08-s25-toy-results-table-d">Таблица живых игрушек в роутере, которые выбрасывают пакеты: без стратегии пакетный и первый записал останавливают соединение на первом пакете и сервер получает 0 байт; с multisplit пакетный имя не находит и сервер получает 250 байт, четыре собирающих читателя останавливают на втором пакете и сервер получает 104 байта; с fakedsplit и fakeddisorder и условием MD5 ни один из пяти не нашёл имя и сервер получил 250 байт, равных оригиналу; с hostfakesplit пакетный, склейщик и последний записал останавливают на третьем пакете и сервер получает 97 байт, а первый записал и строго по порядку не находят имя; в паре фейк и multisplit склейщик и последний записал останавливают на четвёртом пакете и сервер получает 104 байта; у fakedsplit без условия ни один читатель не нашёл имя, но сервер получил 250 байт, и все они нули, поэтому слеп читатель не значит цело соединение.</desc>
