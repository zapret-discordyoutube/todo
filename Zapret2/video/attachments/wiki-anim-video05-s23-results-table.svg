<g class="a e9"><rect class="bxr" x="40" y="438" width="12" height="12" rx="2"/><text class="ix" x="58" y="449">модель нашла имя (проверяющий видит)</text><rect class="bxo" x="380" y="438" width="12" height="12" rx="2"/><text class="ix" x="398" y="449">не нашла: игрушку обошли</text><text class="ix mu" x="40" y="470">+ / −: имя найдено / не найдено;  SNI: приветствие разобрано, имя прочитано</text><text class="ix mu" x="40" y="488">нет: разбор приветствия с начала потока не удался</text></g>
<g class="a e10"><rect class="bxa" x="40" y="504" width="880" height="98" rx="8"/><text class="sm tk" x="54" y="528">только про эти шесть игрушек</text><text class="sm" x="54" y="550">C, которая следит за номерами как приёмник, накладки не замечает;</text><text class="sm" x="54" y="569">у D и E поток начинается с подкладки, и ломается разбор приветствия с начала потока;</text><text class="sm" x="54" y="588">F переживает подкладку в виде пустой записи, но не нули и не другие узоры</text></g>
<g class="a e11"><rect class="bxb" x="40" y="614" width="880" height="84" rx="8"/><text class="sm tk" x="54" y="638">руководство проекта пишет (docs/manual.en.md:4049), близко к тексту:</text><text class="sm" x="54" y="658">если проверяющий не следит за номерами, он может проглотить сегмент целиком и поверить</text><text class="sm" x="54" y="676">ложным данным в его начале, а сервер их не примет; на настоящем оборудовании мы это не проверяли</text></g>
<g class="a e12"><rect class="bxd" x="40" y="708" width="880" height="52" rx="8"/><text class="sm" x="54" y="730">не знаем: какая из шести моделей похожа на настоящее оборудование и похожа ли вообще;</text><text class="sm" x="54" y="749">как ведут себя другие приёмники. Про настоящий ТСПУ эти опыты не говорят ничего</text></g>
</svg>
