<svg xmlns="http://www.w3.org/2000/svg" class="v05-s23-results-table" viewBox="0 0 960 784" width="960" height="784" role="img" aria-labelledby="v05-s23-results-table-t v05-s23-results-table-d">
<title id="v05-s23-results-table-t">Результаты шести моделей</title>
<desc id="v05-s23-results-table-d">Таблица результатов шести игрушечных моделей в нашем тесте, где плюс значит, что модель нашла имя, минус что не нашла, SNI что она разобрала приветствие и прочла имя, а нет что разбор с начала потока не удался: при разрезе midsld без накладки первая и вторая не находят имя, а с третьей по шестую читают SNI; при накладке в 5 байт с узором 16 03 03 00 00 третья и шестая читают SNI, а четвёртая и пятая не разбирают; при накладке из нулей, при узоре AB CD, при 64 байтах начала поддельного приветствия и при накладке в 1400 байт читает только третья; при том же узоре 16 03 03 00 00 вместе с nodrop первая и вторая находят имя в оригинале, третья и шестая читают SNI, четвёртая и пятая не разбирают, а при midsld с nodrop без накладки имя находят все шесть; это выводы только про шесть игрушек, руководство проекта пишет, что проверяющий без слежения за номерами может проглотить сегмент целиком и поверить ложным данным в его начале, а сервер их не примет, на настоящем оборудовании мы это не проверяли, и мы не знаем, какая из моделей похожа на настоящую.</desc>
