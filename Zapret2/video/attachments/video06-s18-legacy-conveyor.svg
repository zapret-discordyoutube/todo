<svg xmlns="http://www.w3.org/2000/svg" class="v06-s18-legacy-conveyor" viewBox="0 0 960 537" width="960" height="537" role="img" aria-labelledby="v06-s18-legacy-conveyor-t v06-s18-legacy-conveyor-d">
<title id="v06-s18-legacy-conveyor-t">Старая функция по шагам</title>
<desc id="v06-s18-legacy-conveyor-d">Старая функция multidisorder_legacy (zapret-antidpi.lua, строки 649-696) по шести шагам: ворота как у новой функции (650-659), данные (data это нагрузка именно этого пакета, fulldata это вся сборка, 657-658), окно куска (660-661), позиции разрешаются на всей сборке, пересчитываются в окно куска и теряют позицию 1 (665-669), если позиции остались, режется этот кусок общим отправителем multidisorder_send (670-687), а если не осталось, кусок отправляется как есть через rawsend_payload_segmented и возвращается DROP (691-692); у старой функции нет аргументов blob и nodrop и нет помощников replay_first и replay_drop, а слова как есть значат глубокую копию пакета с применёнными аргументами подмены полей, например ip_ttl.</desc>
