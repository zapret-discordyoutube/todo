<g class="a e1"><rect class="bx" x="340" y="38" width="580" height="355" rx="6"/><path class="lm" d="M386 44L386 387"/><text class="ix mu r" x="378" y="66">657</text><text class="ix fg" x="396" y="66">local data = desync.dis.payload</text><text class="ix mu r" x="378" y="97">658</text><text class="ix fg" x="396" y="97">local fulldata = desync.reasm_data</text><text class="ix mu r" x="378" y="128">660</text><text class="ix fg" x="396" y="128">local range_low = (desync.reasm_offset or 0) + 1</text><text class="ix mu r" x="378" y="159">661</text><text class="ix fg" x="396" y="159">local range_hi = range_low + #data</text><text class="ix mu r" x="378" y="190">665</text><text class="ix fg" x="396" y="190">local pos = resolve_multi_pos(fulldata, desync.l7payload, spos)</text><text class="ix mu r" x="378" y="221">668</text><text class="ix fg" x="396" y="221">pos_array_normalize(pos, range_low, range_hi)</text><text class="ix mu r" x="378" y="252">669</text><text class="ix fg" x="396" y="252">delete_pos_1(pos)</text><text class="ix mu r" x="378" y="283">670</text><text class="ix fg" x="396" y="283">if #pos&gt;0 then</text><text class="ix mu r" x="378" y="314">687</text><text class="ix fg" x="396" y="314">  return multidisorder_send(desync, data, seqovl, pos)</text><text class="ix mu r" x="378" y="345">691</text><text class="ix fg" x="396" y="345">  if rawsend_payload_segmented(desync) then</text><text class="ix mu r" x="378" y="376">692</text><text class="ix fg" x="396" y="376">    return VERDICT_DROP</text></g>
