<g class="a e14"><rect class="bxb" x="40" y="453" width="880" height="62" rx="6"/><text class="sm tk" x="52" y="476">«как есть» это глубокая копия текущего пакета с аргументами подмены полей из строки стратегии</text><text class="sm" x="52" y="500">(например ip_ttl); оригинал выбрасывается, копия уходит. Не значит «не трогали».</text></g>
