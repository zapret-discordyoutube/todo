<rect class="bg" x="0" y="0" width="960" height="675"/>
<g><text class="cap" x="40" y="22">память о соединении: как программа назначает роли</text><rect class="pl" x="737.9" y="4" width="182.1" height="24" rx="12"/><text class="sm c" x="829" y="21">выдуманный пример</text></g>
<g class="a e1"><rect class="bx" x="40" y="38" width="880" height="74" rx="8"/><text class="sm tk" x="54" y="60">игрушка: секретарь пишет протокол разговора</text><text class="sm" x="54" y="82">кто первым сказал «алло», тот звонящий; кто первым «слышу вас», тот отвечающий</text><text class="sm" x="54" y="102">если «слышу вас» прозвучало первым не от того, протокол читается наоборот</text></g>
<g class="a e2"><rect class="bxa" x="40" y="124" width="880" height="56" rx="8"/><text class="sm tk" x="54" y="147">память о соединении: запись, где отмечено, кто клиент и кто сервер</text><text class="sm mu" x="54" y="169">подробно: выпуск «Память о соединении»; у программы nfqws2 такая память есть</text></g>
<g class="a e3"><text class="cap" x="40" y="208">правило ролей в коде программы</text><text class="ix mu r" x="920" y="208">nfq2/conntrack.c, строки 278-283</text></g>
<g class="a e4"><rect class="bx" x="40" y="220" width="640" height="170" rx="6"/><path class="lm" d="M86 226L86 384"/><text class="ix mu r" x="78" y="245">278</text><text class="ix fg" x="96" y="245">b_rev = dis-&gt;tcp &amp;&amp; tcp_synack_segment(dis-&gt;tcp);</text><text class="ix mu r" x="78" y="271">279</text><text class="ix fg" x="96" y="271">if ((dis-&gt;tcp &amp;&amp; tcp_syn_segment(dis-&gt;tcp)) || b_rev || dis-&gt;udp)</text><text class="ix mu r" x="78" y="297">280</text><text class="ix fg" x="96" y="297">{</text><text class="ix mu r" x="78" y="323">281</text><text class="ix fg" x="96" y="323">if ((ctr = ConntrackNew(pp, b_rev ? &amp;connswp : &amp;conn)))</text><text class="ix mu r" x="78" y="349">282</text><text class="ix fg" x="96" y="349">{</text><text class="ix mu r" x="78" y="375">283</text><text class="ix fg" x="96" y="375">ConntrackFeedPacket(&amp;ctr-&gt;track, b_rev, dis);</text></g>
<g class="a e5 tr"><rect class="fa" x="43" y="227" width="634" height="26" rx="3"/></g>
<g class="a e6"><text class="sm" x="692" y="245">«обратный» = пакет SYN-ACK</text></g>
<g class="a e7 tr"><rect class="fa" x="43" y="253" width="634" height="26" rx="3"/></g>
<g class="a e8"><text class="sm" x="692" y="271">вход: голый SYN или SYN-ACK</text></g>
<g class="a e9 tr"><rect class="fa" x="43" y="305" width="634" height="26" rx="3"/></g>
<g class="a e10"><text class="sm" x="692" y="323">обратный: ключ наоборот</text></g>
<g class="a e11 tr"><rect class="fa" x="43" y="357" width="634" height="26" rx="3"/></g>
<g class="a e12"><text class="sm" x="692" y="375">запись получает пакет</text></g>
<g class="a e13"><text class="sm mu" x="40" y="410">голый SYN: из флагов URG, ACK, PSH, RST, SYN, FIN стоит только SYN (nfq2/darkmagic.c, строки 93-102)</text></g>
<g class="a e14"><text class="cap" x="40" y="440">что запомнит программа</text></g>
<g class="a e15"><rect class="bxo" x="40" y="452" width="430" height="168" rx="8"/><text class="sm tk" x="54" y="476">первый голый SYN</text><rect class="bx" x="54" y="490" width="160" height="30" rx="6"/><text class="sm c" x="134" y="510">настоящий клиент</text><path class="la" d="M218 505L246.0 505.0"/><polygon class="ha" points="256,505 246.0,510.0 246.0,500.0"/><rect class="bxa" x="262" y="490" width="192" height="30" rx="6"/><text class="sm tk c" x="358" y="510">в записи: клиент</text><rect class="bx" x="54" y="528" width="160" height="30" rx="6"/><text class="sm c" x="134" y="548">настоящий сервер</text><path class="la" d="M218 543L246.0 543.0"/><polygon class="ha" points="256,543 246.0,548.0 246.0,538.0"/><rect class="bxa" x="262" y="528" width="192" height="30" rx="6"/><text class="sm tk c" x="358" y="548">в записи: сервер</text><text class="sm" x="54" y="576">отправитель этого пакета — клиент</text><text class="sm" x="54" y="596">запись обычная: роли на своих местах</text></g>
<g class="a e16"><rect class="bxr" x="490" y="452" width="430" height="168" rx="8"/><text class="sm tk" x="504" y="476">первый голый SYN-ACK</text><rect class="bx" x="504" y="490" width="160" height="30" rx="6"/><text class="sm c" x="584" y="510">настоящий клиент</text><path class="lr" d="M668 505L696.0 505.0"/><polygon class="hr" points="706,505 696.0,510.0 696.0,500.0"/><rect class="bxr" x="712" y="490" width="192" height="30" rx="6"/><text class="sm tk c" x="808" y="510">в записи: сервер</text><rect class="bx" x="504" y="528" width="160" height="30" rx="6"/><text class="sm c" x="584" y="548">настоящий сервер</text><path class="lr" d="M668 543L696.0 543.0"/><polygon class="hr" points="706,543 696.0,548.0 696.0,538.0"/><rect class="bxr" x="712" y="528" width="192" height="30" rx="6"/><text class="sm tk c" x="808" y="548">в записи: клиент</text><text class="sm" x="504" y="576">запись создаётся наоборот: адреса и порты</text><text class="sm" x="504" y="596">в обратном порядке, отправитель — сервер</text></g>
<g class="a e17"><text class="sm mu" x="40" y="646">это правило нашей программы, мы дали его игрушке; так ли у настоящих устройств, мы не знаем</text></g>
</svg>
