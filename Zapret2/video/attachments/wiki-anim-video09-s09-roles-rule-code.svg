<svg xmlns="http://www.w3.org/2000/svg" class="v09-s09-roles-rule-code" viewBox="0 0 960 675" width="960" height="675" role="img" aria-labelledby="v09-s09-roles-rule-code-t v09-s09-roles-rule-code-d">
<title id="v09-s09-roles-rule-code-t">Правило ролей в памяти о соединении</title>
<desc id="v09-s09-roles-rule-code-d">Как программа nfqws2 назначает роли в памяти о соединении и что из этого получается: запись создаётся для голого SYN, отправитель которого считается клиентом, а для голого SYN-ACK признак обратный и адреса с портами берутся в перевёрнутом порядке, так что отправитель окажется сервером, поэтому подложный SYN-ACK клиента даёт запись, где клиент и сервер поменялись местами; это правило нашей программы, которое мы дали игрушке, и как у настоящих устройств, мы не знаем.</desc>
