<svg xmlns="http://www.w3.org/2000/svg" class="v09-s16-command-and-three-packets" viewBox="0 0 960 916" width="960" height="916" role="img" aria-labelledby="v09-s16-command-and-three-packets-t v09-s16-command-and-three-packets-d">
<title id="v09-s16-command-and-three-packets-t">Зажим окна у клиента в трёх пакетах</title>
<desc id="v09-s16-command-and-three-packets-d">Зажим окна у клиента в нашем тесте правит три пакета: в SYN окно 64240 становится 1 и множитель 10 становится 6, в подтверждении рукопожатия и в приветствии на 250 байт окно 63 становится 1, на приветствии функция отключается как на первом пакете с данными, а следующий пакет клиента уже несёт обычное окно 63, причём строка запуска разобрана на куски wssize, wsize=1 и scale=6, а диапазон входящих для неё не обязателен.</desc>
