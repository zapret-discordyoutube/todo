<rect class="bg" x="0" y="0" width="960" height="916"/>
<g><text class="cap" x="40" y="22">зажим окна у клиента: строка запуска и три пакета на проводе клиента</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="76" rx="8"/><text class="sm tk" x="54" y="60">игрушка: почтальон и ящик</text><rect class="pl" x="723.9" y="44" width="182.1" height="24" rx="12"/><text class="sm c" x="815" y="61">выдуманный пример</text><text class="sm" x="54" y="82">клиент говорит: «в ящике место на одну штуку»; почтальон мог бы привезти всё сразу,</text><text class="sm" x="54" y="101">но носит по одной</text></g>
<g class="a e2"><rect class="bxs" x="40" y="124" width="880" height="56" rx="8"/><text class="cap" x="54" y="146">руководство, замысел, не измерение</text><text class="m fg" x="54" y="168">«force the server to fragment its responses while the DPI is inspecting them»</text></g>
<g class="a e3"><rect class="bxa" x="40" y="192" width="880" height="44" rx="8"/><text class="sm" x="54" y="219">вы это видели: окно × множитель из SYN = лимит без подтверждения</text><text class="ml r" x="906" y="220">63 × 2^10 = 64512 байт</text></g>
<g class="a e4"><text class="cap" x="40" y="262">точка отсчёта: без стратегии</text></g>
<g class="a e5"><rect class="bx" x="40" y="272" width="270" height="52" rx="8"/><text class="sm tk" x="52" y="294">SYN клиента</text><text class="ix fg" x="52" y="313">окно 64240 · множитель 10</text><path class="la" d="M314 298L331.0 298.0"/><polygon class="ha" points="341,298 331.0,303.0 331.0,293.0"/><rect class="bx" x="345" y="272" width="270" height="52" rx="8"/><text class="sm tk" x="357" y="294">приветствие, 250 байт</text><text class="ix fg" x="357" y="313">окно 63</text><path class="la" d="M619 298L636.0 298.0"/><polygon class="ha" points="646,298 636.0,303.0 636.0,293.0"/><rect class="bxo" x="650" y="272" width="270" height="52" rx="8"/><text class="sm tk" x="662" y="294">ответ сервера, 6000 байт</text><text class="ix fg" x="662" y="313">1448 · 1448 · 1448 · 1448 · 208</text></g>
<g class="a e6"><text class="sm mu" x="40" y="346">наш тестовый сервер отвечает на приветствие шестью тысячами байт: пять сегментов, их разрезание дальше</text></g>
<g class="a e7"><text class="cap" x="40" y="380">строка запуска по кускам</text></g>
<g class="a e8"><rect class="bx" x="40" y="392" width="880" height="40" rx="8"/><text class="ml" x="54" y="418">--in-range=a --lua-desync=wssize:wsize=1:scale=6</text></g>
<g class="a e9"><rect class="bx" x="40" y="444" width="212" height="164" rx="8"/><rect class="bxb" x="50" y="454" width="120.8" height="26" rx="6"/><text class="mk" x="58" y="472">--in-range=a</text><text class="sm" x="52" y="500">входящие «всегда». Не</text><text class="sm" x="52" y="518">обязателен: wssize сама</text><text class="sm" x="52" y="536">выключает входящую</text><text class="sm" x="52" y="554">сторону, строка 344.</text><text class="sm" x="52" y="572">Без него окно тоже 1,</text><text class="sm" x="52" y="590">множитель 6</text></g>
<g class="a e10"><rect class="bx" x="262" y="444" width="212" height="164" rx="8"/><rect class="bxa" x="272" y="454" width="68.4" height="26" rx="6"/><text class="mk" x="280" y="472">wssize</text><text class="sm" x="274" y="500">зажим окна у клиента:</text><text class="sm" x="274" y="518">правит исходящие</text><text class="sm" x="274" y="536">пакеты, пока не дойдёт</text><text class="sm" x="274" y="554">до первых данных</text></g>
<g class="a e11"><rect class="bx" x="484" y="444" width="212" height="164" rx="8"/><rect class="bxa" x="494" y="454" width="77.1" height="26" rx="6"/><text class="mk" x="502" y="472">wsize=1</text><text class="sm" x="496" y="500">окно: число, которое</text><text class="sm" x="496" y="518">записывается в поле</text><text class="sm" x="496" y="536">пакета</text></g>
<g class="a e12"><rect class="bx" x="706" y="444" width="212" height="164" rx="8"/><rect class="bxa" x="716" y="454" width="77.1" height="26" rx="6"/><text class="mk" x="724" y="472">scale=6</text><text class="sm" x="718" y="500">множитель: число из</text><text class="sm" x="718" y="518">SYN, программа умеет</text><text class="sm" x="718" y="536">только уменьшать его</text><text class="sm" x="718" y="554">(10 → 6)</text></g>
<g class="a e13"><text class="cap" x="78" y="640">пакет клиента</text><text class="cap" x="300" y="640">окно: ядро → провод</text><text class="cap" x="520" y="640">множитель</text><text class="cap" x="640" y="640">журнал программы</text><path class="lm" d="M40 648L920 648"/></g>
<g class="a e14"><circle class="bxa" cx="56" cy="678" r="12"/><text class="tk c ns" x="56" y="683">1</text><text class="sm tk" x="78" y="675">SYN</text><text class="ix fg" x="78" y="694">0,00 мс · флаг S</text><text class="mk" x="300" y="683">64240 → 1</text><text class="m fg" x="520" y="683">10 → 6</text><text class="ix fg" x="640" y="675">window size 64240 =&gt; 1</text><text class="ix fg" x="640" y="693">scale factor 10 =&gt; 6</text></g>
