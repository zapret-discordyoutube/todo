<svg xmlns="http://www.w3.org/2000/svg" class="v05-s03-gates-runs" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="v05-s03-gates-runs-t v05-s03-gates-runs-d">
<title id="v05-s03-gates-runs-t">Прогон функций через ворота</title>
<desc id="v05-s03-gates-runs-d">Прогон функций через ворота multisplit: мы берём настоящую функцию, подаём ей готовые данные и смотрим ответ, а в сеть ничего не уходит; тип unknown при фильтре по умолчанию, dir=in на исходящем пакете, пустой блоб 0x и отсутствующий блоб с optional дают 0 пакетов и молчание, то есть PASS, payload=all на данных unknown с pos=2,midsld даёт позицию 2 и части в 2 и 248 байт, потому что midsld на неизвестных данных не находится, а блоб из восьми байт 01-08 с pos=2,4 режется на части в 2, 2 и 4 байта; в журнале нашего опыта внешний фильтр у вызова не пускает функцию на пакеты без данных (тип empty) и пускает на приветствие tls_client_hello.</desc>
