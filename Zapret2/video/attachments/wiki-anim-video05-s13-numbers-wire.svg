.v05-s13-numbers-wire .hf{fill:var(--fg2)}.v05-s13-numbers-wire .ha{fill:var(--acc)}.v05-s13-numbers-wire .hr{fill:var(--rej)}.v05-s13-numbers-wire .hm{fill:var(--mute)}.v05-s13-numbers-wire .hb{fill:var(--amb)}
.v05-s13-numbers-wire .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v05-s13-numbers-wire .a{animation-duration:58s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
