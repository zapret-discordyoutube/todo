<svg xmlns="http://www.w3.org/2000/svg" class="v05-s13-numbers-wire" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="v05-s13-numbers-wire-t v05-s13-numbers-wire-d">
<title id="v05-s13-numbers-wire-t">Номера частей на проводе</title>
<desc id="v05-s13-numbers-wire-d">Номера двух пакетов опыта с одним разрезом midsld: на выдуманном письме из 250 страниц вторая пачка начинается со страницы 105, то есть 1 + 104, и получатель отвечает «жду страницу 105»; в настоящем опыте относительные номера такие: пакет 1 с номером 1 и длиной 104, пакет 2 с номером 105 и длиной 146, сервер подтвердил сначала 105, потом 251, то есть 1 + 250; в настоящих номерах у исходного пакета, части 1, части 2 и подтверждения общее начало 1 196 648, а меняются три последние цифры: 707, затем 707 + 104 = 811, затем 811 + 146 = 957, и проверка другим путём 707 + 250 = 957.</desc>
