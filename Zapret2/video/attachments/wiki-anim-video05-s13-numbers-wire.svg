<rect class="bg" x="0" y="0" width="960" height="556"/>
<g><text class="cap" x="40" y="24">номера в пакетах частей: один разрез, метка midsld, запись настоящего опыта</text></g>
<g class="a e1"><text class="sm tk" x="40" y="54">выдуманный пример: письмо на 250 страниц</text></g>
<g class="a e2"><rect class="bxa" x="40" y="62" width="366.1" height="28" rx="0"/><text class="sm c" x="223" y="82">пачка 1: страницы 1–104</text></g>
<g class="a e3"><rect class="bxo" x="406.1" y="62" width="513.9" height="28" rx="0"/><text class="sm c" x="663" y="82">пачка 2: со страницы 105 = 1 + 104</text></g>
<g class="a e4"><path class="lf" d="M406.1 92L406.1 104"/><text class="sm" x="414.1" y="112">получатель: «жду страницу 105»</text></g>
<g class="a e5"><text class="cap" x="40" y="152">настоящие пакеты: относительные номера, первый байт данных = 1</text></g>
<g class="a e6"><rect class="bxa" x="40" y="164" width="366.1" height="28" rx="0"/><text class="sm c" x="223" y="184">данные, байты 0–103</text><rect class="bxo" x="406.1" y="164" width="513.9" height="28" rx="0"/><text class="sm c" x="663" y="184">данные, байты 104–249</text></g>
<g class="a e7"><rect class="bxa" x="40" y="204" width="340" height="54" rx="8"/><text class="sm tk" x="54" y="226">пакет 1</text><text class="mk" x="54" y="247">номер 1, длина 104</text></g>
<g class="a e8"><rect class="bxo" x="414.1" y="204" width="340" height="54" rx="8"/><text class="sm tk" x="428.1" y="226">пакет 2</text><text class="mk" x="428.1" y="247">номер 105, длина 146</text></g>
<g class="a e9"><rect class="bx" x="40" y="272" width="340" height="34" rx="6"/><text class="sm tk" x="54" y="294">сервер: подтверждение 105</text></g>
<g class="a e10"><rect class="bx" x="414.1" y="272" width="350" height="34" rx="6"/><text class="sm tk" x="428.1" y="294">сервер: подтверждение 251 (1 + 250)</text></g>
<g class="a e11"><text class="ix mu" x="40" y="328">в записи постоянного опыта: после первой части 105, после второй 251</text></g>
<g class="a e12"><text class="cap" x="40" y="368">настоящие номера из того же теста: общее начало и три последние цифры</text></g>
<g class="a e13"><rect class="bxs" x="40" y="380" width="230" height="102" rx="8"/><text class="mk c" x="155" y="424">1 196 648</text><text class="sm c" x="155" y="450">общая часть</text><text class="sm c" x="155" y="470">у всех трёх чисел</text></g>
<g class="a e14"><rect class="bxa" x="284" y="380" width="84" height="30" rx="5"/><text class="mk c" x="326" y="401">707</text><text class="sm" x="384" y="401">исходный пакет и часть 1</text></g>
<g class="a e15"><rect class="bxo" x="284" y="416" width="84" height="30" rx="5"/><text class="mk c" x="326" y="437">811</text><text class="sm" x="384" y="437">часть 2: 707 + 104 = 811</text></g>
<g class="a e16"><rect class="bxb" x="284" y="452" width="84" height="30" rx="5"/><text class="mk c" x="326" y="473">957</text><text class="sm" x="384" y="473">подтверждение сервера: 811 + 146 = 957</text></g>
<g class="a e17"><rect class="bxd" x="284" y="488" width="636" height="30" rx="5"/><text class="sm tk" x="298" y="508">проверка вторым путём: 707 + 250 = 957</text></g>
<g class="a e18"><text class="ix mu" x="40" y="542">полные номера: 1196648707, 1196648811, 1196648957</text></g>
</svg>
