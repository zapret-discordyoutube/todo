<g><text class="cap" x="40" y="24">как multisplit строит подкладку и сдвигает номер</text></g>
<g class="a e1"><text class="sm tk" x="40" y="52">сначала помощница pattern: как рулон обоев, узор повторяется и обрезается ровно по длине</text></g>
<g class="a e2"><text class="sm mu" x="40" y="76">выдуманный пример: продавец отрезал метр рулона, последний повтор узора обрезан</text></g>
<g class="a e3"><rect class="bx" x="40" y="90" width="440" height="78" rx="6"/><text class="ix fg" x="50" y="110">pattern(AB CD, 1, 5)  прогон функций</text><rect class="bxa" x="50" y="122" width="58" height="36" rx="0"/><text class="mk c" x="79" y="146">AB</text><rect class="bxo" x="112" y="122" width="58" height="36" rx="0"/><text class="mk c" x="141" y="146">CD</text><rect class="bxa" x="174" y="122" width="58" height="36" rx="0"/><text class="mk c" x="203" y="146">AB</text><rect class="bxo" x="236" y="122" width="58" height="36" rx="0"/><text class="mk c" x="265" y="146">CD</text><rect class="bxa" x="298" y="122" width="58" height="36" rx="0"/><text class="mk c" x="327" y="146">AB</text></g>
<g class="a e4"><text class="sm" x="40" y="190">длина всегда та, что просили</text></g>
<g class="a e5"><rect class="bx" x="500" y="90" width="420" height="78" rx="6"/><text class="ix mu" x="510" y="110">lua/zapret-lib.lua:565-574</text><text class="sm" x="510" y="134">пустой узор: error</text><text class="ix fg" x="510" y="156">&quot;pattern: bad or empty pattern&quot;</text></g>
<g class="a e6"><text class="sm mu" x="300" y="190">offset здесь всегда 1: multisplit просит узор с первого байта</text></g>
<g class="a e7"><text class="cap" x="40" y="232">пять шагов внутри цикла по частям</text><text class="ix mu r" x="920" y="232">lua/zapret-antidpi.lua</text></g>
<g class="a e8"><rect class="bx" x="40" y="242" width="640" height="170" rx="6"/><path class="lm" d="M90 248L90 406"/><text class="ix mu r" x="82" y="267">509</text><text class="ix fg" x="100" y="267">if i==0 and desync.arg.seqovl and tonumber(desync.arg.seqovl)&gt;0 then</text><text class="ix mu r" x="82" y="293">510</text><text class="ix fg" x="100" y="293">  seqovl = tonumber(desync.arg.seqovl)</text><text class="ix mu r" x="82" y="319">511</text><text class="ix fg" x="100" y="319">  local pat=&quot;\x00&quot;</text><text class="ix mu r" x="82" y="345">516</text><text class="ix fg" x="100" y="345">  pat = blob(desync,desync.arg.seqovl_pattern)</text><text class="ix mu r" x="82" y="371">519</text><text class="ix fg" x="100" y="371">  part = pattern(pat,1,seqovl)..part</text><text class="ix mu r" x="82" y="397">522</text><text class="ix fg" x="100" y="397">rawsend_payload_segmented(desync,part,pos_start-1-seqovl)</text></g>
<g class="a e9"><text class="sm tk" x="700" y="267">1 · три вопроса</text></g>
<g class="a e10"><text class="sm tk" x="700" y="293">2 · текст в число</text></g>
<g class="a e11"><text class="sm tk" x="700" y="319">3 · узор: нуль</text></g>
