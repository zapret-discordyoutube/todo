<svg xmlns="http://www.w3.org/2000/svg" class="v05-s17-pattern-and-seqovl-code" viewBox="0 0 960 782" width="960" height="782" role="img" aria-labelledby="v05-s17-pattern-and-seqovl-code-t v05-s17-pattern-and-seqovl-code-d">
<title id="v05-s17-pattern-and-seqovl-code-t">Как код строит накладку</title>
<desc id="v05-s17-pattern-and-seqovl-code-d">Как multisplit строит накладку, на нашем приветствии в 250 байт с pos=midsld и seqovl=5: помощница pattern (lua/zapret-lib.lua:565-574) повторяет узор и обрезает ровно по длине, так узор AB CD при длине 5 даёт AB CD AB CD AB, а пустой узор это ошибка; в цикле по частям пять шагов (lua/zapret-antidpi.lua:509-522): условие из трёх вопросов (первая часть, аргумент задан, число больше нуля), текст в число, узор по умолчанию один нулевой байт или из seqovl_pattern, склейка pattern(pat,1,seqovl) с частью, то есть 5 + 104 = 109 байт, и смещение номера pos_start-1-seqovl, для первой части 1 - 1 - 5 = -5; журнал показывает sending part 1 0-103 len=109 seqovl=5 и sending part 2 104-249 len=146 seqovl=0, где диапазон это настоящие байты с нуля, а длина уже вместе с накладкой; у второй части накладки нет, потому что условие требует первую часть, и смещение у неё такое же, как в обычном разрезе.</desc>
