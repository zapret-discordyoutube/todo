<g class="a e21"><text class="sm tk" x="40" y="442">строка 509:</text><rect class="bxo" x="150" y="426" width="236" height="26" rx="13"/><text class="sm c" x="268" y="444">i==0: первая часть</text><rect class="bxo" x="400" y="426" width="236" height="26" rx="13"/><text class="sm c" x="518" y="444">аргумент seqovl задан</text><rect class="bxo" x="650" y="426" width="236" height="26" rx="13"/><text class="sm c" x="768" y="444">число больше нуля</text></g>
<g class="a e22"><text class="sm mu" x="40" y="470">хотя бы одно «нет»: накладки нет, часть уходит как в обычном разрезе</text></g>
<g class="a e23"><text class="cap" x="40" y="500">первая часть на проводе: подкладка + настоящие байты</text></g>
<g class="a e24"><rect class="bxb" x="40" y="510" width="40" height="30" rx="0"/><rect class="bxa" x="80" y="510" width="832" height="30" rx="0"/><text class="sm c" x="496" y="530">настоящие байты части 1: 104</text><text class="sm c amb" x="60" y="558">5</text></g>
<g class="a e25"><text class="sm tk" x="76" y="558">подкладка 5 + настоящих 104 = 109</text></g>
<g class="a e26"><text class="cap" x="40" y="588">журнал (строка 521), в нашем тесте</text></g>
<g class="a e27"><rect class="bx" x="40" y="598" width="880" height="54" rx="6"/><text class="ix fg" x="52" y="620">sending part 1 0-103 len=109 seqovl=5</text><text class="sm" x="600" y="620">диапазон = настоящие байты (с нуля)</text><text class="ix fg" x="52" y="642">sending part 2 104-249 len=146 seqovl=0</text><text class="sm" x="600" y="642">len = вместе с накладкой</text></g>
<g class="a e28"><text class="sm mu" x="40" y="672">в журнале байты считаются с нуля, дальше в выпуске с единицы</text></g>
<g class="a e29"><rect class="bxd" x="40" y="688" width="880" height="80" rx="6"/><text class="sm tk" x="52" y="710">проверь себя: что с накладкой у второй части?</text></g>
<g class="a e30"><text class="sm" x="52" y="734">её нет: условие i==0 ложно, seqovl=0, смещение как в обычном разрезе (pos_start − 1 = 104)</text><text class="sm mu" x="52" y="756">лампочка «первая часть» гаснет</text></g>
