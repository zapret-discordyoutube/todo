<svg xmlns="http://www.w3.org/2000/svg" class="v04-s03-walk-lengths" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="v04-s03-walk-lengths-t v04-s03-walk-lengths-d">
<title id="v04-s03-walk-lengths-t">Ходьба по длинам до extlen</title>
<desc id="v04-s03-walk-lengths-d">Как программа идёт по приветствию в 250 байт: заголовки 5 + 4 + 2 + 32 = 43 байта; на байте 43 длина идентификатора сессии 32 даёт прыжок 43 + 1 + 32 = 76; на байтах 76–77 длина наборов шифров 6 даёт 76 + 2 + 6 = 84; на байте 84 длина способов сжатия 1 даёт 84 + 1 + 1 = 86; на байтах 86–87 длина расширений 162, это метка extlen = 86. Сверху выдуманная игрушка: лента, где перед каждым блоком записано, сколько в нём байт.</desc>
