<g class="a e8"><rect class="bx" x="30" y="321" width="26" height="26" rx="13"/><text class="sm tk c" x="43" y="340">1</text><text class="sm" x="68" y="340">на байтах 0–42 лежат заголовки: 5 + 4 + 2 + 32 = 43</text></g>
<g class="a e9"><rect class="bx" x="30" y="351" width="26" height="26" rx="13"/><text class="sm tk c" x="43" y="370">2</text><text class="sm" x="68" y="370">на байте 43 длина идентификатора сессии: байт 20 = 32, прыжок 43 + 1 + 32 = 76</text></g>
<g class="a e10"><rect class="bx" x="30" y="381" width="26" height="26" rx="13"/><text class="sm tk c" x="43" y="400">3</text><text class="sm" x="68" y="400">на байтах 76–77 длина наборов шифров: 00 06 = 6, прыжок 76 + 2 + 6 = 84</text></g>
<g class="a e11"><rect class="bx" x="30" y="411" width="26" height="26" rx="13"/><text class="sm tk c" x="43" y="430">4</text><text class="sm" x="68" y="430">на байте 84 длина способов сжатия: 01 = 1, прыжок 84 + 1 + 1 = 86</text></g>
<g class="a e12"><rect class="bxa" x="30" y="441" width="26" height="26" rx="13"/><text class="sm tk c" x="43" y="460">5</text><text class="sm tk" x="68" y="460">на байтах 86–87 длина всех расширений: 00 a2 = 162, это метка extlen = 86</text></g>
