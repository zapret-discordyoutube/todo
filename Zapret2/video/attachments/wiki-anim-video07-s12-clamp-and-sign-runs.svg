<svg xmlns="http://www.w3.org/2000/svg" class="v07-s12-clamp-and-sign-runs" viewBox="0 0 960 634" width="960" height="634" role="img" aria-labelledby="v07-s12-clamp-and-sign-runs-t v07-s12-clamp-and-sign-runs-d">
<title id="v07-s12-clamp-and-sign-runs-t">Диапазон и знак: три опыта</title>
<desc id="v07-s12-clamp-and-sign-runs-d">Диапазон и проверка знака на дороге из двух роутеров с двумя переходами: в игрушечном примере с термостатом просят 25, а прибор держит от 10 до 22 и ставит 22; при ip_autottl=5,1-3 два плюс пять дают 7, диапазон срезает до 3, знак верный, срок 3 и подделка доезжает до сервера, который принимает 680 байт; при -3,2-9 два минус три дают минус один, диапазон поднимает до 2, но просили короче пути, а вышло не короче, подбор отказывает, срок остаётся 64 и подделка тоже доезжает до сервера; при 0,5-9 два плюс ноль дают 2, диапазон поднимает до 5, проверка довольна, срок 5 и подделка доезжает до сервера, знак сохранён, а цель потеряна; прогон функций на выдуманных числах для пяти переходов даёт для 5,1-3 отказ, для 0,5-9 число 5, для -3,1-20 число 2.</desc>
