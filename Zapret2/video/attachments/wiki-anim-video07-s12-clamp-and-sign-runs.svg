<rect class="bg" x="0" y="0" width="960" height="634"/>
<g><text class="cap" x="10" y="22">Диапазон срезает результат, проверка знака может отказать</text></g>
<g class="a e1"><rect class="bxd" x="10" y="32" width="940" height="86" rx="8"/><text class="cap" x="24" y="52">игрушка (выдуманный пример): термостат</text><rect class="bxa" x="40" y="76" width="312" height="12" rx="3"/><rect class="bx" x="352" y="76" width="208" height="12" rx="3"/><text class="ix c" x="40" y="108">10</text><text class="ix c" x="352" y="108">22</text><text class="ix c" x="430" y="108">25</text><text class="sm c ns" x="196.0" y="70">паспорт: от 10 до 22</text><polygon class="hr" points="430,90 424,100 436,100"/><path class="lr" d="M426 82L374.0 82.0"/><polygon class="hr" points="366,82 374.0,78.0 374.0,86.0"/><text class="sm tk ns" x="584" y="70">просим 25, прибор ставит 22:</text><text class="sm ns" x="584" y="92">выше границы опускает до неё</text><text class="sm ns" x="584" y="112">так же диапазон делает со сроком</text></g>
<g class="a e2"><rect class="bx" x="10" y="130" width="940" height="110" rx="8"/><circle class="pl" cx="30" cy="152" r="11"/><text class="sm tk c ns" x="30" y="157">1</text><text class="mk ns" x="52" y="157">ip_autottl=5,1-3</text><text class="m mu r ns" x="940" y="157">discovered autottl 3</text></g>
<g class="a e3"><text class="sm ns" x="52" y="182">переходы 2 + дельта 5 = 7, выше границы 3: берём 3</text><text class="sm ns" x="52" y="204">знак: дельта не меньше 0, результат 3 не меньше пути 2: верно</text></g>
<g class="a e4"><rect class="bxa" x="52" y="214" width="190" height="20" rx="5"/><text class="sm tk c ns" x="147.0" y="229">срок на проводе 3</text><rect class="bxr" x="254" y="214" width="190" height="20" rx="5"/><text class="sm tk c ns" x="349.0" y="229">до сервера дошла</text><rect class="bxr" x="456" y="214" width="150" height="20" rx="5"/><text class="sm tk c ns" x="531.0" y="229">сервер: 680 Б</text><rect class="bxr" x="618" y="214" width="140" height="20" rx="5"/><text class="sm tk c ns" x="688.0" y="229">клиент ждёт</text></g>
<g class="a e5"><rect class="bx" x="10" y="250" width="940" height="110" rx="8"/><circle class="pl" cx="30" cy="272" r="11"/><text class="sm tk c ns" x="30" y="277">2</text><text class="mk ns" x="52" y="277">ip_autottl=-3,2-9</text><text class="m mu r ns" x="940" y="277">could not discover autottl, 6 раз</text></g>
<g class="a e6"><text class="sm ns" x="52" y="302">переходы 2 + дельта −3 = −1, ниже границы 2: берём 2</text><text class="sm ns" x="52" y="324">знак: дельта меньше 0, а 2 не короче пути 2: отказ</text></g>
<g class="a e7"><rect class="bxr" x="52" y="334" width="190" height="20" rx="5"/><text class="sm tk c ns" x="147.0" y="349">срок остался 64</text><rect class="bxr" x="254" y="334" width="190" height="20" rx="5"/><text class="sm tk c ns" x="349.0" y="349">до сервера дошла</text><rect class="bxr" x="456" y="334" width="150" height="20" rx="5"/><text class="sm tk c ns" x="531.0" y="349">сервер: 680 Б</text><rect class="bxr" x="618" y="334" width="140" height="20" rx="5"/><text class="sm tk c ns" x="688.0" y="349">клиент ждёт</text></g>
<g class="a e8"><rect class="bx" x="10" y="370" width="940" height="110" rx="8"/><circle class="pl" cx="30" cy="392" r="11"/><text class="sm tk c ns" x="30" y="397">3</text><text class="mk ns" x="52" y="397">ip_autottl=0,5-9</text><text class="sm tk mu r ns" x="940" y="397">знак сохранён, цель потеряна</text></g>
<g class="a e9"><text class="sm ns" x="52" y="422">переходы 2 + дельта 0 = 2, ниже границы 5: берём 5</text><text class="sm ns" x="52" y="444">знак: дельта не меньше 0, результат 5 не меньше пути 2: верно</text></g>
<g class="a e10"><rect class="bxa" x="52" y="454" width="190" height="20" rx="5"/><text class="sm tk c ns" x="147.0" y="469">срок на проводе 5</text><rect class="bxr" x="254" y="454" width="190" height="20" rx="5"/><text class="sm tk c ns" x="349.0" y="469">до сервера дошла</text><rect class="bxr" x="456" y="454" width="150" height="20" rx="5"/><text class="sm tk c ns" x="531.0" y="469">сервер: 680 Б</text><rect class="bxr" x="618" y="454" width="140" height="20" rx="5"/><text class="sm tk c ns" x="688.0" y="469">клиент ждёт</text></g>
<g class="a e11"><rect class="bx" x="10" y="496" width="940" height="100" rx="8"/><text class="cap" x="24" y="518">прогон функций: настоящие функции библиотеки на выдуманных числах, без сети</text><text class="sm tk ns" x="24" y="542">пять переходов, входящий срок 59:</text><rect class="bxr" x="24" y="552" width="280" height="34" rx="6"/><text class="mk ns" x="36" y="575">5,1-3</text><text class="sm tk r ns" x="292" y="575">результат: нет</text><rect class="bxa" x="324" y="552" width="280" height="34" rx="6"/><text class="mk ns" x="336" y="575">0,5-9</text><text class="sm tk r ns" x="592" y="575">результат: 5</text><rect class="bxo" x="624" y="552" width="280" height="34" rx="6"/><text class="mk ns" x="636" y="575">-3,1-20</text><text class="sm tk r ns" x="892" y="575">результат: 2</text></g>
<g class="a e12"><text class="sm tk" x="10" y="616">проверка смотрит на направление дельты, а не на то, попали ли мы в цель</text></g>
</svg>
