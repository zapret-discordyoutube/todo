<svg xmlns="http://www.w3.org/2000/svg" class="v02-s04-iphdr" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="v02-s04-iphdr-t v02-s04-iphdr-d">
<title id="v02-s04-iphdr-t">Заголовок IP поле за полем</title>
<desc id="v02-s04-iphdr-d">Двадцать байт заголовка IP нашего кадра (45 00 01 2e fa 05 40 00 40 06 2b bf 0a 01 00 01 0a 02 00 02) по полям: версия 4 и длина заголовка 5 слов = 20 байт, приоритет 00, длина пакета 302, идентификатор 64005, флаги и смещение 40 00 (стоит DF), время жизни 64, протокол 6 = TCP, контрольная сумма 2bbf, отправитель 10.1.0.1, получатель 10.2.0.2; в заголовке записано, откуда и куда едет пакет, но ни слова о том, какой это сайт.</desc>
