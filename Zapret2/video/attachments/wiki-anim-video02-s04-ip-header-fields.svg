<g class="a e2"><rect class="bxa" x="40" y="62" width="44" height="48" rx="0"/><text class="hx c" x="62" y="93">45</text><text class="tk sm c" x="62" y="56">1</text><rect class="bxa" x="40" y="164" width="26" height="26" rx="4"/><text class="ix c ns" x="53" y="183">1</text><text class="sm" x="78" y="183">версия 4; длина заголовка 5 слов × 4 = 20 байт</text></g>
