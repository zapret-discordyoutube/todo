<g class="a e7"><rect class="bxb" x="392" y="62" width="44" height="48" rx="0"/><text class="hx c" x="414" y="93">40</text><text class="tk sm c" x="414" y="56">6</text><rect class="bxb" x="490" y="164" width="26" height="26" rx="4"/><text class="ix c ns" x="503" y="183">6</text><text class="sm" x="528" y="183">время жизни (TTL): 40 = 64</text></g>
