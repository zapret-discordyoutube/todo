<g class="a e9"><rect class="bxg" x="480" y="62" width="88" height="48" rx="0"/><text class="hx c" x="502" y="93">2b</text><text class="hx c" x="546" y="93">bf</text><text class="tk sm c" x="524" y="56">8</text><rect class="bxg" x="490" y="236" width="26" height="26" rx="4"/><text class="ix c ns" x="503" y="255">8</text><text class="sm" x="528" y="255">контрольная сумма: 2b bf</text></g>
<g class="a e10"><rect class="bxa" x="568" y="62" width="176" height="48" rx="0"/><text class="hx c" x="590" y="93">0a</text><text class="hx c" x="634" y="93">01</text><text class="hx c" x="678" y="93">00</text><text class="hx c" x="722" y="93">01</text><text class="tk sm c" x="656" y="56">9</text><rect class="bxa" x="490" y="272" width="26" height="26" rx="4"/><text class="ix c ns" x="503" y="291">9</text><text class="sm" x="528" y="291">отправитель: 0a 01 00 01 = 10.1.0.1</text></g>
<g class="a e11"><rect class="bxb" x="744" y="62" width="176" height="48" rx="0"/><text class="hx c" x="766" y="93">0a</text><text class="hx c" x="810" y="93">02</text><text class="hx c" x="854" y="93">00</text><text class="hx c" x="898" y="93">02</text><text class="tk sm c" x="832" y="56">10</text><rect class="bxb" x="490" y="308" width="26" height="26" rx="4"/><text class="ix c ns" x="503" y="327">10</text><text class="sm" x="528" y="327">получатель: 0a 02 00 02 = 10.2.0.2</text></g>
<g class="a e12"><text class="tk" x="40" y="376">Откуда и куда едет пакет, здесь написано.</text><text class="tk" x="40" y="402">Какой это сайт, здесь нет ни слова.</text></g>
