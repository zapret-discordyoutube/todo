<svg xmlns="http://www.w3.org/2000/svg" class="v16-s28-part-checklist" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="v16-s28-part-checklist-t v16-s28-part-checklist-d">
<title id="v16-s28-part-checklist-t">Итог части: шесть пунктов и проверка на вставке</title>
<desc id="v16-s28-part-checklist-d">Итог части про вставки, шесть пунктов с галочками. 1. Вставка это пакет, который программа собрала целиком и отправила через сырой сокет, синхронно, поэтому в t10 обе вставки ушли раньше, чем исходный запрос получил вердикт. 2. Метка вставки это метка исходного пакета, объединённая побитовым ИЛИ с меткой программы (для стандартных помощников Lua), по умолчанию на Linux 40000000. 3. От петли защищают три преграды: правило ядра, notrack в цепочке predefrag и проходная в программе. 4. Вставки, судя по t20 и нашему тесту на UDP, предел в двенадцать пакетов не расходуют: двенадцать срабатываний с notrack и семь без него. 5. Если на Linux стратегия выбрасывает самый первый пакет соединения, программа подменяет его негодной копией; почему, сказано только в комментарии автора, а что стало с соединением в t40, мы не выяснили. 6. На BSD и Windows механизм другой, и о нём мы знаем только по коду. Проверь себя на вставке номер один из t10. Метка: 40000000. Размер: 156 байт, это 20 + 32 + 104. Попадёт ли в очередь: нет, хотя какая именно преграда её остановила, по журналам не видно. Потратит ли предел: судя по t20, нет.</desc>
