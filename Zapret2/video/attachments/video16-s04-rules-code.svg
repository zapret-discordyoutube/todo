.v16-s04-rules-code .fa{fill:var(--tint);stroke:none}.v16-s04-rules-code .fr{fill:var(--rejt);stroke:none}.v16-s04-rules-code .fb{fill:var(--ambt);stroke:none}.v16-s04-rules-code .fo{fill:var(--okt);stroke:none}
