.v16-s04-rules-code .cd{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--fg2);stroke:none}
.v16-s04-rules-code .cdh{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;font-weight:600;fill:var(--fg);stroke:none}
.v16-s04-rules-code .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v16-s04-rules-code .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v16-s04-rules-code .mu{fill:var(--mute)}.v16-s04-rules-code .fg{fill:var(--fg)}.v16-s04-rules-code .acc{fill:var(--acc)}.v16-s04-rules-code .rej{fill:var(--rej)}.v16-s04-rules-code .ok{fill:var(--ok)}.v16-s04-rules-code .amb{fill:var(--amb)}
.v16-s04-rules-code .c{text-anchor:middle}.v16-s04-rules-code .r{text-anchor:end}.v16-s04-rules-code .ns{stroke:none}
