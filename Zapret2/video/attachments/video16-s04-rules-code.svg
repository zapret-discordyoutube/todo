<rect class="bg" x="0" y="0" width="960" height="446"/>
<g><text class="cap" x="40" y="26">Набор правил нашей лаборатории (nftables)</text></g>
<g><rect class="bx" x="40" y="44" width="626" height="250" rx="8"/></g>
<g class="a e1"><text class="ix" x="52" y="70">1</text><text class="cd" x="74" y="70">nft add table inet z</text><text class="ix" x="52" y="96">2</text><text class="cd" x="74" y="96">nft add chain inet z post &#x27;{type filter hook postrouting priority 101;}&#x27;</text><text class="ix" x="52" y="122">3</text><text class="cd mu" x="74" y="122">nft add rule inet z post … tcp dport &#x27;{80,443}&#x27; … queue num 200 bypass</text><text class="ix" x="52" y="148">4</text><text class="cd" x="74" y="148">nft add chain inet z pre &#x27;{type filter hook prerouting priority -101;}&#x27;</text><text class="ix" x="52" y="174">5</text><text class="cd mu" x="74" y="174">nft add rule inet z pre … tcp sport &#x27;{80,443}&#x27; … queue num 200 bypass</text><text class="ix" x="52" y="200">6</text><text class="cd mu" x="74" y="200">nft add rule inet z post … udp dport 443 … queue num 200 bypass</text><text class="ix" x="52" y="226">7</text><text class="cd mu" x="74" y="226">nft add rule inet z pre … udp sport 443 … queue num 200 bypass</text><text class="ix" x="52" y="252">8</text><text class="cd mu" x="74" y="252">nft add chain inet z predefrag &#x27;{type filter hook output priority -401;}&#x27;</text><text class="ix" x="52" y="278">9</text><text class="cd mu" x="74" y="278">nft add rule inet z predefrag &#x27;mark &amp; 0x40000000 != 0x00000000 notrack&#x27;</text></g>
<g class="a e2"><rect class="pill" x="44" y="53" width="618" height="24" rx="3"/><rect class="fa" x="44" y="53" width="618" height="24" rx="3"/><text class="ix" x="52" y="70">1</text><text class="cdh" x="74" y="70">nft add table inet z</text></g>
<g class="a e3"><rect class="pill" x="44" y="79" width="618" height="24" rx="3"/><rect class="fa" x="44" y="79" width="618" height="24" rx="3"/><text class="ix" x="52" y="96">2</text><text class="cdh" x="74" y="96">nft add chain inet z post &#x27;{type filter hook postrouting priority 101;}&#x27;</text></g>
<g class="a e4"><rect class="pill" x="44" y="131" width="618" height="24" rx="3"/><rect class="fa" x="44" y="131" width="618" height="24" rx="3"/><text class="ix" x="52" y="148">4</text><text class="cdh" x="74" y="148">nft add chain inet z pre &#x27;{type filter hook prerouting priority -101;}&#x27;</text></g>
<g class="a e5"><text class="sm mu" x="40" y="316">… середина правил пропущена; строки 8–9 (predefrag) разберём позже</text></g>
<g class="a e6"><rect class="bxa" x="686" y="44" width="234" height="250" rx="8"/><text class="tk ns" x="700" y="70">таблица z</text><text class="sm mu ns" x="700" y="90">inet: IPv4 и IPv6</text></g>
<g class="a e7"><rect class="bxa" x="698" y="104" width="210" height="78" rx="6"/><text class="tk sm ns" x="710" y="128">цепочка post</text><text class="sm ns" x="710" y="148">postrouting, 101</text><rect class="bx" x="710" y="158" width="88" height="16" rx="3"/><text class="ix c" x="754" y="171">правила</text><rect class="bx" x="804" y="158" width="88" height="16" rx="3"/><text class="ix c" x="848" y="171">tcp, udp</text></g>
<g class="a e8"><rect class="bxo" x="698" y="194" width="210" height="78" rx="6"/><text class="tk sm ns" x="710" y="218">цепочка pre</text><text class="sm ns" x="710" y="238">prerouting, −101</text><rect class="bx" x="710" y="248" width="88" height="16" rx="3"/><text class="ix c" x="754" y="261">правила</text><rect class="bx" x="804" y="248" width="88" height="16" rx="3"/><text class="ix c" x="848" y="261">tcp, udp</text></g>
<g class="a e9"><circle class="bxa" cx="52" cy="335" r="11"/><text class="tk c ns" x="52" y="340">1</text><text class="sm" x="74" y="340">строка 1: создаёт таблицу z. inet значит IPv4 и IPv6 (по общим сведениям), имя произвольное.</text></g>
<g class="a e10"><circle class="bxa" cx="52" cy="363" r="11"/><text class="tk c ns" x="52" y="368">2</text><text class="sm" x="74" y="368">строка 2: создаёт цепочку post на точке postrouting: исходящие пакеты, на выходе.</text></g>
<g class="a e11"><circle class="bxo" cx="52" cy="391" r="11"/><text class="tk c ns" x="52" y="396">4</text><text class="sm" x="74" y="396">строка 4: цепочка pre на точке prerouting, приоритет −101: только что пришедшие пакеты.</text></g>
</svg>
