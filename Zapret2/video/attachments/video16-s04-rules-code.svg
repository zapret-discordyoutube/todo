<svg xmlns="http://www.w3.org/2000/svg" class="v16-s04-rules-code" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="v16-s04-rules-code-t v16-s04-rules-code-d">
<title id="v16-s04-rules-code-t">Набор правил: таблица и две цепочки</title>
<desc id="v16-s04-rules-code-d">Набор правил nftables нашей лаборатории, девять строк (пять правил в трёх цепочках), по смыслу как в docs/readme.md zapret2. Строка 1, nft add table inet z, создаёт таблицу z (inet: IPv4 и IPv6, по общим сведениям; имя произвольное). Строка 2 создаёт цепочку post на точке postrouting с приоритетом 101: исходящие пакеты. Строка 4 создаёт цепочку pre на точке prerouting с приоритетом −101: только что пришедшие пакеты. Справа дерево: таблица z, в ней цепочки post и pre, в цепочках строки-правила; цепочка predefrag разбирается позже.</desc>
<style>.v16-s04-rules-code{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v16-s04-rules-code{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
