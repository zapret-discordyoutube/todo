.v16-s04-rules-code .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v16-s04-rules-code .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v16-s04-rules-code .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v16-s04-rules-code .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v16-s04-rules-code .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v16-s04-rules-code .hf{fill:var(--fg2)}.v16-s04-rules-code .ha{fill:var(--acc)}.v16-s04-rules-code .hr{fill:var(--rej)}.v16-s04-rules-code .hm{fill:var(--mute)}.v16-s04-rules-code .hb{fill:var(--amb)}
.v16-s04-rules-code .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v16-s04-rules-code .a{animation-duration:40s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
