<title id="video07-s01-fooling-one-term-t">Три имени, один термин</title>
<desc id="video07-s01-fooling-one-term-d">Слово из названия выпуска: три прежних имени одного механизма, подмена полей, подделки и английское fooling, сходятся в один термин условие подделки, это намеренный дефект подделки, который отличается от условий профиля, решающих, какие пакеты достаются профилю, и внизу пять договорённостей серии: в нашем тесте, по общим сведениям, по счёту, прогон функций и «ТСПУ: неизвестно».</desc>
