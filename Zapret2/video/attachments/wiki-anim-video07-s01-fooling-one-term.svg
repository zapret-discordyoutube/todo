<g><text class="cap" x="40" y="24">один механизм под тремя именами</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="330" height="52" rx="8"/><text class="tk" x="56" y="67">подмена полей</text><text class="sm mu" x="56" y="87">выпуски «multisplit» и «disorder»</text><path class="lm" d="M374 70L430.5 107.1"/><polygon class="hm" points="438,112 428.0,110.8 432.9,103.3"/></g>
<g class="a e2"><rect class="bx" x="40" y="108" width="330" height="52" rx="8"/><text class="tk" x="56" y="131">подделки</text><text class="sm mu" x="56" y="151">выпуск «multisplit: резать на части»</text><path class="lm" d="M374 134L429.5 114.9"/><polygon class="hm" points="438,112 431.0,119.2 428.0,110.7"/></g>
<g class="a e3"><rect class="bx" x="40" y="172" width="330" height="52" rx="8"/><text class="tk" x="56" y="195">fooling</text><text class="sm mu" x="56" y="215">так называется в программе</text><path class="lm" d="M374 198L432.6 119.2"/><polygon class="hm" points="438,112 436.2,121.9 429.0,116.5"/></g>
<g class="a e4"><rect class="bxa" x="444" y="56" width="250" height="112" rx="10"/><text class="tk c" x="569" y="90">условие подделки</text><text class="sm c" x="569" y="114">коротко: условие</text><text class="sm mu c" x="569" y="138">в коде: fooling</text></g>
<g class="a e5"><rect class="bxd" x="716" y="56" width="204" height="112" rx="10"/><text class="cap c" x="818" y="84">не путать</text><text class="tk c" x="818" y="110">условия профиля</text><text class="sm mu c" x="818" y="132">решают, какие пакеты</text><text class="sm mu c" x="818" y="152">достаются профилю</text></g>
<g class="a e6"><text class="smk" x="40" y="246">условие подделки: намеренный дефект, без которого подделка получателю вредит</text><text class="sm mu" x="40" y="268">профиль решает, какие пакеты брать; условие подделки решает, чем подделка отличается от настоящего</text></g>
<g><text class="cap" x="40" y="304">договорённости выпуска, они повторятся</text></g>
<g class="a e7"><rect class="bxa" x="40" y="320" width="168" height="128" rx="8"/><text class="smk c" x="124.0" y="344">в нашем тесте</text><text class="sm c" x="124.0" y="392">настоящий запуск</text><text class="sm c" x="124.0" y="412">nfqws2 в нашей</text><text class="sm c" x="124.0" y="432">лаборатории</text></g>
<g class="a e8"><rect class="bxs" x="218" y="320" width="168" height="128" rx="8"/><text class="smk c" x="302.0" y="344">по общим</text><text class="smk c" x="302.0" y="364">сведениям</text><text class="sm c" x="302.0" y="392">знание не из</text><text class="sm c" x="302.0" y="412">нашего кода и не</text><text class="sm c" x="302.0" y="432">из лаборатории</text></g>
<g class="a e9"><rect class="bxo" x="396" y="320" width="168" height="128" rx="8"/><text class="smk c" x="480.0" y="344">по счёту</text><text class="sm c" x="480.0" y="392">арифметика</text><text class="sm c" x="480.0" y="412">на бумаге</text></g>
<g class="a e10"><rect class="bxb" x="574" y="320" width="168" height="128" rx="8"/><text class="smk c" x="658.0" y="344">прогон</text><text class="smk c" x="658.0" y="364">функций</text><text class="sm c" x="658.0" y="392">функции программы</text><text class="sm c" x="658.0" y="412">без сети, на числах,</text><text class="sm c" x="658.0" y="432">которые мы подали</text></g>
<g class="a e11"><rect class="bxr" x="752" y="320" width="168" height="128" rx="8"/><text class="smk c" x="836.0" y="344">ТСПУ:</text><text class="smk c" x="836.0" y="364">неизвестно</text><text class="sm c" x="836.0" y="392">о настоящем</text><text class="sm c" x="836.0" y="412">оборудовании мы</text><text class="sm c" x="836.0" y="432">не знаем ничего</text></g>
<g class="a e12"><rect class="bx" x="40" y="468" width="880" height="76" rx="8"/><text class="sm" x="56" y="496">«Работает» значит: работает против нашего игрушечного инспектора и нашего сервера на Linux.</text><text class="sm" x="56" y="522">Игрушечный инспектор это наша модель наблюдателя, а не настоящее оборудование.</text></g>
