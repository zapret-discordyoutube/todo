<g><text class="cap" x="24" y="24">две группы: для практики и для интересующихся</text></g>
<g class="a e1"><rect class="bxb" x="24" y="44" width="446" height="30" rx="8"/><text class="tk" x="38" y="65">для практики: инструменты</text></g>
<g class="a e2"><rect class="bxb" x="24" y="82" width="446" height="32" rx="6"/><text class="sm" x="38" y="104">выпуск про blockcheck2</text></g>
<g class="a e3"><rect class="bxb" x="24" y="120" width="446" height="32" rx="6"/><text class="sm" x="38" y="142">выпуск про автоматическую смену стратегий</text></g>
<g class="a e4"><rect class="bxb" x="24" y="158" width="446" height="32" rx="6"/><text class="sm" x="38" y="180">выпуск про установку и запуск</text></g>
<g class="a e5"><rect class="bxb" x="24" y="196" width="446" height="32" rx="6"/><text class="sm" x="38" y="218">выпуск про обфускацию</text></g>
<g class="a e6"><text class="sm tk" x="24" y="256">не требуют выпусков про приёмы</text></g>
<g class="a e7"><rect class="bxg" x="490" y="44" width="446" height="30" rx="8"/><text class="tk" x="504" y="65">«под капотом»: необязательно, в конце</text></g>
<g class="a e8"><rect class="bxg" x="490" y="82" width="446" height="32" rx="6"/><text class="sm" x="504" y="104">«Внутри программы»</text></g>
<g class="a e9"><rect class="bxg" x="490" y="120" width="446" height="32" rx="6"/><text class="sm" x="504" y="142">«От байтов к таблице»</text></g>
<g class="a e10"><rect class="bxg" x="490" y="158" width="446" height="32" rx="6"/><text class="sm" x="504" y="180">«Память о соединении»</text></g>
<g class="a e11"><rect class="bxg" x="490" y="196" width="446" height="32" rx="6"/><text class="sm" x="504" y="218">«Тип нагрузки и имя сайта»</text></g>
<g class="a e12"><rect class="bxg" x="490" y="234" width="446" height="32" rx="6"/><text class="sm" x="504" y="256">«Профили: как программа выбирает»</text></g>
<g class="a e13"><rect class="bxg" x="490" y="272" width="446" height="32" rx="6"/><text class="sm" x="504" y="294">«Lua внутри программы»</text></g>
<g class="a e14"><rect class="bxg" x="490" y="310" width="446" height="32" rx="6"/><text class="sm" x="504" y="332">«Сборка и повторный проигрыш»</text></g>
<g class="a e15"><text class="sm tk" x="490" y="370">выпуски про приёмы его не предполагают</text></g>
<g class="a e16"><text class="sm mu" x="24" y="290">порядок и зависимости разберём дальше</text></g>
