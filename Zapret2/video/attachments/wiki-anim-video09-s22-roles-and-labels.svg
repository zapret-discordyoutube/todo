<svg xmlns="http://www.w3.org/2000/svg" class="v09-s22-roles-and-labels" viewBox="0 0 960 788" width="960" height="788" role="img" aria-labelledby="v09-s22-roles-and-labels-t v09-s22-roles-and-labels-d">
<title id="v09-s22-roles-and-labels-t">Роль и ярлык при флаге сервера</title>
<desc id="v09-s22-roles-and-labels-d">Флаг сервера не меняет роль отправителя, а переворачивает ярлык направления: в нашем тесте SYN клиента при программе на клиенте имеет роль клиент и ярлык исходящий, а при программе на сервере с флагом роль остаётся клиент, а ярлык становится входящий, SYN-ACK и ответ сервера из 14 байт имеют роль сервер и ярлык входящий у клиента, но исходящий у сервера, цель поиска профиля в режиме сервера это адрес клиента и порт 443, а стратегия synack_split видит SYN клиента вне своего диапазона и выключается, а SYN-ACK сервера в диапазоне и работает.</desc>
