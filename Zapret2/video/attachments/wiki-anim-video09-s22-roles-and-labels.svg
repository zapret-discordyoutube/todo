<g class="a e20"><text class="sm tk" x="54" y="586">цель поиска</text><rect class="bx" x="238" y="562" width="340" height="48" rx="6"/><text class="sm tk" x="246" y="582">адрес сервера, порт 443</text><text class="ix fg" x="246" y="601">ip=10.2.0.2 port=443</text><rect class="bxb" x="592" y="562" width="328" height="48" rx="6"/><text class="sm tk" x="600" y="582">адрес клиента, порт 443</text><text class="ix fg" x="600" y="601">ip=10.1.0.1 port=443</text></g>
<g class="a e21"><text class="sm mu" x="40" y="626">порт в фильтрах профиля всегда серверный, адрес для списков в режиме сервера клиентский</text></g>
<g class="a e22"><text class="sm tk" x="40" y="656">диапазон «эй» (всегда) относится к пакетам, которые отправляет сам сервер: synack_split</text></g>
<g class="a e23"><rect class="bx" x="40" y="660" width="880" height="110" rx="8"/><rect class="bxr" x="54" y="670" width="18" height="18" rx="4"/><text class="ix fg" x="84" y="684">&#x27;synack_split_1_2&#x27; : in pos x0 x0 out of range x0-x0</text><text class="sm tk rej" x="84" y="704">SYN клиента: вне диапазона, стратегия выключается</text><rect class="bxo" x="54" y="720" width="18" height="18" rx="4"/><text class="ix fg" x="84" y="734">&#x27;synack_split_1_2&#x27; : out pos a0 a0 in range a0-a0</text><text class="sm tk ok" x="84" y="754">SYN-ACK сервера: в диапазоне, стратегия работает</text></g>
</svg>
