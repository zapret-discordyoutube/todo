.v07-s14-md5-header-strips .hf{fill:var(--fg2)}.v07-s14-md5-header-strips .ha{fill:var(--acc)}.v07-s14-md5-header-strips .hr{fill:var(--rej)}.v07-s14-md5-header-strips .hm{fill:var(--mute)}.v07-s14-md5-header-strips .hb{fill:var(--amb)}.v07-s14-md5-header-strips .ho{fill:var(--ok)}
