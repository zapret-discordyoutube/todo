<svg xmlns="http://www.w3.org/2000/svg" class="v07-s14-md5-header-strips" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="v07-s14-md5-header-strips-t v07-s14-md5-header-strips-d">
<title id="v07-s14-md5-header-strips-t">Заголовок TCP с опцией MD5</title>
<desc id="v07-s14-md5-header-strips-d">Заголовок TCP в байтах: у настоящего приветствия 32 байта, то есть 20 обязательных и 12 байт опций из двух NOP и метки времени, у подделки с tcp_md5 52 байта, потому что добавлена опция MD5 с видом 19, длиной 18 и шестнадцатью случайными байтами и два нулевых байта выравнивания; с ключом tcp_nop_del заголовок 48 байт, потому что 10 плюс 18 дают 28, а 20 плюс 28 дают 48, и нули не нужны; при tcp_md5=0011 опция получается длиной 4 и заголовок 36 байт, получатель такую подделку принимает; в прогоне функций на синтетическом пакете опции NOP NOP SACK и метка времени уже занимают 38 байт из 40 допустимых, подпись на 18 байт не помещается и стратегия не срабатывает.</desc>
