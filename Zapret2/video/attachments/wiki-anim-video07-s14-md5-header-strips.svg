}}.v07-s14-md5-header-strips .e10{animation-name:v07-s14-md5-header-strips-k10}</style>
<rect class="bg" x="0" y="0" width="960" height="664"/>
<g><text class="cap" x="10" y="22">Заголовок TCP по байтам: обязательная часть и опции</text></g>
<g class="a e1"><text class="smk ns" x="10" y="50">настоящее приветствие</text><text class="mk r ns" x="950" y="50">заголовок 32 = 20 + 12</text><rect class="bx" x="30" y="60" width="320" height="32" rx="3"/><text class="sm c ns" x="190.0" y="81">20 обязательных</text><rect class="bxb" x="350" y="60" width="32" height="32" rx="3"/><rect class="bxa" x="382" y="60" width="160" height="32" rx="3"/><text class="sm c ns" x="462.0" y="81">метка времени, 10</text><text class="ix ns" x="30" y="112">01 01 | 08 0a 2b 24 f8 d4 1d 18 f7 6f</text></g>
<g class="a e2"><text class="ix c" x="366" y="136">два NOP: 01 01</text></g>
<g class="a e3"><text class="smk ns" x="10" y="164">подделка с tcp_md5</text><text class="mk r ns" x="950" y="164">заголовок 52 = 20 + 12 + 18 + 2</text><rect class="bx" x="30" y="174" width="320" height="32" rx="3"/><text class="sm c ns" x="190.0" y="195">20 обязательных</text><rect class="bxb" x="350" y="174" width="32" height="32" rx="3"/><rect class="bxa" x="382" y="174" width="160" height="32" rx="3"/><text class="sm c ns" x="462.0" y="195">метка времени, 10</text><rect class="bxr" x="542" y="174" width="288" height="32" rx="3"/><text class="sm c ns" x="686.0" y="195">MD5: вид 19, длина 18</text><rect class="bxd" x="830" y="174" width="32" height="32" rx="3"/><text class="ix ns" x="30" y="226">01 01 | 08 0a 2b 24 f8 d4 1d 18 f7 6f | 13 12 9e bd d9 7f d5 ad 91 33 5e 09 fc 4f 42 ed 7f 1f | 00 00</text></g>
<g class="a e4"><text class="ix r" x="846" y="250">нули выравнивания: 00 00</text></g>
<g class="a e5"><text class="smk ns" x="10" y="278">то же с tcp_nop_del: два NOP убраны</text><text class="mk r ns" x="950" y="278">заголовок 48 = 20 + 10 + 18</text><rect class="bx" x="30" y="288" width="320" height="32" rx="3"/><text class="sm c ns" x="190.0" y="309">20 обязательных</text><rect class="bxa" x="350" y="288" width="160" height="32" rx="3"/><text class="sm c ns" x="430.0" y="309">метка времени, 10</text><rect class="bxr" x="510" y="288" width="288" height="32" rx="3"/><text class="sm c ns" x="654.0" y="309">MD5: вид 19, длина 18</text><text class="ix ns" x="30" y="340">08 0a 21 c0 20 fb 91 ed 42 08 | 13 12 ca 9d cc ac 12 3b 34 8c 9d fa 18 97 3a 49 26 65</text></g>
<g class="a e6"><text class="ix r" x="794" y="364">28 делится на 4, нули не нужны</text></g>
<g class="a e7"><text class="smk ns" x="10" y="392">ловушка: tcp_md5=0011, два байта вместо 16</text><text class="mk r ns" x="950" y="392">заголовок 36 = 20 + 12 + 4</text><rect class="bx" x="30" y="402" width="320" height="32" rx="3"/><text class="sm c ns" x="190.0" y="423">20 обязательных</text><rect class="bxb" x="350" y="402" width="32" height="32" rx="3"/><rect class="bxa" x="382" y="402" width="160" height="32" rx="3"/><text class="sm c ns" x="462.0" y="423">метка времени, 10</text><rect class="bxr" x="542" y="402" width="64" height="32" rx="3"/><text class="ix ns" x="30" y="454">01 01 | 08 0a 35 e5 46 e8 4b 0c 4d 37 | 13 04 00 11</text><text class="sm tk ns" x="618" y="423">вид 19, длина 4, данные 00 11</text></g>
<g class="a e8"><rect class="bxr" x="30" y="466" width="920" height="28" rx="6"/><text class="sm tk ns" x="42" y="485">код длину не проверяет; получатель такую подделку принял: 680 Б, клиент завис</text></g>
<g class="a e9"><text class="smk ns" x="10" y="530">место под опции: не больше 40 байт (прогон функций, синтетический пакет)</text><text class="mk r rej ns" x="950" y="530">38 + 18 = 56 больше 40</text><rect class="bxb" x="30" y="540" width="32" height="32" rx="3"/><rect class="bxa" x="62" y="540" width="416" height="32" rx="3"/><text class="sm c ns" x="270.0" y="561">SACK: 3 блока, 26 байт</text><rect class="bxa" x="478" y="540" width="160" height="32" rx="3"/><text class="sm c ns" x="558.0" y="561">метка, 10</text><rect class="bxr" x="638" y="540" width="288" height="32" rx="3"/><text class="sm c ns" x="782" y="561">MD5, 18</text><path class="lr" d="M670 534L670 578"/><text class="sm tk r ns" x="664" y="594">предел 40 байт</text><text class="sm ns" x="30" y="594">NOP NOP + SACK + метка = 38 байт</text><text class="sm tk rej ns" x="30" y="616">сборка пакета даёт ошибку, и стратегия в этот раз не сработала</text></g>
<g class="a e10"><text class="sm tk" x="10" y="644">содержимое подписи не важно, длина обязана быть настоящей, места должно хватить</text></g>
</svg>
