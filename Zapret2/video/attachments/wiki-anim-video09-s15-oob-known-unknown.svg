<title id="video09-s15-oob-known-unknown-t">Что мы знаем про срочный байт</title>
<desc id="video09-s15-oob-known-unknown-d">Шесть вещей про срочный байт мы видели на нашем Linux и в нашей модели, а как себя поведут другие получатели, приложение, читающее срочные данные отдельно, настоящий инспектор, IPv6 и нарезка на уровне IP, мы не знаем.</desc>
