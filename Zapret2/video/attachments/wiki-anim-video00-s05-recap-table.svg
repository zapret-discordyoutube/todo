.v00-s05-recap-table .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v00-s05-recap-table .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v00-s05-recap-table .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v00-s05-recap-table .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v00-s05-recap-table .hf{fill:var(--fg2)}.v00-s05-recap-table .ha{fill:var(--acc)}.v00-s05-recap-table .hr{fill:var(--rej)}.v00-s05-recap-table .hm{fill:var(--mute)}.v00-s05-recap-table .hb{fill:var(--amb)}
.v00-s05-recap-table .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v00-s05-recap-table .a{animation-duration:48s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
