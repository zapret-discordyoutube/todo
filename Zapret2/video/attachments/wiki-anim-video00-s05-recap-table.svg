%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s05-recap-table .e8{animation-name:v00-s05-recap-table-k8}@keyframes v00-s05-recap-table-k9{0.0%{opacity:0;transform:translate(0px,-6px)}62.0%{opacity:0;transform:translate(0px,-6px)}64.0%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s05-recap-table .e9{animation-name:v00-s05-recap-table-k9}@keyframes v00-s05-recap-table-k10{0.0%{opacity:0;transform:translate(0px,-6px)}71.5%{opacity:0;transform:translate(0px,-6px)}73.5%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s05-recap-table .e10{animation-name:v00-s05-recap-table-k10}@keyframes v00-s05-recap-table-k11{0.0%{opacity:0;transform:translate(0px,-6px)}81.0%{opacity:0;transform:translate(0px,-6px)}83.0%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s05-recap-table .e11{animation-name:v00-s05-recap-table-k11}@keyframes v00-s05-recap-table-k12{0.0%{opacity:0}92%{opacity:0}94%{opacity:1}95.25%{opacity:1}96.75%{opacity:0}100%{opacity:0}}.v00-s05-recap-table .e12{animation-name:v00-s05-recap-table-k12}</style>
<rect class="bg" x="0" y="0" width="960" height="710"/>
<g class="a e1"><rect class="bxa" x="40" y="8" width="150" height="24" rx="5"/><text class="cap acc" x="50" y="24.5">ДОКУМЕНТАЦИЯ</text><rect class="bxo" x="200" y="8" width="153" height="24" rx="5"/><text class="cap ok" x="210" y="24.5">В НАШЕМ ТЕСТЕ</text><rect class="bxb" x="362.9" y="8" width="220.5" height="24" rx="5"/><text class="cap amb" x="372.9" y="24.5">ПО ОБЩИМ СВЕДЕНИЯМ</text></g>
<g class="a e2"><text class="cap" x="52" y="62">что блокируют</text><text class="cap" x="296" y="62">что видит человек</text><text class="cap" x="562" y="62">поможет ли zapret2</text></g>
<g class="a e3"><rect class="bx" x="40" y="74" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="108">подмена DNS</text><text class="sm" x="296" y="99">чужая страница</text><text class="sm" x="296" y="119">или сайта нет</text><rect class="bxr" x="550" y="80" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="99">нет:</text><text class="tk sm" x="562" y="119">другой или шифрованный DNS</text><circle cx="874" cy="103" r="7" fill="var(--acc)"/><circle cx="894" cy="103" r="7" fill="var(--ok)"/></g>
<g class="a e4"><rect class="bx" x="40" y="138" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="163">шифрованный DNS:</text><text class="tk sm" x="52" y="183">блок по имени сервера</text><text class="sm" x="296" y="163">соединение с DNS</text><text class="sm" x="296" y="183">обрывают</text><rect class="bxo" x="550" y="144" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="163">да, как обычный сайт:</text><text class="tk sm" x="562" y="183">список имён и стратегия</text><circle cx="884" cy="167" r="7" fill="var(--amb)"/></g>
<g class="a e5"><rect class="bx" x="40" y="202" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="227">блок адреса:</text><text class="tk sm" x="52" y="247">полный или по порту</text><text class="sm" x="296" y="227">ничего не доходит,</text><text class="sm" x="296" y="247">зависание</text><rect class="bxr" x="550" y="208" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="227">нет:</text><text class="tk sm" x="562" y="247">нужен VPN или прокси</text><circle cx="874" cy="231" r="7" fill="var(--acc)"/><circle cx="894" cy="231" r="7" fill="var(--ok)"/></g>
<g class="a e6"><rect class="bx" x="40" y="266" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="300">частичный блок адреса</text><text class="sm" x="296" y="291">соединение есть,</text><text class="sm" x="296" y="311">дальше зависание</text><rect class="bxs" x="550" y="272" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="300">серая зона</text><circle cx="884" cy="295" r="7" fill="var(--acc)"/></g>
<g class="a e7"><rect class="bx" x="40" y="330" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="364">блок по имени сайта</text><text class="sm" x="296" y="355">зависание, быстрая</text><text class="sm" x="296" y="375">ошибка, заглушка</text><rect class="bxo" x="550" y="336" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="355">да, в принципе:</text><text class="tk sm" x="562" y="375">и это проверяется</text><circle cx="874" cy="359" r="7" fill="var(--ok)"/><circle cx="894" cy="359" r="7" fill="var(--amb)"/></g>
<g class="a e8"><rect class="bx" x="40" y="394" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="419">блок по сигнатуре</text><text class="tk sm" x="52" y="439">протокола</text><text class="sm" x="296" y="419">не работает</text><text class="sm" x="296" y="439">отдельный сервис</text><rect class="bxs" x="550" y="400" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="428">частично</text><circle cx="874" cy="423" r="7" fill="var(--acc)"/><circle cx="894" cy="423" r="7" fill="var(--amb)"/></g>
<g class="a e9"><rect class="bx" x="40" y="458" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="492">замедление</text><text class="sm" x="296" y="483">открывается, но</text><text class="sm" x="296" y="503">очень медленно</text><rect class="bxs" x="550" y="464" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="483">«может»,</text><text class="tk sm" x="562" y="503">без гарантий</text><circle cx="874" cy="487" r="7" fill="var(--acc)"/><circle cx="894" cy="487" r="7" fill="var(--amb)"/></g>
<g class="a e10"><rect class="bx" x="40" y="522" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="556">белые списки</text><text class="sm" x="296" y="547">открываются только</text><text class="sm" x="296" y="567">разрешённые сайты</text><rect class="bxs" x="550" y="528" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="547">«может», без</text><text class="tk sm" x="562" y="567">готовых рецептов</text><circle cx="874" cy="551" r="7" fill="var(--acc)"/><circle cx="894" cy="551" r="7" fill="var(--amb)"/></g>
<g class="a e11"><rect class="bx" x="40" y="586" width="880" height="58" rx="8"/><text class="tk sm" x="52" y="620">гео-блокировка</text><text class="sm" x="296" y="611">сервис сам не пускает</text><text class="sm" x="296" y="631">адрес из страны</text><rect class="bxr" x="550" y="592" width="300" height="46" rx="8"/><text class="tk sm" x="562" y="611">нет:</text><text class="tk sm" x="562" y="631">нужен другой адрес</text><circle cx="884" cy="615" r="7" fill="var(--amb)"/></g>
<g class="a e12"><text class="sm mu" x="40" y="670">цветные кружки справа: на чём держится строка (цвета как у плашек сверху)</text><text class="sm tk" x="40" y="692">каждая строка уже прозвучала выше: таблица ничего нового не добавляет</text></g>
</svg>
