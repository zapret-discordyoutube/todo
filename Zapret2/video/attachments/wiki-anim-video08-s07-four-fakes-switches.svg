<g><text class="cap" x="40" y="22">четыре фейка по порядку отправки и их выключатели</text></g>
<g class="a e1"><rect class="bxd" x="40" y="32" width="880" height="92" rx="8"/><text class="cap" x="54" y="50">игрушка (выдуманный пример): две пачки и четыре пустышки</text><rect class="bxb" x="54" y="62" width="124" height="52" rx="6"/><text class="smk c ns" x="116.0" y="83">пустышка 1</text><text class="sm c ns" x="116.0" y="103">перед первой</text><rect class="bxa" x="198" y="62" width="124" height="52" rx="6"/><text class="smk c ns" x="260.0" y="83">пачка 1</text><text class="sm c ns" x="260.0" y="103">настоящая</text><rect class="bxb" x="342" y="62" width="124" height="52" rx="6"/><text class="smk c ns" x="404.0" y="83">пустышка 2</text><text class="sm c ns" x="404.0" y="103">после первой</text><rect class="bxb" x="486" y="62" width="124" height="52" rx="6"/><text class="smk c ns" x="548.0" y="83">пустышка 3</text><text class="sm c ns" x="548.0" y="103">перед второй</text><rect class="bxa" x="630" y="62" width="124" height="52" rx="6"/><text class="smk c ns" x="692.0" y="83">пачка 2</text><text class="sm c ns" x="692.0" y="103">настоящая</text><rect class="bxb" x="774" y="62" width="124" height="52" rx="6"/><text class="smk c ns" x="836.0" y="83">пустышка 4</text><text class="sm c ns" x="836.0" y="103">после второй</text></g>
<g><text class="cap" x="40" y="152">настоящая функция: шесть пакетов по порядку отправки</text></g>
<g class="a e2"><rect class="bxb" x="54" y="174" width="124" height="44" rx="5"/><text class="mt c ns" x="116.0" y="201.0">F104@0</text><circle class="pl" cx="68" cy="174" r="11"/><text class="sm tk c ns" x="68" y="179">1</text><rect class="bxa" x="198" y="174" width="124" height="44" rx="5"/><text class="mt fg c ns" x="260.0" y="201.0">R104@0</text><rect class="bxb" x="342" y="174" width="124" height="44" rx="5"/><text class="mt c ns" x="404.0" y="201.0">F104@0</text><circle class="pl" cx="356" cy="174" r="11"/><text class="sm tk c ns" x="356" y="179">2</text><rect class="bxb" x="486" y="174" width="124" height="44" rx="5"/><text class="mt c ns" x="548.0" y="201.0">F146@104</text><circle class="pl" cx="500" cy="174" r="11"/><text class="sm tk c ns" x="500" y="179">3</text><rect class="bxa" x="630" y="174" width="124" height="44" rx="5"/><text class="mt fg c ns" x="692.0" y="201.0">R146@104</text><rect class="bxb" x="774" y="174" width="124" height="44" rx="5"/><text class="mt c ns" x="836.0" y="201.0">F146@104</text><circle class="pl" cx="788" cy="174" r="11"/><text class="sm tk c ns" x="788" y="179">4</text></g>
<g class="a e3"><rect class="bxd" x="62" y="228" width="108" height="26" rx="5"/><text class="mk c ns" x="116.0" y="246">nofake1</text><text class="sm mu c ns" x="260.0" y="246">остаётся</text><rect class="bxd" x="350" y="228" width="108" height="26" rx="5"/><text class="mk c ns" x="404.0" y="246">nofake2</text><rect class="bxd" x="494" y="228" width="108" height="26" rx="5"/><text class="mk c ns" x="548.0" y="246">nofake3</text><text class="sm mu c ns" x="692.0" y="246">остаётся</text><rect class="bxd" x="782" y="228" width="108" height="26" rx="5"/><text class="mk c ns" x="836.0" y="246">nofake4</text></g>
<g class="a e4"><text class="smk" x="40" y="278">номер в имени выключателя: номер фейка по порядку отправки; настоящие части остаются</text></g>
<g class="a e5"><rect class="bx" x="40" y="304" width="560" height="188" rx="8"/><text class="cap" x="54" y="326">код функции</text><text class="mk mu ns" x="188.60500000000002" y="326">fakedsplit</text><text class="sm mu r ns" x="586" y="326">lua/zapret-antidpi.lua</text><text class="ix ns" x="56" y="358">858</text><text class="cdh" x="100" y="358">if not desync.arg.nofake1 then</text><text class="sm mu ns" x="366" y="358">перед первой настоящей</text><text class="ix ns" x="56" y="386">882</text><text class="cdh" x="100" y="386">if not desync.arg.nofake2 then</text><text class="sm mu ns" x="366" y="386">после первой настоящей</text><text class="ix ns" x="56" y="414">889</text><text class="cdh" x="100" y="414">if not desync.arg.nofake3 then</text><text class="sm mu ns" x="366" y="414">перед второй настоящей</text><text class="ix ns" x="56" y="442">900</text><text class="cdh" x="100" y="442">if not desync.arg.nofake4 then</text><text class="sm mu ns" x="366" y="442">после второй настоящей</text><text class="sm" x="54" y="476">порядок строк в функции и есть нумерация</text></g>
<g class="a e6"><rect class="bxo" x="620" y="304" width="300" height="188" rx="8"/><text class="smk ns" x="634" y="332">проверяется только наличие</text><text class="smk ns" x="634" y="354">ключа, а не его значение</text><text class="sm ns" x="634" y="386">ключ есть: фейк убран</text><text class="sm ns" x="634" y="408">в Lua ложны только nil и false,</text><text class="sm ns" x="634" y="428">поэтому даже ноль убирает фейк</text><rect class="bxb" x="634" y="452" width="156" height="24" rx="5"/><text class="smk amb c ns" x="712" y="469">прогон функций</text><text class="m ns" x="800" y="469">nofake1=0</text></g>
