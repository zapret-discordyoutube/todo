<svg xmlns="http://www.w3.org/2000/svg" class="video08-s07-four-fakes-switches" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="video08-s07-four-fakes-switches-t video08-s07-four-fakes-switches-d">
<title id="video08-s07-four-fakes-switches-t">Четыре фейка, четыре выключателя</title>
<desc id="video08-s07-four-fakes-switches-d">Четыре фейка fakedsplit пронумерованы по порядку отправки и у каждого свой выключатель: в игрушке с двумя пачками и четырьмя пустышками пустышка 1 стоит перед первой пачкой, 2 после неё, 3 перед второй, 4 после второй; в настоящей функции шесть пакетов идут как фейк 1, настоящая первая часть, фейк 2 в смысле повтора, фейк второй части, настоящая вторая часть и последний фейк, а выключатели называются nofake1, nofake2, nofake3 и nofake4; в коде перед отправкой каждого фейка стоит проверка наличия ключа с таким номером, поэтому значение ключа не важно, даже ноль убирает фейк, ведь в Lua ложны только nil и false, а настоящие части выключатели не трогают.</desc>
