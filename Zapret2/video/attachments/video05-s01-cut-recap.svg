<rect class="bg" x="0" y="0" width="960" height="584"/>
<g><text class="cap" x="40" y="26">повтор: одно приветствие, один разрез</text></g>
<g class="a e1"><text class="m mu" x="40" y="52">--payload=tls_client_hello</text><text class="mk" x="300" y="52">--lua-desync=multisplit:pos=midsld</text></g>
<g class="a e2"><rect class="bx" x="40" y="110" width="880" height="40" rx="4"/><rect class="fa" x="381.4" y="110" width="52.8" height="40"/><text class="sm" x="44" y="136">ClientHello, 250 байт</text><text class="mk c" x="407.8" y="76">www.example.com</text><text class="ix c" x="407.8" y="94">байты 97–111</text><path class="la" d="M381.4 100L434.2 100"/></g>
<g class="a e3"><text class="ix c" x="40" y="168">0</text><text class="ix c" x="920" y="168">250</text></g>
<g class="a e4"><path class="lcut" d="M406.1 104L406.1 158"/><text class="mk" x="414.1" y="176">midsld = 101 + 7 // 2 = 104</text><text class="sm mu" x="414.1" y="196">семь, поделённое нацело на два, это три</text></g>
<g class="a e5"><text class="sm mu r" x="398.1" y="176">sld = 101</text></g>
<g class="a e6"><rect class="bxa" x="40" y="262" width="360.3" height="44" rx="4"/><rect class="fb" x="376" y="262" width="24.2" height="44"/><text class="mk" x="48" y="290">пакет 1: 104 байта</text><text class="sm r" x="396.3" y="254">кончается на www.exa</text></g>
<g class="a e7"><rect class="bxa" x="414.3" y="262" width="505.7" height="44" rx="4"/><rect class="fb" x="414.3" y="262" width="27.7" height="44"/><text class="mk" x="452" y="290">пакет 2: 146 байт</text><text class="sm" x="418.3" y="254">начинается с mple.com</text></g>
<g class="a e8"><path class="lcut" d="M406.1 204L406.1 228"/><polygon class="hr" points="406.1,238 401.1,228 411.1,228"/></g>
<g class="a e9"><text class="ix r" x="400.3" y="326">байты 0–103</text><text class="ix" x="414.3" y="326">байты 104–249</text></g>
<g class="a e10"><rect class="bxr" x="780" y="180" width="140" height="28" rx="4"/><text class="mk rej c" x="850" y="200">оригинал: DROP</text></g>
<g class="a e11"><rect class="bxo" x="40" y="350" width="880" height="44" rx="8"/><text class="tk" x="56" y="378">сервер складывает части подряд: 250 байт, хэш совпал с оригиналом</text></g>
<g class="a e12"><text class="cap" x="40" y="428">что скопировано, что различается (захват клиента, относительные номера)</text></g>
<g class="a e13"><text class="sm mu" x="140" y="460">данные</text><text class="sm mu" x="290" y="460">номер последовательности</text><text class="sm mu" x="530" y="460">идентификатор IP</text><text class="sm mu" x="690" y="460">флаги, TTL, опции</text></g>
<g class="a e14"><rect class="bx" x="34" y="474" width="892" height="30" rx="4"/><text class="m mu" x="40" y="494">пакет 1</text><text class="mk" x="140" y="494">104 байта</text><text class="mk" x="290" y="494">1</text><text class="mk" x="530" y="494">1749</text><text class="m mu" x="690" y="494">0x18, 64, равны</text></g>
<g class="a e15"><rect class="bx" x="34" y="508" width="892" height="30" rx="4"/><text class="m mu" x="40" y="528">пакет 2</text><text class="mk" x="140" y="528">146 байт</text><text class="mk" x="290" y="528">1 + 104 = 105</text><text class="mk" x="530" y="528">1750</text><text class="m mu" x="690" y="528">0x18, 64, равны</text></g>
<g class="a e16"><text class="sm mu" x="40" y="566">Меняются данные и два счётчика, остальное скопировано; как это делается, разберём в следующей части.</text></g>
</svg>
