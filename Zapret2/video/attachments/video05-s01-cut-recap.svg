<svg xmlns="http://www.w3.org/2000/svg" class="v05-s01-cut-recap" viewBox="0 0 960 584" width="960" height="584" role="img" aria-labelledby="v05-s01-cut-recap-t v05-s01-cut-recap-d">
<title id="v05-s01-cut-recap-t">Повтор разреза по midsld</title>
<desc id="v05-s01-cut-recap-d">Повтор: разрез по метке midsld превращает приветствие в 250 байт в два пакета, в 104 и 146 байт: имя www.example.com занимает байты с 97 по 111, метка midsld стоит на байте 104 (sld 101 плюс 7 поделить нацело на 2 это 3), первый пакет кончается на www.exa, второй начинается с mple.com, оригинал программа выбрасывает (DROP), а сервер складывает части и получает те же 250 байт; в захвате клиента у частей одинаковые заголовки, а различаются данные и два счётчика: относительный номер последовательности 1 и 105, идентификатор IP 1749 и 1750.</desc>
<style>.v05-s01-cut-recap{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
