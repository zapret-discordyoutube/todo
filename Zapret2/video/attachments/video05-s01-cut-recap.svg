.v05-s01-cut-recap .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v05-s01-cut-recap .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v05-s01-cut-recap .hf{fill:var(--fg2)}.v05-s01-cut-recap .ha{fill:var(--acc)}.v05-s01-cut-recap .hr{fill:var(--rej)}.v05-s01-cut-recap .hm{fill:var(--mute)}.v05-s01-cut-recap .hb{fill:var(--amb)}
.v05-s01-cut-recap .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
