<rect class="bg" x="0" y="0" width="960" height="716"/>
<g><text class="cap" x="40" y="24">числа и слова этой части и что дальше</text></g>
<g class="a e1"><text class="sm tk" x="40" y="54">числа: приветствие в 250 байт, два куска по метке midsld</text></g>
<g class="a e2"><rect class="bxa" x="40" y="64" width="366.1" height="30" rx="0"/><text class="sm c" x="223" y="84">104</text><rect class="bxb" x="406.1" y="64" width="513.9" height="30" rx="0"/><text class="sm c" x="663" y="84">146</text></g>
<g class="a e3"><text class="sm c mu" x="223" y="112">уходит вторым</text><text class="sm c mu" x="663" y="112">уходит первым</text></g>
<g class="a e4"><text class="sm tk" x="40" y="142">пять кусков, в порядке отправки: 138, 8, 7, 95, 2</text></g>
<g class="a e5"><rect class="bxa" x="40" y="152" width="7" height="30" rx="0"/><rect class="bxb" x="47" y="152" width="334.4" height="30" rx="0"/><text class="sm c" x="214.2" y="172">95</text><rect class="bxa" x="381.4" y="152" width="24.6" height="30" rx="0"/><rect class="bxb" x="406.1" y="152" width="28.2" height="30" rx="0"/><rect class="bxa" x="434.2" y="152" width="485.8" height="30" rx="0"/><text class="sm c" x="677.1" y="172">138</text></g>
<g class="a e6"><text class="sm c" x="43.5" y="200">2</text><text class="sm c" x="393.8" y="200">7</text><text class="sm c" x="420.2" y="200">8</text></g>
<g class="a e7"><text class="sm tk r" x="920" y="200">138 + 8 + 7 + 95 + 2 = 250</text></g>
<g class="a e8"><text class="cap" x="40" y="226">слова</text></g>
<g class="a e9"><rect class="bx" x="40" y="236" width="280" height="74" rx="6"/><text class="mk" x="52" y="260">ACK</text><text class="sm" x="52" y="282">следующий байт, которого ждёт</text><text class="sm" x="52" y="301">получатель</text></g>
<g class="a e10"><rect class="bx" x="340" y="236" width="280" height="74" rx="6"/><text class="mk" x="352" y="260">SACK</text><text class="sm" x="352" y="282">блок «у меня лежат такие-то</text><text class="sm" x="352" y="301">байты»</text></g>
<g class="a e11"><rect class="bx" x="640" y="236" width="280" height="74" rx="6"/><text class="mk" x="652" y="260">дублирующий SACK</text><text class="sm" x="652" y="282">блок с уже полученными</text><text class="sm" x="652" y="301">байтами</text></g>
<g class="a e12"><rect class="bx" x="40" y="320" width="280" height="74" rx="6"/><text class="mk" x="52" y="344">nodrop</text><text class="sm" x="52" y="368">не выбрасывать оригинал</text></g>
<g class="a e13"><rect class="bx" x="340" y="320" width="280" height="74" rx="6"/><text class="mk" x="352" y="344">pos=0</text><text class="sm" x="352" y="368">это не разрез</text></g>
<g class="a e14"><rect class="bxd" x="640" y="320" width="280" height="54" rx="6"/><text class="sm" x="652" y="342">раньше «дублирующий блок»</text><text class="sm tk" x="652" y="362">= дублирующий SACK</text></g>
<g class="a e15"><text class="cap" x="40" y="428">три вопроса к следующей части</text></g>
<g class="a e16"><rect class="bx" x="40" y="438" width="280" height="58" rx="6"/><text class="sm" x="52" y="461">1 · что будет, если куски</text><text class="sm" x="52" y="483">перекрываются</text></g>
<g class="a e17"><rect class="bx" x="340" y="438" width="280" height="58" rx="6"/><text class="sm" x="352" y="461">2 · что будет с приветствием из</text><text class="sm" x="352" y="483">нескольких пакетов</text></g>
<g class="a e18"><rect class="bx" x="640" y="438" width="280" height="58" rx="6"/><text class="sm" x="652" y="461">3 · чем старая версия функции</text><text class="sm" x="652" y="483">отличается от новой</text></g>
<g class="a e19"><text class="cap" x="40" y="524">что дальше: накладка (seqovl)</text></g>
<g class="a e20"><rect class="bxa" x="40" y="534" width="366.1" height="34" rx="0"/><text class="sm c" x="223" y="556">начало, 104 байта</text><rect class="bxb" x="406.1" y="534" width="513.9" height="34" rx="0"/><text class="sm c" x="663" y="556">конец, 146 байт</text></g>
<g class="a e21"><rect class="bxd" x="335.7" y="576" width="176" height="26" rx="0"/><text class="sm c mu" x="423.7" y="594">черновик</text></g>
<g class="a e22"><text class="sm" x="521.7" y="594">перед концом, накрывает хвост начала</text></g>
<g class="a e23"><text class="sm mu" x="40" y="624">сколько байт, задаёт метка левее разреза; в нашем тесте приложение сервера получило настоящие байты</text></g>
<g class="a e24"><text class="sm mu" x="40" y="648">расстановка черновика на ленте условная, это рисунок идеи; подробности в следующей части</text></g>
</svg>
