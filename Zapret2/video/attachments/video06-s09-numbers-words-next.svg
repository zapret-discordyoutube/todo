<svg xmlns="http://www.w3.org/2000/svg" class="v06-s09-numbers-words-next" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="v06-s09-numbers-words-next-t v06-s09-numbers-words-next-d">
<title id="v06-s09-numbers-words-next-t">Числа, слова и мост к накладке</title>
<desc id="v06-s09-numbers-words-next-d">Числа и слова первой трети выпуска и мост к следующей части: приветствие в 250 байт режется по метке midsld на куски 104 и 146 байт, а пять кусков в порядке отправки имеют длины 138, 8, 7, 95 и 2 байта и вместе дают 250; слова: ACK это следующий байт, которого ждёт получатель, SACK это блок с байтами, которые у получателя уже лежат, дублирующий SACK это блок с уже полученными байтами (раньше мы называли его дублирующим блоком), nodrop значит не выбрасывать оригинал, а аргумент pos равный нулю не разрез; к следующей части три вопроса: что будет, если куски перекрываются, что будет с приветствием из нескольких пакетов и чем старая версия функции отличается от новой; дальше в кусок, который начинается с первого разреза, у нас это конец, можно вписать черновик, то есть несколько лишних байт перед настоящими, они накроют хвост начала, их число задаёт метка левее разреза, а в нашем тесте приложение сервера получило настоящие байты.</desc>
