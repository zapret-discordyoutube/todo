<svg xmlns="http://www.w3.org/2000/svg" class="video09-s05-lost-syn-and-hostlist" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="video09-s05-lost-syn-and-hostlist-t video09-s05-lost-syn-and-hostlist-d">
<title id="video09-s05-lost-syn-and-hostlist-t">Повтор SYN и профиль без имени</title>
<desc id="video09-s05-lost-syn-and-hostlist-d">Когда лабораторное правило выбросило первый SYN с данными, клиент повторил его через 1030 мс, программа снова подставила SYN с данными без обломка и соединение установилось примерно за 1,04 с, а профиль со списком имён на SYN не подходит, потому что имени сайта в SYN нет, и приём в нём не запускается.</desc>
