<g class="a video09-s05-lost-syn-and-hostlist-k13"><rect class="bx" x="40" y="546" width="230" height="36" rx="6"/><text class="smk c" x="155" y="569">SYN: имени сайта нет</text><rect class="bxr" x="300" y="546" width="350" height="36" rx="6"/><text class="smk c" x="475" y="569">профиль со списком имён не подходит</text><rect class="bxr" x="680" y="546" width="240" height="36" rx="6"/><text class="smk c" x="800" y="569">syndata не запускается</text><path class="lm" d="M274 564L287 564"/><polygon class="hm" points="296,564 287,568 287,560"/><path class="lm" d="M654 564L667 564"/><polygon class="hm" points="676,564 667,568 667,560"/></g>
<g class="a video09-s05-lost-syn-and-hostlist-k14"><text class="sm13 mu" x="40" y="606">приём работает только в профилях, которым имя не нужно;</text><text class="sm13 mu" x="40" y="624">порядок стратегий в строке для него тоже важен: см. часть про окна</text></g>
