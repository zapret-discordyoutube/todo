<g class="a video09-s05-lost-syn-and-hostlist-k8"><text class="sm13 mu" x="40" y="264">первый SYN выбросило специальное правило лаборатории; в настоящей сети такого правила нет</text></g>
<g class="a video09-s05-lost-syn-and-hostlist-k9"><rect class="bx" x="40" y="280" width="880" height="48" rx="6"/><text class="cd" x="52" y="300">LUA: syndata: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00</text><text class="cdh" x="52" y="319">packet: id=2 drop</text><text class="sm13 mu" x="200" y="319">настоящий выброс оригинала повтора: это уже не первый пакет, подмены нет</text></g>
