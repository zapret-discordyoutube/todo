<title id="v07-s10-two-routers-answer-t">Два роутера: срок 2</title>
<desc id="v07-s10-two-routers-answer-d">Ответ на вопрос о двух роутерах: подделка со сроком жизни 2 видна на точках записи у клиента, на входе роутера 1 и на его выходе со сроком 1, на втором роутере срок кончается и оттуда приходит ICMP тип 11 с адреса 10.9.1.2, до сервера подделка не доходит, игрушечный инспектор на входе роутера 1 видит её длиной 680 со сроком 2 и разрешает соединение, приложение сервера получает чистые 250 байт, а клиент получает ответ.</desc>
