<g><text class="cap" x="24" y="24">жёсткие зависимости: что нужно посмотреть раньше</text></g>
<g class="a e1"><rect class="bxa" x="24" y="54" width="262" height="40" rx="8"/><text class="sm tk c" x="155" y="79">«Где резать: метки»</text></g>
<g class="a e2"><rect class="bxo" x="336" y="54" width="262" height="40" rx="8"/><text class="sm tk c" x="467" y="79">«multisplit: резать на части»</text></g>
