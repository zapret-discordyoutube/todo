<svg xmlns="http://www.w3.org/2000/svg" class="v00-s21-hard-edges" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v00-s21-hard-edges-t v00-s21-hard-edges-d">
<title id="v00-s21-hard-edges-t">Жёсткие зависимости выпусков</title>
<desc id="v00-s21-hard-edges-d">Жёсткие зависимости между выпусками: метки нужны перед выпуском про разрезание на части, он нужен перед перестановкой и перед резкой с подделкой, фейк нужен перед резкой с подделкой и перед фокусами рукопожатия, другие слои опираются на разрезание и фейк, а у инструментов и выпуска про отладку стратегий стрелок нет, поэтому в любом порядке смотреть нельзя.</desc>
