<g class="a e4"><rect class="bxo" x="336" y="262" width="262" height="40" rx="8"/><text class="sm tk c" x="467" y="287">«Фейк и его условия»</text></g>
<g class="a e5"><rect class="bxo" x="646" y="160" width="290" height="40" rx="8"/><text class="sm tk c" x="791" y="185">«Резать и подделывать вместе»</text></g>
