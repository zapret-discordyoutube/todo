<g class="a e15"><text class="sm tk" x="24" y="190">стрелка значит:</text><text class="sm" x="24" y="214">сначала смотрят то, откуда она идёт</text><path class="la" d="M24 232L64 232"/><text class="sm" x="72" y="237">от multisplit</text><path class="lb" d="M24 256L64 256"/><text class="sm" x="72" y="261">от фейка</text></g>
