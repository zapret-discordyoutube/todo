<svg xmlns="http://www.w3.org/2000/svg" class="v05-s24-fooling-trap" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="v05-s24-fooling-trap-t v05-s24-fooling-trap-d">
<title id="v05-s24-fooling-trap-t">Подмена бьёт по частям</title>
<desc id="v05-s24-fooling-trap-d">Ловушка подмены полей в multisplit: функция desync_opts (lua/zapret-lib.lua:423-431) раздаёт одну таблицу desync.arg, где лежат и pos, и аргументы подмены, по пяти веткам rawsend, reconstruct, ipfrag, ipid и fooling, а отправка в строке 1237 вызывает apply_fooling на каждый вызов, поэтому всё заданное получают настоящие части, как выдуманный курьер, который ставит штамп «доставить до первого поста» на каждую посылку, и ни одна не доходит; в опыте multisplit:pos=midsld:ip_ttl=1 клиент отправил 12 пакетов, шесть пар 1+104 и 105+146, с TTL 1, до сервера не дошёл ни один, роутер вернул 9 сообщений ICMP типа 11 на 12 пакетов, почему не 12, не выясняли, приложение сервера прочитало 0 байт и клиент остался без ответа; прогон функций с ip_ttl=3 показал TTL 3 у обеих частей, размеры 156 и 198; в multisplit нет отдельных поддельных аргументов, подмена бьёт по настоящим данным, а для pos=2,midsld и ip_ttl=3 по коду у третьей части тоже будет TTL 3, хотя три части с этим аргументом мы не запускали.</desc>
