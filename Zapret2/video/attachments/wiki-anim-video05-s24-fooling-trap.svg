<g class="a e22"><rect class="bxr" x="40" y="598" width="430" height="52" rx="8"/><text class="sm tk" x="54" y="620">до сервера не дошёл ни один пакет</text><text class="sm" x="54" y="640">приложение 0 байт; клиент без ответа</text></g>
<g class="a e23"><rect class="bx" x="490" y="598" width="430" height="52" rx="8"/><text class="sm tk" x="504" y="620">прогон функций (метка): ip_ttl=3</text><text class="m" x="504" y="640">ttl 3: размеры 156 и 198</text></g>
<g class="a e24"><rect class="bxa" x="40" y="664" width="880" height="50" rx="8"/><text class="sm tk" x="54" y="686">в multisplit нет отдельных «поддельных» аргументов: подмена бьёт по настоящим данным</text><text class="sm" x="54" y="705">журнал чистый, части уходят, а соединение просто не работает</text></g>
