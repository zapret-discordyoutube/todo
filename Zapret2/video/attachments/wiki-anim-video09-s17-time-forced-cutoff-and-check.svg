<rect class="bg" x="0" y="0" width="960" height="788"/>
<g><text class="cap" x="40" y="22">сколько мы платим во времени: время получения всех 6000 байт, круг 10 мс</text></g>
<g class="a e1"><text class="sm tk" x="40" y="54">без стратегии</text><text class="ix mu r" x="920" y="54">5 сегментов</text><rect class="bxo" x="40" y="62" width="39.1" height="26" rx="0"/><text class="mk" x="89.1" y="81">10,5 мс</text></g>
<g class="a e2"><text class="sm tk" x="40" y="116">зажим окна, wssize:wsize=1:scale=6</text><text class="ix mu r" x="920" y="116">40 сегментов</text><rect class="bxb" x="40" y="124" width="198.3" height="26" rx="0"/><text class="mk" x="248.3" y="143">53,2 мс</text><text class="ml" x="338.3" y="143">× 5</text></g>
<g class="a e3"><text class="sm tk" x="40" y="178">то же, forced_cutoff=no</text><text class="ix mu r" x="920" y="178">43 сегмента</text><rect class="bxr" x="40" y="186" width="560" height="26" rx="0"/><text class="mk" x="610" y="205">150,2 мс</text><text class="ml" x="700" y="205">× 14</text></g>
<g class="a e4"><text class="ix mu" x="40" y="230">53,2 / 10,5 ≈ 5,07 · 150,2 / 10,5 ≈ 14,3</text></g>
<g class="a e5"><text class="sm tk" x="40" y="266">принудительное отключение no: окно правится у каждого пакета, который отдали программе</text></g>
<g class="a e6"><text class="cap" x="40" y="292">пакеты клиента по порядку</text></g>
<g class="a e7"><rect class="bxb" x="40" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="60" y="320">S</text><rect class="bxb" x="80" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="100" y="320">A</text><rect class="bxb" x="120" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="140" y="320">PA</text><rect class="bxb" x="160" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="180" y="320">A</text><rect class="bxb" x="200" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="220" y="320">A</text><rect class="bxb" x="240" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="260" y="320">A</text><rect class="bxb" x="280" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="300" y="320">A</text><rect class="bxb" x="320" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="340" y="320">A</text><rect class="bxb" x="360" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="380" y="320">A</text><rect class="bxb" x="400" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="420" y="320">A</text><rect class="bxb" x="440" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="460" y="320">A</text><rect class="bxb" x="480" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="500" y="320">A</text><rect class="bxa" x="520" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="540" y="320">A</text><rect class="bxa" x="560" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="580" y="320">A</text><rect class="bxa" x="600" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="620" y="320">A</text><rect class="bx" x="640" y="300" width="40" height="30" rx="0"/><text class="ix tk c" x="660" y="320">…</text></g>
<g class="a e8"><path class="lb" d="M40 338L520 338"/><text class="sm tk amb" x="40" y="358">окно 1: ровно 12 пакетов клиента</text><text class="sm tk" x="532" y="358">дальше окно 63</text></g>
<g class="a e9"><text class="sm mu" x="40" y="378">правило очереди в нашей лаборатории: к программе идут только первые 12 пакетов клиента</text><text class="sm mu" x="40" y="398">так было в выпуске про командную строку</text></g>
<g class="a e10"><text class="cap" x="40" y="426">куски ответа сервера</text></g>
<g class="a e11"><rect class="bxr" x="40" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="49.4" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="58.8" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="68.2" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="77.5" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="86.9" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="96.3" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="105.7" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="115.1" y="434" width="9.4" height="30" rx="0"/><rect class="bxa" x="124.5" y="434" width="9.4" height="30" rx="0"/><rect class="bxs" x="133.9" y="434" width="786.1" height="30" rx="0"/><text class="ix tk c" x="526.9" y="454">ещё 33 сегмента: 192, 128, … 560</text></g>
<g class="a e12"><text class="sm tk" x="40" y="486">первые десять кусков по 64 байта, каждый своим кругом; всего 43 сегмента</text></g>
<g class="a e13"><rect class="bxs" x="40" y="508" width="880" height="78" rx="8"/><text class="cap" x="54" y="530">руководство, не измерение</text><text class="m fg" x="54" y="552">«It reduces speed in any case» · «catastrophic drop in speed»</text><text class="sm mu" x="54" y="574">мы мерили только на круге 10 мс; что это значит для живого канала, не знаем</text></g>
<g class="a e14"><rect class="bx" x="40" y="602" width="880" height="170" rx="8"/><text class="cap" x="54" y="626">проверь себя</text><text class="sm tk" x="54" y="650">wssize:wsize=1 без scale: множитель остался 10. Окно после приветствия такое же узкое?</text></g>
<g class="a e15 tr"><rect class="bxd" x="54" y="662" width="96" height="26" rx="6"/><text class="mk c" x="102" y="680">?</text></g>
