<svg xmlns="http://www.w3.org/2000/svg" class="v09-s17-time-forced-cutoff-and-check" viewBox="0 0 960 788" width="960" height="788" role="img" aria-labelledby="v09-s17-time-forced-cutoff-and-check-t v09-s17-time-forced-cutoff-and-check-d">
<title id="v09-s17-time-forced-cutoff-and-check-t">Время ответа и отключение no</title>
<desc id="v09-s17-time-forced-cutoff-and-check-d">Ответ сервера в нашем тесте занимает 10,5 мс без стратегии, 53,2 мс при зажиме окна у клиента, примерно в пять раз дольше, и 150,2 мс при принудительном отключении со значением no, примерно в четырнадцать раз дольше, потому что правило очереди в нашей лаборатории пропускает к программе только первые двенадцать пакетов клиента, они несут окно 1, а первые десять кусков ответа по 64 байта идут по одному за круг, а при окне 1 без множителя множитель остаётся 10 и весь ответ приходит за 32,6 мс кусками 512, 512, 1448, 88, 1024, 1448, 88 и 880 байт.</desc>
