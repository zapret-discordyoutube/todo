<svg xmlns="http://www.w3.org/2000/svg" class="v02-s09-ten-packets" viewBox="0 0 960 478" width="960" height="478" role="img" aria-labelledby="v02-s09-ten-packets-t v02-s09-ten-packets-d">
<title id="v02-s09-ten-packets-t">Десять пакетов соединения</title>
<desc id="v02-s09-ten-packets-d">Десять пакетов соединения по записи в лаборатории с относительными номерами: запрос клиента в 250 байт (номера 1–250) подтверждён сервером номером 251, ответ сервера в 14 байт подтверждён номером 15, а флаги FIN, тоже занимающие по одному номеру, закрываются подтверждениями 252 и 16; правило: номер подтверждения равен последнему полученному байту плюс один.</desc>
