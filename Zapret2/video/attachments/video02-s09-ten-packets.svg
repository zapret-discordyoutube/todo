ackets-k20}@keyframes v02-s09-ten-packets-k21{0.0%{opacity:0}49.474%{opacity:0}50.658%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s09-ten-packets .e21{animation-name:v02-s09-ten-packets-k21}@keyframes v02-s09-ten-packets-k22{0.0%{opacity:0}49.737%{opacity:0}50.395%{opacity:1}54.474%{opacity:1}55.132%{opacity:0}100%{opacity:0}}.v02-s09-ten-packets .e22{animation-name:v02-s09-ten-packets-k22}@keyframes v02-s09-ten-packets-k23{0.0%{opacity:0}56.579%{opacity:0}57.763%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s09-ten-packets .e23{animation-name:v02-s09-ten-packets-k23}</style>
