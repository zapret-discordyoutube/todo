<svg xmlns="http://www.w3.org/2000/svg" class="v00-s11-c-and-lua" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="v00-s11-c-and-lua-t v00-s11-c-and-lua-d">
<title id="v00-s11-c-and-lua-t">Что делает Си-часть и что делает Lua</title>
<desc id="v00-s11-c-and-lua-d">Двигатель быстрый и устроен один раз, а рецепты меняют часто, и так же делится программа: Си-часть перехватывает пакеты, разбирает их, помнит соединения, ведёт профили и списки имён, отправляет свои пакеты и следит за безопасностью, но сама не воздействует на трафик, а шесть файлов на Lua хранят помощников, сами стратегии, автоматику, обфускацию, запись пакетов и самопроверку, и программа вместе с этими файлами должна быть из одного релиза.</desc>
<style>.v00-s11-c-and-lua{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
