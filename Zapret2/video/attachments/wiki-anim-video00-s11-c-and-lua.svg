<rect class="bg" x="0" y="0" width="960" height="728"/>
<g><text class="cap" x="24" y="24">Си-часть берёт и отправляет пакеты, Lua решает, что с ними делать</text></g>
<g class="a e1"><rect class="bxb" x="24" y="36" width="180" height="26" rx="13.0"/><text class="sm c" x="114" y="54">выдуманный пример</text></g>
<g class="a e2"><rect class="bx" x="24" y="72" width="440" height="52" rx="8"/><text class="sm tk" x="40" y="94">двигатель</text><text class="sm" x="40" y="114">быстрый, устроен один раз</text></g>
<g class="a e3"><rect class="bx" x="496" y="72" width="440" height="52" rx="8"/><text class="sm tk" x="512" y="94">рецепты</text><text class="sm" x="512" y="114">меняют часто, каждый может написать свой</text></g>
<g class="a e4"><rect class="bxa" x="24" y="140" width="450" height="32" rx="8"/><text class="tk" x="40" y="162">Си-часть программы (движок)</text></g>
<g class="a e5"><rect class="bxo" x="494" y="140" width="442" height="32" rx="8"/><text class="tk" x="510" y="162">Lua</text></g>
<g class="a e6 tr"><rect class="bxd" x="494" y="182" width="442" height="120" rx="8"/><text class="sm mu c" x="715" y="248">пока пусто</text></g>
<g class="a e7"><rect class="bx" x="24" y="182" width="450" height="88" rx="8"/><text class="sm tk" x="40" y="206">1. приём пакета</text><text class="sm" x="40" y="228">перехватить · разобрать · запомнить соединение ·</text><text class="sm" x="40" y="249">узнать тип содержимого</text></g>
<g class="a e8"><rect class="bx" x="24" y="280" width="450" height="88" rx="8"/><text class="sm tk" x="40" y="304">2. сложные случаи</text><text class="sm" x="40" y="326">держать составные сообщения и проигрывать заново</text><text class="sm" x="40" y="347">· выбирать профиль и сверять списки имён</text></g>
<g class="a e9"><rect class="bx" x="24" y="378" width="450" height="109" rx="8"/><text class="sm tk" x="40" y="402">3. служебное</text><text class="sm" x="40" y="424">отправлять свои пакеты · хранить блобы, то есть</text><text class="sm" x="40" y="445">готовые двоичные заготовки, например поддельный</text><text class="sm" x="40" y="466">пакет · мост к Lua · таймеры · безопасность</text></g>
<g class="a e10"><rect class="bx" x="24" y="501" width="450" height="86" rx="8"/></g>
<g class="a e11"><rect class="bxa" x="36" y="511" width="163" height="24" rx="12.0"/><text class="sm tk c" x="117.5" y="528">ДОКУМЕНТАЦИЯ</text></g>
<g class="a e12"><text class="sm" x="40" y="557">«там нет никаких возможностей собственно для</text><text class="sm" x="40" y="578">воздействия на трафик»</text></g>
<g class="a e13"><rect class="bxo" x="24" y="599" width="450" height="34" rx="8"/><text class="sm tk" x="40" y="621">файл стратегии не может запускать программы</text></g>
<g class="a e14"><text class="sm tk" x="494" y="200">скрипты запуска загружают всегда:</text></g>
<g class="a e15"><text class="sm tk" x="494" y="392">нужны не всегда:</text></g>
<g class="a e16"><rect class="bxo" x="494" y="210" width="442" height="46" rx="6"/><text class="mk" x="508" y="230">zapret-lib.lua</text><text class="sm" x="508" y="248">библиотека помощников</text><text class="sm mu r" x="922" y="248">2739 строк</text></g>
<g class="a e17"><rect class="bxo" x="494" y="262" width="442" height="46" rx="6"/><text class="mk" x="508" y="282">zapret-antidpi.lua</text><text class="sm" x="508" y="300">библиотека стратегий: их 25</text><text class="sm mu r" x="922" y="300">1250 строк</text></g>
<g class="a e18"><rect class="bxo" x="494" y="314" width="442" height="46" rx="6"/><text class="mk" x="508" y="334">zapret-auto.lua</text><text class="sm" x="508" y="352">автоматика</text><text class="sm mu r" x="922" y="352">577 строк</text></g>
<g class="a e19"><rect class="bx" x="494" y="404" width="442" height="46" rx="6"/><text class="mk" x="508" y="424">zapret-obfs.lua</text><text class="sm" x="508" y="442">обфускация, маскировка протокола</text><text class="sm mu r" x="922" y="442">487 строк</text></g>
<g class="a e20"><rect class="bx" x="494" y="456" width="442" height="46" rx="6"/><text class="mk" x="508" y="476">zapret-pcap.lua</text><text class="sm" x="508" y="494">запись пакетов в файл</text><text class="sm mu r" x="922" y="494">40 строк</text></g>
<g class="a e21"><rect class="bx" x="494" y="508" width="442" height="46" rx="6"/><text class="mk" x="508" y="528">zapret-tests.lua</text><text class="sm" x="508" y="546">самопроверка</text><text class="sm mu r" x="922" y="546">1157 строк</text></g>
<g class="a e22"><rect class="bxb" x="494" y="568" width="442" height="50" rx="8"/><text class="sm tk" x="508" y="589">Lua-файлы и программа должны быть</text><text class="sm" x="508" y="609">из одного релиза, иначе Lua выдаст ошибку</text></g>
<g class="a e23"><rect class="bx" x="24" y="651" width="912" height="62" rx="8"/><text class="sm tk" x="40" y="675">стратегия это функция, которую вызывают по имени</text><text class="sm" x="40" y="697">новая стратегия: правка Lua-файла и перезапуск, программу пересобирать не нужно</text></g>
</svg>
