<svg xmlns="http://www.w3.org/2000/svg" class="video06-s04-five-parts" viewBox="0 0 960 666" width="960" height="666" role="img" aria-labelledby="video06-s04-five-parts-t video06-s04-five-parts-d">
<title id="video06-s04-five-parts-t">Пять кусков и порядок отправки</title>
<desc id="video06-s04-five-parts-d">Метки 2, host, midsld и endhost дают смещения 2, 97, 104 и 112, то есть четыре разреза и пять кусков по 2, 95, 7, 8 и 138 байт с суммой 250, на проводе куски уходят с конца в порядке 138, 8, 7, 95, 2 с номерами 113–250, 105–112, 98–104, 3–97 и 1–2, кусок на 7 байт начинается с www.exa, кусок на 8 байт с mple.com, а расчёт на бумаге для меток host и endhost даёт куски 97, 15 и 138 байт, где кусок в 15 байт это имя целиком.</desc>
