<svg xmlns="http://www.w3.org/2000/svg" class="v00-s07-two-runs" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="v00-s07-two-runs-t v00-s07-two-runs-d">
<title id="v00-s07-two-runs-t">Один пакет без программы и два пакета с программой: получатель тот же</title>
<desc id="v00-s07-two-runs-d">В нашем тесте без программы клиент отправил запрос одним пакетом с 250 байтами данных, на проводе это 316 байт (Ethernet 14, IP 20, TCP 32 и данные 250), и сервер получил ровно 250 байт; а с программой и стратегией multisplit с разрезом midsld клиент отправил два пакета, в 104 и 146 байт, на тот же адрес и тот же порт сервера, первый пакет кончается внутри имени сайта, второй начинается с его продолжения, сервер собрал те же 250 байт, и изменилась только нарезка.</desc>
