<svg xmlns="http://www.w3.org/2000/svg" class="v00-s14-ttl-trap" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="v00-s14-ttl-trap-t v00-s14-ttl-trap-d">
<title id="v00-s14-ttl-trap-t">Ловушка обманки на настоящих кусках</title>
<desc id="v00-s14-ttl-trap-d">Одна и та же обманка, короткое время жизни пакета, в двух местах даёт разный результат: на поддельном пакете она умирает на роутере и сервер получает честные 250 байт, на настоящих кусках стратегии multisplit умирают они сами и сервер получает ноль байт, а подделка вообще без обманок доходит до программы сервера и та принимает 680 байт за свои данные.</desc>
