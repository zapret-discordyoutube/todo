<g class="a e16"><rect class="bxd" x="24" y="448" width="296" height="100" rx="8"/><text class="sm tk" x="38" y="472">пример выдуманный: открытка</text><text class="sm" x="38" y="494">«довезти только до первого узла»:</text><text class="sm" x="38" y="514">на первом узле её увидят,</text><text class="sm" x="38" y="534">а адресат уже нет</text></g>
