<g class="a e4"><rect class="bxr" x="38" y="226" width="46" height="26" rx="5"/><text class="lgk c" x="61" y="244">680</text><text class="sm" x="96" y="241">подделка: умирает</text><text class="sm" x="96" y="260">на роутере, он отвечает</text><text class="sm" x="96" y="279">«время вышло»</text></g>
