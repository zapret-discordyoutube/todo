<rect class="bg" x="0" y="0" width="960" height="570"/>
<g><text class="cap" x="24" y="24">одна обманка, два места: короткое время жизни</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bx" x="24" y="66" width="296" height="366" rx="8"/><text class="sm tk" x="38" y="94">1. обманка на подделке</text><rect class="bxo" x="38" y="106" width="218" height="26" rx="5"/><text class="lgk" x="45" y="124">fake:blob=fake_default_tls</text><rect class="bxb" x="38" y="138" width="84" height="26" rx="5"/><text class="lgk" x="45" y="156">:ip_ttl=1</text></g>
