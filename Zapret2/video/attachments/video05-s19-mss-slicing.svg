<rect class="bg" x="0" y="0" width="960" height="740"/>
<g><text class="cap" x="40" y="24">накладка в 1400 байт: часть длиннее коробки, отправка режет её</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="880" height="98" rx="6"/><text class="sm tk" x="52" y="56">сколько данных помещается в один пакет</text><text class="mk" x="52" y="80">MSS 1460 (объявили оба конца) − 12 байт опций = 1448</text><text class="ix mu" x="52" y="102">код берёт меньший MSS из двух SYN, иначе 1220 (desync.c:1021-1030, params.h:46)</text><text class="ix mu" x="52" y="122">max_data = mss − extra_len (zapret-lib.lua:1243)</text></g>
<g class="a e2"><text class="cap" x="40" y="158">первая часть вместе с подкладкой: 1400 + 104 = 1504 байта, это больше 1448</text></g>
<g class="a e3"><rect class="bxb" x="40" y="168" width="819.1" height="32" rx="0"/><text class="sm c" x="449.6" y="189">подкладка 1400</text><rect class="bxa" x="859.1" y="168" width="60.9" height="32" rx="0"/></g>
<g class="a e4"><text class="sm r" x="920" y="220">настоящие 104</text></g>
<g class="a e5"><path class="lr" d="M887.2 160L887.2 210"/></g>
<g class="a e6"><text class="sm rej r" x="879.2" y="242">разрез на отметке 1448</text></g>
<g class="a e7"><text class="cap" x="40" y="272">отправка режет часть на два куска</text></g>
<g class="a e8"><rect class="bxa" x="40" y="282" width="560" height="60" rx="6"/><text class="sm tk" x="52" y="304">кусок 1: 1448 байт</text><text class="sm" x="52" y="326">1400 подкладки + 48 настоящих</text><rect class="bxo" x="620" y="282" width="300" height="60" rx="6"/><text class="sm tk" x="632" y="304">кусок 2: 56 настоящих</text><text class="sm" x="632" y="326">48 + 56 = 104, вся часть</text></g>
<g class="a e9"><text class="ix mu r" x="920" y="272">нарезка: zapret-lib.lua:1246-1273</text></g>
<g class="a e10"><text class="cap" x="40" y="372">в нашем тесте: клиент, сервер и приложение</text><text class="ix mu r" x="920" y="372">размеры в журнале 1500 и 108</text></g>
<g class="a e11"><rect class="bxa" x="40" y="384" width="880" height="34" rx="5"/><text class="mk" x="52" y="407">пакет 1: −1399, длина 1448</text><text class="sm" x="400" y="407">сервер ждёт 49</text><text class="sm tk" x="700" y="407">чтение 48</text></g>
<g class="a e12"><rect class="bxa" x="40" y="424" width="880" height="34" rx="5"/><text class="mk" x="52" y="447">пакет 2: 49, длина 56</text><text class="sm" x="400" y="447">сервер ждёт 105</text><text class="sm tk" x="700" y="447">чтение 56</text></g>
<g class="a e13"><rect class="bxo" x="40" y="464" width="880" height="34" rx="5"/><text class="mk" x="52" y="487">пакет 3: 105, длина 146</text><text class="sm" x="400" y="487">вторая часть, как раньше</text><text class="sm tk" x="700" y="487">чтение 146</text></g>
<g class="a e14"><text class="sm tk" x="40" y="526">приложение прочитало 48, 56 и 146 = 250 байт, содержимое совпало с оригиналом</text></g>
<g class="a e15"><text class="sm" x="40" y="548">куски у приложения повторяют нарезку, а не части</text><text class="sm mu" x="40" y="568">границы чтений зависят от скорости приложения; так вышло в нашем тесте</text></g>
<g class="a e16"><rect class="bxd" x="40" y="588" width="880" height="130" rx="6"/><text class="sm tk" x="52" y="612">проверь себя: узор из трёх байт 01 02 03, накладка 7. Какие семь байт подложены?</text></g>
<g class="a e17"><rect class="bxa" x="52" y="628" width="52" height="32" rx="0"/><text class="ix c fg tk" x="78" y="649">01</text><rect class="bxo" x="108" y="628" width="52" height="32" rx="0"/><text class="ix c fg tk" x="134" y="649">02</text><rect class="bxb" x="164" y="628" width="52" height="32" rx="0"/><text class="ix c fg tk" x="190" y="649">03</text><rect class="bxa" x="220" y="628" width="52" height="32" rx="0"/><text class="ix c fg tk" x="246" y="649">01</text><rect class="bxo" x="276" y="628" width="52" height="32" rx="0"/><text class="ix c fg tk" x="302" y="649">02</text><rect class="bxb" x="332" y="628" width="52" height="32" rx="0"/><text class="ix c fg tk" x="358" y="649">03</text><rect class="bxa" x="388" y="628" width="52" height="32" rx="0"/><text class="ix c fg tk" x="414" y="649">01</text></g>
<g class="a e18"><text class="sm" x="52" y="684">узор повторяется и обрезается ровно по длине, как рулон обоев</text><text class="sm mu" x="52" y="706">счёт по коду и прогону pattern; с таким узором опыт не запускали</text></g>
