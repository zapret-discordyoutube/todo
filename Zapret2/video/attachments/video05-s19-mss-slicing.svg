<svg xmlns="http://www.w3.org/2000/svg" class="v05-s19-mss-slicing" viewBox="0 0 960 740" width="960" height="740" role="img" aria-labelledby="v05-s19-mss-slicing-t v05-s19-mss-slicing-d">
<title id="v05-s19-mss-slicing-t">Нарезка части по размеру сегмента</title>
<desc id="v05-s19-mss-slicing-d">Нарезка части по размеру пакета: в рукопожатии оба конца объявили размер сегмента 1460, код берёт меньший из двух, опции съедают 12 байт, остаётся 1448 байт данных (lua/zapret-lib.lua:1243), поэтому при накладке в 1400 байт первая часть вместе с подкладкой 1400 + 104 = 1504 байта не помещается и отправка режет её на два куска (lua/zapret-lib.lua:1246-1273): первый кусок 1448 байт, это 1400 байт подкладки и 48 настоящих, второй 56 настоящих; в нашем тесте номера и длины такие: -1399 и 1448, затем 49 и 56, затем вторая часть как раньше 105 и 146, сервер ждёт сначала 49, потом 105, а приложение читает 48, 56 и 146 байт, то есть те же 250 байт оригинала, куски у приложения следуют за нарезкой, а не за частями; внизу проверка на бумаге: узор 01 02 03 и накладка 7 дают байты 01 02 03 01 02 03 01, с таким узором опыт не запускали.</desc>
<style>.v05-s19-mss-slicing{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
