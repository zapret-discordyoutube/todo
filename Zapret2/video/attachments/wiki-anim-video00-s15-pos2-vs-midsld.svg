<title id="v00-s15-pos2-vs-midsld-t">Разрез внутри имени и вне имени</title>
<desc id="v00-s15-pos2-vs-midsld-d">Игрушечный инспектор нашей лаборатории, не настоящее оборудование, ищет имя сайта целиком в каждом пакете отдельно, и в нашем тесте blockcheck2 показал, что разрезы внутри имени, midsld и host плюс один, он пропустил, а разрезы вне имени, число 2 и method плюс 2, нет, потому что имя осталось целым в одном из кусков; это факт про нашу игрушку, а не про настоящие системы.</desc>
