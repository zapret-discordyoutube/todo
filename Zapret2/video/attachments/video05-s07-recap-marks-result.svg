<title id="v05-s07-recap-marks-result-t">Повтор: от метки до двух пакетов</title>
<desc id="v05-s07-recap-marks-result-d">Повтор перед циклом на нашем приветствии в 250 байт: засечки считаются с нуля, host на 97, sld на 101, midsld на 104 и endhost на 112, список pos=midsld в Си даёт 104, в Lua 105, после вычёркивания единицы остаётся одно число 105, и на проводе приветствие уходит двумя пакетами по 104 и 146 байт с порядковыми номерами 1 и 105, а исходный пакет в 250 байт выбрасывается.</desc>
