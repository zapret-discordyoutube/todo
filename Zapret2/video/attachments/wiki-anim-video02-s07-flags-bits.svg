<rect class="bg" x="0" y="0" width="960" height="492"/>
<g class="a e1"><text class="cap" x="10" y="24">байт флагов в нашем пакете: 0x18</text></g>
<g class="a e2"><rect class="bx" x="10" y="38" width="104" height="36" rx="6"/><text class="tk c" x="62.0" y="62">CWR</text><text class="m mu c" x="62.0" y="96">0x80</text><rect class="bx" x="122" y="38" width="104" height="36" rx="6"/><text class="tk c" x="174.0" y="62">ECE</text><text class="m mu c" x="174.0" y="96">0x40</text><rect class="bx" x="234" y="38" width="104" height="36" rx="6"/><text class="tk c" x="286.0" y="62">URG</text><text class="m mu c" x="286.0" y="96">0x20</text><rect class="bx" x="346" y="38" width="104" height="36" rx="6"/><text class="tk c" x="398.0" y="62">ACK</text><text class="m mu c" x="398.0" y="96">0x10</text><rect class="bx" x="458" y="38" width="104" height="36" rx="6"/><text class="tk c" x="510.0" y="62">PSH</text><text class="m mu c" x="510.0" y="96">0x08</text><rect class="bx" x="570" y="38" width="104" height="36" rx="6"/><text class="tk c" x="622.0" y="62">RST</text><text class="m mu c" x="622.0" y="96">0x04</text><rect class="bx" x="682" y="38" width="104" height="36" rx="6"/><text class="tk c" x="734.0" y="62">SYN</text><text class="m mu c" x="734.0" y="96">0x02</text><rect class="bx" x="794" y="38" width="104" height="36" rx="6"/><text class="tk c" x="846.0" y="62">FIN</text><text class="m mu c" x="846.0" y="96">0x01</text></g>
<g class="a e3"><rect class="bx" x="10" y="106" width="104" height="40" rx="6"/><text class="ml c mu" x="62.0" y="133">0</text><rect class="bx" x="122" y="106" width="104" height="40" rx="6"/><text class="ml c mu" x="174.0" y="133">0</text><rect class="bx" x="234" y="106" width="104" height="40" rx="6"/><text class="ml c mu" x="286.0" y="133">0</text><rect class="bxa" x="346" y="106" width="104" height="40" rx="6"/><text class="ml c acc" x="398.0" y="133">1</text><rect class="bxa" x="458" y="106" width="104" height="40" rx="6"/><text class="ml c acc" x="510.0" y="133">1</text><rect class="bx" x="570" y="106" width="104" height="40" rx="6"/><text class="ml c mu" x="622.0" y="133">0</text><rect class="bx" x="682" y="106" width="104" height="40" rx="6"/><text class="ml c mu" x="734.0" y="133">0</text><rect class="bx" x="794" y="106" width="104" height="40" rx="6"/><text class="ml c mu" x="846.0" y="133">0</text></g>
<g class="a e4"><text class="ml c" x="480" y="176">0x10 (ACK) + 0x08 (PSH) = 0x18 = 0001 1000</text></g>
<g class="a e5 tr"><rect class="bxn" x="343" y="34" width="222" height="116" rx="8"/></g>
<g class="a e6"><text class="cap" x="10" y="214">что означает каждый бит</text></g>
<g class="a e7"><rect class="bxa" x="10" y="224" width="70" height="28" rx="6"/><text class="mk c" x="45.0" y="244">ACK</text><text class="sm" x="94" y="244">в пакете есть верный номер подтверждения</text></g>
<g class="a e8"><rect class="bxa" x="10" y="260" width="70" height="28" rx="6"/><text class="mk c" x="45.0" y="280">PSH</text><text class="sm" x="94" y="280">передай данные программе сразу, не жди, пока накопится больше</text></g>
<g class="a e9"><rect class="bx" x="10" y="296" width="70" height="28" rx="6"/><text class="mk c" x="45.0" y="316">SYN</text><text class="sm" x="94" y="316">начинает соединение</text></g>
<g class="a e10"><rect class="bx" x="10" y="332" width="70" height="28" rx="6"/><text class="mk c" x="45.0" y="352">FIN</text><text class="sm" x="94" y="352">завершает соединение</text></g>
<g class="a e11"><rect class="bxr" x="10" y="368" width="70" height="28" rx="6"/><text class="mk c" x="45.0" y="388">RST</text><text class="sm" x="94" y="388">обрывает соединение резко: этот бит запомним, его использует игрушечный инспектор</text></g>
<g class="a e12"><rect class="bx" x="10" y="404" width="150" height="28" rx="6"/><text class="mk c" x="85.0" y="424">CWR ECE URG</text><text class="sm mu" x="174" y="424">остальные три бита нас пока не интересуют</text></g>
<g class="a e13"><rect class="bxb" x="10" y="446" width="940" height="34" rx="8"/><text class="tk" x="24" y="469">В нашем пакете включены ACK и PSH: обычный пакет с данными посреди разговора.</text></g>
</svg>
