<svg xmlns="http://www.w3.org/2000/svg" class="v02-s07-flags-bits" viewBox="0 0 960 492" width="960" height="492" role="img" aria-labelledby="v02-s07-flags-bits-t v02-s07-flags-bits-d">
<title id="v02-s07-flags-bits-t">Байт флагов TCP</title>
<desc id="v02-s07-flags-bits-d">Байт флагов TCP равен 0x18, то есть 0001 1000: из восьми битов CWR, ECE, URG, ACK, PSH, RST, SYN, FIN включены ACK (0x10) и PSH (0x08); ACK означает, что в пакете есть номер подтверждения, PSH просит передать данные программе сразу, SYN начинает соединение, FIN завершает, а RST обрывает его резко.</desc>
<style>.v02-s07-flags-bits{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s07-flags-bits{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v02-s07-flags-bits .bg{fill:var(--bg)}
.v02-s07-flags-bits text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v02-s07-flags-bits .tk{font-weight:600;fill:var(--fg)}
.v02-s07-flags-bits .sm{font-size:14.5px}
.v02-s07-flags-bits .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v02-s07-flags-bits .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v02-s07-flags-bits .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v02-s07-flags-bits .mt{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px}
.v02-s07-flags-bits .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s07-flags-bits .mu{fill:var(--mute)}.v02-s07-flags-bits .fg{fill:var(--fg)}.v02-s07-flags-bits .acc{fill:var(--acc)}.v02-s07-flags-bits .rej{fill:var(--rej)}.v02-s07-flags-bits .ok{fill:var(--ok)}.v02-s07-flags-bits .amb{fill:var(--amb)}
.v02-s07-flags-bits .hb{fill:var(--acc);font-weight:700}.v02-s07-flags-bits .hbr{fill:var(--rej);font-weight:700}.v02-s07-flags-bits .hbo{fill:var(--ok);font-weight:700}.v02-s07-flags-bits .hbb{fill:var(--amb);font-weight:700}
.v02-s07-flags-bits .c{text-anchor:middle}.v02-s07-flags-bits .r{text-anchor:end}
.v02-s07-flags-bits .nos{stroke:none}
.v02-s07-flags-bits .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s07-flags-bits .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v02-s07-flags-bits .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v02-s07-flags-bits .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v02-s07-flags-bits .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v02-s07-flags-bits .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v02-s07-flags-bits .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v02-s07-flags-bits .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v02-s07-flags-bits .fa{fill:var(--acc);stroke:none}
.v02-s07-flags-bits .fo{fill:var(--ok);stroke:none}
.v02-s07-flags-bits .fr{fill:var(--rej);stroke:none}
.v02-s07-flags-bits .fm{fill:var(--line);stroke:none}
.v02-s07-flags-bits .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s07-flags-bits .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s07-flags-bits .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s07-flags-bits .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s07-flags-bits .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s07-flags-bits .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s07-flags-bits .hf{fill:var(--fg2)}.v02-s07-flags-bits .ha{fill:var(--acc)}.v02-s07-flags-bits .hr{fill:var(--rej)}.v02-s07-flags-bits .hm{fill:var(--mute)}.v02-s07-flags-bits .ho{fill:var(--ok)}
.v02-s07-flags-bits .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v02-s07-flags-bits .a{animation-duration:32s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s07-flags-bits .a{animation:none}.v02-s07-flags-bits .tr{display:none}}
