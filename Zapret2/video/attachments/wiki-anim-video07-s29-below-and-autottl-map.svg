<g><text class="cap" x="40" y="26">ниже apply_fooling: пересборка, испорченная сумма, отметка</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="880" height="174" rx="6"/><text class="tk sm" x="54" y="68">пересборка копии на Си</text><text class="mn mu" x="300" y="68">nfq2/lua.c:2171-2248</text><text class="sm" x="54" y="90">пересчитывает длины и суммы, пишет опции: не больше 40 байт, потом нули до кратного 4</text></g>
<g class="a e2"><rect class="bxs" x="54" y="132" width="24" height="30" rx="2"/><text class="ix c" x="66" y="152">NN</text><rect class="bxs" x="78" y="132" width="312" height="30" rx="2"/><text class="sm c" x="234" y="152">SACK, 3 блока</text><rect class="bxa" x="390" y="132" width="120" height="30" rx="2"/><text class="sm c" x="450" y="152">время</text><rect class="bxb" x="510" y="132" width="216" height="30" rx="2"/><text class="sm c" x="618" y="152">MD5</text><rect class="fr" x="534" y="132" width="192" height="30"/><path class="lcut" d="M534 124L534 170"/><text class="sm rej" x="542" y="186">предел 40 байт</text><text class="mk" x="54" y="186">2 + 26 + 10 + 18 = 56 байт</text><text class="mk rej" x="740" y="152">56 &gt; 40</text></g>
<g class="a e3"><text class="sm" x="54" y="208">прогон функций: reconstruct_dissect: bad tcp, затем Lua: invalid dissect data; стратегия не работает</text></g>
<g class="a e4"><text class="sm mu" x="54" y="114">SACK по общим сведениям: получатель сообщает о принятых кусках</text></g>
<g class="a e5"><rect class="bx" x="40" y="234" width="880" height="88" rx="6"/><text class="tk sm" x="54" y="258">badsum</text><text class="mn mu" x="130" y="258">nfq2/lua.c:2612</text><text class="mn" x="54" y="284">if (badsum) tcp-&gt;th_sum ^= 1 + (random() % 0xFFFF);</text><text class="sm" x="54" y="308">сумма уже посчитана верно, маска от 1 до 65535, не нуль: испорченная сумма не станет верной случайно</text></g>
<g class="a e6"><rect class="bx" x="40" y="338" width="880" height="88" rx="6"/><text class="tk sm" x="54" y="362">отметка программы</text><text class="mn mu" x="250" y="362">nfq2/lua.c:2943, 2960</text><text class="mn" x="54" y="388">в журнале: rawsend_dissect repeats=1 size=752 badsum=0 ifout=c0 fwmark=40000000</text><text class="sm" x="54" y="412">правило берёт из очереди только пакеты без отметки, поэтому свои пакеты программа заново не получает</text></g>
<g class="a e7"><text class="cap" x="40" y="450">автоподбор срока жизни: карта, разбор был раньше</text></g>
<g class="a e8"><rect class="bxs" x="40" y="462" width="150" height="32" rx="5"/><text class="sm c" x="115" y="483">входящий 62</text><rect class="bxs" x="206" y="462" width="140" height="32" rx="5"/><text class="sm c" x="276" y="483">начало 64</text><path class="lf" d="M192 478L194 478"/><polygon class="hf" points="204,478 194,483 194,473"/><rect class="bxs" x="362" y="462" width="150" height="32" rx="5"/><text class="sm c" x="437" y="483">переходов 2</text><path class="lf" d="M348 478L350 478"/><polygon class="hf" points="360,478 350,483 350,473"/><rect class="bxs" x="528" y="462" width="250" height="32" rx="5"/><text class="sm c" x="653" y="483">сдвиг 0, коридор 1-20</text><path class="lf" d="M514 478L516 478"/><polygon class="hf" points="526,478 516,483 516,473"/><rect class="bxo" x="794" y="462" width="100" height="32" rx="5"/><text class="sm c" x="844" y="483">срок 2</text><path class="lf" d="M780 478L782 478"/><polygon class="hf" points="792,478 782,483 782,473"/></g>
<g class="a e9"><text class="sm mu" x="40" y="516">в нашем тесте, два роутера: подделка умерла на втором, сервер получил чистые 250 байт</text></g>
<g class="a e10"><rect class="bx" x="40" y="536" width="288" height="102" rx="6"/><circle class="bxs" cx="62" cy="560" r="11"/><text class="mk c" x="62" y="565">1</text><text class="tk sm" x="84" y="565">входящий срок</text><text class="mn mu" x="52" y="588">nfq2/desync.c:1332-1343</text><text class="sm" x="52" y="610">записывает движок из первого</text><text class="sm" x="52" y="628">пакета от сервера</text></g>
<g class="a e11"><rect class="bx" x="336" y="536" width="288" height="102" rx="6"/><circle class="bxs" cx="358" cy="560" r="11"/><text class="mk c" x="358" y="565">2</text><text class="tk sm" x="380" y="565">угадыватель</text><text class="mn mu" x="348" y="588">lua/zapret-lib.lua:865-884</text><text class="sm" x="348" y="610">начальное 255, 128 или 64,</text><text class="sm" x="348" y="628">переходы: начальное − входящее</text></g>
<g class="a e12"><rect class="bx" x="632" y="536" width="288" height="102" rx="6"/><circle class="bxs" cx="654" cy="560" r="11"/><text class="mk c" x="654" y="565">3</text><text class="tk sm" x="676" y="565">вычислитель</text><text class="mn mu" x="644" y="588">lua/zapret-lib.lua:886-898</text><text class="sm" x="644" y="610">сдвиг и коридор;</text><text class="sm" x="644" y="628">правило знака даёт «пусто»</text></g>
