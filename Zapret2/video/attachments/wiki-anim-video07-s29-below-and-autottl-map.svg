<svg xmlns="http://www.w3.org/2000/svg" class="v07-s29-below-and-autottl-map" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="v07-s29-below-and-autottl-map-t v07-s29-below-and-autottl-map-d">
<title id="v07-s29-below-and-autottl-map-t">Что ниже применялки и карта автоподбора</title>
<desc id="v07-s29-below-and-autottl-map-d">Ниже функции apply_fooling функция на Си пересчитывает суммы и пишет опции не больше 40 байт, так что NOP NOP SACK с тремя блоками и время вместе с MD5 дают 56 байт и сборка отказывает, портит сумму маской от 1 до 65535 и ставит отметку 0x40000000, а карта автоподбора срока жизни ведёт от входящего срока 62 через начальное 64 и два перехода к сроку 2 по пяти частям кода desync.c и zapret-lib.lua, причём запасной ip_ttl берётся, если подбор не дал числа.</desc>
