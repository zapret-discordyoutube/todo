<svg xmlns="http://www.w3.org/2000/svg" class="v04-s15-runs-and-next" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="v04-s15-runs-and-next-t v04-s15-runs-and-next-d">
<title id="v04-s15-runs-and-next-t">Три запуска и что дальше</title>
<desc id="v04-s15-runs-and-next-d">Три настоящих запуска на приветствии в 250 байт. pos=midsld: в журнале 104, на проводе два пакета в 104 и 146 байт, имя разрезано посередине. Семь имён списком (host, sld, midsld, endsld, endhost, sniext, extlen): в журнале 86 92 97 101 104 108 112, на проводе восемь пакетов по 86, 6, 5, 4, 3, 4, 4 и 138 байт. pos=0: в журнале 0, следом «no valid split positions», разреза нет и уходит один пакет в 250 байт: журнал показывает прочитанное, провод показывает отправленное. Следующий выпуск про multisplit: что копируется из исходного пакета, как меняются номера, в каком порядке уходят части и какие промежутки между ними.</desc>
