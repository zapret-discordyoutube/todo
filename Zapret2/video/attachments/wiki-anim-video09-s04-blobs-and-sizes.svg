<svg xmlns="http://www.w3.org/2000/svg" class="video09-s04-blobs-and-sizes" viewBox="0 0 960 654" width="960" height="654" role="img" aria-labelledby="video09-s04-blobs-and-sizes-t video09-s04-blobs-and-sizes-d">
<title id="video09-s04-blobs-and-sizes-t">Что лежит в SYN</title>
<desc id="video09-s04-blobs-and-sizes-d">Размер SYN с данными зависит от блоба: шестнадцать нулей по умолчанию дают пакет IP в 76 байт, встроенная заготовка приветствия в 680 байт даёт 740, два байта дают 62, правка имени сайта делает блоб короче на 7 байт, то есть 673, а блоб с несуществующим именем даёт обычный SYN, и во всех опытах сервер получает те же 250 байт, а вместе с multisplit приложение читает 104 и 146 байт.</desc>
