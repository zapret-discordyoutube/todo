<g><text class="cap" x="40" y="24">что лежит в SYN: заготовки, размеры и результат</text></g>
<g class="a video09-s04-blobs-and-sizes-k1"><text class="cap" x="56" y="54">что просили</text><text class="cap r" x="400" y="54">байт</text><text class="cap r" x="500" y="54">IP всего</text><text class="cap" x="530" y="54">что видно</text><path class="lm" d="M40 62L920 62"/></g>
<g class="a video09-s04-blobs-and-sizes-k2"><text class="smk" x="56" y="97">по умолчанию: 16 нулей</text><text class="mk r" x="400" y="97">16</text><text class="mk r" x="500" y="97">76</text><text class="sm13" x="530" y="92">20 + 40 + 16 = 76</text><text class="sm13 mu" x="530" y="108">игрушка «первый решает»: чисто</text></g>
<g class="a video09-s04-blobs-and-sizes-k3"><text class="cdh" x="56" y="137">blob=fake_default_tls</text><text class="mk r" x="400" y="137">680</text><text class="mk r" x="500" y="137">740</text><text class="sm13" x="530" y="132">20 + 40 + 680 = 740; имя в байтах 125…141</text><text class="sm13 mu" x="530" y="148">игрушка: чисто (len 680)</text></g>
<g class="a video09-s04-blobs-and-sizes-k4"><text class="cdh" x="56" y="177">blob=0x1603</text><text class="mk r" x="400" y="177">2</text><text class="mk r" x="500" y="177">62</text><text class="sm13" x="530" y="172">20 + 40 + 2 = 62</text><text class="sm13 mu" x="530" y="188">сервер ведёт себя так же</text></g>
<g class="a video09-s04-blobs-and-sizes-k5"><text class="cdh" x="56" y="217">tls_mod=rnd,dupsid,sni=google.com</text><text class="mk r" x="400" y="217">673</text><text class="mk r" x="500" y="217">733</text><text class="sm13" x="530" y="212">680 − 7 = 673</text><text class="sm13 mu" x="530" y="228">имя на 7 байт короче, поля случайные</text></g>
<g class="a video09-s04-blobs-and-sizes-k6"><text class="cdh" x="56" y="257">tls_mod=dupsid</text><text class="mk r" x="400" y="257">680</text><text class="mk r" x="500" y="257">740</text><text class="sm13" x="530" y="252">dupsid ничего не сделал: байты равны заготовке</text><text class="sm13 mu" x="530" y="268">почему, объясним в сцене про код</text></g>
<g class="a video09-s04-blobs-and-sizes-k7"><rect class="fb" x="40" y="271" width="880" height="43"/><text class="cdh" x="56" y="297">blob=nosuchblob</text><text class="mk r" x="400" y="297">0</text><text class="mk r" x="500" y="297">60</text><text class="sm13" x="530" y="292">программа пишет «блоба нет» и пропускает</text><text class="sm13 mu" x="530" y="308">пакет: уходит обычный SYN без данных</text></g>
