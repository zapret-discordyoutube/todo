<g><text class="cap" x="40" y="26">игрушка проекта: первый принятый пакет с данными решает за всё соединение</text></g>
<g class="a e1"><rect class="bx" x="40" y="52" width="120" height="96" rx="8"/><text class="sm tk c" x="100" y="106">клиент</text></g>
<g class="a e2"><rect class="bx" x="800" y="52" width="120" height="96" rx="8"/><text class="sm tk c" x="860" y="106">сервер</text></g>
<g class="a e3"><rect class="bxs" x="250" y="40" width="460" height="120" rx="8"/><text class="sm tk" x="262" y="60">роутер 1</text></g>
<g class="a e4"><rect class="bxa" x="262" y="70" width="150" height="80" rx="6"/><text class="sm tk c" x="337" y="94">вход</text><text class="ix c" x="337" y="114">хук PREROUTING</text><text class="ix c" x="337" y="134">до проверки срока</text></g>
<g class="a e5"><rect class="bx" x="424" y="70" width="130" height="80" rx="6"/><text class="sm tk c" x="489" y="94">проверка</text><text class="sm c" x="489" y="114">срока жизни</text></g>
<g class="a e6"><rect class="bx" x="566" y="70" width="132" height="80" rx="6"/><text class="sm tk c" x="632" y="94">выход</text><text class="sm c" x="632" y="114">к серверу</text></g>
<g class="a e7"><path class="lf" d="M160 100L238 100"/><polygon class="hf" points="248,100 238,105 238,95"/><path class="lf" d="M712 100L788 100"/><polygon class="hf" points="798,100 788,105 788,95"/></g>
<g class="a e8"><path class="la" d="M337 152L337 172"/><rect class="bxa" x="262" y="172" width="436" height="52" rx="8"/><text class="sm tk" x="274" y="194">игрушка: вторая nfqws2 на очереди 201;</text><text class="sm" x="274" y="214">видит и пакеты со сроком жизни 1</text></g>
<g class="a e9"><text class="cap" x="40" y="262">что игрушка решает по первому принятому пакету с данными</text></g>
<g class="a e10"><rect class="bxr" x="40" y="272" width="880" height="52" rx="8"/><text class="sm tk" x="52" y="294">блокируемое имя внутри</text><text class="sm" x="52" y="314">этот пакет и все следующие данные клиента выбрасываются: BLOCKED</text></g>
<g class="a e11"><rect class="bxo" x="40" y="332" width="880" height="52" rx="8"/><text class="sm tk" x="52" y="354">приветствие TLS или запрос HTTP без имени</text><text class="sm" x="52" y="374">соединение разрешено, дальше игрушка не смотрит: ALLOWED</text></g>
<g class="a e12"><rect class="bxs" x="40" y="392" width="880" height="52" rx="8"/><text class="sm tk" x="52" y="414">пакет игнорирован вариантом игрушки</text><text class="sm" x="52" y="434">в расчёт не взят, игрушка ждёт следующий пакет</text></g>
<g class="a e13"><text class="cap" x="40" y="468">опорные опыты: стратегия pass, подделки нет</text></g>
<g class="a e14"><rect class="bxr" x="40" y="478" width="432" height="112" rx="8"/><text class="sm tk" x="52" y="502">с игрушкой</text><text class="sm" x="52" y="524">имя найдено в первом пакете (250 B):</text><text class="sm tk" x="52" y="546">BLOCKED, сервер получил 0 B</text><text class="m" x="52" y="570">клиент: closed, no reply</text></g>
<g class="a e15"><rect class="bxo" x="488" y="478" width="432" height="112" rx="8"/><text class="sm tk" x="500" y="502">без игрушки</text><text class="sm" x="500" y="524">тот же запрос доходит:</text><text class="sm tk" x="500" y="546">сервер получил 250 B</text><text class="m" x="500" y="570">ответ получен</text></g>
