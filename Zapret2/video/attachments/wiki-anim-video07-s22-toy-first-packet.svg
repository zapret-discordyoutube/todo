<svg xmlns="http://www.w3.org/2000/svg" class="v07-s22-toy-first-packet" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="v07-s22-toy-first-packet-t v07-s22-toy-first-packet-d">
<title id="v07-s22-toy-first-packet-t">Игрушка: первый пакет решает</title>
<desc id="v07-s22-toy-first-packet-d">Игрушечный инспектор проекта стоит на входе в первый роутер, раньше проверки срока жизни, поэтому видит и пакеты со сроком жизни 1, и первый пакет с данными, который он принял во внимание, решает за всё соединение: блокируемое имя внутри значит блокировку, приветствие без имени значит разрешение, а игнорированный пакет заставляет ждать следующий; опорные опыты: без подделки игрушка блокирует и сервер получает 0 байт, без игрушки сервер получает 250 байт.</desc>
