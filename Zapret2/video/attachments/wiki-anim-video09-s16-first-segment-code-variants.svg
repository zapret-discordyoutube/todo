<svg xmlns="http://www.w3.org/2000/svg" class="v09-s16-first-segment-code-variants" viewBox="0 0 960 757" width="960" height="757" role="img" aria-labelledby="v09-s16-first-segment-code-variants-t v09-s16-first-segment-code-variants-d">
<title id="v09-s16-first-segment-code-variants-t">Первый кусок ответа и код зажима окна</title>
<desc id="v09-s16-first-segment-code-variants-d">Без стратегии наш сервер отвечает на 6000 байт пятью сегментами, а при зажиме окна у клиента с окном 1 и множителем 6 первый кусок ровно 64 байта, это 1 × 2^6, и всего получается 40 сегментов, в коде окно записывается в поле пакета, множитель в SYN только уменьшается, а на первом пакете с данными функция отключается, окно 1 без множителя оставляет множитель 10 и даёт первые два куска по 512 байт, а строка с окном 2 и множителем 6 по счёту даёт первый кусок 128 байт, как и показал запуск.</desc>
