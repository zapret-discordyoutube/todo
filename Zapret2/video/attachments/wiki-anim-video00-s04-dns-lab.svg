<rect class="bg" x="0" y="0" width="960" height="504"/>
<g class="a e1"><rect class="bxo" x="40" y="8" width="153" height="24" rx="5"/><text class="cap ok" x="50" y="24.5">В НАШЕМ ТЕСТЕ</text><rect class="bxd" x="203" y="8" width="398.2" height="24" rx="5"/><text class="cap mu" x="213" y="24.5">ИГРУШЕЧНЫЙ СПРАВОЧНИК, НЕ НАСТОЯЩИЙ</text></g>
<g class="a e2"><rect class="bxr" x="40" y="44" width="250" height="66" rx="8"/><text class="sm" x="54" y="68">справочник системы</text><text class="mk rej" x="54" y="96">192.0.2.99</text><rect class="bxo" x="310" y="44" width="250" height="66" rx="8"/><text class="sm" x="324" y="68">другой справочник</text><text class="mk ok" x="324" y="96">192.0.2.13</text><text class="ml c" x="300" y="82">≠</text></g>
<g class="a e3"><text class="sm" x="580" y="62">проверка сравнивает два ответа</text><text class="sm" x="580" y="84">для одного имени из списка</text><text class="sm tk" x="580" y="106">и пишет, что они не совпали</text></g>
<g class="a e4"><rect class="bxs" x="40" y="124" width="880" height="82" rx="8"/><text class="mk rej" x="56" y="148">rutracker.org : MISMATCH</text><text class="mn" x="56" y="172">-- POSSIBLE DNS HIJACK DETECTED. ZAPRET WILL NOT HELP YOU IN CASE DNS IS SPOOFED !!!</text><text class="mn" x="56" y="194">-- DNS CHANGE OR DNSCRYPT MAY BE REQUIRED</text></g>
<g class="a e5"><text class="cap" x="40" y="238">дальше проверка ищет шифрованный сервер DoH</text></g>
<g class="a e6"><rect class="bx" x="40" y="250" width="430" height="188" rx="10"/><text class="tk" x="56" y="280">опыт 1: рабочего сервера нет</text><text class="sm" x="56" y="310">пять публичных серверов DoH: все FAIL</text><rect class="bxr" x="56" y="324" width="398" height="34" rx="6"/><text class="mn" x="66" y="346">could not find working DoH server. exiting.</text><text class="sm" x="56" y="388">проверка останавливается, код выхода 7:</text><text class="sm tk" x="56" y="410">DNS подменён: zapret здесь не поможет</text></g>
<g class="a e7"><rect class="bx" x="490" y="250" width="430" height="188" rx="10"/><text class="tk" x="506" y="280">опыт 2: в лаборатории есть такой сервер</text><text class="sm" x="506" y="310">проверка переходит на него:</text><rect class="bxo" x="506" y="324" width="398" height="34" rx="6"/><text class="mn" x="516" y="346">https://doh.test:8443/dns-query : OK</text><text class="sm" x="506" y="388">сайт открылся без всякого обхода:</text><text class="mk ok" x="506" y="410">working without bypass</text></g>
<g class="a e8"><text class="tk sm c" x="480" y="478">настоящие справочники мы так не проверяли</text></g>
