<svg xmlns="http://www.w3.org/2000/svg" class="v00-s04-dns-lab" viewBox="0 0 960 504" width="960" height="504" role="img" aria-labelledby="v00-s04-dns-lab-t v00-s04-dns-lab-d">
<title id="v00-s04-dns-lab-t">Игрушечный справочник и проверка</title>
<desc id="v00-s04-dns-lab-d">В нашем тесте игрушечный справочник отвечает ложным адресом на одно имя из списка, проверка сравнивает его ответ с ответом другого справочника, пишет, что ответы не совпали, и предупреждает, что zapret не поможет; если рабочего шифрованного сервера нет, она останавливается с кодом 7, а в соседнем опыте нашла его в лаборатории, перешла на него и сайт открылся без всякого обхода; настоящие справочники мы так не проверяли.</desc>
