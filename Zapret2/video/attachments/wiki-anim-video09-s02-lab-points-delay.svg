<g><text class="cap" x="40" y="24">лаборатория выпуска: клиент, роутер, сервер и четыре точки съёмки</text></g>
<g class="a video09-s02-lab-points-delay-k1"><rect class="bx" x="40" y="86" width="110" height="68" rx="8"/><text class="tk c" x="95" y="126">клиент</text><rect class="bx" x="390" y="86" width="180" height="68" rx="8"/><text class="tk c" x="480" y="108">роутер</text><rect class="bx" x="810" y="86" width="110" height="68" rx="8"/><text class="tk c" x="865" y="126">сервер</text><path class="lm" d="M150 120L390 120"/><path class="lm" d="M570 120L810 120"/></g>
<g class="a video09-s02-lab-points-delay-k2"><circle class="dot" cx="170" cy="120" r="9"/><text class="smk c" x="170" y="100">c0</text><text class="sm13 mu c" x="170" y="176">на карте клиента,</text><text class="sm13 mu c" x="170" y="192">после программы</text><circle class="dot" cx="390" cy="120" r="9"/><text class="smk c" x="390" y="100">r0</text><text class="sm13 mu c" x="390" y="176">вход</text><text class="sm13 mu c" x="390" y="192">в роутер</text><circle class="dot" cx="570" cy="120" r="9"/><text class="smk c" x="570" y="100">r1</text><text class="sm13 mu c" x="570" y="176">выход</text><text class="sm13 mu c" x="570" y="192">из роутера</text><circle class="dot" cx="790" cy="120" r="9"/><text class="smk c" x="790" y="100">s0</text><text class="sm13 mu c" x="790" y="176">на карте</text><text class="sm13 mu c" x="790" y="192">сервера</text></g>
<g class="a video09-s02-lab-points-delay-k3"><rect class="bxs" x="412" y="124" width="136" height="24" rx="5"/><text class="sm13k c" x="480" y="141">срок жизни − 1</text></g>
<g class="a video09-s02-lab-points-delay-k4"><rect class="bxb" x="224" y="107" width="112" height="26" rx="6"/><text class="sm13k c amb ns" x="280" y="125">← +5 мс</text><rect class="bxb" x="624" y="107" width="112" height="26" rx="6"/><text class="sm13k c amb ns" x="680" y="125">+5 мс →</text><text class="smk c" x="480" y="222">задержка 5 мс на каждом выходе роутера: круг туда и обратно 10 мс</text></g>
<g class="a video09-s02-lab-points-delay-k5"><path class="lr" d="M66 244L78 256M66 256L78 244"/><text class="sm" x="88" y="255">роутер вычитает 1 из срока жизни: пакет со сроком жизни 1 виден на r0 и дальше не идёт</text></g>
<g class="a video09-s02-lab-points-delay-k6"><text class="cap" x="40" y="298">круг в десять миллисекунд: обычное рукопожатие</text><path class="lm" d="M80 374L800 374"/><path class="lm" d="M80 368L80 380"/><text class="ix c" x="80" y="398">0</text><path class="lm" d="M200 368L200 380"/><text class="ix c" x="200" y="398">2</text><path class="lm" d="M320 368L320 380"/><text class="ix c" x="320" y="398">4</text><path class="lm" d="M440 368L440 380"/><text class="ix c" x="440" y="398">6</text><path class="lm" d="M560 368L560 380"/><text class="ix c" x="560" y="398">8</text><path class="lm" d="M680 368L680 380"/><text class="ix c" x="680" y="398">10</text><path class="lm" d="M800 368L800 380"/><text class="ix c" x="800" y="398">12</text><text class="ix" x="808" y="378">мс</text></g>
<g class="a video09-s02-lab-points-delay-k7"><circle class="dot" cx="80" cy="374" r="9"/><text class="smk c" x="80" y="350">SYN</text><text class="sm13k c" x="80" y="422">0 мс</text></g>
<g class="a video09-s02-lab-points-delay-k8"><circle class="doto" cx="688.4" cy="374" r="9"/><text class="smk c" x="688.4" y="350">SYN-ACK</text><text class="sm13k c" x="688.4" y="422">10,14 мс</text></g>
<g class="a video09-s02-lab-points-delay-k9"><path class="lb" d="M80 334C180 314 588.4 314 688.4 334"/><rect class="bxb" x="314.2" y="309" width="140" height="28" rx="6"/><text class="smk c amb ns" x="384.2" y="328">круг ≈ 10 мс</text></g>
<g class="a video09-s02-lab-points-delay-k10"><rect class="bx" x="40" y="452" width="880" height="98" rx="8"/><text class="sm" x="56" y="472">в лаборатории прошлых выпусков сервер стоял рядом</text><text class="sm13" x="56" y="492">без задержки результаты опытов с данными в SYN нестабильны: счётчики ядра клиента показывают</text><text class="sm13" x="56" y="510">пакеты «недействительные» (invalid); почему так, по коду ядра не проверяли; с кругом 10 мс порядок один и тот же</text><text class="sm13 mu" x="56" y="530">по общим сведениям, в настоящей сети круг занимает десятки миллисекунд</text></g>
