<svg xmlns="http://www.w3.org/2000/svg" class="video09-s02-lab-points-delay" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="video09-s02-lab-points-delay-t video09-s02-lab-points-delay-d">
<title id="video09-s02-lab-points-delay-t">Лаборатория с кругом в десять миллисекунд</title>
<desc id="video09-s02-lab-points-delay-d">В лаборатории выпуска между клиентом и сервером стоит один роутер с четырьмя точками съёмки и задержкой в пять миллисекунд на каждом его выходе, поэтому круг занимает десять миллисекунд, и в нашем тесте SYN-ACK приходит к клиенту на 10,14 мс после SYN.</desc>
<style>
