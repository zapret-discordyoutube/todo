<title id="v00-s19-recap-three-t">Три повтора выпуска</title>
<desc id="v00-s19-recap-three-d">Коротко обо всём выпуске: блокировки бывают разные и zapret2 может помочь против блокировок по имени сайта или по сигнатуре протокола, но не против подмены DNS и блока по адресу, программа состоит из правила ядра Linux, Си-части и Lua со стратегиями, а дальше идут приёмы и инструменты, и главный вопрос в том, какие выпуски курса есть.</desc>
