<g class="a e1"><rect class="bxr" x="24" y="44" width="296" height="156" rx="8"/><text class="tk" x="40" y="72">что блокируют</text><text class="sm" x="40" y="100">блокировки бывают разные;</text><text class="sm" x="40" y="122">zapret2 может помочь против</text><text class="sm" x="40" y="144">блока по имени сайта или по</text><text class="sm" x="40" y="166">протоколу, но не против</text><text class="sm" x="40" y="188">подмены DNS и блока по адресу</text></g>
<g class="a e2"><rect class="bxa" x="332" y="44" width="296" height="156" rx="8"/><text class="tk" x="348" y="72">из чего состоит программа</text><text class="sm" x="348" y="100">перехват пакетов,</text><text class="sm" x="348" y="122">Си-часть и Lua</text><text class="sm" x="348" y="144">со стратегиями</text></g>
