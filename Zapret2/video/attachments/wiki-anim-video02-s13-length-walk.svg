.v02-s13-length-walk .fm{fill:var(--line);stroke:none}
.v02-s13-length-walk .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s13-length-walk .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s13-length-walk .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s13-length-walk .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s13-length-walk .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s13-length-walk .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s13-length-walk .hf{fill:var(--fg2)}.v02-s13-length-walk .ha{fill:var(--acc)}.v02-s13-length-walk .hr{fill:var(--rej)}.v02-s13-length-walk .hm{fill:var(--mute)}.v02-s13-length-walk .ho{fill:var(--ok)}
.v02-s13-length-walk .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v02-s13-length-walk .a{animation-duration:46s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
.v02-s13-length-walk .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v02-s13-length-walk .ix{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--mute);stroke:none}
.v02-s13-length-walk .pl{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.v02-s13-length-walk .fb{fill:var(--ambt);stroke:none}
.v02-s13-length-walk .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v02-s13-length-walk .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v02-s13-length-walk .hb2{fill:var(--amb)}
.v02-s13-length-walk .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
