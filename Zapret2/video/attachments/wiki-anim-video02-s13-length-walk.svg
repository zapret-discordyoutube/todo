.v02-s13-length-walk .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s13-length-walk .mu{fill:var(--mute)}.v02-s13-length-walk .fg{fill:var(--fg)}.v02-s13-length-walk .acc{fill:var(--acc)}.v02-s13-length-walk .rej{fill:var(--rej)}.v02-s13-length-walk .ok{fill:var(--ok)}.v02-s13-length-walk .amb{fill:var(--amb)}
.v02-s13-length-walk .hb{fill:var(--acc);font-weight:700}.v02-s13-length-walk .hbr{fill:var(--rej);font-weight:700}.v02-s13-length-walk .hbo{fill:var(--ok);font-weight:700}.v02-s13-length-walk .hbb{fill:var(--amb);font-weight:700}
.v02-s13-length-walk .c{text-anchor:middle}.v02-s13-length-walk .r{text-anchor:end}
.v02-s13-length-walk .nos{stroke:none}
.v02-s13-length-walk .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s13-length-walk .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
