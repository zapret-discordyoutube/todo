<svg xmlns="http://www.w3.org/2000/svg" class="v02-s13-length-walk" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="v02-s13-length-walk-t v02-s13-length-walk-d">
<title id="v02-s13-length-walk-t">Длины и прыжки через содержимое</title>
<desc id="v02-s13-length-walk-d">Длины вложены друг в друга и сходятся: 250 = 5 + 245 (длина записи 00 f5), 245 = 4 + 241 (длина сообщения 00 00 f1) и 250 = 88 + 162 (длина расширений 00 a2); чтобы добраться до расширений, программа читает длины и перепрыгивает через содержимое: по смещению 43 стоит 32, прыжок на 76; по 76–77 стоит 6, прыжок на 84; по 84 стоит 1, прыжок на 86; по 86–87 стоит 162, и расширения идут с 88 до конца данных; так же ходит и zapret2 (nfq2/protocol.c:524).</desc>
<style>.v02-s13-length-walk{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s13-length-walk{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
