frames v02-s13-length-walk-k11{0.0%{opacity:0}78.261%{opacity:0}79.239%{opacity:1}97.609%{opacity:1}98.913%{opacity:0}100%{opacity:0}}.v02-s13-length-walk .e11{animation-name:v02-s13-length-walk-k11}@keyframes v02-s13-length-walk-k12{0.0%{opacity:0}41.304%{opacity:0}42.283%{opacity:1}97.609%{opacity:1}98.913%{opacity:0}100%{opacity:0}}.v02-s13-length-walk .e12{animation-name:v02-s13-length-walk-k12}@keyframes v02-s13-length-walk-k13{0.0%{opacity:0}54.348%{opacity:0}55.326%{opacity:1}97.609%{opacity:1}98.913%{opacity:0}100%{opacity:0}}.v02-s13-length-walk .e13{animation-name:v02-s13-length-walk-k13}@keyframes v02-s13-length-walk-k14{0.0%{opacity:0}67.391%{opacity:0}68.37%{opacity:1}97.609%{opacity:1}98.913%{opacity:0}100%{opacity:0}}.v02-s13-length-walk .e14{animation-name:v02-s13-length-walk-k14}@keyframes v02-s13-length-walk-k15{0.0%{opacity:0}80.435%{opacity:0}81.413%{opacity:1}97.609%{opacity:1}98.913%{opacity:0}100%{opacity:0}}.v02-s13-length-walk .e15{animation-name:v02-s13-length-walk-k15}@keyframes v02-s13-length-walk-k16{0.0%{opacity:0}86.957%{opacity:0}87.935%{opacity:1}97.609%{opacity:1}98.913%{opacity:0}100%{opacity:0}}.v02-s13-length-walk .e16{animation-name:v02-s13-length-walk-k16}</style>
<rect class="bg" x="0" y="0" width="960" height="566"/>
<g class="a e1"><text class="cap" x="10" y="24">длины вложены одна в другую, и сумма всегда сходится</text></g>
<g class="a e2"><text class="m" x="10" y="44">запись: 250 = 5 + 245</text><rect class="bxa" x="10.0" y="50" width="18.8" height="28" rx="3"/><rect class="bxb" x="28.8" y="50" width="921.2" height="28" rx="3"/><text class="sm c" x="489.4" y="69">длина записи 00 f5 = 245</text></g>
<g class="a e3"><text class="m" x="10" y="98">рукопожатие: 245 = 4 + 241</text><rect class="bxa" x="28.8" y="104" width="15.0" height="28" rx="3"/><rect class="bxb" x="43.8" y="104" width="906.2" height="28" rx="3"/><text class="sm c" x="496.9" y="123">длина сообщения 00 00 f1 = 241</text></g>
<g class="a e4"><text class="m" x="10" y="152">расширения: 250 = 88 + 162</text><rect class="bxa" x="10.0" y="158" width="330.9" height="28" rx="3"/><rect class="bxb" x="340.9" y="158" width="609.1" height="28" rx="3"/><text class="sm c" x="645.5" y="177">длина расширений 00 a2 = 162</text><text class="sm c" x="175.4" y="177">88 байт до расширений</text></g>
<g class="a e5"><text class="sm r mu" x="950" y="44">синий = заголовок, жёлтый = то, что покрывает длина</text></g>
<g class="a e6"><text class="cap" x="10" y="238">как программа перепрыгивает до расширений</text></g>
<g class="a e7"><rect class="bxa" x="10.0" y="290" width="40.8" height="30" rx="2"/><rect class="fs" x="51.4" y="290" width="119.7" height="30" rx="2"/><rect class="bxb" x="171.7" y="290" width="3.1" height="30" rx="2"/><rect class="fs" x="175.4" y="290" width="119.8" height="30" rx="2"/><rect class="bxb" x="295.8" y="290" width="6.9" height="30" rx="2"/><rect class="fs" x="303.3" y="290" width="21.9" height="30" rx="2"/><rect class="bxb" x="325.8" y="290" width="3.2" height="30" rx="2"/><rect class="fs" x="329.6" y="290" width="3.2" height="30" rx="2"/><rect class="bxb" x="333.4" y="290" width="6.9" height="30" rx="2"/><rect class="bxo" x="340.9" y="290" width="608.5" height="30" rx="2"/><text class="sm c" x="645.5" y="310">расширения: 162 байта</text><text class="sm c mu" x="111.5" y="310">случайное</text><text class="ix" x="10" y="338">0</text><text class="ix c" x="173.7" y="338">43</text><text class="ix c" x="295.8" y="338">76</text><text class="ix c" x="346.9" y="338">88</text><text class="ix r" x="950" y="338">250</text></g>
<g class="a e8"><path class="la" d="M173.6 290 C173.6 244 295.8 244 295.8 290"/><circle class="dot" cx="234.7" cy="254" r="11"/><text class="tk c ns" x="234.7" y="259">1</text></g>
<g class="a e9"><path class="la" d="M298.8 290 C298.8 260 325.8 260 325.8 290"/><circle class="dot" cx="312.8" cy="246" r="11"/><text class="tk c ns" x="312.8" y="251">2</text></g>
<g class="a e10"><path class="la" d="M327.7 320 C327.7 340 333.4 340 333.4 320"/><circle class="dot" cx="331.6" cy="356" r="11"/><text class="tk c ns" x="331.6" y="361">3</text></g>
<g class="a e11"><path class="lo" d="M340.9 290 V280 H950.0 V290"/><circle class="dot" cx="645.5" cy="268" r="11"/><text class="tk c ns" x="645.5" y="273">4</text></g>
<g class="a e12"><circle class="dot" cx="22" cy="399" r="11"/><text class="tk c ns" x="22" y="404">1</text><text class="sm" x="44" y="404">по смещению 43 стоит 20, то есть 32: перепрыгиваем идентификатор сессии, попадаем на 76 (43 + 1 + 32)</text></g>
<g class="a e13"><circle class="dot" cx="22" cy="427" r="11"/><text class="tk c ns" x="22" y="432">2</text><text class="sm" x="44" y="432">по 76–77 стоит 00 06, то есть 6: перепрыгиваем наборы шифров, попадаем на 84 (76 + 2 + 6)</text></g>
<g class="a e14"><circle class="dot" cx="22" cy="455" r="11"/><text class="tk c ns" x="22" y="460">3</text><text class="sm" x="44" y="460">по 84 стоит 01: перепрыгиваем один байт способа сжатия, попадаем на 86 (84 + 1 + 1)</text></g>
<g class="a e15"><circle class="dot" cx="22" cy="483" r="11"/><text class="tk c ns" x="22" y="488">4</text><text class="sm" x="44" y="488">по 86–87 стоит 00 a2 = 162: расширения идут с 88 до 249 (88 + 162 = 250, конец данных)</text></g>
<g class="a e16"><text class="tk" x="10" y="526">Позиции дальнейших полей зависят от длины идентификатора сессии: её надо прочитать.</text><text class="sm mu" x="10" y="550">Так ходит и zapret2: nfq2/protocol.c:524, функция TLSFindExtLenOffsetInHandshake.</text></g>
</svg>
