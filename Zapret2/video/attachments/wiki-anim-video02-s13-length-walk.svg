.v02-s13-length-walk .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v02-s13-length-walk .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v02-s13-length-walk .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
