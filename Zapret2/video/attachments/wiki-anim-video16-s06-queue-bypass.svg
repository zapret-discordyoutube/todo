<rect class="bg" x="0" y="0" width="960" height="560"/>
<g class="a e1"><text class="cap" x="20" y="24">действие правила: queue num 200 bypass</text></g>
<g class="a e2"><rect class="bxa" x="20" y="40" width="250" height="40" rx="8"/><text class="mk c" x="145" y="66">правило: queue num 200</text><text class="tk c" x="288" y="66">=</text><rect class="bxa" x="306" y="40" width="290" height="40" rx="8"/><text class="mk c" x="451" y="66">программа: nfqws2 --qnum=200</text></g>
<g class="a e3"><text class="sm mu" x="20" y="108">журнал программы:</text><text class="m" x="184" y="108">binding this socket to queue &#x27;200&#x27;</text><text class="sm mu" x="524" y="108">(nfq2/nfqws.c:391)</text></g>
<g class="a e4"><rect class="bxb" x="660" y="40" width="280" height="56" rx="8"/><text class="sm tk c amb" x="800" y="63">bypass: не обход блокировок,</text><text class="sm tk c amb" x="800" y="84">а «пропусти, если некому»</text></g>
<g class="a e5"><text class="cap" x="20" y="142">что ядро делает с пакетом, который попал в очередь 200</text></g>
<g class="a e6"><rect class="bx" x="20" y="156" width="300" height="150" rx="10"/><text class="sm tk" x="34" y="182">1 · клерк на месте</text><rect class="bx" x="34" y="200" width="64" height="30" rx="15"/><text class="sm c" x="66" y="220">пакет</text><path class="lf" d="M102 215L132.0 215.0"/><polygon class="hf" points="142,215 132.0,220.0 132.0,210.0"/><rect class="bxa" x="146" y="194" width="96" height="42" rx="8"/><text class="sm c" x="194" y="213">комната</text><text class="mk c" x="194" y="229">nfqws2</text><path class="lo" d="M246 215L280.0 215.0"/><polygon class="ho" points="290,215 280.0,220.0 280.0,210.0"/><text class="sm mu c" x="276" y="206">вердикт</text><text class="sm" x="34" y="256">пакет едет в комнату,</text><text class="sm" x="34" y="276">программа выдаёт вердикт</text></g>
<g class="a e7"><rect class="bx" x="330" y="156" width="300" height="150" rx="10"/><text class="sm tk" x="344" y="182">2 · пусто, табличка bypass</text><rect class="bx" x="344" y="200" width="64" height="30" rx="15"/><text class="sm c" x="376" y="220">пакет</text><path class="lf" d="M412 215L442.0 215.0"/><polygon class="hf" points="452,215 442.0,220.0 442.0,210.0"/><rect class="bxd" x="456" y="194" width="96" height="42" rx="8"/><text class="sm c mu" x="504" y="213">комната</text><text class="sm c mu" x="504" y="229">пусто</text><path class="lo" d="M556 215L586.0 215.0"/><polygon class="ho" points="596,215 586.0,220.0 586.0,210.0"/><path class="lo" d="M605 215L610 221L620 208"/><text class="sm" x="344" y="256">табличка bypass: пакет едет</text><text class="sm ok tk" x="344" y="276">дальше, будто окошка нет</text></g>
<g class="a e8"><rect class="bx" x="640" y="156" width="300" height="150" rx="10"/><text class="sm tk" x="654" y="182">3 · пусто, таблички нет</text><rect class="bx" x="654" y="200" width="64" height="30" rx="15"/><text class="sm c" x="686" y="220">пакет</text><path class="lf" d="M722 215L752.0 215.0"/><polygon class="hf" points="762,215 752.0,220.0 752.0,210.0"/><rect class="bxd" x="766" y="194" width="96" height="42" rx="8"/><text class="sm c mu" x="814" y="213">комната</text><text class="sm c mu" x="814" y="229">пусто</text><path class="lr" d="M866 215L892.0 215.0"/><polygon class="hr" points="902,215 892.0,220.0 892.0,210.0"/><path class="lr" d="M912 207L928 223M912 223L928 207"/><text class="sm" x="654" y="256">без таблички пакет падает</text><text class="sm rej tk" x="654" y="276">в корзину: выброшен</text></g>
<g class="a e9"><rect class="bxo" x="20" y="322" width="460" height="88" rx="8"/><text class="sm tk" x="34" y="347">опыт t00: правила стоят, nfqws2 не запущен</text><text class="sm" x="34" y="369">10 пакетов TCP проходят, клиент соединился</text><text class="sm" x="34" y="389">за 0,3 мс: bypass пропускает пакеты</text></g>
<g class="a e10"><rect class="bxa" x="490" y="322" width="450" height="88" rx="8"/><text class="sm tk" x="504" y="347">наш тест на UDP: очередь без слушателя</text><text class="sm" x="504" y="369">с bypass дошло 2 из 2, без bypass 0 из 2</text><text class="sm mu" x="504" y="389">TCP так отдельно не проверяли</text></g>
<g class="a e11"><text class="cap" x="20" y="442">обратная сторона bypass: номера обязаны совпасть</text></g>
<g class="a e12"><rect class="bxb" x="20" y="454" width="210" height="40" rx="8"/><text class="mk c" x="125" y="480">правило: 200</text><text class="tk c" x="250" y="480">≠</text><rect class="bxb" x="270" y="454" width="220" height="40" rx="8"/><text class="mk c" x="380" y="480">программа: 300</text></g>
<g class="a e13"><text class="sm" x="510" y="470">пакеты уходят в пустую очередь 200,</text><text class="sm" x="510" y="490">bypass пропускает их дальше</text></g>
<g class="a e14"><text class="sm tk" x="20" y="522">всё работает, программа ничего не получает, об ошибке никто не сообщит</text></g>
<g class="a e15"><text class="sm mu" x="20" y="544">это наш вывод из смысла bypass, опыта с неверным номером у нас не было</text></g>
</svg>
