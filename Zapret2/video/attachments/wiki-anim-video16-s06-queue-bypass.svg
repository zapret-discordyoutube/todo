<svg xmlns="http://www.w3.org/2000/svg" class="v16-s06-queue-bypass" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v16-s06-queue-bypass-t v16-s06-queue-bypass-d">
<title id="v16-s06-queue-bypass-t">Очередь 200 и bypass</title>
<desc id="v16-s06-queue-bypass-d">Действие «queue num 200 bypass»: правило отправляет пакет в очередь 200, и программа должна быть запущена с --qnum=200 (в журнале: binding this socket to queue &#x27;200&#x27;, nfq2/nfqws.c:391); если очередь никто не слушает, bypass пропускает пакет дальше (здесь это не обход блокировок, а «пропусти, если некому»), без bypass пакет выбрасывается: в опыте с остановленной программой десять пакетов TCP прошли и клиент соединился за 0,3 мс, а в тесте на UDP с bypass дошло 2 из 2, без него 0 из 2; если в правиле 200, а программа запущена с 300, пакеты идут мимо неё без сообщения об ошибке (вывод из смысла bypass, опыта с неверным номером нет).</desc>
<style>.v16-s06-queue-bypass{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v16-s06-queue-bypass{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v16-s06-queue-bypass .bg{fill:var(--bg)}
.v16-s06-queue-bypass text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
