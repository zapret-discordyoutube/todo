.v16-s06-queue-bypass .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v16-s06-queue-bypass .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v16-s06-queue-bypass .hf{fill:var(--fg2)}.v16-s06-queue-bypass .ha{fill:var(--acc)}.v16-s06-queue-bypass .hr{fill:var(--rej)}.v16-s06-queue-bypass .hm{fill:var(--mute)}.v16-s06-queue-bypass .ho{fill:var(--ok)}.v16-s06-queue-bypass .hb{fill:var(--amb)}
.v16-s06-queue-bypass .a{animation-duration:44s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v16-s06-queue-bypass .a{animation:none}.v16-s06-queue-bypass .tr{display:none}}
