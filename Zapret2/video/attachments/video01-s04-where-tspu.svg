<title id="v01-s04-where-t">Где на пути пакета стоит ТСПУ</title>
<desc id="v01-s04-where-d">Путь пакета от клиента через домашний роутер и сеть провайдера, где по открытым описаниям стоит оборудование ТСПУ (в нашей истории модель), через роутеры интернета к серверу; ниже что известно об этом оборудовании по открытым описаниям и что публично не известно.</desc>
