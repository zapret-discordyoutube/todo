<g><text class="cap" x="40" y="24">живой опыт: большое приветствие в 1484 байта, multisplit с позицией 2</text></g>
<g class="a e1"><text class="sm tk" x="40" y="48">части по метке: 2 и 1482; часть 2 длиннее максимума и режется</text><text class="ix mu r" x="920" y="48">не в масштабе</text></g>
<g class="a e2"><rect class="bxa" x="40" y="58" width="70" height="26" rx="0"/><text class="ix c" x="75" y="76">2</text><rect class="bxo" x="110" y="58" width="810" height="26" rx="0"/><text class="sm c" x="515" y="76">часть 2: 1482</text></g>
<g class="a e3"><rect class="bxa" x="40" y="90" width="70" height="26" rx="0"/><text class="ix c" x="75" y="108">2</text><rect class="bxo" x="110" y="90" width="640" height="26" rx="0"/><text class="sm c" x="430" y="108">ломтик 1448</text><rect class="bxb" x="750" y="90" width="170" height="26" rx="0"/><text class="sm c" x="835" y="108">ломтик 34</text></g>
<g class="a e4"><rect class="bx" x="40" y="130" width="880" height="130" rx="8"/><text class="cap" x="54" y="150">журнал: строки отправки</text></g>
<g class="a e5"><text class="m mu" x="54" y="170">LUA: multisplit: sending part 1 0-1 len=2 …</text></g>
<g class="a e6"><text class="m" x="54" y="189">rawsend_dissect repeats=1 size=54</text><text class="m" x="640" y="189">20 + 32 + 2 = 54</text></g>
<g class="a e7"><text class="m mu" x="54" y="208">LUA: multisplit: sending part 2 2-1483 len=1482 …</text></g>
<g class="a e8"><text class="m" x="54" y="227">rawsend_dissect repeats=1 size=1500</text><text class="m" x="640" y="227">20 + 32 + 1448 = 1500</text></g>
<g class="a e9"><text class="m" x="54" y="246">rawsend_dissect repeats=1 size=86</text><text class="m" x="640" y="246">20 + 32 + 34 = 86</text></g>
<g class="a e10"><text class="cap" x="40" y="280">провод: три пакета клиента (относительные номера)</text></g>
<g class="a e11"><text class="ix mu" x="54" y="302">пакет</text><text class="ix mu" x="150" y="302">номер</text><text class="ix mu" x="260" y="302">длина</text><text class="ix mu" x="370" y="302">id IP</text><text class="ix mu" x="480" y="302">ответ сервера</text></g>
<g class="a e12"><rect class="bx" x="40" y="310" width="880" height="26" rx="4"/><text class="mk" x="54" y="328">1</text><text class="mk" x="150" y="328">1</text><text class="mk" x="260" y="328">2</text><text class="mk" x="370" y="328">24609</text><text class="mk" x="480" y="328">подтверждение 3</text></g>
<g class="a e13"><rect class="bx" x="40" y="340" width="880" height="26" rx="4"/><text class="mk" x="54" y="358">2</text><text class="mk" x="150" y="358">3</text><text class="mk" x="260" y="358">1448</text><text class="mk" x="370" y="358">24610</text></g>
<g class="a e14"><rect class="bx" x="40" y="370" width="880" height="26" rx="4"/><text class="mk" x="54" y="388">3</text><text class="mk" x="150" y="388">1451</text><text class="mk" x="260" y="388">34</text><text class="mk" x="370" y="388">24611</text><text class="mk" x="480" y="388">подтверждение 1485</text></g>
<g class="a e15"><text class="sm" x="40" y="420">3 + 1448 = 1451; 1451 + 34 = 1485 = 1 + 1484: следующий байт после всех данных</text></g>
<g class="a e16"><rect class="bxb" x="40" y="432" width="880" height="84" rx="8"/><text class="sm tk" x="54" y="454">приложение сервера прочитало тремя чтениями: 2, 1448, 34</text><text class="sm" x="54" y="476">границы чтений совпали с границами пакетов, а не частей по метке: это наш сервер;</text><text class="sm" x="54" y="497">по общим сведениям, границы чтения определяет стек получателя</text></g>
<g class="a e17"><text class="cap" x="40" y="540">прогон функций: данные 250 байт, разрез на 104, куски по максимуму</text><text class="ix mu" x="40" y="560">числа под полосами: сдвиг куска от начала данных; настоящая библиотека, отправка заменена записью</text></g>
