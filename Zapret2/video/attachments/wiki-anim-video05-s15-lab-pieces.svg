<svg xmlns="http://www.w3.org/2000/svg" class="v05-s15-lab-pieces" viewBox="0 0 960 830" width="960" height="830" role="img" aria-labelledby="v05-s15-lab-pieces-t v05-s15-lab-pieces-d">
<title id="v05-s15-lab-pieces-t">Опыт и ломтики по максимуму</title>
<desc id="v05-s15-lab-pieces-d">Опыт с большим приветствием в 1484 байта и стратегией multisplit с позицией 2 даёт части 2 и 1482, в журнале для части 1 одна строка отправки с размером 54, а для части 2 две, с размерами 1500 и 86, то есть 20 + 32 + 1448 и 20 + 32 + 34; на проводе три пакета: номер 1 длина 2 идентификатор 24609, номер 3 длина 1448 идентификатор 24610, номер 1451 длина 34 идентификатор 24611, сервер подтвердил сначала 3, потом 1485, это 1451 + 34 и 1 + 1484, а приложение сервера прочитало данные тремя чтениями по 2, 1448 и 34 байта, и это поведение нашего сервера, потому что по общим сведениям границы чтения определяет стек получателя; прогоны функций на данных в 250 байт с разрезом на 104: при порции 100 и максимуме 88 получаются ломтики 88, 16, 88 и 58 со сдвигами 0, 88, 104 и 192 и идентификаторами 37472-37475, с подделкой, добавляющей опцию подписи, опции занимают 30 байт, с выравниванием 32, максимум 68, и ломтики 68, 36, 68, 68 и 10; расчёт на бумаге, который не запускали: порция 150, максимум 138, пакеты 104, 138 и 8 со сдвигами 0, 104 и 242.</desc>
