<svg xmlns="http://www.w3.org/2000/svg" class="v03-s03-stamp" viewBox="0 0 960 468" width="960" height="468" role="img" aria-labelledby="v03-s03-stamp-t v03-s03-stamp-d">
<title id="v03-s03-stamp-t">Ручка копируется в каждый вызов</title>
<desc id="v03-s03-stamp-d">Три настройки «ручки» программа копирует в каждый вызов в момент его разбора: в опыте лаборатории --in-range=a стоит перед вызовом pcap, поэтому у pcap входящие a, затем --in-range=x и --payload=tls_client_hello, поэтому у multisplit и pass входящие x, исходящие a и вид данных tls_client_hello; строки журнала при старте профиля один печатают эти значения как range_in=a0-a0 и x0-x0, где a значит «всегда», x «никогда», а число ноль.</desc>
