<g class="a v03-s03-stamp-e25"><text class="v03-s03-stamp-cap" x="10" y="246">строки журнала при старте: что получил каждый вызов</text></g>
<g class="a v03-s03-stamp-e26"><rect class="v03-s03-stamp-bx" x="14" y="258" width="806.812" height="28" rx="6"/><text class="v03-s03-stamp-mz v03-s03-stamp-mu" x="26" y="276">profile 1 (noname) lua </text><text class="v03-s03-stamp-mz v03-s03-stamp-fg" x="206.047" y="276">pcap(file=&quot;nfqws_seen.pcap&quot; </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="425.234" y="276">range_in=a0-a0</text><text class="v03-s03-stamp-mz" x="534.828" y="276"> </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="542.656" y="276">range_out=a0-a0</text><text class="v03-s03-stamp-mz" x="660.078" y="276"> </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="667.906" y="276">payload_type= all</text><text class="v03-s03-stamp-mz v03-s03-stamp-fg" x="800.984" y="276">)</text></g>
<g class="a v03-s03-stamp-e27"><rect class="v03-s03-stamp-bx" x="14" y="292" width="877.266" height="28" rx="6"/><text class="v03-s03-stamp-mz v03-s03-stamp-mu" x="26" y="310">profile 1 (noname) lua </text><text class="v03-s03-stamp-mz v03-s03-stamp-fg" x="206.047" y="310">multisplit(pos=&quot;midsld&quot; </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="393.922" y="310">range_in=x0-x0</text><text class="v03-s03-stamp-mz" x="503.516" y="310"> </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="511.344" y="310">range_out=a0-a0</text><text class="v03-s03-stamp-mz" x="628.766" y="310"> </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="636.594" y="310">payload_type= tls_client_hello</text><text class="v03-s03-stamp-mz v03-s03-stamp-fg" x="871.438" y="310">)</text></g>
<g class="a v03-s03-stamp-e28"><rect class="v03-s03-stamp-bx" x="14" y="326" width="736.359" height="28" rx="6"/><text class="v03-s03-stamp-mz v03-s03-stamp-mu" x="26" y="344">profile 1 (noname) lua </text><text class="v03-s03-stamp-mz v03-s03-stamp-fg" x="206.047" y="344">pass( </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="253.016" y="344">range_in=x0-x0</text><text class="v03-s03-stamp-mz" x="362.609" y="344"> </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="370.438" y="344">range_out=a0-a0</text><text class="v03-s03-stamp-mz" x="487.859" y="344"> </text><text class="v03-s03-stamp-mz v03-s03-stamp-amb" x="495.688" y="344">payload_type= tls_client_hello</text><text class="v03-s03-stamp-mz v03-s03-stamp-fg" x="730.531" y="344">)</text></g>
<g class="a v03-s03-stamp-e29"><text class="v03-s03-stamp-tk v03-s03-stamp-c" x="480" y="396">У pcap входящие «a», у двух других «x»: значения копируются в вызов в момент его разбора.</text></g>
<g class="a v03-s03-stamp-e30"><text class="v03-s03-stamp-sm v03-s03-stamp-c" x="480" y="424">a0-a0 читается как «от a до a»: у «a» (всегда) и «x» (никогда) числа нет, печатается 0.</text></g>
<g class="a v03-s03-stamp-e31"><text class="v03-s03-stamp-sm v03-s03-stamp-mu v03-s03-stamp-c" x="480" y="450">Условия профиля (например, порт) в этих строках не печатаются.</text></g>
