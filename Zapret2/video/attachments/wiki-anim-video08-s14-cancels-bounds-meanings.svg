<svg xmlns="http://www.w3.org/2000/svg" class="v08-s14-cancels-bounds-meanings" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="v08-s14-cancels-bounds-meanings-t v08-s14-cancels-bounds-meanings-d">
<title id="v08-s14-cancels-bounds-meanings-t">Отмены, границы и два смысла seqovl</title>
<desc id="v08-s14-cancels-bounds-meanings-d">Границы накладки seqovl у перемешивания с фейками: метка, равная разрезу, и метка, которую функция не нашла, отменяют накладку с записью в журнале, и на проводе уходят обычные шесть пакетов, метка midsld минус один даёт 103 накладки и пакет в 249 байт со смещения 1, метка 1 даёт один байт накладки и пакет в 147 байт со смещения 103, а текст вроде abc это ошибка функции после первого фейка; у разреза с фейками seqovl только число и лежит перед потоком, а здесь это метка внутри потока, слово host там ошибка, а здесь метка, текст abc ошибка в обеих; по расчёту при seqovl равно 80 вторая половина имела бы 226 байт, начало со смещения 24 и дублирующий блок с 25-го по 104-й, такого запуска у нас нет.</desc>
