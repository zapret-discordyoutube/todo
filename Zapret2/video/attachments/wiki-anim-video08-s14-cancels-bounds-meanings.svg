<rect class="bg" x="0" y="0" width="960" height="668"/>
<g><text class="cap" x="40" y="22">seqovl у перемешивания с фейками: отмены, границы и два смысла слова</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="880" height="80" rx="8"/><text class="mk" x="54" y="56">seqovl=midsld</text><text class="sm" x="230" y="56">метка равна разрезу 104</text><text class="sm tk rej" x="660" y="56">накладка отменена</text><rect class="fb" x="54" y="66" width="852" height="22" rx="4"/><text class="ix fg" x="60" y="82">fakeddisorder: seqovl cancelled because seqovl 104 is not less than the split pos 104</text><text class="sm" x="54" y="106">на проводе обычные шесть пакетов: настоящая вторая 146 байт, без накладки</text></g>
<g class="a e2"><rect class="bx" x="40" y="122" width="880" height="80" rx="8"/><text class="mk" x="54" y="144">seqovl=method</text><text class="sm" x="230" y="144">функция не нашла метку на приветствии</text><text class="sm tk rej" x="660" y="144">накладка отменена</text><rect class="fb" x="54" y="154" width="852" height="22" rx="4"/><text class="ix fg" x="60" y="170">fakeddisorder: seqovl cancelled because could not resolve marker &#x27;method&#x27;</text><text class="sm" x="54" y="194">на проводе обычные шесть пакетов: настоящая вторая 146 байт, без накладки</text></g>
<g class="a e3"><text class="sm tk" x="40" y="238">границы: накладок от 1 до 103, то есть меньше разреза 104</text></g>
<g class="a e4"><text class="cap" x="54" y="262">метка</text><text class="cap" x="230" y="262">накладок</text><text class="cap" x="350" y="262">настоящая вторая половина на проводе</text></g>
<g class="a e5"><rect class="bx" x="40" y="270" width="880" height="26" rx="5"/><text class="mk" x="54" y="288">midsld минус 1</text><text class="m" x="230" y="288">103</text><text class="sm tk" x="350" y="288">249 байт со смещения 1</text><text class="sm mu r" x="916" y="288">самая большая допустимая</text></g>
<g class="a e6"><rect class="bx" x="40" y="300" width="880" height="26" rx="5"/><text class="mk" x="54" y="318">1</text><text class="m" x="230" y="318">1</text><text class="sm tk" x="350" y="318">147 байт со смещения 103</text></g>
<g class="a e7"><rect class="bxr" x="40" y="330" width="880" height="26" rx="5"/><text class="mk" x="54" y="348">abc</text><text class="m" x="230" y="348">—</text><text class="sm tk" x="350" y="348">ошибка после первого фейка, на проводе один пакет</text></g>
<g class="a e8"><text class="cap" x="40" y="392">одно слово, два смысла</text></g>
<g class="a e9"><rect class="bx" x="40" y="402" width="434" height="138" rx="8"/><text class="mk" x="54" y="424">fakedsplit</text><text class="sm tk" x="54" y="444">seqovl: только число</text><rect class="bxz" x="54" y="454" width="28" height="16" rx="2"/><rect class="bxa" x="82" y="454" width="140" height="16" rx="2"/><text class="sm" x="230" y="467">накладка перед потоком</text><text class="sm" x="54" y="494">seqovl=5: 109 байт со смещения −5</text><text class="sm" x="54" y="514">слово host: ошибка после первого фейка</text><text class="sm" x="54" y="532">текст abc: ошибка</text></g>
<g class="a e10"><rect class="bxa" x="486" y="402" width="434" height="138" rx="8"/><text class="mk" x="500" y="424">fakeddisorder</text><text class="sm tk" x="500" y="444">seqovl: метка</text><rect class="bxa" x="500" y="454" width="110" height="16" rx="2"/><rect class="bxz" x="570" y="454" width="40" height="16" rx="2"/><rect class="bxa" x="610" y="454" width="100" height="16" rx="2"/><text class="sm" x="718" y="467">накладка внутри потока</text><text class="sm" x="500" y="494">seqovl=host: 243 байта со смещения 7</text><text class="sm" x="500" y="514">слово host: метка, 97 байт</text><text class="sm" x="500" y="532">текст abc: ошибка</text></g>
<g class="a e11"><text class="cap" x="40" y="570">проверь себя</text><text class="sm tk" x="190" y="570">seqovl=80: какой длины вторая половина и с какого смещения?</text></g>
<g class="a e12"><rect class="bxb" x="40" y="582" width="286" height="50" rx="8"/><text class="sm tk" x="52" y="604">80 + 146 = 226</text><text class="sm" x="52" y="623">байт в пакете</text></g>
<g class="a e13"><rect class="bxb" x="337" y="582" width="286" height="50" rx="8"/><text class="sm tk" x="349" y="604">104 − 80 = 24</text><text class="sm" x="349" y="623">смещение 24, номер 25</text></g>
<g class="a e14"><rect class="bxb" x="634" y="582" width="286" height="50" rx="8"/><text class="sm tk" x="646" y="604">дубль [25,105)</text><text class="sm" x="646" y="623">80 номеров, 105 − 25 = 80</text></g>
<g class="a e15"><text class="sm mu" x="40" y="652">расчёт по правилу, такого запуска у нас нет: запускали 97 и 20</text></g>
<g class="a e16"></g>
</svg>
