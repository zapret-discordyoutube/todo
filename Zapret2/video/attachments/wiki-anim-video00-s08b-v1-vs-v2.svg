<svg xmlns="http://www.w3.org/2000/svg" class="v00-s08b-v1-vs-v2" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="v00-s08b-v1-vs-v2-t v00-s08b-v1-vs-v2-d">
<title id="v00-s08b-v1-vs-v2-t">Одна стратегия в двух версиях</title>
<desc id="v00-s08b-v1-vs-v2-d">Одна и та же стратегия для YouTube из документации записана дважды: для первой версии набором опций, где приёмы зашиты в Си, и для второй версии отдельными вызовами функций на Lua, а линии связывают одинаковые по смыслу части: fake с fake, multidisorder с multidisorder, разрез с позицией, повторы с повторами и обманку md5sig с tcp_md5.</desc>
