<g><text class="cap" x="40" y="24">опыт: фейк без условий, игрушка включена</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="34" rx="8"/><text class="mk" x="56" y="58">--payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls</text><text class="sm mu" x="670" y="58">условий подделки нет</text></g>
