<svg xmlns="http://www.w3.org/2000/svg" class="video07-s04-wire-ladder-no-condition" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="video07-s04-wire-ladder-no-condition-t video07-s04-wire-ladder-no-condition-d">
<title id="video07-s04-wire-ladder-no-condition-t">Подделка без условий</title>
<desc id="video07-s04-wire-ladder-no-condition-d">Опыт с фейком без условий и включённой игрушкой: на c0 первым уходит пакет подделки в 680 байт, за ним настоящее приветствие в 250 байт, оба с флагами PSH и ACK, номером 1, сроком жизни 64 и одним ip id 191, оба проходят r0, r1 и s0, игрушка читает только первый пакет с данными и по записи TLS без запрещённого имени разрешает соединение, поэтому первую задачу подделка выполнила, а на ленте номеров два пакета занимают одно и то же место потока.</desc>
