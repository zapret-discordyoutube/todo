<svg xmlns="http://www.w3.org/2000/svg" class="v00-s03-honest-limit" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v00-s03-honest-limit-t v00-s03-honest-limit-d">
<title id="v00-s03-honest-limit-t">Пять игрушечных читателей</title>
<desc id="v00-s03-honest-limit-d">Пять игрушечных читателей из нашей лаборатории по-разному собирают запрос: разрез скрыл имя только от того, кто смотрит пакеты по одному, и сервер получил 250 байт, а четыре читателя, которые склеивают части, нашли имя и заблокировали запрос на втором пакете, так что до сервера дошло 104 байта; значит стратегия, побеждающая одного читателя, проигрывает другому, и лекарства от всего нет.</desc>
