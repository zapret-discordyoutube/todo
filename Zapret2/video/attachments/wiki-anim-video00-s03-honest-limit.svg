<rect class="bg" x="0" y="0" width="960" height="480"/>
<g class="a e1"><rect class="bxd" x="40" y="8" width="294.2" height="24" rx="5"/><text class="cap mu" x="50" y="24.5">ИГРУШКИ НАШЕЙ ЛАБОРАТОРИИ</text><text class="tk sm" x="346.2" y="26">не настоящее оборудование</text></g>
<g class="a e2"><text class="sm mu" x="40" y="62">как читатель</text><text class="sm mu" x="40" y="82">собирает запрос</text><text class="sm tk c" x="254" y="62">по одному</text><text class="sm c" x="254" y="82">пакету</text><text class="sm tk c" x="402" y="62">в порядке</text><text class="sm c" x="402" y="82">прихода</text><text class="sm tk c" x="550" y="62">по номерам:</text><text class="sm c" x="550" y="82">первый пишет</text><text class="sm tk c" x="698" y="62">по номерам:</text><text class="sm c" x="698" y="82">последний пишет</text><text class="sm tk c" x="846" y="62">только</text><text class="sm c" x="846" y="82">по порядку</text></g>
<g class="a e3"><text class="cap" x="40" y="112">на записи пакетов: находит ли читатель имя</text></g>
<g class="a e4"><text class="sm tk" x="40" y="144">без разреза</text><rect class="bxr" x="184" y="122" width="140" height="46" rx="8"/><text class="sm tk rej c" x="254" y="151">находит</text><rect class="bxr" x="332" y="122" width="140" height="46" rx="8"/><text class="sm tk rej c" x="402" y="151">находит</text><rect class="bxr" x="480" y="122" width="140" height="46" rx="8"/><text class="sm tk rej c" x="550" y="151">находит</text><rect class="bxr" x="628" y="122" width="140" height="46" rx="8"/><text class="sm tk rej c" x="698" y="151">находит</text><rect class="bxr" x="776" y="122" width="140" height="46" rx="8"/><text class="sm tk rej c" x="846" y="151">находит</text></g>
<g class="a e5"><text class="sm tk" x="40" y="196">разрез</text><text class="sm mu" x="40" y="216">104 + 146</text><rect class="bxo" x="184" y="176" width="140" height="46" rx="8"/><text class="sm tk ok c" x="254" y="205">не находит</text><rect class="bxr" x="332" y="176" width="140" height="46" rx="8"/><text class="sm tk rej c" x="402" y="205">находит</text><rect class="bxr" x="480" y="176" width="140" height="46" rx="8"/><text class="sm tk rej c" x="550" y="205">находит</text><rect class="bxr" x="628" y="176" width="140" height="46" rx="8"/><text class="sm tk rej c" x="698" y="205">находит</text><rect class="bxr" x="776" y="176" width="140" height="46" rx="8"/><text class="sm tk rej c" x="846" y="205">находит</text></g>
<g class="a e6"><text class="sm tk" x="40" y="250">перестановка</text><text class="sm mu" x="40" y="270">146, затем 104</text><rect class="bxo" x="184" y="230" width="140" height="46" rx="8"/><text class="sm tk ok c" x="254" y="259">не находит</text><rect class="bxo" x="332" y="230" width="140" height="46" rx="8"/><text class="sm tk ok c" x="402" y="259">не находит</text><rect class="bxr" x="480" y="230" width="140" height="46" rx="8"/><text class="sm tk rej c" x="550" y="259">находит</text><rect class="bxr" x="628" y="230" width="140" height="46" rx="8"/><text class="sm tk rej c" x="698" y="259">находит</text><rect class="bxo" x="776" y="230" width="140" height="46" rx="8"/><text class="sm tk ok c" x="846" y="259">не находит</text></g>
<g class="a e7"><text class="cap" x="40" y="304">онлайн, в роутере: игрушка блокирует по-настоящему, разрез</text></g>
<g class="a e8"><text class="sm tk" x="40" y="334">что получил</text><text class="sm tk" x="40" y="354">сервер</text><rect class="bxo" x="184" y="314" width="140" height="56" rx="8"/><text class="sm tk ok c" x="254" y="338">не нашла имя</text><text class="sm ok c" x="254" y="358">250 байт дошло</text><rect class="bxr" x="332" y="314" width="140" height="56" rx="8"/><text class="sm tk rej c" x="402" y="338">блок: 2-й пакет</text><text class="sm rej c" x="402" y="358">104 байта дошло</text><rect class="bxr" x="480" y="314" width="140" height="56" rx="8"/><text class="sm tk rej c" x="550" y="338">блок: 2-й пакет</text><text class="sm rej c" x="550" y="358">104 байта дошло</text><rect class="bxr" x="628" y="314" width="140" height="56" rx="8"/><text class="sm tk rej c" x="698" y="338">блок: 2-й пакет</text><text class="sm rej c" x="698" y="358">104 байта дошло</text><rect class="bxr" x="776" y="314" width="140" height="56" rx="8"/><text class="sm tk rej c" x="846" y="338">блок: 2-й пакет</text><text class="sm rej c" x="846" y="358">104 байта дошло</text></g>
<g class="a e9"><text class="tk c" x="480" y="408">Разрез обманул только игрушку, которая смотрит пакеты по одному.</text></g>
<g class="a e10"><text class="sm c" x="480" y="434">Стратегия, которая побеждает одного читателя, проигрывает другому: лекарства от всего нет.</text><text class="sm tk c" x="480" y="456">Какой из читателей похож на настоящее оборудование, мы не знаем.</text></g>
