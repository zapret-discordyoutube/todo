<svg xmlns="http://www.w3.org/2000/svg" class="v00-s04-dns-cases" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="v00-s04-dns-cases-t v00-s04-dns-cases-d">
<title id="v00-s04-dns-cases-t">Пять случаев с DNS</title>
<desc id="v00-s04-dns-cases-d">Пять случаев с DNS: подмену обычного DNS и перенаправление запросов zapret2 не лечит и помогает шифрованный DNS, шифрованный DNS, заблокированный по имени сервера, zapret2 может лечить как обычный сайт, при блоке по адресу сервера нужен другой справочник или туннель, а гео-блокировку лечит другой адрес, VPN или справочник проекта Zapret; блокировку шифрованного DNS мы в лаборатории не воспроизводили.</desc>
