<rect class="bg" x="0" y="0" width="960" height="470"/>
<g class="a e1"><rect class="bxa" x="40" y="8" width="157.2" height="24" rx="5"/><text class="cap acc" x="50" y="24.5">ДОКУМЕНТАЦИЯ</text><rect class="bxb" x="207" y="8" width="220.5" height="24" rx="5"/><text class="cap amb" x="217" y="24.5">ПО ОБЩИМ СВЕДЕНИЯМ</text></g>
<g class="a e2"><text class="cap" x="52" y="62">случай</text><text class="cap" x="424" y="62">поможет ли zapret2</text><text class="cap" x="636" y="62">что помогает</text></g>
<g class="a e3"><rect class="bx" x="40" y="72" width="360" height="60" rx="8"/><text class="tk sm" x="52" y="98">подмена обычного DNS</text><text class="sm mu" x="52" y="119">неверный адрес или «такого имени нет»</text><circle cx="386" cy="102" r="7" fill="var(--acc)"/><rect class="bxr" x="412" y="72" width="200" height="60" rx="8"/><text class="tk sm rej" x="424" y="98">нет:</text><text class="sm" x="424" y="119">ответ приходит из сети</text><rect class="bx" x="624" y="72" width="296" height="60" rx="8"/><text class="sm tk" x="636" y="98">шифрованный DNS:</text><text class="sm" x="636" y="119">DoH или DoT</text></g>
<g class="a e4"><rect class="bx" x="40" y="140" width="360" height="60" rx="8"/><text class="tk sm" x="52" y="166">запросы уходят к другому DNS</text><text class="sm mu" x="52" y="187">на вики описаны наблюдения</text><circle cx="386" cy="170" r="7" fill="var(--amb)"/><rect class="bxr" x="412" y="140" width="200" height="60" rx="8"/><text class="tk sm rej" x="424" y="166">нет:</text><text class="sm" x="424" y="187">соединения ещё нет</text><rect class="bx" x="624" y="140" width="296" height="60" rx="8"/><text class="sm tk" x="636" y="166">шифрованный DNS</text><text class="sm" x="636" y="187">на вики он не затронут</text></g>
<g class="a e5"><rect class="bx" x="40" y="208" width="360" height="60" rx="8"/><text class="tk sm" x="52" y="234">шифрованный DNS: блок по имени</text><text class="sm mu" x="52" y="255">соединение обрывают по имени сервера</text><circle cx="386" cy="238" r="7" fill="var(--amb)"/><rect class="bxo" x="412" y="208" width="200" height="60" rx="8"/><text class="tk sm ok" x="424" y="234">да,</text><text class="sm" x="424" y="255">как обычный сайт</text><rect class="bx" x="624" y="208" width="296" height="60" rx="8"/><text class="sm tk" x="636" y="234">имя справочника в список</text><text class="sm" x="636" y="255">имён и подбор стратегии</text></g>
<g class="a e6"><rect class="bx" x="40" y="276" width="360" height="60" rx="8"/><text class="tk sm" x="52" y="302">шифрованный DNS: блок по адресу</text><text class="sm mu" x="52" y="323">соединение не начинается</text><circle cx="386" cy="306" r="7" fill="var(--amb)"/><rect class="bxr" x="412" y="276" width="200" height="60" rx="8"/><text class="tk sm rej" x="424" y="302">нет:</text><text class="sm" x="424" y="323">менять нечего</text><rect class="bx" x="624" y="276" width="296" height="60" rx="8"/><text class="sm tk" x="636" y="302">другой справочник с другим</text><text class="sm" x="636" y="323">адресом или туннель</text></g>
<g class="a e7"><rect class="bx" x="40" y="344" width="360" height="60" rx="8"/><text class="tk sm" x="52" y="370">гео-блокировка</text><text class="sm mu" x="52" y="391">сервис сам не пускает адрес из страны</text><circle cx="386" cy="374" r="7" fill="var(--amb)"/><rect class="bxr" x="412" y="344" width="200" height="60" rx="8"/><text class="tk sm rej" x="424" y="370">нет:</text><text class="sm" x="424" y="391">адрес остаётся вашим</text><rect class="bx" x="624" y="344" width="296" height="60" rx="8"/><text class="sm tk" x="636" y="370">другой адрес: VPN или</text><text class="sm" x="636" y="391">справочник проекта Zapret</text></g>
<g class="a e8"><text class="sm mu" x="40" y="432">кружки: на чём держится строка (цвета как у плашек сверху)</text><text class="sm tk" x="40" y="454">блокировку шифрованного DNS по имени и по адресу в нашей лаборатории не воспроизводили</text></g>
</svg>
