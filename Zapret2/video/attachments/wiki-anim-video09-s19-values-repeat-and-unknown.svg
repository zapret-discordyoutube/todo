<g><text class="cap" x="40" y="22">куски приветствия при других значениях и повторы</text></g>
<g class="a e1"><text class="sm tk" x="40" y="44">расчёт, не опыт: где в этих кусках лежит имя (байты 97..111, считая с нуля)</text></g>
<g class="a e2"><rect class="bxb" x="40" y="56" width="6" height="34" rx="0"/><rect class="bxa" x="46" y="56" width="375.6" height="34" rx="0"/><text class="mk c" x="233.8" y="78">107</text><rect class="bxo" x="421.6" y="56" width="252.7" height="34" rx="0"/><text class="mk c" x="547.9" y="78">72</text><rect class="bxb" x="674.3" y="56" width="245.7" height="34" rx="0"/><text class="mk c" x="797.1" y="78">70</text><text class="ix mu" x="40" y="110">1</text></g>
<g class="a e3"><rect class="bxrd" x="383" y="52" width="52.7" height="42" rx="0"/><path class="lr" d="M421.6 44L421.6 102"/></g>
<g class="a e4"><text class="sm tk r" x="405.6" y="122">«www.example» в куске на 107</text><text class="sm tk" x="437.6" y="122">«.com» в куске на 72</text></g>
<g class="a e5"><text class="sm mu" x="40" y="144">читатель, который смотрит на пакеты по одному, целиком имя не увидит; запуска с игрушкой на этом у нас нет</text></g>
<g class="a e6"><text class="cap" x="40" y="176">строка запуска</text><text class="cap" x="330" y="176">SYN-ACK на проводе</text><text class="cap" x="570" y="176">куски клиента</text><text class="cap" x="770" y="176">первый байт</text><path class="lm" d="M40 184L920 184"/></g>
<g class="a e7"><rect class="bxa" x="40" y="192" width="880" height="34" rx="6"/><text class="ix fg tk" x="52" y="214">wsize:wsize=1:scale=6</text><text class="sm" x="330" y="214">окно 1, множитель 6</text><text class="mk" x="570" y="214">1 / 107 / 72 / 70</text><text class="sm" x="770" y="214">213,2-219,2 мс</text></g>
<g class="a e8"><rect class="bx" x="40" y="232" width="880" height="34" rx="6"/><text class="ix fg tk" x="52" y="254">wsize:wsize=2:scale=6</text><text class="sm" x="330" y="254">окно 2, множитель 6</text><text class="mk" x="570" y="254">2 / 106 / 72 / 70</text><text class="sm" x="770" y="254">215,2 мс</text></g>
<g class="a e9"><rect class="bx" x="40" y="272" width="880" height="34" rx="6"/><text class="ix fg tk" x="52" y="294">wsize:wsize=1:scale=3</text><text class="sm" x="330" y="294">окно 1, множитель 3</text><text class="mk" x="570" y="294">1 / 107 / 72 / 70</text><text class="sm" x="770" y="294">212,4 мс</text></g>
<g class="a e10"><rect class="bx" x="40" y="312" width="880" height="34" rx="6"/><text class="ix fg tk" x="52" y="334">wsize:wsize=1, без scale</text><text class="sm" x="330" y="334">окно 1, множитель 10</text><text class="mk" x="570" y="334">1 / 107 / 72 / 70</text><text class="sm" x="770" y="334">212,3 мс</text></g>
<g class="a e11"><rect class="bxb" x="40" y="352" width="880" height="34" rx="6"/><text class="ix fg tk" x="52" y="374">wsize:wsize=1:scale=0</text><text class="sm" x="330" y="374">окно 1, множитель 0</text><text class="mk" x="570" y="374">1 / 64 / 64 / 64 / 57</text><text class="sm" x="770" y="374">214,1 мс</text></g>
<g class="a e12"><rect class="bxb" x="40" y="392" width="880" height="34" rx="6"/><text class="ix fg tk" x="52" y="414">без сетевой задержки</text><text class="sm" x="330" y="414">окно 1, множитель 6</text><text class="mk" x="570" y="414">1 / 215 / 34</text><text class="sm" x="770" y="414">206,1 и 208,2 мс</text></g>
<g class="a e13"><text class="sm mu" x="40" y="440">множитель 0: по счёту окно сервера 64 байта, умноженное на один; без сетевой задержки круг 0, а не 10 мс</text></g>
<g class="a e14"><text class="sm mu" x="40" y="460">первый байт: время от ACK рукопожатия до первого байта приветствия</text></g>
<g class="a e15"><text class="cap" x="40" y="492">повтор: шесть запусков на сервере при круге 10 мс, пауза до первого байта</text></g>
<g class="a e16"><path class="lm" d="M60 544L900 544"/><path class="lm" d="M60 540L60 548"/><text class="ix mu c" x="60" y="566">210</text><path class="lm" d="M200 540L200 548"/><text class="ix mu c" x="200" y="566">212</text><path class="lm" d="M340 540L340 548"/><text class="ix mu c" x="340" y="566">214</text><path class="lm" d="M480 540L480 548"/><text class="ix mu c" x="480" y="566">216</text><path class="lm" d="M620 540L620 548"/><text class="ix mu c" x="620" y="566">218</text><path class="lm" d="M760 540L760 548"/><text class="ix mu c" x="760" y="566">220</text><path class="lm" d="M900 540L900 548"/><text class="ix mu c" x="900" y="566">222</text><circle class="bxa" cx="578" cy="532" r="6"/><circle class="bxa" cx="284" cy="532" r="6"/><circle class="bxa" cx="466" cy="532" r="6"/><circle class="bxa" cx="704" cy="532" r="6"/><circle class="bxa" cx="704" cy="518" r="6"/><circle class="bxa" cx="375" cy="532" r="6"/><text class="ix fg c" x="284" y="520">213,2</text><text class="ix fg c" x="375" y="520">214,5</text><text class="ix fg c" x="466" y="520">215,8</text><text class="ix fg c" x="578" y="520">217,4</text><text class="ix fg c" x="704" y="506">219,2 ×2</text></g>
<g class="a e17"><text class="sm tk" x="40" y="590">куски во всех шести запусках: 1, 107, 72, 70; без сетевой задержки они другие</text></g>
<g class="a e18"><rect class="bxg" x="40" y="612" width="880" height="82" rx="8"/><text class="cap" x="54" y="636">чего не знаем</text><text class="sm tk" x="54" y="658">почему именно 107, 72, 70 и почему первый байт ждёт почти 0,2 с: не нашли</text><text class="sm" x="54" y="680">по общим сведениям: пробный пакет по таймеру не короче 200 мс; это догадка, не измерение</text></g>
<g class="a e19"><rect class="bx" x="40" y="710" width="880" height="92" rx="8"/><text class="cap" x="54" y="734">проверь себя</text><text class="sm tk" x="54" y="758">окно в SYN-ACK стало 1, клиент хочет отправить 250 байт: сколько байт уйдёт в первом пакете?</text></g>
<g class="a e20 tr"><rect class="bxd" x="54" y="768" width="96" height="26" rx="6"/><text class="mk c" x="102" y="786">?</text></g>
<g class="a e21"><rect class="bxo" x="54" y="768" width="96" height="26" rx="6"/><text class="mk c" x="102" y="786">1</text><text class="sm" x="166" y="787">как в нашем запуске: остальное уйдёт только после подтверждения этого байта</text></g>
</svg>
