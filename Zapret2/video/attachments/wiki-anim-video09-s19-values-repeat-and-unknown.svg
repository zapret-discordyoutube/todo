<svg xmlns="http://www.w3.org/2000/svg" class="v09-s19-values-repeat-and-unknown" viewBox="0 0 960 818" width="960" height="818" role="img" aria-labelledby="v09-s19-values-repeat-and-unknown-t v09-s19-values-repeat-and-unknown-d">
<title id="v09-s19-values-repeat-and-unknown-t">Другие значения окна и чего мы не знаем</title>
<desc id="v09-s19-values-repeat-and-unknown-d">По счёту, а не по опыту, имя с байта 97 по 111 разрезано границей между вторым и третьим куском, 107 и 108, «www.example» остаётся в куске в 107 байт, а «.com» уходит в кусок в 72 байта, при окне 2 куски 2, 106, 72 и 70, при множителе 3 и без множителя те же 1, 107, 72 и 70, только множитель 0 даёт 1, 64, 64, 64 и 57, без сетевой задержки куски 1, 215 и 34, а в шести запусках на сервере первый байт ждал от 213,2 до 219,2 мс, причину этих размеров и паузы мы не нашли.</desc>
