<g class="a e3"><text class="sm tk" x="40" y="196">как пакет</text><text class="sm tk" x="40" y="216">возвращается</text><rect class="bx" x="218" y="168" width="224" height="70" rx="6"/><text class="sm" x="230" y="194">вердикт ядру</text><rect class="bx" x="450" y="168" width="224" height="70" rx="6"/><text class="sm" x="462" y="194">sendto обратно</text><text class="sm" x="462" y="214">в тот же сокет</text><rect class="bx" x="682" y="168" width="224" height="70" rx="6"/><text class="sm" x="694" y="194">windivert_send</text></g>
