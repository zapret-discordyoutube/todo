<svg xmlns="http://www.w3.org/2000/svg" class="v16-s27-three-compare" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="v16-s27-three-compare-t v16-s27-three-compare-d">
<title id="v16-s27-three-compare-t">Linux, BSD, Windows: что общего и что разное</title>
<desc id="v16-s27-three-compare-d">Что общего у трёх вариантов программы и чем они различаются; BSD и Windows известны только по чтению кода, не запускали. Таблица Linux, BSD, Windows. Как пакет попадает в программу: Linux, правило ядра и очередь NFQUEUE; BSD, правило ipfw или pf и divert-сокет; Windows, драйвер WinDivert с фильтром и пачками. Как возвращается: Linux, вердикт ядру; BSD, sendto обратно в тот же сокет; Windows, windivert_send. Защита от петли: Linux, метка и три преграды; BSD, в правилах ipfw из документации есть условие not diverted, роль SO_USER_COOKIE в защите не выяснена, pf на FreeBSD по документации непригоден из-за защиты от петли, на OpenBSD её защита работает; Windows, фильтр !impostor и проверка флага в цикле, роль не выяснена. Ограничитель «первые N пакетов»: на Linux есть, в правиле ядра; на BSD и Windows нет. В середине один общий код: проходная, движок и вердикты те же; различается только способ вернуть пакет, на Linux вердикт ядру, на BSD и Windows отправка обратно. Из документации (readme.md:102-105): ipfw, pf и WinDivert не умеют ограничивать по номеру пакета в соединении; если перехватывать порт целиком, весь поток этого направления идёт в программу, а это нагрузка на процессор; для Windows советуют писать собственные фильтры WinDivert, которые хотя бы частично проверяют тип нагрузки, остальное досеивает winws2. Это слова документации, мы их не проверяли.</desc>
