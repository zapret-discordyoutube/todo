<g class="a e5"><text class="sm tk" x="40" y="392">ограничитель</text><text class="sm tk" x="40" y="412">«первые N пакетов»</text><rect class="bxo" x="218" y="364" width="224" height="70" rx="6"/><text class="sm" x="230" y="390">есть, в правиле</text><text class="sm" x="230" y="410">ядра</text><rect class="bxr" x="450" y="364" width="224" height="70" rx="6"/><text class="sm" x="462" y="390">нет</text><rect class="bxr" x="682" y="364" width="224" height="70" rx="6"/><text class="sm" x="694" y="390">нет</text></g>
<g class="a e6"><rect class="bxa" x="40" y="472" width="880" height="46" rx="8"/><text class="sm tk c" x="480" y="501">проходная, движок и вердикты: один и тот же код во всех трёх</text><path class="lf" d="M330 440L330 461"/><polygon class="hf" points="330,471 325,461 335,461"/><path class="lf" d="M562 440L562 461"/><polygon class="hf" points="562,471 557,461 567,461"/><path class="lf" d="M794 440L794 461"/><polygon class="hf" points="794,471 789,461 799,461"/></g>
<g class="a e7"><text class="sm" x="40" y="542">Различается способ вернуть пакет: на Linux вердикт ядру, на BSD и Windows отправка обратно.</text><text class="sm mu" x="40" y="564">По документации: pf на FreeBSD из-за защиты от петли непригоден, на OpenBSD её защита работает.</text></g>
<g class="a e8"><rect class="bxs" x="40" y="584" width="880" height="108" rx="8"/><text class="sm tk" x="56" y="608">Из документации (readme.md:102-105), мы это не проверяли:</text><text class="sm" x="56" y="630">ipfw, pf и WinDivert не умеют ограничивать по номеру пакета в соединении;</text><text class="sm" x="56" y="650">при перехвате порта целиком весь поток направления идёт в программу, а это нагрузка</text><text class="sm" x="56" y="670">на процессор. Для Windows советуют свои фильтры WinDivert, остальное досеивает winws2.</text></g>
