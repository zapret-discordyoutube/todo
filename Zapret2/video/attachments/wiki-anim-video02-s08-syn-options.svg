le>
<rect class="bg" x="0" y="0" width="960" height="400"/>
<g class="a e1"><text class="cap" x="10" y="24">опции в SYN клиента: 20 байт, hex</text></g>
<g class="a e2"><text class="mt mu" x="10" y="62">опция 1</text><rect class="bxa" x="96" y="42" width="38" height="28" rx="4"/><text class="mk c" x="115" y="62">02</text><rect class="bxa" x="138" y="42" width="38" height="28" rx="4"/><text class="mk c" x="157" y="62">04</text><rect class="bxa" x="180" y="42" width="38" height="28" rx="4"/><text class="mk c" x="199" y="62">05</text><rect class="bxa" x="222" y="42" width="38" height="28" rx="4"/><text class="mk c" x="241" y="62">b4</text><text x="276" y="62">MSS: <tspan class="hb">1460</tspan><tspan class="mu"> = 1500 − 20 − 20</tspan></text></g>
<g class="a e3"><text class="mt mu" x="10" y="100">опция 2</text><rect class="bx" x="96" y="80" width="38" height="28" rx="4"/><text class="mk c" x="115" y="100">04</text><rect class="bx" x="138" y="80" width="38" height="28" rx="4"/><text class="mk c" x="157" y="100">02</text><text x="192" y="100"><tspan class="hb">SACK разрешён</tspan><tspan class="mu">: можно подтверждать выборочно</tspan></text></g>
<g class="a e4"><text class="mt mu" x="10" y="138">опция 3</text><rect class="bx" x="96" y="118" width="38" height="28" rx="4"/><text class="mk c" x="115" y="138">08</text><rect class="bx" x="138" y="118" width="38" height="28" rx="4"/><text class="mk c" x="157" y="138">0a</text><rect class="bx" x="180" y="118" width="38" height="28" rx="4"/><text class="mk c" x="199" y="138">42</text><rect class="bx" x="222" y="118" width="38" height="28" rx="4"/><text class="mk c" x="241" y="138">59</text><rect class="bx" x="264" y="118" width="38" height="28" rx="4"/><text class="mk c" x="283" y="138">ec</text><rect class="bx" x="306" y="118" width="38" height="28" rx="4"/><text class="mk c" x="325" y="138">af</text><rect class="bx" x="348" y="118" width="38" height="28" rx="4"/><text class="mk c" x="367" y="138">00</text><rect class="bx" x="390" y="118" width="38" height="28" rx="4"/><text class="mk c" x="409" y="138">00</text><rect class="bx" x="432" y="118" width="38" height="28" rx="4"/><text class="mk c" x="451" y="138">00</text><rect class="bx" x="474" y="118" width="38" height="28" rx="4"/><text class="mk c" x="493" y="138">00</text><text x="528" y="138"><tspan class="hb">метка времени</tspan><tspan class="mu">: часы клиента</tspan></text></g>
<g class="a e5"><text class="mt mu" x="10" y="176">опция 4</text><rect class="bx" x="96" y="156" width="38" height="28" rx="4"/><text class="mk c" x="115" y="176">01</text><text x="150" y="176"><tspan class="hb">пустой байт</tspan><tspan class="mu"> для выравнивания</tspan></text></g>
<g class="a e6"><text class="mt mu" x="10" y="214">опция 5</text><rect class="bx" x="96" y="194" width="38" height="28" rx="4"/><text class="mk c" x="115" y="214">03</text><rect class="bx" x="138" y="194" width="38" height="28" rx="4"/><text class="mk c" x="157" y="214">03</text><rect class="bx" x="180" y="194" width="38" height="28" rx="4"/><text class="mk c" x="199" y="214">0a</text><text x="234" y="214">масштаб окна: <tspan class="hb">10</tspan></text></g>
<g class="a e7"><text class="cap" x="10" y="256">ответ сервера: SYN-ACK называет те же пять</text></g>
<g class="a e8"><rect class="bxo" x="10" y="268" width="110" height="32" rx="6"/><text class="sm c" x="65.0" y="289">MSS 1460</text><rect class="bxo" x="132" y="268" width="80" height="32" rx="6"/><text class="sm c" x="172.0" y="289">SACK</text><rect class="bxo" x="224" y="268" width="150" height="32" rx="6"/><text class="sm c" x="299.0" y="289">метка времени</text><rect class="bxo" x="386" y="268" width="130" height="32" rx="6"/><text class="sm c" x="451.0" y="289">пустой байт</text><rect class="bxo" x="528" y="268" width="130" height="32" rx="6"/><text class="sm c" x="593.0" y="289">масштаб 10</text></g>
<g class="a e9"><text class="sm mu" x="10" y="326">у сервера в метке времени свои часы и эхо часов клиента: 83 00 4c 89 и 42 59 ec af</text></g>
<g class="a e10"><rect class="bxb" x="10" y="342" width="940" height="38" rx="8"/><text class="tk" x="24" y="367">Именно в рукопожатии стороны сообщают друг другу о своих возможностях.</text></g>
</svg>
