<svg xmlns="http://www.w3.org/2000/svg" class="v02-s08-syn-options" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="v02-s08-syn-options-t v02-s08-syn-options-d">
<title id="v02-s08-syn-options-t">Опции SYN</title>
<desc id="v02-s08-syn-options-d">Двадцать байт опций в SYN клиента в hex: MSS 1460 (1500 минус 20 минус 20), разрешение выборочного подтверждения SACK, метка времени, пустой байт для выравнивания и масштаб окна 10; SYN-ACK сервера называет те же пять опций.</desc>
<style>.v02-s08-syn-options{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s08-syn-options{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v02-s08-syn-options .bg{fill:var(--bg)}
.v02-s08-syn-options text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v02-s08-syn-options .tk{font-weight:600;fill:var(--fg)}
.v02-s08-syn-options .sm{font-size:14.5px}
.v02-s08-syn-options .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v02-s08-syn-options .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v02-s08-syn-options .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v02-s08-syn-options .mt{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px}
.v02-s08-syn-options .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s08-syn-options .mu{fill:var(--mute)}.v02-s08-syn-options .fg{fill:var(--fg)}.v02-s08-syn-options .acc{fill:var(--acc)}.v02-s08-syn-options .rej{fill:var(--rej)}.v02-s08-syn-options .ok{fill:var(--ok)}.v02-s08-syn-options .amb{fill:var(--amb)}
.v02-s08-syn-options .hb{fill:var(--acc);font-weight:700}.v02-s08-syn-options .hbr{fill:var(--rej);font-weight:700}.v02-s08-syn-options .hbo{fill:var(--ok);font-weight:700}.v02-s08-syn-options .hbb{fill:var(--amb);font-weight:700}
.v02-s08-syn-options .c{text-anchor:middle}.v02-s08-syn-options .r{text-anchor:end}
.v02-s08-syn-options .nos{stroke:none}
.v02-s08-syn-options .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s08-syn-options .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v02-s08-syn-options .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v02-s08-syn-options .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v02-s08-syn-options .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v02-s08-syn-options .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v02-s08-syn-options .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v02-s08-syn-options .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v02-s08-syn-options .fa{fill:var(--acc);stroke:none}
.v02-s08-syn-options .fo{fill:var(--ok);stroke:none}
.v02-s08-syn-options .fr{fill:var(--rej);stroke:none}
.v02-s08-syn-options .fm{fill:var(--line);stroke:none}
.v02-s08-syn-options .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s08-syn-options .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s08-syn-options .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s08-syn-options .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s08-syn-options .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s08-syn-options .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s08-syn-options .hf{fill:var(--fg2)}.v02-s08-syn-options .ha{fill:var(--acc)}.v02-s08-syn-options .hr{fill:var(--rej)}.v02-s08-syn-options .hm{fill:var(--mute)}.v02-s08-syn-options .ho{fill:var(--ok)}
.v02-s08-syn-options .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v02-s08-syn-options .a{animation-duration:34s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s08-syn-options .a{animation:none}.v02-s08-syn-options .tr{display:none}}
