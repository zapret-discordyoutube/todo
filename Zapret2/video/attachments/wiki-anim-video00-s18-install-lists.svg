<svg xmlns="http://www.w3.org/2000/svg" class="v00-s18-install-lists" viewBox="0 0 960 534" width="960" height="534" role="img" aria-labelledby="v00-s18-install-lists-t v00-s18-install-lists-d">
<title id="v00-s18-install-lists-t">Установка и списки</title>
<desc id="v00-s18-install-lists-d">Установщик в диалоге спрашивает про файервол, IPv6 и режим списков и подключается к вашей системе запуска, настройки лежат в файле настроек, где из коробки программа выключена, рядом лежат загрузчики списков имён из сторонних источников и два малых инструмента: mdig превращает длинные списки доменов в адреса, а ip2net собирает длинный список адресов в короткий список подсетей.</desc>
<style>.v00-s18-install-lists{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
