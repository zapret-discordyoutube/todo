.v00-s18-install-lists .lgr{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;font-weight:600;fill:var(--rej);stroke:none}
.v00-s18-install-lists .lga{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;font-weight:600;fill:var(--ok);stroke:none}
.v00-s18-install-lists .dk{fill:var(--fg2);stroke:var(--fg);stroke-width:1.4}
.v00-s18-install-lists .inv{fill:var(--bg);stroke:none}
