<rect class="bg" x="0" y="0" width="960" height="534"/>
<g><text class="cap" x="24" y="24">установка: настройки, запуск, списки</text></g>
<g class="a e1"><rect class="bx" x="24" y="40" width="480" height="340" rx="8"/><text class="sm tk" x="40" y="66">в папке проекта</text></g>
<g class="a e2"><rect class="bxa" x="34" y="78" width="460" height="42" rx="6"/><text class="lgk" x="46" y="95">install_easy.sh</text><text class="sm" x="46" y="113">установщик с вопросами</text></g>
<g class="a e3"><rect class="bxa" x="34" y="126" width="460" height="42" rx="6"/><text class="lgk" x="46" y="143">config.default</text><text class="sm" x="46" y="161">настройки для скриптов запуска</text></g>
<g class="a e4"><rect class="bxa" x="34" y="174" width="460" height="42" rx="6"/><text class="lgk" x="46" y="191">init.d/</text><text class="sm" x="46" y="209">скрипты запуска для вашей системы</text></g>
<g class="a e5"><rect class="bxa" x="34" y="222" width="460" height="42" rx="6"/><text class="lgk" x="46" y="239">ipset/</text><text class="sm" x="46" y="257">загрузчики списков имён и адресов</text></g>
<g class="a e6"><rect class="bxs" x="34" y="270" width="460" height="42" rx="6"/><text class="lgk" x="46" y="287">mdig/</text><text class="sm" x="46" y="305">длинные списки доменов в адреса</text></g>
<g class="a e7"><rect class="bxs" x="34" y="318" width="460" height="42" rx="6"/><text class="lgk" x="46" y="335">ip2net/</text><text class="sm" x="46" y="353">длинный список адресов в короткий список подсетей</text></g>
<g class="a e8"><rect class="bx" x="520" y="40" width="416" height="196" rx="8"/><text class="sm tk" x="536" y="66">настройки из коробки</text></g>
<g class="a e9"><rect class="bxr" x="530" y="78" width="396" height="44" rx="6"/><text class="lgk" x="542" y="96">NFQWS2_ENABLE=0</text><text class="sm" x="542" y="114">программа выключена, пока вы не включите</text></g>
<g class="a e10"><rect class="bx" x="530" y="128" width="396" height="44" rx="6"/><text class="lgk" x="542" y="146">MODE_FILTER=none</text><text class="sm" x="542" y="164">фильтра по спискам из коробки нет</text></g>
<g class="a e11"><rect class="bx" x="530" y="178" width="396" height="44" rx="6"/><text class="lgk" x="542" y="196">DISABLE_IPV6=1</text><text class="sm" x="542" y="214">IPv6 из коробки не обрабатывается</text></g>
<g class="a e12"><rect class="bx" x="520" y="246" width="416" height="134" rx="8"/><text class="sm tk" x="536" y="272">установщик в диалоге спрашивает</text></g>
<g class="a e13"><rect class="bxb" x="536" y="282" width="102" height="28" rx="14"/><text class="sm tk c" x="587" y="301">файервол</text></g>
<g class="a e14"><rect class="bxb" x="646" y="282" width="54" height="28" rx="14"/><text class="sm tk c" x="673" y="301">IPv6</text></g>
<g class="a e15"><rect class="bxb" x="708" y="282" width="146" height="28" rx="14"/><text class="sm tk c" x="781" y="301">режим списков</text></g>
<g class="a e16"><rect class="bxb" x="536" y="316" width="200" height="28" rx="14"/><text class="sm tk c" x="636" y="335">какой список скачать</text></g>
<g class="a e17"><text class="sm" x="536" y="364">и подключается к вашей системе запуска</text></g>
<g class="a e18"><rect class="gr" x="24" y="396" width="912" height="118" rx="8"/><text class="sm tk" x="40" y="422">в ipset/ лежат загрузчики списков, вот несколько имён файлов</text></g>
<g class="a e19"><rect class="bx" x="40" y="436" width="212" height="28" rx="5"/><text class="lgk" x="48" y="455">get_antizapret_domains.sh</text><rect class="bx" x="262" y="436" width="196" height="28" rx="5"/><text class="lgk" x="270" y="455">get_refilter_domains.sh</text><rect class="bx" x="468" y="436" width="173" height="28" rx="5"/><text class="lgk" x="476" y="455">get_antifilter_ip.sh</text><rect class="bx" x="651" y="436" width="102" height="28" rx="5"/><text class="lgk" x="659" y="455">get_user.sh</text></g>
<g class="a e20"><rect class="bx" x="40" y="472" width="126" height="28" rx="5"/><text class="lgk" x="48" y="491">get_exclude.sh</text><rect class="bx" x="176" y="472" width="133" height="28" rx="5"/><text class="lgk" x="184" y="491">create_ipset.sh</text><rect class="bx" x="319" y="472" width="126" height="28" rx="5"/><text class="lgk" x="327" y="491">clear_lists.sh</text></g>
<g class="a e21"><rect class="bxd" x="570" y="472" width="358" height="34" rx="8"/><text class="sm tk c" x="749" y="484">источники списков сторонние,</text><text class="sm tk c" x="749" y="504">мы за них не ручаемся</text></g>
</svg>
