<title id="v00-s01-tool-not-button-t">Инструмент, а не кнопка</title>
<desc id="v00-s01-tool-not-button-d">Оговорка: zapret2 это инструмент для энтузиастов, а не готовое решение для чайников, поэтому вместо одной кнопки обхода нужен набор инструментов и цикл из трёх шагов, выбрать приём, проверить у себя и смотреть результат, потому что блокирующие меняют поведение и результат проверяют, а не обещают.</desc>
