.v00-s14-args-cheatsheet .lgc{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--acc);stroke:none}
.v00-s14-args-cheatsheet .lgl{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--ok);stroke:none}
.v00-s14-args-cheatsheet .lgk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;font-weight:600;fill:var(--fg);stroke:none}
.v00-s14-args-cheatsheet .dk{fill:var(--fg2);stroke:var(--fg);stroke-width:1.4}
.v00-s14-args-cheatsheet .inv{fill:var(--bg);stroke:none}
.v00-s14-args-cheatsheet .invm{fill:var(--bg);fill-opacity:.8;stroke:none}
.v00-s14-args-cheatsheet .gr{fill:var(--mute);fill-opacity:.12;stroke:var(--line);stroke-width:1.2}
