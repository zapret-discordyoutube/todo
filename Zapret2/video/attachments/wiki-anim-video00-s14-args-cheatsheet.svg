<rect class="bg" x="0" y="0" width="960" height="680"/>
<g><text class="cap" x="24" y="24">аргументы стратегии: общая шпаргалка</text></g>
<g class="a e1"><text class="sm tk" x="24" y="58">аргументы пишут сразу после имени стратегии, через двоеточие</text></g>
<g class="a e2"><rect class="bx" x="24" y="70" width="114" height="26" rx="5"/><text class="lgk" x="30" y="88">--lua-desync=</text><rect class="bxo" x="142" y="70" width="43" height="26" rx="5"/><text class="lgk" x="148" y="88">fake</text><rect class="bxb" x="189" y="70" width="184" height="26" rx="5"/><text class="lgk" x="195" y="88">:blob=fake_default_tls</text><rect class="bxb" x="377" y="70" width="75" height="26" rx="5"/><text class="lgk" x="383" y="88">:tcp_md5</text></g>
<g class="a e3"><path class="lm" d="M142 102L185 102"/><text class="sm mu c" x="163.5" y="122">имя стратегии</text><path class="lm" d="M189 102L452 102"/><text class="sm mu c" x="320.5" y="122">аргументы</text></g>
<g class="a e4"><text class="sm tk" x="24" y="144">четыре главных, их разберём сейчас</text></g>
<g class="a e5"><rect class="bxa" x="24" y="152" width="912" height="44" rx="8"/><text class="mk" x="40" y="179">dir</text><text class="sm" x="172" y="179">в какую сторону пакеты трогать: от клиента или к клиенту</text></g>
<g class="a e6"><rect class="bxa" x="24" y="202" width="912" height="92" rx="8"/><text class="sm tk" x="40" y="229">обманки</text><text class="sm" x="172" y="229">по-научному fooling: изменения, после которых получатель пакет игнорирует</text></g>
<g class="a e7"><rect class="bxb" x="172" y="242" width="190" height="40" rx="6"/><text class="lgk" x="180" y="258">ip_ttl</text><text class="sm" x="180" y="275">короткое время жизни</text><rect class="bxb" x="372" y="242" width="120" height="40" rx="6"/><text class="lgk" x="380" y="258">tcp_md5</text><text class="sm" x="380" y="275">опция MD5</text><rect class="bxb" x="502" y="242" width="275" height="40" rx="6"/><text class="lgk" x="510" y="258">badsum</text><text class="sm" x="510" y="275">испорченная контрольная сумма</text><rect class="bxb" x="787" y="242" width="130" height="40" rx="6"/><text class="lgk" x="795" y="258">tcp_seq</text><text class="sm" x="795" y="275">сдвиг номеров</text></g>
<g class="a e8"><rect class="bxa" x="24" y="300" width="912" height="44" rx="8"/><text class="mk" x="40" y="327">repeats</text><text class="sm" x="172" y="327">отправить пакет несколько раз</text></g>
<g class="a e9"><rect class="bxa" x="24" y="350" width="912" height="44" rx="8"/><text class="mk" x="40" y="377">pos</text><text class="sm" x="172" y="377">список меток, где резать, о них дальше</text></g>
<g class="a e10"><text class="sm tk" x="24" y="422">ещё четыре, коротко</text></g>
<g class="a e11"><rect class="bx" x="24" y="434" width="912" height="44" rx="8"/><text class="mk" x="40" y="461">payload</text><text class="sm" x="172" y="461">второй фильтр по виду данных: страховка от ошибки в строке</text></g>
<g class="a e12"><rect class="bx" x="24" y="484" width="912" height="44" rx="8"/><text class="mk" x="40" y="511">blob</text><text class="sm" x="172" y="511">чем заполнить поддельный пакет</text></g>
<g class="a e13"><rect class="bx" x="24" y="534" width="912" height="44" rx="8"/><text class="mk" x="40" y="561">nodrop</text><text class="sm" x="172" y="561">не выбрасывать оригинал, когда стратегия посылает свои куски</text></g>
<g class="a e14"><rect class="bx" x="24" y="584" width="912" height="44" rx="8"/><text class="mk" x="40" y="611">seqovl</text><text class="sm" x="172" y="611">перекрытие номеров: сейчас нужно только название</text></g>
<g class="a e15"><text class="sm tk" x="24" y="656">у отдельных стратегий есть и особые аргументы, но этого набора хватает, чтобы читать строку</text></g>
</svg>
