.v00-s14-args-cheatsheet .hf{fill:var(--fg2)}.v00-s14-args-cheatsheet .ha{fill:var(--acc)}.v00-s14-args-cheatsheet .hr{fill:var(--rej)}.v00-s14-args-cheatsheet .hm{fill:var(--mute)}.v00-s14-args-cheatsheet .hb{fill:var(--amb)}
