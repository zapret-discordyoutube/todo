<g class="a e16"><rect class="bx" x="40" y="414" width="880" height="52" rx="6"/><text class="ix" x="54" y="436">1941</text><text class="m" x="104" y="436">*sock = rawsend_socket_raw(family, IPPROTO_RAW);</text><text class="ix mu" x="104" y="456">ветка Linux</text><text class="tk sm r" x="908" y="436">протокол IPPROTO_RAW</text></g>
<g class="a e17"><rect class="bx" x="40" y="474" width="880" height="52" rx="6"/><text class="ix" x="54" y="496">2032</text><text class="m" x="104" y="496">bytes = sendto(sock, data, len, 0, ...);</text><text class="ix mu" x="104" y="516">начинается с заголовка IP; строка сокращена</text><text class="tk sm r" x="908" y="496">уходит буфер data длиной len</text></g>
<g class="a e18"><rect class="bxd" x="40" y="536" width="880" height="50" rx="8"/><text class="sm" x="54" y="558">зачем: наше объяснение, не цитата из кода. Программе нужны пакеты с полями, которые выбрала она,</text><text class="sm" x="54" y="577">например часть запроса с нужным порядковым номером; обычный сокет поставил бы свои значения.</text></g>
