<svg xmlns="http://www.w3.org/2000/svg" class="v16-s20-ordinary-vs-raw" viewBox="0 0 960 598" width="960" height="598" role="img" aria-labelledby="v16-s20-ordinary-vs-raw-t v16-s20-ordinary-vs-raw-d">
<title id="v16-s20-ordinary-vs-raw-t">Обычная и сырая отправка</title>
<desc id="v16-s20-ordinary-vs-raw-d">Обычная и сырая отправка пакета. Игрушечный пример с почтой, не данные лаборатории: обычное письмо вы приносите на почту только с вложением, а конверт, адреса и номер оформляет отделение; можно принести конверт, оформленный целиком, тогда на нём всё решаете вы. С пакетами так же, по общим сведениям о Linux, не по цитате из кода: через обычный сокет программа отдаёт ядру только данные, заголовки IP и TCP строит ядро; сырой сокет принимает пакет целиком, начиная с заголовка IP, который собрала сама программа. В коде nfqws2 (nfq2/darkmagic.c): сокет создаётся с типом SOCK_RAW (строка 1881, функция rawsend_socket_raw), для Linux с протоколом IPPROTO_RAW (1941), а в отправку sendto уходит буфер data длиной len, который начинается с заголовка IP (2032). Зачем это программе, наше объяснение, не цитата из кода: ей нужны пакеты с полями, которые выбрала она сама, например часть запроса с нужным порядковым номером, а обычный сокет поставил бы свои значения.</desc>
