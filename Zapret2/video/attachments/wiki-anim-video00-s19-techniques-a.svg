<svg xmlns="http://www.w3.org/2000/svg" class="v00-s19-techniques-a" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="v00-s19-techniques-a-t v00-s19-techniques-a-d">
<title id="v00-s19-techniques-a-t">Первые три приёма</title>
<desc id="v00-s19-techniques-a-d">Первые три приёма идут цепочкой: метки нужны перед выпуском про разрезание на части, он нужен перед выпуском про перестановку, а выпуск про фейк и его условия объясняет, чем подделка должна отличаться от настоящего пакета, и от него стрелки лишь намечены дальше.</desc>
