<rect class="bg" x="0" y="0" width="960" height="446"/>
<g><text class="cap" x="24" y="24">приёмы: первые три выпуска</text></g>
<g class="a e1"><rect class="bxa" x="24" y="42" width="191" height="26" rx="13.0"/><text class="sm tk c" x="119.5" y="60">«Где резать: метки»</text></g>
<g class="a e2"><rect class="bxo" x="24" y="112" width="280" height="226" rx="8"/><text class="tk" x="38" y="140">«multisplit: резать на</text><text class="tk" x="38" y="160">части»</text><text class="sm mu" x="38" y="184">как одно приветствие</text><text class="sm mu" x="38" y="204">становится несколькими</text><text class="sm mu" x="38" y="224">пакетами и что лежит в</text><text class="sm mu" x="38" y="244">каждом?</text><text class="sm tk acc" x="38" y="272">после выпуска вы сможете:</text><text class="sm" x="38" y="294">сказать, что в каком пакете</text></g>
<g class="a e3"><rect class="bxo" x="340" y="112" width="280" height="226" rx="8"/><text class="tk" x="354" y="140">«Перемешать: disorder»</text><text class="sm mu" x="354" y="164">что будет, если конец</text><text class="sm mu" x="354" y="184">отправить раньше начала?</text><text class="sm tk acc" x="354" y="212">после выпуска вы сможете:</text><text class="sm" x="354" y="234">прочесть в записи пакетов</text><text class="sm" x="354" y="254">ответ сервера с пометкой SACK</text><text class="sm" x="354" y="274">и понять, почему получатель</text><text class="sm" x="354" y="294">всё равно соберёт сообщение</text></g>
<g class="a e4"><rect class="bxo" x="656" y="112" width="280" height="226" rx="8"/><text class="tk" x="670" y="140">«Фейк и его условия»</text><text class="sm mu" x="670" y="164">чем подделка должна</text><text class="sm mu" x="670" y="184">отличаться от настоящего</text><text class="sm mu" x="670" y="204">пакета, чтобы один читатель её</text><text class="sm mu" x="670" y="224">принял, а другой отбросил?</text><text class="sm tk acc" x="670" y="252">после выпуска вы сможете:</text><text class="sm" x="670" y="274">понять, какие обманки,</text><text class="sm" x="670" y="294">по-научному fooling, за что</text><text class="sm" x="670" y="314">отвечают</text></g>
<g class="a e5"><path class="lf" d="M64 70L64.0 100.0"/><polygon class="hf" points="64,110 59.0,100.0 69.0,100.0"/><text class="sm mu" x="78" y="98">нужны перед</text></g>
<g class="a e6"><path class="lf" d="M306 152L328.0 152.0"/><polygon class="hf" points="338,152 328.0,157.0 328.0,147.0"/></g>
<g class="a e7"><path class="lmd" d="M642.5 338L642.5 364"/><path class="lmd" d="M843.5 338L843.5 364"/></g>
<g class="a e8"><rect class="bxg" x="546" y="364" width="193" height="26" rx="13.0"/><text class="sm c" x="642.5" y="382">резать и подделывать</text><rect class="bxg" x="751" y="364" width="185" height="26" rx="13.0"/><text class="sm c" x="843.5" y="382">фокусы рукопожатия</text></g>
<g class="a e9"><text class="sm mu" x="24" y="426">пунктиром намечено, куда ведёт фейк: подробнее в следующей части</text></g>
</svg>
