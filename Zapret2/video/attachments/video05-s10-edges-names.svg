<g class="a e24"><text class="sm" x="40" y="452">86 + 6 + 5 + 4 + 3 + 4 + 4 + 138 = 250. Самый маленький пакет 3 байта (exa).</text><text class="sm mu" x="40" y="474">Сервер нашей лаборатории принял все восемь. Смысл имён: выпуск «Где резать: метки».</text></g>
