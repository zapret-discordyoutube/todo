<svg xmlns="http://www.w3.org/2000/svg" class="v05-s10-edges-names" viewBox="0 0 960 492" width="960" height="492" role="img" aria-labelledby="v05-s10-edges-names-t v05-s10-edges-names-d">
<title id="v05-s10-edges-names-t">Края данных и семь имён подряд</title>
<desc id="v05-s10-edges-names-d">Края данных и семь меток подряд на нашем приветствии в 250 байт: pos=1 даёт части 1 и 249 байт с номерами 1 и 2, pos=249 даёт 249 и 1 с номерами 1 и 250, pos=-10 считается от конца (250 минус 10 равно 240) и даёт 240 и 10 с номерами 1 и 241, а семь меток extlen, sniext, host, sld, midsld, endsld и endhost с позициями 86, 92, 97, 101, 104, 108 и 112 дают семь разрезов и восемь пакетов по 86, 6, 5, 4, 3, 4, 4 и 138 байт, где самый маленький в 3 байта это exa; пустых частей не бывает, а коротких бывает сколько угодно.</desc>
<style>.v05-s10-edges-names{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
