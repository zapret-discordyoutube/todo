<svg xmlns="http://www.w3.org/2000/svg" class="v00-s17-handshake" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="v00-s17-handshake-t v00-s17-handshake-d">
<title id="v00-s17-handshake-t">Фокусы рукопожатия и игрушечный инспектор</title>
<desc id="v00-s17-handshake-d">Фокусы рукопожатия работают в первых служебных пакетах соединения, до данных, и в нашем тесте игрушечный инспектор, решающий по первому пакету с данными, без приёма видит имя в приветствии и блокирует соединение, сервер получает ноль байт, а когда клиент прислал SYN с шестнадцатью байтами данных, инспектор не находит там имени, объявляет соединение чистым и больше не проверяет, и сервер получает все 250 байт; игрушка поумнее, которая данные в SYN игнорирует, всё равно блокирует.</desc>
<style>.v00-s17-handshake{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
