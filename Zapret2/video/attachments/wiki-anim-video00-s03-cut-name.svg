<title id="v00-s03-cut-name-t">Разрез: имя перерезано пополам</title>
<desc id="v00-s03-cut-name-d">Стратегия разрез: zapret2 на клиенте режет приветствие из 250 байт на две части по 104 и 146 байт так, что имя сайта оказывается перерезано между первыми семью и последними восемью байтами, и ни в одной части нет всех 15 байт имени; в нашем тесте правило игрушечного инспектора с выбросом и с сбросом насчитало 0 пакетов, а сервер получил все 250 байт и собрал запрос.</desc>
