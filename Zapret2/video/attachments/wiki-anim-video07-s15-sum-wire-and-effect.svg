<svg xmlns="http://www.w3.org/2000/svg" class="v07-s15-sum-wire-and-effect" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="v07-s15-sum-wire-and-effect-t v07-s15-sum-wire-and-effect-d">
<title id="v07-s15-sum-wire-and-effect-t">Испорченная контрольная сумма на проводе и у получателя</title>
<desc id="v07-s15-sum-wire-and-effect-d">Подделка с испорченной контрольной суммой TCP из одного опыта: в заголовке стоит число 0x96c4, а пересчёт по адресам, заголовку и данным даёт 0xbb31, у настоящего приветствия сумма сходится, подделка с неверной суммой видна во всех четырёх точках записи, получатель её выбросил, и у него выросли счётчики Tcp:InErrs и Tcp:InCsumErrors с 0 до 1, а игрушечный инспектор суммы не смотрит и разрешил соединение.</desc>
