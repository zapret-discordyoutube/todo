<rect class="bg" x="0" y="0" width="960" height="612"/>
<g><text class="cap" x="40" y="26">второе условие: контрольная сумма TCP не сходится</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="74" rx="8"/><text class="sm" x="54" y="62">сумма считается по трём частям, результат лежит в заголовке TCP (16 бит)</text><rect class="bxs" x="54" y="72" width="290" height="32" rx="6"/><text class="sm c" x="199" y="93">адреса отправителя и получателя</text><rect class="bxs" x="356" y="72" width="220" height="32" rx="6"/><text class="sm c" x="466" y="93">заголовок TCP</text><rect class="bxs" x="588" y="72" width="240" height="32" rx="6"/><text class="sm c" x="708" y="93">данные</text><text class="tk" x="840" y="93">сумма</text></g>
<g class="a e2"><text class="sm" x="40" y="136">получатель пересчитывает сумму и сверяет; не сошлось: пакет испорчен, его выбрасывают.</text><text class="sm" x="40" y="156">Роутерам на пути, по общим сведениям, хватает заголовка IP, суммы TCP они не проверяют.</text></g>
<g class="a e3"><text class="cap" x="40" y="180">два пакета из одного опыта (числа этого запуска)</text></g>
<g class="a e4"><rect class="bxb" x="40" y="190" width="430" height="126" rx="8"/><text class="tk sm" x="54" y="214">подделка: PA, номер 1, длина 680</text><text class="sm" x="54" y="238">сумма на проводе:</text><text class="mk" x="220" y="238">0x96c4 (38596)</text><text class="sm" x="54" y="262">пересчёт по пакету:</text><text class="mk" x="220" y="262">0xbb31 (47921)</text><rect class="bxr" x="54" y="274" width="402" height="30" rx="6"/><text class="tk sm rej" x="66" y="295">не сходится: пакет испорчен</text></g>
<g class="a e5"><rect class="bxo" x="490" y="190" width="430" height="126" rx="8"/><text class="tk sm" x="504" y="214">настоящее: PA, номер 1, длина 250</text><text class="sm" x="504" y="238">тот же ip id 4559 и тот же номер</text><text class="sm" x="504" y="262">сумма на проводе сходится с пересчётом</text><rect class="bxo" x="504" y="274" width="402" height="30" rx="6"/><text class="tk sm ok" x="516" y="295">сходится: пакет принят</text></g>
<g class="a e6"><text class="cap" x="40" y="338">где видна подделка с неверной суммой</text></g>
<g class="a e7"><rect class="bx" x="40" y="348" width="202" height="58" rx="8"/><text class="tk sm c" x="141" y="370">клиент</text><rect class="bxr" x="84" y="380" width="114" height="20" rx="4"/><text class="mk rej c" x="141" y="395">сумма BAD</text><path class="lm" d="M244 377L254 377"/><polygon class="hm" points="264,377 254,382 254,372"/></g>
<g class="a e8"><rect class="bx" x="266" y="348" width="202" height="58" rx="8"/><text class="tk sm c" x="367" y="370">вход роутера</text><rect class="bxr" x="310" y="380" width="114" height="20" rx="4"/><text class="mk rej c" x="367" y="395">сумма BAD</text><path class="lm" d="M470 377L480 377"/><polygon class="hm" points="490,377 480,382 480,372"/></g>
<g class="a e9"><rect class="bx" x="492" y="348" width="202" height="58" rx="8"/><text class="tk sm c" x="593" y="370">выход роутера</text><rect class="bxr" x="536" y="380" width="114" height="20" rx="4"/><text class="mk rej c" x="593" y="395">сумма BAD</text><path class="lm" d="M696 377L706 377"/><polygon class="hm" points="716,377 706,382 706,372"/></g>
<g class="a e10"><rect class="bx" x="718" y="348" width="202" height="58" rx="8"/><text class="tk sm c" x="819" y="370">сервер</text><rect class="bxr" x="762" y="380" width="114" height="20" rx="4"/><text class="mk rej c" x="819" y="395">сумма BAD</text></g>
<g class="a e11"><text class="sm" x="40" y="428">проверка пакетов у каждой точки записи: подделка прошла и роутер, значит, выбросил её именно получатель</text></g>
<g class="a e12"><text class="cap" x="40" y="460">что произошло у получателя</text></g>
<g class="a e13"><rect class="bxr" x="40" y="470" width="430" height="84" rx="8"/><text class="tk sm" x="54" y="494">счётчики ядра сервера</text><text class="m" x="54" y="518">Tcp:InErrs</text><text class="mk" x="236" y="518">0 → 1</text><text class="m" x="54" y="542">Tcp:InCsumErrors</text><text class="mk" x="236" y="542">0 → 1</text></g>
<g class="a e14"><rect class="bxo" x="490" y="470" width="430" height="84" rx="8"/><text class="tk sm" x="504" y="494">приложение сервера: 250 байт, чисто</text><text class="sm" x="504" y="518">клиент получил ответ сервера</text><text class="sm" x="504" y="542">игрушка (инспектор): РАЗРЕШЕНО, сумм не смотрит</text></g>
<g class="a e15"><text class="sm mu" x="40" y="584">всё это проверено только на нашем получателе и нашей модели</text></g>
</svg>
