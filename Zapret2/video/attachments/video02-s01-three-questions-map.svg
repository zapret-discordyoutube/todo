<svg xmlns="http://www.w3.org/2000/svg" class="v02-s01-map" viewBox="0 0 960 544" width="960" height="544" role="img" aria-labelledby="v02-s01-map-t v02-s01-map-d">
<title id="v02-s01-map-t">Три вопроса и четыре части выпуска</title>
<desc id="v02-s01-map-d">Повтор выпуска 01 и план: три картинки (пакет как порция запроса в конверте с адресом, наблюдатель как модель ТСПУ, сортировщик с окошком, запрос, разрезанный пополам и прошедший мимо игрушечного инспектора) порождают три вопроса: что наблюдатель видит в пакете, где в пакете имя сайта, что он видит, если пакет разрезан; четыре части выпуска 02a-02d отвечают на них по порядку: слои пакета и IP, TCP, первое сообщение с именем сайта, взгляд наблюдателя и zapret2.</desc>
<style>.v02-s01-map{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
