<g><text class="cap" x="40" y="26">Повтор выпуска 01: три картинки и три вопроса к этому выпуску</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="280" height="150" rx="8"/><rect class="bxa" x="144" y="70" width="72" height="46" rx="5"/><path class="la" d="M144 72L180 98"/><path class="la" d="M216 72L180 98"/><text class="tk c" x="180" y="150">Пакет</text><text class="sm c" x="180" y="171">порция запроса в конверте</text><text class="sm c" x="180" y="189">с адресом</text></g>
<g class="a e2"><rect class="bx" x="340" y="44" width="280" height="150" rx="8"/><path class="lm" d="M368 94L424.0 94.0"/><polygon class="hm" points="434,94 424.0,99.0 424.0,89.0"/><rect class="bxs" x="434" y="66" width="92" height="56" rx="6"/><rect class="bxa" x="458" y="80" width="44" height="28" rx="3"/><path class="lm" d="M526 94L582.0 94.0"/><polygon class="hm" points="592,94 582.0,99.0 582.0,89.0"/><text class="tk c" x="480" y="150">Наблюдатель</text><text class="sm c" x="480" y="171">модель ТСПУ: сортировщик,</text><text class="sm c" x="480" y="189">смотрит в окошко</text></g>
<g class="a e3"><rect class="bx" x="640" y="44" width="280" height="150" rx="8"/><rect class="bxa" x="730" y="70" width="46" height="46" rx="5"/><path class="la" d="M730 72L753 94"/><rect class="bxa" x="784" y="70" width="46" height="46" rx="5"/><path class="la" d="M830 72L807 94"/><path class="lcut" d="M780 62L780 124"/><text class="tk c" x="780" y="150">Разрезанный запрос</text><text class="sm c" x="780" y="171">прошёл мимо игрушечного</text><text class="sm c" x="780" y="189">инспектора</text></g>
<g class="a e4"><path class="lf" d="M180 198L180.0 214.0"/><polygon class="hf" points="180,224 175.0,214.0 185.0,214.0"/><rect class="bxa" x="40" y="228" width="280" height="60" rx="8"/><circle class="bxn" cx="68" cy="258" r="14"/><text class="mk c ns" x="68" y="264">1</text><text class="tk sm" x="94" y="252">Что именно видит</text><text class="tk sm" x="94" y="272">наблюдатель в пакете?</text></g>
<g class="a e5"><path class="lf" d="M480 198L480.0 214.0"/><polygon class="hf" points="480,224 475.0,214.0 485.0,214.0"/><rect class="bxa" x="340" y="228" width="280" height="60" rx="8"/><circle class="bxn" cx="368" cy="258" r="14"/><text class="mk c ns" x="368" y="264">2</text><text class="tk sm" x="394" y="252">Где в пакете лежит</text><text class="tk sm" x="394" y="272">имя сайта?</text></g>
<g class="a e6"><path class="lf" d="M780 198L780.0 214.0"/><polygon class="hf" points="780,224 775.0,214.0 785.0,214.0"/><rect class="bxa" x="640" y="228" width="280" height="60" rx="8"/><circle class="bxn" cx="668" cy="258" r="14"/><text class="mk c ns" x="668" y="264">3</text><text class="tk sm" x="694" y="252">Что он видит,</text><text class="tk sm" x="694" y="272">если пакет разрезан?</text></g>
<g class="a e7"><text class="cap" x="40" y="324">Карта выпуска: четыре части</text></g>
<g class="a e8"><rect class="bx" x="40" y="338" width="205" height="106" rx="8"/><text class="mk" x="54" y="364">02a</text><text class="tk sm" x="54" y="388">Устройство пакета</text><text class="sm" x="54" y="411">слои, Ethernet, IP,</text><text class="sm" x="54" y="430">контрольная сумма</text><text class="sm mu c" x="142" y="468">отвечает на вопрос 1</text></g>
<g class="a e9"><rect class="bx" x="265" y="338" width="205" height="106" rx="8"/><text class="mk" x="279" y="364">02b</text><text class="tk sm" x="279" y="388">Протокол TCP</text><text class="sm" x="279" y="411">номера, рукопожатие,</text><text class="sm" x="279" y="430">окно, повторы</text><text class="sm mu c" x="367" y="468">отвечает на вопрос 1</text><path class="lm" d="M246 391L252.0 391.0"/><polygon class="hm" points="262,391 252.0,396.0 252.0,386.0"/></g>
<g class="a e10"><rect class="bx" x="490" y="338" width="205" height="106" rx="8"/><text class="mk" x="504" y="364">02c</text><text class="tk sm" x="504" y="388">Первое сообщение</text><text class="sm" x="504" y="411">TLS ClientHello: имя</text><text class="sm" x="504" y="430">сайта по байтам</text><text class="sm mu c" x="592" y="468">отвечает на вопрос 2</text><path class="lm" d="M471 391L477.0 391.0"/><polygon class="hm" points="487,391 477.0,396.0 477.0,386.0"/></g>
<g class="a e11"><rect class="bx" x="715" y="338" width="205" height="106" rx="8"/><text class="mk" x="729" y="364">02d</text><text class="tk sm" x="729" y="388">Взгляд наблюдателя</text><text class="sm" x="729" y="411">пакет и весь поток,</text><text class="sm" x="729" y="430">чтение в zapret2</text><text class="sm mu c" x="817" y="468">отвечает на вопрос 3</text><path class="lm" d="M696 391L702.0 391.0"/><polygon class="hm" points="712,391 702.0,396.0 702.0,386.0"/></g>
<g class="a e12"><text class="tk c" x="480" y="516">Начинаем с начала: из чего сделан пакет.</text></g>
