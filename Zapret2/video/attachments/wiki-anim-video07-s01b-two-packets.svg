<title id="v07-s01b-two-packets-t">Два пакета на одном номере</title>
<desc id="v07-s01b-two-packets-d">На провод клиента уходят два пакета подряд с одним номером 1: сначала подделка в 680 байт с именем www.microsoft.com, через 0,05 мс за ней настоящее приветствие в 250 байт с именем www.example.com, оба PSH и ACK, и оба претендуют на первый байт потока.</desc>
