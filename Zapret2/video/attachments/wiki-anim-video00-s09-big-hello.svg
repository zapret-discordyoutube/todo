<svg xmlns="http://www.w3.org/2000/svg" class="v00-s09-big-hello" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="v00-s09-big-hello-t v00-s09-big-hello-d">
<title id="v00-s09-big-hello-t">Большое приветствие: программа задерживает пакеты, пока не соберёт его целиком</title>
<desc id="v00-s09-big-hello-d">В нашем тесте приветствие в 1484 байта не поместилось в один пакет, программа записала в журнале, что приветствие неполное, задержала пакет, дождалась остальных частей и проиграла задержанные пакеты заново, после чего сервер получил приветствие целиком, все 1484 байта, а наше обычное приветствие в 250 байт короткое и целое, и ему всё это не нужно.</desc>
