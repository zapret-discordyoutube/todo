<svg xmlns="http://www.w3.org/2000/svg" class="v07-s26-http-and-quic-blobs" viewBox="0 0 960 870" width="960" height="870" role="img" aria-labelledby="v07-s26-http-and-quic-blobs-t v07-s26-http-and-quic-blobs-d">
<title id="v07-s26-http-and-quic-blobs-t">Заготовки HTTP и QUIC и их опыты</title>
<desc id="v07-s26-http-and-quic-blobs-d">Две другие встроенные заготовки: fake_default_http на 263 байта с Host www.iana.org, которая с условием tcp_md5 дала серверу чистые 81 байт настоящего запроса, а без условия сервер принял 263 байта подделки и клиент завис, и fake_default_quic на 620 байт с первым байтом 40 и нулями, где условие MD5 ничего не сделало, срок жизни 1 убил обе подделки на роутере, а плохая контрольная сумма не дошла до приложения сервера.</desc>
