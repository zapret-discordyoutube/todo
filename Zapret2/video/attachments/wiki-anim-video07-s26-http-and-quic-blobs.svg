<rect class="bg" x="0" y="0" width="960" height="870"/>
<g><text class="cap" x="40" y="26">другие встроенные заготовки: запрос HTTP и датаграмма QUIC</text></g>
<g class="a e1"><text class="sm mu" x="40" y="50">игрушка, пример выдуманный: письмо должно быть на бланке того учреждения, куда оно идёт</text></g>
<g class="a e2"><rect class="bxb" x="40" y="66" width="520" height="124" rx="6"/><text class="mn" x="56" y="90">GET / HTTP/1.1</text><text class="mn" x="56" y="109">Host: www.iana.org</text><text class="mn" x="56" y="128">User-Agent: Mozilla/5.0 (Windows NT 10.0; …) Firefox/109.0</text><text class="mn" x="56" y="147">Accept: text/html,application/xhtml+xml,…</text><text class="mn" x="56" y="166">Accept-Encoding: gzip, deflate, br</text><text class="mn mu" x="56" y="185">(пустая строка)</text></g>
<g class="a e3"><text class="mk" x="580" y="88">fake_default_http</text><text class="sm" x="580" y="110">263 байта, строки сокращены</text><text class="mn" x="580" y="132">nfq2/params.c:23-26</text><text class="sm mu" x="580" y="158">настоящий запрос в опыте:</text><text class="sm mu" x="580" y="178">81 байт, порт 80</text></g>
<g class="a e4"><rect class="bx" x="40" y="208" width="432" height="172" rx="6"/><text class="tk sm" x="54" y="232">с условием tcp_md5</text><rect class="bxb" x="54" y="248" width="144.7" height="28" rx="3"/><text class="mk c" x="126.3" y="267">263</text><rect class="bxa" x="204.7" y="248" width="44.6" height="28" rx="3"/><text class="mk c" x="226.9" y="267">81</text><text class="sm mu" x="261.2" y="260">оба: номер 1</text><text class="sm mu" x="261.2" y="277">ip id 35162</text><text class="sm" x="54" y="306">в подделке: опция MD5</text><text class="tk sm ok" x="54" y="330">сервер получил 81 байт, чисто</text><text class="sm ok" x="54" y="352">клиент: ответ получен</text><text class="mn" x="54" y="372">счётчик сервера TCPMD5Unexpected=1</text></g>
<g class="a e5"><rect class="bx" x="488" y="208" width="432" height="172" rx="6"/><text class="tk sm" x="502" y="232">без условия</text><rect class="bxb" x="502" y="248" width="144.7" height="28" rx="3"/><text class="mk c" x="574.3" y="267">263</text><rect class="bxa" x="652.6" y="248" width="44.6" height="28" rx="3"/><text class="mk c" x="674.9" y="267">81</text><text class="sm mu" x="709.2" y="260">оба: номер 1</text><text class="sm mu" x="709.2" y="277">ip id 2075</text><text class="sm" x="502" y="306">опций у подделки нет, заголовок как у настоящего</text><text class="tk sm rej" x="502" y="330">сервер принял 263 байта подделки</text><text class="sm rej" x="502" y="352">клиент завис: ответа нет 4 с</text></g>
<g class="a e6"><text class="cap" x="40" y="422">заготовка QUIC: 620 байт, не в масштабе</text></g>
<g class="a e7"><rect class="bxb" x="40" y="432" width="48" height="30" rx="2"/><text class="mk c" x="64" y="453">40</text><rect class="bxs" x="88" y="432" width="832" height="30" rx="2"/><text class="sm c" x="504" y="453">619 байт, все нули</text></g>
<g class="a e8"><text class="mn" x="40" y="484">nfq2/nfqws.c:1974-1977: массив на 620, memset нулями, первый байт 0x40</text><text class="sm mu" x="40" y="504">настоящим начальным пакетом QUIC это не является; что подумает настоящий инспектор, неизвестно</text></g>
<g class="a e9"><text class="cap" x="40" y="546">QUIC идёт по UDP: что дошло в наших опытах</text></g>
<g class="a e10"><rect class="bxs" x="40" y="554" width="880" height="30" rx="4"/><text class="mn" x="54" y="574">lua/zapret-lib.lua:981</text><text class="mk" x="250" y="574">if dis.tcp then</text><text class="sm" x="406" y="574">только поля tcp_*; срок жизни и badsum сюда не входят</text></g>
<g class="a e11"><text class="cap" x="40" y="608">условие</text><text class="cap" x="266" y="608">у клиента на проводе</text><text class="cap" x="560" y="608">у сервера</text><text class="cap" x="730" y="608">приложение сервера</text></g>
<g class="a e12"><rect class="bxs" x="40" y="618" width="880" height="50" rx="4"/><text class="mk" x="52" y="636">tcp_md5</text><text class="mn" x="266" y="636">620 ; 1200</text><text class="mn" x="560" y="636">620 ; 1200</text><text class="mn" x="730" y="636">620(40) 1200(c3)</text><text class="sm mu" x="52" y="658">MD5 к UDP не применился: подделка дошла</text></g>
<g class="a e13"><rect class="bxs" x="40" y="674" width="880" height="50" rx="4"/><text class="mk" x="52" y="692">repeats=2, без условий</text><text class="mn" x="266" y="692">620 ; 620 ; 1200</text><text class="mn" x="560" y="692">620 ; 620 ; 1200</text><text class="mn" x="730" y="692">620 620 1200</text><text class="sm mu" x="52" y="714">у UDP нет потока: доходит каждая датаграмма</text></g>
<g class="a e14"><rect class="bxo" x="40" y="730" width="880" height="50" rx="4"/><text class="mk" x="52" y="748">repeats=2, ip_ttl=1</text><text class="mn" x="266" y="748">620 ttl1 ; 620 ttl1 ; 1200</text><text class="mn" x="560" y="748">1200</text><text class="mn" x="730" y="748">1200(c3)</text><text class="sm mu" x="52" y="770">срок жизни 1 убил обе подделки на роутере</text></g>
