<g class="a e18"><text class="sm" x="500" y="196">порт назначения; фигурные скобки: любой из списка</text></g>
<g class="a e19"><rect class="bxo" x="500" y="214" width="120" height="34" rx="17"/><text class="sm tk c" x="560" y="236">порт 443</text><path class="lo" d="M626 231L650.0 231.0"/><polygon class="ho" points="660,231 650.0,236.0 650.0,226.0"/><path class="lo" d="M677 231L682 237L692 224"/><text class="sm tk ok" x="702" y="236">в списке: подходит</text></g>
<g class="a e20"><rect class="bxo" x="500" y="258" width="120" height="34" rx="17"/><text class="sm tk c" x="560" y="280">порт 80</text><path class="lo" d="M626 275L650.0 275.0"/><polygon class="ho" points="660,275 650.0,280.0 650.0,270.0"/><path class="lo" d="M677 275L682 281L692 268"/><text class="sm tk ok" x="702" y="280">в списке: подходит</text></g>
<g class="a e21"><rect class="bxr" x="500" y="302" width="120" height="34" rx="17"/><text class="sm tk c" x="560" y="324">порт 8080</text><path class="lr" d="M626 319L650.0 319.0"/><polygon class="hr" points="660,319 650.0,324.0 650.0,314.0"/><path class="lr" d="M677 312L691 326M677 326L691 312"/><text class="sm tk rej" x="702" y="324">нет в списке: мимо</text></g>
<g class="a e22"><text class="sm" x="500" y="370">80: обычный HTTP, запрос идёт открытым текстом</text></g>
<g class="a e23"><text class="sm" x="500" y="392">443: защищённые соединения (TLS)</text></g>
<g class="a e24"><text class="sm mu" x="500" y="414">наш клиент: 443 в опытах с TLS, 80 в опытах с HTTP</text></g>
<g class="a e25"><text class="tk" x="20" y="454">Итог двух частей: пакет без нашего бита в метке, TCP, порт назначения 80 или 443.</text></g>
</svg>
