.v16-s05-rule-tokens .bg{fill:var(--bg)}
.v16-s05-rule-tokens text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v16-s05-rule-tokens .tk{font-weight:600;fill:var(--fg)}
.v16-s05-rule-tokens .sm{font-size:14.5px}
.v16-s05-rule-tokens .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v16-s05-rule-tokens .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
