<g class="a e7"><text class="sm mu" x="498" y="124">эти две части разберём в следующих сценах</text></g>
<g class="a e8"><rect class="bxa" x="20" y="62" width="277" height="38" rx="6"/><text class="sm tk acc" x="24" y="124">1 · метка</text></g>
<g class="a e9"><text class="cap" x="20" y="164">часть 1: метка</text><path class="lm" d="M20 172L470 172"/></g>
<g class="a e10"><text class="sm" x="20" y="196">игрушка (выдумана): клерк клеит наклейку «своё»</text></g>
<g class="a e11"><rect class="bx" x="30" y="214" width="64" height="40" rx="4"/><path class="lm" d="M30 214L62 236L94 214"/><text class="sm" x="30" y="274">обычное письмо</text></g>
<g class="a e12"><path class="lo" d="M104 234L252.0 234.0"/><polygon class="ho" points="262,234 252.0,239.0 252.0,229.0"/><rect class="bxo" x="268" y="210" width="110" height="48" rx="8"/><text class="tk c" x="323" y="239">окошко</text><path class="lo" d="M393 234L398 240L408 227"/><text class="sm ok tk" x="414" y="239">везём</text></g>
<g class="a e13"><rect class="bx" x="30" y="296" width="64" height="40" rx="4"/><path class="lm" d="M30 296L62 318L94 296"/><circle cx="80" cy="326" r="7" class="fr"/><text class="sm" x="30" y="356">письмо с наклейкой «своё»</text></g>
<g class="a e14"><path class="lm" d="M104 316L190.0 316.0"/><polygon class="hm" points="200,316 190.0,321.0 190.0,311.0"/><path class="lr" d="M222 308L238 324M222 324L238 308"/><text class="sm rej tk" x="250" y="321">к окошку не везём</text></g>
<g class="a e15"><text class="sm" x="20" y="392">Иначе, по документации, клерк получил бы своё письмо,</text><text class="sm" x="20" y="412">отправил снова, и так по кругу (подробно в части 3).</text></g>
<g class="a e16"><rect class="bxa" x="307" y="62" width="181" height="38" rx="6"/><text class="sm tk acc" x="311" y="124">2 · порт</text></g>
