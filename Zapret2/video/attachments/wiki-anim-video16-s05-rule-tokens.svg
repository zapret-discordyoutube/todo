<svg xmlns="http://www.w3.org/2000/svg" class="v16-s05-rule-tokens" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="v16-s05-rule-tokens-t v16-s05-rule-tokens-d">
<title id="v16-s05-rule-tokens-t">Правило ядра: метка и порты</title>
<desc id="v16-s05-rule-tokens-d">Правило ядра nftables из docs/readme.md:83, первые две части слева направо: «meta mark and 0x40000000 == 0» оставляет пакеты, у которых в метке не стоит бит 30 (игрушка: письма с красной наклейкой «своё» к окошку не возят, иначе клерк получил бы собственное письмо), «tcp dport {80,443}» оставляет пакеты TCP с портом назначения 80 или 443, а порт 8080 не подходит; остальные части правила разобраны дальше.</desc>
<style>.v16-s05-rule-tokens{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
