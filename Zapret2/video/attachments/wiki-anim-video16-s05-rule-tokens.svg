<rect class="bg" x="0" y="0" width="960" height="470"/>
<g class="a e1"><text class="cap" x="20" y="24">правило ядра слева направо: первые две части</text></g>
<g class="a e2"><text class="sm mu" x="20" y="48">строка из документации zapret2, docs/readme.md:83 (в лаборатории то же правило)</text></g>
<g class="a e3"><rect class="bx" x="20" y="62" width="277" height="38" rx="6"/><text class="mk c" x="158.5" y="87">meta mark and 0x40000000 == 0</text></g>
<g class="a e4"><rect class="bx" x="307" y="62" width="181" height="38" rx="6"/><text class="mk c" x="397.5" y="87">tcp dport {80,443}</text></g>
<g class="a e5"><rect class="bxd" x="498" y="62" width="233" height="38" rx="6"/><text class="m c mu" x="614.5" y="87">ct original packets 1-12</text></g>
