.v16-s05-rule-tokens .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v16-s05-rule-tokens .hf{fill:var(--fg2)}.v16-s05-rule-tokens .ha{fill:var(--acc)}.v16-s05-rule-tokens .hr{fill:var(--rej)}.v16-s05-rule-tokens .hm{fill:var(--mute)}.v16-s05-rule-tokens .ho{fill:var(--ok)}.v16-s05-rule-tokens .hb{fill:var(--amb)}
.v16-s05-rule-tokens .a{animation-duration:36s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v16-s05-rule-tokens .a{animation:none}.v16-s05-rule-tokens .tr{display:none}}
