<g><text class="cap" x="40" y="24">вопрос части: что с длинным куском, если пакеты мельче?</text></g>
<g class="a e1"><text class="sm tk" x="40" y="52">рамка это один пакет; обычный размер: максимум данных 1448</text><rect class="bxn" x="40" y="60" width="800" height="34" rx="0"/><rect class="bxb" x="40" y="64" width="762.4" height="26" rx="0"/><text class="ix c fg tk" x="421.2" y="82">1380@104: влезает в один пакет</text></g>
<g class="a e2"><text class="sm tk" x="40" y="126">размер пакета уменьшен (MTU 600): максимум данных 548</text><rect class="bxn" x="40" y="134" width="302.8" height="34" rx="0"/><rect class="bxr" x="40" y="138" width="762.4" height="26" rx="0"/><text class="ix c fg tk" x="421.2" y="156">1380@104: в пакет не помещается</text><path class="lr" d="M342.8 130L342.8 172"/></g>
<g class="a e3"><text class="sm mu" x="40" y="190">приём лаборатории: пакет на клиенте ограничили 600 байтами; к стратегии это не относится</text></g>
<g class="a e4"><text class="cap" x="40" y="216">размер сегмента (MSS) объявляют в первых пакетах соединения; код берёт меньший</text></g>
<g class="a e5"><rect class="bxa" x="40" y="228" width="230" height="52" rx="6"/><text class="sm" x="52" y="249">SYN клиента</text><text class="mk" x="52" y="269">MSS 560</text><rect class="bx" x="280" y="228" width="230" height="52" rx="6"/><text class="sm" x="292" y="249">SYN-ACK сервера</text><text class="mk" x="292" y="269">MSS 1460</text><path class="lf" d="M512 254L524.0 254.0"/><polygon class="hf" points="534,254 524.0,259.0 524.0,249.0"/><rect class="bxo" x="536" y="228" width="150" height="52" rx="6"/><text class="sm" x="548" y="249">меньший</text><text class="mk" x="548" y="269">560</text><path class="lf" d="M688 254L700.0 254.0"/><polygon class="hf" points="710,254 700.0,259.0 700.0,249.0"/><rect class="bxb" x="712" y="228" width="208" height="52" rx="6"/><text class="sm" x="724" y="249">минус 12 опций</text><text class="mk" x="724" y="269">= 548</text></g>
<g class="a e6"><text class="sm" x="40" y="298">548 это максимум данных в пакете; 12 байт опций: две пустышки NOP и метка времени в 10 байт</text></g>
<g class="a e7"><rect class="bx" x="40" y="314" width="230" height="52" rx="6"/><text class="sm" x="52" y="335">SYN клиента</text><text class="mk" x="52" y="355">MSS 1460</text><rect class="bx" x="280" y="314" width="230" height="52" rx="6"/><text class="sm" x="292" y="335">SYN-ACK сервера</text><text class="mk" x="292" y="355">MSS 1460</text><path class="lf" d="M512 340L524.0 340.0"/><polygon class="hf" points="534,340 524.0,345.0 524.0,335.0"/><rect class="bxo" x="536" y="314" width="150" height="52" rx="6"/><text class="sm" x="548" y="335">меньший</text><text class="mk" x="548" y="355">1460</text><path class="lf" d="M688 340L700.0 340.0"/><polygon class="hf" points="710,340 700.0,345.0 700.0,335.0"/><rect class="bxb" x="712" y="314" width="208" height="52" rx="6"/><text class="sm" x="724" y="335">минус 12 опций</text><text class="mk" x="724" y="355">= 1448</text></g>
<g class="a e8"><text class="sm" x="40" y="386">обычные опыты: потолок 1448 из прошлой части (1460 − 12)</text></g>
<g class="a e9"><text class="sm tk" x="40" y="418">так ядро клиента нарезало это приветствие при MSS 560</text></g>
<g class="a e10"><rect class="bxa" x="40" y="428" width="325" height="26" rx="0"/><text class="ix c fg tk" x="202.5" y="446">548</text><rect class="bxb" x="365" y="428" width="325" height="26" rx="0"/><text class="ix c fg tk" x="527.4" y="446">548</text><rect class="bxo" x="689.9" y="428" width="230.1" height="26" rx="0"/><text class="ix c fg tk" x="805" y="446">388</text><text class="sm" x="40" y="476">calc: 548 + 548 = 1096; 1484 − 1096 = 388</text></g>
<g class="a e11"><text class="cap" x="40" y="512">минимум считает C, Lua его только читает</text><text class="ix mu r" x="920" y="512">nfq2/desync.c:1021-1030</text></g>
<g class="a e12"><rect class="bx" x="40" y="520" width="880" height="104" rx="6"/><path class="lm" d="M90 526L90 618"/><text class="ix mu r" x="82" y="547">1024</text><text class="ix fg" x="100" y="547">if (pos &amp;&amp; pos-&gt;mss &amp;&amp; rpos &amp;&amp; rpos-&gt;mss)</text><text class="ix mu r" x="82" y="577">1026</text><text class="ix fg" x="100" y="577">    lua_pushf_int(params.L, &quot;tcp_mss&quot;, rpos-&gt;mss &gt; pos-&gt;mss ? pos-&gt;mss : rpos-&gt;mss);</text><text class="ix mu r" x="82" y="607">1029</text><text class="ix fg" x="100" y="607">    lua_pushf_global(params.L, &quot;tcp_mss&quot;, &quot;DEFAULT_MSS&quot;);</text></g>
<g class="a e13"><text class="cap" x="40" y="646">в стратегии: сколько данных помещается в пакет</text><text class="ix mu r" x="920" y="646">lua/zapret-lib.lua:1233-1279</text></g>
<g class="a e14"><rect class="bx" x="40" y="654" width="880" height="104" rx="6"/><path class="lm" d="M90 660L90 752"/><text class="ix mu r" x="82" y="681">1240</text><text class="ix fg" x="100" y="681">  mss = mss or desync.tcp_mss</text><text class="ix mu r" x="82" y="711">1241</text><text class="ix fg" x="100" y="711">  local extra_len = l3l4_extra_len(discopy)</text><text class="ix mu r" x="82" y="741">1243</text><text class="ix fg" x="100" y="741">  local max_data = mss - extra_len</text></g>
