<svg xmlns="http://www.w3.org/2000/svg" class="v06-s20-mss-ceiling" viewBox="0 0 960 782" width="960" height="782" role="img" aria-labelledby="v06-s20-mss-ceiling-t v06-s20-mss-ceiling-d">
<title id="v06-s20-mss-ceiling-t">Потолок данных в пакете</title>
<desc id="v06-s20-mss-ceiling-d">Вопрос про длинный кусок при мелких пакетах: при обычном размере пакета (максимум данных 1448) длинная часть в 1380 байт уходит одним пакетом, а в опыте с MTU клиента 600 (приём лаборатории, к стратегии не относится) она в пакет не помещается; код берёт меньший из двух MSS из SYN-пакетов (минимум считает программа на C, desync.c 1021-1030, а если известны не оба, берётся запасное значение 1220) и вычитает 12 байт опций (две пустышки NOP и метка времени в 10 байт), в опыте клиент объявил 560, сервер 1460, значит 560 − 12 = 548 байт данных в пакете, и ядро клиента нарезало приветствие на 548, 548 и 388 (548 + 548 = 1096, 1484 − 1096 = 388), а в обычных опытах обе стороны объявляли 1460 и 1460 − 12 = 1448, это потолок из прошлой части выпуска.</desc>
