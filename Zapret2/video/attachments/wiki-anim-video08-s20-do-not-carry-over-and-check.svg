<svg xmlns="http://www.w3.org/2000/svg" class="v08-s20-do-not-carry-over-and-check" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="v08-s20-do-not-carry-over-and-check-t v08-s20-do-not-carry-over-and-check-d">
<title id="v08-s20-do-not-carry-over-and-check-t">Что не переносить и проверка по таблице</title>
<desc id="v08-s20-do-not-carry-over-and-check-d">Три вещи нельзя переносить с одной функции на другую: нумерацию выключателей, которая у разреза с фейками начинается с первой половины, а у перемешивания с фейками со второй, смысл seqovl, который у одной функции число, а у другой метка, и то, что бывает без условия, то есть нули, чужое имя или фейк в 680 байт, который сервер принимает всерьёз и подтверждает 681; в проверке запуск перемешивания с фейками с условием и с выключенными первым и четвёртым выключателями оставляет четыре пакета, настоящую вторую половину в 146 байт, фейк второй, фейк первой в 104 байта и настоящую первую, это расчёт по правилам, такого запуска у нас нет; дальше в выпуске порядки пар, ловушка со списком меток в pos, пара без условия и игрушечные читатели, которые прозреют, когда фейки выключают по одному.</desc>
