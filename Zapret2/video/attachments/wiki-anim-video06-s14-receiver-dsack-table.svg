<svg xmlns="http://www.w3.org/2000/svg" class="v06-s14-receiver-dsack-table" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v06-s14-receiver-dsack-table-t v06-s14-receiver-dsack-table-d">
<title id="v06-s14-receiver-dsack-table-t">Приёмник и перекрытые байты</title>
<desc id="v06-s14-receiver-dsack-table-d">Что сервер нашей лаборатории на Linux делает с перекрытыми байтами: в пяти опытах итоговое подтверждение несёт дублирующий блок SACK ровно на перекрытом диапазоне номеров, от 104 до 105 не включая при seqovl=1 (1 номер), от 8 до 105 при seqovl=host (97 номеров), от 2 до 105 при seqovl=midsld-1 (103 номера), от 8 до 105 при узоре-приманке (97 номеров) и от 2 до 98 при трёх разрезах (96 номеров), приложение во всех пяти получило настоящие 250 байт с равным хэшем, а какую из двух копий ядро хранит внутри, из захвата не видно; руководство (docs/manual.en.md, строка 4078) говорит, что позднее перекрытие записывается поверх лежащего в буфере и так ведут себя все системы, кроме Windows, но это слова руководства, а мы проверяли только Linux.</desc>
