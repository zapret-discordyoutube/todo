<rect class="bg" x="0" y="0" width="960" height="580"/>
<g><text class="cap" x="40" y="26">что делает приёмник с перекрытыми байтами</text></g>
<g class="a e1"><text class="tk" x="40" y="52">итоговое подтверждение сервера: дублирующий блок на ряду номеров 1…250</text></g>
<g class="a e2"><text class="mk" x="40" y="92">seqovl=1</text><text class="sm mu" x="40" y="111">блок [104,105), 1 номер</text><rect class="bx" x="300" y="80" width="622.5" height="28" rx="0"/><rect class="fb" x="555.4" y="80" width="3" height="28"/><rect class="bxb" x="555.4" y="80" width="3" height="28" rx="0"/><text class="sm amb" x="567.4" y="99">← один номер: 104</text></g>
<g class="a e3"><text class="mk" x="40" y="138">seqovl=host</text><text class="sm mu" x="40" y="157">блок [8,105), 97 номеров</text><rect class="bx" x="300" y="126" width="622.5" height="28" rx="0"/><rect class="fb" x="317.4" y="126" width="240.6" height="28"/><rect class="bxb" x="317.4" y="126" width="240.6" height="28" rx="0"/></g>
<g class="a e4"><text class="mk" x="40" y="184">seqovl=midsld-1</text><text class="sm mu" x="40" y="203">блок [2,105), 103 номера</text><rect class="bx" x="300" y="172" width="622.5" height="28" rx="0"/><rect class="fb" x="302.5" y="172" width="255.4" height="28"/><rect class="bxb" x="302.5" y="172" width="255.4" height="28" rx="0"/></g>
<g class="a e5"><text class="mk" x="40" y="230">host + приманка</text><text class="sm mu" x="40" y="249">блок [8,105), 97 номеров</text><rect class="bx" x="300" y="218" width="622.5" height="28" rx="0"/><rect class="fb" x="317.4" y="218" width="240.6" height="28"/><rect class="bxb" x="317.4" y="218" width="240.6" height="28" rx="0"/></g>
<g class="a e6"><text class="mk" x="40" y="276">три разреза, host-1</text><text class="sm mu" x="40" y="295">блок [2,98), 96 номеров</text><rect class="bx" x="300" y="264" width="622.5" height="28" rx="0"/><rect class="fb" x="302.5" y="264" width="238.1" height="28"/><rect class="bxb" x="302.5" y="264" width="238.1" height="28" rx="0"/></g>
<g class="a e7"><path class="lmd" d="M557.9200000000001 78 L557.9200000000001 306"/><text class="ix c" x="557.9" y="322">105</text><text class="ix" x="300" y="322">1</text><text class="ix r" x="922.5" y="322">250</text></g>
<g class="a e8"><rect class="bxo" x="40" y="338" width="880" height="50" rx="8"/><text class="tk" x="54" y="360">приложение во всех пяти опытах: настоящие байты, 250 байт, хэш равен</text><text class="sm" x="54" y="379">сервер называет дублирующим ровно перекрытый диапазон</text></g>
<g class="a e9"><text class="sm tk" x="40" y="414">какую из двух копий ядро хранит внутри, из захвата не видно, и мы этого не утверждаем</text><text class="sm mu" x="40" y="434">по общим сведениям, форма дублирующего блока описана в RFC 2883</text></g>
<g class="a e10"><rect class="bxb" x="40" y="452" width="880" height="112" rx="8"/><text class="tk" x="54" y="476">руководство к программе, docs/manual.en.md:4078</text><text class="sm" x="54" y="498">«позднее перекрытие записывается поверх того, что уже лежит в буфере;</text><text class="sm" x="54" y="516">так ведут себя все системы, кроме Windows»</text><text class="sm mu" x="54" y="542">это слова руководства, а не наш опыт: проверен только Linux, Windows и другие системы мы не проверяли</text></g>
</svg>
