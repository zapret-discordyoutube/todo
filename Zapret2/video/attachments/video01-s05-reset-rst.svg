<svg xmlns="http://www.w3.org/2000/svg" class="v01-s05-reset" viewBox="0 0 960 424" width="960" height="424" role="img" aria-labelledby="v01-s05-reset-t v01-s05-reset-d">
<title id="v01-s05-reset-t">Сброс соединения: пакет RST</title>
<desc id="v01-s05-reset-d">Опыт лаборатории: клиент отправляет 250 байт, игрушечный инспектор в роутере не пропускает их дальше и через 0,01 мс присылает клиенту пакет RST как будто от сервера, с TTL 64 (у настоящих пакетов сервера TTL 63); клиент сразу получает ошибку, сервер получает 0 байт.</desc>
<style>.v01-s05-reset{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#2e7d4f;--okt:rgba(46,125,79,.12)}@media (prefers-color-scheme:dark){.v01-s05-reset{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13);--ok:#7fd6a0;--okt:rgba(127,214,160,.13)}}
.v01-s05-reset .v01-s05-reset-bg{fill:var(--bg)}
.v01-s05-reset text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v01-s05-reset .v01-s05-reset-tk{font-weight:600;fill:var(--fg)}
.v01-s05-reset .v01-s05-reset-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v01-s05-reset .v01-s05-reset-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v01-s05-reset .v01-s05-reset-hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v01-s05-reset .v01-s05-reset-cap{font-size:13px;font-weight:600;letter-spacing:.04em;fill:var(--mute)}
.v01-s05-reset .v01-s05-reset-sm{font-size:14.5px}
.v01-s05-reset .v01-s05-reset-mu{fill:var(--mute)}
.v01-s05-reset .v01-s05-reset-fg{fill:var(--fg)}
.v01-s05-reset .v01-s05-reset-acc{fill:var(--acc)}
.v01-s05-reset .v01-s05-reset-rej{fill:var(--rej)}
.v01-s05-reset .v01-s05-reset-ok{fill:var(--ok)}
.v01-s05-reset .v01-s05-reset-c{text-anchor:middle}
.v01-s05-reset .v01-s05-reset-r{text-anchor:end}
.v01-s05-reset .v01-s05-reset-nostroke{stroke:none}
.v01-s05-reset .v01-s05-reset-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v01-s05-reset .v01-s05-reset-bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v01-s05-reset .v01-s05-reset-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v01-s05-reset .v01-s05-reset-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v01-s05-reset .v01-s05-reset-bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v01-s05-reset .v01-s05-reset-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}
.v01-s05-reset .v01-s05-reset-bxbg{fill:var(--bg);stroke:none}
.v01-s05-reset .v01-s05-reset-dim{fill:var(--bg);fill-opacity:.66;stroke:none}
.v01-s05-reset .v01-s05-reset-fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.6}
.v01-s05-reset .v01-s05-reset-lf{fill:none;stroke:var(--line);stroke-width:1.2}
.v01-s05-reset .v01-s05-reset-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
