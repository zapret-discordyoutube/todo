<g class="a v01-s05-reset-e2"><path class="v01-s05-reset-sl-f" d="M134 140L466.0 140.0"/><polygon class="v01-s05-reset-hd-f" points="476,140 466.0,145.0 466.0,135.0"/><text class="v01-s05-reset-sm v01-s05-reset-c" x="305" y="128">данные, 250 байт</text></g>
<g class="a v01-s05-reset-e3 tr"><rect class="v01-s05-reset-dot" x="-12" y="-7" width="24" height="14" rx="4"/></g>
