.v01-s05-reset .v01-s05-reset-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}
.v01-s05-reset .v01-s05-reset-la{fill:none;stroke:var(--acc);stroke-width:2}
.v01-s05-reset .v01-s05-reset-lad{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4}
.v01-s05-reset .v01-s05-reset-lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v01-s05-reset .v01-s05-reset-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}
.v01-s05-reset .v01-s05-reset-sl-a{fill:none;stroke:var(--acc);stroke-width:2}
.v01-s05-reset .v01-s05-reset-sl-r{fill:none;stroke:var(--rej);stroke-width:2}
.v01-s05-reset .v01-s05-reset-hd-f{fill:var(--fg2)}
.v01-s05-reset .v01-s05-reset-hd-a{fill:var(--acc)}
.v01-s05-reset .v01-s05-reset-hd-r{fill:var(--rej)}
.v01-s05-reset .v01-s05-reset-dot{fill:var(--acc)}
.v01-s05-reset .v01-s05-reset-dotr{fill:var(--rej)}
.v01-s05-reset .a{animation-duration:17s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v01-s05-reset .a{animation:none}.v01-s05-reset .tr{display:none}}
figure.v01-s05-reset-fig{margin:1.6rem 0;overflow-x:auto}figure.v01-s05-reset-fig>svg{display:block;width:100%;min-width:680px;height:auto}
