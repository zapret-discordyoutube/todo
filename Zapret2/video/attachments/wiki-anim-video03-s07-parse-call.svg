<rect class="bg" x="0" y="0" width="960" height="540"/>
<g class="a e1"><text class="cap" x="10" y="22">как опция lua-desync разбирается на имя и аргументы</text></g>
<g class="a e2"><rect class="bx" x="20" y="44" width="149.0" height="34" rx="6"/><text class="ml c " x="94.5" y="67">--lua-desync=</text></g>
<g class="a e3"><rect class="bxa" x="195.0" y="44" width="118.3" height="34" rx="6"/><text class="ml c acc" x="254.15" y="67">multisplit</text></g>
<g class="a e4"><text class="ml c mu" x="346.3" y="67">:</text></g>
<g class="a e5"><rect class="bxb" x="375.3" y="44" width="46.7" height="34" rx="6"/><text class="ml c amb" x="398.65000000000003" y="67">pos</text></g>
<g class="a e6"><text class="ml c mu" x="455.0" y="67">=</text></g>
<g class="a e7"><rect class="bxo" x="484.0" y="44" width="77.4" height="34" rx="6"/><text class="ml c ok" x="522.7" y="67">midsld</text></g>
<g class="a e8"><path class="la" d="M254.15 80L254.15 92"/><text class="sm tk acc c" x="254.15" y="110">имя функции</text><text class="sm mu c" x="254.15" y="128">до первого «:»</text></g>
<g class="a e9"><path class="lb" d="M398.65000000000003 80L398.65000000000003 92"/><text class="sm tk amb c" x="398.65000000000003" y="110">имя аргумента</text><text class="sm mu c" x="398.65000000000003" y="128">до первого «=»</text></g>
<g class="a e10"><path class="lo" d="M522.7 80L522.7 92"/><text class="sm tk ok c" x="522.7" y="110">значение</text><text class="sm mu c" x="522.7" y="128">после «=»</text></g>
<g class="a e11"><rect class="bx" x="20" y="160" width="149.0" height="34" rx="6"/><text class="ml c " x="94.5" y="183">--lua-desync=</text></g>
<g class="a e12"><rect class="bxa" x="195.0" y="160" width="56.9" height="34" rx="6"/><text class="ml c acc" x="223.45" y="183">pcap</text></g>
<g class="a e13"><text class="ml c mu" x="284.9" y="183">:</text></g>
<g class="a e14"><rect class="bxb" x="313.9" y="160" width="56.9" height="34" rx="6"/><text class="ml c amb" x="342.34999999999997" y="183">file</text></g>
<g class="a e15"><text class="ml c mu" x="403.79999999999995" y="183">=</text></g>
<g class="a e16"><rect class="bxo" x="432.79999999999995" y="160" width="169.5" height="34" rx="6"/><text class="ml c ok" x="517.55" y="183">nfqws_seen.pcap</text></g>
<g class="a e17"><rect class="bx" x="586" y="40" width="364" height="128" rx="8"/><text class="tk sm" x="600" y="62">имя и имя аргумента: идентификаторы</text><text class="sm" x="600" y="86">первый символ: латинская буква или _</text><text class="sm" x="600" y="106">дальше: буквы, цифры, _</text><text class="sm" x="600" y="126">ни дефиса, ни точки, ни цифры в начале</text><text class="sm mu" x="600" y="152">nfq2/helpers.c:102-110</text></g>
<g class="a e18"><path class="lm" d="M10 216L950 216"/><text class="cap" x="10" y="238">что вышло в нашем режиме разбора (без запуска пакетов)</text></g>
<g class="a e19"><rect class="bxr" x="10" y="248" width="940" height="30" rx="6"/><text class="mk" x="22" y="268">pa-ss</text><path class="lr" d="M205 256L219 270M205 270L219 256"/><text class="m rej" x="234" y="268">bad identifier &#x27;pa-ss&#x27;</text><text class="sm" x="520" y="268">имя функции с дефисом, выход 1</text></g>
<g class="a e20"><rect class="bxr" x="10" y="284" width="940" height="30" rx="6"/><text class="mk" x="22" y="304">pass:=3</text><path class="lr" d="M205 292L219 306M205 306L219 292"/><text class="m rej" x="234" y="304">invalid lua function call</text><text class="sm" x="520" y="304">аргумент без имени</text></g>
<g class="a e21"><rect class="bxr" x="10" y="320" width="940" height="30" rx="6"/><text class="mk" x="22" y="340">pass:1a=2</text><path class="lr" d="M205 328L219 342M205 342L219 328"/><text class="m rej" x="234" y="340">invalid lua function call</text><text class="sm" x="520" y="340">имя аргумента начинается с цифры</text></g>
<g class="a e22"><rect class="bxo" x="10" y="356" width="940" height="30" rx="6"/><text class="mk" x="22" y="376">pass:a=x\:y:b=2</text><path class="lo" d="M204 370L210 377L221 362"/><text class="m " x="234" y="376">a = &quot;x:y&quot;,  b = &quot;2&quot;</text><text class="sm" x="520" y="376">защищённое «\:» осталось в значении</text></g>
<g class="a e23"><rect class="bxo" x="10" y="392" width="940" height="30" rx="6"/><text class="mk" x="22" y="412">pass:a:b=:</text><path class="lo" d="M204 406L210 413L221 398"/><text class="m " x="234" y="412">a = &quot;&quot;,  b = &quot;&quot;</text><text class="sm" x="520" y="412">аргумент без значения принимается</text></g>
<g class="a e24"><rect class="bxo" x="10" y="428" width="940" height="30" rx="6"/><text class="mk" x="22" y="448">pass:k=x=y</text><path class="lo" d="M204 442L210 449L221 434"/><text class="m " x="234" y="448">k = &quot;x=y&quot;</text><text class="sm" x="520" y="448">делится только по первому «=»</text></g>
<g class="a e25"><text class="tk" x="10" y="486">Ошибка формы останавливает запуск до первого пакета.</text></g>
<g class="a e26"><text class="sm" x="10" y="510">Значение: всё после первого «=»; без «=» значения нет, голое имя принимается.</text></g>
</svg>
