<svg xmlns="http://www.w3.org/2000/svg" class="v03-s07-parse-call" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v03-s07-parse-call-t v03-s07-parse-call-d">
<title id="v03-s07-parse-call-t">Разбор опции lua-desync</title>
<desc id="v03-s07-parse-call-d">Разбор опции lua-desync: имя функции это всё до первого двоеточия (multisplit, pcap), дальше куски через двоеточие делятся по первому знаку равно на имя аргумента и значение (pos и midsld, file и nfqws_seen.pcap); имена должны быть идентификаторами, а в нашем режиме разбора имя с дефисом, аргумент без имени и имя аргумента с цифры в начале дают ошибку, значение с защищённым двоеточием, аргумент без значения и значение x=y принимаются.</desc>
<style>
.v03-s07-parse-call{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
