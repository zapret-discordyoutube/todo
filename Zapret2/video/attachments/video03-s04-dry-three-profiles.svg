<rect class="v03-s04-dry-bg" x="0" y="0" width="960" height="452"/>
<g class="a v03-s04-dry-e1"><text class="v03-s04-dry-cap" x="10" y="24">запуск в режиме разбора с отладкой, без пакетов; служебные опции опущены</text></g>
<g class="a v03-s04-dry-e2"><rect class="v03-s04-dry-bxb" x="14" y="40" width="248.812" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="21" y="60">--payload=tls_client_hello</text><rect class="v03-s04-dry-bxb" x="270.812" y="40" width="122.375" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="277.812" y="60">--in-range=a</text><rect class="v03-s04-dry-bxb" x="401.188" y="40" width="131.406" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="408.188" y="60">--out-range=x</text><rect class="v03-s04-dry-bxo" x="540.594" y="40" width="167.531" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="547.594" y="60">--lua-desync=pass</text><text class="v03-s04-dry-sm v03-s04-dry-mu" x="730.125" y="60">→ профиль 1</text></g>
<g class="a v03-s04-dry-e3"><rect class="v03-s04-dry-bxs" x="14" y="78" width="59.1562" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="21" y="98">--new</text><rect class="v03-s04-dry-bxo" x="81.1562" y="78" width="167.531" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="88.1562" y="98">--lua-desync=pass</text><text class="v03-s04-dry-sm v03-s04-dry-mu" x="600" y="98">→ профиль 2</text></g>
<g class="a v03-s04-dry-e4"><rect class="v03-s04-dry-bxs" x="14" y="116" width="59.1562" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="21" y="136">--new</text><rect class="v03-s04-dry-bxb" x="81.1562" y="116" width="122.375" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="88.1562" y="136">--in-range=a</text><rect class="v03-s04-dry-bxo" x="211.531" y="116" width="167.531" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="218.531" y="136">--lua-desync=pass</text><rect class="v03-s04-dry-bxo" x="387.062" y="116" width="167.531" height="28" rx="7"/><text class="v03-s04-dry-mc v03-s04-dry-fg v03-s04-dry-ns" x="394.062" y="136">--lua-desync=pass</text><text class="v03-s04-dry-sm v03-s04-dry-mu" x="600" y="136">→ профиль 3</text></g>
<g class="a v03-s04-dry-e5"><text class="v03-s04-dry-cap" x="10" y="186">что напечатала программа</text></g>
<g class="a v03-s04-dry-e6"><text class="v03-s04-dry-mk" x="14" y="212">we have 3 user defined desync profile(s)</text><text class="v03-s04-dry-sm v03-s04-dry-mu" x="377.375" y="212">два разделителя, три профиля</text></g>
<g class="a v03-s04-dry-e7"><rect class="v03-s04-dry-bx" x="14" y="226" width="736.359" height="28" rx="6"/><text class="v03-s04-dry-mz v03-s04-dry-mu" x="26" y="244">profile 1 (noname) lua pass( </text><text class="v03-s04-dry-mz v03-s04-dry-amb" x="253.016" y="244">range_in=a0-a0</text><text class="v03-s04-dry-mz" x="362.609" y="244"> </text><text class="v03-s04-dry-mz v03-s04-dry-amb" x="370.438" y="244">range_out=x0-x0</text><text class="v03-s04-dry-mz" x="487.859" y="244"> </text><text class="v03-s04-dry-mz v03-s04-dry-amb" x="495.688" y="244">payload_type= tls_client_hello</text><text class="v03-s04-dry-mz v03-s04-dry-fg" x="730.531" y="244">)</text></g>
<g class="a v03-s04-dry-e8"><text class="v03-s04-dry-sm v03-s04-dry-mu" x="766" y="244">всё, как написали</text></g>
