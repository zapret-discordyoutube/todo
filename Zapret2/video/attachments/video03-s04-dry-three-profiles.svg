<g class="a v03-s04-dry-e12"><text class="v03-s04-dry-sm v03-s04-dry-mu" x="766" y="308">a: до обоих pass</text></g>
<g class="a v03-s04-dry-e13"><rect class="v03-s04-dry-bx" x="14" y="318" width="634.594" height="28" rx="6"/><text class="v03-s04-dry-mz v03-s04-dry-mu" x="26" y="336">profile 3 (noname) lua pass( </text><text class="v03-s04-dry-mz v03-s04-dry-amb" x="253.016" y="336">range_in=a0-a0</text><text class="v03-s04-dry-mz" x="362.609" y="336"> </text><text class="v03-s04-dry-mz v03-s04-dry-acc" x="370.438" y="336">range_out=a0-a0</text><text class="v03-s04-dry-mz" x="487.859" y="336"> </text><text class="v03-s04-dry-mz v03-s04-dry-acc" x="495.688" y="336">payload_type= all</text><text class="v03-s04-dry-mz v03-s04-dry-fg" x="628.766" y="336">)</text></g>
