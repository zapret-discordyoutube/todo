<g class="a v03-s04-dry-e18"><text class="v03-s04-dry-tk v03-s04-dry-c" x="480" y="416">Настройка копируется в вызов в момент его разбора, а --new возвращает её к начальной.</text></g>
<g class="a v03-s04-dry-e19"><text class="v03-s04-dry-sm v03-s04-dry-mu v03-s04-dry-c" x="480" y="442">Если бы pass стоял раньше диапазона, он получил бы начальный «x».</text></g>
