<svg xmlns="http://www.w3.org/2000/svg" class="v03-s04-dry" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="v03-s04-dry-t v03-s04-dry-d">
<title id="v03-s04-dry-t">Три профиля в режиме разбора</title>
<desc id="v03-s04-dry-d">Запуск программы в режиме разбора с отладкой, без пакетов: команда из трёх частей, разделённых двумя --new, даёт три профиля, заданных пользователем; профиль 1 получил то, что написано (входящие a, исходящие x, данные tls_client_hello), профиль 2 только начальные значения (входящие x, исходящие a, данные любые), профиль 3 напечатан двумя строками по числу вызовов pass: входящие a записаны раньше обоих вызовов, остальное начальное; настройка копируется в вызов при его разборе, а --new возвращает её к начальной.</desc>
