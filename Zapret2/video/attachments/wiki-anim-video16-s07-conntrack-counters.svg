<rect class="bg" x="0" y="0" width="960" height="626"/>
<g class="a e1"><text class="cap" x="20" y="24">что считает ядро: ct original packets 1-12</text></g>
<g class="a e2"><text class="sm" x="20" y="56">игрушка (выдумана): охранник у турникета пускает к стойке только первых трёх гостей (предел три)</text></g>
<g class="a e3"><circle class="bxo" cx="56" cy="90" r="18"/><text class="tk c nos" x="56" y="96">1</text><text class="sm c ok tk" x="56" y="126">к стойке</text></g>
<g class="a e4"><circle class="bxo" cx="148" cy="90" r="18"/><text class="tk c nos" x="148" y="96">2</text><text class="sm c ok tk" x="148" y="126">к стойке</text></g>
<g class="a e5"><circle class="bxo" cx="240" cy="90" r="18"/><text class="tk c nos" x="240" y="96">3</text><text class="sm c ok tk" x="240" y="126">к стойке</text></g>
<g class="a e6"><circle class="bx" cx="332" cy="90" r="18"/><text class="tk c nos" x="332" y="96">4</text><text class="sm c mu" x="332" y="126">мимо</text></g>
<g class="a e7"><circle class="bx" cx="424" cy="90" r="18"/><text class="tk c nos" x="424" y="96">5</text><text class="sm c mu" x="424" y="126">мимо</text></g>
<g class="a e8"><text class="sm" x="500" y="86">считается и сам гость: первого тоже посчитали,</text><text class="sm" x="500" y="108">первый это номер один, а четвёртый идёт мимо</text></g>
<g class="a e9"><text class="cap" x="20" y="176">таблица conntrack в ядре (по общим сведениям): у каждого соединения два счётчика</text></g>
<g class="a e10"><rect class="bx" x="20" y="190" width="100" height="64" rx="8"/><text class="tk c" x="70" y="227">клиент</text><rect class="bx" x="840" y="190" width="100" height="64" rx="8"/><text class="tk c" x="890" y="227">сервер</text></g>
<g class="a e11"><path class="la" d="M130 206L820.0 206.0"/><polygon class="ha" points="830,206 820.0,211.0 820.0,201.0"/><text class="sm acc c" x="480" y="196">исходное (original): так ушёл первый пакет, SYN</text></g>
<g class="a e12"><path class="lf" d="M830 240L140.0 240.0"/><polygon class="hf" points="130,240 140.0,235.0 140.0,245.0"/><text class="sm c" x="480" y="262">ответное (reply): в обратную сторону</text></g>
<g class="a e13 tr"><rect class="bxa" x="380" y="214" width="200" height="22" rx="5"/><text class="mk c" x="480" y="230">исходное: 0</text></g>
<g class="a e14 tr"><rect class="bxa" x="380" y="214" width="200" height="22" rx="5"/><text class="mk c" x="480" y="230">исходное: 1</text></g>
<g class="a e15 tr"><rect class="bxa" x="380" y="214" width="200" height="22" rx="5"/><text class="mk c" x="480" y="230">исходное: 2</text></g>
<g class="a e16"><rect class="bxa" x="380" y="214" width="200" height="22" rx="5"/><text class="mk c" x="480" y="230">исходное: 3</text></g>
<g class="a e17 tr"><rect class="bx" x="590" y="214" width="200" height="22" rx="5"/><text class="mk c" x="690" y="230">ответное: 0</text></g>
<g class="a e18"><rect class="bx" x="590" y="214" width="200" height="22" rx="5"/><text class="mk c" x="690" y="230">ответное: 1</text></g>
<g class="a e19"><text class="sm" x="20" y="284">считаются пакеты, а не байты: пустой ACK и пакет с 250 байтами данных равны, по одному</text></g>
<g class="a e20"><text class="sm mu" x="20" y="306">клиент: исходное = исходящее; сервер: исходное = входящее (поэтому правила на сервере зеркальные)</text></g>
<g class="a e21"><text class="cap" x="20" y="336">номер в очереди</text><text class="cap" x="190" y="336">пакет</text><text class="cap" x="440" y="336">направление</text><text class="cap" x="620" y="336">исходное</text><text class="cap" x="730" y="336">ответное</text><text class="cap" x="830" y="336">итог</text><path class="lm" d="M20 344L940 344"/></g>
<g class="a e22"><text class="mk" x="40" y="378">1</text><text class="sm tk" x="190" y="378">SYN</text><text class="sm" x="440" y="378">клиент → сервер</text><text class="mk c" x="650" y="378">1</text><text class="mk c" x="760" y="378">0</text><text class="sm ok tk" x="830" y="378">в очередь</text></g>
<g class="a e23 tr"><rect class="bxa" x="14" y="358" width="932" height="28" rx="6"/></g>
<g class="a e24"><text class="mk" x="40" y="414">2</text><text class="sm tk" x="190" y="414">SYN-ACK</text><text class="sm" x="440" y="414">сервер → клиент</text><text class="mk c" x="650" y="414">1</text><text class="mk c" x="760" y="414">1</text><text class="sm ok tk" x="830" y="414">в очередь</text></g>
<g class="a e25 tr"><rect class="bxa" x="14" y="394" width="932" height="28" rx="6"/></g>
<g class="a e26"><text class="mk" x="40" y="450">3</text><text class="sm tk" x="190" y="450">ACK</text><text class="sm" x="440" y="450">клиент → сервер</text><text class="mk c" x="650" y="450">2</text><text class="mk c" x="760" y="450">1</text><text class="sm ok tk" x="830" y="450">в очередь</text></g>
<g class="a e27 tr"><rect class="bxa" x="14" y="430" width="932" height="28" rx="6"/></g>
<g class="a e28"><text class="mk" x="40" y="486">4</text><text class="sm tk" x="190" y="486">запрос, 250 байт данных</text><text class="sm" x="440" y="486">клиент → сервер</text><text class="mk c" x="650" y="486">3</text><text class="mk c" x="760" y="486">1</text><text class="sm ok tk" x="830" y="486">в очередь</text></g>
<g class="a e29 tr"><rect class="bxa" x="14" y="466" width="932" height="28" rx="6"/></g>
<g class="a e30"><text class="sm tk" x="20" y="526">запрос это третий исходящий пакет клиента, но в очереди он четвёртый:</text><text class="sm tk" x="20" y="546">номера общие для обоих направлений, и между ними пришёл SYN-ACK</text></g>
<g class="a e31"><text class="sm" x="20" y="580">весь опыт t10: в очередь прошло 6 исходящих и 5 входящих, 6 + 5 = 11, каждое направление ниже 12</text></g>
<g class="a e32"><text class="sm mu" x="20" y="602">таблица ядра и память самой программы это разные таблицы: у программы свой счёт</text></g>
</svg>
