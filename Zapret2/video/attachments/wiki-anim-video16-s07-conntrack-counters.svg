<svg xmlns="http://www.w3.org/2000/svg" class="v16-s07-conntrack-counters" viewBox="0 0 960 626" width="960" height="626" role="img" aria-labelledby="v16-s07-conntrack-counters-t v16-s07-conntrack-counters-d">
<title id="v16-s07-conntrack-counters-t">Счётчики conntrack на примере t10</title>
<desc id="v16-s07-conntrack-counters-d">Условие «ct original packets 1-12»: ядро (conntrack) хранит для каждого соединения два счётчика пакетов, исходного направления (в котором ушёл первый пакет, у клиента это исходящее) и ответного, и считает пакеты, а не байты, включая сам проверяемый пакет; в игрушке с турникетом (предел три) первых трёх гостей ведут к стойке, четвёртый идёт мимо; в начале опыта t10 SYN клиента даёт исходное 1 (в очереди номер 1), SYN-ACK сервера ответное 1 (номер 2), ACK исходное 2 (номер 3), запрос в 250 байт исходное 3, но номер в очереди 4, потому что номера общие для обоих направлений; весь опыт: 6 исходящих и 5 входящих в очереди, 6 + 5 = 11.</desc>
