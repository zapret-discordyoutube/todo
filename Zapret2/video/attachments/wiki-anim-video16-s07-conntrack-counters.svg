.v16-s07-conntrack-counters .hf{fill:var(--fg2)}.v16-s07-conntrack-counters .ha{fill:var(--acc)}.v16-s07-conntrack-counters .hr{fill:var(--rej)}.v16-s07-conntrack-counters .hm{fill:var(--mute)}.v16-s07-conntrack-counters .ho{fill:var(--ok)}.v16-s07-conntrack-counters .hb{fill:var(--amb)}
.v16-s07-conntrack-counters .a{animation-duration:54s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
