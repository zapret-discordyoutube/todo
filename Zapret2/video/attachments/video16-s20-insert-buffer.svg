<svg xmlns="http://www.w3.org/2000/svg" class="v16-s20-insert-buffer" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="v16-s20-insert-buffer-t v16-s20-insert-buffer-d">
<title id="v16-s20-insert-buffer-t">Буфер первой вставки</title>
<desc id="v16-s20-insert-buffer-d">Раскладка буфера первой вставки опыта t10: 156 байт, готовых ещё до отправки: 20 байт заголовка IP, 32 байта заголовка TCP и 104 байта данных, начало запроса (в журнале rawsend_dissect size=156; первые байты данных 16 03 01 00 F5). Вставка не приходит из очереди: окошко, то есть правило ядра, её не выбирало. Буфер целиком уходит в сырой сокет вызовом sendto(sock, data, len, ...) (nfq2/darkmagic.c:2032). Проверь себя: порядковый номер TCP лежит в заголовке TCP (в записи пакетов у первой вставки 1196648707), а заголовок уже внутри готового буфера, поэтому его выбрала программа, не ядро. У второй вставки номер 1196648811 = 1196648707 + 104: программа сдвигает номер на длину первой части (lua/zapret-lib.lua:1287).</desc>
<style>.v16-s20-insert-buffer{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
