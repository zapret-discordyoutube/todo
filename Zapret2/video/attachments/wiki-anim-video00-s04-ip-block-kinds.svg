<svg xmlns="http://www.w3.org/2000/svg" class="v00-s04-ip-block-kinds" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="v00-s04-ip-block-kinds-t v00-s04-ip-block-kinds-d">
<title id="v00-s04-ip-block-kinds-t">Три вида блока по адресу</title>
<desc id="v00-s04-ip-block-kinds-d">Документация говорит, что zapret не может обойти блок по адресу, и описывает три вида: полный, когда не доходит ничего, ни пингов, ни соединения на порт; по порту или протоколу, когда соединение даже не устанавливается; и частичный, когда соединение устанавливается, а дальше всё зависает или обрывается; для первых двух без проксирования ничего не сделать, а третий остаётся серой зоной.</desc>
