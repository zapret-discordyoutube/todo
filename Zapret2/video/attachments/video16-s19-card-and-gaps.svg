<svg xmlns="http://www.w3.org/2000/svg" class="v16-s19-card-and-gaps" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="v16-s19-card-and-gaps-t v16-s19-card-and-gaps-d">
<title id="v16-s19-card-and-gaps-t">Карточка пакета и непроверенное</title>
<desc id="v16-s19-card-and-gaps-d">Итог второй части: карточка пакета в программе, ключевые числа и то, что не проверяли. Шесть выученных полей пакета номер четыре из журнала: id 4 (номер в очереди), len 302 (длина от заголовка IP), mark 00000000 (метка), ifin (0) (входного интерфейса нет), ifout c0(3) (выходной интерфейс), вердикт drop. Ключевые числа: очередь 200; в очереди до 4096 пакетов (nfq2/params.h:27); буфер приёма 1048576 байт (params.h:28); 1062 пакета по всем журналам лаборатории: 990 пропущено без изменений, 22 изменено, 50 выброшено (1062 = 990 + 22 + 50); в опыте t10 очередь видела 11 пакетов, а на проводе клиента 12. Чего не проверяли: внутренности библиотеки очереди (читали только заголовки); что ядро делает при переполнении очереди и как работает fail-open; запуск с неправильным номером очереди; остановку посреди работающего скрипта; цены на настоящем оборудовании (есть только оценка на одном компьютере); про настоящее ТСПУ мы по-прежнему ничего не знаем, у нас только модель. Внизу карта третьей части: отправщик сырых пакетов, метка и ловушка петли, предел двенадцати, другие системы, первый пакет соединения.</desc>
