<g class="a e5 tr"><circle class="dot" cx="0" cy="0" r="7"/><rect x="-14" y="-24" width="28" height="14" rx="3" class="bxr"/><text class="ix c ns" x="0" y="-13" style="font-size:13px">MD5</text></g>
<g class="a e6"><path class="lr" d="M758 80L778 100M758 100L778 80"/><text class="sm tk rej c ns" x="866" y="88">ядро выбросило</text><text class="sm tk rej c ns" x="866" y="106">подделку</text></g>
<g class="a e7"><rect class="bxa" x="10" y="176" width="224" height="96" rx="8"/><text class="smk ns" x="22" y="200">c0 · клиент</text><text class="sm ns" x="22" y="228">подделка видна, срок 64</text><text class="sm ns" x="22" y="262">с MD5, заголовок 52 Б</text></g>
