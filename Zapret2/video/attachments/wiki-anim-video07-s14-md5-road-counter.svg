.v07-s14-md5-road-counter .fa{fill:var(--tint);stroke:none}.v07-s14-md5-road-counter .fr{fill:var(--rejt);stroke:none}.v07-s14-md5-road-counter .fb{fill:var(--ambt);stroke:none}.v07-s14-md5-road-counter .fo{fill:var(--okt);stroke:none}
.v07-s14-md5-road-counter .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
