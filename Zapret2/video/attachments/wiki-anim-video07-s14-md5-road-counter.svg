<g class="a e9"><rect class="bxa" x="486" y="176" width="224" height="96" rx="8"/><text class="smk ns" x="498" y="200">r1 · выход роутера 1</text><text class="sm ns" x="498" y="228">подделка видна, срок 63</text><text class="sm ns" x="498" y="262">роутер MD5 не проверяет</text></g>
<g class="a e10"><rect class="bxa" x="724" y="176" width="224" height="96" rx="8"/><text class="smk ns" x="736" y="200">s0 · сервер</text><text class="sm ns" x="736" y="228">подделка видна, срок 63</text><text class="sm ns" x="736" y="262">видна, но не принята</text></g>
<g class="a e11"><rect class="bxo" x="10" y="288" width="462" height="84" rx="8"/><text class="smk ns" x="24" y="312">счётчик ядра сервера</text><text class="mk ns" x="24" y="336">TcpExt TCPMD5Unexpected: 0 → 1</text><text class="sm mu ns" x="24" y="360">читаем как «подпись, которой не ждали»: наше чтение</text></g>
<g class="a e12"><rect class="bxo" x="488" y="288" width="462" height="84" rx="8"/><text class="smk ns" x="502" y="312">приложение сервера: 250 Б, чисто</text><text class="sm ns" x="502" y="336">клиент: ответ получен</text><text class="sm mu ns" x="502" y="360">с 16 байтами 00 11 … ff вручную: то же</text></g>
<g class="a e13"><text class="cap" x="10" y="392">код: lua/zapret-lib.lua, строки 1021-1025</text></g>
<g class="a e14"><rect class="bx" x="10" y="402" width="940" height="136" rx="8"/><rect class="bxa" x="18" y="506" width="924" height="24" rx="4"/><text class="ix ns" x="26" y="426">1021</text><text class="cd ns" x="70" y="426">if fooling_options.tcp_md5 then</text><text class="ix ns" x="26" y="450">1022</text><text class="cd ns" x="70" y="450">  if find_tcp_option(dis.tcp.options,TCP_KIND_MD5) then</text><text class="ix ns" x="26" y="474">1023</text><text class="cd ns" x="70" y="474">    DLOG("apply_fooling: md5 option already present")</text><text class="ix ns" x="26" y="498">1024</text><text class="cd ns" x="70" y="498">  else</text><text class="ix ns" x="26" y="522">1025</text><text class="cdh ns" x="70" y="522">    table.insert(dis.tcp.options,{kind=TCP_KIND_MD5, data=prepare_bin(fooling_options.tcp_md5,brandom(16))})</text></g>
<g class="a e15"><text class="sm" x="10" y="560">такой опции ещё нет: в список опций добавляется новая, данные берутся из значения или 16 случайных байт</text></g>
<g class="a e16"><text class="sm tk" x="10" y="582">длина не проверяется: что записано в значении, то и попадает в опцию</text></g>
</svg>
