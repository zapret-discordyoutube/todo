<svg xmlns="http://www.w3.org/2000/svg" class="v07-s14-md5-road-counter" viewBox="0 0 960 596" width="960" height="596" role="img" aria-labelledby="v07-s14-md5-road-counter-t v07-s14-md5-road-counter-d">
<title id="v07-s14-md5-road-counter-t">Опция MD5: дорога и счётчик</title>
<desc id="v07-s14-md5-road-counter-d">Подделка с опцией MD5 на дороге из одного роутера со сроком 64: она видна у клиента, на входе и выходе роутера и у сервера, игрушечный инспектор на входе роутера видит её длиной 680 и разрешает, роутер опцию не проверяет, а ядро сервера выбрасывает подделку, и счётчик TcpExt TCPMD5Unexpected растёт с 0 до 1, который мы читаем как подпись, которой не ждали; приложение сервера получает чистые 250 байт, клиент получает ответ, с шестнадцатью байтами, заданными вручную, результат тот же; в коде zapret-lib.lua строки 1021-1025 добавляют опцию MD5 в список опций, если её там ещё нет, а длину не проверяют.</desc>
<style>
.v07-s14-md5-road-counter{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
