<svg xmlns="http://www.w3.org/2000/svg" class="v08-s24-six-readers" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="v08-s24-six-readers-t v08-s24-six-readers-d">
<title id="v08-s24-six-readers-t">Шесть игрушечных читателей</title>
<desc id="v08-s24-six-readers-d">Шесть игрушечных читателей как модели проекта, а не настоящее оборудование: пакетный ищет имя в каждом пакете отдельно, склейщик клеит данные в порядке прихода, первый записал собирает по номерам и оставляет первую запись, последний записал оставляет последнюю запись, последний записал с решением в конце принимает то же самое решение один раз, когда поток закончился, а строго по порядку берёт сегмент, только если он начинается не позже ожидаемого байта; все читают запись пакетов на входе роутера вместе с фейками, принимают любой пакет как есть, не проверяют опцию MD5, контрольную сумму и срок жизни, слово видит значит что имя найдено, а слеп значит что имя не найдено и приём сработал.</desc>
