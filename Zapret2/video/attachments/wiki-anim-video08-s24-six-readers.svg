<rect class="bg" x="0" y="0" width="960" height="620"/>
<g><text class="cap" x="40" y="22">шесть игрушечных читателей: наши модели</text></g>
<g class="a e1"><rect class="bxb" x="40" y="34" width="880" height="56" rx="8"/><text class="sm tk" x="54" y="58">в лаборатории нет настоящего ТСПУ: читатели это модели проекта</text><text class="sm" x="54" y="80">«сработало» значит только «обошло нашу модель»</text></g>
<g class="a e2"><text class="sm" x="40" y="114">читатели читают запись пакетов у входа в роутер: всё, что дошло, вместе с фейками</text><text class="sm tk" x="40" y="136">любой пакет они принимают как есть: опцию MD5, сумму и срок жизни не проверяют</text></g>
<g class="a e3"><path class="lr" d="M41 162Q52 152 63 162Q52 172 41 162Z"/><circle class="hr" cx="52" cy="162" r="3.5"/><text class="sm" x="72" y="167">видит: имя найдено, нас не обманули</text><path class="lo" d="M461 160Q472 170 483 160"/><path class="lo" d="M466 165L464 170M472 167L472 172M478 165L480 170"/><text class="sm" x="492" y="167">слеп: имя не найдено, приём сработал</text></g>
<g class="a e4"><text class="sm mu" x="40" y="198">пять знакомых по выпуску «Перемешать: disorder» и один новый</text></g>
<g class="a e5"><rect class="bx" x="40" y="212" width="280" height="176" rx="10"/><text class="sm tk" x="52" y="236">пакетный</text><rect class="bxa" x="54" y="268" width="70" height="20" rx="3"/><circle class="lr" cx="98" cy="278" r="13" style="fill:none"/><path class="lr" d="M108 288L120 300"/><text class="ix mu" x="140" y="283">один пакет</text><text class="sm" x="52" y="330">ищет имя в каждом пакете</text><text class="sm" x="52" y="350">отдельно</text><text class="ix mu" x="52" y="377">решает: после каждого пакета</text></g>
<g class="a e6"><rect class="bx" x="340" y="212" width="280" height="176" rx="10"/><text class="sm tk" x="352" y="236">склейщик</text><rect class="bxa" x="354" y="268" width="46" height="20" rx="3"/><text class="ix tk c" x="377" y="283">1</text><rect class="bxa" x="406" y="268" width="46" height="20" rx="3"/><text class="ix tk c" x="429" y="283">2</text><rect class="bxa" x="458" y="268" width="46" height="20" rx="3"/><text class="ix tk c" x="481" y="283">3</text><text class="ix mu" x="514" y="283">по приходу</text><text class="sm" x="352" y="330">клеит данные в порядке</text><text class="sm" x="352" y="350">прихода</text><text class="ix mu" x="352" y="377">решает: после каждого пакета</text></g>
<g class="a e7"><rect class="bx" x="640" y="212" width="280" height="176" rx="10"/><text class="sm tk" x="652" y="236">первый записал</text><rect class="bx" x="654" y="268" width="24" height="20" rx="0"/><rect class="bxa" x="678" y="268" width="24" height="20" rx="0"/><rect class="bxa" x="702" y="268" width="24" height="20" rx="0"/><rect class="bxa" x="726" y="268" width="24" height="20" rx="0"/><rect class="bx" x="750" y="268" width="24" height="20" rx="0"/><rect class="bx" x="774" y="268" width="24" height="20" rx="0"/><rect class="bx" x="798" y="268" width="24" height="20" rx="0"/><rect class="bx" x="822" y="268" width="24" height="20" rx="0"/><rect class="bx" x="846" y="268" width="24" height="20" rx="0"/><rect class="bxs" x="686" y="276" width="8" height="6" rx="1"/><path class="lm" d="M687.5 276L687.5 273Q690 269 692.5 273L692.5 276"/><rect class="bxs" x="710" y="276" width="8" height="6" rx="1"/><path class="lm" d="M711.5 276L711.5 273Q714 269 716.5 273L716.5 276"/><rect class="bxs" x="734" y="276" width="8" height="6" rx="1"/><path class="lm" d="M735.5 276L735.5 273Q738 269 740.5 273L740.5 276"/><text class="ix mu" x="654" y="306">занятая клетка закрыта</text><text class="sm" x="652" y="330">по номерам, у перекрытых</text><text class="sm" x="652" y="350">байтов первая запись</text><text class="ix mu" x="652" y="377">решает: после каждого пакета</text></g>
<g class="a e8"><rect class="bx" x="40" y="402" width="280" height="176" rx="10"/><text class="sm tk" x="52" y="426">последний записал</text><rect class="bx" x="54" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="78" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="102" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="126" y="458" width="24" height="20" rx="0"/><rect class="bx" x="150" y="458" width="24" height="20" rx="0"/><rect class="bx" x="174" y="458" width="24" height="20" rx="0"/><rect class="bx" x="198" y="458" width="24" height="20" rx="0"/><rect class="bx" x="222" y="458" width="24" height="20" rx="0"/><rect class="bx" x="246" y="458" width="24" height="20" rx="0"/><path class="lr" d="M114 448L114 456"/><polygon class="hr" points="114,458 110,452 118,452"/><text class="ix mu" x="54" y="496">новая запись затирает старую</text><text class="sm" x="52" y="520">по номерам, у перекрытых</text><text class="sm" x="52" y="540">байтов последняя запись</text><text class="ix mu" x="52" y="567">решает: после каждого пакета</text></g>
<g class="a e9"><rect class="bxb" x="340" y="402" width="280" height="176" rx="10"/><text class="sm tk" x="352" y="424">последний записал,</text><text class="sm tk" x="352" y="442">судит в конце</text><rect class="bxb" x="572" y="410" width="40" height="20" rx="5"/><text class="ix tk c" x="592" y="424">нов.</text><rect class="bx" x="354" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="378" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="402" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="426" y="458" width="24" height="20" rx="0"/><rect class="bx" x="450" y="458" width="24" height="20" rx="0"/><rect class="bx" x="474" y="458" width="24" height="20" rx="0"/><rect class="bx" x="498" y="458" width="24" height="20" rx="0"/><rect class="bx" x="522" y="458" width="24" height="20" rx="0"/><rect class="bx" x="546" y="458" width="24" height="20" rx="0"/><path class="lr" d="M414 448L414 456"/><polygon class="hr" points="414,458 410,452 418,452"/><path class="la" d="M577 448Q588 438 599 448Q588 458 577 448Z"/><circle class="ha" cx="588" cy="448" r="3.5"/><text class="ix mu" x="354" y="496">глазок мигает один раз, в конце</text><text class="sm" x="352" y="520">те же правила, но решает один</text><text class="sm" x="352" y="540">раз, когда поток закончился</text><text class="ix tk" x="352" y="567">решает: один раз, в самом конце</text></g>
<g class="a e10"><rect class="bx" x="640" y="402" width="280" height="176" rx="10"/><text class="sm tk" x="652" y="426">строго по порядку</text><rect class="bxa" x="654" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="678" y="458" width="24" height="20" rx="0"/><rect class="bxa" x="702" y="458" width="24" height="20" rx="0"/><rect class="bx" x="726" y="458" width="24" height="20" rx="0"/><rect class="bx" x="750" y="458" width="24" height="20" rx="0"/><rect class="bx" x="774" y="458" width="24" height="20" rx="0"/><rect class="bx" x="798" y="458" width="24" height="20" rx="0"/><rect class="bx" x="822" y="458" width="24" height="20" rx="0"/><rect class="bx" x="846" y="458" width="24" height="20" rx="0"/><path class="lr" d="M726 450L726 486"/><text class="ix mu" x="654" y="496">ворота: будущее выброшено</text><text class="sm" x="652" y="520">берёт сегмент, начинающийся</text><text class="sm" x="652" y="540">не позже ожидаемого байта</text><text class="ix mu" x="652" y="567">решает: после каждого пакета</text></g>
</svg>
