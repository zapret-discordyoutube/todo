<title id="v01-s07-cut-midsld-t">Один запрос, разрезанный на два пакета</title>
<desc id="v01-s07-cut-midsld-d">Запрос в 250 байт данных уходит двумя пакетами (кадры 170 и 212 байт, байты 1–104 и 105–250, пауза 3,972 мс) с разрезом посередине «www.exa|mple.com», и сервер собирает по номерам все 250 байт.</desc>
