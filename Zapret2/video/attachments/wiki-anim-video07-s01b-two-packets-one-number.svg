<title id="video07-s01b-two-packets-one-number-t">Два пакета, один номер</title>
<desc id="video07-s01b-two-packets-one-number-d">Две ленты байтов с одним номером 1: настоящее приветствие в 250 байт с именем www.example.com на смещениях 97–111 и подделка в 680 байт с именем www.microsoft.com на смещениях 125–141, и на провод они уходят двумя пакетами подряд, сначала подделка, за ней настоящее, и в нашем тесте так было в 110 запусках из 110.</desc>
