<svg xmlns="http://www.w3.org/2000/svg" class="v04-s13-resolve-switch" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="v04-s13-resolve-switch-t v04-s13-resolve-switch-d">
<title id="v04-s13-resolve-switch-t">Переводчик метки: выбор по типу и проверка границ</title>
<desc id="v04-s13-resolve-switch-d">Переводчик метки ResolvePos получает данные пакета, их размер, тип нагрузки и метку, а возвращает номер байта или −1 («не нашлось»). Один выбор по типу: запрос HTTP идёт в HttpPos, приветствие TLS в TLSPos, любой другой тип в AnyProtoPos, которая понимает только числа, и для слова там нет ошибки, только «не нашлось». Для слов HttpPos и TLSPos зовут общую HostPos, а любой путь заканчивается проверкой границ CheckPos: номер не меньше нуля и меньше размера, иначе −1. Отрицательное число сначала прибавляется к размеру: −10 при размере 250 даёт 240.</desc>
