<svg xmlns="http://www.w3.org/2000/svg" class="v06-s10-seqovl-code-steps" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="v06-s10-seqovl-code-steps-t v06-s10-seqovl-code-steps-d">
<title id="v06-s10-seqovl-code-steps-t">Пять шагов накладки в коде</title>
<desc id="v06-s10-seqovl-code-steps-d">Код блока про накладку в функции multidisorder_send (lua/zapret-antidpi.lua:564-581) по пяти шагам: накладку получает только вторая часть, это часть с индексом 1 (564), метка seqovl должна стоять левее первого разреза, иначе накладка отменяется (565), число накладок равно Lua-значению метки минус один (568), узор по умолчанию один нулевой байт (569) и помощник pattern ставит его перед настоящими байтами части (577), а номер начала пакета равен смещению начала части минус число накладок (581); на выдуманных числах с первым разрезом 10 и меткой 4 накладок 4, пакет начинается на смещении 10 минус 4, то есть 6, и серые клетки 6-9 ложатся на хвост первой части, а проверка на бумаге для разреза 12 и метки 5 даёт 5 накладок и начало пакета на смещении 7, это арифметика по формуле, а не запуск.</desc>
