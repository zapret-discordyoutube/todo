<g class="a e18"><rect class="bxd" x="324" y="454" width="44" height="28" rx="0"/><text class="ix c mu" x="346" y="473">6</text><rect class="bxd" x="368" y="454" width="44" height="28" rx="0"/><text class="ix c mu" x="390" y="473">7</text><rect class="bxd" x="412" y="454" width="44" height="28" rx="0"/><text class="ix c mu" x="434" y="473">8</text><rect class="bxd" x="456" y="454" width="44" height="28" rx="0"/><text class="ix c mu" x="478" y="473">9</text><rect class="bxb" x="500" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="522" y="473">10</text><rect class="bxb" x="544" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="566" y="473">11</text><rect class="bxb" x="588" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="610" y="473">12</text><rect class="bxb" x="632" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="654" y="473">13</text><rect class="bxb" x="676" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="698" y="473">14</text><rect class="bxb" x="720" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="742" y="473">15</text><rect class="bxb" x="764" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="786" y="473">16</text><rect class="bxb" x="808" y="454" width="44" height="28" rx="0"/><text class="ix c tk" x="830" y="473">17</text></g>
<g class="a e19"><text class="sm r mu" x="314" y="473">пакет:</text><text class="sm" x="324" y="508">накладок 4: серые клетки 6…9 ложатся на хвост первой части</text></g>
<g class="a e20"><rect class="bxd" x="40" y="532" width="880" height="34" rx="6"/><text class="sm tk" x="52" y="554">проверь себя: разрез на смещении 12, метка на смещении 5: сколько накладок, где начало?</text></g>
<g class="a e21"><rect class="bxo" x="40" y="574" width="880" height="34" rx="6"/><text class="sm tk" x="52" y="596">5 накладок; начало на смещении 12 − 5 = 7; это арифметика по формуле, а не запуск</text></g>
<g class="a e22"><text class="sm" x="40" y="632">формула: накладок S (смещение метки), начало P − S (P — первый разрез); S строго меньше P</text></g>
