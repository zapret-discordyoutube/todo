<g class="a e5"><rect class="bx" x="40" y="324" width="880" height="74" rx="8"/><rect class="bxa" x="54" y="334" width="157.2" height="22" rx="11"/><text class="cap acc c" x="132.6" y="349.5">документация</text><text class="m mu" x="214" y="350">docs/manual.md, раздел «Система ipban»</text></g>
<g class="a e6"><rect class="fa" x="465.5" y="365" width="229.4" height="25" rx="4"/><text class="sm" x="54" y="382">…ip адреса из этого списка не обходятся автономно, </text><text class="sm tk" x="468.5" y="382">требуется VPN или прокси</text><text class="sm" x="691.8" y="382">.</text></g>
