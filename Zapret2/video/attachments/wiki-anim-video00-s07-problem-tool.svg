<svg xmlns="http://www.w3.org/2000/svg" class="v00-s07-problem-tool" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="v00-s07-problem-tool-t v00-s07-problem-tool-d">
<title id="v00-s07-problem-tool-t">Проблема и инструмент: что чем лечится</title>
<desc id="v00-s07-problem-tool-d">Таблица «проблема и инструмент»: подмену DNS по общим сведениям лечит другой или шифрованный DNS, блок по адресу и по порту лечат VPN или прокси, а блок по имени сайта и по сигнатуре протокола это случай zapret2, результат которого нужно проверять; для адресов из списка блокировок документация прямо пишет, что требуется VPN или прокси, а сам zapret2 с этим списком ничего не делает и трафик в VPN не направляет, поэтому главный вопрос всегда один, на каком месте пути стоит помеха.</desc>
