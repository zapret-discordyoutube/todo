<g class="a e2"><rect class="bx" x="40" y="72" width="340" height="70" rx="8"/><text class="tk" x="54" y="102">подмена DNS</text><text class="sm mu" x="54" y="124">ответ DNS подменён</text><path class="lf" d="M384 107L382 107"/><polygon class="hf" points="392,107 382,112 382,102"/><rect class="bx" x="396" y="72" width="276" height="70" rx="8"/><text class="tk" x="410" y="102">другой DNS</text><text class="sm mu" x="410" y="124">или шифрованный DNS</text><rect class="bxb" x="699.5" y="96" width="220.5" height="22" rx="11"/><text class="cap amb c" x="809.7" y="111.5">по общим сведениям</text></g>
<g class="a e3"><rect class="bx" x="40" y="154" width="340" height="70" rx="8"/><text class="tk" x="54" y="184">блок по адресу и по порту</text><text class="sm mu" x="54" y="206">пакеты идут на заблокированный адрес</text><path class="lf" d="M384 189L382 189"/><polygon class="hf" points="392,189 382,194 382,184"/><rect class="bx" x="396" y="154" width="276" height="70" rx="8"/><text class="tk" x="410" y="195">VPN или прокси</text><rect class="bxb" x="699.5" y="178" width="220.5" height="22" rx="11"/><text class="cap amb c" x="809.7" y="193.5">по общим сведениям</text></g>
