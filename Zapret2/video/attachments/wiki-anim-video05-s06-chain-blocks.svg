<g><text class="cap" x="40" y="24">цепочка multisplit до цикла частей</text><text class="cap" x="560" y="24">что может пойти иначе</text></g>
<g class="a e1"><rect class="bxa" x="40" y="38" width="480" height="62" rx="6"/><circle class="bxa" cx="66" cy="68" r="13"/><text class="tk c ns" x="66" y="73">1</text><text class="tk" x="92" y="60">строка стратегии</text><text class="ix r" x="508" y="60">zapret-antidpi.lua:497</text><text class="sm" x="92" y="77">pos текстом; без pos берётся «2»; два pos: первый</text></g>
<g class="a e2"><rect class="bxa" x="40" y="104" width="480" height="62" rx="6"/><circle class="bxa" cx="66" cy="134" r="13"/><text class="tk c ns" x="66" y="139">2</text><text class="tk" x="92" y="126">ворота</text><text class="ix r" x="508" y="126">zapret-antidpi.lua:484-495</text><text class="sm" x="92" y="143">TCP? направление (обычно наружу)? тип известен?</text></g>
<g class="a e3"><rect class="bxa" x="40" y="170" width="480" height="62" rx="6"/><circle class="bxa" cx="66" cy="200" r="13"/><text class="tk c ns" x="66" y="205">3</text><text class="tk" x="92" y="192">данные</text><text class="ix r" x="508" y="192">zapret-antidpi.lua:494-495</text><text class="sm" x="92" y="209">блоб, сборка или пакет; не пусты ли?</text></g>
<g class="a e4"><rect class="bxa" x="40" y="236" width="480" height="62" rx="6"/><circle class="bxa" cx="66" cy="266" r="13"/><text class="tk c ns" x="66" y="271">4</text><text class="tk" x="92" y="258">мост в Си</text><text class="ix r" x="508" y="258">zapret-antidpi.lua:500</text><text class="sm" x="92" y="275">метки в смещения с нуля, ненайденные прочь,</text><text class="sm" x="92" y="291">сортировка и склейка повторов</text></g>
<g class="a e5"><rect class="bxa" x="40" y="302" width="480" height="62" rx="6"/><circle class="bxa" cx="66" cy="332" r="13"/><text class="tk c ns" x="66" y="337">5</text><text class="tk" x="92" y="324">плюс один</text><text class="ix r" x="508" y="324">lua.c:3347</text><text class="sm" x="92" y="341">в Lua каждое число +1, в журнал оно идёт с −1</text></g>
<g class="a e6"><rect class="bxa" x="40" y="368" width="480" height="62" rx="6"/><circle class="bxa" cx="66" cy="398" r="13"/><text class="tk c ns" x="66" y="403">6</text><text class="tk" x="92" y="390">вычёркивание</text><text class="ix r" x="508" y="390">zapret-antidpi.lua:502-503</text><text class="sm" x="92" y="407">единицу прочь; список пуст: резать нечего</text></g>
<g class="a e7"><rect class="bxd" x="40" y="434" width="480" height="62" rx="6"/><circle class="bx" cx="66" cy="464" r="13"/><text class="tk c ns" x="66" y="469">7</text><text class="tk mu" x="92" y="456">цикл частей</text><text class="ix r" x="508" y="456">zapret-antidpi.lua:504-507</text><text class="sm mu" x="92" y="473">следующая часть выпуска</text></g>
