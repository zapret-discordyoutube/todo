<svg xmlns="http://www.w3.org/2000/svg" class="v05-s06-chain-blocks" viewBox="0 0 960 596" width="960" height="596" role="img" aria-labelledby="v05-s06-chain-blocks-t v05-s06-chain-blocks-d">
<title id="v05-s06-chain-blocks-t">Цепочка от строки до списка позиций</title>
<desc id="v05-s06-chain-blocks-d">Цепочка от строки pos до готового списка позиций в функции multisplit: строка (lua/zapret-antidpi.lua:497), ворота (484-495), данные (494-495), мост в Си (500), плюс один (nfq2/lua.c:3347), вычёркивание единицы (502-503) и седьмой блок, цикл частей (504-507), который разберёт следующая часть выпуска, а справа четыре исхода до отправки частей: ворота закрыты, плохой список меток, метки не нашлись и всё нашлось, причём в первых трёх оригинал уходит целым, а в четвёртом его выбросят после отправки частей.</desc>
<style>.v05-s06-chain-blocks{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
