<rect class="bg" x="0" y="0" width="960" height="545"/>
<g><text class="cap" x="40" y="22">что мы знаем: три приёма, пять игрушек, один наш сервер</text><rect class="pl" x="692.1" y="4" width="227.9" height="24" rx="12"/><text class="sm c" x="806" y="21">наши игрушки и наш Linux</text></g>
<g class="a e1"><text class="cap" x="190" y="44">что уходит</text><text class="cap" x="190" y="60">с клиента</text><text class="cap" x="378" y="44">что делает</text><text class="cap" x="378" y="60">наш сервер</text><text class="cap" x="566" y="44">кого из наших</text><text class="cap" x="566" y="60">игрушек обманул</text><text class="cap" x="754" y="44">чем</text><text class="cap" x="754" y="60">ломается</text><path class="lm" d="M40 82L920 82"/></g>
<g class="a e2"><rect class="bx" x="40" y="92" width="880" height="112" rx="8"/><text class="mk" x="54" y="118">syndata</text><text class="sm mu" x="54" y="138"></text><text class="sm mu" x="54" y="138">SYN с данными</text><text class="sm" x="190" y="118">SYN с 16 байтами, по</text><text class="sm" x="190" y="136">умолчанию нули;</text><text class="sm" x="190" y="154">IP 76; рядом</text><text class="sm" x="190" y="172">пакет-обломок:</text><text class="sm" x="190" y="190">протокол 255, TTL 1</text><text class="sm" x="378" y="118">подтверждает 1,</text><text class="sm" x="378" y="136">данные SYN в поток</text><text class="sm" x="378" y="154">не берёт;</text><text class="sm" x="378" y="172">приветствие 250 байт</text><text class="sm" x="378" y="190">целиком</text><text class="sm" x="566" y="118">обманул «первый</text><text class="sm" x="566" y="136">решает»; не обманул</text><text class="sm" x="566" y="154">«данные SYN не</text><text class="sm" x="566" y="172">читает»</text><text class="sm" x="754" y="118">условия бьют по</text><text class="sm" x="754" y="136">единственному SYN:</text><text class="sm" x="754" y="154">TTL 1 даёт «нет</text><text class="sm" x="754" y="172">маршрута», badsum</text><text class="sm" x="754" y="190">даёт таймаут</text></g>
<g class="a e3"><rect class="bx" x="40" y="214" width="880" height="148" rx="8"/><text class="mk" x="54" y="240">rst, TTL 1</text><text class="sm mu" x="54" y="260"></text><text class="sm mu" x="54" y="260">сброс перед</text><text class="sm mu" x="54" y="278">приветствием</text><text class="sm" x="190" y="240">RST: номер 1,</text><text class="sm" x="190" y="258">подтверждение 1 при</text><text class="sm" x="190" y="276">снятом ACK, TTL 1,</text><text class="sm" x="190" y="294">IP 52; следом</text><text class="sm" x="190" y="312">приветствие</text><text class="sm" x="378" y="240">сброс не получает;</text><text class="sm" x="378" y="258">принимает 250 байт</text><text class="sm" x="566" y="240">обманул «сброс</text><text class="sm" x="566" y="258">стирает память»; без</text><text class="sm" x="566" y="276">стратегии игрушка</text><text class="sm" x="566" y="294">блокирует</text><text class="sm" x="754" y="240">TTL 2 или без</text><text class="sm" x="754" y="258">условий: сервер</text><text class="sm" x="754" y="276">закрывает</text><text class="sm" x="754" y="294">соединение, у</text><text class="sm" x="754" y="312">клиента Errno 104;</text><text class="sm" x="754" y="330">badsum: сервер</text><text class="sm" x="754" y="348">игнорирует</text></g>
<g class="a e4"><rect class="bx" x="40" y="372" width="880" height="130" rx="8"/><text class="mk" x="54" y="398">synack</text><text class="sm mu" x="54" y="418"></text><text class="sm mu" x="54" y="418">ответ раньше</text><text class="sm mu" x="54" y="436">вопроса</text><text class="sm" x="190" y="398">SYN-ACK от клиента с</text><text class="sm" x="190" y="416">подтверждением 0,</text><text class="sm" x="190" y="434">затем настоящий SYN</text><text class="sm" x="378" y="398">отвечает сбросом:</text><text class="sm" x="378" y="416">номер 0, окно 0;</text><text class="sm" x="378" y="434">клиент его не</text><text class="sm" x="378" y="452">слушает; 250 байт,</text><text class="sm" x="378" y="470">приветствие через</text><text class="sm" x="378" y="488">0,2 с</text><text class="sm" x="566" y="398">обманул «роли» и</text><text class="sm" x="566" y="416">«строгое</text><text class="sm" x="566" y="434">рукопожатие»; без</text><text class="sm" x="566" y="452">стратегии обе</text><text class="sm" x="566" y="470">блокируют</text><text class="sm" x="754" y="398">TTL не действует,</text><text class="sm" x="754" y="416">badsum действует:</text><text class="sm" x="754" y="434">сервер молчит</text></g>
<g class="a e5"><text class="sm tk" x="40" y="526">каждый результат относится к нашим игрушкам и нашему серверу, не к настоящему оборудованию</text></g>
</svg>
