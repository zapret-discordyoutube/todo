<svg xmlns="http://www.w3.org/2000/svg" class="v09-s10-three-tricks-table" viewBox="0 0 960 545" width="960" height="545" role="img" aria-labelledby="v09-s10-three-tricks-table-t v09-s10-three-tricks-table-d">
<title id="v09-s10-three-tricks-table-t">Три приёма до приветствия в одной таблице</title>
<desc id="v09-s10-three-tricks-table-d">Итоговая таблица первой части выпуска про три приёма до приветствия: SYN с данными уводит с клиента SYN с 16 байтами и пакет-обломок, сервер подтверждает 1 и данные не берёт, приём обманул игрушку «первый решает» и не обманул «данные SYN не читает», а ломается на условиях, которые убивают единственный SYN; сброс перед приветствием шлёт RST со сроком 1, сервер его не получает и принимает 250 байт, приём обманул игрушку «сброс стирает память», а ломается при сроке 2 или без условий; ответ раньше вопроса шлёт подложный SYN-ACK, сервер отвечает сбросом, приветствие приходит с задержкой около 0,2 с, приём обманул игрушки «роли» и «строгое рукопожатие», условие срока жизни на нём не действует, а испорченная сумма действует.</desc>
<style>.v09-s10-three-tricks-table{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v09-s10-three-tricks-table{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
