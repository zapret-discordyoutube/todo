.v09-s10-three-tricks-table .tk{font-weight:600;fill:var(--fg)}
.v09-s10-three-tricks-table .sm{font-size:14.5px}
.v09-s10-three-tricks-table .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v09-s10-three-tricks-table .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v09-s10-three-tricks-table .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v09-s10-three-tricks-table .ix{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--mute);stroke:none}
.v09-s10-three-tricks-table .big{font-size:22px}
.v09-s10-three-tricks-table .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v09-s10-three-tricks-table .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v09-s10-three-tricks-table .mu{fill:var(--mute)}.v09-s10-three-tricks-table .fg{fill:var(--fg)}.v09-s10-three-tricks-table .acc{fill:var(--acc)}.v09-s10-three-tricks-table .rej{fill:var(--rej)}.v09-s10-three-tricks-table .ok{fill:var(--ok)}.v09-s10-three-tricks-table .amb{fill:var(--amb)}
.v09-s10-three-tricks-table .c{text-anchor:middle}.v09-s10-three-tricks-table .r{text-anchor:end}.v09-s10-three-tricks-table .ns{stroke:none}
.v09-s10-three-tricks-table .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v09-s10-three-tricks-table .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v09-s10-three-tricks-table .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v09-s10-three-tricks-table .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v09-s10-three-tricks-table .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v09-s10-three-tricks-table .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v09-s10-three-tricks-table .pl{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.v09-s10-three-tricks-table .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
.v09-s10-three-tricks-table .bxg{fill:var(--mute);fill-opacity:.2;stroke:var(--mute);stroke-width:1.4}
.v09-s10-three-tricks-table .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v09-s10-three-tricks-table .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v09-s10-three-tricks-table .fa{fill:var(--tint);stroke:none}.v09-s10-three-tricks-table .fr{fill:var(--rejt);stroke:none}.v09-s10-three-tricks-table .fb{fill:var(--ambt);stroke:none}.v09-s10-three-tricks-table .fo{fill:var(--okt);stroke:none}
.v09-s10-three-tricks-table .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v09-s10-three-tricks-table .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v09-s10-three-tricks-table .la{fill:none;stroke:var(--acc);stroke-width:2}
.v09-s10-three-tricks-table .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v09-s10-three-tricks-table .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v09-s10-three-tricks-table .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v09-s10-three-tricks-table .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v09-s10-three-tricks-table .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v09-s10-three-tricks-table .hf{fill:var(--fg2)}.v09-s10-three-tricks-table .ha{fill:var(--acc)}.v09-s10-three-tricks-table .hr{fill:var(--rej)}.v09-s10-three-tricks-table .hm{fill:var(--mute)}.v09-s10-three-tricks-table .hb{fill:var(--amb)}
.v09-s10-three-tricks-table .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v09-s10-three-tricks-table .a{animation-duration:34s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v09-s10-three-tricks-table .a{animation:none}.v09-s10-three-tricks-table .tr{display:none}}
.v09-s10-three-tricks-table .fl{fill:var(--bg);stroke:none}
.v09-s10-three-tricks-table .bxw{fill:var(--bg);stroke:var(--amb);stroke-width:1.4;stroke-dasharray:5 4}
.v09-s10-three-tricks-table .bxwa{fill:var(--bg);stroke:var(--acc);stroke-width:1.4;stroke-dasharray:5 4}
.v09-s10-three-tricks-table .bxrd{fill:none;stroke:var(--rej);stroke-width:2.4;stroke-dasharray:6 4}
.v09-s10-three-tricks-table .lbd{fill:none;stroke:var(--amb);stroke-width:2;stroke-dasharray:6 4}
.v09-s10-three-tricks-table .bxz{fill:var(--mute);fill-opacity:.28;stroke:var(--mute);stroke-width:1.2}
.v09-s10-three-tricks-table .bxoo{fill:var(--bg);stroke:var(--ok);stroke-width:2.2}
.v09-s10-three-tricks-table .bxbb{fill:var(--bg);stroke:var(--amb);stroke-width:2.2}
.v09-s10-three-tricks-table .bxrr{fill:var(--bg);stroke:var(--rej);stroke-width:2.2}
.v09-s10-three-tricks-table .bxaa{fill:var(--bg);stroke:var(--acc);stroke-width:2.2}
