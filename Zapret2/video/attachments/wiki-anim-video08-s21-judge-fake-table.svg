<svg xmlns="http://www.w3.org/2000/svg" class="v08-s21-judge-fake-table" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v08-s21-judge-fake-table-t v08-s21-judge-fake-table-d">
<title id="v08-s21-judge-fake-table-t">Судья, фейк и таблица без условия</title>
<desc id="v08-s21-judge-fake-table-d">Повтор договорённостей: в роутере стоит наша игрушка-инспектор, а у сервера наш приёмник на Linux, и слово «сработало» значит, что приём обошёл игрушку, а данные дошли до сервера целыми; фейк с опцией MD5 или с испорченной суммой умирает в ядре получателя, а фейк со сроком жизни один умирает в роутере; с условием во всех трёх функциях приложение сервера читает 250 байт, равных оригиналу, а без условия в разрезе с фейками и в перемешивании с фейками приложение получает 250 нулевых байт, в имени между двойниками имя сайта заменено выдуманным, потому что двойник подменяет только 15 байт имени, а остальное приветствие настоящее.</desc>
