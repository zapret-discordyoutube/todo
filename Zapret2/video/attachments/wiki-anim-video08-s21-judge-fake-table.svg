<rect class="bg" x="0" y="0" width="960" height="580"/>
<g><text class="cap" x="40" y="22">повтор: двое участников, фейк с условием и что бывает без него</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="150" height="70" rx="8"/><text class="sm tk c" x="115" y="70">клиент</text><text class="ix c mu" x="115" y="90">шлёт приветствие</text><rect class="bx" x="250" y="40" width="460" height="70" rx="8"/><text class="cap" x="262" y="58">роутер</text><rect class="bxb" x="320" y="66" width="330" height="38" rx="6"/><text class="sm tk c" x="485" y="82">игрушечный инспектор</text><text class="ix c fg" x="485" y="98">наша модель, не оборудование</text><rect class="bx" x="750" y="40" width="170" height="70" rx="8"/><text class="sm tk c" x="835" y="70">сервер</text><text class="ix c mu" x="835" y="90">наш приёмник: Linux</text><path class="lf" d="M190 75L240.0 75.0"/><polygon class="hf" points="250,75 240.0,80.0 240.0,70.0"/><path class="lf" d="M710 75L740.0 75.0"/><polygon class="hf" points="750,75 740.0,80.0 740.0,70.0"/></g>
<g class="a e2"><rect class="bxo" x="40" y="124" width="880" height="36" rx="8"/><text class="sm tk" x="54" y="147">сработало = обошли нашу игрушку, и данные дошли до сервера целыми</text></g>
<g class="a e3"><text class="cap" x="40" y="190">фейк с условием: намеренный дефект, из-за него фейк не доходит до приложения</text></g>
<g class="a e4"><rect class="bxb" x="40" y="200" width="280" height="56" rx="8"/><text class="sm tk" x="52" y="224">опция MD5</text><text class="sm" x="52" y="244">умирает в ядре получателя</text></g>
<g class="a e5"><rect class="bxb" x="340" y="200" width="280" height="56" rx="8"/><text class="sm tk" x="352" y="224">испорченная сумма</text><text class="sm" x="352" y="244">умирает в ядре получателя</text></g>
<g class="a e6"><rect class="bxb" x="640" y="200" width="280" height="56" rx="8"/><text class="sm tk" x="652" y="224">срок жизни один</text><text class="sm" x="652" y="244">умирает в роутере</text></g>
<g class="a e7"><text class="sm mu" x="40" y="278">в выпуске «Фейк и его условия» дефект называется условием</text></g>
<g class="a e8"><text class="cap" x="40" y="306">функция</text><text class="cap" x="350" y="306">с условием (MD5)</text><text class="cap" x="600" y="306">без условия</text><path class="lm" d="M40 314L920 314"/></g>
<g class="a e9"><text class="mk" x="40" y="338">fakedsplit</text><text class="sm mu" x="40" y="356">«разрез с фейками»</text><rect class="bxo" x="344" y="322" width="240" height="36" rx="6"/><text class="sm" x="356" y="345">250 байт, равны оригиналу</text><rect class="bxr" x="594" y="322" width="326" height="36" rx="6"/><text class="sm" x="606" y="345">250 байт: все нули</text></g>
<g class="a e10"><text class="mk" x="40" y="382">fakeddisorder</text><text class="sm mu" x="40" y="400">«перемешивание с фейками»</text><rect class="bxo" x="344" y="366" width="240" height="36" rx="6"/><text class="sm" x="356" y="389">250 байт, равны оригиналу</text><rect class="bxr" x="594" y="366" width="326" height="36" rx="6"/><text class="sm" x="606" y="389">250 байт: все нули</text></g>
<g class="a e11"><text class="mk" x="40" y="426">hostfakesplit</text><text class="sm mu" x="40" y="444">«имя между двойниками»</text><rect class="bxo" x="344" y="410" width="240" height="36" rx="6"/><text class="sm" x="356" y="433">250 байт, равны оригиналу</text><rect class="bxr" x="594" y="410" width="326" height="36" rx="6"/><text class="sm" x="606" y="433">250 байт: имя заменено выдуманным</text></g>
<g class="a e12"><text class="cap" x="40" y="472">проверь себя</text><text class="sm tk" x="190" y="472">в какой из трёх функций без условия не нули, а двойник имени, и почему?</text></g>
<g class="a e13"><rect class="bxrd" x="36" y="406" width="888" height="44" rx="8"/></g>
<g class="a e14"><text class="sm" x="40" y="500">в hostfakesplit: её двойник подменяет только 15 байт имени, остальное приветствие настоящее</text><text class="sm" x="40" y="522">в двух других фейк накрывает целую часть, и вместо неё приходят нули</text></g>
</svg>
