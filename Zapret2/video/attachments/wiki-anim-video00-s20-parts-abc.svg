<title id="v00-s20-parts-abc-t">Три части выпуска</title>
<desc id="v00-s20-parts-abc-d">Каждый длинный выпуск начинается с короткого повтора и состоит из трёх частей, a, b и c, а любую часть можно смотреть отдельно.</desc>
