<g><text class="cap" x="24" y="24">как устроен длинный выпуск</text></g>
<g class="a e1"><rect class="bxb" x="24" y="70" width="150" height="54" rx="8"/><text class="sm tk c" x="99" y="96">короткий</text><text class="sm tk c" x="99" y="114">повтор</text></g>
<g class="a e2"><text class="sm mu" x="24" y="60">в начале каждого выпуска</text></g>
<g class="a e3"><rect class="bxo" x="186" y="70" width="240" height="54" rx="8"/><text class="tk c" x="306" y="103">часть a</text></g>
<g class="a e4"><circle class="bxo" cx="208" cy="160" r="12"/><polygon class="ha" points="205,154 205,166 214,160" style="fill:var(--ok)"/><text class="sm tk" x="228" y="165">отдельно</text></g>
<g class="a e5"><rect class="bxo" x="438" y="70" width="240" height="54" rx="8"/><text class="tk c" x="558" y="103">часть b</text></g>
<g class="a e6"><circle class="bxo" cx="460" cy="160" r="12"/><polygon class="ha" points="457,154 457,166 466,160" style="fill:var(--ok)"/><text class="sm tk" x="480" y="165">отдельно</text></g>
<g class="a e7"><rect class="bxo" x="690" y="70" width="240" height="54" rx="8"/><text class="tk c" x="810" y="103">часть c</text></g>
<g class="a e8"><circle class="bxo" cx="712" cy="160" r="12"/><polygon class="ha" points="709,154 709,166 718,160" style="fill:var(--ok)"/><text class="sm tk" x="732" y="165">отдельно</text></g>
<g class="a e9"><text class="sm" x="24" y="224">каждую часть можно смотреть отдельно; жёсткие зависимости между выпусками при этом есть,</text><text class="sm" x="24" y="246">мы назовём их в конце выпуска, поэтому порядок всё-таки важен</text></g>
