<svg xmlns="http://www.w3.org/2000/svg" class="v06-s26-six-cases-table" viewBox="0 0 960 770" width="960" height="770" role="img" aria-labelledby="v06-s26-six-cases-table-t v06-s26-six-cases-table-d">
<title id="v06-s26-six-cases-table-t">Шесть случаев tcpseg</title>
<desc id="v06-s26-six-cases-table-d">Шесть случаев tcpseg по одному вопросу: без pos функция падает с текстом tcpseg: no pos specified (zapret-antidpi.lua, строка 1051), три метки host,midsld,endhost дают bad marker list (строка 1062), одна метка host даёт resolve_range require 2 markers (строка 1062), seqovl=abc даёт attempt to compare number with nil (строка 1068), и в этих четырёх случаях следом идёт строка движка с пометкой ERROR о том, что пакет пропущен без изменений, и на проводе остаётся оригинал 250@0; метки в обратном порядке midsld,host не ошибка, а сообщение range cannot be resolved без слова ERROR и только оригинал на проводе, а host,999 тоже не ошибка, потому что вторая метка чинится до последнего байта и уходят диапазон 97…249 из 153 байт и оригинал; в выдуманном примере приёмщик посылок ставит штамп не принято на неправильно заполненные карточки, а комментарий в коде «only 2 first pos used» неверен, потому что три метки это ошибка.</desc>
