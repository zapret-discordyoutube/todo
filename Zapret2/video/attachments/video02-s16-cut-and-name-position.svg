<rect class="bg" x="0" y="0" width="960" height="640"/>
<g class="a e1"><text class="cap" x="10" y="24">обычная нарезка системы и разрез внутри имени</text></g>
<g class="a e2"><text class="tk sm" x="30" y="50">то же сообщение на 1484 байта, имя сайта выделено</text><rect class="bxa" x="30" y="58" width="878.2" height="30" rx="3"/><rect class="bxb" x="908.2" y="58" width="21.8" height="30" rx="3"/><rect class="bxs" x="88.8" y="58" width="9.1" height="30" rx="2"/></g>
<g class="a e3"><path class="lr" d="M908.2 54L908.2 94"/><text class="sm r" x="900.2" y="114"><tspan>сегмент 1: байты </tspan><tspan class="hb">0..1447</tspan><tspan> (1448 Б)</tspan></text><text class="sm r" x="950" y="136"><tspan>сегмент 2: </tspan><tspan class="hbb">1448..1483</tspan><tspan> (36 Б)</tspan></text><path class="lm" d="M919.1 88L919.1 120"/></g>
<g class="a e4"><text class="sm tk" x="30" y="178">последние 32 байта-ключа (байты 1443..1474), ячейка = байт</text><rect class="bxa" x="30" y="188" width="23" height="26" rx="2"/><rect class="bxa" x="54" y="188" width="23" height="26" rx="2"/><rect class="bxa" x="78" y="188" width="23" height="26" rx="2"/><rect class="bxa" x="102" y="188" width="23" height="26" rx="2"/><rect class="bxa" x="126" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="150" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="174" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="198" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="222" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="246" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="270" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="294" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="318" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="342" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="366" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="390" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="414" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="438" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="462" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="486" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="510" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="534" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="558" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="582" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="606" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="630" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="654" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="678" y="188" width="23" height="26" rx="2"/><rect class="bxb" x="702" y="188" width="23" height="26" rx="2"/><r