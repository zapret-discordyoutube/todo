<g class="a e5"><text class="sm" x="30" y="242"><tspan class="hb">5 байт ключа</tspan><tspan> | </tspan><tspan class="hbb">27 байт ключа</tspan><tspan> + расширение сжатия сертификата (9 Б)</tspan></text></g>
<g class="a e6"><text class="sm" x="30" y="268">граница 1448 попала внутрь ключа, на его 6-й байт: сегмент 1 | сегмент 2</text></g>
<g class="a e7"><rect class="bxo" x="10" y="302" width="940" height="58" rx="8"/><text class="tk" x="24" y="326">Имя сайта, байты 97..111, целиком в первом сегменте.</text><text class="sm" x="24" y="348">Обычная нарезка системы имя не скрывает: разрез должен попасть внутрь 97..111.</text></g>
