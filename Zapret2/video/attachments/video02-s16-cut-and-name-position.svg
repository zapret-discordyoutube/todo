<g class="a e9"><text class="sm mu" x="30" y="462">байты 97..103 | 104..111: имя разрезано, целиком его нет ни в одном пакете</text></g>
<g class="a e10"><text class="tk" x="10" y="492">позиция имени не постоянна: «97» верно только для наших двух сообщений</text></g>
<g class="a e11"><text class="sm" x="10" y="525">250 Б: наше короткое</text><rect class="bx" x="380" y="508" width="560" height="24" rx="3"/><rect class="bxa" x="768" y="508" width="60" height="24" rx="2"/><text class="mt" x="836" y="525">97..111</text></g>
<g class="a e12"><text class="sm" x="10" y="561">1484 Б: наше большое</text><rect class="bx" x="380" y="544" width="560" height="24" rx="3"/><rect class="bxa" x="768" y="544" width="60" height="24" rx="2"/><text class="mt" x="836" y="561">97..111</text></g>
<g class="a e13"><text class="sm" x="10" y="597">517 Б: пример, не захвачено</text><rect class="bxd" x="380" y="580" width="560" height="24" rx="3"/><rect class="bxb" x="864" y="580" width="60" height="24" rx="2"/><text class="mt r" x="856" y="597">121..135</text></g>
<g class="a e14"><text class="sm mu" x="10" y="636">показаны первые 140 байт каждого сообщения; числа, подходящего всем, нет: всегда идём по длинам</text></g>
</svg>
