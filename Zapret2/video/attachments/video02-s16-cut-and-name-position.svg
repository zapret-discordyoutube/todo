<svg xmlns="http://www.w3.org/2000/svg" class="v02-s16-cut-position" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v02-s16-cut-position-t v02-s16-cut-position-d">
<title id="v02-s16-cut-position-t">Куда попадает разрез</title>
<desc id="v02-s16-cut-position-d">Куда попадает разрез: у большого сообщения обычная нарезка по границе 1448 даёт сегменты 1448 и 36 байт, граница лежит внутри 32-байтного ключа (на его 6-м байте), а имя сайта 97..111 целиком в первом сегменте и не скрыто; скрыть имя может только разрез внутри 97..111, как в первом выпуске по смещению 104 (7 и 8 байт имени); позиция имени не постоянна: 97..111 в наших сообщениях на 250 и 1484 байта и 121..135 в собранном для примера сообщении на 517 байт.</desc>
<style>.v02-s16-cut-position{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
