ty:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e8{animation-name:v03-s09-port-filter-k8}@keyframes v03-s09-port-filter-k9{0.0%{opacity:0}18.857%{opacity:0}20.143%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e9{animation-name:v03-s09-port-filter-k9}@keyframes v03-s09-port-filter-k10{0.0%{opacity:0}22.857%{opacity:0}24.143%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e10{animation-name:v03-s09-port-filter-k10}@keyframes v03-s09-port-filter-k11{0.0%{opacity:0}27.429%{opacity:0}28.714%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e11{animation-name:v03-s09-port-filter-k11}@keyframes v03-s09-port-filter-k12{0.0%{opacity:0}28.571%{opacity:0}29.857%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e12{animation-name:v03-s09-port-filter-k12}@keyframes v03-s09-port-filter-k13{0.0%{opacity:0}34.286%{opacity:0}35.571%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e13{animation-name:v03-s09-port-filter-k13}@keyframes v03-s09-port-filter-k14{0.0%{opacity:0}37.714%{opacity:0}39.0%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e14{animation-name:v03-s09-port-filter-k14}@keyframes v03-s09-port-filter-k15{0.0%{opacity:0}42.857%{opacity:0}44.143%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e15{animation-name:v03-s09-port-filter-k15}@keyframes v03-s09-port-filter-k16{0.0%{opacity:0}45.714%{opacity:0}47.0%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e16{animation-name:v03-s09-port-filter-k16}@keyframes v03-s09-port-filter-k17{0.0%{opacity:0}51.429%{opacity:0}52.714%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e17{animation-name:v03-s09-port-filter-k17}@keyframes v03-s09-port-filter-k18{0.0%{opacity:0}58.571%{opacity:0}59.857%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e18{animation-name:v03-s09-port-filter-k18}@keyframes v03-s09-port-filter-k19{0.0%{opacity:0}64.286%{opacity:0}65.571%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e19{animation-name:v03-s09-port-filter-k19}@keyframes v03-s09-port-filter-k20{0.0%{opacity:0}70.0%{opacity:0}71.286%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e20{animation-name:v03-s09-port-filter-k20}@keyframes v03-s09-port-filter-k21{0.0%{opacity:0}75.714%{opacity:0}77.0%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e21{animation-name:v03-s09-port-filter-k21}@keyframes v03-s09-port-filter-k22{0.0%{opacity:0}81.429%{opacity:0}82.714%{opacity:1}96.857%{opacity:1}98.571%{opacity:0}100%{opacity:0}}.v03-s09-port-filter .e22{animation-name:v03-s09-port-filter-k22}</style>
<rect class="bg" x="0" y="0" width="960" height="676"/>
<g class="a e1"><text class="cap" x="10" y="24">фильтр порта сравнивается с портом сервера</text></g>
<g class="a e2"><rect class="bx" x="10" y="44" width="130" height="80" rx="7"/><text class="tk c" x="75" y="76">Клиент</text><text class="m mu c" x="75" y="100">10.1.0.1</text><rect class="bx" x="820" y="44" width="130" height="80" rx="7"/><text class="tk c" x="885" y="76">Сервер</text><text class="m mu c" x="885" y="100">10.2.0.2</text><path class="lmd" d="M140 72L820 72"/><path class="lmd" d="M140 112L820 112"/></g>
<g class="a e3"><path class="lf" d="M150 72L804.0 72.0"/><polygon class="hf" points="814,72 804.0,77.0 804.0,67.0"/><text class="sm c" x="420" y="62">запрос клиента: порт назначения</text></g>
<g class="a e4 tr"><circle class="dot" cx="0" cy="0" r="7"/></g>
<g class="a e5"><rect class="bxa" x="722" y="44" width="92" height="22" rx="6"/><text class="tk c sm" x="768" y="60">порт 443</text></g>
<g class="a e6"><path class="lf" d="M814 112L160.0 112.0"/><polygon class="hf" points="150,112 160.0,107.0 160.0,117.0"/><text class="sm c" x="420" y="102">ответ сервера: порт отправителя</text></g>
<g class="a e7 tr"><circle class="dot" cx="0" cy="0" r="7"/></g>
<g class="a e8"><rect class="bxa" x="722" y="118" width="92" height="22" rx="6"/><text class="tk c sm" x="768" y="134">порт 443</text></g>
<g class="a e9"><text class="tk c acc" x="480" y="166">цель = удалённый конец: порт сервера, в обе стороны</text></g>
<g class="a e10"><rect class="bxr" x="10" y="178" width="940" height="28" rx="6"/><text class="sm c" x="480" y="197">режим --server меняет направления местами (порт всё равно серверный): в выпуске не разбираем</text></g>
<g class="a e11"><text class="cap" x="10" y="232">журнал перед каждым поиском профиля (строка из лаборатории)</text></g>
<g class="a e12"><rect class="bx" x="10" y="242" width="940" height="66" rx="7"/><text class="m" x="24" y="267">desync profile search for <tspan class="hb">tcp</tspan> <tspan class="hb">ip=10.2.0.2</tspan> <tspan class="hb">port=443</tspan></text><text class="m" x="24" y="292"><tspan class="mu">icmp=255:255 l7proto=unknown ssid=&#x27;&#x27; mark=0x00000000 hostname=&#x27;&#x27;</tspan></text></g>
<g class="a e13"><text class="sm acc" x="474" y="267">← протокол, адрес сервера, порт сервера</text></g>
<g class="a e14"><text class="sm mu" x="614" y="292">← условное значение для TCP и UDP</text></g>
<g class="a e15"><text class="cap" x="10" y="336">как записывается порт (по коду: pf_parse и pf_match, nfq2/filter.c)</text></g>
<g class="a e16"><rect class="bxa" x="10" y="346" width="170" height="32" rx="6"/><text class="ml c" x="95" y="368">443</text><text x="200" y="368">только порт 443</text></g>
<g class="a e17"><rect class="bxa" x="10" y="386" width="170" height="32" rx="6"/><text class="ml c" x="95" y="408">80-90</text><text x="200" y="408">любой порт от 80 до 90 включительно: 80, 85, 90 подходят, 79 и 91 нет</text></g>
<g class="a e18"><rect class="bxa" x="10" y="426" width="170" height="32" rx="6"/><text class="ml c" x="95" y="448">~443</text><text x="200" y="448">тильда это отрицание: подходит любой порт, кроме 443</text></g>
<g class="a e19"><rect class="bxa" x="10" y="466" width="170" height="32" rx="6"/><text class="ml c" x="95" y="488">*</text><text x="200" y="488">звёздочка: все порты, от 1 до 65535</text></g>
<g class="a e20"><rect class="bxa" x="10" y="506" width="170" height="32" rx="6"/><text class="ml c" x="95" y="528">~1-1023</text><text x="200" y="528">отрицание диапазона: порты 1024 и выше</text></g>
<g class="a e21"><rect class="bxr" x="10" y="546" width="96" height="32" rx="6"/><text class="ml c" x="58.0" y="568">443-80</text><rect class="bxr" x="112" y="546" width="78" height="32" rx="6"/><text class="ml c" x="151.0" y="568">65536</text><rect class="bxr" x="196" y="546" width="60" height="32" rx="6"/><text class="ml c" x="226.0" y="568">abc</text><text class="rej" x="274" y="568">отказ: запуск останавливается («Invalid port filter»)</text></g>
<g class="a e22"><rect class="bxb" x="10" y="590" width="940" height="80" rx="8"/><text class="tk" x="24" y="616">несколько записей (через запятую или повтором опции) работают как «или»: достаточно одной</text><text class="sm" x="24" y="639">опыт лаборатории: к «--filter-tcp=443» добавили «--filter-tcp=~443», профиль сработал, куски 104 + 146 байт.</text><text class="sm mu" x="24" y="659">Это согласуется с «или», но один этот опыт «или» не доказывает: запись 443 подходит приветствию и сама.</text></g>
</svg>
