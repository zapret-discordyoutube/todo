<svg xmlns="http://www.w3.org/2000/svg" class="v03-s09-port-filter" viewBox="0 0 960 676" width="960" height="676" role="img" aria-labelledby="v03-s09-port-filter-t v03-s09-port-filter-d">
<title id="v03-s09-port-filter-t">Фильтр порта: порт сервера</title>
<desc id="v03-s09-port-filter-d">Фильтр порта сравнивается с портом сервера в обе стороны: и у запроса клиента 10.1.0.1, и у ответа сервера 10.2.0.2 это порт 443, журнал печатает цель поиска «tcp ip=10.2.0.2 port=443»; записи порта: 443 это только 443, 80-90 это диапазон включительно, ~443 это все порты кроме 443, * это все порты, записи с перевёрнутыми границами, числом больше 65535 или буквами отвергаются, а несколько записей работают как «или».</desc>
<style>.v03-s09-port-filter{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v03-s09-port-filter{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v03-s09-port-filter .bg{fill:var(--bg)}
.v03-s09-port-filter text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v03-s09-port-filter .tk{font-weight:600;fill:var(--fg)}
.v03-s09-port-filter .sm{font-size:14.5px}
.v03-s09-port-filter .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v03-s09-port-filter .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v03-s09-port-filter .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v03-s09-port-filter .mt{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px}
.v03-s09-port-filter .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v03-s09-port-filter .mu{fill:var(--mute)}.v03-s09-port-filter .fg{fill:var(--fg)}.v03-s09-port-filter .acc{fill:var(--acc)}.v03-s09-port-filter .rej{fill:var(--rej)}.v03-s09-port-filter .ok{fill:var(--ok)}.v03-s09-port-filter .amb{fill:var(--amb)}
.v03-s09-port-filter .hb{fill:var(--acc);font-weight:700}.v03-s09-port-filter .hbr{fill:var(--rej);font-weight:700}.v03-s09-port-filter .hbo{fill:var(--ok);font-weight:700}.v03-s09-port-filter .hbb{fill:var(--amb);font-weight:700}
.v03-s09-port-filter .c{text-anchor:middle}.v03-s09-port-filter .r{text-anchor:end}
.v03-s09-port-filter .nos{stroke:none}
.v03-s09-port-filter .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v03-s09-port-filter .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v03-s09-port-filter .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v03-s09-port-filter .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v03-s09-port-filter .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v03-s09-port-filter .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v03-s09-port-filter .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v03-s09-port-filter .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v03-s09-port-filter .fa{fill:var(--acc);stroke:none}
.v03-s09-port-filter .fo{fill:var(--ok);stroke:none}
.v03-s09-port-filter .fr{fill:var(--rej);stroke:none}
.v03-s09-port-filter .fm{fill:var(--line);stroke:none}
.v03-s09-port-filter .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v03-s09-port-filter .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v03-s09-port-filter .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v03-s09-port-filter .la{fill:none;stroke:var(--acc);stroke-width:2}
.v03-s09-port-filter .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s09-port-filter .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s09-port-filter .hf{fill:var(--fg2)}.v03-s09-port-filter .ha{fill:var(--acc)}.v03-s09-port-filter .hr{fill:var(--rej)}.v03-s09-port-filter .hm{fill:var(--mute)}.v03-s09-port-filter .ho{fill:var(--ok)}
.v03-s09-port-filter .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v03-s09-port-filter .a{animation-duration:35s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v03-s09-port-filter .a{animation:none}.v03-s09-port-filter .tr{display:none}}
