<svg xmlns="http://www.w3.org/2000/svg" class="v05-s22-six-runs" viewBox="0 0 960 770" width="960" height="770" role="img" aria-labelledby="v05-s22-six-runs-t v05-s22-six-runs-d">
<title id="v05-s22-six-runs-t">Шесть опытов с правилом</title>
<desc id="v05-s22-six-runs-d">Шесть опытов с игрушечным правилом, которое ищет 15 байт имени на смещении 97 каждого пакета: без nfqws2 имя лежит на своём месте, счётчик 6 (оригинал и пять повторов) и сервер получил 0 байт, а в варианте со сбросом счётчик 1 и клиент получил Connection reset by peer; при pos=midsld имя разрезано, счётчик 0, сервер получил 104 и 146 байт; при pos=2 имя целиком во втором пакете на смещении 95, счётчик 0, сервер получил 2 и 248; при pos=host имя с начала второго пакета, смещение 0, счётчик 0, сервер получил 97 и 153; при pos=endhost имя целиком остаётся в первом пакете на смещении 97, счётчик 6, сервер получил 0 байт, а клиент шлёт шесть одинаковых пар; при pos=endhost с seqovl=5 накладка сдвигает имя на смещение 102, счётчик 0 и сервер получил 112 и 138 байт, с вариантом правила со сбросом тоже 0; по устройству правила при seqovl=3 имя окажется на смещении 100 и счётчик будет 0, но такой опыт мы не запускали; вывод только про нашу игрушку: правило обходит любой сдвиг имени с места, разрез, оставляющий имя на месте, не помогает, накладка помогает.</desc>
<style>.v05-s22-six-runs{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v05-s22-six-runs{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
