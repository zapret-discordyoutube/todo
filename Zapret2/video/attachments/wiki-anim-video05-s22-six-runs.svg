.v05-s22-six-runs .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v05-s22-six-runs .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v05-s22-six-runs .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v05-s22-six-runs .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v05-s22-six-runs .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v05-s22-six-runs .hf{fill:var(--fg2)}.v05-s22-six-runs .ha{fill:var(--acc)}.v05-s22-six-runs .hr{fill:var(--rej)}.v05-s22-six-runs .hm{fill:var(--mute)}.v05-s22-six-runs .hb{fill:var(--amb)}
.v05-s22-six-runs .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v05-s22-six-runs .a{animation-duration:64s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v05-s22-six-runs .a{animation:none}.v05-s22-six-runs .tr{display:none}}
