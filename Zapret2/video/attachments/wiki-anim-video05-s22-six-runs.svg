<rect class="bg" x="0" y="0" width="960" height="770"/>
<g><text class="cap" x="40" y="24">шесть опытов с одним правилом · метка «в нашем тесте»</text></g>
<g><text class="ix mu" x="40" y="50">стратегия</text><text class="ix mu" x="215" y="50">части пакета; красная черта: окошко 97</text><text class="ix mu" x="572" y="50">счётчик</text><text class="ix mu" x="670" y="50">сервер получил</text></g>
<g class="a e1"><rect class="bx" x="40" y="64" width="880" height="68" rx="8"/><text class="mk" x="54" y="92">без nfqws2</text><rect class="bxa" x="215" y="76" width="287.5" height="24" rx="0"/><rect class="fr" x="326.6" y="76" width="17.2" height="24"/><rect class="lr" x="326.6" y="76" width="17.2" height="24" style="stroke-width:1.4px"/><path class="lr" d="M326.6 70L326.6 106"/><text class="ix r" x="498.5" y="93">250</text><text class="ix mu" x="215" y="122">оригинал и пять повторов; вариант reset: счётчик 1, Connection reset by peer</text><text class="ml c rej" x="600" y="100">6</text><text class="sm tk" x="670" y="97">0 байт</text></g>
<g class="a e2"><rect class="bx" x="40" y="140" width="880" height="68" rx="8"/><text class="mk" x="54" y="168">pos=midsld</text><rect class="bxa" x="215" y="152" width="119.6" height="24" rx="0"/><rect class="fr" x="326.6" y="152" width="8.0" height="24"/><rect class="lr" x="326.6" y="152" width="8.0" height="24" style="stroke-width:1.4px"/><path class="lr" d="M326.6 146L326.6 182"/><text class="ix" x="219" y="169">104</text><rect class="bxo" x="342.6" y="152" width="167.9" height="24" rx="0"/><rect class="fr" x="342.6" y="152" width="9.2" height="24"/><rect class="lr" x="342.6" y="152" width="9.2" height="24" style="stroke-width:1.4px"/><path class="lr" d="M454.2 146L454.2 182"/><text class="ix r" x="506.5" y="169">146</text><text class="ix mu" x="215" y="198">имя разрезано: в окошке первой части только 7 из 15 байт</text><text class="ml c ok" x="600" y="176">0</text><text class="sm tk" x="670" y="173">104 + 146</text></g>
<g class="a e3"><rect class="bx" x="40" y="216" width="880" height="68" rx="8"/><text class="mk" x="54" y="244">pos=2</text><rect class="bxa" x="215" y="228" width="2.3" height="24" rx="0"/><rect class="bxo" x="225.3" y="228" width="285.2" height="24" rx="0"/><rect class="fr" x="334.6" y="228" width="17.2" height="24"/><rect class="lr" x="334.6" y="228" width="17.2" height="24" style="stroke-width:1.4px"/><path class="lr" d="M336.9 222L336.9 258"/><text class="ix r" x="506.5" y="245">248</text><text class="ix mu" x="215" y="274">имя целиком во второй части, но на смещении 95</text><text class="ml c ok" x="600" y="252">0</text><text class="sm tk" x="670" y="249">2 + 248</text></g>
<g class="a e4"><rect class="bx" x="40" y="292" width="880" height="68" rx="8"/><text class="mk" x="54" y="320">pos=host</text><rect class="bxa" x="215" y="304" width="111.5" height="24" rx="0"/><text class="ix" x="219" y="321">97</text><rect class="bxo" x="334.6" y="304" width="175.9" height="24" rx="0"/><rect class="fr" x="334.6" y="304" width="17.2" height="24"/><rect class="lr" x="334.6" y="304" width="17.2" height="24" style="stroke-width:1.4px"/><path class="lr" d="M446.1 298L446.1 334"/><text class="ix r" x="506.5" y="321">153</text><text class="ix mu" x="215" y="350">имя с начала второй части: смещение 0; в первой окошко за концом</text><text class="ml c ok" x="600" y="328">0</text><text class="sm tk" x="670" y="325">97 + 153</text></g>
<g class="a e5"><rect class="bx" x="40" y="368" width="880" height="68" rx="8"/><text class="mk" x="54" y="396">pos=endhost</text><rect class="bxa" x="215" y="380" width="128.8" height="24" rx="0"/><rect class="fr" x="326.6" y="380" width="17.2" height="24"/><rect class="lr" x="326.6" y="380" width="17.2" height="24" style="stroke-width:1.4px"/><path class="lr" d="M326.6 374L326.6 410"/><text class="ix" x="219" y="397">112</text><rect class="bxo" x="351.8" y="380" width="158.7" height="24" rx="0"/><path class="lr" d="M463.3 374L463.3 410"/><text class="ix" x="355.8" y="397">138</text><text class="ix mu" x="215" y="426">имя целиком в первой части на своём месте; шесть одинаковых пар</text><text class="ml c rej" x="600" y="404">6</text><text class="sm tk" x="670" y="401">0 байт</text></g>
<g class="a e6"><rect class="bx" x="40" y="444" width="880" height="68" rx="8"/><text class="mk" x="54" y="472">pos=endhost</text><text class="mk" x="54" y="491">seqovl=5</text><rect class="bxa" x="215" y="456" width="134.5" height="24" rx="0"/><rect class="fb" x="215.0" y="456" width="5.8" height="24"/><rect class="fr" x="332.3" y="456" width="17.2" height="24"/><rect class="lr" x="332.3" y="456" width="17.2" height="24" style="stroke-width:1.4px"/><path class="lr" d="M326.6 450L326.6 486"/><text class="ix" x="225" y="473">117</text><rect class="bxo" x="357.5" y="456" width="158.7" height="24" rx="0"/><path class="lr" d="M469.1 450L469.1 486"/><text class="ix" x="361.5" y="473">138</text><text class="ix mu" x="215" y="502">накладка сдвинула имя на 5: смещение 102; вариант reset: тоже 0</text><text class="ml c ok" x="600" y="480">0</text><text class="sm tk" x="670" y="477">112 + 138</text></g>
<g class="a e7"><rect class="bxa" x="40" y="524" width="880" height="74" rx="8"/><text class="sm tk" x="54" y="548">это про нашу игрушку и ни про что больше</text><text class="sm" x="54" y="570">правило обходит любой сдвиг имени с места; разрез, оставляющий имя на месте, не помогает;</text><text class="sm" x="54" y="589">накладка помогает, хотя имя цело в одном пакете</text></g>
<g class="a e8"><rect class="bxd" x="40" y="608" width="880" height="52" rx="8"/><text class="sm tk" x="54" y="630">проверь себя: pos=endhost:seqovl=3 — имя на смещении 100, а не 97, значит счётчик 0</text><text class="ix mu" x="54" y="649">счёт по устройству правила: именно такой опыт мы не запускали</text></g>
</svg>
