<rect class="bg" x="0" y="0" width="960" height="590"/>
<g><text class="cap" x="40" y="24">откуда берётся максимум данных в одном пакете</text></g>
<g class="a e1"><rect class="bx" x="40" y="38" width="430" height="160" rx="8"/><text class="sm tk" x="54" y="60">порция tcp_mss: считает программа на Си</text><text class="ix mu" x="54" y="80">nfq2/desync.c:1021-1030 · nfq2/params.h:46</text></g>
<g class="a e2"><rect class="bxa" x="54" y="92" width="204" height="34" rx="5"/><text class="sm c" x="156" y="114">SYN клиента: MSS=1460</text><rect class="bxa" x="54" y="132" width="204" height="34" rx="5"/><text class="sm c" x="156" y="154">SYN сервера: MSS=1460</text></g>
<g class="a e3"><path class="lf" d="M262 109L290.9 121.9"/><polygon class="hf" points="300,126 288.8,126.5 292.9,117.4"/><path class="lf" d="M262 149L290.7 137.7"/><polygon class="hf" points="300,134 292.5,142.3 288.9,133.0"/><rect class="bxo" x="306" y="106" width="150" height="40" rx="6"/><text class="ix c" x="381" y="122">меньшее из двух</text><text class="mk c" x="381" y="139">tcp_mss = 1460</text></g>
<g class="a e4"><text class="sm mu" x="54" y="188">нет одного числа: запасное 1220 (DEFAULT_MSS)</text></g>
<g class="a e5"><rect class="bx" x="490" y="38" width="430" height="160" rx="8"/><text class="sm tk" x="504" y="60">порция и размер пакета</text><text class="mk" x="504" y="90">1460 + 20 + 20 = 1500</text><text class="sm" x="504" y="110">по общим сведениям: привычный размер пакета</text></g>
<g class="a e6"><text class="sm" x="504" y="142">в нашей лаборатории большое приветствие</text><text class="sm" x="504" y="162">шло двумя пакетами данных:</text><rect class="bxa" x="504" y="172" width="290" height="18" rx="0"/><rect class="bxo" x="794" y="172" width="16" height="18" rx="0"/><text class="mk" x="816" y="187">1448 и 36</text></g>
<g class="a e7"><text class="sm tk" x="40" y="230">выдуманный пример: коробка на десять мест</text></g>
<g class="a e8"><rect class="bx" x="40" y="242" width="262" height="38" rx="5"/><rect class="bxb" x="51" y="248" width="22" height="26" rx="3"/><rect class="bxb" x="75" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="99" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="123" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="147" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="171" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="195" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="219" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="243" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="267" y="248" width="22" height="26" rx="3"/><text class="sm" x="40" y="300">коробка 1: 8 товаров</text></g>
<g class="a e9"><rect class="bx" x="340" y="242" width="262" height="38" rx="5"/><rect class="bxb" x="351" y="248" width="22" height="26" rx="3"/><rect class="bxb" x="375" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="399" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="423" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="447" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="471" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="495" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="519" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="543" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="567" y="248" width="22" height="26" rx="3"/><text class="sm" x="340" y="300">коробка 2: 8 товаров</text></g>
<g class="a e10"><rect class="bx" x="640" y="242" width="262" height="38" rx="5"/><rect class="bxb" x="651" y="248" width="22" height="26" rx="3"/><rect class="bxb" x="675" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="699" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="723" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="747" y="248" width="22" height="26" rx="3"/><rect class="bxa" x="771" y="248" width="22" height="26" rx="3"/><rect class="bxd" x="795" y="248" width="22" height="26" rx="3"/><rect class="bxd" x="819" y="248" width="22" height="26" rx="3"/><rect class="bxd" x="843" y="248" width="22" height="26" rx="3"/><rect class="bxd" x="867" y="248" width="22" height="26" rx="3"/><text class="sm" x="640" y="300">коробка 3: 4 товара</text></g>
<g class="a e11"><text class="sm tk r" x="920" y="230">10 − 2 = 8 мест, 20 штук: 8 + 8 + 4</text></g>
<g class="a e12"><text class="sm tk" x="40" y="342">лишние байты заголовков: extra_len</text><text class="ix mu" x="40" y="362">zapret-lib.lua:1164-1186</text></g>
<g class="a e13"><rect class="bxs" x="40" y="384" width="22" height="32" rx="0"/><text class="ix c" x="51" y="405">1</text></g>
<g class="a e14"><rect class="bxs" x="62" y="384" width="22" height="32" rx="0"/><text class="ix c" x="73" y="405">1</text></g>
<g class="a e15"><rect class="bxa" x="84" y="384" width="220" height="32" rx="0"/><text class="sm c" x="194" y="405">метка времени, 10 байт</text></g>
<g class="a e16"><text class="ix mu" x="40" y="380">NOP NOP</text></g>
<g class="a e17"><text class="sm" x="40" y="438">1 + 1 + 10 = 12; с 20 обязательными: 32, заголовок TCP</text></g>
<g class="a e18"><text class="sm mu" x="40" y="458">у NOP только байт вида, у остальных</text><text class="sm mu" x="40" y="478">вид, длина и данные; сумма округляется</text><text class="sm mu" x="40" y="498">до кратного четырём</text></g>
<g class="a e19"><rect class="bxo" x="500" y="330" width="420" height="150" rx="8"/><text class="sm tk" x="514" y="354">максимум данных в пакете</text><text class="ix" x="514" y="374">max_data = mss - extra_len (zapret-lib.lua:1243)</text></g>
<g class="a e20"><text class="ml" x="514" y="420">1460 − 12 = 1448</text></g>
<g class="a e21"><text class="sm" x="514" y="448">столько в полных пакетах нашей лаборатории;</text><text class="sm tk" x="514" y="468">20 + 32 + 1448 = 1500</text></g>
<g class="a e22"><text class="sm mu" x="40" y="528">порция в речи: опции вычитаются из неё, то есть это наибольшее число байт данных в одном пакете</text></g>
</svg>
