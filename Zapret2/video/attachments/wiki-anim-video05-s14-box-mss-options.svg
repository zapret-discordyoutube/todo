<svg xmlns="http://www.w3.org/2000/svg" class="v05-s14-box-mss-options" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="v05-s14-box-mss-options-t v05-s14-box-mss-options-d">
<title id="v05-s14-box-mss-options-t">Порция и максимум данных</title>
<desc id="v05-s14-box-mss-options-d">Откуда берётся максимум данных в одном пакете: программа на Си считает tcp_mss как меньшее из двух чисел MSS, объявленных в SYN, а если одного нет, берёт запасное 1220, в нашей лаборатории оба SYN несут MSS=1460, по общим сведениям 1460 + 20 + 20 = 1500, и большое приветствие шло двумя пакетами по 1448 и 36 байт; функция считает лишние байты заголовков extra_len, это опции TCP, округлённые до кратного четырём, у нас две пустышки по байту и метка времени в 10 байт, итого 12, и вместе с 20 обязательными получается 32 байта заголовка TCP, максимум данных равен 1460 - 12 = 1448, ровно столько в полных пакетах нашей лаборатории; выдуманная коробка на десять мест, где два места занимает упаковка, показывает ту же арифметику: 10 - 2 = 8 мест под товар, и двадцать штук раскладываются как 8 + 8 + 4.</desc>
