<g class="a e5"><text class="sm" x="54" y="176">дыра в один байт (номер 1)</text><text class="sm" x="54" y="198">ACK 1 с SACK на 680 байт,</text><text class="sm" x="54" y="220">после настоящего: ACK 682</text><text class="sm" x="54" y="242">сервер: 250 + 431 = 681 байт</text><text class="tk rej" x="54" y="272">клиент завис</text></g>
<g class="a e6"><rect class="bxa" x="354" y="100" width="70" height="24" rx="3"/><text class="sm c" x="389" y="117">1…250</text><text class="sm mu" x="432" y="117">· · ·</text><rect class="bxb" x="490" y="100" width="116" height="24" rx="3"/><text class="sm c" x="548" y="117">в очереди</text></g>
