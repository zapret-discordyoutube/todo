<svg xmlns="http://www.w3.org/2000/svg" class="v07-s16-forward-shifts-and-code" viewBox="0 0 960 526" width="960" height="526" role="img" aria-labelledby="v07-s16-forward-shifts-and-code-t v07-s16-forward-shifts-and-code-d">
<title id="v07-s16-forward-shifts-and-code-t">Сдвиг номера вперёд и строка кода</title>
<desc id="v07-s16-forward-shifts-and-code-d">Сдвиг порядкового номера вперёд: при +1 остаётся дыра в один байт, настоящее приветствие её закрывает и сервер получает 681 байт, при +10000 подделка внутри окна приёма ложится в очередь вне порядка и счётчик TCPOFOQueue растёт на 1, при +100000 она за окном приёма, сервер отвечает пустым ACK 1 без блока SACK и растёт счётчик BeyondWindow, а в коде сдвиг прибавляется к номеру по модулю 2 в степени 32 в строке 984 файла lua/zapret-lib.lua.</desc>
