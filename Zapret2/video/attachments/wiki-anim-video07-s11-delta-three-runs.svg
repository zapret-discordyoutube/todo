<rect class="bg" x="0" y="0" width="960" height="506"/>
<g><text class="cap" x="10" y="22">Срок подделки = число переходов + дельта</text></g>
<g class="a e1"><rect class="bx" x="80.0" y="34" width="100" height="28" rx="8"/><text class="sm tk c ns" x="130" y="53">клиент</text><rect class="bx" x="250.0" y="34" width="220" height="28" rx="8"/><text class="sm tk c ns" x="360" y="53">роутер 1 + игрушка</text><rect class="bx" x="540.0" y="34" width="100" height="28" rx="8"/><text class="sm tk c ns" x="590" y="53">роутер 2</text><rect class="bx" x="770.0" y="34" width="100" height="28" rx="8"/><text class="sm tk c ns" x="820" y="53">сервер</text></g>
<g class="a e2"><text class="sm" x="10" y="90">первый ответ сервера пришёл со сроком 62, старт 64: переходов 2</text></g>
<g class="a e3"><text class="sm" x="10" y="110">игрушка на входе роутера 1 видит подделку в каждом опыте: РАЗРЕШЕНО</text></g>
<g class="a e4"><text class="tk" x="10" y="142">дельта −1</text><text class="mk" x="170" y="142">переходы 2 + (−1) = 1, срок подделки 1</text></g>
<g class="a e5"><path class="lm" d="M360 158L360 188"/><path class="lm" d="M590 158L590 188"/><path class="lm" d="M820 158L820 188"/><path class="la" d="M130 174L350 174"/><text class="sm acc tk c" x="245.0" y="166">срок 1</text><path class="lr" d="M346 164L366 184M346 184L366 164"/></g>
<g class="a e6 tr"><circle class="dot" cx="0" cy="0" r="7"/></g>
<g class="a e7"><rect class="bxo" x="10" y="190" width="940" height="38" rx="8"/><text class="sm tk ns" x="24" y="215">умирает на роутере 1, ICMP с 10.1.0.2</text><text class="sm ns" x="470" y="215">сервер: 250 Б, чисто · клиент: ответ получен</text></g>
<g class="a e8"><text class="tk" x="10" y="258">дельта 0</text><text class="mk" x="170" y="258">переходы 2 + 0 = 2, срок подделки 2</text></g>
<g class="a e9"><path class="lm" d="M360 274L360 304"/><path class="lm" d="M590 274L590 304"/><path class="lm" d="M820 274L820 304"/><path class="la" d="M130 290L580 290"/><text class="sm acc tk c" x="245.0" y="282">срок 2</text><text class="sm acc tk c" x="475.0" y="282">срок 1</text><path class="lr" d="M576 280L596 300M576 300L596 280"/></g>
<g class="a e10 tr"><circle class="dot" cx="0" cy="0" r="7"/></g>
<g class="a e11"><rect class="bxo" x="10" y="306" width="940" height="38" rx="8"/><text class="sm tk ns" x="24" y="331">умирает на роутере 2, ICMP с 10.9.1.2</text><text class="sm ns" x="470" y="331">сервер: 250 Б, чисто · клиент: ответ получен</text></g>
<g class="a e12"><text class="tk" x="10" y="374">дельта +1</text><text class="mk" x="170" y="374">переходы 2 + 1 = 3, срок подделки 3</text></g>
<g class="a e13"><path class="lm" d="M360 390L360 420"/><path class="lm" d="M590 390L590 420"/><path class="lm" d="M820 390L820 420"/><path class="la" d="M130 406L810 406"/><text class="sm acc tk c" x="245.0" y="398">срок 3</text><text class="sm acc tk c" x="475.0" y="398">срок 2</text><text class="sm acc tk c" x="705.0" y="398">срок 1</text><polygon class="ha" points="812,406 802,401 802,411"/></g>
<g class="a e14 tr"><circle class="dot" cx="0" cy="0" r="7"/></g>
<g class="a e15"><rect class="bxr" x="10" y="422" width="940" height="38" rx="8"/><text class="sm tk ns" x="24" y="447">доезжает до сервера при сроке 3</text><text class="sm ns" x="470" y="447">сервер: 680 Б · клиент ждёт 4 с и сдаётся</text></g>
<g class="a e16"><text class="sm tk" x="10" y="488">шпаргалка: −1 первый из двух роутеров, 0 последний, +1 до сервера</text></g>
