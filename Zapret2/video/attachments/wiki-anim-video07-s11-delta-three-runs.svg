<svg xmlns="http://www.w3.org/2000/svg" class="v07-s11-delta-three-runs" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="v07-s11-delta-three-runs-t v07-s11-delta-three-runs-d">
<title id="v07-s11-delta-three-runs-t">Дельта: три опыта</title>
<desc id="v07-s11-delta-three-runs-d">Три опыта с дельтой на дороге из двух роутеров, где первый ответ сервера пришёл со сроком 62, то есть переходов два: при дельте минус один срок подделки 1 и она умирает на роутере 1 с ICMP от 10.1.0.2, при дельте 0 срок 2 и она умирает на роутере 2 с ICMP от 10.9.1.2, при дельте плюс один срок 3 и она доезжает до сервера, который принимает 680 байт, а клиент ждёт ответа; игрушечный инспектор на входе роутера 1 видит подделку во всех трёх опытах и разрешает соединение.</desc>
