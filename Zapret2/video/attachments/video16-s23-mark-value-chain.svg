<svg xmlns="http://www.w3.org/2000/svg" class="v16-s23-mark-value-chain" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="v16-s23-mark-value-chain-t v16-s23-mark-value-chain-d">
<title id="v16-s23-mark-value-chain-t">Откуда берётся значение метки у вставки</title>
<desc id="v16-s23-mark-value-chain-d">Откуда берётся значение метки у вставки, три звена. Звено 1, стратегия на Lua: rawsend_opts (lua/zapret-lib.lua:397-403) берёт fwmark = desync.arg.fwmark or desync.fwmark; в опыте t10 это метка исходного пакета из очереди, 00000000. Звено 2, переходник из Lua в C (nfq2/lua.c:2960): *fwmark = (uint32_t)lua_tolint(...) | params.desync_fwmark, то есть побитовое ИЛИ с меткой программы: 0 | 0x40000000 = 0x40000000. Звено 3, отправщик (nfq2/darkmagic.c:1990 и 1911): set_socket_fwmark вызывает setsockopt с параметром SO_MARK на сыром сокете перед каждой отправкой; отправщик ставит ровно переданное, ничего не добавляет; в журнале t10 у обеих вставок fwmark=40000000. Второй пример, арифметика по коду, в лаборатории такого значения не было: 0x20000000 | 0x40000000 = 0x60000000, оба бита стоят. Бит программы стоит всегда: в Lua-комментарии сказано, что бит метки будет установлен безусловно (zapret-lib.lua:396). Метка программы по умолчанию на Linux 0x40000000 (nfq2/desync.h:15), параметр --fwmark принимает 0xHEX или десятичное число, ноль отвергается (nfq2/nfqws.c:2527-2541). Готовые скрипты запуска передают одно значение и в правила ядра, и в программу (config.default:58, init.d/sysv/functions:76).</desc>
