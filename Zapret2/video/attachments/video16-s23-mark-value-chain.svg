<rect class="bg" x="0" y="0" width="960" height="508"/>
<g><text class="cap" x="10" y="24">три звена: откуда у вставки значение метки (опыт t10)</text></g>
<g class="a e1"><rect class="bxa" x="10" y="40" width="940" height="70" rx="8"/><text class="smk ns" x="24" y="68">Lua: rawsend_opts</text><text class="ix ns" x="24" y="90">lua/zapret-lib.lua:401</text><text class="cdh ns" x="262" y="76">fwmark = desync.arg.fwmark or desync.fwmark</text><text class="sm ns" x="748" y="68">метка исходного пакета</text><text class="mk ns" x="748" y="92">00000000</text></g>
<g class="a e2"><path class="lm" d="M500 110L500.0 113.0"/><polygon class="hm" points="500,121 496.0,113.0 504.0,113.0"/></g>
<g class="a e3"><rect class="bxo" x="10" y="120" width="940" height="70" rx="8"/><text class="smk ns" x="24" y="148">переходник Lua в C</text><text class="ix ns" x="24" y="170">nfq2/lua.c:2960</text><text class="cdh ns" x="262" y="156">*fwmark=(uint32_t)lua_tolint(L,-1) | params.desync_fwmark;</text><text class="sm ns" x="748" y="148">0 | 0x40000000</text><text class="mk ns" x="748" y="172">= 0x40000000</text></g>
<g class="a e4"><path class="lm" d="M500 190L500.0 193.0"/><polygon class="hm" points="500,201 496.0,193.0 504.0,193.0"/></g>
<g class="a e5"><rect class="bxb" x="10" y="200" width="940" height="70" rx="8"/><text class="smk ns" x="24" y="228">отправщик: rawsend</text><text class="ix ns" x="24" y="250">nfq2/darkmagic.c:1990, 1911</text><text class="cdh ns" x="262" y="228">if (!set_socket_fwmark(sock,fwmark)) return false;</text><text class="cdh ns" x="262" y="250">setsockopt(sock, SOL_SOCKET, SO_MARK, &amp;fwmark, …)</text><text class="sm ns" x="748" y="228">на сокете и в журнале</text><text class="mk ns" x="748" y="252">fwmark=40000000</text></g>
<g class="a e6"><text class="sm mu" x="10" y="292">метка у отправщика ровно та, что ему передали; бит добавляет переходник</text></g>
<g class="a e7"><text class="cap" x="10" y="330">второй пример: арифметика по коду, такой метки в лаборатории не было</text></g>
