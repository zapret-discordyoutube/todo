<g><text class="cap" x="24" y="24">курс: четыре блока</text></g>
<g class="a e1"><rect class="bxb" x="704" y="8" width="216" height="26" rx="13.0"/><text class="sm tk c" x="812" y="26">+ этот вводный выпуск</text></g>
<g class="a e2"><rect class="bxa" x="24" y="44" width="446" height="26" rx="6"/><text class="sm tk" x="36" y="62">основы</text></g>
<g class="a e3"><rect class="bxa" x="24" y="74" width="446" height="28" rx="5"/><text class="sm" x="36" y="93">«Письмо в сортировочном центре»</text></g>
<g class="a e4"><rect class="bxa" x="24" y="106" width="446" height="28" rx="5"/><text class="sm" x="36" y="125">«Что видит наблюдатель»</text></g>
<g class="a e5"><rect class="bxo" x="24" y="146" width="446" height="26" rx="6"/><text class="sm tk" x="36" y="164">приёмы вместе с языком командной строки</text></g>
<g class="a e6"><rect class="bxo" x="24" y="176" width="446" height="28" rx="5"/><text class="sm" x="36" y="195">«Читаем командную строку zapret2»</text></g>
<g class="a e7"><rect class="bxo" x="24" y="208" width="446" height="28" rx="5"/><text class="sm" x="36" y="227">«Где резать: метки»</text></g>
<g class="a e8"><rect class="bxo" x="24" y="240" width="446" height="28" rx="5"/><text class="sm" x="36" y="259">«multisplit: резать на части»</text></g>
<g class="a e9"><rect class="bxo" x="24" y="272" width="446" height="28" rx="5"/><text class="sm" x="36" y="291">«Перемешать: disorder»</text></g>
<g class="a e10"><rect class="bxo" x="24" y="304" width="446" height="28" rx="5"/><text class="sm" x="36" y="323">«Фейк и его условия»</text></g>
<g class="a e11"><rect class="bxo" x="24" y="336" width="446" height="28" rx="5"/><text class="sm" x="36" y="355">«Резать и подделывать вместе»</text></g>
<g class="a e12"><rect class="bxo" x="24" y="368" width="446" height="28" rx="5"/><text class="sm" x="36" y="387">«Фокусы рукопожатия»</text></g>
<g class="a e13"><rect class="bxo" x="24" y="400" width="446" height="28" rx="5"/><text class="sm" x="36" y="419">«Другие слои»</text></g>
<g class="a e14"><rect class="bxo" x="24" y="432" width="446" height="28" rx="5"/><text class="sm" x="36" y="451">«Читаем и отлаживаем стратегии»</text></g>
<g class="a e15"><rect class="bxb" x="490" y="44" width="446" height="26" rx="6"/><text class="sm tk" x="502" y="62">инструменты</text></g>
<g class="a e16"><rect class="bxb" x="490" y="74" width="446" height="28" rx="5"/><text class="sm" x="502" y="93">выпуск про blockcheck2</text></g>
