<svg xmlns="http://www.w3.org/2000/svg" class="v00-s19-course-board" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v00-s19-course-board-t v00-s19-course-board-d">
<title id="v00-s19-course-board-t">Доска курса</title>
<desc id="v00-s19-course-board-d">Курс устроен в четыре блока: основы, приёмы вместе с языком командной строки, инструменты и устройство программы изнутри, всего больше тридцати часов, в среднем около полутора-двух часов на выпуск, каждый длинный выпуск состоит из трёх частей, которые можно смотреть отдельно, а вводный выпуск стоит перед ними как вход.</desc>
