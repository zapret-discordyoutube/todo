<g class="a e18"><rect class="bxb" x="490" y="138" width="446" height="28" rx="5"/><text class="sm" x="502" y="157">выпуск про установку и запуск</text></g>
<g class="a e19"><rect class="bxb" x="490" y="170" width="446" height="28" rx="5"/><text class="sm" x="502" y="189">выпуск про обфускацию</text></g>
<g class="a e20"><rect class="bxg" x="490" y="210" width="446" height="26" rx="6"/><text class="sm tk" x="502" y="228">«под капотом»: устройство изнутри</text></g>
<g class="a e21"><rect class="bxg" x="490" y="240" width="446" height="28" rx="5"/><text class="sm" x="502" y="259">«Внутри программы»</text></g>
<g class="a e22"><rect class="bxg" x="490" y="272" width="446" height="28" rx="5"/><text class="sm" x="502" y="291">«От байтов к таблице»</text></g>
<g class="a e23"><rect class="bxg" x="490" y="304" width="446" height="28" rx="5"/><text class="sm" x="502" y="323">«Память о соединении»</text></g>
<g class="a e24"><rect class="bxg" x="490" y="336" width="446" height="28" rx="5"/><text class="sm" x="502" y="355">«Тип нагрузки и имя сайта»</text></g>
