<svg xmlns="http://www.w3.org/2000/svg" class="video07-s03-two-baselines" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="video07-s03-two-baselines-t video07-s03-two-baselines-d">
<title id="video07-s03-two-baselines-t">Две точки отсчёта</title>
<desc id="video07-s03-two-baselines-d">Две точки отсчёта с пустышкой pass: при включённой игрушке настоящее приветствие в 250 байт запрещено, клиент шлёт его шесть раз на c0 и r0 и ни разу на r1 и s0, повторов в ядре клиента 5, и сервер получает 0 байт, а без игрушки приветствие проходит одним пакетом со сроками 64, 64, 63, 63, сервер подтверждает 251, отвечает 14 байтами, получает ровно 250 байт и поток чистый.</desc>
