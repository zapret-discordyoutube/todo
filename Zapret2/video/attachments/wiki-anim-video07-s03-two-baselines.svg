<rect class="bg" x="0" y="0" width="960" height="690"/>
<g><text class="cap" x="40" y="24">строка запуска и два опыта с пустышкой pass</text></g>
<g class="a e1"><rect class="bx" x="40" y="38" width="880" height="38" rx="8"/><text class="mk" x="56" y="63">--payload=tls_client_hello --lua-desync=pass</text><text class="sm mu" x="500" y="63">фильтр вида данных, затем стратегия «пустышка»</text></g>
<g class="a e2"><rect class="bxr" x="40" y="92" width="430" height="34" rx="8"/><text class="tk c" x="255" y="115">опыт 1: игрушка включена</text></g>
<g class="a e3"><path class="lm" d="M62 176L440 176"/><circle class="dotb" cx="62.0" cy="176" r="6"/><text class="sm tk c" x="62.0" y="154">1</text><circle class="dotb" cx="85.5" cy="176" r="6"/><text class="sm tk c" x="85.5" y="154">2</text><circle class="dotb" cx="109.0" cy="176" r="6"/><text class="sm tk c" x="109.0" y="154">3</text><circle class="dotb" cx="157.9" cy="176" r="6"/><text class="sm tk c" x="157.9" y="154">4</text><circle class="dotb" cx="251.6" cy="176" r="6"/><text class="sm tk c" x="251.6" y="154">5</text><circle class="dotb" cx="440.0" cy="176" r="6"/><text class="sm tk c" x="440.0" y="154">6</text><path class="lr" d="M288.6 164L288.6 190"/><text class="sm rej c" x="288.6" y="210">FIN сервера</text><text class="sm mu" x="40" y="236">шесть приветствий, паузы растут (один запуск)</text></g>
<g class="a e4"><rect class="bx" x="40" y="250" width="430" height="56" rx="6"/><text class="sm" x="56" y="274">c0 и r0: шесть приветствий</text><text class="sm" x="56" y="296">r1 и s0: ни одного, пакет выброшен на входе</text></g>
<g class="a e5"><rect class="bx" x="40" y="316" width="430" height="92" rx="6"/><text class="cd" x="52" y="340">carries the blocked name: connection</text><text class="cd" x="52" y="358">BLOCKED, dropping this packet and later data</text><text class="cd" x="52" y="382">+ 5 строк: TOY blocked connection: dropping data</text></g>
<g class="a e6"><rect class="bxb" x="40" y="418" width="430" height="30" rx="6"/><text class="sm" x="52" y="439">ядро клиента: RetransSegs 0 → 5</text></g>
<g class="a e7"><rect class="bxr" x="40" y="458" width="205" height="74" rx="8"/><text class="sm c" x="142" y="486">сервер</text><text class="big c" x="142" y="516">0 байт</text><rect class="bxr" x="265" y="458" width="205" height="74" rx="8"/><text class="sm c" x="367" y="486">клиент</text><text class="sm tk c" x="367" y="508">соединение закрыто,</text><text class="sm tk c" x="367" y="526">ответа нет</text></g>
<g class="a e8"><rect class="bxo" x="490" y="92" width="430" height="34" rx="8"/><text class="tk c" x="705" y="115">опыт 2: игрушки нет</text></g>
<g class="a e9"><rect class="bx" x="490" y="146" width="103" height="56" rx="6"/><text class="sm tk c" x="541" y="168">c0</text><text class="sm c" x="541" y="192">срок 64</text><rect class="bx" x="599" y="146" width="103" height="56" rx="6"/><text class="sm tk c" x="650" y="168">r0</text><text class="sm c" x="650" y="192">срок 64</text><rect class="bx" x="708" y="146" width="103" height="56" rx="6"/><text class="sm tk c" x="759" y="168">r1</text><text class="sm c" x="759" y="192">срок 63</text><rect class="bx" x="817" y="146" width="103" height="56" rx="6"/><text class="sm tk c" x="868" y="168">s0</text><text class="sm c" x="868" y="192">срок 63</text></g>
<g class="a e10"><text class="sm mu" x="490" y="236">одно приветствие в 250 байт доходит до сервера</text></g>
<g class="a e11"><rect class="bx" x="490" y="250" width="430" height="32" rx="6"/><text class="sm" x="504" y="271">сервер: подтверждение, жду 251-й байт</text><rect class="bx" x="490" y="290" width="430" height="32" rx="6"/><text class="sm" x="504" y="311">сервер: ответ в 14 байт, подтверждение 251</text><rect class="bx" x="490" y="330" width="430" height="32" rx="6"/><text class="sm" x="504" y="351">сервер: подтверждение 252 вместе с FIN</text></g>
<g class="a e12"><rect class="bxo" x="490" y="458" width="205" height="74" rx="8"/><text class="sm c" x="592" y="486">сервер</text><text class="big c" x="592" y="516">250 байт</text><rect class="bxo" x="715" y="458" width="205" height="74" rx="8"/><text class="sm c" x="817" y="486">клиент</text><text class="sm tk c" x="817" y="516">ответ получен</text></g>
<g class="a e13"><text class="sm" x="490" y="396">имя в приветствии: www.example.com</text></g>
<g><text class="cap" x="40" y="566">две точки отсчёта для всех опытов выпуска</text></g>
<g class="a e14"><rect class="bxr" x="40" y="582" width="430" height="40" rx="8"/><text class="smk c" x="255" y="608">игрушка без подделки: ЗАПРЕТ, сервер 0 байт</text></g>
<g class="a e15"><rect class="bxo" x="490" y="582" width="430" height="40" rx="8"/><text class="smk c" x="705" y="608">без игрушки: сервер 250 байт, чисто</text></g>
<g class="a e16"><text class="sm" x="40" y="650">«чисто»: сервер получил ровно настоящие байты клиента; «испорчен»: получил что-то другое</text><text class="sm mu" x="40" y="674">подделка должна пройти обе проверки сразу: игрушка не запрещает соединение, и поток остаётся чистым</text></g>
</svg>
