<rect class="bg" x="0" y="0" width="960" height="664"/>
<g><text class="cap" x="40" y="22">список меток в fakedsplit молча становится одним числом</text></g>
<g class="a e1"><text class="sm mu" x="40" y="50">игрушка (выдуманный пример): анкета с одной клеткой «номер места»</text></g>
<g class="a e2"><rect class="bx" x="40" y="60" width="230" height="34" rx="6"/><text class="m fg" x="52" y="82">написано: 7, у окна</text><path class="lf" d="M270 77L320.0 77.0"/><polygon class="hf" points="330,77 320.0,82.0 320.0,72.0"/><rect class="bxb" x="330" y="60" width="300" height="34" rx="6"/><text class="sm" x="342" y="82">клерк записал:</text><text class="mk" x="470" y="82">7</text><text class="m mu" x="492" y="82">, у окна</text><path class="lr" d="M490 77L560 77"/><text class="sm tk rej" x="644" y="82">про окно не сказал</text></g>
<g class="a e3"><text class="cap" x="40" y="120">один и тот же список pos=1,midsld</text><rect class="bx" x="40" y="128" width="232" height="28" rx="6"/><text class="m fg" x="50" y="147">multisplit:pos=1,midsld</text><rect class="bx" x="288" y="128" width="292" height="28" rx="6"/><text class="m fg" x="298" y="147">fakedsplit:pos=1,midsld:tcp_md5</text><text class="sm mu" x="596" y="147">мы смотрим на провод второй</text></g>
<g class="a e4"><text class="cap" x="40" y="184">провод fakedsplit: что уходит клиенту</text><text class="ix mu r" x="196" y="206">смещ.</text><text class="ix mu r" x="246" y="206">длина</text><text class="ix mu" x="264" y="206">MD5</text><text class="ix mu" x="330" y="206">0</text><text class="ix mu r" x="920" y="206">250</text></g>
<g class="a e5"><rect class="fr" x="558.9" y="212" width="35.4" height="146" rx="0"/><text class="ix rej c" x="576.6" y="372">имя 97…111</text></g>
