<g class="a e13"><text class="cap" x="40" y="458">журнал fakedsplit: о разрезе ни слова про midsld</text><rect class="bx" x="40" y="466" width="880" height="74" rx="6"/><text class="ix fg" x="52" y="486">fakedsplit: resolved split pos: 1</text><text class="ix fg" x="52" y="506">fakedsplit: sending fake part 1 (1) : 0-0 len=1 : 00   … и ещё пять строк sending</text><text class="ix mu" x="52" y="526">строк с ERROR в журнале: 0</text></g>
<g class="a e14"><text class="sm mu" x="40" y="558">потерю видно только по проводу или по счёту пакетов</text></g>
<g class="a e15"><rect class="bxo" x="40" y="574" width="880" height="56" rx="8"/><text class="sm tk" x="54" y="596">имя целиком лежит в настоящей части на 249 байт: в одном пакете оно находится</text><text class="sm" x="54" y="618">единственное, чем разрез его прятал, потеряно; две линейки: смещение с нуля, позиция Lua с единицы</text></g>
