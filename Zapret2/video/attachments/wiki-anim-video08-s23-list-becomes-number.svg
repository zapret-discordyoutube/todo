<svg xmlns="http://www.w3.org/2000/svg" class="v08-s23-list-becomes-number" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="v08-s23-list-becomes-number-t v08-s23-list-becomes-number-d">
<title id="v08-s23-list-becomes-number-t">Список меток становится числом</title>
<desc id="v08-s23-list-becomes-number-d">Список меток в fakedsplit молча становится одним числом: в игрушке клерк читает клетку анкеты до первой запятой и записывает семь, а про окно не говорит; список один и midsld в multisplit даёт три части в 1, 103 и 146 байт, а в fakedsplit на проводе шесть пакетов, фейк в один байт, настоящая часть в один байт, ещё фейк, потом фейк в 249 байт со смещения 1, настоящая часть в 249 байт и ещё фейк, имя сайта на смещениях с 97 по 111 целиком лежит в настоящей части на 249 байт, а в журнале нет ни одной строки об ошибке.</desc>
