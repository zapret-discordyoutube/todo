<g class="a video09-s13-two-toys-and-star-k7"><rect class="bx" x="40" y="336" width="42" height="40" rx="4"/><text class="ml c" x="61" y="363">М</text><rect class="bx" x="84" y="336" width="42" height="40" rx="4"/><text class="ml c" x="105" y="363">О</text><rect class="bx" x="128" y="336" width="42" height="40" rx="4"/><text class="ml c" x="149" y="363">С</text><rect class="bxr" x="172" y="336" width="42" height="40" rx="4"/><text class="ml c rej" x="193" y="363">*</text><rect class="bx" x="216" y="336" width="42" height="40" rx="4"/><text class="ml c" x="237" y="363">К</text><rect class="bx" x="260" y="336" width="42" height="40" rx="4"/><text class="ml c" x="281" y="363">В</text><rect class="bx" x="304" y="336" width="42" height="40" rx="4"/><text class="ml c" x="325" y="363">А</text><text class="smk" x="366" y="354">звёздочка посередине: слова больше нет</text><text class="sm13 mu" x="366" y="372">сортировщик не найдёт, а получатель вычеркнет звёздочку</text></g>
<g class="a video09-s13-two-toys-and-star-k8"><rect class="bxo" x="40" y="396" width="880" height="50" rx="8"/><text class="smk" x="56" y="418">«слеп» значит: имя не нашлось. Для нас это хороший исход.</text><text class="sm mu" x="56" y="438">Место лишнего символа решает всё.</text></g>
