<g class="a video09-s13-two-toys-and-star-k1"><text class="cap" x="40" y="24">две игрушки: наши модели, не настоящее оборудование</text></g>
<g class="a video09-s13-two-toys-and-star-k2"><rect class="bx" x="40" y="38" width="880" height="78" rx="8"/><text class="tk" x="110" y="68">игрушка-подстрока</text><text class="sm mu" x="110" y="92">ищет имя www.example.com как обычную строку внутри одного пакета</text><circle class="bxa" cx="72" cy="66" r="13"/><path class="lf" d="M82 76L92 86"/><text class="sm13k c ns" x="72" y="71">ab</text></g>
<g class="a video09-s13-two-toys-and-star-k3"><rect class="bx" x="40" y="124" width="880" height="78" rx="8"/><text class="tk" x="110" y="154">игрушка-разборщик</text><text class="sm mu" x="110" y="178">идёт по длинам полей приветствия, как по ступенькам</text><rect class="bxa" x="58" y="148" width="12" height="10" rx="1"/><rect class="bxa" x="70" y="138" width="12" height="20" rx="1"/><rect class="bxa" x="82" y="128" width="12" height="30" rx="1"/></g>
