<svg xmlns="http://www.w3.org/2000/svg" class="v05-s05-two-helpers" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="v05-s05-two-helpers-t v05-s05-two-helpers-d">
<title id="v05-s05-two-helpers-t">Минус один и вычёркивание</title>
<desc id="v05-s05-two-helpers-d">Две маленькие функции после моста: в multisplit строка 501 печатает в журнал список, вычитая единицу обратно с помощью zero_based_pos (zapret-lib.lua:577-584), которая делает новый массив и не трогает исходный, а строка 502 убирает из списка единицу функцией delete_pos_1 (587-597), потому что Lua-позиция 1 это разрез перед нулевым байтом и первая часть вышла бы пустой; курсор идёт по массиву 1, 5, 1, 9 и после table.remove остаётся на месте, так что результат 5, 9; журнал печатается до вычёркивания, поэтому pos=0 оставляет в журнале 0, а массив 1 становится пустым, и функция пишет no valid split positions, на проводе остаётся один пакет в 250 байт; список 0 и midsld даёт в журнале 0 и 104, а на проводе части в 104 и 146 байт.</desc>
