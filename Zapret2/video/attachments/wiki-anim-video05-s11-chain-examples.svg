<svg xmlns="http://www.w3.org/2000/svg" class="v05-s11-chain-examples" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="v05-s11-chain-examples-t v05-s11-chain-examples-d">
<title id="v05-s11-chain-examples-t">Четыре списка в цепочке</title>
<desc id="v05-s11-chain-examples-d">Четыре списка меток проходят всю цепочку: midsld на приветствии в 250 байт даёт числа Си 104, позиции Lua {105}, части 104 и 146 и номера на проводе 1 и 105; список 2,host,midsld,endhost даёт 2 97 104 112, затем {3, 98, 105, 113}, части 2, 95, 7, 8 и 138 и номера 1, 3, 98, 105 и 113; на запросе HTTP в 81 байт метки host,midsld дают 32 и 39, Lua 33 и 40 по правилу плюс один, части 32, 7 и 42 и номера 1, 33 и 40; последняя строка, host,host,1,midsld, это расчёт на бумаге, который в лаборатории не запускали: 1 97 104, затем {2, 98, 105}, части 1, 96, 7 и 146 и номера 1, 2, 98 и 105, причём метка 1 остаётся, потому что выбрасывается только Lua-позиция 1.</desc>
<style>.v05-s11-chain-examples{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
