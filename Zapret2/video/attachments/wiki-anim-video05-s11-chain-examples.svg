<rect class="bg" x="0" y="0" width="960" height="612"/>
<g><text class="cap" x="40" y="24">три настоящих запуска и один расчёт: числа Си, позиции Lua, части, провод</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="112" rx="8"/><text class="mk" x="54" y="65">midsld</text><text class="sm r mu" x="906" y="65">лаборатория, 250 байт</text></g>
<g class="a e2"><text class="sm" x="54" y="90">Си, с нуля: 104</text><text class="sm" x="330" y="90">Lua, плюс 1: {105}</text><text class="sm" x="640" y="90">провод: 1, 105</text></g>
<g class="a e3"><rect class="bxa" x="54" y="102" width="228.8" height="20" rx="0"/><text class="ix c" x="168.4" y="117">104</text><rect class="bxo" x="282.8" y="102" width="321.2" height="20" rx="0"/><text class="ix c" x="443.4" y="117">146</text><text class="sm" x="618" y="117">части: 104 + 146 = 250</text></g>
<g class="a e4 tr"><rect class="bxn" x="37" y="37" width="886" height="118" rx="10"/></g>
<g class="a e5"><rect class="bx" x="40" y="164" width="880" height="112" rx="8"/><text class="mk" x="54" y="189">2,host,midsld,endhost</text><text class="sm r mu" x="906" y="189">лаборатория, 250 байт</text></g>
<g class="a e6"><text class="sm" x="54" y="214">Си, с нуля: 2 97 104 112</text><text class="sm" x="330" y="214">Lua, плюс 1: {3, 98, 105, 113}</text><text class="sm" x="640" y="214">провод: 1, 3, 98, 105, 113</text></g>
<g class="a e7"><rect class="bxa" x="54" y="226" width="4.4" height="20" rx="0"/><rect class="bxo" x="58.4" y="226" width="209" height="20" rx="0"/><text class="ix c" x="162.9" y="241">95</text><rect class="bxb" x="267.4" y="226" width="15.4" height="20" rx="0"/><rect class="bxa" x="282.8" y="226" width="17.6" height="20" rx="0"/><rect class="bxo" x="300.4" y="226" width="303.6" height="20" rx="0"/><text class="ix c" x="452.2" y="241">138</text><text class="sm" x="618" y="241">части: 2 + 95 + 7 + 8 + 138 = 250</text></g>
<g class="a e8 tr"><rect class="bxn" x="37" y="161" width="886" height="118" rx="10"/></g>
<g class="a e9"><rect class="bx" x="40" y="288" width="880" height="122" rx="8"/><text class="mk" x="54" y="313">host,midsld</text><text class="sm r mu" x="906" y="313">лаборатория, запрос HTTP, 81 байт</text></g>
<g class="a e10"><text class="sm" x="54" y="338">Си, с нуля: 32 39</text><text class="sm" x="330" y="338">Lua, плюс 1: {33, 40}*</text><text class="sm" x="640" y="338">провод: 1, 33, 40</text></g>
<g class="a e11"><rect class="bxa" x="54" y="350" width="70.4" height="20" rx="0"/><text class="ix c" x="89.2" y="365">32</text><rect class="bxo" x="124.4" y="350" width="15.4" height="20" rx="0"/><rect class="bxb" x="139.8" y="350" width="92.4" height="20" rx="0"/><text class="ix c" x="186" y="365">42</text><text class="sm" x="246.2" y="365">части: 32 + 7 + 42 = 81</text></g>
<g class="a e12"><text class="ix mu" x="54" y="393">* Lua-позиции по правилу +1: в прогоне функций на HTTP их не печатали</text></g>
<g class="a e13 tr"><rect class="bxn" x="37" y="285" width="886" height="128" rx="10"/></g>
<g class="a e14"><rect class="bxd" x="40" y="422" width="880" height="122" rx="8"/><text class="mk" x="54" y="447">host,host,1,midsld</text><text class="sm r mu" x="906" y="447">расчёт: в лаборатории не запускали</text></g>
<g class="a e15"><text class="sm" x="54" y="472">Си, с нуля: 1 97 104</text><text class="sm" x="330" y="472">Lua, плюс 1: {2, 98, 105}</text><text class="sm" x="640" y="472">провод: 1, 2, 98, 105</text></g>
<g class="a e16"><rect class="bxa" x="54" y="484" width="2.2" height="20" rx="0"/><rect class="bxo" x="56.2" y="484" width="211.2" height="20" rx="0"/><text class="ix c" x="161.8" y="499">96</text><rect class="bxb" x="267.4" y="484" width="15.4" height="20" rx="0"/><rect class="bxa" x="282.8" y="484" width="321.2" height="20" rx="0"/><text class="ix c" x="443.4" y="499">146</text><text class="sm" x="618" y="499">части: 1 + 96 + 7 + 146 = 250</text></g>
<g class="a e17"><text class="sm tk" x="54" y="527">метка 1 остаётся: это Lua-позиция 2; выбрасывается только Lua-позиция 1</text></g>
<g class="a e18 tr"><rect class="bxn" x="37" y="419" width="886" height="128" rx="10"/></g>
<g class="a e19"><text class="ix mu" x="40" y="570">полосы нарисованы в одном масштабе: 2,2 пикселя на байт</text></g>
