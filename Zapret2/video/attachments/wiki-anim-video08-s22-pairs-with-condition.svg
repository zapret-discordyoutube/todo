<g><text class="cap" x="40" y="22">две стратегии подряд: порядок строк запуска это порядок пакетов</text></g>
<g class="a e1"><text class="sm mu" x="40" y="46">игрушка (выдуманный пример): записки читают в порядке укладки; слева направо порядок отправки</text></g>
