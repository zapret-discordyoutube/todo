<svg xmlns="http://www.w3.org/2000/svg" class="v08-s22-pairs-with-condition" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="v08-s22-pairs-with-condition-t v08-s22-pairs-with-condition-d">
<title id="v08-s22-pairs-with-condition-t">Пары стратегий с условием</title>
<desc id="v08-s22-pairs-with-condition-d">Пары стратегий с условием, порядок пакетов на проводе: фейк в 680 байт впереди трёх частей multisplit, он же после частей, перед семью пакетами разреза с фейками, перед частями перемешивания, где последней уходит часть в один байт со смещения 0, перед пятью пакетами имени между двойниками, где фейки двух видов, фейк со сроком жизни один, который гаснет в роутере, а клиент получает одно сообщение ICMP, и пара с длинным приветствием в 1484 байта; во всех запусках приложение сервера читает настоящие байты, равные оригиналу.</desc>
