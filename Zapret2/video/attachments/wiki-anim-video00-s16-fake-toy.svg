<g class="a e9"><rect class="bxb" x="24" y="286" width="670" height="26" rx="13"/><text class="sm tk c" x="359" y="304">игрушечный инспектор из нашей лаборатории, не настоящее оборудование</text></g>
<g class="a e10"><rect class="bx" x="24" y="322" width="444" height="214" rx="8"/><text class="sm tk" x="38" y="350">без программы</text><rect class="bxa" x="38" y="368" width="184" height="54" rx="6"/><text class="sm tk c" x="130" y="390">250 байт</text><text class="sm c" x="130" y="410">приветствие с именем</text><text class="sm" x="38" y="450">первый пакет с данными несёт имя:</text><rect class="bxr" x="38" y="460" width="180" height="26" rx="5"/><text class="lgk" x="48" y="478">connection BLOCKED</text><circle class="bxr" cx="54" cy="512" r="12"/><path class="lr" d="M50 508L58 516M58 508L50 516" style="stroke-linecap:round;stroke-width:2"/><text class="sm tk" x="76" y="517">сервер получил 0 байт</text></g>
<g class="a e11"><rect class="bx" x="492" y="322" width="444" height="214" rx="8"/><text class="sm tk" x="506" y="350">с подделкой впереди</text><rect class="bxr" x="506" y="368" width="184" height="54" rx="6"/><text class="sm tk c" x="598" y="390">680 байт</text><text class="sm c" x="598" y="410">ложное приветствие</text><rect class="bxa" x="704" y="368" width="184" height="54" rx="6"/><text class="sm tk c" x="796" y="390">250 байт</text><text class="sm c" x="796" y="410">настоящее</text><text class="sm" x="506" y="450">первый пакет с данными без этого имени:</text><rect class="bxo" x="506" y="460" width="180" height="26" rx="5"/><text class="lgk" x="516" y="478">connection ALLOWED</text><circle class="bxo" cx="522" cy="512" r="12"/><path class="lo" d="M517 512L520.5 516L527 508" style="stroke-linecap:round;stroke-linejoin:round"/><text class="sm tk" x="544" y="517">сервер получил 250 байт</text></g>
<g class="a e12"><rect class="gr" x="24" y="552" width="912" height="64" rx="8"/><text class="sm tk" x="40" y="578">игрушечные инспекторы нашей лаборатории, которые проверяют то же, что и получатель,</text><text class="sm tk" x="40" y="602">подделку замечают и блокируют: это только игрушка</text></g>
