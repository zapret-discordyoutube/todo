<svg xmlns="http://www.w3.org/2000/svg" class="v00-s16-fake-toy" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="v00-s16-fake-toy-t v00-s16-fake-toy-d">
<title id="v00-s16-fake-toy-t">Подделка и игрушечный инспектор</title>
<desc id="v00-s16-fake-toy-d">Подделка это отдельный пакет с ложной информацией, который получатель выбросит, а чужой читатель примет за настоящий, и в нашем тесте игрушечный инспектор, решающий по первому пакету с данными, без программы блокирует соединение и сервер получает ноль байт, а с подделкой впереди разрешает его и сервер получает настоящие 250 байт; это только игрушка, игрушечные инспекторы, проверяющие то же, что и получатель, подделку замечают и блокируют.</desc>
