<g><text class="cap" x="24" y="24">семья третья: подделывать</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bxb" x="24" y="40" width="196" height="26" rx="13.0"/><text class="sm tk c" x="122" y="58">пример выдуманный</text></g>
<g class="a e2"><rect class="pl" x="24" y="78" width="170" height="56" rx="6"/><rect class="bxs" x="168" y="86" width="16" height="12" rx="2"/><path class="lm" d="M36 120L100.5 120"/><text class="sm tk" x="38" y="106">встретимся у</text><rect class="bxr" x="204" y="78" width="170" height="56" rx="6"/><rect class="bxs" x="348" y="86" width="16" height="12" rx="2"/><path class="lm" d="M216 120L280.5 120"/><text class="sm tk" x="218" y="106">ложный текст</text><rect class="pl" x="384" y="78" width="170" height="56" rx="6"/><rect class="bxs" x="528" y="86" width="16" height="12" rx="2"/><path class="lm" d="M396 120L460.5 120"/><text class="sm tk" x="398" y="106">фонтана</text><text class="sm" x="24" y="156">ложную открытку получатель выбросит,</text><text class="sm" x="24" y="176">а чужой читатель примет за настоящую</text></g>
<g class="a e3"><rect class="bx" x="572" y="40" width="364" height="142" rx="8"/><rect class="bxa" x="586" y="50" width="163" height="26" rx="13.0"/><text class="sm tk c" x="667.5" y="68">ДОКУМЕНТАЦИЯ</text><text class="sm" x="586" y="112">«Фейки - это отдельные пакеты с ложной</text><text class="sm" x="586" y="132">информацией, которую DPI должен</text><text class="sm" x="586" y="152">принять, а сервер - нет»</text></g>
<g class="a e4"><text class="sm tk" x="24" y="214">помните подделку с коротким сроком жизни: дальше роутера дошёл только пакет на 250 байт</text></g>
<g class="a e5"><rect class="bxr" x="24" y="226" width="200" height="30" rx="6"/><text class="lgk" x="34" y="246">len=680 ttl=1</text></g>
