<svg xmlns="http://www.w3.org/2000/svg" class="v04-s11-type-and-quic" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v04-s11-type-and-quic-t v04-s11-type-and-quic-d">
<title id="v04-s11-type-and-quic-t">Метки и тип пакета, пакет QUIC</title>
<desc id="v04-s11-type-and-quic-d">Тип нагрузки выбирает правила: для запроса HTTP и приветствия TLS работают слова-метки и числа, для остальных типов (unknown, quic_initial) только числа. Чужая метка не вызывает ошибку, а просто не находится: на приветствии pos=method ушёл целым пакетом в 250 байт. Начальный пакет QUIC в 1200 байт зашифрован, программа читает имя www.google.com сама, но пробная функция нашла на нём только числа 0, 2, 100 и минус один, то есть 1199.</desc>
