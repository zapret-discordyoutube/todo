<rect class="bg" x="0" y="0" width="960" height="464"/>
<g class="a e1"><text class="cap" x="40" y="26">первый случай: подмена DNS</text><rect class="bxa" x="762.8" y="8" width="157.2" height="24" rx="5"/><text class="cap acc" x="772.8" y="24.5">ДОКУМЕНТАЦИЯ</text></g>
<g class="a e2"><rect class="bx" x="40" y="40" width="880" height="138" rx="10"/></g>
<g class="a e3"><text class="sm" x="58" y="72"><tspan>«Если же у вас DNS отравлен провайдером, а ваш клиент не поддерживает шифрованный DNS, то</tspan></text></g>
<g class="a e5"><text class="sm" x="58" y="100"><tspan>это </tspan><tspan class="hlt a e4">сразу конец всем обходам</tspan><tspan>. Вы пойдете на IP адрес заглушки, и, естественно,</tspan></text></g>
<g class="a e7"><text class="sm" x="58" y="128"><tspan class="hlt a e6">никакой zapret не поможет</tspan><tspan>.»</tspan></text></g>
<g class="a e8"><text class="sm mu" x="58" y="160">вы идёте на адрес заглушки: записка у двери уже ничего не решает</text></g>
<g class="a e9"><text class="cap" x="40" y="204">выходы, которые называет документация</text></g>
<g class="a e10"><rect class="bxo" x="40" y="214" width="284" height="84" rx="8"/><text class="tk sm" x="54" y="240">другой DNS</text><text class="sm" x="54" y="262">если врёт только</text><text class="sm" x="54" y="282">DNS провайдера</text></g>
<g class="a e11"><rect class="bxo" x="338" y="214" width="284" height="84" rx="8"/><text class="tk sm" x="352" y="240">шифрованный DNS</text><text class="sm" x="352" y="262">если другие DNS блокируют</text><text class="sm" x="352" y="282">или подменяют</text></g>
<g class="a e12"><rect class="bxo" x="636" y="214" width="284" height="84" rx="8"/><text class="tk sm" x="650" y="240">DoH</text><text class="sm" x="650" y="262">один из шифрованных</text><text class="sm" x="650" y="282">каналов для DNS</text></g>
<g class="a e13"><text class="cap" x="40" y="330">программа проверки из комплекта, blockcheck2, печатает то же заглавными буквами</text></g>
<g class="a e14"><rect class="bxs" x="40" y="340" width="880" height="58" rx="8"/><text class="mn" x="56" y="364">POSSIBLE DNS HIJACK DETECTED. ZAPRET WILL NOT HELP YOU IN CASE DNS IS SPOOFED !!!</text><text class="mn" x="56" y="386">DNS CHANGE OR DNSCRYPT MAY BE REQUIRED</text></g>
<g class="a e15"><text class="sm" x="40" y="424">по-русски: если DNS подменён, zapret не поможет;</text><text class="sm tk" x="40" y="444">может потребоваться сменить DNS или зашифровать запросы</text></g>
</svg>
