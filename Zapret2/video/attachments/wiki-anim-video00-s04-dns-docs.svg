<title id="v00-s04-dns-docs-t">Подмена DNS: слова документации</title>
<desc id="v00-s04-dns-docs-d">Что пишет документация о подмене DNS: если DNS отравлен провайдером, а клиент не поддерживает шифрованный DNS, это конец всем обходам и никакой zapret не поможет, выходы называются такие, другой DNS, если врёт только провайдер, или шифрованный DNS, например DoH, а программа проверки из комплекта печатает ту же мысль заглавными английскими буквами.</desc>
