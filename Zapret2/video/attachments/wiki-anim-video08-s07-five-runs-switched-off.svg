<svg xmlns="http://www.w3.org/2000/svg" class="video08-s07-five-runs-switched-off" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="video08-s07-five-runs-switched-off-t video08-s07-five-runs-switched-off-d">
<title id="video08-s07-five-runs-switched-off-t">Пять запусков с выключателями</title>
<desc id="video08-s07-five-runs-switched-off-d">Пять запусков fakedsplit с выключенными фейками: без фейка 1 на проводе настоящая первая часть идёт первой и остаются пять пакетов, без фейка 2, без фейка 3 и без фейка 4 тоже по пять пакетов с пустым местом убранного фейка, а когда выключены все четыре, остаются только настоящие части по 104 и 146 байт, как у обычного multisplit с той же меткой; во всех запусках приложение сервера получило 250 байт, равных оригиналу; в проверке выключатели nofake1 и nofake3 вместе дают четыре пакета: настоящая первая часть, фейк первой части, настоящая вторая часть и фейк второй части, то есть остаются только фейки после настоящих частей.</desc>
