<svg xmlns="http://www.w3.org/2000/svg" class="v05-s18-seq-edges" viewBox="0 0 960 860" width="960" height="860" role="img" aria-labelledby="v05-s18-seq-edges-t v05-s18-seq-edges-d">
<title id="v05-s18-seq-edges-t">Номера пакетов с накладкой</title>
<desc id="v05-s18-seq-edges-d">Какие порядковые номера получают пакеты с накладкой в пять байт на нашем приветствии в 250 байт с pos=midsld, номера от начала клиента, у SYN ноль, первый байт данных один: без накладки пакет 1 это номера 1-104, а пакет 2 начинается с 105; с накладкой левый край уходит влево на пять, 1 - 5 = -4, длина растёт до 5 + 104 = 109, правый край остаётся на месте, -4 + 109 = 105, и второй пакет не двигается; в нашем тесте пакеты клиента имеют номер -4 с длиной 109 и номер 105 с длиной 146, размер первого пакета в журнале 161 = 52 + 109, а во втором примере с разрезом после двух байт и накладкой в 100 выходит -99 и 102, затем второй пакет с номера 3; по кругу номеров, в прогоне функций с номером оригинала 3 и накладкой 5 сумма в Lua равна -2, а в собранном пакете 4294967294, на проводе такое не запускали; внизу проверка на бумаге для накладки 7: -6, 111 и 105, такой опыт не запускали.</desc>
<style>.v05-s18-seq-edges{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
