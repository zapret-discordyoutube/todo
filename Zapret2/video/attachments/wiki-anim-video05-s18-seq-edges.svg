<rect class="bg" x="0" y="0" width="960" height="860"/>
<g><text class="cap" x="40" y="24">какие номера получат пакеты с накладкой в пять байт</text></g>
<g class="a e1"><text class="sm" x="40" y="50">счёт от начала клиента: SYN = 0, первый байт данных = 1; настоящие номера больше, разности те же</text></g>
<g class="a e2"><rect class="bx" x="44" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="76" y="85">-4</text><rect class="bx" x="108" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="140" y="85">-3</text><rect class="bx" x="172" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="204" y="85">-2</text><rect class="bx" x="236" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="268" y="85">-1</text><rect class="bx" x="300" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="332" y="85">0</text><rect class="bx" x="364" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="396" y="85">1</text><rect class="bx" x="428" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="460" y="85">2</text><rect class="bx" x="492" y="64" width="64" height="32" rx="0"/><text class="mk c" x="524" y="85">…</text><rect class="bx" x="556" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="588" y="85">103</text><rect class="bx" x="620" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="652" y="85">104</text><rect class="bx" x="684" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="716" y="85">105</text><rect class="bx" x="748" y="64" width="64" height="32" rx="0"/><text class="ix c fg tk" x="780" y="85">106</text><rect class="bx" x="812" y="64" width="64" height="32" rx="0"/><text class="mk c" x="844" y="85">…</text></g>
<g class="a e3"><text class="sm mu" x="44" y="112">шкала номеров: ряд клеток с пропуском посередине, показаны края</text></g>
<g class="a e4"><text class="cap" x="40" y="144">без накладки</text><rect class="bxa" x="364" y="152" width="320" height="30" rx="0"/><text class="sm c" x="524" y="172">пакет 1: номера 1…104</text><rect class="bxo" x="684" y="152" width="192" height="30" rx="0"/><text class="sm c" x="780" y="172">пакет 2: с 105</text></g>
<g class="a e5"><text class="cap" x="40" y="212">с накладкой в 5 байт</text><rect class="bxb" x="44" y="220" width="320" height="30" rx="0"/><text class="sm c" x="204" y="240">подкладка −4…0</text><rect class="bxa" x="364" y="220" width="320" height="30" rx="0"/><text class="sm c" x="524" y="240">настоящие байты 1…104</text><rect class="bxo" x="684" y="220" width="192" height="30" rx="0"/><text class="sm c" x="780" y="240">пакет 2: с 105</text></g>
<g class="a e6"><path class="lb" d="M44 258L44 270"/><path class="lb" d="M44 264L684 264"/><path class="lb" d="M684 258L684 270"/><text class="sm tk c" x="364" y="288">пакет 1 целиком: от −4, длина 109</text></g>
<g class="a e7"><rect class="bxb" x="40" y="304" width="280" height="52" rx="6"/><text class="cap ns" x="52" y="324">левый край</text><text class="mk" x="52" y="346">1 − 5 = −4</text></g>
<g class="a e8"><rect class="bxa" x="340" y="304" width="280" height="52" rx="6"/><text class="cap ns" x="352" y="324">длина</text><text class="mk" x="352" y="346">5 + 104 = 109</text></g>
<g class="a e9"><rect class="bxo" x="640" y="304" width="280" height="52" rx="6"/><text class="cap ns" x="652" y="324">правый край</text><text class="mk" x="652" y="346">−4 + 109 = 105</text></g>
<g class="a e10"><text class="sm" x="40" y="378">правый край = номер сразу за последним байтом; последний настоящий байт 104, с 105 начнётся второй пакет</text></g>
<g class="a e11"><text class="sm tk" x="40" y="398">левый край уехал, правый остался на месте, второй пакет не двигается вообще</text></g>
<g class="a e12"><rect class="bx" x="40" y="412" width="880" height="60" rx="6"/><text class="sm tk" x="52" y="434">в нашем тесте, клиент:</text><text class="mk" x="280" y="434">номер −4, длина 109</text><text class="mk" x="580" y="434">номер 105, длина 146</text><text class="sm" x="52" y="460">размер первого пакета в журнале 161 = 52 + 109</text><text class="sm mu" x="580" y="460">52 = 20 (IP) + 32 (TCP)</text></g>
<g class="a e13"><rect class="bx" x="40" y="486" width="880" height="34" rx="6"/><text class="sm tk" x="52" y="508">пример 2: разрез после 2 байт, накладка 100:</text><text class="mk" x="500" y="508">1 − 100 = −99;  100 + 2 = 102;  −99 + 102 = 3</text></g>
<g class="a e14"><text class="cap" x="40" y="548">круг номеров: 32 бита, после наибольшего снова ноль</text></g>
<g class="a e15"><rect class="bx" x="40" y="558" width="124" height="30" rx="0"/><text class="ix c fg tk" x="102" y="578">4294967293</text><rect class="bxb" x="170" y="558" width="124" height="30" rx="0"/><text class="ix c fg tk" x="232" y="578">4294967294</text><rect class="bx" x="300" y="558" width="124" height="30" rx="0"/><text class="ix c fg tk" x="362" y="578">4294967295</text><rect class="bx" x="430" y="558" width="64" height="30" rx="0"/><text class="ix c fg tk" x="462" y="578">0</text><rect class="bx" x="500" y="558" width="64" height="30" rx="0"/><text class="ix c fg tk" x="532" y="578">1</text><rect class="bx" x="570" y="558" width="64" height="30" rx="0"/><text class="ix c fg tk" x="602" y="578">2</text><rect class="bxa" x="640" y="558" width="64" height="30" rx="0"/><text class="ix c fg tk" x="672" y="578">3</text><path class="lr" d="M433 552L433 594"/></g>
<g class="a e16"><path class="lb" d="M672 594Q452 650 236 598"/><polygon class="hb" points="232,596 244,590 242,603"/><text class="sm c tk" x="452" y="636">пять шагов назад через ноль</text></g>
<g class="a e17"><text class="mk" x="40" y="672">3 − 5 = −2 в Lua; в собранном пакете 4294967294</text></g>
<g class="a e18"><text class="sm mu" x="40" y="694">прогон функций: номер оригинала 3 задан прогоном, на проводе не запускали</text></g>
<g class="a e19"><rect class="bxd" x="40" y="712" width="880" height="130" rx="6"/><text class="sm tk" x="52" y="736">проверь себя: накладка 7 байт, метка midsld. Где начнётся и где кончится первый пакет?</text></g>
<g class="a e20"><text class="mk" x="52" y="764">начало: 1 − 7 = −6</text><text class="mk" x="52" y="788">длина: 7 + 104 = 111</text><text class="mk" x="52" y="812">правый край: −6 + 111 = 105</text><text class="sm" x="500" y="764">второй пакет по-прежнему с 105</text><text class="sm mu" x="500" y="788">это счёт, такой опыт не запускали</text></g>
</svg>
