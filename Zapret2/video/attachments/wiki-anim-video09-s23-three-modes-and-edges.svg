<rect class="bg" x="0" y="0" width="960" height="726"/>
<g><text class="cap" x="40" y="22">три режима расщепления SYN-ACK: сигнатуры на проводе клиента</text></g>
<g class="a e1"><rect class="bxa" x="40" y="36" width="421.8" height="28" rx="6"/><text class="mk" x="50" y="55">--server --lua-desync=synack_split:mode=synack</text></g>
<g class="a e2"><rect class="bxa" x="40" y="80" width="286" height="48" rx="8"/><text class="mk" x="52" y="101">mode=synack</text><text class="sm" x="52" y="120">S, затем A · по умолчанию</text><rect class="bxb" x="337" y="80" width="286" height="48" rx="8"/><text class="mk" x="349" y="101">mode=syn</text><text class="sm" x="349" y="120">только S</text><rect class="bxo" x="634" y="80" width="286" height="48" rx="8"/><text class="mk" x="646" y="101">mode=acksyn</text><text class="sm" x="646" y="120">A, затем S</text></g>
<g class="a e3"><text class="sm mu" x="40" y="148">сигнатуры на проводе клиента: C клиент, S сервер, PA250 приветствие; жёлтым куски расщепления</text></g>
<g class="a e4"><rect class="bx" x="40" y="158" width="880" height="62" rx="8"/><text class="mk" x="54" y="182">synack</text><text class="ix mu" x="54" y="204">открыто 22,1 мс</text><rect class="bx" x="190" y="170" width="35.5" height="26" rx="5"/><text class="ix fg" x="196" y="188">C:S</text><rect class="bxb" x="230.5" y="170" width="35.5" height="26" rx="5"/><text class="ix fg tk" x="236.5" y="188">S:S</text><rect class="bx" x="271" y="170" width="43.3" height="26" rx="5"/><text class="ix fg" x="277" y="188">C:SA</text><rect class="bxb" x="319.3" y="170" width="35.5" height="26" rx="5"/><text class="ix fg tk" x="325.3" y="188">S:A</text><rect class="bx" x="359.8" y="170" width="35.5" height="26" rx="5"/><text class="ix fg" x="365.8" y="188">C:A</text><rect class="bx" x="400.2" y="170" width="35.5" height="26" rx="5"/><text class="ix fg" x="406.2" y="188">S:A</text><rect class="bx" x="440.7" y="170" width="66.8" height="26" rx="5"/><text class="ix fg" x="446.7" y="188">C:PA250</text><text class="sm mu" x="190" y="212">сервер шлёт SYN и ACK подряд; приветствие уходит после ещё одного ACK</text></g>
<g class="a e5"><rect class="bx" x="40" y="228" width="880" height="62" rx="8"/><text class="mk" x="54" y="252">syn</text><text class="ix mu" x="54" y="274">открыто 21,7 мс</text><rect class="bx" x="190" y="240" width="35.5" height="26" rx="5"/><text class="ix fg" x="196" y="258">C:S</text><rect class="bxb" x="230.5" y="240" width="35.5" height="26" rx="5"/><text class="ix fg tk" x="236.5" y="258">S:S</text><rect class="bx" x="271" y="240" width="43.3" height="26" rx="5"/><text class="ix fg" x="277" y="258">C:SA</text><rect class="bxo" x="319.3" y="240" width="35.5" height="26" rx="5"/><text class="ix fg tk" x="325.3" y="258">S:A</text><rect class="bx" x="359.8" y="240" width="66.8" height="26" rx="5"/><text class="ix fg" x="365.8" y="258">C:PA250</text><rect class="bx" x="431.6" y="240" width="35.5" height="26" rx="5"/><text class="ix fg" x="437.6" y="258">S:A</text><rect class="bx" x="472" y="240" width="35.5" height="26" rx="5"/><text class="ix fg" x="478" y="258">...</text><text class="sm mu" x="190" y="282">один SYN; после ответа клиента SYN-ACK сервер присылает чистый ACK</text></g>
<g class="a e6"><rect class="bx" x="40" y="298" width="880" height="62" rx="8"/><text class="mk" x="54" y="322">acksyn</text><text class="ix mu" x="54" y="344">открыто 21,6 мс</text><rect class="bx" x="190" y="310" width="35.5" height="26" rx="5"/><text class="ix fg" x="196" y="328">C:S</text><rect class="bxb" x="230.5" y="310" width="35.5" height="26" rx="5"/><text class="ix fg tk" x="236.5" y="328">S:A</text><rect class="bxb" x="271" y="310" width="35.5" height="26" rx="5"/><text class="ix fg tk" x="277" y="328">S:S</text><rect class="bx" x="311.5" y="310" width="43.3" height="26" rx="5"/><text class="ix fg" x="317.5" y="328">C:SA</text><rect class="bxo" x="359.8" y="310" width="35.5" height="26" rx="5"/><text class="ix fg tk" x="365.8" y="328">S:A</text><rect class="bx" x="400.2" y="310" width="66.8" height="26" rx="5"/><text class="ix fg" x="406.2" y="328">C:PA250</text><rect class="bx" x="472" y="310" width="35.5" height="26" rx="5"/><text class="ix fg" x="478" y="328">...</text><text class="sm mu" x="190" y="352">сначала ACK, потом SYN, дальше то же самое, что в режиме syn</text></g>
<g class="a e7"><rect class="bxr" x="40" y="374" width="880" height="58" rx="8"/><text class="sm tk" x="54" y="398">во всех трёх режимах уходит обломок</text><text class="sm" x="54" y="419">стратегия выбрасывает SYN-ACK, первый пакет сервера, и программа подменяет его обломком</text></g>
<g class="a e8"><text class="cap" x="40" y="452">два края</text></g>
<g class="a e9"><rect class="bx" x="40" y="460" width="430" height="126" rx="8"/><text class="sm tk" x="54" y="482">на клиенте</text><text class="sm" x="54" y="504">первым видит SYN клиента, а не SYN-ACK,</text><text class="sm" x="54" y="522">и выключается</text><text class="ix fg" x="54" y="546">instance cutoff for &#x27;synack_split_1_2&#x27; in=1 out=1</text><text class="sm tk ok" x="54" y="568">провод обычный, соединение обычное</text></g>
<g class="a e10"><rect class="bx" x="490" y="460" width="430" height="126" rx="8"/><text class="sm tk" x="504" y="482">неизвестный режим: mode=bad</text><text class="ix fg" x="504" y="506">synack_split: bad mode &#x27;bad&#x27;</text><text class="ix fg" x="504" y="524">desync ERROR. passing packet unmodified.</text><text class="sm tk ok" x="504" y="546">уходит обычный SYN-ACK, приложение [250]</text><text class="sm" x="504" y="568">соединение обычное</text></g>
<g class="a e11"><rect class="bx" x="40" y="602" width="880" height="36" rx="8"/><text class="sm tk" x="54" y="625">проверь себя: mode=syn. Какой пакет сервер отправит после ответа клиента SYN-ACK?</text></g>
<g class="a e12 tr"><rect class="bxd" x="790" y="607" width="120" height="26" rx="6"/><text class="mk c" x="850" y="625">?</text></g>
<g class="a e13"><rect class="bxb" x="40" y="650" width="286" height="58" rx="8"/><text class="mk" x="52" y="672">S&gt;C [S]</text><text class="m fg" x="190" y="672">11,01 мс</text><text class="sm" x="52" y="694">сервер: только SYN</text><rect class="bxa" x="337" y="650" width="286" height="58" rx="8"/><text class="mk" x="349" y="672">C&gt;S [SA]</text><text class="m fg" x="487" y="672">11,04 мс</text><text class="sm" x="349" y="694">ответ клиента</text><rect class="bxo" x="634" y="650" width="286" height="58" rx="8"/><text class="mk" x="646" y="672">S&gt;C [A]</text><text class="m fg" x="784" y="672">21,49 мс</text><text class="sm" x="646" y="694">чистый ACK: ответ</text></g>
</svg>
