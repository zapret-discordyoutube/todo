<svg xmlns="http://www.w3.org/2000/svg" class="v09-s23-three-modes-and-edges" viewBox="0 0 960 726" width="960" height="726" role="img" aria-labelledby="v09-s23-three-modes-and-edges-t v09-s23-three-modes-and-edges-d">
<title id="v09-s23-three-modes-and-edges-t">Три режима synack_split и два края</title>
<desc id="v09-s23-three-modes-and-edges-d">У стратегии synack_split три режима: по умолчанию synack шлёт SYN и затем ACK, режим syn шлёт один SYN, а режим acksyn сначала ACK и потом SYN, и в нашем тесте во всех трёх клиент считает соединение открытым примерно через 22 мс и во всех трёх уходит обломок, на клиенте та же стратегия выключается на первом пакете и провод остаётся обычным, неизвестный режим даёт ошибку и уходит обычный SYN-ACK, а в режиме syn после ответа клиента SYN-ACK сервер присылает чистый ACK на 21,49 мс.</desc>
