<rect class="bg" x="0" y="0" width="960" height="446"/>
<g class="a e1"><text class="cap" x="10" y="24">пакет: вложенные конверты (наш кадр)</text></g>
<g class="a e2"><rect class="bx" x="10" y="40" width="470" height="250" rx="9"/><text class="tk" x="24" y="62">Ethernet · 14 байт</text><text class="sm mu" x="24" y="82">один шаг до соседа</text></g>
<g class="a e3"><rect class="bx" x="24" y="92" width="442" height="186" rx="9"/><text class="tk" x="38" y="114">IP · 20 байт</text><text class="sm mu" x="38" y="134">адрес и время жизни: довезти по адресу</text></g>
<g class="a e4"><rect class="bxa" x="38" y="144" width="414" height="122" rx="9"/><text class="tk acc" x="52" y="166">TCP · 32 байта</text><text class="sm mu" x="52" y="186">правила отправителя и получателя</text></g>
<g class="a e5"><rect class="bx" x="52" y="198" width="386" height="56" rx="8"/><text class="tk c" x="245" y="232">данные · 250 байт</text></g>
<g class="a e6"><text class="ml c" x="245" y="316">14 + 20 + 32 + 250 = 316 байт</text></g>
<g class="a e7"><text class="cap" x="504" y="24">сеть ничего не обещает</text></g>
<g class="a e8"><text class="sm" x="504" y="64">отправили</text><rect class="bxa" x="660" y="44" width="40" height="32" rx="6"/><text class="ml c" x="680" y="66">1</text><rect class="bxa" x="710" y="44" width="40" height="32" rx="6"/><text class="ml c" x="730" y="66">2</text><rect class="bxa" x="760" y="44" width="40" height="32" rx="6"/><text class="ml c" x="780" y="66">3</text></g>
<g class="a e9"><text class="tk" x="504" y="118">потерялся</text><text class="sm mu" x="504" y="138">пакета 2 нет</text><rect class="bxa" x="660" y="104" width="40" height="32" rx="6"/><text class="ml c" x="680" y="126">1</text><rect class="bxd" x="710" y="104" width="40" height="32" rx="6"/><path class="lr" d="M723 113L737 127M723 127L737 113"/><rect class="bxa" x="760" y="104" width="40" height="32" rx="6"/><text class="ml c" x="780" y="126">3</text></g>
<g class="a e10"><text class="tk" x="504" y="188">другой порядок</text><text class="sm mu" x="504" y="208">пришли 2, 1, 3</text><rect class="bxb" x="660" y="174" width="40" height="32" rx="6"/><text class="ml c" x="680" y="196">2</text><rect class="bxb" x="710" y="174" width="40" height="32" rx="6"/><text class="ml c" x="730" y="196">1</text><rect class="bxa" x="760" y="174" width="40" height="32" rx="6"/><text class="ml c" x="780" y="196">3</text></g>
<g class="a e11"><text class="tk" x="504" y="258">дубль</text><text class="sm mu" x="504" y="278">пакет 2 дважды</text><rect class="bxa" x="660" y="244" width="40" height="32" rx="6"/><text class="ml c" x="680" y="266">1</text><rect class="bxa" x="710" y="244" width="40" height="32" rx="6"/><text class="ml c" x="730" y="266">2</text><rect class="bxr" x="760" y="244" width="40" height="32" rx="6"/><text class="ml c" x="780" y="266">2</text><rect class="bxa" x="810" y="244" width="40" height="32" rx="6"/><text class="ml c" x="830" y="266">3</text></g>
<g class="a e12"><text class="sm" x="504" y="316">роутер об этом не сообщает и не помнит, что пересылал</text></g>
<g class="a e13"><text class="cap" x="10" y="352">аналогия с обычной почтой</text></g>
<g class="a e14"><rect class="bx" x="10" y="362" width="465" height="66" rx="8"/><text class="tk" x="24" y="388">IP: почтовый индекс и адрес</text><text class="sm mu" x="24" y="410">письмо довезут, но без обещаний</text></g>
<g class="a e15"><rect class="bxa" x="485" y="362" width="465" height="66" rx="8"/><text class="tk acc" x="499" y="388">TCP: договор двух сторон</text><text class="sm mu" x="499" y="410">всё получено, целиком и по порядку</text></g>
<g class="a e16 tr"><rect class="bxn" x="34" y="140" width="422" height="130" rx="10"/></g>
</svg>
