<svg xmlns="http://www.w3.org/2000/svg" class="v02-s06-post-no-guarantees" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="v02-s06-post-no-guarantees-t v02-s06-post-no-guarantees-d">
<title id="v02-s06-post-no-guarantees-t">Конверты и ненадёжная сеть</title>
<desc id="v02-s06-post-no-guarantees-d">Пакет это вложенные конверты: Ethernet (14 байт, шаг до соседа), IP (20 байт, адрес и время жизни), TCP (32 байта, договор отправителя и получателя) и 250 байт данных, всего 316; сеть ничего не обещает: пакет может потеряться, прийти не по порядку или прийти дважды.</desc>
