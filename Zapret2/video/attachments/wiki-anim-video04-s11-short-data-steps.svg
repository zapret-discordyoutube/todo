<svg xmlns="http://www.w3.org/2000/svg" class="v04-s11-short-data-steps" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="v04-s11-short-data-steps-t v04-s11-short-data-steps-d">
<title id="v04-s11-short-data-steps-t">Метки на коротком куске приветствия</title>
<desc id="v04-s11-short-data-steps-d">Что находится, если стратегия получила только первые n байт приветствия: до 10 байт тип не узнаётся, на 11 тип узнаётся, но слов-меток нет, на 87 их всё ещё нет, с 88 находится extlen (86), до 111 только он, со 112 добавляются sniext, host, sld, midsld и endsld, endhost появляется со 113. Три ступени: extlen, сразу пять меток, endhost.</desc>
