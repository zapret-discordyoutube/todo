<g class="a e14"><rect class="bxg" x="40" y="498" width="39" height="26" rx="0"/><text class="mk c ns" x="59.5" y="517">14</text><rect class="bxa" x="79" y="498" width="55.7" height="26" rx="0"/><text class="mk c ns" x="106.8" y="517">20</text><rect class="bxb" x="134.7" y="498" width="89.1" height="26" rx="0"/><text class="mk c ns" x="179.2" y="517">32</text><text class="tk sm" x="237.8" y="510">подтверждение без данных: 66</text><text class="sm mu" x="237.8" y="527">14 + 20 + 32</text></g>
