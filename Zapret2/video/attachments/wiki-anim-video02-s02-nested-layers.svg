.v02-s02-nest .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v02-s02-nest .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s02-nest .hf{fill:var(--fg2)}.v02-s02-nest .ha{fill:var(--acc)}.v02-s02-nest .hr{fill:var(--rej)}.v02-s02-nest .hm{fill:var(--mute)}.v02-s02-nest .hb{fill:var(--amb)}
.v02-s02-nest .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v02-s02-nest .a{animation-duration:31s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s02-nest .a{animation:none}.v02-s02-nest .tr{display:none}}
