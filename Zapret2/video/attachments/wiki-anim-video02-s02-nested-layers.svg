<svg xmlns="http://www.w3.org/2000/svg" class="v02-s02-nest" viewBox="0 0 960 584" width="960" height="584" role="img" aria-labelledby="v02-s02-nest-t v02-s02-nest-d">
<title id="v02-s02-nest-t">Пакет как матрёшка из конвертов</title>
<desc id="v02-s02-nest-d">Пакет как матрёшка: данные 250 байт лежат в заголовке TCP (32 байта), он в заголовке IP (20 байт), он в заголовке Ethernet (14 байт); 250 + 32 = 282, + 20 = 302 (длина в поле IP), + 14 = 316 (кадр). Тот же кадр лентой с номерами байт 0-13, 14-33, 34-65 и 66-315, а ниже размеры других кадров соединения в той же шкале: SYN и SYN-ACK по 74 байта (в TCP 40), подтверждение без данных 66, короткий ответ сервера 80.</desc>
<style>.v02-s02-nest{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
