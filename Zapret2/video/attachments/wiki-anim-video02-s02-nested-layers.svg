<g><text class="cap" x="40" y="26">Матрёшка из конвертов: слои пакета и их размеры в байтах</text></g>
<g class="a e1"><rect class="bxg" x="40" y="44" width="430" height="236" rx="10"/><text class="tk sm" x="54" y="68">Ethernet · 14 байт</text></g>
<g class="a e2"><rect class="bxa" x="64" y="80" width="382" height="188" rx="8"/><text class="tk sm" x="78" y="104">IP · 20 байт</text></g>
<g class="a e3"><rect class="bxb" x="88" y="116" width="334" height="140" rx="8"/><text class="tk sm" x="102" y="140">TCP · 32 байта</text></g>
<g class="a e4"><rect class="bxo" x="112" y="152" width="286" height="84" rx="6"/><text class="tk c" x="255" y="188">данные · 250 байт</text><text class="sm c" x="255" y="212">запрос программы</text></g>
<g class="a e5"><rect class="bxo" x="510" y="54" width="8" height="54" rx="3"/><text class="big" x="532" y="78">250</text><text class="sm mu" x="532" y="102">данные программы</text></g>
<g class="a e6"><rect class="bxb" x="510" y="120" width="8" height="54" rx="3"/><text class="big" x="532" y="144">250 + 32 = 282</text><text class="sm mu" x="532" y="168">+ заголовок TCP</text></g>
<g class="a e7"><rect class="bxa" x="510" y="186" width="8" height="54" rx="3"/><text class="big" x="532" y="210">282 + 20 = 302</text><text class="sm mu" x="532" y="234">+ заголовок IP: это число в поле «длина» IP</text></g>
<g class="a e8"><rect class="bxg" x="510" y="252" width="8" height="54" rx="3"/><text class="big" x="532" y="276">302 + 14 = 316</text><text class="sm mu" x="532" y="300">+ заголовок Ethernet: кадр целиком</text></g>
<g class="a e9"><text class="cap" x="40" y="328">Тот же кадр лентой: 316 байт, номера с нуля</text></g>
<g class="a e10"><rect class="bxg" x="40" y="340" width="39" height="32" rx="0"/><text class="mk c ns" x="59.5" y="362">14</text><rect class="bxa" x="79" y="340" width="55.7" height="32" rx="0"/><text class="mk c ns" x="106.8" y="362">20</text><rect class="bxb" x="134.7" y="340" width="89.1" height="32" rx="0"/><text class="mk c ns" x="179.2" y="362">32</text><rect class="bxo" x="223.8" y="340" width="696.2" height="32" rx="0"/><text class="mk c ns" x="571.9" y="362">данные: 250 байт</text></g>
<g class="a e11"><rect class="bxg" x="40" y="390" width="16" height="16" rx="3"/><text class="sm" x="64" y="403">Ethernet: 0-13</text><rect class="bxa" x="260" y="390" width="16" height="16" rx="3"/><text class="sm" x="284" y="403">IP: 14-33</text><rect class="bxb" x="480" y="390" width="16" height="16" rx="3"/><text class="sm" x="504" y="403">TCP: 34-65</text><rect class="bxo" x="700" y="390" width="16" height="16" rx="3"/><text class="sm" x="724" y="403">данные: 66-315</text></g>
<g class="a e12"><text class="cap" x="40" y="444">Другие кадры соединения, в той же шкале</text></g>
