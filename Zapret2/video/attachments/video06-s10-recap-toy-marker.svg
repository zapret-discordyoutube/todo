<g><text class="cap" x="40" y="24">повтор и идея: накладки лежат внутри сообщения</text></g>
<g class="a e1"><rect class="bxb" x="40" y="34" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="54">настоящий ТСПУ здесь не обсуждается: код, лаборатория и игрушечные модели</text></g>
<g class="a e2"><text class="cap" x="40" y="82">повтор</text></g>
