<svg xmlns="http://www.w3.org/2000/svg" class="v06-s10-recap-toy-marker" viewBox="0 0 960 724" width="960" height="724" role="img" aria-labelledby="v06-s10-recap-toy-marker-t v06-s10-recap-toy-marker-d">
<title id="v06-s10-recap-toy-marker-t">Повтор и идея: seqovl это метка</title>
<desc id="v06-s10-recap-toy-marker-d">Повтор и идея накладки в multidisorder: настоящий ТСПУ в этом выпуске не обсуждается, только код, лаборатория и игрушечные модели; повтор показывает приветствие в 250 байт, разрезанное на 104 и 146 байт, куски уходят с конца (сначала 146 со смещения 104, потом 104 с начала), оригинал выбрасывается, сервер отвечает ACK 1 с блоком с 105 по 250, потом ACK 251, и приложение читает все 250 байт одним чтением; затем выдуманный пример с письмом из пронумерованных строк (числа выдуманы): страница 1 это строки 1-10, страница 2 уходит раньше страницы 1, но в её начале приписаны четыре черновые строки с номерами 7-10, как у последних строк страницы 1, и на эти четыре номера теперь два варианта, черновой пришёл первым, настоящий придёт позже, и какому из них поверит читатель, зависит от самого читателя; такие лишние байты называются накладкой, число их задаёт seqovl, имя по-видимому от английского sequence overlap, но в коде расшифровки нет, а в multidisorder seqovl это одна метка, не число и не список, она задаёт только длину накладки, а не место, и накладок столько, на сколько байт метка отстоит от начала сообщения.</desc>
