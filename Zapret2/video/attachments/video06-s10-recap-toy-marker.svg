<g class="a e11"><text class="sm r mu" x="304" y="420">пакет:</text></g>
<g class="a e12"><text class="sm r" x="302" y="468">на номерах 7…10</text><text class="sm r" x="302" y="490">теперь два варианта:</text><rect class="bxd" x="312" y="448" width="226" height="26" rx="0"/><text class="sm c" x="425" y="466">черновой, пришёл первым</text><rect class="bxa" x="312" y="478" width="226" height="26" rx="0"/><text class="sm c" x="425" y="496">настоящий, придёт позже</text></g>
<g class="a e13"><text class="sm tk" x="560" y="466">какому поверит читатель,</text><text class="sm tk" x="560" y="488">зависит от самого читателя</text></g>
<g class="a e14"><rect class="bx" x="40" y="522" width="880" height="150" rx="6"/><text class="tk big" x="52" y="548">накладка</text><text class="mk" x="200" y="548">seqovl</text><text class="sm" x="52" y="574">так называем эти черновые байты; в выпуске про multisplit их звали и подкладкой: это одно и то же</text></g>
<g class="a e15"><text class="sm tk" x="52" y="598">в multidisorder seqovl это одна метка: не число и не список</text><text class="sm" x="52" y="620">метка задаёт только длину накладки, а не место: накладок столько, на сколько байт метка от начала</text></g>
<g class="a e16"><text class="sm mu" x="52" y="648">по-видимому, от английского sequence overlap («наложение порядковых номеров»); в коде расшифровки нет</text></g>
</svg>
