<g class="a e4"><rect class="bx" x="340" y="90" width="280" height="150" rx="6"/><text class="sm tk" x="352" y="112">сервер (Linux) отвечает</text><text class="m fg" x="352" y="142">ACK 1, блок [105,251)</text><text class="sm" x="352" y="162">«первый байт жду, эти держу»</text><text class="m fg" x="352" y="192">приходит начало: ACK 251</text><text class="sm mu" x="352" y="212">SACK = выборочный ACK</text></g>
<g class="a e5"><rect class="bxo" x="640" y="90" width="280" height="150" rx="6"/><text class="sm tk" x="652" y="112">приложение читает</text><text class="big tk" x="652" y="154">250 байт</text><text class="sm" x="652" y="182">одно чтение</text></g>
<g class="a e6"><text class="sm tk" x="40" y="270">вопрос части: что делает у multidisorder аргумент seqovl?</text></g>
