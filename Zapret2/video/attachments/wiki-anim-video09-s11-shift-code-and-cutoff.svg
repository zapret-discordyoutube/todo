<svg xmlns="http://www.w3.org/2000/svg" class="video09-s11-shift-code-and-cutoff" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="video09-s11-shift-code-and-cutoff-t video09-s11-shift-code-and-cutoff-d">
<title id="video09-s11-shift-code-and-cutoff-t">Сдвиг в коде и выключение функции</title>
<desc id="video09-s11-shift-code-and-cutoff-d">В коде oob номер вычитает единицу, пока позиция от начала соединения не больше единицы, к подтверждению во входящем SYN-ACK прибавляет единицу, а после отправки срочного пакета функция выключает себя, поэтому следующий чистый ACK с номером 252 проходит без правки.</desc>
