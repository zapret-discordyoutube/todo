<rect class="bg" x="0" y="0" width="960" height="506"/>
<g class="a video09-s11-shift-code-and-cutoff-k1"><text class="cap" x="40" y="24">функция oob в файле zapret-antidpi.lua, номера строк настоящие</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k2"><rect class="bxa" x="40" y="40" width="530" height="132" rx="6"/><text class="ix" x="52" y="62">1115</text><text class="cdh" x="100" y="62">local pos = pos_get(desync, 's', false)</text><text class="ix" x="52" y="82">1116</text><text class="cdh" x="100" y="82">if pos&lt;=1 then</text><text class="ix" x="52" y="102">1117</text><text class="cdh" x="100" y="102">  local dseq = u32add(desync.dis.tcp.th_seq, -1)</text><text class="ix" x="52" y="122">1118</text><text class="cd" x="100" y="122">  DLOG("oob: decreasing outgoing seq : "…)</text><text class="ix" x="52" y="142">1119</text><text class="cd" x="100" y="142">  desync.dis.tcp.th_seq = dseq</text><text class="ix" x="52" y="162">1120</text><text class="cd" x="100" y="162">end</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k3"><text class="smk" x="592" y="60">исходящие: номер минус один</text><text class="sm13 mu" x="592" y="80">позиция считается от начала соединения:</text><text class="sm13 mu" x="592" y="98">SYN 0, ACK 1, первые данные 1 (rseq)</text><text class="sm13 mu" x="592" y="116">позиция не больше 1: номер минус 1</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k4"><rect class="bxa" x="40" y="186" width="530" height="72" rx="6"/><text class="ix" x="52" y="208">1184</text><text class="cdh" x="100" y="208">local dack = u32add(desync.dis.tcp.th_ack, 1)</text><text class="ix" x="52" y="228">1185</text><text class="cd" x="100" y="228">DLOG("oob: increasing incoming ack : "…)</text><text class="ix" x="52" y="248">1186</text><text class="cd" x="100" y="248">desync.dis.tcp.th_ack = dack</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k5"><text class="smk" x="592" y="206">входящие: подтверждение плюс один</text><text class="sm13 mu" x="592" y="226">только входящий SYN-ACK: позиция</text><text class="sm13 mu" x="592" y="244">не больше 1, иначе функция отключается</text><text class="sm13 mu" x="592" y="262">ядро получает то, что ждёт</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k6"><rect class="bxb" x="40" y="272" width="530" height="72" rx="6"/><text class="ix" x="52" y="294">1160</text><text class="cdh" x="100" y="294">if not desync.replay then</text><text class="ix" x="52" y="314">1161</text><text class="cdh" x="100" y="314">  instance_cutoff_shim(ctx, desync)</text><text class="ix" x="52" y="334">1162</text><text class="cd" x="100" y="334">end</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k7"><text class="smk" x="592" y="292">после приветствия: выключиться</text><text class="sm13 mu" x="592" y="312">сразу после отправки срочного пакета</text><text class="sm13 mu" x="592" y="330">функция выключает себя для соединения</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k8"><text class="cap" x="40" y="366">проверь себя: следующий пакет клиента, чистый ACK, номер у ядра 252</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k9"><rect class="bx" x="40" y="378" width="530" height="84" rx="6"/><text class="cdh" x="52" y="400">instance cutoff for 'oob_1_2' in=1 out=1</text><text class="cd" x="52" y="420">packet: id=7  flags=A</text><text class="cd" x="52" y="440">* lua 'pcap_1_1' : desync   (строки oob_1_2 нет)</text><text class="cd" x="52" y="456"></text></g>
<g class="a video09-s11-shift-code-and-cutoff-k10"><rect class="bxo" x="590" y="378" width="330" height="84" rx="6"/><text class="big c" x="755" y="412">252 = 252</text><text class="sm13 c mu" x="755" y="436">на проводе тот же номер</text><text class="sm13k c" x="755" y="454">ответ: нет, и причина не в позиции</text></g>
<g class="a video09-s11-shift-code-and-cutoff-k11"><text class="smk" x="40" y="486">функция выключила себя на приветствии, поэтому этого пакета она уже не видит</text></g>
</svg>
