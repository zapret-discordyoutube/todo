<svg xmlns="http://www.w3.org/2000/svg" class="v03-s12-first-match" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v03-s12-first-match-t v03-s12-first-match-d">
<title id="v03-s12-first-match-t">Первое совпадение выигрывает</title>
<desc id="v03-s12-first-match-d">Правило «первый подошёл»: в игрушке с тремя дверями подряд пакет на порт 443 входит во вторую дверь, а пакет на порт 8080 в третью, у которой нет условий; так же программа просматривает профили от первого к последнему, и в опыте лаборатории с двумя подходящими профилями разрез сделал первый (куски 2 и 248 байт, всего 250), а при обратном порядке по коду были бы куски 104 и 146.</desc>
