<rect class="bg" x="0" y="0" width="960" height="560"/>
<g class="a e1"><text class="cap" x="10" y="24">первый подошедший профиль побеждает</text></g>
<g class="a e2"><text class="sm mu" x="10" y="52">игрушка (выдумана): три двери подряд</text></g>
<g class="a e3"><rect class="bx" x="140" y="66" width="200" height="70" rx="8"/><text class="tk c" x="240" y="92">дверь 1</text><text class="c" x="240" y="118">только порт 80</text></g>
<g class="a e4"><rect class="bx" x="380" y="66" width="200" height="70" rx="8"/><text class="tk c" x="480" y="92">дверь 2</text><text class="c" x="480" y="118">только порт 443</text></g>
<g class="a e5"><rect class="bx" x="620" y="66" width="200" height="70" rx="8"/><text class="tk c" x="720" y="92">дверь 3</text><text class="c" x="720" y="118">без условий</text></g>
<g class="a e6"><path class="lmd" d="M30 168L900 168"/></g>
<g class="a e7 tr"><rect class="bg" x="-55" y="-13" width="110" height="26" rx="13"/><rect class="bxa" x="-55" y="-13" width="110" height="26" rx="13"/><text class="sm tk c" x="0" y="5">порт 443</text></g>
<g class="a e8 tr"><path class="lr" d="M232 138L248 154M232 154L248 138"/></g>
<g class="a e9 tr"><path class="lo" d="M473 146L478 152L488 139"/></g>
<g class="a e10"><text class="sm" x="10" y="214">порт 443: входит во вторую дверь, до третьей не доходит</text></g>
<g class="a e11 tr"><rect class="bg" x="-55" y="-13" width="110" height="26" rx="13"/><rect class="bxb" x="-55" y="-13" width="110" height="26" rx="13"/><text class="sm tk c" x="0" y="5">порт 8080</text></g>
<g class="a e12 tr"><path class="lr" d="M232 138L248 154M232 154L248 138"/></g>
<g class="a e13 tr"><path class="lr" d="M472 138L488 154M472 154L488 138"/></g>
<g class="a e14 tr"><path class="lo" d="M713 146L718 152L728 139"/></g>
<g class="a e15"><text class="sm" x="10" y="236">порт 8080: первые две двери не подошли, входит в третью: условий у неё нет</text></g>
<g class="a e16"><text class="cap" x="10" y="282">так работает и программа: профили просматриваются по порядку командной строки</text></g>
<g class="a e17"><text class="tk" x="10" y="322">профиль 1</text><rect class="bxo" x="112" y="296" width="540" height="40" rx="7"/><text class="mk" x="124" y="322">multisplit:pos=2</text><text class="sm" x="330" y="322">заготовка лаборатории: порт 443</text></g>
<g class="a e18"><text class="tk" x="10" y="370">профиль 2</text><rect class="bx" x="112" y="344" width="540" height="40" rx="7"/><text class="mk" x="124" y="370">multisplit:pos=midsld</text><text class="sm mu" x="330" y="370">условий нет (после --new пусто)</text></g>
<g class="a e19"><text class="tk" x="10" y="418">no_action</text><rect class="bx" x="112" y="392" width="540" height="40" rx="7"/><text class="sm" x="124" y="418">пустой, без вызовов</text><text class="sm mu" x="330" y="418">всегда стоит последним</text></g>
<g class="a e20"><text class="sm ok tk" x="664" y="322">← подошёл первым,</text><text class="sm ok tk" x="664" y="342">остальные не нужны</text></g>
<g class="a e21"><text class="sm mu" x="664" y="371">← тоже подходит, но не</text><text class="sm mu" x="664" y="391">понадобился</text></g>
<g class="a e22"><text class="sm mu" x="10" y="450">опыт лаборатории: сервер получил запрос кусками</text></g>
<g class="a e23"><rect class="fa" x="10" y="458" width="4.8" height="30" rx="2"/><rect class="bxa" x="16.8" y="458" width="593.1999999999999" height="30" rx="4"/><path class="lm" d="M13 490L13 502"/><text class="sm" x="18" y="508">2 байта: разрез сделал профиль 1</text><text class="tk c" x="314.4" y="479">248 байт</text></g>
<g class="a e24"><text class="tk" x="630" y="479">2 + 248 = 250 байт</text></g>
<g class="a e25"><text class="sm mu" x="10" y="546">Если поменять профили местами, по коду разрез был бы по midsld: куски 104 + 146 (такого опыта у нас нет).</text></g>
</svg>
