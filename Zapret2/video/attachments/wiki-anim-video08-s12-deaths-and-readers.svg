<svg xmlns="http://www.w3.org/2000/svg" class="v08-s12-deaths-and-readers" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="v08-s12-deaths-and-readers-t v08-s12-deaths-and-readers-d">
<title id="v08-s12-deaths-and-readers-t">Как умирают фейки и что видит игрушка</title>
<desc id="v08-s12-deaths-and-readers-d">Как умирают фейки перемешивания и что видит игрушка в роутере: с опцией MD5 до сервера доходят все шесть пакетов, а счётчик ядра сервера насчитывает четыре отброшенных, с временем жизни 1 фейки гибнут в роутере, до сервера доходят только два настоящих пакета, а клиент получает четыре сообщения «время истекло», с испорченной суммой счётчик ошибок суммы показывает четыре, и во всех трёх запусках приложение получает 250 байт, равных оригиналу; все пять игрушечных читателей в роутере не нашли имя, а если выключить все фейки, сервер ответит «жду байт номер 1» с блоком со 105-го по 250-й и затем «жду байт номер 251».</desc>
