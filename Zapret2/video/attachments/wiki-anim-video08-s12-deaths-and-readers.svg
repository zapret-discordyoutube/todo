<rect class="bg" x="0" y="0" width="960" height="600"/>
<g><text class="cap" x="40" y="22">три способа умереть для фейка, и что видят читатели в роутере</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="66" rx="8"/><text class="sm tk" x="54" y="68">опция MD5</text><text class="m fg" x="54" y="90">tcp_md5</text><path class="lbd" d="M298 73L432 73"/><rect class="bx" x="224" y="60" width="74" height="26" rx="6"/><text class="sm c" x="261" y="78">клиент</text><rect class="bx" x="330" y="60" width="74" height="26" rx="6"/><text class="sm c" x="367" y="78">роутер</text><rect class="bx" x="436" y="60" width="74" height="26" rx="6"/><text class="sm c" x="473" y="78">сервер</text><path class="lr" d="M425 66L439 80M439 66L425 80"/><text class="sm" x="534" y="68">до сервера дошли все 6 пакетов</text><text class="sm tk" x="534" y="90">счётчик ядра: отброшено по MD5 = 4</text></g>
<g class="a e2"><rect class="bx" x="40" y="116" width="880" height="66" rx="8"/><text class="sm tk" x="54" y="144">время жизни 1</text><text class="m fg" x="54" y="166">ip_ttl=1</text><path class="lbd" d="M298 149L326 149"/><rect class="bx" x="224" y="136" width="74" height="26" rx="6"/><text class="sm c" x="261" y="154">клиент</text><rect class="bx" x="330" y="136" width="74" height="26" rx="6"/><text class="sm c" x="367" y="154">роутер</text><rect class="bx" x="436" y="136" width="74" height="26" rx="6"/><text class="sm c" x="473" y="154">сервер</text><path class="lr" d="M319 142L333 156M333 142L319 156"/><text class="sm" x="534" y="144">до сервера дошли 2 настоящих пакета</text><text class="sm tk" x="534" y="166">на клиенте 4 сообщения «время истекло»</text></g>
<g class="a e3"><rect class="bx" x="40" y="192" width="880" height="66" rx="8"/><text class="sm tk" x="54" y="220">испорченная сумма</text><text class="m fg" x="54" y="242">badsum</text><path class="lbd" d="M298 225L432 225"/><rect class="bx" x="224" y="212" width="74" height="26" rx="6"/><text class="sm c" x="261" y="230">клиент</text><rect class="bx" x="330" y="212" width="74" height="26" rx="6"/><text class="sm c" x="367" y="230">роутер</text><rect class="bx" x="436" y="212" width="74" height="26" rx="6"/><text class="sm c" x="473" y="230">сервер</text><path class="lr" d="M425 218L439 232M439 218L425 232"/><text class="sm" x="534" y="220">до сервера дошли все 6 пакетов</text><text class="sm tk" x="534" y="242">счётчик ошибок суммы = 4</text></g>
<g class="a e4"><rect class="bxo" x="40" y="270" width="880" height="30" rx="6"/><text class="sm tk" x="54" y="290">во всех трёх запусках приложение получило 250 байт, равных оригиналу</text></g>
<g class="a e5"><text class="cap" x="40" y="328">игрушечная модель: пять читателей в роутере принимают фейк за обычные данные</text></g>
<g class="a e6"><rect class="bxo" x="40" y="340" width="172" height="54" rx="8"/><text class="sm tk c" x="126" y="363">пакетный</text><text class="sm c" x="126" y="384">не нашёл имя</text></g>
<g class="a e7"><rect class="bxo" x="217" y="340" width="172" height="54" rx="8"/><text class="sm tk c" x="303" y="363">склейщик</text><text class="sm c" x="303" y="384">не нашёл имя</text></g>
<g class="a e8"><rect class="bxo" x="394" y="340" width="172" height="54" rx="8"/><text class="sm tk c" x="480" y="363">первый записал</text><text class="sm c" x="480" y="384">не нашёл имя</text></g>
<g class="a e9"><rect class="bxo" x="571" y="340" width="172" height="54" rx="8"/><text class="sm tk c" x="657" y="363">последний записал</text><text class="sm c" x="657" y="384">не нашёл имя</text></g>
<g class="a e10"><rect class="bxo" x="748" y="340" width="172" height="54" rx="8"/><text class="sm tk c" x="834" y="363">строго по порядку</text><text class="sm c" x="834" y="384">не нашёл имя</text></g>
<g class="a e11"><text class="sm mu" x="40" y="418">на сервер дошли 250 байт, равные оригиналу; подробнее о читателях дальше в этом выпуске</text></g>
<g class="a e12"><text class="cap" x="40" y="456">проверь себя</text><text class="sm tk" x="190" y="456">все четыре фейка выключены: что сервер ответит на первый пакет?</text></g>
<g class="a e13"><rect class="fa" x="40" y="472" width="880" height="40" rx="6"/><circle class="bxa" cx="56" cy="492" r="12"/><text class="tk c ns" x="56" y="497">1</text><text class="sm" x="78" y="497">настоящая вторая: номер 105 · длина 146</text><path class="la" d="M420 492L510.0 492.0"/><polygon class="ha" points="520,492 510.0,497.0 510.0,487.0"/><text class="m fg" x="534" y="497">ack 1 + блок [105,251)</text></g>
<g class="a e14"><rect class="fa" x="40" y="518" width="880" height="40" rx="6"/><circle class="bxa" cx="56" cy="538" r="12"/><text class="tk c ns" x="56" y="543">2</text><text class="sm" x="78" y="543">настоящая первая: номер 1 · длина 104</text><path class="la" d="M420 538L510.0 538.0"/><polygon class="ha" points="520,538 510.0,543.0 510.0,533.0"/><text class="m fg" x="534" y="543">ack 251</text></g>
<g class="a e15"><text class="sm mu" x="40" y="580">так и вышло в нашем тесте: на фейки сервер не отвечает, он их выбрасывает</text></g>
</svg>
