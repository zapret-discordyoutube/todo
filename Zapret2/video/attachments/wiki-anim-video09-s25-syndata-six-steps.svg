<svg xmlns="http://www.w3.org/2000/svg" class="v09-s25-syndata-six-steps" viewBox="0 0 960 971" width="960" height="971" role="img" aria-labelledby="v09-s25-syndata-six-steps-t v09-s25-syndata-six-steps-d">
<title id="v09-s25-syndata-six-steps-t">Шесть шагов syndata в коде</title>
<desc id="v09-s25-syndata-six-steps-d">Функция syndata состоит из шести шагов: ворота пропускают только голый SYN, глубокая копия принимает все правки, заготовка берётся из аргумента blob или это 16 нулевых байт, условия применяются к единственному SYN, поэтому срок жизни 1 убивает рукопожатие, а плохая сумма оставляет клиента без ответа, tls_mod получает только заготовку и потому rnd и sni работают, давая SYN в 673 байта, а dupsid ничего не делает и оставляет 680 байт, а шестой шаг отправляет копию в 76 байт и возвращает выбросить для оригинала.</desc>
