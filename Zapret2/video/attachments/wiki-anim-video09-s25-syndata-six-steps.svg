<rect class="bg" x="0" y="0" width="960" height="971"/>
<g><text class="cap" x="40" y="22">syndata шаг за шагом: код и что видно в нашем тесте</text><text class="ix mu r" x="920" y="22">lua/zapret-antidpi.lua</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="40" rx="8"/><text class="sm" x="54" y="61">игрушка: ксерокопию письма с дописанными строками отправляют, оригинал рвут</text><rect class="pl" x="723.9" y="44" width="182.1" height="24" rx="12"/><text class="sm c" x="815" y="61">выдуманный пример</text></g>
<g class="a e2"><circle class="bxa" cx="56" cy="106" r="12"/><text class="tk c ns" x="56" y="111">1</text><text class="sm tk" x="76" y="111">ворота</text><text class="ix mu" x="54" y="141">строки 396-397</text><rect class="bx" x="170" y="88" width="750" height="62" rx="6"/><path class="lm" d="M216 94L216 144"/><text class="ix mu r" x="208" y="113">396</text><text class="ix fg" x="226" y="113">if desync.dis.tcp then</text><text class="ix mu r" x="208" y="137">397</text><text class="ix fg" x="226" y="137">  if bitand(desync.dis.tcp.th_flags, TH_SYN + TH_ACK)==TH_SYN then</text><text class="sm" x="170" y="170">проходит только голый SYN; другой пакет рукопожатия, например ACK, выключает экземпляр:</text><text class="sm" x="170" y="189">«задача выполнена»</text><text class="ix fg" x="170" y="208">instance cutoff for &#x27;syndata_1_2&#x27; in=1 out=1: запись в журнале на первом ACK</text></g>
<g class="a e3"><circle class="bxa" cx="56" cy="241" r="12"/><text class="tk c ns" x="56" y="246">2</text><text class="sm tk" x="76" y="246">глубокая</text><text class="sm tk" x="76" y="264">копия</text><text class="ix mu" x="54" y="294">строка 398</text><rect class="bx" x="170" y="223" width="750" height="38" rx="6"/><path class="lm" d="M216 229L216 255"/><text class="ix mu r" x="208" y="248">398</text><text class="ix fg" x="226" y="248">    local dis = deepcopy(desync.dis)</text><text class="sm" x="170" y="281">все правки идут в копию: что исправлено раньше, попадает в неё, что позже, нет; отсюда</text><text class="sm" x="170" y="300">порядок со wssize</text></g>
<g class="a e4"><circle class="bxa" cx="56" cy="333" r="12"/><text class="tk c ns" x="56" y="338">3</text><text class="sm tk" x="76" y="338">заготовка</text><text class="ix mu" x="54" y="368">строка 399</text><rect class="bx" x="170" y="315" width="750" height="38" rx="6"/><path class="lm" d="M216 321L216 347"/><text class="ix mu r" x="208" y="340">399</text><text class="ix fg" x="226" y="340">    dis.payload = blob(desync, desync.arg.blob, &quot;\x00&quot; x 16)</text><text class="sm" x="170" y="373">blob (zapret-lib.lua, строки 534-560): нет аргумента: 16 нулевых байт; «0x» и цифры: эти байты;</text><text class="sm" x="170" y="392">имя: заготовка. В коде строка 399 длиннее: 16 раз \x00</text><text class="ix fg" x="170" y="411">blob &#x27;nosuchblob&#x27; unavailable, затем desync ERROR. passing packet unmodified.</text><text class="sm" x="170" y="430">обычный SYN ушёл без изменений, соединение заработало</text></g>
<g class="a e5"><circle class="bxa" cx="56" cy="463" r="12"/><text class="tk c ns" x="56" y="468">4</text><text class="sm tk" x="76" y="468">условия</text><text class="ix mu" x="54" y="498">строка 400</text><rect class="bx" x="170" y="445" width="750" height="38" rx="6"/><path class="lm" d="M216 451L216 477"/><text class="ix mu r" x="208" y="470">400</text><text class="ix fg" x="226" y="470">    apply_fooling(desync, dis)</text><text class="sm" x="170" y="503">применяются к единственному SYN: срок жизни 1 убивает рукопожатие, плохая сумма</text><text class="sm" x="170" y="522">оставляет клиента без ответа</text><text class="ix fg" x="170" y="541">срок 1: SYN len 16, ICMP type 11 на 5,10 мс, Errno 113 No route to host</text><text class="ix fg" x="170" y="560">badsum: SYN len 16 на 0,00, 1004,51 и 2027,95 мс, error: timed out</text></g>
<g class="a e6"><circle class="bxa" cx="56" cy="593" r="12"/><text class="tk c ns" x="56" y="598">5</text><text class="sm tk" x="76" y="598">tls_mod</text><text class="ix mu" x="54" y="628">строки 401-404</text><rect class="bx" x="170" y="575" width="750" height="62" rx="6"/><path class="lm" d="M216 581L216 631"/><text class="ix mu r" x="208" y="600">401</text><text class="ix fg" x="226" y="600">    if desync.arg.tls_mod then</text><text class="ix mu r" x="208" y="624">402</text><text class="ix fg" x="226" y="624">      local pl = tls_mod_shim(desync, dis.payload, desync.arg.tls_mod, nil)</text><rect class="fb" x="779.8" y="609" width="27.5" height="20" rx="3"/><text class="sm" x="170" y="657">настоящее приветствие не передано (четвёртый аргумент nil): rnd и sni работают, dupsid</text><text class="sm" x="170" y="676">копировать нечего</text><text class="ix fg" x="170" y="695">change SNI : www.microsoft.com =&gt; google.com size_delta=-7, SYN 673 = 680 - 7</text><text class="ix fg" x="170" y="714">tls_mod=dupsid: SYN 680, строки applied dupsid нет (dupsid внутри if payload, protocol.c:884)</text></g>
<g class="a e7"><circle class="bxa" cx="56" cy="747" r="12"/><text class="tk c ns" x="56" y="752">6</text><text class="sm tk" x="76" y="752">отправка</text><text class="ix mu" x="54" y="782">строки 405-408</text><rect class="bx" x="170" y="729" width="750" height="110" rx="6"/><path class="lm" d="M216 735L216 833"/><text class="ix mu r" x="208" y="754">405</text><text class="ix fg" x="226" y="754">    if b_debug then DLOG(&quot;syndata: &quot;..hexdump_dlog(dis.payload)) end</text><text class="ix mu r" x="208" y="778">406</text><text class="ix fg" x="226" y="778">    if rawsend_dissect_ipfrag(dis, desync_opts(desync)) then</text><text class="ix mu r" x="208" y="802">407</text><text class="ix fg" x="226" y="802">      return VERDICT_DROP</text><text class="ix mu r" x="208" y="826">408</text><text class="ix fg" x="226" y="826">    end</text><text class="sm" x="170" y="859">успех: оригинал выбрасывается; провал: оригинальный SYN уходит как есть</text><text class="ix fg" x="170" y="878">rawsend_dissect repeats=1 size=76: 20 + 40 + 16 = 76 байт</text></g>
<g class="a e8"><rect class="bx" x="40" y="893" width="880" height="62" rx="8"/><text class="sm tk" x="54" y="916">проверь себя: syndata:blob=0x1603. Сколько байт данных будет в SYN?</text></g>
<g class="a e9 tr"><rect class="bxd" x="54" y="925" width="100" height="24" rx="6"/><text class="mk c" x="104" y="942">?</text></g>
<g class="a e10"><text class="sm tk ok" x="54" y="941">два байта: «0x» и четыре цифры; в нашем тесте SYN len 2, и соединение открылось</text></g>
</svg>
