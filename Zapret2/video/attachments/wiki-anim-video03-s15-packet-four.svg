.v03-s15-packet-four .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v03-s15-packet-four .a{animation-duration:29s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
