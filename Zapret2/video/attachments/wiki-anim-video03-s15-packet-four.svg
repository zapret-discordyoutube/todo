<svg xmlns="http://www.w3.org/2000/svg" class="v03-s15-packet-four" viewBox="0 0 960 536" width="960" height="536" role="img" aria-labelledby="v03-s15-packet-four-t v03-s15-packet-four-d">
<title id="v03-s15-packet-four-t">Приветствие клиента: пакет четыре</title>
<desc id="v03-s15-packet-four-d">Путь приветствия клиента (пакет номер 4, 302 байта: 20 IP, 32 TCP и 250 данных, без заголовка Ethernet): программа узнаёт приветствие и имя www.example.com и снова выбирает профиль один, pcap записывает пакет таким, как его отдало ядро, multisplit проходит оба условия, вычисляет позицию midsld, равную 104, и сама отправляет две новые части (104 и 146 байт данных, пакеты в 156 и 198 байт), а вердикт для исходного пакета «выбросить», поэтому вместо одного пакета в сети два, а в журнале номера идут от 1 до 11 и новых частей среди них нет.</desc>
<style>.v03-s15-packet-four{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
