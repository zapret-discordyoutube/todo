<rect class="bg" x="0" y="0" width="960" height="536"/>
<g class="a e1"><text class="cap" x="10" y="24">пакет № 4: приветствие клиента, путь через профиль</text></g>
<g class="a e2"><rect class="bxg" x="10" y="56" width="48.0" height="32" rx="5"/><text class="sm c" x="34.0" y="77">20</text><rect class="bxg" x="60.0" y="56" width="74.8" height="32" rx="5"/><text class="sm c" x="98.4" y="77">32</text><rect class="bxa" x="136.8" y="56" width="598.0" height="32" rx="5"/><text class="tk c" x="436.8" y="77">данные клиента: 250 байт</text></g>
<g class="a e3"><text class="sm mu c" x="34.0" y="108">IP</text><text class="sm mu c" x="98.39999999999999" y="108">TCP</text><text class="sm mu" x="180" y="108">заголовки IP и TCP: 20 + 32 = 52 байта</text></g>
<g class="a e4"><text class="tk" x="750" y="70">302 байта</text></g>
<g class="a e5"><text class="sm mu" x="10" y="136">в прошлых выпусках 316 байт: с заголовком Ethernet в 14 байт; программа получает пакет без него</text></g>
<g class="a e6"><rect class="bx" x="10" y="160" width="215" height="112" rx="8"/><text class="tk" x="22" y="186">профиль</text><text class="sm" x="22" y="212">узнали приветствие,</text><text class="sm" x="22" y="232">имя www.example.com;</text><text class="sm" x="22" y="252">выбор снова: профиль 1</text></g>
<g class="a e7 tr"><rect class="bxn" x="7" y="157" width="221" height="118" rx="10"/></g>
<g class="a e8"><rect class="bxo" x="245" y="160" width="215" height="112" rx="8"/><text class="tk" x="257" y="186">pcap (вызов 1)</text><text class="sm" x="257" y="212">записывает пакет</text><text class="sm" x="257" y="232">как отдало ядро:</text><text class="sm" x="257" y="252">неразрезанный, 302</text><path class="lm" d="M227 216L232.0 216.0"/><polygon class="hm" points="242,216 232.0,221.0 232.0,211.0"/></g>
<g class="a e9 tr"><rect class="bxn" x="242" y="157" width="221" height="118" rx="10"/></g>
<g class="a e10"><rect class="bxo" x="480" y="160" width="215" height="112" rx="8"/><text class="tk" x="492" y="186">multisplit (вызов 2)</text><text class="sm" x="492" y="212">диапазон a: верно</text><text class="sm" x="492" y="232">вид данных: подходит</text><text class="sm" x="492" y="252">позиция midsld = 104</text><path class="lm" d="M462 216L467.0 216.0"/><polygon class="hm" points="477,216 467.0,221.0 467.0,211.0"/></g>
<g class="a e11 tr"><rect class="bxn" x="477" y="157" width="221" height="118" rx="10"/></g>
<g class="a e12"><rect class="bxr" x="715" y="160" width="215" height="112" rx="8"/><text class="tk" x="727" y="186">вердикт ядру</text><text class="sm" x="727" y="212">выбросить оригинал;</text><text class="sm" x="727" y="232">две части шлёт</text><text class="sm" x="727" y="252">сама программа</text><path class="lm" d="M697 216L702.0 216.0"/><polygon class="hm" points="712,216 702.0,221.0 702.0,211.0"/></g>
<g class="a e13 tr"><rect class="bxn" x="712" y="157" width="221" height="118" rx="10"/></g>
<g class="a e14"><rect class="lr" x="7" y="53" width="732.8" height="38" rx="7"/><text class="tk rej" x="750" y="90">оригинал выброшен</text></g>
<g class="a e15"><text class="cap" x="10" y="306">multisplit отправляет две новые части</text></g>
<g class="a e16"><text class="tk" x="10" y="332">часть 1: 156 байт</text><rect class="bxg" x="10" y="340" width="104.0" height="34" rx="5"/><text class="sm c" x="62.0" y="362">52</text><rect class="bxa" x="116.0" y="340" width="206.0" height="34" rx="5"/><text class="tk c" x="220.0" y="362">данные 104</text></g>
<g class="a e17"><text class="mt" x="10" y="396">sending part 1 0-103 len=104</text><text class="mt mu" x="10" y="416">rawsend_dissect size=156</text></g>
<g class="a e18"><text class="tk" x="350" y="332">часть 2: 198 байт</text><rect class="bxg" x="350" y="340" width="104.0" height="34" rx="5"/><text class="sm c" x="402.0" y="362">52</text><rect class="bxb" x="456.0" y="340" width="290.0" height="34" rx="5"/><text class="tk c" x="602.0" y="362">данные 146</text></g>
<g class="a e19"><text class="mt" x="350" y="396">sending part 2 104-249 len=146</text><text class="mt mu" x="350" y="416">rawsend_dissect size=198</text></g>
<g class="a e20"><text class="tk" x="10" y="452">104 + 146 = 250 байт данных: сервер соберёт запрос целиком</text></g>
<g class="a e21"><rect class="bxb" x="10" y="470" width="940" height="60" rx="8"/><text class="sm" x="24" y="494">части уходят мимо очереди: в журнале номера идут от 1 до 11, новых частей среди них нет</text><text class="sm" x="24" y="517">вместо одного пакета в сети два: оригинал выброшен, две части отправила сама программа</text></g>
</svg>
