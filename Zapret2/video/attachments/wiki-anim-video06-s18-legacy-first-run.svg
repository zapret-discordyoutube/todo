<svg xmlns="http://www.w3.org/2000/svg" class="v06-s18-legacy-first-run" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="v06-s18-legacy-first-run-t v06-s18-legacy-first-run-d">
<title id="v06-s18-legacy-first-run-t">Первый запуск старой функции</title>
<desc id="v06-s18-legacy-first-run-d">Первый запуск старой функции на приветствии в 1484 байта с pos=midsld, куски по одному: на куске 1 (окно от 1 до 1448, в журнале диапазон 0-1447) пересчитанная позиция 104, поэтому режутся только эти 1448 байт на 1344 и 104 (1448 − 104 = 1344), сначала уходит 1344 байта со смещения 104, потом 104 с начала, оригинал выброшен; на куске 2 (в журнале 1448-1483) пересчитанной позиции нет, поэтому уходит копия как есть, 36 байт со смещения 1448 (пакет в 88 байт: 20 + 32 + 36), оригинал выброшен; в итоге на проводе 1344@104, 104@0, 36@1448, сервер отвечает блоком с 105 по 1448 и ACK 1449, приложение делает два чтения, 1448 и 36 байт (число чтений решает момент чтения, а не только функция), тогда как новая функция с теми же аргументами отправляет 1380 и 104 байта и приложение читает 1484 одним чтением; при проверке на приветствии в 250 байт старая функция отправляет то же, что новая: 146 байт со смещения 104, затем 104 с начала.</desc>
