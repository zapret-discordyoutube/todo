<g><text class="cap" x="40" y="24">опыт: multidisorder_legacy, pos=midsld, приветствие в 1484 байта</text></g>
<g class="a e1"><rect class="bxa" x="40" y="44" width="858.7" height="26" rx="0"/><text class="ix c fg tk" x="469.3" y="62">кусок 1: 1448 байт</text><rect class="bxb" x="898.7" y="44" width="21.3" height="26" rx="0"/><path class="lcut" d="M898.7 40L898.7 74"/></g>
<g class="a e2"><path class="la" d="M41 80L41 87L897.7 87L897.7 80"/><text class="sm" x="40" y="108">окно [1, 1449): в журнале «диапазон 0-1447»</text></g>
<g class="a e3"><path class="lb" d="M899.7 80L899.7 87L919 87L919 80"/><text class="sm r" x="920" y="108">кусок 2: окно [1449, 1485) = 1448-1483</text></g>
<g class="a e4"><rect class="bx" x="40" y="130" width="470" height="222" rx="6"/><text class="sm tk" x="52" y="154">кусок 1: режем только его 1448 байт</text><text class="ix" x="52" y="180">reasm piece range: 0-1447</text><text class="ix" x="52" y="200">normalized split pos: 104</text></g>
<g class="a e5"><text class="sm" x="52" y="228">calc: 1448 − 104 = 1344</text></g>
<g class="a e6"><rect class="bxb" x="52" y="242" width="200" height="34" rx="6"/><circle class="bxb" cx="70" cy="259" r="11"/><text class="ix c fg tk ns" x="70" y="263.5">1</text><text class="mk" x="90" y="264">1344@104</text><rect class="bxa" x="262" y="242" width="150" height="34" rx="6"/><circle class="bxa" cx="280" cy="259" r="11"/><text class="ix c fg tk ns" x="280" y="263.5">2</text><text class="mk" x="300" y="264">104@0</text><text class="sm" x="52" y="300">первой уходит правая часть, потом левая</text><text class="sm tk rej" x="52" y="340">оригинал 1448 байт: DROP</text></g>
<g class="a e7"><rect class="bx" x="530" y="130" width="390" height="222" rx="6"/><text class="sm tk" x="542" y="154">кусок 2: позиций нет, копия как есть</text><text class="ix" x="542" y="180">reasm piece range: 1448-1483</text><text class="ix" x="542" y="200">no normalized split pos in this packet</text></g>
<g class="a e8"><rect class="bxb" x="542" y="220" width="200" height="34" rx="6"/><circle class="bxb" cx="560" cy="237" r="11"/><text class="ix c fg tk ns" x="560" y="241.5">3</text><text class="mk" x="580" y="242">36@1448</text><text class="ix" x="542" y="276">rawsend_dissect repeats=1 size=88</text><text class="sm" x="542" y="298">calc: 20 + 32 + 36 = 88</text><text class="sm mu" x="542" y="316">IP 20, TCP 32 (с опциями), данные 36</text><text class="sm tk rej" x="542" y="340">оригинал 36 байт: DROP</text></g>
