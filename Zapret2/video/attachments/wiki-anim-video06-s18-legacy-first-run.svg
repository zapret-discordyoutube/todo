<g class="a e11"><rect class="bx" x="40" y="442" width="880" height="48" rx="6"/><text class="sm tk" x="52" y="471">новая</text><text class="mk" x="200" y="471">1380@104, 104@0</text><text class="m" x="480" y="471">ACK 1, [105,1485) и ACK 1485</text><text class="sm tk" x="740" y="462">одно чтение:</text><text class="sm" x="740" y="480">1484 байта</text></g>
