<svg xmlns="http://www.w3.org/2000/svg" class="v07-s19-ts-shift-outcomes" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="v07-s19-ts-shift-outcomes-t v07-s19-ts-shift-outcomes-d">
<title id="v07-s19-ts-shift-outcomes-t">Четыре сдвига метки времени и сервер без меток</title>
<desc id="v07-s19-ts-shift-outcomes-d">Четыре опыта со сдвигом метки времени у подделки: -1 принят и сервер получил 680 чужих байт, -2 и -600000 отвергнуты со сдвигом счётчика PAWSEstab на 1, а +600000 принят и поломал соединение, потому что счётчики сервера дошли до PAWSEstab 7 и PAWSOldAck 5, при выключенных метках на сервере опции нет, код только пишет в журнал, подделка принята, а MD5 и сдвиг подтверждения от меток не зависят.</desc>
