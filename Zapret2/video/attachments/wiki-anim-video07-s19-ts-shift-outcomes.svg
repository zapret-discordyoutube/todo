<rect class="bg" x="0" y="0" width="960" height="630"/>
<g><text class="cap" x="40" y="26">шестое условие: четыре опыта со сдвигом метки времени (TSval пакетов клиента)</text></g>
<g class="a e1"><text class="cap" x="40" y="56">сдвиг</text><text class="sm mu" x="130" y="56">пред. пакет</text><text class="sm mu" x="285" y="56">приветствие</text><text class="sm mu" x="420" y="56">подделка</text><text class="sm mu" x="570" y="56">что получил сервер</text><path class="lm" d="M40 64L920 64"/></g>
<g class="a e2"><rect class="bx" x="40" y="74" width="880" height="50" rx="6"/><text class="mk" x="54" y="104">-1</text><text class="m" x="130" y="104">1520942087</text><text class="m" x="285" y="104">1520942087</text><text class="mk amb" x="420" y="104">1520942086</text><rect class="bxr" x="560" y="78" width="348" height="42" rx="6"/><text class="tk sm" x="570" y="95">принята: сервер получил 680 байт</text><text class="sm" x="570" y="113">клиент завис; PAWS не двигались</text></g>
<g class="a e3"><rect class="bx" x="40" y="132" width="880" height="50" rx="6"/><text class="mk" x="54" y="162">-2</text><text class="m" x="130" y="162">1807447238</text><text class="m" x="285" y="162">1807447238</text><text class="mk amb" x="420" y="162">1807447236</text><rect class="bxo" x="560" y="136" width="348" height="42" rx="6"/><text class="tk sm" x="570" y="153">отвергнута: PAWSEstab +1</text><text class="sm" x="570" y="171">сервер 250 байт, чисто</text></g>
<g class="a e4"><rect class="bx" x="40" y="190" width="880" height="50" rx="6"/><text class="mk" x="54" y="220">-600000</text><text class="m" x="130" y="220">1952160333</text><text class="m" x="285" y="220">1952160334</text><text class="mk amb" x="420" y="220">1951560334</text><rect class="bxo" x="560" y="194" width="348" height="42" rx="6"/><text class="tk sm" x="570" y="211">отвергнута: PAWSEstab +1</text><text class="sm" x="570" y="229">сервер 250 байт, чисто</text></g>
<g class="a e5"><rect class="bx" x="40" y="248" width="880" height="50" rx="6"/><text class="mk" x="54" y="278">+600000</text><text class="m" x="130" y="278">1263108269</text><text class="m" x="285" y="278">1263108269</text><text class="mk amb" x="420" y="278">1263708269</text><rect class="bxr" x="560" y="252" width="348" height="42" rx="6"/><text class="tk sm" x="570" y="269">принята: 680 байт, клиент завис</text><text class="sm" x="570" y="287">PAWSEstab 0 → 7, PAWSOldAck 0 → 5</text></g>
<g class="a e6"><text class="tk sm" x="40" y="322">граница в нашем тесте: -1 терпится, -2 уже нет; единица метки около одной миллисекунды</text><text class="sm" x="40" y="344">+600000: метка из будущего, похоже, запомнена: обычные пакеты клиента стали «старыми»,</text><text class="sm" x="40" y="364">а ответы сервера несут эхо этой метки (1263708269)</text></g>
<g class="a e7"><text class="cap" x="40" y="394">метки времени не договорены: сервер с выключенными метками</text></g>
<g class="a e8"><rect class="bxb" x="40" y="404" width="430" height="114" rx="8"/><text class="tk sm" x="54" y="428">tcp_ts=-1 при выключенных метках</text><text class="sm" x="54" y="450">в заголовке клиента 20 байт, опций нет</text><text class="sm" x="54" y="472">журнал: timestamp tcp option not present or invalid</text><text class="tk sm rej" x="54" y="496">подделка не изменена: принята, 680 байт</text></g>
<g class="a e9"><rect class="bx" x="490" y="404" width="430" height="114" rx="8"/><text class="tk sm" x="504" y="428">при тех же выключенных метках</text><text class="sm" x="504" y="450">MD5: TCPMD5Unexpected +1, сервер 250 чисто</text><text class="sm" x="504" y="472">сдвиг подтверждения: TCPChallengeACK +1, чисто</text><text class="tk sm ok" x="504" y="496">эти условия на метках не держатся</text></g>
<g class="a e10"><text class="sm" x="40" y="548">проверь себя: метки не договорены, tcp_ts=-5: код не найдёт опцию, подделка уйдёт как есть, её примут</text><text class="sm mu" x="40" y="570">по общим сведениям, получатель помнит последнюю метку собеседника и отбрасывает старые пакеты:</text><text class="sm mu" x="40" y="590">это защита от запоздавших копий; имена счётчиков PAWS читаем по названию;</text><text class="sm mu" x="40" y="610">доказано лишь, что счётчики сдвинулись; всё на одном получателе и нашей модели</text></g>
</svg>
