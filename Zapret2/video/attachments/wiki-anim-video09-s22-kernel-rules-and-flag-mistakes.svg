<svg xmlns="http://www.w3.org/2000/svg" class="v09-s22-kernel-rules-and-flag-mistakes" viewBox="0 0 960 872" width="960" height="872" role="img" aria-labelledby="v09-s22-kernel-rules-and-flag-mistakes-t v09-s22-kernel-rules-and-flag-mistakes-d">
<title id="v09-s22-kernel-rules-and-flag-mistakes-t">Правила ядра сервера и две ошибки</title>
<desc id="v09-s22-kernel-rules-and-flag-mistakes-d">Правила ядра сервера зеркальны правилам клиента, потому что цепочки prerouting и postrouting поменяны местами, поставочный пример для сервера обходится одним правилом на пакеты сервера, пока клиент отправил не больше 15 пакетов, а в нашем тесте правила клиента на сервере не дали ни одной записи о пакете и приложение получило 250 байт, при верных правилах без флага сервера multisplit с позицией 5 режет приветствие клиента, и приложение сервера читает 5 и 245 байт, тогда как с флагом режется ответ сервера на 5 и 9 байт, а synack_split без флага выключается на SYN клиента и провод остаётся прежним.</desc>
