tion-name:v09-s22-kernel-rules-and-flag-mistakes-k8}@keyframes v09-s22-kernel-rules-and-flag-mistakes-k9{0.0%{opacity:0}35.714%{opacity:0}36.357%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v09-s22-kernel-rules-and-flag-mistakes .e9{animation-name:v09-s22-kernel-rules-and-flag-mistakes-k9}@keyframes v09-s22-kernel-rules-and-flag-mistakes-k10{0.0%{opacity:0}42.857%{opacity:0}43.5%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v09-s22-kernel-rules-and-flag-mistakes .e10{animation-name:v09-s22-kernel-rules-and-flag-mistakes-k10}@keyframes v09-s22-kernel-rules-and-flag-mistakes-k11{0.0%{opacity:0}44.286%{opacity:0}44.929%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v09-s22-kernel-rules-and-flag-mistakes .e11{animation-name:v09-s22-kernel-rules-and-flag-mistakes-k11}@keyframes v09-s22-kernel-rules-and-flag-mistakes-k12{0.0%{opacity:0}51.429%{opacity:0}52.071%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v09-s22-kernel-rules-and-flag-mistakes .e12{animation-name:v09-s22-kernel-rules-and-flag-mistakes-k12}@keyframes v09-s22-kernel-rules-and-flag-mistakes-k13{0.0%{opacity:0}60.0%{opacity:0}60.643%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v09-s22-kernel-rules-and-flag-mistakes .e13{animation-name:v09-s22-kernel-rules-and-flag-mistakes-k13}</style>
<rect class="bg" x="0" y="0" width="960" height="872"/>
<g><text class="cap" x="40" y="22">правила ядра для очереди и две ошибки на сервере</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="44" rx="8"/><text class="sm" x="54" y="63">камеру на другом конце дороги поворачивают зеркально: выезд стал въездом</text><rect class="pl" x="723.9" y="46" width="182.1" height="24" rx="12"/><text class="sm c" x="815" y="63">выдуманный пример</text></g>
<g class="a e2"><rect class="bx" x="40" y="94" width="880" height="82" rx="8"/><text class="sm tk" x="54" y="116">клиент: два правила, в каждом направлении первые 12 пакетов</text><text class="ix mu r" x="906" y="116">readme, строки 83 и 88, условие метки опущено</text><text class="ix mu" x="54" y="140">postrouting</text><text class="ix fg" x="154" y="140">tcp dport {80,443} ct original packets 1-12 queue num 200 bypass</text><text class="sm" x="700" y="140">клиент отправляет</text><text class="ix mu" x="54" y="162">prerouting</text><text class="ix fg" x="154" y="162">tcp sport {80,443} ct reply packets 1-12 queue num 200 bypass</text><text class="sm" x="700" y="162">клиент получает</text></g>
<g class="a e3"><path class="la" d="M120 180L120.0 198.0"/><polygon class="ha" points="120,208 115.0,198.0 125.0,198.0"/><text class="sm tk" x="136" y="200">цепочки меняются местами: prerouting и postrouting</text></g>
<g class="a e4"><rect class="bxb" x="40" y="216" width="880" height="82" rx="8"/><text class="sm tk" x="54" y="238">сервер: те же два правила, цепочки поменяны</text><text class="ix mu r" x="906" y="238">в лаборатории написаны вручную</text><text class="ix mu" x="54" y="262">prerouting</text><text class="ix fg" x="154" y="262">tcp dport 443 ct original packets 1-12 queue num 200 bypass</text><text class="sm" x="700" y="262">сервер получает</text><text class="ix mu" x="54" y="284">postrouting</text><text class="ix fg" x="154" y="284">tcp sport 443 ct reply packets 1-12 queue num 200 bypass</text><text class="sm" x="700" y="284">сервер отправляет</text></g>
<g class="a e5"><rect class="bxs" x="40" y="312" width="880" height="50" rx="8"/><text class="sm" x="54" y="333">установка меняет слова в правиле клиента (nft.sh, строки 327-330): так строится правило ответов</text><text class="sm tk" x="54" y="352">это не то, что установка делает для сервера: правила сервера мы писали вручную</text></g>
<g class="a e6"><text class="sm tk" x="40" y="382">пример для сервера из поставки</text><text class="ix mu r" x="920" y="382">init.d/custom.d.examples.linux/40-webserver</text></g>
<g class="a e7"><rect class="bx" x="40" y="390" width="880" height="118" rx="8"/><rect class="bxa" x="50" y="398" width="280" height="44" rx="6"/><text class="mk" x="60" y="417">--server</text><text class="sm" x="60" y="436">флаг сервера</text><rect class="bxb" x="340" y="398" width="280" height="44" rx="6"/><text class="mk" x="350" y="417">fake + multisplit</text><text class="sm" x="350" y="436">для ответа сервера</text><rect class="bxo" x="630" y="398" width="280" height="44" rx="6"/><text class="mk" x="640" y="417">synack_split</text><text class="sm" x="640" y="436">для пустых пакетов</text><text class="ix fg" x="54" y="468">f=&quot;tcp sport {$WEBSERVER_PORTS} $first_packets&quot;</text><text class="sm tk" x="54" y="490">одно правило, только пакеты сервера: tcp sport {80,443} ct original packets 1-15</text><text class="ix mu r" x="906" y="490">строки 36-38</text><text class="sm mu r" x="906" y="468">считает пакеты клиента, до 15</text></g>
<g class="a e8"><text class="sm tk" x="40" y="530">ошибка 1: правила клиента на сервере</text></g>
<g class="a e9"><rect class="bxr" x="40" y="538" width="286" height="52" rx="8"/><text class="sm mu" x="52" y="559">в журнале программы</text><text class="sm tk" x="52" y="579">записей о пакетах: 0</text><rect class="bx" x="337" y="538" width="286" height="52" rx="8"/><text class="sm mu" x="349" y="559">провод чистый</text><text class="sm tk" x="349" y="579">как у обычного сервера</text><rect class="bxo" x="634" y="538" width="286" height="52" rx="8"/><text class="sm mu" x="646" y="559">приложение сервера</text><text class="sm tk" x="646" y="579">250 байт целиком</text></g>
<g class="a e10"><text class="sm tk" x="40" y="614">ошибка 2: правила верные, флага нет</text><text class="ix fg r" x="920" y="614">--payload=all --lua-desync=multisplit:pos=5:payload=all</text></g>
<g class="a e11"><rect class="bxo" x="40" y="622" width="430" height="158" rx="8"/><text class="sm tk ok" x="54" y="644">с флагом: режется ответ сервера</text><text class="m fg" x="54" y="668">S&gt;C  PA  len 5</text><text class="m fg" x="54" y="688">S&gt;C  PA  len 9</text><text class="sm" x="54" y="716">клиент прочитал первые пять букв ответа</text><text class="sm tk" x="54" y="738">приложение сервера: [250]</text></g>
<g class="a e12"><rect class="bxb" x="490" y="622" width="430" height="158" rx="8"/><text class="sm tk amb" x="504" y="644">без флага: режется приветствие клиента</text><text class="m fg" x="504" y="668">C&gt;S  PA  len 250</text><text class="m fg" x="504" y="688">S&gt;C  A   rel_ack 6</text><text class="ix fg" x="504" y="708">LUA: multisplit: split pos: 5</text><text class="sm tk" x="504" y="730">приложение сервера: [5, 245]</text><text class="ix mu" x="504" y="750">на проводе приветствие целое;</text><text class="ix mu" x="504" y="768">куски, по нашему чтению, внутри сервера</text></g>
<g class="a e13"><rect class="bx" x="40" y="794" width="880" height="62" rx="8"/><text class="sm tk" x="54" y="816">synack_split без флага: первым видит SYN клиента и выключается, провод без изменений</text><text class="ix fg" x="54" y="840">instance cutoff for &#x27;synack_split_1_2&#x27; in=1 out=1</text></g>
</svg>
