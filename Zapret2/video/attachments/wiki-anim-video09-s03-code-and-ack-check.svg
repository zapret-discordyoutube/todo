<g><text class="cap" x="40" y="24">syndata в коде и проверка подтверждения</text></g>
<g class="a video09-s03-code-and-ack-check-k1"><rect class="bx" x="40" y="36" width="880" height="196" rx="8"/><text class="sm13 mu" x="56" y="58">lua/zapret-antidpi.lua, строки 397-407</text></g>
<g class="a video09-s03-code-and-ack-check-k2"><text class="ix" x="56" y="86">397</text><text class="cdh" x="100" y="86">if bitand(desync.dis.tcp.th_flags, TH_SYN + TH_ACK)==TH_SYN then</text><text class="sm13k acc" x="680" y="86">только SYN</text></g>
<g class="a video09-s03-code-and-ack-check-k3"><text class="ix" x="56" y="110">398</text><text class="cdh" x="100" y="110">  local dis = deepcopy(desync.dis)</text><text class="sm13k acc" x="680" y="110">копия пакета</text></g>
<g class="a video09-s03-code-and-ack-check-k4"><text class="ix" x="56" y="134">399</text><text class="cdh" x="100" y="134">  dis.payload = blob(desync, desync.arg.blob, "\x00\x00…")</text><text class="sm13k acc" x="680" y="134">блоб, по умолчанию 16 нулей</text></g>
<g class="a video09-s03-code-and-ack-check-k5"><text class="sm13 mu" x="100" y="158">строки 400-404: условия и правка блоба, в следующих сценах</text><rect class="fs" x="92" y="143" width="560" height="21"/></g>
<g class="a video09-s03-code-and-ack-check-k6"><text class="ix" x="56" y="182">406</text><text class="cdh" x="100" y="182">  if rawsend_dissect_ipfrag(dis, desync_opts(desync)) then</text><text class="sm13k acc" x="680" y="182">отправка копии</text></g>
<g class="a video09-s03-code-and-ack-check-k7"><text class="ix" x="56" y="206">407</text><text class="cdh" x="100" y="206">    return VERDICT_DROP</text><text class="sm13k acc" x="680" y="206">оригинал выбросить</text></g>
<g class="a video09-s03-code-and-ack-check-k8"><text class="tk" x="40" y="262">проверь себя: с какого номера пошло бы приветствие,</text><text class="tk" x="40" y="284">если бы сервер принял шестнадцать байт из SYN?</text></g>
<g class="a video09-s03-code-and-ack-check-k9 tr"><rect class="bxd" x="602" y="308" width="318" height="56" rx="8"/><text class="big c" x="761" y="344">?</text></g>
<g class="a video09-s03-code-and-ack-check-k10"><text class="smk" x="40" y="334">если бы приняли</text><text class="sm13 mu" x="40" y="352">гипотеза</text><rect class="bx" x="220" y="308" width="150" height="56" rx="8"/><text class="smk c" x="295" y="331">SYN</text><text class="sm13 c" x="295" y="351">номер 0</text><rect class="bxb" x="376" y="308" width="220" height="56" rx="8"/><text class="smk c" x="486" y="331">данные SYN: 16 байт</text><text class="sm13 c" x="486" y="351">номера 1…16</text><rect class="bxa" x="602" y="308" width="318" height="56" rx="8"/><text class="smk c" x="761" y="331">приветствие с номера 17</text><text class="sm13 c" x="761" y="351">0 + 1 + 16 = 17</text></g>
<g class="a video09-s03-code-and-ack-check-k11"><text class="smk" x="40" y="418">в нашем тесте</text><text class="sm13 mu" x="40" y="436">на проводе</text><rect class="bx" x="220" y="392" width="150" height="56" rx="8"/><text class="smk c" x="295" y="415">SYN</text><text class="sm13 c" x="295" y="435">номер 0</text><rect class="bxa" x="376" y="392" width="544" height="56" rx="8"/><text class="smk c" x="648" y="415">приветствие с номера 1, 250 байт</text><text class="sm13 c" x="648" y="435">0 + 1 = 1</text></g>
<g class="a video09-s03-code-and-ack-check-k12"><text class="tk" x="40" y="484">подтверждение сервера 1, номер приветствия 1: данные SYN в поток не попали</text><text class="sm13 mu" x="40" y="508">в нашем тесте сервер с Linux их не принял; по общим сведениям, сервер с быстрой отправкой данных в SYN</text><text class="sm13 mu" x="40" y="526">мог бы принять иначе, такой сервер мы не пробовали</text></g>
</svg>
