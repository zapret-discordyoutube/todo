<svg xmlns="http://www.w3.org/2000/svg" class="video09-s03-code-and-ack-check" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="video09-s03-code-and-ack-check-t video09-s03-code-and-ack-check-d">
<title id="video09-s03-code-and-ack-check-t">Код syndata и номер приветствия</title>
<desc id="video09-s03-code-and-ack-check-d">В коде функции syndata проверка одна, у пакета стоит только SYN, дальше идёт копия пакета с блобом из шестнадцати нулей, отправка и выброс оригинала, а подтверждение сервера 1 равно 0 плюс 1 за сам SYN, и если бы сервер принял шестнадцать байт, оно было бы 17 и приветствие шло бы с номера 17.</desc>
