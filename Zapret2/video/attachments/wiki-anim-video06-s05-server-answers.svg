<rect class="bg" x="0" y="0" width="960" height="602"/>
<g><text class="cap" x="40" y="24">в нашем опыте: что пришло на сервер и что он ответил, номера от первого байта</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="138" rx="6"/><text class="sm tk" x="52" y="60">1. первым на сервер пришёл пакет «конец»: байты 105–250, 146 байт</text></g>
<g class="a e2"><text class="sm" x="52" y="84">ответ сервера: </text><text class="sm tk" x="176" y="84">ACK 1 и блок [105, 251)</text></g>
<g class="a e3"><text class="sm" x="52" y="106">по порядку ничего нет, жду первый байт; в стороне лежит конец</text></g>
<g class="a e4"><rect class="bxd" x="56" y="130" width="352.8" height="28" rx="0"/><text class="ix c mu" x="232.4" y="149">не получено</text><rect class="bxb" x="408.8" y="130" width="495.2" height="28" rx="0"/><text class="ix c fg tk" x="656.4" y="149">лежит в стороне: байты 105–250</text><path class="lr" d="M56 124L56 164"/><text class="ix fg tk" x="64" y="122">ACK 1: жду отсюда</text></g>
<g class="a e5"><rect class="bx" x="40" y="190" width="880" height="138" rx="6"/><text class="sm tk" x="52" y="214">2. затем пришёл пакет «начало»: байты 1–104, 104 байта</text></g>
<g class="a e6"><text class="sm" x="52" y="238">ответ сервера: </text><text class="sm tk" x="176" y="238">ACK 251, блока нет</text></g>
<g class="a e7"><text class="sm" x="52" y="260">вместе с лежавшими байтами закрыто всё: жду байт 251</text></g>
<g class="a e8"><rect class="bxa" x="56" y="284" width="848" height="28" rx="0"/><text class="ix c fg tk" x="480" y="303">всё до байта 250 получено по порядку</text><path class="lr" d="M904 278L904 318"/><text class="ix fg tk r" x="896" y="276">ACK 251: жду отсюда</text></g>
<g class="a e9"><rect class="bx" x="40" y="344" width="880" height="32" rx="6"/><text class="sm" x="52" y="365">следом сервер отправил свои 14 байт ответа</text></g>
<g class="a e10"><text class="cap" x="40" y="400">для сравнения: два опыта без перемешивания</text></g>
<g class="a e11"><rect class="bx" x="40" y="410" width="430" height="70" rx="6"/><text class="sm tk" x="52" y="432">пакет не трогали: 250@0</text><text class="sm" x="52" y="456">ответ один: ACK 251</text></g>
<g class="a e12"><rect class="bx" x="490" y="410" width="430" height="70" rx="6"/><text class="sm tk" x="502" y="432">multisplit по той же метке: 104@0 первым</text><text class="sm" x="502" y="456">после него ACK 105 и блока нет</text></g>
<g class="a e13"><text class="sm mu" x="40" y="504">в обоих ничего из будущего в стороне не лежит</text></g>
<g class="a e14"><rect class="bxd" x="40" y="520" width="880" height="62" rx="6"/><text class="sm tk" x="52" y="542">измерен один получатель: сервер лаборатории, ядро Linux 6.18</text><text class="sm" x="52" y="566">у других систем ответы могут отличаться, мы не проверяли</text></g>
</svg>
