<svg xmlns="http://www.w3.org/2000/svg" class="video06-s05-server-answers" viewBox="0 0 960 602" width="960" height="602" role="img" aria-labelledby="video06-s05-server-answers-t video06-s05-server-answers-d">
<title id="video06-s05-server-answers-t">Ответы сервера на куски</title>
<desc id="video06-s05-server-answers-d">Ответы сервера лаборатории на Linux 6.18 в нашем опыте: на пакет «конец» с байтами 105–250 пришёл ACK 1 и блок от 105 до 251, то есть по порядку ничего нет, а в стороне лежит конец, на пакет «начало» с байтами 1–104 пришёл ACK 251 без блока, затем сервер отправил 14 байт своего ответа; для сравнения целый пакет 250@0 даёт ACK 251, а multisplit по той же метке даёт после первого куска 104@0 ACK 105 без блока; измерен один получатель, у других систем ответы могут отличаться.</desc>
