<svg xmlns="http://www.w3.org/2000/svg" class="v07-s24-multisplit-pktmod-ttl1" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="v07-s24-multisplit-pktmod-ttl1-t v07-s24-multisplit-pktmod-ttl1-d">
<title id="v07-s24-multisplit-pktmod-ttl1-t">Ловушки: срок 1 бьёт по настоящим</title>
<desc id="v07-s24-multisplit-pktmod-ttl1-d">Две ловушки со сроком жизни 1: в multisplit условие достаётся настоящим частям, все двенадцать клиентских пакетов уходят со сроком 1 и ничего не доходит до сервера, а в pktmod условие правит сам проходящий пакет, поэтому все шесть пакетов по 250 байт тоже умирают на роутере, и в обоих случаях приложение получает 0 байт, тогда как fake отправляет и правит только копию.</desc>
