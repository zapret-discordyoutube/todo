<svg xmlns="http://www.w3.org/2000/svg" class="v01-s04-inline" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v01-s04-inline-t v01-s04-inline-d">
<title id="v01-s04-inline-t">В линии и на копии</title>
<desc id="v01-s04-inline-d">Две схемы подряд. В линии: весь трафик идёт через устройство, как через шлагбаум, и оно может остановить любой пакет. На копии: настоящие пакеты едут мимо, устройству отдают только копию; остановить пакет оно уже не может, но может отправить свой, и если тот придёт раньше и подойдёт по номерам, получатель может его принять.</desc>
