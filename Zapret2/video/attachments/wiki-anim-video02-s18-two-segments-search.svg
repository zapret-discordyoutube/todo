<svg xmlns="http://www.w3.org/2000/svg" class="v02-s18-two-segments" viewBox="0 0 960 536" width="960" height="536" role="img" aria-labelledby="v02-s18-two-segments-t v02-s18-two-segments-d">
<title id="v02-s18-two-segments-t">Разрезанный запрос и инспектор</title>
<desc id="v02-s18-two-segments-d">Тот же запрос, разрезанный на 104 и 146 байт: в первом пакете от смещения 97 есть только 7 из 15 байт имени (www.exa), во втором на местах 97..111 лежат байты ключа 00 26 00 24 00 1d 00 20 d2 a1 e4 50 c7 8b 49, поэтому правило с фиксированным смещением не совпало; поиск подстрок тоже не находит www.example.com и example ни в одном пакете (www.exa только в первом, mple.com и .com только во втором); счётчик правила 0, сервер получил 104 и 146 байт и собрал запрос целиком.</desc>
