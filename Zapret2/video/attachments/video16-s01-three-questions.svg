<title id="v16-s01-three-questions-t">Три вопроса выпуска</title>
<desc id="v16-s01-three-questions-d">Клиент с zapret2: слева ядро, сетевая часть операционной системы, справа программа nfqws2 в пользовательском пространстве. Три вопроса выпуска: кто создаёт обычные пакеты (ядро, а не zapret2); как пакет попадает в программу и возвращается (целым, изменённым или выброшенным); как не перехватывать всё подряд (правило в ядре отбирает только нужные пакеты).</desc>
