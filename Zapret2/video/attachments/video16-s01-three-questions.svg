<rect class="bg" x="0" y="0" width="960" height="506"/>
<g><text class="cap" x="40" y="26">Клиент с zapret2: ядро и программа</text></g>
<g class="a e1"><rect class="bxs" x="40" y="50" width="340" height="236" rx="8"/><text class="tk" x="60" y="80">ЯДРО</text><text class="sm" x="60" y="102">сетевая часть ОС</text><rect class="bxs" x="580" y="50" width="340" height="236" rx="8"/><text class="tk" x="600" y="80">ПРОГРАММЫ</text><text class="sm" x="600" y="102">пользовательское пространство</text></g>
<g class="a e2"><rect class="fs" x="56" y="176" width="296" height="12" rx="3"/><rect class="bx" x="66" y="146" width="40" height="30" rx="3"/><rect class="bx" x="122" y="146" width="40" height="30" rx="3"/><rect class="bx" x="178" y="146" width="40" height="30" rx="3"/><rect class="bx" x="234" y="146" width="40" height="30" rx="3"/><rect class="bx" x="290" y="146" width="40" height="30" rx="3"/></g>
<g class="a e3"><text class="sm" x="60" y="232">создаёт и принимает</text><text class="sm" x="60" y="252">обычные пакеты</text></g>
<g class="a e4"><rect class="bx" x="600" y="140" width="88" height="54" rx="5"/><text class="sm c" x="644" y="172">браузер</text><rect class="bx" x="700" y="140" width="88" height="54" rx="5"/><text class="sm c" x="744" y="172">редактор</text><rect class="bxa" x="800" y="140" width="100" height="54" rx="5"/><text class="mk c" x="850" y="172">nfqws2</text></g>
<g class="a e5"><text class="sm" x="600" y="232">не в ядре: обычные процессы</text></g>
<g class="a e6"><circle class="bxa" cx="40" cy="50" r="13"/><text class="tk c ns" x="40" y="55">1</text></g>
<g class="a e7"><path class="la" d="M384 158L566.0 158.0"/><polygon class="ha" points="576,158 566.0,163.0 566.0,153.0"/><text class="sm c" x="480" y="148">пакет</text><circle class="bxa" cx="480" cy="112" r="13"/><text class="tk c ns" x="480" y="117">2</text></g>
<g class="a e8"><path class="lf" d="M576 244L394.0 244.0"/><polygon class="hf" points="384,244 394.0,239.0 394.0,249.0"/><text class="sm c" x="480" y="270">ответ</text></g>
<g class="a e9"><text class="tk sm c ok" x="480" y="184">целым</text><text class="tk sm c amb" x="480" y="202">изменённым</text><text class="tk sm c rej" x="480" y="220">выброшенным</text></g>
<g class="a e10"><rect class="bxd" x="352" y="128" width="30" height="70" rx="4"/><circle class="bxb" cx="367" cy="118" r="13"/><text class="tk c ns" x="367" y="123">3</text></g>
<g class="a e11"><rect class="bxa" x="66" y="146" width="40" height="30" rx="3"/><rect class="bxa" x="178" y="146" width="40" height="30" rx="3"/><rect class="bxa" x="290" y="146" width="40" height="30" rx="3"/></g>
<g class="a e12"><text class="tk sm c" x="200" y="120">правило: только нужные</text></g>
<g class="a e13"><rect class="bx" x="40" y="314" width="880" height="42" rx="6"/><circle class="bxa" cx="64" cy="335" r="13"/><text class="tk c ns" x="64" y="340">1</text><text class="tk" x="90" y="341">Кто создаёт обычные пакеты?</text><text class="sm r ok tk" x="908" y="341">ответ: ядро ОС, не zapret2</text></g>
<g class="a e14"><rect class="bx" x="40" y="366" width="880" height="42" rx="6"/><circle class="bxa" cx="64" cy="387" r="13"/><text class="tk c ns" x="64" y="392">2</text><text class="tk" x="90" y="393">Как пакет попадает в программу и возвращается?</text><text class="sm r mu" x="908" y="393">разбор: части 1 и 2</text></g>
<g class="a e15"><rect class="bx" x="40" y="418" width="880" height="42" rx="6"/><circle class="bxb" cx="64" cy="439" r="13"/><text class="tk c ns" x="64" y="444">3</text><text class="tk" x="90" y="445">Как не перехватывать всё подряд?</text><text class="sm r mu" x="908" y="445">разбор: часть 1</text></g>
<g class="a e16"><text class="sm mu" x="40" y="490">Разберём в два слоя: сначала картинка, потом настоящие правила ядра, код и один настоящий пакет.</text></g>
