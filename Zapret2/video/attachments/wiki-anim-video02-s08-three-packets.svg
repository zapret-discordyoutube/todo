<title id="v02-s08-three-packets-t">Рукопожатие из трёх пакетов</title>
<desc id="v02-s08-three-packets-d">Рукопожатие из трёх пакетов, записанное в лаборатории: SYN клиента (0,000 мс, начальный номер 3 164 320 783), SYN-ACK сервера (0,032 мс, начальный номер 2 838 066 481, подтверждение 3 164 320 784) и ACK клиента (0,045 мс, подтверждение 2 838 066 482); SYN занимает один номер, поэтому данные начинаются на единицу позже.</desc>
