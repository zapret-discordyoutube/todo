<g class="a e11"><rect class="bxa" x="10" y="422" width="22" height="22" rx="5"/><text class="tk" x="42" y="439">условие профиля</text><text class="sm" x="240" y="439">транспорт, порт, протокол: какие соединения нужны</text></g>
<g class="a e12"><rect class="bxb" x="412.59999999999997" y="72" width="154.9" height="26" rx="6"/><text class="mt fg" x="419.59999999999997" y="89.5">--payload=http_req</text><rect class="bxb" x="471.69999999999993" y="182" width="217.5" height="26" rx="6"/><text class="mt fg" x="478.69999999999993" y="199.5">--payload=tls_client_hello</text><rect class="bxb" x="479.49999999999994" y="292" width="186.2" height="26" rx="6"/><text class="mt fg" x="486.49999999999994" y="309.5">--payload=quic_initial</text></g>
<g class="a e13"><rect class="bxb" x="10" y="452" width="22" height="22" rx="5"/><text class="tk" x="42" y="469">ручка</text><text class="sm" x="240" y="469">вид данных: какой пакет нужен; диапазоны не заданы, действуют x и a</text></g>
<g class="a e14"><rect class="bxo" x="130" y="102" width="389.7" height="26" rx="6"/><text class="mt fg" x="137" y="119.5">--lua-desync=fake<tspan class="mu">:blob=fake_default_http:tcp_md5</tspan></text><rect class="bxo" x="130" y="132" width="295.8" height="26" rx="6"/><text class="mt fg" x="137" y="149.5">--lua-desync=multisplit<tspan class="mu">:pos=method+2</tspan></text><rect class="bxo" x="130" y="212" width="499.2" height="26" rx="6"/><text class="mt fg" x="137" y="229.5">--lua-desync=fake<tspan class="mu">:blob=fake_default_tls:tcp_md5:tcp_seq=-10000</tspan></text><rect class="bxo" x="130" y="242" width="319.2" height="26" rx="6"/><text class="mt fg" x="137" y="259.5">--lua-desync=multidisorder<tspan class="mu">:pos=1,midsld</tspan></text><rect class="bxo" x="130" y="322" width="405.3" height="26" rx="6"/><text class="mt fg" x="137" y="339.5">--lua-desync=fake<tspan class="mu">:blob=fake_default_quic:repeats=6</tspan></text></g>
<g class="a e15"><rect class="bxo" x="10" y="482" width="22" height="22" rx="5"/><text class="tk" x="42" y="499">вызовы</text><text class="sm" x="240" y="499">аргументы после двоеточий серые: их разберут следующие выпуски</text></g>
<g class="a e16"><text class="cap" x="10" y="528">режим разбора подтвердил: три профиля и пять вызовов (вывод сокращён)</text></g>
<g class="a e17"><text class="mt" x="10" y="552">we have 3 user defined desync profile(s)</text></g>
<g class="a e18"><text class="mt" x="10" y="572">profile 1 (noname) lua fake(tcp_md5=&quot;&quot;,blob=&quot;fake_default_http&quot; ... payload_type= http_req)</text></g>
<g class="a e19"><text class="mt" x="10" y="592">profile 1 (noname) lua multisplit(pos=&quot;method+2&quot; ...)</text></g>
<g class="a e20"><text class="mt" x="10" y="612">profile 2 (noname) lua fake(tcp_seq=&quot;-10000&quot;,tcp_md5=&quot;&quot;,blob=&quot;fake_default_tls&quot; ...)</text></g>
