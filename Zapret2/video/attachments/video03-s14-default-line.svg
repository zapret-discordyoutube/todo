<g class="a e1"><text class="cap" x="10" y="24">настройка по умолчанию из config.default (строки 87-91)</text></g>
<g class="a e2"><text class="sm mu" x="10" y="48">служебные опции перед ней добавляет скрипт запуска; слова &lt;HOSTLIST&gt; здесь опущены</text></g>
<g class="a e3"><rect class="bx" x="10" y="62" width="940" height="108" rx="8"/><text class="tk" x="24" y="90">профиль 1</text><text class="sm mu" x="24" y="110">TCP:80</text></g>
<g class="a e4"><rect class="bxg" x="130" y="72" width="131.4" height="26" rx="6"/><text class="mt fg" x="137" y="89.5">--filter-tcp=80</text><rect class="bxg" x="267.4" y="72" width="139.2" height="26" rx="6"/><text class="mt fg" x="274.4" y="89.5">--filter-l7=http</text><rect class="bxg" x="412.59999999999997" y="72" width="154.9" height="26" rx="6"/><text class="mt fg" x="419.59999999999997" y="89.5">--payload=http_req</text><rect class="bxg" x="130" y="102" width="389.7" height="26" rx="6"/><text class="mt fg" x="137" y="119.5">--lua-desync=fake:blob=fake_default_http:tcp_md5</text><rect class="bxg" x="130" y="132" width="295.8" height="26" rx="6"/><text class="mt fg" x="137" y="149.5">--lua-desync=multisplit:pos=method+2</text></g>
<g class="a e5"><rect class="bx" x="10" y="172" width="940" height="108" rx="8"/><text class="tk" x="24" y="200">профиль 2</text><text class="sm mu" x="24" y="220">TCP:443</text></g>
<g class="a e6"><rect class="bxg" x="130" y="182" width="53.1" height="26" rx="6"/><text class="mt fg" x="137" y="199.5">--new</text><rect class="bxg" x="189.1" y="182" width="139.2" height="26" rx="6"/><text class="mt fg" x="196.1" y="199.5">--filter-tcp=443</text><rect class="bxg" x="334.29999999999995" y="182" width="131.4" height="26" rx="6"/><text class="mt fg" x="341.29999999999995" y="199.5">--filter-l7=tls</text><rect class="bxg" x="471.69999999999993" y="182" width="217.5" height="26" rx="6"/><text class="mt fg" x="478.69999999999993" y="199.5">--payload=tls_client_hello</text><rect class="bxg" x="130" y="212" width="499.2" height="26" rx="6"/><text class="mt fg" x="137" y="229.5">--lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000</text><rect class="bxg" x="130" y="242" width="319.2" height="26" rx="6"/><text class="mt fg" x="137" y="259.5">--lua-desync=multidisorder:pos=1,midsld</text></g>
<g class="a e7"><rect class="bx" x="10" y="282" width="940" height="78" rx="8"/><text class="tk" x="24" y="310">профиль 3</text><text class="sm mu" x="24" y="330">UDP:443</text></g>
<g class="a e8"><rect class="bxg" x="130" y="292" width="53.1" height="26" rx="6"/><text class="mt fg" x="137" y="309.5">--new</text><rect class="bxg" x="189.1" y="292" width="139.2" height="26" rx="6"/><text class="mt fg" x="196.1" y="309.5">--filter-udp=443</text><rect class="bxg" x="334.29999999999995" y="292" width="139.2" height="26" rx="6"/><text class="mt fg" x="341.29999999999995" y="309.5">--filter-l7=quic</text><rect class="bxg" x="479.49999999999994" y="292" width="186.2" height="26" rx="6"/><text class="mt fg" x="486.49999999999994" y="309.5">--payload=quic_initial</text><rect class="bxg" x="130" y="322" width="405.3" height="26" rx="6"/><text class="mt fg" x="137" y="339.5">--lua-desync=fake:blob=fake_default_quic:repeats=6</text></g>
<g class="a e9"><rect class="bxd" x="10" y="370" width="940" height="34" rx="8"/><text class="sm" x="24" y="392">no_action: пустой профиль в самом конце, его добавляет программа</text></g>
