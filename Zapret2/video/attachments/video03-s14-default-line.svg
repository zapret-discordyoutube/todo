<svg xmlns="http://www.w3.org/2000/svg" class="v03-s14-default-line" viewBox="0 0 960 742" width="960" height="742" role="img" aria-labelledby="v03-s14-default-line-t v03-s14-default-line-d">
<title id="v03-s14-default-line-t">Строка по умолчанию</title>
<desc id="v03-s14-default-line-d">Настоящая строка по умолчанию из config.default разделена двумя --new на три профиля: TCP 80, протокол http, запрос http; TCP 443, протокол tls, клиентское приветствие; UDP 443, протокол quic, начальный пакет quic; условия профиля синие, вид данных золотой, вызовы fake, multisplit и multidisorder зелёные, аргументы после двоеточия серые (их разберут следующие выпуски), в конце стоит пустой no_action, а режим разбора подтверждает три профиля и пять вызовов.</desc>
<style>.v03-s14-default-line{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
