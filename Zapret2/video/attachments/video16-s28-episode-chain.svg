<svg xmlns="http://www.w3.org/2000/svg" class="v16-s28-episode-chain" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="v16-s28-episode-chain-t v16-s28-episode-chain-d">
<title id="v16-s28-episode-chain-t">Весь выпуск: от правила ядра до вставок на проводе</title>
<desc id="v16-s28-episode-chain-d">Итог всего выпуска одной цепочкой, блоки зажигаются по одному. Правило ядра отправляет первые двенадцать пакетов каждого направления в очередь 200 (с проверкой метки), настройщик очереди nfq_init (nfqws.c:355) её создаёт, главный цикл в одном потоке читает пакеты по одному (recv, nfqws.c:566, и nfq_handle_packet, 578), приёмщик nfq_cb (285-339) превращает вердикт в ответ ядру, проходная processPacketData (154-164) с проверкой метки в программе, движок и стратегия, три штампа PASS, MODIFY, DROP, вставки с меткой 40000000 через отправщик сырых пакетов rawsend (darkmagic.c:1984-2042), провод клиента. Хитрость с первым пакетом: desync.c:640-673. Числа выпуска: 12 и 12, первые двенадцать пакетов в каждую сторону; запрос из 250 байт в t10 получил DROP, а вместо него ушли две вставки, 104 и 146 байт, 250 = 104 + 146; очередь увидела 11 пакетов, провод клиента 12: одиннадцать, минус выброшенный запрос, плюс две вставки, 11 − 1 + 2 = 12. С меткой, которая не даёт вставкам вернуться в очередь.</desc>
