<svg xmlns="http://www.w3.org/2000/svg" class="v00-s11-eight-stations" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="v00-s11-eight-stations-t v00-s11-eight-stations-d">
<title id="v00-s11-eight-stations-t">Восемь станций пути пакета</title>
<desc id="v00-s11-eight-stations-d">Весь путь пакета по станциям: перехват отбирает пакеты, на Linux правилом ядра, на Windows драйвером WinDivert, они попадают в очередь, Си-часть разбирает пакет, находит запись о соединении, узнаёт тип содержимого и имя сайта, выбирает профиль, вызывает функцию на Lua и получает вердикт, так что Lua решает только на одной станции из восьми; в нашем тесте стратегия с опечаткой в имени дала ответ, что такой функции не существует, а строку с именем сайта без приставки LUA написала Си-часть.</desc>
