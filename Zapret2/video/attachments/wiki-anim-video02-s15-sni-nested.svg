<svg xmlns="http://www.w3.org/2000/svg" class="v02-s15-sni-nested" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="v02-s15-sni-nested-t v02-s15-sni-nested-d">
<title id="v02-s15-sni-nested-t">Поле SNI по байтам</title>
<desc id="v02-s15-sni-nested-d">Расширение с именем сайта по байтам, смещения 88–111: тип 00 00 «имя сервера» (88–89), длина расширения 00 14 = 20 (90–91), длина списка 00 12 = 18 (92–93), тип имени 00 «имя хоста» (94), длина имени 00 0f = 15 (95–96) и 15 байт имени 77 77 77 2e 65 78 61 6d 70 6c 65 2e 63 6f 6d, то есть www.example.com (97–111); длины вложены как конверты: 24 = 4 + 20, 20 = 2 + 18, 18 = 1 + 2 + 15; следующий байт, 112, уже начало следующего блока.</desc>
