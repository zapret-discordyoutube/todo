<svg xmlns="http://www.w3.org/2000/svg" class="v05-s16-gaps-slow-fast" viewBox="0 0 960 688" width="960" height="688" role="img" aria-labelledby="v05-s16-gaps-slow-fast-t v05-s16-gaps-slow-fast-d">
<title id="v05-s16-gaps-slow-fast-t">Паузы между частями: диск и память</title>
<desc id="v05-s16-gaps-slow-fast-d">Паузы между частями в двух наборах опытов на одной шкале времени: когда файл журнала лежит на диске Windows, подключённом к Linux, пауза между двумя частями 3,972 мс, между пятью частями четыре паузы 3,849, 3,976, 3,82 и 4,35 мс, то есть около 16 мс от первого до последнего пакета, и 4,75 мс с накладкой; когда журнал лежит в оперативной памяти, паузы 0,269 мс, затем 0,396, 0,201, 0,275 и 0,092 мс, меньше 1 мс от первого до последнего пакета, и 0,232 мс с накладкой; суммы посчитаны по уже измеренным паузам (3,849 + 3,976 + 3,82 + 4,35 = 15,995 и 0,396 + 0,201 + 0,275 + 0,092 = 0,964), вывод скорее всего такой: четыре миллисекунды это запись отладочного журнала на медленный диск, а не ожидание в пути отправки, но это сравнение двух наборов прогонов, где менялись путь журнала и каталог записи, а не отдельное измерение, и отладка была включена в обоих.</desc>
