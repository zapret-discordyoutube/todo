.v05-s16-gaps-slow-fast .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v05-s16-gaps-slow-fast .la{fill:none;stroke:var(--acc);stroke-width:2}
