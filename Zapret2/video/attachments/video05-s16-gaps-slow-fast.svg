<rect class="bg" x="0" y="0" width="960" height="688"/>
<g><text class="cap" x="40" y="24">паузы между частями в клиентском трафике: два набора опытов, одна шкала</text></g>
<g class="a e1"><rect class="bxb" x="40" y="36" width="430" height="54" rx="6"/><text class="sm tk" x="52" y="58">диск Windows, подключённый к Linux</text><text class="sm" x="52" y="80">лаборатория под Linux, файлы опытов на /mnt/j</text></g>
<g class="a e2"><rect class="bxo" x="490" y="36" width="430" height="54" rx="6"/><text class="sm tk" x="502" y="58">оперативная память</text><text class="sm" x="502" y="80">те же аргументы, журнал и файлы в /dev/shm</text></g>
<g class="a e3"><text class="sm mu" x="40" y="112">запись на диск Windows медленнее, чем в оперативную память; отладка включена в обоих наборах</text></g>
<g class="a e4"><text class="cap" x="40" y="150">один разрез, две части</text></g>
<g class="a e5"><text class="sm" x="40" y="179">диск Windows</text><rect class="bxb" x="200" y="160" width="119.2" height="26" rx="0"/><text class="sm tk" x="329.2" y="179">3,972 мс</text></g>
<g class="a e6"><text class="sm" x="40" y="213">память</text><rect class="bxo" x="200" y="194" width="8.1" height="26" rx="0"/><text class="sm tk" x="218.1" y="213">0,269 мс</text></g>
<g class="a e7"><text class="cap" x="40" y="250">пять частей, четыре паузы</text></g>
<g class="a e8"><text class="sm" x="40" y="279">диск Windows</text><rect class="bxb" x="200" y="260" width="115.5" height="26" rx="0"/><text class="ix c fg tk" x="257.7" y="278">3,849</text><rect class="bxr" x="315.5" y="260" width="119.3" height="26" rx="0"/><text class="ix c fg tk" x="375.1" y="278">3,976</text><rect class="bxb" x="434.8" y="260" width="114.6" height="26" rx="0"/><text class="ix c fg tk" x="492.1" y="278">3,82</text><rect class="bxr" x="549.4" y="260" width="130.5" height="26" rx="0"/><text class="ix c fg tk" x="614.6" y="278">4,35</text><text class="sm tk" x="689.9" y="279">15,995 мс всего</text></g>
<g class="a e9"><text class="sm" x="40" y="313">память</text><rect class="bxo" x="200" y="294" width="11.9" height="26" rx="0"/><rect class="bxo" x="211.9" y="294" width="6" height="26" rx="0"/><rect class="bxo" x="217.9" y="294" width="8.2" height="26" rx="0"/><rect class="bxo" x="226.2" y="294" width="2.8" height="26" rx="0"/><text class="sm tk" x="238.9" y="313">0,396 + 0,201 + 0,275 + 0,092 мс</text></g>
<g class="a e10"><text class="cap" x="40" y="350">с накладкой, две части</text></g>
<g class="a e11"><text class="sm" x="40" y="379">диск Windows</text><rect class="bxb" x="200" y="360" width="142.5" height="26" rx="0"/><text class="sm tk" x="352.5" y="379">4,75 мс</text></g>
<g class="a e12"><text class="sm" x="40" y="413">память</text><rect class="bxo" x="200" y="394" width="7" height="26" rx="0"/><text class="sm tk" x="217" y="413">0,232 мс</text></g>
<g class="a e13"><path class="lf" d="M200 448L320 448"/><path class="lf" d="M200 442L200 454"/><path class="lf" d="M320 442L320 454"/><text class="sm mu" x="332" y="453">шкала: 4 мс</text></g>
<g class="a e14"><text class="cap" x="40" y="480">проверь себя на бумаге: пять частей, сколько от первого до последнего пакета</text></g>
<g class="a e15"><rect class="bxb" x="40" y="490" width="430" height="56" rx="6"/><text class="sm tk" x="52" y="512">журнал на диске Windows: около 16 мс</text><text class="m" x="52" y="534">3,849 + 3,976 + 3,82 + 4,35 = 15,995</text></g>
<g class="a e16"><rect class="bxo" x="490" y="490" width="430" height="56" rx="6"/><text class="sm tk" x="502" y="512">журнал в памяти: меньше 1 мс</text><text class="m" x="502" y="534">0,396 + 0,201 + 0,275 + 0,092 = 0,964</text></g>
<g class="a e17"><text class="sm mu" x="40" y="566">это сумма уже измеренных пауз, нового опыта не было</text></g>
<g class="a e18"><rect class="bxd" x="40" y="578" width="880" height="94" rx="6"/><text class="sm tk" x="52" y="600">вывод: скорее всего, 4 мс это запись отладочного журнала на медленный диск</text><text class="sm" x="52" y="621">в самом пути отправки ожидания нет</text><text class="sm" x="52" y="642">оговорка: это сравнение двух наборов прогонов (менялись путь журнала и каталог записи),</text><text class="sm" x="52" y="660">а не отдельное измерение</text></g>
</svg>
