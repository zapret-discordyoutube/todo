.v05-s16-gaps-slow-fast .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v05-s16-gaps-slow-fast .hf{fill:var(--fg2)}.v05-s16-gaps-slow-fast .ha{fill:var(--acc)}.v05-s16-gaps-slow-fast .hr{fill:var(--rej)}.v05-s16-gaps-slow-fast .hm{fill:var(--mute)}.v05-s16-gaps-slow-fast .hb{fill:var(--amb)}
.v05-s16-gaps-slow-fast .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
