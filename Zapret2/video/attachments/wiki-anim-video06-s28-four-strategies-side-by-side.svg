<svg xmlns="http://www.w3.org/2000/svg" class="v06-s28-four-strategies-side-by-side" viewBox="0 0 960 734" width="960" height="734" role="img" aria-labelledby="v06-s28-four-strategies-side-by-side-t v06-s28-four-strategies-side-by-side-d">
<title id="v06-s28-four-strategies-side-by-side-t">Четыре стратегии рядом</title>
<desc id="v06-s28-four-strategies-side-by-side-d">Четыре стратегии выпуска рядом: multisplit режет сообщение по меткам и отправляет куски по порядку, seqovl у него число слева; multidisorder режет всё сообщение один раз и отправляет с конца, внутри длинного куска ломтики идут вверх, nodrop оставляет оригинал, seqovl у него метка внутри сообщения, позиция 0 не режет, а по умолчанию 2; multidisorder_legacy режет каждый проигрываемый кусок отдельно с конца и сохраняет разбивку клиента, nodrop не читает, seqovl у неё метка внутри текущего пакета ядра, кусок без разреза идёт копией через все параметры подделки, а метка на границе кусков ничего не режет; tcpseg с drop отправляет один диапазон с включённым концом одним сегментом, если он помещается в пакет, вердикта не даёт, оригинал выбрасывает drop, остаток в нашем тесте присылает ядро клиента, seqovl у него число слева, а диапазон от имени в нашем опыте дал чёрную дыру.</desc>
