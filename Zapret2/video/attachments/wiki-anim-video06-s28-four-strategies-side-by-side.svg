<g><text class="cap" x="40" y="24">четыре стратегии выпуска рядом</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="142" rx="10"/><text class="mk" x="56" y="70">multisplit</text><text class="ix mu" x="56" y="94">zapret-antidpi.lua:483-539</text><text class="sm mu" x="290" y="68">отправляет</text><text class="sm" x="410" y="68">куски по меткам</text><text class="sm mu" x="290" y="90">порядок</text><text class="sm" x="410" y="90">по возрастанию, без перестановки</text><text class="sm mu" x="290" y="112">оригинал</text><text class="sm" x="410" y="112">выбрасывается; разобрано раньше</text><text class="sm mu" x="290" y="134">seqovl</text><text class="sm" x="410" y="134">числом, слева от первого байта</text><text class="sm mu" x="290" y="156">ловушка</text><text class="sm tk" x="410" y="156">в отличие от multidisorder, без перестановки</text></g>
<g class="a e2"><rect class="bxa" x="40" y="196" width="880" height="164" rx="10"/><text class="mk" x="56" y="226">multidisorder</text><text class="ix mu" x="56" y="250">zapret-antidpi.lua:597-641</text><text class="ix mu" x="56" y="270">помощник 558-586</text><text class="sm mu" x="290" y="224">отправляет</text><text class="sm" x="410" y="224">всё сообщение, режет один раз</text><text class="sm mu" x="290" y="246">порядок</text><text class="sm" x="410" y="246">с конца; ломтики вверх, если кусок не влезает в пакет</text><text class="sm mu" x="290" y="268">оригинал</text><text class="sm" x="410" y="268">выбрасывается; nodrop оставляет оригинал</text><text class="sm mu" x="290" y="290">seqovl</text><text class="sm" x="410" y="290">меткой, внутри сообщения</text><text class="sm mu" x="290" y="312">ловушка</text><text class="sm tk" x="410" y="312">позиция 0 не режет, по умолчанию 2;</text><text class="sm tk" x="410" y="334">ломтики вверх, если кусок не влезает в пакет</text></g>
<g class="a e3"><rect class="bxb" x="40" y="374" width="880" height="164" rx="10"/><text class="mk" x="56" y="404">multidisorder_legacy</text><text class="ix mu" x="56" y="428">zapret-antidpi.lua:649-696</text><text class="sm mu" x="290" y="402">отправляет</text><text class="sm" x="410" y="402">каждый проигрываемый кусок отдельно</text><text class="sm mu" x="290" y="424">порядок</text><text class="sm" x="410" y="424">с конца внутри куска; разбивка клиента сохранена</text><text class="sm mu" x="290" y="446">оригинал</text><text class="sm" x="410" y="446">выбрасывается; nodrop не читается</text><text class="sm mu" x="290" y="468">seqovl</text><text class="sm" x="410" y="468">меткой, нормализованной на текущий пакет ядра</text><text class="sm mu" x="290" y="490">ловушка</text><text class="sm tk" x="410" y="490">кусок без разреза идёт копией через все параметры</text><text class="sm tk" x="410" y="512">подделки; метка на границе кусков не режет</text></g>
<g class="a e4"><rect class="bxo" x="40" y="552" width="880" height="164" rx="10"/><text class="mk" x="56" y="582">tcpseg + drop</text><text class="ix mu" x="56" y="606">tcpseg: 1043-1089</text><text class="ix mu" x="56" y="626">drop: 79-85</text><text class="sm mu" x="290" y="580">отправляет</text><text class="sm" x="410" y="580">один диапазон, оба конца включены</text><text class="sm mu" x="290" y="602">порядок</text><text class="sm" x="410" y="602">одним сегментом, если помещается в пакет (иначе ломтики)</text><text class="sm mu" x="290" y="624">оригинал</text><text class="sm" x="410" y="624">tcpseg вердикта не даёт, выбрасывает drop;</text><text class="sm" x="410" y="646">остаток в нашем тесте присылает ядро клиента</text><text class="sm mu" x="290" y="668">seqovl</text><text class="sm" x="410" y="668">числом, слева от начала диапазона</text><text class="sm mu" x="290" y="690">ловушка</text><text class="sm tk" x="410" y="690">диапазон от имени в нашем опыте дал чёрную дыру</text></g>
