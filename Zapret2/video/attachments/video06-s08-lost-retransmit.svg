<g><text class="cap" x="40" y="24">начало потеряно: приложение ждёт повторной отправки</text></g>
<g><rect class="bx" x="110" y="36" width="140" height="28" rx="6"/><text class="sm tk c" x="180" y="55">клиент</text><rect class="bx" x="710" y="36" width="140" height="28" rx="6"/><text class="sm tk c" x="780" y="55">сервер</text><path class="lmd" d="M180 64L180 466"/><path class="lmd" d="M780 64L780 466"/></g>
<g class="a e1"><text class="sm mu" x="40" y="103">0</text><path class="la" d="M180 98L770.0 98.0"/><polygon class="ha" points="780,98 770.0,103.0 770.0,93.0"/><text class="sm c" x="480" y="90">146 байт: 105…250</text></g>
<g class="a e2"><path class="lf" d="M780 124L190.0 124.0"/><polygon class="hf" points="180,124 190.0,119.0 190.0,129.0"/><text class="sm c" x="480" y="142">ACK 1, блок [105,251)</text></g>
<g class="a e3"><text class="sm mu" x="40" y="189">0,2 мс</text><path class="la" d="M180 184L500 184"/><path class="lr" d="M488 172L512 196M488 196L512 172"/><text class="sm tk rej" x="526" y="189">потерян на роутере</text><text class="sm c" x="340" y="176">104 байта: 1…104</text></g>
<g class="a e4"><rect class="bxb" x="110" y="214" width="740" height="48" rx="6"/><text class="sm c tk" x="480" y="235">ожидание около 204 мс: первая повторная отправка ядра клиента</text><text class="sm c" x="480" y="254">в нашем тесте; не постоянная величина и не свойство стратегии</text></g>
<g class="a e5"><text class="sm mu" x="40" y="301">203,8 мс</text><path class="la" d="M180 296L770.0 296.0"/><polygon class="ha" points="780,296 770.0,301.0 770.0,291.0"/><text class="sm c" x="480" y="288">146 байт: 105…250, снова</text></g>
<g class="a e6"><path class="lf" d="M780 322L190.0 322.0"/><polygon class="hf" points="180,322 190.0,317.0 190.0,327.0"/><text class="sm c" x="480" y="340">ACK 1, блок [105,251) и такой же второй: дублирующий SACK</text></g>
<g class="a e7"><text class="sm mu" x="40" y="417">204,0 мс</text><path class="la" d="M180 412L770.0 412.0"/><polygon class="ha" points="780,412 770.0,417.0 770.0,407.0"/><text class="sm c" x="480" y="404">104 байта: 1…104, снова</text></g>
<g class="a e8"><path class="lf" d="M780 438L190.0 438.0"/><polygon class="hf" points="180,438 190.0,433.0 190.0,443.0"/><text class="sm c" x="480" y="456">ACK 251: дыра закрыта</text></g>
<g class="a e9"><text class="sm" x="40" y="484"></text></g>
<g class="a e10 tr"><rect class="bxd" x="190" y="352" width="580" height="30" rx="6"/><text class="sm c tk" x="480" y="372">проверь себя: пройдёт ли повтор через стратегию?</text></g>
<g class="a e11"><rect class="bxo" x="40" y="480" width="880" height="54" rx="6"/><text class="sm tk" x="52" y="502">да, повтор проходит через стратегию: это новый исходящий пакет с приветствием</text><text class="sm" x="52" y="524">в журнале функция сработала дважды, и дважды пакет ядра выброшен: drop, drop</text></g>
<g class="a e12"><rect class="bxa" x="40" y="544" width="880" height="34" rx="6"/><text class="sm tk" x="52" y="566">приложение: 250 байт одним чтением, но только после повтора</text></g>
<g class="a e13"><rect class="bxd" x="40" y="588" width="880" height="34" rx="6"/><text class="sm" x="52" y="610">не выяснено: почему ядро отправило снова все 250 байт, а не только дыру</text></g>
</svg>
