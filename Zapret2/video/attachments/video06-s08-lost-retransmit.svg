<svg xmlns="http://www.w3.org/2000/svg" class="v06-s08-lost-retransmit" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="v06-s08-lost-retransmit-t v06-s08-lost-retransmit-d">
<title id="v06-s08-lost-retransmit-t">Потерян кусок с началом: повтор</title>
<desc id="v06-s08-lost-retransmit-d">Опыт, где потерян кусок с началом: клиент отправляет 146 байт со 105-го, сервер отвечает ACK 1 и блоком с 105 по 250, потом уходит кусок в 104 байта с 1-го и пропадает на роутере, через около 204 миллисекунд в нашем тесте (первая повторная отправка ядра клиента, это не постоянная величина) снова уходят 146 байт, и повтор проходит через стратегию, потому что это новый исходящий пакет с приветствием, поэтому функция сработала дважды и дважды выбросила пакет ядра; на вторую пару сервер отвечает ACK 1 с двумя одинаковыми блоками с 105 по 250, это дублирующий SACK второго вида, потом начало доходит и приходит ACK 251, и приложение получает 250 байт одним чтением только после повтора; не выяснено, почему ядро отправило снова все 250 байт, а не только дыру.</desc>
