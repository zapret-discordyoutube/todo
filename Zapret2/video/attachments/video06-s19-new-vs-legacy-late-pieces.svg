<g><text class="cap" x="40" y="24">опыт 1 · позиции midsld и −1 (последний байт, смещение 1483)</text></g>
<g class="a e1"><text class="sm tk" x="40" y="50">новая: режет всю ленту, границы клиентских сегментов ей безразличны</text><rect class="bxa" x="40" y="78" width="58.9" height="24" rx="0"/><circle class="bxa" cx="69.4" cy="66" r="11"/><text class="ix c fg tk ns" x="69.4" y="70.5">3</text><rect class="bxb" x="98.9" y="78" width="780.6" height="24" rx="0"/><circle class="bxb" cx="489.2" cy="66" r="11"/><text class="ix c fg tk ns" x="489.2" y="70.5">2</text><rect class="bxo" x="879.4" y="78" width="5" height="24" rx="0"/><circle class="bxo" cx="887.9" cy="66" r="11"/><text class="ix c fg tk ns" x="887.9" y="70.5">1</text><path class="lcut" d="M859.6 74L859.6 106"/><text class="m" x="40" y="124">на проводе: 1@1483, 1379@104, 104@0</text><text class="m" x="40" y="146">ответы: ACK 1 и блок [1484,1485); ACK 1 и блок [105,1485); ACK 1485</text><text class="sm tk" x="40" y="168">приложение: одно чтение, 1484 байта</text></g>
<g class="a e2"><text class="sm tk" x="40" y="206">старая: режет каждый кусок отдельно, пакеты не пересекают стенку</text><rect class="bxb" x="98.9" y="234" width="760.8" height="24" rx="0"/><circle class="bxb" cx="479.2" cy="222" r="11"/><text class="ix c fg tk ns" x="479.2" y="226.5">1</text><rect class="bxa" x="40" y="234" width="58.9" height="24" rx="0"/><circle class="bxa" cx="69.4" cy="222" r="11"/><text class="ix c fg tk ns" x="69.4" y="226.5">2</text><rect class="bxo" x="879.4" y="234" width="5" height="24" rx="0"/><circle class="bxo" cx="901.9" cy="222" r="11"/><text class="ix c fg tk ns" x="901.9" y="226.5">3</text><rect class="bxr" x="859.6" y="234" width="19.8" height="24" rx="0"/><circle class="bxr" cx="863.5" cy="222" r="11"/><text class="ix c fg tk ns" x="863.5" y="226.5">4</text><path class="lcut" d="M859.6 230L859.6 262"/><text class="m" x="40" y="280">на проводе: 1344@104, 104@0, 1@1483, 35@1448</text><text class="m" x="40" y="302">ответы: ACK 1 и блок [105,1449); ACK 1449; ACK 1449 и блок [1484,1485); ACK 1485</text><text class="sm tk" x="40" y="324">приложение: два чтения, 1448 и 36 (зависит от момента чтения)</text></g>
<g class="a e3"><text class="sm mu" x="40" y="356">на куске 2 метка −1 стала 35 (журнал «normalized split pos: 35»): 36 байт режутся на 35 и 1</text></g>
<g class="a e4"><path class="lmd" d="M40 376L920 376"/><text class="cap" x="40" y="398">опыт 2 · только позиция −1</text></g>
<g class="a e5"><text class="sm tk" x="40" y="424">старая: на первом куске разреза нет, копия целиком; потом кусок 2</text><rect class="bxa" x="40" y="452" width="819.6" height="24" rx="0"/><circle class="bxa" cx="449.8" cy="440" r="11"/><text class="ix c fg tk ns" x="449.8" y="444.5">1</text><rect class="bxo" x="879.4" y="452" width="5" height="24" rx="0"/><circle class="bxo" cx="901.9" cy="440" r="11"/><text class="ix c fg tk ns" x="901.9" y="444.5">2</text><rect class="bxr" x="859.6" y="452" width="19.8" height="24" rx="0"/><circle class="bxr" cx="863.5" cy="440" r="11"/><text class="ix c fg tk ns" x="863.5" y="444.5">3</text><path class="lcut" d="M859.6 448L859.6 480"/><text class="m" x="40" y="498">на проводе: 1448@0, 1@1483, 35@1448</text><text class="m" x="40" y="520">ответы: ACK 1449; ACK 1449 и блок [1484,1485); ACK 1485</text><text class="sm tk" x="40" y="542">приложение: два чтения, 1448 и 36 (зависит от момента чтения)</text></g>
<g class="a e6"><text class="sm tk" x="40" y="580">новая: сначала последний байт, потом всё остальное</text><rect class="bxb" x="40" y="608" width="819.6" height="24" rx="0"/><circle class="bxb" cx="449.8" cy="596" r="11"/><text class="ix c fg tk ns" x="449.8" y="600.5">2</text><rect class="bxb" x="859.6" y="608" width="19.8" height="24" rx="0"/><circle class="bxb" cx="865.5" cy="596" r="11"/><text class="ix c fg tk ns" x="865.5" y="600.5">3</text><rect class="bxo" x="879.4" y="608" width="5" height="24" rx="0"/><circle class="bxo" cx="901.9" cy="596" r="11"/><text class="ix c fg tk ns" x="901.9" y="600.5">1</text><path class="lcut" d="M859.6 604L859.6 636"/><text class="m" x="40" y="654">на проводе: 1@1483, 1448@0, 35@1448</text><text class="m" x="40" y="676">ответы: ACK 1 и блок [1484,1485); ACK 1449 и блок [1484,1485); ACK 1485</text><text class="sm tk" x="40" y="698">приложение: два чтения, 1448 и 36 (зависит от момента чтения)</text></g>
<g class="a e7"><rect class="bxb" x="40" y="710" width="880" height="62" rx="6"/><text class="sm tk" x="52" y="733">часть в 1483 байта не влезла в пакет: данных в нём не больше 1460 − 12 = 1448</text><text class="sm" x="52" y="755">(MSS из SYN минус 12 байт опций), поэтому она ушла двумя пакетами; почему, в следующей части</text></g>
