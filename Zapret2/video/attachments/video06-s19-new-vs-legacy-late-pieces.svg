<svg xmlns="http://www.w3.org/2000/svg" class="v06-s19-new-vs-legacy-late-pieces" viewBox="0 0 960 788" width="960" height="788" role="img" aria-labelledby="v06-s19-new-vs-legacy-late-pieces-t v06-s19-new-vs-legacy-late-pieces-d">
<title id="v06-s19-new-vs-legacy-late-pieces-t">Новая и старая: поздние куски</title>
<desc id="v06-s19-new-vs-legacy-late-pieces-d">Два опыта с большим приветствием в 1484 байта, где новая функция режет всю ленту, а старая каждый кусок проигрыша в его окне: при pos=midsld,-1 новая отправляет 1@1483, 1379@104, 104@0 и приложение читает 1484 байта одним чтением, а старая отправляет 1344@104, 104@0, 1@1483, 35@1448, ни один пакет не пересекает границу клиентских сегментов, и приложение делает два чтения, 1448 и 36 (их число зависит от момента чтения); при pos=-1 новая начинает с последнего байта (1@1483, 1448@0, 35@1448), а старая сначала отправляет копию первого куска целиком (1448@0), потом 1@1483 и 35@1448, причём часть в 1483 байта у новой уходит двумя пакетами, потому что в пакете данных не больше 1448 байт (MSS 1460 минус 12 байт опций с меткой времени), а почему так, объяснит следующая часть выпуска.</desc>
