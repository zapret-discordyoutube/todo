<rect class="bg" x="0" y="0" width="960" height="404"/>
<g class="a e1"><text class="cap" x="30" y="28">метка: слово вместо числа</text></g>
<g class="a e2"><text class="mk mu" x="58.6" y="70">--lua-desync=</text><rect class="bx" x="178.2" y="50" width="105.3" height="30" rx="6"/><text class="mk c" x="230.9" y="70">multisplit</text><text class="mk mu" x="289.5" y="70">:</text><rect class="bx" x="304.3" y="50" width="44.2" height="30" rx="6"/><text class="mk c" x="326.4" y="70">pos</text><text class="mk mu" x="354.5" y="70">=</text><rect class="bxa" x="369.2" y="50" width="70.4" height="30" rx="6"/><text class="mk c" x="404.4" y="70">midsld</text></g>
<g class="a e3"><text class="sm mu c" x="216.9" y="104">имя стратегии</text><text class="sm mu c" x="326.4" y="104">аргумент</text></g>
<g class="a e4"><text class="sm tk acc c" x="404.4" y="104">метка</text></g>
<g class="a e5"><rect class="bx" x="30" y="218" width="900" height="36" rx="4"/><text class="sm" x="40" y="241">приветствие TLS, 250 байт</text><text class="sm mu" x="30" y="210">0</text><text class="sm mu r" x="930" y="210">249</text></g>
<g class="a e6"><rect class="bxn" x="379.2" y="215" width="54" height="42" rx="4"/><text class="sm" x="443.2" y="241">← имя сайта www.example.com, байты 97–111</text></g>
<g class="a e7"><path class="lm" d="M404.4 118L404.4 142"/><text class="sm" x="418.4" y="136">программа сама находит номер байта</text></g>
<g class="a e8"><rect class="bxa" x="379.4" y="152" width="50" height="28" rx="6"/><text class="mk c" x="404.4" y="172">104</text><path class="lm" d="M404.4 182L404.4 197"/><polygon class="hm" points="404.4,206 399.9,197.0 408.9,197.0"/></g>
<g class="a e9"><path class="lcut" d="M404.4 212L404.4 260"/></g>
<g class="a e10"><rect class="bxa" x="30" y="288" width="372.4" height="36" rx="4"/><rect class="bxb" x="406.4" y="288" width="523.6" height="36" rx="4"/><text class="sm tk" x="40" y="311">104 байта (0–103)</text><text class="sm tk r" x="920" y="311">146 байт (104–249)</text></g>
<g class="a e11"><text class="mk r" x="394.4" y="311">…www.exa</text><text class="mk" x="414.4" y="311">mple.com…</text></g>
<g class="a e12"><text class="tk" x="30" y="358">Мы не писали «104»: мы написали слово, а программа превратила его в номер байта.</text><text class="sm" x="30" y="382">В нашем тесте приветствие ушло на провод двумя пакетами: 104 и 146 байт.</text></g>
</svg>
