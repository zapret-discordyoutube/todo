<svg xmlns="http://www.w3.org/2000/svg" class="v04-s01-word-number" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="v04-s01-word-number-t v04-s01-word-number-d">
<title id="v04-s01-word-number-t">Метка вместо числа</title>
<desc id="v04-s01-word-number-d">Строка стратегии multisplit:pos=midsld: слово midsld это метка, слово вместо числа. Программа сама находит для неё номер байта 104 в приветствии на 250 байт (имя www.example.com лежит на байтах 97–111, счёт с нуля), и в нашем тесте приветствие уходит двумя частями: 104 байта (до «www.exa») и 146 байт (от «mple.com»).</desc>
<style>
.v04-s01-word-number{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v04-s01-word-number{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v04-s01-word-number .bg{fill:var(--bg)}
.v04-s01-word-number text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v04-s01-word-number .tk{font-weight:600;fill:var(--fg)}
.v04-s01-word-number .sm{font-size:14.5px}
.v04-s01-word-number .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v04-s01-word-number .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v04-s01-word-number .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v04-s01-word-number .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}
.v04-s01-word-number .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v04-s01-word-number .mu{fill:var(--mute)}.v04-s01-word-number .fg{fill:var(--fg)}.v04-s01-word-number .acc{fill:var(--acc)}.v04-s01-word-number .rej{fill:var(--rej)}.v04-s01-word-number .ok{fill:var(--ok)}.v04-s01-word-number .amb{fill:var(--amb)}
.v04-s01-word-number .c{text-anchor:middle}.v04-s01-word-number .r{text-anchor:end}
.v04-s01-word-number .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v04-s01-word-number .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v04-s01-word-number .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v04-s01-word-number .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v04-s01-word-number .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v04-s01-word-number .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v04-s01-word-number .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v04-s01-word-number .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v04-s01-word-number .bxda{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:5 4}
.v04-s01-word-number .pill{fill:var(--bg);stroke:none}
.v04-s01-word-number .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v04-s01-word-number .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v04-s01-word-number .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v04-s01-word-number .la{fill:none;stroke:var(--acc);stroke-width:2}
.v04-s01-word-number .lad{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4}
.v04-s01-word-number .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v04-s01-word-number .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v04-s01-word-number .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v04-s01-word-number .hf{fill:var(--fg2)}.v04-s01-word-number .ha{fill:var(--acc)}.v04-s01-word-number .hr{fill:var(--rej)}.v04-s01-word-number .hm{fill:var(--mute)}
.v04-s01-word-number .a{animation-duration:26s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v04-s01-word-number .a{animation:none}.v04-s01-word-number .tr{display:none}}
