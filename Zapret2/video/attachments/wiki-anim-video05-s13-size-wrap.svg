<g><text class="cap" x="40" y="24">размер пакета в журнале и переход номера через край</text></g>
<g class="a e1"><text class="sm tk" x="40" y="52">размер пакета: IP + TCP + данные</text></g>
<g class="a e2"><rect class="bxb" x="40" y="66" width="38" height="28" rx="0"/><text class="ix c" x="59" y="85">IP</text><rect class="bxs" x="78" y="66" width="60.8" height="28" rx="0"/><text class="ix c" x="108.4" y="85">TCP</text><rect class="bxa" x="138.8" y="66" width="197.6" height="28" rx="0"/><text class="sm c" x="237.6" y="85">данные 104</text></g>
<g class="a e3"><text class="mk" x="40" y="116">20 + 32 + 104 = 156</text><text class="sm" x="250" y="116">в журнале: size=156</text></g>
<g class="a e4"><rect class="bxb" x="40" y="150" width="38" height="28" rx="0"/><text class="ix c" x="59" y="169">IP</text><rect class="bxs" x="78" y="150" width="60.8" height="28" rx="0"/><text class="ix c" x="108.4" y="169">TCP</text><rect class="bxo" x="138.8" y="150" width="277.4" height="28" rx="0"/><text class="sm c" x="277.5" y="169">данные 146</text></g>
<g class="a e5"><text class="mk" x="40" y="200">20 + 32 + 146 = 198</text><text class="sm" x="250" y="200">в журнале: size=198</text></g>
<g class="a e6"><text class="sm mu" x="40" y="242">32 = 20 + 12 байт опций (из чего 12, в следующей сцене)</text></g>
<g class="a e7"><text class="sm tk" x="580" y="52">выдуманный пример: минутная стрелка</text><circle class="bx" cx="700" cy="146" r="50"/><path class="lm" d="M700.0 104.0L700.0 98.0"/><path class="lm" d="M721.0 109.6L724.0 104.4"/><path class="lm" d="M736.4 125.0L741.6 122.0"/><path class="lm" d="M742.0 146.0L748.0 146.0"/><path class="lm" d="M736.4 167.0L741.6 170.0"/><path class="lm" d="M721.0 182.4L724.0 187.6"/><path class="lm" d="M700.0 188.0L700.0 194.0"/><path class="lm" d="M679.0 182.4L676.0 187.6"/><path class="lm" d="M663.6 167.0L658.4 170.0"/><path class="lm" d="M658.0 146.0L652.0 146.0"/><path class="lm" d="M663.6 125.0L658.4 122.0"/><path class="lm" d="M679.0 109.6L676.0 104.4"/><path class="lf" d="M700 146L696.2 110.2"/><text class="ix c" x="688" y="90">59</text><text class="ix mu" x="706" y="172">0</text><text class="sm" x="764" y="138">после 59</text><text class="sm" x="764" y="160">снова 0</text></g>
<g class="a e8"><text class="cap" x="40" y="288">номер TCP: 32 бита по общим сведениям, после наибольшего счёт идёт с нуля</text></g>
<g class="a e9"><rect class="bx" x="40" y="346" width="520" height="30" rx="0"/><rect class="bx" x="560" y="346" width="360" height="30" rx="0"/><text class="mk" x="48" y="367">…</text><text class="mk r" x="552" y="367">4294967295</text><text class="mk" x="570" y="367">0</text><text class="mk mu" x="600" y="367">1</text></g>
<g class="a e10"><path class="lr" d="M560 338L560 384"/><text class="sm c rej" x="560" y="402">край шкалы</text></g>
<g class="a e11"><rect class="fa" x="328" y="342" width="4" height="38" rx="0"/><path class="la" d="M330 346L330 380"/><text class="mk c acc" x="330" y="402">4294967280</text><text class="sm c" x="330" y="422">номер исходного пакета</text></g>
<g class="a e12"><path class="lb" d="M330 336Q445.0 318 556 336"/><text class="sm c" x="445" y="318">16 шагов до нуля</text></g>
<g class="a e13"><path class="lb" d="M564 336Q650 318 736 336"/><text class="sm c" x="650" y="318">88 после нуля</text><path class="lb" d="M736 346L736 376"/><text class="mk c amb" x="736" y="402">88</text></g>
<g class="a e14"><text class="sm c" x="650" y="422">в собранном пакете</text></g>
<g class="a e15"><rect class="bx" x="40" y="442" width="880" height="74" rx="8"/><text class="sm" x="54" y="466">4294967280 + 104 = 4294967384: в Lua сумма выходит за край (zapret-lib.lua:1287, без маски)</text><text class="sm" x="54" y="488">16 + 88 = 104; лишнее отбрасывает код на Си, когда собирает пакет (nfq2/lua.c:2269)</text><text class="sm tk" x="54" y="508">проверено только в прогоне функций, в живом опыте такого не было</text></g>
</svg>
