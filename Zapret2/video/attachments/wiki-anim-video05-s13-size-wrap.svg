<svg xmlns="http://www.w3.org/2000/svg" class="v05-s13-size-wrap" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v05-s13-size-wrap-t v05-s13-size-wrap-d">
<title id="v05-s13-size-wrap-t">Размер и край шкалы</title>
<desc id="v05-s13-size-wrap-d">Размер пакета в журнале это 20 байт заголовка IP плюс 32 байта заголовка TCP (20 обязательных и 12 байт опций) плюс данные, поэтому у частей нашего опыта 20 + 32 + 104 = 156 и 20 + 32 + 146 = 198, именно эти размеры стоят в строках журнала size=156 и size=198; по общим сведениям порядковый номер TCP занимает 32 бита и после самого большого значения счёт идёт с нуля, как у минутной стрелки после 59, и в прогоне функций с номером исходного пакета 4294967280, на 16 меньше края шкалы, прибавка 104 даёт в Lua сумму 4294967384, а в собранном пакете стоит 88, потому что лишнее отбрасывает код на Си: 16 шагов до нуля плюс 88 после нуля равно 104, в живом опыте такого не было.</desc>
