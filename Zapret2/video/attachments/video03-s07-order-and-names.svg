<rect class="bg" x="0" y="0" width="960" height="450"/>
<g class="a e1"><text class="cap" x="10" y="22">вызовы идут в порядке команды, у каждого своё имя</text></g>
<g class="a e2"><text class="sm" x="10" y="52">имя экземпляра = <tspan class="acc tk">функция</tspan><tspan class="mu"> _ </tspan><tspan class="amb tk">профиль</tspan><tspan class="mu"> _ </tspan><tspan class="ok tk">позиция</tspan></text></g>
<g class="a e3"><rect class="bx" x="10" y="66" width="460" height="36" rx="6"/><text class="tk c" x="34" y="90">1</text><text class="cd" x="52" y="90">pcap:file=nfqws_seen.pcap</text><path class="lm" d="M272 84L284.0 84.0"/><polygon class="hm" points="294,84 284.0,89.0 284.0,79.0"/><text class="ml" x="302" y="91"><tspan class="acc">pcap</tspan><tspan class="mu">_</tspan><tspan class="amb">1</tspan><tspan class="mu">_</tspan><tspan class="ok">1</tspan></text></g>
<g class="a e4"><rect class="bx" x="10" y="110" width="460" height="36" rx="6"/><text class="tk c" x="34" y="134">2</text><text class="cd" x="52" y="134">multisplit:pos=midsld</text><path class="lm" d="M272 128L284.0 128.0"/><polygon class="hm" points="294,128 284.0,133.0 284.0,123.0"/><text class="ml" x="302" y="135"><tspan class="acc">multisplit</tspan><tspan class="mu">_</tspan><tspan class="amb">1</tspan><tspan class="mu">_</tspan><tspan class="ok">2</tspan></text></g>
<g class="a e5"><rect class="bx" x="10" y="154" width="460" height="36" rx="6"/><text class="tk c" x="34" y="178">3</text><text class="cd" x="52" y="178">pass</text><path class="lm" d="M272 172L284.0 172.0"/><polygon class="hm" points="294,172 284.0,177.0 284.0,167.0"/><text class="ml" x="302" y="179"><tspan class="acc">pass</tspan><tspan class="mu">_</tspan><tspan class="amb">1</tspan><tspan class="mu">_</tspan><tspan class="ok">3</tspan></text></g>
<g class="a e6"><text class="sm mu" x="10" y="214">профиль 1 (опыт с пустышкой pass); слева позиция</text></g>
<g class="a e7"><text class="sm mu" x="10" y="250">журнал опыта, пакет с запросом:</text><rect class="bx" x="10" y="258" width="460" height="54" rx="6"/><text class="cd" x="22" y="281">* lua &#x27;<tspan class="acc">pcap_1_1</tspan>&#x27; : …</text><text class="cd" x="22" y="303">* lua &#x27;<tspan class="acc">multisplit_1_2</tspan>&#x27; : …</text></g>
<g class="a e8"><text class="tk sm" x="10" y="336">порядок строк = порядок вызовов в команде</text></g>
<g class="a e9"><text class="tk sm" x="500" y="52">пример (по коду, не запускали): профиль 3</text></g>
<g class="a e10"><rect class="bx" x="500" y="66" width="450" height="36" rx="6"/><text class="tk c" x="524" y="90">1</text><text class="cd" x="542" y="90">pass</text><path class="lm" d="M676 84L688.0 84.0"/><polygon class="hm" points="698,84 688.0,89.0 688.0,79.0"/><text class="ml" x="706" y="91"><tspan class="acc">pass</tspan><tspan class="mu">_</tspan><tspan class="amb">3</tspan><tspan class="mu">_</tspan><tspan class="ok">1</tspan></text></g>
<g class="a e11"><rect class="bxd" x="500" y="110" width="450" height="36" rx="6"/><text class="tk c" x="524" y="134">2</text><text class="cd mu" x="542" y="134">drop</text><path class="lm" d="M676 128L688.0 128.0"/><polygon class="hm" points="698,128 688.0,133.0 688.0,123.0"/><text class="ml" x="706" y="135"><tspan class="acc">drop</tspan><tspan class="mu">_</tspan><tspan class="amb">3</tspan><tspan class="mu">_</tspan><tspan class="ok">2</tspan></text><text class="sm mu r" x="940" y="134">пропущен</text></g>
<g class="a e12"><rect class="bxa" x="500" y="154" width="450" height="36" rx="6"/><text class="tk c" x="524" y="178">3</text><text class="cd" x="542" y="178">multisplit</text><path class="lm" d="M676 172L688.0 172.0"/><polygon class="hm" points="698,172 688.0,177.0 688.0,167.0"/><text class="ml" x="706" y="179"><tspan class="acc">multisplit</tspan><tspan class="mu">_</tspan><tspan class="amb">3</tspan><tspan class="mu">_</tspan><tspan class="ok">3</tspan></text></g>
<g class="a e13"><text class="tk sm" x="500" y="214">позиция считается и у пропущенных вызовов</text><text class="sm mu" x="500" y="234">так имя не меняется от пакета к пакету (desync.c:1102)</text></g>
<g class="a e14"><path class="lm" d="M500 252L950 252"/><text class="tk sm" x="500" y="276">ответы вызовов одного пакета складываются</text></g>
<g class="a e15"><rect class="bx" x="500" y="288" width="110" height="34" rx="6"/><text class="mk c " x="555" y="311">PASS</text><text class="ml c mu" x="630" y="311">&lt;</text></g>
<g class="a e16"><rect class="bxb" x="650" y="288" width="110" height="34" rx="6"/><text class="mk c amb" x="705" y="311">MODIFY</text><text class="ml c mu" x="780" y="311">&lt;</text></g>
<g class="a e17"><rect class="bxr" x="800" y="288" width="110" height="34" rx="6"/><text class="mk c rej" x="855" y="311">DROP</text></g>
<g class="a e18"><text class="sm" x="500" y="344">побеждает сильнейший (desync.c:875-888)</text></g>
<g class="a e19"><text class="tk sm" x="500" y="372">при ошибке вызова остальные не запускаются</text></g>
<g class="a e20"><rect class="bx" x="500" y="384" width="102" height="30" rx="6"/><text class="sm c " x="551" y="404">вызов 1</text></g>
<g class="a e21"><rect class="bxr" x="614" y="384" width="102" height="30" rx="6"/><text class="sm c rej tk" x="665" y="404">ошибка</text></g>
<g class="a e22"><rect class="bx" x="728" y="384" width="102" height="30" rx="6"/><text class="sm c " x="779" y="404">вызов 3</text><rect class="dim" x="728" y="384" width="102" height="30" rx="6"/></g>
<g class="a e23"><rect class="bx" x="842" y="384" width="102" height="30" rx="6"/><text class="sm c " x="893" y="404">вызов 4</text><rect class="dim" x="842" y="384" width="102" height="30" rx="6"/></g>
<g class="a e24"><text class="sm" x="500" y="436">итог: PASS, пакет без изменений (desync.c:1142-1146)</text></g>
<g class="a e25"><text class="tk" x="10" y="380">Оба правила про сложение и ошибку</text><text class="tk" x="10" y="402">взяты из кода, опытом не проверялись.</text><text class="sm" x="10" y="428">Имя экземпляра: функция, профиль, позиция.</text></g>
</svg>
