.v03-s07-order-and-names .dot{fill:var(--mute);stroke:none}.v03-s07-order-and-names .dota{fill:var(--acc);stroke:none}.v03-s07-order-and-names .doto{fill:var(--ok);stroke:none}.v03-s07-order-and-names .dotr{fill:var(--rej);stroke:none}
