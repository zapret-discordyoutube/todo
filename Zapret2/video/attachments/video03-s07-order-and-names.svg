<svg xmlns="http://www.w3.org/2000/svg" class="v03-s07-order-and-names" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="v03-s07-order-and-names-t v03-s07-order-and-names-d">
<title id="v03-s07-order-and-names-t">Порядок вызовов и имена экземпляров</title>
<desc id="v03-s07-order-and-names-d">Порядок вызовов и имя экземпляра: вызовы профиля стоят в порядке командной строки (pcap, multisplit, pass), имя экземпляра это функция, номер профиля и позиция (pcap_1_1, multisplit_1_2, pass_1_3), позиция считается и у пропущенного на этом пакете вызова (multisplit_3_3 в примере), а ответы вызовов складываются: побеждает сильнейший из PASS, MODIFY, DROP, ошибка вызова останавливает остальные и пакет проходит без изменений.</desc>
<style>
.v03-s07-order-and-names{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
