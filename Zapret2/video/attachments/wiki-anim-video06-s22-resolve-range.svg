<g class="a e24"><text class="mk" x="40" y="601">host,999</text><rect class="bx" x="200" y="586" width="440" height="18" rx="0"/><rect class="bxa" x="370.7" y="586" width="269.3" height="18" rx="0"/><text class="mk" x="656" y="600">153@97, затем 250@0</text><text class="ix mu" x="656" y="618">опыт: 249 − 97 + 1 = 153</text></g>
<g class="a e25"><text class="mk" x="40" y="653">999,midsld</text><rect class="bx" x="200" y="638" width="440" height="18" rx="0"/><rect class="bxa" x="200" y="638" width="184.8" height="18" rx="0"/><text class="mk" x="656" y="652">105@0, затем 250@0</text><text class="ix mu" x="656" y="670">опыт: 104 − 0 + 1 = 105</text></g>
<g class="a e26"><text class="mk" x="40" y="705">midsld,host</text><rect class="bx" x="200" y="690" width="440" height="18" rx="0"/><text class="sm c rej" x="420" y="704">заливки нет</text><text class="mk" x="656" y="704">только 250@0</text><text class="ix mu" x="656" y="722">опыт: «range cannot be resolved»</text></g>
<g class="a e27"><text class="mk" x="40" y="757">host,endhost-1</text><rect class="bx" x="200" y="742" width="440" height="18" rx="0"/><rect class="bxd" x="370.7" y="742" width="26.4" height="18" rx="0"/><rect class="fa" x="370.7" y="742" width="26.4" height="18" rx="0"/><path class="lr" d="M397.1 738L397.1 764"/><text class="ix rej" x="401.1" y="782">первый байт после имени</text><text class="mk" x="656" y="756">15 байт: www.example.com</text><text class="ix mu" x="656" y="774">по коду; endhost = 112</text></g>
<g class="a e28"><rect class="bxo" x="40" y="800" width="880" height="52" rx="6"/><text class="sm tk" x="52" y="822">минус один нужен из-за включённого конца: host,endhost без него дал бы</text><text class="sm" x="52" y="842">112 − 97 + 1 = 16 байт, имя и ещё один; арифметика по коду, запуска нет</text></g>
</svg>
