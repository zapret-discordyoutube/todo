<svg xmlns="http://www.w3.org/2000/svg" class="v06-s22-resolve-range" viewBox="0 0 960 884" width="960" height="884" role="img" aria-labelledby="v06-s22-resolve-range-t v06-s22-resolve-range-d">
<title id="v06-s22-resolve-range-t">resolve_range: мерка диапазона</title>
<desc id="v06-s22-resolve-range-d">Мерка диапазона resolve_range из файла nfq2/lua.c (строки 3351-3398): выдуманная линейка с двумя флажками и четырьмя картинками (оба стоят, потерян первый, потерян второй, потеряны оба или флажки в обратном порядке), код (меток ровно две, каждая метка вычисляется как в выпуске «Где резать: метки», потерянный первый конец становится началом данных, потерянный второй последним байтом, первая позже второй даёт пустой ответ, возвращаются два числа с прибавленной единицей) и примеры на приветствии в 250 байт: host,midsld по коду даёт 8 байт www.exam, в опыте host,999 даёт 153@97 и следом оригинал, 999,midsld даёт 105@0 и оригинал, midsld,host даёт «диапазон не удалось определить» и только оригинал 250@0, а host,endhost-1 по коду даёт 15 байт имени, потому что без минус единицы включённый конец дал бы 16 байт.</desc>
