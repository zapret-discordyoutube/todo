<g class="a e7"><rect class="bx" x="40" y="214" width="560" height="274" rx="6"/><path class="lm" d="M86 220L86 482"/><text class="ix mu r" x="78" y="239">3374</text><text class="ix fg" x="96" y="239">if (!posmarker_list_parse(smarkers,markers,&amp;ctm))</text><text class="ix mu r" x="78" y="265">3375</text><text class="ix fg" x="96" y="265">  luaL_error(L, &quot;bad marker list&quot;);</text><text class="ix mu r" x="78" y="291">3376</text><text class="ix fg" x="96" y="291">if (ctm!=2)</text><text class="ix mu r" x="78" y="317">3377</text><text class="ix fg" x="96" y="317">  luaL_error(L, &quot;resolve_range require 2 markers&quot;);</text><text class="ix mu r" x="78" y="343">3378</text><text class="ix fg" x="96" y="343">pos[0] = ResolvePos(data, len, l7payload, markers);</text><text class="ix mu r" x="78" y="369">3380</text><text class="ix fg" x="96" y="369">if (pos[0]==POS_NOT_FOUND &amp;&amp; pos[1]==POS_NOT_FOUND || …)</text><text class="ix mu r" x="78" y="395">3385</text><text class="ix fg" x="96" y="395">if (pos[0]==POS_NOT_FOUND) pos[0] = 0;</text><text class="ix mu r" x="78" y="421">3386</text><text class="ix fg" x="96" y="421">if (pos[1]==POS_NOT_FOUND) pos[1] = len-1;</text><text class="ix mu r" x="78" y="447">3387</text><text class="ix fg" x="96" y="447">if (pos[0]&gt;pos[1])</text><text class="ix mu r" x="78" y="473">3394</text><text class="ix fg" x="96" y="473">lua_pushi_int(L,1,pos[0]+!bZeroBased);</text></g>
