<title id="video09-s12-extra-byte-tape-and-code-t">Где стоит лишний байт и как собран пакет</title>
<desc id="video09-s12-extra-byte-tape-and-code-d">В срочном пакете на 251 байт слева лежат 104 байта приветствия, затем лишний нулевой байт под номером 105, на который показывает указатель срочности, и справа 146 байт, а две строки кода собирают такое тело и включают флаг URG.</desc>
