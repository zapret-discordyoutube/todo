<svg xmlns="http://www.w3.org/2000/svg" class="v00-s21-honesty-recap" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v00-s21-honesty-recap-t v00-s21-honesty-recap-d">
<title id="v00-s21-honesty-recap-t">Как читать наши утверждения</title>
<desc id="v00-s21-honesty-recap-d">Наши утверждения бывают трёх видов: то, что сказано в документации и прочитано в программе, то, что в нашем тесте измерено в лаборатории на игрушечном инспекторе, и то, что по общим сведениям известно о VPN и DPI, а не о настоящей системе, и автор программы готовых рецептов не даёт, потому что блокировки меняются, а способ обхода мы всегда называем стратегией.</desc>
