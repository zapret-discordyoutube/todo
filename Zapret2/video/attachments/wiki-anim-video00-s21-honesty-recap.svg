<rect class="bg" x="0" y="0" width="960" height="480"/>
<g><text class="cap" x="24" y="24">как читать наши утверждения</text></g>
<g class="a e1"><rect class="bx" x="24" y="44" width="296" height="166" rx="8"/><rect class="bxa" x="36" y="56" width="163" height="26" rx="13.0"/><text class="sm tk c" x="117.5" y="74">ДОКУМЕНТАЦИЯ</text><text class="sm" x="40" y="108">прочитано в программе</text><text class="sm" x="40" y="129">или в документации</text><text class="sm mu" x="40" y="158">пример:</text><text class="sm tk" x="40" y="178">«автор пишет: это не готовое</text><text class="sm tk" x="40" y="198">решение для чайников»</text></g>
<g class="a e2"><rect class="bx" x="332" y="44" width="296" height="166" rx="8"/><rect class="bxo" x="344" y="56" width="157" height="26" rx="13.0"/><text class="sm tk c" x="422.5" y="74">В НАШЕМ ТЕСТЕ</text><text class="sm" x="348" y="108">измерено в нашей лаборатории,</text><text class="sm" x="348" y="129">на игрушечном инспекторе</text><text class="sm mu" x="348" y="158">пример:</text><text class="sm tk" x="348" y="178">«сервер получил все</text><text class="sm tk" x="348" y="198">250 байт запроса»</text></g>
<g class="a e3"><rect class="bx" x="640" y="44" width="296" height="166" rx="8"/><rect class="bxb" x="652" y="56" width="228" height="26" rx="13.0"/><text class="sm tk c" x="766" y="74">ПО ОБЩИМ СВЕДЕНИЯМ</text><text class="sm" x="656" y="108">общее знание о VPN и DPI,</text><text class="sm" x="656" y="129">не факт о настоящей системе</text><text class="sm mu" x="656" y="158">пример:</text><text class="sm tk" x="656" y="178">«блокирующее оборудование</text><text class="sm tk" x="656" y="198">может читать имя сайта»</text></g>
<g class="a e4"><rect class="bx" x="24" y="226" width="912" height="100" rx="8"/><rect class="bxa" x="40" y="238" width="163" height="26" rx="13.0"/><text class="sm tk c" x="121.5" y="256">ДОКУМЕНТАЦИЯ</text><text class="sm tk" x="217" y="257">автор программы предупреждает:</text><text class="big tk" x="40" y="288">«Сейчас это так, а завтра будет еще что-то другое»</text><text class="sm" x="40" y="314">готовых рецептов нет: блокировки меняются, и старые рецепты перестают работать</text></g>
<g class="a e5"><rect class="bxn" x="24" y="342" width="446" height="120" rx="10"/><text class="sm" x="40" y="376">способ обхода мы всегда называем</text><text class="big tk c" x="247" y="432">стратегия</text></g>
<g class="a e6"><rect class="bxd" x="490" y="342" width="446" height="56" rx="8"/><text class="sm tk c" x="713" y="365">о настоящем ТСПУ как о факте</text><text class="sm tk c" x="713" y="385">мы не говорим ничего</text></g>
<g class="a e7"><rect class="bxr" x="490" y="408" width="446" height="54" rx="10"/><text class="tk c" x="713" y="441">результат нужно проверять самому</text></g>
</svg>
