(0px,-6px)}}.v07-s20-where-accepted .e4{animation-name:v07-s20-where-accepted-k4}@keyframes v07-s20-where-accepted-k5{0.0%{opacity:0;transform:translate(0px,-6px)}19%{opacity:0;transform:translate(0px,-6px)}21%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-where-accepted .e5{animation-name:v07-s20-where-accepted-k5}@keyframes v07-s20-where-accepted-k6{0.0%{opacity:0;transform:translate(0px,-6px)}24%{opacity:0;transform:translate(0px,-6px)}26%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-where-accepted .e6{animation-name:v07-s20-where-accepted-k6}@keyframes v07-s20-where-accepted-k7{0.0%{opacity:0;transform:translate(0px,-6px)}29%{opacity:0;transform:translate(0px,-6px)}31%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-where-accepted .e7{animation-name:v07-s20-where-accepted-k7}@keyframes v07-s20-where-accepted-k8{0.0%{opacity:0;transform:translate(0px,-6px)}34%{opacity:0;transform:translate(0px,-6px)}36%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-where-accepted .e8{animation-name:v07-s20-where-accepted-k8}@keyframes v07-s20-where-accepted-k9{0.0%{opacity:0;transform:translate(0px,-6px)}39%{opacity:0;transform:translate(0px,-6px)}41%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-where-accepted .e9{animation-name:v07-s20-where-accepted-k9}@keyframes v07-s20-where-accepted-k10{0.0%{opacity:0;transform:translate(0px,-6px)}44%{opacity:0;transform:translate(0px,-6px)}46%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-where-accepted .e10{animation-name:v07-s20-where-accepted-k10}@keyframes v07-s20-where-accepted-k11{0.0%{opacity:0;transform:translate(0px,-6px)}53.75%{opacity:0;transform:translate(0px,-6px)}55.75%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-where-accepted .e11{animation-name:v07-s20-where-accepted-k11}</style>
<rect class="bg" x="0" y="0" width="960" height="560"/>
<g><text class="cap" x="40" y="26">где условие не сработало и подделку приняли вместо настоящих данных</text></g>
<g class="a e1"><text class="cap" x="52" y="54">условие в опыте</text><text class="cap" x="470" y="54">сервер получил</text><text class="cap" x="690" y="54">клиент</text></g>
<g class="a e2"><rect class="bxb" x="40" y="64" width="880" height="44" rx="6"/><text class="mk" x="52" y="83">tcp_seq=−679</text><text class="sm" x="52" y="101">последний байт подделки на месте первого</text><text class="tk sm" x="470" y="92">250 B, из них 1 чужой</text><text class="sm" x="690" y="92">ответ есть, поток испорчен</text></g>
<g class="a e3"><rect class="bxr" x="40" y="114" width="880" height="44" rx="6"/><text class="mk" x="52" y="133">tcp_seq=−1 и +1</text><text class="sm" x="52" y="151">оставляют новые байты</text><text class="tk sm" x="470" y="142">679 B и 681 B</text><text class="sm" x="690" y="142">завис</text></g>
<g class="a e4"><rect class="bxr" x="40" y="164" width="880" height="44" rx="6"/><text class="mk" x="52" y="183">tcp_md5=0011</text><text class="sm" x="52" y="201">опция неверной длины</text><text class="tk sm" x="470" y="192">680 B</text><text class="sm" x="690" y="192">завис</text></g>
<g class="a e5"><rect class="bxr" x="40" y="214" width="880" height="44" rx="6"/><text class="mk" x="52" y="233">tcp_ack малого сдвига</text><text class="sm" x="52" y="251">сервер уже говорил, до −5000</text><text class="tk sm" x="470" y="242">680 B</text><text class="sm" x="690" y="242">завис</text></g>
<g class="a e6"><rect class="bxr" x="40" y="264" width="880" height="44" rx="6"/><text class="mk" x="52" y="283">tcp_flags_unset=psh</text><text class="sm" x="52" y="301">снят только PSH, ACK на месте</text><text class="tk sm" x="470" y="292">680 B</text><text class="sm" x="690" y="292">завис</text></g>
<g class="a e7"><rect class="bxr" x="40" y="314" width="880" height="44" rx="6"/><text class="mk" x="52" y="333">tcp_ts=−1</text><text class="sm" x="52" y="351">метка на единицу старее</text><text class="tk sm" x="470" y="342">680 B</text><text class="sm" x="690" y="342">завис</text></g>
<g class="a e8"><rect class="bxr" x="40" y="364" width="880" height="44" rx="6"/><text class="mk" x="52" y="383">tcp_ts=+600000</text><text class="sm" x="52" y="401">метка из будущего; PAWSEstab=7</text><text class="tk sm" x="470" y="392">680 B</text><text class="sm" x="690" y="392">завис</text></g>
<g class="a e9"><rect class="bxr" x="40" y="414" width="880" height="44" rx="6"/><text class="mk" x="52" y="433">tcp_ts=−600000</text><text class="sm" x="52" y="451">метки времени выключены на сервере</text><text class="tk sm" x="470" y="442">680 B</text><text class="sm" x="690" y="442">завис</text></g>
<g class="a e10"><rect class="bxr" x="40" y="464" width="880" height="44" rx="6"/><text class="mk" x="52" y="483">ip_autottl без ip_ttl</text><text class="sm" x="52" y="501">подбор отказал, срок остался 64</text><text class="tk sm" x="470" y="492">680 B</text><text class="sm" x="690" y="492">завис</text></g>
<g class="a e11"><rect class="bxa" x="40" y="514" width="880" height="36" rx="8"/><text class="sm tk" x="52" y="537">в большинстве случаев соединение виснет; всё измерено в нашем тесте, Linux 6.18</text></g>
</svg>
