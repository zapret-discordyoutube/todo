<svg xmlns="http://www.w3.org/2000/svg" class="v07-s20-where-accepted" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v07-s20-where-accepted-t v07-s20-where-accepted-d">
<title id="v07-s20-where-accepted-t">Где подделку принимают</title>
<desc id="v07-s20-where-accepted-d">Девять случаев из опытов, где условие подделки не сработало и подделка стала данными: номер, оставляющий хоть один новый байт, опция MD5 неверной длины, малый сдвиг подтверждения при сервере, который уже говорил, снятый только PSH, метка времени на единицу старее и метка из будущего, метки выключены на сервере и отказ автоподбора срока жизни без запасного числа, и почти везде сервер получил 680 байт подделки, а клиент завис.</desc>
<style>.v07-s20-where-accepted{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v07-s20-where-accepted{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
