.v07-s20-where-accepted .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v07-s20-where-accepted .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v07-s20-where-accepted .hf{fill:var(--fg2)}.v07-s20-where-accepted .ha{fill:var(--acc)}.v07-s20-where-accepted .hr{fill:var(--rej)}.v07-s20-where-accepted .hm{fill:var(--mute)}.v07-s20-where-accepted .hb{fill:var(--amb)}
.v07-s20-where-accepted .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v07-s20-where-accepted .a{animation-duration:40s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
