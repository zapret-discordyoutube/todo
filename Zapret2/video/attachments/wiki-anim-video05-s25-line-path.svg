<svg xmlns="http://www.w3.org/2000/svg" class="v05-s25-line-path" viewBox="0 0 960 706" width="960" height="706" role="img" aria-labelledby="v05-s25-line-path-t v05-s25-line-path-d">
<title id="v05-s25-line-path-t">Путь строки до провода</title>
<desc id="v05-s25-line-path-d">Путь одной строки multisplit с pos=midsld от записи до провода, шесть шагов с номерами строк в lua/zapret-antidpi.lua: ворота (строки 484-495: это TCP, есть данные, подходят направление и тип), метки в числа (строка 497 задаёт pos по умолчанию 2, строка 500 вызывает resolve_multi_pos на Си, строки 501-502 пишут журнал и вычёркивают единицу), цикл по частям (строки 504-507: каждая допустимая позиция даёт на одну часть больше), отправка (строка 522 и rawsend_payload_segmented в lua/zapret-lib.lua:1282-1290, затем rawsend_dissect_segmented в строках 1233-1279: заголовки оригинала, свой номер, нарезка по размеру сегмента), накладка (строки 508-520: узор только перед первой частью, номер меньше на seqovl) и ответ движку (строки 526-527: выбросить, а с nodrop пропустить); на примере из нашего теста midsld даёт 104, затем {105}, части 104 и 146, на проводе 1+104 и 105+146 и ответ DROP, а с накладкой в 5 байт первая часть уходит как -4+109.</desc>
