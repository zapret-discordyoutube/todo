<svg xmlns="http://www.w3.org/2000/svg" class="v06-s13-pattern-fill" viewBox="0 0 960 748" width="960" height="748" role="img" aria-labelledby="v06-s13-pattern-fill-t v06-s13-pattern-fill-d">
<title id="v06-s13-pattern-fill-t">Чем заполнена накладка</title>
<desc id="v06-s13-pattern-fill-d">Чем заполнена накладка: выдуманный штамп из пяти знаков 12345 повторяется и обрезается до восьми клеток, получается 12345123, так же работает помощник pattern из lua/zapret-lib.lua (строки 567-574); в multidisorder_send узор по умолчанию один нулевой байт (строка 569 в lua/zapret-antidpi.lua), при optional и отсутствии блоба берётся нулевой узор, иначе блоб (строка 574), а строка 577 ставит узор перед частью; в опыте с seqovl=host и seqovl_pattern из 14 байт www.decoy.test нужно заполнить 97 байт, 97 равно 6 по 14 плюс 13, голова пакета 77 77 77 2E 64 65 63 6F и дальше, то есть текст www.decoy.testwww., пакет 243@7, сервер подтверждает блоки с 8 по 250 и с 8 по 104, приложение получило 250 байт с равным хэшем, и приманка до приложения не дошла.</desc>
