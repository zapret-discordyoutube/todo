<g class="a e10"><path class="lb" d="M40 488 L802.0618556701031 488"/><path class="lb" d="M40 483 L40 493"/><path class="lb" d="M802.0618556701031 483 L802.0618556701031 493"/><text class="mk c" x="421" y="510">6 × 14 = 84</text><path class="la" d="M806.0618556701031 488 L920 488"/><text class="mk c" x="861" y="510">+ 13</text></g>
<g class="a e11"><text class="tk" x="40" y="538">97 = 6 × 14 + 13: шесть полных повторов и 13 знаков с начала седьмого</text></g>
<g class="a e12"><text class="cap" x="40" y="572">на проводе клиента</text></g>
