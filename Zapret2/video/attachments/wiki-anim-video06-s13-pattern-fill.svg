<g><text class="cap" x="40" y="26">чем заполнена накладка</text></g>
<g class="a e1"><rect class="bxb" x="40" y="40" width="880" height="84" rx="8"/><text class="tk" x="54" y="62">выдуманный пример</text><text class="sm" x="54" y="84">штамп из пяти знаков</text><text class="sm" x="54" y="104">заполнить 8 клеток</text><rect class="bxa" x="270" y="64" width="38" height="34" rx="0"/><text class="mk c" x="289" y="87">1</text><rect class="bxa" x="308" y="64" width="38" height="34" rx="0"/><text class="mk c" x="327" y="87">2</text><rect class="bxa" x="346" y="64" width="38" height="34" rx="0"/><text class="mk c" x="365" y="87">3</text><rect class="bxa" x="384" y="64" width="38" height="34" rx="0"/><text class="mk c" x="403" y="87">4</text><rect class="bxa" x="422" y="64" width="38" height="34" rx="0"/><text class="mk c" x="441" y="87">5</text><rect class="bxa" x="460" y="64" width="38" height="34" rx="0"/><text class="mk c" x="479" y="87">1</text><rect class="bxa" x="498" y="64" width="38" height="34" rx="0"/><text class="mk c" x="517" y="87">2</text><rect class="bxa" x="536" y="64" width="38" height="34" rx="0"/><text class="mk c" x="555" y="87">3</text><rect class="bxd" x="574" y="64" width="38" height="34" rx="0"/><text class="m mu c" x="593" y="87">4</text><rect class="bxd" x="612" y="64" width="38" height="34" rx="0"/><text class="m mu c" x="631" y="87">5</text><path class="lcut" d="M574 58L574 104"/><text class="ix c" x="422" y="116">штамп дважды</text><text class="ix c" x="612" y="116">обрезать</text><text class="m" x="670" y="80">pattern(штамп, 1, 8)</text><text class="mk" x="670" y="102">= 12345123</text></g>
<g class="a e2"><text class="tk" x="40" y="156">lua/zapret-antidpi.lua, multidisorder_send: откуда берутся байты накладки</text></g>
<g class="a e3"><rect class="bx" x="40" y="168" width="880" height="42" rx="4"/><text class="ix" x="52" y="186">569</text><text class="m" x="96" y="186">local pat="\x00"</text><text class="sm mu" x="96" y="204">по умолчанию узор один нулевой байт, накладка из нулей</text></g>
<g class="a e4"><rect class="bx" x="40" y="214" width="880" height="42" rx="4"/><text class="ix" x="52" y="232">571</text><text class="m" x="96" y="232">if desync.arg.optional and not blob_exist(desync, desync.arg.seqovl_pattern) then</text><text class="sm mu" x="96" y="250">optional и такого блоба нет: остаются нули, в журнал идёт строка</text></g>
<g class="a e5"><rect class="bx" x="40" y="260" width="880" height="42" rx="4"/><text class="ix" x="52" y="278">574</text><text class="m" x="96" y="278">pat = blob(desync,desync.arg.seqovl_pattern)</text><text class="sm mu" x="96" y="296">иначе узор берётся из блоба: имя или строка 0x… в шестнадцатеричной записи</text></g>
<g class="a e6"><rect class="bx" x="40" y="306" width="880" height="42" rx="4"/><text class="ix" x="52" y="324">577</text><text class="m" x="96" y="324">part = pattern(pat,1,ovl)..part</text><text class="sm mu" x="96" y="342">pattern размножает узор и обрезает до ovl байт; результат ставится перед частью</text></g>
<g class="a e7"><text class="sm mu" x="40" y="370">pattern: lua/zapret-lib.lua:567-574, в комментарии кода пример pat="12345" len=10 offset=4 даёт "4512345123"</text></g>
<g class="a e8"><path class="lm" d="M40 388 L920 388"/><text class="tk" x="40" y="410">seqovl=host, seqovl_pattern: 14 байт в записи 0x…, читаются как www.decoy.test</text><text class="sm" x="40" y="432">нужно заполнить 97 байт накладки узором в 14 байт</text></g>
