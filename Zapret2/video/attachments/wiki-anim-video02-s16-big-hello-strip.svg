<svg xmlns="http://www.w3.org/2000/svg" class="v02-s16-big-hello" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="v02-s16-big-hello-t v02-s16-big-hello-d">
<title id="v02-s16-big-hello-t">Большой ClientHello на 1484 байта</title>
<desc id="v02-s16-big-hello-d">Большой ClientHello в лаборатории, 1484 байта, в одном масштабе с коротким на 250 байт: заголовки те же (длина записи 1479, длина расширений 1396), но расширение key_share выросло с 38 до 1258 байт данных (две доли ключа: 1216 и 32 байта) и занимает байты 213..1474, а имя сайта осталось на тех же местах 97..111, потому что перед расширением имени всё то же.</desc>
