<rect class="bg" x="0" y="0" width="960" height="806"/>
<g class="a e1"><text class="cap" x="20" y="24">набор: пять правил в трёх цепочках</text></g>
<g class="a e2"><text class="sm mu" x="20" y="46">по docs/readme.md:82-92; лаборатория ставит те же правила (порт UDP записан без скобок)</text></g>
<g class="a e3"><text class="cap" x="20" y="76">цепочка</text><text class="cap" x="138" y="76">правило после «meta mark and 0x40000000 == 0»</text><text class="cap" x="716" y="76">кого ловит</text><text class="cap" x="900" y="76">стр.</text><path class="lm" d="M20 84L940 84"/></g>
<g class="a e4"><rect class="bxa" x="20" y="94" width="104" height="28" rx="14"/><text class="mk c" x="72" y="113">post</text><text class="m" x="138" y="113">tcp dport {80,443} ct original packets 1-12 queue num 200 bypass</text><text class="sm" x="716" y="113">исходящие TCP</text><text class="sm mu" x="900" y="113">83</text></g>
<g class="a e5"><rect class="bxo" x="20" y="132" width="104" height="28" rx="14"/><text class="mk c" x="72" y="151">pre</text><text class="m" x="138" y="151">tcp sport {80,443} ct reply packets 1-12 queue num 200 bypass</text><text class="sm" x="716" y="151">входящие TCP</text><text class="sm mu" x="900" y="151">88</text></g>
<g class="a e6"><rect class="bxa" x="20" y="170" width="104" height="28" rx="14"/><text class="mk c" x="72" y="189">post</text><text class="m" x="138" y="189">udp dport {443} ct original packets 1-12 queue num 200 bypass</text><text class="sm" x="716" y="189">исходящие UDP (QUIC)</text><text class="sm mu" x="900" y="189">84</text></g>
<g class="a e7"><rect class="bxo" x="20" y="208" width="104" height="28" rx="14"/><text class="mk c" x="72" y="227">pre</text><text class="m" x="138" y="227">udp sport {443} ct reply packets 1-12 queue num 200 bypass</text><text class="sm" x="716" y="227">входящие UDP</text><text class="sm mu" x="900" y="227">89</text></g>
<g class="a e8"><rect class="bxs" x="20" y="246" width="104" height="28" rx="14"/><text class="mk c" x="72" y="265">predefrag</text><text class="m" x="138" y="265">mark &amp; 0x40000000 != 0x00000000 notrack</text><text class="sm" x="716" y="265">собственные пакеты</text><text class="sm mu" x="900" y="265">92</text></g>
<g class="a e9"><text class="sm mu" x="20" y="298">во входящих: порт источника вместо назначения (ответы идут с порта сервера) и ct reply вместо ct original</text></g>
<g class="a e10"><text class="cap" x="20" y="332">где стоит каждая цепочка на пути пакета</text></g>
<g class="a e11"><rect class="bx" x="20" y="346" width="300" height="96" rx="10"/><rect class="bxo" x="32" y="358" width="104" height="26" rx="13"/><text class="mk c" x="84" y="377">pre</text><text class="mk" x="146" y="377">prerouting</text><text class="sm tk" x="34" y="408">приоритет −101</text><text class="sm" x="34" y="430">пакет только что пришёл снаружи</text></g>
<g class="a e12"><rect class="bx" x="330" y="346" width="300" height="96" rx="10"/><rect class="bxa" x="342" y="358" width="104" height="26" rx="13"/><text class="mk c" x="394" y="377">post</text><text class="mk" x="456" y="377">postrouting</text><text class="sm tk" x="344" y="408">приоритет 101</text><text class="sm" x="344" y="430">пакет уходит в интерфейс</text></g>
<g class="a e13"><rect class="bx" x="640" y="346" width="300" height="96" rx="10"/><rect class="bxs" x="652" y="358" width="104" height="26" rx="13"/><text class="mk c" x="704" y="377">predefrag</text><text class="mk" x="766" y="377">output</text><text class="sm tk" x="654" y="408">приоритет −401</text><text class="sm" x="654" y="430">пакет создан на этом компьютере</text></g>
<g class="a e14"><text class="sm mu" x="20" y="464">меньше приоритет, раньше срабатывает цепочка; predefrag читается как «до сборки фрагментов» (по названию)</text></g>
<g class="a e15"><rect class="bxa" x="20" y="484" width="450" height="76" rx="8"/><text class="sm tk" x="34" y="508">защита 1: проверка метки в правилах</text><text class="sm" x="34" y="530">mark and 0x40000000 == 0: пакет с нашим</text><text class="sm" x="34" y="548">битом правило пропускает мимо окошка</text></g>
<g class="a e16"><rect class="bxa" x="490" y="484" width="450" height="76" rx="8"/><text class="sm tk" x="504" y="508">защита 2: notrack в predefrag</text><text class="sm" x="504" y="530">такой пакет, по общим сведениям, не попадёт</text><text class="sm" x="504" y="548">в таблицу отслеживания соединений ядра</text></g>
<g class="a e17"><text class="sm tk" x="20" y="584">в нашем тесте на UDP каждой защиты хватало и по отдельности;</text><text class="sm tk" x="20" y="604">какая действовала в основных опытах, по журналам сказать нельзя</text></g>
<g class="a e18"><rect class="bxb" x="20" y="624" width="920" height="128" rx="8"/><text class="sm tk" x="34" y="648">последняя строка набора: nf_conntrack_tcp_be_liberal = 1 (docs/readme.md:86)</text><text class="sm" x="34" y="670">автор скриптов пишет (common/linux_fw.sh:21-25): DPI присылает RST,ACK</text><text class="sm" x="34" y="690">с неправильным номером подтверждения; ядро иногда считает такой пакет недопустимым,</text><text class="sm" x="34" y="710">а либеральная проверка нужна, чтобы такие сбросы доходили до программы.</text><text class="sm tk" x="34" y="736">это утверждение автора о настоящем оборудовании: мы его не проверяли и как факт не повторяем</text></g>
<g class="a e19"><text class="sm mu" x="20" y="778">проверь себя: правил пять, цепочек три; notrack стоит в цепочке predefrag</text></g>
</svg>
