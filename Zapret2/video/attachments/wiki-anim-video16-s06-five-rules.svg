<svg xmlns="http://www.w3.org/2000/svg" class="v16-s06-five-rules" viewBox="0 0 960 806" width="960" height="806" role="img" aria-labelledby="v16-s06-five-rules-t v16-s06-five-rules-d">
<title id="v16-s06-five-rules-t">Пять правил в трёх цепочках</title>
<desc id="v16-s06-five-rules-d">Набор из пяти правил в трёх цепочках (по docs/readme.md:82-92): в post (postrouting, приоритет 101) правила на исходящие TCP с портом назначения 80 и 443 и UDP с портом 443; в pre (prerouting, приоритет -101) такие же на входящие с портом источника; в predefrag (output, приоритет -401) одно правило: пакет с битом метки 0x40000000 не отслеживать (notrack), это вторая защита от петли; последняя строка набора включает nf_conntrack_tcp_be_liberal, по объяснению автора скриптов ради входящих сбросов RST,ACK с неправильным номером подтверждения (common/linux_fw.sh:21-25), мы это не проверяли.</desc>
<style>.v16-s06-five-rules{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
