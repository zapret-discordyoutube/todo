<svg xmlns="http://www.w3.org/2000/svg" class="v00-s05-whitelist-limits" viewBox="0 0 960 444" width="960" height="444" role="img" aria-labelledby="v00-s05-whitelist-limits-t v00-s05-whitelist-limits-d">
<title id="v00-s05-whitelist-limits-t">Белые списки и пределы проверки</title>
<desc id="v00-s05-whitelist-limits-d">Белый список по общим сведениям это когда закрыто всё, кроме разрешённого, готовых рецептов нет и завтра будет что-то другое, а список причин объясняет, почему сайт может не открыться, хотя проверка показала успех: проверка смотрит один домен по одному протоколу, бывает подмена DNS, IPv6 и QUIC, ECH, другая версия TLS, диапазоны адресов и нестабильность; результат проверки не гарантия.</desc>
