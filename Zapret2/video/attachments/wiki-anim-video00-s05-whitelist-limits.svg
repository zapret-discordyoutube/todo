<g class="a e1"><rect class="bx" x="40" y="40" width="400" height="150" rx="10"/><rect class="bxb" x="54" y="52" width="220.5" height="24" rx="5"/><text class="cap amb" x="64" y="68.5">ПО ОБЩИМ СВЕДЕНИЯМ</text><text class="tk sm" x="54" y="98">белый список: закрыто всё,</text><text class="tk sm" x="54" y="118">кроме разрешённого</text><rect class="bx" x="54" y="134" width="34" height="40" rx="4"/><path class="lm" d="M64 146L78 162M78 146L64 162"/><rect class="bx" x="100" y="134" width="34" height="40" rx="4"/><path class="lm" d="M110 146L124 162M124 146L110 162"/><rect class="bxo" x="146" y="134" width="34" height="40" rx="4"/><path class="lo" d="M155 155L161 161L172 146"/><rect class="bx" x="192" y="134" width="34" height="40" rx="4"/><path class="lm" d="M202 146L216 162M216 146L202 162"/><rect class="bx" x="238" y="134" width="34" height="40" rx="4"/><path class="lm" d="M248 146L262 162M262 146L248 162"/><rect class="bx" x="284" y="134" width="34" height="40" rx="4"/><path class="lm" d="M294 146L308 162M308 146L294 162"/><rect class="bxo" x="330" y="134" width="34" height="40" rx="4"/><path class="lo" d="M339 155L345 161L356 146"/><rect class="bx" x="376" y="134" width="34" height="40" rx="4"/><path class="lm" d="M386 146L400 162M400 146L386 162"/></g>
<g class="a e2"><rect class="bx" x="460" y="40" width="460" height="150" rx="10"/><rect class="bxa" x="474" y="52" width="150" height="24" rx="5"/><text class="cap acc" x="484" y="68.5">ДОКУМЕНТАЦИЯ</text><text class="sm tk" x="474" y="98">«Он не включает в себя готовых</text><text class="sm tk" x="474" y="120">рецептов ... завтра будет еще</text><text class="sm tk" x="474" y="142">что-то другое»</text><text class="sm mu" x="474" y="172">про blockcheck2 и про сам zapret</text></g>
<g class="a e3"><text class="cap" x="40" y="224">список из документации, цифры это номера пунктов: почему сайт не открылся</text><rect class="bxa" x="781.9" y="206" width="150" height="24" rx="5"/><text class="cap acc" x="791.9" y="222.5">ДОКУМЕНТАЦИЯ</text></g>
<g class="a e4"><rect class="bxa" x="40" y="238" width="285" height="56" rx="8"/><text class="tk sm" x="52" y="262">проверка узкая</text><text class="sm" x="52" y="282">один домен, один протокол</text></g>
<g class="a e5"><rect class="bxa" x="337.5" y="238" width="285" height="56" rx="8"/><text class="tk sm" x="349.5" y="262">DNS</text><text class="sm" x="349.5" y="282">подмена адреса</text><text class="ix r" x="610.5" y="262">1</text></g>
<g class="a e6"><rect class="bxa" x="635" y="238" width="285" height="56" rx="8"/><text class="tk sm" x="647" y="262">IPv6 и QUIC</text><text class="sm" x="647" y="282">браузер скачет между ними</text><text class="ix r" x="908" y="262">3</text></g>
<g class="a e7"><rect class="bx" x="40" y="304" width="285" height="56" rx="8"/><text class="tk sm" x="52" y="328">ECH</text><text class="sm" x="52" y="348">имя спрятано шифрованием</text><text class="ix r" x="313" y="328">6</text></g>
<g class="a e8"><rect class="bx" x="337.5" y="304" width="285" height="56" rx="8"/><text class="tk sm" x="349.5" y="328">версия TLS</text><text class="sm" x="349.5" y="348">проверка 1.2, браузер чаще 1.3</text><text class="ix r" x="610.5" y="328">7</text></g>
<g class="a e9"><rect class="bx" x="635" y="304" width="285" height="56" rx="8"/><text class="tk sm" x="647" y="328">диапазоны адресов</text><text class="sm" x="647" y="348">особые правила на диапазонах</text><text class="ix r" x="908" y="328">9</text></g>
<g class="a e10"><rect class="bx" x="40" y="370" width="285" height="56" rx="8"/><text class="tk sm" x="52" y="394">нестабильность</text><text class="sm" x="52" y="414">стратегия работает через раз</text><text class="ix r" x="313" y="394">12</text></g>
<g class="a e11"><rect class="bxs" x="337.5" y="370" width="582.5" height="56" rx="8"/><text class="sm c" x="628.8" y="394">бывает, что проверка показала OK, а сайт не открылся:</text><text class="tk sm c" x="628.8" y="415">результат проверки ещё не гарантия</text></g>
</svg>
