.v02-s20-name-walk .hf{fill:var(--fg2)}.v02-s20-name-walk .ha{fill:var(--acc)}.v02-s20-name-walk .hr{fill:var(--rej)}.v02-s20-name-walk .hm{fill:var(--mute)}.v02-s20-name-walk .ho{fill:var(--ok)}.v02-s20-name-walk .hbm{fill:var(--amb)}
