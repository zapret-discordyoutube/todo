<svg xmlns="http://www.w3.org/2000/svg" class="v02-s20-name-walk" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="v02-s20-name-walk-t v02-s20-name-walk-d">
<title id="v02-s20-name-walk-t">Как zapret2 находит имя и метку разреза</title>
<desc id="v02-s20-name-walk-d">Как zapret2 находит имя сайта и откуда берёт позицию разреза: функции IsTLSHello, TLSFindExtLenOffsetInHandshake, TLSFindExtInHandshake, TLSAdvanceToHostInSNI и TLSExtractHostFromExt (nfq2/protocol.c:510, 524, 575, 646, 658) проходят по длинам до расширения типа 0 и копируют 15 байт имени в ps.host = www.example.com (nfq2/desync.c:1642); метки позиций считаются по найденному имени: host = 97, sld = 101 (слово example, длина 7), midsld = 101 + 7 / 2 = 104, и разрез по этой метке даёт части 104 и 146 байт.</desc>
<style>.v02-s20-name-walk{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
