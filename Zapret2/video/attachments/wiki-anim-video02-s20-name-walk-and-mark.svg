ity:0}}.v02-s20-name-walk .e11{animation-name:v02-s20-name-walk-k11}@keyframes v02-s20-name-walk-k12{0%{opacity:0}53%{opacity:0}54.125%{opacity:1}97.25%{opacity:1}98.75%{opacity:0}100%{opacity:0}}.v02-s20-name-walk .e12{animation-name:v02-s20-name-walk-k12}@keyframes v02-s20-name-walk-k13{0%{opacity:0}56.5%{opacity:0}57.625%{opacity:1}97.25%{opacity:1}98.75%{opacity:0}100%{opacity:0}}.v02-s20-name-walk .e13{animation-name:v02-s20-name-walk-k13}@keyframes v02-s20-name-walk-k14{0%{opacity:0}60%{opacity:0}61.125%{opacity:1}97.25%{opacity:1}98.75%{opacity:0}100%{opacity:0}}.v02-s20-name-walk .e14{animation-name:v02-s20-name-walk-k14}@keyframes v02-s20-name-walk-k15{0%{opacity:0}66%{opacity:0}67.125%{opacity:1}97.25%{opacity:1}98.75%{opacity:0}100%{opacity:0}}.v02-s20-name-walk .e15{animation-name:v02-s20-name-walk-k15}@keyframes v02-s20-name-walk-k16{0%{opacity:0}66%{opacity:0}67.125%{opacity:1}97.25%{opacity:1}98.75%{opacity:0}100%{opacity:0}}.v02-s20-name-walk .e16{animation-name:v02-s20-name-walk-k16}@keyframes v02-s20-name-walk-k17{0%{opacity:0}75%{opacity:0}76.125%{opacity:1}97.25%{opacity:1}98.75%{opacity:0}100%{opacity:0}}.v02-s20-name-walk .e17{animation-name:v02-s20-name-walk-k17}@keyframes v02-s20-name-walk-k18{0%{opacity:0}82.5%{opacity:0}83.625%{opacity:1}97.25%{opacity:1}98.75%{opacity:0}100%{opacity:0}}.v02-s20-name-walk .e18{animation-name:v02-s20-name-walk-k18}</style>
<rect class="bg" x="0" y="0" width="960" height="548"/>
<g class="a e1"><text class="cap" x="10" y="22">поиск имени: шаги по длинам в nfq2/protocol.c</text></g>
<g class="a e2"><rect class="bx" x="10" y="34" width="940" height="44" rx="6"/><text class="mk" x="22" y="53">IsTLSHello</text><text class="mt mu" x="22" y="71">nfq2/protocol.c:510</text><text class="sm" x="310" y="53">первый байт 16, второй 03,</text><text class="sm" x="310" y="71">третий не больше 03</text><path class="lm" d="M480 78L480.0 78.0"/><polygon class="hm" points="480,88 475.0,78.0 485.0,78.0"/><text class="mk acc" x="676" y="61">16 03 01: подходит</text></g>
<g class="a e3"><rect class="bx" x="10" y="84" width="940" height="44" rx="6"/><text class="mk" x="22" y="103">TLSFindExtLenOffsetInHandshake</text><text class="mt mu" x="22" y="121">nfq2/protocol.c:524</text><text class="sm" x="310" y="103">прыгает через сессию, шифры</text><text class="sm" x="310" y="121">и сжатие к длине расширений</text><path class="lm" d="M480 128L480.0 128.0"/><polygon class="hm" points="480,138 475.0,128.0 485.0,128.0"/><text class="mk acc" x="676" y="111">32, 6, 1: длина на смещении 86</text></g>
<g class="a e4"><rect class="bx" x="10" y="134" width="940" height="44" rx="6"/><text class="mk" x="22" y="153">TLSFindExtInHandshake</text><text class="mt mu" x="22" y="171">nfq2/protocol.c:575</text><text class="sm" x="310" y="153">идёт по расширениям: тип, длина,</text><text class="sm" x="310" y="171">перепрыгнуть; ищет тип 0</text><path class="lm" d="M480 178L480.0 178.0"/><polygon class="hm" points="480,188 475.0,178.0 485.0,178.0"/><text class="mk acc" x="676" y="161">расширение 88..111</text></g>
<g class="a e5"><rect class="bx" x="10" y="184" width="940" height="44" rx="6"/><text class="mk" x="22" y="203">TLSAdvanceToHostInSNI</text><text class="mt mu" x="22" y="221">nfq2/protocol.c:646</text><text class="sm" x="310" y="203">читает вложенные длины и выходит</text><text class="sm" x="310" y="221">на первый байт имени</text><path class="lm" d="M480 228L480.0 228.0"/><polygon class="hm" points="480,238 475.0,228.0 485.0,228.0"/><text class="mk acc" x="676" y="211">длины 20, 18, 15; имя с 97</text></g>
<g class="a e6"><rect class="bx" x="10" y="234" width="940" height="44" rx="6"/><text class="mk" x="22" y="253">TLSExtractHostFromExt</text><text class="mt mu" x="22" y="271">nfq2/protocol.c:658</text><text class="sm" x="310" y="253">копирует байты имени</text><text class="sm" x="310" y="271">в строку</text><text class="mk acc" x="676" y="261">15 байт</text></g>
<g class="a e7"><rect class="bxo" x="10" y="288" width="940" height="52" rx="8"/><text x="22" y="310"><tspan class="mk">ps.host</tspan><tspan> = </tspan><tspan class="hbo">www.example.com</tspan><tspan class="sm mu">   (nfq2/desync.c:1642)</tspan></text><text x="22" y="331"><tspan class="sm tk">HTTP: </tspan><tspan class="mk">HttpExtractHost</tspan><tspan class="sm"> (nfq2/protocol.c:361) ищет слово Host</tspan></text></g>
<g class="a e8"><text class="tk" x="10" y="372">откуда программа знает, где середина слова example</text></g>
<g class="a e9"><text class="sm mu" x="30" y="504">байты имени 97..111 (слово example: 101..107)</text><rect class="bx" x="30" y="432" width="35" height="28" rx="2"/><text class="hx c" x="47.5" y="452">w</text><text class="mt mu c" x="47.5" y="480">97</text><rect class="bx" x="66" y="432" width="35" height="28" rx="2"/><text class="hx c" x="83.5" y="452">w</text><text class="mt mu c" x="83.5" y="480">98</text><rect class="bx" x="102" y="432" width="35" height="28" rx="2"/><text class="hx c" x="119.5" y="452">w</text><text class="mt mu c" x="119.5" y="480">99</text><rect class="bx" x="138" y="432" width="35" height="28" rx="2"/><text class="hx c" x="155.5" y="452">.</text><text class="mt mu c" x="155.5" y="480">100</text><rect class="bxa" x="174" y="432" width="35" height="28" rx="2"/><text class="hx c" x="191.5" y="452">e</text><text class="mt mu c" x="191.5" y="480">101</text><rect class="bxa" x="210" y="432" width="35" height="28" rx="2"/><text class="hx c" x="227.5" y="452">x</text><text class="mt mu c" x="227.5" y="480">102</text><rect class="bxa" x="246" y="432" width="35" height="28" rx="2"/><text class="hx c" x="263.5" y="452">a</text><text class="mt mu c" x="263.5" y="480">103</text><rect class="bxa" x="282" y="432" width="35" height="28" rx="2"/><text class="hx c" x="299.5" y="452">m</text><text class="mt mu c" x="299.5" y="480">104</text><rect class="bxa" x="318" y="432" width="35" height="28" rx="2"/><text class="hx c" x="335.5" y="452">p</text><text class="mt mu c" x="335.5" y="480">105</text><rect class="bxa" x="354" y="432" width="35" height="28" rx="2"/><text class="hx c" x="371.5" y="452">l</text><text class="mt mu c" x="371.5" y="480">106</text><rect class="bxa" x="390" y="432" width="35" height="28" rx="2"/><text class="hx c" x="407.5" y="452">e</text><text class="mt mu c" x="407.5" y="480">107</text><rect class="bx" x="426" y="432" width="35" height="28" rx="2"/><text class="hx c" x="443.5" y="452">.</text><text class="mt mu c" x="443.5" y="480">108</text><rect class="bx" x="462" y="432" width="35" height="28" rx="2"/><text class="hx c" x="479.5" y="452">c</text><text class="mt mu c" x="479.5" y="480">109</text><rect class="bx" x="498" y="432" width="35" height="28" rx="2"/><text class="hx c" x="515.5" y="452">o</text><text class="mt mu c" x="515.5" y="480">110</text><rect class="bx" x="534" y="432" width="35" height="28" rx="2"/><text class="hx c" x="551.5" y="452">m</text><text class="mt mu c" x="551.5" y="480">111</text></g>
<g class="a e10"><path class="lm" d="M29.5 428L29.5 414"/><text class="mt c" x="29.5" y="408">host 97</text></g>
<g class="a e11"><path class="lm" d="M173.5 428L173.5 414"/><text class="mt c" x="173.5" y="408">sld 101</text></g>
<g class="a e12"><path class="lb" d="M281.5 428L281.5 414"/><text class="mt c hbb" x="281.5" y="408">midsld 104</text></g>
<g class="a e13"><path class="lm" d="M425.5 428L425.5 414"/><text class="mt c" x="425.5" y="408">endsld 108</text></g>
<g class="a e14"><path class="lm" d="M569.5 428L569.5 414"/><text class="mt c" x="569.5" y="408">endhost 112</text></g>
<g class="a e15"><path class="lr" d="M281.5 428L281.5 466"/></g>
<g class="a e16"><text class="sm" x="660" y="408">sld = 101, длина 7</text><text class="mk" x="660" y="434">midsld = 101 + 7 / 2</text><text class="mk acc" x="660" y="456">= 101 + 3 = 104</text></g>
<g class="a e17"><text class="sm" x="660" y="486"><tspan class="tk">части: </tspan><tspan class="hb">104</tspan><tspan> + </tspan><tspan class="hbb">146</tspan><tspan> = 250</tspan></text><text class="mt mu" x="660" y="508">protocol.c:198, :691; FindNLD :16</text></g>
<g class="a e18"><text class="sm mu" x="10" y="536">метки позиций подробно разберём в десятом выпуске</text></g>
</svg>
