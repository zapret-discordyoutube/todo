<svg xmlns="http://www.w3.org/2000/svg" class="v06-s24-drop-first-run" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="v06-s24-drop-first-run-t v06-s24-drop-first-run-d">
<title id="v06-s24-drop-first-run-t">drop и первый запуск tcpseg</title>
<desc id="v06-s24-drop-first-run-d">Функция drop и первый запуск tcpseg с drop: код drop из файла zapret-antidpi.lua (строки 79-85) проверяет направление и тип данных, умолчания у неё другие, чем у стратегий (направление любое и данные любые), и возвращает вердикт «выбросить»; когда вызовы идут подряд, движок сливает их ответы и «выбросить» сильнее «пропустить», поэтому у tcpseg с drop и при обратном порядке вызовов итог один; на проводе в нашем тесте сначала 105@0, оригинал 250@0 на провод не выходит, потом приходит ещё 145@105, которую отправила не наша функция, а ядро клиента, это обычная повторная отправка TCP, и в журнале этот пакет проходит как пропущенный без изменений.</desc>
