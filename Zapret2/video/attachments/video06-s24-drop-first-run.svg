<rect class="bg" x="0" y="0" width="960" height="720"/>
<g><text class="cap" x="40" y="24">drop: заменить оригинал, а не добавлять к нему</text></g>
<g class="a e1"><text class="sm tk" x="40" y="54">функция drop, «выбросить»</text><text class="ix mu r" x="920" y="54">lua/zapret-antidpi.lua</text></g>
<g class="a e2"><rect class="bx" x="40" y="64" width="660" height="126" rx="6"/><path class="lm" d="M86 70L86 184"/><text class="ix mu r" x="78" y="89">79</text><text class="ix fg" x="96" y="89">function drop(ctx, desync)</text><text class="ix mu r" x="78" y="117">80</text><text class="ix fg" x="96" y="117">  direction_cutoff_opposite(ctx, desync, &quot;any&quot;)</text><text class="ix mu r" x="78" y="145">81</text><text class="ix fg" x="96" y="145">  if direction_check(desync, &quot;any&quot;) and payload_check(desync,&quot;all&quot;) then</text><text class="ix mu r" x="78" y="173">83</text><text class="ix fg" x="96" y="173">    return VERDICT_DROP</text></g>
<g class="a e3 tr"><rect class="fa" x="43" y="99" width="654" height="28" rx="3"/><rect class="fa" x="43" y="127" width="654" height="28" rx="3"/></g>
<g class="a e4"><text class="sm" x="716" y="118">проверяет направление</text><text class="sm" x="716" y="146">и тип данных</text></g>
<g class="a e5"><rect class="bxr" x="716" y="70" width="204" height="26" rx="6"/><text class="sm tk c rej" x="818" y="88">умолчания другие</text></g>
<g class="a e6 tr"><rect class="fa" x="43" y="155" width="654" height="28" rx="3"/></g>
<g class="a e7"><text class="sm tk" x="716" y="174">вердикт «выбросить»</text></g>
<g class="a e8"><text class="sm" x="40" y="212">у стратегий направление только исходящее и данные только известные; у drop любые</text></g>
<g class="a e9"><text class="sm" x="40" y="234">но опция payload перед ней в командной строке всё равно ограничивает, что до неё дойдёт</text></g>
<g class="a e10"><path class="lm" d="M40 256L920 256"/><text class="cap" x="40" y="276">вызовы идут друг за другом: движок сливает ответы</text></g>
<g class="a e11"><rect class="bx" x="40" y="288" width="200" height="36" rx="6"/><text class="sm" x="52" y="311">tcpseg_1_2: пропустить</text><rect class="bx" x="40" y="332" width="200" height="36" rx="6"/><text class="sm tk" x="52" y="355">drop_1_3: выбросить</text></g>
<g class="a e12"><path class="lf" d="M246 306L320.3 325.5"/><polygon class="hf" points="330,328 319.1,330.3 321.6,320.6"/><path class="lf" d="M246 350L320.2 334.1"/><polygon class="hf" points="330,332 321.3,339.0 319.2,329.2"/><rect class="bxn" x="334" y="306" width="150" height="46" rx="6"/><text class="sm tk c" x="409" y="334">слияние</text></g>
<g class="a e13"><path class="lf" d="M488 329L530.0 329.0"/><polygon class="hf" points="540,329 530.0,334.0 530.0,324.0"/><rect class="bxr" x="544" y="306" width="150" height="46" rx="6"/><text class="sm tk c rej" x="619" y="334">выбросить</text></g>
<g class="a e14"><text class="sm tk" x="716" y="324">DROP сильнее</text><text class="sm" x="716" y="344">остальных ответов</text></g>
<g class="a e15"><text class="sm" x="40" y="394">«выбросить» сильнее «изменить», «изменить» сильнее «пропустить»</text><text class="sm" x="40" y="414">движок не останавливается после «выбросить»: tcpseg выполняется всё равно</text><text class="sm" x="40" y="434">при обратном порядке вызовов провод в нашем тесте тот же</text></g>
<g class="a e16"><path class="lm" d="M40 454L920 454"/><text class="cap" x="40" y="474">первый запуск: что на проводе</text><text class="m fg r" x="920" y="474">tcpseg:pos=0,midsld + drop</text></g>
<g class="a e17"><circle class="bxa" cx="54" cy="499" r="13"/><text class="tk c ns" x="54" y="504">1</text><text class="mk" x="76" y="504">105@0</text><rect class="bx" x="330" y="488" width="590" height="22" rx="0"/><rect class="bxa" x="330" y="488" width="247.8" height="22" rx="0"/><text class="sm tk" x="585.8" y="504">отправила tcpseg</text></g>
<g class="a e18"><circle class="bxa" cx="54" cy="537" r="13"/><text class="tk c ns" x="54" y="542">2</text><text class="mk" x="76" y="542">оригинал</text><rect class="bx" x="330" y="526" width="590" height="22" rx="0"/><rect class="bxd" x="330" y="526" width="590" height="22" rx="0"/><text class="sm c rej" x="625" y="542">выброшен: на проводе нет</text></g>
<g class="a e19"><circle class="bxa" cx="54" cy="575" r="13"/><text class="tk c ns" x="54" y="580">3</text><text class="mk" x="76" y="580">145@105</text><rect class="bx" x="330" y="564" width="590" height="22" rx="0"/><rect class="bxb" x="577.8" y="564" width="342.2" height="22" rx="0"/><text class="sm tk r" x="912" y="580">не наша функция</text></g>
<g class="a e20"><rect class="bx" x="330" y="592" width="590" height="0" rx="0"/><text class="sm" x="40" y="614">откуда третий: ядро клиента отправило его само, это повторная отправка TCP</text><text class="sm" x="40" y="634">в журнале он проходит как чужой: packet: id=10 pass unmodified</text></g>
<g class="a e21"><text class="sm mu" x="40" y="662">по общим сведениям, ядро считает неподтверждённое потерянным;</text><text class="sm mu" x="40" y="682">что запустило отправку именно сейчас, мы не выясняли</text></g>
</svg>
