<svg xmlns="http://www.w3.org/2000/svg" class="v16-s05-mark-bit30" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="v16-s05-mark-bit30-t v16-s05-mark-bit30-d">
<title id="v16-s05-mark-bit30-t">Метка пакета и бит 30</title>
<desc id="v16-s05-mark-bit30-d">Метка пакета и трафарет: число 0x40000000 это 8 шестнадцатеричных цифр по 4 бита, 32 бита; старшая цифра 4 это 0100, единица стоит на месте 30, если считать справа налево с нуля; «mark and 0x40000000» оставляет только бит 30, и правило подходит, если результат равен нулю: метка 0x00000000 даёт 0 (идём дальше), метка 0x40000000 даёт 0x40000000 (не подходит, это пакет самой программы), метка 0x00000001 даёт 0 (идём дальше).</desc>
