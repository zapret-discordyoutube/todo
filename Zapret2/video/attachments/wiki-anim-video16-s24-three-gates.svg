<svg xmlns="http://www.w3.org/2000/svg" class="v16-s24-three-gates" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="v16-s24-three-gates-t v16-s24-three-gates-d">
<title id="v16-s24-three-gates-t">Три преграды на пути помеченного пакета</title>
<desc id="v16-s24-three-gates-d">Три преграды на пути помеченного пакета (метка 0x40000000), рядом путь обычного пакета. Преграда 1, правило ядра (docs/readme.md:83): условие meta mark and 0x40000000 == 0 стоит в начале каждого правила очереди, в нашей лаборатории таких правил четыре (TCP и UDP, по одному на каждое направление); помеченный пакет в очередь не идёт и даже не доезжает до программы, это самая дешёвая защита. Преграда 2, цепочка predefrag на точке output с приоритетом −401 (docs/readme.md:91-92): правило «mark &amp; 0x40000000 != 0x00000000 notrack» отключает для таких пакетов отслеживание соединений в ядре (по общим сведениям, они не попадают в таблицу conntrack); документация объясняет это заботой о NAT: пакеты nfqws2 не должны проходить проверки NAT (docs/manual.en.md:398-399); наш вывод, не слова документации: пакет без записи не проходит условие про счётчик пакетов соединения, и правило очереди с ним не совпадёт. Преграда 3, проходная в самой программе: processPacketData (nfq2/nfqws.c:154-164) пропускает помеченный пакет без обработки. Обычный пакет проходит условие первого правила и входит в очередь. Слово conntrack относится только к ядру: память программы о соединениях это другое.</desc>
