<g><text class="cap" x="10" y="24">три преграды для пакета с битом программы (метка 0x40000000)</text></g>
<g class="a e1"><rect class="bxa" x="10" y="38" width="270" height="62" rx="8"/><circle class="pl" cx="34" cy="69" r="11"/><text class="sm tk c ns" x="34" y="74">1</text><text class="smk ns" x="56" y="62">правило окошка</text><text class="sm ns" x="56" y="84">метка проверяется первой</text></g>
<g class="a e2"><rect class="bxb" x="296" y="38" width="338" height="62" rx="8"/><circle class="pl" cx="320" cy="69" r="11"/><text class="sm tk c ns" x="320" y="74">2</text><text class="smk ns" x="342" y="62">цепочка predefrag</text><text class="sm ns" x="342" y="84">notrack для помеченных</text></g>
<g class="a e3"><rect class="bxo" x="650" y="38" width="300" height="62" rx="8"/><circle class="pl" cx="674" cy="69" r="11"/><text class="sm tk c ns" x="674" y="74">3</text><text class="smk ns" x="696" y="62">проходная в программе</text><text class="sm ns" x="696" y="84">processPacketData</text></g>
<g class="a e4"><rect class="bx" x="10" y="114" width="270" height="214" rx="8"/><text class="ix ns" x="22" y="136">docs/readme.md:83</text><text class="cdh ns" x="22" y="160">meta mark and 0x40000000 == 0</text><text class="sm ns" x="22" y="184">в начале каждого правила</text><text class="sm ns" x="22" y="206">очереди; в лаборатории их</text><text class="sm ns" x="22" y="228">четыре: TCP и UDP, по одному</text><text class="sm ns" x="22" y="250">на направление</text><text class="sm ok ns" x="22" y="272">дешёвая защита: пакет не</text><text class="sm ok ns" x="22" y="294">доезжает до программы</text></g>
<g class="a e5"><rect class="bx" x="296" y="114" width="338" height="214" rx="8"/><text class="ix ns" x="308" y="136">docs/readme.md:91-92</text><text class="cdh ns" x="308" y="160">mark &amp; 0x40000000 != 0x00000000 notrack</text><text class="sm ns" x="308" y="184">notrack: пакет не попадает в</text><text class="sm ns" x="308" y="206">conntrack ядра (общие сведения)</text><text class="sm mu ns" x="308" y="228">документация (manual.en.md:398):</text><text class="sm mu ns" x="308" y="250">пакеты не должны проходить NAT</text><text class="sm ns" x="308" y="272">наш вывод: без записи условие</text><text class="sm ns" x="308" y="294">про счётчик пакетов не пройдёт</text></g>
<g class="a e6"><rect class="bx" x="650" y="114" width="300" height="214" rx="8"/><text class="ix ns" x="662" y="136">nfq2/nfqws.c:154-164</text><text class="cdh ns" x="662" y="160">if (*mark &amp; params.desync_fwmark)</text><text class="sm ns" x="662" y="184">первые строки processPacketData,</text><text class="sm ns" x="662" y="206">через неё идёт каждый пакет</text><text class="sm ns" x="662" y="228">из очереди; общий бит с меткой</text><text class="sm ns" x="662" y="250">программы: пишем в журнал</text><text class="sm ok ns" x="662" y="272">«ignoring generated packet»</text><text class="sm ok ns" x="662" y="294">и возвращаем PASS</text></g>
<g class="a e7"><text class="cap" x="10" y="356">путь пакета</text></g>
<g class="a e8"><text class="sm" x="10" y="380">обычный пакет, метка 0x00000000</text></g>
<g class="a e9"><text class="sm" x="10" y="450">помеченный пакет, метка 0x40000000</text></g>
