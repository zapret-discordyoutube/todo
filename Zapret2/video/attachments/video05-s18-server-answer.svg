<rect class="bg" x="0" y="0" width="960" height="700"/>
<g><text class="cap" x="40" y="24">что сервер сделал с подложенными байтами</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="880" height="74" rx="6"/><text class="sm tk" x="52" y="56">выдуманный пример: секретарь отвечает запиской из двух строк</text><text class="sm" x="52" y="80">«принято до номера 104 включительно, жду 105»</text><text class="sm" x="52" y="100">«листы −4…0 пришли лишними, мне не нужны»</text></g>
<g class="a e2"><text class="cap" x="40" y="134">настоящий ответ в нашем тесте</text></g>
<g class="a e3"><rect class="bxb" x="44" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="75" y="236">-4</text><rect class="bxb" x="106" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="137" y="236">-3</text><rect class="bxb" x="168" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="199" y="236">-2</text><rect class="bxb" x="230" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="261" y="236">-1</text><rect class="bxb" x="292" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="323" y="236">0</text><rect class="bxa" x="354" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="385" y="236">1</text><rect class="bxa" x="416" y="214" width="62" height="34" rx="0"/><text class="mk c" x="447" y="236">…</text><rect class="bxa" x="478" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="509" y="236">104</text><rect class="bx" x="540" y="214" width="62" height="34" rx="0"/><text class="ix c fg tk" x="571" y="236">105</text></g>
<g class="a e4"><text class="sm" x="44" y="268">пакет 1 клиента: подкладка −4…0, настоящие байты 1…104</text></g>
<g class="a e5"><rect class="bxo" x="40" y="148" width="270" height="50" rx="6"/><text class="sm" x="52" y="169">сервер ждёт номер</text><text class="mk" x="52" y="190">105</text><text class="sm mu" x="100" y="190">без накладки тоже 105</text></g>
<g class="a e6"><rect class="bxb" x="330" y="148" width="300" height="50" rx="6"/><text class="sm" x="342" y="169">блок SACK в подтверждении</text><text class="mk" x="342" y="190">[−4, 1)</text></g>
<g class="a e7"><path class="lb" d="M44 204L44 212"/><path class="lb" d="M44 208L354 208"/><path class="lb" d="M354 204L354 212"/></g>
<g class="a e8"><rect class="fb" x="44" y="214" width="310" height="34" rx="0"/></g>
<g class="a e9"><text class="sm tk" x="660" y="164">запись [a, b): a входит, b нет</text><text class="sm" x="660" y="186">−4, −3, −2, −1, 0</text><text class="sm tk" x="660" y="208">пять номеров из пяти</text></g>
<g class="a e10"><path class="lo" d="M571.0 262L571.0 252"/><text class="sm c tk" x="571" y="286">жду 105</text></g>
<g class="a e11"><rect class="bxs" x="40" y="304" width="430" height="98" rx="6"/><text class="sm tk" x="52" y="326">по общим сведениям: обычный SACK</text><text class="sm" x="52" y="348">сообщает о куске правее ожидаемого:</text><text class="sm" x="52" y="368">листы 120…130 есть, 105…119 нет</text><text class="sm mu" x="52" y="388">(выдуманный пример для записи [a, b))</text></g>
<g class="a e12"><rect class="bxs" x="490" y="304" width="430" height="98" rx="6"/><text class="sm tk" x="502" y="326">по общим сведениям: блок левее</text><text class="sm" x="502" y="348">ожидаемого номера называется дублирующим:</text><text class="sm" x="502" y="368">сообщение о лишней копии, описано в</text><text class="sm" x="502" y="388">стандарте (RFC 2883); в репозитории нет</text></g>
<g class="a e13"><text class="cap" x="40" y="430">что прочитало приложение на сервере</text></g>
<g class="a e14"><rect class="bxa" x="40" y="440" width="250" height="34" rx="5"/><text class="sm" x="52" y="462">чтение 1: 104 байта</text><rect class="bxa" x="300" y="440" width="250" height="34" rx="5"/><text class="sm" x="312" y="462">чтение 2: 146 байт</text><rect class="bxo" x="560" y="440" width="360" height="34" rx="5"/><text class="sm tk" x="572" y="462">всего 250, содержимое = оригинал</text></g>
<g class="a e15"><text class="sm" x="40" y="498">подкладки в данных нет; границы чтений протокол не обещает, они зависят от скорости приложения</text></g>
<g class="a e16"><rect class="bxa" x="40" y="514" width="880" height="78" rx="6"/><text class="sm tk" x="52" y="536">наш сервер подкладку не посчитал и приложению не передал: называет её только в блоке SACK</text><text class="sm" x="52" y="558">как ядро это делает, не смотрели; по общим сведениям, оно отбрасывает всё левее ожидаемого номера</text><text class="sm" x="52" y="580">видим следствия: подтверждение, блок, данные; клиент не повторял, соединение не сбрасывалось</text></g>
<g class="a e17"><rect class="bxd" x="40" y="606" width="880" height="54" rx="6"/><text class="sm tk" x="52" y="628">граница: приёмник один, Linux 6.18</text><text class="sm" x="52" y="650">Windows, BSD, встроенные системы не проверяли и ничего про них не утверждаем</text></g>
</svg>
