<svg xmlns="http://www.w3.org/2000/svg" class="v05-s18-server-answer" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="v05-s18-server-answer-t v05-s18-server-answer-d">
<title id="v05-s18-server-answer-t">Ответ сервера на накладку</title>
<desc id="v05-s18-server-answer-d">Ответ нашего сервера на пакет с накладкой в пять байт: в выдуманном примере секретарь отвечает запиской «принято до 104 включительно, жду 105» и «листы от -4 до 0 лишние»; в настоящем опыте сервер ждёт номер 105, как и без накладки, и присылает блок выборочного подтверждения SACK от -4 до 1, единицу не включая, то есть номера -4, -3, -2, -1, 0, ровно пять подложенных байт из пяти, по общим сведениям такой блок левее ожидаемого номера называется дублирующим и сообщает о лишней копии, а обычный SACK сообщает о куске правее; приложение сервера прочитало 104 и 146 байт, всего 250, содержимое совпало с оригиналом, подкладки в данных нет; клиент ничего не повторял и соединение не сбрасывалось, но приёмник был один, Linux 6.18, а Windows, BSD и встроенные системы не проверяли.</desc>
