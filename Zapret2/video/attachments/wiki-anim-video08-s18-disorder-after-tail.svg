<svg xmlns="http://www.w3.org/2000/svg" class="v08-s18-disorder-after-tail" viewBox="0 0 960 890" width="960" height="890" role="img" aria-labelledby="v08-s18-disorder-after-tail-t v08-s18-disorder-after-tail-d">
<title id="v08-s18-disorder-after-tail-t">Ключ disorder_after: хвост наоборот</title>
<desc id="v08-s18-disorder-after-tail-d">Ключ disorder_after, «хвост наоборот», режет хвост после имени на два куска и отправляет поздний кусок первым: с пустым значением, то есть меткой «последний байт», первым уходит один байт номер 250, потом 137 байт с номера 113, сервер отвечает «жду байт номер 113» с блоком в стороне из одного байта номер 250 и затем «жду байт номер 251»; со значением endhost плюс 20 это смещение 132, первыми уходят 118 байт с номера 133, потом 20 байт с номера 113, блок на сервере начинается с номера 133; метка должна быть не раньше смещения 113, а host и endhost отвергаются с записью в журнале, и хвост уходит целым; оба ключа вместе дают имя на 7 и 8 байт и хвост с последним байтом впереди, приложение читает оригинал, а в проверке со значением endhost плюс 2 первыми идут 136 байт со смещения 114, потом 2 байта со смещения 112.</desc>
