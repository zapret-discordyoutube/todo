<rect class="bg" x="0" y="0" width="960" height="890"/>
<g><text class="cap" x="40" y="22">disorder_after, «хвост наоборот»: хвост режется на два куска, поздний уходит первым</text></g>
<g class="a e1"><text class="sm tk" x="40" y="48">игрушка (выдуманный пример): хвост письма отправляем наоборот</text></g>
<g class="a e2"><rect class="bxb" x="40" y="58" width="250" height="28" rx="6"/><text class="sm tk c" x="165" y="77">1. последняя строка</text><path class="la" d="M294 72L320.0 72.0"/><polygon class="ha" points="330,72 320.0,77.0 320.0,67.0"/><rect class="bxa" x="336" y="58" width="250" height="28" rx="6"/><text class="sm tk c" x="461" y="77">2. всё остальное</text></g>
<g class="a e3"><text class="sm mu" x="40" y="110">как в выпуске «Перемешать: disorder»: приёмнику держать конец в стороне и ждать начало,</text><text class="sm mu" x="40" y="128">а читателю склеивать данные не по порядку</text></g>
<g class="a e4"><text class="cap" x="40" y="164">хвост: смещения 112…249, 138 байт; первые четыре пакета те же: 97, двойник, имя, двойник</text></g>
<g class="a e5"><text class="sm tk" x="40" y="192">disorder_after пустой: метка «последний байт», смещение 249</text><rect class="bxa" x="40" y="200" width="873.6" height="28" rx="0"/><rect class="bxb" x="913.6" y="200" width="6.4" height="28" rx="0"/><path class="lr" d="M913.6 196L913.6 232"/><circle class="bxb" cx="897.6" cy="214" r="11"/><text class="tk c ns" x="897.6" y="219">1</text><circle class="bxa" cx="476.8" cy="214" r="11"/><text class="tk c ns" x="476.8" y="219">2</text><text class="sm" x="40" y="250">пакеты по порядку: 1 Б с номера 250, потом 137 Б с номера 113</text><text class="sm" x="40" y="272">ответы сервера: </text><text class="m fg" x="190" y="272">ack 113 + блок [250,251)</text><text class="m fg" x="470" y="272">затем ack 251</text><rect class="bxa" x="804.2" y="177" width="115.8" height="20" rx="10"/><text class="ix c fg" x="862.1" y="191">в нашем тесте</text></g>
<g class="a e6"><text class="sm tk" x="40" y="312">disorder_after=endhost+20: смещение 132</text><rect class="bxa" x="40" y="320" width="127.5" height="28" rx="0"/><rect class="bxb" x="167.5" y="320" width="752.5" height="28" rx="0"/><path class="lr" d="M167.5 316L167.5 352"/><circle class="bxb" cx="543.8" cy="334" r="11"/><text class="tk c ns" x="543.8" y="339">1</text><circle class="bxa" cx="103.8" cy="334" r="11"/><text class="tk c ns" x="103.8" y="339">2</text><text class="sm" x="40" y="370">пакеты по порядку: 118 Б с номера 133, потом 20 Б с номера 113</text><text class="sm" x="40" y="392">ответы сервера: </text><text class="m fg" x="190" y="392">ack 113 + блок [133,251)</text><text class="m fg" x="470" y="392">затем ack 251</text><rect class="bxa" x="804.2" y="297" width="115.8" height="20" rx="10"/><text class="ix c fg" x="862.1" y="311">в нашем тесте</text></g>
<g class="a e7"><text class="sm mu" x="40" y="420">ранний кусок 2 синий, поздний кусок 1 жёлтый, красная черта: где режет метка</text></g>
<g class="a e8"><text class="cap" x="40" y="464">допустимые значения disorder_after</text><rect class="bxb" x="796.4" y="449" width="123.6" height="20" rx="10"/><text class="ix c fg" x="858.2" y="463">прогон функций</text></g>
<g class="a e9"><rect class="bxr" x="40" y="476" width="92" height="28" rx="0"/><rect class="bxo" x="132" y="476" width="788" height="28" rx="0"/><text class="sm tk c" x="86" y="495">нельзя</text><text class="sm tk c" x="526" y="495">можно: метка не раньше смещения 113</text></g>
<g class="a e10"><text class="ix mu" x="40" y="522">host 97</text><text class="ix mu" x="132.3" y="522">endhost 112</text><text class="ix mu r" x="920" y="522">249: «последний байт»</text><text class="ix mu" x="140" y="538">endhost + 1 = 113: самое раннее</text></g>
<g class="a e11"><rect class="bx" x="40" y="552" width="880" height="76" rx="8"/><text class="sm" x="54" y="573">disorder_after=host отвергнут, в журнале:</text><text class="ix fg" x="54" y="593">disorder_after marker &#x27;97&#x27; resolved to pos not after after_host pos 112</text><text class="sm tk" x="54" y="615">на проводе обычные пять пакетов, хвост целым в 138 байт</text><rect class="bxa" x="790.2" y="558" width="115.8" height="20" rx="10"/><text class="ix c fg" x="848.1" y="572">в нашем тесте</text></g>
<g class="a e12"><rect class="bxb" x="40" y="638" width="880" height="34" rx="8"/><text class="sm tk" x="54" y="660">прогон функций: endhost + 1 даёт 137 Б со смещения 113, потом 1 Б со смещения 112</text></g>
<g class="a e13"><text class="cap" x="40" y="702">оба ключа вместе: midhost=midsld и disorder_after пустой</text><rect class="bxa" x="804.2" y="687" width="115.8" height="20" rx="10"/><text class="ix c fg" x="862.1" y="701">в нашем тесте</text></g>
