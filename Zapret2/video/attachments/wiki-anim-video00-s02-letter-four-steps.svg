<title id="v00-s02-letter-four-steps-t">Письмо в магазин: четыре шага</title>
<desc id="v00-s02-letter-four-steps-d">Выдуманный пример письма в магазин показывает четыре места, где можно помешать: справочник адресов, адрес и дверь, надпись на конверте и стиль переписки; у запроса в сети те же четыре шага, это DNS, адрес и порт, имя сайта в первом сообщении и сигнатура протокола, и каждый шаг можно испортить по-своему.</desc>
