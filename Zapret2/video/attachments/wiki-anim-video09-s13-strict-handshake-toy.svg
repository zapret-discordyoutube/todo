<title id="video09-s13-strict-handshake-toy-t">Игрушка строгое рукопожатие</title>
<desc id="video09-s13-strict-handshake-toy-d">Игрушка строгое рукопожатие в роутере видит SYN, SYN-ACK с подтверждением ровно на единицу больше и ACK, признаёт рукопожатие настоящим, а потом ищет имя подстрокой и в пакете с лишним байтом не находит, поэтому приветствие проходит.</desc>
