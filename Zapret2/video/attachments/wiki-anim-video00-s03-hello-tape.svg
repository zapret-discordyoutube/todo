<title id="v00-s03-hello-tape-t">Приветствие клиента: 250 байт</title>
<desc id="v00-s03-hello-tape-d">Приветствие клиента в нашей лаборатории занимает 250 байт, имя сайта лежит в нём открытым текстом, занимает 15 байт и начинается с байта 97 при счёте с нуля; по общим сведениям имя нужно, потому что на одном адресе живёт много сайтов, а технология ECH прячет имя, но в документации сказано, что она запоздала и блокирующие могут банить даже по самому её наличию.</desc>
