<g><text class="cap" x="40" y="24">настоящее приветствие 250 байт со стратегией pass, которая ничего не делает</text></g>
<g class="a e1"><rect class="bxr" x="40" y="36" width="430" height="40" rx="8"/><text class="tk sm c" x="255" y="62">игрушка включена</text></g>
<g class="a e2"><rect class="bxo" x="490" y="36" width="430" height="40" rx="8"/><text class="tk sm c" x="705" y="62">игрушки нет</text></g>
<g class="a e3"><text class="mk" x="40" y="117">c0</text><path class="lm" d="M92 112L464 112"/><rect class="bxa" x="89" y="101" width="7" height="22" rx="2"/><rect class="bxa" x="111.6" y="101" width="7" height="22" rx="2"/><rect class="bxa" x="134.3" y="101" width="7" height="22" rx="2"/><rect class="bxa" x="181.4" y="101" width="7" height="22" rx="2"/><rect class="bxa" x="271.6" y="101" width="7" height="22" rx="2"/><rect class="bxa" x="453" y="101" width="7" height="22" rx="2"/></g>
<g class="a e4"><text class="mk" x="40" y="151">r0</text><path class="lm" d="M92 146L464 146"/><rect class="bxa" x="89" y="135" width="7" height="22" rx="2"/><rect class="bxa" x="111.6" y="135" width="7" height="22" rx="2"/><rect class="bxa" x="134.3" y="135" width="7" height="22" rx="2"/><rect class="bxa" x="181.4" y="135" width="7" height="22" rx="2"/><rect class="bxa" x="271.6" y="135" width="7" height="22" rx="2"/><rect class="bxa" x="453" y="135" width="7" height="22" rx="2"/></g>
<g class="a e5"><text class="mk" x="40" y="185">r1</text><path class="lm" d="M92 180L464 180"/><text class="sm mu" x="98" y="174">ни одного приветствия</text></g>
<g class="a e6"><text class="mk" x="40" y="219">s0</text><path class="lm" d="M92 214L464 214"/><text class="sm mu" x="98" y="208">ни одного приветствия</text></g>
<g class="a e7"><path class="lb" d="M310.2 94L310.2 228"/><text class="sm amb tk r" x="304.2" y="90">FIN сервера: 2002 мс</text></g>
<g class="a e8"><text class="sm" x="40" y="254">отправки, мс от первой: 0, 207, 415, 847, 1675, 3339</text></g>
<g class="a e9"><text class="sm mu" x="40" y="274">паузы растут; шестая уже после закрытия сервером</text></g>
<g class="a e10"><text class="mk" x="490" y="117">c0</text><rect class="bxa" x="539" y="101" width="7" height="22" rx="2"/><text class="sm tk" x="560" y="117">срок жизни 64</text></g>
<g class="a e11"><text class="mk" x="490" y="151">r0</text><rect class="bxa" x="539" y="135" width="7" height="22" rx="2"/><text class="sm tk" x="560" y="151">срок жизни 64</text></g>
<g class="a e12"><text class="mk" x="490" y="185">r1</text><rect class="bxa" x="539" y="169" width="7" height="22" rx="2"/><text class="sm tk" x="560" y="185">срок жизни 63</text></g>
<g class="a e13"><text class="mk" x="490" y="219">s0</text><rect class="bxa" x="539" y="203" width="7" height="22" rx="2"/><text class="sm tk" x="560" y="219">срок жизни 63</text></g>
<g class="a e14"><text class="sm" x="490" y="254">одно приветствие на каждой из четырёх точек</text></g>
<g class="a e15"><text class="sm mu" x="490" y="274">без повторов</text></g>
<g class="a e16"><rect class="bx" x="40" y="300" width="430" height="128" rx="6"/><text class="cap" x="52" y="320">журнал игрушки</text><text class="mn" x="52" y="342">TOY first data packet carries the blocked</text><text class="mn" x="52" y="358">name: connection BLOCKED, dropping this</text><text class="mn" x="52" y="374">packet and later client data</text><text class="sm" x="52" y="396">и ещё пять раз:</text><text class="mn" x="52" y="416">TOY blocked connection: dropping data</text></g>
<g class="a e17"><rect class="bx" x="490" y="300" width="430" height="128" rx="6"/><text class="cap" x="502" y="320">ответы сервера</text><text class="sm" x="502" y="346">сразу после приветствия:</text><text class="mk" x="502" y="366">ack 251: жду 251-й байт</text><text class="sm" x="502" y="388">затем свой ответ в 14 байт,</text><text class="mk" x="502" y="408">затем ack 252 вместе с FIN</text></g>
<g class="a e18"><rect class="bxr" x="40" y="442" width="430" height="56" rx="6"/><text class="tk sm rej" x="52" y="466">сервер получил 0 байт</text><text class="sm" x="52" y="487">в ядре клиента повторных отправок 5; ответа нет</text></g>
<g class="a e19"><rect class="bxo" x="490" y="442" width="430" height="56" rx="6"/><text class="tk sm ok" x="502" y="466">сервер получил 250 байт</text><text class="sm" x="502" y="487">имя www.example.com; клиент получил ответ</text></g>
<g class="a e20"><rect class="bxs" x="40" y="514" width="880" height="56" rx="8"/><text class="tk sm" x="56" y="538">игрушка без подделки: запрет, сервер 0 байт. Без игрушки: сервер 250 байт, поток чистый.</text><text class="sm" x="56" y="560">Между этими двумя опытами и будет работать подделка.</text></g>
</svg>
