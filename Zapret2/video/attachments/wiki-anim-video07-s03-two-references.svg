<svg xmlns="http://www.w3.org/2000/svg" class="v07-s03-two-references" viewBox="0 0 960 586" width="960" height="586" role="img" aria-labelledby="v07-s03-two-references-t v07-s03-two-references-d">
<title id="v07-s03-two-references-t">Две точки отсчёта: с игрушкой и без</title>
<desc id="v07-s03-two-references-d">Две точки отсчёта со стратегией pass, которая ничего не делает: при включённой игрушке настоящее приветствие в 250 байт запрещено, клиент отправляет его шесть раз на точках c0 и r0 и ни разу не видит на r1 и s0, сервер получает 0 байт, а без игрушки приветствие идёт один раз со сроком жизни 64, 64, 63, 63, сервер получает ровно 250 байт и отвечает, то есть поток чистый.</desc>
