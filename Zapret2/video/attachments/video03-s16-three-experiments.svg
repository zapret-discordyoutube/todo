<svg xmlns="http://www.w3.org/2000/svg" class="v03-s16-three-experiments" viewBox="0 0 960 784" width="960" height="784" role="img" aria-labelledby="v03-s16-three-experiments-t v03-s16-three-experiments-d">
<title id="v03-s16-three-experiments-t">Три опыта с прогнозом</title>
<desc id="v03-s16-three-experiments-d">Три опыта с прогнозом до результата: в первом диапазон b0-b249 не пропускает приветствие (байтов данных 250 больше 249), запрос идёт целым в 250 байт и в захвате клиента 10 пакетов, а диапазон b0-b250 пропускает, запрос режется на 104 и 146 байт и в захвате 12 пакетов; во втором добавленное условие --filter-l7=http не подходит соединению tls, на каждом из десяти пакетов журнал пишет «no lua functions in this profile», pcap ни разу не звали и файла нет; в третьем при pos=1 куски 1 и 249, без pos по умолчанию 2 и 248.</desc>
<style>.v03-s16-three-experiments{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
