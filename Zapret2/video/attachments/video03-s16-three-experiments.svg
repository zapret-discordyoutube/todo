<rect class="bg" x="0" y="0" width="960" height="784"/>
<g class="a e1"><text class="cap" x="10" y="24">три опыта: меняем одну цифру или условие, прогноз записан до результата</text></g>
<g class="a e2"><text class="tk" x="10" y="56">опыт 1. Меняем цифру: диапазон исходящих перед multisplit, два запуска</text></g>
<g class="a e3"><rect class="bxb" x="10" y="70" width="179.9" height="28" rx="6"/><text class="m fg" x="17" y="88.5">--out-range=b0-b249</text></g>
<g class="a e4"><text class="sm mu" x="10" y="122">прогноз до опыта</text><text class="sm" x="10" y="142">b на приветствии = 250; 250 &gt; 249:</text><text class="sm tk" x="10" y="162">вне диапазона, не сработает: запрос целым</text></g>
<g class="a e5"><text class="sm mu" x="10" y="192">журнал</text><text class="mt fg" x="10" y="212">out pos b250 b250 out of range b0-b249</text><text class="mt fg" x="10" y="230">packet: id=4 pass unmodified</text></g>
<g class="a e6"><text class="sm mu" x="10" y="262">сервер получил запрос</text><rect class="bxa" x="10" y="272" width="400.0" height="30" rx="5"/><text class="tk c" x="210.0" y="292">250 байт</text></g>
<g class="a e7"><text class="sm mu" x="10" y="326">в захвате клиента 10 пакетов</text><path class="lo" d="M11 346L16 352L26 339"/><text class="sm ok tk" x="34" y="352">прогноз сошёлся</text></g>
<g class="a e8"><rect class="bxb" x="490" y="70" width="179.9" height="28" rx="6"/><text class="m fg" x="497" y="88.5">--out-range=b0-b250</text></g>
<g class="a e9"><text class="sm mu" x="490" y="122">прогноз до опыта</text><text class="sm" x="490" y="142">b = 250; 250 ≤ 250: в диапазоне,</text><text class="sm tk" x="490" y="162">сработает: запрос будет разрезан</text></g>
<g class="a e10"><text class="sm mu" x="490" y="192">журнал</text><text class="mt fg" x="490" y="212">out pos b250 b250 in range b0-b250</text><text class="mt fg" x="490" y="230">packet: id=4 drop</text></g>
<g class="a e11"><text class="sm mu" x="490" y="262">сервер получил запрос</text><rect class="bxa" x="490" y="272" width="166.4" height="30" rx="5"/><text class="tk c" x="573.2" y="292">104</text><rect class="bxb" x="656.4" y="272" width="231.60000000000002" height="30" rx="5"/><text class="tk c" x="772.2" y="292">146</text></g>
<g class="a e12"><text class="sm mu" x="490" y="326">в захвате клиента 12 пакетов</text><path class="lo" d="M491 346L496 352L506 339"/><text class="sm ok tk" x="514" y="352">прогноз сошёлся</text></g>
<g class="a e13"><text class="tk" x="10" y="386">одна цифра изменила результат: 249 не режет, 250 режет</text></g>
<g class="a e14"><text class="tk" x="10" y="422">опыт 2. Меняем условие профиля, не аргумент: добавлен фильтр протокола</text></g>
<g class="a e15"><rect class="bxa" x="10" y="436" width="153.7" height="28" rx="6"/><text class="m fg" x="17" y="454.5">--filter-l7=http</text><text class="sm" x="179.7" y="456">стоит правее самописца, но условия профиля действуют, где бы они ни стояли</text></g>
<g class="a e16"><text class="sm tk" x="10" y="492">прогноз: протокол соединения tls, профиль не подойдёт никогда, все пакеты достанутся no_action</text></g>
<g class="a e17"><circle class="bxs" cx="22" cy="520" r="9"/><circle class="bxs" cx="50" cy="520" r="9"/><circle class="bxs" cx="78" cy="520" r="9"/><circle class="bxs" cx="106" cy="520" r="9"/><circle class="bxs" cx="134" cy="520" r="9"/><circle class="bxs" cx="162" cy="520" r="9"/><circle class="bxs" cx="190" cy="520" r="9"/><circle class="bxs" cx="218" cy="520" r="9"/><circle class="bxs" cx="246" cy="520" r="9"/><circle class="bxs" cx="274" cy="520" r="9"/><text class="sm" x="300" y="525">журнал на каждом из десяти пакетов:</text><text class="mt fg" x="606" y="525">no lua functions in this profile</text></g>
<g class="a e18"><text class="sm" x="10" y="556">запрос дошёл целым (250 байт), в захвате клиента 10 пакетов</text><path class="lo" d="M653 552L658 558L668 545"/><text class="sm ok tk" x="676" y="556">прогноз сошёлся</text></g>
<g class="a e19"><text class="sm" x="10" y="578">файла nfqws_seen.pcap нет вообще: pcap ни разу не звали</text></g>
<g class="a e20"><text class="tk" x="10" y="618">опыт 3, на будущее. Меняем midsld на цифру и убираем аргумент pos</text></g>
<g class="a e21"><text class="mk" x="10" y="654">pos=1</text><rect class="fa" x="110" y="634" width="6" height="28" rx="3"/><rect class="bxa" x="118" y="634" width="792.0" height="28" rx="4"/><text class="tk c" x="515.0" y="653">249 байт</text><text class="sm" x="110" y="682">куски 1 и 249: 1 + 249 = 250</text></g>
<g class="a e22"><text class="mk" x="10" y="716">без pos</text><rect class="fa" x="110" y="696" width="6.4" height="28" rx="3"/><rect class="bxa" x="118.4" y="696" width="791.6" height="28" rx="4"/><text class="tk c" x="515.2" y="715">248 байт</text><text class="sm" x="110" y="744">куски 2 и 248: 2 + 248 = 250; по умолчанию pos равен 2 (lua/zapret-antidpi.lua:497)</text></g>
<g class="a e23"><text class="sm mu" x="10" y="772">что ещё принимает pos, расскажет выпуск «Где резать: метки»</text></g>
</svg>
