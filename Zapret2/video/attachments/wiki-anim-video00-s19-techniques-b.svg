<rect class="bg" x="0" y="0" width="960" height="416"/>
<g><text class="cap" x="24" y="24">приёмы: остальные четыре выпуска</text></g>
<g class="a e1"><rect class="bxo" x="24" y="44" width="446" height="146" rx="8"/><text class="tk" x="38" y="72">«Резать и подделывать вместе»</text><text class="sm mu" x="38" y="96">как собрать оба приёма в одну серию?</text><text class="sm tk acc" x="38" y="124">после выпуска вы сможете:</text><text class="sm" x="38" y="146">увидеть разрез и подделки одним потоком пакетов</text></g>
<g class="a e2"><rect class="bxo" x="490" y="44" width="446" height="146" rx="8"/><text class="tk" x="504" y="72">«Фокусы рукопожатия»</text><text class="sm mu" x="504" y="96">что можно сделать до первого байта данных?</text><text class="sm tk acc" x="504" y="124">после выпуска вы сможете:</text><text class="sm" x="504" y="146">назвать приёмы, которые работают на первых</text><text class="sm" x="504" y="166">служебных пакетах соединения</text></g>
<g class="a e3"><rect class="bxo" x="24" y="204" width="446" height="166" rx="8"/><text class="tk" x="38" y="232">«Другие слои»</text><text class="sm mu" x="38" y="256">что есть кроме резки, перестановки и подделки</text><text class="sm mu" x="38" y="276">внутри TCP?</text><text class="sm tk acc" x="38" y="304">после выпуска вы сможете:</text><text class="sm" x="38" y="326">различать правки на других слоях: заголовки IPv6,</text><text class="sm" x="38" y="346">фрагменты, правки HTTP, QUIC</text></g>
<g class="a e4"><rect class="bxb" x="490" y="204" width="446" height="166" rx="8"/><text class="tk" x="504" y="232">«Читаем и отлаживаем стратегии»</text><text class="sm mu" x="504" y="256">как повторить любой опыт самому, чтобы ничего не</text><text class="sm mu" x="504" y="276">принимать на веру?</text><text class="sm tk acc" x="504" y="304">после выпуска вы сможете:</text><text class="sm" x="504" y="326">проверять стратегию своими руками и обходить</text><text class="sm" x="504" y="346">типичные ловушки</text></g>
<g class="a e5"><text class="sm mu" x="24" y="398">последний выпуск проверка своими руками: он не требует выпусков про приёмы</text></g>
</svg>
