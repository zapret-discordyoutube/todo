<svg xmlns="http://www.w3.org/2000/svg" class="v00-s19-techniques-b" viewBox="0 0 960 416" width="960" height="416" role="img" aria-labelledby="v00-s19-techniques-b-t v00-s19-techniques-b-d">
<title id="v00-s19-techniques-b-t">Остальные приёмы</title>
<desc id="v00-s19-techniques-b-d">Остальные четыре выпуска про приёмы: резать и подделывать вместе одним потоком пакетов, фокусы рукопожатия до первого байта данных, другие слои вроде заголовков IPv6, фрагментов, правок HTTP и QUIC, а последний учит повторять любой опыт самому и разбирает типичные ловушки.</desc>
