<svg xmlns="http://www.w3.org/2000/svg" class="v05-s08-loop-four-lines" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v05-s08-loop-four-lines-t v05-s08-loop-four-lines-d">
<title id="v05-s08-loop-four-lines-t">Цикл по частям: четыре строки</title>
<desc id="v05-s08-loop-four-lines-d">Первые четыре строки цикла multisplit (lua/zapret-antidpi.lua:504-507) на данных в 250 байт и списке Lua из одного числа 105: цикл идёт от нуля до числа разрезов, значит два прохода; на проходе 0 начало 1 (элемента с номером ноль в списке нет), конец 105 минус 1 равно 104, и string.sub вырезает байты с 1 по 104, то есть 104 байта; на проходе 1 начало 105, конец равен длине данных 250, и вырезаются байты с 105 по 250, то есть 250 минус 105 плюс 1 равно 146 байт; 104 плюс 146 равно 250; журнал считает с нуля (строка 521) и пишет part 1 0-103 len=104 и part 2 104-249 len=146; проверка на списке из одного числа 250: части 1..249 и 250..250, в опыте с меткой 249 сервер получил 249 байт и потом 1.</desc>
