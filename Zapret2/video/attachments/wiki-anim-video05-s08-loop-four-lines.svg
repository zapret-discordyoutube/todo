<rect class="bg" x="0" y="0" width="960" height="580"/>
<g class="a e1"><text class="cap" x="40" y="22">multisplit: цикл частей, lua/zapret-antidpi.lua:504-507</text><text class="cap" x="560" y="22">данные 250 байт, список Lua {105}</text></g>
<g class="a e2"><rect class="bx" x="40" y="36" width="500" height="176" rx="8"/><text class="ix" x="52" y="66">504</text><text class="m" x="92" y="66">for i=0,#pos do</text><text class="ix" x="52" y="96">505</text><text class="m" x="104" y="96">local pos_start = pos[i] or 1</text><text class="ix" x="52" y="126">506</text><text class="m" x="104" y="126">local pos_end = i&lt;#pos and pos[i+1]-1 or #data</text><text class="ix" x="52" y="156">507</text><text class="m" x="104" y="156">local part = string.sub(data,pos_start,pos_end)</text><text class="sm mu" x="52" y="190">508-525: журнал и отправка, дальше</text></g>
<g class="a e3 tr"><rect class="bxa" x="46" y="46" width="488" height="28" rx="4"/></g>
<g class="a e4 tr"><rect class="bxa" x="46" y="76" width="488" height="28" rx="4"/></g>
<g class="a e5 tr"><rect class="bxa" x="46" y="106" width="488" height="28" rx="4"/></g>
<g class="a e6 tr"><rect class="bxa" x="46" y="136" width="488" height="28" rx="4"/></g>
<g class="a e7"><text class="cap c" x="726" y="52">проход i=0</text><text class="cap c" x="854" y="52">проход i=1</text><text class="sm mu" x="560" y="214">разрезов 1, проходов 2</text><text class="sm mu" x="560" y="232">(цикл от 0 до #pos)</text></g>
<g class="a e8"><text class="m" x="560" y="84">pos[i]</text><rect class="bxd" x="662" y="62" width="124" height="28" rx="4"/><text class="sm c mu" x="724" y="82">нет элемента</text><rect class="bxa" x="790" y="62" width="124" height="28" rx="4"/><text class="mk c" x="852" y="82">105</text></g>
<g class="a e9"><text class="m" x="560" y="118">pos_start</text><rect class="bxa" x="662" y="96" width="124" height="28" rx="4"/><text class="mk c" x="724" y="116">1</text><rect class="bxa" x="790" y="96" width="124" height="28" rx="4"/><text class="mk c" x="852" y="116">105</text></g>
<g class="a e10"><text class="m" x="560" y="152">pos_end</text><rect class="bxa" x="662" y="130" width="124" height="28" rx="4"/><text class="mk c" x="724" y="150">105 − 1 = 104</text><rect class="bxa" x="790" y="130" width="124" height="28" rx="4"/><text class="mk c" x="852" y="150">#data = 250</text></g>
<g class="a e11"><text class="m" x="560" y="186">вырезано</text><rect class="bxo" x="662" y="164" width="124" height="28" rx="4"/><text class="sm c tk" x="724" y="184">104 байта</text><rect class="bxo" x="790" y="164" width="124" height="28" rx="4"/><text class="sm c tk" x="852" y="184">146 байт</text></g>
<g class="a e12"><text class="cap" x="40" y="246">лента 250 байт, номера Lua с единицы</text></g>
<g class="a e13"><rect class="bxa" x="40" y="256" width="366.1" height="30" rx="3"/><text class="sm" x="50" y="277">часть 1: байты 1..104</text><path class="lf" d="M406.1 250L406.1 292"/><text class="ix c" x="406.1" y="308">разрез 105</text></g>
<g class="a e14"><rect class="bxb" x="406.1" y="256" width="513.9" height="30" rx="3"/><text class="sm" x="416.1" y="277">часть 2: байты 105..250</text></g>
<g class="a e15"><text class="tk sm" x="40" y="336">104 + 146 = 250: ни один байт не потерян и не взят дважды</text></g>
<g class="a e16"><text class="cap" x="40" y="368">журнал опыта: строка 521, внутри того же цикла, а за ней отправка (522)</text></g>
<g class="a e17"><rect class="bx" x="40" y="378" width="880" height="58" rx="6"/><text class="m" x="52" y="400">sending part 1 0-103 len=104</text><text class="m" x="52" y="424">sending part 2 104-249 len=146</text><text class="sm mu r" x="908" y="400">журнал считает с нуля</text><text class="sm mu r" x="908" y="424">и пишет оба края</text></g>
<g class="a e18"><text class="cap" x="40" y="470">проверь себя: в Lua пришёл список {250}, данные те же, 250 байт</text></g>
<g class="a e19"><rect class="bxa" x="40" y="482" width="876.5" height="28" rx="3"/><text class="sm" x="50" y="502">проход 0: начало 1, конец 250 − 1 = 249</text><rect class="bxb" x="916.5" y="482" width="3.5" height="28" rx="1"/><path class="lf" d="M916.5 476L916.5 516"/></g>
<g class="a e20"><text class="sm r tk" x="908.5" y="534">проход 1: начало 250, конец 250: один байт</text><path class="lm" d="M918.2 512 L918.2 520"/></g>
<g class="a e21"><text class="mk" x="40" y="534">249 и 1</text><text class="sm mu" x="40" y="558">в нашем опыте с меткой 249: на проводе номера 1 и 250, сервер получил 249 байт и потом 1</text></g>
