<svg xmlns="http://www.w3.org/2000/svg" class="v05-s16-order-loop-sync" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="v05-s16-order-loop-sync-t v05-s16-order-loop-sync-d">
<title id="v05-s16-order-loop-sync-t">Порядок частей и синхронная отправка</title>
<desc id="v05-s16-order-loop-sync-d">Порядок отправки частей в цикле multisplit (lua/zapret-antidpi.lua:504-525): сначала выдуманный пример, где почтальон кладёт в ящик два конверта подряд и пауза между ними зависит от того, чем он занят (толстый журнал или блокнот), а не от дороги; потом цикл от первой части к последней, где в каждом круге строка журнала sending part (521) стоит перед отправкой части (522), поэтому между двумя частями цикл успевает записать строку журнала; справа цепочка вызовов от rawsend_payload_segmented до sendto на сыром сокете (nfq2/darkmagic.c:2032), синхронная: возвращается, когда ядро приняло пакет, ожидания и сна на этом пути нет; внизу в опытах без накладки и повторов пакеты на проводе клиента шли с номерами по возрастанию, для пяти частей 1, 3, 98, 105, 113.</desc>
