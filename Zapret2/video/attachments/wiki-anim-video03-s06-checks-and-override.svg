<g class="a e1"><text class="cap" x="10" y="22">имя функции проверяется дважды, а позднее определение заменяет раннее</text></g>
<g class="a e2"><text class="tk" x="10" y="52">замок 1: при запуске</text><text class="sm mu" x="330" y="52">nfq2/lua.c:4080-4100</text></g>
<g class="a e3"><rect class="bx" x="10" y="62" width="530" height="90" rx="8"/><text class="ln r" x="54" y="86">4089</text><text class="cd" x="66.0" y="86">lua_getglobal(params.L, func-&gt;func);</text><text class="ln r" x="54" y="112">4090</text><text class="cd" x="66.0" y="112">if (!lua_isfunction(params.L,-1))</text><text class="ln r" x="54" y="138">4093</text><text class="cd" x="82.86" y="138">DLOG_ERR(&quot;desync function &#x27;%s&#x27; does not exist\n&quot;, …)</text></g>
<g class="a e4"><text class="sm" x="10" y="176">для каждого вызова: нет функции — сообщение и остановка</text><text class="sm amb" x="10" y="198">режим разбора Lua не создаёт, ту же строку принимает (код 0)</text></g>
<g class="a e5"><rect class="bx" x="548" y="52" width="402" height="150" rx="8"/><text class="mk" x="562" y="74">опыт: --lua-desync=nonexistent_fn</text><text class="m rej" x="562" y="98">desync function &#x27;nonexistent_fn&#x27;</text><text class="m rej" x="562" y="118">does not exist</text><text class="m mu" x="562" y="138">LUA SHUTDOWN</text><rect class="bxo" x="562" y="150" width="374" height="42" rx="6"/><text class="sm" x="574" y="168">клиент всё равно получил ответ: в правиле</text><text class="sm" x="574" y="185">очереди лаборатории стоит bypass</text></g>
<g class="a e6"><path class="lm" d="M10 222L950 222"/><text class="tk" x="10" y="246">замок 2: перед каждым вызовом</text><text class="sm mu" x="330" y="246">nfq2/desync.c:1055-1061</text><text class="sm" x="530" y="246">снова берёт имя и проверяет, что это функция</text></g>
<g class="a e7"><path class="lm" d="M10 268L950 268"/><text class="cap" x="10" y="292">файлы выполняются по порядку: позднее определение затирает раннее</text></g>
<g class="a e8"><rect class="bx" x="10" y="306" width="212" height="64" rx="8"/><text class="mk" x="22" y="327">zapret-lib.lua</text><rect class="bx" x="22" y="336" width="100" height="26" rx="6"/><text class="mk c" x="72" y="354">pass</text></g>
