<svg xmlns="http://www.w3.org/2000/svg" class="v03-s06-checks-and-override" viewBox="0 0 960 504" width="960" height="504" role="img" aria-labelledby="v03-s06-checks-and-override-t v03-s06-checks-and-override-d">
<title id="v03-s06-checks-and-override-t">Две проверки имени и замена функции</title>
<desc id="v03-s06-checks-and-override-d">Программа проверяет имя функции дважды: при запуске (nfq2/lua.c:4080-4100; несуществующая функция останавливает Lua, но клиент всё равно получает ответ из-за bypass в правиле очереди) и перед каждым вызовом (nfq2/desync.c:1055-1061); файлы выполняются по порядку, поэтому drop из четвёртого файла затирает готовую drop, и запрос в опыте дошёл до сервера целиком.</desc>
