<g class="a e11"><path class="lm" d="M466 338L482.0 338.0"/><polygon class="hm" points="492,338 482.0,343.0 482.0,333.0"/></g>
<g class="a e12"><rect class="bx" x="494" y="306" width="212" height="64" rx="8"/><text class="mk" x="506" y="327">zapret-pcap.lua</text><rect class="bx" x="506" y="336" width="100" height="26" rx="6"/><text class="mk c" x="556" y="354">pcap</text></g>
<g class="a e13"><path class="lm" d="M708 338L724.0 338.0"/><polygon class="hm" points="734,338 724.0,343.0 724.0,333.0"/></g>
<g class="a e14"><rect class="bxa" x="736" y="306" width="212" height="64" rx="8"/><text class="tk" x="748" y="327">свой файл</text><rect class="bxa" x="748" y="336" width="100" height="26" rx="6"/><text class="mk c" x="798" y="354">drop</text><text class="sm" x="858" y="354">своя</text></g>
<g class="a e15"><rect class="dim" x="262" y="336" width="100" height="26" rx="6"/></g>
<g class="a e16"><path class="lr" d="M303 340L321 358M303 358L321 340"/><text class="sm rej" x="372" y="386">затёрта: ящик drop теперь с новой функцией</text></g>
<g class="a e17"><rect class="bxo" x="10" y="404" width="940" height="56" rx="8"/><text class="sm" x="24" y="427">В опыте своя drop ничего не отвечает: запрос, который настоящий drop выбросил бы,</text><text class="tk" x="24" y="448">дошёл до сервера целиком (250 байт).</text></g>
<g class="a e18"><text class="tk" x="10" y="490">Функция-стратегия: глобальная функция Lua; имя проверяется при запуске и перед вызовом.</text></g>
