<svg xmlns="http://www.w3.org/2000/svg" class="v00-s18-blockcheck-run" viewBox="0 0 960 854" width="960" height="854" role="img" aria-labelledby="v00-s18-blockcheck-run-t v00-s18-blockcheck-run-d">
<title id="v00-s18-blockcheck-run-t">Прогон blockcheck2</title>
<desc id="v00-s18-blockcheck-run-d">Скрипт blockcheck2 один раз проверяет DNS, для каждого сайта смотрит порт, пробует сайт без обхода и проверяет адрес, потом по очереди запускает программу с одной стратегией и в конце печатает сводку, а в нашем тесте на игрушечном инспекторе из четырнадцати попыток сработали четыре, и сам скрипт пишет, что сводка не гарантирует готового рецепта.</desc>
