<rect class="bg" x="0" y="0" width="960" height="854"/>
<g><text class="cap" x="24" y="24">blockcheck2: пробует стратегии по очереди</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bx" x="24" y="50" width="142" height="32" rx="8"/><text class="sm tk c" x="95" y="71">DNS (один раз)</text></g>
<g class="a e2"><rect class="bx" x="184" y="50" width="53" height="32" rx="8"/><text class="sm tk c" x="210.5" y="71">порт</text><path class="lf" d="M168 66L172.0 66.0"/><polygon class="hf" points="182,66 172.0,71.0 172.0,61.0"/></g>
<g class="a e3"><rect class="bxr" x="255" y="50" width="150" height="32" rx="8"/><text class="sm tk c" x="330" y="71">сайт без обхода</text><path class="lf" d="M239 66L243.0 66.0"/><polygon class="hf" points="253,66 243.0,71.0 243.0,61.0"/></g>
<g class="a e4"><rect class="bx" x="423" y="50" width="64" height="32" rx="8"/><text class="sm tk c" x="455" y="71">адрес</text><path class="lf" d="M407 66L411.0 66.0"/><polygon class="hf" points="421,66 411.0,71.0 411.0,61.0"/></g>
<g class="a e5"><rect class="bxa" x="505" y="50" width="112" height="32" rx="8"/><text class="sm tk c" x="561" y="71">стратегия 1</text><path class="lf" d="M489 66L493.0 66.0"/><polygon class="hf" points="503,66 493.0,71.0 493.0,61.0"/></g>
<g class="a e6"><rect class="bxa" x="635" y="50" width="112" height="32" rx="8"/><text class="sm tk c" x="691" y="71">стратегия 2</text><path class="lf" d="M619 66L623.0 66.0"/><polygon class="hf" points="633,66 623.0,71.0 623.0,61.0"/></g>
<g class="a e7"><rect class="bxa" x="765" y="50" width="28" height="32" rx="8"/><text class="sm tk c" x="779" y="71">…</text><path class="lf" d="M749 66L753.0 66.0"/><polygon class="hf" points="763,66 753.0,71.0 753.0,61.0"/></g>
<g class="a e8"><rect class="bxo" x="811" y="50" width="97" height="32" rx="8"/><text class="sm tk c" x="859.5" y="71">SUMMARY</text><path class="lf" d="M795 66L799.0 66.0"/><polygon class="hf" points="809,66 799.0,71.0 799.0,61.0"/></g>
<g class="a e9"><path class="lm" d="M184 88L184 96L793 96L793 88"/><text class="sm mu c" x="488.5" y="116">для каждого сайта: цикл «запустить, проверить, остановить»</text></g>
<g class="a e10"><rect class="bxb" x="24" y="130" width="474" height="26" rx="13.0"/><text class="sm tk c" x="261" y="148">запускать при выключенных средствах обхода и VPN</text></g>
<g class="a e11"><rect class="bxr" x="24" y="202" width="912" height="116" rx="8"/><text class="sm tk" x="38" y="228">1. сайт без обхода: игрушка блокирует</text><text class="lg" x="38" y="254">- checking without DPI bypass</text><text class="lg" x="38" y="276">curl: (28) Operation timed out after 3003 milliseconds with 0 bytes received</text><text class="lgr" x="38" y="298">UNAVAILABLE code=28</text></g>
<g class="a e12"><rect class="bxo" x="24" y="328" width="912" height="94" rx="8"/><text class="sm tk" x="38" y="354">2. одна стратегия: запрос прошёл</text><text class="lg" x="38" y="380">- curl_test_http ipv4 blocked.test : nfqws2 --payload=http_req --lua-desync=multisplit:pos=midsld</text><text class="lga" x="38" y="402">!!!!! AVAILABLE !!!!!</text></g>
<g class="a e13"><text class="sm tk" x="24" y="452">всего попыток: 14</text><text class="sm tk ok" x="300" y="452">сработали: 4</text></g>
<g class="a e14"><rect class="bxg" x="24" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="39" y="483">1</text><rect class="bxo" x="58" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="73" y="483">2</text><rect class="bxg" x="92" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="107" y="483">3</text><rect class="bxg" x="126" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="141" y="483">4</text><rect class="bxg" x="160" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="175" y="483">5</text><rect class="bxg" x="194" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="209" y="483">6</text><rect class="bxg" x="228" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="243" y="483">7</text><rect class="bxo" x="262" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="277" y="483">8</text><rect class="bxg" x="296" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="311" y="483">9</text><rect class="bxo" x="330" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="345" y="483">10</text><rect class="bxg" x="364" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="379" y="483">11</text><rect class="bxg" x="398" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="413" y="483">12</text><rect class="bxg" x="432" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="447" y="483">13</text><rect class="bxo" x="466" y="462" width="30" height="30" rx="5"/><text class="ix c fg" x="481" y="483">14</text></g>
<g class="a e15"><text class="sm mu" x="512" y="483">зелёные: прошёл запрос; серые: нет</text></g>
<g class="a e16"><rect class="bxo" x="24" y="506" width="912" height="138" rx="8"/><text class="sm tk" x="38" y="532">3. в конце: SUMMARY, четыре строки (для ipv4 blocked.test, запуск nfqws2 с такими опциями)</text><text class="lgk" x="38" y="558">curl_test_http</text><text class="lg" x="250" y="558">--payload=http_req --lua-desync=multisplit:pos=midsld</text><text class="lgk" x="38" y="580">curl_test_https_tls12</text><text class="lg" x="250" y="580">--payload=tls_client_hello --lua-desync=multisplit:pos=midsld</text><text class="lgk" x="38" y="602">curl_test_https_tls12</text><text class="lg" x="250" y="602">--payload=tls_client_hello --lua-desync=multidisorder:pos=midsld</text><text class="lgk" x="38" y="624">curl_test_https_tls12</text><text class="lg" x="250" y="624">--payload=tls_client_hello --lua-desync=multisplit:pos=host+1</text></g>
<g class="a e17"><rect class="bx" x="24" y="654" width="912" height="190" rx="8"/><text class="sm tk" x="38" y="680">4. последние строки печатает сам скрипт (оригинал по-английски, третья строка обрезана)</text><text class="lgk" x="38" y="706">Please note this SUMMARY does not guarantee a magic pill for you to copy/paste and be happy.</text><text class="lg" x="38" y="728">Understanding how strategies work is very desirable.</text><text class="lg" x="38" y="750">This knowledge allows to understand better which strategies to prefer and which to avoid if possible, …</text><text class="lg" x="38" y="772">Blockcheck does it&#x27;s best to prioritize good strategies but it&#x27;s not bullet-proof.</text><text class="lgk" x="38" y="794">It was designed not as magic pill maker but as a DPI bypass test tool.</text><text class="sm tk" x="38" y="822">по смыслу: готового рецепта сводка не обещает, это не создатель волшебных таблеток</text></g>
<g class="a e18"><rect class="bxb" x="24" y="162" width="670" height="26" rx="13"/><text class="sm tk c" x="359" y="180">игрушечный инспектор из нашей лаборатории, не настоящее оборудование</text></g>
</svg>
