.v07-s10-five-points .fa{fill:var(--tint);stroke:none}.v07-s10-five-points .fr{fill:var(--rejt);stroke:none}.v07-s10-five-points .fb{fill:var(--ambt);stroke:none}.v07-s10-five-points .fo{fill:var(--okt);stroke:none}
