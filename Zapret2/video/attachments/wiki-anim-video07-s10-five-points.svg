<rect class="bg" x="0" y="0" width="960" height="560"/>
<g><text class="cap" x="10" y="24">Что помнить из первой части выпуска</text></g>
<g class="a e1"><rect class="bx" x="10" y="40" width="940" height="66" rx="8"/><circle class="bxa" cx="30" cy="73" r="11"/><text class="sm tk c ns" x="30" y="78">1</text><text class="tk ns" x="52" y="68">Три задачи подделки</text><text class="sm mu ns" x="52" y="91">правдоподобие, отказ получателя, безвредность</text><path class="lm" d="M506 50L506 96"/><text class="sm ns" x="522" y="68">проверено против игрушки на входе в роутер 1</text><text class="sm ns" x="522" y="91">и против одного получателя: сервера на Linux</text></g>
<g class="a e2"><rect class="bx" x="10" y="114" width="940" height="66" rx="8"/><circle class="bxr" cx="30" cy="147" r="11"/><text class="sm tk c ns" x="30" y="152">2</text><text class="tk ns" x="52" y="142">Без условия подделка ломает соединение</text><text class="sm mu ns" x="52" y="165">игрушка обманута, сервер принял подделку за данные</text><path class="lm" d="M506 124L506 170"/><text class="sm ns" x="522" y="142">клиент отправил 250 байт, сервер подтвердил 681</text><text class="sm ns" x="522" y="165">то есть принял 680; ответа клиент не получил</text></g>
<g class="a e3"><rect class="bx" x="10" y="188" width="940" height="66" rx="8"/><circle class="bxa" cx="30" cy="221" r="11"/><text class="sm tk c ns" x="30" y="226">3</text><text class="tk ns" x="52" y="216">Подделка копирует заголовки настоящего</text><text class="sm mu ns" x="52" y="239">идёт первой, помечена как своя, очередь не видит</text><path class="lm" d="M506 198L506 244"/><text class="sm ns" x="522" y="216">один ip id (191), один номер 1, одно окно 63</text><text class="sm ns" x="522" y="239">отличаются только данные: 680 байт вместо 250</text></g>
<g class="a e4"><rect class="bx" x="10" y="262" width="940" height="66" rx="8"/><circle class="bxo" cx="30" cy="295" r="11"/><text class="sm tk c ns" x="30" y="300">4</text><text class="tk ns" x="52" y="290">Срок жизни кончается на роутере</text><text class="sm mu ns" x="52" y="313">доходит, если срок не меньше роутеров плюс 1</text><path class="lm" d="M506 272L506 318"/><text class="sm ns" x="522" y="290">роутер шлёт ICMP тип 11 «время истекло»</text><text class="sm ns" x="522" y="313">значение вне 0..255: ошибка, подделки нет</text></g>
<g class="a e5"><rect class="bx" x="10" y="336" width="940" height="66" rx="8"/><circle class="bxo" cx="30" cy="369" r="11"/><text class="sm tk c ns" x="30" y="374">5</text><text class="tk ns" x="52" y="364">Длину пути берём из ответа сервера</text><text class="sm mu ns" x="52" y="387">старт 255, 128 или 64 угадываем и вычитаем</text><path class="lm" d="M506 346L506 392"/><text class="sm ns" x="522" y="364">пришёл срок 62, старт 64: 64 − 62 = 2 перехода</text><text class="sm ns" x="522" y="387">нет догадки, нет и числа</text></g>
<g class="a e6"><rect class="bxd" x="10" y="420" width="940" height="100" rx="8"/><text class="cap" x="26" y="444">не проверяли: граница знаний</text><text class="sm mu ns" x="26" y="470">· получатель, кроме Linux 6.18</text><text class="sm mu ns" x="26" y="494">· настоящий инспектор: игрушка лишь модель</text><text class="sm mu ns" x="500" y="470">· асимметричные пути: туда и обратно по-разному</text><text class="sm mu ns" x="500" y="494">· роутер без ICMP или с подменой срока жизни</text></g>
<g class="a e7"><text class="sm tk" x="10" y="540">о настоящем ТСПУ здесь ничего не утверждается: это опыты на игрушке и на нашем сервере</text></g>
</svg>
