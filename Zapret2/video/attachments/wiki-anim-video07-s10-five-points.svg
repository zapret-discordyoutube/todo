<svg xmlns="http://www.w3.org/2000/svg" class="v07-s10-five-points" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v07-s10-five-points-t v07-s10-five-points-d">
<title id="v07-s10-five-points-t">Итог первой части: пять пунктов</title>
<desc id="v07-s10-five-points-d">Итог первой части выпуска в пяти строках: у подделки три задачи; без условия игрушка обманута, но сервер принимает подделку за данные, клиент отправил 250 байт, а сервер подтвердил 681; подделка копирует заголовки настоящего пакета, у обоих один ip id и один номер 1, и идёт первой; срок жизни кончается на роутере, где он равен нулю, и подделка доходит до сервера только при сроке не меньше числа роутеров плюс один; длину пути программа берёт из срока первого ответа сервера, 64 минус 62 дают 2 перехода, а проверяли это только на нашей игрушке и нашем сервере с Linux, и всё, что не проверяли, перечислено серым.</desc>
