<svg xmlns="http://www.w3.org/2000/svg" class="video09-s14-no-inrange-syn-loop" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="video09-s14-no-inrange-syn-loop-t video09-s14-no-inrange-syn-loop-d">
<title id="video09-s14-no-inrange-syn-loop-t">Без входящего диапазона соединение не открывается</title>
<desc id="video09-s14-no-inrange-syn-loop-d">Если убрать диапазон входящих, SYN-ACK не доходит до функции и подтверждение остаётся на единицу меньше, чем ждёт ядро клиента, поэтому клиент пять раз за три секунды отправляет SYN, каждый раз отвечает сбросом на ответ сервера, и сервер не получает ни байта данных.</desc>
