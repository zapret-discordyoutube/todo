<title id="video09-s11-toy-star-and-books-t">Две выдуманные игрушки про лишний байт</title>
<desc id="video09-s11-toy-star-and-books-d">Две выдуманные игрушки: звёздочка между «мос» и «ква» ломает слово для сортировщика, а получатель её вычёркивает, и бухгалтерские книги клиента и сервера расходятся на единицу из-за лишнего байта, пока сервер заранее не запишет, что его счёт начинается на единицу раньше.</desc>
