<svg xmlns="http://www.w3.org/2000/svg" class="v06-s23-two-bytes-ttl1" viewBox="0 0 960 744" width="960" height="744" role="img" aria-labelledby="v06-s23-two-bytes-ttl1-t v06-s23-two-bytes-ttl1-d">
<title id="v06-s23-two-bytes-ttl1-t">tcpseg без drop: два байта и TTL 1</title>
<desc id="v06-s23-two-bytes-ttl1-d">Два опыта с tcpseg без drop: при pos=0,1 на проводе 2@0 и затем оригинал 250@0, сервер отвечает ACK 3 и потом ACK 251 с блоком с 1 по 2, приложение сделало два чтения, 2 и 248 байт; с аргументом ip_ttl=1 добавочный сегмент 105@0 исчезает на роутере, захват на входе роутера его видит, а захваты на выходе роутера и на сервере нет, оригинал 250@0 доходит и соединение обычное, что делает с таким сегментом настоящее оборудование, мы не знаем; проверка: первые 105 байт приходят на сервер дважды, в добавочном сегменте и в оригинале, а приложение получает их один раз, потому что повтор получатель отбрасывает и сообщает о нём дублирующим блоком.</desc>
