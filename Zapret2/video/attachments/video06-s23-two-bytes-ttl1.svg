<g><text class="cap" x="40" y="24">тот же приём: диапазон из двух байт и время жизни 1</text></g>
<g class="a e1"><circle class="bxa" cx="54" cy="54" r="13"/><text class="tk c ns" x="54" y="59">А</text><text class="sm tk" x="76" y="60">pos=0,1: два байта, потом оригинал</text><text class="m fg r" x="920" y="60">tcpseg:pos=0,1</text></g>
<g class="a e2"><text class="mk" x="76" y="98">2@0</text><rect class="bx" x="330" y="82" width="590" height="22" rx="0"/><rect class="bxa" x="330" y="82" width="4.7" height="22" rx="0"/><text class="sm tk" x="346.7" y="98">добавочный сегмент, 2 байта</text></g>
<g class="a e3"><text class="mk" x="76" y="134">250@0</text><rect class="bx" x="330" y="118" width="590" height="22" rx="0"/><rect class="bxb" x="330" y="118" width="590" height="22" rx="0"/><text class="sm tk r" x="912" y="134">оригинал</text></g>
<g class="a e4"><path class="lf" d="M330 172L100.0 172.0"/><polygon class="hf" points="90,172 100.0,167.0 100.0,177.0"/><text class="sm" x="340" y="177">ACK 3: подтверждено 2, жду 3-й</text><path class="lf" d="M330 202L100.0 202.0"/><polygon class="hf" points="90,202 100.0,197.0 100.0,207.0"/><text class="sm" x="340" y="207">ACK 251: подтверждено 250, жду 251-й, и блок [1,3)</text></g>
<g class="a e5"><rect class="bxa" x="40" y="220" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="240">приложение: два чтения, 2 и 248 байт</text></g>
<g class="a e6"><path class="lm" d="M40 266L920 266"/><circle class="bxa" cx="54" cy="288" r="13"/><text class="tk c ns" x="54" y="293">Б</text><text class="sm tk" x="76" y="294">чтобы добавочный сегмент не дошёл: ip_ttl=1</text><text class="m fg r" x="920" y="294">tcpseg:pos=0,midsld:ip_ttl=1</text></g>
<g class="a e7"><rect class="bx" x="40" y="320" width="150" height="110" rx="8"/><text class="sm tk c" x="115" y="342">клиент</text><rect class="bx" x="400" y="320" width="160" height="110" rx="8"/><text class="sm tk c" x="480" y="342">роутер</text><rect class="bx" x="770" y="320" width="150" height="110" rx="8"/><text class="sm tk c" x="845" y="342">сервер</text><text class="ix mu" x="406" y="420">вход</text><text class="ix mu r" x="554" y="420">выход</text></g>
<g class="a e8"><path class="lf" d="M190 404L770 404"/><text class="sm" x="570" y="396">оригинал 250@0, TTL 64</text><path class="lf" d="M740 404L760.0 404.0"/><polygon class="hf" points="770,404 760.0,409.0 760.0,399.0"/></g>
<g class="a e9"><path class="la" d="M190 372L396 372"/><text class="sm" x="194" y="364">добавочный 105@0, TTL 1</text></g>
<g class="a e10"><path class="lr" d="M393 361L415 383M393 383L415 361"/><text class="sm tk rej" x="424" y="377">исчез</text></g>
<g class="a e11"><rect class="bxo" x="40" y="446" width="284" height="56" rx="6"/><text class="sm tk" x="52" y="468">захват: вход роутера</text><text class="sm" x="52" y="490">105@0 с TTL 1 виден</text></g>
<g class="a e12"><rect class="bxr" x="338" y="446" width="284" height="56" rx="6"/><text class="sm tk" x="350" y="468">захват: выход роутера</text><text class="sm" x="350" y="490">добавочного нет</text></g>
<g class="a e13"><rect class="bxr" x="636" y="446" width="284" height="56" rx="6"/><text class="sm tk" x="648" y="468">захват: сервер</text><text class="sm" x="648" y="490">добавочного нет</text></g>
<g class="a e14"><text class="sm tk" x="40" y="528">оригинал доходит, соединение обычное</text></g>
<g class="a e15"><text class="sm mu" x="40" y="550">что с таким сегментом делает настоящее оборудование, мы не знаем</text></g>
<g class="a e16"><path class="lm" d="M40 568L920 568"/><rect class="bxd" x="40" y="578" width="880" height="50" rx="6"/><text class="sm tk" x="52" y="598">проверь себя: опыт без drop, время жизни обычное:</text><text class="sm tk" x="52" y="618">сколько раз первые 105 байт дошли до сервера и сколько до приложения?</text></g>
<g class="a e17"><rect class="bxo" x="40" y="638" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="658">до сервера дважды: в добавочном сегменте и в оригинале</text></g>
<g class="a e18"><rect class="bxa" x="40" y="676" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="696">до приложения один раз: повтор получатель отбросил и сообщил о нём дублирующим блоком</text></g>
