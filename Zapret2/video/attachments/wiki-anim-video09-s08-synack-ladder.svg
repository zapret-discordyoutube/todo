<g class="a e5"><rect class="fb" x="40" y="210" width="880" height="46" rx="6"/><circle class="bxa" cx="56" cy="232" r="12"/><text class="tk c ns" x="56" y="237">2</text><text class="sm tk" x="78" y="227">настоящий SYN, номер тот же</text><text class="ix fg" x="78" y="245">через 0,04 мс · опции и окно как у № 1</text><path class="la" d="M500 230L680.0 237.6"/><polygon class="ha" points="690,238 679.8,242.6 680.2,232.6"/><text class="m fg" x="750" y="227">0,04</text><text class="ix mu" x="750" y="245">id 39080, тот же</text></g>
