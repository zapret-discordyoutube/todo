<g class="a e15"><rect class="bxb" x="490" y="548" width="430" height="118" rx="8"/><text class="sm tk" x="504" y="572">на проводе клиента одна копия</text><text class="ix fg" x="504" y="596">id 39083 на 223,32 мс</text><text class="ix fg" x="504" y="614">id 39082 на проводе нет: дыра в нумерации</text><text class="sm mu" x="504" y="636">похоже на повтор по таймеру: это догадка,</text><text class="sm mu" x="504" y="656">счётчиков ядра не снимали</text></g>
<g class="a e16"><rect class="bxo" x="40" y="678" width="880" height="40" rx="8"/><text class="sm tk" x="54" y="703">приложение сервера: 250 байт одним чтением, ответ SERVER-REPLY</text></g>
</svg>
