<g class="a e12"><text class="sm mu" x="40" y="514">номера относительные, кроме сброса сервера и подтверждения подложного пакета: там настоящий ноль</text></g>
<g class="a e13"><text class="cap" x="40" y="538">что видела сама программа</text></g>
