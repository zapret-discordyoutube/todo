<g><text class="cap" x="40" y="22">ответ раньше вопроса: провод клиента по порядку отправки</text><rect class="pl" x="737.9" y="4" width="182.1" height="24" rx="12"/><text class="sm c" x="829" y="21">выдуманный пример</text></g>
<g class="a e1"><rect class="bx" x="40" y="38" width="880" height="52" rx="8"/><text class="sm" x="54" y="60">игрушка: телефон. кто-то говорит «слышу вас» раньше, чем ему позвонили;</text><text class="sm" x="54" y="80">подслушивающий записывает в протокол: этот человек отвечающий</text></g>
<g class="a e2"><rect class="bxa" x="40" y="100" width="186" height="28" rx="6"/><text class="mk" x="50" y="119">--lua-desync=synack</text><text class="sm mu" x="240" y="120">ответ раньше вопроса, без условий</text></g>
<g class="a e3"><text class="cap c" x="500" y="152">клиент</text><text class="cap c" x="690" y="152">сервер</text><text class="cap" x="750" y="152">мс · IP id</text></g>
