<svg xmlns="http://www.w3.org/2000/svg" class="v09-s08-synack-ladder" viewBox="0 0 960 745" width="960" height="745" role="img" aria-labelledby="v09-s08-synack-ladder-t v09-s08-synack-ladder-d">
<title id="v09-s08-synack-ladder-t">Ответ раньше вопроса на проводе клиента</title>
<desc id="v09-s08-synack-ladder-d">Приём synack на проводе клиента по порядку: подложный SYN-ACK с номером 0, подтверждением 0 и длиной 60 байт, через 0,04 мс настоящий SYN с тем же номером и тем же идентификатором IP, ответ сервера сбросом без флага ACK с окном 0 и номером 0, настоящий SYN-ACK сервера с подтверждением 1 и ACK клиента, а приветствие в 250 байт появляется на проводе только на 223-й миллисекунде, через 212,8 мс после ACK, причём в нумерации IP пропущен один идентификатор, потому что программа увидела две копии приветствия, а на проводе осталась одна, и приложение сервера получило 250 байт.</desc>
