<title id="video08-s06-app-zeros-blind-reader-t">Нули в приложении</title>
<desc id="video08-s06-app-zeros-blind-reader-d">Что прочитало приложение сервера в двух запусках и что увидела игрушечная модель: с условием все 250 клеток настоящие и имя сайта найдено, без условия все 250 байт нулевые, имя не найдено и ненулевых байт 0 из 250; игрушечный читатель, который записывает первое, не нашёл имя ни в одном из шести пакетов, но сервер получил 250 байт, не равных оригиналу, то есть читатель слеп, а данные испорчены; ответ на проверку: без условия дублирующих блоков четыре, с условием их нет, сервер молча выбросил фейки.</desc>
