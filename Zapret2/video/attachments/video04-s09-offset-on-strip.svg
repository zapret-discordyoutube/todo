<svg xmlns="http://www.w3.org/2000/svg" class="v04-s09-offset-on-strip" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="v04-s09-offset-on-strip-t v04-s09-offset-on-strip-d">
<title id="v04-s09-offset-on-strip-t">Метка плюс число: разрез сдвигается на байты</title>
<desc id="v04-s09-offset-on-strip-d">Приветствие в увеличенном виде, байты 94–113: метка host стоит на 97, и host+1 сдвигает разрез на 98; метка endhost стоит на 112, и endhost-1 даёт 111, перед последней буквой имени «m». Внизу настоящий запуск с host+3 и endhost-2: журнал «100 110», на проводе три пакета по 100, 10 и 140 байт, в середине «.example.c».</desc>
