<svg xmlns="http://www.w3.org/2000/svg" class="v03-s10-two-filters" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="v03-s10-two-filters-t v03-s10-two-filters-d">
<title id="v03-s10-two-filters-t">Два фильтра: протокол и вид данных</title>
<desc id="v03-s10-two-filters-d">Две разные опции: filter-l7 это условие профиля про всё соединение (13 настоящих протоколов и слова all, unknown, known), а payload это настройка вызова про один пакет (виды данных empty, unknown, tls_client_hello, quic_initial, http_req и другие); у них разные словари: протоколу tls соответствует вид tls_client_hello, quic это quic_initial, http это http_req.</desc>
<style>.v03-s10-two-filters{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
