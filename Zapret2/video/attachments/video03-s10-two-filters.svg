<g class="a e1"><text class="cap" x="10" y="24">два разных условия: фильтр протокола и фильтр вида данных</text></g>
<g class="a e2"><rect class="bxa" x="10" y="38" width="460" height="100" rx="8"/><text class="ml acc" x="26" y="68">filter-l7</text><text class="sm mu" x="142" y="68">читается «фильтр эл семь»</text><text class="tk" x="26" y="96">условие ПРОФИЛЯ</text><text class="sm" x="26" y="120">про всё соединение: протокол tls, http, quic…</text></g>
<g class="a e3"><rect class="bxb" x="490" y="38" width="460" height="100" rx="8"/><text class="ml amb" x="506" y="68">payload</text><text class="sm mu" x="606" y="68">фильтр вида данных</text><text class="tk" x="506" y="96">настройка ВЫЗОВА</text><text class="sm" x="506" y="120">про один пакет: вид данных tls_client_hello…</text></g>
<g class="a e4"><text class="cap" x="10" y="166">значения filter-l7</text></g>
<g class="a e5"><rect class="bxa" x="10" y="178" width="53" height="26" rx="6"/><text class="m c" x="36.5" y="196">http</text><rect class="bxa" x="70.9178125" y="178" width="44" height="26" rx="6"/><text class="m c" x="93.0" y="196">tls</text><rect class="bxa" x="123.106171875" y="178" width="53" height="26" rx="6"/><text class="m c" x="149.6" y="196">dtls</text><rect class="bxa" x="184.023984375" y="178" width="53" height="26" rx="6"/><text class="m c" x="210.5" y="196">quic</text><rect class="bxa" x="244.941796875" y="178" width="97" height="26" rx="6"/><text class="m c" x="293.2" y="196">wireguard</text><rect class="bxa" x="349.506875" y="178" width="44" height="26" rx="6"/><text class="m c" x="371.6" y="196">dht</text><rect class="bxa" x="10" y="212" width="79" height="26" rx="6"/><text class="m c" x="49.6" y="230">discord</text><rect class="bxa" x="97.106171875" y="212" width="53" height="26" rx="6"/><text class="m c" x="123.6" y="230">stun</text><rect class="bxa" x="158.023984375" y="212" width="53" height="26" rx="6"/><text class="m c" x="184.5" y="230">xmpp</text><rect class="bxa" x="218.941796875" y="212" width="44" height="26" rx="6"/><text class="m c" x="241.0" y="230">dns</text><rect class="bxa" x="271.13015625" y="212" width="79" height="26" rx="6"/><text class="m c" x="310.7" y="230">mtproto</text><rect class="bxa" x="358.236328125" y="212" width="35" height="26" rx="6"/><text class="m c" x="376.0" y="230">bt</text><rect class="bxa" x="10" y="246" width="70" height="26" rx="6"/><text class="m c" x="45.2" y="264">utp_bt</text></g>
<g class="a e6"><text class="sm mu" x="10" y="294">13 настоящих протоколов и три служебных слова:</text></g>
<g class="a e7"><rect class="bxd" x="10" y="304" width="44" height="26" rx="6"/><text class="m c" x="32.0" y="322">all</text><text class="sm" x="66" y="322">любой</text></g>
<g class="a e8"><rect class="bxd" x="10" y="336" width="79" height="26" rx="6"/><text class="m c" x="49.5" y="354">unknown</text><text class="sm" x="101" y="354">пока неизвестно</text></g>
<g class="a e9"><rect class="bxd" x="10" y="368" width="62" height="26" rx="6"/><text class="m c" x="41.0" y="386">known</text><text class="sm" x="84" y="386">любой известный</text></g>
<g class="a e10"><text class="cap" x="490" y="166">значения payload</text></g>
<g class="a e11"><rect class="bxb" x="490" y="178" width="62" height="26" rx="6"/><text class="m c" x="521.0" y="196">empty</text><text class="sm" x="566" y="196">пакет без данных (SYN, ACK)</text></g>
<g class="a e12"><rect class="bxb" x="490" y="210" width="79" height="26" rx="6"/><text class="m c" x="529.5" y="228">unknown</text><text class="sm" x="583" y="228">данные есть, но не опознаны</text></g>
<g class="a e13"><rect class="bxb" x="490" y="242" width="158" height="26" rx="6"/><text class="m c" x="569.0" y="260">tls_client_hello</text><text class="sm" x="662" y="260">клиентское приветствие TLS</text></g>
<g class="a e14"><rect class="bxb" x="490" y="274" width="123" height="26" rx="6"/><text class="m c" x="551.5" y="292">quic_initial</text><rect class="bxb" x="621" y="274" width="88" height="26" rx="6"/><text class="m c" x="665.0" y="292">http_req</text><text class="sm" x="723" y="292">и другие виды</text></g>
<g class="a e15"><rect class="bxb" x="490" y="306" width="44" height="26" rx="6"/><text class="m c" x="512.0" y="324">all</text><text class="sm" x="548" y="324">любые</text></g>
<g class="a e16"><rect class="bxb" x="490" y="338" width="62" height="26" rx="6"/><text class="m c" x="521.0" y="356">known</text><text class="sm" x="566" y="356">любой опознанный вид</text></g>
<g class="a e17"><text class="cap" x="10" y="428">два словаря: протокол соединения и вид данных пакета</text></g>
