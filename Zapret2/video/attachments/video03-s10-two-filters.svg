<g class="a e19"><rect class="bxa" x="328" y="440" width="53" height="26" rx="6"/><text class="m c" x="354.5" y="458">quic</text><path class="lf" d="M387 453L411.0 453.0"/><polygon class="hf" points="421,453 411.0,458.0 411.0,448.0"/><rect class="bxb" x="427" y="440" width="123" height="26" rx="6"/><text class="m c" x="488.5" y="458">quic_initial</text></g>
<g class="a e20"><rect class="bxa" x="646" y="440" width="53" height="26" rx="6"/><text class="m c" x="672.5" y="458">http</text><path class="lf" d="M705 453L729.0 453.0"/><polygon class="hf" points="739,453 729.0,458.0 729.0,448.0"/><rect class="bxb" x="745" y="440" width="88" height="26" rx="6"/><text class="m c" x="789.0" y="458">http_req</text></g>
<g class="a e21"><text class="sm mu" x="10" y="496">Названия видов данных: файл config.default, строки 88-90. Несколько значений пишут через запятую.</text></g>
<g class="a e22"><text class="tk" x="10" y="524">Два словаря, и путать их не нужно.</text></g>
</svg>
