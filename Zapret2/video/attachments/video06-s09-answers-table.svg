<g><text class="cap" x="40" y="24">что мы знаем: карточка стратегии и ответы получателя</text></g>
<g><rect class="bx" x="40" y="36" width="168" height="30" rx="15"/><text class="sm c mu" x="124" y="56">ворота</text></g>
<g class="a e1"><rect class="bxa" x="40" y="36" width="168" height="30" rx="15"/><text class="sm c tk" x="124" y="56">ворота</text></g>
<g><rect class="bx" x="218" y="36" width="168" height="30" rx="15"/><text class="sm c mu" x="302" y="56">позиции</text></g>
<g class="a e2"><rect class="bxa" x="218" y="36" width="168" height="30" rx="15"/><text class="sm c tk" x="302" y="56">позиции</text></g>
<g><rect class="bx" x="396" y="36" width="168" height="30" rx="15"/><text class="sm c mu" x="480" y="56">цикл с конца</text></g>
<g class="a e3"><rect class="bxa" x="396" y="36" width="168" height="30" rx="15"/><text class="sm c tk" x="480" y="56">цикл с конца</text></g>
<g><rect class="bx" x="574" y="36" width="168" height="30" rx="15"/><text class="sm c mu" x="658" y="56">вердикт</text></g>
<g class="a e4"><rect class="bxa" x="574" y="36" width="168" height="30" rx="15"/><text class="sm c tk" x="658" y="56">вердикт</text></g>
<g><rect class="bx" x="752" y="36" width="168" height="30" rx="15"/><text class="sm c mu" x="836" y="56">ответ получателя</text></g>
<g class="a e5"><rect class="bxa" x="752" y="36" width="168" height="30" rx="15"/><text class="sm c tk" x="836" y="56">ответ получателя</text></g>
<g class="a e6"><text class="cap" x="40" y="94">опыт</text><text class="cap" x="300" y="94">что ответил сервер</text><text class="cap" x="742" y="94">приложение</text></g>
<g class="a e7"><rect class="bx" x="40" y="102" width="880" height="52" rx="5"/><text class="sm tk" x="52" y="124">пакет без изменений</text><text class="sm mu" x="52" y="144">точка отсчёта</text><path class="lm" d="M290 108L290 148M730 108L730 148"/><text class="sm" x="302" y="124">ACK 251</text><text class="sm tk" x="742" y="124">250 байт</text><text class="sm" x="742" y="144">одно чтение</text></g>
<g class="a e8"><rect class="bx" x="40" y="160" width="880" height="52" rx="5"/><text class="sm tk" x="52" y="182">multisplit, по порядку</text><text class="sm mu" x="52" y="202">куски 104 и 146</text><path class="lm" d="M290 166L290 206M730 166L730 206"/><text class="sm" x="302" y="182">ACK 105, блока нет</text><text class="sm tk" x="742" y="182">два чтения:</text><text class="sm" x="742" y="202">104 и 146 байт</text></g>
<g class="a e9"><rect class="bx" x="40" y="218" width="880" height="52" rx="5"/><text class="sm tk" x="52" y="240">multidisorder, два куска</text><text class="sm mu" x="52" y="260">куски 146 и 104</text><path class="lm" d="M290 224L290 264M730 224L730 264"/><text class="sm" x="302" y="240">ACK 1 и блок [105,251)</text><text class="sm" x="302" y="260">потом ACK 251</text><text class="sm tk" x="742" y="240">250 байт</text><text class="sm" x="742" y="260">одно чтение</text></g>
<g class="a e10"><rect class="bx" x="40" y="276" width="880" height="52" rx="5"/><text class="sm tk" x="52" y="298">пять кусков</text><text class="sm mu" x="52" y="318">138, 8, 7, 95 и 2</text><path class="lm" d="M290 282L290 322M730 282L730 322"/><text class="sm" x="302" y="298">четыре ACK 1, блок растёт влево:</text><text class="sm" x="302" y="318">113, 105, 98 и 3; потом ACK 251</text><text class="sm tk" x="742" y="298">250 байт</text><text class="sm" x="742" y="318">одно чтение</text></g>
<g class="a e11"><rect class="bx" x="40" y="334" width="880" height="52" rx="5"/><text class="sm tk" x="52" y="356">nodrop</text><text class="sm mu" x="52" y="376">оригинал идёт следом</text><path class="lm" d="M290 340L290 380M730 340L730 380"/><text class="sm" x="302" y="356">как в двух кусках, а в конце лишний</text><text class="sm" x="302" y="376">ACK 251 с блоком [1,251): дублирующий SACK</text><text class="sm tk" x="742" y="356">250 байт</text><text class="sm" x="742" y="376">один раз</text></g>
<g class="a e12"><rect class="bx" x="40" y="392" width="880" height="52" rx="5"/><text class="sm tk" x="52" y="414">потеряно начало</text><text class="sm mu" x="52" y="434">ждём повторную отправку</text><path class="lm" d="M290 398L290 438M730 398L730 438"/><text class="sm" x="302" y="414">ACK 1 и блок [105,251); потом ACK 1 с двумя</text><text class="sm" x="302" y="434">одинаковыми блоками (дубль); потом ACK 251</text><text class="sm tk" x="742" y="414">250 байт,</text><text class="sm" x="742" y="434">но после повтора</text></g>
<g class="a e13"><text class="sm tk" x="40" y="472">проверь себя: в какой строке запрос получен позже всех, а в какой его читали двумя чтениями?</text></g>
<g class="a e14"><rect class="bxn" x="38" y="390" width="884" height="56" rx="6"/></g>
<g class="a e15"><rect class="bxn" x="38" y="158" width="884" height="56" rx="6"/></g>
<g class="a e16"><rect class="bxo" x="40" y="484" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="504">позже всех: потеряно начало (ждали повтор); двумя чтениями: куски шли по порядку, multisplit</text></g>
<g class="a e17"><rect class="bxb" x="40" y="528" width="430" height="66" rx="6"/><text class="sm tk" x="52" y="550">измерен один получатель: сервер лаборатории</text><text class="sm" x="52" y="570">на Linux, ядро 6.18; Windows, BSD и другие</text><text class="sm" x="52" y="588">системы не проверялись</text></g>
<g class="a e18"><rect class="bxb" x="490" y="528" width="430" height="66" rx="6"/><text class="sm tk" x="502" y="550">настоящее оборудование не измерялось</text><text class="sm" x="502" y="570">писари из игрушки выдуманы; о настоящем ТСПУ</text><text class="sm" x="502" y="588">мы ничего не знаем</text></g>
</svg>
