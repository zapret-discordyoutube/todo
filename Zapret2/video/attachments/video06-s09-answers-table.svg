<svg xmlns="http://www.w3.org/2000/svg" class="v06-s09-answers-table" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="v06-s09-answers-table-t v06-s09-answers-table-d">
<title id="v06-s09-answers-table-t">Ответы получателя одной таблицей</title>
<desc id="v06-s09-answers-table-d">Карточка стратегии multidisorder из пяти окошек (ворота, позиции, цикл с конца, вердикт, ответ получателя) и таблица ответов получателя в нашем тесте по шести опытам: пакет без изменений даёт ACK 251 и одно чтение в 250 байт; multisplit по порядку даёт ACK 105 без блока и два чтения по 104 и 146 байт; multidisorder на два куска даёт ACK 1 с блоком с 105 и потом ACK 251, одно чтение; пять кусков дают четыре ACK 1 с растущим блоком и потом ACK 251, одно чтение; с nodrop в конце приходит лишний ACK 251 с блоком ниже подтверждения, это дублирующий SACK первой формы, а приложение получает 250 байт один раз; если потеряно начало, приложение получает 250 байт только после повтора, и в ответах есть дублирующий блок; позже всех запрос получила строка с потерянным началом, а двумя чтениями читала строка с multisplit; внизу границы: измерен один получатель, сервер лаборатории на Linux 6.18, а Windows, BSD и другие системы не проверялись, и о настоящем оборудовании мы ничего не знаем.</desc>
