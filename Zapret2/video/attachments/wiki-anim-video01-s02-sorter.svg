.v01-s02-sorter .belt{fill:var(--line);stroke:var(--mute);stroke-width:1.2}
.v01-s02-sorter .ln{stroke-dasharray:100}
.v01-s02-sorter .hd-a{fill:var(--acc)}
.v01-s02-sorter .hd-f{fill:var(--fg2)}
.v01-s02-sorter .hd-r{fill:var(--rej)}
.v01-s02-sorter .dot{fill:var(--acc)}
.v01-s02-sorter .ring{fill:var(--bg);stroke:var(--acc);stroke-width:2.2}
.v01-s02-sorter .beam{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}
.v01-s02-sorter .a{animation-duration:20s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v01-s02-sorter .a{animation:none}.v01-s02-sorter .tr{display:none}}
figure.v01-s02-sorter-fig{margin:1.6rem 0;overflow-x:auto}figure.v01-s02-sorter-fig>svg{display:block;width:100%;min-width:680px;height:auto}
