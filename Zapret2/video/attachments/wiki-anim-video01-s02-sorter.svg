.v01-s02-sorter .bxg{fill:var(--line);stroke:var(--mute);stroke-width:1.2}
.v01-s02-sorter .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 4}
.v01-s02-sorter .bxbg{fill:var(--bg);stroke:none}
.v01-s02-sorter .lf{fill:none;stroke:var(--line);stroke-width:1.4}
.v01-s02-sorter .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v01-s02-sorter .lmd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 5}
