<svg xmlns="http://www.w3.org/2000/svg" class="v02-s03-rewrite" viewBox="0 0 960 466" width="960" height="466" role="img" aria-labelledby="v02-s03-rewrite-t v02-s03-rewrite-d">
<title id="v02-s03-rewrite-t">Роутер заменяет Ethernet целиком</title>
<desc id="v02-s03-rewrite-d">Один и тот же пакет (IP id 64005) на входе и на выходе роутера: заголовок Ethernet заменён целиком, получатель 16:4d:c6:0e:f9:12 стал ae:99:ff:5f:98:e9, отправитель fe:02:bf:2a:aa:17 стал 2e:9b:9b:dc:7e:f6, ни один байт адресов не совпал; в IP изменились только время жизни (64 на 63) и контрольная сумма (2bbf на 2cbf), а TCP и данные те же; MAC-адреса в нашем стенде создаются заново при каждом запуске, устойчива структура 6 + 6 + 2 байта.</desc>
