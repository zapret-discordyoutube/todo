<g><text class="cap" x="40" y="26">пятое условие: флаги TCP, у каждого флага свой разряд</text></g>
<g class="a e1"><text class="cap c" x="67" y="56">ACK</text><text class="cap c" x="125" y="56">PSH</text><text class="cap c" x="183" y="56">RST</text><text class="cap c" x="241" y="56">SYN</text><text class="cap c" x="299" y="56">FIN</text></g>
<g class="a e2"><rect class="bxa" x="40" y="64" width="54" height="36" rx="4"/><text class="mk c" x="67" y="89">1</text><rect class="bxa" x="98" y="64" width="54" height="36" rx="4"/><text class="mk c" x="125" y="89">1</text><rect class="bx" x="156" y="64" width="54" height="36" rx="4"/><text class="mk c" x="183" y="89">0</text><rect class="bx" x="214" y="64" width="54" height="36" rx="4"/><text class="mk c" x="241" y="89">0</text><rect class="bx" x="272" y="64" width="54" height="36" rx="4"/><text class="mk c" x="299" y="89">0</text></g>
<g class="a e3"><text class="ix c" x="67" y="120">16</text><text class="ix c" x="125" y="120">8</text><text class="ix c" x="183" y="120">4</text><text class="ix c" x="241" y="120">2</text><text class="ix c" x="299" y="120">1</text></g>
<g class="a e4"><text class="tk sm" x="350" y="78">у приветствия клиента два флага: PSH и ACK</text><text class="sm" x="350" y="100">PSH значит «передай данные приложению сразу»</text><text class="sm" x="350" y="122">ACK значит «в пакете есть подтверждение»</text></g>
<g class="a e5"><text class="tk sm" x="40" y="150">разряды: FIN 1, SYN 2, RST 4, PSH 8, ACK 16; вместе у приветствия 8 + 16 = 24</text></g>
<g class="a e6"><text class="cap" x="40" y="184">lua/zapret-lib.lua: снять флаги</text></g>
<g class="a e7"><rect class="bx" x="40" y="194" width="880" height="30" rx="4"/><text class="ix" x="52" y="214">996</text><text class="m" x="92" y="214">if fooling_options.tcp_flags_unset then</text></g>
<g class="a e8"><rect class="bxa" x="40" y="224" width="880" height="30" rx="4"/><text class="ix" x="52" y="244">997</text><text class="mn" x="92" y="244">dis.tcp.th_flags = bitand(dis.tcp.th_flags, bitnot(parse_tcp_flags(fooling_options.tcp_flags_unset)))</text></g>
<g class="a e9"><text class="cap" x="40" y="282">пример: tcp_flags_unset=ack</text></g>
<g class="a e10"><rect class="bx" x="40" y="294" width="54" height="36" rx="4"/><text class="mk c" x="67" y="319">1</text><rect class="bx" x="98" y="294" width="54" height="36" rx="4"/><text class="mk c" x="125" y="319">0</text><rect class="bx" x="156" y="294" width="54" height="36" rx="4"/><text class="mk c" x="183" y="319">0</text><rect class="bx" x="214" y="294" width="54" height="36" rx="4"/><text class="mk c" x="241" y="319">0</text><rect class="bx" x="272" y="294" width="54" height="36" rx="4"/><text class="mk c" x="299" y="319">0</text><text class="sm" x="344" y="318">имя ack, число 16: маска</text></g>
<g class="a e11"><rect class="bx" x="40" y="340" width="54" height="36" rx="4"/><text class="mk c" x="67" y="365">0</text><rect class="bx" x="98" y="340" width="54" height="36" rx="4"/><text class="mk c" x="125" y="365">1</text><rect class="bx" x="156" y="340" width="54" height="36" rx="4"/><text class="mk c" x="183" y="365">1</text><rect class="bx" x="214" y="340" width="54" height="36" rx="4"/><text class="mk c" x="241" y="365">1</text><rect class="bx" x="272" y="340" width="54" height="36" rx="4"/><text class="mk c" x="299" y="365">1</text><text class="sm" x="344" y="364">перевернули биты маски</text></g>
<g class="a e12"><rect class="bxa" x="40" y="386" width="54" height="36" rx="4"/><text class="mk c" x="67" y="411">1</text><rect class="bxa" x="98" y="386" width="54" height="36" rx="4"/><text class="mk c" x="125" y="411">1</text><rect class="bx" x="156" y="386" width="54" height="36" rx="4"/><text class="mk c" x="183" y="411">0</text><rect class="bx" x="214" y="386" width="54" height="36" rx="4"/><text class="mk c" x="241" y="411">0</text><rect class="bx" x="272" y="386" width="54" height="36" rx="4"/><text class="mk c" x="299" y="411">0</text><text class="sm" x="344" y="410">флаги подделки, 24</text></g>
<g class="a e13"><rect class="bx" x="40" y="432" width="54" height="36" rx="4"/><text class="mk c" x="67" y="457">0</text><rect class="bxo" x="98" y="432" width="54" height="36" rx="4"/><text class="mk c" x="125" y="457">1</text><rect class="bx" x="156" y="432" width="54" height="36" rx="4"/><text class="mk c" x="183" y="457">0</text><rect class="bx" x="214" y="432" width="54" height="36" rx="4"/><text class="mk c" x="241" y="457">0</text><rect class="bx" x="272" y="432" width="54" height="36" rx="4"/><text class="mk c" x="299" y="457">0</text><text class="sm" x="344" y="456">логическое «и»: осталось 8, один PSH</text></g>
<g class="a e14"><path class="lf" d="M40 427L326 427"/></g>
<g class="a e15"><text class="sm" x="40" y="498">проверь себя: tcp_flags_unset=ack,psh даёт 24 - 24 = 0, поле флагов пустое</text><text class="sm" x="40" y="520">неизвестное имя флага вызывает ошибку: tcp flag 'BOGUS' is invalid (lua/zapret-lib.lua:656)</text><text class="sm mu" x="40" y="542">обратный аргумент tcp_flags_set только включает флаги; на проводе не запускался</text></g>
</svg>
