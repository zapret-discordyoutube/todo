<svg xmlns="http://www.w3.org/2000/svg" class="v07-s18-flag-bits-and-mask" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v07-s18-flag-bits-and-mask-t v07-s18-flag-bits-and-mask-d">
<title id="v07-s18-flag-bits-and-mask-t">Разряды флагов и маска снятия флага</title>
<desc id="v07-s18-flag-bits-and-mask-d">Флаги TCP это разряды одного поля: FIN 1, SYN 2, RST 4, PSH 8, ACK 16, у приветствия клиента стоят PSH и ACK, вместе 24, а аргумент tcp_flags_unset в строке 997 файла lua/zapret-lib.lua превращает имена в маску, переворачивает её биты и накладывает логическое «и», например ACK это 10000, после переворота 01111, и наложенная на 11000 она оставляет 01000, то есть один PSH.</desc>
<style>.v07-s18-flag-bits-and-mask{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
