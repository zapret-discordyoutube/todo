<rect class="bg" x="0" y="0" width="960" height="636"/>
<g><text class="cap" x="40" y="24">повторы клиента · опыт с правилом, которое выбрасывает пакет с именем на месте 97</text></g>
<g class="a e1"><rect class="bxb" x="40" y="36" width="880" height="34" rx="8"/><text class="sm" x="54" y="58">то же игрушечное правило: выбрасывает пакет, у которого на месте 97 лежит имя сайта</text></g>
<g class="a e2"><text class="sm tk" x="40" y="96">pos=endhost: приветствие 250 байт режется после имени</text><rect class="bxa" x="40" y="106" width="336" height="30" rx="0"/><rect class="bxr" x="331" y="106" width="45" height="30" rx="0"/><text class="ix c" x="353.5" y="126">имя</text><text class="sm" x="48" y="126">часть 1: 112</text><rect class="bxo" x="376" y="106" width="414" height="30" rx="0"/><text class="sm" x="390" y="126">часть 2: 138</text></g>
<g class="a e3"><text class="sm" x="40" y="158">часть 1 с именем на своём месте: правило выбрасывает её, часть 2 проходит</text></g>
<g class="a e4"><rect class="bx" x="40" y="172" width="430" height="66" rx="8"/><text class="sm tk" x="54" y="194">сервер отвечает: жду байт 1,</text><text class="sm" x="54" y="212">вторая половина, байты 113–250, у меня</text><text class="ix mu" x="54" y="229">ядро клиента потом шлёт оригинал снова</text></g>
<g class="a e5"><rect class="bx" x="490" y="172" width="430" height="66" rx="8"/><text class="sm tk" x="504" y="194">копия приходит в программу как новый пакет</text><text class="sm" x="504" y="212">multisplit не помнит, что уже резал: режет снова</text><text class="ix mu" x="504" y="229">журнал: шесть раз sending part 1 0-111 len=112</text></g>
<g class="a e6"><text class="cap" x="40" y="270">с nfqws2, шесть пар 1+112 и 113+138 · мс от первой пары · промежутки над осью</text></g>
<g class="a e7"><path class="lm" d="M60 340L900 340"/><rect class="bxa" x="52.0" y="316" width="8" height="22"/><rect class="bxo" x="60.0" y="316" width="8" height="22"/><text class="ix c" x="60" y="360">0</text><rect class="bxa" x="101.4" y="316" width="8" height="22"/><rect class="bxo" x="109.4" y="316" width="8" height="22"/><text class="ix c" x="109.4" y="360">205</text><rect class="bxa" x="151.6" y="316" width="8" height="22"/><rect class="bxo" x="159.6" y="316" width="8" height="22"/><text class="ix c" x="159.6" y="360">413</text><rect class="bxa" x="256.8" y="316" width="8" height="22"/><rect class="bxo" x="264.8" y="316" width="8" height="22"/><text class="ix c" x="264.8" y="360">849</text><rect class="bxa" x="457.4" y="316" width="8" height="22"/><rect class="bxo" x="465.4" y="316" width="8" height="22"/><text class="ix c" x="465.4" y="360">1681</text><rect class="bxa" x="858.7" y="316" width="8" height="22"/><rect class="bxo" x="866.7" y="316" width="8" height="22"/><text class="ix c" x="866.7" y="360">3345</text><path class="lmd" d="M68.0 306L101.4 306"/><text class="sm tk c" x="84.7" y="300">205</text><path class="lmd" d="M117.4 306L151.6 306"/><text class="sm tk c" x="134.5" y="300">208</text><path class="lmd" d="M167.6 306L256.8 306"/><text class="sm tk c" x="212.2" y="300">436</text><path class="lmd" d="M272.8 306L457.4 306"/><text class="sm tk c" x="365.1" y="300">832</text><path class="lmd" d="M473.4 306L858.7 306"/><text class="sm tk c" x="666.1" y="300">1664</text></g>
<g class="a e8"><text class="sm tk" x="40" y="392">первые два промежутка почти равны, дальше каждый вдвое длиннее предыдущего</text></g>
<g class="a e9"><text class="cap" x="40" y="430">контроль без nfqws2, копии оригинала 1+250 · те же правило и сервер</text></g>
<g class="a e10"><path class="lm" d="M60 500L900 500"/><rect class="bxs" x="55.0" y="476" width="10" height="22"/><text class="ix c" x="60" y="520">0</text><rect class="bxs" x="104.7" y="476" width="10" height="22"/><text class="ix c" x="109.7" y="520">206</text><rect class="bxs" x="154.8" y="476" width="10" height="22"/><text class="ix c" x="159.8" y="520">414</text><rect class="bxs" x="256.1" y="476" width="10" height="22"/><text class="ix c" x="261.1" y="520">834</text><rect class="bxs" x="455.8" y="476" width="10" height="22"/><text class="ix c" x="460.8" y="520">1662</text><rect class="bxs" x="857.2" y="476" width="10" height="22"/><text class="ix c" x="862.2" y="520">3326</text><path class="lmd" d="M68.0 466L101.7 466"/><text class="sm tk c" x="84.8" y="460">206</text><path class="lmd" d="M117.7 466L151.8 466"/><text class="sm tk c" x="134.8" y="460">208</text><path class="lmd" d="M167.8 466L253.1 466"/><text class="sm tk c" x="210.5" y="460">420</text><path class="lmd" d="M269.1 466L452.8 466"/><text class="sm tk c" x="361" y="460">828</text><path class="lmd" d="M468.8 466L854.2 466"/><text class="sm tk c" x="661.5" y="460">1664</text></g>
<g class="a e11"><text class="sm" x="40" y="550">расписание очень похожее: третий промежуток 420 против 436</text><text class="sm mu" x="40" y="570">по общим сведениям, это обычная задержка повторов TCP с удвоением</text></g>
<g class="a e12"><rect class="bxr" x="40" y="584" width="880" height="36" rx="6"/><text class="sm tk" x="54" y="607">счётчик правила 6; приложение сервера прочитало 0 байт; клиент без ответа</text></g>
</svg>
