<svg xmlns="http://www.w3.org/2000/svg" class="v05-s24-retry-schedule" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="v05-s24-retry-schedule-t v05-s24-retry-schedule-d">
<title id="v05-s24-retry-schedule-t">Повторы клиента и расписание</title>
<desc id="v05-s24-retry-schedule-d">Повторы клиента при игрушечном правиле, которое выбрасывает пакет с именем на смещении 97: при pos=endhost имя целиком остаётся в первой части из 112 байт и правило её выбрасывает, сервер отвечает, что ждёт первый байт, а вторая половина у него уже есть, поэтому клиентское ядро позже отправляет оригинал снова, он приходит в программу через очередь как новый пакет, и multisplit, не помнящий, что уже резал это приветствие, режет его заново, в журнале шесть раз sending part 1; в нашем тесте шесть пар 1+112 и 113+138 уходят на отметках 0, 205, 413, 849, 1681 и 3345 мс с промежутками 205, 208, 436, 832 и 1664 мс, первые два почти равны, дальше каждый вдвое длиннее, счётчик правила 6, приложение сервера прочитало 0 байт, клиент остался без ответа; в контрольном опыте без nfqws2 копии 1+250 уходят на отметках 0, 206, 414, 834, 1662 и 3326 мс с промежутками 206, 208, 420, 828 и 1664, расписание очень похожее, и по общим сведениям это обычная задержка повторов TCP с удвоением.</desc>
<style>.v05-s24-retry-schedule{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
