<g class="a e14"><rect class="bx" x="24" y="272" width="912" height="34" rx="6"/><circle class="bx" cx="44" cy="289" r="11"/><text class="tk c ns" x="44" y="294">1</text><text class="sm" x="70" y="294">байты 0–1</text><text class="sm tk" x="210" y="294">2 байта</text><text class="sm" x="310" y="294">самое начало пакета, далеко от имени</text></g>
<g class="a e15"><rect class="bx" x="24" y="312" width="912" height="34" rx="6"/><circle class="bx" cx="44" cy="329" r="11"/><text class="tk c ns" x="44" y="334">2</text><text class="sm" x="70" y="334">байты 2–96</text><text class="sm tk" x="210" y="334">95 байт</text><text class="sm" x="310" y="334">всё до имени сайта</text></g>
<g class="a e16"><rect class="bxa" x="24" y="352" width="912" height="34" rx="6"/><circle class="bx" cx="44" cy="369" r="11"/><text class="tk c ns" x="44" y="374">3</text><text class="sm" x="70" y="374">байты 97–103</text><text class="sm tk" x="210" y="374">7 байт</text><text class="lgk" x="310" y="374">77 77 77 2E 65 78 61</text><text class="m tk" x="580" y="374">«www.exa»</text><text class="sm mu" x="740" y="374">часть имени сайта</text></g>
<g class="a e17"><rect class="bxo" x="24" y="392" width="912" height="34" rx="6"/><circle class="bx" cx="44" cy="409" r="11"/><text class="tk c ns" x="44" y="414">4</text><text class="sm" x="70" y="414">байты 104–111</text><text class="sm tk" x="210" y="414">8 байт</text><text class="lgk" x="310" y="414">6D 70 6C 65 2E 63 6F 6D</text><text class="m tk" x="580" y="414">«mple.com»</text><text class="sm mu" x="740" y="414">часть имени сайта</text></g>
<g class="a e18"><rect class="bx" x="24" y="432" width="912" height="34" rx="6"/><circle class="bx" cx="44" cy="449" r="11"/><text class="tk c ns" x="44" y="454">5</text><text class="sm" x="70" y="454">байты 112–249</text><text class="sm tk" x="210" y="454">138 байт</text><text class="sm" x="310" y="454">остальное приветствие</text></g>
<g class="a e19"><rect class="bxo" x="24" y="480" width="912" height="72" rx="8"/><text class="sm tk" x="40" y="508">сервер всё равно получил 250 байт, принятый поток равен исходному</text><text class="lgk" x="40" y="536">SERVER conn 1 total 250 chunks [(2, 2), (95, 97), (7, 104), (8, 112), (138, 250)]</text><circle class="bxo" cx="906" cy="508" r="13"/><path class="lo" d="M901 508L904.5 512L911 504" style="stroke-linecap:round;stroke-linejoin:round"/></g>
<g class="a e20"><text class="sm tk" x="24" y="580">число 2 режет в самом начале, далеко от имени, а метки встали точно на имя</text></g>
