<g class="a e4"><rect class="bxa" x="330" y="70" width="61" height="26" rx="5"/><text class="lgk" x="337" y="88">midsld</text><path class="lf" d="M360.5 98L360.5 112.0"/><polygon class="hf" points="360.5,122 355.5,112.0 365.5,112.0"/><rect class="bxb" x="330" y="124" width="37" height="26" rx="5"/><text class="lgk" x="337" y="142">104</text></g>
<g class="a e5"><rect class="bxa" x="520" y="70" width="69" height="26" rx="5"/><text class="lgk" x="527" y="88">endhost</text><path class="lf" d="M554.5 98L554.5 112.0"/><polygon class="hf" points="554.5,122 549.5,112.0 559.5,112.0"/><rect class="bxb" x="520" y="124" width="37" height="26" rx="5"/><text class="lgk" x="527" y="142">112</text></g>
<g class="a e6"><text class="sm mu" x="660" y="94">в журнале программы:</text><text class="lgk" x="660" y="112">resolved split pos: 2 97 104 112</text><text class="sm tk" x="660" y="142">слова стали числами</text></g>
