<rect class="bg" x="0" y="0" width="960" height="590"/>
<g><text class="cap" x="24" y="24">четыре позиции стали пятью кусками</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><text class="sm tk" x="24" y="58">мы попросили у стратегии multisplit четыре позиции:</text></g>
<g class="a e2"><rect class="bxs" x="24" y="70" width="22" height="26" rx="5"/><text class="lgk" x="31" y="88">2</text><path class="lf" d="M35 98L35.0 112.0"/><polygon class="hf" points="35,122 30.0,112.0 40.0,112.0"/><rect class="bxb" x="24" y="124" width="22" height="26" rx="5"/><text class="lgk" x="31" y="142">2</text></g>
