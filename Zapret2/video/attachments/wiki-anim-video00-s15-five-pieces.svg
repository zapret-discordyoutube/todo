<title id="v00-s15-five-pieces-t">Пять кусков по меткам</title>
<desc id="v00-s15-five-pieces-d">В нашем тесте стратегия multisplit получила четыре позиции, число 2 и метки host, midsld и endhost, программа превратила их в числа 2, 97, 104 и 112 и отправила приветствие пятью кусками по 2, 95, 7, 8 и 138 байт, куски с третьего и четвёртого вместе дают имя сайта целиком, а сервер всё равно получил все 250 байт.</desc>
