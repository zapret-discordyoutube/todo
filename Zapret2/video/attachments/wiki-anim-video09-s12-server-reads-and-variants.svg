<g class="a video09-s12-server-reads-and-variants-k16"><text class="smk c" x="480" y="330">во всех шести запусках хэш равен оригиналу: сервер получил те же 250 байт</text></g>
<g class="a video09-s12-server-reads-and-variants-k17"><text class="sm c" x="480" y="356">флаги в пакете везде PAU; байт в начале и в конце читается одним чтением</text></g>
<g class="a video09-s12-server-reads-and-variants-k18"><rect class="bxs" x="40" y="378" width="880" height="66" rx="8"/><text class="smk" x="56" y="402">три проверенных значения байта, 00, X и 41, наш сервер вынул одинаково.</text><text class="sm mu" x="56" y="426">Как поведут себя другие системы, мы не проверяли.</text></g>
