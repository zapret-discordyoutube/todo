<g class="a video09-s12-server-reads-and-variants-k12"><path class="lm" d="M400 184L910 184"/><text class="mk" x="404" y="172">urp=2</text><text class="mk" x="542" y="172">3</text><text class="sm13" x="658" y="172">00</text><rect class="bxo" x="744" y="158" width="1.5" height="18" rx="2"/><rect class="bxo" x="747" y="158" width="67.94" height="18" rx="2"/><text class="mk" x="820" y="172">[2, 248]</text></g>
<g class="a video09-s12-server-reads-and-variants-k13"><rect class="bxa" x="396" y="188" width="518" height="34" rx="5"/><text class="mk" x="404" y="210">midsld</text><text class="mk" x="542" y="210">105</text><text class="sm13" x="658" y="210">00</text><rect class="bxo" x="744" y="196" width="27.62" height="18" rx="2"/><rect class="bxo" x="773.12" y="196" width="39.38" height="18" rx="2"/><text class="mk" x="820" y="210">[104, 146]</text></g>
