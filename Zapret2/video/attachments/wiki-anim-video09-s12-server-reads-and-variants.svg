<svg xmlns="http://www.w3.org/2000/svg" class="video09-s12-server-reads-and-variants" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="video09-s12-server-reads-and-variants-t video09-s12-server-reads-and-variants-d">
<title id="video09-s12-server-reads-and-variants-t">Что читает сервер при разных местах байта</title>
<desc id="video09-s12-server-reads-and-variants-d">Наш Linux вынимает срочный байт из потока и читает оригинальные 250 байт: при указателе 105 двумя чтениями по 104 и 146 байт, при начале и конце одним чтением на 250, при позиции два чтениями по 2 и 248, и значение байта 00, X или 65 на это не влияет.</desc>
