<g class="a video09-s12-server-reads-and-variants-k1"><text class="cap" x="40" y="24">ответ нашего сервера на Linux: подтверждение и чтения приложения</text></g>
<g class="a video09-s12-server-reads-and-variants-k2"><rect class="bxa" x="40" y="40" width="330" height="262" rx="8"/><text class="tk" x="56" y="66">запуск с midsld</text></g>
<g class="a video09-s12-server-reads-and-variants-k3"><text class="mk" x="56" y="100">подтверждение сервера: 252</text><text class="sm13 mu" x="56" y="120">принял 251 байт, как мы отправили</text></g>
<g class="a video09-s12-server-reads-and-variants-k4"><text class="sm" x="56" y="156">приложение сервера прочитало</text></g>
<g class="a video09-s12-server-reads-and-variants-k5"><rect class="bxo" x="56" y="166" width="124.8" height="30" rx="4"/><text class="mk c" x="118.4" y="186">104</text><rect class="bxo" x="182.8" y="166" width="173.2" height="30" rx="4"/><text class="mk c" x="270.4" y="186">146</text></g>
<g class="a video09-s12-server-reads-and-variants-k6"><text class="sm13 mu" x="56" y="214">два чтения, всего 250 байт</text></g>
<g class="a video09-s12-server-reads-and-variants-k7"><text class="smk ok" x="56" y="244">хэш равен хэшу обычного запуска</text><text class="smk" x="56" y="264">лишний байт вынут из потока</text></g>
<g class="a video09-s12-server-reads-and-variants-k8"><text class="sm13 mu" x="56" y="286">почему чтение режется так, не выясняли</text></g>
<g class="a video09-s12-server-reads-and-variants-k9"><rect class="bx" x="390" y="40" width="530" height="262" rx="8"/><text class="cap" x="404" y="62">запуск</text><text class="cap" x="542" y="62">указатель</text><text class="cap" x="658" y="62">байт</text><text class="cap" x="744" y="62">чтения</text></g>
