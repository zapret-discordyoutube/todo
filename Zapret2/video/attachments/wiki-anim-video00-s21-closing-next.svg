<g class="a e6"><rect class="bxa" x="490" y="44" width="446" height="270" rx="8"/><text class="tk" x="506" y="72">с чего начинать курс</text><rect class="bx" x="506" y="88" width="414" height="52" rx="8"/><text class="tk c" x="713" y="120">«Письмо в сортировочном центре»</text><text class="sm" x="506" y="172">полная история одного запроса</text><text class="sm" x="506" y="196">и наша лаборатория</text><text class="sm tk" x="506" y="246">каждый следующий выпуск опирается</text><text class="sm tk" x="506" y="268">на слова предыдущего</text></g>
