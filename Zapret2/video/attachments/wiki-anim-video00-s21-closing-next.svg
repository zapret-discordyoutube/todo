<g><text class="cap" x="24" y="24">итог выпуска и с чего начинать</text></g>
<g class="a e1"><rect class="bx" x="24" y="44" width="446" height="270" rx="8"/><text class="tk" x="40" y="72">помните три способа говорить</text></g>
<g class="a e2"><rect class="bxa" x="40" y="90" width="79" height="28" rx="14"/><text class="sm tk c" x="79.5" y="109">просто</text><text class="sm" x="40" y="136">прочитано в программе или документации</text></g>
<g class="a e3"><rect class="bxo" x="40" y="146" width="143" height="28" rx="14"/><text class="sm tk c" x="111.5" y="165">в нашем тесте</text><text class="sm" x="40" y="192">измерено в нашей лаборатории</text></g>
<g class="a e4"><rect class="bxb" x="40" y="202" width="201" height="28" rx="14"/><text class="sm tk c" x="140.5" y="221">по общим сведениям</text><text class="sm" x="40" y="248">общее знание, не факт о настоящей системе</text></g>
