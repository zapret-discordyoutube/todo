<svg xmlns="http://www.w3.org/2000/svg" class="v00-s21-closing-next" viewBox="0 0 960 332" width="960" height="332" role="img" aria-labelledby="v00-s21-closing-next-t v00-s21-closing-next-d">
<title id="v00-s21-closing-next-t">Итог и с чего начать</title>
<desc id="v00-s21-closing-next-d">Итог вводного выпуска: помнить три способа говорить, просто, в нашем тесте и по общим сведениям, и правило, ради которого существует весь курс, результат нужно проверять самому, а сам курс начинается с выпуска письмо в сортировочном центре, где рассказана полная история одного запроса и показана наша лаборатория.</desc>
