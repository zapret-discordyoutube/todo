<rect class="bg" x="0" y="0" width="960" height="722"/>
<g class="a e1"><text class="cap" x="10" y="24">диапазон: счётчики и запись границ</text></g>
<g class="a e2"><rect class="bxa" x="10" y="40" width="212" height="70" rx="8"/><text class="ml acc" x="28" y="85">n</text><text class="sm" x="56" y="70">пакет по счёту</text><text class="sm mu" x="56" y="90">(считая текущий)</text></g>
<g class="a e3"><rect class="bxa" x="232" y="40" width="212" height="70" rx="8"/><text class="ml acc" x="250" y="85">d</text><text class="sm" x="278" y="70">пакет с данными</text><text class="sm mu" x="278" y="90">по счёту</text></g>
<g class="a e4"><rect class="bxa" x="454" y="40" width="212" height="70" rx="8"/><text class="ml acc" x="472" y="85">b</text><text class="sm" x="500" y="70">байты данных</text><text class="sm mu" x="500" y="90">(считая текущий)</text></g>
<g class="a e5"><rect class="bxd" x="676" y="40" width="140" height="70" rx="8"/><text class="mk" x="692" y="70">s, p</text><text class="sm mu" x="692" y="90">номера TCP:</text><text class="sm mu" x="692" y="106">не разбираем</text></g>
<g class="a e6"><rect class="bx" x="826" y="40" width="124" height="70" rx="8"/><text class="mk" x="840" y="70">x</text><text class="sm" x="858" y="70">никогда</text><text class="mk" x="840" y="94">a</text><text class="sm" x="858" y="94">всегда</text></g>
<g class="a e7"><text class="sm mu" x="10" y="134">букв счётчиков пять, нам нужны три: n, d, b</text></g>
<g class="a e8"><text class="cap" x="10" y="172">числа нашего запроса: клиентские пакеты по порядку</text></g>
<g class="a e9"><rect class="bx" x="10" y="184" width="190" height="66" rx="8"/><text class="tk" x="24" y="208">SYN</text><text class="mk" x="24" y="234">n 1  d 0  b 0</text></g>
<g class="a e10"><rect class="bx" x="220" y="184" width="190" height="66" rx="8"/><text class="tk" x="234" y="208">ACK</text><text class="mk" x="234" y="234">n 2  d 0  b 0</text><path class="lm" d="M202 217L208.0 217.0"/><polygon class="hm" points="218,217 208.0,222.0 208.0,212.0"/></g>
<g class="a e11"><rect class="bxa" x="430" y="184" width="190" height="66" rx="8"/><text class="tk" x="444" y="208">приветствие</text><text class="mk acc" x="444" y="234">n 3  d 1  b 250</text><path class="lm" d="M412 217L418.0 217.0"/><polygon class="hm" points="428,217 418.0,222.0 418.0,212.0"/></g>
<g class="a e12"><path class="la" d="M624 217L636.0 217.0"/><polygon class="ha" points="646,217 636.0,222.0 636.0,212.0"/><text class="sm" x="654" y="204">в журнале этот пакет под № 4:</text><text class="sm mu" x="654" y="224">журнал считает оба направления,</text><text class="sm mu" x="654" y="244">а n только клиента</text></g>
<g class="a e13"><rect class="bxb" x="10" y="270" width="306" height="98" rx="8"/><text class="tk" x="24" y="294">1. растут до проверки</text><text class="sm" x="24" y="316">текущий пакет уже</text><text class="sm" x="24" y="336">посчитан</text></g>
<g class="a e14"><rect class="bxb" x="327" y="270" width="306" height="98" rx="8"/><text class="tk" x="341" y="294">2. у направлений свои</text><text class="sm" x="341" y="316">в режиме клиента: исходящие</text><text class="sm" x="341" y="336">смотрят на счётчики клиента,</text><text class="sm" x="341" y="356">входящие на счётчики сервера</text></g>
<g class="a e15"><rect class="bxb" x="644" y="270" width="306" height="98" rx="8"/><text class="tk" x="658" y="294">3. считается увиденное</text><text class="sm" x="658" y="316">в лаборатории программе</text><text class="sm" x="658" y="336">отдают первые 12 пакетов</text><text class="sm" x="658" y="356">каждого направления</text></g>
<g class="a e16"><text class="cap" x="10" y="404">как записать диапазон (разбор: nfq2/filter.c:126-171)</text></g>
<g class="a e17"><text class="sm mu" x="150" y="428">пакеты клиента по счёту n:</text></g>
