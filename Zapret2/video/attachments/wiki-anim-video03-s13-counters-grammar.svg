<svg xmlns="http://www.w3.org/2000/svg" class="v03-s13-counters-grammar" viewBox="0 0 960 722" width="960" height="722" role="img" aria-labelledby="v03-s13-counters-grammar-t v03-s13-counters-grammar-d">
<title id="v03-s13-counters-grammar-t">Диапазон: счётчики и граница</title>
<desc id="v03-s13-counters-grammar-d">Диапазон строится на счётчиках: из пяти букв нам нужны три (n пакет по счёту, d пакет с данными по счёту, b байты данных; s и p смотрят на номера TCP и не разбираются, x значит «никогда», a «всегда»); на клиентском приветствии нашего опыта n3, d1, b250 (в журнале это пакет номер 4, потому что журнал считает оба направления); счётчик растёт до проверки, у направлений счётчики свои, считается только то, что увидела программа; запись границ: n3-n5 даёт пакеты 3, 4, 5, n3&lt;n5 даёт 3 и 4, n3-n3 только третий, n3- начиная с третьего, &lt;n4 пакеты 1, 2, 3, а одна граница n3 без разделителя это ошибка.</desc>
