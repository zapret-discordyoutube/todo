<svg xmlns="http://www.w3.org/2000/svg" class="v05-s25-remember-unknown" viewBox="0 0 960 812" width="960" height="812" role="img" aria-labelledby="v05-s25-remember-unknown-t v05-s25-remember-unknown-d">
<title id="v05-s25-remember-unknown-t">Помнить и граница знаний</title>
<desc id="v05-s25-remember-unknown-d">Восемь строк, которые стоит запомнить про multisplit: pos это список меток, по умолчанию 2, и если резать нечего, оригинал уходит целым; плохая метка даёт ошибку, оригинал тоже уходит целым; каждая допустимая позиция даёт на одну часть больше, позиции идут по возрастанию, повторы склеены, части уходят подряд без ожидания между ними; часть, которая не помещается в пакет, режется по размеру сегмента; seqovl это целое положительное число и подкладка только перед первой частью, ноль и минус дают обычный разрез, текст срывает стратегию ошибкой, а дробь в нашей сборке портит поток; nodrop с любым значением оставляет оригинал следом за частями; аргументы подмены бьют по настоящим частям; повторы оригинала от клиента режутся заново каждый раз; не проверяли приёмники кроме Linux, настоящий сбой сырого сокета, накладку при IPv6, UDP и ICMP на проводе (по коду multisplit для не TCP сразу выходит), причину выбора узора в примере документации, сколько разрезов выдержит чужой приёмник (наш сервер принял 25 пакетов по 10 байт) и всё о настоящем ТСПУ; в следующем выпуске те же разрезы уйдут в другом порядке, например последней частью вперёд, а у multidisorder накладка задаётся меткой, у multisplit только числом.</desc>
