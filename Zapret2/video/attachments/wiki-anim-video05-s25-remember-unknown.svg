<rect class="bg" x="0" y="0" width="960" height="812"/>
<g><text class="cap" x="40" y="24">итог выпуска · восемь строк, которые стоит запомнить</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="560" height="52" rx="8"/><circle class="bxa" cx="64" cy="62" r="13"/><text class="tk c ns" x="64" y="67">1</text><text class="sm tk" x="88" y="58">pos: список меток, по умолчанию 2</text><text class="sm" x="88" y="78">резать нечего: оригинал уходит целым</text></g>
<g class="a e2"><rect class="bx" x="40" y="96" width="560" height="52" rx="8"/><circle class="bxa" cx="64" cy="122" r="13"/><text class="tk c ns" x="64" y="127">2</text><text class="sm tk" x="88" y="118">плохая метка: ошибка Lua</text><text class="sm" x="88" y="138">оригинал тоже уходит целым</text></g>
<g class="a e3"><rect class="bx" x="40" y="156" width="560" height="70" rx="8"/><circle class="bxa" cx="64" cy="191" r="13"/><text class="tk c ns" x="64" y="196">3</text><text class="sm tk" x="88" y="178">каждая допустимая позиция: на одну часть больше</text><text class="sm" x="88" y="198">по возрастанию, повторы склеены,</text><text class="sm" x="88" y="216">подряд, без ожидания между частями</text></g>
<g class="a e4"><rect class="bx" x="40" y="234" width="560" height="52" rx="8"/><circle class="bxa" cx="64" cy="260" r="13"/><text class="tk c ns" x="64" y="265">4</text><text class="sm tk" x="88" y="256">часть больше пакета (MSS минус опции)</text><text class="sm" x="88" y="276">режется по размеру сегмента</text></g>
<g class="a e5"><rect class="bx" x="40" y="294" width="560" height="70" rx="8"/><circle class="bxa" cx="64" cy="329" r="13"/><text class="tk c ns" x="64" y="334">5</text><text class="sm tk" x="88" y="316">seqovl: целое положительное число</text><text class="sm" x="88" y="336">подкладка только перед первой частью; ноль и минус:</text><text class="sm" x="88" y="354">обычный разрез; текст: ошибка; дробь портит поток</text></g>
<g class="a e6"><rect class="bx" x="40" y="372" width="560" height="52" rx="8"/><circle class="bxa" cx="64" cy="398" r="13"/><text class="tk c ns" x="64" y="403">6</text><text class="sm tk" x="88" y="394">nodrop: любое значение</text><text class="sm" x="88" y="414">оригинал идёт следом за частями</text></g>
<g class="a e7"><rect class="bx" x="40" y="432" width="560" height="52" rx="8"/><circle class="bxa" cx="64" cy="458" r="13"/><text class="tk c ns" x="64" y="463">7</text><text class="sm tk" x="88" y="454">подмена полей</text><text class="sm" x="88" y="474">бьёт по настоящим частям</text></g>
<g class="a e8"><rect class="bx" x="40" y="492" width="560" height="52" rx="8"/><circle class="bxa" cx="64" cy="518" r="13"/><text class="tk c ns" x="64" y="523">8</text><text class="sm tk" x="88" y="514">повторы оригинала от клиента</text><text class="sm" x="88" y="534">режутся заново, каждый раз</text></g>
<g class="a e9"><text class="cap" x="620" y="24">не проверяли</text></g>
<g class="a e10"><rect class="bxd" x="620" y="36" width="300" height="328" rx="8"/></g>
<g class="a e11"><text class="sm" x="648" y="64">приёмники кроме Linux:</text><text class="sm" x="648" y="82">Windows, BSD, встроенные</text><circle class="hm" cx="636" cy="59" r="3.5"/></g>
<g class="a e12"><text class="sm" x="648" y="114">настоящий сбой сырого сокета</text><circle class="hm" cx="636" cy="109" r="3.5"/></g>
<g class="a e13"><text class="sm" x="648" y="146">накладка при IPv6</text><circle class="hm" cx="636" cy="141" r="3.5"/></g>
<g class="a e14"><text class="sm" x="648" y="178">UDP и ICMP на проводе: по коду</text><text class="sm" x="648" y="196">для не-TCP функция выходит</text><circle class="hm" cx="636" cy="173" r="3.5"/></g>
<g class="a e15"><text class="sm" x="648" y="228">почему в примере документации</text><text class="sm" x="648" y="246">именно такой узор</text><circle class="hm" cx="636" cy="223" r="3.5"/></g>
<g class="a e16"><text class="sm" x="648" y="278">сколько разрезов терпит чужой</text><text class="sm" x="648" y="296">приёмник: наш сервер принял</text><text class="sm" x="648" y="314">25 пакетов по 10 байт</text><circle class="hm" cx="636" cy="273" r="3.5"/></g>
<g class="a e17"><text class="sm" x="648" y="346">всё о настоящем ТСПУ</text><circle class="hm" cx="636" cy="341" r="3.5"/></g>
<g class="a e18"><text class="cap" x="40" y="572">что дальше: следующий выпуск, те же разрезы в другом порядке</text></g>
<g class="a e19"><text class="sm tk" x="40" y="592">в этом выпуске: сначала часть 1, потом часть 2</text><rect class="bxa" x="40" y="602" width="176.8" height="28" rx="0"/><text class="sm c" x="128.4" y="621">часть 1: 1+104</text><rect class="bxo" x="216.8" y="602" width="248.2" height="28" rx="0"/><text class="sm c" x="340.9" y="621">часть 2: 105+146</text></g>
<g class="a e20"><text class="sm tk" x="40" y="650">в следующем: последняя часть первой (пример порядка)</text><rect class="bxo" x="40" y="660" width="248.2" height="28" rx="0"/><text class="sm c" x="164.1" y="679">часть 2: 105+146</text><rect class="bxa" x="288.2" y="660" width="176.8" height="28" rx="0"/><text class="sm c" x="376.6" y="679">часть 1: 1+104</text><text class="sm tk" x="40" y="708">а если поменять порядок? сервер и игрушки покажут</text></g>
<g class="a e21"><rect class="bx" x="40" y="720" width="880" height="76" rx="8"/><text class="sm" x="54" y="742">multidisorder (части в другом порядке): накладка задаётся меткой, antidpi:592, 620</text><text class="sm" x="54" y="764">multisplit: накладка только число, tonumber(desync.arg.seqovl), antidpi:509-510</text><text class="ix mu" x="54" y="784">стратегия следующего выпуска; здесь мы её не разбираем</text></g>
</svg>
