<g class="a e11"><rect class="bxa" x="40" y="320" width="740" height="38" rx="6"/><circle class="bx" cx="64" cy="339" r="13"/><text class="tk c ns" x="64" y="344">3</text><text class="tk sm" x="90" y="344">что будет, если часть не влезает в один пакет</text><text class="ix r" x="768" y="344">zapret-lib.lua:1246-1273</text></g>
<g class="a e12"><rect class="bxa" x="40" y="366" width="740" height="38" rx="6"/><circle class="bx" cx="64" cy="385" r="13"/><text class="tk c ns" x="64" y="390">4</text><text class="tk sm" x="90" y="390">в каком порядке и с какой паузой уходят части</text><text class="ix r" x="768" y="390">zapret-antidpi.lua:504-525</text></g>
