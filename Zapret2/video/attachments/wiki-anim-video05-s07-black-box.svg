<g class="a e6"><rect class="bxa" x="730" y="40" width="190" height="96" rx="6"/><text class="cap ns" x="742" y="62">в сеть</text><text class="tk sm" x="742" y="86">104 байта</text><text class="tk sm" x="742" y="108">146 байт</text><text class="ix" x="742" y="126">в очередь не попадают</text></g>
