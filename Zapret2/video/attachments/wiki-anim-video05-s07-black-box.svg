<svg xmlns="http://www.w3.org/2000/svg" class="v05-s07-black-box" viewBox="0 0 960 536" width="960" height="536" role="img" aria-labelledby="v05-s07-black-box-t v05-s07-black-box-d">
<title id="v05-s07-black-box-t">Чёрный ящик и четыре шага</title>
<desc id="v05-s07-black-box-d">Чёрный ящик между числом 105 и двумя пакетами: ядро держит исходный пакет и ждёт вердикта, программа получает копию через очередь, внутри функции multisplit лежит путь, который открывает эта часть, части уходят в сеть через сырой сокет мимо очереди, а вердикт drop возвращается ядру; пути четыре шага (цикл частей в lua/zapret-antidpi.lua:504-507, номер пакета в 522, часть длиннее предела в zapret-lib.lua:1246-1273, порядок и пауза), шаги 1 и 2 идут в одном цикле, а проверка по повтору для pos=endhost: 112 плюс 1 равно 113, один разрез, две части по 112 и 138 байт, расчёт без чистого опыта.</desc>
<style>.v05-s07-black-box{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
