<svg xmlns="http://www.w3.org/2000/svg" class="video08-s06-answers-without-condition" viewBox="0 0 960 628" width="960" height="628" role="img" aria-labelledby="video08-s06-answers-without-condition-t video08-s06-answers-without-condition-d">
<title id="video08-s06-answers-without-condition-t">Запуск без условия</title>
<desc id="video08-s06-answers-without-condition-d">Запуск fakedsplit с позицией midsld без условия подделки: в игрушке кладовщик оставляет на полке первую пришедшую стопку, а вторую называет дублем; на проводе те же шесть пакетов, фейк и настоящая первая часть по 104 байта, затем фейк и настоящая вторая часть по 146 байт, у всех обычный срок жизни 64, верная сумма и нет опции MD5; сервер ответил подтверждением 105 на первый пакет, на второй и третий тем же подтверждением с блоком дубля от 1 до 105, на четвёртый подтверждением 251, на пятый и шестой подтверждением 251 с блоком дубля от 105 до 251, счётчик дублирующих ответов равен 4, счётчики MD5 и ошибок суммы равны 0, ядро ничего не выбросило.</desc>
