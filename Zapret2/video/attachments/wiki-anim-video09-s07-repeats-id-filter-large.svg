<g class="a e3"><text class="sm tk" x="340" y="106">проверь себя: сколько сообщений «срок жизни истёк»</text><text class="sm tk" x="340" y="128">вернётся от роутера?</text></g>
<g class="a e4"><path class="lm" d="M200 148L82.0 149.8"/><polygon class="hm" points="72,150 81.9,144.8 82.1,154.8"/><path class="lm" d="M200 160L82.0 161.8"/><polygon class="hm" points="72,162 81.9,156.8 82.1,166.8"/><path class="lm" d="M200 172L82.0 173.8"/><polygon class="hm" points="72,174 81.9,168.8 82.1,178.8"/><text class="ix mu" x="212" y="166">ICMP × 3</text></g>
<g class="a e5"><text class="sm tk ok" x="340" y="160">три, по одному на каждый сброс</text><text class="sm mu" x="340" y="180">приветствие одно: 250 байт, на сервер оно доходит</text></g>
<g class="a e6"><rect class="bx" x="40" y="204" width="880" height="100" rx="8"/><text class="mk" x="54" y="230">ip_id=rnd: случайный идентификатор IP</text></g>
<g class="a e7"><text class="sm tk" x="54" y="263">без аргумента</text><rect class="bxa" x="220" y="244" width="116.1" height="26" rx="6"/><text class="m fg" x="230" y="262">сброс 27216</text><text class="big tk ok c" x="358.1" y="265">=</text><rect class="bxa" x="380.1" y="244" width="168.5" height="26" rx="6"/><text class="m fg" x="390.1" y="262">приветствие 27216</text><text class="sm ok" x="562.6" y="263">равны</text></g>
<g class="a e8"><text class="sm tk" x="54" y="291">ip_id=rnd</text><rect class="bxa" x="220" y="272" width="107.3" height="26" rx="6"/><text class="m fg" x="230" y="290">сброс 5332</text><text class="big tk rej c" x="349.3" y="293">≠</text><rect class="bxa" x="371.3" y="272" width="159.8" height="26" rx="6"/><text class="m fg" x="381.3" y="290">приветствие 4198</text><text class="sm rej" x="545.1" y="291">разные</text></g>
<g class="a e9"><rect class="bx" x="40" y="316" width="880" height="128" rx="8"/><text class="mk" x="54" y="342">без фильтра вида данных: что запускает сброс</text></g>
<g class="a e10"><rect class="bx" x="54" y="356" width="148" height="30" rx="6"/><text class="sm c" x="128" y="376">SYN</text><text class="sm c mu" x="128" y="404">не запускает</text></g>
