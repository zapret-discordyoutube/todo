<svg xmlns="http://www.w3.org/2000/svg" class="v09-s07-repeats-id-filter-large" viewBox="0 0 960 774" width="960" height="774" role="img" aria-labelledby="v09-s07-repeats-id-filter-large-t v09-s07-repeats-id-filter-large-d">
<title id="v09-s07-repeats-id-filter-large-t">Четыре опыта со сбросом: повтор, номер, фильтр, длинное приветствие</title>
<desc id="v09-s07-repeats-id-filter-large-d">Четыре опыта со сбросом: при repeats равном 3 и сроке жизни 1 уходят три одинаковых сброса и от роутера возвращаются три сообщения «срок жизни истёк», при ip_id равном rnd идентификатор IP у сброса 5332 а у приветствия 4198, тогда как без аргумента оба равны 27216, без фильтра типа нагрузки сброс запускает только приветствие, а не SYN и пустые ACK, и в журнале одна строка о сбросе, а приветствие в 1484 байта делится на куски по 1448 и 36 байт, один сброс со сроком 1 уходит перед первым куском, перед вторым его нет, и сервер читает два куска двумя чтениями.</desc>
