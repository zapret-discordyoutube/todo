<svg xmlns="http://www.w3.org/2000/svg" class="v06-s21-office-else-branch" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="v06-s21-office-else-branch-t v06-s21-office-else-branch-d">
<title id="v06-s21-office-else-branch-t">Ловушка 1: кусок без разреза</title>
<desc id="v06-s21-office-else-branch-d">Первая ловушка старой функции multidisorder_legacy: сначала выдуманный пример, где копировальная контора режет длинный лист на два, а короткий лист в 36 слов не режет, но переписывает на чистый бланк, и на все три листа на выходе ставит штамп «время жизни три»; потом наш опыт на большом приветствии в 1484 байта с аргументом ip_ttl=3, где на проводе три пакета: 1344 байта со смещения 104, 104 байта с начала и хвост в 36 байт со смещения 1448, и у всех трёх TTL равен 3, то есть хвост мы не резали, а штамп он получил; и наконец код ветки «ничего не режем» (строки 688-694 файла zapret-antidpi.lua): запись в журнал, отправка копии текущего пакета со всеми аргументами подмены полей и вердикт DROP, то есть копия вместо оригинала.</desc>
