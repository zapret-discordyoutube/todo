<title id="video09-s15-flag-only-on-byte-piece-t">Флаг срочности только на куске с байтом</title>
<desc id="video09-s15-flag-only-on-byte-piece-d">Правило в коде оставляет флаг срочности и пересчитывает указатель только в куске, куда попал срочный байт: первый кусок на 1448 байт сохраняет указатель 105, второй с байта 1449 флага не получает, а сервер читает 104 и 1380 байт, всего 1484.</desc>
