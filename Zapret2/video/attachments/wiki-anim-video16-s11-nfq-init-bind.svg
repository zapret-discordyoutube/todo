<g><text class="cap" x="40" y="26">nfq_init, первая половина: nfqws.c:355-396</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="880" height="29" rx="4"/><text class="ix" x="48" y="64">357</text><rect class="bxs" x="92" y="47" width="96" height="23" rx="4"/><text class="tk sm c mu" x="140" y="63">сброс</text><text class="m" x="200" y="64">nfq_deinit(h, qh);</text><text class="sm r" x="912" y="64">сбросить старое</text></g>
<g class="a e2"><rect class="bx" x="40" y="77" width="880" height="29" rx="4"/><text class="ix" x="48" y="97">360</text><rect class="bxr" x="92" y="80" width="96" height="23" rx="4"/><text class="tk sm c rej" x="140" y="96">фатально</text><text class="m" x="200" y="97">*h = nfq_open();</text><text class="sm r" x="912" y="97">открыть ручку</text></g>
<g class="a e3"><rect class="bx" x="40" y="110" width="880" height="29" rx="4"/><text class="ix" x="48" y="130">370</text><rect class="bxr" x="92" y="113" width="96" height="23" rx="4"/><text class="tk sm c rej" x="140" y="129">фатально</text><text class="m" x="200" y="130">if (nfq_unbind_pf(*h, AF_INET) &lt; 0)</text><text class="sm r" x="912" y="130">отвязать прежнего, IPv4</text></g>
<g class="a e4"><rect class="bx" x="40" y="143" width="880" height="29" rx="4"/><text class="ix" x="48" y="163">376</text><rect class="bxr" x="92" y="146" width="96" height="23" rx="4"/><text class="tk sm c rej" x="140" y="162">фатально</text><text class="m" x="200" y="163">if (nfq_bind_pf(*h, AF_INET) &lt; 0)</text><text class="sm r" x="912" y="163">привязать, IPv4</text></g>
<g class="a e5"><rect class="bx" x="40" y="176" width="880" height="29" rx="4"/><text class="ix" x="48" y="196">382</text><rect class="bxs" x="92" y="179" width="96" height="23" rx="4"/><text class="tk sm c mu" x="140" y="195">запись</text><text class="m" x="200" y="196">if (nfq_unbind_pf(*h, AF_INET6) &lt; 0)</text><text class="sm r" x="912" y="196">отвязать, IPv6</text></g>
<g class="a e6"><rect class="bx" x="40" y="209" width="880" height="29" rx="4"/><text class="ix" x="48" y="229">387</text><rect class="bxs" x="92" y="212" width="96" height="23" rx="4"/><text class="tk sm c mu" x="140" y="228">запись</text><text class="m" x="200" y="229">if (nfq_bind_pf(*h, AF_INET6) &lt; 0)</text><text class="sm r" x="912" y="229">привязать, IPv6</text></g>
<g class="a e7"><rect class="bx" x="40" y="242" width="880" height="29" rx="4"/><text class="ix" x="48" y="262">392</text><rect class="bxr" x="92" y="245" width="96" height="23" rx="4"/><text class="tk sm c rej" x="140" y="261">фатально</text><text class="m" x="200" y="262">*qh = nfq_create_queue(*h, params.qnum, &amp;nfq_cb, cbdata);</text><text class="sm r" x="912" y="262">создать очередь</text></g>
<g class="a e8"><text class="cap" x="40" y="295">четыре аргумента nfq_create_queue</text></g>
<g class="a e9"><rect class="bxa" x="40" y="305" width="205" height="70" rx="6"/><text class="tk sm" x="50" y="325">ручка библиотеки</text><text class="hx" x="50" y="347">*h</text><text class="ix" x="50" y="366">открыта в начале</text></g>
<g class="a e10"><rect class="bxa" x="265" y="305" width="205" height="70" rx="6"/><text class="tk sm" x="275" y="325">номер очереди</text><text class="hx" x="275" y="347">params.qnum</text><text class="ix" x="275" y="366">200 в нашей лаборатории</text></g>
<g class="a e11"><rect class="bxa" x="490" y="305" width="205" height="70" rx="6"/><text class="tk sm" x="500" y="325">обратный вызов</text><text class="hx" x="500" y="347">&amp;nfq_cb</text><text class="ix" x="500" y="366">вызвать при пакете</text></g>
<g class="a e12"><rect class="bxa" x="715" y="305" width="205" height="70" rx="6"/><text class="tk sm" x="725" y="325">блок данных</text><text class="hx" x="725" y="347">cbdata</text><text class="ix" x="725" y="366">вернётся приёмщику</text></g>
<g class="a e13"><rect class="bxd" x="40" y="389" width="880" height="30" rx="4"/><text class="sm" x="52" y="409">cbdata (nfqws.c:452, 498-508): sock — вспомогательный сокет, mod — буфер для изменённого пакета, 65536 Б</text></g>
<g class="a e14"><text class="cap" x="40" y="443">карточка функции</text></g>
<g class="a e15"><rect class="bx" x="40" y="453" width="205" height="106" rx="6"/><text class="tk sm" x="50" y="473">вход</text><text class="ix" x="50" y="493">h, qh, cbdata</text><text class="ix" x="50" y="510">params.qnum</text></g>
<g class="a e16"><rect class="bx" x="265" y="453" width="205" height="106" rx="6"/><text class="tk sm" x="275" y="473">выход</text><text class="ix" x="275" y="493">true или false</text></g>
<g class="a e17"><rect class="bx" x="490" y="453" width="205" height="106" rx="6"/><text class="tk sm" x="500" y="473">вызывает</text><text class="ix" x="500" y="493">nfq_deinit, nfq_open,</text><text class="ix" x="500" y="510">nfq_unbind_pf,</text><text class="ix" x="500" y="527">nfq_bind_pf,</text><text class="ix" x="500" y="544">nfq_create_queue</text></g>
<g class="a e18"><rect class="bx" x="715" y="453" width="205" height="106" rx="6"/><text class="tk sm" x="725" y="473">вызывается</text><text class="ix" x="725" y="493">из nfq_main, один раз</text><text class="ix" x="725" y="510">nfqws.c:510</text></g>
<g class="a e19"><text class="sm" x="40" y="589">Фатальный сбой: всё сделанное сбрасывается, функция возвращает false, программа выходит с кодом 1.</text></g>
