<svg xmlns="http://www.w3.org/2000/svg" class="v16-s11-nfq-init-bind" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="v16-s11-nfq-init-bind-t v16-s11-nfq-init-bind-d">
<title id="v16-s11-nfq-init-bind-t">nfq_init: открыть, привязать, создать очередь</title>
<desc id="v16-s11-nfq-init-bind-d">Первая половина функции nfq_init (nfqws.c:355-396) по строкам кода. Строка 357 nfq_deinit сбрасывает старое; 360 nfq_open открывает ручку библиотеки (сбой фатален); 370 nfq_unbind_pf и 376 nfq_bind_pf для IPv4 (сбой любого шага фатален); 382 и 387 те же два шага для IPv6, ошибка только пишется в журнал; 392 nfq_create_queue с четырьмя аргументами: ручка библиотеки, номер очереди params.qnum, функция обратного вызова nfq_cb и блок данных cbdata (вспомогательный сокет и буфер на 65536 байт); сбой создания очереди фатален. Карточка функции: на входе h, qh, cbdata и params.qnum, на выходе true или false; вызывает nfq_deinit, nfq_open, nfq_unbind_pf, nfq_bind_pf, nfq_create_queue; вызывается из nfq_main один раз (nfqws.c:510). Фатальный сбой сбрасывает всё сделанное, программа выходит с кодом 1.</desc>
