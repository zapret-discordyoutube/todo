<rect class="bg" x="0" y="0" width="960" height="770"/>
<g><text class="cap" x="40" y="22">провод клиента в нашем тесте по порядку отправки, номера относительные</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="247.1" height="28" rx="6"/><text class="m mu" x="50" y="53">--payload=tls_client_hello</text><text class="sm mu" x="40" y="82">фильтр: о нём в следующей сцене</text></g>
<g class="a e2"><rect class="bxa" x="340" y="34" width="46.2" height="28" rx="6"/><text class="mk" x="350" y="53">rst</text><text class="sm mu" x="340" y="82">сброс перед приветствием</text></g>
<g class="a e3"><rect class="bxb" x="620" y="34" width="89.9" height="28" rx="6"/><text class="mk" x="630" y="53">ip_ttl=1</text><text class="sm mu" x="620" y="82">срок жизни 1: умрёт на роутере</text></g>
<g class="a e4"><text class="cap c" x="500" y="108">клиент</text><text class="cap c" x="600" y="108">роутер</text><text class="cap c" x="700" y="108">сервер</text><path class="lmd" d="M500 116L500 408"/><path class="lmd" d="M600 116L600 408"/><path class="lmd" d="M700 116L700 408"/><text class="cap" x="748" y="108">время, мс</text></g>
<g class="a e5"><rect class="bx" x="40" y="122" width="880" height="56" rx="6"/><rect class="bx" x="40" y="138" width="36" height="24" rx="12.0"/><text class="tk c ns" x="58" y="155" style="font-size:14px">1-3</text><text class="sm tk" x="80" y="142">рукопожатие, как обычно</text><text class="ix fg" x="80" y="162">SYN, SYN-ACK, ACK</text><path class="lm" d="M500 132L690.0 137.7"/><polygon class="hm" points="700,138 689.9,142.7 690.2,132.7"/><path class="lm" d="M700 150L510.0 155.7"/><polygon class="hm" points="500,156 509.8,150.7 510.1,160.7"/><path class="lm" d="M500 164L690.0 169.7"/><polygon class="hm" points="700,170 689.9,174.7 690.2,164.7"/><text class="ix fg" x="748" y="144">0,00 · 10,58 · 11,05</text></g>
<g class="a e6"><circle class="bxr" cx="56" cy="208" r="12"/><text class="tk c ns" x="56" y="213">4</text><text class="sm tk" x="78" y="203">RST: единственный флаг</text><text class="ix fg" x="78" y="221">номер 1 · подтверждение 1, флага ACK нет</text><path class="lcut" d="M500 208L600 211"/><path class="lr" d="M593 204L607 218M607 204L593 218"/><text class="m fg" x="748" y="203">19,63</text><text class="ix mu" x="748" y="221">TTL 1 · IP 52 Б</text></g>
<g class="a e7"><rect class="fa" x="40" y="244" width="880" height="44" rx="6"/><circle class="bxa" cx="56" cy="266" r="12"/><text class="tk c ns" x="56" y="271">5</text><text class="sm tk" x="78" y="261">приветствие: PSH, ACK, 250 байт</text><text class="ix fg" x="78" y="279">номер 1 · TTL 64 · IP id тот же, что у RST</text><path class="la" d="M500 266L690.0 273.6"/><polygon class="ha" points="700,274 689.8,278.6 690.2,268.6"/><text class="m fg" x="748" y="261">19,69</text><text class="ix mu" x="748" y="279">+0,06 мс после RST</text></g>
<g class="a e8"><circle class="bx" cx="56" cy="318" r="12"/><text class="tk c ns" x="56" y="323">6</text><text class="sm tk" x="78" y="315">роутер: ICMP тип 11 «срок жизни истёк»</text><text class="ix fg" x="78" y="333">ответ на пакет, который он убил</text><path class="lf" d="M600 318L510.0 323.4"/><polygon class="hf" points="500,324 509.7,318.4 510.3,328.4"/><text class="m fg" x="748" y="315">24,93</text><text class="ix mu" x="748" y="333">+5,3 мс после RST</text></g>
<g class="a e9"><rect class="bx" x="41" y="360" width="30" height="24" rx="12.0"/><text class="tk c ns" x="56" y="377" style="font-size:14px">7+</text><text class="sm tk" x="78" y="369">сервер: подтверждение 251 и ответ 14 байт</text><text class="ix fg" x="78" y="387">SERVER-REPLY: соединение на сервере целое</text><path class="lm" d="M700 372L510.0 379.6"/><polygon class="hm" points="500,380 509.8,374.6 510.2,384.6"/><text class="m fg" x="748" y="369">30,36</text></g>
<g class="a e10"><text class="sm mu" x="40" y="424">кто увидел RST: карта клиента и вход роутера; выход роутера и карта сервера нет</text></g>
<g class="a e11"><text class="cap" x="40" y="450">пакет 4 по байтам</text></g>
<g class="a e12"><rect class="bxa" x="40" y="460" width="150" height="30" rx="0"/><text class="sm tk c" x="115" y="480">IP 20</text><rect class="bx" x="190" y="460" width="150" height="30" rx="0"/><text class="sm tk c" x="265" y="480">TCP 20</text><rect class="bxb" x="340" y="460" width="90" height="30" rx="0"/><text class="sm tk c" x="385" y="480">опции 12</text><text class="ix mu c" x="385" y="506">NOP NOP TS</text><text class="ml" x="452" y="481">20 + 20 + 12 = 52</text></g>
<g class="a e13"><rect class="bxr" x="40" y="524" width="84.3" height="28" rx="6"/><text class="sm" x="51" y="543">флаги R</text><rect class="bx" x="132.3" y="524" width="83.2" height="28" rx="6"/><text class="sm" x="143.3" y="543">номер 1</text><rect class="bx" x="223.5" y="524" width="382.7" height="28" rx="6"/><text class="sm" x="234.5" y="543">подтверждение 1 скопировано, флаг ACK снят</text><rect class="bx" x="614.3" y="524" width="81" height="28" rx="6"/><text class="sm" x="625.3" y="543">окно 63</text><rect class="bxo" x="703.3" y="524" width="119" height="28" rx="6"/><text class="sm" x="714.3" y="543">сумма верна</text></g>
<g class="a e14"><text class="cap" x="40" y="576">игрушка и сервер: итог</text><rect class="pl" x="297.9" y="558" width="182.1" height="24" rx="12"/><text class="sm c" x="389" y="575">выдуманный пример</text></g>
<g class="a e15"><rect class="bxb" x="40" y="588" width="440" height="132" rx="8"/><text class="sm tk" x="54" y="612">игрушка «сброс стирает память»</text><text class="sm" x="54" y="636">видит пакет 4 на входе роутера</text><text class="ix fg" x="54" y="660">TOY DECISION FORGET: RST seen (from client):</text><text class="ix fg" x="54" y="678">flow state erased, never inspected again</text><text class="sm mu" x="54" y="706">приветствие дальше не проверяется</text></g>
<g class="a e16"><rect class="bxo" x="500" y="588" width="420" height="132" rx="8"/><text class="sm tk" x="514" y="612">приложение сервера</text><text class="sm" x="514" y="636">получило 250 байт одним чтением</text><text class="sm" x="514" y="660">ответ SERVER-REPLY</text><text class="sm tk" x="514" y="686">до сервера RST не дошёл</text><text class="sm mu" x="514" y="708">допущение: игрушка стоит до проверки TTL</text></g>
<g class="a e17"><text class="sm mu" x="40" y="744">что видит настоящее оборудование, мы не знаем и проверить не могли: это допущение нашей модели</text></g>
</svg>
