<svg xmlns="http://www.w3.org/2000/svg" class="v09-s06-rst-ladder" viewBox="0 0 960 770" width="960" height="770" role="img" aria-labelledby="v09-s06-rst-ladder-t v09-s06-rst-ladder-d">
<title id="v09-s06-rst-ladder-t">Сброс перед приветствием на проводе клиента</title>
<desc id="v09-s06-rst-ladder-d">Сброс перед приветствием на проводе клиента: после трёх пакетов рукопожатия уходит пакет с единственным флагом RST, номером 1, подтверждением 1 при снятом флаге ACK, сроком жизни 1 и длиной по заголовку IP 52 байта, сразу за ним через 0,06 мс идёт приветствие в 250 байт со сроком 64, сброс видят клиент и вход роутера и дальше он не идёт, а роутер примерно через 5 мс возвращает сообщение «срок жизни истёк», игрушка «сброс стирает память» записывает, что соединение забыто, и сервер получает 250 байт одним чтением и отвечает.</desc>
<style>.v09-s06-rst-ladder{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
