<g class="a e1"><text class="cap" x="2" y="26">лаборатория: один пакет, четыре точки съёма</text></g>
<path class="lm" d="M176 146H191"/><path class="lm" d="M209 146H351"/><path class="lm" d="M369 146H372"/><path class="lm" d="M588 146H593"/><path class="lm" d="M611 146H755"/><path class="lm" d="M773 146H784"/>
<g class="a e2"><rect class="bxa" x="6" y="106" width="170" height="80" rx="7"/><text class="tk c" x="91" y="138">Клиент</text><text class="mk c" x="91" y="164">10.1.0.1</text></g>
<g class="a e3"><rect class="bxm" x="372" y="106" width="216" height="80" rx="7"/><text class="tk c" x="480" y="138">Роутер</text><text class="mu sm c" x="480" y="164">пересылает по адресу</text></g>
<g class="a e4"><rect class="bxa" x="784" y="106" width="170" height="80" rx="7"/><text class="tk c" x="869" y="138">Сервер</text><text class="mk c" x="869" y="164">10.2.0.2</text></g>
<g class="a e5"><circle class="ring" cx="200" cy="146" r="9"/><text class="ml c" x="200" y="230">c0</text><text class="t sm c" x="200" y="254">выходит из клиента</text><text class="mk c" x="200" y="282">0,000 мс</text><text class="mk c" x="200" y="306">TTL 64</text></g>
<g class="a e6"><circle class="ring" cx="360" cy="146" r="9"/><text class="ml c" x="360" y="230">r0</text><text class="t sm c" x="360" y="254">входит в роутер</text><text class="mk c" x="360" y="282">+0,002 мс</text><text class="mk c" x="360" y="306">TTL 64</text></g>
