<svg xmlns="http://www.w3.org/2000/svg" class="v01-s03-path" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="v01-s03-path-t v01-s03-path-d">
<title id="v01-s03-path-t">Путь пакета в четырёх точках</title>
<desc id="v01-s03-path-d">Один и тот же пакет в 316 байт снят в четырёх точках: c0 при выходе из клиента в момент 0,000 мс с временем жизни 64, r0 при входе в роутер через 0,002 мс с временем жизни 64, r1 при выходе из роутера через 0,005 мс с временем жизни 63 и s0 у сервера через 0,006 мс с временем жизни 63; роутер вычел единицу, весь путь занял шесть микросекунд.</desc>
<style>.v01-s03-path{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#23825a;--okt:rgba(35,130,90,.12)}@media (prefers-color-scheme:dark){.v01-s03-path{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13);--ok:#7fd1a6;--okt:rgba(127,209,166,.12)}}
.v01-s03-path .bg{fill:var(--bg)}
.v01-s03-path text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}
.v01-s03-path .t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s03-path .tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s03-path .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s03-path .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v01-s03-path .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}
.v01-s03-path .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v01-s03-path .sm{font-size:14.5px}
.v01-s03-path .big{font-size:18px}
.v01-s03-path .mu{fill:var(--mute)}
.v01-s03-path .fg{fill:var(--fg)}
.v01-s03-path .acc{fill:var(--acc)}
.v01-s03-path .rej{fill:var(--rej)}
.v01-s03-path .ok{fill:var(--ok)}
.v01-s03-path .c{text-anchor:middle}
