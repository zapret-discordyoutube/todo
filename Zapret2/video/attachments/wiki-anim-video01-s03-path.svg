.v01-s03-path .bxg{fill:var(--line);stroke:var(--mute);stroke-width:1.2}
.v01-s03-path .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 4}
.v01-s03-path .bxbg{fill:var(--bg);stroke:none}
.v01-s03-path .lf{fill:none;stroke:var(--line);stroke-width:1.4}
.v01-s03-path .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v01-s03-path .lmd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 5}
.v01-s03-path .lr{fill:none;stroke:var(--rej);stroke-width:2}
