<g class="a e12"><path class="la" d="M200 330V338H764V330"/><text class="tk acc c" x="482" y="362">весь путь: 0,006 мс, это 6 микросекунд</text></g>
<g class="a e13"><text class="t" x="2" y="394">Размер тот же, 316 байт; роутер только вычел единицу из времени жизни (TTL).</text></g>
