.v01-s03-path .ln{stroke-dasharray:100}
.v01-s03-path .hd-a{fill:var(--acc)}
.v01-s03-path .hd-f{fill:var(--fg2)}
.v01-s03-path .hd-r{fill:var(--rej)}
.v01-s03-path .dot{fill:var(--acc)}
.v01-s03-path .ring{fill:var(--bg);stroke:var(--acc);stroke-width:2.2}
.v01-s03-path .beam{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}
.v01-s03-path .a{animation-duration:24s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v01-s03-path .a{animation:none}.v01-s03-path .tr{display:none}}
figure.v01-s03-path-fig{margin:1.6rem 0;overflow-x:auto}figure.v01-s03-path-fig>svg{display:block;width:100%;min-width:680px;height:auto}
