<svg xmlns="http://www.w3.org/2000/svg" class="v03-s05-no-action-last" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="v03-s05-no-action-last-t v03-s05-no-action-last-d">
<title id="v03-s05-no-action-last-t">Пустой профиль no_action в конце списка</title>
<desc id="v03-s05-no-action-last-d">Профиль no_action: после разбора командной строки программа сама подшивает в конец списка пустой профиль с номером 0 (nfqws.c:3192-3201), и пакет, не подошедший профилю 1, достаётся ему; в опыте с условием «протокол http» на соединении TLS профиль искали на первом пакете и на приветствии, остальные восемь из десяти пакетов взяли его из памяти, функций Lua не было, сервер получил 250 байт одним куском.</desc>
