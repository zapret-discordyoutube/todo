<g class="a e9"><text class="ln r" x="54" y="201">3192</text><text class="cd" x="66" y="201">DLOG(&quot;adding low-priority default empty desync profile\n&quot;);</text><text class="ln r" x="54" y="226">3194</text><text class="cd" x="66" y="226">if (!(dpl = dp_list_add(&amp;params.desync_profiles)) || !(dpl-&gt;dp.name=strdup(&quot;no_action&quot;)))</text><text class="ln r" x="54" y="251">3200</text><text class="cd" x="66" y="251">DLOG_CONDUP(&quot;we have %u user defined desync profile(s) and default low priority profile 0\n&quot;, …);</text></g>
<g class="a e10 tr"><text class="tk" x="10" y="288">при запуске журнал пишет: добавляется пустой профиль по умолчанию, с низким приоритетом</text></g>
<g class="a e11 tr"><text class="tk" x="10" y="288">профиль подшивается В КОНЕЦ списка, его имя no_action</text></g>
<g class="a e12 tr"><text class="tk" x="10" y="288">у последнего профиля номер 0 (память обнулена): в число «своих» профилей он не входит</text></g>
<g class="a e13"><rect class="bxk" x="650" y="84" width="300" height="78" rx="8"/><text class="tk inv" x="664" y="108">профиль 0: no_action</text><text class="sm inv" x="664" y="130">пустой: условий и вызовов нет</text><text class="sm inv" x="664" y="151">добавлен программой в конец</text></g>
