<g class="a e1"><text class="cap" x="10" y="22">в конец списка профилей программа сама подшивает пустой профиль</text></g>
<g class="a e2"><rect class="bx" x="10" y="84" width="300" height="78" rx="8"/><text class="tk" x="24" y="108">профиль 1</text><text class="mk" x="24" y="130">--filter-l7=http</text><text class="sm mu" x="24" y="151">нужен протокол http, у нас tls</text></g>
