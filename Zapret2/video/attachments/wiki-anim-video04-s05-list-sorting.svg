<svg xmlns="http://www.w3.org/2000/svg" class="v04-s05-list-sorting" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v04-s05-list-sorting-t v04-s05-list-sorting-d">
<title id="v04-s05-list-sorting-t">Список меток встал по возрастанию</title>
<desc id="v04-s05-list-sorting-d">В нашем тесте список из семи меток, написанный в порядке host, sld, midsld, endsld, endhost, sniext, extlen, программа записала в журнал числами по возрастанию: 86 92 97 101 104 108 112, и все семь совпали с таблицей. На большом приветствии (1484 байта) тот же список в другом порядке дал те же семь чисел. На проводе приветствие в 250 байт ушло восемью кусками 86, 6, 5, 4, 3, 4, 4 и 138, имя www.example.com разошлось по кускам 4, 3, 4 и 4 байта.</desc>
