<svg xmlns="http://www.w3.org/2000/svg" class="v07-s28-fake-and-real-on-wire" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="v07-s28-fake-and-real-on-wire-t v07-s28-fake-and-real-on-wire-d">
<title id="v07-s28-fake-and-real-on-wire-t">Подделка и настоящий пакет на проводе</title>
<desc id="v07-s28-fake-and-real-on-wire-d">Подделка и настоящее приветствие на проводе клиента совпадают по ip id 52873, адресам, портам, номерам, флагам AP, окну и метке времени и отличаются только опциями, заголовком в 52 против 32 байт и данными в 680 против 250 байт, подделка идёт первой в 110 запусках из 110, потому что fake отдаёт копию ядру внутри вызова и возвращается без результата, а оригинал движок отпускает после, а с аргументом dir=in на исходящем приветствии подделок ни одной.</desc>
