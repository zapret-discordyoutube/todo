<g><text class="cap" x="40" y="26">в нашем тесте: подделка и настоящий пакет друг рядом с другом</text></g>
<g class="a e1"><text class="cap" x="40" y="58">совпадает у обоих</text></g>
<g class="a e2"><rect class="bxo" x="40" y="68" width="224" height="26" rx="4"/><text class="sm" x="50" y="86">✓ ip id 52873</text><rect class="bxo" x="272" y="68" width="224" height="26" rx="4"/><text class="sm" x="282" y="86">✓ TTL 64</text><rect class="bxo" x="40" y="100" width="224" height="26" rx="4"/><text class="sm" x="50" y="118">✓ адреса и порты</text><rect class="bxo" x="272" y="100" width="224" height="26" rx="4"/><text class="sm" x="282" y="118">✓ номер и ack</text><rect class="bxo" x="40" y="132" width="224" height="26" rx="4"/><text class="sm" x="50" y="150">✓ флаги AP</text><rect class="bxo" x="272" y="132" width="224" height="26" rx="4"/><text class="sm" x="282" y="150">✓ окно 63</text><rect class="bxo" x="40" y="164" width="224" height="26" rx="4"/><text class="sm" x="50" y="182">✓ метка времени</text><rect class="bxo" x="272" y="164" width="224" height="26" rx="4"/><text class="sm" x="282" y="182">✓ обе суммы верны</text></g>
<g class="a e3"><text class="cap" x="40" y="222">отличается</text></g>
<g class="a e4"><text class="cap" x="190" y="242">подделка</text><text class="cap" x="340" y="242">настоящий</text></g>
<g class="a e5"><rect class="bxb" x="40" y="252" width="440" height="32" rx="4"/><text class="sm" x="50" y="273">опции TCP</text><text class="mn" x="190" y="273">NOP NOP TS MD5</text><text class="mn" x="340" y="273">NOP NOP TS</text></g>
<g class="a e6"><rect class="bxb" x="40" y="288" width="440" height="32" rx="4"/><text class="sm" x="50" y="309">заголовок TCP</text><text class="mn" x="190" y="309">52 байта</text><text class="mn" x="340" y="309">32 байта</text></g>
<g class="a e7"><rect class="bxb" x="40" y="324" width="440" height="32" rx="4"/><text class="sm" x="50" y="345">данные</text><text class="mn" x="190" y="345">680 байт</text><text class="mn" x="340" y="345">250 байт</text></g>
<g class="a e8"><rect class="bxb" x="40" y="360" width="440" height="32" rx="4"/><text class="sm" x="50" y="381">SHA-256 данных</text><text class="mn" x="190" y="381">11d33b3d926b</text><text class="mn" x="340" y="381">100c2aa4206d</text></g>
<g class="a e9"><text class="cap" x="520" y="58">почему подделка идёт первой</text></g>
<g class="a e10"><rect class="bx" x="520" y="68" width="400" height="52" rx="5"/><circle class="bxs" cx="542" cy="94" r="11"/><text class="mk c" x="542" y="99">1</text><text class="sm" x="564" y="90">fake отдаёт копию ядру</text><text class="sm" x="564" y="109">прямо внутри вызова</text></g>
<g class="a e11"><rect class="bx" x="520" y="130" width="400" height="52" rx="5"/><circle class="bxs" cx="542" cy="156" r="11"/><text class="mk c" x="542" y="161">2</text><text class="sm" x="564" y="152">функция кончается</text><text class="sm" x="564" y="171">без результата</text><path class="lf" d="M542 121L542 119"/><polygon class="hf" points="542,129 537,119 547,119"/></g>
<g class="a e12"><rect class="bx" x="520" y="192" width="400" height="52" rx="5"/><circle class="bxs" cx="542" cy="218" r="11"/><text class="mk c" x="542" y="223">3</text><text class="sm" x="564" y="214">движок отпускает оригинал,</text><text class="sm" x="564" y="233">когда вернулись все экземпляры</text><path class="lf" d="M542 183L542 181"/><polygon class="hf" points="542,191 537,181 547,181"/></g>
<g class="a e13"><text class="sm mu" x="520" y="268">так устроен движок: nfq2/desync.c:846-868</text></g>
<g class="a e14"><rect class="bxo" x="520" y="282" width="400" height="98" rx="6"/><text class="bn" x="536" y="332">110 из 110</text><text class="sm" x="536" y="356">запусков: подделка перед приветствием</text><text class="sm mu" x="536" y="374">100 по IPv4 и 10 по IPv6</text></g>
