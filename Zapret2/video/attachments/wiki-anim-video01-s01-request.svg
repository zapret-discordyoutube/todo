<svg xmlns="http://www.w3.org/2000/svg" class="v01-s01-request" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="v01-s01-request-t v01-s01-request-d">
<title id="v01-s01-request-t">Запрос браузера: обычный текст</title>
<desc id="v01-s01-request-d">Простейший HTTP-запрос без шифрования выглядит как четыре строки текста: первая строка задаёт метод GET, путь к странице и версию протокола, вторая называет сайт в поле Host, остальные служебные; сервер отвечает таким же сообщением, а страница складывается из десятков таких обменов.</desc>
<style>.v01-s01-request{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#23825a;--okt:rgba(35,130,90,.12)}@media (prefers-color-scheme:dark){.v01-s01-request{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13);--ok:#7fd1a6;--okt:rgba(127,209,166,.12)}}
.v01-s01-request .bg{fill:var(--bg)}
.v01-s01-request text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}
.v01-s01-request .t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s01-request .tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s01-request .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s01-request .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v01-s01-request .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}
.v01-s01-request .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v01-s01-request .sm{font-size:14.5px}
.v01-s01-request .big{font-size:18px}
.v01-s01-request .mu{fill:var(--mute)}
.v01-s01-request .fg{fill:var(--fg)}
.v01-s01-request .acc{fill:var(--acc)}
.v01-s01-request .rej{fill:var(--rej)}
.v01-s01-request .ok{fill:var(--ok)}
.v01-s01-request .c{text-anchor:middle}
.v01-s01-request .r{text-anchor:end}
.v01-s01-request .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v01-s01-request .bxm{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v01-s01-request .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v01-s01-request .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v01-s01-request .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v01-s01-request .bxg{fill:var(--line);stroke:var(--mute);stroke-width:1.2}
.v01-s01-request .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 4}
.v01-s01-request .bxbg{fill:var(--bg);stroke:none}
.v01-s01-request .lf{fill:none;stroke:var(--line);stroke-width:1.4}
.v01-s01-request .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v01-s01-request .lmd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 5}
.v01-s01-request .lr{fill:none;stroke:var(--rej);stroke-width:2}
.v01-s01-request .la{fill:none;stroke:var(--acc);stroke-width:2}
.v01-s01-request .ld{fill:none;stroke:var(--fg2);stroke-width:2}
.v01-s01-request .belt{fill:var(--line);stroke:var(--mute);stroke-width:1.2}
.v01-s01-request .ln{stroke-dasharray:100}
.v01-s01-request .hd-a{fill:var(--acc)}
.v01-s01-request .hd-f{fill:var(--fg2)}
.v01-s01-request .hd-r{fill:var(--rej)}
.v01-s01-request .dot{fill:var(--acc)}
.v01-s01-request .ring{fill:var(--bg);stroke:var(--acc);stroke-width:2.2}
.v01-s01-request .beam{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}
.v01-s01-request .a{animation-duration:17s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v01-s01-request .a{animation:none}.v01-s01-request .tr{display:none}}
figure.v01-s01-request-fig{margin:1.6rem 0;overflow-x:auto}figure.v01-s01-request-fig>svg{display:block;width:100%;min-width:680px;height:auto}
