<rect class="bg" x="0" y="0" width="960" height="372"/>
<g class="a e1"><text class="cap" x="2" y="26">пример: запрос без шифрования, обычный текст</text></g>
<g class="a e2"><text class="t" x="2" y="56">Браузер говорит серверу: «пришли мне эту страницу».</text></g>
<g class="a e3"><rect class="bxm" x="2" y="74" width="372" height="150" rx="8"/></g>
<g class="a e4"><rect class="bxa" x="10" y="118" width="356" height="28" rx="5"/></g>
<g class="a e5"><text class="ml" x="22" y="108">GET /index.html HTTP/1.1</text></g>
<g class="a e6"><text class="ml" x="22" y="138">Host: www.example.com</text></g>
<g class="a e7"><text class="ml" x="22" y="168">User-Agent: lab</text></g>
<g class="a e8"><text class="ml" x="22" y="198">Accept: */*</text></g>
<g class="a e9"><path class="lm" d="M374 102H402"/><text class="tk" x="410" y="107">метод GET, путь к странице, версия протокола</text></g>
<g class="a e10"><path class="la" d="M374 132H402"/><text class="tk acc" x="410" y="137">Host: имя сайта</text></g>
<g class="a e11"><path class="lm" d="M362 162H370V192H362M370 177H402"/><text class="tk" x="410" y="182">служебные строки</text></g>
<g class="a e12"><text class="t" x="2" y="250">Это обычный текст: его можно прочитать глазами.</text></g>
<g class="a e13"><text class="t" x="2" y="288">Сервер отвечает таким же сообщением. Страница, которую вы видите, это десятки таких обменов:</text></g>
<g class="a e14"><rect class="bxa" x="2" y="304" width="176" height="34" rx="6"/><text class="tk c" x="90.0" y="326">текст страницы</text></g>
<g class="a e15"><polygon class="hd-f" points="200,321 191,325.5 191,316.5"/><path class="lm" d="M184 321H192"/></g>
<g class="a e16"><rect class="bxa" x="206" y="304" width="130" height="34" rx="6"/><text class="tk c" x="271.0" y="326">картинки</text></g>
<g class="a e17"><polygon class="hd-f" points="358,321 349,325.5 349,316.5"/><path class="lm" d="M342 321H350"/></g>
<g class="a e18"><rect class="bxa" x="364" y="304" width="100" height="34" rx="6"/><text class="tk c" x="414.0" y="326">стили</text></g>
<g class="a e19"><polygon class="hd-f" points="486,321 477,325.5 477,316.5"/><path class="lm" d="M470 321H478"/></g>
<g class="a e20"><rect class="bxa" x="492" y="304" width="120" height="34" rx="6"/><text class="tk c" x="552.0" y="326">скрипты</text></g>
</svg>
