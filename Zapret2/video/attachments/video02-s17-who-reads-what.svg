<rect class="bg" x="0" y="0" width="960" height="506"/>
<g class="a e1"><text class="cap" x="10" y="22">путь пакета и глубина чтения: типичная картина</text><text class="tk c" x="318" y="46">Ethernet</text><text class="sm mu c" x="318" y="64">адрес</text><text class="tk c" x="415" y="46">IP</text><text class="sm mu c" x="415" y="64">адреса, TTL</text><text class="tk c" x="512" y="46">TCP</text><text class="sm mu c" x="512" y="64">порты</text><text class="tk c" x="609" y="46">TCP</text><text class="sm mu c" x="609" y="64">флаги</text><text class="tk c" x="713" y="46">TCP</text><text class="sm mu c" x="713" y="64">номера, окно</text><text class="tk c" x="856" y="46">данные</text><text class="sm mu c" x="856" y="64">имя сайта, Host</text><path class="lm" d="M14 76L14 392"/><path class="lm" d="M14 372L14.0 390.0"/><polygon class="hm" points="14,400 9.0,390.0 19.0,390.0"/></g>
<g class="a e2"><text class="tk" x="32" y="96">Коммутатор</text><text class="sm mu" x="32" y="114">соединяет компьютеры</text><rect class="bxa" x="272" y="76" width="92" height="46" rx="6"/><text class="sm c" x="318" y="104">читает</text><rect class="bx" x="369" y="76" width="92" height="46" rx="6"/><rect class="bx" x="466" y="76" width="92" height="46" rx="6"/><rect class="bx" x="563" y="76" width="92" height="46" rx="6"/><rect class="bx" x="660" y="76" width="106" height="46" rx="6"/><rect class="bx" x="771" y="76" width="170" height="46" rx="6"/></g>
<g class="a e3"><text class="tk" x="32" y="150">Роутер</text><text class="sm mu" x="32" y="168">выбирает дорогу по IP</text><rect class="bxb" x="272" y="130" width="92" height="46" rx="6"/><text class="sm c" x="318" y="158">заменяет</text><rect class="bxb" x="369" y="130" width="92" height="46" rx="6"/><text class="sm c" x="415" y="158">TTL, сумма</text><rect class="bx" x="466" y="130" width="92" height="46" rx="6"/><rect class="bx" x="563" y="130" width="92" height="46" rx="6"/><rect class="bx" x="660" y="130" width="106" height="46" rx="6"/><rect class="bx" x="771" y="130" width="170" height="46" rx="6"/></g>
<g class="a e4"><text class="tk" x="32" y="204">NAT</text><text class="sm mu" x="32" y="222">один адрес для многих</text><rect class="bx" x="272" y="184" width="92" height="46" rx="6"/><rect class="bxb" x="369" y="184" width="92" height="46" rx="6"/><text class="sm c" x="415" y="212">адреса</text><rect class="bxb" x="466" y="184" width="92" height="46" rx="6"/><text class="sm c" x="512" y="212">порты</text><rect class="bx" x="563" y="184" width="92" height="46" rx="6"/><rect class="bx" x="660" y="184" width="106" height="46" rx="6"/><rect class="bx" x="771" y="184" width="170" height="46" rx="6"/></g>
<g class="a e5"><text class="tk" x="32" y="258">Межсетевой экран</text><text class="sm mu" x="32" y="276">решает, что пропускать</text><rect class="bx" x="272" y="238" width="92" height="46" rx="6"/><rect class="bxa" x="369" y="238" width="92" height="46" rx="6"/><text class="sm c" x="415" y="266">читает</text><rect class="bxa" x="466" y="238" width="92" height="46" rx="6"/><text class="sm c" x="512" y="266">читает</text><rect class="bxa" x="563" y="238" width="92" height="46" rx="6"/><text class="sm c" x="609" y="266">читает</text><rect class="bx" x="660" y="238" width="106" height="46" rx="6"/><rect class="bx" x="771" y="238" width="170" height="46" rx="6"/></g>
<g class="a e6"><text class="tk" x="32" y="312">Наблюдатель (DPI)</text><text class="sm mu" x="32" y="330">глубокая проверка пакетов</text><rect class="bxa" x="272" y="292" width="92" height="46" rx="6"/><text class="sm c" x="318" y="320">читает</text><rect class="bxa" x="369" y="292" width="92" height="46" rx="6"/><text class="sm c" x="415" y="320">читает</text><rect class="bxa" x="466" y="292" width="92" height="46" rx="6"/><text class="sm c" x="512" y="320">читает</text><rect class="bxa" x="563" y="292" width="92" height="46" rx="6"/><text class="sm c" x="609" y="320">читает</text><rect class="bxa" x="660" y="292" width="106" height="46" rx="6"/><text class="sm c" x="713" y="320">читает</text><rect class="bxr" x="771" y="292" width="170" height="46" rx="6"/><text class="sm c tk" x="856" y="320">ищет имя сайта</text></g>
<g class="a e7"><text class="tk" x="32" y="366">Сервер</text><text class="sm mu" x="32" y="384">получатель</text><rect class="bxa" x="272" y="346" width="92" height="46" rx="6"/><text class="sm c" x="318" y="374">читает</text><rect class="bxa" x="369" y="346" width="92" height="46" rx="6"/><text class="sm c" x="415" y="374">читает</text><rect class="bxa" x="466" y="346" width="92" height="46" rx="6"/><text class="sm c" x="512" y="374">читает</text><rect class="bxa" x="563" y="346" width="92" height="46" rx="6"/><text class="sm c" x="609" y="374">читает</text><rect class="bxa" x="660" y="346" width="106" height="46" rx="6"/><text class="sm c" x="713" y="374">читает</text><rect class="bxa" x="771" y="346" width="170" height="46" rx="6"/><text class="sm c" x="856" y="374">всё</text></g>
<g class="a e8"><text class="sm" x="10" y="424">в нашей лаборатории роутер изменил ровно это: Ethernet, время жизни и сумму IP, остальное не тронул</text></g>
<g class="a e9"><rect class="bxa" x="10" y="438" width="16" height="14" rx="3"/><text class="sm" x="32" y="451">читает</text><rect class="bxb" x="112" y="438" width="16" height="14" rx="3"/><text class="sm" x="134" y="451">меняет в пакете</text><rect class="bx" x="300" y="438" width="16" height="14" rx="3"/><text class="sm" x="322" y="451">обычно не нужно</text></g>
<g class="a e10"><text class="sm tk" x="10" y="482">В реальной сети состав устройств другой: это типичная картина, а не данные о конкретном оборудовании.</text></g>
</svg>
