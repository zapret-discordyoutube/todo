.v02-s17-who-reads .hf{fill:var(--fg2)}.v02-s17-who-reads .ha{fill:var(--acc)}.v02-s17-who-reads .hr{fill:var(--rej)}.v02-s17-who-reads .hm{fill:var(--mute)}.v02-s17-who-reads .ho{fill:var(--ok)}.v02-s17-who-reads .hbm{fill:var(--amb)}
.v02-s17-who-reads .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
