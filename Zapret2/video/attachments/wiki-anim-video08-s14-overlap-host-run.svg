<svg xmlns="http://www.w3.org/2000/svg" class="v08-s14-overlap-host-run" viewBox="0 0 960 742" width="960" height="742" role="img" aria-labelledby="v08-s14-overlap-host-run-t v08-s14-overlap-host-run-d">
<title id="v08-s14-overlap-host-run-t">Накладка seqovl равно host</title>
<desc id="v08-s14-overlap-host-run-d">Накладка seqovl равно host у перемешивания с фейками: метка host стоит на смещении 97, значит накладок 97, настоящая вторая половина вырастает до 243 байт, 97 плюс 146, а начинается на смещении 7, это номер 8, потому что 104 минус 97 равно 7, первые 97 байт пакета нулевые и лежат поверх хвоста первой половины, сервер отвечает «жду байт номер 1» с блоком с 8-го по 250-й, когда приходит настоящая первая половина, отвечает «жду байт номер 251» с дублирующим блоком с 8-го по 104-й, и приложение читает оригинал в 250 байт, а при seqovl равно 20 пакет имеет 166 байт и начинается с номера 85.</desc>
