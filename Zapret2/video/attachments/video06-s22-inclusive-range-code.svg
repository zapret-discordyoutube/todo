<svg xmlns="http://www.w3.org/2000/svg" class="v06-s22-inclusive-range-code" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="v06-s22-inclusive-range-code-t v06-s22-inclusive-range-code-d">
<title id="v06-s22-inclusive-range-code-t">tcpseg: диапазон и код</title>
<desc id="v06-s22-inclusive-range-code-d">Идея tcpseg и её код: выдуманная телеграмма в 250 слов, из которой помощник отправляет первые 105 и рвёт остальное, потом настоящая команда tcpseg с pos=0,midsld и отдельный вызов drop, диапазон от смещения 0 до смещения 104 включительно, то есть 104 - 0 + 1 = 105 байт, тогда как первый кусок multisplit по той же метке равен 104 байтам; строки кода из файла zapret-antidpi.lua (1050-1089): pos обязателен и без него сразу ошибка, данные берутся из блоба, собранного сообщения или пакета, проверка проигрыша, resolve_range даёт два номера, срез string.sub включает обе границы, отправка идёт со сдвигом начало диапазона минус seqovl, а функция кончается без return, то есть вердикт «пропустить»; и проверка: при pos=0,1 уходит 2 байта, в нашем опыте 2@0.</desc>
