<g><text class="cap" x="40" y="24">модели над записью роутера: multisplit:pos=midsld</text></g>
<g><rect class="bxb" x="630" y="8" width="290" height="26" rx="6"/><text class="sm tk amb c" x="775" y="27">наши модели, не оборудование</text></g>
<g class="a video08-s01-readers-after-cut-k1"><text class="smk" x="40" y="64">что дошло до роутера, по порядку:</text></g>
<g class="a video08-s01-readers-after-cut-k2"><rect class="bxa" x="40" y="76" width="300" height="32" rx="5"/><text class="smk" x="54" y="97">пакет 1: 104 байта</text><text class="m r" x="326" y="97">…www.exa</text></g>
<g class="a video08-s01-readers-after-cut-k3"><rect class="bxa" x="350" y="76" width="570" height="32" rx="5"/><text class="m" x="364" y="97">mple.com…</text><text class="smk" x="480" y="97">пакет 2: 146 байт</text></g>
<g class="a video08-s01-readers-after-cut-k4"><text class="sm mu c" x="480" y="134">каждый читатель берёт эти два пакета и по-своему решает, есть ли в них имя</text></g>
<g class="a video08-s01-readers-after-cut-k5"><rect class="bx" x="40" y="148" width="168" height="330" rx="10"/><text class="tk" x="52" y="176">пакетный</text><text class="sm13" x="52" y="226">смотрит каждый</text><text class="sm13" x="52" y="243">пакет отдельно</text></g>
<g class="a video08-s01-readers-after-cut-k6"><text class="sm13 mu" x="52" y="300">у него получилось:</text><rect class="bx" x="52" y="310" width="66" height="28" rx="4"/><text class="mt c" x="85" y="329">www.exa</text><rect class="bx" x="126" y="310" width="70" height="28" rx="4"/><text class="mt c" x="161" y="329">mple.com</text><text class="sm13" x="52" y="360">врозь: имени нет</text><text class="sm13" x="52" y="377">ни в одном куске</text></g>
<g class="a video08-s01-readers-after-cut-k7"><rect class="bxo" x="52" y="398" width="144" height="66" rx="8"/><text class="tk ok c" x="124" y="424">слеп</text><text class="sm13 c" x="124" y="446">хороший исход</text></g>
<g class="a video08-s01-readers-after-cut-k8"><rect class="bx" x="218" y="148" width="168" height="330" rx="10"/><text class="tk" x="230" y="176">склейщик</text><text class="sm13" x="230" y="226">склеивает данные</text><text class="sm13" x="230" y="243">по порядку прихода</text></g>
<g class="a video08-s01-readers-after-cut-k9"><text class="sm13 mu" x="230" y="300">у него получилось:</text><rect class="bxr" x="230" y="310" width="144" height="28" rx="4"/><text class="mt c" x="302" y="329">www.example.com</text><text class="sm13" x="230" y="360">нашёл на пакете</text><text class="sm13k" x="230" y="377">2 из 2</text></g>
<g class="a video08-s01-readers-after-cut-k10"><rect class="bxr" x="230" y="398" width="144" height="66" rx="8"/><text class="tk rej c" x="302" y="424">видит имя</text><text class="sm13 c" x="302" y="446">приём не обманул</text></g>
<g class="a video08-s01-readers-after-cut-k11"><rect class="bx" x="396" y="148" width="168" height="330" rx="10"/><text class="tk" x="408" y="176">первый</text><text class="tk" x="408" y="196">записал</text><text class="sm13" x="408" y="226">по номерам байтов;</text><text class="sm13" x="408" y="243">при наложении</text><text class="sm13" x="408" y="260">остаётся первое</text></g>
