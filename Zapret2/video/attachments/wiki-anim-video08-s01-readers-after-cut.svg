<title id="video08-s01-readers-after-cut-t">Кто видит имя после разреза</title>
<desc id="video08-s01-readers-after-cut-d">В нашей модели над записью роутера после разреза на пакеты в 104 и 146 байт имя сайта не находит только читатель пакетный, который разбирает каждый пакет отдельно, а читатели склейщик, первый записал, последний записал и строго по порядку собирают куски вместе и видят имя на втором пакете из двух.</desc>
