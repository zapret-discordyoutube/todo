<title id="video08-s03-fake-contents-t">Что лежит в фейке</title>
<desc id="video08-s03-fake-contents-d">В нашем тесте фейки по умолчанию целиком из нулей, 104 нулевых байта в первом и 146 во втором, с узором из трёх букв они читаются как один бесконечный текст, разрезанный там же, где данные, а с готовой заготовкой приветствия первый фейк начинается с заголовка записи TLS.</desc>
