<g><text class="cap" x="40" y="24">чем заполнен фейк: три случая из нашего теста</text></g>
<g class="a video08-s03-fake-contents-k1"><text class="tk" x="40" y="48">1. по умолчанию: нули</text><text class="sm mu r" x="920" y="48">длину фейка задаёт разрез</text></g>
<g class="a video08-s03-fake-contents-k2"><rect class="bxb" x="40" y="62" width="364.08" height="34" rx="4"/><text class="m" x="52" y="84">00 00 00 00 00 00 …</text><rect class="bxb" x="406.08" y="62" width="513.92" height="34" rx="4"/><text class="m" x="418.08" y="84">00 00 00 00 00 00 …</text></g>
<g class="a video08-s03-fake-contents-k3"><text class="smk" x="40" y="116">фейк части 1: 104 нулевых байта</text><text class="smk" x="406.08" y="116">фейк части 2: 146 нулевых байт</text></g>
<g class="a video08-s03-fake-contents-k4"><text class="sm13 mu" x="40" y="138">это не приветствие и не заголовок TLS</text></g>
<g class="a video08-s03-fake-contents-k5"><text class="sm13 mu" x="40" y="156">в выпуске про условия у стратегии fake по умолчанию была заготовка приветствия на 680 байт</text></g>
<g class="a video08-s03-fake-contents-k6"><text class="tk" x="40" y="188">2. аргумент pattern: узор из трёх букв</text><text class="sm mu r" x="920" y="188">pattern=0x414243: буквы А Б В, в кодировке 41 42 43</text></g>
<g class="a video08-s03-fake-contents-k7"><rect class="bxb" x="40" y="202" width="364.08" height="36" rx="4"/><rect class="bx" x="48" y="206" width="22" height="28" rx="3"/><text class="mk c" x="59" y="226">A</text><rect class="bx" x="74" y="206" width="22" height="28" rx="3"/><text class="mk c" x="85" y="226">B</text><rect class="bx" x="100" y="206" width="22" height="28" rx="3"/><text class="mk c" x="111" y="226">C</text><rect class="bx" x="126" y="206" width="22" height="28" rx="3"/><text class="mk c" x="137" y="226">A</text><rect class="bx" x="152" y="206" width="22" height="28" rx="3"/><text class="mk c" x="163" y="226">B</text><rect class="bx" x="178" y="206" width="22" height="28" rx="3"/><text class="mk c" x="189" y="226">C</text><text class="sm13" x="218" y="226">… 34 узора …</text><rect class="bx" x="344.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="355.08" y="226">A</text><rect class="bx" x="370.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="381.08" y="226">B</text></g>
<g class="a video08-s03-fake-contents-k8"><rect class="bxb" x="406.08" y="202" width="513.92" height="36" rx="4"/><rect class="bx" x="414.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="425.08" y="226">C</text><rect class="bx" x="440.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="451.08" y="226">A</text><rect class="bx" x="466.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="477.08" y="226">B</text><rect class="bx" x="492.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="503.08" y="226">C</text><rect class="bx" x="518.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="529.08" y="226">A</text><rect class="bx" x="544.08" y="206" width="22" height="28" rx="3"/><text class="mk c" x="555.08" y="226">B</text><text class="sm13" x="584.08" y="226">… и дальше по кругу</text></g>
<g class="a video08-s03-fake-contents-k9"><path class="lr" d="M405.08 196L405.08 246"/><text class="sm13k rej" x="412.08" y="262">разрез: тот же, что у данных</text></g>
<g class="a video08-s03-fake-contents-k10"><text class="ix" x="40" y="262">фейк 1: 41 42 43 41 42 43 …</text><text class="ix" x="652.08" y="262">фейк 2: 43 41 42 43 41 42 …</text></g>
<g class="a video08-s03-fake-contents-k11"><text class="sm13" x="40" y="288">фейк 1 это первые 104 буквы узора: 104 = 34 · 3 + 2, то есть 34 полных узора и ещё две буквы,</text><text class="sm13" x="40" y="306">поэтому фейк 2 начинается с третьей буквы: 43 41 42 …</text></g>
<g class="a video08-s03-fake-contents-k12"><text class="smk" x="40" y="330">вместе два фейка это один бесконечный текст, разрезанный там же, где данные</text></g>
<g class="a video08-s03-fake-contents-k13"><text class="tk" x="40" y="388">3. готовая заготовка приветствия: pattern=fake_default_tls</text><text class="sm mu r" x="920" y="388">из выпуска про условия</text></g>
<g class="a video08-s03-fake-contents-k14"><rect class="bx" x="40" y="402" width="880" height="30" rx="4"/><text class="sm13 mu r" x="920" y="422">680 байт</text></g>
<g class="a video08-s03-fake-contents-k15"><rect class="bxb" x="40" y="402" width="132.59" height="30" rx="3"/><text class="sm13k" x="48" y="422">фейк 1</text><rect class="bxb" x="174.59" y="402" width="188.94" height="30" rx="3"/><text class="sm13k" x="182.59" y="422">фейк 2</text></g>
<g class="a video08-s03-fake-contents-k16"><text class="m" x="40" y="454">фейк 1 с байта 0: 16 03 01 02 a3 01 …</text><text class="m" x="480" y="454">фейк 2 с байта 104: 00 9c 00 9d 00 2f …</text></g>
<g class="a video08-s03-fake-contents-k17"><text class="sm13" x="40" y="478">16 03 01 это тип записи и версия: фейк начинается как заголовок записи TLS</text></g>
<g class="a video08-s03-fake-contents-k18"><text class="smk" x="40" y="502">но это только лист: дойдёт ли письмо, решает не содержимое, а условие</text></g>
</svg>
