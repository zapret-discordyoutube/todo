<g class="a e20"><rect class="bxo" x="626" y="330" width="294" height="92" rx="8"/><text class="tk sm" x="640" y="356">сравнение: t01, pass</text><text class="sm" x="640" y="380">6 исходящих + 4 входящих = 10</text><text class="sm" x="640" y="400">на проводе те же 10, вставок нет</text></g>
