<svg xmlns="http://www.w3.org/2000/svg" class="v16-s18-queue-vs-wire" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="v16-s18-queue-vs-wire-t v16-s18-queue-vs-wire-d">
<title id="v16-s18-queue-vs-wire-t">Счёт пакетов: очередь и провод</title>
<desc id="v16-s18-queue-vs-wire-d">Счёт пакетов опыта t10: одиннадцать пакетов очереди по группам и две бухгалтерские колонки. Рукопожатие: № 1 исходящий SYN, len 60; № 2 входящий SYN-ACK, 60; № 3 исходящий ACK, 52. Запрос: № 4 исходящий PSH,ACK, len 302, вердикт drop; рядом две вставки 156 и 198 байт, в очереди их нет. Ответы сервера: № 5 входящий ACK, 52, подтверждает часть 1; № 6 входящий PSH,ACK, 66, ответ в 14 байт; № 7 входящий ACK, 52, подтверждает часть 2. Закрытие: № 8 исходящий ACK, № 9 исходящий FIN,ACK, № 10 входящий FIN,ACK, № 11 исходящий ACK, все по 52. Все пакеты, кроме № 4, получили pass unmodified. Очередь видела 11: исходящих 6 (№ 1, 3, 4, 8, 9, 11) и входящих 5 (№ 2, 5, 6, 7, 10), 6 + 5 = 11. На проводе клиента 12: исходящих 6 − 1 + 2 = 7 (один выброшен, две вставки добавлены), входящих 5, которых никто не меняет; 7 + 5 = 12. Для сравнения опыт t01 со стратегией pass: 6 исходящих и 4 входящих, то есть 10, и на проводе те же 10. В t10 входящих на один больше, потому что сервер подтвердил каждую из двух частей отдельным пакетом, это № 5 и № 7.</desc>
