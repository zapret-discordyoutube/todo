<svg xmlns="http://www.w3.org/2000/svg" class="video07-s01b-inspector-decides-once" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="video07-s01b-inspector-decides-once-t video07-s01b-inspector-decides-once-d">
<title id="video07-s01b-inspector-decides-once-t">Инспектор решает один раз</title>
<desc id="video07-s01b-inspector-decides-once-d">Игрушечный инспектор этого выпуска, в отличие от прежнего, который смотрел каждый пакет отдельно и ничего не помнил, ждёт первый пакет с данными и решает один раз на всё соединение, поэтому подделка, встающая первой, получает зелёную галочку и замок, настоящее приветствие уже не читается, а дальше у подделки две возможности не навредить, не доехать до сервера или быть выброшенной самим сервером, и если сервер примет её за данные, соединение сломано.</desc>
