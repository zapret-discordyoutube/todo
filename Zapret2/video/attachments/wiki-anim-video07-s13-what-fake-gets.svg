<svg xmlns="http://www.w3.org/2000/svg" class="v07-s13-what-fake-gets" viewBox="0 0 960 646" width="960" height="646" role="img" aria-labelledby="v07-s13-what-fake-gets-t v07-s13-what-fake-gets-d">
<title id="v07-s13-what-fake-gets-t">Что получает подделка: семь опытов</title>
<desc id="v07-s13-what-fake-gets-d">Таблица из семи опытов о том, какой срок получает подделка, когда автоподбор молчит или ломается: при отказе без запасного числа срок 64 и сервер принимает 680 байт; когда число найдено, оно главнее запасного ip_ttl=1 и срок 2; без ответов сервера в правилах клиента срок 64, а с запасным числом 1 подделка умирает на первом роутере и сервер получает чистые 250 байт, так же при выключенной записи соединений; опечатка abc при известном сроке ответа даёт ошибку в функции, подделки нет, игрушка блокирует соединение и сервер получает 0 байт, а при неизвестном сроке ответа ошибки нет, срок 64 и сервер принимает 680 байт.</desc>
