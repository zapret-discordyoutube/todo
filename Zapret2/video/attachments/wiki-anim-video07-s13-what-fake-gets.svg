<g class="a e7"><rect class="bx" x="10" y="522" width="940" height="68" rx="8"/><circle class="pl" cx="28" cy="556" r="11"/><text class="sm tk c ns" x="28" y="561">7</text><text class="smk ns" x="48" y="550">опечатка abc, срока ответа нет</text><text class="mt mu ns" x="48" y="574">ip_autottl=abc · ошибки нет</text><rect class="bxr" x="448" y="540" width="100" height="32" rx="6"/><text class="sm tk c ns" x="498" y="561">срок 64</text><text class="m ns" x="580" y="561">c0 r0 r1 r2 s0</text><path class="lm" d="M714 532L714 580"/><text class="sm tk ns" x="726" y="550">сервер: 680 Б</text><text class="sm ns" x="726" y="574">клиент ждёт</text></g>
<g class="a e8"><text class="sm mu" x="10" y="616">у каждого пункта одна и та же подделка 680 байт; опыты в нашей лаборатории, о настоящих сетях выводов нет</text></g>
