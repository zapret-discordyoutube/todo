<g class="a e5"><rect class="bx" x="10" y="370" width="940" height="68" rx="8"/><circle class="pl" cx="28" cy="404" r="11"/><text class="sm tk c ns" x="28" y="409">5</text><text class="smk ns" x="48" y="398">запись соединений выключена ключом</text><text class="mt mu ns" x="48" y="422">--ctrack-disable, …:ip_ttl=1</text><rect class="bxo" x="448" y="388" width="100" height="32" rx="6"/><text class="sm tk c ns" x="498" y="409">срок 1</text><text class="m ns" x="580" y="409">c0 r0</text><path class="lm" d="M714 380L714 428"/><text class="sm tk ns" x="726" y="398">сервер: 250 Б, чисто</text><text class="sm ns" x="726" y="422">клиент: ответ получен</text></g>
