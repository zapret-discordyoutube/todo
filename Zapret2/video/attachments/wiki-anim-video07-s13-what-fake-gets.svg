<g><text class="cap" x="10" y="22">Что получает подделка, когда подбор молчит или ломается</text></g>
<g><text class="cap" x="48" y="48">опыт</text><text class="cap" x="460" y="48">срок</text><text class="cap" x="580" y="48">видна на</text><text class="cap" x="726" y="48">итог</text><path class="lm" d="M10 56L950 56"/></g>
<g class="a e1"><rect class="bx" x="10" y="66" width="940" height="68" rx="8"/><circle class="pl" cx="28" cy="100" r="11"/><text class="sm tk c ns" x="28" y="105">1</text><text class="smk ns" x="48" y="94">подбор отказал, запасного числа нет</text><text class="mt mu ns" x="48" y="118">ip_autottl=-1,1-20 · 1 роутер</text><rect class="bxr" x="448" y="84" width="100" height="32" rx="6"/><text class="sm tk c ns" x="498" y="105">срок 64</text><text class="m ns" x="580" y="105">c0 r0 r1 s0</text><path class="lm" d="M714 76L714 124"/><text class="sm tk ns" x="726" y="94">сервер: 680 Б</text><text class="sm ns" x="726" y="118">клиент ждёт</text></g>
<g class="a e2"><rect class="bx" x="10" y="142" width="940" height="68" rx="8"/><circle class="pl" cx="28" cy="176" r="11"/><text class="sm tk c ns" x="28" y="181">2</text><text class="smk ns" x="48" y="170">найдено число и есть запасное</text><text class="mt mu ns" x="48" y="194">ip_autottl=0,1-20:ip_ttl=1</text><rect class="bxo" x="448" y="160" width="100" height="32" rx="6"/><text class="sm tk c ns" x="498" y="181">срок 2</text><text class="m ns" x="580" y="181">c0 r0 r1</text><path class="lm" d="M714 152L714 200"/><text class="sm tk ns" x="726" y="170">сервер: 250 Б, чисто</text><text class="sm ns" x="726" y="194">клиент: ответ получен</text></g>
<g class="a e3"><rect class="bx" x="10" y="218" width="940" height="68" rx="8"/><circle class="pl" cx="28" cy="252" r="11"/><text class="sm tk c ns" x="28" y="257">3</text><text class="smk ns" x="48" y="246">в правилах клиента нет ответов сервера</text><text class="mt mu ns" x="48" y="270">ip_autottl=0,1-20 · 6 отказов в журнале</text><rect class="bxr" x="448" y="236" width="100" height="32" rx="6"/><text class="sm tk c ns" x="498" y="257">срок 64</text><text class="m ns" x="580" y="257">c0 r0 r1 r2 s0</text><path class="lm" d="M714 228L714 276"/><text class="sm tk ns" x="726" y="246">сервер: 680 Б</text><text class="sm ns" x="726" y="270">клиент ждёт</text></g>
