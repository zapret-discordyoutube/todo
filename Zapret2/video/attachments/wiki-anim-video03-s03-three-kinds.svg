<svg xmlns="http://www.w3.org/2000/svg" class="v03-s03-kinds" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="v03-s03-kinds-t v03-s03-kinds-d">
<title id="v03-s03-kinds-t">Три вида опций командной строки</title>
<desc id="v03-s03-kinds-d">Опции командной строки бывают трёх видов: общие (--qnum, --debug, --writable, --lua-init, --blob, --ctrack-disable, --server) настраивают программу целиком; профильные (--filter-tcp и другие фильтры, списки имён и адресов, --name, --template, --import, --cookie, --lua-desync) записываются в профиль, который строится сейчас; «ручка» (--payload, --in-range, --out-range) не записывается в профиль, а хранится в трёх переменных программы (nfq2/nfqws.c:2255-2259); условия профиля по коду можно писать в любом месте профиля, а порядок важен только для ручки.</desc>
