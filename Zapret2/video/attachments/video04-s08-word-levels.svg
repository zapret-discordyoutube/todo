<svg xmlns="http://www.w3.org/2000/svg" class="v04-s08-word-levels" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v04-s08-word-levels-t v04-s08-word-levels-d">
<title id="v04-s08-word-levels-t">Слово номер N справа</title>
<desc id="v04-s08-word-levels-d">Слово любого номера справа в www.example.com: 1-е com, 2-е example, 3-е www, 4-го нет; метки sld, midsld и endsld всегда просят второе. Если после com стоит лишняя точка (www.example.com.), пустое слово после неё считается первым справа, и второе справа становится com. У имени localhost точек нет: в настройке «host, midsld» остаётся одна позиция, host, а midsld молча выпадает (по результатам прогона функций).</desc>
<style>.v04-s08-word-levels{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
