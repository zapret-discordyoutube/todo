<svg xmlns="http://www.w3.org/2000/svg" class="video08-s09-slices-borders-diverge" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="video08-s09-slices-borders-diverge-t video08-s09-slices-borders-diverge-d">
<title id="video08-s09-slices-borders-diverge-t">Границы ломтиков расходятся</title>
<desc id="video08-s09-slices-borders-diverge-d">Метка pos равная 2 на приветствии в 1484 байта даёт части в 2 и 1482 байта и девять пакетов, потому что вторая часть длиннее предела и режется на ломтики по-разному: у настоящего пакета опции занимают 12 байт, максимум 1460 минус 12 равен 1448 и остаток 34, у фейка с MD5 опции занимают 32 байта, максимум 1460 минус 32 равен 1428 и остаток 54, поэтому граница нарезки у фейков на 1430, у настоящих на 1450, второй ломтик начинается с номера 1431 у фейка и 1451 у настоящей части, оба больших пакета занимают по 1500 байт, а сервер всё равно читает 1484 байта, равных оригиналу; при условии срок жизни 1 лишних опций нет и у фейка с настоящей частью границы совпадают, обе части режутся на 1448 и 34 байта.</desc>
