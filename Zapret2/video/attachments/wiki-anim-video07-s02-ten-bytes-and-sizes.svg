<g><text class="cap" x="40" y="24">пример из лаборатории: подделка из десяти байт</text></g>
<g class="a e1"><rect class="bxa" x="40" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="71.0" y="73">16</text><rect class="bxa" x="102" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="133.0" y="73">03</text><rect class="bxs" x="164" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="195.0" y="73">01</text><rect class="bxs" x="226" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="257.0" y="73">00</text><rect class="bxs" x="288" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="319.0" y="73">05</text><rect class="bxb" x="350" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="381.0" y="73">aa</text><rect class="bxb" x="412" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="443.0" y="73">bb</text><rect class="bxb" x="474" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="505.0" y="73">cc</text><rect class="bxb" x="536" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="567.0" y="73">dd</text><rect class="bxb" x="598" y="44" width="62" height="46" rx="0"/><text class="hx c ns" x="629.0" y="73">ee</text></g>
<g class="a e2"><rect class="bxn" x="40" y="44" width="124" height="46" rx="0"/></g>
<g class="a e3"><path class="lm" d="M40 100L346 100"/><text class="sm" x="40" y="120">заголовок записи TLS: 5 байт</text><path class="lb" d="M354 100L660 100"/><text class="sm" x="354" y="120">пять произвольных</text></g>
<g class="a e4"><path class="lf" d="M102 164L102.0 137.0"/><polygon class="hf" points="102,128 106.5,137.0 97.5,137.0"/><text class="smk" x="114" y="160">наш инспектор смотрит только на эти два байта: 16 03</text></g>
<g class="a e5"><rect class="bxo" x="676" y="44" width="244" height="130" rx="10"/><text class="cap c" x="798" y="70">итог опыта</text><text class="sm tk c" x="798" y="96">инспектор: разрешено</text><text class="sm tk c" x="798" y="120">сервер получил 250 байт</text><text class="sm c" x="798" y="144">у подделки было ещё</text><text class="sm c" x="798" y="164">условие MD5, о нём позже</text></g>
<g class="a e6"><rect class="bxd" x="40" y="214" width="880" height="30" rx="6"/><text class="sm mu c" x="480" y="235">свойство нашего игрушечного инспектора, а не настоящего оборудования</text></g>
<g><text class="cap" x="40" y="282">два размера подделки и настоящего: 680 и 250 байт</text></g>
<g class="a e7"><rect class="bxb" x="40" y="304" width="880" height="34" rx="0"/><text class="smk" x="235.8" y="327">встроенный образец: 680 байт</text><rect class="fr" x="201.8" y="304" width="22.0" height="34" rx="0"/><rect class="bxn" x="201.8" y="304" width="22.0" height="34" rx="0"/><text class="sm mu" x="201.8" y="360">имя www.microsoft.com: смещения 125–141</text><text class="ix mu" x="40" y="380">начало: 16 03 01 02 a3, длина записи 675, всего 5 + 675 = 680</text></g>
<g class="a e8"><rect class="bxa" x="40" y="410" width="323.5" height="34" rx="0"/><text class="smk" x="192.9" y="433">настоящее: 250</text><rect class="fr" x="165.5" y="410" width="19.4" height="34" rx="0"/><rect class="bxn" x="165.5" y="410" width="19.4" height="34" rx="0"/><text class="sm mu" x="165.5" y="466">имя www.example.com: смещения 97–111</text><text class="ix mu" x="40" y="486">начало: 16 03 01 00 f5, длина записи 245, всего 5 + 245 = 250</text></g>
<g class="a e9"><rect class="bxr" x="383.5" y="410" width="500" height="34" rx="6"/><text class="smk c" x="633.5" y="433">подделка длиннее на 430 байт: 680 − 250</text></g>
<g class="a e10"><text class="sm" x="40" y="524">и то и другое: запись приветствия TLS, поэтому с первых двух байт 16 03 она выглядит как настоящее начало</text><text class="sm mu" x="40" y="548">откуда взялись байты образца и что в них лежит, разберём ближе к концу выпуска</text></g>
</svg>
