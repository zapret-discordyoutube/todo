<svg xmlns="http://www.w3.org/2000/svg" class="video07-s02-ten-bytes-and-sizes" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="video07-s02-ten-bytes-and-sizes-t video07-s02-ten-bytes-and-sizes-d">
<title id="video07-s02-ten-bytes-and-sizes-t">Десять байт, два размера</title>
<desc id="video07-s02-ten-bytes-and-sizes-d">Реальный пример глубины правдоподобия, блоб из десяти байт 16 03 01 00 05 aa bb cc dd ee, где наш инспектор смотрит только на первые два байта 16 03 и разрешает пакет, и два размера подделок в лаборатории, встроенный образец приветствия в 680 байт с именем www.microsoft.com на смещениях 125–141 и настоящее приветствие в 250 байт с именем www.example.com на смещениях 97–111, разница 430 байт.</desc>
