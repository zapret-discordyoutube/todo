<rect class="bg" x="0" y="0" width="960" height="350"/>
<g class="a e1"><text class="cap" x="30" y="28">позиция — номер байта, перед которым разрез</text><rect class="bxd" x="746" y="10" width="184" height="26" rx="6"/><text class="sm c" x="838" y="28">выдуманный пример</text></g>
<g class="a e2"><rect class="bx" x="40" y="104" width="70" height="50" rx="5"/><text class="ml c" x="75" y="136">T</text><text class="sm mu c" x="75" y="96">0</text><rect class="bx" x="110" y="104" width="70" height="50" rx="5"/><text class="ml c" x="145" y="136">o</text><text class="sm mu c" x="145" y="96">1</text><rect class="bx" x="180" y="104" width="70" height="50" rx="5"/><text class="ml c" x="215" y="136">:</text><text class="sm mu c" x="215" y="96">2</text><rect class="bx" x="250" y="104" width="70" height="50" rx="5"/><path class="lm" d="M276 124 L276 135 L294 135 L294 124"/><text class="sm mu c" x="285" y="96">3</text></g>
<g class="a e3" transform="translate(36 0)"><rect class="bxa" x="320" y="104" width="70" height="50" rx="5"/><text class="ml c" x="355" y="136">A</text><text class="sm mu c" x="355" y="96">4</text><rect class="bxa" x="390" y="104" width="70" height="50" rx="5"/><text class="ml c" x="425" y="136">n</text><text class="sm mu c" x="425" y="96">5</text><rect class="bxa" x="460" y="104" width="70" height="50" rx="5"/><text class="ml c" x="495" y="136">n</text><text class="sm mu c" x="495" y="96">6</text><rect class="bxa" x="530" y="104" width="70" height="50" rx="5"/><text class="ml c" x="565" y="136">a</text><text class="sm mu c" x="565" y="96">7</text></g>
<g class="a e4"><path class="lcut" d="M338 74L338 164"/><text class="sm tk rej c" x="338" y="66">режь на позиции 4</text></g>
<g class="a e5"><path class="lm" d="M40 184v8h280v-8"/><text class="sm tk c" x="180" y="214">слева 4 байта = позиция</text></g>
<g class="a e6"><path class="lm" d="M356 184v8h280v-8"/><text class="sm tk c" x="496" y="214">справа 8 − 4 = 4 байта</text></g>
<g class="a e7"><text class="sm acc c" x="75" y="172">−8</text><text class="sm acc c" x="145" y="172">−7</text><text class="sm acc c" x="215" y="172">−6</text><text class="sm acc c" x="285" y="172">−5</text></g>
<g class="a e8" transform="translate(36 0)"><text class="sm acc c" x="355" y="172">−4</text><text class="sm acc c" x="425" y="172">−3</text><text class="sm acc c" x="495" y="172">−2</text><text class="sm acc c" x="565" y="172">−1</text></g>
<g class="a e9"><text class="sm tk" x="40" y="262">«минус четыре»: 8 − 4 = 4, тот же разрез, перед именем</text></g>
<g class="a e10"><text class="sm tk" x="40" y="286">«минус один»: самый последний байт</text></g>
<g class="a e11"><rect class="bxs" x="664" y="80" width="266" height="148" rx="8"/><text class="tk" x="678" y="104">позиция</text><text class="sm" x="678" y="130">номер байта, перед которым</text><text class="sm" x="678" y="152">разрез. Часть до него</text><text class="sm" x="678" y="174">кончается байтом раньше.</text><text class="sm" x="678" y="196">Число в настройке:</text><text class="sm" x="678" y="218">абсолютная позиция.</text></g>
<g class="a e12"><text class="sm mu" x="40" y="328">Обычное число в настройке, например pos=4, зависит только от места в данных, а не от их содержимого.</text></g>
</svg>
