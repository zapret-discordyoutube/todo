<svg xmlns="http://www.w3.org/2000/svg" class="v04-s02-toy-cut" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="v04-s02-toy-cut-t v04-s02-toy-cut-d">
<title id="v04-s02-toy-cut-t">Позиция это номер байта</title>
<desc id="v04-s02-toy-cut-d">Выдуманный пример: строка «To: Anna» из восьми байт с номерами 0–7. Разрез на позиции 4 ставится перед байтом с номером 4 и делит строку на «To: » и «Anna»: слева 4 байта, то есть столько, какой номер у разреза, справа 8 − 4 = 4 байта. Позиция −4 считается от конца (8 − 4 = 4) и даёт тот же разрез, а −1 это самый последний байт.</desc>
<style>
.v04-s02-toy-cut{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v04-s02-toy-cut{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v04-s02-toy-cut .bg{fill:var(--bg)}
.v04-s02-toy-cut text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v04-s02-toy-cut .tk{font-weight:600;fill:var(--fg)}
.v04-s02-toy-cut .sm{font-size:14.5px}
.v04-s02-toy-cut .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v04-s02-toy-cut .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v04-s02-toy-cut .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v04-s02-toy-cut .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg)}
.v04-s02-toy-cut .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v04-s02-toy-cut .mu{fill:var(--mute)}.v04-s02-toy-cut .fg{fill:var(--fg)}.v04-s02-toy-cut .acc{fill:var(--acc)}.v04-s02-toy-cut .rej{fill:var(--rej)}.v04-s02-toy-cut .ok{fill:var(--ok)}.v04-s02-toy-cut .amb{fill:var(--amb)}
.v04-s02-toy-cut .c{text-anchor:middle}.v04-s02-toy-cut .r{text-anchor:end}
.v04-s02-toy-cut .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v04-s02-toy-cut .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v04-s02-toy-cut .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v04-s02-toy-cut .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v04-s02-toy-cut .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v04-s02-toy-cut .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v04-s02-toy-cut .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v04-s02-toy-cut .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v04-s02-toy-cut .bxda{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:5 4}
.v04-s02-toy-cut .pill{fill:var(--bg);stroke:none}
.v04-s02-toy-cut .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v04-s02-toy-cut .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v04-s02-toy-cut .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v04-s02-toy-cut .la{fill:none;stroke:var(--acc);stroke-width:2}
.v04-s02-toy-cut .lad{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4}
.v04-s02-toy-cut .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v04-s02-toy-cut .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v04-s02-toy-cut .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v04-s02-toy-cut .hf{fill:var(--fg2)}.v04-s02-toy-cut .ha{fill:var(--acc)}.v04-s02-toy-cut .hr{fill:var(--rej)}.v04-s02-toy-cut .hm{fill:var(--mute)}
.v04-s02-toy-cut .a{animation-duration:26s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v04-s02-toy-cut .a{animation:none}.v04-s02-toy-cut .tr{display:none}}
@keyframes v04-s02-toy-cut-k1{0.0%{opacity:0}1.154%{opacity:0}2.885%{opacity:1}95.769%{opacity:1}98.077%{opacity:0}100%{opacity:0}}.v04-s02-toy-cut .e1{animation-name:v04-s02-toy-cut-k1}
