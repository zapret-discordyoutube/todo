@keyframes v04-s02-toy-cut-k8{0.0%{opacity:0}50.0%{opacity:0}51.731%{opacity:1}95.769%{opacity:1}98.077%{opacity:0}100%{opacity:0}}.v04-s02-toy-cut .e8{animation-name:v04-s02-toy-cut-k8}
