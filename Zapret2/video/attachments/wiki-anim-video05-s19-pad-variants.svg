.v05-s19-pad-variants .fa{fill:var(--tint);stroke:none}.v05-s19-pad-variants .fr{fill:var(--rejt);stroke:none}.v05-s19-pad-variants .fb{fill:var(--ambt);stroke:none}.v05-s19-pad-variants .fo{fill:var(--okt);stroke:none}
.v05-s19-pad-variants .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v05-s19-pad-variants .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v05-s19-pad-variants .la{fill:none;stroke:var(--acc);stroke-width:2}
.v05-s19-pad-variants .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v05-s19-pad-variants .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v05-s19-pad-variants .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v05-s19-pad-variants .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v05-s19-pad-variants .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v05-s19-pad-variants .hf{fill:var(--fg2)}.v05-s19-pad-variants .ha{fill:var(--acc)}.v05-s19-pad-variants .hr{fill:var(--rej)}.v05-s19-pad-variants .hm{fill:var(--mute)}.v05-s19-pad-variants .hb{fill:var(--amb)}
.v05-s19-pad-variants .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v05-s19-pad-variants .a{animation-duration:62s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v05-s19-pad-variants .a{animation:none}.v05-s19-pad-variants .tr{display:none}}
