}100%{opacity:0}}.v05-s19-pad-variants .e20{animation-name:v05-s19-pad-variants-k20}@keyframes v05-s19-pad-variants-k21{0.0%{opacity:0}58.065%{opacity:0}58.79%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s19-pad-variants .e21{animation-name:v05-s19-pad-variants-k21}@keyframes v05-s19-pad-variants-k22{0.0%{opacity:0}64.516%{opacity:0}65.242%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s19-pad-variants .e22{animation-name:v05-s19-pad-variants-k22}</style>
<rect class="bg" x="0" y="0" width="960" height="628"/>
<g><text class="cap" x="40" y="24">что подложить и сколько: шесть опытов, везде разрез midsld, кроме строки 6</text></g>
<g class="a e1"><text class="cap" x="68" y="54">аргументы</text><text class="cap" x="420" y="54">подкладка, первые байты</text><text class="cap" x="690" y="54">пакет 1: номер, длина</text></g>
<g class="a e2"><rect class="bx" x="40" y="64" width="880" height="46" rx="5"/><text class="mk" x="52" y="84">1</text><text class="ix fg" x="72" y="84">seqovl=5</text><text class="ix fg" x="420" y="84">00 00 00 00 00</text><text class="mk" x="690" y="84">−4, 109</text><text class="ix mu" x="72" y="102">узор по умолчанию: пять нулевых байт</text></g>
<g class="a e3"><text class="tk c ok" x="906" y="90">✓</text></g>
<g class="a e4"><rect class="bx" x="40" y="114" width="880" height="46" rx="5"/><text class="mk" x="52" y="134">2</text><text class="ix fg" x="72" y="134">seqovl=5:seqovl_pattern=0x1603030000</text><text class="ix fg" x="420" y="134">16 03 03 00 00</text><text class="mk" x="690" y="134">−4, 109</text><text class="ix mu" x="72" y="152">по виду: тип записи, версия, длина 0; из примера в документации zapret2, почему такая, не объяснено</text></g>
<g class="a e5"><text class="tk c ok" x="906" y="140">✓</text></g>
<g class="a e6"><rect class="bx" x="40" y="164" width="880" height="46" rx="5"/><text class="mk" x="52" y="184">3</text><text class="ix fg" x="72" y="184">seqovl=10:seqovl_pattern=0xABCD</text><text class="ix fg" x="420" y="184">AB CD AB CD AB CD AB CD AB CD</text><text class="mk" x="690" y="184">−9, 114</text><text class="ix mu" x="72" y="202">узор короче накладки: AB CD повторён 5 раз</text></g>
<g class="a e7"><text class="tk c ok" x="906" y="190">✓</text></g>
<g class="a e8"><rect class="bx" x="40" y="214" width="880" height="46" rx="5"/><text class="mk" x="52" y="234">4</text><text class="ix fg" x="72" y="234">seqovl=64:seqovl_pattern=fake_default_tls</text><text class="ix fg" x="420" y="234">16 03 01 02 A3 01 00 02 …</text><text class="mk" x="690" y="234">−63, 168</text><text class="ix mu" x="72" y="252">имя готового блоба в 680 байт: берутся первые 64</text></g>
<g class="a e9"><text class="tk c ok" x="906" y="240">✓</text></g>
<g class="a e10"><rect class="bx" x="40" y="264" width="880" height="46" rx="5"/><text class="mk" x="52" y="284">5</text><text class="ix fg" x="72" y="284">seqovl=1</text><text class="ix fg" x="420" y="284">00</text><text class="mk" x="690" y="284">0, 105</text><text class="ix mu" x="72" y="302">самая короткая накладка: один нулевой байт</text></g>
<g class="a e11"><text class="tk c ok" x="906" y="290">✓</text></g>
<g class="a e12"><rect class="bx" x="40" y="314" width="880" height="46" rx="5"/><text class="mk" x="52" y="334">6</text><text class="ix fg" x="72" y="334">pos=2:seqovl=100</text><text class="ix fg" x="420" y="334">00 00 00 00 … (100 нулей)</text><text class="mk" x="690" y="334">−99, 102</text><text class="ix mu" x="72" y="352">подкладка больше настоящих данных (2 байта): проверки нет</text></g>
<g class="a e13"><text class="tk c ok" x="906" y="340">✓</text></g>
<g class="a e14"><text class="sm tk" x="40" y="380">✓: сервер прочитал оригинал без изменений во всех шести опытах (250 байт, содержимое совпало)</text></g>
<g class="a e15"><text class="sm" x="40" y="402">длина узора не важна: короткий повторяется, длинный обрезается; накладка только перед первой частью</text></g>
<g class="a e16"><text class="cap" x="40" y="436">ещё опыт: pos=2,host,midsld:seqovl=5, четыре части, подкладка только у первой</text></g>
<g class="a e17"><rect class="bxb" x="40" y="448" width="185" height="64" rx="6"/><text class="cap ns" x="50" y="470">пакет 1</text><text class="sm tk" x="50" y="490">номер −4, длина 7</text><text class="ix mu" x="50" y="507">подкладка 5 + часть 2</text></g>
<g class="a e18"><rect class="bxa" x="235" y="448" width="185" height="64" rx="6"/><text class="cap ns" x="245" y="470">пакет 2</text><text class="sm tk" x="245" y="490">номер 3, длина 95</text><text class="ix mu" x="245" y="507">без подкладки</text></g>
<g class="a e19"><rect class="bxa" x="430" y="448" width="185" height="64" rx="6"/><text class="cap ns" x="440" y="470">пакет 3</text><text class="sm tk" x="440" y="490">номер 98, длина 7</text><text class="ix mu" x="440" y="507">без подкладки</text></g>
<g class="a e20"><rect class="bxa" x="625" y="448" width="295" height="64" rx="6"/><text class="cap ns" x="635" y="470">пакет 4</text><text class="sm tk" x="635" y="490">номер 105, длина 146</text><text class="ix mu" x="635" y="507">без подкладки</text></g>
<g class="a e21"><text class="sm mu" x="40" y="536">в первом пакете 2 настоящих байта (разрез после 2) и подкладка: 5 + 2 = 7</text></g>
<g class="a e22"><rect class="bxd" x="40" y="552" width="880" height="62" rx="6"/><text class="sm tk" x="52" y="574">длина накладки: целое положительное, пробовали от 1 до 1400 байт</text><text class="sm" x="52" y="596">нашему серверу узор безразличен, а игрушечному проверяющему нет: это видно дальше в выпуске</text></g>
</svg>
