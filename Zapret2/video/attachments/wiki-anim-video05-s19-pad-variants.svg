<svg xmlns="http://www.w3.org/2000/svg" class="v05-s19-pad-variants" viewBox="0 0 960 628" width="960" height="628" role="img" aria-labelledby="v05-s19-pad-variants-t v05-s19-pad-variants-d">
<title id="v05-s19-pad-variants-t">Что можно подложить</title>
<desc id="v05-s19-pad-variants-d">Что можно подложить в накладке, шесть настоящих опытов на приветствии в 250 байт: seqovl=5 даёт пять нулевых байт и первый пакет с номером -4 и длиной 109; seqovl=5 с узором 0x1603030000 даёт 16 03 03 00 00 (по виду начало заголовка записи TLS, строка взята из примера в документации zapret2, почему такая, там не объяснено) с теми же -4 и 109; seqovl=10 с узором 0xABCD повторяет AB CD пять раз и даёт -9 и 114; seqovl=64 с блобом fake_default_tls берёт первые 64 байта из 680 и даёт -63 и 168; seqovl=1 даёт один нулевой байт, номер 0 и длину 105; pos=2 с seqovl=100 даёт сто нулей перед двумя настоящими байтами, -99 и 102, проверки что накладка меньше первой части нет; во всех шести опытах сервер прочитал оригинал без изменений; внизу опыт со списком pos=2,host,midsld и накладкой 5, где четыре пакета -4 и 7, 3 и 95, 98 и 7, 105 и 146 и подкладка есть только у первого.</desc>
<style>.v05-s19-pad-variants{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v05-s19-pad-variants{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
