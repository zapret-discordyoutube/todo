<svg xmlns="http://www.w3.org/2000/svg" class="v07-s20-seven-conditions" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="v07-s20-seven-conditions-t v07-s20-seven-conditions-d">
<title id="v07-s20-seven-conditions-t">Семь условий: где остаётся подделка</title>
<desc id="v07-s20-seven-conditions-d">Семь условий подделки в одной таблице: срок жизни убивает её на роутере, а шесть остальных (MD5, контрольная сумма, номер, подтверждение, снятый ACK, старая метка времени) пускают её до получателя, который отбрасывает её сам и в пяти случаях оставляет след в счётчике ядра, а при снятом ACK молчит, причём всё измерено на одном получателе, Linux 6.18, и игрушечном инспекторе.</desc>
<style>.v07-s20-seven-conditions{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
