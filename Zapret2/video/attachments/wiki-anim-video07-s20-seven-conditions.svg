x)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e4{animation-name:v07-s20-seven-conditions-k4}@keyframes v07-s20-seven-conditions-k5{0.0%{opacity:0;transform:translate(0px,-6px)}25%{opacity:0;transform:translate(0px,-6px)}27%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e5{animation-name:v07-s20-seven-conditions-k5}@keyframes v07-s20-seven-conditions-k6{0.0%{opacity:0;transform:translate(0px,-6px)}30%{opacity:0;transform:translate(0px,-6px)}32%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e6{animation-name:v07-s20-seven-conditions-k6}@keyframes v07-s20-seven-conditions-k7{0.0%{opacity:0;transform:translate(0px,-6px)}35%{opacity:0;transform:translate(0px,-6px)}37%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e7{animation-name:v07-s20-seven-conditions-k7}@keyframes v07-s20-seven-conditions-k8{0.0%{opacity:0;transform:translate(0px,-6px)}40%{opacity:0;transform:translate(0px,-6px)}42%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e8{animation-name:v07-s20-seven-conditions-k8}@keyframes v07-s20-seven-conditions-k9{0.0%{opacity:0;transform:translate(0px,-6px)}45%{opacity:0;transform:translate(0px,-6px)}47%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e9{animation-name:v07-s20-seven-conditions-k9}@keyframes v07-s20-seven-conditions-k10{0.0%{opacity:0;transform:translate(0px,-6px)}50%{opacity:0;transform:translate(0px,-6px)}52%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e10{animation-name:v07-s20-seven-conditions-k10}@keyframes v07-s20-seven-conditions-k11{0.0%{opacity:0;transform:translate(0px,-6px)}56.25%{opacity:0;transform:translate(0px,-6px)}58.25%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e11{animation-name:v07-s20-seven-conditions-k11}@keyframes v07-s20-seven-conditions-k12{0.0%{opacity:0;transform:translate(0px,-6px)}65%{opacity:0;transform:translate(0px,-6px)}67%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s20-seven-conditions .e12{animation-name:v07-s20-seven-conditions-k12}</style>
<rect class="bg" x="0" y="0" width="960" height="600"/>
<g><text class="cap" x="40" y="26">семь условий подделки: где она остаётся и что делает получатель</text></g>
<g class="a e1"><text class="cap" x="52" y="52">условие</text><text class="cap" x="246" y="52">где остаётся</text><text class="cap" x="446" y="52">получатель</text><text class="cap" x="686" y="52">счётчик ядра</text></g>
<g class="a e2"><text class="tk sm amb" x="40" y="82">на дороге</text></g>
<g class="a e3"><rect class="bxb" x="40" y="90" width="880" height="48" rx="6"/><text class="tk sm" x="52" y="110">срок жизни</text><text class="m" x="52" y="129">ip_ttl, ip_autottl</text><text class="sm" x="246" y="110">умирает на роутере,</text><text class="sm" x="246" y="129">до сервера не доходит</text><text class="sm" x="446" y="119">ничего не видит</text><text class="sm" x="686" y="110">нет; клиенту приходит</text><text class="sm" x="686" y="129">ICMP «время истекло»</text></g>
<g class="a e4"><text class="tk sm ok" x="40" y="160">у получателя: подделка доходит, он выбрасывает её сам</text></g>
<g class="a e5"><rect class="bx" x="40" y="168" width="880" height="48" rx="6"/><text class="tk sm" x="52" y="188">MD5</text><text class="m" x="52" y="207">tcp_md5</text><text class="sm" x="246" y="188">доходит до сервера</text><text class="sm" x="446" y="197">отбрасывает</text><text class="mk" x="686" y="197">TCPMD5Unexpected</text></g>
<g class="a e6"><rect class="bx" x="40" y="222" width="880" height="48" rx="6"/><text class="tk sm" x="52" y="242">контрольная сумма</text><text class="m" x="52" y="261">badsum</text><text class="sm" x="246" y="242">доходит до сервера</text><text class="sm" x="446" y="251">отбрасывает</text><text class="mk" x="686" y="251">Tcp:InCsumErrors</text></g>
<g class="a e7"><rect class="bx" x="40" y="276" width="880" height="48" rx="6"/><text class="tk sm" x="52" y="296">номер</text><text class="m" x="52" y="315">tcp_seq ≤ −680</text><text class="sm" x="246" y="296">доходит до сервера</text><text class="sm" x="446" y="305">отбрасывает как старое</text><text class="mk" x="686" y="305">TCPDSACKOldSent</text></g>
<g class="a e8"><rect class="bx" x="40" y="330" width="880" height="48" rx="6"/><text class="tk sm" x="52" y="350">подтверждение</text><text class="m" x="52" y="369">tcp_ack</text><text class="sm" x="246" y="350">доходит до сервера</text><text class="sm" x="446" y="359">отвечает ответом-вызовом</text><text class="mk" x="686" y="359">TCPChallengeACK</text></g>
<g class="a e9"><rect class="bx" x="40" y="384" width="880" height="48" rx="6"/><text class="tk sm" x="52" y="404">флаг ACK снят</text><text class="m" x="52" y="423">tcp_flags_unset=ack</text><text class="sm" x="246" y="404">доходит до сервера</text><text class="sm" x="446" y="413">молча отбрасывает</text><text class="sm mu" x="686" y="413">нет</text></g>
<g class="a e10"><rect class="bx" x="40" y="438" width="880" height="48" rx="6"/><text class="tk sm" x="52" y="458">метка времени</text><text class="m" x="52" y="477">tcp_ts ≤ −2</text><text class="sm" x="246" y="458">доходит до сервера</text><text class="sm" x="446" y="467">отбрасывает</text><text class="mk" x="686" y="467">PAWSEstab</text></g>
<g class="a e11"><rect class="bxs" x="40" y="498" width="880" height="30" rx="6"/><text class="sm" x="52" y="518">номер вперёд: в окне приёма TCPOFOQueue, за окном BeyondWindow и пустое подтверждение</text></g>
<g class="a e12"><rect class="bxa" x="40" y="536" width="880" height="54" rx="8"/><text class="sm tk" x="52" y="558">наша игрушка стоит в первом роутере, до проверки срока жизни, и видит подделку в обоих случаях</text><text class="sm mu" x="52" y="580">измерено на одном получателе (Linux 6.18) и на игрушке проекта; о настоящем ТСПУ неизвестно</text></g>
</svg>
