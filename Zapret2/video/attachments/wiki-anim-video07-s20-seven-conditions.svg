.v07-s20-seven-conditions .hf{fill:var(--fg2)}.v07-s20-seven-conditions .ha{fill:var(--acc)}.v07-s20-seven-conditions .hr{fill:var(--rej)}.v07-s20-seven-conditions .hm{fill:var(--mute)}.v07-s20-seven-conditions .hb{fill:var(--amb)}
.v07-s20-seven-conditions .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v07-s20-seven-conditions .a{animation-duration:40s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
