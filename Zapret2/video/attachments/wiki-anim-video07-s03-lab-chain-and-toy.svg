<svg xmlns="http://www.w3.org/2000/svg" class="video07-s03-lab-chain-and-toy" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="video07-s03-lab-chain-and-toy-t video07-s03-lab-chain-and-toy-d">
<title id="video07-s03-lab-chain-and-toy-t">Лаборатория и инспектор</title>
<desc id="video07-s03-lab-chain-and-toy-d">Лаборатория выпуска: клиент 10.1.0.1, от одного до трёх роутеров и сервер 10.2.0.2 с Linux 6.18, четыре точки съёмки c0, r0, r1 и s0 со сроками жизни 64, 64, 63 и 63 у пакета с данными, точки r2 и r3 на длинных цепочках, игрушечный инспектор первого пакета на входе в роутер 1, который решает один раз по первому пакету с данными, и счётчики ядра, например число повторных отправок клиента, выросшее с 0 до 5 в опыте с игрушкой.</desc>
