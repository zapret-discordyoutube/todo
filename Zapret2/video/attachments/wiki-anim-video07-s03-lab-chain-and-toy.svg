<rect class="bg" x="0" y="0" width="960" height="700"/>
<g><text class="cap" x="40" y="24">лаборатория: цепочка роутеров и четыре точки съёмки</text></g>
<g class="a e1"><path class="lm" d="M150 104L765.0 104.0"/><polygon class="hm" points="774,104 765.0,108.5 765.0,99.5"/><rect class="bx" x="40" y="68" width="110" height="72" rx="8"/><text class="sm tk c" x="95" y="96">клиент</text><text class="ix c" x="95" y="118">10.1.0.1</text><rect class="bx" x="230" y="68" width="100" height="72" rx="8"/><text class="sm tk c" x="280" y="100">роутер 1</text><rect class="pill" x="400" y="68" width="90" height="72" rx="8"/><rect class="bxd" x="400" y="68" width="90" height="72" rx="8"/><text class="sm mu c" x="445" y="100">роутер 2</text><rect class="pill" x="560" y="68" width="90" height="72" rx="8"/><rect class="bxd" x="560" y="68" width="90" height="72" rx="8"/><text class="sm mu c" x="605" y="100">роутер 3</text><rect class="bx" x="780" y="68" width="140" height="72" rx="8"/><text class="sm tk c" x="850" y="96">сервер</text><text class="ix c" x="850" y="118">10.2.0.2</text></g>
<g class="a e2"><circle class="dot" cx="168" cy="104" r="6"/><text class="sm tk c" x="168" y="166">c0</text><circle class="dot" cx="216" cy="104" r="6"/><text class="sm tk c" x="216" y="166">r0</text><circle class="dot" cx="344" cy="104" r="6"/><text class="sm tk c" x="344" y="166">r1</text><circle class="dotb" cx="504" cy="104" r="6"/><text class="sm mu c" x="504" y="166">r2</text><circle class="dotb" cx="664" cy="104" r="6"/><text class="sm mu c" x="664" y="166">r3</text><circle class="dot" cx="766" cy="104" r="6"/><text class="sm tk c" x="766" y="166">s0</text></g>
<g class="a e3"><rect class="bxb" x="207" y="74" width="12" height="60" rx="3"/><text class="sm tk amb c" x="213" y="56">игрушка на входе</text></g>
<g class="a e4"><text class="ml c" x="168" y="192">64</text><text class="ml c" x="216" y="192">64</text><text class="ml c" x="344" y="192">63</text><text class="ml c" x="766" y="192">63</text><text class="sm" x="40" y="216">числа под точками: срок жизни пакета с данными; вход в роутер ещё не вычел единицу, выход уже вычел</text></g>
<g class="a e5"><text class="sm mu" x="40" y="244">c0 это сетевая карта клиента после работы программы, r0 вход в роутер 1, r1 выход из него, s0 сетевая карта</text><text class="sm mu" x="40" y="264">сервера; r2 и r3 выходы из второго и третьего роутера, они есть на цепочках из двух и трёх роутеров</text></g>
<g><text class="cap" x="40" y="296">игрушка первого пакета: наша модель наблюдателя</text></g>
<g class="a e6"><rect class="bxb" x="40" y="312" width="880" height="36" rx="8"/><text class="sm" x="56" y="336">вторая копия nfqws2 и один скрипт на Lua: читает, пишет решение в журнал, выбрасывает</text></g>
<g class="a e7"><rect class="bx" x="40" y="358" width="880" height="34" rx="6"/><circle class="pl" cx="60" cy="375" r="11"/><text class="sm tk c ns" x="60" y="380">1</text><text class="sm" x="82" y="380">следит за одним соединением клиент → сервер и решает один раз, по первому пакету с данными</text></g>
<g class="a e8"><rect class="bxr" x="40" y="400" width="880" height="34" rx="6"/><circle class="pl" cx="60" cy="417" r="11"/><text class="sm tk c ns" x="60" y="422">2</text><text class="sm" x="82" y="422">имя www.example.com внутри: ЗАПРЕТ, этот пакет и все следующие данные клиента выбрасываются</text></g>
<g class="a e9"><rect class="bxo" x="40" y="442" width="880" height="34" rx="6"/><circle class="pl" cx="60" cy="459" r="11"/><text class="sm tk c ns" x="60" y="464">3</text><text class="sm" x="82" y="464">запись приветствия TLS или строка запроса HTTP без имени: РАЗРЕШЕНО, дальше пакеты не смотрятся</text></g>
<g class="a e10"><text class="sm mu" x="40" y="498">стоит на входе в роутер 1 до проверки срока жизни; наше допущение, не знание об оборудовании</text></g>
<g><text class="cap" x="40" y="530">получатель: сервер на Linux 6.18, два слоя</text></g>
<g class="a e11"><rect class="bx" x="40" y="546" width="420" height="60" rx="8"/><text class="tk" x="56" y="570">ядро</text><text class="sm" x="56" y="592">принимает пакеты, ведёт счётчики</text></g>
<g class="a e12"><rect class="bx" x="480" y="546" width="440" height="60" rx="8"/><text class="tk" x="496" y="570">приложение</text><text class="sm" x="496" y="592">получает принятое ядром, пишет сколько байт</text></g>
<g class="a e13"><rect class="bx" x="40" y="618" width="300" height="66" rx="8"/><text class="sm tk" x="56" y="642">счётчики ядра клиента</text><text class="m" x="56" y="666">Tcp: RetransSegs</text><rect class="bxa" x="350" y="618" width="250" height="66" rx="8"/><text class="mk" x="366" y="642">до: 0, после: 5</text><text class="sm" x="366" y="666">разность 5, опыт с игрушкой</text></g>
<g class="a e14"><rect class="bxd" x="612" y="618" width="308" height="66" rx="8"/><text class="sm mu" x="626" y="640">имя читаем как причину: наше</text><text class="sm mu" x="626" y="659">чтение, доказано лишь, что счётчик</text><text class="sm mu" x="626" y="678">сдвинулся</text></g>
</svg>
