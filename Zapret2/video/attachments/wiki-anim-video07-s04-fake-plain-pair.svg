<svg xmlns="http://www.w3.org/2000/svg" class="v07-s04-fake-plain-pair" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="v07-s04-fake-plain-pair-t v07-s04-fake-plain-pair-d">
<title id="v07-s04-fake-plain-pair-t">Фейк без условий: два пакета на одном номере</title>
<desc id="v07-s04-fake-plain-pair-d">Фейк без единого условия на интерфейсе клиента: сначала пакет с данными в 680 байт, номер 1, срок жизни 64, идентификатор IP 191, затем настоящее приветствие в 250 байт с теми же номером и идентификатором, оба проходят все четыре точки, и игрушка, прочитав первый пакет с данными, то есть подделку, не находит запрещённого имени и разрешает соединение, так что первая задача подделки выполнена.</desc>
