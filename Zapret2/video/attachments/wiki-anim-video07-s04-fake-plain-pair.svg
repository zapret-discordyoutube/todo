-plain-pair-k9}@keyframes v07-s04-fake-plain-pair-k10{0.0%{opacity:0;transform:translate(0px,-6px)}35%{opacity:0;transform:translate(0px,-6px)}37%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s04-fake-plain-pair .e10{animation-name:v07-s04-fake-plain-pair-k10}@keyframes v07-s04-fake-plain-pair-k11{0.0%{opacity:0;transform:translate(0px,-6px)}42.5%{opacity:0;transform:translate(0px,-6px)}44.5%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s04-fake-plain-pair .e11{animation-name:v07-s04-fake-plain-pair-k11}@keyframes v07-s04-fake-plain-pair-k12{0.0%{opacity:0;transform:translate(0px,-6px)}50%{opacity:0;transform:translate(0px,-6px)}52%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s04-fake-plain-pair .e12{animation-name:v07-s04-fake-plain-pair-k12}</style>
<rect class="bg" x="0" y="0" width="960" height="572"/>
<g><text class="cap" x="40" y="24">опыт: фейк без условий, игрушка включена</text></g>
<g class="a e1"><rect class="bxs" x="40" y="38" width="880" height="38" rx="6"/><text class="m" x="54" y="63">--payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls</text></g>
<g class="a e2"><text class="sm mu" x="40" y="100">номера относительные: начало соединения 0, первый байт данных клиента 1; флаги AP это PSH и ACK</text></g>
<g class="a e3"><text class="cap" x="40" y="134">пакет</text><text class="cap" x="130" y="134">байт данных</text><text class="cap" x="260" y="134">флаги</text><text class="cap" x="340" y="134">номер</text><text class="cap" x="420" y="134">срок жизни</text><text class="cap" x="540" y="134">ip id</text><text class="cap" x="620" y="134">что это</text></g>
<g class="a e4"><rect class="bxb" x="40" y="146" width="880" height="34" rx="5"/><text class="tk sm" x="52" y="169">1-й</text><text class="mk amb" x="130" y="169">680</text><text class="mk" x="260" y="169">AP</text><text class="mk" x="340" y="169">1</text><text class="mk" x="420" y="169">64</text><text class="mk" x="540" y="169">191</text><text class="sm" x="620" y="169">подделка: встроенный образец</text></g>
<g class="a e5"><rect class="bxa" x="40" y="188" width="880" height="34" rx="5"/><text class="tk sm" x="52" y="211">2-й</text><text class="mk fg" x="130" y="211">250</text><text class="mk" x="260" y="211">AP</text><text class="mk" x="340" y="211">1</text><text class="mk" x="420" y="211">64</text><text class="mk" x="540" y="211">191</text><text class="sm" x="620" y="211">настоящее приветствие</text></g>
<g class="a e6"><text class="sm" x="40" y="246">Оба видны на всех четырёх точках: срок жизни 64 на c0 и r0, 63 на r1 и s0. Номер и идентификатор IP одни.</text></g>
<g class="a e7"><text class="cap" x="40" y="286">байты потока по номерам</text></g>
<g class="a e8"><rect class="bxb" x="40" y="300" width="880" height="34" rx="4"/><rect class="bxa" x="40" y="300" width="323.5" height="34" rx="4"/><text class="mk c" x="201.8" y="322">настоящий 1–250</text><text class="mk amb c" x="790.6" y="322">подделка 1–680</text></g>
<g class="a e9"><path class="lf" d="M40 338L40 350"/><text class="ix" x="46" y="362">1</text><path class="lf" d="M363.5 338L363.5 350"/><text class="ix" x="367.5" y="362">250</text><path class="lf" d="M920 338L920 350"/><text class="ix r" x="914" y="362">680</text></g>
<g class="a e10"><rect class="bx" x="40" y="392" width="540" height="112" rx="6"/><text class="cap" x="52" y="412">журнал игрушки</text><text class="mn" x="52" y="434">TOY first data packet is a TLS handshake record</text><text class="mn" x="52" y="450">without the blocked name: connection ALLOWED,</text><text class="mn" x="52" y="466">not examining the rest   (len=680)</text><text class="mn" x="52" y="490">TOY allowed connection: not examined   (len=250)</text></g>
<g class="a e11"><rect class="bxo" x="600" y="392" width="320" height="112" rx="6"/><text class="tk sm" x="614" y="420">игрушка читает первый пакет</text><text class="tk sm" x="614" y="442">с данными, то есть подделку:</text><text class="sm" x="614" y="466">имени нет, запись TLS, разрешено.</text><text class="sm" x="614" y="488">Настоящий пакет уже не читают.</text></g>
<g class="a e12"><rect class="bxs" x="40" y="520" width="880" height="40" rx="8"/><text class="tk sm" x="56" y="546">Первая задача выполнена: в нашем тесте игрушка обманута.</text></g>
</svg>
