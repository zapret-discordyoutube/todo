<rect class="bg" x="0" y="0" width="960" height="1004"/>
<g><text class="cap" x="40" y="24">опыт 3 · pos=1448: метка ровно на границе клиентских сегментов</text></g>
<g class="a e1"><rect class="bxa" x="40" y="46" width="819.6" height="24" rx="0"/><text class="ix c fg tk" x="449.8" y="63">кусок 1: окно [1, 1449)</text><rect class="bxb" x="859.6" y="46" width="20.4" height="24" rx="0"/><path class="lcut" d="M859.6 42L859.6 74"/></g>
<g class="a e2"><text class="sm r rej tk" x="851.6" y="94">метка на смещении 1448 (позиция 1449): не входит в окно 1, а в окне 2 это позиция 1 ▲</text></g>
<g class="a e3"><text class="sm mu" x="40" y="116">метка «падает в щель» между окнами: это ответ на вопрос про окна кусков</text></g>
<g class="a e4"><text class="sm tk" x="40" y="144">новая: режет всю ленту по метке 1448, переставляет сегменты</text><rect class="bxb" x="859.6" y="172" width="20.4" height="24" rx="0"/><circle class="bxb" cx="869.8" cy="160" r="11"/><text class="ix c fg tk ns" x="869.8" y="164.5">1</text><rect class="bxa" x="40" y="172" width="819.6" height="24" rx="0"/><circle class="bxa" cx="449.8" cy="160" r="11"/><text class="ix c fg tk ns" x="449.8" y="164.5">2</text><path class="lcut" d="M859.6 168L859.6 200"/><text class="m" x="40" y="218">на проводе: 36@1448, 1448@0</text><text class="m" x="40" y="240">ответы: ACK 1 и блок [1449,1485); ACK 1485</text><text class="sm tk" x="40" y="262">приложение: одно чтение, 1484 байта</text></g>
<g class="a e5"><text class="sm tk" x="40" y="290">старая: в журнале дважды «no normalized split pos in this packet»</text><rect class="bxa" x="40" y="318" width="819.6" height="24" rx="0"/><circle class="bxa" cx="449.8" cy="306" r="11"/><text class="ix c fg tk ns" x="449.8" y="310.5">1</text><rect class="bxb" x="859.6" y="318" width="20.4" height="24" rx="0"/><circle class="bxb" cx="869.8" cy="306" r="11"/><text class="ix c fg tk ns" x="869.8" y="310.5">2</text><path class="lcut" d="M859.6 314L859.6 346"/><text class="m" x="40" y="364">на проводе: 1448@0, 36@1448</text><text class="m" x="40" y="386">ответы: ACK 1449, потом ACK 1486 вместе с FIN</text><text class="sm tk" x="40" y="408">приложение: два чтения, 1448 и 36 (зависит от момента чтения)</text></g>
<g class="a e6"><text class="cap" x="52" y="432">позиции</text><text class="cap" x="212" y="432">новая: режет всю ленту</text><text class="cap" x="552" y="432">старая: каждый кусок отдельно</text></g>
<g class="a e7"><rect class="bx" x="40" y="442" width="160" height="50" rx="6"/><text class="mk" x="52" y="472">midsld</text><rect class="bxa" x="210" y="442" width="330" height="50" rx="6"/><text class="mk" x="222" y="463">1380@104, 104@0</text><text class="sm" x="222" y="482">пакет в 1380 пересекает границу</text><rect class="bxb" x="550" y="442" width="370" height="50" rx="6"/><text class="mk" x="562" y="463">1344@104, 104@0, 36@1448</text><text class="sm" x="562" y="482">пакеты внутри клиентских сегментов</text></g>
<g class="a e8"><rect class="bx" x="40" y="500" width="160" height="50" rx="6"/><text class="mk" x="52" y="530">midsld, −1</text><rect class="bxa" x="210" y="500" width="330" height="50" rx="6"/><text class="mk" x="222" y="521">1@1483, 1379@104, 104@0</text><text class="sm" x="222" y="540">последний байт первым</text><rect class="bxb" x="550" y="500" width="370" height="50" rx="6"/><text class="mk" x="562" y="521">1344@104, 104@0, 1@1483, 35@1448</text><text class="sm" x="562" y="540">последний байт после первого куска</text></g>
<g class="a e9"><rect class="bx" x="40" y="558" width="160" height="50" rx="6"/><text class="mk" x="52" y="588">только −1</text><rect class="bxa" x="210" y="558" width="330" height="50" rx="6"/><text class="mk" x="222" y="579">1@1483, 1448@0, 35@1448</text><text class="sm" x="222" y="598">начинает с последнего байта</text><rect class="bxb" x="550" y="558" width="370" height="50" rx="6"/><text class="mk" x="562" y="579">1448@0, 1@1483, 35@1448</text><text class="sm" x="562" y="598">начинает с копии первого куска</text></g>
<g class="a e10"><rect class="bx" x="40" y="616" width="160" height="50" rx="6"/><text class="mk" x="52" y="646">граница 1448</text><rect class="bxa" x="210" y="616" width="330" height="50" rx="6"/><text class="mk" x="222" y="637">36@1448, 1448@0</text><text class="sm" x="222" y="656">переставляет сегменты</text><rect class="bxb" x="550" y="616" width="370" height="50" rx="6"/><text class="mk" x="562" y="637">1448@0, 36@1448</text><text class="sm" x="562" y="656">ничего не переставлено</text></g>
<g class="a e11"><rect class="bxd" x="40" y="686" width="880" height="34" rx="6"/><text class="sm tk" x="52" y="708">проверь себя: старая функция, pos=1447, байт перед границей; что и в каком порядке?</text></g>
<g class="a e12"><rect class="bxo" x="40" y="730" width="880" height="86" rx="6"/><text class="sm tk" x="52" y="753">смещение 1447, в коде позиция 1448: в окно куска 1 входит, в окно куска 2 нет</text><text class="sm tk" x="52" y="777">кусок 1: сначала 1@1447, потом 1447@0 (обратный порядок); кусок 2 уходит копией, 36@1448</text><text class="sm" x="52" y="801">это счёт по коду, такой опыт мы не запускали</text></g>
<g class="a e13"><text class="cap" x="40" y="836">итог части</text></g>
<g class="a e14"><rect class="bx" x="40" y="846" width="430" height="110" rx="6"/><text class="sm tk" x="52" y="870">seqovl в multidisorder</text><text class="sm" x="52" y="896">одна метка: длина накладки</text><text class="sm" x="52" y="918">накладка лежит внутри сообщения</text><text class="sm" x="52" y="940">приёмник получает настоящие байты</text></g>
<g class="a e15"><rect class="bx" x="490" y="846" width="430" height="110" rx="6"/><text class="sm tk" x="502" y="870">проигрыш: новая и старая</text><text class="sm" x="502" y="896">новая режет всю ленту, куски выбрасывает</text><text class="sm" x="502" y="918">старая режет каждый кусок в его окне</text><text class="sm" x="502" y="940">метка на границе у старой пропадает</text></g>
<g class="a e16"><text class="sm tk" x="40" y="982">дальше: нарезка по MSS, ловушки старой функции, tcpseg и drop, игрушечные читатели →</text></g>
</svg>
