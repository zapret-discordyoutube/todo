<svg xmlns="http://www.w3.org/2000/svg" class="v06-s19-boundary-table-recap" viewBox="0 0 960 1004" width="960" height="1004" role="img" aria-labelledby="v06-s19-boundary-table-recap-t v06-s19-boundary-table-recap-d">
<title id="v06-s19-boundary-table-recap-t">Граница кусков и итог части</title>
<desc id="v06-s19-boundary-table-recap-d">Опыт с позицией 1448, ровно на границе двух клиентских сегментов, и сводка двух функций: новая функция отправляет 36@1448 и потом 1448@0, сервер отвечает блоком с 1449 по 1484 и затем ACK 1485, приложение читает 1484 байта одним чтением, а старая два раза пишет в журнал, что в этом пакете нет пересчитанной позиции, потому что метка выпала из обоих окон (на куске 1 она равна верхней границе, на куске 2 становится позицией 1 и её убирают), и отправляет 1448@0 и 36@1448 в обычном порядке, с ответами ACK 1449 и потом ACK 1486 вместе с FIN; таблица четырёх опытов (midsld, midsld и −1, только −1, граница) показывает, что новая функция каждый раз переставляет части всей ленты, а старая оставляет пакеты внутри клиентских сегментов; для проверки старая функция с позицией 1447 по коду режет первый кусок на 1 байт и 1447 байт и отправляет их в обратном порядке, а второй кусок уходит копией (счёт по коду, опыт не запускался); итог части: накладка лежит внутри сообщения, новая функция режет всю ленту, старая каждый кусок в его окне.</desc>
