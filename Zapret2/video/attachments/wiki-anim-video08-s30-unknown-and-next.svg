<g><text class="cap" x="40" y="22">проверь себя: спрячет ли hostfakesplit без midhost имя от «пакетного»?</text></g>
<g class="a e1"><text class="m tk" x="40" y="53">без midhost</text><rect class="bxa" x="200" y="36" width="68" height="28" rx="5"/><text class="ix c fg ns" x="234" y="55">R97</text><rect class="bxb" x="274" y="36" width="60" height="28" rx="5"/><text class="ix c fg ns" x="304" y="55">F15</text><rect class="bxr" x="340" y="36" width="92" height="28" rx="5"/><text class="ix c fg ns" x="386" y="55">R15 имя</text><rect class="bxb" x="438" y="36" width="60" height="28" rx="5"/><text class="ix c fg ns" x="468" y="55">F15</text><rect class="bxa" x="504" y="36" width="76" height="28" rx="5"/><text class="ix c fg ns" x="542" y="55">R138</text><path class="bxn" style="stroke:var(--rej);stroke-width:2.2;fill:none" d="M599 50Q614 39 629 50Q614 61 599 50Z"/><circle cx="614" cy="50" r="4.5" style="fill:var(--rej)"/><text class="sm tk rej" x="640" y="55">видит</text></g>
<g class="a e2"><text class="m tk" x="40" y="93">midhost=midsld</text><rect class="bxa" x="200" y="76" width="68" height="28" rx="5"/><text class="ix c fg ns" x="234" y="95">R97</text><rect class="bxb" x="274" y="76" width="60" height="28" rx="5"/><text class="ix c fg ns" x="304" y="95">F15</text><rect class="bxa" x="340" y="76" width="44" height="28" rx="5"/><text class="ix c fg ns" x="362" y="95">R7</text><rect class="bxa" x="390" y="76" width="44" height="28" rx="5"/><text class="ix c fg ns" x="412" y="95">R8</text><rect class="bxb" x="440" y="76" width="60" height="28" rx="5"/><text class="ix c fg ns" x="470" y="95">F15</text><rect class="bxa" x="506" y="76" width="76" height="28" rx="5"/><text class="ix c fg ns" x="544" y="95">R138</text><path style="stroke:var(--ok);stroke-width:2.4;fill:none" d="M601 87Q616 99 631 87"/><path style="stroke:var(--ok);stroke-width:2;fill:none" d="M607 93L604 99M616 96L616 102M625 93L628 99"/><text class="sm tk ok" x="642" y="95">слеп</text></g>
<g class="a e3"><text class="ix mu" x="200" y="122">R настоящая часть, F двойник, число это длина в байтах</text></g>
<g class="a e4"><text class="sm tk" x="40" y="148">имя лежит целым в своём пакете: «пакетный» находит его; чтобы спрятать, имя нужно разрезать</text></g>
<g class="a e5"><text class="cap" x="40" y="168">чего мы не знаем</text></g>
<g class="a e6"><rect class="bxg" x="40" y="178" width="284" height="108" rx="9"/><rect x="55" y="200" width="18" height="14" rx="3" style="fill:var(--mute);fill-opacity:.35;stroke:var(--mute);stroke-width:1.6"/><path d="M59 200L59 195Q59 189 64 189Q69 189 69 195L69 200" style="fill:none;stroke:var(--mute);stroke-width:1.8"/><text class="sm tk" x="84" y="205">настоящий инспектор</text><text class="sm" x="56" y="232">и ТСПУ: что читает, где стоит,</text><text class="sm" x="56" y="251">видит ли фейки, какую копию</text><text class="sm" x="56" y="270">считает главной</text></g>
<g class="a e7"><rect class="bxg" x="338" y="178" width="284" height="108" rx="9"/><rect x="353" y="200" width="18" height="14" rx="3" style="fill:var(--mute);fill-opacity:.35;stroke:var(--mute);stroke-width:1.6"/><path d="M357 200L357 195Q357 189 362 189Q367 189 367 195L367 200" style="fill:none;stroke:var(--mute);stroke-width:1.8"/><text class="sm tk" x="382" y="205">другие получатели</text><text class="sm" x="354" y="232">не Linux 6.18: Windows,</text><text class="sm" x="354" y="251">BSD, встроенные системы;</text><text class="sm" x="354" y="270">IPv6; версия для Windows</text></g>
<g class="a e8"><rect class="bxg" x="636" y="178" width="284" height="108" rx="9"/><rect x="651" y="200" width="18" height="14" rx="3" style="fill:var(--mute);fill-opacity:.35;stroke:var(--mute);stroke-width:1.6"/><path d="M655 200L655 195Q655 189 660 189Q665 189 665 195L665 200" style="fill:none;stroke:var(--mute);stroke-width:1.8"/><text class="sm tk" x="680" y="205">другие условия</text><text class="sm" x="652" y="232">пробовали только MD5, срок</text><text class="sm" x="652" y="251">жизни 1 и испорченную сумму;</text><text class="sm" x="652" y="270">остальные условия не запускали</text></g>
<g class="a e9"><text class="cap" x="40" y="322">следующий выпуск</text></g>
<g class="a e10"><rect class="bxa" x="40" y="334" width="880" height="96" rx="12"/><text class="big tk" x="64" y="372">«Фокусы рукопожатия»</text><text class="sm" x="64" y="400">вокруг начала соединения: до первого байта данных, срочный байт, ложное окно</text><text class="sm mu" x="64" y="420">до сих пор мы работали с данными, когда соединение уже установлено</text></g>
<g class="a e11"><text class="cap" x="40" y="466">весь выпуск в одной фразе</text></g>
<g class="a e12"><rect class="bx" x="40" y="478" width="880" height="124" rx="10"/><text class="tk" x="60" y="508">Разрез прячет имя от читателя, который смотрит пакеты по одному;</text><text class="tk" x="60" y="534">фейк с условием не доходит до приложения;</text><text class="tk" x="60" y="560">три функции склеивают это в серию, а условие обязательно:</text><text class="tk" x="60" y="586">без него сервер в нашем тесте принимает фейк всерьёз.</text></g>
<g class="a e13"><text class="sm mu" x="40" y="626">Всё сказанное про эффект относится к нашему приёмнику и нашим игрушкам.</text></g>
</svg>
