<svg xmlns="http://www.w3.org/2000/svg" class="v08-s30-unknown-and-next" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v08-s30-unknown-and-next-t v08-s30-unknown-and-next-d">
<title id="v08-s30-unknown-and-next-t">Чего мы не знаем и что дальше</title>
<desc id="v08-s30-unknown-and-next-d">Проверка, спрячет ли hostfakesplit без midhost имя от пакетного читателя: нет, настоящее имя лежит целым в своём пакете в 15 байт и пакетный его находит, а с midhost равным midsld имя режется на 7 и 8 байт и пакетный слеп, затем три серые плашки с замками о том, чего мы не знаем, настоящий инспектор и ТСПУ, другие получатели, IPv6 и версия для Windows, и условия кроме MD5, срока жизни 1 и испорченной суммы; следующий выпуск называется «Фокусы рукопожатия» и разбирает приёмы вокруг начала соединения, до первого байта данных, срочный байт и ложное окно, а итог выпуска одной фразой такой: разрез прячет имя от читателя, который смотрит пакеты по одному, фейк с условием не доходит до приложения, а условие обязательно.</desc>
