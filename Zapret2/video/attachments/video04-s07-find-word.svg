<svg xmlns="http://www.w3.org/2000/svg" class="v04-s07-find-word" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v04-s07-find-word-t v04-s07-find-word-d">
<title id="v04-s07-find-word-t">Как найти второе справа слово</title>
<desc id="v04-s07-find-word-d">Как программа находит второе справа слово в имени www.example.com (15 байт, номера внутри имени с нуля): слова справа налево — com, example, www. Правый указатель стартует за концом имени (15) и шагает 14, 13, 12, 11, пока не встретит точку; левый стартует с 10 и шагает до точки на 3. Слово example начинается на байт правее точки, 4, длина 11 − 4 = 7. Это функция FindNLD из zapret2, номера внутри имени, не в пакете.</desc>
