<rect class="bg" x="0" y="0" width="960" height="552"/>
<g><text class="cap" x="40" y="24">игрушка, выдуманный пример: подложное письмо и два читателя</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="230" height="92" rx="10"/><text class="tk c" x="155" y="68">сортировщик</text><text class="sm c" x="155" y="90">с окошком</text><text class="sm mu c" x="155" y="116">читатель один: инспектор</text></g>
<g class="a e2"><rect class="bx" x="690" y="40" width="230" height="92" rx="10"/><text class="tk c" x="805" y="68">адресат</text><text class="sm c" x="805" y="90">открывает конверт</text><text class="sm mu c" x="805" y="116">читатель два: получатель</text></g>
<g class="a e3"><path class="lm" d="M276 100L675.0 100.0"/><polygon class="hm" points="684,100 675.0,104.5 675.0,95.5"/></g>
<g class="a e4"><rect class="pill" x="296" y="78" width="190" height="44" rx="6"/><rect class="bxb" x="296" y="78" width="190" height="44" rx="6"/><text class="sm tk c" x="391" y="105">подложное письмо</text></g>
<g class="a e5"><rect class="bxo" x="362" y="52" width="58" height="22" rx="6"/><text class="sm tk ok c" x="391" y="68">ок</text></g>
<g class="a e6"><rect class="pill" x="516" y="78" width="130" height="44" rx="6"/><rect class="bxa" x="516" y="78" width="130" height="44" rx="6"/><text class="sm tk c" x="581" y="105">настоящее</text></g>
<g class="a e7"><text class="sm" x="40" y="156">сортировщик смотрит только первое письмо, поэтому подложное кладут на ленту первым</text></g>
<g class="a e8"><rect class="bx" x="40" y="176" width="430" height="84" rx="10"/><text class="tk" x="56" y="202">способ 1: умирает по дороге</text><text class="sm" x="56" y="226">как письмо с просроченной маркой:</text><text class="sm" x="56" y="246">до адресата не доходит</text></g>
<g class="a e9"><rect class="bx" x="490" y="176" width="430" height="84" rx="10"/><text class="tk" x="506" y="202">способ 2: доходит, но адресат отвергает</text><text class="sm" x="506" y="226">как письмо с неправильной печатью:</text><text class="sm" x="506" y="246">штамп «не принято»</text></g>
<g class="a e10"><rect class="bxr" x="808" y="220" width="108" height="30" rx="6"/><text class="sm tk c" x="862" y="240">не принято</text></g>
<g class="a e11"><text class="sm mu" x="40" y="290">первый способ разбираем в этой части выпуска, второй в следующих</text></g>
<g><text class="cap" x="40" y="326">три задачи подделки</text></g>
<g class="a e12"><text class="sm mu" x="40" y="350">задача</text><text class="sm mu" x="276" y="350">кто читает</text><text class="sm mu" x="436" y="350">если не вышло</text><path class="lm" d="M40 358L920 358"/></g>
<g class="a e13"><rect class="bx" x="40" y="368" width="880" height="38" rx="6"/><circle class="pl" cx="60" cy="387" r="11"/><text class="sm tk c ns" x="60" y="392">1</text><text class="tk" x="84" y="393">правдоподобие</text><text class="sm" x="276" y="393">инспектор</text><text class="sm" x="436" y="393">судит по настоящему пакету и блокирует</text></g>
<g class="a e14"><rect class="bx" x="40" y="414" width="880" height="38" rx="6"/><circle class="pl" cx="60" cy="433" r="11"/><text class="sm tk c ns" x="60" y="438">2</text><text class="tk" x="84" y="439">отказ получателя</text><text class="sm" x="276" y="439">сервер</text><text class="sm" x="436" y="439">принимает подделку за данные, поток испорчен</text></g>
<g class="a e15"><rect class="bx" x="40" y="460" width="880" height="38" rx="6"/><circle class="pl" cx="60" cy="479" r="11"/><text class="sm tk c ns" x="60" y="484">3</text><text class="tk" x="84" y="485">безвредность</text><text class="sm" x="276" y="485">соединение</text><text class="sm" x="436" y="485">соединение путается</text></g>
<g class="a e16"><text class="sm mu" x="40" y="532">измерено только против нашего игрушечного инспектора и нашего получателя на Linux</text></g>
</svg>
