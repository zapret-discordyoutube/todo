<svg xmlns="http://www.w3.org/2000/svg" class="video07-s02-two-readers-three-jobs" viewBox="0 0 960 552" width="960" height="552" role="img" aria-labelledby="video07-s02-two-readers-three-jobs-t video07-s02-two-readers-three-jobs-d">
<title id="video07-s02-two-readers-three-jobs-t">Два читателя, три задачи</title>
<desc id="video07-s02-two-readers-three-jobs-d">Выдуманный пример с подложным письмом, которое проходит двух читателей, сортировщика-инспектора, который должен принять его за настоящее, и адресата-получателя, который не должен, причём подложное письмо либо умирает по дороге, как письмо с просроченной маркой, либо доходит и отвергается, как письмо с неправильной печатью, а три задачи подделки, правдоподобие, отказ получателя и безвредность, описаны в таблице вместе с тем, что случится, если задача не выполнена.</desc>
