<svg xmlns="http://www.w3.org/2000/svg" class="video09-s02-toy-characters-reference" viewBox="0 0 960 740" width="960" height="740" role="img" aria-labelledby="video09-s02-toy-characters-reference-t video09-s02-toy-characters-reference-d">
<title id="video09-s02-toy-characters-reference-t">Характеры игрушки и опыт без стратегии</title>
<desc id="video09-s02-toy-characters-reference-d">Игрушечный инспектор стоит на входе в роутер и в этом выпуске знает два характера, «первый решает» и «данные SYN не читает», а в опыте без стратегии он блокирует приветствие в 250 байт, так что оно и его повторы видны только на клиенте и на входе в роутер и сервер получает 0 байт, тогда как без игрушки приложение сервера читает 250 байт одним чтением.</desc>
