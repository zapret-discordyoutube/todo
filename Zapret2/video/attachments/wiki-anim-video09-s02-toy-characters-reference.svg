<g><text class="cap" x="40" y="24">игрушка у входа в роутер: два характера и опыт без стратегии</text></g>
<g class="a video09-s02-toy-characters-reference-k1"><text class="sm mu" x="40" y="50">характеры игрушки: наша модель, не настоящее оборудование</text><rect class="bxb" x="40" y="60" width="880" height="62" rx="8"/><text class="tk" x="56" y="87">«первый решает»</text><text class="sm" x="300" y="82">первый непустой пакет клиента решает навсегда; SYN с данными</text><text class="sm" x="300" y="102">тоже считается: есть имя — запрет, нет имени — чисто навсегда</text></g>
<g class="a video09-s02-toy-characters-reference-k2"><rect class="bxb" x="40" y="130" width="880" height="62" rx="8"/><text class="tk" x="56" y="157">«данные SYN не читает»</text><text class="sm" x="300" y="152">то же самое, но данные внутри SYN пропускает без разбора</text><text class="sm" x="300" y="172">и ждёт настоящих данных после рукопожатия</text></g>
<g class="a video09-s02-toy-characters-reference-k3"><text class="cap" x="40" y="224">опыт без стратегии, игрушка «первый решает»: повторы за первые две секунды</text><text class="sm mu" x="40" y="246">игрушка стоит на входе в роутер, до проверки срока жизни: так допускает наша модель</text><text class="smk c" x="590" y="282">c0</text><text class="smk c" x="665" y="282">r0</text><text class="smk c" x="740" y="282">r1</text><text class="smk c" x="815" y="282">s0</text><text class="cap" x="76" y="282">пакет</text><text class="cap" x="490" y="282">время</text><path class="lm" d="M40 290L920 290"/></g>
