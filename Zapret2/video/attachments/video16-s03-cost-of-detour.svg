<g class="a e18"><text class="tk sm c rej" x="837" y="128">выброс 0,555</text></g>
<g class="a e19"><path class="lf" d="M452.7 130L452.7 162"/></g>
<g class="a e20"><path class="la" d="M78.2 164L440.7 164.0"/><polygon class="ha" points="450.7,164 440.7,169.0 440.7,159.0"/><text class="tk sm acc" x="464.7" y="168">0,28 − 0,013 ≈ 0,27</text></g>
<g class="a e21"><text class="sm" x="40" y="246">0,27 мс добавляет программа на пару пакетов: входящий SYN-ACK и исходящий ACK.</text></g>
<g class="a e22"><text class="sm" x="40" y="270">В паре два захода. Если они равны (наше допущение): 0,27 ÷ 2 ≈ 0,13 мс на заход.</text></g>
<g class="a e23"><text class="sm" x="40" y="294">Пять типичных прогонов: 0,25–0,30 на пару, то есть 0,126–0,150 мс на заход. Худший: 0,54 и около 0,27.</text></g>
<g class="a e24"><rect class="bxa" x="40" y="316" width="880" height="78" rx="8"/><text class="tk ns" style="font-size:30px" x="60" y="367">≈ 130 мкс на заход</text><text class="sm ns" x="470" y="342">наша оценка: весь крюк с журналом,</text><text class="sm ns" x="470" y="364">вынос пакета, работа программы, запись</text><text class="sm ns" x="470" y="386">файлов и возврат вердикта</text></g>
<g class="a e25"><rect class="bx" x="40" y="416" width="430" height="104" rx="8"/><text class="tk sm" x="56" y="442">Первые прогоны</text><text class="sm" x="56" y="464">задержки слишком большие: файлы писались</text><text class="sm" x="56" y="484">на медленный диск. Виноват диск, не программа.</text><text class="sm mu" x="56" y="500">Те числа мы не используем.</text></g>
<g class="a e26"><rect class="bxo" x="490" y="416" width="430" height="104" rx="8"/><text class="tk sm ns" x="506" y="442">Повтор на локальном диске</text><text class="sm ns" x="506" y="464">шесть прогонов с программой и шесть</text><text class="sm ns" x="506" y="484">без неё: числа на этой картинке отсюда.</text></g>
<g class="a e27"><rect class="bxd" x="40" y="540" width="880" height="68" rx="8"/><text class="sm" x="56" y="566">WSL2 (Linux внутри Windows), один компьютер, шесть повторов: ориентир, а не закон.</text><text class="sm" x="56" y="590">Настоящее железо, реальную сеть и большой поток пакетов мы не измеряли.</text></g>
</svg>
