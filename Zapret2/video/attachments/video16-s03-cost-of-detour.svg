<rect class="bg" x="0" y="0" width="960" height="628"/>
<g><text class="cap" x="40" y="26">Цена одного захода к программе (в нашем тесте)</text></g>
<g class="a e1"><text class="tk sm" x="40" y="54">От прихода SYN-ACK до ухода ACK на интерфейсе c0, мс</text></g>
<g class="a e2"><text class="sm" x="40" y="80">без программы (t00, шесть повторов): 0,011–0,020, медиана 0,013</text></g>
<g class="a e3"><text class="sm" x="40" y="120">с программой (t01, шесть повторов): 0,264–0,555, медиана около 0,28</text></g>
<g class="a e4"><path class="lm" d="M60 180L900 180"/><path class="lm" d="M60 176L60 184"/><text class="ix c" x="60" y="202">0</text><path class="lm" d="M200 176L200 184"/><text class="ix c" x="200" y="202">0,1</text><path class="lm" d="M340 176L340 184"/><text class="ix c" x="340" y="202">0,2</text><path class="lm" d="M480 176L480 184"/><text class="ix c" x="480" y="202">0,3</text><path class="lm" d="M620 176L620 184"/><text class="ix c" x="620" y="202">0,4</text><path class="lm" d="M760 176L760 184"/><text class="ix c" x="760" y="202">0,5</text><path class="lm" d="M900 176L900 184"/><text class="ix c" x="900" y="202">0,6</text></g>
<g class="a e5"><circle class="bxa" cx="79.6" cy="96" r="5"/></g>
