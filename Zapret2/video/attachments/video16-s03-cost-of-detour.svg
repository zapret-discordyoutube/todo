<svg xmlns="http://www.w3.org/2000/svg" class="v16-s03-cost-of-detour" viewBox="0 0 960 628" width="960" height="628" role="img" aria-labelledby="v16-s03-cost-of-detour-t v16-s03-cost-of-detour-d">
<title id="v16-s03-cost-of-detour-t">Цена одного захода к программе</title>
<desc id="v16-s03-cost-of-detour-d">Сколько стоит один заход пакета к программе, замер на нашем компьютере (WSL2, шесть повторов на локальном диске). Время от прихода SYN-ACK до ухода подтверждения ACK на интерфейсе клиента: без программы (опыт t00) от 0,011 до 0,020 мс, медиана 0,013; с программой (опыт t01) 0,278, 0,283, 0,314, 0,555, 0,269 и 0,264 мс, медиана около 0,28, выброс 0,555. Разность медиан около 0,27 мс на пару пакетов, в паре два захода; если они равны (допущение), около 0,13 мс, то есть порядка 130 микросекунд на заход, в типичных прогонах от 126 до 150, в худшем около 270. Это весь крюк с включённым журналом. Первые замеры на медленном диске дали слишком большие задержки и не используются. Один компьютер, ориентир, настоящее железо не измеряли.</desc>
