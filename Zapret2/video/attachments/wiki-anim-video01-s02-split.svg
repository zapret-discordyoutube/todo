<svg xmlns="http://www.w3.org/2000/svg" class="v01-s02-split" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="v01-s02-split-t v01-s02-split-d">
<title id="v01-s02-split-t">Разрезанный конверт: окошко пополам</title>
<desc id="v01-s02-split-d">Отправитель режет конверт так, что окошко с адресом оказывается разрезано пополам; сортировщик, который смотрит мельком, видит половинки по отдельности и, возможно, не прочтёт адрес целиком, а получатель склеивает обе половинки, и ничего не пропадает; справа ключ аналогии: письмо это пакет, окошко с адресом имя сайта, сортировщик наблюдатель, ящик сервер.</desc>
<style>.v01-s02-split{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#23825a;--okt:rgba(35,130,90,.12)}@media (prefers-color-scheme:dark){.v01-s02-split{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13);--ok:#7fd1a6;--okt:rgba(127,209,166,.12)}}
