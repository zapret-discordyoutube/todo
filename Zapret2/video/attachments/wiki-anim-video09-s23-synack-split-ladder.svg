<svg xmlns="http://www.w3.org/2000/svg" class="v09-s23-synack-split-ladder" viewBox="0 0 960 714" width="960" height="714" role="img" aria-labelledby="v09-s23-synack-split-ladder-t v09-s23-synack-split-ladder-d">
<title id="v09-s23-synack-split-ladder-t">Расщеплённый SYN-ACK на проводе клиента</title>
<desc id="v09-s23-synack-split-ladder-d">В режиме по умолчанию synack_split заменяет SYN-ACK сервера двумя копиями с изменёнными флагами: сначала пакет только с SYN, номер подтверждения в нём остался, затем чистый ACK с опциями SYN-ACK, а обломок с протоколом 255 и сроком жизни 1 виден между сервером и роутером и клиента не достигает, в нашем тесте клиент на Linux отвечает на голый SYN пакетом SYN-ACK, это по общим сведениям одновременное открытие, отправляет ACK и посылает приветствие в 250 байт через 22,11 мс после первого SYN, когда от сервера приходит ещё один ACK.</desc>
<style>.v09-s23-synack-split-ladder{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
