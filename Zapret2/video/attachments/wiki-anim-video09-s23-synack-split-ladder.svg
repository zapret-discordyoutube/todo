<rect class="bg" x="0" y="0" width="960" height="714"/>
<g><text class="cap" x="40" y="22">synack_split в режиме по умолчанию: пакеты на проводе клиента</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="80" rx="8"/><text class="sm tk" x="54" y="60">игрушка: две открытки вместо одной</text><rect class="pl" x="723.9" y="44" width="182.1" height="24" rx="12"/><text class="sm c" x="815" y="61">выдуманный пример</text><text class="sm" x="54" y="82">Вместо одной открытки «согласен, вот мой номер» приходят две: «вот мой номер» и «согласен».</text><text class="sm" x="54" y="101">Получатель на первую отвечает: «вы тоже хотите начать?» и ждёт.</text></g>
<g class="a e2"><rect class="bxa" x="40" y="128" width="421.8" height="28" rx="6"/><text class="mk" x="50" y="147">--server --lua-desync=synack_split:mode=synack</text><text class="sm mu" x="473.8" y="147">mode по умолчанию synack</text></g>
<g class="a e3"><text class="cap c" x="440" y="182">клиент</text><text class="cap c" x="630" y="182">сервер</text><text class="cap c" x="535" y="182">роутер</text></g>
<g class="a e4"><path class="lmd" d="M440 190L440 480"/><path class="lmd" d="M535 190L535 480"/><path class="lmd" d="M630 190L630 480"/></g>
<g class="a e5"><circle class="bxa" cx="56" cy="208" r="12"/><text class="tk c ns" x="56" y="213">1</text><text class="sm tk" x="78" y="206">SYN клиента</text><text class="ix fg" x="78" y="220">S · win 64240</text><path class="la" d="M440 206L620.0 210.7"/><polygon class="ha" points="630,211 619.9,215.7 620.1,205.7"/><text class="m fg" x="646" y="212">0,00 мс</text></g>
<g class="a e6"><circle class="bxb" cx="56" cy="244" r="12"/><text class="tk c ns" x="56" y="249">2</text><text class="sm tk" x="78" y="242">первый пакет сервера: только SYN</text><text class="ix fg" x="78" y="256">S · ACK снят, поле ack осталось</text><path class="lb" d="M630 242L450.0 246.7"/><polygon class="hb" points="440,247 449.9,241.7 450.1,251.7"/><text class="m fg" x="646" y="248">11,04 мс</text></g>
<g class="a e7"><circle class="bxb" cx="56" cy="280" r="12"/><text class="tk c ns" x="56" y="285">3</text><text class="sm tk" x="78" y="278">второй пакет сервера: чистый ACK</text><text class="ix fg" x="78" y="292">A · rel_ack 1 · опции как у SYN-ACK</text><path class="lb" d="M630 278L450.0 282.7"/><polygon class="hb" points="440,283 449.9,277.7 450.1,287.7"/><text class="m fg" x="646" y="284">11,07 мс</text></g>
<g class="a e8"><circle class="bxr" cx="56" cy="318" r="12"/><text class="tk c ns" x="56" y="323">+</text><text class="sm tk" x="78" y="314">обломок: протокол 255, TTL 1, 60 байт</text><text class="ix fg" x="78" y="328">сумма IP неверна · виден у роутера и сервера</text><path class="lcut" d="M630 316L539 316"/><path class="lr" d="M529 310L541 322M541 310L529 322"/><text class="ix mu" x="650" y="322">на проводе клиента его нет</text></g>
<g class="a e9"><circle class="bxa" cx="56" cy="352" r="12"/><text class="tk c ns" x="56" y="357">4</text><text class="sm tk" x="78" y="350">клиент отвечает пакетом SYN-ACK</text><text class="ix fg" x="78" y="364">SA · rel_ack 1 · win 64240</text><path class="la" d="M440 350L620.0 354.7"/><polygon class="ha" points="630,355 619.9,359.7 620.1,349.7"/><text class="m fg" x="646" y="356">11,07 мс</text></g>
<g class="a e10"><circle class="bxa" cx="56" cy="388" r="12"/><text class="tk c ns" x="56" y="393">5</text><text class="sm tk" x="78" y="386">ACK клиента</text><text class="ix fg" x="78" y="400">A · rel_seq 1 · rel_ack 1 · win 63</text><path class="la" d="M440 386L620.0 390.7"/><polygon class="ha" points="630,391 619.9,395.7 620.1,385.7"/><text class="m fg" x="646" y="392">11,08 мс</text></g>
<g class="a e11"><circle class="bx" cx="56" cy="424" r="12"/><text class="tk c ns" x="56" y="429">6</text><text class="sm tk" x="78" y="422">ещё один ACK сервера</text><text class="ix fg" x="78" y="436">A · rel_seq 1 · rel_ack 1</text><path class="lf" d="M630 422L450.0 426.7"/><polygon class="hf" points="440,427 449.9,421.7 450.1,431.7"/><text class="m fg" x="646" y="428">21,89 мс</text></g>
<g class="a e12"><rect class="fa" x="40" y="444" width="880" height="32" rx="6"/><circle class="bxa" cx="56" cy="460" r="12"/><text class="tk c ns" x="56" y="465">7</text><text class="sm tk" x="78" y="458">приветствие, 250 байт</text><text class="ix fg" x="78" y="472">PA · rel_seq 1 · len 250</text><path class="la" d="M440 458L620.0 462.7"/><polygon class="ha" points="630,463 619.9,467.7 620.1,457.7"/><text class="m fg" x="646" y="464">22,11 мс</text></g>
<g class="a e13"><text class="ix mu" x="750" y="250">опции: MSS, SACKOK,</text><text class="ix mu" x="750" y="266">TS, WS=10</text></g>
<g class="a e14"><text class="sm tk" x="750" y="344">одновременное</text><text class="sm" x="750" y="360">открытие, по общим</text><text class="sm" x="750" y="376">сведениям</text></g>
<g class="a e15"><rect class="bx" x="40" y="488" width="430" height="66" rx="8"/><text class="sm tk" x="54" y="510">обычный ACK клиента</text><text class="mk" x="54" y="534">опции: NOP NOP TS</text><rect class="bxb" x="490" y="488" width="430" height="66" rx="8"/><text class="sm tk amb" x="504" y="510">ACK из расщепления</text><text class="mk" x="504" y="534">опции: MSS SACKOK TS NOP WS=10</text></g>
<g class="a e16"><text class="sm tk" x="40" y="576">обе части — копии одного пакета: функция меняет в копиях только флаги;</text><text class="sm" x="40" y="596">опции, окно и номера остаются от настоящего SYN-ACK. Нужно ли это для обхода, не знаем</text></g>
<g class="a e17"><rect class="bxo" x="40" y="616" width="880" height="40" rx="8"/><text class="sm tk ok" x="54" y="641">клиент: соединение открыто за 22,1 мс; приветствие ушло после ещё одного ACK сервера</text></g>
<g class="a e18"><rect class="bxw" x="40" y="668" width="880" height="30" rx="6"/><text class="sm" x="54" y="688">SYN-ACK клиента и ACK сервера на 11,07 мс: порядок между ними менялся от прохода к проходу</text></g>
</svg>
