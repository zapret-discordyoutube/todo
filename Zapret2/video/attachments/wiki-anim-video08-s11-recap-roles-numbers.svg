<svg xmlns="http://www.w3.org/2000/svg" class="v08-s11-recap-roles-numbers" viewBox="0 0 960 584" width="960" height="584" role="img" aria-labelledby="v08-s11-recap-roles-numbers-t v08-s11-recap-roles-numbers-d">
<title id="v08-s11-recap-roles-numbers-t">Повтор: участники, числа и ответы</title>
<desc id="v08-s11-recap-roles-numbers-d">Повтор перед выпуском: в роутере стоит наша игрушка-инспектор, а сервер на Linux, и слово «сработало» значит только то, что приём обошёл игрушку, а данные дошли до сервера целыми; приветствие в 250 байт разрезано на 104 и 146 байт, имя сайта занимает смещения с 97 по 111, смещение 97 равно номеру 98, а ответ сервера «жду байт номер 100» значит, что 99 байт у него уже есть, блок лежит в стороне, а дублирующий блок состоит из байт, которые уже были.</desc>
