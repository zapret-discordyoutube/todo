<rect class="bg" x="0" y="0" width="960" height="584"/>
<g><text class="cap" x="40" y="24">повтор: кто участвует, как считать байты, как читать ответ сервера</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="150" height="64" rx="8"/><text class="tk c" x="115" y="82">клиент</text></g>
<g class="a e2"><rect class="bxb" x="330" y="38" width="300" height="76" rx="8"/><text class="sm c" x="480" y="62">роутер лаборатории</text><circle class="lb" cx="372" cy="88" r="9"/><path class="lb" d="M379 95L387 103"/><text class="sm tk" x="398" y="94">игрушечный инспектор</text></g>
<g class="a e3"><rect class="bxo" x="745" y="44" width="175" height="64" rx="8"/><text class="tk c" x="832" y="71">сервер</text><text class="sm c" x="832" y="92">наш приёмник: Linux</text></g>
<g class="a e4"><path class="lf" d="M190 76L318.0 76.0"/><polygon class="hf" points="328,76 318.0,81.0 318.0,71.0"/><path class="lf" d="M630 76L733.0 76.0"/><polygon class="hf" points="743,76 733.0,81.0 733.0,71.0"/></g>
<g class="a e5"><text class="sm tk c ns" x="480" y="134">игрушка: наша модель, не оборудование</text></g>
<g class="a e6"><rect class="bxo" x="40" y="146" width="880" height="34" rx="6"/><text class="tk c" x="480" y="169">сработало = обошли нашу игрушку и данные дошли до сервера целыми</text></g>
<g class="a e7"><text class="sm tk" x="40" y="206">приветствие в нашей лаборатории: 250 байт, разрез делит его на куски</text></g>
<g class="a e8"><rect class="bx" x="40" y="246" width="880" height="30" rx="0"/><rect class="bxa" x="40" y="246" width="366.1" height="30" rx="0"/><rect class="bxg" x="406.1" y="246" width="513.9" height="30" rx="0"/><text class="sm c" x="223" y="266">первая часть: 104</text><text class="sm c" x="663" y="266">вторая часть: 146</text><text class="ix mu" x="40" y="292">0</text><text class="ix mu r" x="920" y="292">250</text></g>
<g class="a e9"><rect class="bxb" x="381.4" y="242" width="52.8" height="38" rx="3"/><text class="sm tk r" x="373.4" y="234">www.example.com: смещения 97…111</text></g>
<g class="a e10"><path class="lcut" d="M406.1 238L406.1 284"/><text class="ix rej c" x="406.1" y="292">104</text></g>
<g class="a e11"><text class="tk c" x="480" y="314">104 + 146 = 250</text></g>
<g class="a e12"><rect class="bx" x="40" y="330" width="430" height="52" rx="6"/><text class="sm" x="54" y="352">смещение: сколько байт стоит перед нужным</text><text class="sm tk" x="54" y="372">счёт с нуля: имя на смещении 97</text></g>
<g class="a e13"><rect class="bx" x="490" y="330" width="430" height="52" rx="6"/><text class="sm" x="504" y="352">номер: на единицу больше смещения</text><text class="sm tk" x="504" y="372">первый байт имеет номер 1: имя с номера 98</text></g>
<g class="a e14"><text class="cap" x="40" y="412">как читать ответ сервера</text></g>
<g class="a e15"><rect class="bx" x="40" y="430" width="880" height="26" rx="0"/><rect class="bxo" x="40" y="430" width="348.5" height="26" rx="0"/><text class="sm c" x="214.2" y="448">99 байт уже у сервера: номера 1…99</text></g>
<g class="a e16"><path class="lr" d="M388.5 424L388.5 462"/><rect class="bxn" x="396.5" y="464" width="300" height="26" rx="5"/><text class="sm tk" x="406.5" y="482">ответ: жду байт номер 100</text></g>
<g class="a e17"><rect class="bxwa" x="603.2" y="430" width="316.8" height="26" rx="0"/><text class="sm c" x="761.6" y="448">блок: лежит в стороне (пример)</text></g>
<g class="a e18"><rect class="bx" x="40" y="524" width="880" height="26" rx="0"/><rect class="bxo" x="40" y="524" width="348.5" height="26" rx="0"/></g>
<g class="a e19"><rect class="bxrd" x="180.8" y="521" width="140.8" height="32" rx="3"/><text class="sm tk c" x="251.2" y="542">уже было</text></g>
<g class="a e20"><text class="sm" x="398.5" y="542">блок дублирующий: эти байты у сервера уже были</text></g>
</svg>
