<svg xmlns="http://www.w3.org/2000/svg" class="v07-s22-strict-toys-matrix" viewBox="0 0 960 578" width="960" height="578" role="img" aria-labelledby="v07-s22-strict-toys-matrix-t v07-s22-strict-toys-matrix-d">
<title id="v07-s22-strict-toys-matrix-t">Матрица условий и игрушек</title>
<desc id="v07-s22-strict-toys-matrix-d">Матрица из шести условий подделки и пяти вариантов игрушечного инспектора: красные клетки, где сервер получил 0 байт, стоят только там, где игрушка видит причину условия, то есть сумму, MD5, номер и снятый ACK, зелёные клетки с 250 байтами означают, что игрушка приняла подделку за первый пакет, а серые клетки в нашем тесте не запускались.</desc>
<style>.v07-s22-strict-toys-matrix{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
