<rect class="bg" x="0" y="0" width="960" height="578"/>
<g><text class="cap" x="40" y="26">условие против игрушки: сколько байт получил сервер</text></g>
<g class="a e1"><text class="sm tk c" x="299" y="50">простая</text><text class="sm tk c" x="299" y="68">игрушка</text><text class="sm tk c" x="437" y="50">проверяющий</text><text class="sm tk c" x="437" y="68">сумму</text><text class="sm tk c" x="575" y="50">отсеивающий</text><text class="sm tk c" x="575" y="68">MD5</text><text class="sm tk c" x="713" y="50">следящий</text><text class="sm tk c" x="713" y="68">за номером</text><text class="sm tk c" x="851" y="50">требующий</text><text class="sm tk c" x="851" y="68">ACK</text></g>
<g class="a e2"><text class="sm tk" x="40" y="102">срок жизни 1</text><text class="ix" x="40" y="122">ip_ttl=1</text><rect class="bxo" x="232" y="80" width="130" height="52" rx="6"/><text class="tk sm c" x="297" y="103">250 B</text><text class="ix c" x="297" y="123">разрешено</text><rect class="bxo" x="370" y="80" width="130" height="52" rx="6"/><text class="tk sm c" x="435" y="103">250 B</text><text class="ix c" x="435" y="123">разрешено</text><rect class="bxo" x="508" y="80" width="130" height="52" rx="6"/><text class="tk sm c" x="573" y="103">250 B</text><text class="ix c" x="573" y="123">разрешено</text><rect class="bxo" x="646" y="80" width="130" height="52" rx="6"/><text class="tk sm c" x="711" y="103">250 B</text><text class="ix c" x="711" y="123">разрешено</text><rect class="bxo" x="784" y="80" width="130" height="52" rx="6"/><text class="tk sm c" x="849" y="103">250 B</text><text class="ix c" x="849" y="123">разрешено</text></g>
<g class="a e3"><text class="sm tk" x="40" y="158">MD5</text><text class="ix" x="40" y="178">tcp_md5</text><rect class="bxo" x="232" y="136" width="130" height="52" rx="6"/><text class="tk sm c" x="297" y="159">250 B</text><text class="ix c" x="297" y="179">разрешено</text><rect class="bxo" x="370" y="136" width="130" height="52" rx="6"/><text class="tk sm c" x="435" y="159">250 B</text><text class="ix c" x="435" y="179">разрешено</text><rect class="bxr" x="508" y="136" width="130" height="52" rx="6"/><text class="tk sm c" x="573" y="159">0 B</text><text class="ix c" x="573" y="179">блок</text><rect class="bxd" x="646" y="136" width="130" height="52" rx="6"/><text class="ix mu c" x="711" y="167">не запускали</text><rect class="bxd" x="784" y="136" width="130" height="52" rx="6"/><text class="ix mu c" x="849" y="167">не запускали</text></g>
<g class="a e4"><text class="sm tk" x="40" y="214">плохая сумма</text><text class="ix" x="40" y="234">badsum</text><rect class="bxo" x="232" y="192" width="130" height="52" rx="6"/><text class="tk sm c" x="297" y="215">250 B</text><text class="ix c" x="297" y="235">разрешено</text><rect class="bxr" x="370" y="192" width="130" height="52" rx="6"/><text class="tk sm c" x="435" y="215">0 B</text><text class="ix c" x="435" y="235">блок</text><rect class="bxo" x="508" y="192" width="130" height="52" rx="6"/><text class="tk sm c" x="573" y="215">250 B</text><text class="ix c" x="573" y="235">разрешено</text><rect class="bxd" x="646" y="192" width="130" height="52" rx="6"/><text class="ix mu c" x="711" y="223">не запускали</text><rect class="bxd" x="784" y="192" width="130" height="52" rx="6"/><text class="ix mu c" x="849" y="223">не запускали</text></g>
<g class="a e5"><text class="sm tk" x="40" y="270">номер −10000</text><text class="ix" x="40" y="290">tcp_seq=-10000</text><rect class="bxo" x="232" y="248" width="130" height="52" rx="6"/><text class="tk sm c" x="297" y="271">250 B</text><text class="ix c" x="297" y="291">разрешено</text><rect class="bxd" x="370" y="248" width="130" height="52" rx="6"/><text class="ix mu c" x="435" y="279">не запускали</text><rect class="bxd" x="508" y="248" width="130" height="52" rx="6"/><text class="ix mu c" x="573" y="279">не запускали</text><rect class="bxr" x="646" y="248" width="130" height="52" rx="6"/><text class="tk sm c" x="711" y="271">0 B</text><text class="ix c" x="711" y="291">блок</text><rect class="bxd" x="784" y="248" width="130" height="52" rx="6"/><text class="ix mu c" x="849" y="279">не запускали</text></g>
<g class="a e6"><text class="sm tk" x="40" y="326">без ACK</text><text class="ix" x="40" y="346">tcp_flags_unset=ack</text><rect class="bxo" x="232" y="304" width="130" height="52" rx="6"/><text class="tk sm c" x="297" y="327">250 B</text><text class="ix c" x="297" y="347">разрешено</text><rect class="bxd" x="370" y="304" width="130" height="52" rx="6"/><text class="ix mu c" x="435" y="335">не запускали</text><rect class="bxd" x="508" y="304" width="130" height="52" rx="6"/><text class="ix mu c" x="573" y="335">не запускали</text><rect class="bxd" x="646" y="304" width="130" height="52" rx="6"/><text class="ix mu c" x="711" y="335">не запускали</text><rect class="bxr" x="784" y="304" width="130" height="52" rx="6"/><text class="tk sm c" x="849" y="327">0 B</text><text class="ix c" x="849" y="347">блок</text></g>
<g class="a e7"><text class="sm tk" x="40" y="382">старая метка</text><text class="ix" x="40" y="402">tcp_ts=-600000</text><rect class="bxo" x="232" y="360" width="130" height="52" rx="6"/><text class="tk sm c" x="297" y="383">250 B</text><text class="ix c" x="297" y="403">разрешено</text><rect class="bxd" x="370" y="360" width="130" height="52" rx="6"/><text class="ix mu c" x="435" y="391">не запускали</text><rect class="bxd" x="508" y="360" width="130" height="52" rx="6"/><text class="ix mu c" x="573" y="391">не запускали</text><rect class="bxo" x="646" y="360" width="130" height="52" rx="6"/><text class="tk sm c" x="711" y="383">250 B</text><text class="ix c" x="711" y="403">разрешено</text><rect class="bxd" x="784" y="360" width="130" height="52" rx="6"/><text class="ix mu c" x="849" y="391">не запускали</text></g>
<g class="a e8"><rect class="bxs" x="40" y="422" width="880" height="62" rx="8"/><text class="m" x="52" y="446">в журнале игрушки: TOY csum: ignoring packet with BAD tcp checksum</text><text class="sm" x="52" y="470">игнорирует подделку, берёт настоящее приветствие, находит имя, блокирует</text></g>
<g class="a e9"><rect class="bxa" x="40" y="494" width="880" height="52" rx="8"/><text class="sm tk" x="52" y="516">игрушки построены нами, каждая видит ровно одну причину: правило верно по построению</text><text class="sm" x="52" y="536">каков настоящий инспектор, мы не знаем</text></g>
