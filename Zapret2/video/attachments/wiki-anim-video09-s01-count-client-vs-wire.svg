<title id="video09-s01-count-client-vs-wire-t">Сколько пакетов у клиента</title>
<desc id="video09-s01-count-client-vs-wire-d">Приветствие стоит четвёртым среди пакетов на проводе, но третьим среди пакетов самого клиента, потому что между SYN клиента и его ACK на проводе стоит SYN-ACK сервера, а в счёт клиента он не идёт.</desc>
