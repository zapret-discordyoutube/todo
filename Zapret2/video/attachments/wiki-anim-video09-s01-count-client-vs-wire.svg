<g class="a video09-s01-count-client-vs-wire-k6"><text class="tk" x="40" y="324">на проводе 4, у клиента 3: SYN-ACK сервера стоит между SYN и ACK клиента</text><text class="sm mu" x="40" y="347">стратегии считают пакеты по сторонам: счёт клиента ведётся отдельно от счёта сервера</text></g>
