<g class="a video09-s01-count-client-vs-wire-k1"><text class="tk" x="40" y="64">пакеты на проводе</text><rect class="bxa" x="40" y="76" width="190" height="56" rx="8"/><text class="big" x="54" y="100">1</text><text class="tk" x="88" y="100">SYN</text><text class="sm13 mu" x="88" y="121">клиент → сервер</text><rect class="bxs" x="250" y="76" width="190" height="56" rx="8"/><text class="big" x="264" y="100">2</text><text class="tk" x="298" y="100">SYN-ACK</text><text class="sm13 mu" x="298" y="121">сервер → клиент</text><rect class="bxa" x="460" y="76" width="190" height="56" rx="8"/><text class="big" x="474" y="100">3</text><text class="tk" x="508" y="100">ACK</text><text class="sm13 mu" x="508" y="121">клиент → сервер</text><rect class="bxb" x="670" y="76" width="190" height="56" rx="8"/><text class="big" x="684" y="100">4</text><text class="tk" x="718" y="100">приветствие</text><text class="sm13 mu" x="718" y="121">250 байт, номер 1</text></g>
