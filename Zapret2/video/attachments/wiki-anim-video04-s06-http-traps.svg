<svg xmlns="http://www.w3.org/2000/svg" class="v04-s06-http-traps" viewBox="0 0 960 652" width="960" height="652" role="img" aria-labelledby="v04-s06-http-traps-t v04-s06-http-traps-d">
<title id="v04-s06-http-traps-t">Три ловушки меток на запросе HTTP</title>
<desc id="v04-s06-http-traps-d">Три ловушки на подготовленных нами запросах (в нашем тесте). Два пробела после Host: метка host встаёт на второй пробел (32), а имя начинается с 33. Порт :8080 или два пробела после имени попадают в «имя», и endhost уезжает за них: 52 и 49 вместо 47. После Host: меньше трёх байт (Host:ww) ни одна метка про имя не находится, а на Host:www находится только host (31).</desc>
