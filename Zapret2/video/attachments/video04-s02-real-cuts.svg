<svg xmlns="http://www.w3.org/2000/svg" class="v04-s02-real-cuts" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="v04-s02-real-cuts-t v04-s02-real-cuts-d">
<title id="v04-s02-real-cuts-t">Куда ляжет числовой разрез</title>
<desc id="v04-s02-real-cuts-d">Куда ляжет разрез при числовой позиции на настоящем приветствии в 250 байт (в нашем тесте): pos=1 даёт части 1 и 249 байт, pos=249 даёт 249 и 1, pos=250 не меньше размера и разреза нет, остаётся один пакет в 250 байт; pos=-10 это 250 − 10 = 240 и части 240 и 10, pos=-1 даёт 249 и 1, без pos по умолчанию позиция 2 и части 2 и 248. На запросе HTTP в 81 байт pos=32 даёт 32 и 49 байт, а pos=104 лежит за краем запроса и разреза нет.</desc>
<style>
.v04-s02-real-cuts{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
