<rect class="bg" x="0" y="0" width="960" height="911"/>
<g><text class="cap" x="40" y="22">что даёт расщепление против строгой игрушки</text></g>
<g class="a e1"><rect class="bxs" x="40" y="36" width="880" height="90" rx="8"/><text class="cap" x="54" y="58">руководство проекта, не наша проверка</text><text class="sm" x="54" y="78">Многие инспекторы ждут на SYN обычный SYN-ACK; ответ на SYN становится другим SYN, потом клиент шлёт</text><text class="sm" x="54" y="97">SYN-ACK серверу; инспектор теряет, где клиент, где сервер. Мы это не проверяли, о настоящем</text><text class="sm" x="54" y="116">оборудовании нам ничего не известно.</text></g>
<g class="a e2"><text class="sm tk" x="40" y="155">игрушка «строгое рукопожатие»: экзаменатор с чек-листом из трёх клеток</text><rect class="pl" x="737.9" y="137" width="182.1" height="24" rx="12"/><text class="sm c" x="829" y="154">выдуманный пример</text></g>
<g class="a e3"><rect class="bx" x="40" y="165" width="190" height="66" rx="8"/><circle class="bxa" cx="62" cy="187" r="12"/><text class="tk c ns" x="62" y="192">0</text><text class="sm" x="80" y="187">ждёт SYN клиента</text><path class="la" d="M234 198L256.0 198.0"/><polygon class="ha" points="266,198 256.0,203.0 256.0,193.0"/></g>
<g class="a e4"><rect class="bx" x="270" y="165" width="190" height="66" rx="8"/><circle class="bxa" cx="292" cy="187" r="12"/><text class="tk c ns" x="292" y="192">1</text><text class="sm" x="310" y="187">ждёт SYN-ACK</text><text class="sm" x="310" y="204">сервера с верным</text><text class="sm" x="310" y="221">подтверждением</text><path class="la" d="M464 198L486.0 198.0"/><polygon class="ha" points="496,198 486.0,203.0 486.0,193.0"/></g>
<g class="a e5"><rect class="bx" x="500" y="165" width="190" height="66" rx="8"/><circle class="bxa" cx="522" cy="187" r="12"/><text class="tk c ns" x="522" y="192">2</text><text class="sm" x="540" y="187">ждёт ACK</text><text class="sm" x="540" y="204">клиента</text><path class="la" d="M694 198L716.0 198.0"/><polygon class="ha" points="726,198 716.0,203.0 716.0,193.0"/></g>
<g class="a e6"><rect class="bxo" x="730" y="165" width="190" height="66" rx="8"/><circle class="bxa" cx="752" cy="187" r="12"/><text class="tk c ns" x="752" y="192">3</text><text class="sm tk" x="770" y="187">ищет имя в</text><text class="sm tk" x="770" y="204">пакетах клиента</text></g>
<g class="a e7"><rect class="bxr" x="40" y="245" width="880" height="34" rx="8"/><text class="sm tk rej" x="54" y="267">пришло не то: поток объявлен недействительным и больше не проверяется</text></g>
<g class="a e8"><text class="cap" x="54" y="309">режим</text><text class="cap" x="190" y="309">запись игрушки</text><text class="cap" x="670" y="309">приложение</text><text class="cap" x="810" y="309">ответ</text><path class="lm" d="M40 317L920 317"/></g>
<g class="a e9"><rect class="bxr" x="40" y="323" width="880" height="107" rx="6"/><text class="sm tk" x="54" y="347">без стратегии</text><text class="ix fg" x="190" y="343">state 0-&gt;1: client SYN seen</text><text class="ix fg" x="190" y="360">state 1-&gt;2: server SYN,ACK seen with the right ack</text><text class="ix fg" x="190" y="377">state 2-&gt;3: client ACK seen: handshake complete, inspection on</text><text class="ix fg" x="190" y="394">DECISION BLOCK: host name in a client packet</text><text class="ix fg" x="190" y="411">after a clean handshake</text><text class="mk rej" x="670" y="347">[]</text><text class="sm tk rej" x="810" y="347">пусто</text></g>
<g class="a e10"><rect class="bxo" x="40" y="438" width="880" height="73" rx="6"/><text class="sm tk" x="54" y="462">synack</text><text class="ix fg" x="190" y="458">state 0-&gt;1: client SYN seen</text><text class="ix fg" x="190" y="475">DECISION INVALID: expected the server SYN,ACK, got S</text><text class="ix fg" x="190" y="492">from server: flow is not a clean handshake, never inspected</text><text class="mk ok" x="670" y="462">[250]</text><text class="sm tk ok" x="810" y="462">есть, 33 мс</text></g>
<g class="a e11"><rect class="bxo" x="40" y="519" width="880" height="73" rx="6"/><text class="sm tk" x="54" y="543">syn</text><text class="ix fg" x="190" y="539">state 0-&gt;1: client SYN seen</text><text class="ix fg" x="190" y="556">DECISION INVALID: expected the server SYN,ACK, got S</text><text class="ix fg" x="190" y="573">from server: flow is not a clean handshake, never inspected</text><text class="mk ok" x="670" y="543">[250]</text><text class="sm tk amb" x="810" y="543">на 1,78 с</text></g>
<g class="a e12"><rect class="bxo" x="40" y="600" width="880" height="73" rx="6"/><text class="sm tk" x="54" y="624">acksyn</text><text class="ix fg" x="190" y="620">state 0-&gt;1: client SYN seen</text><text class="ix fg" x="190" y="637">DECISION INVALID: expected the server SYN,ACK, got A</text><text class="ix fg" x="190" y="654">from server: flow is not a clean handshake, never inspected</text><text class="mk ok" x="670" y="624">[250]</text><text class="sm tk amb" x="810" y="624">на 1,76 с</text></g>
<g class="a e13"><text class="sm mu" x="40" y="691">запись игрушки без префикса; ответ считается от первого SYN; приложение читает 250 байт</text></g>
<g class="a e14"><rect class="bx" x="40" y="699" width="880" height="62" rx="8"/><text class="sm tk" x="54" y="722">проверь себя: режим acksyn. Какую букву игрушка запишет вместо ожидаемого SYN-ACK?</text></g>
<g class="a e15 tr"><rect class="bxd" x="54" y="731" width="100" height="24" rx="6"/><text class="mk c" x="104" y="748">?</text></g>
<g class="a e16"><text class="sm tk ok" x="54" y="747">букву A: первым от сервера пришёл ACK, поток объявлен недействительным</text></g>
<g class="a e17"><rect class="bx" x="40" y="775" width="880" height="120" rx="8"/><text class="cap" x="54" y="797">итог, в нашем тесте на Linux 6.18 с нашими игрушками</text><text class="sm tk" x="54" y="823">synack стоит один круг, syn и acksyn около 1,8 с</text><text class="sm tk" x="54" y="847">строгая игрушка проиграла во всех трёх режимах: приветствие дошло</text><text class="sm tk" x="54" y="871">нужны флаг сервера и правило ядра, которое отдаёт программе пакеты сервера</text><text class="ix" x="54" y="889"></text></g>
</svg>
