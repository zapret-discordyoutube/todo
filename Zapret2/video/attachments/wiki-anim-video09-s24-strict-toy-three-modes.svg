<svg xmlns="http://www.w3.org/2000/svg" class="v09-s24-strict-toy-three-modes" viewBox="0 0 960 911" width="960" height="911" role="img" aria-labelledby="v09-s24-strict-toy-three-modes-t v09-s24-strict-toy-three-modes-d">
<title id="v09-s24-strict-toy-three-modes-t">Строгая игрушка и три режима расщепления</title>
<desc id="v09-s24-strict-toy-three-modes-d">Наша игрушка строгое рукопожатие ждёт SYN клиента, SYN-ACK сервера с верным подтверждением и ACK клиента и только потом ищет имя сайта в пакетах клиента, без стратегии она блокирует приветствие и приложение сервера получает 0 байт, а при расщеплении SYN-ACK в любом из трёх режимов она записывает, что вместо SYN-ACK пришёл S или A, объявляет поток недействительным и не проверяет его, поэтому приветствие доходит и приложение получает 250 байт, но в режимах syn и acksyn ответ приходит лишь через 1,8 с, что делает настоящий инспектор, нам неизвестно.</desc>
<style>.v09-s24-strict-toy-three-modes{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
