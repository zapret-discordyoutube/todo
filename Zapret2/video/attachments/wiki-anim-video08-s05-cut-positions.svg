<title id="video08-s05-cut-positions-t">Где падает разрез</title>
<desc id="video08-s05-cut-positions-d">Аргумент pos у fakedsplit это одна метка: по умолчанию разрез после 2 байт даёт части в 2 и 248 байт и ответ сервера 3, при host части в 97 и 153 байт и пакетный читатель нашей модели находит имя в начале второй части, а midsld режет имя пополам, и этот читатель его не находит.</desc>
