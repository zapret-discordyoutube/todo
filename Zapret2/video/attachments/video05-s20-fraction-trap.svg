.v05-s20-fraction-trap .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v05-s20-fraction-trap .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v05-s20-fraction-trap .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v05-s20-fraction-trap .hf{fill:var(--fg2)}.v05-s20-fraction-trap .ha{fill:var(--acc)}.v05-s20-fraction-trap .hr{fill:var(--rej)}.v05-s20-fraction-trap .hm{fill:var(--mute)}.v05-s20-fraction-trap .hb{fill:var(--amb)}
.v05-s20-fraction-trap .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v05-s20-fraction-trap .a{animation-duration:70s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
