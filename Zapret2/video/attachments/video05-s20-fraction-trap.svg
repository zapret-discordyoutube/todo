ction-trap .e10{animation-name:v05-s20-fraction-trap-k10}@keyframes v05-s20-fraction-trap-k11{0.0%{opacity:0}37.143%{opacity:0}37.786%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v05-s20-fraction-trap .e11{animation-name:v05-s20-fraction-trap-k11}@keyframes v05-s20-fraction-trap-k12{0.0%{opacity:0}41.429%{opacity:0}42.071%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v05-s20-fraction-trap .e12{animation-name:v05-s20-fraction-trap-k12}@keyframes v05-s20-fraction-trap-k13{0.0%{opacity:0}45.714%{opacity:0}46.357%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v05-s20-fraction-trap .e13{animation-name:v05-s20-fraction-trap-k13}@keyframes v05-s20-fraction-trap-k14{0.0%{opacity:0}50.0%{opacity:0}50.643%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v05-s20-fraction-trap .e14{animation-name:v05-s20-fraction-trap-k14}@keyframes v05-s20-fraction-trap-k15{0.0%{opacity:0}54.286%{opacity:0}54.929%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v05-s20-fraction-trap .e15{animation-name:v05-s20-fraction-trap-k15}@keyframes v05-s20-fraction-trap-k16{0.0%{opacity:0}61.429%{opacity:0}62.071%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v05-s20-fraction-trap .e16{animation-name:v05-s20-fraction-trap-k16}@keyframes v05-s20-fraction-trap-k17{0.0%{opacity:0}70.0%{opacity:0}70.643%{opacity:1}97.571%{opacity:1}98.429%{opacity:0}100%{opacity:0}}.v05-s20-fraction-trap .e17{animation-name:v05-s20-fraction-trap-k17}</style>
<rect class="bg" x="0" y="0" width="960" height="930"/>
<g><text class="cap" x="40" y="24">значение, которое ошибки не даёт: seqovl=2.5</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="880" height="74" rx="6"/><text class="sm tk" x="52" y="56">выдуманный пример: наряд «подложить два с половиной листа»</text><text class="sm" x="52" y="80">листов бригадир кладёт 2 (целых), а новый номер считает: прежний − 2,5, вниз = −3</text><text class="sm" x="52" y="100">листов два, сдвиг три: вся стопка съехала на один номер</text></g>
<g class="a e2"><text class="cap" x="40" y="126">то же число дважды</text><text class="ix mu r" x="600" y="126">lua/zapret-antidpi.lua</text><rect class="bx" x="40" y="134" width="560" height="66" rx="6"/><path class="lm" d="M86 140L86 194"/><text class="ix mu r" x="78" y="159">519</text><text class="ix fg" x="96" y="159">part = pattern(pat,1,seqovl)..part</text><text class="ix mu r" x="78" y="185">522</text><text class="ix fg" x="96" y="185">rawsend_payload_segmented(desync,part,pos_start-1-seqovl)</text></g>
<g class="a e3"><text class="sm tk" x="620" y="159">целая часть: 2 байта</text></g>
<g class="a e4"><text class="sm tk" x="620" y="185">идёт как есть: −2,5</text></g>
<g class="a e5"><rect class="bx" x="40" y="208" width="880" height="58" rx="6"/><text class="sm tk" x="52" y="230">прогон функций, исходный номер X:</text><text class="mk" x="450" y="230">в Lua  X − 2,5 = …704,5</text><text class="sm" x="52" y="254">дробь при сборке отбрасывается вниз</text><text class="mk" x="450" y="254">на проводе  X − 3 = …704</text></g>
<g class="a e6"><rect class="bxs" x="40" y="278" width="880" height="58" rx="6"/><text class="sm" x="52" y="300">по общим сведениям: Lua бывает двух видов, обычный интерпретатор и LuaJIT (ускоренный)</text><text class="ix fg" x="52" y="324">в нашей сборке при запуске: LUA v5.1 LuaJIT 2.1.1737090214 OpenResty</text></g>
<g class="a e7"><text class="sm mu" x="40" y="358">в обычном Lua 5.3 и новее дробная длина дала бы ошибку уже при подсчёте повторов узора (divint в pattern):</text><text class="sm mu" x="40" y="378">по общим сведениям, такую сборку не запускали</text></g>
<g class="a e8"><text class="cap" x="40" y="410">настоящий опыт: накладка 2,5, метка midsld</text></g>
<g class="a e9"><rect class="bx" x="44" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="76" y="440">−2</text><rect class="bx" x="108" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="140" y="440">−1</text><rect class="bx" x="172" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="204" y="440">0</text><rect class="bx" x="236" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="268" y="440">1</text><rect class="bx" x="300" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="332" y="440">2</text><rect class="bx" x="364" y="420" width="64" height="30" rx="0"/><text class="mk c" x="396" y="440">…</text><rect class="bx" x="428" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="460" y="440">102</text><rect class="bx" x="492" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="524" y="440">103</text><rect class="bx" x="556" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="588" y="440">104</text><rect class="bx" x="620" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="652" y="440">105</text><rect class="bx" x="684" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="716" y="440">106</text><rect class="bx" x="748" y="420" width="64" height="30" rx="0"/><text class="mk c" x="780" y="440">…</text><rect class="bx" x="812" y="420" width="64" height="30" rx="0"/><text class="ix c fg tk" x="844" y="440">250</text></g>
<g class="a e10"><text class="sm tk" x="40" y="480">пакет 1: номер −2, длина 106 (2 подкладки + 104 настоящих)</text><rect class="bxb" x="44" y="486" width="128" height="28" rx="0"/><text class="ix c fg" x="108" y="505">подкладка</text><rect class="bxr" x="172" y="486" width="64" height="28" rx="0"/><text class="ix c fg" x="204" y="505">байт 0</text><rect class="bxa" x="236" y="486" width="320" height="28" rx="0"/><text class="ix c fg" x="396" y="505">настоящие байты</text></g>
<g class="a e11"><text class="sm rej" x="172" y="532">первый настоящий байт на 0, а должен на 1</text></g>
<g class="a e12"><text class="sm tk" x="40" y="562">сервер: всё левее 1 отбрасывает, читает 103 байта, ждёт 104</text><rect class="fr" x="44" y="568" width="192" height="28" rx="0"/><text class="ix c fg" x="140" y="590">отброшено</text><path class="lcut" d="M44 572L236 572"/><rect class="bxo" x="236" y="568" width="320" height="28" rx="0"/><text class="ix c fg" x="396" y="587">прочитано 1…103</text><rect class="bxd" x="556" y="568" width="64" height="28" rx="0"/><text class="ix c fg" x="588" y="587">жду</text></g>
<g class="a e13"><text class="sm tk" x="40" y="630">пакет 2 с 105: дыра в один байт на номере 104, сервер: блок SACK [105, 251)</text><rect class="bxd" x="556" y="636" width="64" height="28" rx="0"/><text class="ix c fg" x="588" y="655">дыра</text><rect class="bxo" x="620" y="636" width="256" height="28" rx="0"/><text class="ix c fg" x="748" y="655">пакет 2: 105…250</text></g>
<g class="a e14"><text class="sm tk" x="40" y="698">клиент шлёт заново с 104, 147 байт (по журналу ядро, не nfqws2)</text><rect class="bxg" x="556" y="704" width="320" height="28" rx="0"/><text class="ix c fg" x="716" y="723">104…250</text></g>
<g class="a e15"><rect class="bxr" x="40" y="752" width="880" height="70" rx="6"/><text class="sm tk" x="52" y="774">приложение прочитало 103 + 147 = 250 байт, но не те</text><text class="sm" x="52" y="796">первого байта нет, байт на границе повторён; содержимое ≠ оригинал, имя сайта не прочесть</text><text class="sm" x="52" y="814">ошибки нет, соединение живо, а поток испорчен: накладка должна быть целой, больше нуля</text></g>
<g class="a e16"><rect class="bxd" x="40" y="838" width="880" height="78" rx="6"/><text class="sm tk" x="52" y="862">проверь себя: накладка 3,5. Сколько байт подкладки и на сколько сдвинется номер?</text></g>
<g class="a e17"><text class="sm" x="52" y="886">3 байта подкладки; номер X − 3,5 вниз = X − 4, первый настоящий байт опять на один левее</text><text class="sm mu" x="52" y="906">это счёт по коду, такой опыт не запускали</text></g>
</svg>
