.v05-s20-fraction-trap .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v05-s20-fraction-trap .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
