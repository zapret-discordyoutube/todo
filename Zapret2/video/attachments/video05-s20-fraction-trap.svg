<svg xmlns="http://www.w3.org/2000/svg" class="v05-s20-fraction-trap" viewBox="0 0 960 930" width="960" height="930" role="img" aria-labelledby="v05-s20-fraction-trap-t v05-s20-fraction-trap-d">
<title id="v05-s20-fraction-trap-t">Дробная накладка портит поток</title>
<desc id="v05-s20-fraction-trap-d">Ловушка дробной накладки seqovl=2.5 на нашем приветствии в 250 байт с pos=midsld: в выдуманном примере бригадир подкладывает два листа из двух с половиной, а новый номер считает как прежний минус 2,5 с округлением вниз, то есть минус три, и вся стопка съезжает на один номер; в коде число 2,5 используется дважды, pattern(pat,1,seqovl) на строке 519 берёт целую часть и делает 2 байта подкладки, а смещение pos_start-1-seqovl на строке 522 несёт -2,5 как есть, в прогоне функций сумма с дробью …704,5 при сборке пакета отбрасывается вниз до …704, то есть минус 3 к номеру оригинала; в нашей сборке стоит LuaJIT, в обычном Lua 5.3 и новее дробная длина дала бы ошибку уже в divint внутри pattern, такую сборку не запускали; в настоящем опыте первый пакет идёт с номера -2 и длиной 106, первый настоящий байт съехал на номер 0, сервер отбрасывает всё левее 1 и читает 103 байта, второй пакет с 105 оставляет дыру на номере 104, клиентское ядро присылает заново 147 байт с номера 104, приложение прочитало 103 и 147 байт, всего 250, но первого байта нет, а байт на границе повторён, имя сайта прочесть нельзя; для накладки 3,5 по счёту выходит 3 байта подкладки и сдвиг 4, такой опыт не запускали.</desc>
