<rect class="bg" x="0" y="0" width="960" height="524"/>
<g><text class="cap" x="40" y="24">игрушечный проверяющий первого вида: правило в роутере</text></g>
<g class="a e1"><rect class="bxb" x="40" y="36" width="880" height="40" rx="8"/><text class="sm tk" x="54" y="61">в лаборатории нет настоящего ТСПУ: это игрушки проекта, «сработало» = «обошло игрушку»</text></g>
<g class="a e2"><rect class="bxd" x="40" y="90" width="300" height="136" rx="8"/><text class="cap" x="54" y="112">выдуманный пример</text><text class="sm" x="54" y="134">вахтёр с картонкой с окошком</text><text class="sm" x="54" y="155">читает каждый лист отдельно,</text><text class="sm" x="54" y="176">только в окошко на одном месте,</text><text class="sm" x="54" y="197">ничего не склеивает и не помнит</text></g>
<g class="a e3"><rect class="bx" x="360" y="90" width="560" height="136" rx="8"/><text class="cap" x="374" y="112">правило nft в роутере</text></g>
<g class="a e4"><text class="sm tk" x="374" y="138">адрес</text><text class="sm" x="460" y="138">сервер 10.2.0.2, порт 443</text></g>
<g class="a e5"><text class="sm tk" x="374" y="159">место</text><text class="sm" x="460" y="159">смещение 97 от начала данных, считая с нуля</text></g>
<g class="a e6"><text class="sm tk" x="374" y="180">ищет</text><text class="sm" x="460" y="180">15 байт www.example.com</text></g>
<g class="a e7"><text class="sm tk" x="374" y="201">делает</text><text class="sm" x="460" y="201">выбрасывает (drop) или сбрасывает соединение (reset)</text></g>
<g class="a e8"><text class="sm tk" x="374" y="222">счётчик</text><text class="sm" x="460" y="222">сколько пакетов совпало</text></g>
<g class="a e9"><text class="ix" x="40" y="250">само правило: ip daddr 10.2.0.2 tcp dport 443 @th,1032,120 0x7777772e6578616d706c652e636f6d counter drop</text></g>
<g class="a e10"><text class="cap" x="40" y="274">один пакет клиента: заголовок и данные</text></g>
<g class="a e11"><rect class="bx" x="40" y="296" width="100" height="34" rx="0"/><rect class="fs" x="40" y="296" width="100" height="34"/><text class="sm c" x="90" y="318">TCP: 32</text><rect class="bx" x="140" y="296" width="780" height="34" rx="0"/><text class="sm mu" x="150" y="318">данные приветствия, 250 байт</text></g>
<g class="a e12"><rect class="fb" x="442.6" y="296" width="46.8" height="34"/><text class="ix c" x="466" y="318">имя</text></g>
<g class="a e13"><rect class="bxn" x="438.6" y="284" width="54.8" height="58" rx="4"/><text class="sm tk c" x="466" y="278">окошко</text></g>
<g class="a e14"><path class="lm" d="M140.0 332L140.0 344"/><text class="ix c" x="140" y="360">0</text><path class="lm" d="M442.6 332L442.6 344"/><text class="ix c" x="442.6" y="360">97</text><path class="lm" d="M489.4 332L489.4 344"/><text class="ix c" x="489.4" y="360">112</text><path class="lm" d="M920.0 332L920.0 344"/><text class="ix c" x="920" y="360">250</text><text class="ix mu r" x="134" y="360">смещение данных:</text></g>
<g class="a e15"><path class="la" d="M40 396L442.6 396"/><path class="la" d="M40 390L40 402"/><path class="la" d="M442.6 390L442.6 402"/><text class="sm tk c" x="241.3" y="418">32 + 97 = 129 байт от начала TCP = 1032 бита</text></g>
<g class="a e16"><text class="ix" x="503.4" y="400">77 77 77 2e 65 78 61 6d 70 6c 65 2e 63 6f 6d</text><text class="ix mu" x="503.4" y="418">= www.example.com, 15 байт, смещения 97–111</text></g>
<g class="a e17"><rect class="bx" x="40" y="438" width="880" height="62" rx="8"/><text class="sm" x="54" y="460">32 = 20 байт обычного заголовка + 12 байт опции времени:</text><text class="sm" x="54" y="482">у всех клиентских пакетов нашего теста заголовок такой длины, поэтому место одно и то же</text></g>
</svg>
