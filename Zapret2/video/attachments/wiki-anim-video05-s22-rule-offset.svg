.v05-s22-rule-offset .hf{fill:var(--fg2)}.v05-s22-rule-offset .ha{fill:var(--acc)}.v05-s22-rule-offset .hr{fill:var(--rej)}.v05-s22-rule-offset .hm{fill:var(--mute)}.v05-s22-rule-offset .hb{fill:var(--amb)}
.v05-s22-rule-offset .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
