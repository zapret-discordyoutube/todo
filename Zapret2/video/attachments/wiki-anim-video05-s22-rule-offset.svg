<svg xmlns="http://www.w3.org/2000/svg" class="v05-s22-rule-offset" viewBox="0 0 960 524" width="960" height="524" role="img" aria-labelledby="v05-s22-rule-offset-t v05-s22-rule-offset-d">
<title id="v05-s22-rule-offset-t">Правило и одно место</title>
<desc id="v05-s22-rule-offset-d">Игрушечное правило в роутере (игрушка проекта, а не настоящее оборудование) смотрит на каждый пакет к серверу 10.2.0.2, порт 443, по отдельности и сравнивает ровно 15 байт www.example.com с одним фиксированным местом: смещение 97 от начала данных, считая с нуля, то есть 32 байта заголовка TCP плюс 97, это смещение 129 от начала заголовка и 1032 бита в записи правила; 32 байта заголовка это 20 обычных и 12 байт опции времени, и у всех клиентских пакетов нашего теста заголовок такой длины, поэтому место одно и то же; при совпадении пакет выбрасывается или соединение сбрасывается, счётчик считает совпавшие пакеты, а выдуманный вахтёр с картонкой с окошком читает каждый лист отдельно, только в окошко на одном месте, ничего не склеивает и не помнит.</desc>
<style>.v05-s22-rule-offset{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
