<rect class="bg" x="0" y="0" width="960" height="902"/>
<g><text class="cap" x="40" y="22">итог выпуска: фокусы рукопожатия, наш Linux, наши игрушки</text></g>
<g class="a e1"><text class="cap" x="54" y="50">приём</text><text class="cap" x="200" y="50">что делает</text><text class="cap" x="420" y="50">что мы видели в нашем тесте</text><path class="lm" d="M40 60L920 60"/></g>
<g class="a e2"><rect class="bx" x="40" y="68" width="880" height="72" rx="6"/><text class="mk" x="54" y="92">syndata</text><text class="sm tk" x="200" y="92">SYN с данными</text><text class="sm" x="420" y="92">сервер на Linux берёт только сам SYN; игрушка «первые</text><text class="sm" x="420" y="110">данные решают» обманута, «данные SYN не читает» нет;</text><text class="sm" x="420" y="128">условия убивают единственный SYN</text></g>
<g class="a e3"><rect class="bx" x="40" y="146" width="880" height="72" rx="6"/><text class="mk" x="54" y="170">rst</text><text class="sm tk" x="200" y="170">сброс перед</text><text class="sm tk" x="200" y="188">приветствием</text><text class="sm" x="420" y="170">со сроком 1 умирает на роутере, с плохой суммой доходит, но</text><text class="sm" x="420" y="188">сервер игнорирует; срок 2 и чистый сброс разрывают</text><text class="sm" x="420" y="206">соединение</text></g>
<g class="a e4"><rect class="bx" x="40" y="224" width="880" height="54" rx="6"/><text class="mk" x="54" y="248">synack</text><text class="sm tk" x="200" y="248">SYN,ACK раньше SYN</text><text class="sm" x="420" y="248">сервер отвечает безвредным сбросом; игрушка с теми же</text><text class="sm" x="420" y="266">ролями обманута</text></g>
<g class="a e5"><rect class="bx" x="40" y="284" width="880" height="54" rx="6"/><text class="mk" x="54" y="308">oob</text><text class="sm tk" x="200" y="308">срочный байт и сдвиг на</text><text class="sm tk" x="200" y="326">единицу</text><text class="sm" x="420" y="308">после сдвига пути назад нет: ошибка оставляет мёртвое</text><text class="sm" x="420" y="326">соединение</text></g>
<g class="a e6"><rect class="bx" x="40" y="344" width="880" height="72" rx="6"/><text class="mk" x="54" y="368">wssize, wsize</text><text class="sm tk" x="200" y="368">ложь про окно</text><text class="sm" x="420" y="368">ответ начинается с 64 байт; клиент режет приветствие на 1,</text><text class="sm" x="420" y="386">107, 72, 70; окно 100 байт со сборкой останавливает</text><text class="sm" x="420" y="404">соединение</text></g>
<g class="a e7"><rect class="bx" x="40" y="422" width="880" height="54" rx="6"/><text class="mk" x="54" y="446">--server</text><text class="sm tk" x="200" y="446">ярлыки наоборот,</text><text class="sm tk" x="200" y="464">зеркальные правила</text><text class="sm" x="420" y="446">забытый флаг и чужие правила: ловушки</text></g>
<g class="a e8"><rect class="bx" x="40" y="482" width="880" height="36" rx="6"/><text class="mk" x="54" y="506">synack_split</text><text class="sm tk" x="200" y="506">SYN,ACK на два пакета</text><text class="sm" x="420" y="506">цена: один круг или около 1,8 с</text></g>
<g class="a e9"><rect class="bx" x="40" y="524" width="880" height="54" rx="6"/><text class="mk" x="54" y="548">обломок</text><text class="sm tk" x="200" y="548">подмена первого пакета</text><text class="sm" x="420" y="548">только у приёмов, что выбрасывают первый пакет: syndata и</text><text class="sm" x="420" y="566">synack_split</text></g>
<g class="a e10"><text class="cap" x="40" y="604">не проверяли</text><text class="ix mu r" x="920" y="604">о них мы ничего не утверждаем</text></g>
<g class="a e11"><rect class="bxg" x="40" y="612" width="434" height="42" rx="6"/><text class="sm" x="54" y="638">настоящий ТСПУ</text></g>
<g class="a e12"><rect class="bxg" x="486" y="612" width="434" height="42" rx="6"/><text class="sm" x="500" y="629">другие получатели: Windows, BSD, телефоны,</text><text class="sm" x="500" y="647">быстрое открытие</text></g>
<g class="a e13"><rect class="bxg" x="40" y="662" width="434" height="42" rx="6"/><text class="sm" x="54" y="679">код ядра: метки времени, пропавшее</text><text class="sm" x="54" y="697">подтверждение</text></g>
