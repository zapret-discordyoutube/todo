<svg xmlns="http://www.w3.org/2000/svg" class="v09-s29-recap-grey-list-next" viewBox="0 0 960 902" width="960" height="902" role="img" aria-labelledby="v09-s29-recap-grey-list-next-t v09-s29-recap-grey-list-next-d">
<title id="v09-s29-recap-grey-list-next-t">Итог выпуска, непроверенное и следующий выпуск</title>
<desc id="v09-s29-recap-grey-list-next-d">Итог выпуска Фокусы рукопожатия в восьми строках и серый список того, чего мы не проверяли: syndata кладёт данные в SYN, но сервер Linux берёт только сам SYN, rst со сроком 1 умирает на роутере, synack вызывает безвредный сброс, oob после сдвига не отменить, ложь про окно режет приветствие клиента, флаг сервера переворачивает ярлыки, synack_split стоит один круг или около 1,8 с, а обломок подменяет первый пакет только у приёмов, которые его выбрасывают, при этом настоящий ТСПУ, другие получатели, ядро, причина 107, 72 и 70, IPv6 с фрагментами и сеть за преобразованием адресов остались непроверенными, а следующий выпуск про другие слои.</desc>
