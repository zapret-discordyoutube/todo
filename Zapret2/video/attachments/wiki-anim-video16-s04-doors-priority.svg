<rect class="bg" x="0" y="0" width="960" height="616"/>
<g><text class="cap" x="40" y="24">Где висят цепочки на пути пакета</text></g>
<g><rect class="bxd" x="730" y="8" width="190" height="24" rx="6"/><text class="sm c" x="825" y="25">схема, не масштаб</text></g>
<g class="a e1"><rect class="bx" x="40" y="96" width="100" height="44" rx="6"/><text class="tk sm c" x="90" y="123">сеть</text><path class="lf" d="M144 118L214.0 118.0"/><polygon class="hf" points="224,118 214.0,123.0 214.0,113.0"/><rect class="bx" x="360" y="96" width="200" height="44" rx="6"/><text class="tk sm c" x="460" y="123">выбор дороги</text><path class="lf" d="M242 118L346.0 118.0"/><polygon class="hf" points="356,118 346.0,123.0 346.0,113.0"/><path class="lf" d="M564 118L640.0 118.0"/><polygon class="hf" points="650,118 640.0,123.0 640.0,113.0"/><path class="lf" d="M666 118L780.0 118.0"/><polygon class="hf" points="790,118 780.0,123.0 780.0,113.0"/><rect class="bx" x="796" y="96" width="124" height="44" rx="6"/><text class="tk sm c" x="858" y="123">в интерфейс</text></g>
<g class="a e2"><rect class="bxn" x="226" y="82" width="14" height="72" rx="3"/><text class="mk c" x="233" y="180">prerouting</text><text class="sm c" x="233" y="200">пакет только что пришёл</text></g>
<g class="a e3"><rect class="bxn" x="650" y="82" width="14" height="72" rx="3"/><text class="mk c" x="657" y="180">postrouting</text><text class="sm c" x="657" y="200">пакет вот-вот уйдёт</text></g>
<g class="a e4"><rect class="bxo" x="133" y="38" width="200" height="30" rx="6"/><text class="tk sm c ns" x="233" y="58">pre · приоритет −101</text><path class="lo" d="M233 68L233 80"/></g>
<g class="a e5"><rect class="bxa" x="557" y="38" width="200" height="30" rx="6"/><text class="tk sm c ns" x="657" y="58">post · приоритет 101</text><path class="la" d="M657 68L657 80"/></g>
<g class="a e6"><text class="cap" x="40" y="238">Для самого клиента</text><text class="tk sm" x="40" y="270">исходящие</text><text class="tk sm" x="40" y="306">входящие</text></g>
<g class="a e7"><rect class="bx" x="160" y="252" width="118" height="32" rx="6"/><text class="tk sm c ns" x="219" y="273">программа</text><path class="lf" d="M282 268L292.0 268.0"/><polygon class="hf" points="302,268 292.0,273.0 292.0,263.0"/><rect class="bx" x="306" y="252" width="118" height="32" rx="6"/><text class="mk c ns" x="365" y="273">output</text><path class="lf" d="M428 268L438.0 268.0"/><polygon class="hf" points="448,268 438.0,273.0 438.0,263.0"/><rect class="bxa" x="452" y="252" width="118" height="32" rx="6"/><text class="mk c ns" x="511" y="273">postrouting</text><path class="lf" d="M574 268L584.0 268.0"/><polygon class="hf" points="594,268 584.0,273.0 584.0,263.0"/><rect class="bx" x="598" y="252" width="118" height="32" rx="6"/><text class="tk sm c ns" x="657" y="273">c0</text></g>
<g class="a e8"><rect class="bx" x="160" y="288" width="118" height="32" rx="6"/><text class="tk sm c ns" x="219" y="309">c0</text><path class="lf" d="M282 304L292.0 304.0"/><polygon class="hf" points="302,304 292.0,309.0 292.0,299.0"/><rect class="bxo" x="306" y="288" width="118" height="32" rx="6"/><text class="mk c ns" x="365" y="309">prerouting</text><path class="lf" d="M428 304L438.0 304.0"/><polygon class="hf" points="448,304 438.0,309.0 438.0,299.0"/><rect class="bx" x="452" y="288" width="118" height="32" rx="6"/><text class="mk c ns" x="511" y="309">input</text><path class="lf" d="M574 304L584.0 304.0"/><polygon class="hf" points="594,304 584.0,309.0 584.0,299.0"/><rect class="bx" x="598" y="288" width="118" height="32" rx="6"/><text class="tk sm c ns" x="657" y="309">программа</text></g>
<g class="a e9"><rect class="bxd" x="750" y="268" width="170" height="52" rx="6"/><text class="sm c" x="835" y="291">NAT в лаборатории</text><text class="sm c tk" x="835" y="310">нет</text></g>
<g class="a e10"><text class="cap" x="40" y="348">Приоритет: у кого число меньше, тот раньше (по общим сведениям)</text></g>
<g class="a e11"><path class="lm" d="M40 394L900 394"/></g>
<g class="a e12"><path class="lf" d="M150 388L150 400"/><text class="mk c" x="150" y="418">−200</text><text class="sm c mu" x="150" y="380">отслеживание соединений</text></g>
<g class="a e13"><path class="lf" d="M300 388L300 400"/><text class="mk c" x="300" y="418">−101</text><rect class="bxo" x="274" y="428" width="52" height="24" rx="6"/><text class="tk sm c ns" x="300" y="445">pre</text></g>
<g class="a e14"><path class="lf" d="M420 388L420 400"/><text class="mk c" x="420" y="418">−100</text><text class="sm c mu" x="420" y="380">перевод адресов назначения</text></g>
<g class="a e15"><path class="lf" d="M690 388L690 400"/><text class="mk c" x="690" y="418">100</text><text class="sm c mu" x="690" y="380">перевод адресов источника</text></g>
<g class="a e16"><path class="lf" d="M820 388L820 400"/><text class="mk c" x="820" y="418">101</text><rect class="bxa" x="794" y="428" width="52" height="24" rx="6"/><text class="tk sm c ns" x="820" y="445">post</text></g>
<g class="a e17"><path class="lf" d="M350 440L740.0 440.0"/><polygon class="hf" points="750,440 740.0,445.0 740.0,435.0"/><text class="sm c tk" x="550" y="464">меньше — раньше</text></g>
<g class="a e18"><text class="sm mu" x="40" y="494">В лаборатории перевода адресов нет: число 101 нужно только для порядка.</text></g>
<g class="a e19"><rect class="bx" x="40" y="508" width="880" height="28" rx="5"/><text class="cd" x="52" y="527">packet: id=1 … ifin=(0) ifout=c0(3)</text><text class="sm" x="410" y="527">исходящий: только выходной интерфейс c0 → цепочка post</text></g>
<g class="a e20"><rect class="bx" x="40" y="542" width="880" height="28" rx="5"/><text class="cd" x="52" y="561">packet: id=2 … ifin=c0(3) ifout=(0)</text><text class="sm" x="410" y="561">входящий: только входной интерфейс c0 → цепочка pre</text></g>
<g class="a e21"><text class="sm mu" x="40" y="600">Журнал не пишет имя цепочки: её выводят по интерфейсам.</text></g>
</svg>
