<svg xmlns="http://www.w3.org/2000/svg" class="v16-s04-doors-priority" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="v16-s04-doors-priority-t v16-s04-doors-priority-d">
<title id="v16-s04-doors-priority-t">Две цепочки на пути пакета</title>
<desc id="v16-s04-doors-priority-d">Где на пути пакета висят две цепочки. Слева сеть, дверь prerouting (здесь висит цепочка pre с приоритетом −101: пакет только что принят), посередине выбор дороги, дверь postrouting (цепочка post с приоритетом 101: исходящий пакет вот-вот уйдёт в интерфейс c0). Для самого клиента исходящие идут от программы через output к postrouting и в c0, входящие из c0 через prerouting к input. Приоритет, по общим сведениям: чем меньше число, тем раньше; −101 после отслеживания соединений (−200) и до перевода адресов назначения (−100), 101 чуть позже перевода адресов источника (100); в лаборатории перевода адресов нет. Журнал программы не называет цепочку, её выводят по интерфейсам: у исходящего пакета id=1 указан только выходной интерфейс ifout=c0(3), у входящего id=2 только входной ifin=c0(3).</desc>
