<svg xmlns="http://www.w3.org/2000/svg" class="v02-s19-reassembly" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="v02-s19-reassembly-t v02-s19-reassembly-d">
<title id="v02-s19-reassembly-t">Наблюдатель, собирающий поток</title>
<desc id="v02-s19-reassembly-d">Наблюдатель, который собирает поток: для этого нужно помнить каждое соединение, начальные номера обеих сторон, класть пакеты в буфер по номерам, ждать недостающие куски и следить за повторами, причём для всех соединений сразу; в нашем примере пакет 1 (104 байта) ложится на места 1..104, пакет 2 (146 байт) на 105..250, и имя www.example.com лежит на местах 98..112 целиком, так что такому наблюдателю разрезание не мешает, а читающему пакеты по одному мешает; что делает настоящее оборудование, неизвестно.</desc>
<style>.v02-s19-reassembly{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s19-reassembly{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
