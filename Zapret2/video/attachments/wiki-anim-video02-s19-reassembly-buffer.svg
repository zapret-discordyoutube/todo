<rect class="bg" x="0" y="0" width="960" height="512"/>
<g class="a e1"><text class="cap" x="10" y="22">цена сборки потока и сама сборка</text><text class="tk sm" x="10" y="50">чтобы собрать поток, нужно:</text></g>
<g class="a e2"><rect class="bx" x="10" y="62" width="330" height="36" rx="6"/><text class="sm" x="24" y="85">помнить каждое соединение</text></g>
<g class="a e3"><rect class="bx" x="10" y="106" width="330" height="36" rx="6"/><text class="sm" x="24" y="129">запомнить стартовые номера сторон</text></g>
<g class="a e4"><rect class="bx" x="10" y="150" width="330" height="36" rx="6"/><text class="sm" x="24" y="173">класть пакеты в буфер по номерам</text></g>
<g class="a e5"><rect class="bx" x="10" y="194" width="330" height="36" rx="6"/><text class="sm" x="24" y="217">ждать недостающие куски</text></g>
<g class="a e6"><rect class="bx" x="10" y="238" width="330" height="36" rx="6"/><text class="sm" x="24" y="261">следить за повторами и порядком</text></g>
<g class="a e7"><rect class="bx" x="10" y="282" width="330" height="36" rx="6"/><text class="sm" x="24" y="305">всё это для каждого соединения сразу</text></g>
<g class="a e8"><text class="sm tk" x="10" y="342">что делают настоящие устройства,</text><text class="sm tk" x="10" y="362">неизвестно: мы не утверждаем,</text><text class="sm tk" x="10" y="382">что какое-то собирает или нет</text></g>
<g class="a e9"><text class="tk sm" x="370" y="50">буфер соединения: байты запроса, номера 1..250</text><rect class="bxd" x="370" y="90" width="580" height="38" rx="4"/></g>
<g class="a e10"><text class="mt mu" x="370" y="148">1</text><text class="mt mu c" x="611.3" y="148">105</text><text class="mt mu r" x="950" y="148">250</text></g>
<g class="a e11"><rect class="bxa" x="370" y="90" width="240.3" height="38" rx="4"/><text class="sm c tk" x="490.65" y="114">пакет 1: 1..104</text></g>
<g class="a e12"><rect class="bxb" x="611.3" y="90" width="338.7" height="38" rx="4"/><text class="sm c tk" x="780.65" y="114">пакет 2: 105..250</text></g>
<g class="a e13"><path class="lo" d="M610.8 82L610.8 136"/><text class="sm" x="370" y="170">стык: пакет 2 начался,</text><text class="sm" x="370" y="188">где кончился пакет 1</text></g>
<g class="a e14"><rect class="bxn" x="595" y="84" width="34.8" height="50" rx="3"/><path class="lad" d="M595 136L595 198"/><path class="lad" d="M629.8 136L629.8 198"/><text class="sm hbo" x="641.8" y="176">www.example.com</text><text class="sm" x="641.8" y="196"><tspan>на местах </tspan><tspan class="hb">98..112</tspan><tspan> целиком</tspan></text></g>
<g class="a e15"><text class="sm tk" x="370" y="258">Читающий поток находит имя, как в целом запросе.</text></g>
<g class="a e16"><rect class="bxo" x="10" y="404" width="462" height="92" rx="8"/><text class="tk" x="26" y="430">Наблюдатель собирает поток</text><text class="sm" x="26" y="454">разрезание запроса ему не мешает,</text><text class="sm" x="26" y="474">нужны другие приёмы</text></g>
<g class="a e17"><rect class="bxr" x="488" y="404" width="462" height="92" rx="8"/><text class="tk" x="504" y="430">Наблюдатель читает пакеты по одному</text><text class="sm" x="504" y="454">разрезание ему мешает: имени целиком</text><text class="sm" x="504" y="474">нет ни в одном пакете</text></g>
</svg>
