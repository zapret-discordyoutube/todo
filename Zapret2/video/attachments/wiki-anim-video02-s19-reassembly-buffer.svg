.v02-s19-reassembly .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s19-reassembly .mu{fill:var(--mute)}.v02-s19-reassembly .fg{fill:var(--fg)}.v02-s19-reassembly .acc{fill:var(--acc)}.v02-s19-reassembly .rej{fill:var(--rej)}.v02-s19-reassembly .ok{fill:var(--ok)}.v02-s19-reassembly .amb{fill:var(--amb)}
.v02-s19-reassembly .hb{fill:var(--acc);font-weight:700}.v02-s19-reassembly .hbr{fill:var(--rej);font-weight:700}.v02-s19-reassembly .hbo{fill:var(--ok);font-weight:700}.v02-s19-reassembly .hbb{fill:var(--amb);font-weight:700}
