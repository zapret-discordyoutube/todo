.v02-s19-reassembly .hf{fill:var(--fg2)}.v02-s19-reassembly .ha{fill:var(--acc)}.v02-s19-reassembly .hr{fill:var(--rej)}.v02-s19-reassembly .hm{fill:var(--mute)}.v02-s19-reassembly .ho{fill:var(--ok)}.v02-s19-reassembly .hbm{fill:var(--amb)}
.v02-s19-reassembly .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v02-s19-reassembly .dotr{fill:var(--rej);stroke:var(--bg);stroke-width:2}
.v02-s19-reassembly .gz{transform-box:fill-box;transform-origin:0 50%}
.v02-s19-reassembly .a{animation-duration:36s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
