.v06-s06-app-reads .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v06-s06-app-reads .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v06-s06-app-reads .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v06-s06-app-reads .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v06-s06-app-reads .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v06-s06-app-reads .hf{fill:var(--fg2)}.v06-s06-app-reads .ha{fill:var(--acc)}.v06-s06-app-reads .hr{fill:var(--rej)}.v06-s06-app-reads .hm{fill:var(--mute)}.v06-s06-app-reads .hb{fill:var(--amb)}
.v06-s06-app-reads .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v06-s06-app-reads .a{animation-duration:60s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
