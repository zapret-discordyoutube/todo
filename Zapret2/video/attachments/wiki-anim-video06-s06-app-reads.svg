<svg xmlns="http://www.w3.org/2000/svg" class="v06-s06-app-reads" viewBox="0 0 960 688" width="960" height="688" role="img" aria-labelledby="v06-s06-app-reads-t v06-s06-app-reads-d">
<title id="v06-s06-app-reads-t">Второй опыт и что читает приложение</title>
<desc id="v06-s06-app-reads-d">Второй опыт с метками 1 и midsld и что прочитало приложение на сервере: три куска приходят с конца, 146 байт со 105-го дают блок с 105, 103 байта со 2-го дают блок со 2, последний 1 байт закрывает дыру и приходит ACK 251; приложение здесь это маленькая принимающая программа лаборатории, она читает всё, что отдало ядро, и записывает число байт и число чтений, а границы чтений протокол по общим сведениям не обещает; в опыте с двумя кусками в обратном порядке приложение прочитало 250 байт за одно чтение, а в опыте с multisplit по порядку двумя чтениями по 104 и 146 байт, и по общим сведениям сетевой стек держит байты из будущего у себя, пока не закроется дыра, это обычное поведение приёмника TCP, другие системы мы не проверяли.</desc>
