1}97.167%{opacity:1}98.167%{opacity:0}100%{opacity:0}}.v06-s06-app-reads .e11{animation-name:v06-s06-app-reads-k11}@keyframes v06-s06-app-reads-k12{0.0%{opacity:0}45.0%{opacity:0}45.75%{opacity:1}97.167%{opacity:1}98.167%{opacity:0}100%{opacity:0}}.v06-s06-app-reads .e12{animation-name:v06-s06-app-reads-k12}@keyframes v06-s06-app-reads-k13{0.0%{opacity:0}51.667%{opacity:0}52.417%{opacity:1}97.167%{opacity:1}98.167%{opacity:0}100%{opacity:0}}.v06-s06-app-reads .e13{animation-name:v06-s06-app-reads-k13}@keyframes v06-s06-app-reads-k14{0.0%{opacity:0}53.333%{opacity:0}54.083%{opacity:1}97.167%{opacity:1}98.167%{opacity:0}100%{opacity:0}}.v06-s06-app-reads .e14{animation-name:v06-s06-app-reads-k14}@keyframes v06-s06-app-reads-k15{0.0%{opacity:0}56.667%{opacity:0}57.417%{opacity:1}97.167%{opacity:1}98.167%{opacity:0}100%{opacity:0}}.v06-s06-app-reads .e15{animation-name:v06-s06-app-reads-k15}@keyframes v06-s06-app-reads-k16{0.0%{opacity:0}63.333%{opacity:0}64.083%{opacity:1}97.167%{opacity:1}98.167%{opacity:0}100%{opacity:0}}.v06-s06-app-reads .e16{animation-name:v06-s06-app-reads-k16}@keyframes v06-s06-app-reads-k17{0.0%{opacity:0}70.0%{opacity:0}70.75%{opacity:1}97.167%{opacity:1}98.167%{opacity:0}100%{opacity:0}}.v06-s06-app-reads .e17{animation-name:v06-s06-app-reads-k17}</style>
<rect class="bg" x="0" y="0" width="960" height="688"/>
<g><text class="cap" x="40" y="24">второй опыт, потом что видит приложение на сервере</text></g>
<g class="a e1"><text class="sm tk" x="40" y="54">проверь себя: метки 1 и midsld, три куска, какой блок после второго?</text></g>
<g class="a e2"><circle class="bxa" cx="54" cy="82" r="13"/><text class="tk c ns" x="54" y="87">1</text><text class="sm tk" x="76" y="80">кусок 105…250, 146 байт</text><text class="sm" x="76" y="102">ответ: ACK 1</text><rect class="bx" x="340" y="68" width="580" height="20" rx="0"/><rect class="bxa" x="581.3" y="68" width="338.7" height="20" rx="0"/></g>
<g class="a e3"><path class="lo" d="M581.3 93L581.3 100L920 100L920 93"/><text class="ix ok" x="583.3" y="118">блок [105,251)</text></g>
<g class="a e4"><circle class="bxa" cx="54" cy="148" r="13"/><text class="tk c ns" x="54" y="153">2</text><text class="sm tk" x="76" y="146">кусок 2…104, 103 байта</text><text class="sm" x="76" y="168">ответ: ACK 1</text><rect class="bx" x="340" y="134" width="580" height="20" rx="0"/><rect class="bxg" x="581.3" y="134" width="338.7" height="20" rx="0"/><rect class="bxa" x="342.3" y="134" width="239" height="20" rx="0"/></g>
<g class="a e5 tr"><text class="sm mu" x="346" y="182">проверь себя: какой блок?</text></g>
<g class="a e6"><path class="lo" d="M342.3 159L342.3 166L920 166L920 159"/><text class="ix ok" x="344.3" y="184">блок [2,251)</text></g>
<g class="a e7"><circle class="bxa" cx="54" cy="214" r="13"/><text class="tk c ns" x="54" y="219">3</text><text class="sm tk" x="76" y="212">кусок 1…1, 1 байт</text><text class="sm" x="76" y="234">ответ: ACK 251, блока нет</text><rect class="bx" x="340" y="200" width="580" height="20" rx="0"/><rect class="bxg" x="342.3" y="200" width="577.7" height="20" rx="0"/><rect class="bxo" x="340" y="200" width="2.3" height="20" rx="0"/></g>
<g class="a e8"><rect class="bxo" x="340" y="226" width="580" height="22" rx="0"/><text class="sm c" x="630" y="242">дыра закрыта: ACK 251</text></g>
<g class="a e9"><rect class="bx" x="40" y="282" width="880" height="112" rx="6"/><text class="sm tk" x="52" y="306">приложение: что это слово значит здесь</text><text class="sm" x="52" y="330">маленькая принимающая программа на сервере лаборатории; читает всё, что отдало ядро</text><text class="sm" x="52" y="352">записывает число байт и число чтений: одно чтение = все байты разом, два = байты порциями</text><text class="sm mu" x="52" y="376">по общим сведениям: границы чтений протокол не обещает</text></g>
<g class="a e10"><text class="cap" x="40" y="414">что прочитало приложение на сервере</text></g>
<g class="a e11"><rect class="bxo" x="40" y="424" width="420" height="96" rx="6"/><text class="sm tk" x="52" y="447">два куска в обратном порядке</text><text class="m fg" x="52" y="476">чтение 1: 250 байт</text><text class="m fg" x="52" y="500">всего 250 байт, хэш равен</text></g>
<g class="a e12"><rect class="bxb" x="500" y="424" width="420" height="96" rx="6"/><text class="sm tk" x="512" y="447">multisplit, куски по порядку</text><text class="m fg" x="512" y="476">чтение 1: 104 байта</text><text class="m fg" x="512" y="500">чтение 2: 146 байт</text></g>
<g class="a e13"><text class="cap" x="40" y="548">почему в обратном порядке чтение одно: стек держит байты из будущего</text></g>
<g class="a e14"><rect class="bx" x="40" y="560" width="880" height="26" rx="0"/><rect class="bxg" x="406.1" y="560" width="513.9" height="26" rx="0"/><text class="sm c" x="663" y="578">байты 105…250 лежат в стеке</text><text class="sm c mu" x="223" y="578">пока пусто</text></g>
<g class="a e15"><text class="sm" x="40" y="604">приложению отдано 0 байт: первый байт ещё не пришёл</text></g>
<g class="a e16"><rect class="bxo" x="40" y="618" width="880" height="26" rx="0"/><text class="sm c" x="480" y="636">пришло начало 1…104: стек отдаёт все 250 байт разом, это одно чтение</text></g>
<g class="a e17"><text class="sm mu" x="40" y="666">по общим сведениям: обычное поведение приёмника TCP; другие системы мы не проверяли</text></g>
</svg>
