.v06-s06-app-reads .fa{fill:var(--tint);stroke:none}.v06-s06-app-reads .fr{fill:var(--rejt);stroke:none}.v06-s06-app-reads .fb{fill:var(--ambt);stroke:none}.v06-s06-app-reads .fo{fill:var(--okt);stroke:none}
