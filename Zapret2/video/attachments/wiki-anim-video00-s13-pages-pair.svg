<g class="a e25"><rect class="bx" x="492" y="408" width="444" height="172" rx="8"/><text class="sm" x="508" y="434">в списке имён:</text><rect class="bxr" x="662" y="417" width="160" height="28" rx="6"/><text class="mk c" x="742" y="437">example.org</text></g>
<g class="a e26"><text class="lg" x="508" y="466">hostlist check for example.com : negative</text><text class="lgk" x="508" y="486">desync profile 0 (no_action) matches</text></g>
<g class="a e27"><rect class="bx" x="508" y="500" width="396" height="30" rx="0"/><text class="sm c tk" x="706" y="520">250 байт</text><text class="lgk" x="508" y="558">chunks [(250, 250)]</text></g>
