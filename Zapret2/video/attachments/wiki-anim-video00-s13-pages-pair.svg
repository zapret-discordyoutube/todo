<g><text class="cap" x="24" y="24">профиль это страница: заголовок задаёт условия профиля</text></g>
<g class="a e1"><rect class="bxb" x="24" y="36" width="252" height="26" rx="13.0"/><text class="sm c" x="150" y="54">выдуманный пример: тетрадь</text></g>
