<g class="a e4"><rect class="bx" x="40" y="140" width="368" height="46" rx="5"/><text class="sm tk" x="54" y="160">заголовок 2</text><text class="sm mu" x="54" y="178">инструкция</text></g>
<g class="a e5"><rect class="bx" x="40" y="194" width="368" height="46" rx="5"/><text class="sm tk" x="54" y="214">заголовок 3</text><text class="sm mu" x="54" y="232">инструкция</text></g>
<g class="a e6"><circle class="bxr" cx="380" cy="109" r="11"/><path class="lr" d="M376 105L384 113M384 105L376 113" style="stroke-linecap:round;stroke-width:2"/></g>
<g class="a e7"><rect class="bxn" x="40" y="140" width="368" height="46" rx="5"/><circle class="bxo" cx="380" cy="163" r="11"/><path class="lo" d="M375 163L378.5 167L385 159" style="stroke-linecap:round;stroke-linejoin:round"/></g>
<g class="a e8"><rect class="fs" x="41" y="195" width="366" height="44" rx="4"/></g>
<g class="a e9"><text class="sm tk" x="24" y="300">берём первую подходящую страницу,</text><text class="sm tk" x="24" y="322">остальные не читаем</text></g>
<g class="a e10"><rect class="bxa" x="452" y="40" width="236" height="30" rx="15"/><text class="sm tk c" x="570" y="60">транспорт и порт</text></g>
<g class="a e11"><rect class="bxa" x="700" y="40" width="236" height="30" rx="15"/><text class="sm tk c" x="818" y="60">протокол потока</text></g>
<g class="a e12"><rect class="bxa" x="452" y="76" width="236" height="30" rx="15"/><text class="sm tk c" x="570" y="96">список имён</text></g>
<g class="a e13"><rect class="bxa" x="700" y="76" width="236" height="30" rx="15"/><text class="sm tk c" x="818" y="96">список адресов</text></g>
<g class="a e14"><text class="sm tk" x="452" y="128">в файле настроек из коробки три страницы</text></g>
<g class="a e15"><rect class="bx" x="452" y="135" width="484" height="46" rx="6"/><text class="mk" x="466" y="164">HTTP</text><text class="sm" x="582" y="164">TCP, порт 80, протокол http</text></g>
<g class="a e16"><rect class="bx" x="452" y="189" width="484" height="46" rx="6"/><text class="mk" x="466" y="218">TLS</text><text class="sm" x="582" y="218">TCP, порт 443, протокол tls</text></g>
<g class="a e17"><rect class="bx" x="452" y="243" width="484" height="46" rx="6"/><text class="mk" x="466" y="272">QUIC</text><text class="sm" x="582" y="272">UDP, порт 443, протокол quic</text></g>
<g class="a e18"><rect class="dk" x="452" y="297" width="484" height="46" rx="6"/><text class="mk inv ns" x="466" y="326">no_action</text><text class="sm inv" x="582" y="326">пустая, последняя: ничего не делать</text></g>
<g class="a e19"><text class="sm tk" x="24" y="372">мы уже видели это в лаборатории: стратегия одна, различается только список</text></g>
<g class="a e20"><rect class="bxa" x="786" y="353" width="157" height="26" rx="13.0"/><text class="sm tk c" x="864.5" y="371">В НАШЕМ ТЕСТЕ</text></g>
