<svg xmlns="http://www.w3.org/2000/svg" class="v00-s13-pages-pair" viewBox="0 0 960 598" width="960" height="598" role="img" aria-labelledby="v00-s13-pages-pair-t v00-s13-pages-pair-d">
<title id="v00-s13-pages-pair-t">Профиль как страница и пара опытов</title>
<desc id="v00-s13-pages-pair-d">Профиль это страница тетради с заголовком из условий профиля: транспорт и порт, протокол потока, список имён и список адресов, программа идёт сверху вниз и берёт первую подходящую страницу, в файле настроек из коробки таких страниц три для HTTP, TLS и QUIC, а последняя пустая no_action ничего не делает; в нашем тесте при одной и той же стратегии сервер получил два куска по 104 и 146 байт, когда имя сайта было в списке, и все 250 байт одним куском, когда его там не было.</desc>
