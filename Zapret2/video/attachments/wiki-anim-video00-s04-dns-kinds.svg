<svg xmlns="http://www.w3.org/2000/svg" class="v00-s04-dns-kinds" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="v00-s04-dns-kinds-t v00-s04-dns-kinds-d">
<title id="v00-s04-dns-kinds-t">Что бывает с обычным DNS</title>
<desc id="v00-s04-dns-kinds-d">Обычный DNS идёт открытым текстом, и по дороге ответ могут подменить: назвать неверный адрес, сказать, что такого имени нет, или, по описанным на вики наблюдениям, отправить запрос другому справочнику, а zapret2 меняет только начало вашего соединения, которого здесь ещё нет, поэтому ложный ответ он не исправит.</desc>
