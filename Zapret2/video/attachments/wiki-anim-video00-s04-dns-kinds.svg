<rect class="bg" x="0" y="0" width="960" height="430"/>
<g class="a e1"><text class="cap" x="40" y="26">первый случай: DNS</text><rect class="bxb" x="699.5" y="8" width="220.5" height="24" rx="5"/><text class="cap amb" x="709.5" y="24.5">ПО ОБЩИМ СВЕДЕНИЯМ</text></g>
<g class="a e2"><rect class="bx" x="40" y="44" width="180" height="60" rx="8"/><text class="tk sm c" x="130" y="70">браузер</text><text class="sm mu c" x="130" y="90">спрашивает адрес</text></g>
<g class="a e3"><path class="lf" d="M226 74L296 74"/><polygon class="hf" points="306,74 296,79 296,69"/></g>
<g class="a e4"><rect class="bxa" x="316" y="44" width="220" height="60" rx="8"/><text class="tk sm c" x="426" y="70">справочник DNS</text><text class="sm c" x="426" y="90">по имени называет адрес</text></g>
<g class="a e5"><text class="sm tk" x="560" y="68">вопрос и ответ идут открытым текстом:</text><text class="sm" x="560" y="90">по дороге ответ можно подменить</text></g>
<g class="a e6"><text class="cap" x="40" y="146">что может прийти вместо честного ответа</text></g>
<g class="a e7"><rect class="bxr" x="40" y="158" width="280" height="84" rx="8"/><text class="tk sm rej" x="54" y="184">неверный адрес</text><text class="sm" x="54" y="208">ведёт на страницу-заглушку</text><text class="sm mu" x="54" y="228">вы пришли не туда</text></g>
<g class="a e8"><rect class="bxr" x="340" y="158" width="280" height="84" rx="8"/><text class="tk sm rej" x="354" y="184">«такого имени нет»</text><text class="sm" x="354" y="208">сайт будто не существует</text><text class="sm mu" x="354" y="228">имя есть, но ответ ложный</text></g>
<g class="a e9"><rect class="bxd" x="640" y="158" width="280" height="84" rx="8"/><text class="tk sm rej" x="654" y="184">запрос ушёл к другому</text><text class="tk sm rej" x="654" y="204">справочнику</text><text class="sm" x="654" y="228">он отвечает «такого имени нет»</text></g>
<g class="a e10"><rect class="bxb" x="640" y="252" width="280" height="50" rx="8"/><text class="sm tk" x="654" y="274">на вики описаны наблюдения</text><text class="sm" x="654" y="293">это не официальные сведения</text></g>
<g class="a e11"><rect class="bxa" x="40" y="322" width="880" height="64" rx="10"/><text class="tk sm c" x="480" y="350">zapret2 меняет начало вашего соединения с сайтом</text><text class="sm c" x="480" y="372">а здесь соединения ещё нет: ложный ответ приходит из сети</text></g>
<g class="a e12"><text class="sm mu" x="40" y="414">схема: настоящие адреса и имена не показаны</text></g>
