<svg xmlns="http://www.w3.org/2000/svg" class="v07-s18-three-flag-runs" viewBox="0 0 960 606" width="960" height="606" role="img" aria-labelledby="v07-s18-three-flag-runs-t v07-s18-three-flag-runs-d">
<title id="v07-s18-three-flag-runs-t">Три опыта со снятием флагов</title>
<desc id="v07-s18-three-flag-runs-d">Три опыта со снятием флагов у подделки в 680 байт: без ACK остаётся один PSH, подделка видна во всех четырёх точках записи, получатель выбрасывает её молча, счётчики не двигаются и сервер получает чистые 250 байт, без PSH остаётся один ACK и сервер принимает 680 чужих байт, поэтому PSH условием не является, а без ACK и без PSH флагов нет совсем и подделку тоже выбрасывают молча.</desc>
<style>.v07-s18-three-flag-runs{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
