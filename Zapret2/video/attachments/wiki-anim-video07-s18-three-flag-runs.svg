<rect class="bg" x="0" y="0" width="960" height="606"/>
<g><text class="cap" x="40" y="26">что делает получатель с подделкой без ACK, без PSH и без обоих флагов</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="880" height="160" rx="8"/><text class="mk" x="54" y="70">tcp_flags_unset=ack</text><text class="sm" x="54" y="92">24 - 16 = 8: остался PSH</text><rect class="bx" x="54" y="104" width="40" height="30" rx="4"/><text class="mk c" x="74" y="125">0</text><rect class="bxa" x="97" y="104" width="40" height="30" rx="4"/><text class="mk c" x="117" y="125">1</text><rect class="bx" x="140" y="104" width="40" height="30" rx="4"/><text class="mk c" x="160" y="125">0</text><rect class="bx" x="183" y="104" width="40" height="30" rx="4"/><text class="mk c" x="203" y="125">0</text><rect class="bx" x="226" y="104" width="40" height="30" rx="4"/><text class="mk c" x="246" y="125">0</text></g>
<g class="a e2"><text class="sm" x="330" y="70">видна в четырёх точках записи:</text><rect class="bxs" x="330" y="82" width="62" height="52" rx="6"/><text class="mk c" x="361" y="100">P</text><text class="ix c" x="361" y="124">клиент</text><rect class="bxs" x="396" y="82" width="62" height="52" rx="6"/><text class="mk c" x="427" y="100">P</text><text class="ix c" x="427" y="124">вход</text><rect class="bxs" x="462" y="82" width="62" height="52" rx="6"/><text class="mk c" x="493" y="100">P</text><text class="ix c" x="493" y="124">выход</text><rect class="bxs" x="528" y="82" width="62" height="52" rx="6"/><text class="mk c" x="559" y="100">P</text><text class="ix c" x="559" y="124">сервер</text><text class="ix" x="330" y="156">вход и выход: две точки у роутера</text></g>
<g class="a e3"><rect class="bxo" x="604" y="56" width="304" height="136" rx="6"/><text class="tk sm" x="616" y="82">выброшена молча</text><text class="sm" x="616" y="106">счётчики не двигались, ответа нет</text><text class="sm" x="616" y="130">сервер: 250 байт, чисто</text><text class="sm" x="616" y="154">клиент получил ответ</text><text class="sm" x="616" y="178">игрушка: РАЗРЕШЕНО, не смотрит</text></g>
<g class="a e4"><rect class="bx" x="40" y="216" width="880" height="160" rx="8"/><text class="mk" x="54" y="242">tcp_flags_unset=psh</text><text class="sm" x="54" y="264">24 - 8 = 16: остался ACK</text><rect class="bxa" x="54" y="276" width="40" height="30" rx="4"/><text class="mk c" x="74" y="297">1</text><rect class="bx" x="97" y="276" width="40" height="30" rx="4"/><text class="mk c" x="117" y="297">0</text><rect class="bx" x="140" y="276" width="40" height="30" rx="4"/><text class="mk c" x="160" y="297">0</text><rect class="bx" x="183" y="276" width="40" height="30" rx="4"/><text class="mk c" x="203" y="297">0</text><rect class="bx" x="226" y="276" width="40" height="30" rx="4"/><text class="mk c" x="246" y="297">0</text></g>
<g class="a e5"><text class="sm" x="330" y="242">видна в четырёх точках записи:</text><rect class="bxs" x="330" y="254" width="62" height="52" rx="6"/><text class="mk c" x="361" y="272">A</text><text class="ix c" x="361" y="296">клиент</text><rect class="bxs" x="396" y="254" width="62" height="52" rx="6"/><text class="mk c" x="427" y="272">A</text><text class="ix c" x="427" y="296">вход</text><rect class="bxs" x="462" y="254" width="62" height="52" rx="6"/><text class="mk c" x="493" y="272">A</text><text class="ix c" x="493" y="296">выход</text><rect class="bxs" x="528" y="254" width="62" height="52" rx="6"/><text class="mk c" x="559" y="272">A</text><text class="ix c" x="559" y="296">сервер</text><text class="ix" x="330" y="328">вход и выход: две точки у роутера</text></g>
<g class="a e6"><rect class="bxr" x="604" y="228" width="304" height="136" rx="6"/><text class="tk sm" x="616" y="254">принята</text><text class="sm" x="616" y="278">сервер получил 680 чужих байт</text><text class="sm" x="616" y="302">клиент завис</text><text class="sm" x="616" y="326">пакет с данными без PSH обычный,</text><text class="sm" x="616" y="350">PSH лишь просит передать быстрее</text></g>
<g class="a e7"><rect class="bx" x="40" y="388" width="880" height="160" rx="8"/><text class="mk" x="54" y="414">tcp_flags_unset=ack,psh</text><text class="sm" x="54" y="436">24 - 24 = 0: флагов нет совсем</text><rect class="bx" x="54" y="448" width="40" height="30" rx="4"/><text class="mk c" x="74" y="469">0</text><rect class="bx" x="97" y="448" width="40" height="30" rx="4"/><text class="mk c" x="117" y="469">0</text><rect class="bx" x="140" y="448" width="40" height="30" rx="4"/><text class="mk c" x="160" y="469">0</text><rect class="bx" x="183" y="448" width="40" height="30" rx="4"/><text class="mk c" x="203" y="469">0</text><rect class="bx" x="226" y="448" width="40" height="30" rx="4"/><text class="mk c" x="246" y="469">0</text></g>
<g class="a e8"><text class="sm" x="330" y="414">видна в четырёх точках записи:</text><rect class="bxs" x="330" y="426" width="62" height="52" rx="6"/><text class="mk c" x="361" y="444">пусто</text><text class="ix c" x="361" y="468">клиент</text><rect class="bxs" x="396" y="426" width="62" height="52" rx="6"/><text class="mk c" x="427" y="444">пусто</text><text class="ix c" x="427" y="468">вход</text><rect class="bxs" x="462" y="426" width="62" height="52" rx="6"/><text class="mk c" x="493" y="444">пусто</text><text class="ix c" x="493" y="468">выход</text><rect class="bxs" x="528" y="426" width="62" height="52" rx="6"/><text class="mk c" x="559" y="444">пусто</text><text class="ix c" x="559" y="468">сервер</text><text class="ix" x="330" y="500">вход и выход: две точки у роутера</text></g>
<g class="a e9"><rect class="bxo" x="604" y="400" width="304" height="136" rx="6"/><text class="tk sm" x="616" y="426">выброшена молча, как без ACK</text><text class="sm" x="616" y="450">сервер: 250 байт, чисто</text><text class="sm" x="616" y="474">счётчики не двигались</text><text class="sm" x="616" y="498">пакет без флагов выбросили тоже</text></g>
<g class="a e10"><text class="sm mu" x="40" y="568">по общим сведениям, пакет без ACK в установленном соединении ядро отбрасывает без ответа;</text><text class="sm mu" x="40" y="590">мы видели только молчание счётчиков; проверено на нашем получателе и нашей модели</text></g>
</svg>
