<rect class="bg" x="0" y="0" width="960" height="566"/>
<g><text class="cap" x="24" y="24">карта возможностей: три вопроса при сборке команды</text></g>
<g class="a e1"><rect class="bxs" x="24" y="38" width="187" height="26" rx="13.0"/><text class="sm tk c" x="117.5" y="56">восемь групп опций</text></g>
<g class="a e2"><rect class="bxs" x="221" y="38" width="401" height="26" rx="13.0"/><text class="sm tk c" x="421.5" y="56">три класса: глобальные, профильные, ручки</text></g>
<g class="a e3"><rect class="bxa" x="24" y="84" width="280" height="104" rx="10"/><text class="big tk fg" x="40" y="112">1. что взять</text><text class="sm" x="40" y="140">профиль,</text><text class="sm" x="40" y="160">условия профиля,</text><text class="sm" x="40" y="180">диапазоны</text></g>
<g class="a e4"><rect class="bxo" x="340" y="84" width="280" height="104" rx="10"/><text class="big tk fg" x="356" y="112">2. что сделать</text><text class="sm" x="356" y="140">вызов стратегии</text><text class="sm" x="356" y="160">с аргументами</text></g>
<g class="a e5"><rect class="bxb" x="656" y="84" width="280" height="104" rx="10"/><text class="big tk fg" x="672" y="112">3. где</text><text class="sm" x="672" y="140">метки,</text><text class="sm" x="672" y="160">а не числа</text></g>
<g class="a e6"><path class="lf" d="M306 136L326.0 136.0"/><polygon class="hf" points="336,136 326.0,141.0 326.0,131.0"/></g>
<g class="a e7"><path class="lf" d="M622 136L642.0 136.0"/><polygon class="hf" points="652,136 642.0,141.0 642.0,131.0"/></g>
<g class="a e8"><text class="sm tk" x="24" y="224">так устроена строка из коробки для TLS:</text></g>
<g class="a e9"><rect class="bxa" x="24" y="238" width="476" height="26" rx="5"/><text class="lgk" x="31" y="256">--filter-tcp=443 --filter-l7=tls --payload=tls_client_hello</text><text class="sm tk c" x="262" y="286">что взять</text></g>
<g class="a e10"><rect class="bxo" x="506" y="238" width="218" height="26" rx="5"/><text class="lgk" x="513" y="256">--lua-desync=multidisorder</text><text class="sm tk c" x="615" y="286">что сделать</text></g>
<g class="a e11"><rect class="bxb" x="726" y="238" width="116" height="26" rx="5"/><text class="lgk" x="733" y="256">:pos=1,midsld</text><text class="sm tk c" x="784" y="286">где</text></g>
<g class="a e12"><text class="sm tk" x="24" y="332">метки встречаются часто: девять из двадцати пяти стратегий работают с позициями</text></g>
