<svg xmlns="http://www.w3.org/2000/svg" class="v00-s15-capability-map" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="v00-s15-capability-map-t v00-s15-capability-map-d">
<title id="v00-s15-capability-map-t">Три вопроса при сборке команды</title>
<desc id="v00-s15-capability-map-d">Чтобы собрать команду, нужно ответить на три вопроса: что взять, для этого профиль, условия профиля и диапазоны, что сделать, для этого вызов стратегии с аргументами, и где, для этого метки, а не числа; девять из двадцати пяти стратегий работают с позициями, из коробки стоят method плюс 2 для HTTP и 1 и midsld для TLS, а blockcheck2 сам перебирает несколько вариантов позиций для каждого сайта.</desc>
<style>.v00-s15-capability-map{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
