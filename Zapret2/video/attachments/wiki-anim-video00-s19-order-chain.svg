<title id="v00-s19-order-chain-t">Порядок блоков курса</title>
<desc id="v00-s19-order-chain-d">Курс идёт сначала основы, затем язык командной строки, затем приёмы, затем проверка своими руками, и всё это про то, как менять начало соединения, а инструменты и устройство программы изнутри стоят после них.</desc>
