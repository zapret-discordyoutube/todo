<svg xmlns="http://www.w3.org/2000/svg" class="v05-s11-chain-links" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="v05-s11-chain-links-t v05-s11-chain-links-d">
<title id="v05-s11-chain-links-t">Цепочка до частей</title>
<desc id="v05-s11-chain-links-d">Цепочка от строки pos до цикла по частям: строка (по умолчанию 2) идёт в функцию на Си resolve_multi_pos, она переводит метки в числа с нуля, по возрастанию и без повторов, каждое число получает плюс один, delete_pos_1 выбрасывает только Lua-позицию 1, и цикл режет данные на части, на одну больше, чем разрезов; на примере midsld получается 104, затем {105}, затем части 104 и 146; если разрезов не осталось, в журнал пишется no valid split positions и пакет идёт как был; в памяти программы к этому моменту лежат только данные в 250 байт и список позиций, а готовых частей ещё нет, потому что цикл вырезает их по одной и сразу отправляет, пока исходный пакет ждёт вердикта.</desc>
