<svg xmlns="http://www.w3.org/2000/svg" class="v06-s07-nodrop-wire" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="v06-s07-nodrop-wire-t v06-s07-nodrop-wire-d">
<title id="v06-s07-nodrop-wire-t">nodrop: три пакета и дубликат</title>
<desc id="v06-s07-nodrop-wire-d">Опыт с nodrop на нашем приветствии в 250 байт: на проводе клиента три пакета, часть 105-250 в 146 байт с IP id 35120, часть 1-104 в 104 байта с IP id 35121 и оригинал 1-250 в 250 байт, у которого IP id такой же, как у первого куска (lua/zapret-lib.lua:1098-1099), сервер отвечает ACK 1 с блоком с 105 по 250, потом ACK 251 и на оригинал снова ACK 251 с блоком с 1 по 250 ниже подтверждения, то есть дублирующим SACK, потому что все 250 байт пришли дважды; по общим сведениям (RFC 2883) такой блок бывает двух видов, ниже подтверждения или внутри другого блока того же ответа, а цена nodrop это лишний пакет и отчёт о нём; порядок отправки у multisplit часть 1, часть 2, оригинал, а у multidisorder часть 2, часть 1, оригинал, и на бумаге для пяти кусков с nodrop выйдет шесть пакетов с данными, опыта с этим нет, а приложение в нашем тесте получило 250 байт один раз.</desc>
