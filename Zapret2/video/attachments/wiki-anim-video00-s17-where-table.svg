<svg xmlns="http://www.w3.org/2000/svg" class="v00-s17-where-table" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v00-s17-where-table-t v00-s17-where-table-d">
<title id="v00-s17-where-table-t">Где лежат приёмы и в каком выпуске</title>
<desc id="v00-s17-where-table-d">Все приёмы это функции на Lua, которые вызывают по имени, и таблица показывает, где что лежит: резать, перемешать и подделывать, а затем пары, фокусы рукопожатия, другие слои, ротация и обфускация лежат в файлах библиотеки стратегий, автоматики и обфускации, у каждой семьи есть свой выпуск, а у служебных drop и send отдельного выпуска нет; три семьи из выпуска Письмо в сортировочном центре это упрощённое начало.</desc>
