<g><text class="cap" x="24" y="24">все приёмы: семья, стратегии, файл Lua, выпуск курса</text></g>
<g class="a e1"><text class="sm tk mu" x="34" y="56">семья</text><text class="sm tk mu" x="190" y="56">стратегии</text><text class="sm tk mu" x="558" y="56">файл Lua</text><text class="sm tk mu" x="738" y="56">выпуск</text></g>
<g class="a e2"><rect class="bx" x="24" y="66" width="912" height="50" rx="6"/><rect class="bxa" x="30" y="71" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="96">резать</text><text class="lg fg" x="188" y="97">multisplit, tcpseg</text><text class="lg" x="556" y="97">zapret-antidpi.lua</text><text class="sm tk" x="736" y="89">multisplit:</text><text class="sm tk" x="736" y="107">резать на части</text></g>
<g class="a e3"><rect class="bx" x="24" y="122" width="912" height="50" rx="6"/><rect class="bxa" x="30" y="127" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="152">перемешать</text><text class="lg fg" x="188" y="145">multidisorder,</text><text class="lg fg" x="188" y="163">multidisorder_legacy</text><text class="lg" x="556" y="153">zapret-antidpi.lua</text><text class="sm tk" x="736" y="145">Перемешать:</text><text class="sm tk" x="736" y="163">disorder</text></g>
<g class="a e4"><rect class="bx" x="24" y="178" width="912" height="50" rx="6"/><rect class="bxa" x="30" y="183" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="208">подделывать</text><text class="lg fg" x="188" y="209">fake</text><text class="lg" x="556" y="209">zapret-antidpi.lua</text><text class="sm tk" x="736" y="201">Фейк и его</text><text class="sm tk" x="736" y="219">условия</text></g>
<g class="a e5"><rect class="bx" x="24" y="234" width="912" height="50" rx="6"/><rect class="bxs" x="30" y="239" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="264">пары</text><text class="lg fg" x="188" y="257">fakedsplit, fakeddisorder,</text><text class="lg fg" x="188" y="275">hostfakesplit</text><text class="lg" x="556" y="265">zapret-antidpi.lua</text><text class="sm tk" x="736" y="257">Резать и подделывать</text><text class="sm tk" x="736" y="275">вместе</text></g>
<g class="a e6"><rect class="bx" x="24" y="290" width="912" height="50" rx="6"/><rect class="bxs" x="30" y="295" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="313">фокусы</text><text class="sm tk" x="38" y="331">рукопожатия</text><text class="lg fg" x="188" y="313">syndata, rst, synack, synack_split,</text><text class="lg fg" x="188" y="331">oob, wsize, wssize</text><text class="lg" x="556" y="321">zapret-antidpi.lua</text><text class="sm tk" x="736" y="313">Фокусы</text><text class="sm tk" x="736" y="331">рукопожатия</text></g>
<g class="a e7"><rect class="bx" x="24" y="346" width="912" height="50" rx="6"/><rect class="bxs" x="30" y="351" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="376">другие слои</text><text class="lg fg" x="188" y="369">http_domcase, udplen, dht_dn, pktmod</text><text class="sm" x="188" y="387">и заголовки IPv6, фрагменты IP</text><text class="lg" x="556" y="377">zapret-antidpi.lua</text><text class="sm tk" x="736" y="377">Другие слои</text></g>
<g class="a e8"><rect class="bx" x="24" y="402" width="912" height="50" rx="6"/><rect class="bxo" x="30" y="407" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="432">ротация</text><text class="lg fg" x="188" y="433">circular, condition, stopif, repeater</text><text class="lg" x="556" y="433">zapret-auto.lua</text><text class="sm tk" x="736" y="425">про автоматическую</text><text class="sm tk" x="736" y="443">смену стратегий</text></g>
<g class="a e9"><rect class="bx" x="24" y="458" width="912" height="50" rx="6"/><rect class="bxo" x="30" y="463" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="488">обфускация</text><text class="lg fg" x="188" y="489">wgobfs, ippxor, udp2icmp, synhide</text><text class="lg" x="556" y="489">zapret-obfs.lua</text><text class="sm tk" x="736" y="489">про обфускацию</text></g>
<g class="a e10"><rect class="gr" x="24" y="514" width="912" height="50" rx="6"/><rect class="bxg" x="30" y="519" width="144" height="40" rx="5"/><text class="sm tk" x="38" y="544">служебные</text><text class="lg fg" x="188" y="545">drop, send</text><text class="lg" x="556" y="545">zapret-antidpi.lua</text><text class="sm mu" x="736" y="545">отдельного выпуска нет</text></g>
<g class="a e11"><text class="sm tk" x="24" y="592">двадцать пять стратегий это функции на Lua в одной библиотеке стратегий, любую вызывают по имени</text></g>
<g class="a e12"><text class="sm" x="24" y="616">три семьи из «Письмо в сортировочном центре» это упрощённое начало: вверху три главные, ниже остальные</text></g>
