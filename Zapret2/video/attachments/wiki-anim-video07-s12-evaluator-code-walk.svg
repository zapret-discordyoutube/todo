.v07-s12-evaluator-code-walk .fa{fill:var(--tint);stroke:none}.v07-s12-evaluator-code-walk .fr{fill:var(--rejt);stroke:none}.v07-s12-evaluator-code-walk .fb{fill:var(--ambt);stroke:none}.v07-s12-evaluator-code-walk .fo{fill:var(--okt);stroke:none}
.v07-s12-evaluator-code-walk .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
