0}3.75%{opacity:1}96.0%{opacity:1}99.0%{opacity:0}100%{opacity:0}}.v07-s12-evaluator-code-walk .e10{animation-name:v07-s12-evaluator-code-walk-k10}@keyframes v07-s12-evaluator-code-walk-k11{0%{opacity:0}60.0%{opacity:0}61.25%{opacity:1}96.0%{opacity:1}99.0%{opacity:0}100%{opacity:0}}.v07-s12-evaluator-code-walk .e11{animation-name:v07-s12-evaluator-code-walk-k11}@keyframes v07-s12-evaluator-code-walk-k12{0%{opacity:0}65.0%{opacity:0}66.25%{opacity:1}96.0%{opacity:1}99.0%{opacity:0}100%{opacity:0}}.v07-s12-evaluator-code-walk .e12{animation-name:v07-s12-evaluator-code-walk-k12}@keyframes v07-s12-evaluator-code-walk-k13{0%{opacity:0}70.0%{opacity:0}71.25%{opacity:1}96.0%{opacity:1}99.0%{opacity:0}100%{opacity:0}}.v07-s12-evaluator-code-walk .e13{animation-name:v07-s12-evaluator-code-walk-k13}@keyframes v07-s12-evaluator-code-walk-k14{0%{opacity:0}80.0%{opacity:0}81.25%{opacity:1}96.0%{opacity:1}99.0%{opacity:0}100%{opacity:0}}.v07-s12-evaluator-code-walk .e14{animation-name:v07-s12-evaluator-code-walk-k14}@keyframes v07-s12-evaluator-code-walk-k15{0%{opacity:0}90.0%{opacity:0}91.25%{opacity:1}96.0%{opacity:1}99.0%{opacity:0}100%{opacity:0}}.v07-s12-evaluator-code-walk .e15{animation-name:v07-s12-evaluator-code-walk-k15}</style>
<rect class="bg" x="0" y="0" width="960" height="576"/>
<g><text class="cap" x="10" y="22">Оценщик срока: zapret-lib.lua, строки 886-898</text></g>
<g><rect class="bx" x="10" y="34" width="470" height="346" rx="8"/></g>
<g><text class="cap" x="500" y="22">пример: один роутер, дельта −1, диапазон 1-20</text></g>
<g class="a e1"><rect class="bxa" x="18" y="84" width="454" height="28" rx="5"/><text class="ix ns" x="26" y="104">889</text><text class="cdh ns" x="70" y="104">d = hop_count + attl.delta</text></g>
<g class="a e2"><rect class="bxa" x="500" y="84" width="450" height="34" rx="6"/><text class="sm tk ns" x="512" y="106">переходов 1, поэтому d = 1 + (−1) = 0</text></g>
<g class="a e3"><rect class="bxa" x="18" y="124" width="454" height="106" rx="5"/><text class="ix ns" x="26" y="144">891</text><text class="cdh ns" x="70" y="144">if d&lt;attl.min then fake=attl.min</text><text class="ix ns" x="26" y="170">892</text><text class="cdh ns" x="70" y="170">elseif d&gt;attl.max then fake=attl.max</text><text class="ix ns" x="26" y="196">893</text><text class="cdh ns" x="70" y="196">else fake=d</text><text class="ix ns" x="26" y="222">894</text><text class="cdh ns" x="70" y="222">end</text></g>
<g class="a e4"><rect class="bxa" x="500" y="124" width="450" height="34" rx="6"/><text class="sm tk ns" x="512" y="146">0 ниже нижней границы 1, берём 1</text></g>
<g class="a e5"><rect class="bxr" x="18" y="244" width="454" height="80" rx="5"/><text class="ix ns" x="26" y="264">896</text><text class="cdh ns" x="70" y="264">if attl.delta&lt;0 and fake&gt;=hop_count</text><text class="ix ns" x="26" y="290"></text><text class="cdh ns" x="70" y="290">or attl.delta&gt;=0 and fake&lt;hop_count</text><text class="ix ns" x="26" y="316"></text><text class="cdh ns" x="70" y="316">then return nil end</text></g>
<g class="a e6"><rect class="bxr" x="500" y="244" width="450" height="34" rx="6"/><text class="sm tk ns" x="512" y="266">дельта меньше 0, а 1 ≥ 1: условие верно</text></g>
<g class="a e7"><rect class="bx" x="18" y="336" width="454" height="28" rx="5"/><text class="ix ns" x="26" y="356">897</text><text class="cd ns" x="70" y="356">return fake</text></g>
<g class="a e8"><rect class="bx" x="500" y="336" width="450" height="34" rx="6"/><text class="sm tk ns" x="512" y="358">до этой строки дело не дошло</text></g>
<g class="a e9"><rect class="bxr" x="500" y="282" width="450" height="34" rx="6"/><text class="sm tk ns" x="512" y="304">возвращается nil: подбора нет</text></g>
<g class="a e10"><rect class="bx" x="500" y="44" width="450" height="34" rx="6"/><text class="sm tk ns" x="512" y="66">ответ со сроком 63: переходов 1 (64 − 63)</text></g>
<g class="a e11"><rect class="bxb" x="10" y="398" width="470" height="64" rx="8"/><text class="sm tk ns" x="22" y="422">а: просили короче пути (дельта меньше 0),</text><text class="sm ns" x="22" y="444">а вышло не короче: fake не меньше hop_count</text></g>
<g class="a e12"><rect class="bxb" x="490" y="398" width="460" height="64" rx="8"/><text class="sm tk ns" x="502" y="422">б: просили не короче (дельта не меньше 0),</text><text class="sm ns" x="502" y="444">а вышло короче: fake меньше hop_count</text></g>
<g class="a e13"><text class="sm tk" x="10" y="488">хоть одно верно: функция возвращает nil, то есть «ничего»</text></g>
<g class="a e14"><rect class="bxr" x="10" y="502" width="940" height="40" rx="8"/><text class="sm tk ns" x="24" y="527">опыт: подбор отказал, срок подделки остался 64, она доехала до сервера: 680 Б</text></g>
<g class="a e15"><text class="sm mu" x="10" y="564">в коде строка 885 говорит про 0, но возвращается nil</text></g>
</svg>
