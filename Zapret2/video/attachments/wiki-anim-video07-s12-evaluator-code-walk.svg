<svg xmlns="http://www.w3.org/2000/svg" class="v07-s12-evaluator-code-walk" viewBox="0 0 960 576" width="960" height="576" role="img" aria-labelledby="v07-s12-evaluator-code-walk-t v07-s12-evaluator-code-walk-d">
<title id="v07-s12-evaluator-code-walk-t">Оценщик по строкам</title>
<desc id="v07-s12-evaluator-code-walk-d">Функция autottl_eval из zapret-lib.lua по строкам с разбором ответа на вопрос про один роутер, дельту минус 1 и диапазон от 1 до 20: строка 889 считает d как переходы плюс дельта, то есть 1 минус 1 равно 0, строки 891-894 поднимают результат до нижней границы 1, строка 896 отказывает, если просили короче пути, а вышло не короче, или если просили не короче, а вышло короче, здесь дельта меньше 0 и 1 не меньше 1, поэтому возвращается nil; в опыте срок подделки остался 64, она доехала до сервера, сервер принял 680 байт, клиент ждёт.</desc>
<style>
.v07-s12-evaluator-code-walk{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
