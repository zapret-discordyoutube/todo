.v07-s12-evaluator-code-walk .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v07-s12-evaluator-code-walk .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v07-s12-evaluator-code-walk .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v07-s12-evaluator-code-walk .hf{fill:var(--fg2)}.v07-s12-evaluator-code-walk .ha{fill:var(--acc)}.v07-s12-evaluator-code-walk .hr{fill:var(--rej)}.v07-s12-evaluator-code-walk .hm{fill:var(--mute)}.v07-s12-evaluator-code-walk .hb{fill:var(--amb)}.v07-s12-evaluator-code-walk .ho{fill:var(--ok)}
.v07-s12-evaluator-code-walk .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v07-s12-evaluator-code-walk .dotr{fill:var(--rej);stroke:var(--bg);stroke-width:2}
.v07-s12-evaluator-code-walk .doto{fill:var(--ok);stroke:var(--bg);stroke-width:2}
.v07-s12-evaluator-code-walk .dotb{fill:var(--amb);stroke:var(--bg);stroke-width:2}
.v07-s12-evaluator-code-walk .on{fill:var(--amb);stroke:var(--amb);stroke-width:1.4}
.v07-s12-evaluator-code-walk .off{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v07-s12-evaluator-code-walk .a{animation-duration:40s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v07-s12-evaluator-code-walk .a{animation:none}.v07-s12-evaluator-code-walk .tr{display:none}}
