<svg xmlns="http://www.w3.org/2000/svg" class="v16-s01-three-parts-map" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="v16-s01-three-parts-map-t v16-s01-three-parts-map-d">
<title id="v16-s01-three-parts-map-t">План выпуска из трёх частей</title>
<desc id="v16-s01-three-parts-map-d">План выпуска из трёх частей. Часть 1, общая картина: где в ядре пункт досмотра, правила, выбирающие пакеты, почему выбираются только первые пакеты. Часть 2, сама программа: очередь и главный цикл, приёмщик пакетов, три ответа ядру, один пакет по журналу. Часть 3, обратная сторона: как программа сама отправляет пакеты, защита от возврата по кругу, другие системы, первый пакет соединения. Внизу путь пакета: правило в ядре, очередь, программа, ответ; от программы отдельно идёт отправка своих пакетов в сеть.</desc>
<style>.v16-s01-three-parts-map{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
