<g><text class="cap" x="40" y="26">План выпуска: три части и путь пакета</text></g>
<g class="a e1"><rect class="bxa" x="40" y="46" width="280" height="190" rx="8"/><text class="cap ns" x="56" y="72">ЧАСТЬ 1</text><text class="tk ns" x="56" y="98">Общая картина</text><text class="sm ns" x="56" y="130">· где в ядре пункт досмотра</text><text class="sm ns" x="56" y="155">· правила, выбирающие пакеты</text><text class="sm ns" x="56" y="180">· почему только первые пакеты</text></g>
<g class="a e2"><rect class="bxb" x="340" y="46" width="280" height="190" rx="8"/><text class="cap ns" x="356" y="72">ЧАСТЬ 2</text><text class="tk ns" x="356" y="98">Сама программа</text><text class="sm ns" x="356" y="130">· очередь и главный цикл</text><text class="sm ns" x="356" y="155">· приёмщик пакетов</text><text class="sm ns" x="356" y="180">· три ответа ядру</text><text class="sm ns" x="356" y="205">· один пакет по журналу</text></g>
<g class="a e3"><rect class="bxo" x="640" y="46" width="280" height="190" rx="8"/><text class="cap ns" x="656" y="72">ЧАСТЬ 3</text><text class="tk ns" x="656" y="98">Обратная сторона</text><text class="sm ns" x="656" y="130">· программа сама шлёт пакеты</text><text class="sm ns" x="656" y="155">· защита от возврата по кругу</text><text class="sm ns" x="656" y="180">· другие системы</text><text class="sm ns" x="656" y="205">· первый пакет соединения</text></g>
<g class="a e4"><rect class="pl" x="213" y="56" width="95" height="24" rx="4"/><text class="tk sm c" x="260.5" y="74">вы здесь</text></g>
<g class="a e5"><text class="cap" x="40" y="276">Путь одного пакета</text></g>
