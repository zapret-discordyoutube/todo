<svg xmlns="http://www.w3.org/2000/svg" class="v06-s21-three-traps" viewBox="0 0 960 780" width="960" height="780" role="img" aria-labelledby="v06-s21-three-traps-t v06-s21-three-traps-d">
<title id="v06-s21-three-traps-t">Ловушки 2, 3 и 4 старой функции</title>
<desc id="v06-s21-three-traps-d">Ловушки 2, 3 и 4 старой функции: она не читает параметры blob и nodrop (с blob=nosuchblob старая режет как обычно, 146@104 и 104@0 на маленьком приветствии, а новая пишет в журнал ошибку, что блоб nosuchblob недоступен, и пакет идёт как есть, 250@0; с nodrop старая всё равно выбрасывает оригинал, и на проводе только куски, а новая на большом приветствии отправляет 1380@104 и 104@0 и следом оригиналы 1448@0 и 36@1448); куски берут IP id и флаги у пакета ядра (ядро пронумеровало два своих пакета 57761 и 57762, поэтому у куска в 104 байта и у хвоста в 36 байт один и тот же id 57762, а флаги ACK у первого пакета ядра и PSH с ACK у второго, функция их не меняет); и строки отправки в журнале подписаны словом multidisorder, даже когда работает старая функция, потому что их пишет общий помощник multidisorder_send из строк 558-586 файла zapret-antidpi.lua.</desc>
