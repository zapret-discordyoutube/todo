<g><text class="cap" x="40" y="24">ловушки 2, 3 и 4 старой функции</text></g>
<g class="a e1"><circle class="bxa" cx="54" cy="52" r="13"/><text class="tk c ns" x="54" y="57">2</text><text class="sm tk" x="76" y="58">параметры, которые старая функция не читает</text></g>
<g class="a e2"><text class="cap" x="200" y="92">старая функция</text><text class="cap" x="580" y="92">новая функция</text></g>
<g class="a e3"><text class="mk" x="40" y="124">blob=nosuchblob</text><text class="sm mu" x="40" y="146">приветствие</text><text class="sm mu" x="40" y="164">250 байт</text><rect class="bxo" x="200" y="102" width="360" height="66" rx="6"/><text class="sm tk" x="212" y="126">без ошибки, режет как обычно</text><text class="mk" x="212" y="150">146@104, 104@0</text></g>
<g class="a e4"><rect class="bxr" x="580" y="102" width="340" height="66" rx="6"/><text class="sm tk" x="592" y="124">ошибка в журнале: blob</text><text class="m fg" x="592" y="142">&#x27;nosuchblob&#x27; unavailable</text><text class="sm" x="592" y="160">пакет идёт как есть: 250@0</text></g>
<g class="a e5"><text class="mk" x="40" y="206">nodrop</text><text class="sm mu" x="40" y="228">старая: 250 байт</text><text class="sm mu" x="40" y="246">новая: 1484 байта</text><rect class="bxo" x="200" y="184" width="360" height="76" rx="6"/><text class="sm tk" x="212" y="208">оригинал всё равно выброшен</text><text class="mk" x="212" y="232">146@104, 104@0</text><text class="sm" x="212" y="250">на проводе только куски</text></g>
<g class="a e6"><rect class="bxb" x="580" y="184" width="340" height="76" rx="6"/><text class="sm tk" x="592" y="206">два куска, следом оригиналы</text><text class="m fg" x="592" y="228">1380@104, 104@0, 1448@0, 36@1448</text><text class="sm" x="592" y="248">ответы с дублирующими блоками</text></g>
<g class="a e7"><path class="lm" d="M40 280L920 280"/><circle class="bxa" cx="54" cy="302" r="13"/><text class="tk c ns" x="54" y="307">3</text><text class="sm tk" x="76" y="308">IP id и флаги: куски берут их у пакета ядра</text></g>
<g class="a e8"><text class="cap" x="40" y="338">ядро отдало два пакета</text><rect class="bxs" x="40" y="348" width="250" height="50" rx="6"/><text class="sm tk" x="52" y="370">пакет ядра 1: 1448 байт</text><text class="m fg" x="52" y="390">id 57761, флаг ACK</text></g>
<g class="a e9"><rect class="bxs" x="40" y="418" width="250" height="50" rx="6"/><text class="sm tk" x="52" y="440">пакет ядра 2: 36 байт</text><text class="m fg" x="52" y="460">id 57762, флаги PSH+ACK</text></g>
<g class="a e10"><text class="cap" x="400" y="338">на проводе</text></g>
<g class="a e11"><rect class="bxa" x="400" y="348" width="520" height="34" rx="4"/><text class="mk" x="412" y="371">1344@104</text><text class="mk" x="540" y="371">id 57761</text><text class="mk" x="690" y="371">ACK</text></g>
<g class="a e12"><rect class="bxa" x="400" y="390" width="520" height="34" rx="4"/><text class="mk" x="412" y="413">104@0</text><text class="mk" x="540" y="413">id 57762</text><text class="mk" x="690" y="413">ACK</text></g>
<g class="a e13"><rect class="bxb" x="400" y="432" width="520" height="34" rx="4"/><text class="mk" x="412" y="455">36@1448</text><text class="mk" x="540" y="455">id 57762</text><text class="mk" x="690" y="455">PSH+ACK</text></g>
