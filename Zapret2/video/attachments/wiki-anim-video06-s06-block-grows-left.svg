<g class="a e21 tr"><rect class="bxn" x="578.3" y="262" width="24.6" height="26" rx="3"/></g>
<g class="a e22"><rect class="bxo" x="40" y="532" width="880" height="54" rx="6"/><text class="sm tk" x="52" y="554">четыре ответа «жду первый» с блоком, растущим влево, потом один ACK на весь запрос</text><text class="sm" x="52" y="576">блок [a,b) = байты с a по b−1; всё это измерено на одном получателе, в нашем тесте</text></g>
