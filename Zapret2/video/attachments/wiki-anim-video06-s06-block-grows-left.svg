<svg xmlns="http://www.w3.org/2000/svg" class="v06-s06-block-grows-left" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v06-s06-block-grows-left-t v06-s06-block-grows-left-d">
<title id="v06-s06-block-grows-left-t">Пять частей: блок растёт влево</title>
<desc id="v06-s06-block-grows-left-d">Опыт multidisorder с пятью частями приветствия в 250 байт (метки 2, host, midsld и endhost): сначала выдуманная игрушка, где пачка страниц 113-250 на складе и страницы 105-112 прилипают к ней слева, и это одна пачка, а не две, потом по шагам части на проводе и ответы сервера: 138 байт со 113-го дают ACK 1 и блок с 113 по 250, 8 байт со 105-го дают блок с 105, 7 байт с 98-го дают блок с 98 (место для проверки себя), 95 байт с 3-го дают блок с 3, а последние 2 байта с 1-го закрывают дыру, и приходит ACK 251 без блока; счётчик ждёт байт номер 1 четыре раза и 251 в конце, это один получатель в нашем тесте.</desc>
