<g class="a e6 tr"><text class="sm tk" x="662" y="139">записка на потом:</text><text class="sm" x="662" y="161">для большого приветствия</text></g>
<g class="a e7"><text class="sm tk" x="662" y="165">вердикт: nodrop решает</text><text class="sm" x="662" y="187">выбросить оригинал или нет</text></g>
