<svg xmlns="http://www.w3.org/2000/svg" class="v06-s07-return-verdict" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="v06-s07-return-verdict-t v06-s07-return-verdict-d">
<title id="v06-s07-return-verdict-t">Вердикт пакета ядра и nodrop</title>
<desc id="v06-s07-return-verdict-d">Последние строки multidisorder (lua/zapret-antidpi.lua:625-629): если отправка частей не удалась, функция возвращает PASS (625-627), строка 628 replay_drop_set нужна для большого приветствия и разобрана позже в выпуске, а строка 629 возвращает PASS при nodrop и DROP без него, то есть без nodrop пакет ядра уничтожается и оригинал на провод не выходит, а с nodrop он выпускается и идёт следом за кусками; куски уходят внутри вызова функции, вердикты функций профиля сводятся в один (nfq2/desync.c:1087), поэтому в нашем опыте оригинал оказывается после кусков; внизу выдуманный пример, где письмо ушло отрывками и приехало ещё целиком, кладовщик отвечает, что эти страницы уже были, писарь, раскладывающий по номерам, копию не берёт, а писарь, клеящий в порядке прихода, получает копию в конце, и на кого из них похож настоящий читатель, мы не знаем.</desc>
