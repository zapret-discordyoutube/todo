<g class="a e9"><rect class="bxo" x="490" y="206" width="430" height="78" rx="6"/><text class="sm tk ok" x="504" y="232">с nodrop: штамп PASS</text><text class="sm" x="504" y="256">пакет ядра выпущен,</text><text class="sm" x="504" y="274">оригинал едет следом за кусками</text></g>
