<g class="a e12"><rect class="bx" x="370" y="322" width="304" height="52" rx="5"/><text class="sm tk" x="380" y="344">2 · остальные функции профиля</text></g>
<g class="a e13"><rect class="bxb" x="680" y="322" width="234" height="52" rx="5"/><text class="sm tk" x="690" y="344">3 · вердикт пакету ядра</text><text class="sm" x="690" y="364">уничтожить или выпустить</text></g>
<g class="a e14"><text class="ix mu r" x="920" y="392">вердикты сводятся в один: nfq2/desync.c:1087</text></g>
