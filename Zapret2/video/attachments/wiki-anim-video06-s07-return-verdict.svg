<g class="a e1"><rect class="bx" x="40" y="36" width="600" height="144" rx="6"/><path class="lm" d="M90 42L90 174"/><text class="ix mu r" x="82" y="61">625</text><text class="ix fg" x="100" y="61">if multidisorder_send(desync, data, seqovl, pos)==VERDICT_PASS then</text><text class="ix mu r" x="82" y="87">626</text><text class="ix fg" x="100" y="87">  return VERDICT_PASS</text><text class="ix mu r" x="82" y="113">627</text><text class="ix fg" x="100" y="113">end</text><text class="ix mu r" x="82" y="139">628</text><text class="ix fg" x="100" y="139">replay_drop_set(desync)</text><text class="ix mu r" x="82" y="165">629</text><text class="ix fg" x="100" y="165">return desync.arg.nodrop and VERDICT_PASS or VERDICT_DROP</text></g>
