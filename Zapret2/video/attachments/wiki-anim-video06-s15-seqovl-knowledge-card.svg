<svg xmlns="http://www.w3.org/2000/svg" class="v06-s15-seqovl-knowledge-card" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v06-s15-seqovl-knowledge-card-t v06-s15-seqovl-knowledge-card-d">
<title id="v06-s15-seqovl-knowledge-card-t">Что мы знаем о seqovl</title>
<desc id="v06-s15-seqovl-knowledge-card-d">Что мы знаем об seqovl в multidisorder, пять пунктов: это метка, а не число, и накладок столько, на сколько байт метка отстоит от начала сообщения; накладку получает вторая часть, та, что начинается с первого разреза, метка стоит строго левее разреза, а начало пакета равно разрезу минус метка и не ниже 1; узор по умолчанию из нулей, seqovl_pattern заменяет его блобом или шестнадцатеричной строкой, без блоба и без optional это ошибка, и при нескольких разрезах уже отправленные части остаются на проводе, а за ними идёт оригинал; сервер в нашем тесте на Linux получает настоящие байты и называет перекрытие дублирующим блоком, а про Windows руководство говорит иначе и мы не проверяли; игрушечный читатель «первый записавший побеждает» слеп, если накладка накрывает байты имени, «последний записавший побеждает» видит имя во всех наших опытах, а что из этого похоже на настоящее оборудование, мы не знаем.</desc>
