acity:0;transform:translate(0px,-6px)}44.792%{opacity:0;transform:translate(0px,-6px)}46.458%{opacity:1;transform:translate(0px,0px)}96.458%{opacity:1;transform:translate(0px,0px)}97.708%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v06-s15-seqovl-knowledge-card .e4{animation-name:v06-s15-seqovl-knowledge-card-k4}@keyframes v06-s15-seqovl-knowledge-card-k5{0.0%{opacity:0;transform:translate(0px,-6px)}58.333%{opacity:0;transform:translate(0px,-6px)}60%{opacity:1;transform:translate(0px,0px)}96.458%{opacity:1;transform:translate(0px,0px)}97.708%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v06-s15-seqovl-knowledge-card .e5{animation-name:v06-s15-seqovl-knowledge-card-k5}@keyframes v06-s15-seqovl-knowledge-card-k6{0.0%{opacity:0;transform:translate(0px,-6px)}75%{opacity:0;transform:translate(0px,-6px)}76.667%{opacity:1;transform:translate(0px,0px)}96.458%{opacity:1;transform:translate(0px,0px)}97.708%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v06-s15-seqovl-knowledge-card .e6{animation-name:v06-s15-seqovl-knowledge-card-k6}</style>
<rect class="bg" x="0" y="0" width="960" height="580"/>
<g><text class="cap" x="40" y="26">что мы знаем об seqovl в multidisorder</text></g>
<g class="a e1"><rect class="bxa" x="40" y="44" width="880" height="70" rx="8"/><circle cx="68" cy="72" r="14" class="pl"/><text class="mk c" x="68" y="77">1</text><text class="tk" x="96" y="72">это метка, а не число</text><text class="m r" x="906" y="72">seqovl=host → 97 накладок</text><text class="sm" x="96" y="94">число накладок равно смещению метки от начала сообщения</text></g>
<g class="a e2"><rect class="bxa" x="40" y="126" width="880" height="70" rx="8"/><circle cx="68" cy="154" r="14" class="pl"/><text class="mk c" x="68" y="159">2</text><text class="tk" x="96" y="154">накладку получает вторая часть</text><text class="m r" x="906" y="154">начало = разрез − метка</text><text class="sm" x="96" y="176">та, что начинается с первого разреза; метка строго левее разреза, начало пакета не ниже 1</text></g>
<g class="a e3"><rect class="bxa" x="40" y="208" width="880" height="92" rx="8"/><circle cx="68" cy="236" r="14" class="pl"/><text class="mk c" x="68" y="241">3</text><text class="tk" x="96" y="236">узор: по умолчанию нули</text><text class="m r" x="906" y="236">pattern(pat,1,ovl)</text><text class="sm" x="96" y="258">seqovl_pattern заменяет их блобом или строкой 0x…; без блоба и без optional ошибка,</text><text class="sm" x="96" y="278">при нескольких разрезах отправленные части остаются на проводе, за ними идёт оригинал</text></g>
<g class="a e4"><rect class="bx" x="40" y="312" width="880" height="92" rx="8"/><circle cx="68" cy="340" r="14" class="pl"/><text class="mk c" x="68" y="345">4</text><text class="tk" x="96" y="340">сервер: наш тест, Linux</text><text class="m r" x="906" y="340">dsack [8,105)</text><text class="sm" x="96" y="362">получает настоящие байты, перекрытие называет дублирующим блоком;</text><text class="sm" x="96" y="382">про Windows руководство говорит иначе, мы не проверяли</text></g>
<g class="a e5"><rect class="bx" x="40" y="416" width="880" height="92" rx="8"/><circle cx="68" cy="444" r="14" class="pl"/><text class="mk c" x="68" y="449">5</text><text class="tk" x="96" y="444">игрушечные читатели</text><text class="m r" x="906" y="444">только лаборатория</text><text class="sm" x="96" y="466">«первый» слеп, если накладка накрывает байты имени; «последний» видит имя везде в наших опытах;</text><text class="sm" x="96" y="486">что из этого похоже на настоящее оборудование, мы не знаем</text></g>
<g class="a e6"><rect class="bxr" x="40" y="522" width="880" height="40" rx="8"/><text class="sm tk" x="54" y="547">всё это про лабораторию и наши игрушки; о настоящем оборудовании ничего не утверждаем</text></g>
</svg>
