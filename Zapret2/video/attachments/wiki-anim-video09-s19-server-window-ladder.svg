<svg xmlns="http://www.w3.org/2000/svg" class="v09-s19-server-window-ladder" viewBox="0 0 960 880" width="960" height="880" role="img" aria-labelledby="v09-s19-server-window-ladder-t v09-s19-server-window-ladder-d">
<title id="v09-s19-server-window-ladder-t">Окно в ответе сервера и лесенка клиента</title>
<desc id="v09-s19-server-window-ladder-d">Зажим окна в ответе сервера в нашем тесте правит один пакет, SYN-ACK, на проводе он несёт окно 1 и множитель 6 вместо 65160 и 10, после подтверждения рукопожатия клиент молчит 217 мс и посылает один байт, сервер подтверждает его и клиент сразу отправляет 107 и 72 байта, сервер отвечает 14 байтами и клиент отправляет последние 70 байт с флагом закрытия, то есть 1, 107, 72 и 70 в сумме дают приветствие в 250 байт, нарезанное самим клиентом.</desc>
<style>.v09-s19-server-window-ladder{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
