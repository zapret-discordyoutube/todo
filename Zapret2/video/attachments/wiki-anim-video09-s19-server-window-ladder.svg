<rect class="bg" x="0" y="0" width="960" height="880"/>
<g><text class="cap" x="40" y="22">ложное окно в ответе сервера: кто режет приветствие</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="76" rx="8"/><text class="sm tk" x="54" y="60">игрушка: вход в зал</text><rect class="pl" x="723.9" y="44" width="182.1" height="24" rx="12"/><text class="sm c" x="815" y="61">выдуманный пример</text><text class="sm" x="54" y="82">человек у входа: «сейчас пускаем одного»; один проходит сразу, остальные ждут, пока он вернётся.</text><text class="sm" x="54" y="101">табличку повесили не на ворота, а в объявление сервера: очередь клиента выстраивается сама</text></g>
<g class="a e2"><rect class="bxg" x="40" y="124" width="880" height="40" rx="8"/><text class="sm" x="54" y="149">режим сервера: nfqws2 запускают на самом сервере, флаг server; подробности дальше в выпуске</text></g>
<g class="a e3"><text class="cap" x="40" y="190">строка запуска</text><text class="cap" x="490" y="190">журнал программы на сервере</text></g>
<g class="a e4"><rect class="bx" x="40" y="200" width="430" height="40" rx="8"/><text class="ml" x="54" y="226">--lua-desync=wsize:wsize=1:scale=6</text><rect class="bxa" x="54" y="250" width="59.7" height="26" rx="6"/><text class="mk" x="62" y="268">wsize</text><text class="sm" x="125.7" y="268">зажим окна в ответе сервера</text><rect class="bxa" x="54" y="284" width="77.1" height="26" rx="6"/><text class="mk" x="62" y="302">wsize=1</text><text class="sm" x="143.1" y="302">окно в пакете</text><rect class="bxa" x="54" y="318" width="77.1" height="26" rx="6"/><text class="mk" x="62" y="336">scale=6</text><text class="sm" x="143.1" y="336">множитель, только вниз</text></g>
<g class="a e5"><rect class="bx" x="490" y="200" width="430" height="150" rx="8"/><text class="ix fg" x="504" y="226">LUA: wsize_rewrite: window size 65160 =&gt; 1</text><text class="ix fg" x="504" y="248">LUA: wsize_rewrite: scale factor 10 =&gt; 6</text><text class="ix fg" x="504" y="270">packet: id=2 pass modified. len 60 =&gt; 60</text><text class="ix fg" x="504" y="292">instance cutoff for &#x27;wsize_1_2&#x27; in=1 out=1</text><text class="sm tk" x="504" y="320">правит один пакет, SYN-ACK; на следующем</text><text class="sm tk" x="504" y="340">пакете сервера функция отключается</text></g>
<g class="a e6"><text class="cap" x="40" y="376">провод клиента по порядку, время в мс</text></g>
<g class="a e7"><text class="cap c" x="520" y="394">клиент</text><text class="cap c" x="700" y="394">сервер</text><text class="cap" x="770" y="394">мс</text></g>
<g><path class="lmd" d="M520 400L520 824"/><path class="lmd" d="M700 400L700 824"/></g>
<g class="a e8"><circle class="bxa" cx="56" cy="416" r="11"/><text class="tk c ns" x="56" y="421">1</text><text class="sm tk" x="78" y="421">SYN клиента</text><path class="la" d="M520 416L690.0 419.8"/><polygon class="ha" points="700,420 689.9,424.8 690.1,414.8"/><text class="m fg" x="770" y="421">0,00</text></g>
<g class="a e9"><circle class="bx" cx="56" cy="458" r="11"/><text class="tk c ns" x="56" y="463">2</text><text class="sm tk" x="78" y="463">SYN-ACK сервера: окно 1, множитель 6</text><text class="ix mu" x="78" y="479">настоящие были 65160 и 10</text><path class="lr" d="M700 458L530.0 461.8"/><polygon class="hr" points="520,462 529.9,456.8 530.1,466.8"/><text class="m fg" x="770" y="463">11,04</text></g>
<g class="a e10"><circle class="bxa" cx="56" cy="500" r="11"/><text class="tk c ns" x="56" y="505">3</text><text class="sm tk" x="78" y="505">ACK клиента, рукопожатие закончено</text><path class="la" d="M520 500L690.0 503.8"/><polygon class="ha" points="700,504 689.9,508.8 690.1,498.8"/><text class="m fg" x="770" y="505">11,10</text></g>
<g class="a e11"><rect class="bxd" x="40" y="530" width="880" height="30" rx="6"/><text class="sm tk rej" x="78" y="550">пауза: клиент молчит 217 мс</text><text class="m fg" x="770" y="550">+217,4</text></g>
<g class="a e12"><circle class="bxa" cx="56" cy="578" r="11"/><text class="tk c ns" x="56" y="583">4</text><text class="sm tk" x="78" y="583">PA 1: первый байт приветствия</text><path class="la" d="M520 578L690.0 581.8"/><polygon class="ha" points="700,582 689.9,586.8 690.1,576.8"/><text class="m fg" x="770" y="583">228,51</text></g>
<g class="a e13"><circle class="bx" cx="56" cy="620" r="11"/><text class="tk c ns" x="56" y="625">5</text><text class="sm tk" x="78" y="625">ACK сервера: подтверждено до 2</text><path class="lf" d="M700 620L530.0 623.8"/><polygon class="hf" points="520,624 529.9,618.8 530.1,628.8"/><text class="m fg" x="770" y="625">239,01</text></g>
<g class="a e14"><circle class="bxa" cx="56" cy="662" r="11"/><text class="tk c ns" x="56" y="667">6</text><text class="sm tk" x="78" y="667">PA 107</text><path class="la" d="M520 662L690.0 665.8"/><polygon class="ha" points="700,666 689.9,670.8 690.1,660.8"/><text class="m fg" x="770" y="667">239,04</text></g>
<g class="a e15"><circle class="bxa" cx="56" cy="704" r="11"/><text class="tk c ns" x="56" y="709">7</text><text class="sm tk" x="78" y="709">PA 72</text><path class="la" d="M520 704L690.0 707.8"/><polygon class="ha" points="700,708 689.9,712.8 690.1,702.8"/><text class="m fg" x="770" y="709">239,05</text></g>
<g class="a e16"><circle class="bx" cx="56" cy="746" r="11"/><text class="tk c ns" x="56" y="751">8</text><text class="sm tk" x="78" y="751">PA 14: ответ сервера, 14 байт</text><path class="lf" d="M700 746L530.0 749.8"/><polygon class="hf" points="520,750 529.9,744.8 530.1,754.8"/><text class="m fg" x="770" y="751">239,07</text></g>
<g class="a e17"><circle class="bxa" cx="56" cy="788" r="11"/><text class="tk c ns" x="56" y="793">9</text><text class="sm tk" x="78" y="793">FPA 70: последние 70 с флагом закрытия</text><path class="la" d="M520 788L690.0 791.8"/><polygon class="ha" points="700,792 689.9,796.8 690.1,786.8"/><text class="m fg" x="770" y="793">239,17</text></g>
<g class="a e18"><rect class="bxo" x="40" y="824" width="880" height="40" rx="8"/><text class="sm tk" x="54" y="850">1 + 107 + 72 + 70 = 250: то же приветствие, нарезанное самим клиентом</text></g>
</svg>
