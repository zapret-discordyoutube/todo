<svg xmlns="http://www.w3.org/2000/svg" class="video08-s08-nodrop-repeats-ip-id" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="video08-s08-nodrop-repeats-ip-id-t video08-s08-nodrop-repeats-ip-id-d">
<title id="video08-s08-nodrop-repeats-ip-id-t">Nodrop, repeats, ip id</title>
<desc id="video08-s08-nodrop-repeats-ip-id-d">Три настройки fakedsplit на проводе нашего теста: с nodrop после шести пакетов уходит ещё и оригинал в 250 байт с тем же ip id, что у первого фейка, и сервер отвечает подтверждением 251 с блоком дубля от 1 до 251; с repeats равным 2 каждый фейк идёт дважды, настоящие части по разу, всего десять пакетов, а повтор фейка несёт тот же ip id, поэтому на десять пакетов приходится шесть разных значений подряд; аргумент ip_id со значением zero делает все шесть идентификаторов нулями; ответ на проверку про десять пакетов: шесть разных ip id.</desc>
