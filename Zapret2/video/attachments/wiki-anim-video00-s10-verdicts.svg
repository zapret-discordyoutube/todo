<rect class="bg" x="0" y="0" width="960" height="558"/>
<g><text class="cap" x="24" y="24">ответ вызова одним словом: pass, modify или drop</text></g>
<g class="a e1"><rect class="bxo" x="24" y="40" width="126" height="60" rx="8"/><text class="big tk c ok" x="87" y="78">PASS</text></g>
<g class="a e2"><text class="sm tk" x="168" y="66">пропустить как есть</text><text class="sm" x="168" y="88">стратегия ничего не делает</text></g>
<g class="a e3"><rect class="bx" x="440" y="40" width="496" height="60" rx="8"/><text class="lgl" x="454" y="65">LUA: pass</text><text class="lgc" x="454" y="87">packet: id=4 pass unmodified</text></g>
<g class="a e4"><rect class="bxb" x="24" y="110" width="126" height="60" rx="8"/><text class="big tk c amb" x="87" y="148">MODIFY</text></g>
<g class="a e5"><text class="sm tk" x="168" y="136">пропустить с правкой</text><text class="sm" x="168" y="158">в HTTP-запросе меняется регистр</text></g>
<g class="a e6"><rect class="bx" x="440" y="110" width="496" height="60" rx="8"/><text class="lgl" x="454" y="135">LUA: http_domcase: www.example.com =&gt; WwW.ExAmPlE.CoM</text><text class="lgc" x="454" y="157">packet: id=4 pass modified. len 133 =&gt; 133</text></g>
<g class="a e7"><rect class="bxr" x="24" y="180" width="126" height="60" rx="8"/><text class="big tk c rej" x="87" y="218">DROP</text></g>
<g class="a e8"><text class="sm tk" x="168" y="206">не пропускать, но данные</text><text class="sm" x="168" y="228">не потеряны: часто это замена</text></g>
<g class="a e9"><rect class="bx" x="440" y="180" width="496" height="60" rx="8"/><text class="lgc" x="454" y="205">packet: id=4 drop</text><text class="sm" x="454" y="227">ответы вызовов сводятся в один: побеждает drop</text></g>
<g class="a e10"><text class="sm tk" x="24" y="268">drop не значит «потеряли»: посчитаем</text></g>
<g class="a e11"><rect class="bxa" x="786" y="249" width="157" height="26" rx="13.0"/><text class="sm tk c" x="864.5" y="267">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e12"><text class="sm" x="24" y="298">в очереди программы шесть исходящих пакетов клиента</text></g>
<g class="a e13"><rect class="bx" x="24" y="308" width="58" height="32" rx="5"/><text class="lgk c" x="53" y="329">id 1</text><rect class="bx" x="90" y="308" width="58" height="32" rx="5"/><text class="lgk c" x="119" y="329">id 3</text><rect class="bx" x="156" y="308" width="58" height="32" rx="5"/><text class="lgk c" x="185" y="329">id 4</text><rect class="bx" x="222" y="308" width="58" height="32" rx="5"/><text class="lgk c" x="251" y="329">id 8</text><rect class="bx" x="288" y="308" width="58" height="32" rx="5"/><text class="lgk c" x="317" y="329">id 9</text><rect class="bx" x="354" y="308" width="58" height="32" rx="5"/><text class="lgk c" x="383" y="329">id 11</text></g>
<g class="a e14"><rect class="bxr" x="156" y="308" width="58" height="32" rx="5"/><text class="lgk c rej" x="185" y="329">id 4</text><path class="lr" d="M160 312L210 336"/></g>
<g class="a e15"><text class="sm rej c" x="185" y="360">выброшен</text></g>
<g class="a e16"><text class="sm" x="24" y="392">на проводе от клиента вышло семь</text></g>
<g class="a e17"><rect class="bxg" x="24" y="402" width="58" height="32" rx="5"/><text class="lgk c" x="53" y="423">id 1</text><rect class="bxg" x="90" y="402" width="58" height="32" rx="5"/><text class="lgk c" x="119" y="423">id 3</text><rect class="bxg" x="156" y="402" width="58" height="32" rx="5"/><text class="lgk c" x="185" y="423">id 8</text><rect class="bxg" x="222" y="402" width="58" height="32" rx="5"/><text class="lgk c" x="251" y="423">id 9</text><rect class="bxg" x="288" y="402" width="58" height="32" rx="5"/><text class="lgk c" x="317" y="423">id 11</text></g>
<g class="a e18"><rect class="bxo" x="354" y="402" width="58" height="32" rx="5"/><text class="lgk c" x="383" y="423">104</text></g>
<g class="a e19"><rect class="bxo" x="420" y="402" width="58" height="32" rx="5"/><text class="lgk c" x="449" y="423">146</text></g>
<g class="a e20"><text class="sm ok c" x="416" y="454">новые: 104 и 146 байт</text></g>
<g class="a e21"><text class="big tk" x="560" y="358">6 → 5 + 2 = 7</text><text class="sm" x="560" y="390">шесть в очереди, один выброшен,</text><text class="sm" x="560" y="412">два добавлены, семь на проводе</text></g>
<g class="a e22"><rect class="bx" x="24" y="484" width="448" height="56" rx="8"/><text class="sm" x="40" y="508">правила ядра Linux вместе с меткой не пускают</text><text class="sm" x="40" y="528">свои пакеты обратно в очередь</text></g>
<g class="a e23"><rect class="bxb" x="488" y="484" width="448" height="56" rx="8"/><text class="sm" x="504" y="508">ошибка в Lua: пакет проходит без изменений,</text><text class="sm" x="504" y="528">а уже отправленное остаётся отправленным</text></g>
</svg>
