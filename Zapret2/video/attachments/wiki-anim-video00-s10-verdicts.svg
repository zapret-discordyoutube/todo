<svg xmlns="http://www.w3.org/2000/svg" class="v00-s10-verdicts" viewBox="0 0 960 558" width="960" height="558" role="img" aria-labelledby="v00-s10-verdicts-t v00-s10-verdicts-d">
<title id="v00-s10-verdicts-t">Три вердикта и счёт пакетов</title>
<desc id="v00-s10-verdicts-d">Вызов стратегии отвечает одним из трёх вердиктов: pass пропускает пакет как есть, modify пропускает его с правкой, drop не пропускает, и любой drop побеждает, но данные при этом не теряются; в нашем тесте из шести исходящих пакетов клиента один выброшен, программа сама отправила вместо него два новых в 104 и 146 байт, на проводе вышло семь, а ошибка в Lua оставляет пакет без изменений.</desc>
