<g><text class="cap" x="40" y="26">что делали прошлые выпуски и что делает фейк</text></g>
<g class="a e1"><rect class="bxa" x="520" y="12" width="18" height="14" rx="3"/><text class="sm" x="546" y="24">настоящие байты запроса</text><rect class="bxb" x="790" y="12" width="18" height="14" rx="3"/><text class="sm" x="816" y="24">чужие байты</text></g>
<g class="a e2"><text class="tk sm" x="40" y="62">multisplit: настоящий запрос разрезан на две части</text></g>
<g class="a e3"><rect class="bxa" x="40" y="72" width="93.6" height="34" rx="4"/><text class="mk c" x="86.8" y="94">104</text></g>
<g class="a e4"><rect class="bxa" x="143.6" y="72" width="131.4" height="34" rx="4"/><text class="mk c" x="209.3" y="94">146</text></g>
<g class="a e5"><text class="sm mu" x="305" y="93">всего 250 байт, те же настоящие байты</text></g>
<g class="a e6"><text class="tk sm" x="40" y="138">disorder: те же части в обратном порядке</text></g>
<g class="a e7"><rect class="bxa" x="40" y="148" width="131.4" height="34" rx="4"/><text class="mk c" x="105.7" y="170">146</text><rect class="bxa" x="181.4" y="148" width="93.6" height="34" rx="4"/><text class="mk c" x="228.2" y="170">104</text></g>
<g class="a e8"><text class="sm mu" x="305" y="169">порядок отправки другой, байты те же</text></g>
<g class="a e9"><text class="sm mu" x="40" y="226">Исключение одно: накладка seqovl, лишние нулевые байты перед первой частью.</text></g>
<g class="a e10"><text class="tk sm" x="40" y="262">fake: настоящий пакет не тронут, перед ним встаёт лишний пакет</text></g>
<g class="a e11"><rect class="bxa" x="666" y="272" width="225" height="34" rx="4"/><text class="mk c" x="778.5" y="294">настоящий, 250</text></g>
<g class="a e12"><rect class="bxb" x="40" y="272" width="612" height="34" rx="4"/><text class="mk amb c" x="346" y="294">подделка: 680 байт, имя www.microsoft.com</text></g>
<g class="a e13"><path class="lb" d="M64 310L64 324"/><text class="sm tk" x="48" y="344">лишний пакет рядом с настоящим, внутри чужие байты</text></g>
<g class="a e14"><rect class="bxs" x="40" y="372" width="880" height="54" rx="8"/><text class="tk sm" x="56" y="394">Раньше в сети были настоящие байты запроса. Теперь рядом с ними идут чужие.</text><text class="sm" x="56" y="416">По-английски такой пакет fake, по-русски «фейк». Так же называется и стратегия, которая его отправляет.</text></g>
