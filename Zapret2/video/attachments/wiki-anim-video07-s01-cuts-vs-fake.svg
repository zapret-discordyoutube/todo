<svg xmlns="http://www.w3.org/2000/svg" class="v07-s01-cuts-vs-fake" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="v07-s01-cuts-vs-fake-t v07-s01-cuts-vs-fake-d">
<title id="v07-s01-cuts-vs-fake-t">Резка и перестановка против фейка</title>
<desc id="v07-s01-cuts-vs-fake-d">Три способа обращаться с запросом из 250 байт: multisplit режет его на куски 104 и 146 байт, disorder отправляет те же куски в обратном порядке, и в сети остаются только настоящие байты запроса, а fake оставляет настоящий пакет нетронутым и кладёт перед ним лишний пакет в 680 байт с чужими данными, в нашем тесте с именем www.microsoft.com.</desc>
