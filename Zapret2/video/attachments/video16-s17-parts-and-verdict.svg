<g class="a e1"><text class="tk sm" x="40" y="54">запрос: 250 байт, номера 0-249</text><rect class="bxb" x="40" y="64" width="366.1" height="40" rx="4"/><rect class="bxa" x="406.1" y="64" width="513.9" height="40" rx="4"/><text class="sm c ns" x="223" y="89">байты 0-103</text><text class="sm c ns" x="663" y="89">байты 104-249</text></g>
