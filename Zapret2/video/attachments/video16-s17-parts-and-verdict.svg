<svg xmlns="http://www.w3.org/2000/svg" class="v16-s17-parts-and-verdict" viewBox="0 0 960 676" width="960" height="676" role="img" aria-labelledby="v16-s17-parts-and-verdict-t v16-s17-parts-and-verdict-d">
<title id="v16-s17-parts-and-verdict-t">Две вставки и вердикт</title>
<desc id="v16-s17-parts-and-verdict-d">Две вставки и вердикт для пакета номер четыре, строки журнала 117-121. Запрос в 250 байт разрезан по метке midsld на позиции 104: часть 1 байты 0-103 (len 104, кончается на «…www.exa»), часть 2 байты 104-249 (len 146, начинается с «mple.com»). Каждая часть уходит как готовый пакет: 20 байт IP + 32 байта TCP + данные, size=156 для части 1 (20 + 32 + 104) и size=198 для части 2 (20 + 32 + 146); в журнале badsum=0, ifout=c0, fwmark=40000000 (nfq2/lua.c:3026). Порядок: сначала часть 1, потом часть 2, и только потом вердикт по исходному пакету, он всё это время стоит у окошка. Стратегия multisplit возвращает DROP, если не задан nodrop (lua/zapret-antidpi.lua:527), приёмщик пишет packet id=4 drop и отдаёт ядру NF_DROP (nfqws.c:333-334). Данные не пропали: сервер в нашем тесте получил куски 104 и 146 байт, всего 250, и собрал исходный запрос. Сравнение, опыт t01 со стратегией pass: те же строки до стратегии, потом «LUA: pass» (lua/zapret-lib.lua:43-45) и «pass unmodified» (nfqws.c:337-338), вставок нет, исходный пакет уходит как был. Арифметика без прогона: при метке на 100 и 150 были бы size 152 и 202.</desc>
