<g class="a e15"><text class="tk sm" x="40" y="578">данные не пропали: те же 250 байт ушли двумя частями</text></g>
<g class="a e16"><rect class="bxd" x="40" y="592" width="880" height="66" rx="8"/><text class="sm" x="54" y="616">проверь себя, только арифметика: если бы метка делила запрос на 100 и 150,</text><text class="sm" x="54" y="638">size были бы 20 + 32 + 100 = 152 и 20 + 32 + 150 = 202; такого прогона у нас не было</text></g>
