}42.661%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s20-bad-values-table .e10{animation-name:v05-s20-bad-values-table-k10}@keyframes v05-s20-bad-values-table-k11{0.0%{opacity:0}43.871%{opacity:0}44.597%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s20-bad-values-table .e11{animation-name:v05-s20-bad-values-table-k11}@keyframes v05-s20-bad-values-table-k12{0.0%{opacity:0}45.806%{opacity:0}46.532%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s20-bad-values-table .e12{animation-name:v05-s20-bad-values-table-k12}@keyframes v05-s20-bad-values-table-k13{0.0%{opacity:0}47.742%{opacity:0}48.468%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s20-bad-values-table .e13{animation-name:v05-s20-bad-values-table-k13}@keyframes v05-s20-bad-values-table-k14{0.0%{opacity:0}51.613%{opacity:0}52.339%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s20-bad-values-table .e14{animation-name:v05-s20-bad-values-table-k14}@keyframes v05-s20-bad-values-table-k15{0.0%{opacity:0}58.065%{opacity:0}58.79%{opacity:1}97.258%{opacity:1}98.226%{opacity:0}100%{opacity:0}}.v05-s20-bad-values-table .e15{animation-name:v05-s20-bad-values-table-k15}</style>
<rect class="bg" x="0" y="0" width="960" height="750"/>
<g><text class="cap" x="40" y="24">что будет, если аргумент накладки неверный</text></g>
<g class="a e1"><rect class="bx" x="40" y="34" width="880" height="40" rx="6"/><text class="sm" x="52" y="59">выдуманный пример: в наряде вместо числа слово «много», считать нечем, заготовка уходит целой</text></g>
<g class="a e2"><text class="cap" x="48" y="98">аргумент</text><text class="cap" x="260" y="98">что делает код</text><text class="cap" x="636" y="98">что на проводе</text></g>
<g class="a e3"><rect class="bx" x="40" y="108" width="880" height="54" rx="5"/><rect class="fr" x="40" y="108" width="6" height="54" rx="0"/><text class="ix fg" x="54" y="130">seqovl=abc</text><text class="ix mu" x="54" y="150">или пустое значение</text><text class="sm" x="260" y="130">tonumber вернул пусто, «пусто &gt; 0»:</text><text class="sm mu" x="260" y="150">ошибка Lua (zapret-antidpi.lua:509)</text><text class="sm tk" x="636" y="130">один пакет 1 + 250:</text><text class="sm" x="636" y="150">оригинал целым</text></g>
<g class="a e4"><rect class="bx" x="40" y="166" width="880" height="54" rx="5"/><rect class="fa" x="40" y="166" width="6" height="54" rx="0"/><text class="ix fg" x="54" y="188">seqovl=0</text><text class="ix mu" x="54" y="208">или seqovl=-5</text><text class="sm" x="260" y="188">условие «больше нуля» не выполнено,</text><text class="sm mu" x="260" y="208">накладки нет, ошибки нет</text><text class="sm tk" x="636" y="188">обычный разрез:</text><text class="sm" x="636" y="208">1 + 104, 105 + 146</text></g>
<g class="a e5"><rect class="bx" x="40" y="224" width="880" height="54" rx="5"/><rect class="fa" x="40" y="224" width="6" height="54" rx="0"/><text class="ix fg" x="54" y="246">seqovl=0x10</text><text class="sm" x="260" y="246">шестнадцатеричное число,</text><text class="sm mu" x="260" y="266">Lua читает как 16</text><text class="sm tk" x="636" y="246">−15 + 120</text><text class="sm" x="636" y="266">(16 нулей перед частью)</text></g>
<g class="a e6"><rect class="bx" x="40" y="282" width="880" height="54" rx="5"/><rect class="fr" x="40" y="282" width="6" height="54" rx="0"/><text class="ix fg" x="54" y="304">seqovl_pattern=nosuchblob</text><text class="sm" x="260" y="304">ошибка blob unavailable</text><text class="sm mu" x="260" y="324">(zapret-lib.lua:554)</text><text class="sm tk" x="636" y="304">один пакет 1 + 250:</text><text class="sm" x="636" y="324">оригинал целым</text></g>
<g class="a e7"><rect class="bx" x="40" y="340" width="880" height="54" rx="5"/><rect class="fo" x="40" y="340" width="6" height="54" rx="0"/><text class="ix fg" x="54" y="362">то же, с флагом optional</text><text class="sm" x="260" y="362">строка «using zero pattern»,</text><text class="sm mu" x="260" y="382">узор нулевой, накладка идёт</text><text class="sm tk" x="636" y="362">−4 + 109, 105 + 146</text><text class="sm" x="636" y="382">как обычная накладка</text></g>
<g class="a e8"><rect class="bx" x="40" y="398" width="880" height="54" rx="5"/><rect class="fb" x="40" y="398" width="6" height="54" rx="0"/><text class="ix fg" x="54" y="420">seqovl_pattern=0xABC</text><text class="ix mu" x="54" y="440">или пустое имя узора</text><text class="sm" x="260" y="420">ошибки invalid hex string и empty blob name</text><text class="sm mu" x="260" y="440">zapret-lib.lua:546 и 539</text><text class="sm tk" x="636" y="420">прогон функций:</text><text class="sm" x="636" y="440">пакетов 0, опыта не было</text></g>
<g class="a e9"><text class="cap" x="40" y="476">путь ошибки внутри стратегии: оригинал не трогают</text></g>
<g class="a e10"><rect class="bxr" x="40" y="486" width="208" height="64" rx="6"/><text class="ix fg tk" x="50" y="506">ошибка Lua</text><text class="ix mu" x="50" y="526">в строке 509 или 554</text></g>
<g class="a e11"><rect class="bx" x="264" y="486" width="208" height="64" rx="6"/><text class="ix fg tk" x="274" y="506">nfq2/desync.c:1079-1083</text><text class="ix mu" x="274" y="526">lua_pcall не удался</text><path class="lm" d="M250 518L252.0 518.0"/><polygon class="hm" points="262,518 252.0,523.0 252.0,513.0"/></g>
<g class="a e12"><rect class="bx" x="488" y="486" width="208" height="64" rx="6"/><text class="ix fg tk" x="498" y="506">nfq2/desync.c:1142-1146</text><text class="ix mu" x="498" y="526">«desync ERROR. passing</text><text class="ix mu" x="498" y="542">packet unmodified.»</text><path class="lm" d="M474 518L476.0 518.0"/><polygon class="hm" points="486,518 476.0,523.0 476.0,513.0"/></g>
<g class="a e13"><rect class="bx" x="712" y="486" width="208" height="64" rx="6"/><text class="ix fg tk" x="722" y="506">nfq2/nfqws.c:337</text><text class="ix mu" x="722" y="526">«packet: id=4 pass</text><text class="ix mu" x="722" y="542">unmodified»</text><path class="lm" d="M698 518L700.0 518.0"/><polygon class="hm" points="710,518 700.0,523.0 700.0,513.0"/></g>
<g class="a e14"><text class="sm mu" x="40" y="574">в журнале перед ошибкой стоит «resolved split pos: 104»: метки прочитаны, а накладка сломалась</text></g>
<g class="a e15"><rect class="bxa" x="40" y="590" width="880" height="120" rx="6"/><text class="sm tk" x="52" y="614">общий вывод: неверный аргумент не рвёт соединение, но результат разный</text><text class="sm" x="52" y="636">ноль и минус: молча обычный разрез</text><text class="sm" x="52" y="656">текст, пустое значение, пропавший узор: ошибка Lua, ни накладки, ни разреза; флаг optional спасает узор</text><text class="sm" x="52" y="676">заметно только в журнале и по числу пакетов на проводе</text><text class="sm tk" x="52" y="698">дробное значение: ошибки нет, но поток испорчен (следующая схема)</text></g>
</svg>
