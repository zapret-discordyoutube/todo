<svg xmlns="http://www.w3.org/2000/svg" class="v05-s20-bad-values-table" viewBox="0 0 960 750" width="960" height="750" role="img" aria-labelledby="v05-s20-bad-values-table-t v05-s20-bad-values-table-d">
<title id="v05-s20-bad-values-table-t">Неверные значения накладки</title>
<desc id="v05-s20-bad-values-table-d">Что будет при неверных значениях аргументов накладки на нашем приветствии в 250 байт: seqovl=abc или пустое значение даёт ошибку Lua attempt to compare number with nil, движок пишет desync ERROR passing packet unmodified и оригинал уходит целым одним пакетом 1 и 250; seqovl=0 или seqovl=-5 молча не делают накладку и дают обычный разрез 104 и 146; seqovl=0x10 читается как 16 и даёт номер -15 и длину 120; seqovl_pattern=nosuchblob даёт ошибку blob unavailable (lua/zapret-lib.lua:554) и целый оригинал, а с флагом optional строку using zero pattern, нулевой узор и обычную накладку -4 и 109; нечётная шестнадцатеричная запись 0xABC и пустое имя узора дают ошибки invalid hex string и empty blob name в прогоне функций; общий вывод: ноль и минус дают обычный разрез, а текст, пустое значение и пропавший узор срывают всю стратегию, оригинал уходит целым, и это видно только в журнале и по числу пакетов.</desc>
<style>.v05-s20-bad-values-table{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
