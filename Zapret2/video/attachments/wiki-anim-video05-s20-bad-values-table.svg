.v05-s20-bad-values-table .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v05-s20-bad-values-table .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v05-s20-bad-values-table .lb{fill:none;stroke:var(--amb);stroke-width:2}
