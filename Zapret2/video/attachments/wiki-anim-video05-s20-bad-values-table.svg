.v05-s20-bad-values-table .hf{fill:var(--fg2)}.v05-s20-bad-values-table .ha{fill:var(--acc)}.v05-s20-bad-values-table .hr{fill:var(--rej)}.v05-s20-bad-values-table .hm{fill:var(--mute)}.v05-s20-bad-values-table .hb{fill:var(--amb)}
.v05-s20-bad-values-table .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
