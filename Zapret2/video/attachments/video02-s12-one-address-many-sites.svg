<rect class="bg" x="0" y="0" width="960" height="540"/>
<g class="a e1"><text class="cap" x="10" y="24">один IP-адрес, много сайтов: поэтому клиент называет нужный сайт</text></g>
<g class="a e2"><rect class="bx" x="10" y="52" width="130" height="56" rx="8"/><text class="tk c" x="75" y="76">Клиент</text><text class="sm c mu" x="75" y="96">10.1.0.1</text></g>
<g class="a e3"><rect class="bx" x="340" y="40" width="610" height="200" rx="10"/><text class="tk" x="356" y="66">Один адрес 10.2.0.2, на нём отвечает много сайтов</text><text class="sm mu" x="356" y="86">пример: дом с одним адресом и сотней компаний, не наш сервер</text></g>
<g class="a e4"><rect class="bx" x="356" y="104" width="186" height="34" rx="6"/><text class="m c" x="449" y="127">example.com</text></g>
<g class="a e5"><rect class="bx" x="552" y="104" width="186" height="34" rx="6"/><text class="m c" x="645" y="127">example.org</text></g>
<g class="a e6"><rect class="bx" x="748" y="104" width="186" height="34" rx="6"/><text class="m c" x="841" y="127">example.net</text></g>
<g class="a e7"><rect class="bxb" x="356" y="148" width="186" height="34" rx="6"/><text class="m c tk" x="449" y="171">www.example.com</text></g>
<g class="a e8"><rect class="bx" x="552" y="148" width="186" height="34" rx="6"/><text class="m c" x="645" y="171">mail.example.com</text></g>
<g class="a e9"><rect class="bx" x="748" y="148" width="186" height="34" rx="6"/><text class="m c" x="841" y="171">… и ещё сотни</text></g>
<g class="a e10"><path class="lf" d="M146 80L324.0 80.0"/><polygon class="hf" points="334,80 324.0,85.0 324.0,75.0"/><text class="sm c" x="240" y="70">ClientHello</text></g>
<g class="a e11 tr"><rect class="bxa" x="-12" y="-9" width="24" height="18" rx="3"/></g>
<g class="a e12"><rect class="bxb" x="356" y="192" width="580" height="36" rx="6"/><text class="sm c" x="646" y="215">курьеру нужно сказать, к какой компании: имя сайта</text></g>
<g class="a e13"><text class="cap" x="10" y="270">что лежит в ClientHello</text><text class="sm" x="10" y="292">Поле SNI, «Server Name Indication», «указание имени сервера»: название нужного сайта.</text></g>
<g class="a e14"><rect class="bx" x="10" y="304" width="400" height="40" rx="5"/><text class="sm c mu" x="210" y="329">заголовки и возможности клиента</text><rect class="bxb" x="410" y="304" width="300" height="40" rx="5"/><text class="m c tk" x="560" y="329">SNI: www.example.com</text><rect class="bx" x="710" y="304" width="240" height="40" rx="5"/><text class="sm c mu" x="830" y="329">остальные расширения</text></g>
<g class="a e15"><rect class="bx" x="10" y="366" width="160" height="110" rx="8"/><text class="tk c" x="90" y="390">Наблюдатель</text><path class="pl" d="M40 410Q80 382 120 410Q80 438 40 410Z"/><circle cx="80" cy="410" r="8" class="hf"/><text class="sm c mu" x="90" y="460">на пути</text></g>
<g class="a e16"><path class="lmd" d="M590 366L590 350"/><polygon class="hm" points="590,346 585,356 595,356"/></g>
<g class="a e17"><path class="lf" d="M176 392L212.0 392.0"/><polygon class="hf" points="222,392 212.0,397.0 212.0,387.0"/><rect class="bxr" x="228" y="366" width="722" height="54" rx="8"/><text class="tk" x="242" y="389">Как правило, видит адрес 10.2.0.2 и имя www.example.com</text><text class="sm mu" x="242" y="410">SNI записан открыто: он передаётся до появления ключа</text></g>
<g class="a e18"><path class="lf" d="M176 450L212.0 450.0"/><polygon class="hf" points="222,450 212.0,455.0 212.0,445.0"/><rect class="bxo" x="228" y="424" width="722" height="54" rx="8"/><text class="tk" x="242" y="447">Не видит страницу и то, что вы там ищете</text><text class="sm mu" x="242" y="468">всё это зашифровано позже</text></g>
<g class="a e19"><text class="sm" x="10" y="508">Это и есть окошко с адресом на конверте, которое смотрит наш сортировщик из первого выпуска.</text><text class="sm mu" x="10" y="530">Что настоящее оборудование делает с этим окошком, мы не знаем: наблюдатель здесь модель.</text></g>
</svg>
