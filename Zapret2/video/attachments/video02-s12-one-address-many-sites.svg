<svg xmlns="http://www.w3.org/2000/svg" class="v02-s12-one-address-many-sites" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v02-s12-one-address-many-sites-t v02-s12-one-address-many-sites-d">
<title id="v02-s12-one-address-many-sites-t">Один адрес, много сайтов</title>
<desc id="v02-s12-one-address-many-sites-d">На одном IP-адресе может отвечать много сайтов (пример: адрес 10.2.0.2 с сайтами example.com, example.org, example.net, www.example.com и другими), поэтому в ClientHello есть поле SNI, «указание имени сервера», в нашем сообщении там www.example.com, как курьеру в доме с сотней компаний говорят, к какой идти; поле записано открыто, потому что передаётся до появления ключа, так что наблюдатель на пути, как правило, видит адрес и имя сайта, но не страницу и не то, что вы ищете: это зашифровано позже.</desc>
<style>.v02-s12-one-address-many-sites{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
