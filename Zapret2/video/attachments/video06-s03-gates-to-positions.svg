<svg xmlns="http://www.w3.org/2000/svg" class="video06-s03-gates-to-positions" viewBox="0 0 960 582" width="960" height="582" role="img" aria-labelledby="video06-s03-gates-to-positions-t video06-s03-gates-to-positions-d">
<title id="video06-s03-gates-to-positions-t">Ворота и позиции</title>
<desc id="video06-s03-gates-to-positions-d">До вызова функции multidisorder программа сама отсеивает пакеты фильтром диапазона и фильтром типа нагрузки, потом четыре ворота самой функции (TCP, есть данные, исходящее направление, известный тип), а дальше строка pos проходит пять шагов в lua/zapret-antidpi.lua: значение по умолчанию 2 (611), переводчик меток превращает midsld в позицию 105 (614), журнал вычитает единицу и пишет 104 (615), вычёркиватель единицы оставляет 105 (616), и непустой список пускает функцию в цикл (617).</desc>
