<g><text class="cap" x="40" y="24">сначала фильтры программы, ещё до Lua</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="430" height="92" rx="6"/><text class="sm tk" x="52" y="58">диапазон пакетов</text><text class="ix fg" x="52" y="82">in pos x0 x0 out of range x0-x0</text><text class="sm" x="52" y="104">входящие по умолчанию пусто: пакет идёт как был</text><text class="ix mu" x="52" y="121">nfq2/desync.c:1042</text></g>
<g class="a e2"><rect class="bx" x="490" y="36" width="430" height="92" rx="6"/><text class="sm tk" x="502" y="58">тип нагрузки: только клиентское приветствие</text><text class="ix fg" x="502" y="82">payload_type &#x27;empty&#x27; does not satisfy filter</text><text class="sm" x="502" y="104">пустое подтверждение клиента: стоп до Lua</text><text class="ix mu" x="502" y="121">nfq2/desync.c:1051, 1090</text></g>
<g class="a e3"><text class="cap" x="40" y="152">ворота самой функции, lua/zapret-antidpi.lua:598-609</text></g>
<g class="a e4"><rect class="bxa" x="40" y="162" width="205" height="54" rx="6"/><text class="sm tk" x="52" y="184">это TCP?</text><text class="ix mu" x="52" y="205">строка 598</text></g>
<g class="a e5"><rect class="bxa" x="265" y="162" width="205" height="54" rx="6"/><text class="sm tk" x="277" y="184">есть данные?</text><text class="ix mu" x="277" y="205">#data&gt;0, строка 609</text><path class="lm" d="M247 189L252.0 189.0"/><polygon class="hm" points="262,189 252.0,194.0 252.0,184.0"/></g>
<g class="a e6"><rect class="bxa" x="490" y="162" width="205" height="54" rx="6"/><text class="sm tk" x="502" y="184">направление?</text><text class="ix mu" x="502" y="205">по умолчанию out, 609</text><path class="lm" d="M472 189L477.0 189.0"/><polygon class="hm" points="487,189 477.0,194.0 477.0,184.0"/></g>
<g class="a e7"><rect class="bxa" x="715" y="162" width="205" height="54" rx="6"/><text class="sm tk" x="727" y="184">тип известный?</text><text class="ix mu" x="727" y="205">payload_check, 609</text><path class="lm" d="M697 189L702.0 189.0"/><polygon class="hm" points="712,189 702.0,194.0 702.0,184.0"/></g>
