<g class="a e15"><rect class="bxo" x="750" y="334" width="170" height="170" rx="6"/><text class="sm tk" x="760" y="356">есть ли</text><text class="sm tk" x="760" y="374">позиции</text><text class="ix fg" x="760" y="400">if #pos&gt;0 then</text><text class="ix mu" x="760" y="418">строка 617</text><rect class="bxa" x="758" y="430" width="154" height="30" rx="4"/><text class="ix c fg tk" x="835" y="450">дальше: цикл</text><text class="sm" x="760" y="484">пусто: нет разреза</text><path class="lm" d="M742 400L739.0 400.0"/><polygon class="hm" points="749,400 739.0,405.0 739.0,395.0"/></g>
<g class="a e16"><text class="sm" x="40" y="528">мост: переводчик считает с единицы (105), журнал с нуля (104)</text></g>
<g class="a e17"><text class="sm mu" x="40" y="550">replay_first (610): для приветствия в одном пакете всегда разрешает</text></g>
