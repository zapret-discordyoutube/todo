<g class="a e9"><rect class="bxd" x="40" y="252" width="880" height="36" rx="6"/><text class="ix fg" x="52" y="275">instance cutoff for &#x27;multidisorder_1_2&#x27; in=1 out=0</text><text class="sm" x="540" y="275">отсечка (603): входящие выкл., исходящие вкл.</text></g>
<g class="a e10"><text class="cap" x="40" y="322">от строки pos до списка позиций, на нашем примере midsld</text></g>
<g class="a e11"><rect class="bx" x="40" y="334" width="170" height="170" rx="6"/><text class="sm tk" x="50" y="356">значение по</text><text class="sm tk" x="50" y="374">умолчанию</text><text class="ix fg" x="50" y="400">arg.pos or &quot;2&quot;</text><text class="ix mu" x="50" y="418">строка 611</text><rect class="bxa" x="48" y="430" width="154" height="30" rx="4"/><text class="ix c fg tk" x="125" y="450">«midsld»</text><text class="sm" x="50" y="484">не написан: «2»</text></g>
<g class="a e12"><rect class="bx" x="217.5" y="334" width="170" height="170" rx="6"/><text class="sm tk" x="227.5" y="356">переводчик</text><text class="sm tk" x="227.5" y="374">меток</text><text class="ix fg" x="227.5" y="400">resolve_multi_pos</text><text class="ix mu" x="227.5" y="418">строка 614</text><rect class="bxa" x="225.5" y="430" width="154" height="30" rx="4"/><text class="ix c fg tk" x="302.5" y="450">«midsld» → {105}</text><text class="sm" x="227.5" y="484">позиции с единицы</text><path class="lm" d="M209.5 400L206.5 400.0"/><polygon class="hm" points="216.5,400 206.5,405.0 206.5,395.0"/></g>
