<g class="a e20"><rect class="bx" x="520" y="524" width="400" height="62" rx="6"/><text class="sm" x="534" y="548">приёмщик вызывается синхронно: потоков нет,</text><text class="sm" x="534" y="570">вывод из кода, библиотеку не читали</text></g>
<g class="a e21"><text class="sm mu" x="520" y="612">Автор: в буфере за один recv может быть</text><text class="sm mu" x="520" y="632">несколько сообщений (:322-323), не наблюдали.</text></g>
