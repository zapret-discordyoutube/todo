<g><text class="cap" x="40" y="26">уборка мусора Lua: lua.c:4699-4713</text><text class="cap" x="520" y="26">чтение: nfqws.c:566-580</text></g>
<g class="a e1"><rect class="bxa" x="40" y="40" width="450" height="150" rx="8"/><text class="tk sm" x="54" y="64">lua_do_gc(): уборка мусора Lua</text><text class="m" x="54" y="92">now = boottime_ms();</text><text class="ix r" x="476" y="92">:4703</text><text class="m" x="54" y="116">if ((now - gc_time) &gt;= params.lua_gc)</text><text class="ix r" x="476" y="116">:4704</text><text class="m" x="54" y="140">static uint64_t gc_time=0;</text><text class="ix r" x="476" y="140">:4698</text><text class="m" x="54" y="168">params.lua_gc = LUA_GC_INTERVAL*1000;</text></g>
<g class="a e2"><rect class="bxb" x="40" y="204" width="220" height="76" rx="8"/><text class="ml c amb" x="150" y="238">60000 мс = 60 с</text><text class="sm c" x="150" y="264">значение по умолчанию</text><rect class="bx" x="272" y="204" width="218" height="76" rx="8"/><text class="ix c" x="381" y="232">params.c:591</text><text class="ix c" x="381" y="252">params.h:50</text><text class="ix c" x="381" y="270">LUA_GC_INTERVAL 60 (с)</text></g>
<g class="a e3"><text class="cap" x="40" y="308">первый оборот: gc_time = 0</text></g>
<g class="a e4"><rect class="fs" x="40" y="322" width="450" height="16" rx="3"/><rect class="fr" x="40" y="322" width="150" height="16" rx="3"/><rect class="fo" x="190" y="322" width="300" height="16" rx="3"/><path class="lcut" d="M190 314L190 346"/><text class="ix" x="40" y="362">0</text><text class="ix c" x="190" y="362">60 с</text><text class="ix r" x="490" y="362">время от включения компьютера</text><text class="sm c rej" x="115" y="386">уборки нет</text><text class="sm c ok" x="340" y="386">уборка на первом обороте</text></g>
<g class="a e5"><text class="cap" x="40" y="420">в журнале опыта t10, перед первым пакетом</text></g>
<g class="a e6"><rect class="bx" x="40" y="432" width="450" height="66" rx="6"/><text class="mk" x="54" y="456">LUA GARBAGE COLLECT: 348K =&gt; 243K</text><text class="m mu" x="54" y="482">packet: id=1 len=60 mark=00000000 …</text></g>
<g class="a e7"><text class="sm" x="40" y="524">память Lua до сборки 348K, после 243K (:4706-4709).</text><text class="sm mu" x="40" y="546">Следующая сборка: не раньше чем через 60 с.</text></g>
<g class="a e8"><rect class="bxb" x="520" y="40" width="400" height="90" rx="8"/><text class="tk sm" x="534" y="64">приёмный буфер</text><text class="m" x="534" y="90">rd = recv(fd, buf, NFQ_MAX_RECV_SIZE, 0);</text><text class="sm" x="534" y="116">69632 Б = 65536 + 4096 (:443)</text><text class="ix r" x="906" y="64">:566</text></g>
<g class="a e9"><rect class="bxs" x="520" y="144" width="400" height="54" rx="6"/><text class="mk mu" x="534" y="166">rd &lt; 0</text><text class="sm" x="630" y="166">внутренний цикл выходит</text><text class="sm mu" x="630" y="186">причина разбирается отдельно</text><text class="ix r" x="906" y="166">:567</text></g>
<g class="a e10"><rect class="bxr" x="520" y="206" width="400" height="54" rx="6"/><text class="mk rej" x="534" y="228">rd == 0</text><text class="sm" x="630" y="228">фатально, код выхода 1</text><text class="m" x="630" y="248">recv from nfq returned 0 !</text><text class="ix r" x="906" y="228">:568-572</text></g>
<g class="a e11"><rect class="bxo" x="520" y="268" width="400" height="54" rx="6"/><text class="mk ok" x="534" y="290">rd &gt; 0</text><text class="sm" x="630" y="290">разбор и вызов приёмщика</text><text class="m" x="630" y="310">nfq_handle_packet(h, buf, rd)</text><text class="ix r" x="906" y="290">:578</text></g>
<g class="a e12"><text class="sm mu" x="534" y="346">res &lt; 0 после разбора: ошибка библиотеки,</text><text class="sm mu" x="534" y="366">только запись в журнал (:579)</text></g>
<g class="a e13"><text class="cap" x="520" y="400">что вызывается на одно сообщение</text></g>
<g class="a e14"><rect class="bxb" x="520" y="414" width="66" height="38" rx="6"/><text class="mk c" x="553" y="438">recv</text></g>
