<svg xmlns="http://www.w3.org/2000/svg" class="v16-s13-gc-and-recv" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v16-s13-gc-and-recv-t v16-s13-gc-and-recv-d">
<title id="v16-s13-gc-and-recv-t">Уборка Lua и чтение сокета</title>
<desc id="v16-s13-gc-and-recv-d">Уборка и чтение внутри одного оборота. Уборка: функция lua_do_gc (lua.c:4699-4713) освобождает память, которую скрипты Lua уже не используют. Условие: now − gc_time ≥ params.lua_gc, где now берётся от включения компьютера (boottime_ms), gc_time стартует с нуля, а params.lua_gc по умолчанию 60 × 1000 = 60000 мс = 60 с (params.c:591, params.h:50). Поэтому на самом первом обороте уборка запускается, только если компьютер включён не меньше 60 секунд. Когда уборка сработала, в журнал пишется строка LUA GARBAGE COLLECT: 348K =&gt; 243K; в журнале опыта t10 она стоит прямо перед первым пакетом packet: id=1. Чтение: recv (nfqws.c:566) кладёт данные ядра в приёмный буфер 69632 байта = 65536 + 4096 (nfqws.c:443). Результат меньше нуля: внутренний цикл выходит (567). Ноль байт: фатальная ошибка «recv from nfq returned 0 !», выход с кодом 1 (568-572). Больше нуля: nfq_handle_packet (578) разбирает данные и вызывает приёмщика nfq_cb; ошибка библиотеки только пишется в журнал (579). Когда приёмщик вернулся, начинается следующий recv. По комментарию автора за один recv в буфер может прийти сразу несколько сообщений (nfqws.c:322-323), мы такого не наблюдали.</desc>
