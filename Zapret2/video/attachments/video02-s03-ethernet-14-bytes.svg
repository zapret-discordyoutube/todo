<svg xmlns="http://www.w3.org/2000/svg" class="v02-s03-eth" viewBox="0 0 960 478" width="960" height="478" role="img" aria-labelledby="v02-s03-eth-t v02-s03-eth-d">
<title id="v02-s03-eth-t">Заголовок Ethernet: 14 байт</title>
<desc id="v02-s03-eth-d">Первые 14 байт настоящего кадра с запросом: получатель 16:4d:c6:0e:f9:12 (порт роутера со стороны клиента), отправитель fe:02:bf:2a:aa:17 (сетевая карта клиента) и тип 08 00, то есть внутри IP версии 4; адрес сервера в этом кадре не встречается, потому что путь до сервера начинается с роутера.</desc>
