<g class="a e10"><text class="sm" x="40" y="392">Клиент знает IP-адрес сервера, но путь до него начинается с роутера:</text><text class="sm" x="40" y="414">поэтому в заголовке Ethernet стоит адрес порта роутера, а не сервера.</text></g>
<g class="a e11"><text class="tk sm" x="40" y="452">Ethernet-адрес действует только на ближайший шаг: до соседа по кабелю или Wi-Fi.</text></g>
