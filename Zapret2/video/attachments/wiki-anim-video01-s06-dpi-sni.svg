<svg xmlns="http://www.w3.org/2000/svg" class="v01-s06-dpi" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="v01-s06-dpi-t v01-s06-dpi-d">
<title id="v01-s06-dpi-t">Что видит DPI в первом сообщении</title>
<desc id="v01-s06-dpi-d">Те же 316 байт: DPI разбирает начало данных (запись TLS 16 03 01 00 f5, ClientHello 01 00 00 f1, расширение имени), находит 15 байт имени www.example.com (в данных 97..111, в кадре 163..177) и сверяет их со списком; после рукопожатия содержимое страницы зашифровано.</desc>
