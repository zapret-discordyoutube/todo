<g class="a e1"><text class="cap" x="40" y="24">шаг цепочки</text><text class="cap" x="210" y="24">пример 1</text><text class="cap" x="572" y="24">пример 2</text></g>
<g class="a e2"><text class="tk sm" x="40" y="58">список pos</text><rect class="bx" x="210" y="36" width="348" height="32" rx="5"/><text class="m c" x="384" y="57">host+3,endhost-2</text><rect class="bx" x="572" y="36" width="348" height="32" rx="5"/><text class="m c" x="746" y="57">midsld,2,midsld,host,2</text></g>
<g class="a e3"><text class="tk sm" x="40" y="96">Си: с нуля</text><rect class="bxa" x="210" y="74" width="348" height="32" rx="5"/><text class="mk c" x="384" y="95">100, 110</text><rect class="bxa" x="572" y="74" width="348" height="32" rx="5"/><text class="mk c" x="746" y="95">2, 97, 104 (повторы склеены)</text></g>
<g class="a e4"><text class="tk sm" x="40" y="134">Lua: +1</text><rect class="bxa" x="210" y="112" width="348" height="32" rx="5"/><text class="mk c" x="384" y="133">{101, 111}</text><rect class="bxa" x="572" y="112" width="348" height="32" rx="5"/><text class="mk c" x="746" y="133">{3, 98, 105}</text></g>
<g class="a e5"><text class="tk sm" x="40" y="172">журнал</text><rect class="bx" x="210" y="150" width="348" height="32" rx="5"/><text class="m c" x="384" y="171">resolved split pos: 100 110</text><rect class="bx" x="572" y="150" width="348" height="32" rx="5"/><text class="m c" x="746" y="171">resolved split pos: 2 97 104</text></g>
<g class="a e6"><text class="tk sm" x="40" y="210">вычёркивание</text><rect class="bxo" x="210" y="188" width="348" height="32" rx="5"/><text class="sm c" x="384" y="209">единицы нет</text><rect class="bxo" x="572" y="188" width="348" height="32" rx="5"/><text class="sm c" x="746" y="209">единицы нет</text></g>
<g class="a e7"><text class="tk sm" x="40" y="248">части на проводе</text><rect class="bxo" x="210" y="226" width="348" height="32" rx="5"/><text class="mk c" x="384" y="247">100, 10, 140</text><rect class="bxo" x="572" y="226" width="348" height="32" rx="5"/><text class="mk c" x="746" y="247">2, 95, 7, 146</text></g>
<g class="a e8"><text class="cap" x="40" y="288">пример 1: приветствие 250 байт, разрезы на 100 и 110</text><rect class="bxa" x="40" y="296" width="352" height="22" rx="2"/><rect class="bxb" x="392" y="296" width="35.2" height="22" rx="2"/><rect class="bxo" x="427.2" y="296" width="492.8" height="22" rx="2"/><path class="lf" d="M392 292L392 322"/><path class="lf" d="M427.2 292L427.2 322"/><text class="ix c" x="216" y="334">100</text><text class="ix c" x="409.6" y="334">10</text><text class="ix c" x="673.6" y="334">140</text></g>
<g class="a e9"><text class="cap" x="40" y="354">пример 2: разрезы на 2, 97 и 104</text><rect class="bxa" x="40" y="362" width="7" height="22" rx="2"/><rect class="bxb" x="47" y="362" width="334.4" height="22" rx="2"/><rect class="bxo" x="381.4" y="362" width="24.6" height="22" rx="2"/><rect class="bxr" x="406.1" y="362" width="513.9" height="22" rx="2"/><path class="lf" d="M47 358L47 388"/><path class="lf" d="M381.4 358L381.4 388"/><path class="lf" d="M406.1 358L406.1 388"/><text class="ix c" x="43.5" y="400">2</text><text class="ix c" x="214.2" y="400">95</text><text class="ix c" x="393.8" y="400">7</text><text class="ix c" x="663" y="400">146</text></g>
<g class="a e10"><text class="cap" x="40" y="428">проверь себя</text><text class="sm" x="196" y="428">список host-100 на том же приветствии: какой из четырёх исходов?</text></g>
<g class="a e11"><rect class="bx" x="40" y="440" width="146" height="54" rx="6"/><text class="cap ns" x="50" y="460">host − 100</text><text class="mk" x="50" y="482">97 − 100 = −3</text></g>
<g class="a e12"><rect class="bxr" x="208" y="440" width="120" height="54" rx="6"/><text class="cap ns" x="218" y="460">метка</text><text class="tk sm" x="218" y="482">не нашлась</text><path class="lm" d="M188 467L195.0 467.0"/><polygon class="hm" points="205,467 195.0,472.0 195.0,462.0"/></g>
<g class="a e13"><rect class="bxr" x="352" y="440" width="110" height="54" rx="6"/><text class="cap ns" x="362" y="460">список</text><text class="tk sm" x="362" y="482">пуст</text><path class="lm" d="M332 467L339.0 467.0"/><polygon class="hm" points="349,467 339.0,472.0 339.0,462.0"/></g>
<g class="a e14"><rect class="bxb" x="484" y="440" width="244" height="54" rx="6"/><text class="cap ns" x="494" y="460">журнал</text><text class="mk" x="494" y="482">no valid split positions</text><path class="lm" d="M464 467L471.0 467.0"/><polygon class="hm" points="481,467 471.0,472.0 471.0,462.0"/></g>
<g class="a e15"><rect class="bxo" x="750" y="440" width="170" height="54" rx="6"/><text class="cap ns" x="760" y="460">оригинал</text><text class="tk sm" x="760" y="482">уходит целым</text><path class="lm" d="M730 467L737.0 467.0"/><polygon class="hm" points="747,467 737.0,472.0 737.0,462.0"/></g>
<g class="a e16"><text class="sm mu" x="40" y="522">Это третий исход: метки не нашлись. Счёт по коду (CheckPos, protocol.c:182-185), такой список мы не запускали.</text><text class="sm mu" x="40" y="542">Для обоих примеров есть журнал и провод нашей лаборатории; host-100 только расчёт.</text></g>
</svg>
