<svg xmlns="http://www.w3.org/2000/svg" class="v05-s06-two-examples" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="v05-s06-two-examples-t v05-s06-two-examples-d">
<title id="v05-s06-two-examples-t">Два примера и проверка на бумаге</title>
<desc id="v05-s06-two-examples-d">Две цепочки чисел на нашем приветствии в 250 байт и проверка на бумаге: список host+3,endhost-2 даёт в Си 100 и 110, в Lua 101 и 111, в журнале 100 110, и на проводе три части 100, 10 и 140; список midsld,2,midsld,host,2 даёт в Си 2, 97 и 104 (повторы склеены), в Lua 3, 98 и 105, и на проводе четыре части 2, 95, 7 и 146; внизу проверка host-100: 97 минус 100 равно минус 3, метка не находится, список пуст, в журнале no valid split positions, оригинал уходит целым, это третий исход, посчитано по коду и не запускалось.</desc>
<style>.v05-s06-two-examples{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
