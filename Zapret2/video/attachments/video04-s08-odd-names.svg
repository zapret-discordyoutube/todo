<svg xmlns="http://www.w3.org/2000/svg" class="v04-s08-odd-names" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v04-s08-odd-names-t v04-s08-odd-names-d">
<title id="v04-s08-odd-names-t">Второе справа слово у необычных имён</title>
<desc id="v04-s08-odd-names-d">Прогон функций (настоящий код поиска на готовых строках, не запуск nfqws2): второе справа слово в www.example.com — example (начало 4, длина 7), в example.com — example (0, 7), в st.vk.com — vk (3, 2), в a.b.co.uk — co (4, 2, списка суффиксов в коде нет), в адресе 93.184.216.34 — число 216 (7, 3), в www.x.com — x (4, 1); у localhost слова не находятся, и метки sld, midsld, endsld пропадают. Красная черта — разрез midsld по формуле кода.</desc>
<style>.v04-s08-odd-names{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
