<svg xmlns="http://www.w3.org/2000/svg" class="v08-s21-three-wires" viewBox="0 0 960 756" width="960" height="756" role="img" aria-labelledby="v08-s21-three-wires-t v08-s21-three-wires-d">
<title id="v08-s21-three-wires-t">Три функции и три провода</title>
<desc id="v08-s21-three-wires-d">Повтор выпуска, три функции и что уходит в сеть в порядке отправки: разрез с фейками шлёт шесть пакетов, фейк в 104 байта со смещения 0, настоящую часть в 104 байта, ещё фейк, потом фейк в 146 байт со смещения 104, настоящую часть в 146 байт и ещё фейк; перемешивание с фейками шлёт те же шесть пакетов, но часть со смещения 104 идёт первой; имя между двойниками шлёт пять пакетов, настоящую часть в 97 байт, двойник в 15 байт, настоящее имя в 15 байт, тот же двойник и настоящий хвост в 138 байт со смещения 112; у всех фейков опция MD5, поэтому они умирают в ядре сервера, а приложение сервера читает 250 байт, равных оригиналу, в трёх запусках.</desc>
