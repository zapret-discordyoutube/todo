<g class="a e22"><rect class="bxb" x="40" y="406" width="430" height="84" rx="6"/><text class="sm tk" x="52" y="428">i = 1: «часть 2» в журнале</text><text class="sm" x="52" y="450">начало 105 = pos[1]; следующей нет, конец 250</text><text class="sm tk" x="52" y="474">105…250 = 146 байт, сдвиг 105 − 1 − 0 = 104</text></g>
<g class="a e23"><rect class="bxa" x="490" y="406" width="430" height="84" rx="6"/><text class="sm tk" x="502" y="428">i = 0: «часть 1» в журнале</text><text class="sm" x="502" y="450">pos[0] нет: начало 1; конец 104 = pos[1] − 1</text><text class="sm tk" x="502" y="474">1…104 = 104 байта, сдвиг 1 − 1 − 0 = 0</text></g>
