<g><text class="cap" x="40" y="24">игрушка, выдуманный пример: линейка с тремя засечками</text></g>
<g class="a e1"><rect class="bxa" x="40" y="46" width="220" height="34" rx="0"/><text class="sm tk c" x="150" y="68">i = 0 (начало)</text><rect class="bx" x="260" y="46" width="220" height="34" rx="0"/><text class="sm tk c" x="370" y="68">i = 1</text><rect class="bx" x="480" y="46" width="220" height="34" rx="0"/><text class="sm tk c" x="590" y="68">i = 2</text><rect class="bxb" x="700" y="46" width="220" height="34" rx="0"/><text class="sm tk c" x="810" y="68">i = 3</text></g>
<g class="a e2"><text class="sm" x="40" y="104">три засечки дают четыре куска: от i = 0 до i = 3</text></g>
<g class="a e3"><circle class="bxa" cx="810" cy="128" r="12"/><text class="tk c ns" x="810" y="133">1</text></g>
<g class="a e4"><circle class="bxa" cx="590" cy="128" r="12"/><text class="tk c ns" x="590" y="133">2</text></g>
<g class="a e5"><circle class="bxa" cx="370" cy="128" r="12"/><text class="tk c ns" x="370" y="133">3</text></g>
<g class="a e6"><circle class="bxb" cx="150" cy="128" r="12"/><text class="tk c ns" x="150" y="133">4</text></g>
<g class="a e7"><path class="lm" d="M880 150L70.0 150.0"/><polygon class="hm" points="60,150 70.0,145.0 70.0,155.0"/><text class="sm tk c" x="480" y="172">отправляем с последнего отрезка к первому: цикл начинается с i = 3</text></g>
<g class="a e8"><text class="cap" x="40" y="206">цикл в общем отправителе частей</text><text class="ix mu r" x="920" y="206">lua/zapret-antidpi.lua</text></g>
<g class="a e9"><rect class="bx" x="40" y="214" width="880" height="170" rx="6"/><path class="lm" d="M86 220L86 378"/><text class="ix mu r" x="78" y="239">559</text><text class="ix fg" x="96" y="239">for i=#pos,0,-1 do</text><text class="ix mu r" x="78" y="265">560</text><text class="ix fg" x="96" y="265">local pos_start = pos[i] or 1</text><text class="ix mu r" x="78" y="291">561</text><text class="ix fg" x="96" y="291">local pos_end = i&lt;#pos and pos[i+1]-1 or #data</text><text class="ix mu r" x="78" y="317">562</text><text class="ix fg" x="96" y="317">local part = string.sub(data,pos_start,pos_end)</text><text class="ix mu r" x="78" y="343">581</text><text class="ix fg" x="96" y="343">if not rawsend_payload_segmented(desync,part,pos_start-1-ovl) then</text><text class="ix mu r" x="78" y="369">585</text><text class="ix fg" x="96" y="369">return VERDICT_DROP</text></g>
