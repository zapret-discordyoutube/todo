<rect class="bg" x="0" y="0" width="960" height="610"/>
<g><text class="cap" x="40" y="26">три опыта в одной таблице</text></g>
<g class="a e1"><text class="sm mu" x="48" y="58">seqovl</text><text class="sm mu" x="188" y="58">накладок</text><text class="sm mu" x="278" y="58">длина пакета</text><text class="sm mu" x="438" y="58">начало пакета</text><text class="sm mu" x="598" y="58">накладок + начало</text><text class="sm mu" x="768" y="58">дублирующий блок</text></g>
<g class="a e2"><rect class="bx" x="36" y="72" width="888" height="40" rx="4"/><text class="mk" x="48" y="101">1</text><text class="mk" x="188" y="101">1</text><text class="m" x="278" y="101">1 + 146 = 147</text><text class="m" x="438" y="101">104 − 1 = 103</text><text class="mk" x="768" y="92">[104,105)</text><text class="sm mu" x="768" y="110">1 номер</text></g>
<g class="a e3"><rect class="bx" x="36" y="118" width="888" height="40" rx="4"/><text class="mk" x="48" y="147">host (97)</text><text class="mk" x="188" y="147">97</text><text class="m" x="278" y="147">97 + 146 = 243</text><text class="m" x="438" y="147">104 − 97 = 7</text><text class="mk" x="768" y="138">[8,105)</text><text class="sm mu" x="768" y="156">97 номеров</text></g>
<g class="a e4"><rect class="bx" x="36" y="164" width="888" height="40" rx="4"/><text class="mk" x="48" y="193">midsld-1 (103)</text><text class="mk" x="188" y="193">103</text><text class="m" x="278" y="193">103 + 146 = 249</text><text class="m" x="438" y="193">104 − 103 = 1</text><text class="mk" x="768" y="184">[2,105)</text><text class="sm mu" x="768" y="202">103 номера</text></g>
<g class="a e5"><text class="mk ok" x="598" y="101">1 + 103 = 104</text></g>
<g class="a e6"><text class="mk ok" x="598" y="147">97 + 7 = 104</text></g>
<g class="a e7"><text class="mk ok" x="598" y="193">103 + 1 = 104</text></g>
<g class="a e8"><rect class="la" x="180" y="68" width="90" height="142" rx="4"/><rect class="la" x="430" y="68" width="160" height="142" rx="4"/></g>
<g class="a e9"><text class="tk" x="40" y="230">длина = 146 + накладок, начало = 104 − накладок, значит их сумма = 104 (разрез)</text></g>
<g class="a e10"><text class="sm mu" x="40" y="252">метка строго левее разреза: начало не ниже 1, пакет не выходит левее первого байта сообщения</text></g>
<g class="a e11"><rect class="bxa" x="40" y="280" width="880" height="100" rx="8"/><text class="tk" x="56" y="306">хэш = короткий отпечаток данных (sha256)</text><text class="sm" x="56" y="328">приёмник считает его от всех полученных байт;</text><text class="sm" x="56" y="346">совпал с хэшем запроса клиента: байты сошлись</text><text class="sm" x="56" y="364">все до одного</text><rect class="bx" x="540" y="298" width="160" height="26" rx="3"/><text class="sm c" x="620" y="316">запрос клиента</text><rect class="bx" x="540" y="336" width="160" height="26" rx="3"/><text class="sm c" x="620" y="354">принято сервером</text><path class="lf" d="M704 311L740 311"/><polygon class="hf" points="750,311 740,316 740,306"/><path class="lf" d="M704 349L740 349"/><polygon class="hf" points="750,349 740,354 740,344"/><rect class="pl" x="754" y="298" width="60" height="26" rx="3"/><text class="mk c" x="784" y="316">хэш</text><rect class="pl" x="754" y="336" width="60" height="26" rx="3"/><text class="mk c" x="784" y="354">хэш</text><path class="lo" d="M826 311 L826 349"/><text class="tk ok" x="836" y="335">равны</text></g>
<g class="a e12"><rect class="bxo" x="40" y="398" width="880" height="50" rx="8"/><text class="tk" x="56" y="420">приложение сервера в каждом из трёх опытов: одно чтение, 250 байт, хэш равен</text><text class="sm" x="56" y="439">до приложения дошли настоящие байты, а не нули</text></g>
<g class="a e13"><rect class="bxd" x="40" y="468" width="880" height="92" rx="8"/><text class="tk" x="56" y="492">проверь себя: seqovl = midsld − 2, то есть метка на смещении 102</text><text class="sm" x="56" y="514">сколько накладок, какая длина пакета и с какого смещения он начнётся?</text></g>
<g class="a e14"><text class="mk" x="56" y="540">102 накладки · длина 102 + 146 = 248 · начало 104 − 102 = 2</text><text class="sm mu" x="640" y="540">по формуле, не запускали</text></g>
</svg>
