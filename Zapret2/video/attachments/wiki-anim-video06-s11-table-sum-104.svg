<svg xmlns="http://www.w3.org/2000/svg" class="v06-s11-table-sum-104" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="v06-s11-table-sum-104-t v06-s11-table-sum-104-d">
<title id="v06-s11-table-sum-104-t">Таблица накладок и сумма 104</title>
<desc id="v06-s11-table-sum-104-d">Три опыта с seqovl 1, host и midsld-1 в одной таблице: накладок 1, 97 и 103, длина пакета 147, 243 и 249 как 146 плюс накладки, начало 103, 7 и 1 как 104 минус накладки, поэтому накладок и начала в сумме всегда 104, то есть разрез; сервер называет дублирующим блок из 1, 97 и 103 номеров, хэш всех полученных байт во всех трёх опытах равен хэшу запроса клиента, и приложение читает все 250 байт одним чтением; для проверки метка 102 даёт по формуле 102 накладки, длину 248 и начало 2, такой опыт мы не запускали.</desc>
