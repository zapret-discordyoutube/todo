<svg xmlns="http://www.w3.org/2000/svg" class="v06-s23-extra-segment" viewBox="0 0 960 724" width="960" height="724" role="img" aria-labelledby="v06-s23-extra-segment-t v06-s23-extra-segment-d">
<title id="v06-s23-extra-segment-t">tcpseg без drop: лишний сегмент</title>
<desc id="v06-s23-extra-segment-d">Опыт tcpseg без drop: выдуманная телеграмма, где курьер отправил первые 105 слов и на столе осталась вся телеграмма, которую тоже отправляют, поэтому адресат получает первые слова дважды; в нашем тесте на проводе два пакета, 105@0 и затем весь оригинал 250@0 с тем же IP id 19329, потому что первый отправленный функцией пакет берёт номер оригинала (строки 1098-1099 файла zapret-lib.lua); сервер отвечает ACK 106, то есть подтверждено 105 байт и жду 106-й, а после оригинала ACK 251 и блоком с 1 по 105, который лежит ниже подтверждения и значит это дубликат; приложение получило 250 байт один раз, в этом запуске чтениями 105 и 145; функция кончается без return, и движок читает это как «пропустить», параметр nodrop у неё не читается, поэтому без drop идея «остаток пришлёт ядро» не работает, остаток и так приходит в оригинале.</desc>
