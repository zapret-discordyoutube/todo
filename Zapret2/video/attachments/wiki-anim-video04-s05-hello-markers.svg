<svg xmlns="http://www.w3.org/2000/svg" class="v04-s05-hello-markers" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="v04-s05-hello-markers-t v04-s05-hello-markers-d">
<title id="v04-s05-hello-markers-t">Метки на приветствии в 250 байт</title>
<desc id="v04-s05-hello-markers-d">Приветствие в 250 байт и семь меток на нём: extlen 86 (поле длины расширений, байты 86–87), sniext 92 (первый байт данных расширения, байты 88–91 — заголовок), host 97 (первая буква имени), sld 101, midsld 104, endsld 108 и endhost 112 (первый байт после имени, имя www.example.com занимает 97–111). В нашем тесте разрез на host даёт части 97 и 153 байта (имя целиком во второй), разрез на endhost — 112 и 138 (имя целиком в первой).</desc>
