<g><text class="cap" x="40" y="26">как глубоко должно быть правдоподобие: пример из нашего опыта</text></g>
<g class="a e1"><rect class="bxa" x="93" y="112" width="72" height="48" rx="6"/><text class="ml c" x="129" y="142">16</text><text class="ix c" x="129" y="104">1</text></g>
<g class="a e2"><rect class="bxa" x="171" y="112" width="72" height="48" rx="6"/><text class="ml c" x="207" y="142">03</text><text class="ix c" x="207" y="104">2</text></g>
<g class="a e3"><rect class="bxs" x="249" y="112" width="72" height="48" rx="6"/><text class="ml c" x="285" y="142">01</text><text class="ix c" x="285" y="104">3</text></g>
<g class="a e4"><rect class="bxs" x="327" y="112" width="72" height="48" rx="6"/><text class="ml c" x="363" y="142">00</text><text class="ix c" x="363" y="104">4</text></g>
<g class="a e5"><rect class="bxs" x="405" y="112" width="72" height="48" rx="6"/><text class="ml c" x="441" y="142">05</text><text class="ix c" x="441" y="104">5</text></g>
<g class="a e6"><rect class="bx" x="483" y="112" width="72" height="48" rx="6"/><text class="ml c" x="519" y="142">aa</text><text class="ix c" x="519" y="104">6</text></g>
<g class="a e7"><rect class="bx" x="561" y="112" width="72" height="48" rx="6"/><text class="ml c" x="597" y="142">bb</text><text class="ix c" x="597" y="104">7</text></g>
<g class="a e8"><rect class="bx" x="639" y="112" width="72" height="48" rx="6"/><text class="ml c" x="675" y="142">cc</text><text class="ix c" x="675" y="104">8</text></g>
<g class="a e9"><rect class="bx" x="717" y="112" width="72" height="48" rx="6"/><text class="ml c" x="753" y="142">dd</text><text class="ix c" x="753" y="104">9</text></g>
<g class="a e10"><rect class="bx" x="795" y="112" width="72" height="48" rx="6"/><text class="ml c" x="831" y="142">ee</text><text class="ix c" x="831" y="104">10</text></g>
<g class="a e11"><path class="lm" d="M93 174L477 174"/><text class="tk sm c" x="285" y="194">заголовок записи TLS, 5 байт</text></g>
<g class="a e12"><path class="lmd" d="M483 174L867 174"/><text class="sm c" x="675" y="194">пять произвольных байт</text></g>
<g class="a e13"><text class="ix" x="93" y="216">по общим сведениям: 16 рукопожатие, 03 01 версия, 00 05 длина</text></g>
<g class="a e14"><text class="sm acc tk" x="93" y="62">наш инспектор смотрит только на эти два байта</text><path class="la" d="M163 70L163 80"/><polygon class="ha" points="163,90 158,80 168,80"/></g>
<g class="a e15"><rect class="bx" x="40" y="270" width="280" height="66" rx="8"/><text class="tk sm" x="54" y="298">ищет запрещённое имя</text><text class="sm" x="54" y="322">www.example.com: не найдено</text></g>
<g class="a e16"><path class="lf" d="M322 303L328 303"/><polygon class="hf" points="338,303 328,308 328,298"/></g>
<g class="a e17"><rect class="bxa" x="340" y="270" width="280" height="66" rx="8"/><text class="tk sm" x="354" y="298">смотрит первые два байта</text><text class="sm" x="354" y="322">16 03: это запись TLS</text></g>
<g class="a e18"><path class="lf" d="M622 303L628 303"/><polygon class="hf" points="638,303 628,308 628,298"/></g>
<g class="a e19"><rect class="bxo" x="640" y="270" width="280" height="66" rx="8"/><text class="tk sm" x="654" y="298">решение</text><text class="sm" x="654" y="322">разрешено, дальше не смотрит</text></g>
<g class="a e20"><text class="sm tk" x="40" y="374">В том опыте за пакетом в 10 байт шёл настоящий в 250 байт.</text><text class="sm tk" x="40" y="396">Сервер получил ровно 250 настоящих байт.</text></g>
<g class="a e21"><text class="sm amb" x="40" y="420">У подделки там было ещё условие MD5, о нём позже.</text></g>
<g class="a e22"><rect class="bxs" x="40" y="434" width="880" height="38" rx="8"/><text class="sm tk" x="56" y="459">Это свойство нашей игрушки, а не настоящего оборудования.</text></g>
