<svg xmlns="http://www.w3.org/2000/svg" class="v07-s02-ten-bytes" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="v07-s02-ten-bytes-t v07-s02-ten-bytes-d">
<title id="v07-s02-ten-bytes-t">Десять байт обманули игрушку</title>
<desc id="v07-s02-ten-bytes-d">Блоб из десяти байт 16 03 01 00 05 aa bb cc dd ee, где первые пять байт это заголовок записи TLS, а вторые пять произвольные, обманул наш игрушечный инспектор: он не нашёл в пакете запрещённое имя, посмотрел только на первые два байта 16 03, принял пакет за начало защищённого соединения и разрешил его, а сервер получил ровно 250 настоящих байт.</desc>
