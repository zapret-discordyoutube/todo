<svg xmlns="http://www.w3.org/2000/svg" class="video06-s02-log-and-wire" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="video06-s02-log-and-wire-t video06-s02-log-and-wire-d">
<title id="video06-s02-log-and-wire-t">Журнал и провод первого запуска</title>
<desc id="video06-s02-log-and-wire-d">Опыт с командой multidisorder и pos=midsld на приветствии в 250 байт: в журнале метка midsld стала числом 104, затем ушла часть 2 из 146 байт со смещения 104 и часть 1 из 104 байт с нуля, пакет ядра выброшен, на проводе у клиента первым прошёл пакет с номерами 105–250 и IP id 50136, вторым пакет с номерами 1–104 и IP id 50137, оба с флагами PSH и ACK, а настоящий номер первого байта 3010423859 плюс 104 даёт 3010423963, то есть номер 105, и 104 плюс 146 равно 250 без дыры и перекрытия.</desc>
