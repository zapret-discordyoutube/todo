<g><text class="cap" x="40" y="24">журнал программы в нашем опыте: --lua-desync=multidisorder:pos=midsld</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="142" rx="6"/></g>
<g class="a e2"><text class="ix fg" x="56" y="62">packet: id=4 len=302</text><text class="sm" x="590" y="62">пакет ядра: 302 байта с заголовками</text></g>
<g class="a e3"><text class="ix fg" x="56" y="88">multidisorder: resolved split pos: 104</text><text class="sm" x="590" y="88">метка midsld стала числом 104</text></g>
<g class="a e4"><text class="ix fg" x="56" y="114">multidisorder: sending part 2 104-249 len=146 seqovl=0 …</text><text class="sm" x="590" y="114">часть 2: конец, 146 байт</text></g>
<g class="a e5"><text class="ix fg" x="56" y="140">multidisorder: sending part 1 0-103 len=104 seqovl=0 …</text><text class="sm" x="590" y="140">часть 1: начало, 104 байта</text></g>
<g class="a e6"><text class="ix fg" x="56" y="166">packet: id=4 drop</text><text class="sm" x="590" y="166">пакет ядра выброшен</text></g>
<g class="a e7"><path class="lr" d="M52 57L340 57"/></g>
<g class="a e8"><text class="sm mu" x="40" y="198">журнал считает части с единицы, код с нуля</text></g>
<g class="a e9"><text class="cap" x="40" y="230">провод у клиента, уже после программы, в порядке отправки</text></g>
<g class="a e10"><rect class="bx" x="40" y="242" width="880" height="28" rx="4"/><text class="ix mu" x="52" y="261">пакет</text><text class="ix mu" x="200" y="261">номера байтов</text><text class="ix mu" x="380" y="261">длина</text><text class="ix mu" x="500" y="261">флаги</text><text class="ix mu" x="640" y="261">IP id</text></g>
<g class="a e11"><rect class="bxd" x="40" y="274" width="880" height="32" rx="4"/><text class="sm mu" x="52" y="295">пакет ядра</text><text class="sm mu" x="200" y="295">1–250</text><text class="sm mu" x="380" y="295">250 байт</text><text class="sm mu" x="500" y="295">на проводе нет</text></g>
<g class="a e12"><rect class="bxb" x="40" y="310" width="880" height="32" rx="4"/><text class="sm tk" x="52" y="331">1-й: конец</text><text class="sm tk" x="200" y="331">105–250</text><text class="sm tk" x="380" y="331">146 байт</text><text class="sm tk" x="500" y="331">PSH+ACK</text><text class="sm tk" x="640" y="331">50136</text></g>
<g class="a e13"><rect class="bxa" x="40" y="346" width="880" height="32" rx="4"/><text class="sm tk" x="52" y="367">2-й: начало</text><text class="sm tk" x="200" y="367">1–104</text><text class="sm tk" x="380" y="367">104 байта</text><text class="sm tk" x="500" y="367">PSH+ACK</text><text class="sm tk" x="640" y="367">50137</text></g>
<g class="a e14"><path class="lr" d="M48 290L490 290"/></g>
<g class="a e15"><text class="sm" x="40" y="404">IP id идёт в порядке отправки, а не байтов: 50136, затем +1</text></g>
<g class="a e16"><text class="sm" x="40" y="426">флаги копируются у обработанного пакета: у обоих кусков PSH и ACK</text></g>
<g class="a e17"><text class="cap" x="40" y="462">номера: настоящие и «от первого байта»</text></g>
<g class="a e18"><rect class="bx" x="40" y="472" width="430" height="76" rx="6"/><text class="sm tk" x="52" y="494">настоящий номер первого байта в опыте</text><text class="m" x="52" y="516">3010423859 = номер 1</text><text class="m" x="52" y="538">+ 104 = 3010423963 = номер 105</text></g>
<g class="a e19"><rect class="bx" x="490" y="472" width="430" height="76" rx="6"/><text class="sm tk" x="502" y="494">ни дыры, ни перекрытия</text><text class="m" x="502" y="516">1–104 и 105–250</text><text class="m" x="502" y="538">104 + 146 = 250</text></g>
<g class="a e20"><text class="ix mu r" x="920" y="568">начальный номер в каждом запуске другой</text></g>
