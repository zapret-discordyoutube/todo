<svg xmlns="http://www.w3.org/2000/svg" class="v06-s16-lab-two-cuts" viewBox="0 0 960 772" width="960" height="772" role="img" aria-labelledby="v06-s16-lab-two-cuts-t v06-s16-lab-two-cuts-d">
<title id="v06-s16-lab-two-cuts-t">Опыт: один разрез и проверь себя с двумя</title>
<desc id="v06-s16-lab-two-cuts-d">Два опыта с multidisorder на приветствии в 1484 байта: при pos=midsld сначала уходит часть в 1380 байт со смещения 104, потом 104 байта с начала, сервер отвечает ACK 1 с блоком с 105 по 1484 и затем ACK 1485, приложение читает 1484 байта одним чтением, а пакетов в 1448 и 36 байт на проводе нет, потому что оригиналы выброшены; при pos=midsld,-1 (проверь себя) уходят 1 байт со смещения 1483, 1379 байт со смещения 104 и 104 байта с начала (104 + 1379 + 1 = 1484), блок подтверждений растёт влево: сначала блок из одного байта 1484, потом блок с 105 по 1484, затем ACK 1485, и приложение снова читает 1484 байта одним чтением.</desc>
<style>.v06-s16-lab-two-cuts{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
