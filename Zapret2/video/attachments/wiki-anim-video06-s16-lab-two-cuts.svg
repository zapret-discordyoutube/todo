.v06-s16-lab-two-cuts .hf{fill:var(--fg2)}.v06-s16-lab-two-cuts .ha{fill:var(--acc)}.v06-s16-lab-two-cuts .hr{fill:var(--rej)}.v06-s16-lab-two-cuts .hm{fill:var(--mute)}.v06-s16-lab-two-cuts .hb{fill:var(--amb)}
