<rect class="bg" x="0" y="0" width="960" height="772"/>
<g><text class="cap" x="40" y="24">опыт 1 · pos=midsld · один разрез всей ленты</text></g>
<g class="a e1"><rect class="bxa" x="40" y="58" width="61.7" height="28" rx="0"/><text class="ix c fg tk" x="70.8" y="77">104</text><rect class="bxb" x="101.7" y="58" width="818.3" height="28" rx="0"/><text class="ix c fg tk" x="510.8" y="77">часть 1380 байт</text><path class="lcut" d="M898.7 54L898.7 90"/><text class="ix mu r" x="892.7" y="108">граница сегментов ядра (1448 и 36) осталась внутри длинной части</text><text class="ix mu" x="40" y="108">0</text><text class="ix mu" x="105.7" y="108">104</text></g>
<g class="a e2"><circle class="bxb" cx="510.8" cy="50" r="11"/><text class="ix c fg tk ns" x="510.8" y="54.5">1</text><circle class="bxa" cx="70.8" cy="50" r="11"/><text class="ix c fg tk ns" x="70.8" y="54.5">2</text></g>
<g class="a e3"><text class="sm" x="40" y="132">calc: 104 + 1380 = 1484; номер в кружке это порядок отправки: сначала длинная часть, потом левая</text></g>
<g class="a e4"><text class="cap" x="52" y="158">на проводе</text><text class="cap" x="250" y="158">байты</text><text class="cap" x="520" y="158">ответ сервера</text><text class="cap" x="730" y="158">у сервера есть</text></g>
<g class="a e5"><circle class="bxa" cx="52" cy="182" r="11"/><text class="ix c fg tk ns" x="52" y="186.5">1</text><text class="mk" x="74" y="187">1380@104</text><text class="sm mu" x="250" y="187">байты 105…1484</text><text class="m" x="520" y="187">ACK 1, [105,1485)</text><rect class="bx" x="730" y="177" width="190" height="10" rx="0"/><rect class="bxo" x="743.3" y="177" width="176.7" height="10" rx="0"/></g>
<g class="a e6"><circle class="bxa" cx="52" cy="222" r="11"/><text class="ix c fg tk ns" x="52" y="226.5">2</text><text class="mk" x="74" y="227">104@0</text><text class="sm mu" x="250" y="227">байты 1…104</text><text class="m" x="520" y="227">ACK 1485</text><rect class="bxo" x="730" y="217" width="190" height="10" rx="0"/></g>
<g class="a e7"><text class="sm mu" x="74" y="264">на обоих пакетах только флаг ACK, без PSH: флаги копируются с первого куска, а у него PSH не было</text></g>
<g class="a e8"><rect class="bxo" x="40" y="278" width="430" height="34" rx="6"/><text class="sm tk" x="52" y="300">приложение: одно чтение, 1484 байта</text></g>
<g class="a e9"><rect class="bxr" x="490" y="278" width="430" height="34" rx="6"/><text class="sm tk" x="502" y="300">пакетов в 1448 и в 36 байт на проводе нет</text></g>
<g class="a e10"><text class="ix" x="40" y="336">кусок 2: «multidisorder: not acting on further replay pieces»</text><text class="ix" x="40" y="356">и «dropping replay packet because reasm was already sent»: оригинал выброшен по пометке</text></g>
<g class="a e11"><path class="lmd" d="M40 374L920 374"/><text class="cap" x="40" y="396">проверь себя · pos=midsld,-1 · метка −1 это последний байт, смещение 1483</text></g>
<g class="a e12"><text class="sm tk" x="40" y="420">сколько частей? три; в средней 1484 − 104 − 1 = 1379 байт</text></g>
<g class="a e13"><rect class="bxa" x="40" y="450" width="61.7" height="28" rx="0"/><text class="ix c fg tk" x="70.8" y="469">104</text><rect class="bxb" x="101.7" y="450" width="817.7" height="28" rx="0"/><text class="ix c fg tk" x="510.5" y="469">средняя часть 1379 байт</text><rect class="bxo" x="919.4" y="450" width="6" height="28" rx="0"/><path class="lcut" d="M898.7 446L898.7 482"/><text class="ix ok r" x="920" y="500">1 байт, смещение 1483: он во втором сегменте ядра, функции это всё равно</text></g>
<g class="a e14"><circle class="bxa" cx="70.8" cy="442" r="11"/><text class="ix c fg tk ns" x="70.8" y="446.5">3</text><circle class="bxb" cx="510.8" cy="442" r="11"/><text class="ix c fg tk ns" x="510.8" y="446.5">2</text><circle class="bxo" cx="912" cy="442" r="11"/><text class="ix c fg tk ns" x="912" y="446.5">1</text></g>
<g class="a e15"><text class="sm" x="40" y="524">calc: 104 + 1379 + 1 = 1484</text></g>
<g class="a e16"><text class="cap" x="52" y="550">на проводе</text><text class="cap" x="520" y="550">ответ сервера</text><text class="cap" x="730" y="550">у сервера есть</text></g>
<g class="a e17"><circle class="bxa" cx="52" cy="574" r="11"/><text class="ix c fg tk ns" x="52" y="578.5">1</text><text class="mk" x="74" y="579">1@1483</text><text class="sm mu" x="250" y="579">последний байт уходит первым</text><text class="m" x="520" y="579">ACK 1, [1484,1485)</text><rect class="bx" x="730" y="569" width="190" height="10" rx="0"/><rect class="bxo" x="919.9" y="569" width="4" height="10" rx="0"/></g>
<g class="a e18"><circle class="bxa" cx="52" cy="614" r="11"/><text class="ix c fg tk ns" x="52" y="618.5">2</text><text class="mk" x="74" y="619">1379@104</text><text class="sm mu" x="250" y="619">байты 105…1483</text><text class="m" x="520" y="619">ACK 1, [105,1485)</text><rect class="bx" x="730" y="609" width="190" height="10" rx="0"/><rect class="bxo" x="743.3" y="609" width="176.7" height="10" rx="0"/></g>
<g class="a e19"><circle class="bxa" cx="52" cy="654" r="11"/><text class="ix c fg tk ns" x="52" y="658.5">3</text><text class="mk" x="74" y="659">104@0</text><text class="sm mu" x="250" y="659">байты 1…104</text><text class="m" x="520" y="659">ACK 1485</text><rect class="bxo" x="730" y="649" width="190" height="10" rx="0"/></g>
<g class="a e20"><text class="sm" x="40" y="700">блок слева растёт: сначала один последний номер, потом от 105 до конца, потом всё подтверждено</text></g>
<g class="a e21"><rect class="bxo" x="40" y="716" width="430" height="34" rx="6"/><text class="sm tk" x="52" y="738">приложение: снова одно чтение, 1484</text></g>
</svg>
