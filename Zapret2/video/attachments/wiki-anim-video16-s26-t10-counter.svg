<g class="a e5"><rect class="bxr" x="715" y="68" width="205" height="48" rx="6"/><text class="mk" x="729" y="99">4</text><text class="sm tk" x="755" y="99">запрос клиента</text></g>
<g class="a e6"><text class="cap" x="40" y="148">счётчик пакетов клиента</text></g>
<g class="a e7"><rect class="bxo" x="40" y="158" width="205" height="36" rx="6"/><text class="mk ok c" x="142" y="182">1</text></g>
<g class="a e8"><rect class="bx" x="265" y="158" width="205" height="36" rx="6"/><text class="m mu c" x="367" y="182">—</text></g>
<g class="a e9"><rect class="bxo" x="490" y="158" width="205" height="36" rx="6"/><text class="mk ok c" x="592" y="182">2</text></g>
<g class="a e10"><rect class="bxb" x="715" y="158" width="205" height="36" rx="6"/><text class="mk amb c" x="817" y="182">3</text></g>
<g class="a e11"><text class="sm" x="40" y="222">Номер 4 и счётчик 3 различаются, потому что номер 2 в общей очереди занял ответ сервера.</text></g>
<g class="a e12"><text class="cap" x="40" y="262">что происходит с выброшенным запросом</text></g>
<g class="a e13"><rect class="bxr" x="40" y="274" width="200" height="48" rx="6"/><text class="sm tk c" x="140" y="296">запрос, номер 4</text><text class="ix c" x="140" y="314">стратегия вернула DROP</text></g>
