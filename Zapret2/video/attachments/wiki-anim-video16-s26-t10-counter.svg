<svg xmlns="http://www.w3.org/2000/svg" class="v16-s26-t10-counter" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="v16-s26-t10-counter-t v16-s26-t10-counter-d">
<title id="v16-s26-t10-counter-t">Сравнение: t10, счётчик равен трём</title>
<desc id="v16-s26-t10-counter-d">Для сравнения опыт t10: выброшен запрос, но не первый пакет. Номера общей очереди: 1, SYN клиента; 2, SYN-ACK сервера; 3, подтверждение клиента; 4, запрос клиента. Счётчик пакетов клиента: SYN первый, подтверждение второе, запрос третий (у пакета сервера счётчик клиента не меняется). Запрос с номером 4 и счётчик 3 различаются, потому что номер 2 в общей очереди занял ответ сервера. Счётчик равен трём, условие «равен единице» не выполнено, приёмщик получает обычный DROP, в журнале пакет id=4 и слово drop. Проверь себя: выброшено подтверждение клиента, сработает ли хитрость? Нет, счётчик 2. А SYN клиента? Да, счётчик 1. В нашем тесте хитрость сработала и в трёх опытах на стороне сервера, там первым идёт SYN-ACK: строка про обходной путь есть в четырёх записанных прогонах, в t40 и этих трёх. Итог: слово drop в журнале бывает разным. В t10 выброшенный запрос заменили двумя вставками. В t40 выброшенный первый пакет заменили негодной копией, по-настоящему он не выбрасывался. Куда делась копия, мы не выяснили, а причина подмены только в комментарии автора.</desc>
