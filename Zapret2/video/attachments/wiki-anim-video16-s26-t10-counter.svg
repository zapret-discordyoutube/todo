<g class="a e15"><path class="lf" d="M644 298L666 298"/><polygon class="hf" points="676,298 666,303 666,293"/><rect class="bxr" x="680" y="274" width="240" height="48" rx="6"/><text class="sm tk rej c" x="800" y="296">обычный DROP</text><text class="ix c" x="800" y="314">без подмены копией</text></g>
<g class="a e16"><rect class="bxr" x="40" y="334" width="580" height="30" rx="4"/><text class="m" x="52" y="354">packet: id=4 drop</text><text class="sm" x="640" y="354">в журнале номер 4 и слово drop</text></g>
<g class="a e17"><rect class="bx" x="40" y="388" width="430" height="80" rx="8"/><text class="sm tk" x="56" y="412">Проверь себя: выброшено ACK клиента,</text><text class="sm" x="56" y="434">хитрость сработает? Нет, счётчик 2.</text><text class="sm" x="56" y="452">А SYN клиента? Да, счётчик 1.</text></g>
<g class="a e18"><rect class="bxa" x="490" y="388" width="430" height="80" rx="8"/><text class="sm tk" x="506" y="412">Серверные опыты: хитрость сработала</text><text class="sm" x="506" y="434">и в трёх опытах со стороны сервера, там</text><text class="sm" x="506" y="452">первым идёт SYN-ACK (всего 4 прогона).</text></g>
<g class="a e19"><text class="cap" x="40" y="494">слово drop в журнале бывает разным</text></g>
<g class="a e20"><rect class="bxa" x="40" y="506" width="430" height="100" rx="8"/><text class="sm tk" x="56" y="532">опыт t10</text><text class="sm" x="56" y="556">drop заменили двумя вставками:</text><text class="sm" x="56" y="578">запрос 250 Б ушёл как 104 + 146</text></g>
<g class="a e21"><rect class="bxb" x="490" y="506" width="430" height="100" rx="8"/><text class="sm tk" x="506" y="532">опыт t40</text><text class="sm" x="506" y="556">drop заменили негодной копией:</text><text class="sm" x="506" y="578">по-настоящему пакет не выбрасывался</text></g>
<g class="a e22"><text class="sm mu" x="40" y="628">Куда делась копия, мы не выяснили, а причина подмены только в комментарии автора.</text></g>
</svg>
