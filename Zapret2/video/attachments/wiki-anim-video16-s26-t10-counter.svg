<g><text class="cap" x="40" y="26">для сравнения опыт t10: выброшен запрос, но не первый пакет</text></g>
<g class="a e1"><text class="cap" x="40" y="58">номера в общей очереди</text></g>
<g class="a e2"><rect class="bxa" x="40" y="68" width="205" height="48" rx="6"/><text class="mk" x="54" y="99">1</text><text class="sm" x="80" y="99">SYN клиента</text></g>
<g class="a e3"><rect class="bx" x="265" y="68" width="205" height="48" rx="6"/><text class="mk" x="279" y="99">2</text><text class="sm" x="305" y="99">SYN-ACK сервера</text></g>
