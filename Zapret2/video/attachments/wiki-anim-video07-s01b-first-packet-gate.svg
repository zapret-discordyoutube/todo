<svg xmlns="http://www.w3.org/2000/svg" class="v07-s01b-first-packet-gate" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v07-s01b-first-packet-gate-t v07-s01b-first-packet-gate-d">
<title id="v07-s01b-first-packet-gate-t">Инспектор решает по первому пакету</title>
<desc id="v07-s01b-first-packet-gate-d">Инспектор этого выпуска, игрушка нашего проекта, в отличие от прежнего ждёт первый пакет с данными и решает один раз на всё соединение, поэтому подделка, которая идёт первой, получает разрешение, а настоящий пакет проходит мимо нечитаемой серой тенью, и дальше подделке нужны условия, чтобы не доехать до сервера или быть выброшенной им, иначе сервер примет её за данные и соединение сломается.</desc>
