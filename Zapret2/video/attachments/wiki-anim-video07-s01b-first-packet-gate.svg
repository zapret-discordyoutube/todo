<rect class="bg" x="0" y="0" width="960" height="580"/>
<g><text class="cap" x="40" y="26">инспектор на входе в роутер: игрушка нашего проекта</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="430" height="92" rx="8"/><text class="tk sm mu" x="56" y="66">прежний игрушечный инспектор</text><text class="sm" x="56" y="90">смотрит каждый пакет отдельно,</text><text class="sm" x="56" y="110">ничего не помнит</text></g>
<g class="a e2"><rect class="bxa" x="490" y="40" width="430" height="92" rx="8"/><text class="tk sm" x="506" y="66">инспектор этого выпуска</text><text class="sm" x="506" y="90">ждёт первый пакет с данными, решает один раз,</text><text class="sm" x="506" y="110">решение действует на всё соединение</text></g>
<g class="a e3"><rect class="bxs" x="40" y="212" width="90" height="60" rx="6"/><text class="tk sm c" x="85" y="246">клиент</text><path class="lm" d="M130 242L340 242"/><rect class="bx" x="340" y="198" width="400" height="88" rx="6"/><text class="tk sm" x="396" y="220">роутер</text><path class="lm" d="M740 242L800 242"/><rect class="bxs" x="800" y="212" width="120" height="60" rx="6"/><text class="tk sm c" x="860" y="246">сервер</text></g>
<g class="a e4"><rect class="bxa" x="328" y="220" width="24" height="44" rx="4"/><text class="tk sm acc c" x="340" y="246">◉</text><text class="sm acc" x="300" y="186">окошко инспектора</text></g>
<g class="a e5"><rect class="bxb" x="232" y="230" width="78" height="24" rx="4"/><text class="mk amb c" x="271" y="247">подделка</text></g>
<g class="a e6"><rect class="bxa" x="138" y="230" width="80" height="24" rx="4"/><text class="ix fg c" x="178" y="247">настоящий</text></g>
<g class="a e7"><path class="lo" d="M300 154 l8 9 l16 -20"/><text class="sm ok tk" x="336" y="156">в подделке имя разрешённое: разрешено</text></g>
<g class="a e8"><rect class="bxs" x="76" y="274" width="20" height="14" rx="3"/><path class="lm" d="M80 274 v-5 a6 6 0 0 1 12 0 v5"/><text class="sm tk" x="106" y="286">решено на всё соединение</text></g>
<g class="a e9"><rect class="bxd" x="396" y="238" width="80" height="24" rx="4"/><text class="ix mu c" x="436" y="255">настоящий</text><text class="sm" x="490" y="250">серая тень: проходит мимо</text><text class="sm" x="490" y="270">окошка, его уже не читают</text></g>
<g class="a e10"><path class="lb" d="M250 262L391.4 344.9"/><polygon class="hb" points="400,350 388.8,349.3 393.9,340.6"/></g>
<g class="a e11"><rect class="bxb" x="320" y="352" width="320" height="36" rx="8"/><text class="tk sm c" x="480" y="375">условия подделки: разбор дальше</text></g>
<g class="a e12"><path class="lf" d="M400 390L249.7 429.5"/><polygon class="hf" points="240,432 248.4,424.6 250.9,434.3"/><path class="lf" d="M560 390L690.4 429.1"/><polygon class="hf" points="700,432 689,433.9 691.9,424.3"/></g>
<g class="a e13"><rect class="bxo" x="40" y="434" width="400" height="46" rx="8"/><text class="tk sm c" x="240" y="463">не доедет до сервера</text></g>
<g class="a e14"><rect class="bxo" x="520" y="434" width="400" height="46" rx="8"/><text class="tk sm c" x="720" y="463">сервер сам её выбросит</text></g>
<g class="a e15"><rect class="bxr" x="40" y="506" width="880" height="48" rx="8"/><text class="tk sm rej c" x="480" y="536">если сервер примет подделку за данные: соединение сломано</text></g>
