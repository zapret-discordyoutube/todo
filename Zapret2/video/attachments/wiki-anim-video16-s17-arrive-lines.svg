<svg xmlns="http://www.w3.org/2000/svg" class="v16-s17-arrive-lines" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="v16-s17-arrive-lines-t v16-s17-arrive-lines-d">
<title id="v16-s17-arrive-lines-t">Пакет номер четыре входит в программу</title>
<desc id="v16-s17-arrive-lines-d">Пакет номер четыре входит в программу: три строки журнала опыта t10. Строка 90 от приёмщика (nfqws.c:316): packet id=4 len=302 mark=00000000 ifin=(0) ifout=c0(3). Строка 91 от движка (desync.c:144), заголовок IP по полям: адреса 10.1.0.1 → 10.2.0.2, протокол tcp, время жизни 64, порты 34544 → 443, флаги A и P (подтверждение и «протолкнуть данные»). Строка 92 от движка (desync.c:160): TCP len=250 и первые байты 16 03 01 00 F5, это начало записи TLS: 16 тип, 03 01 версия, 00 F5 длина записи; 0x00F5 = 245, 245 + 5 байт заголовка записи = 250, противоречия нет. Дальше проходная (nfqws.c:157) проверяет метку: mark = 00000000, бита программы нет, и пакет идёт к движку dpi_desync_packet (desync.c:2232).</desc>
