.v16-s17-arrive-lines .hf{fill:var(--fg2)}.v16-s17-arrive-lines .ha{fill:var(--acc)}.v16-s17-arrive-lines .hr{fill:var(--rej)}.v16-s17-arrive-lines .hm{fill:var(--mute)}.v16-s17-arrive-lines .hb{fill:var(--amb)}
