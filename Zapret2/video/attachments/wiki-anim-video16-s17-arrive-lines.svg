<rect class="bg" x="0" y="0" width="960" height="500"/>
<g><text class="cap" x="40" y="26">пакет номер четыре входит в программу: три строки журнала</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="52" rx="8"/><text class="ix" x="54" y="68">90</text><text class="m" x="86" y="68">packet: id=4 len=302 mark=00000000 ifin=(0) ifout=c0(3)</text><text class="tk sm r" x="908" y="64">приёмщик</text><text class="ix r" x="908" y="82">nfqws.c:316</text></g>
<g class="a e2 tr"><rect class="bxn" x="37" y="37" width="886" height="58" rx="8"/></g>
<g class="a e3"><rect class="bx" x="40" y="104" width="880" height="128" rx="8"/><text class="ix" x="54" y="132">91</text><text class="m" x="86" y="132">IP4: 10.1.0.1 =&gt; 10.2.0.2 proto=tcp ttl=64 sport=34544 dport=443 flags=AP</text><text class="tk sm r" x="908" y="128">движок</text><text class="ix r" x="908" y="146">desync.c:144</text></g>
<g class="a e4 tr"><rect class="bxn" x="37" y="101" width="886" height="134" rx="8"/></g>
<g class="a e5"><rect class="bxa" x="54" y="156" width="186" height="68" rx="6"/><text class="ix" x="64" y="175">адреса</text><text class="mk" x="64" y="205">10.1.0.1 → 10.2.0.2</text></g>
<g class="a e6"><rect class="bxa" x="248" y="156" width="88" height="68" rx="6"/><text class="ix" x="258" y="175">протокол</text><text class="mk" x="258" y="205">tcp</text></g>
<g class="a e7"><rect class="bxa" x="344" y="156" width="110" height="68" rx="6"/><text class="ix" x="354" y="175">время жизни</text><text class="mk" x="354" y="205">ttl 64</text></g>
<g class="a e8"><rect class="bxa" x="462" y="156" width="128" height="68" rx="6"/><text class="ix" x="472" y="175">порты</text><text class="mk" x="472" y="205">34544 → 443</text></g>
<g class="a e9"><rect class="bxb" x="598" y="156" width="308" height="68" rx="6"/><text class="ix" x="608" y="175">флаги</text><text class="sm" x="608" y="196">A: подтверждение</text><text class="sm" x="608" y="214">P: протолкнуть данные</text></g>
<g class="a e10"><rect class="bx" x="40" y="244" width="880" height="128" rx="8"/><text class="ix" x="54" y="272">92</text><text class="m" x="86" y="272">TCP: len=250 : 16 03 01 00 F5 01 00 00 F1 03 03 0B ...</text><text class="tk sm r" x="908" y="268">движок</text><text class="ix r" x="908" y="286">desync.c:160</text></g>
<g class="a e11 tr"><rect class="bxn" x="37" y="241" width="886" height="134" rx="8"/></g>
<g class="a e12"><rect class="bxo" x="86" y="286" width="48" height="32" rx="5"/><text class="hx c ns" x="110" y="308">16</text></g>
<g class="a e13"><rect class="bxa" x="138" y="286" width="48" height="32" rx="5"/><text class="hx c ns" x="162" y="308">03</text></g>
<g class="a e14"><rect class="bxa" x="190" y="286" width="48" height="32" rx="5"/><text class="hx c ns" x="214" y="308">01</text></g>
<g class="a e15"><rect class="bxb" x="242" y="286" width="48" height="32" rx="5"/><text class="hx c ns" x="266" y="308">00</text></g>
<g class="a e16"><rect class="bxb" x="294" y="286" width="48" height="32" rx="5"/><text class="hx c ns" x="318" y="308">F5</text></g>
<g class="a e17"><text class="sm c" x="110" y="340">тип</text><text class="sm c" x="188" y="340">версия</text><text class="sm c" x="292" y="340">длина записи</text><path class="lm" d="M88 324L130 324"/><path class="lm" d="M138 324L238 324"/><path class="lm" d="M242 324L342 324"/></g>
<g class="a e18"><text class="sm" x="374" y="302">00 F5 в шестнадцатеричной записи это 245</text></g>
<g class="a e19"><text class="sm tk" x="374" y="326">245 + 5 байт самого заголовка записи = 250</text></g>
<g class="a e20"><text class="sm" x="374" y="350">тот же запрос: len=250 в строке; противоречия нет</text></g>
<g class="a e21"><rect class="bxa" x="40" y="404" width="270" height="76" rx="8"/><text class="tk sm" x="54" y="428">проходная</text><text class="hx" x="54" y="450">processPacketData</text><text class="ix" x="54" y="468">nfqws.c:157 проверка метки</text></g>
<g class="a e22"><path class="lf" d="M310 442L334.0 442.0"/><polygon class="hf" points="344,442 334.0,447.0 334.0,437.0"/></g>
<g class="a e23"><rect class="bxo" x="350" y="404" width="280" height="76" rx="8"/><text class="hx" x="364" y="428">mark=00000000</text><text class="tk sm" x="364" y="450">бита программы нет</text><text class="ix" x="364" y="468">(по умолчанию бит 0x40000000)</text></g>
<g class="a e24"><path class="lf" d="M630 442L654.0 442.0"/><polygon class="hf" points="664,442 654.0,447.0 654.0,437.0"/></g>
<g class="a e25"><rect class="bxa" x="670" y="404" width="250" height="76" rx="8"/><text class="tk sm" x="684" y="428">в движок</text><text class="hx" x="684" y="450">dpi_desync_packet</text><text class="ix" x="684" y="468">desync.c:2232</text></g>
