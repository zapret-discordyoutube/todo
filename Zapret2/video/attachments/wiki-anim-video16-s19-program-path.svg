.v16-s19-program-path .hf{fill:var(--fg2)}.v16-s19-program-path .ha{fill:var(--acc)}.v16-s19-program-path .hr{fill:var(--rej)}.v16-s19-program-path .hm{fill:var(--mute)}.v16-s19-program-path .hb{fill:var(--amb)}
