<g class="a e14"><rect class="bxo" x="640" y="314" width="280" height="110" rx="8"/><text class="tk sm" x="654" y="338">ядро</text><text class="hx" x="654" y="358">nfq_set_verdict2</text><text class="sm" x="654" y="380">получает вердикт и</text><text class="sm" x="654" y="398">выпускает или выбрасывает</text><text class="ix" x="654" y="416">nfqws.c:331, 334, 338</text><path class="lf" d="M620 369L626.0 369.0"/><polygon class="hf" points="636,369 626.0,374.0 626.0,364.0"/></g>
<g class="a e15"><text class="tk sm" x="40" y="450">запуск один раз; дальше для каждого пакета одна и та же цепочка до вердикта</text></g>
