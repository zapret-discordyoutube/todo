<svg xmlns="http://www.w3.org/2000/svg" class="v16-s19-program-path" viewBox="0 0 960 462" width="960" height="462" role="img" aria-labelledby="v16-s19-program-path-t v16-s19-program-path-d">
<title id="v16-s19-program-path-t">Путь пакета по программе</title>
<desc id="v16-s19-program-path-d">Путь по программе nfqws2 в Linux, итог второй части. Один раз при запуске, по порядку (nfqws.c): урезать права, dropcaps (463-464); создать сырые сокеты, rawsend_preinit (474); запустить Lua, lua_init (486); подготовить буферы, malloc (498); и только потом создать очередь, nfq_init (510). Дальше на каждый пакет: главный цикл nfq_main ждёт, читает сообщение ядра (recv, 566) и по одному передаёт библиотеке (nfq_handle_packet, 578); приёмщик nfq_cb (285) читает номер, метку, байты и интерфейсы, пишет строку журнала и вызывает проходную; проходная processPacketData (154) проверяет метку и передаёт пакет движку; движок dpi_desync_packet (desync.c:2232) разбирает пакет, находит профиль и запускает стратегии на Lua. Ответ стратегий приёмщик превращает в один из трёх штампов, PASS, MODIFY или DROP (nfqws.c:327-338), и отдаёт ядру вызовом nfq_set_verdict2 (nfqws.c:331, 334, 338).</desc>
<style>.v16-s19-program-path{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
