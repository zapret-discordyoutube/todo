<rect class="bg" x="0" y="0" width="960" height="508"/>
<g><text class="cap" x="40" y="24">игрушка, выдуманный пример: письмо из трёх страниц</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="260" height="54" rx="6"/><circle class="bxa" cx="68" cy="67" r="13"/><text class="tk c ns" x="68" y="72">1</text><text class="mid" x="94" y="73">Встретимся</text></g>
<g class="a e2"><rect class="bx" x="350" y="40" width="260" height="54" rx="6"/><circle class="bxa" cx="378" cy="67" r="13"/><text class="tk c ns" x="378" y="72">2</text><text class="mid" x="404" y="73">у фонтана</text></g>
<g class="a e3"><rect class="bx" x="660" y="40" width="260" height="54" rx="6"/><circle class="bxa" cx="688" cy="67" r="13"/><text class="tk c ns" x="688" y="72">3</text><text class="mid" x="714" y="73">в шесть</text></g>
<g class="a e4"><text class="ix mu" x="40" y="118">так написано, номер страницы в углу</text></g>
<g class="a e5"><text class="sm tk" x="40" y="152">почтальон принёс страницы в порядке: три, один, два</text></g>
<g class="a e6"><rect class="bxb" x="40" y="164" width="260" height="44" rx="6"/><text class="ix mu" x="52" y="192">пришла 1-й:</text><circle class="bxb" cx="174" cy="186" r="12"/><text class="tk c ns" x="174" y="191">3</text><text class="sm tk" x="196" y="192">в шесть</text></g>
<g class="a e7"><rect class="bxb" x="350" y="164" width="260" height="44" rx="6"/><text class="ix mu" x="362" y="192">пришла 2-й:</text><circle class="bxb" cx="484" cy="186" r="12"/><text class="tk c ns" x="484" y="191">1</text><text class="sm tk" x="506" y="192">Встретимся</text><path class="lm" d="M310 186L334.0 186.0"/><polygon class="hm" points="344,186 334.0,191.0 334.0,181.0"/></g>
<g class="a e8"><rect class="bxb" x="660" y="164" width="260" height="44" rx="6"/><text class="ix mu" x="672" y="192">пришла 3-й:</text><circle class="bxb" cx="794" cy="186" r="12"/><text class="tk c ns" x="794" y="191">2</text><text class="sm tk" x="816" y="192">у фонтана</text><path class="lm" d="M620 186L644.0 186.0"/><polygon class="hm" points="654,186 644.0,191.0 644.0,181.0"/></g>
<g class="a e9"><text class="big c" x="480" y="246">какой из писарей похож на настоящего наблюдателя?</text></g>
<g class="a e10"><rect class="bx" x="40" y="268" width="430" height="150" rx="6"/><text class="sm tk" x="54" y="292">писарь 1: читает как пришло</text><text class="sm" x="54" y="314">страницы в порядке прихода</text><circle class="bxb" cx="66" cy="346" r="13"/><text class="tk c ns" x="66" y="351">3</text><circle class="bxb" cx="102" cy="346" r="13"/><text class="tk c ns" x="102" y="351">1</text><circle class="bxb" cx="138" cy="346" r="13"/><text class="tk c ns" x="138" y="351">2</text><path class="lm" d="M154 346L164.0 346.0"/><polygon class="hm" points="174,346 164.0,351.0 164.0,341.0"/><rect class="bxb" x="182" y="330" width="280" height="32" rx="4"/><text class="sm tk c" x="322" y="351">в шесть Встретимся у фонтана</text><text class="ix mu" x="54" y="392">записывает на доске:</text><text class="sm" x="54" y="408">«в шесть Встретимся у фонтана»</text></g>
<g class="a e11"><rect class="bx" x="490" y="268" width="430" height="150" rx="6"/><text class="sm tk" x="504" y="292">писарь 2: сначала раскладывает по номерам</text><text class="sm" x="504" y="314">страницы по номерам</text><circle class="bxa" cx="516" cy="346" r="13"/><text class="tk c ns" x="516" y="351">1</text><circle class="bxa" cx="552" cy="346" r="13"/><text class="tk c ns" x="552" y="351">2</text><circle class="bxa" cx="588" cy="346" r="13"/><text class="tk c ns" x="588" y="351">3</text><path class="lm" d="M604 346L614.0 346.0"/><polygon class="hm" points="624,346 614.0,351.0 614.0,341.0"/><rect class="bxa" x="632" y="330" width="280" height="32" rx="4"/><text class="sm tk c" x="772" y="351">Встретимся у фонтана в шесть</text><text class="ix mu" x="504" y="392">записывает на доске:</text><text class="sm" x="504" y="408">«Встретимся у фонтана в шесть»</text></g>
<g class="a e12"><rect class="bxd" x="40" y="436" width="880" height="58" rx="6"/><text class="sm tk" x="52" y="458">мы не знаем, какой из них настоящий; о настоящем ТСПУ мы ничего не утверждаем</text><text class="sm" x="52" y="480">игрушечные читатели обоих видов будут в конце выпуска</text></g>
