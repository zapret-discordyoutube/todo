<title id="video06-s01-three-pages-t">Письмо из трёх страниц и два писаря</title>
<desc id="video06-s01-three-pages-d">Выдуманный пример: письмо из трёх страниц, на каждой в углу номер, почтальон приносит страницы в порядке три, один, два, первый писарь читает их как пришли и записывает «в шесть Встретимся у фонтана», второй сначала раскладывает по номерам и записывает «Встретимся у фонтана в шесть», а какой из них похож на настоящего наблюдателя, мы не знаем.</desc>
