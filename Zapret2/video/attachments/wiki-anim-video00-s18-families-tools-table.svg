<svg xmlns="http://www.w3.org/2000/svg" class="v00-s18-families-tools-table" viewBox="0 0 960 652" width="960" height="652" role="img" aria-labelledby="v00-s18-families-tools-table-t v00-s18-families-tools-table-d">
<title id="v00-s18-families-tools-table-t">Семьи, файлы и выпуски</title>
<desc id="v00-s18-families-tools-table-d">Все семьи приёмов разложены в одну таблицу: семья, названия стратегий, файл на Lua и выпуск курса, три основные семьи резать, перемешать и подделывать идут первыми, дальше пары, фокусы рукопожатия, другие слои, ротация и обфускация, у служебных drop и send отдельного выпуска нет, а четыре помощника вокруг программы тоже привязаны к своим выпускам.</desc>
