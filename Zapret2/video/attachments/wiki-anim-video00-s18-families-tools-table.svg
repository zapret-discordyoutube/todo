<g><text class="cap" x="24" y="24">всё в одной таблице: семья, стратегии, файл Lua, выпуск</text></g>
<g><text class="cap" x="32" y="58">семья</text><text class="cap" x="228" y="58">стратегии</text><text class="cap" x="574" y="58">выпуск курса</text></g>
<g class="a e1"><rect class="bxo" x="24" y="68" width="912" height="24" rx="6"/><text class="lgk" x="34" y="85">zapret-antidpi.lua: библиотека стратегий</text></g>
<g class="a e2"><rect class="bx" x="24" y="96" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="117">резать</text><text class="lg" x="228" y="117">multisplit</text><text class="sm tk" x="574" y="117">«multisplit: резать на части»</text></g>
<g class="a e3"><rect class="bx" x="24" y="132" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="153">перемешать</text><text class="lg" x="228" y="153">multidisorder</text><text class="sm tk" x="574" y="153">«Перемешать: disorder»</text></g>
<g class="a e4"><rect class="bx" x="24" y="168" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="189">подделывать</text><text class="lg" x="228" y="189">fake</text><text class="sm tk" x="574" y="189">«Фейк и его условия»</text></g>
<g class="a e5"><rect class="bx" x="24" y="204" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="225">пары</text><text class="lg" x="228" y="225">fakedsplit, fakeddisorder, hostfakesplit</text><text class="sm tk" x="574" y="225">«Резать и подделывать вместе»</text></g>
<g class="a e6"><rect class="bx" x="24" y="240" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="261">фокусы рукопожатия</text><text class="lg" x="228" y="261">syndata, rst, synack, oob, …</text><text class="sm tk" x="574" y="261">«Фокусы рукопожатия»</text></g>
<g class="a e7"><rect class="bx" x="24" y="276" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="297">другие слои</text><text class="lg" x="228" y="297">http_domcase, udplen, dht_dn, pktmod</text><text class="sm tk" x="574" y="297">«Другие слои»</text></g>
<g class="a e8"><rect class="bxg" x="24" y="312" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="333">служебные</text><text class="lg" x="228" y="333">drop, send</text><text class="sm tk" x="574" y="333">отдельного выпуска нет</text></g>
<g class="a e9"><rect class="bxo" x="24" y="350" width="912" height="24" rx="6"/><text class="lgk" x="34" y="367">zapret-auto.lua: автоматика</text></g>
<g class="a e10"><rect class="bx" x="24" y="378" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="399">ротация</text><text class="lg" x="228" y="399">circular</text><text class="sm" x="574" y="399">выпуск про автоматическую смену стратегий</text></g>
<g class="a e11"><rect class="bxo" x="24" y="416" width="912" height="24" rx="6"/><text class="lgk" x="34" y="433">zapret-obfs.lua: обфускация</text></g>
<g class="a e12"><rect class="bx" x="24" y="444" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="465">обфускация</text><text class="lg" x="228" y="465">wgobfs, ippxor, udp2icmp, synhide</text><text class="sm" x="574" y="465">выпуск про обфускацию</text></g>
<g class="a e13"><rect class="bxb" x="24" y="482" width="912" height="24" rx="6"/><text class="sm tk" x="34" y="499">вокруг программы: остальные помощники, ротация уже выше</text></g>
<g class="a e14"><rect class="bx" x="24" y="510" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="531">blockcheck2</text><text class="sm" x="228" y="531">перебирает стратегии за вас</text><text class="sm" x="574" y="531">выпуск про blockcheck2</text></g>
<g class="a e15"><rect class="bx" x="24" y="546" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="567">установка</text><text class="sm" x="228" y="567">включается руками</text><text class="sm" x="574" y="567">выпуск про установку и запуск</text></g>
<g class="a e16"><rect class="bx" x="24" y="582" width="912" height="32" rx="5"/><text class="sm tk" x="32" y="603">журнал</text><text class="sm" x="228" y="603">решает споры</text><text class="sm tk" x="574" y="603">«Читаем и отлаживаем стратегии»</text></g>
<g class="a e17"><text class="sm tk" x="24" y="638">все приёмы это функции на Lua, их вызывают по имени</text></g>
