<g class="a e14"><text class="mt mu" x="10" y="354">seq 1</text><text class="mt mu r" x="950" y="354">seq 105</text></g>
<g class="a e15"><rect class="bxo" x="10" y="372" width="940" height="62" rx="8"/><text class="tk" x="24" y="398">Приёмник видит: пакет 2 начинается с номера 105, ровно там, где закончился пакет 1.</text><text class="tk" x="24" y="422">Он склеивает куски по номерам: все 250 байт на месте, запрос получен целиком.</text></g>
<g class="a e16"><text class="sm mu" x="10" y="460">Имя сайта это не просто текст в пакете, а 15 байт с определёнными номерами в потоке.</text></g>
