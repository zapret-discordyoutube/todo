<svg xmlns="http://www.w3.org/2000/svg" class="v02-s09-ribbon-name-cut" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v02-s09-ribbon-name-cut-t v02-s09-ribbon-name-cut-d">
<title id="v02-s09-ribbon-name-cut-t">Лента байтов и имя сайта</title>
<desc id="v02-s09-ribbon-name-cut-d">Запрос в 250 байт это лента байтов с номерами 1–250 (сырые 3 164 320 784–3 164 321 033); имя www.example.com занимает байты 98–112 (с нуля 97–111); при разрезании в середине слова пакет 1 несёт байты 1–104 с www.exa, пакет 2 байты 105–250 с mple.com, и приёмник склеивает их по номерам в целые 250 байт.</desc>
