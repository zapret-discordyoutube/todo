<svg xmlns="http://www.w3.org/2000/svg" class="v00-s16-cut" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="v00-s16-cut-t v00-s16-cut-d">
<title id="v00-s16-cut-t">Резка: один пакет становится двумя</title>
<desc id="v00-s16-cut-d">Резка делит наше приветствие в 250 байт на два пакета, в первом 104 байта, во втором 146, как фраза на двух открытках, и в нашем тесте сервер получил все 250 байт, ровно столько, сколько ушло.</desc>
