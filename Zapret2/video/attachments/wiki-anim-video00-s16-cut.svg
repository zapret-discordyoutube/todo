<g class="a e1"><rect class="bxb" x="24" y="40" width="196" height="26" rx="13.0"/><text class="sm tk c" x="122" y="58">пример выдуманный</text></g>
<g class="a e2"><rect class="pl" x="24" y="78" width="200" height="60" rx="6"/><rect class="bxs" x="198" y="86" width="16" height="12" rx="2"/><path class="lm" d="M36 124L114 124"/><text class="sm tk" x="38" y="106">встретимся у</text><rect class="pl" x="238" y="78" width="200" height="60" rx="6"/><rect class="bxs" x="412" y="86" width="16" height="12" rx="2"/><path class="lm" d="M250 124L328 124"/><text class="sm tk" x="252" y="106">фонтана</text></g>
