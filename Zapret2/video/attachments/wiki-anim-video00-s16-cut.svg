<g class="a e5"><rect class="bxa" x="24" y="194" width="375.2" height="56" rx="6"/><text class="sm tk c" x="211.6" y="218">пакет 1</text><text class="sm c" x="211.6" y="238">104 байта, байты 0–103</text><text class="lgk c" x="211.6" y="270">104@0</text></g>
<g class="a e6"><rect class="bxo" x="409.2" y="194" width="526.8" height="56" rx="6"/><text class="sm tk c" x="672.6" y="218">пакет 2</text><text class="sm c" x="672.6" y="238">146 байт, байты 104–249</text><text class="lgk c" x="672.6" y="270">146@104</text></g>
<g class="a e7"><text class="sm mu" x="24" y="296">запись «длина@начало»: 104@0 это 104 байта, начиная с байта 0</text></g>
