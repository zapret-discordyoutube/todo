.v02-s06-three-ideas .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v02-s06-three-ideas .fa{fill:var(--acc);stroke:none}
.v02-s06-three-ideas .fo{fill:var(--ok);stroke:none}
.v02-s06-three-ideas .fr{fill:var(--rej);stroke:none}
.v02-s06-three-ideas .fm{fill:var(--line);stroke:none}
.v02-s06-three-ideas .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s06-three-ideas .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s06-three-ideas .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s06-three-ideas .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s06-three-ideas .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s06-three-ideas .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s06-three-ideas .hf{fill:var(--fg2)}.v02-s06-three-ideas .ha{fill:var(--acc)}.v02-s06-three-ideas .hr{fill:var(--rej)}.v02-s06-three-ideas .hm{fill:var(--mute)}.v02-s06-three-ideas .ho{fill:var(--ok)}
.v02-s06-three-ideas .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v02-s06-three-ideas .a{animation-duration:38s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s06-three-ideas .a{animation:none}.v02-s06-three-ideas .tr{display:none}}
