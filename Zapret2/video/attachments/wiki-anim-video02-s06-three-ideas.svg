<svg xmlns="http://www.w3.org/2000/svg" class="v02-s06-three-ideas" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="v02-s06-three-ideas-t v02-s06-three-ideas-d">
<title id="v02-s06-three-ideas-t">Три идеи TCP</title>
<desc id="v02-s06-three-ideas-d">Три идеи TCP: пронумеровать каждый байт, подтверждать получение до нужного номера и повторять те же байты, если подтверждения нет; поскольку приёмник расставляет байты по номерам, ему всё равно, пришли ли 250 байт запроса одним пакетом, двумя (104 и 146 байт) или десятью, а наблюдатель, смотрящий каждый пакет отдельно, видит только куски.</desc>
<style>.v02-s06-three-ideas{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
