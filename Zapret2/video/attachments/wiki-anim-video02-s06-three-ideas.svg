rames v02-s06-three-ideas-k11{0.0%{opacity:0}35.526%{opacity:0}36.711%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s06-three-ideas .e11{animation-name:v02-s06-three-ideas-k11}@keyframes v02-s06-three-ideas-k12{0.0%{opacity:0}38.158%{opacity:0}39.342%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s06-three-ideas .e12{animation-name:v02-s06-three-ideas-k12}@keyframes v02-s06-three-ideas-k13{0.0%{opacity:0}46.053%{opacity:0}47.237%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s06-three-ideas .e13{animation-name:v02-s06-three-ideas-k13}@keyframes v02-s06-three-ideas-k14{0.0%{opacity:0}55.263%{opacity:0}56.447%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s06-three-ideas .e14{animation-name:v02-s06-three-ideas-k14}@keyframes v02-s06-three-ideas-k15{0.0%{opacity:0}65.789%{opacity:0}66.974%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s06-three-ideas .e15{animation-name:v02-s06-three-ideas-k15}</style>
<rect class="bg" x="0" y="0" width="960" height="600"/>
<g class="a e1"><text class="cap" x="10" y="24">как сделать надёжный канал из ненадёжной сети: три идеи</text></g>
<g class="a e2"><rect class="bx" x="10" y="38" width="300" height="196" rx="9"/><text class="tk" x="24" y="66">1. нумеровать</text><text class="sm mu" x="24" y="88">каждый байт получает номер</text></g>
<g class="a e3"><rect class="bx" x="24" y="110" width="40" height="30" rx="4"/><text class="ml c" x="44" y="131">1</text><rect class="bx" x="68" y="110" width="40" height="30" rx="4"/><text class="ml c" x="88" y="131">2</text><rect class="bx" x="112" y="110" width="40" height="30" rx="4"/><text class="ml c" x="132" y="131">3</text><rect class="bxd" x="156" y="110" width="40" height="30" rx="4"/><text class="ml c" x="176" y="131">4</text><rect class="bx" x="200" y="110" width="40" height="30" rx="4"/><text class="ml c" x="220" y="131">5</text><rect class="bx" x="244" y="110" width="40" height="30" rx="4"/><text class="ml c" x="264" y="131">6</text><text class="sm c" x="160" y="168">байта 4 нет: видно по номерам</text></g>
<g class="a e4"><rect class="bxa" x="24" y="196" width="272" height="28" rx="6"/><text class="sm c acc" x="160.0" y="215">поле «порядковый номер»</text></g>
<g class="a e5"><rect class="bx" x="330" y="38" width="300" height="196" rx="9"/><text class="tk" x="344" y="66">2. подтверждать</text><text class="sm mu" x="344" y="88">до какого места всё получено</text></g>
<g class="a e6"><text class="sm mu" x="344" y="120">отправитель</text><text class="sm mu r" x="626" y="120">получатель</text><path class="lf" d="M344 132L616.0 132.0"/><polygon class="hf" points="626,132 616.0,137.0 616.0,127.0"/><path class="la" d="M626 154L354.0 154.0"/><polygon class="ha" points="344,154 354.0,149.0 354.0,159.0"/><text class="sm c acc" x="485" y="178">«получил всё до 250, жду 251»</text></g>
<g class="a e7"><rect class="bxa" x="344" y="196" width="272" height="28" rx="6"/><text class="sm c acc" x="480.0" y="215">поле «номер подтверждения»</text></g>
<g class="a e8"><rect class="bx" x="650" y="38" width="300" height="196" rx="9"/><text class="tk" x="664" y="66">3. повторять</text><text class="sm mu" x="664" y="88">если подтверждения долго нет</text></g>
<g class="a e9"><text class="sm mu" x="664" y="120">отправитель</text><text class="sm mu r" x="946" y="120">получатель</text><path class="lf" d="M664 132L790.0 132.0"/><polygon class="hf" points="800,132 790.0,137.0 790.0,127.0"/><path class="lr" d="M805 125L819 139M805 139L819 125"/><path class="lf" d="M664 154L936.0 154.0"/><polygon class="hf" points="946,154 936.0,159.0 936.0,149.0"/><text class="sm c" x="805" y="178">ответа нет: те же байты ещё раз</text></g>
<g class="a e10"><rect class="bxa" x="664" y="196" width="272" height="28" rx="6"/><text class="sm c acc" x="800.0" y="215">те же байты, тот же номер</text></g>
<g class="a e11"><text class="cap" x="10" y="266">вывод: получателю всё равно, в скольких пакетах пришёл запрос</text></g>
<g class="a e12"><text class="tk" x="10" y="298">один пакет</text><text class="sm mu" x="10" y="318">250 байт</text><rect class="bxa" x="161.0" y="282" width="778.0" height="40" rx="4"/><text class="sm mu" x="160" y="340">приёмник: байты 1–250, всё на месте</text></g>
<g class="a e13"><text class="tk" x="10" y="372">два пакета</text><text class="sm mu" x="10" y="392">104 + 146</text><rect class="bxa" x="161.0" y="356" width="322.48" height="40" rx="4"/><rect class="bxa" x="485.48" y="356" width="453.52000000000004" height="40" rx="4"/><text class="sm mu" x="160" y="414">опыт лаборатории: байты 1–104 и 105–250, каждый кусок встаёт на своё место по номеру</text></g>
<g class="a e14"><text class="tk" x="10" y="446">десять пакетов</text><text class="sm mu" x="10" y="466">пример: 10×25</text><rect class="bxa" x="161.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="239.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="317.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="395.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="473.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="551.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="629.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="707.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="785.0" y="430" width="76.0" height="40" rx="4"/><rect class="bxa" x="863.0" y="430" width="76.0" height="40" rx="4"/><text class="sm mu" x="160" y="488">пример: и десять кусков по номерам собираются в те же 250 байт</text></g>
<g class="a e15"><rect class="bxb" x="10" y="504" width="940" height="84" rx="8"/><text class="tk" x="24" y="530">Наблюдатель, который смотрит на каждый пакет отдельно,</text><text class="tk" x="24" y="552">а поток не собирает, увидит только куски.</text><text class="sm mu" x="24" y="576">Так ведёт себя наш игрушечный инспектор (модель); настоящее оборудование мы не проверяли.</text></g>
</svg>
