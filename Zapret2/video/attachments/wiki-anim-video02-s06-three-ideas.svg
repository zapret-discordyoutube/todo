.v02-s06-three-ideas .mu{fill:var(--mute)}.v02-s06-three-ideas .fg{fill:var(--fg)}.v02-s06-three-ideas .acc{fill:var(--acc)}.v02-s06-three-ideas .rej{fill:var(--rej)}.v02-s06-three-ideas .ok{fill:var(--ok)}.v02-s06-three-ideas .amb{fill:var(--amb)}
.v02-s06-three-ideas .hb{fill:var(--acc);font-weight:700}.v02-s06-three-ideas .hbr{fill:var(--rej);font-weight:700}.v02-s06-three-ideas .hbo{fill:var(--ok);font-weight:700}.v02-s06-three-ideas .hbb{fill:var(--amb);font-weight:700}
.v02-s06-three-ideas .c{text-anchor:middle}.v02-s06-three-ideas .r{text-anchor:end}
