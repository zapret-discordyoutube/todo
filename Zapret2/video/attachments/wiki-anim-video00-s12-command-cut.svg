<svg xmlns="http://www.w3.org/2000/svg" class="v00-s12-command-cut" viewBox="0 0 960 730" width="960" height="730" role="img" aria-labelledby="v00-s12-command-cut-t v00-s12-command-cut-d">
<title id="v00-s12-command-cut-t">Настоящая команда разрезана на части</title>
<desc id="v00-s12-command-cut-d">Настоящая команда нашей лаборатории разрезана на подписанные части: очередь 200, файл журнала, папка для записи, три файла Lua, условия профиля с TCP и портом 443, вызов записи пакетов и в конце вид данных со стратегией multisplit; в журнале при запуске видно, как программа поняла строку, один профиль без имени и два вызова, у записи пакетов обе стороны открыты, а у стратегии входящие закрыты, и опции программы это отдельный список от аргументов стратегии, которые пишут после её имени через двоеточие.</desc>
<style>.v00-s12-command-cut{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
