<g><text class="cap" x="24" y="24">настоящая команда нашей лаборатории, разрезанная на части</text></g>
<g><rect class="bxa" x="786" y="8" width="157" height="26" rx="13.0"/><text class="sm tk c" x="864.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bx" x="24" y="48" width="92.3" height="26" rx="5"/><text class="lgk" x="31" y="66">--qnum=200</text><text class="sm mu" x="26" y="94">очередь 200</text></g>
<g class="a e2"><rect class="bx" x="141.3" y="48" width="154.9" height="26" rx="5"/><text class="lgk" x="148.3" y="66">--debug=@nfqws.log</text><text class="sm mu" x="143.3" y="94">файл журнала</text></g>
<g class="a e3"><rect class="bx" x="312.2" y="48" width="107.9" height="26" rx="5"/><text class="lgk" x="319.2" y="66">--writable=.</text><text class="sm mu" x="314.2" y="94">папка для записи Lua</text></g>
<g class="a e4"><rect class="bx" x="24" y="116" width="217.5" height="26" rx="5"/><text class="lgk" x="31" y="134">--lua-init=@zapret-lib.lua</text><text class="sm mu" x="26" y="162">библиотека</text></g>
<g class="a e5"><rect class="bx" x="257.5" y="116" width="248.8" height="26" rx="5"/><text class="lgk" x="264.5" y="134">--lua-init=@zapret-antidpi.lua</text><text class="sm mu" x="259.5" y="162">готовые стратегии</text></g>
<g class="a e6"><rect class="bx" x="522.4" y="116" width="225.4" height="26" rx="5"/><text class="lgk" x="529.4" y="134">--lua-init=@zapret-pcap.lua</text><text class="sm mu" x="524.4" y="162">запись пакетов</text></g>
<g class="a e7"><rect class="bxa" x="24" y="184" width="139.2" height="26" rx="5"/><text class="lgk" x="31" y="202">--filter-tcp=443</text><text class="sm mu" x="26" y="230">условия профиля: TCP, порт 443</text></g>
<g class="a e8"><rect class="bxb" x="293.2" y="184" width="107.9" height="26" rx="5"/><text class="lgk" x="300.2" y="202">--in-range=a</text><text class="sm mu" x="295.2" y="230">ручка: открыто</text></g>
<g class="a e9"><rect class="bxo" x="432.8" y="184" width="311.5" height="26" rx="5"/><text class="lgk" x="439.8" y="202">--lua-desync=pcap:file=nfqws_seen.pcap</text><text class="sm mu" x="434.8" y="230">вызов: записать пакеты</text></g>
<g class="a e10"><rect class="bxb" x="24" y="252" width="107.9" height="26" rx="5"/><text class="lgk" x="31" y="270">--in-range=x</text><text class="sm mu" x="26" y="298">ручка: закрыто</text></g>
<g class="a e11"><rect class="bxb" x="162.8" y="252" width="217.5" height="26" rx="5"/><text class="lgk" x="169.8" y="270">--payload=tls_client_hello</text><text class="sm mu" x="164.8" y="298">вид данных</text></g>
<g class="a e12"><rect class="bxo" x="396.4" y="252" width="280.2" height="26" rx="5"/><text class="lgk" x="403.4" y="270">--lua-desync=multisplit:pos=midsld</text><text class="sm mu" x="398.4" y="298">стратегия опыта</text></g>
<g class="a e13"><text class="sm tk" x="24" y="340">как программа поняла строку: журнал при запуске</text></g>
<g class="a e14"><rect class="bx" x="24" y="352" width="912" height="108" rx="8"/></g>
<g class="a e15"><text class="lg" x="38" y="380">profile 1 (noname) lua pcap(file=&quot;nfqws_seen.pcap&quot; range_in=a0-a0 range_out=a0-a0 payload_type= all)</text></g>
<g class="a e16"><text class="lg" x="38" y="418">profile 1 (noname) lua multisplit(pos=&quot;midsld&quot; range_in=x0-x0 range_out=a0-a0 payload_type= tls_client_hello)</text></g>
<g class="a e17"><rect class="fo" x="434.2" y="365" width="115.6" height="21" rx="3"/><rect class="fo" x="551.7" y="365" width="123.4" height="21" rx="3"/></g>
<g class="a e18"><rect class="fr" x="402.9" y="403" width="115.6" height="21" rx="3"/><rect class="fo" x="520.3" y="403" width="123.4" height="21" rx="3"/></g>
<g class="a e19"><text class="sm tk rej c" x="460.7" y="440">x: закрыто</text><text class="sm tk ok c" x="582.1" y="440">a: открыто</text></g>
<g class="a e20"><text class="sm tk ok c" x="492" y="402">a: открыто</text><text class="sm tk ok c" x="613.4" y="402">a: открыто</text></g>
<g class="a e21"><text class="sm" x="24" y="486">один профиль без имени и два вызова; у записи пакетов открыты обе стороны, у стратегии входящие закрыты</text></g>
<g class="a e22"><text class="sm tk" x="24" y="520">запомните разницу: это два разных списка</text></g>
<g class="a e23"><rect class="bx" x="24" y="532" width="400" height="142" rx="8"/><text class="sm tk" x="40" y="558">опции программы</text><text class="lg" x="40" y="584">--qnum=200   --filter-tcp=443</text><text class="sm" x="40" y="606">относятся к программе и к профилям</text><text class="sm mu" x="40" y="628">начинаются с двух чёрточек</text></g>
