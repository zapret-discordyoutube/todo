<g class="a e18"><text class="sm" x="10" y="338">наш клиент, из записи: имя первое</text><rect class="bxb" x="10" y="346" width="80" height="32" rx="5"/><text class="hx c" x="50" y="367">00 00</text><rect class="bx" x="96" y="346" width="80" height="32" rx="5"/><text class="hx c" x="136" y="367">00 0b</text><rect class="bx" x="182" y="346" width="80" height="32" rx="5"/><text class="hx c" x="222" y="367">00 0a</text><rect class="bx" x="268" y="346" width="80" height="32" rx="5"/><text class="hx c" x="308" y="367">00 23</text><rect class="bx" x="354" y="346" width="80" height="32" rx="5"/><text class="hx c" x="394" y="367">00 16</text><rect class="bx" x="440" y="346" width="80" height="32" rx="5"/><text class="hx c" x="480" y="367">00 17</text><rect class="bx" x="526" y="346" width="80" height="32" rx="5"/><text class="hx c" x="566" y="367">00 0d</text><rect class="bx" x="612" y="346" width="80" height="32" rx="5"/><text class="hx c" x="652" y="367">00 2b</text><rect class="bx" x="698" y="346" width="80" height="32" rx="5"/><text class="hx c" x="738" y="367">00 2d</text><rect class="bx" x="784" y="346" width="80" height="32" rx="5"/><text class="hx c" x="824" y="367">00 33</text><rect class="bx" x="870" y="346" width="80" height="32" rx="5"/><text class="hx c" x="910" y="367">00 1b</text></g>
<g class="a e19"><text class="sm" x="10" y="400">условный пример другого клиента (не захвачен): имя где-то в середине</text><rect class="bx" x="10" y="408" width="80" height="32" rx="5"/><text class="hx c" x="50" y="429">00 2b</text><rect class="bx" x="96" y="408" width="80" height="32" rx="5"/><text class="hx c" x="136" y="429">00 33</text><rect class="bx" x="182" y="408" width="80" height="32" rx="5"/><text class="hx c" x="222" y="429">00 0a</text><rect class="bxb" x="268" y="408" width="80" height="32" rx="5"/><text class="hx c" x="308" y="429">00 00</text><rect class="bx" x="354" y="408" width="80" height="32" rx="5"/><text class="hx c" x="394" y="429">00 0d</text><rect class="bx" x="440" y="408" width="80" height="32" rx="5"/><text class="hx c" x="480" y="429">00 2d</text><rect class="bx" x="526" y="408" width="80" height="32" rx="5"/><text class="hx c" x="566" y="429">00 0b</text><rect class="bx" x="612" y="408" width="80" height="32" rx="5"/><text class="hx c" x="652" y="429">00 23</text><rect class="bx" x="698" y="408" width="80" height="32" rx="5"/><text class="hx c" x="738" y="429">00 1b</text><rect class="bx" x="784" y="408" width="80" height="32" rx="5"/><text class="hx c" x="824" y="429">00 16</text><rect class="bx" x="870" y="408" width="80" height="32" rx="5"/><text class="hx c" x="910" y="429">00 17</text></g>
<g class="a e20"><text class="tk" x="10" y="472">Поэтому «имя всегда в начале» сказать нельзя: нужно пройти по длинам и найти блок с типом 0.</text><text class="sm mu" x="10" y="494">Так делает и zapret2: цикл в nfq2/protocol.c:575 (TLSFindExtInHandshake) читает тип и длину и сравнивает тип.</text></g>
</svg>
