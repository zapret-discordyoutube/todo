<rect class="bg" x="0" y="0" width="960" height="500"/>
<g class="a e1"><text class="cap" x="10" y="24">пройти список расширений: от начала блока прыгаем на 4 + длина данных</text></g>
<g class="a e2"><text class="sm mu" x="10" y="62">в рамках: смещение начала блока (последняя рамка: конец данных)</text><text class="sm mu" x="10" y="82">над дугой: на сколько прыгаем; под дугой: 4 байта заголовка + длина данных</text></g>
