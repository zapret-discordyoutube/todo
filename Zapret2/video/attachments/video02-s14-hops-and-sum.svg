<svg xmlns="http://www.w3.org/2000/svg" class="v02-s14-hops-and-sum" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="v02-s14-hops-and-sum-t v02-s14-hops-and-sum-d">
<title id="v02-s14-hops-and-sum-t">Прыжки по длинам и сумма 162</title>
<desc id="v02-s14-hops-and-sum-d">Чтобы пройти список расширений, программа с каждого начала блока прыгает на 4 байта заголовка плюс длину данных: 88, 112, 120, 128, 132, 136, 140, 186, 193, 199, 241 и конец на 250; длины блоков вместе с заголовками 24 + 8 + 8 + 4 + 4 + 4 + 46 + 7 + 6 + 42 + 9 дают 162, ровно число из поля длины расширений, а 88 + 162 = 250; если разрезать сообщение посередине, проверка не сойдётся. Порядок расширений зависит от клиента: у нашего клиента имя первое, у другого (условный пример, не захвачено) оно может стоять где угодно, поэтому программа проходит по длинам и ищет блок с типом 0, как цикл в nfq2/protocol.c:575.</desc>
