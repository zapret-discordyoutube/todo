<g class="a e15"><text class="ml" x="10" y="230">24 + 8 + 8 + 4 + 4 + 4 + 46 + 7 + 6 + 42 + 9 = 162</text><text class="sm" x="10" y="254">это ровно число из поля длины расширений (смещения 86–87); а 88 + 162 = 250, конец данных</text></g>
<g class="a e16"><text class="sm mu" x="10" y="278">Если разрезать сообщение посередине, эта проверка не сойдётся.</text></g>
