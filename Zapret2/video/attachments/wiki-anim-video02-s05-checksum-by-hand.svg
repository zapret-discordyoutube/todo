pacity:0}38.158%{opacity:0}39.342%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e12{animation-name:v02-s05-csum-k12}@keyframes v02-s05-csum-k13{0.0%{opacity:0}46.053%{opacity:0}47.237%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e13{animation-name:v02-s05-csum-k13}@keyframes v02-s05-csum-k14{0.0%{opacity:0}51.316%{opacity:0}52.5%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e14{animation-name:v02-s05-csum-k14}@keyframes v02-s05-csum-k15{0.0%{opacity:0}56.579%{opacity:0}57.763%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e15{animation-name:v02-s05-csum-k15}@keyframes v02-s05-csum-k16{0.0%{opacity:0}73.684%{opacity:0}74.868%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e16{animation-name:v02-s05-csum-k16}@keyframes v02-s05-csum-k17{0.0%{opacity:0}80.263%{opacity:0}81.447%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e17{animation-name:v02-s05-csum-k17}@keyframes v02-s05-csum-k18{0.0%{opacity:0}84.211%{opacity:0}85.395%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e18{animation-name:v02-s05-csum-k18}@keyframes v02-s05-csum-k19{0.0%{opacity:0}89.474%{opacity:0}90.658%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v02-s05-csum .e19{animation-name:v02-s05-csum-k19}</style>
<rect class="bg" x="0" y="0" width="960" height="674"/>
<g><text class="cap" x="40" y="26">Контрольная сумма заголовка IP: считаем вручную, слова по 2 байта</text></g>
<g><text class="cap" x="48" y="56">слово</text><text class="cap r" x="290" y="56">сумма растёт</text><text class="cap" x="312" y="56">что это</text></g>
<g class="a e1"><text class="mk" x="48" y="90">4500</text><text class="m r" x="290" y="90">= 4500</text><text class="sm mu" x="312" y="90">версия, длина, приоритет</text></g>
<g class="a e2"><text class="mk" x="48" y="116">+ 012e</text><text class="m r" x="290" y="116">= 462e</text><text class="sm mu" x="312" y="116">длина пакета: 302</text></g>
<g class="a e3"><text class="mk" x="48" y="142">+ fa05</text><text class="m r" x="290" y="142">= 14033</text><text class="sm mu" x="312" y="142">идентификатор</text></g>
<g class="a e4"><text class="mk" x="48" y="168">+ 4000</text><text class="m r" x="290" y="168">= 18033</text><text class="sm mu" x="312" y="168">флаги: DF</text></g>
<g class="a e5"><rect class="bxb" x="40" y="176" width="520" height="24" rx="0"/><text class="mk" x="48" y="194">+ 4006</text><text class="m r" x="290" y="194">= 1c039</text><text class="sm mu" x="312" y="194">TTL 40 и протокол 06</text></g>
<g class="a e6"><text class="mk" x="48" y="220">+ 0000</text><text class="m r" x="290" y="220">= 1c039</text><text class="sm mu" x="312" y="220">сумма (на время счёта 0000)</text></g>
<g class="a e7"><text class="mk" x="48" y="246">+ 0a01</text><text class="m r" x="290" y="246">= 1ca3a</text><text class="sm mu" x="312" y="246">отправитель, начало</text></g>
<g class="a e8"><text class="mk" x="48" y="272">+ 0001</text><text class="m r" x="290" y="272">= 1ca3b</text><text class="sm mu" x="312" y="272">отправитель, конец</text></g>
<g class="a e9"><text class="mk" x="48" y="298">+ 0a02</text><text class="m r" x="290" y="298">= 1d43d</text><text class="sm mu" x="312" y="298">получатель, начало</text></g>
<g class="a e10"><text class="mk" x="48" y="324">+ 0002</text><text class="mk r" x="290" y="324">= 1d43f</text><text class="sm mu" x="312" y="324">получатель, конец</text></g>
<g class="a e11"><rect class="bx" x="600" y="56" width="320" height="78" rx="8"/><text class="tk sm" x="614" y="80">1. Сумма десяти слов</text><text class="big" x="614" y="106">1d43f</text><text class="sm mu" x="614" y="126">это 5 цифр: лишняя 1 впереди</text></g>
<g class="a e12"><rect class="bx" x="600" y="146" width="320" height="74" rx="8"/><text class="tk sm" x="614" y="170">2. Перенос в конец</text><text class="big" x="614" y="202">1 + d43f = d440</text></g>
<g class="a e13"><rect class="bxa" x="600" y="232" width="320" height="130" rx="8"/><text class="tk sm" x="614" y="256">3. Переворот каждого бита</text><text class="m" x="614" y="282">d440 = 1101 0100 0100 0000</text></g>
<g class="a e14"><text class="m" x="614" y="304">2bbf = 0010 1011 1011 1111</text></g>
<g class="a e15"><text class="tk sm ok" x="614" y="340">в заголовке записано 2b bf ✓</text></g>
<g class="a e16"><rect class="bx" x="40" y="384" width="880" height="128" rx="8"/><text class="tk sm" x="56" y="410">После роутера: TTL стал 63, слово 4006 стало 3f06, оно меньше на 0100 = 256</text><text class="sm" x="56" y="434">Сумма слов стала меньше на столько же, а после переворота битов контрольная сумма, наоборот, выросла:</text></g>
<g class="a e17"><text class="big" x="56" y="472">2bbf → 2cbf</text><text class="sm" x="300" y="471">ровно это число в записи на выходе роутера и на сервере</text></g>
<g class="a e18"><text class="sm mu" x="56" y="498">Контрольная сумма TCP не меняется (6970): она не охватывает время жизни.</text></g>
<g class="a e19"><text class="tk sm" x="40" y="542">Так считает zapret2: nfq2/checksum.c</text><rect class="bx" x="40" y="552" width="880" height="96" rx="8"/><text class="ix" x="56" y="578">109</text><text class="mk" x="100" y="578">void ip4_fix_checksum(struct ip *ip)</text><text class="ix" x="56" y="602">111</text><text class="m" x="124" y="602">ip-&gt;ip_sum = 0;</text><text class="sm mu" x="560" y="602">поле суммы на время счёта нули</text><text class="ix" x="56" y="626">112</text><text class="m" x="124" y="626">ip-&gt;ip_sum = ip4_compute_csum(ip, ip-&gt;ip_hl &lt;&lt; 2);</text></g>
</svg>
