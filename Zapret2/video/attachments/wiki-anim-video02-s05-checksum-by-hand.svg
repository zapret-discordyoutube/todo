<svg xmlns="http://www.w3.org/2000/svg" class="v02-s05-csum" viewBox="0 0 960 674" width="960" height="674" role="img" aria-labelledby="v02-s05-csum-t v02-s05-csum-d">
<title id="v02-s05-csum-t">Контрольная сумма IP вручную</title>
<desc id="v02-s05-csum-d">Контрольная сумма заголовка IP считается вручную: десять слов по два байта (4500, 012e, fa05, 4000, 4006, 0000, 0a01, 0001, 0a02, 0002, поле суммы взято за ноль) складываются с бегущей суммой до 1d43f, лишняя единица переносится в конец (1 + d43f = d440), биты переворачиваются (d440 даёт 2bbf), и это число записано в заголовке; после роутера слово 4006 стало 3f06 (на 0100 меньше), сумма слов упала, а контрольная сумма выросла: 2bbf стала 2cbf; функция ip4_fix_checksum в nfq2/checksum.c:109 обнуляет поле и считает сумму заново по ip_hl × 4 байтам.</desc>
<style>.v02-s05-csum{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s05-csum{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v02-s05-csum .bg{fill:var(--bg)}
.v02-s05-csum text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v02-s05-csum .tk{font-weight:600;fill:var(--fg)}
.v02-s05-csum .sm{font-size:14.5px}
.v02-s05-csum .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v02-s05-csum .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v02-s05-csum .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v02-s05-csum .ix{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--mute);stroke:none}
.v02-s05-csum .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v02-s05-csum .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s05-csum .mu{fill:var(--mute)}.v02-s05-csum .fg{fill:var(--fg)}.v02-s05-csum .acc{fill:var(--acc)}.v02-s05-csum .rej{fill:var(--rej)}.v02-s05-csum .ok{fill:var(--ok)}.v02-s05-csum .amb{fill:var(--amb)}
.v02-s05-csum .c{text-anchor:middle}.v02-s05-csum .r{text-anchor:end}.v02-s05-csum .ns{stroke:none}
.v02-s05-csum .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s05-csum .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v02-s05-csum .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v02-s05-csum .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v02-s05-csum .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v02-s05-csum .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v02-s05-csum .pl{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.v02-s05-csum .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
.v02-s05-csum .bxg{fill:var(--mute);fill-opacity:.2;stroke:var(--mute);stroke-width:1.4}
.v02-s05-csum .big{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:22px;font-weight:600;fill:var(--fg)}
.v02-s05-csum .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v02-s05-csum .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v02-s05-csum .fa{fill:var(--tint);stroke:none}.v02-s05-csum .fr{fill:var(--rejt);stroke:none}.v02-s05-csum .fb{fill:var(--ambt);stroke:none}.v02-s05-csum .fo{fill:var(--okt);stroke:none}
.v02-s05-csum .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s05-csum .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s05-csum .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s05-csum .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s05-csum .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s05-csum .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v02-s05-csum .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v02-s05-csum .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s05-csum .hf{fill:var(--fg2)}.v02-s05-csum .ha{fill:var(--acc)}.v02-s05-csum .hr{fill:var(--rej)}.v02-s05-csum .hm{fill:var(--mute)}.v02-s05-csum .hb{fill:var(--amb)}
.v02-s05-csum .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v02-s05-csum .a{animation-duration:38s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s05-csum .a{animation:none}.v02-s05-csum .tr{display:none}}
