<g class="a e4"><rect class="bxd" x="40" y="176" width="880" height="30" rx="6"/><text class="sm mu c" x="480" y="196">исключение одно: накладка seqovl, лишние нулевые байты перед первой частью</text></g>
<g><text class="cap" x="40" y="240">этот выпуск: фейк (fake)</text></g>
