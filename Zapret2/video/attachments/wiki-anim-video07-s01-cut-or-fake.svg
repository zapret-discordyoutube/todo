<title id="video07-s01-cut-or-fake-t">Резка или фейк</title>
<desc id="video07-s01-cut-or-fake-d">Сравнение двух классов приёмов: в прошлых выпусках программа резала настоящее приветствие в 250 байт на куски 104 и 146 и отправляла их по порядку и не по порядку, а в этом выпуске настоящий пакет остаётся целым и перед ним встаёт один лишний пакет с чужими байтами, фейк, тогда как добавочный сегмент со сроком жизни 1 из конца прошлого выпуска нёс настоящие байты и фейком ещё не был.</desc>
