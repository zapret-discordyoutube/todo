<g class="a e15"><text class="sm" x="40" y="492">добавочный сегмент: срок жизни 1, внутри настоящие байты запроса; на роутере он исчезает</text><text class="sm" x="40" y="514">настоящий пакет едет дальше до сервера</text><rect class="bxb" x="40" y="530" width="880" height="40" rx="8"/><text class="sm tk c" x="480" y="556">чужих байт в нём нет, поэтому это ещё не фейк: фейк несёт чужие байты, см. выше</text></g>
