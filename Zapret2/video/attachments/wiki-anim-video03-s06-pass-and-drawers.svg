<svg xmlns="http://www.w3.org/2000/svg" class="v03-s06-pass-and-drawers" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="v03-s06-pass-and-drawers-t v03-s06-pass-and-drawers-d">
<title id="v03-s06-pass-and-drawers-t">Стратегия это функция с именем</title>
<desc id="v03-s06-pass-and-drawers-d">Стратегия это глобальная Lua-функция с двумя параметрами: pass из lua/zapret-lib.lua:43-45 имеет имя pass, параметры ctx и desync и одну строку записи в журнал; опция --lua-desync=pass называет ящик с этим именем, а функции лежат в файлах zapret-lib.lua (pass), zapret-antidpi.lua (25 готовых стратегий, среди них multisplit, drop и fake) и zapret-pcap.lua (pcap), которые выполняются один раз при запуске.</desc>
