<g class="a e18"><rect class="bxb" x="10" y="366" width="940" height="54" rx="8"/><text class="sm" x="24" y="389">Файлы выполняются один раз при запуске, функции остаются в памяти.</text><text class="sm" x="24" y="410">Правка Lua-файла действует только после перезапуска (по коду).</text></g>
