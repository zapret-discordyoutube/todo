<g class="a e8"><text class="sm mu" x="10" y="50">в команде</text><rect class="bxa" x="10" y="60" width="300" height="42" rx="8"/><text class="ml" x="24" y="87">--lua-desync=pass</text><text class="sm" x="10" y="124">опция называет ящик с таким именем</text></g>
