<g class="a e3"><rect class="bx" x="10" y="196" width="430" height="90" rx="8"/><text class="ln r" x="54" y="220">43</text><text class="cd" x="66.0" y="220">function pass(ctx, desync)</text><text class="ln r" x="54" y="246">44</text><text class="cd" x="82.86" y="246">DLOG(&quot;pass&quot;)</text><text class="ln r" x="54" y="272">45</text><text class="cd" x="66.0" y="272">end</text></g>
