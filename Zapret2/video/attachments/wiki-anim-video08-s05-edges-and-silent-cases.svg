<svg xmlns="http://www.w3.org/2000/svg" class="video08-s05-edges-and-silent-cases" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="video08-s05-edges-and-silent-cases-t video08-s05-edges-and-silent-cases-d">
<title id="video08-s05-edges-and-silent-cases-t">Края разреза и молчаливые случаи</title>
<desc id="video08-s05-edges-and-silent-cases-d">Позиция 0 и позиция 999 за концом приветствия молча отключают fakedsplit, потому что на проводе остаётся один пакет в 250 байт и сервер читает приветствие без изменений, а позиции 1, 249 и минус 1 режут по самому краю на части в 1 и 249 байт, и позиция host минус 1 даёт части 96 и 154 байта.</desc>
