<rect class="v03-s01-command-bg" x="0" y="0" width="960" height="392"/>
<g class="a v03-s01-command-e1"><text class="v03-s01-command-cap" x="10" y="24">настоящая команда нашей лаборатории, пути к файлам сокращены</text></g>
<g class="a v03-s01-command-e2"><rect class="v03-s01-command-bxg" x="14" y="40" width="932" height="100" rx="9"/></g>
<g class="a v03-s01-command-e3"><rect class="v03-s01-command-bxo" x="14" y="152" width="932" height="42" rx="9"/></g>
<g class="a v03-s01-command-e4"><text class="v03-s01-command-mc v03-s01-command-fg" x="28" y="66">nfqws2 --qnum=200 --debug=@nfqws.log --writable=.</text></g>
<g class="a v03-s01-command-e5"><text class="v03-s01-command-mc v03-s01-command-fg" x="28" y="94">--lua-init=@zapret-lib.lua --lua-init=@zapret-antidpi.lua --lua-init=@zapret-pcap.lua</text></g>
<g class="a v03-s01-command-e6"><text class="v03-s01-command-mc v03-s01-command-fg" x="28" y="122">--filter-tcp=443 --in-range=a --lua-desync=pcap:file=nfqws_seen.pcap --in-range=x</text></g>
<g class="a v03-s01-command-e7"><text class="v03-s01-command-mc v03-s01-command-fg" x="28" y="180">--payload=tls_client_hello --lua-desync=multisplit:pos=midsld</text></g>
<g class="a v03-s01-command-e8"><text class="v03-s01-command-tk" x="500" y="66">заготовка скрипта лаборатории</text></g>
<g class="a v03-s01-command-e9"><text class="v03-s01-command-tk v03-s01-command-ok" x="620" y="180">конец опыта</text></g>
<g class="a v03-s01-command-e10"><text class="v03-s01-command-cap" x="10" y="232">в заготовке</text></g>
<g class="a v03-s01-command-e11"><rect class="v03-s01-command-bxg" x="14" y="240" width="162.281" height="30" rx="15"/><text class="v03-s01-command-sm v03-s01-command-c v03-s01-command-ns" x="95.1406" y="260">служебные опции</text></g>
<g class="a v03-s01-command-e12"><rect class="v03-s01-command-bxg" x="186.281" y="240" width="195.438" height="30" rx="15"/><text class="v03-s01-command-sm v03-s01-command-c v03-s01-command-ns" x="284" y="260">условие: tcp, порт 443</text></g>
<g class="a v03-s01-command-e13"><rect class="v03-s01-command-bxg" x="391.719" y="240" width="238.922" height="30" rx="15"/><text class="v03-s01-command-sm v03-s01-command-c v03-s01-command-ns" x="511.18" y="260">запись всех пакетов в файл</text></g>
<g class="a v03-s01-command-e14"><rect class="v03-s01-command-bxg" x="640.641" y="240" width="231.406" height="30" rx="15"/><text class="v03-s01-command-sm v03-s01-command-c v03-s01-command-ns" x="756.344" y="260">две настройки диапазонов</text></g>
<g class="a v03-s01-command-e15"><text class="v03-s01-command-cap" x="10" y="306">в конце: что делает именно этот опыт</text></g>
<g class="a v03-s01-command-e16"><text class="v03-s01-command-sm" x="14" y="330">фильтр на клиентское приветствие + вызов, который режет запрос</text></g>
<g class="a v03-s01-command-e17"><text class="v03-s01-command-sm v03-s01-command-mu" x="10" y="362">в других опытах заготовка та же, конец другой, например:</text></g>
<g class="a v03-s01-command-e18"><text class="v03-s01-command-m v03-s01-command-mu" x="14" y="384">--payload=tls_client_hello --lua-desync=multidisorder:pos=midsld</text></g>
</svg>
