<svg xmlns="http://www.w3.org/2000/svg" class="v03-s01-command" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="v03-s01-command-t v03-s01-command-d">
<title id="v03-s01-command-t">Команда лаборатории: заготовка и конец</title>
<desc id="v03-s01-command-d">Настоящая команда запуска программы в нашей лаборатории (пути к файлам сокращены) разделена на две части: заготовка скрипта лаборатории (служебные опции, условие «tcp, порт 443», запись всех пакетов в файл и две настройки диапазонов) стоит спереди в каждом опыте, а в конец скрипт дописывает опции самого опыта: фильтр на клиентское приветствие и вызов multisplit; в других опытах заготовка та же, конец другой.</desc>
<style>.v03-s01-command{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13);--gt:rgba(110,110,110,.12)}
