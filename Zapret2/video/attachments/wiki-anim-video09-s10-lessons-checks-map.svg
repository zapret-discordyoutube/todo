ames v09-s10-lessons-checks-map-k19{0.0%{opacity:0}80.833%{opacity:0}81.771%{opacity:1}96.458%{opacity:1}97.708%{opacity:0}100%{opacity:0}}.v09-s10-lessons-checks-map .e19{animation-name:v09-s10-lessons-checks-map-k19}@keyframes v09-s10-lessons-checks-map-k20{0.0%{opacity:0}82.083%{opacity:0}83.021%{opacity:1}96.458%{opacity:1}97.708%{opacity:0}100%{opacity:0}}.v09-s10-lessons-checks-map .e20{animation-name:v09-s10-lessons-checks-map-k20}@keyframes v09-s10-lessons-checks-map-k21{0.0%{opacity:0}83.333%{opacity:0}84.271%{opacity:1}96.458%{opacity:1}97.708%{opacity:0}100%{opacity:0}}.v09-s10-lessons-checks-map .e21{animation-name:v09-s10-lessons-checks-map-k21}@keyframes v09-s10-lessons-checks-map-k22{0.0%{opacity:0}85.417%{opacity:0}86.354%{opacity:1}96.458%{opacity:1}97.708%{opacity:0}100%{opacity:0}}.v09-s10-lessons-checks-map .e22{animation-name:v09-s10-lessons-checks-map-k22}</style>
<rect class="bg" x="0" y="0" width="960" height="680"/>
<g><text class="cap" x="40" y="22">итог части: четыре урока и две проверки</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="430" height="78" rx="8"/><circle class="bxa" cx="62" cy="58" r="12"/><text class="tk c ns" x="62" y="63">1</text><text class="sm" x="84" y="60">«сработало» значит «обошло нашу игрушку и</text><text class="sm" x="84" y="79">наш сервер с Linux»; о настоящем</text><text class="sm" x="84" y="98">оборудовании мы не знаем ничего</text></g>
<g class="a e2"><rect class="bx" x="490" y="36" width="430" height="78" rx="8"/><circle class="bxa" cx="512" cy="58" r="12"/><text class="tk c ns" x="512" y="63">2</text><text class="sm" x="534" y="60">у SYN с данными нет запасного SYN: условие,</text><text class="sm" x="534" y="79">которое убило его, убило соединение</text></g>
<g class="a e3"><rect class="bx" x="40" y="124" width="430" height="78" rx="8"/><circle class="bxa" cx="62" cy="146" r="12"/><text class="tk c ns" x="62" y="151">3</text><text class="sm" x="84" y="148">rst: сервер не должен принять сброс; TTL 1 не</text><text class="sm" x="84" y="167">пускает его, badsum сервер отбрасывает</text></g>
<g class="a e4"><rect class="bx" x="490" y="124" width="430" height="78" rx="8"/><circle class="bxa" cx="512" cy="146" r="12"/><text class="tk c ns" x="512" y="151">4</text><text class="sm" x="534" y="148">synack: условия срока жизни не действуют, а</text><text class="sm" x="534" y="167">badsum действует</text></g>
<g class="a e5"><rect class="bx" x="40" y="218" width="430" height="184" rx="8"/><text class="mk" x="54" y="242">проверь себя: rst:badsum</text><text class="sm tk" x="54" y="264">какую игрушку обманет и что с сервером?</text></g>
<g class="a e6"><text class="sm" x="54" y="294">игрушка «сброс стирает память»: FORGET,</text><text class="sm" x="54" y="313">суммы она не проверяет</text><text class="sm" x="54" y="339">сервер получил RST и проигнорировал,</text><text class="sm tk ok" x="54" y="358">соединение целое: 250 байт</text></g>
<g class="a e7"><rect class="bx" x="490" y="218" width="430" height="184" rx="8"/><text class="mk" x="504" y="242">проверь себя: TTL 1 и badsum</text><text class="sm tk" x="504" y="264">чем они различаются на пути пакета?</text></g>
<g class="a e8"><text class="cap c" x="560" y="284">клиент</text><text class="cap c" x="700" y="284">роутер</text><text class="cap c" x="840" y="284">сервер</text><path class="lmd" d="M560 290L560 378"/><path class="lmd" d="M700 290L700 378"/><path class="lmd" d="M840 290L840 378"/></g>
<g class="a e9"><path class="lcut" d="M560 310L698 313"/><path class="lr" d="M694 307L706 319M706 307L694 319"/><text class="m fg" x="504" y="318">TTL 1</text><text class="ix mu" x="714" y="303">умер на роутере</text></g>
<g class="a e10"><path class="lb" d="M560 346L830.0 353.7"/><polygon class="hb" points="840,354 829.9,358.7 830.1,348.7"/><text class="m fg" x="504" y="354">badsum</text><text class="ix mu" x="714" y="338">дошёл: сервер игнорирует</text></g>
<g class="a e11"><text class="sm tk" x="504" y="388">результат одинаков, путь разный</text></g>
<g class="a e12"><text class="cap" x="40" y="422">пока открыто</text></g>
<g class="a e13"><rect class="bxd" x="40" y="432" width="430" height="74" rx="8"/><text class="sm tk mu" x="54" y="456">куда пропала первая копия приветствия</text><text class="sm mu" x="54" y="475">при подложном SYN-ACK</text><text class="sm mu" x="54" y="494">нужны счётчики ядра клиента</text></g>
<g class="a e14"><rect class="bxd" x="490" y="432" width="430" height="74" rx="8"/><text class="sm tk mu" x="504" y="456">правило против сообщений роутера</text><text class="sm mu" x="504" y="475">в конфигурации по умолчанию не проверяли:</text><text class="sm mu" x="504" y="494">что стало бы с клиентом</text></g>
<g class="a e15"><text class="cap" x="40" y="534">карта выпуска</text></g>
<g class="a e16"><rect class="bxo" x="40" y="544" width="140" height="96" rx="8"/><text class="big tk ok" x="54" y="570">A</text><text class="sm tk" x="54" y="590">SYN с</text><text class="sm tk" x="54" y="607">данными</text></g>
<g class="a e17"><rect class="bxo" x="188" y="544" width="140" height="96" rx="8"/><text class="big tk ok" x="202" y="570">B</text><text class="sm tk" x="202" y="590">сброс и ответ</text><text class="sm tk" x="202" y="607">раньше</text><text class="sm tk" x="202" y="624">вопроса</text></g>
<g class="a e18"><rect class="bxd" x="336" y="544" width="140" height="96" rx="8"/><text class="big tk mu" x="350" y="570">C</text><text class="sm mu" x="350" y="590">срочный байт</text></g>
<g class="a e19"><rect class="bxd" x="484" y="544" width="140" height="96" rx="8"/><text class="big tk mu" x="498" y="570">D</text><text class="sm mu" x="498" y="590">окно</text></g>
<g class="a e20"><rect class="bxd" x="632" y="544" width="140" height="96" rx="8"/><text class="big tk mu" x="646" y="570">E</text><text class="sm mu" x="646" y="590">сторона</text><text class="sm mu" x="646" y="607">сервера</text></g>
<g class="a e21"><rect class="bxd" x="780" y="544" width="140" height="96" rx="8"/><text class="big tk mu" x="794" y="570">F</text><text class="sm mu" x="794" y="590">под капотом</text></g>
<g class="a e22"><text class="sm mu" x="40" y="662">в следующих частях: срочный байт, окно, сторона сервера; построчный разбор кода в последних сценах</text></g>
</svg>
