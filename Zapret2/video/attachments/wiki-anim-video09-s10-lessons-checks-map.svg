<svg xmlns="http://www.w3.org/2000/svg" class="v09-s10-lessons-checks-map" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="v09-s10-lessons-checks-map-t v09-s10-lessons-checks-map-d">
<title id="v09-s10-lessons-checks-map-t">Четыре урока, две проверки и карта выпуска</title>
<desc id="v09-s10-lessons-checks-map-d">Итог первой части выпуска: четыре урока, что результат значит только обход нашей игрушки и нашего сервера, что у SYN с данными нет запасного SYN, что сбросу нужно не дойти до сервера или быть отброшенным им и что условия срока жизни на ответе раньше вопроса не действуют, две проверки, в которых сброс с испорченной суммой обманывает игрушку, а сервер его игнорирует и принимает 250 байт, и сброс со сроком 1 умирает на роутере, тогда как с испорченной суммой доходит до сервера, два открытых вопроса про пропавшую первую копию приветствия и про правило против сообщений роутера и карта выпуска, где пройдены приёмы до приветствия, а срочный байт, окно, сторона сервера и код впереди.</desc>
<style>.v09-s10-lessons-checks-map{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
