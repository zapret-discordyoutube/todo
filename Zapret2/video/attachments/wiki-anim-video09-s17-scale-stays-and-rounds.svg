<rect class="bg" x="0" y="0" width="960" height="814"/>
<g><text class="cap" x="40" y="22">цена ложного окна: множитель из SYN остаётся навсегда</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="78" rx="8"/><text class="sm tk" x="54" y="60">игрушка: кафе и тарелка</text><rect class="pl" x="723.9" y="44" width="182.1" height="24" rx="12"/><text class="sm c" x="815" y="61">выдуманный пример</text><text class="sm" x="54" y="82">тарелка весила 1024 грамма, потом договорились, что она весит 64; договорённость отменить нельзя.</text><text class="sm" x="54" y="101">посетитель просит «63 тарелки»: 4032 грамма вместо 64512, в 16 раз меньше</text></g>
<g class="a e2"><text class="cap" x="40" y="140">так и с окном: кто что считает</text></g>
<g class="a e3"><rect class="bx" x="40" y="150" width="380" height="76" rx="8"/><text class="sm tk" x="54" y="174">ядро клиента</text><text class="sm" x="54" y="196">о подмене не знает: множитель 10,</text><text class="sm" x="54" y="215">пишет в пакет окно 63</text><path class="la" d="M424 188L526.0 188.0"/><polygon class="ha" points="536,188 526.0,193.0 526.0,183.0"/><text class="ix c fg" x="480" y="178">окно 63</text><rect class="bxb" x="540" y="150" width="380" height="76" rx="8"/><text class="sm tk" x="554" y="174">сервер</text><text class="sm" x="554" y="196">в SYN прочёл множитель 6,</text><text class="sm tk" x="554" y="215">читает 63 × 2^6 = 4032 байта</text></g>
<g class="a e4"><text class="sm tk" x="40" y="250">в следующих пакетах опции множителя нет, поэтому вернуть его нельзя</text></g>
<g class="a e5"><text class="sm" x="40" y="280">без стратегии</text><rect class="bxo" x="220" y="268" width="640" height="22" rx="0"/><text class="ix fg tk" x="228" y="284">63 × 1024 = 64512 байт</text></g>
<g class="a e6"><text class="sm" x="40" y="314">после отключения</text><rect class="bxb" x="220" y="302" width="40" height="22" rx="0"/><text class="ix fg tk" x="270" y="318">63 × 64 = 4032 байта</text></g>
<g class="a e7"><text class="big tk r" x="920" y="320">× 16</text><text class="ix mu r" x="920" y="342">1024 / 64 = 16</text></g>
<g class="a e8"><text class="cap" x="40" y="368">как это выглядит во времени: провод клиента</text></g>
<g class="a e9"><text class="cap c" x="530" y="386">клиент</text><text class="cap c" x="700" y="386">сервер</text><text class="cap" x="760" y="386">мс</text></g>
<g><path class="lmd" d="M530 392L530 518"/><path class="lmd" d="M700 392L700 518"/></g>
<g class="a e10"><circle class="bxa" cx="56" cy="412" r="11"/><text class="tk c ns" x="56" y="417">1</text><text class="sm tk" x="78" y="417">сервер: PA 64, первый кусок ответа</text><path class="lf" d="M700 412L540.0 415.8"/><polygon class="hf" points="530,416 539.9,410.8 540.1,420.8"/><text class="m fg" x="760" y="417">20,97</text></g>
<g class="a e11"><circle class="bxa" cx="56" cy="452" r="11"/><text class="tk c ns" x="56" y="457">2</text><text class="sm tk" x="78" y="457">клиент: ACK, окно 63</text><path class="la" d="M530 452L690.0 455.8"/><polygon class="ha" points="700,456 689.9,460.8 690.1,450.8"/><text class="m fg" x="760" y="457">21,63</text></g>
<g class="a e12"><circle class="bxa" cx="56" cy="492" r="11"/><text class="tk c ns" x="56" y="497">3</text><text class="sm tk" x="78" y="497">сервер: пачка PA 192, 128, 128, 192, …</text><path class="lf" d="M700 492L540.0 495.8"/><polygon class="hf" points="530,496 539.9,490.8 540.1,500.8"/><text class="m fg" x="760" y="497">31,77</text></g>
<g class="a e13"><rect class="bxb" x="40" y="532" width="880" height="34" rx="8"/><text class="sm tk" x="54" y="554">круг между пачками: 31,77 − 20,97 = 10,8 мс; в лаборатории он около 10 мс</text></g>
<g class="a e14"><text class="cap" x="40" y="596">весь ответ: пять пачек сервера, время от первого куска</text></g>
<g class="a e15"><rect class="bxr" x="40" y="706" width="150" height="8" rx="3"/><text class="m fg c" x="115" y="732">0 мс</text><text class="ix mu c" x="115" y="750">1 кусок · 64 Б</text></g>
<g class="a e16"><rect class="bxa" x="216" y="655.5" width="150" height="58.5" rx="3"/><text class="m fg c" x="291" y="732">+10,8 мс</text><text class="ix mu c" x="291" y="750">10 кусков · 1536 Б</text></g>
<g class="a e17"><rect class="bxa" x="392" y="614" width="150" height="100" rx="3"/><text class="m fg c" x="467" y="732">+22,0 мс</text><text class="ix mu c" x="467" y="750">20 кусков · 2624 Б</text></g>
<g class="a e18"><rect class="bxa" x="568" y="670.1" width="150" height="43.9" rx="3"/><text class="m fg c" x="643" y="732">+32,3 мс</text><text class="ix mu c" x="643" y="750">8 кусков · 1152 Б</text></g>
<g class="a e19"><rect class="bxa" x="744" y="690.2" width="150" height="23.8" rx="3"/><text class="m fg c" x="819" y="732">+42,6 мс</text><text class="ix mu c" x="819" y="750">1 кусок · 624 Б</text></g>
<g class="a e20"><text class="sm tk" x="40" y="776">пять кругов; окно 4032 само по себе дало бы по счёту около двух (6000 / 4032 ≈ 1,5)</text></g>
<g class="a e21"><text class="sm mu" x="40" y="798">почему пять, а не два: не проверяли; по общим сведениям, важно число пакетов в полёте</text></g>
</svg>
