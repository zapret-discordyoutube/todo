<svg xmlns="http://www.w3.org/2000/svg" class="v09-s17-scale-stays-and-rounds" viewBox="0 0 960 814" width="960" height="814" role="img" aria-labelledby="v09-s17-scale-stays-and-rounds-t v09-s17-scale-stays-and-rounds-d">
<title id="v09-s17-scale-stays-and-rounds-t">Множитель остаётся и ответ идёт кругами</title>
<desc id="v09-s17-scale-stays-and-rounds-d">Множитель 6 из SYN остаётся навсегда, потому что в следующих пакетах опции множителя нет, поэтому окно 63, которое ядро клиента честно пишет по своему множителю 10, сервер читает с множителем 6 и получает 4032 байта вместо 64512, то есть в 16 раз меньше, первый кусок в 64 байта приходит на 20,97 мс, ACK клиента на 21,63 мс, следующая пачка на 31,77 мс, круг стоит около 10,8 мс, а все шесть тысяч байт приходят пятью пачками по 1, 10, 20, 8 и 1 куску, при том что окно 4032 само по себе дало бы по счёту около двух кругов.</desc>
