<title id="v00-s03-toy-inspector-t">Игрушечный инспектор: одно правило</title>
<desc id="v00-s03-toy-inspector-d">Игрушечный инспектор из нашей лаборатории это одно правило в роутере: оно смотрит в одно и то же место каждого пакета, ищет там 15 байт имени сайта, считает такие пакеты, выбрасывает их или отправляет сброс и ничего не запоминает; это не настоящее оборудование, а о настоящем по общим сведениям известно лишь название, устройство нам неизвестно.</desc>
