<g><text class="cap" x="40" y="24">ответ движку после частей · lua/zapret-antidpi.lua:526-527</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="580" height="96" rx="8"/></g>
<g class="a e2"><text class="ix" x="52" y="62">526</text><text class="m" x="92" y="62">replay_drop_set(desync)</text><text class="sm mu" x="350" y="62">для проигрыша: отметка</text></g>
<g class="a e3"><text class="ix" x="52" y="96">527</text><text class="m" x="92" y="96">return desync.arg.nodrop and VERDICT_PASS or VERDICT_DROP</text></g>
<g class="a e4"><circle class="bxa" cx="22" cy="57" r="13"/><text class="tk c ns" x="22" y="62">1</text></g>
<g class="a e5"><circle class="bxa" cx="22" cy="91" r="13"/><text class="tk c ns" x="22" y="96">2</text></g>
<g class="a e6 tr"><rect class="bxn" x="44" y="76" width="572" height="28" rx="5"/></g>
<g class="a e7"><text class="sm mu" x="52" y="122">по умолчанию оригинал выбрасывается</text></g>
<g class="a e8"><text class="cap" x="640" y="24">вердикт движку</text><rect class="bxr" x="640" y="36" width="280" height="44" rx="8"/><text class="sm tk" x="652" y="56">nodrop нет → DROP (2)</text><text class="ix" x="652" y="73">packet: id=4 drop</text><rect class="bxo" x="640" y="88" width="280" height="44" rx="8"/><text class="sm tk" x="652" y="108">nodrop задан → PASS (0)</text><text class="ix" x="652" y="125">packet: id=4 pass unmodified</text></g>
<g class="a e9"><rect class="bx" x="40" y="146" width="580" height="62" rx="8"/><circle class="bxo" cx="68" cy="177" r="15"/><text class="tk c ns" x="68" y="183">0</text><text class="sm" x="94" y="170">в Lua ложны только nil и false: число 0 истинно,</text><text class="sm" x="94" y="190">выражение с VERDICT_PASS = 0 всё равно даёт «пропустить»</text></g>
<g class="a e10"><rect class="bx" x="640" y="146" width="280" height="68" rx="8"/><text class="sm tk" x="652" y="166">прогон функций (метка)</text><text class="m" x="652" y="184">nodrop=0 → returned 0 (PASS)</text><text class="ix" x="652" y="202">nodrop= пусто → тоже PASS</text></g>
<g class="a e11"><text class="cap" x="40" y="228">провод у клиента · номер+длина, относительные номера (метка «в нашем тесте»)</text></g>
<g class="a e12"><text class="sm tk" x="40" y="260">без nodrop</text><rect class="bxa" x="170" y="246" width="100" height="26" rx="4"/><text class="mk c" x="220" y="264">1+104</text><rect class="bxo" x="278" y="246" width="120" height="26" rx="4"/><text class="mk c" x="338" y="264">105+146</text><rect class="bxd" x="406" y="246" width="110" height="26" rx="4"/><text class="mk c mu" x="461" y="264">1+250</text><text class="sm" x="530" y="264">оригинал в корзине: пакета в 250 байт нет</text></g>
<g class="a e13"><text class="sm tk" x="40" y="296">с nodrop</text><rect class="bxa" x="170" y="282" width="100" height="26" rx="4"/><text class="mk c" x="220" y="300">1+104</text><rect class="bxo" x="278" y="282" width="120" height="26" rx="4"/><text class="mk c" x="338" y="300">105+146</text><rect class="bx" x="406" y="282" width="110" height="26" rx="4"/><text class="mk c mu" x="461" y="300">1+250</text><text class="sm" x="530" y="294">оригинал следом, через ≈0.06 мс:</text><text class="ix mu" x="530" y="311">ядро держит его в очереди у программы</text></g>
<g class="a e14"><text class="sm tk" x="40" y="338">ответ сервера</text><rect class="bx" x="170" y="324" width="128" height="26" rx="4"/><text class="sm c" x="234" y="342">жду 105</text><rect class="bxb" x="306" y="324" width="300" height="26" rx="4"/><text class="sm c" x="456" y="342">жду 251, дубль блока [1, 251)</text><text class="sm tk" x="620" y="342">приложение: 104 + 146</text></g>
<g class="a e15"><text class="ix mu" x="170" y="370">дубль блока: эти байты у сервера уже были; второй раз ничего не доставлено</text></g>
<g class="a e16"><text class="sm tk" x="40" y="398">nodrop</text><text class="sm tk" x="40" y="416">+ накладка 5</text><rect class="bxa" x="170" y="394" width="100" height="26" rx="4"/><text class="mk c" x="220" y="412">-4+109</text><rect class="bxo" x="278" y="394" width="120" height="26" rx="4"/><text class="mk c" x="338" y="412">105+146</text><rect class="bx" x="406" y="394" width="110" height="26" rx="4"/><text class="mk c mu" x="461" y="412">1+250</text><text class="sm" x="530" y="406">сервер: два дублирующих блока</text><text class="m" x="530" y="423">[-4, 1) и [1, 251)</text></g>
<g class="a e17"><text class="sm tk" x="40" y="464">repeats=2</text><text class="sm tk" x="40" y="482">без nodrop</text><rect class="bxa" x="170" y="460" width="80" height="26" rx="4"/><text class="mk c" x="210" y="478">1+104</text><rect class="bxa" x="256" y="460" width="80" height="26" rx="4"/><text class="mk c" x="296" y="478">1+104</text><rect class="bxo" x="342" y="460" width="100" height="26" rx="4"/><text class="mk c" x="392" y="478">105+146</text><rect class="bxo" x="448" y="460" width="100" height="26" rx="4"/><text class="mk c" x="498" y="478">105+146</text><text class="sm" x="562" y="472">каждая часть дважды подряд,</text><text class="sm" x="562" y="489">пауза ≈0.05 мс; приложение 104, 146</text></g>
<g class="a e18"><rect class="bxb" x="40" y="510" width="880" height="94" rx="8"/><text class="sm tk" x="54" y="534">nodrop стоит одного лишнего пакета, для нашего сервера он ничего не меняет</text><text class="sm" x="54" y="556">тот, кто смотрит на каждый пакет, увидит и оригинал с целым именем:</text><text class="sm" x="54" y="575">две игрушечные модели находят его в сцене про шесть моделей</text><text class="ix mu" x="54" y="594">метка «игрушка проекта»: это не оборудование</text></g>
</svg>
