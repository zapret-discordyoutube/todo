<svg xmlns="http://www.w3.org/2000/svg" class="v05-s21-verdict-wire" viewBox="0 0 960 712" width="960" height="712" role="img" aria-labelledby="v05-s21-verdict-wire-t v05-s21-verdict-wire-d">
<title id="v05-s21-verdict-wire-t">Ответ движку и оригинал</title>
<desc id="v05-s21-verdict-wire-d">Ответ функции движку после частей: строка 526 только ставит служебную отметку для повторного проигрыша, строка 527 возвращает «пропустить», если задан аргумент nodrop, и «выбросить» во всех остальных случаях (lua/zapret-antidpi.lua:526-527), а так как в Lua ложны только nil и false и число 0 истинно, любое значение nodrop, даже 0 или пустая строка, даёт «пропустить»; в нашем опыте без nodrop журнал пишет packet: id=4 drop и на проводе две части 1+104 и 105+146, а с nodrop журнал пишет pass unmodified и примерно через 0.06 мс после второй части уходит оригинал 1+250, сервер отвечает подтверждением 105, затем 251 с дублирующим блоком от 1 до 251 не включая, а приложение читает 104 и 146 байт; при накладке в 5 байт порядок тот же (-4+109, 105+146, 1+250) и сервер даёт два дублирующих блока; при repeats=2 каждая часть уходит дважды подряд, и приложение всё равно читает 104 и 146 байт.</desc>
