<title id="video06-s02-strips-and-counts-t">Две полоски и два счёта</title>
<desc id="video06-s02-strips-and-counts-d">Выдуманный пример: лента из 250 клеток разрезана перед клеткой 104 на полоску начала в 104 клетки и полоску конца в 146 клеток, обычный разрез отправил бы начало первым, а наша стратегия отправляет конец первым и начало вторым, и тот же байт имеет смещение 104, если считать с нуля, и номер 105, если считать с единицы.</desc>
