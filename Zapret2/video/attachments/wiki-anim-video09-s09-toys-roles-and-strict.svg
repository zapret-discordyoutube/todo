<svg xmlns="http://www.w3.org/2000/svg" class="v09-s09-toys-roles-and-strict" viewBox="0 0 960 900" width="960" height="900" role="img" aria-labelledby="v09-s09-toys-roles-and-strict-t v09-s09-toys-roles-and-strict-d">
<title id="v09-s09-toys-roles-and-strict-t">Две игрушки на подложном SYN-ACK</title>
<desc id="v09-s09-toys-roles-and-strict-d">Две игрушки на подложном SYN-ACK: игрушка «роли» помнит, что подложный SYN-ACK и пакеты клиента идут от сервера, потому что первый SYN-ACK делает отправителя сервером, поэтому приветствие в 250 байт идёт в направлении, которое она считает входящим, и она решает пропустить, игрушка «строгое рукопожатие» видит, что первый пакет не SYN клиента, записывает рукопожатие как нечистое и тоже пропускает, в обоих опытах приложение сервера получает 250 байт, а без приёма обе блокируют приветствие; условия срока жизни 1 и испорченной суммы проверены только на игрушке «роли» с тем же решением, а слова автора про разворот направления соединения не доказательство.</desc>
