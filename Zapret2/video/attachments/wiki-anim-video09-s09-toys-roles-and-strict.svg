<g><text class="cap" x="40" y="22">две игрушки на подложном SYN-ACK</text><rect class="pl" x="699" y="4" width="221" height="24" rx="12"/><text class="sm c" x="809.5" y="21">наша игрушечная модель</text></g>
<g class="a e1"><text class="sm tk" x="40" y="54">игрушка «роли»: ищет имя только в пакетах направления, которое её память называет исходящим</text></g>
<g class="a e2"><text class="sm" x="40" y="76">проверь себя: клиент отправил подложный SYN-ACK, кого игрушка теперь считает сервером?</text></g>
<g class="a e3"><text class="sm tk ok" x="40" y="98">настоящего клиента: его пакеты для неё «не исходящие»</text></g>
<g class="a e4"><text class="cap" x="56" y="126">№</text><text class="cap" x="90" y="126">пакет</text><text class="cap" x="290" y="126">отправитель</text><text class="cap" x="420" y="126">память игрушки</text><text class="cap" x="600" y="126">решение</text></g>
<g class="a e5"><rect class="fa" x="40" y="136" width="880" height="30" rx="5"/><circle class="bxa" cx="56" cy="151" r="11"/><text class="tk c ns" x="56" y="156">1</text><text class="sm tk" x="90" y="156">SYN-ACK, подложный</text><rect class="bxa" x="290" y="139" width="100" height="24" rx="5"/><text class="sm c" x="340" y="156">клиент</text><rect class="bxr" x="420" y="139" width="160" height="24" rx="5"/><text class="sm c" x="500" y="156">исходящий: нет</text></g>
<g class="a e6"><circle class="bx" cx="56" cy="183" r="11"/><text class="tk c ns" x="56" y="188">2</text><text class="sm" x="90" y="188">SYN, настоящий</text><rect class="bxa" x="290" y="171" width="100" height="24" rx="5"/><text class="sm c" x="340" y="188">клиент</text><rect class="bxr" x="420" y="171" width="160" height="24" rx="5"/><text class="sm c" x="500" y="188">исходящий: нет</text></g>
<g class="a e7"><circle class="bx" cx="56" cy="215" r="11"/><text class="tk c ns" x="56" y="220">3</text><text class="sm" x="90" y="220">RST, ответ сервера</text><rect class="bxs" x="290" y="203" width="100" height="24" rx="5"/><text class="sm c" x="340" y="220">сервер</text><rect class="bxr" x="420" y="203" width="160" height="24" rx="5"/><text class="sm c" x="500" y="220">исходящий: да</text></g>
<g class="a e8"><rect class="fa" x="40" y="232" width="880" height="30" rx="5"/><circle class="bxa" cx="56" cy="247" r="11"/><text class="tk c ns" x="56" y="252">4</text><text class="sm tk" x="90" y="252">SYN-ACK сервера</text><rect class="bxs" x="290" y="235" width="100" height="24" rx="5"/><text class="sm c" x="340" y="252">сервер</text><rect class="bxr" x="420" y="235" width="160" height="24" rx="5"/><text class="sm c" x="500" y="252">исходящий: да</text><text class="sm tk" x="600" y="252">роли поменялись</text></g>
<g class="a e9"><circle class="bx" cx="56" cy="279" r="11"/><text class="tk c ns" x="56" y="284">5</text><text class="sm" x="90" y="284">ACK</text><rect class="bxa" x="290" y="267" width="100" height="24" rx="5"/><text class="sm c" x="340" y="284">клиент</text><rect class="bxr" x="420" y="267" width="160" height="24" rx="5"/><text class="sm c" x="500" y="284">исходящий: нет</text></g>
<g class="a e10"><rect class="fa" x="40" y="296" width="880" height="30" rx="5"/><circle class="bxa" cx="56" cy="311" r="11"/><text class="tk c ns" x="56" y="316">6</text><text class="sm tk" x="90" y="316">приветствие, 250 байт</text><rect class="bxa" x="290" y="299" width="100" height="24" rx="5"/><text class="sm c" x="340" y="316">клиент</text><rect class="bxr" x="420" y="299" width="160" height="24" rx="5"/><text class="sm c" x="500" y="316">исходящий: нет</text><text class="sm tk" x="600" y="316">SKIP: «входящее», не проверяю</text></g>
<g class="a e11"><text class="sm mu" x="40" y="344">красное: игрушка считает наоборот; у настоящего клиента везде «нет», у настоящего сервера везде «да»</text></g>
<g class="a e12"><rect class="bxr" x="40" y="356" width="430" height="46" rx="8"/><text class="sm tk" x="54" y="377">без стратегии: BLOCK, имя найдено</text><text class="sm" x="54" y="395">приложение сервера: 0 байт</text><rect class="bxo" x="490" y="356" width="430" height="46" rx="8"/><text class="sm tk" x="504" y="377">со стратегией synack: SKIP, прошло</text><text class="sm" x="504" y="395">приложение сервера: 250 байт</text></g>
<g class="a e13"><text class="sm tk" x="40" y="428">игрушка «строгое рукопожатие»: ждёт по порядку, потом смотрит данные</text></g>
<g class="a e14"><rect class="bx" x="40" y="440" width="180" height="52" rx="6"/><text class="sm tk c" x="130" y="460">SYN клиента</text><text class="ix c fg" x="130" y="480">состояние 0 → 1</text><path class="la" d="M222 466L224.0 466.0"/><polygon class="ha" points="234,466 224.0,471.0 224.0,461.0"/><rect class="bx" x="236" y="440" width="260" height="52" rx="6"/><text class="sm tk c" x="366" y="460">SYN-ACK сервера</text><text class="ix c fg" x="366" y="480">верный ack · состояние 1 → 2</text><path class="la" d="M498 466L500.0 466.0"/><polygon class="ha" points="510,466 500.0,471.0 500.0,461.0"/><rect class="bx" x="512" y="440" width="180" height="52" rx="6"/><text class="sm tk c" x="602" y="460">ACK клиента</text><text class="ix c fg" x="602" y="480">состояние 2 → 3</text><path class="la" d="M694 466L696.0 466.0"/><polygon class="ha" points="706,466 696.0,471.0 696.0,461.0"/><rect class="bxr" x="708" y="440" width="190" height="52" rx="6"/><text class="sm tk c" x="803" y="460">данные: смотрю</text><text class="ix c fg" x="803" y="480">BLOCK по имени</text></g>
<g class="a e15"><text class="sm" x="40" y="514">с подложным SYN-ACK первый пакет не клиентский SYN:</text></g>
<g class="a e16"><rect class="bxo" x="40" y="524" width="880" height="50" rx="8"/><text class="sm tk" x="54" y="545">INVALID: рукопожатие нечистое, не проверяю; приветствие прошло</text><text class="sm" x="54" y="564">приложение сервера: 250 байт</text></g>
<g class="a e17"><text class="cap" x="40" y="598">какие условия проверены на какой игрушке</text></g>
<g class="a e18"><text class="cap" x="300" y="622">роли</text><text class="cap" x="560" y="622">строгое рукопожатие</text></g>
<g class="a e19"><rect class="bx" x="40" y="632" width="880" height="26" rx="5"/><text class="m fg" x="54" y="651">synack</text><text class="sm tk ok" x="300" y="651">SKIP</text><text class="sm tk ok" x="560" y="651">INVALID</text></g>
<g class="a e20"><rect class="bx" x="40" y="662" width="880" height="26" rx="5"/><text class="m fg" x="54" y="681">synack:ip_ttl=1</text><text class="sm tk ok" x="300" y="681">SKIP</text><text class="sm mu" x="560" y="681">не запускали</text></g>
<g class="a e21"><rect class="bx" x="40" y="692" width="880" height="26" rx="5"/><text class="m fg" x="54" y="711">synack:badsum</text><text class="sm tk ok" x="300" y="711">SKIP</text><text class="sm mu" x="560" y="711">не запускали</text></g>
<g class="a e22"><text class="sm mu" x="40" y="738">для «строгого рукопожатия» срок жизни и сумма не читаются по её коду: вывод из кода, не из опыта</text></g>
<g class="a e23"><rect class="bx" x="40" y="758" width="880" height="70" rx="8"/><text class="sm tk" x="54" y="782">что пишет автор в документации: «TCB turnaround»,</text><text class="sm" x="54" y="802">разворот направления, чтобы запутать наблюдателя (docs/manual.en.md, строка 4345)</text><text class="sm mu" x="54" y="820">слова автора, не доказательство; кода, который это доказывает, у нас нет</text></g>
