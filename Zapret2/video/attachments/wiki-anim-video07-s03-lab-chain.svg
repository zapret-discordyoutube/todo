<rect class="bg" x="0" y="0" width="960" height="572"/>
<g><text class="cap" x="40" y="24">лаборатория: где мы смотрим на пакеты</text></g>
<g class="a e1"><rect class="bxa" x="150" y="40" width="450" height="84" rx="8"/><text class="tk sm" x="164" y="64">игрушка: вторая копия nfqws2 с одним скриптом</text><text class="sm" x="164" y="86">стоит на входе в роутер 1, до проверки срока жизни,</text><text class="sm" x="164" y="108">решает один раз по первому пакету с данными</text></g>
<g class="a e2"><text class="sm mu" x="620" y="70">наше допущение, не знание</text><text class="sm mu" x="620" y="90">о настоящем оборудовании</text></g>
<g class="a e3"><rect class="bxs" x="40" y="152" width="110" height="76" rx="6"/><text class="tk sm c" x="95" y="176">клиент</text><text class="ix c" x="95" y="196">10.1.0.1</text><text class="ix c" x="95" y="216">nfqws2</text></g>
<g class="a e4"><path class="lm" d="M150 190L250 190"/><rect class="bx" x="250" y="152" width="140" height="76" rx="6"/><text class="tk sm c" x="320" y="195">роутер 1</text></g>
<g class="a e5"><path class="lmd" d="M390 190L450 190"/><rect class="bxd" x="450" y="152" width="100" height="76" rx="6"/><text class="sm mu c" x="500" y="186">роутер 2</text><text class="ix c" x="500" y="206">если есть</text><path class="lmd" d="M550 190L610 190"/><rect class="bxd" x="610" y="152" width="100" height="76" rx="6"/><text class="sm mu c" x="660" y="186">роутер 3</text><text class="ix c" x="660" y="206">если есть</text><path class="lmd" d="M710 190L780 190"/></g>
<g class="a e6"><rect class="bxs" x="780" y="152" width="140" height="76" rx="6"/><text class="tk sm c" x="850" y="176">сервер</text><text class="ix c" x="850" y="196">10.2.0.2</text><text class="ix c" x="850" y="216">Linux 6.18</text></g>
<g class="a e7"><rect class="bxa" x="238" y="168" width="24" height="44" rx="4"/><path class="la" d="M250 168 L250 124"/></g>
<g class="a e8"><text class="mk c" x="150" y="252">c0</text><circle class="ha" cx="150" cy="190" r="5"/></g>
<g class="a e9"><text class="mk c" x="250" y="252">r0</text><circle class="ha" cx="250" cy="190" r="5"/></g>
<g class="a e10"><text class="mk c" x="390" y="252">r1</text><circle class="ha" cx="390" cy="190" r="5"/></g>
<g class="a e11"><text class="m mu c" x="550" y="252">r2</text><circle class="hm" cx="550" cy="190" r="5"/></g>
<g class="a e12"><text class="m mu c" x="710" y="252">r3</text><circle class="hm" cx="710" cy="190" r="5"/></g>
<g class="a e13"><text class="mk c" x="780" y="252">s0</text><circle class="ha" cx="780" cy="190" r="5"/></g>
<g class="a e14"><text class="cap" x="40" y="286">срок жизни пакета с данными, цепочка из одного роутера</text></g>
<g class="a e15"><rect class="bxa" x="120" y="296" width="60" height="28" rx="14"/><text class="mk c" x="150" y="315">64</text></g>
<g class="a e16"><rect class="bxa" x="220" y="296" width="60" height="28" rx="14"/><text class="mk c" x="250" y="315">64</text></g>
<g class="a e17"><rect class="bxb" x="360" y="296" width="60" height="28" rx="14"/><text class="mk c" x="390" y="315">63</text></g>
<g class="a e18"><rect class="bxb" x="750" y="296" width="60" height="28" rx="14"/><text class="mk c" x="780" y="315">63</text></g>
<g class="a e19"><text class="cap" x="40" y="366">точки съёмки</text></g>
<g class="a e20"><text class="mk" x="40" y="392">c0</text><text class="sm" x="104" y="392">сетевая карта клиента, после работы программы</text><text class="mk" x="40" y="416">r0</text><text class="sm" x="104" y="416">вход в роутер 1</text><text class="mk" x="40" y="440">r1</text><text class="sm" x="104" y="440">выход из роутера 1</text><text class="mk" x="40" y="464">r2, r3</text><text class="sm" x="104" y="464">выход из роутеров 2 и 3, если они есть</text><text class="mk" x="40" y="488">s0</text><text class="sm" x="104" y="488">сетевая карта сервера</text></g>
<g class="a e21"><rect class="bx" x="540" y="352" width="380" height="138" rx="8"/><text class="tk sm" x="556" y="374">получатель: сервер на Linux</text><rect class="bxr" x="556" y="384" width="348" height="46" rx="5"/><text class="sm" x="568" y="403">ядро принимает пакеты и считает</text><text class="sm" x="568" y="422">отвергнутые по причинам</text><rect class="bxo" x="556" y="436" width="348" height="46" rx="5"/><text class="sm" x="568" y="455">приложение получает то, что принято,</text><text class="sm" x="568" y="474">и записывает, сколько байт и какие</text></g>
<g class="a e22"><rect class="bxs" x="40" y="512" width="880" height="44" rx="8"/><text class="sm" x="56" y="540">Чтобы дойти, нужен срок жизни не меньше числа роутеров плюс один: роутер вычитает единицу.</text></g>
</svg>
