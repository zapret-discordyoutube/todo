<svg xmlns="http://www.w3.org/2000/svg" class="v07-s03-lab-chain" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="v07-s03-lab-chain-t v07-s03-lab-chain-d">
<title id="v07-s03-lab-chain-t">Лаборатория: цепочка, точки съёмки, игрушка</title>
<desc id="v07-s03-lab-chain-d">Схема лаборатории: клиент 10.1.0.1, от одного до трёх роутеров и сервер 10.2.0.2, точки съёмки c0 после программы, r0 на входе в первый роутер, r1 на выходе из него, r2 и r3 после второго и третьего роутеров и s0 у сервера, игрушка на входе в первый роутер до проверки срока жизни, срок жизни пакета с данными 64, 64, 63 и 63 на точках c0, r0, r1 и s0, а у сервера два слоя, ядро со счётчиками и приложение.</desc>
