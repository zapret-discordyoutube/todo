<rect class="bg" x="0" y="0" width="960" height="608"/>
<g><text class="cap" x="40" y="26">у каждого условия: след у получателя, игрушка, оговорка</text></g>
<g class="a e1"><text class="cap" x="52" y="54">условие</text><text class="cap" x="206" y="54">след у получателя</text><text class="cap" x="402" y="54">кто отсеивает</text><text class="cap" x="640" y="54">оговорка</text></g>
<g class="a e2"><rect class="bxb" x="40" y="64" width="880" height="54" rx="6"/><text class="tk sm" x="52" y="96">срок жизни</text><text class="sm" x="206" y="86">нет следа,</text><text class="sm mu" x="206" y="106">ICMP клиенту</text><text class="sm" x="402" y="86">ни одна: все четыре</text><text class="sm" x="402" y="106">принимают её за первый</text><text class="sm" x="640" y="86">нужна длина пути: доходит</text><text class="sm" x="640" y="106">при TTL не меньше роутеры + 1</text></g>
<g class="a e3"><rect class="bx" x="40" y="124" width="880" height="54" rx="6"/><text class="tk sm" x="52" y="156">MD5</text><text class="mk" x="206" y="156">TCPMD5Unexpected</text><text class="sm tk" x="402" y="156">отсеивающий MD5</text><text class="sm" x="640" y="146">опция неверной длины</text><text class="sm" x="640" y="166">tcp_md5=0011: принята, 680 B</text></g>
<g class="a e4"><rect class="bx" x="40" y="184" width="880" height="54" rx="6"/><text class="tk sm" x="52" y="216">сумма</text><text class="mk" x="206" y="216">Tcp:InCsumErrors</text><text class="sm tk" x="402" y="216">проверяющий сумму</text><text class="sm" x="640" y="216">одно испорченное поле</text></g>
<g class="a e5"><rect class="bx" x="40" y="244" width="880" height="54" rx="6"/><text class="tk sm" x="52" y="276">номер</text><text class="mk" x="206" y="266">TCPDSACKOldSent</text><text class="sm mu" x="206" y="286">по названию: дубликат</text><text class="sm tk" x="402" y="276">следящий за номером</text><text class="sm" x="640" y="266">сдвиг не меньше 680: при −679</text><text class="sm" x="640" y="286">в потоке 1 байт подделки</text></g>
<g class="a e6"><rect class="bx" x="40" y="304" width="880" height="54" rx="6"/><text class="tk sm" x="52" y="336">подтверждение</text><text class="mk" x="206" y="336">TCPChallengeACK</text><text class="sm" x="402" y="326">никакая: номер ACK</text><text class="sm" x="402" y="346">не проверяет ни одна</text><text class="sm" x="640" y="326">сервер уже говорил: −1000</text><text class="sm" x="640" y="346">принято, граница 5000 байт</text></g>
<g class="a e7"><rect class="bx" x="40" y="364" width="880" height="54" rx="6"/><text class="tk sm" x="52" y="396">снят ACK</text><text class="sm" x="206" y="386">нет следа</text><text class="sm mu" x="206" y="406">отброшена молча</text><text class="sm tk" x="402" y="396">требующий ACK</text><text class="sm" x="640" y="386">снять только PSH не</text><text class="sm" x="640" y="406">помогает: принято, 680 B</text></g>
<g class="a e8"><rect class="bx" x="40" y="424" width="880" height="54" rx="6"/><text class="tk sm" x="52" y="456">метка времени</text><text class="mk" x="206" y="456">PAWSEstab</text><text class="sm" x="402" y="446">из игрушек проверена</text><text class="sm" x="402" y="466">одна: номер не отсеял</text><text class="sm" x="640" y="446">−1 принято; +600000 принято</text><text class="sm" x="640" y="466">и портит соединение</text></g>
<g class="a e9"><rect class="bxa" x="40" y="490" width="880" height="102" rx="8"/><text class="sm tk" x="52" y="514">пять из шести условий у получателя оставляют след, снятый ACK не оставляет</text><text class="sm" x="52" y="536">есть игрушка против четырёх условий: MD5, суммы, номера, снятого ACK</text><text class="sm" x="52" y="558">против срока жизни, подтверждения и метки времени игрушки нет</text><text class="sm mu" x="52" y="580">все выводы относятся к игрушке проекта и Linux 6.18</text></g>
</svg>
