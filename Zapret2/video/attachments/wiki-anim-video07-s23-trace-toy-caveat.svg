<svg xmlns="http://www.w3.org/2000/svg" class="v07-s23-trace-toy-caveat" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="v07-s23-trace-toy-caveat-t v07-s23-trace-toy-caveat-d">
<title id="v07-s23-trace-toy-caveat-t">След, игрушка и оговорка</title>
<desc id="v07-s23-trace-toy-caveat-d">Матрица условий, вторая половина: для каждого из семи условий показаны след в счётчиках сервера, игрушка, которая умеет отсеять такую подделку, и главная оговорка, и видно, что пять из шести условий у получателя оставляют след, снятый ACK не оставляет, игрушка есть против MD5, суммы, номера и снятого ACK, а против срока жизни, подтверждения и метки времени такой игрушки нет.</desc>
<style>.v07-s23-trace-toy-caveat{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
