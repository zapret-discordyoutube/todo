<rect class="bg" x="0" y="0" width="960" height="560"/>
<g class="a e1"><text class="cap" x="10" y="24">игрушка (выдумана): обложка папки и штамп письма на настоящих пакетах</text></g>
<g class="a e2"><text class="tk" x="10" y="62">пакет</text><text class="sm mu" x="10" y="82">из журнала лаборатории</text><text class="tk c" x="300" y="62">обложка</text><text class="mt mu c" x="300" y="82">connection_proto</text><text class="sm mu c" x="300" y="98">протокол соединения</text><text class="tk c" x="475" y="62">штамп</text><text class="mt mu c" x="475" y="82">payload_type</text><text class="sm mu c" x="475" y="98">вид данных пакета</text></g>
<g class="a e3"><path class="lm" d="M10 104L950 104"/></g>
<g class="a e4"><text x="14" y="132">1  →  SYN</text><rect class="bxd" x="248.0" y="112" width="104" height="28" rx="6"/><text class="mk c" x="300" y="132">unknown</text><rect class="bxd" x="393.0" y="112" width="164" height="28" rx="6"/><text class="mk c" x="475" y="132">empty</text></g>
<g class="a e5"><text x="14" y="170">2  ←  SYN-ACK</text><rect class="bxd" x="248.0" y="150" width="104" height="28" rx="6"/><text class="mk c" x="300" y="170">unknown</text><rect class="bxd" x="393.0" y="150" width="164" height="28" rx="6"/><text class="mk c" x="475" y="170">empty</text></g>
<g class="a e6"><text x="14" y="208">3  →  ACK</text><rect class="bxd" x="248.0" y="188" width="104" height="28" rx="6"/><text class="mk c" x="300" y="208">unknown</text><rect class="bxd" x="393.0" y="188" width="164" height="28" rx="6"/><text class="mk c" x="475" y="208">empty</text></g>
<g class="a e7"><text x="14" y="246">4  →  приветствие</text><rect class="bxa" x="248.0" y="226" width="104" height="28" rx="6"/><text class="mk c" x="300" y="246">tls</text><rect class="bxb" x="393.0" y="226" width="164" height="28" rx="6"/><text class="mk c" x="475" y="246">tls_client_hello</text></g>
<g class="a e8"><text x="14" y="284">5  ←  ACK</text><rect class="bxa" x="248.0" y="264" width="104" height="28" rx="6"/><text class="mk c" x="300" y="284">tls</text><rect class="bxd" x="393.0" y="264" width="164" height="28" rx="6"/><text class="mk c" x="475" y="284">empty</text></g>
<g class="a e9"><text x="14" y="322">6  ←  ответ сервера</text><rect class="bxa" x="248.0" y="302" width="104" height="28" rx="6"/><text class="mk c" x="300" y="322">tls</text><rect class="bxs" x="393.0" y="302" width="164" height="28" rx="6"/><text class="mk c" x="475" y="322">unknown</text></g>
<g class="a e10"><text x="14" y="360">7–11  ещё пять пакетов</text><rect class="bxa" x="248.0" y="340" width="104" height="28" rx="6"/><text class="mk c" x="300" y="360">tls</text><rect class="bxd" x="393.0" y="340" width="164" height="28" rx="6"/><text class="mk c" x="475" y="360">empty</text></g>
<g class="a e11 tr"><rect class="bxn" x="242" y="223" width="116" height="34" rx="8"/></g>
<g class="a e12"><text class="tk c" x="650" y="62">дверь профиля</text><text class="mt mu c" x="650" y="82">filter-l7=tls</text><text class="sm mu c" x="650" y="98">по коду</text></g>
<g class="a e13"><rect class="bxr" x="584" y="112" width="132" height="28" rx="6"/><path class="lr" d="M591 121L601 131M591 131L601 121"/><text class="sm rej c" x="664" y="132">не подходит</text><rect class="bxr" x="584" y="150" width="132" height="28" rx="6"/><path class="lr" d="M591 159L601 169M591 169L601 159"/><text class="sm rej c" x="664" y="170">не подходит</text><rect class="bxr" x="584" y="188" width="132" height="28" rx="6"/><path class="lr" d="M591 197L601 207M591 207L601 197"/><text class="sm rej c" x="664" y="208">не подходит</text><rect class="bxo" x="584" y="226" width="132" height="28" rx="6"/><path class="lo" d="M591 239L596 245L606 232"/><text class="sm ok c" x="664" y="246">подходит</text><rect class="bxo" x="584" y="264" width="132" height="28" rx="6"/><path class="lo" d="M591 277L596 283L606 270"/><text class="sm ok c" x="664" y="284">подходит</text><rect class="bxo" x="584" y="302" width="132" height="28" rx="6"/><path class="lo" d="M591 315L596 321L606 308"/><text class="sm ok c" x="664" y="322">подходит</text><rect class="bxo" x="584" y="340" width="132" height="28" rx="6"/><path class="lo" d="M591 353L596 359L606 346"/><text class="sm ok c" x="664" y="360">подходит</text></g>
<g class="a e14"><text class="tk c" x="842" y="62">вызов multisplit</text><text class="mt mu c" x="842" y="82">payload=tls_client_hello</text><text class="sm mu c" x="842" y="98">как в лаборатории</text></g>
<g class="a e15"><rect class="bxd" x="752" y="112" width="180" height="28" rx="6"/><text class="sm mu c" x="842" y="132">не зовут: пусто</text><rect class="bxd" x="752" y="150" width="180" height="28" rx="6"/><text class="sm mu c" x="842" y="170">не зовут: пусто</text><rect class="bxd" x="752" y="188" width="180" height="28" rx="6"/><text class="sm mu c" x="842" y="208">не зовут: пусто</text><rect class="bxo" x="752" y="226" width="180" height="28" rx="6"/><text class="tk c ok" x="842" y="246">ЗОВУТ</text><rect class="bxd" x="752" y="264" width="180" height="28" rx="6"/><text class="sm mu c" x="842" y="284">не зовут: пусто</text><rect class="bxd" x="752" y="302" width="180" height="28" rx="6"/><text class="sm mu c" x="842" y="322">не зовут: неизвестно</text><rect class="bxd" x="752" y="340" width="180" height="28" rx="6"/><text class="sm mu c" x="842" y="360">не зовут: пусто</text></g>
<g class="a e16"><rect class="bx" x="10" y="388" width="940" height="62" rx="7"/><text class="m" x="24" y="412">* lua &#x27;multisplit_1_2&#x27; : payload_type <tspan class="hbr">&#x27;empty&#x27; does not satisfy filter</tspan></text><text class="sm rej r" x="938" y="412">SYN, ACK: не запускают</text><text class="m" x="24" y="437">* lua &#x27;multisplit_1_2&#x27; : payload_type <tspan class="hbo">&#x27;tls_client_hello&#x27; satisfy filter</tspan></text><text class="sm ok r" x="938" y="437">приветствие: работает</text></g>
<g class="a e17"><rect class="bx" x="10" y="464" width="466" height="78" rx="7"/><text class="tk sm" x="24" y="486">опыт: filter-l7=http на соединении TLS</text><text class="sm" x="24" y="508">профиль не подошёл ни на SYN, ни на приветствии:</text><text class="sm" x="24" y="528">запрос ушёл одним куском, 250 байт</text></g>
<g class="a e18"><rect class="bx" x="484" y="464" width="466" height="78" rx="7"/><text class="tk sm" x="498" y="486">опыт: filter-l7=unknown, затем профиль с tls</text><text class="sm" x="498" y="508">на SYN подошёл первый профиль, на приветствии</text><text class="sm" x="498" y="528">выбор переехал на второй: куски 104 + 146 байт</text></g>
</svg>
