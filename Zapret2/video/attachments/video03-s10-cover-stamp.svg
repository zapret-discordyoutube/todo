.v03-s10-cover-stamp .nos{stroke:none}
.v03-s10-cover-stamp .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v03-s10-cover-stamp .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v03-s10-cover-stamp .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v03-s10-cover-stamp .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v03-s10-cover-stamp .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v03-s10-cover-stamp .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
