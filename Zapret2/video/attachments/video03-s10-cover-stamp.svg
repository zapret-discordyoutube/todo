.v03-s10-cover-stamp .fa{fill:var(--acc);stroke:none}
.v03-s10-cover-stamp .fo{fill:var(--ok);stroke:none}
.v03-s10-cover-stamp .fr{fill:var(--rej);stroke:none}
.v03-s10-cover-stamp .fm{fill:var(--line);stroke:none}
.v03-s10-cover-stamp .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v03-s10-cover-stamp .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v03-s10-cover-stamp .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v03-s10-cover-stamp .la{fill:none;stroke:var(--acc);stroke-width:2}
.v03-s10-cover-stamp .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s10-cover-stamp .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s10-cover-stamp .hf{fill:var(--fg2)}.v03-s10-cover-stamp .ha{fill:var(--acc)}.v03-s10-cover-stamp .hr{fill:var(--rej)}.v03-s10-cover-stamp .hm{fill:var(--mute)}.v03-s10-cover-stamp .ho{fill:var(--ok)}
.v03-s10-cover-stamp .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v03-s10-cover-stamp .a{animation-duration:33s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v03-s10-cover-stamp .a{animation:none}.v03-s10-cover-stamp .tr{display:none}}
