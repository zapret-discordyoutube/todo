<svg xmlns="http://www.w3.org/2000/svg" class="v03-s10-cover-stamp" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v03-s10-cover-stamp-t v03-s10-cover-stamp-d">
<title id="v03-s10-cover-stamp-t">Обложка соединения и штамп пакета</title>
<desc id="v03-s10-cover-stamp-d">Игрушка про обложку папки и штамп письма на настоящих пакетах лаборатории: обложка (протокол соединения) остаётся unknown на SYN, SYN-ACK и первом ACK и становится tls с приветствия, а штамп (вид данных пакета) у пакетов без данных empty, у приветствия tls_client_hello, у ответа сервера unknown; вызов с payload=tls_client_hello запускается только на приветствии, а профиль с filter-l7=tls к SYN не подходит.</desc>
<style>.v03-s10-cover-stamp{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v03-s10-cover-stamp{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v03-s10-cover-stamp .bg{fill:var(--bg)}
.v03-s10-cover-stamp text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v03-s10-cover-stamp .tk{font-weight:600;fill:var(--fg)}
.v03-s10-cover-stamp .sm{font-size:14.5px}
.v03-s10-cover-stamp .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v03-s10-cover-stamp .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v03-s10-cover-stamp .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v03-s10-cover-stamp .mt{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px}
.v03-s10-cover-stamp .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v03-s10-cover-stamp .mu{fill:var(--mute)}.v03-s10-cover-stamp .fg{fill:var(--fg)}.v03-s10-cover-stamp .acc{fill:var(--acc)}.v03-s10-cover-stamp .rej{fill:var(--rej)}.v03-s10-cover-stamp .ok{fill:var(--ok)}.v03-s10-cover-stamp .amb{fill:var(--amb)}
.v03-s10-cover-stamp .hb{fill:var(--acc);font-weight:700}.v03-s10-cover-stamp .hbr{fill:var(--rej);font-weight:700}.v03-s10-cover-stamp .hbo{fill:var(--ok);font-weight:700}.v03-s10-cover-stamp .hbb{fill:var(--amb);font-weight:700}
