<g class="a e2"><text class="ix" x="52" y="57">1282</text><text class="ix" x="92" y="57">function rawsend_payload_segmented(desync, payload, seq, options)</text></g>
<g class="a e3"><text class="ix" x="52" y="86">1283</text><text class="m mu" x="92" y="86">-- save some cpu and ram</text></g>
<g class="a e4"><text class="ix" x="52" y="115">1284</text><text class="m" x="92" y="115">local dis = (payload or seq and seq~=0)</text></g>
<g class="a e5"><text class="ix" x="52" y="144"></text><text class="m" x="92" y="144">    and deepcopy(desync.dis) or desync.dis</text></g>
<g class="a e6"><text class="ix" x="52" y="173">1285</text><text class="m" x="92" y="173">if payload then dis.payload = payload end</text></g>
<g class="a e7"><text class="ix" x="52" y="202">1286</text><text class="m" x="92" y="202">if dis.tcp and seq then</text></g>
<g class="a e8"><text class="ix" x="52" y="231">1287</text><text class="m" x="92" y="231">  dis.tcp.th_seq = dis.tcp.th_seq + seq</text></g>
<g class="a e9"><text class="ix" x="52" y="260">1288</text><text class="m" x="92" y="260">end</text></g>
<g class="a e10"><text class="ix" x="52" y="289">1289</text><text class="m" x="92" y="289">return rawsend_dissect_segmented(desync, dis, nil, options)</text></g>
