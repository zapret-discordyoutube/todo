<svg xmlns="http://www.w3.org/2000/svg" class="v05-s12-sender-walk" viewBox="0 0 960 730" width="960" height="730" role="img" aria-labelledby="v05-s12-sender-walk-t v05-s12-sender-walk-d">
<title id="v05-s12-sender-walk-t">Отправщик части: по строкам</title>
<desc id="v05-s12-sender-walk-d">Отправщик части rawsend_payload_segmented (lua/zapret-lib.lua:1282-1290, девять строк) по строкам: строка 1284 решает делать ли копию таблицы desync, если дана часть данных или сдвиг не ноль, строка 1285 кладёт часть в копию, строки 1286-1288 для TCP прибавляют сдвиг к порядковому номеру, строка 1289 передаёт копию функции с нарезкой без размера порции; сдвиг multisplit вычисляет как pos_start-1-seqovl, для второй части 105-1-0=104, для первой 1-1-0=0, а исходный пакет с 250 байтами и номером T остаётся целым; прогон функций с отправкой, заменённой записью, показал: три байта ABC со сдвигом 7 дают один пакет в 3 байта с номером T+7, вызов без данных и без сдвига повторяет исходные 250 байт, после вызовов исходная таблица цела, а если отправка не удалась, multisplit возвращает вердикт пропустить и уже отправленные части остаются на проводе.</desc>
