<svg xmlns="http://www.w3.org/2000/svg" class="v02-s11-dsack-recap" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="v02-s11-dsack-recap-t v02-s11-dsack-recap-d">
<title id="v02-s11-dsack-recap-t">Дубль и пометка D-SACK</title>
<desc id="v02-s11-dsack-recap-d">Повтор, когда ничего не терялось, в опыте с большим запросом: сегмент в 1448 байт (номер 1) и сегмент в 36 байт (номер 1449) дошли, сервер подтвердил весь запрос номером 1485, и тот же 36-байтный сегмент с тем же порядковым номером 2 856 733 027 пришёл ещё раз; сервер отбросил дубль и ответил подтверждением в 78 байт с опцией SACK от 2 856 733 027 до 2 856 733 063, это пометка D-SACK; итог части: нумерация байтов, подтверждение как следующий ожидаемый байт и повторная отправка как ответ на молчание значат, что приёмник собирает запрос по номерам, выбрасывает дубли, и ему безразлично, как запрос нарезан на пакеты.</desc>
<style>.v02-s11-dsack-recap{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
