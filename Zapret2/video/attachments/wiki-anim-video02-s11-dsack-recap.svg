<rect class="bg" x="0" y="0" width="960" height="570"/>
<g class="a e1"><text class="cap" x="10" y="24">повтор без потери: большой запрос, 1484 байта в двух сегментах</text></g>
<g class="a e2"><rect class="bx" x="60" y="36" width="180" height="34" rx="8"/><text class="tk c" x="150" y="59">Клиент</text><rect class="bx" x="720" y="36" width="180" height="34" rx="8"/><text class="tk c" x="810" y="59">Сервер</text><path class="lmd" d="M150 70L150 292"/><path class="lmd" d="M810 70L810 292"/></g>
<g class="a e3"><path class="lf" d="M156 104L794.0 104.0"/><polygon class="hf" points="804,104 794.0,109.0 794.0,99.0"/><text class="sm c" x="480" y="96">сегмент 1: 1448 байт, номер 1</text><text class="mt r mu" x="138" y="109">130,6 мс</text></g>
<g class="a e4 tr"><circle class="dot" cx="0" cy="0" r="6"/></g>
<g class="a e5"><path class="lf" d="M156 146L794.0 146.0"/><polygon class="hf" points="804,146 794.0,151.0 794.0,141.0"/><text class="sm c" x="480" y="138">сегмент 2: 36 байт, номер 1449</text><text class="mt r mu" x="138" y="151">166,7 мс</text></g>
<g class="a e6 tr"><circle class="dot" cx="0" cy="0" r="6"/></g>
<g class="a e7"><path class="la" d="M804 188L166.0 188.0"/><polygon class="ha" points="156,188 166.0,183.0 166.0,193.0"/><text class="sm c" x="480" y="180">подтверждение: всё получено, жду байт 1485</text><text class="mt r mu" x="138" y="193">222,0 мс</text></g>
<g class="a e8 tr"><circle class="dot" cx="0" cy="0" r="6"/></g>
<g class="a e9"><path class="lr" d="M156 232L794.0 232.0"/><polygon class="hr" points="804,232 794.0,237.0 794.0,227.0"/><text class="sm c" x="480" y="224">тот же сегмент 2 ещё раз: 36 байт, номер 1449</text><text class="mt r mu" x="138" y="237">235,4 мс</text></g>
<g class="a e10 tr"><circle class="dot" cx="0" cy="0" r="6"/></g>
<g class="a e11"><path class="la" d="M804 274L166.0 274.0"/><polygon class="ha" points="156,274 166.0,269.0 166.0,279.0"/><text class="sm c" x="480" y="266">ответ в 78 байт: подтверждение 1485 и SACK</text><text class="mt r mu" x="138" y="279">235,5 мс</text></g>
<g class="a e12 tr"><circle class="dot" cx="0" cy="0" r="6"/></g>
<g class="a e13"><rect class="bxb" x="10" y="304" width="940" height="76" rx="8"/><text class="tk" x="24" y="328">D-SACK: «диапазон от 2 856 733 027 до 2 856 733 063 я получил повторно»</text><text class="sm" x="24" y="349">Приёмник сам заметил по номерам, что эти байты у него уже есть, и выбросил дубль.</text><text class="sm mu" x="24" y="369">1449 это относительный номер, в пакете он записан как 2 856 733 027. Зачем клиент прислал дубль, не выясняли.</text></g>
<g class="a e14"><text class="cap" x="10" y="410">итог части: что мы узнали про TCP</text></g>
<g class="a e15"><rect class="bxa" x="10" y="420" width="300" height="52" rx="8"/><text class="tk" x="24" y="443">1. Нумерация байтов</text><text class="sm" x="24" y="463">у каждого байта свой номер</text></g>
<g class="a e16"><rect class="bxa" x="330" y="420" width="300" height="52" rx="8"/><text class="tk" x="344" y="443">2. Подтверждение</text><text class="sm" x="344" y="463">это следующий ожидаемый байт</text></g>
<g class="a e17"><rect class="bxa" x="650" y="420" width="300" height="52" rx="8"/><text class="tk" x="664" y="443">3. Повторная отправка</text><text class="sm" x="664" y="463">это ответ на молчание</text></g>
<g class="a e18"><path class="lf" d="M160 476L160.0 484.0"/><polygon class="hf" points="160,494 155.0,484.0 165.0,484.0"/><path class="lf" d="M480 476L480.0 484.0"/><polygon class="hf" points="480,494 475.0,484.0 485.0,484.0"/><path class="lf" d="M800 476L800.0 484.0"/><polygon class="hf" points="800,494 795.0,484.0 805.0,484.0"/></g>
<g class="a e19"><rect class="bxo" x="10" y="498" width="940" height="62" rx="8"/><text class="tk" x="24" y="522">Приёмник собирает запрос по номерам и выбрасывает дубли: ему всё равно, как он нарезан.</text><text class="sm mu" x="24" y="546">Инспектор, не собирающий поток, видит только куски; собирает ли поток настоящее оборудование, мы не знаем.</text></g>
</svg>
