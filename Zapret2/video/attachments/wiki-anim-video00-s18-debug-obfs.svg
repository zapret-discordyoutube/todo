<svg xmlns="http://www.w3.org/2000/svg" class="v00-s18-debug-obfs" viewBox="0 0 960 574" width="960" height="574" role="img" aria-labelledby="v00-s18-debug-obfs-t v00-s18-debug-obfs-d">
<title id="v00-s18-debug-obfs-t">Журнал, проверка и обфускация</title>
<desc id="v00-s18-debug-obfs-d">Журнал отладки показывает, что программа делала с каждым пакетом, и в документации сказано, что умение его читать совершенно необходимо, режим dry-run проверяет опции и выходит, не запуская Lua, вызов pcap записывает пакеты в файл, повторить опыт можно в лаборатории без прав администратора, а отдельно стоит обфускация, то есть маскировка протокола, где двум из четырёх инструментов нужна программа на обоих концах.</desc>
