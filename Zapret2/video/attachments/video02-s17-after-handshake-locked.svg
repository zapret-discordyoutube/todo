.v02-s17-after-handshake .tk{font-weight:600;fill:var(--fg)}
.v02-s17-after-handshake .sm{font-size:14.5px}
.v02-s17-after-handshake .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
