.v02-s17-after-handshake .hf{fill:var(--fg2)}.v02-s17-after-handshake .ha{fill:var(--acc)}.v02-s17-after-handshake .hr{fill:var(--rej)}.v02-s17-after-handshake .hm{fill:var(--mute)}.v02-s17-after-handshake .ho{fill:var(--ok)}.v02-s17-after-handshake .hbm{fill:var(--amb)}
.v02-s17-after-handshake .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
