<g class="a e1"><text class="cap" x="10" y="22">один разговор клиента и сервера, пакеты по порядку</text></g>
<g class="a e2"><rect class="bx" x="10" y="40" width="98" height="52" rx="7"/><text class="tk c sm" x="59" y="71">SYN</text></g>
<g class="a e3"><rect class="bx" x="114" y="40" width="98" height="52" rx="7"/><text class="tk c sm" x="163" y="71">SYN+ACK</text></g>
<g class="a e4"><rect class="bx" x="218" y="40" width="98" height="52" rx="7"/><text class="tk c sm" x="267" y="71">ACK</text></g>
<g class="a e5"><rect class="bxa" x="322" y="40" width="98" height="52" rx="7"/><text class="tk c sm" x="371" y="71">ClientHello</text></g>
<g class="a e6"><rect class="bxd" x="426" y="40" width="98" height="52" rx="7"/><text class="tk c" x="475" y="73">…</text></g>
<g class="a e7"><rect class="bxs" x="530" y="40" width="98" height="52" rx="7"/><text class="sm mu c" x="589" y="76">данные</text><path class="lm" d="M542 60V57a5 5 0 0 1 10 0V60"/><rect class="bxs" x="538" y="60" width="18" height="13" rx="2"/></g>
<g class="a e8"><rect class="bxs" x="634" y="40" width="98" height="52" rx="7"/><text class="sm mu c" x="693" y="76">данные</text><path class="lm" d="M646 60V57a5 5 0 0 1 10 0V60"/><rect class="bxs" x="642" y="60" width="18" height="13" rx="2"/></g>
<g class="a e9"><rect class="bxs" x="738" y="40" width="98" height="52" rx="7"/><text class="sm mu c" x="797" y="76">данные</text><path class="lm" d="M750 60V57a5 5 0 0 1 10 0V60"/><rect class="bxs" x="746" y="60" width="18" height="13" rx="2"/></g>
<g class="a e10"><rect class="bxs" x="842" y="40" width="98" height="52" rx="7"/><text class="sm mu c" x="901" y="76">данные</text><path class="lm" d="M854 60V57a5 5 0 0 1 10 0V60"/><rect class="bxs" x="850" y="60" width="18" height="13" rx="2"/></g>
<g class="a e11"><path class="la" d="M10 106L420 106"/><path class="la" d="M10 100L10 106"/><path class="la" d="M420 100L420 106"/><text class="tk acc" x="10" y="128">начало: открыто</text></g>
<g class="a e12"><path class="lm" d="M530 106L940 106"/><path class="lm" d="M530 100L530 106"/><path class="lm" d="M940 100L940 106"/><text class="tk" x="530" y="128">после рукопожатия: зашифровано</text></g>
<g class="a e13"><rect class="bxa" x="10" y="160" width="462" height="200" rx="8"/><text class="tk" x="26" y="188">Наблюдатель на пути, как правило, видит</text><rect class="fa" x="26" y="208" width="8" height="8" rx="2"/><text x="44" y="218">адреса IP</text><rect class="fa" x="26" y="236" width="8" height="8" rx="2"/><text x="44" y="246">порты</text><rect class="fa" x="26" y="264" width="8" height="8" rx="2"/><text x="44" y="274">размеры пакетов</text><rect class="fa" x="26" y="292" width="8" height="8" rx="2"/><text x="44" y="302">время</text><rect class="fa" x="26" y="320" width="8" height="8" rx="2"/><text x="44" y="330">название сайта: из ClientHello или строки Host</text></g>
<g class="a e14"><rect class="bxs" x="488" y="160" width="462" height="200" rx="8"/><text class="tk" x="504" y="188">Не видно: зашифровано ключом</text><text class="sm mu" x="504" y="208">его знают только клиент и сервер</text><rect class="fmu" x="504" y="232" width="8" height="8" rx="2"/><text x="522" y="242">данные страницы</text><rect class="fmu" x="504" y="262" width="8" height="8" rx="2"/><text x="522" y="272">адрес внутри сайта</text><rect class="fmu" x="504" y="292" width="8" height="8" rx="2"/><text x="522" y="302">ваши запросы</text><path class="lm" d="M908 182V179a5 5 0 0 1 10 0V182"/><rect class="bxs" x="904" y="182" width="18" height="13" rx="2"/></g>
<g class="a e15"><rect class="bxb" x="10" y="384" width="940" height="66" rx="8"/><text class="tk" x="26" y="410">Поэтому всё, что мы разбираем в серии, касается самого начала соединения.</text><text class="sm" x="26" y="434">Открытыми остаются адреса, порты, размеры и время; название сайта видно в самом начале.</text></g>
