<svg xmlns="http://www.w3.org/2000/svg" class="v00-s05-protocol-signature" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="v00-s05-protocol-signature-t v00-s05-protocol-signature-d">
<title id="v00-s05-protocol-signature-t">Блок по сигнатуре протокола</title>
<desc id="v00-s05-protocol-signature-d">Блок по протоколу: описание программы называет сигнатурный анализ протоколов и блокировку VPN, сама программа узнаёт сигнатуры десяти протоколов, среди них WireGuard и QUIC, автор пишет, что блокирующие бывают привязаны к отпечатку клиента, по общим сведениям одной правкой первых пакетов тут не обойтись и в проекте есть отдельные средства обфускации, а полный запрет протокола в лаборатории не воспроизводили.</desc>
