<svg xmlns="http://www.w3.org/2000/svg" class="v04-s15-cheatsheet-strips" viewBox="0 0 960 596" width="960" height="596" role="img" aria-labelledby="v04-s15-cheatsheet-strips-t v04-s15-cheatsheet-strips-d">
<title id="v04-s15-cheatsheet-strips-t">Шпаргалка: числа меток на двух лентах</title>
<desc id="v04-s15-cheatsheet-strips-d">Шпаргалка чисел на двух лентах. На приветствии в 250 байт метки стоят по возрастанию: extlen 86, sniext 92, host 97, sld 101, midsld 104, endsld 108, endhost 112; имя www.example.com занимает байты 97–111. В запросе HTTP в 81 байт: method 0, host 32, sld 36, midsld 39, endsld 43, endhost 47; имя занимает байты 32–46. На обеих лентах метка midsld режет имя на «www.exa» и «mple.com»: 104 на приветствии и 39 на запросе.</desc>
