<rect class="bg" x="0" y="0" width="960" height="668"/>
<g><text class="cap" x="40" y="26">номер очереди: правило ядра и параметр запуска</text></g>
<g class="a e1"><rect class="bxa" x="40" y="40" width="400" height="92" rx="6"/><text class="tk sm" x="52" y="62">правило ядра (nftables)</text><text class="m" x="52" y="86">… tcp dport {80,443} ct original</text><text class="m" x="52" y="106">packets 1-12 queue num 200 bypass</text></g>
<g class="a e2"><rect class="bxa" x="520" y="40" width="400" height="92" rx="6"/><text class="tk sm" x="532" y="62">параметр запуска программы</text><text class="m" x="532" y="86">nfqws2 --qnum=200 …</text><text class="ix" x="532" y="106">params.qnum = atoi(optarg): nfqws.c:2392</text></g>
<g class="a e3"><rect class="bxo" x="450" y="62" width="60" height="44" rx="22"/><text class="mk c ok" x="480" y="91">200</text><text class="ix c" x="480" y="56">равны</text></g>
<g class="a e4"><rect class="bx" x="40" y="146" width="880" height="28" rx="4"/><text class="m" x="52" y="165">binding this socket to queue &#x27;200&#x27;</text><text class="sm mu r" x="908" y="165">строка журнала, nfqws.c:391</text></g>
<g class="a e5"><text class="cap" x="40" y="200">допустимые номера (шкала не в масштабе)</text><rect class="bxo" x="130" y="214" width="790" height="24" rx="3"/><text class="ix c" x="130" y="256">0</text><text class="ix r" x="920" y="256">65535</text><text class="sm c ok ns" x="525" y="231">от 0 до 65535</text></g>
<g class="a e6"><path class="lf" d="M190 238L190 262"/><path class="lf" d="M190 262L250 262"/><rect class="pl" x="250" y="250" width="190" height="24" rx="5"/><text class="mk" x="262" y="267">200: наш номер</text></g>
<g class="a e7"><rect class="bxb" x="40" y="214" width="62" height="24" rx="3"/><text class="mk c amb ns" x="71" y="231">−1</text><text class="sm amb" x="40" y="292">по умолчанию −1: не задано</text></g>
<g class="a e8"><rect class="bxr" x="40" y="310" width="880" height="32" rx="5"/><text class="m" x="52" y="331">нет --qnum, перехват включён</text><text class="sm" x="336" y="331">Need queue number (--qnum), выход с кодом 1</text><text class="ix r" x="908" y="331">nfqws.c:3178-3181</text></g>
<g class="a e9"><rect class="bxr" x="40" y="346" width="880" height="32" rx="5"/><text class="m" x="52" y="367">--qnum=-1 или --qnum=70000</text><text class="sm" x="336" y="367">bad qnum, выход с кодом 1</text><text class="ix r" x="908" y="367">nfqws.c:2393-2397</text></g>
<g class="a e10"><rect class="bxo" x="40" y="382" width="880" height="32" rx="5"/><text class="m" x="52" y="403">--qnum=200</text><text class="sm" x="336" y="403">очередь 200: nfq_create_queue</text><text class="ix r" x="908" y="403">nfqws.c:392</text></g>
<g class="a e11"><rect class="bxs" x="40" y="418" width="880" height="32" rx="5"/><text class="m" x="52" y="439">--intercept=0</text><text class="sm" x="336" y="439">очередь не нужна: nfq_init не вызывается</text><text class="ix r" x="908" y="439">nfqws.c:491-496</text></g>
<g class="a e12"><text class="tk" x="40" y="482">а если очередь 200 никто не слушает?</text></g>
<g class="a e13"><text class="sm" x="40" y="526">с bypass в правиле</text><rect class="bxo" x="250" y="506" width="30" height="26" rx="4"/><path class="lo" d="M258 519L263 525L273 512"/><rect class="bxo" x="286" y="506" width="30" height="26" rx="4"/><path class="lo" d="M294 519L299 525L309 512"/><text class="tk sm ok" x="330" y="526">2 из 2 дошли</text><text class="sm" x="40" y="562">без bypass</text><rect class="bxr" x="250" y="542" width="30" height="26" rx="4"/><path class="lr" d="M258 548L272 562M258 562L272 548"/><rect class="bxr" x="286" y="542" width="30" height="26" rx="4"/><path class="lr" d="M294 548L308 562M294 562L308 548"/><text class="tk sm rej" x="330" y="562">0 из 2 дошли: очередь без слушателя отбросила</text></g>
<g class="a e14"><text class="sm mu" x="40" y="592">Наш тест: UDP в изолированном пространстве имён, nfqws2 не запущен. TCP так не проверяли;</text><text class="sm mu" x="40" y="612">для опечатки в номере это логический вывод, не измерение.</text></g>
</svg>
