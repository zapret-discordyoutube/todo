<svg xmlns="http://www.w3.org/2000/svg" class="v16-s11-qnum-meeting" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="v16-s11-qnum-meeting-t v16-s11-qnum-meeting-d">
<title id="v16-s11-qnum-meeting-t">Два числа очереди должны совпасть</title>
<desc id="v16-s11-qnum-meeting-d">Откуда берётся номер очереди. В правиле ядра стоит queue num 200, в параметре запуска --qnum=200, и в журнале строка binding this socket to queue &#x27;200&#x27;: два числа обязаны совпасть. Допустимы номера от 0 до 65535; значение по умолчанию внутри программы −1 означает «не задано». Четыре случая: без --qnum при включённом перехвате программа пишет Need queue number и выходит с кодом 1 (nfqws.c:3178-3181); --qnum=-1 или 70000 даёт bad qnum и выход 1 (nfqws.c:2393-2397); --qnum=200 создаёт очередь 200; при --intercept=0 очередь не нужна и nfq_init не вызывается (nfqws.c:491-496). Внизу вопрос, что будет без слушателя очереди 200: в нашем тесте на UDP в изолированном пространстве имён с bypass дошли 2 пакета из 2, без bypass 0 из 2; TCP и опечатку в номере так не проверяли.</desc>
