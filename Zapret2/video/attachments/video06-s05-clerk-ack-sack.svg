<svg xmlns="http://www.w3.org/2000/svg" class="video06-s05-clerk-ack-sack" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="video06-s05-clerk-ack-sack-t video06-s05-clerk-ack-sack-d">
<title id="video06-s05-clerk-ack-sack-t">Кладовщик, ACK и SACK</title>
<desc id="video06-s05-clerk-ack-sack-d">Выдуманный пример: кладовщик принимает длинное письмо, на стол ложится страница с буквами 105–250, он говорит «жду первую», это ACK, кладёт страницу в отдельную коробку и добавляет «у меня лежат 105–250», это SACK, а когда ложится страница 1–104, коробка пустеет и он говорит «жду 251, всё до 250 есть»; ACK 1 значит жду байт номер один, блок от 105 до 251 значит лежат байты со 105 по 250, правая граница записана на единицу больше.</desc>
<style>.video06-s05-clerk-ack-sack{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
