<rect class="bg" x="0" y="0" width="960" height="520"/>
<g><text class="cap" x="40" y="24">игрушка, выдуманный пример: склад принимает длинное письмо</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="430" height="232" rx="6"/><text class="sm tk" x="52" y="58">1. на стол легла страница с буквами 105–250</text><rect class="bxb" x="52" y="70" width="200" height="30" rx="5"/><text class="sm tk c" x="152" y="91">страница 105–250</text></g>
<g class="a e2"><rect class="bxa" x="52" y="112" width="280" height="34" rx="16"/><text class="sm tk c" x="192" y="134">«Жду первую»</text><rect class="bxs" x="342" y="116" width="56" height="26" rx="4"/><text class="ix c fg tk" x="370" y="134">ACK</text></g>
<g class="a e3"><rect class="bxb" x="52" y="158" width="360" height="34" rx="16"/><text class="sm tk" x="62" y="180">«И у меня лежат 105–250»</text><rect class="bxs" x="412" y="162" width="48" height="26" rx="4"/><text class="ix c fg tk" x="436" y="180">SACK</text></g>
<g class="a e4"><rect class="bxd" x="52" y="204" width="200" height="52" rx="5"/><text class="ix mu" x="60" y="224">коробка «лежит»:</text><text class="sm tk" x="60" y="246">страница 105–250</text></g>
<g class="a e5"><rect class="bx" x="490" y="36" width="430" height="232" rx="6"/><text class="sm tk" x="502" y="58">2. на стол легла страница 1–104</text><rect class="bxa" x="502" y="70" width="200" height="30" rx="5"/><text class="sm tk c" x="602" y="91">страница 1–104</text></g>
<g class="a e6"><rect class="bxd" x="502" y="204" width="200" height="52" rx="5"/><text class="ix mu" x="510" y="224">коробка «лежит»:</text><text class="sm tk" x="510" y="246">пусто</text></g>
<g class="a e7"><rect class="bxo" x="502" y="112" width="340" height="34" rx="16"/><text class="sm tk" x="514" y="134">«Жду 251: всё до 250 есть»</text><rect class="bxs" x="852" y="116" width="56" height="26" rx="4"/><text class="ix c fg tk" x="880" y="134">ACK</text></g>
<g class="a e8"><text class="sm" x="502" y="180">блока нет: в стороне ничего не лежит</text></g>
<g class="a e9"><text class="cap" x="40" y="296">два термина</text></g>
<g class="a e10"><rect class="bxa" x="40" y="306" width="430" height="86" rx="6"/><text class="big" x="52" y="336">ACK 1</text><text class="sm" x="52" y="360">подтверждение: жду байт номер один,</text><text class="sm" x="52" y="380">по порядку ничего не получено</text></g>
<g class="a e11"><rect class="bxb" x="490" y="306" width="430" height="86" rx="6"/><text class="big" x="502" y="336">блок [105, 251)</text><text class="sm" x="502" y="360">у меня лежат байты от 105 до 250;</text><text class="sm" x="502" y="380">правая граница записана на единицу больше</text></g>
<g class="a e12"><text class="sm tk" x="40" y="418">блок ничего не подтверждает: он только сообщает, что лежит в стороне</text></g>
<g class="a e13"><text class="sm" x="40" y="442">по общим сведениям, SACK это расширение TCP, и оба конца разрешают его в начале соединения</text></g>
<g class="a e14"><text class="sm" x="40" y="464">в нашем рукопожатии оба конца его разрешили (опция SACKOK в SYN и SYN-ACK)</text></g>
<g class="a e15"><text class="ix mu r" x="920" y="504">числа пересчитаны от первого байта: он номер 1</text></g>
</svg>
