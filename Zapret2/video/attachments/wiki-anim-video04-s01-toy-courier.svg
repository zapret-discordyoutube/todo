@keyframes v04-s01-courier-k8{0.0%{opacity:0}37.5%{opacity:0}39.375%{opacity:1}95.417%{opacity:1}97.917%{opacity:0}100%{opacity:0}}.v04-s01-courier .e8{animation-name:v04-s01-courier-k8}
