<rect class="bg" x="0" y="0" width="960" height="392"/>
<g class="a e1"><text class="cap" x="30" y="28">курьер режет письма</text><rect class="bxd" x="746" y="10" width="184" height="26" rx="6"/><text class="sm c" x="838" y="28">выдуманный пример</text></g>
<g class="a e2"><text class="tk" x="30" y="66">Просьба 1: «разрежь на четвёртом слове»</text></g>
<g class="a e3"><text class="sm mu" x="30" y="103">письмо 1</text><rect class="bx" x="130" y="80" width="83.4" height="34" rx="5"/><text class="c" x="171.7" y="103">Добрый</text><rect class="bx" x="221.4" y="80" width="63.9" height="34" rx="5"/><text class="c" x="253.3" y="103">день,</text><rect class="bx" x="293.3" y="80" width="86.7" height="34" rx="5"/><text class="c" x="336.7" y="103">дорогая</text><rect class="bxa" x="388" y="80" width="64.8" height="34" rx="5"/><text class="c" x="420.4" y="103">Анна,</text><rect class="bx" x="460.8" y="80" width="63" height="34" rx="5"/><text class="c" x="492.3" y="103">пишу</text><rect class="bx" x="531.8" y="80" width="49.3" height="34" rx="5"/><text class="c" x="556.4" y="103">вам</text></g>
<g class="a e4"><text class="sm mu" x="30" y="155">письмо 2</text><rect class="bx" x="130" y="132" width="83.4" height="34" rx="5"/><text class="c" x="171.7" y="155">Добрый</text><rect class="bx" x="221.4" y="132" width="63.9" height="34" rx="5"/><text class="c" x="253.3" y="155">день,</text><rect class="bx" x="293.3" y="132" width="112.3" height="34" rx="5"/><text class="c" x="349.4" y="155">уважаемая</text><rect class="bx" x="413.6" y="132" width="89.5" height="34" rx="5"/><text class="c" x="458.4" y="155">госпожа</text><rect class="bxa" x="511.1" y="132" width="64.8" height="34" rx="5"/><text class="c" x="543.5" y="155">Анна,</text><rect class="bx" x="583.9" y="132" width="63" height="34" rx="5"/><text class="c" x="615.4" y="155">пишу</text><rect class="bx" x="654.9" y="132" width="49.3" height="34" rx="5"/><text class="c" x="679.5" y="155">вам</text></g>
<g class="a e5"><path class="lcut" d="M384 73L384 121"/><path class="lo" d="M721 97L727.3 104.2L739 89.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm tk ok" x="748" y="102">ножницы у имени</text></g>
<g class="a e6"><path class="lcut" d="M409.6 125L409.6 173"/><path class="lr" d="M722 141L738 157M722 157L738 141"/><text class="sm tk rej" x="748" y="154">ножницы не у имени</text></g>
<g class="a e7"><text class="tk" x="30" y="216">Просьба 2: «разрежь перед именем получателя»</text></g>
<g class="a e8"><text class="sm mu" x="30" y="253">письмо 1</text><rect class="bx" x="130" y="230" width="83.4" height="34" rx="5"/><text class="c" x="171.7" y="253">Добрый</text><rect class="bx" x="221.4" y="230" width="63.9" height="34" rx="5"/><text class="c" x="253.3" y="253">день,</text><rect class="bx" x="293.3" y="230" width="86.7" height="34" rx="5"/><text class="c" x="336.7" y="253">дорогая</text><rect class="bxa" x="388" y="230" width="64.8" height="34" rx="5"/><text class="c" x="420.4" y="253">Анна,</text><rect class="bx" x="460.8" y="230" width="63" height="34" rx="5"/><text class="c" x="492.3" y="253">пишу</text><rect class="bx" x="531.8" y="230" width="49.3" height="34" rx="5"/><text class="c" x="556.4" y="253">вам</text></g>
