<svg xmlns="http://www.w3.org/2000/svg" class="v01-s11-recap-cards" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="v01-s11-recap-cards-t v01-s11-recap-cards-d">
<title id="v01-s11-recap-cards-t">Итог выпуска: три карточки</title>
<desc id="v01-s11-recap-cards-d">Итог выпуска тремя карточками с теми же цифрами. Пакеты: запрос в 250 байт уехал одним пакетом в 316 байт (14 + 20 + 32 + 250) за шесть микросекунд, от 0,000 до 0,006 мс. ТСПУ как модель сортировщика: читает глубже обычного роутера, ему нужны 15 байт с именем сайта. zapret2: меняет вид пакетов на вашем устройстве; запрос разрезан на 104 и 146 байт и в лаборатории прошёл мимо игрушечного инспектора.</desc>
<style>
.v01-s11-recap-cards{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v01-s11-recap-cards{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v01-s11-recap-cards .bg{fill:var(--bg)}
.v01-s11-recap-cards text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v01-s11-recap-cards .tk{font-weight:600;fill:var(--fg)}
.v01-s11-recap-cards .sm{font-size:14.5px}
.v01-s11-recap-cards .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v01-s11-recap-cards .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v01-s11-recap-cards .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v01-s11-recap-cards .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v01-s11-recap-cards .mu{fill:var(--mute)}.v01-s11-recap-cards .fg{fill:var(--fg)}.v01-s11-recap-cards .acc{fill:var(--acc)}.v01-s11-recap-cards .rej{fill:var(--rej)}.v01-s11-recap-cards .ok{fill:var(--ok)}.v01-s11-recap-cards .amb{fill:var(--amb)}
.v01-s11-recap-cards .c{text-anchor:middle}.v01-s11-recap-cards .r{text-anchor:end}
.v01-s11-recap-cards .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v01-s11-recap-cards .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v01-s11-recap-cards .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v01-s11-recap-cards .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v01-s11-recap-cards .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v01-s11-recap-cards .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v01-s11-recap-cards .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v01-s11-recap-cards .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v01-s11-recap-cards .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v01-s11-recap-cards .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v01-s11-recap-cards .la{fill:none;stroke:var(--acc);stroke-width:2}
.v01-s11-recap-cards .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v01-s11-recap-cards .hf{fill:var(--fg2)}.v01-s11-recap-cards .ha{fill:var(--acc)}.v01-s11-recap-cards .hm{fill:var(--mute)}
.v01-s11-recap-cards .a{animation-duration:26s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v01-s11-recap-cards .a{animation:none}.v01-s11-recap-cards .tr{display:none}}
