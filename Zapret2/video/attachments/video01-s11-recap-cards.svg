ity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e6{animation-name:v01-s11-recap-cards-k6}@keyframes v01-s11-recap-cards-k7{0%{opacity:0;transform:translate(0px,8px)}31.5%{opacity:0;transform:translate(0px,8px)}34%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e7{animation-name:v01-s11-recap-cards-k7}@keyframes v01-s11-recap-cards-k8{0%{opacity:0;transform:translate(0px,8px)}37.5%{opacity:0;transform:translate(0px,8px)}40%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e8{animation-name:v01-s11-recap-cards-k8}@keyframes v01-s11-recap-cards-k9{0%{opacity:0;transform:translate(0px,8px)}43.5%{opacity:0;transform:translate(0px,8px)}46%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e9{animation-name:v01-s11-recap-cards-k9}@keyframes v01-s11-recap-cards-k10{0%{opacity:0;transform:translate(0px,8px)}55.5%{opacity:0;transform:translate(0px,8px)}58%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e10{animation-name:v01-s11-recap-cards-k10}@keyframes v01-s11-recap-cards-k11{0%{opacity:0;transform:translate(0px,8px)}59.5%{opacity:0;transform:translate(0px,8px)}62%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e11{animation-name:v01-s11-recap-cards-k11}@keyframes v01-s11-recap-cards-k12{0%{opacity:0;transform:translate(0px,8px)}65.5%{opacity:0;transform:translate(0px,8px)}68%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e12{animation-name:v01-s11-recap-cards-k12}@keyframes v01-s11-recap-cards-k13{0%{opacity:0;transform:translate(0px,8px)}71.5%{opacity:0;transform:translate(0px,8px)}74%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e13{animation-name:v01-s11-recap-cards-k13}@keyframes v01-s11-recap-cards-k14{0%{opacity:0;transform:translate(0px,8px)}79.5%{opacity:0;transform:translate(0px,8px)}82%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e14{animation-name:v01-s11-recap-cards-k14}@keyframes v01-s11-recap-cards-k15{0%{opacity:0;transform:translate(0px,8px)}85.5%{opacity:0;transform:translate(0px,8px)}88%{opacity:1;transform:translate(0px,0px)}95%{opacity:1;transform:translate(0px,0px)}98%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.v01-s11-recap-cards .e15{animation-name:v01-s11-recap-cards-k15}</style>
<rect class="bg" x="0" y="0" width="960" height="392"/>
<g class="a e1"><text class="cap" x="10" y="24">итог выпуска: три карточки</text></g>
<g class="a e2"><rect class="bx" x="6" y="40" width="300" height="272" rx="8"/><text class="tk" x="22" y="70">1. Пакеты</text><text class="sm mu" x="22" y="92">как письма на ленте</text></g>
<g class="a e3"><rect class="bxa" x="18" y="108" width="122" height="38" rx="6"/><text class="sm c tk" x="79" y="132">запрос 250 Б</text><path class="lf" d="M144 127L160 127"/><polygon class="hf" points="168,127 159,131.5 159,122.5"/><rect class="bxa" x="172" y="108" width="120" height="38" rx="6"/><text class="sm c tk" x="232" y="132">пакет 316 Б</text></g>
<g class="a e4"><text class="mk" x="22" y="180">14 + 20 + 32 + 250</text><text class="sm mu" x="22" y="202">Ethernet + IP + TCP + данные</text></g>
<g class="a e5"><text class="tk" x="22" y="244">в пути 6 микросекунд</text><text class="sm mu" x="22" y="266">c0 → s0: 0,000 → 0,006 мс</text></g>
<g class="a e6"><rect class="bx" x="330" y="40" width="300" height="272" rx="8"/><text class="tk" x="346" y="70">2. ТСПУ (модель)</text><text class="sm mu" x="346" y="92">сортировщик на пути пакета</text></g>
<g class="a e7"><text class="sm mu" x="346" y="118">данные запроса, 250 байт</text><rect class="bx" x="346" y="126" width="268" height="22" rx="3"/><rect class="bxa" x="448.9" y="126" width="16.1" height="22" rx="2"/><path class="la" d="M457.0 150L457.0 162"/></g>
<g class="a e8"><text class="sm" x="346" y="186">читает глубже обычного роутера:</text><text class="tk" x="346" y="210">ему нужны 15 байт</text><text class="tk" x="346" y="232">с именем сайта</text></g>
<g class="a e9"><text class="mk acc" x="346" y="264">www.example.com</text></g>
<g class="a e10"><rect class="bx" x="654" y="40" width="300" height="272" rx="8"/><text class="tk" x="670" y="70">3. zapret2</text><text class="sm mu" x="670" y="92">стоит на вашем устройстве</text></g>
<g class="a e11"><text class="sm mu" x="670" y="118">тот же запрос, разрезанный</text><rect class="bxo" x="670" y="126" width="108.5" height="30" rx="4"/><text class="mk c" x="724.244" y="147">104</text><rect class="bxo" x="784.5" y="126" width="153.5" height="30" rx="4"/><text class="mk c" x="861.244" y="147">146</text><path class="lcut" d="M781.5 124L781.5 164"/></g>
<g class="a e12"><text class="sm" x="670" y="190">меняет вид пакетов на пути,</text><text class="sm" x="670" y="210">не прячась за чужими серверами</text></g>
<g class="a e13"><text class="tk ok" x="670" y="244">в лаборатории разрезанный</text><text class="tk ok" x="670" y="266">запрос прошёл мимо</text><text class="tk ok" x="670" y="288">игрушечного инспектора</text></g>
<g class="a e14"><text class="sm mu" x="10" y="342">Против настоящего оборудования это не проверялось: ТСПУ здесь модель.</text></g>
<g class="a e15"><text class="tk" x="10" y="372">Пакеты как письма. ТСПУ как сортировщик (модель). zapret2 меняет вид пакетов.</text></g>
</svg>
