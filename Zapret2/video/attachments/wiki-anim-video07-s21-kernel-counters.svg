<svg xmlns="http://www.w3.org/2000/svg" class="v07-s21-kernel-counters" viewBox="0 0 960 532" width="960" height="532" role="img" aria-labelledby="v07-s21-kernel-counters-t v07-s21-kernel-counters-d">
<title id="v07-s21-kernel-counters-t">Счётчики ядра получателя</title>
<desc id="v07-s21-kernel-counters-d">Наш получатель, сервер на Linux 6.18 с настройками по умолчанию и выключенным offload, в трёх опытах отбросил подделку и сдвинул свой счётчик на единицу: при опции MD5 TCPMD5Unexpected, при испорченной контрольной сумме Tcp:InErrs и Tcp:InCsumErrors, при метке времени на две единицы старее PAWSEstab, а приложение каждый раз получило чистые 250 байт настоящего приветствия.</desc>
<style>.v07-s21-kernel-counters{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v07-s21-kernel-counters{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
