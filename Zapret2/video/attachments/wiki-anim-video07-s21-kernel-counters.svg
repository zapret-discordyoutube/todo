.v07-s21-kernel-counters .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v07-s21-kernel-counters .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v07-s21-kernel-counters .hf{fill:var(--fg2)}.v07-s21-kernel-counters .ha{fill:var(--acc)}.v07-s21-kernel-counters .hr{fill:var(--rej)}.v07-s21-kernel-counters .hm{fill:var(--mute)}.v07-s21-kernel-counters .hb{fill:var(--amb)}
.v07-s21-kernel-counters .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v07-s21-kernel-counters .a{animation-duration:40s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
