;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e4{animation-name:v07-s21-kernel-counters-k4}@keyframes v07-s21-kernel-counters-k5{0.0%{opacity:0;transform:translate(0px,-6px)}34%{opacity:0;transform:translate(0px,-6px)}36%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e5{animation-name:v07-s21-kernel-counters-k5}@keyframes v07-s21-kernel-counters-k6{0.0%{opacity:0;transform:translate(0px,-6px)}45%{opacity:0;transform:translate(0px,-6px)}47%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e6{animation-name:v07-s21-kernel-counters-k6}@keyframes v07-s21-kernel-counters-k7{0.0%{opacity:0;transform:translate(0px,-6px)}49%{opacity:0;transform:translate(0px,-6px)}51%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e7{animation-name:v07-s21-kernel-counters-k7}@keyframes v07-s21-kernel-counters-k8{0.0%{opacity:0;transform:translate(0px,-6px)}60%{opacity:0;transform:translate(0px,-6px)}62%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e8{animation-name:v07-s21-kernel-counters-k8}@keyframes v07-s21-kernel-counters-k9{0.0%{opacity:0;transform:translate(0px,-6px)}62.5%{opacity:0;transform:translate(0px,-6px)}64.5%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e9{animation-name:v07-s21-kernel-counters-k9}@keyframes v07-s21-kernel-counters-k10{0.0%{opacity:0;transform:translate(0px,-6px)}63.75%{opacity:0;transform:translate(0px,-6px)}65.75%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e10{animation-name:v07-s21-kernel-counters-k10}@keyframes v07-s21-kernel-counters-k11{0.0%{opacity:0;transform:translate(0px,-6px)}65%{opacity:0;transform:translate(0px,-6px)}67%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e11{animation-name:v07-s21-kernel-counters-k11}@keyframes v07-s21-kernel-counters-k12{0.0%{opacity:0;transform:translate(0px,-6px)}66.25%{opacity:0;transform:translate(0px,-6px)}68.25%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e12{animation-name:v07-s21-kernel-counters-k12}@keyframes v07-s21-kernel-counters-k13{0.0%{opacity:0;transform:translate(0px,-6px)}70%{opacity:0;transform:translate(0px,-6px)}72%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e13{animation-name:v07-s21-kernel-counters-k13}@keyframes v07-s21-kernel-counters-k14{0.0%{opacity:0;transform:translate(0px,-6px)}77.5%{opacity:0;transform:translate(0px,-6px)}79.5%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v07-s21-kernel-counters .e14{animation-name:v07-s21-kernel-counters-k14}</style>
<rect class="bg" x="0" y="0" width="960" height="532"/>
<g><text class="cap" x="40" y="26">чьё поведение измеряли: счётчики ядра сервера до и после опыта</text></g>
<g class="a e1"><rect class="bxs" x="40" y="40" width="880" height="54" rx="8"/><text class="sm tk" x="52" y="62">наш получатель: сервер на Linux 6.18 (сборка WSL2), настройки по умолчанию,</text><text class="sm" x="52" y="84">кроме одной: расчёт контрольной суммы силами интерфейса (offload) выключен</text></g>
<g class="a e2"><rect class="bx" x="40" y="106" width="880" height="78" rx="8"/><text class="mk" x="52" y="130">tcp_md5</text><text class="sm" x="52" y="152">подделка 680 B, заголовок TCP 52 B:</text><text class="sm" x="52" y="172">NOP NOP TS MD5(16 B) END; настоящий 250 B, заголовок 32 B</text><text class="ix" x="560" y="128">счётчик получателя</text><text class="mk" x="560" y="154">TcpExt:TCPMD5Unexpected  +1</text></g>
<g class="a e3"><rect class="bxo" x="790" y="114" width="118" height="22" rx="4"/><text class="ix fg c" x="849" y="130">250 B чисто</text></g>
<g class="a e4"><rect class="bx" x="40" y="194" width="880" height="78" rx="8"/><text class="mk" x="52" y="218">badsum</text><text class="sm" x="52" y="240">контрольная сумма подделки неверна</text><text class="sm" x="52" y="260">во всех четырёх точках съёма</text><text class="ix" x="560" y="216">счётчик получателя</text><text class="mk" x="560" y="242">Tcp:InErrs  +1</text><text class="mk" x="560" y="262">Tcp:InCsumErrors  +1</text></g>
<g class="a e5"><rect class="bxo" x="790" y="202" width="118" height="22" rx="4"/><text class="ix fg c" x="849" y="218">250 B чисто</text></g>
<g class="a e6"><rect class="bx" x="40" y="282" width="880" height="78" rx="8"/><text class="mk" x="52" y="306">tcp_ts=−2</text><text class="sm" x="52" y="328">метка времени TSval подделки</text><text class="sm" x="52" y="348">на 2 меньше положенной</text><text class="ix" x="560" y="304">счётчик получателя</text><text class="mk" x="560" y="330">TcpExt:PAWSEstab  +1</text></g>
<g class="a e7"><rect class="bxo" x="790" y="290" width="118" height="22" rx="4"/><text class="ix fg c" x="849" y="306">250 B чисто</text></g>
<g class="a e8"><text class="cap" x="40" y="392">остальные следы разобраны в таблице условий</text></g>
<g class="a e9"><rect class="bxs" x="40" y="402" width="211" height="52" rx="6"/><text class="sm tk" x="50" y="424">tcp_seq</text><text class="m" x="50" y="446">TCPDSACKOldSent</text></g>
<g class="a e10"><rect class="bxs" x="263" y="402" width="211" height="52" rx="6"/><text class="sm tk" x="273" y="424">tcp_ack</text><text class="m" x="273" y="446">TCPChallengeACK</text></g>
<g class="a e11"><rect class="bxs" x="486" y="402" width="211" height="52" rx="6"/><text class="sm tk" x="496" y="424">без ACK</text><text class="sm mu" x="496" y="446">—</text></g>
<g class="a e12"><rect class="bxs" x="709" y="402" width="211" height="52" rx="6"/><text class="sm tk" x="719" y="424">срок жизни 1</text><text class="sm mu" x="719" y="446">—</text></g>
<g class="a e13"><text class="sm" x="40" y="478">у срока жизни 1 и у снятого ACK следа нет: подделка не дошла или отброшена молча</text></g>
<g class="a e14"><rect class="bxa" x="40" y="490" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="510">названия счётчиков читаем как причины по названию: проверено лишь то, что они сдвигаются</text></g>
</svg>
