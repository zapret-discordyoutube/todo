<svg xmlns="http://www.w3.org/2000/svg" class="v07-s11-autottl-first-run" viewBox="0 0 960 462" width="960" height="462" role="img" aria-labelledby="v07-s11-autottl-first-run-t v07-s11-autottl-first-run-d">
<title id="v07-s11-autottl-first-run-t">Автоподбор: первый опыт</title>
<desc id="v07-s11-autottl-first-run-d">Первый опыт с автоподбором на дороге из двух роутеров: в строке стратегии ip_autottl=0,1-20 дельта равна 0, диапазон от 1 до 20, первый ответ сервера пришёл со сроком 62, программа считает 64 минус 62 дают 2 перехода, строка 889 библиотеки d = hop_count + attl.delta даёт 2, подделка 680 байт уходит со сроком 2 и тем же ip id 35247, что и настоящее приветствие на 250 байт со сроком 64, потом приходит ICMP тип 11 с адреса 10.9.1.2, инспектор разрешает, сервер получает чистые 250 байт, а клиент получает ответ.</desc>
