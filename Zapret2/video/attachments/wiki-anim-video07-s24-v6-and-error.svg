<svg xmlns="http://www.w3.org/2000/svg" class="v07-s24-v6-and-error" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="v07-s24-v6-and-error-t v07-s24-v6-and-error-d">
<title id="v07-s24-v6-and-error-t">Ловушки: IPv6 и неверное значение</title>
<desc id="v07-s24-v6-and-error-d">Ещё две ловушки условий: срок жизни 1 на потоке IPv6 не применяется, потому что для IPv6 аргумент другой, ip6_ttl, подделка доезжает, и приложение получает 680 байт, а срок жизни 256 не помещается в байт, поэтому программа пишет ошибку и пропускает пакет без изменений, подделки нет, игрушка блокирует, сервер получает 0 байт, и условие, которое молчит, отличается от условия с громкой ошибкой только по журналу.</desc>
<style>.v07-s24-v6-and-error{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
