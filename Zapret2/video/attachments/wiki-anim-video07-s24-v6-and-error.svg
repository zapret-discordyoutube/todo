<rect class="bg" x="0" y="0" width="960" height="592"/>
<g><text class="cap" x="40" y="26">ещё две ловушки: не та версия протокола и неверное значение</text></g>
<g class="a e1"><rect class="bx" x="40" y="38" width="430" height="196" rx="8"/><text class="mk" x="52" y="62">ip_ttl=1 на потоке IPv6</text><text class="sm" x="52" y="84">условие не той версии молча не применяется</text></g>
<g class="a e2"><rect class="bxs" x="52" y="96" width="190" height="36" rx="4"/><text class="mk" x="62" y="119">hop limit: 64</text><rect class="bxd" x="252" y="96" width="206" height="36" rx="4"/><text class="sm mu" x="262" y="119">ip_ttl=1 не трогает</text></g>
<g class="a e3"><rect class="bxr" x="52" y="144" width="406" height="28" rx="4"/><text class="sm tk" x="62" y="163">подделка доехала до сервера</text></g>
<g class="a e4"><rect class="bxr" x="52" y="178" width="406" height="28" rx="4"/><text class="sm tk" x="62" y="197">приложение 680 B, клиент завис</text></g>
<g class="a e5"><text class="sm" x="52" y="224">для IPv6 аргумент другой: ip6_ttl</text></g>
<g class="a e6"><rect class="bx" x="490" y="38" width="430" height="196" rx="8"/><text class="mk" x="502" y="62">ip_ttl=256</text><text class="sm" x="502" y="84">не помещается в байт: допустимо от 0 до 255</text></g>
<g class="a e7"><rect class="bxb" x="502" y="96" width="406" height="28" rx="4"/><text class="sm tk" x="512" y="115">ошибка в журнале, шесть раз</text></g>
<g class="a e8"><rect class="bxb" x="502" y="130" width="406" height="28" rx="4"/><text class="sm tk" x="512" y="149">пакет пропущен без изменений</text></g>
<g class="a e9"><rect class="bxr" x="502" y="164" width="406" height="28" rx="4"/><text class="sm tk" x="512" y="183">подделки на проводе нет</text></g>
<g class="a e10"><text class="sm" x="502" y="214">игрушка заблокировала: сервер 0 B</text></g>
<g class="a e11"><text class="cap" x="40" y="262">журнал программы при ip_ttl=256</text></g>
<g class="a e12"><rect class="bxs" x="40" y="272" width="880" height="58" rx="6"/><text class="m" x="52" y="294">LUA ERROR: ...zapret-lib.lua:964: apply_fooling: ip_ttl and ip6_ttl require valid value</text><text class="m" x="52" y="318">desync ERROR. passing packet unmodified.</text></g>
<g class="a e13"><text class="cap" x="40" y="354">проверка значения: lua/zapret-lib.lua, строки 961-966</text><rect class="bx" x="40" y="364" width="880" height="30" rx="4"/><text class="ix" x="52" y="384">963</text><text class="m" x="92" y="384">if not ttl or ttl&lt;0 or ttl&gt;255 then</text></g>
<g class="a e14"><rect class="bxr" x="40" y="398" width="880" height="30" rx="4"/><text class="ix" x="52" y="418">964</text><text class="m" x="92" y="418">error("apply_fooling: ip_ttl and ip6_ttl require valid value")</text></g>
<g class="a e15"><rect class="bxr" x="40" y="446" width="430" height="112" rx="8"/><text class="sm tk" x="52" y="470">громко: ошибка в значении</text><text class="sm" x="52" y="494">стратегия для этого пакета отключена,</text><text class="sm" x="52" y="516">подделка не отправлена,</text><text class="sm" x="52" y="538">настоящий пакет уходит как есть</text></g>
<g class="a e16"><rect class="bxs" x="490" y="446" width="430" height="112" rx="8"/><text class="sm tk" x="502" y="470">тихо: пропуск без ошибки</text><text class="sm" x="502" y="494">заготовки с таким именем нет,</text><text class="sm" x="502" y="516">а у вызова стоит флаг optional:</text><text class="m" x="502" y="538">blob nosuch not found. skipped</text></g>
<g class="a e17"><text class="sm tk" x="40" y="580">применилось ли условие, видно только по журналу или по захвату пакетов</text></g>
</svg>
