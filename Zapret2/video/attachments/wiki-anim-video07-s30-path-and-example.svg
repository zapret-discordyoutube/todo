<title id="v07-s30-path-and-example-t">Путь одной строки fake</title>
<desc id="v07-s30-path-and-example-d">Путь одной строки fake:blob=fake_default_tls:tcp_md5 в шесть блоков: ворота и отключение встречного направления, заготовка в 680 байт, копия пакета с условиями по порядку, пересборка с суммами и отметкой на Си, отправка и возврат без результата, после чего на проводе подделка 680@+0 с флагами AP, заголовком 52 и опцией MD5 идёт перед настоящим пакетом 250@+0 с заголовком 32, а у сервера растёт счётчик TCPMD5Unexpected на 1.</desc>
