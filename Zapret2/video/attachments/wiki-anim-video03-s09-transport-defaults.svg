ansport-defaults-k10{0.0%{opacity:0}50.556%{opacity:0}51.806%{opacity:1}96.944%{opacity:1}98.611%{opacity:0}100%{opacity:0}}.v03-s09-transport-defaults .e10{animation-name:v03-s09-transport-defaults-k10}@keyframes v03-s09-transport-defaults-k11{0.0%{opacity:0}56.111%{opacity:0}57.361%{opacity:1}96.944%{opacity:1}98.611%{opacity:0}100%{opacity:0}}.v03-s09-transport-defaults .e11{animation-name:v03-s09-transport-defaults-k11}@keyframes v03-s09-transport-defaults-k12{0.0%{opacity:0}61.667%{opacity:0}62.917%{opacity:1}96.944%{opacity:1}98.611%{opacity:0}100%{opacity:0}}.v03-s09-transport-defaults .e12{animation-name:v03-s09-transport-defaults-k12}@keyframes v03-s09-transport-defaults-k13{0.0%{opacity:0}68.056%{opacity:0}69.306%{opacity:1}96.944%{opacity:1}98.611%{opacity:0}100%{opacity:0}}.v03-s09-transport-defaults .e13{animation-name:v03-s09-transport-defaults-k13}@keyframes v03-s09-transport-defaults-k14{0.0%{opacity:0}69.444%{opacity:0}70.694%{opacity:1}96.944%{opacity:1}98.611%{opacity:0}100%{opacity:0}}.v03-s09-transport-defaults .e14{animation-name:v03-s09-transport-defaults-k14}@keyframes v03-s09-transport-defaults-k15{0.0%{opacity:0}75.0%{opacity:0}76.25%{opacity:1}96.944%{opacity:1}98.611%{opacity:0}100%{opacity:0}}.v03-s09-transport-defaults .e15{animation-name:v03-s09-transport-defaults-k15}@keyframes v03-s09-transport-defaults-k16{0.0%{opacity:0}83.333%{opacity:0}84.583%{opacity:1}96.944%{opacity:1}98.611%{opacity:0}100%{opacity:0}}.v03-s09-transport-defaults .e16{animation-name:v03-s09-transport-defaults-k16}</style>
<rect class="bg" x="0" y="0" width="960" height="580"/>
<g class="a e1"><text class="cap" x="10" y="24">фильтры транспорта: что принимает профиль</text></g>
<g class="a e2"><text class="tk c" x="418" y="58">TCP</text><text class="mt mu c" x="418" y="77">--filter-tcp</text><text class="tk c" x="570" y="58">UDP</text><text class="mt mu c" x="570" y="77">--filter-udp</text><text class="tk c" x="722" y="58">ICMP</text><text class="mt mu c" x="722" y="77">--filter-icmp</text><text class="tk c" x="874" y="58">прочие IP</text><text class="mt mu c" x="874" y="77">--filter-ipp</text><path class="lm" d="M10 88L950 88"/></g>
<g class="a e3"><text x="10" y="118">в профиле не написано ничего</text><text class="sm mu" x="10" y="137">опыт: сработал и на UDP</text><rect class="bxo" x="348" y="98" width="140" height="44" rx="6"/><text class="tk c ok" x="418" y="126">да, любой</text><rect class="bxo" x="500" y="98" width="140" height="44" rx="6"/><text class="tk c ok" x="570" y="126">да, любой</text><rect class="bxo" x="652" y="98" width="140" height="44" rx="6"/><text class="tk c ok" x="722" y="126">да, любой</text><rect class="bxo" x="804" y="98" width="140" height="44" rx="6"/><text class="tk c ok" x="874" y="126">да, любой</text></g>
<g class="a e4"><text class="mk" x="10" y="172">--filter-tcp=443</text><text class="sm mu" x="10" y="191">опыт: на UDP-пакеты не сработал</text><rect class="bxo" x="348" y="152" width="140" height="44" rx="6"/><text class="tk c ok" x="418" y="180">да: порт 443</text><rect class="bxr" x="500" y="152" width="140" height="44" rx="6"/><text class="tk c rej" x="570" y="180">нет</text><rect class="bxr" x="652" y="152" width="140" height="44" rx="6"/><text class="tk c rej" x="722" y="180">нет</text><rect class="bxr" x="804" y="152" width="140" height="44" rx="6"/><text class="tk c rej" x="874" y="180">нет</text></g>
<g class="a e5"><text class="mk" x="10" y="226">--filter-udp=443</text><text class="sm mu" x="10" y="245">по коду</text><rect class="bxr" x="348" y="206" width="140" height="44" rx="6"/><text class="tk c rej" x="418" y="234">нет</text><rect class="bxo" x="500" y="206" width="140" height="44" rx="6"/><text class="tk c ok" x="570" y="234">да: порт 443</text><rect class="bxr" x="652" y="206" width="140" height="44" rx="6"/><text class="tk c rej" x="722" y="234">нет</text><rect class="bxr" x="804" y="206" width="140" height="44" rx="6"/><text class="tk c rej" x="874" y="234">нет</text></g>
<g class="a e6"><text class="mk" x="10" y="280">--filter-tcp=443 --filter-udp=443</text><text class="sm mu" x="10" y="299">следует из кода</text><rect class="bxo" x="348" y="260" width="140" height="44" rx="6"/><text class="tk c ok" x="418" y="288">да: порт 443</text><rect class="bxo" x="500" y="260" width="140" height="44" rx="6"/><text class="tk c ok" x="570" y="288">да: порт 443</text><rect class="bxr" x="652" y="260" width="140" height="44" rx="6"/><text class="tk c rej" x="722" y="288">нет</text><rect class="bxr" x="804" y="260" width="140" height="44" rx="6"/><text class="tk c rej" x="874" y="288">нет</text></g>
<g class="a e7 tr"><rect class="bxn" x="648" y="256" width="148" height="52" rx="8"/></g>
<g class="a e8"><text class="cap" x="10" y="334">в коде: filter_defaults, nfq2/nfqws.c:1543-1557</text></g>
<g class="a e9"><rect class="bx" x="10" y="344" width="940" height="92" rx="7"/></g>
<g class="a e10"><text class="m" x="24" y="368"><tspan class="mu">1546  </tspan>if (!dp-&gt;b_filter_l3) dp-&gt;filter_ipv4 = dp-&gt;filter_ipv6 = true;</text><text class="sm acc r" x="938" y="368">версия IP не указана: обе</text></g>
<g class="a e11"><text class="m" x="24" y="394"><tspan class="mu">1549  </tspan>if (!LIST_EMPTY(&amp;dp-&gt;pf_tcp) || !LIST_EMPTY(&amp;dp-&gt;pf_udp) || …)</text><text class="sm acc r" x="938" y="394">написан хотя бы один из четырёх</text></g>
<g class="a e12"><text class="m" x="24" y="420"><tspan class="mu">1551  </tspan>return port_filters_deny_if_empty(&amp;dp-&gt;pf_tcp) &amp;&amp; …</text><text class="sm acc r" x="938" y="420">пустые получают «запрет»</text></g>
<g class="a e13"><text class="cap" x="10" y="458">как «отключено» устроено внутри (nfq2/filter.c:8-11, 44-45)</text></g>
<g class="a e14"><rect class="bxb" x="10" y="468" width="940" height="60" rx="8"/><text class="sm" x="24" y="492">пустой список заменяется записью «0»: from = 0, to = 0, neg = 1</text></g>
<g class="a e15"><text class="mk" x="24" y="516"><tspan class="sm">порт 443:  </tspan><tspan class="hbb">443 &amp;&amp; ((1) ^ 1) = 0</tspan></text><text class="sm" x="330" y="516">ложь: такая запись не пропускает ни один порт</text></g>
<g class="a e16"><text class="tk" x="10" y="556">Чтобы стратегия работала и для TCP, и для UDP: напишите оба фильтра или не пишите ни одного.</text></g>
</svg>
