.v03-s09-transport-defaults .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v03-s09-transport-defaults .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v03-s09-transport-defaults .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v03-s09-transport-defaults .la{fill:none;stroke:var(--acc);stroke-width:2}
.v03-s09-transport-defaults .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s09-transport-defaults .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s09-transport-defaults .hf{fill:var(--fg2)}.v03-s09-transport-defaults .ha{fill:var(--acc)}.v03-s09-transport-defaults .hr{fill:var(--rej)}.v03-s09-transport-defaults .hm{fill:var(--mute)}.v03-s09-transport-defaults .ho{fill:var(--ok)}
.v03-s09-transport-defaults .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v03-s09-transport-defaults .a{animation-duration:36s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v03-s09-transport-defaults .a{animation:none}.v03-s09-transport-defaults .tr{display:none}}
