.v03-s09-transport-defaults .hb{fill:var(--acc);font-weight:700}.v03-s09-transport-defaults .hbr{fill:var(--rej);font-weight:700}.v03-s09-transport-defaults .hbo{fill:var(--ok);font-weight:700}.v03-s09-transport-defaults .hbb{fill:var(--amb);font-weight:700}
