<svg xmlns="http://www.w3.org/2000/svg" class="v03-s09-transport-defaults" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v03-s09-transport-defaults-t v03-s09-transport-defaults-d">
<title id="v03-s09-transport-defaults-t">Фильтры транспорта по умолчанию</title>
<desc id="v03-s09-transport-defaults-d">Таблица фильтров транспорта: если в профиле не написан ни один из фильтров tcp, udp, icmp и ipp, он принимает TCP, UDP, ICMP и прочие протоколы IP; если написан хотя бы один, остальные не принимают никого, поэтому пара --filter-tcp=443 и --filter-udp=443 примет TCP и UDP на порт 443, но не ICMP; внутри программы пустой фильтр заменяется записью «0», которая не пропускает ни один порт.</desc>
<style>.v03-s09-transport-defaults{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v03-s09-transport-defaults{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
