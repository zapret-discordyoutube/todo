<g><text class="cap" x="40" y="24">цикл нарезки · lua/zapret-lib.lua:1246-1273</text></g>
<g class="a e1"><text class="sm tk" x="40" y="52">выдуманный пример: чемодан в 1482 листа, сумка вмещает 1448</text></g>
<g class="a e2"><rect class="bxa" x="40" y="62" width="690" height="28" rx="0"/><text class="sm c" x="385" y="82">сумка 1: листы 3–1450, всего 1448</text><rect class="bxo" x="730" y="62" width="190" height="28" rx="0"/><text class="sm c" x="825" y="82">сумка 2: с листа 1451</text></g>
<g class="a e3"><text class="sm" x="40" y="110">следующая сумка начинается с того листа, где кончилась прошлая: 3 + 1448 = 1451</text></g>
<g class="a e4"><rect class="bx" x="40" y="130" width="590" height="327" rx="8"/></g>
<g class="a e5"><text class="ix" x="52" y="153">1247</text><text class="m" x="92" y="153">local pos=1</text></g>
<g class="a e6"><text class="ix" x="52" y="182">1250</text><text class="m" x="92" y="182">while pos &lt;= #payload do</text></g>
<g class="a e7"><text class="ix" x="52" y="211">1251</text><text class="m" x="92" y="211">  len = #payload - pos + 1</text></g>
<g class="a e8"><text class="ix" x="52" y="240">1252</text><text class="m" x="92" y="240">  if len &gt; max_data then len = max_data end</text></g>
<g class="a e9"><text class="ix" x="52" y="269">1253</text><text class="sm mu" x="92" y="269">  срочный флаг: строки 1253-1263 пропускаем</text></g>
<g class="a e10"><text class="ix" x="52" y="298">1264</text><text class="m" x="92" y="298">  discopy.payload = string.sub(payload,pos,pos+len-1)</text></g>
<g class="a e11"><text class="ix" x="52" y="327">1265</text><text class="m" x="92" y="327">  apply_ip_id(desync, discopy, options and options.ipid)</text></g>
<g class="a e12"><text class="ix" x="52" y="356">1266</text><text class="m" x="92" y="356">  if not rawsend_dissect_ipfrag(discopy, options) then</text></g>
<g class="a e13"><text class="ix" x="52" y="385">1270</text><text class="m" x="92" y="385">  discopy.tcp.th_seq = u32add(discopy.tcp.th_seq, len)</text></g>
