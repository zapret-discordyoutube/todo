<svg xmlns="http://www.w3.org/2000/svg" class="v05-s15-slice-loop" viewBox="0 0 960 676" width="960" height="676" role="img" aria-labelledby="v05-s15-slice-loop-t v05-s15-slice-loop-d">
<title id="v05-s15-slice-loop-t">Цикл нарезки на ломтики</title>
<desc id="v05-s15-slice-loop-d">Цикл нарезки в rawsend_dissect_segmented (lua/zapret-lib.lua:1246-1273): указатель pos ставится на первый байт части, пока он не вышел за конец, берётся len байт, сколько осталось, но не больше max_data, кусок вырезается через string.sub, ему назначается идентификатор IP через apply_ip_id, он отправляется, затем th_seq и pos сдвигаются на len, а одиннадцать строк про срочный флаг пропущены; на второй части нашего опыта в 1482 байта при максимуме 1448 первый проход берёт 1448 байт с номером 3 и идентификатором 24610, второй проход берёт остаток 34 байта с номером 1451 и идентификатором 24611, после чего pos равен 1483 и цикл кончается; выдуманный чемодан показывает то же: следующая сумка начинается с листа 3 + 1448 = 1451; по умолчанию apply_ip_id работает в режиме seq: первый пакет берёт идентификатор исходного, если раньше в цепочке ничего не отправляли, каждый следующий на единицу больше.</desc>
