<g class="a e1"><text class="cap" x="10" y="24">опыт первого выпуска: запрос в 250 байт, роутер выбрасывает каждый пакет</text></g>
<g class="a e2"><rect class="bx" x="10" y="38" width="150" height="52" rx="7"/><text class="tk c" x="85" y="61">Клиент</text><text class="sm c mu" x="85" y="80">10.1.0.1</text><rect class="bxr" x="365" y="38" width="230" height="52" rx="7"/><text class="tk c" x="480" y="61">Роутер с инспектором</text><text class="sm c mu" x="480" y="80">игрушечный инспектор</text><rect class="bx" x="800" y="38" width="150" height="52" rx="7"/><text class="tk c" x="875" y="61">Сервер</text><text class="sm c mu" x="875" y="80">10.2.0.2</text><path class="lf" d="M166 64L349.0 64.0"/><polygon class="hf" points="359,64 349.0,69.0 349.0,59.0"/><text class="sm c" x="262" y="56">запрос, 250 байт</text><path class="lmd" d="M601 64L794 64"/><path class="lr" d="M690 56L706 72M690 72L706 56"/><text class="sm c rej" x="698" y="54">выброшен</text></g>
<g class="a e3"><text class="cap" x="10" y="128">время от начала опыта, мс; один пакет = одна отправка</text><path class="lf" d="M30 214L930 214"/><path class="lf" d="M920 214L924.0 214.0"/><polygon class="hf" points="934,214 924.0,219.0 924.0,209.0"/><text class="sm r mu" x="950" y="206">мс</text></g>
<g class="a e4"><rect class="bxa" x="34.4" y="172" width="12" height="30" rx="3"/><path class="lm" d="M40.4 202L40.4 214"/><text class="m c" x="40.4" y="164">1,6</text></g>
<g class="a e5"><rect class="bxa" x="89.8" y="172" width="12" height="30" rx="3"/><path class="lm" d="M95.8 202L95.8 214"/><text class="m c" x="95.8" y="164">212,2</text></g>
<g class="a e6"><rect class="bxa" x="146.6" y="172" width="12" height="30" rx="3"/><path class="lm" d="M152.6 202L152.6 214"/><text class="m c" x="152.6" y="164">428,2</text></g>
<g class="a e7"><rect class="bxa" x="257.1" y="172" width="12" height="30" rx="3"/><path class="lm" d="M263.1 202L263.1 214"/><text class="m c" x="263.1" y="164">848,4</text></g>
<g class="a e8"><rect class="bxa" x="475.3" y="172" width="12" height="30" rx="3"/><path class="lm" d="M481.3 202L481.3 214"/><text class="m c" x="481.3" y="164">1678,0</text></g>
<g class="a e9"><rect class="bxa" x="913.7" y="172" width="12" height="30" rx="3"/><path class="lm" d="M919.7 202L919.7 214"/><text class="m c" x="919.7" y="164">3345,0</text></g>
<g class="a e10"><rect class="bxb" x="10" y="292" width="940" height="52" rx="8"/><text class="tk" x="24" y="315">Все шесть пакетов несут одни и те же байты с одним порядковым номером 2 566 422 329</text><text class="sm mu" x="24" y="335">меняются только идентификатор IP и метка времени</text></g>
<g class="a e11"><rect class="bxr" x="10" y="358" width="300" height="54" rx="8"/><text class="tk" x="24" y="381">В роутере до правила</text><text class="sm mu" x="24" y="401">видны все шесть, счётчик = 6</text></g>
<g class="a e12"><rect class="bx" x="330" y="358" width="300" height="54" rx="8"/><text class="tk" x="344" y="381">За роутером</text><text class="sm mu" x="344" y="401">не появился ни один из шести</text></g>
<g class="a e13"><rect class="bx" x="650" y="358" width="300" height="54" rx="8"/><text class="tk" x="664" y="381">У сервера</text><text class="sm mu" x="664" y="401">получено 0 байт</text></g>
<g class="a e14"><path class="lb" d="M42.4 226V232H93.8V226"/><text class="m c amb" x="68.1" y="252">210,6</text></g>
<g class="a e15"><path class="lb" d="M97.8 226V232H150.6V226"/><text class="m c amb" x="124.2" y="252">216,0</text><text class="sm c mu" x="124.2" y="270">×1,03</text></g>
<g class="a e16"><path class="lb" d="M154.6 226V232H261.1V226"/><text class="m c amb" x="207.9" y="252">420,1</text><text class="sm c mu" x="207.9" y="270">×1,9</text></g>
<g class="a e17"><path class="lb" d="M265.1 226V232H479.3V226"/><text class="m c amb" x="372.2" y="252">829,7</text><text class="sm c mu" x="372.2" y="270">×2,0</text></g>
<g class="a e18"><path class="lb" d="M483.3 226V232H917.7V226"/><text class="m c amb" x="700.5" y="252">1667,0</text><text class="sm c mu" x="700.5" y="270">×2,0</text></g>
<g class="a e19"><text class="sm mu" x="770" y="252">← паузы, мс</text><text class="sm mu" x="750" y="270">× к предыдущей паузе</text></g>
<g class="a e20"><text class="sm" x="10" y="440">Рукопожатие заняло 0,05 мс, а первая пауза 210 мс: в тысячи раз больше. Это таймер клиента, не задержка сети.</text></g>
<g class="a e21"><text class="sm" x="10" y="464">Дальше паузы примерно удваиваются (экспоненциальная задержка): так не заваливают сеть повторами.</text></g>
<g class="a e22"><text class="sm mu" x="10" y="488">Числа зависят от системы, а не только от протокола: это наш клиент, Linux 6.18.</text><text class="sm mu" x="10" y="510">Закрытие соединения сервером около 2 с лабораторный сервер сделал сам, по таймауту; к опыту это не относится.</text></g>
</svg>
