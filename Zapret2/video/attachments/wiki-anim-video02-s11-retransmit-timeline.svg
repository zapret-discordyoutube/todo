<svg xmlns="http://www.w3.org/2000/svg" class="v02-s11-retransmit-timeline" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v02-s11-retransmit-timeline-t v02-s11-retransmit-timeline-d">
<title id="v02-s11-retransmit-timeline-t">Повторная отправка: шесть пакетов</title>
<desc id="v02-s11-retransmit-timeline-d">Повторная отправка в опыте, где роутер выбрасывает запрос в 250 байт: клиент отправляет те же байты с одним порядковым номером 2 566 422 329 шесть раз, через 1,6; 212,2; 428,2; 848,4; 1678,0 и 3345,0 мс от начала; паузы между отправками 210,6; 216,0; 420,1; 829,7 и 1667,0 мс, то есть сначала почти одинаковые, потом примерно вдвое длиннее каждая; инспектор в роутере увидел все шесть пакетов (счётчик 6), за роутером не появилось ни одного, сервер получил 0 байт, а первая пауза в тысячи раз больше пути пакета по лаборатории, значит это таймер клиента.</desc>
