<svg xmlns="http://www.w3.org/2000/svg" class="v00-s17-paired" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="v00-s17-paired-t v00-s17-paired-d">
<title id="v00-s17-paired-t">Парные приёмы: резка вместе с подделкой</title>
<desc id="v00-s17-paired-d">Парные приёмы кладут рядом с настоящими кусками ложные: fakedsplit превращает один разрез в шесть пакетов, подделка и настоящий кусок для каждой из двух частей, fakeddisorder делает то же в обратном порядке, а hostfakesplit кладёт настоящее имя сайта отдельным пакетом между двумя поддельными именами той же длины; в нашем тесте у подделок стояла опция MD5 и сервер каждый раз получил все 250 байт.</desc>
