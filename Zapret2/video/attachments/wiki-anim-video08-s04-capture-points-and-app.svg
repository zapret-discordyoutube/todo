<svg xmlns="http://www.w3.org/2000/svg" class="video08-s04-capture-points-and-app" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="video08-s04-capture-points-and-app-t video08-s04-capture-points-and-app-d">
<title id="video08-s04-capture-points-and-app-t">Где фейк виден на пути</title>
<desc id="video08-s04-capture-points-and-app-d">В нашем тесте на четырёх точках захвата при опции эм-дэ-пять шесть пакетов видны везде, а при сроке жизни один фейки видны только на клиенте и на входе в роутер и до пересылки не доходят, поэтому до сервера идут два пакета, а приложение сервера в обоих случаях читает 250 байт и находит имя.</desc>
