<g class="a e7"><rect class="bx" x="24" y="318" width="184" height="70" rx="8"/><text class="sm tk" x="36" y="342">резка</text><text class="lgk" x="36" y="380">multisplit</text><rect class="bxr" x="216" y="318" width="138" height="70" rx="8"/><text class="sm tk c" x="285" y="348">заблокировано</text><text class="sm c" x="285" y="370">на 2-м пакете</text><rect class="bxr" x="360" y="318" width="138" height="70" rx="8"/><text class="sm tk c" x="429" y="348">заблокировано</text><text class="sm c" x="429" y="370">на 2-м пакете</text><rect class="bxr" x="504" y="318" width="138" height="70" rx="8"/><text class="sm tk c" x="573" y="348">заблокировано</text><text class="sm c" x="573" y="370">на 2-м пакете</text><rect class="bxr" x="648" y="318" width="138" height="70" rx="8"/><text class="sm tk c" x="717" y="348">заблокировано</text><text class="sm c" x="717" y="370">на 2-м пакете</text><rect class="bxo" x="792" y="318" width="138" height="70" rx="8"/><text class="sm tk c" x="861" y="358">не нашла имя</text></g>
