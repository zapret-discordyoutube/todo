<g><text class="cap" x="24" y="24">зачем столько семей</text></g>
<g class="a e1"><rect class="bx" x="24" y="40" width="440" height="150" rx="8"/><rect class="bxa" x="40" y="50" width="163" height="26" rx="13.0"/><text class="sm tk c" x="121.5" y="68">ДОКУМЕНТАЦИЯ</text><text class="sm" x="40" y="104">«Обход DPI требует все более тонких</text><text class="sm" x="40" y="124">и специфических воздействий,</text></g>
<g class="a e2"><rect class="fa" x="34" y="134" width="420" height="46" rx="3"/><text class="sm tk" x="40" y="151">которые меняются со временем, а старые</text><text class="sm tk" x="40" y="171">перестают работать»</text></g>
<g class="a e3"><rect class="bx" x="476" y="40" width="460" height="150" rx="8"/><rect class="bxb" x="488" y="50" width="228" height="26" rx="13.0"/><text class="sm tk c" x="602" y="68">ПО ОБЩИМ СВЕДЕНИЯМ</text><rect class="bxd" x="822" y="50" width="110" height="26" rx="13.0"/><text class="sm tk c" x="877" y="68">гипотеза</text><text class="sm tk" x="492" y="98">идея каждой семьи это догадка</text><text class="sm tk" x="492" y="118">о слабости читателя:</text><text class="sm" x="492" y="144">читает каждый пакет отдельно: удивит резка</text><text class="sm" x="492" y="168">не проверяет то же, что получатель: удивит подделка</text></g>
<g class="a e4"><rect class="bxb" x="24" y="202" width="636" height="26" rx="13"/><text class="sm tk c" x="342" y="220">игрушечные читатели нашей лаборатории, не настоящее оборудование</text></g>
<g class="a e5"><text class="sm tk c" x="285" y="260">игрушка 1</text><text class="sm tk c" x="429" y="260">игрушка 2</text><text class="sm tk c" x="573" y="260">игрушка 3</text><text class="sm tk c" x="717" y="260">игрушка 4</text><text class="sm tk c" x="861" y="260">игрушка 5</text></g>
