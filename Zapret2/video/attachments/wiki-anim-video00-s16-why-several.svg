<svg xmlns="http://www.w3.org/2000/svg" class="v00-s16-why-several" viewBox="0 0 960 546" width="960" height="546" role="img" aria-labelledby="v00-s16-why-several-t v00-s16-why-several-d">
<title id="v00-s16-why-several-t">Зачем нужно несколько семей</title>
<desc id="v00-s16-why-several-d">Семей приёмов несколько, потому что обход требует всё более тонких воздействий, которые меняются со временем, а старые перестают работать, и по общим сведениям идея каждой семьи это догадка о слабости читателя, это гипотеза; в наших игрушках из пяти читателей один читает каждый пакет отдельно, одна резка обошла только его, а резка вместе с подделкой обошла всех пятерых.</desc>
