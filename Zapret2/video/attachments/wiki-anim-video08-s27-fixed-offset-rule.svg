<svg xmlns="http://www.w3.org/2000/svg" class="v08-s27-fixed-offset-rule" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="v08-s27-fixed-offset-rule-t v08-s27-fixed-offset-rule-d">
<title id="v08-s27-fixed-offset-rule-t">Правило с фиксированным местом</title>
<desc id="v08-s27-fixed-offset-rule-d">Правило с одним фиксированным местом смотрит 15 байт на смещении 129 от начала заголовка TCP, то есть 32 байта заголовка плюс 97 байт данных, 1032 бита: оно срабатывает на все шесть пакетов приветствия без стратегии, по 302 байта, и сервер получает 0 байт, а при multisplit, fakedsplit, fakeddisorder, fakedsplit с pos равным host и hostfakesplit счётчик правила равен нулю и сервер получает все 250 байт; у hostfakesplit настоящий пакет с именем несёт только 15 байт данных, а у fakedsplit с pos равным host вторая часть в 153 байта начинается с имени, поэтому правило смотрит мимо имени; игрушки ищут фиксированные 15 байт, не проверяют MD5, сумму и номера и не имеют таймеров.</desc>
