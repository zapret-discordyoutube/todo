<rect class="bg" x="0" y="0" width="960" height="690"/>
<g><text class="cap" x="40" y="22">правило с одним фиксированным местом смотрит 15 байт на смещении 97 данных</text></g>
<g class="a e1"><rect class="bxg" x="40" y="40" width="58.3" height="30" rx="0"/><rect class="bxb" x="98.3" y="40" width="93.2" height="30" rx="0"/><rect class="bxa" x="191.5" y="40" width="728.5" height="30" rx="0"/><text class="sm c" x="69.1" y="60">IP</text><text class="sm c" x="144.9" y="60">TCP 32</text><text class="sm c" x="331.4" y="60">данные: 250 байт приветствия</text><text class="ix mu" x="40" y="88">пакет без стратегии: 20 + 32 + 250 = 302 байта</text></g>
<g class="a e2"><rect class="bxro" x="474.2" y="36" width="43.7" height="38" rx="3"/><path class="lr" d="M496 76L496 98"/><text class="m tk c rej" x="496" y="114">правило: @th,1032,120 = 129 байт от начала TCP = 32 + 97, длина 15 байт</text></g>
<g class="a e3"><text class="sm" x="40" y="138">в обычной отправке имя лежит ровно там: правило находит его и останавливает соединение</text></g>
<g class="a e4"><text class="cap" x="40" y="174">стратегия</text><text class="cap c" x="530" y="174">счётчик правила</text><text class="cap c" x="790" y="174">сервер получил</text></g>
<g class="a e5"><text class="m fg" x="40" y="203">без стратегии</text><rect class="bxr" x="430" y="184" width="200" height="28" rx="5"/><text class="sm tk c ns rej" x="530" y="203">6 пакетов</text><rect class="bxr" x="690" y="184" width="200" height="28" rx="5"/><text class="sm tk c ns rej" x="790" y="203">0 байт</text></g>
<g class="a e6"><text class="m fg" x="40" y="234">multisplit</text><rect class="bxo" x="430" y="215" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="530" y="234">0</text><rect class="bxo" x="690" y="215" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="790" y="234">250 байт</text></g>
<g class="a e7"><text class="m fg" x="40" y="265">fakedsplit</text><rect class="bxo" x="430" y="246" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="530" y="265">0</text><rect class="bxo" x="690" y="246" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="790" y="265">250 байт</text></g>
<g class="a e8"><text class="m fg" x="40" y="296">fakeddisorder</text><rect class="bxo" x="430" y="277" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="530" y="296">0</text><rect class="bxo" x="690" y="277" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="790" y="296">250 байт</text></g>
<g class="a e9"><text class="m fg" x="40" y="327">fakedsplit:pos=host</text><rect class="bxo" x="430" y="308" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="530" y="327">0</text><rect class="bxo" x="690" y="308" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="790" y="327">250 байт</text></g>
<g class="a e10"><text class="m fg" x="40" y="358">hostfakesplit</text><rect class="bxo" x="430" y="339" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="530" y="358">0</text><rect class="bxo" x="690" y="339" width="200" height="28" rx="5"/><text class="sm tk c ns ok" x="790" y="358">250 байт</text></g>
<g class="a e11"><text class="sm mu" x="40" y="384">шесть пакетов: приветствие и пять повторов клиента, по 302 байта</text></g>
<g class="a e12"><text class="sm tk" x="40" y="410">проверь себя: почему правило не сработало там, где «пакетный» видит имя?</text></g>
<g class="a e13"><text class="sm tk" x="40" y="436">hostfakesplit: настоящий пакет с именем</text><rect class="bxa" x="40" y="450" width="34.5" height="28" rx="0"/><rect class="bxd" x="74.5" y="450" width="223.1" height="28" rx="0"/><rect class="bx" x="40" y="450" width="34.5" height="28" rx="0"/><text class="ix c fg ns" x="57.2" y="469">имя</text><rect class="bxro" x="263.1" y="445" width="34.5" height="38" rx="3"/><text class="ix mu" x="40" y="498">0</text><text class="ix rej c" x="280.4" y="498">97</text><text class="sm" x="40" y="518">данных всего 15 байт, на проводе 67</text><text class="sm tk rej" x="40" y="537">на смещении 97 ничего нет</text></g>
<g class="a e14"><text class="sm tk" x="500" y="436">fakedsplit:pos=host: вторая настоящая часть</text><rect class="bxa" x="500" y="450" width="257.6" height="28" rx="0"/><rect class="bx" x="500" y="450" width="34.5" height="28" rx="0"/><text class="ix c fg ns" x="517.2" y="469">имя</text><rect class="bxro" x="723.1" y="445" width="34.5" height="38" rx="3"/><text class="ix mu" x="500" y="498">0</text><text class="ix rej c" x="740.4" y="498">97</text><text class="sm" x="500" y="518">данных 153 байта, имя с нулевого байта</text><text class="sm tk rej" x="500" y="537">на смещении 97 лежат другие байты</text></g>
<g class="a e15"><rect class="bxg" x="40" y="567" width="880" height="104" rx="8"/><text class="cap" x="54" y="585">границы игрушек</text><text class="sm" x="54" y="607">ищут фиксированные 15 байт, TLS и HTTP не разбирают</text><text class="sm" x="54" y="625">действие одно, выбросить: таймеров и предела буфера у них нет</text><text class="sm" x="54" y="643">MD5, сумму и номера на правдоподобие не проверяют: «слепы все шесть» верно для таких читателей</text><text class="sm tk" x="54" y="661">где стоит настоящий инспектор относительно точки смерти фейка: неизвестно</text></g>
</svg>
