filter-k9}@keyframes v06-s24-receiver-fin-filter-k10{0.0%{opacity:0}48.78%{opacity:0}49.329%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e10{animation-name:v06-s24-receiver-fin-filter-k10}@keyframes v06-s24-receiver-fin-filter-k11{0.0%{opacity:0}50.244%{opacity:0}50.793%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e11{animation-name:v06-s24-receiver-fin-filter-k11}@keyframes v06-s24-receiver-fin-filter-k12{0.0%{opacity:0}51.707%{opacity:0}52.256%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e12{animation-name:v06-s24-receiver-fin-filter-k12}@keyframes v06-s24-receiver-fin-filter-k13{0.0%{opacity:0}53.171%{opacity:0}53.72%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e13{animation-name:v06-s24-receiver-fin-filter-k13}@keyframes v06-s24-receiver-fin-filter-k14{0.0%{opacity:0}54.878%{opacity:0}55.427%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e14{animation-name:v06-s24-receiver-fin-filter-k14}@keyframes v06-s24-receiver-fin-filter-k15{0.0%{opacity:0}60.976%{opacity:0}61.524%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e15{animation-name:v06-s24-receiver-fin-filter-k15}@keyframes v06-s24-receiver-fin-filter-k16{0.0%{opacity:0}63.415%{opacity:0}63.963%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e16{animation-name:v06-s24-receiver-fin-filter-k16}@keyframes v06-s24-receiver-fin-filter-k17{0.0%{opacity:0}69.512%{opacity:0}70.061%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .e17{animation-name:v06-s24-receiver-fin-filter-k17}@keyframes v06-s24-receiver-fin-filter-k18{0.0%{opacity:0}78.049%{opacity:0}78.598%{opacity:1}97.927%{opacity:1}98.659%{opacity:0}100%{opacity:0}}.v06-s24-receiver-fin-filter .