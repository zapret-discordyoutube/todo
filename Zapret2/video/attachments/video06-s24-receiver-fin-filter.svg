.v06-s24-receiver-fin-filter .hf{fill:var(--fg2)}.v06-s24-receiver-fin-filter .ha{fill:var(--acc)}.v06-s24-receiver-fin-filter .hr{fill:var(--rej)}.v06-s24-receiver-fin-filter .hm{fill:var(--mute)}.v06-s24-receiver-fin-filter .hb{fill:var(--amb)}
.v06-s24-receiver-fin-filter .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v06-s24-receiver-fin-filter .a{animation-duration:82s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
