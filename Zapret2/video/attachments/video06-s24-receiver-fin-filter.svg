<svg xmlns="http://www.w3.org/2000/svg" class="v06-s24-receiver-fin-filter" viewBox="0 0 960 850" width="960" height="850" role="img" aria-labelledby="v06-s24-receiver-fin-filter-t v06-s24-receiver-fin-filter-d">
<title id="v06-s24-receiver-fin-filter-t">Ответы получателя и фильтр</title>
<desc id="v06-s24-receiver-fin-filter-d">Что ответил получатель и почему остаток не выбросили: сервер отвечает ACK 106, потом ACK 106 с блоком с 251 по 251, потому что клиент лаборатории закрыл соединение сигналом FIN с номером 251, а сервер держит пока только 105 байт, и этот сигнал приходит для него из будущего, потом после остатка ACK 252, приложение сделало два чтения, 105 и 145 байт, и запрос дошёл целиком; остаток начался с середины приветствия, проверка типа данных не узнаёт в нём приветствие и пишет «тип неизвестен», а в нашем опыте перед обеими функциями стоит фильтр tls_client_hello, поэтому ни tcpseg, ни drop не запускаются и пакет идёт без изменений, тогда как без фильтра drop по коду выбросила бы и остаток, опыта с таким запуском нет; проверка: сервер подтвердил 105 байт из 250, значит ядро клиента считает неподтверждёнными 250 - 105 = 145 байт с номера 106.</desc>
<style>.v06-s24-receiver-fin-filter{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
