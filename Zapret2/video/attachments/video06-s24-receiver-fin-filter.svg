.v06-s24-receiver-fin-filter .mu{fill:var(--mute)}.v06-s24-receiver-fin-filter .fg{fill:var(--fg)}.v06-s24-receiver-fin-filter .acc{fill:var(--acc)}.v06-s24-receiver-fin-filter .rej{fill:var(--rej)}.v06-s24-receiver-fin-filter .ok{fill:var(--ok)}.v06-s24-receiver-fin-filter .amb{fill:var(--amb)}
