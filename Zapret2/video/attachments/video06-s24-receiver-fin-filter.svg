<rect class="bg" x="0" y="0" width="960" height="850"/>
<g><text class="cap" x="40" y="24">ответы получателя: подтверждено 105, блок с FIN, подтверждено всё</text></g>
<g class="a e1"><text class="sm tk" x="40" y="52">1 · ACK 106: подтверждено 105, жду 106-й</text><rect class="bx" x="40" y="60" width="880" height="22" rx="0"/><rect class="bxo" x="40" y="60" width="368.1" height="22" rx="0"/><text class="ix mu" x="416.1" y="98">дальше пока пусто</text></g>
<g class="a e2"><text class="sm tk" x="40" y="120">2 · ACK 106 и блок [251,252): FIN клиента пришёл раньше времени</text><rect class="bx" x="40" y="128" width="880" height="22" rx="0"/><rect class="bxo" x="40" y="128" width="368.1" height="22" rx="0"/><rect class="bxr" x="916.5" y="128" width="3.5" height="22" rx="0"/><rect class="bxd" x="408.1" y="128" width="508.4" height="22" rx="0"/><text class="sm c mu" x="662.3" y="144">дыра: байты 106…250 ещё не пришли</text><path class="lr" d="M918.2 152L918.2 158"/><text class="ix rej r" x="910.5" y="168">FIN, номер 251</text></g>
<g class="a e3 tr"></g>
<g class="a e4"><text class="sm tk" x="40" y="190">3 · ACK 252: после остатка подтверждено всё</text><rect class="bx" x="40" y="198" width="880" height="22" rx="0"/><rect class="bxo" x="40" y="198" width="368.1" height="22" rx="0"/><rect class="bxb" x="408.1" y="198" width="508.4" height="22" rx="0"/><rect class="bxr" x="916.5" y="198" width="3.5" height="22" rx="0"/><text class="ix amb" x="416.1" y="236">остаток 145@105 закрыл дыру</text></g>
<g class="a e5"><text class="sm mu" x="40" y="266">закрытие тоже из будущего, поэтому оформлено блоком, а не принято: сервер держит пока только 105 байт</text></g>
<g class="a e6"><text class="sm mu" x="40" y="288">клиент лаборатории закрывает соединение сразу после запроса; номер сигнала 251</text></g>
<g class="a e7"><rect class="bxa" x="40" y="300" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="320">приложение: два чтения, 105 и 145 байт; запрос дошёл целиком</text></g>
<g class="a e8"><path class="lm" d="M40 348L920 348"/><text class="cap" x="40" y="368">почему остаток не выбросили второй раз</text><rect class="bxn" x="40" y="380" width="880" height="30" rx="6"/><text class="m fg" x="52" y="400">в командной строке перед обеими функциями: --payload=tls_client_hello</text></g>
<g class="a e9"><rect class="bx" x="40" y="420" width="640" height="120" rx="6"/></g>
<g class="a e10"><text class="ix fg" x="52" y="440">dpi desync ... payload_type=unknown</text></g>
<g class="a e11"><text class="ix fg" x="52" y="468">* lua &#x27;tcpseg_1_2&#x27; : payload_type &#x27;unknown&#x27; does not satisfy filter</text></g>
<g class="a e12"><text class="ix fg" x="52" y="496">* lua &#x27;drop_1_3&#x27; : payload_type &#x27;unknown&#x27; does not satisfy filter</text></g>
<g class="a e13"><text class="ix fg" x="52" y="524">packet: id=10 pass unmodified</text></g>
<g class="a e14"><text class="sm" x="696" y="440">остаток с середины:</text><text class="sm" x="696" y="460">начала нет, тип не узнан,</text><text class="sm tk" x="696" y="480">обе функции пропустили</text></g>
<g class="a e15"><text class="sm mu" x="40" y="566">без этого фильтра drop по коду выбросила бы и остаток: опыта с таким запуском нет</text></g>
<g class="a e16"><text class="sm mu" x="40" y="586">руководство само советует ограничивать drop только известными данными</text></g>
<g class="a e17"><path class="lm" d="M40 606L920 606"/><rect class="bxd" x="40" y="616" width="880" height="50" rx="6"/><text class="sm tk" x="52" y="636">проверь себя: сервер подтвердил 105 из 250 байт;</text><text class="sm tk" x="52" y="656">сколько байт ядро клиента считает неподтверждёнными и с какого номера?</text></g>
<g class="a e18"><text class="sm" x="40" y="692">клиент отправил 250</text><rect class="bx" x="240" y="676" width="680" height="22" rx="0"/><rect class="bxo" x="240" y="676" width="285.6" height="22" rx="0"/><rect class="bxb" x="525.6" y="676" width="394.4" height="22" rx="0"/></g>
<g class="a e19"><text class="sm c" x="382.8" y="714">подтверждено 105</text><text class="sm tk c" x="722.8" y="714">неподтверждено 145, с номера 106</text></g>
<g class="a e20"><text class="sm tk" x="40" y="744">250 − 105 = 145: именно их ядро и отправило; для ядра это обычная потеря, а не стратегия</text></g>
</svg>
