<g class="a e1"><text class="cap" x="10" y="24">в начале каждого выпуска</text></g>
<g class="a e2"><rect class="bxa" x="6" y="36" width="230" height="44" rx="8"/><text class="tk c" x="121" y="64">короткий повтор</text><path class="lf" d="M242 58L276 58"/><polygon class="hf" points="284,58 275,62.5 275,53.5"/><text class="" x="296" y="64">поэтому смотреть можно с любого места</text></g>
<g class="a e3"><text class="cap" x="10" y="118">сложное добавляем слоями (пример)</text></g>
<g class="a e4"><rect class="bx" x="6" y="130" width="290" height="88" rx="8"/><text class="tk" x="22" y="158">1. картинка</text><rect class="bx" x="22" y="174" width="34" height="24" rx="3"/><path class="lm" d="M23 175L39 188L55 175"/><text class="sm" x="68" y="192">письма едут по ленте</text></g>
<g class="a e5"><path class="lf" d="M300 174L319 174"/><polygon class="hf" points="327,174 318,178.5 318,169.5"/></g>
<g class="a e6"><rect class="bx" x="331" y="130" width="290" height="88" rx="8"/><text class="tk" x="347" y="158">2. слово</text><text class="sm" x="347" y="186">этому письму даём имя: пакет</text></g>
<g class="a e7"><path class="lf" d="M625 174L644 174"/><polygon class="hf" points="652,174 643,178.5 643,169.5"/></g>
<g class="a e8"><rect class="bx" x="656" y="130" width="290" height="88" rx="8"/><text class="tk" x="672" y="158">3. детали</text><text class="mk" x="672" y="184">316 байт = 14 + 20 + 32 + 250</text><text class="sm mu" x="672" y="205">Ethernet + IP + TCP + данные</text></g>
<g class="a e9"><text class="cap" x="10" y="256">у каждого утверждения пометка: откуда оно (пример)</text></g>
<g class="a e10"><rect class="bxa" x="6" y="268" width="290" height="92" rx="8"/><text class="tk acc" x="22" y="296">из кода</text><text class="sm" x="22" y="322">функция multisplit:</text><text class="m" x="22" y="346">lua/zapret-antidpi.lua:483</text></g>
<g class="a e11"><rect class="bxo" x="331" y="268" width="290" height="92" rx="8"/><text class="tk ok" x="347" y="296">из лаборатории</text><text class="sm" x="347" y="322">TTL пакета до роутера 64,</text><text class="sm" x="347" y="344">после роутера 63</text></g>
<g class="a e12"><rect class="bxb" x="656" y="268" width="290" height="92" rx="8"/><text class="tk amb" x="672" y="296">из общих знаний</text><text class="sm" x="672" y="322">пакеты могут теряться</text><text class="sm" x="672" y="344">и приходить не по порядку</text></g>
<g class="a e13"><text class="cap" x="10" y="394">где речь о коде: открываем сам код</text></g>
<g class="a e14"><rect class="bx" x="6" y="406" width="560" height="62" rx="8"/><text class="sm mu" x="20" y="424">lua/zapret-antidpi.lua</text><text class="ml mu" x="20" y="454">483</text><text class="ml" x="70" y="454">function multisplit(ctx, desync)</text></g>
<g class="a e15"><text class="tk" x="590" y="432">читаем его,</text><text class="tk" x="590" y="456">а не пересказываем</text></g>
