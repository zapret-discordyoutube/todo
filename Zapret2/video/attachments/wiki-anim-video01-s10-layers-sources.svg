<svg xmlns="http://www.w3.org/2000/svg" class="v01-s10-layers-sources" viewBox="0 0 960 478" width="960" height="478" role="img" aria-labelledby="v01-s10-layers-sources-t v01-s10-layers-sources-d">
<title id="v01-s10-layers-sources-t">Слои и источники утверждений</title>
<desc id="v01-s10-layers-sources-d">Как устроена серия: каждый выпуск начинается с короткого повтора; сложное добавляется слоями (картинка, слово, детали; пример: письмо на ленте, слово «пакет», 316 байт = 14 + 20 + 32 + 250); у каждого утверждения пометка источника (код, лаборатория или общие знания); где речь о коде, открывается сам код: lua/zapret-antidpi.lua, строка 483, function multisplit(ctx, desync).</desc>
<style>
.v01-s10-layers-sources{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
