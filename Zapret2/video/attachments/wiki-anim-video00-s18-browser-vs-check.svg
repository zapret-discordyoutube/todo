<svg xmlns="http://www.w3.org/2000/svg" class="v00-s18-browser-vs-check" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="v00-s18-browser-vs-check-t v00-s18-browser-vs-check-d">
<title id="v00-s18-browser-vs-check-t">Почему в браузере не открылось</title>
<desc id="v00-s18-browser-vs-check-d">Если blockcheck2 показал, что стратегия работает, а в браузере сайт не открылся, то, по словам автора программы, тест проверяет один домен по одному протоколу, а браузер ходит на другие домены сайта, пробует IPv4 и IPv6, TLS и QUIC и использует другую версию TLS.</desc>
