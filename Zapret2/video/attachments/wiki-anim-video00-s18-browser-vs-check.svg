<rect class="bg" x="0" y="0" width="960" height="520"/>
<g><text class="cap" x="24" y="24">проверь себя: тест прошёл, а сайт не открылся</text></g>
<g class="a e1"><rect class="bxa" x="24" y="44" width="163" height="26" rx="13.0"/><text class="sm tk c" x="105.5" y="62">ДОКУМЕНТАЦИЯ</text><text class="sm mu" x="199" y="62">так отвечает автор программы</text></g>
<g><rect class="bx" x="24" y="84" width="912" height="64" rx="8"/><text class="tk" x="40" y="112">blockcheck2 показал, что стратегия работает.</text><text class="tk" x="40" y="136">А в браузере сайт не открылся. Почему такое возможно?</text></g>
<g class="a e2"><rect class="bxo" x="24" y="164" width="330" height="200" rx="8"/><text class="tk" x="40" y="192">что проверил blockcheck2</text><rect class="bx" x="40" y="208" width="298" height="40" rx="6"/><text class="sm tk" x="52" y="233">один домен</text><rect class="bx" x="40" y="256" width="298" height="40" rx="6"/><text class="sm tk" x="52" y="281">один протокол</text><text class="sm mu" x="40" y="326">и больше ничего</text></g>
<g class="a e3"><path class="lm" d="M358 264L386.0 264.0"/><polygon class="hm" points="396,264 386.0,269.0 386.0,259.0"/></g>
<g class="a e4"><rect class="bxa" x="400" y="164" width="536" height="330" rx="8"/><text class="tk" x="416" y="192">что делает браузер</text></g>
<g class="a e5"><rect class="bx" x="416" y="208" width="504" height="56" rx="6"/><circle class="bxa" cx="442" cy="236" r="7"/><text class="tk" x="466" y="232">другие домены сайта</text><text class="sm mu" x="466" y="252">пункт 2 списка автора</text></g>
<g class="a e6"><rect class="bx" x="416" y="274" width="504" height="56" rx="6"/><circle class="bxa" cx="442" cy="302" r="7"/><text class="tk" x="466" y="298">IPv4 и IPv6</text><text class="sm mu" x="466" y="318">пункт 3</text></g>
<g class="a e7"><rect class="bx" x="416" y="340" width="504" height="56" rx="6"/><circle class="bxa" cx="442" cy="368" r="7"/><text class="tk" x="466" y="364">TLS и QUIC</text><text class="sm mu" x="466" y="384">пункт 3</text></g>
<g class="a e8"><rect class="bx" x="416" y="406" width="504" height="56" rx="6"/><circle class="bxa" cx="442" cy="434" r="7"/><text class="tk" x="466" y="430">другая версия TLS</text><text class="sm mu" x="466" y="450">пункт 7</text></g>
<g class="a e9"><rect class="bxd" x="24" y="380" width="330" height="114" rx="8"/><text class="sm tk" x="40" y="406">пересказ слов автора:</text><text class="sm" x="40" y="428">blockcheck проверяет один</text><text class="sm" x="40" y="450">домен по одному протоколу,</text><text class="sm" x="40" y="472">не более</text></g>
</svg>
