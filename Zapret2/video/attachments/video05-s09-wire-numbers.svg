<svg xmlns="http://www.w3.org/2000/svg" class="v05-s09-wire-numbers" viewBox="0 0 960 586" width="960" height="586" role="img" aria-labelledby="v05-s09-wire-numbers-t v05-s09-wire-numbers-d">
<title id="v05-s09-wire-numbers-t">Номера пакетов на проводе</title>
<desc id="v05-s09-wire-numbers-d">Что ушло на провод при тех же пяти частях (пять пакетов, клиент, относительные номера от начального: SYN получает 0, первый байт данных 1): номер и длина 1 и 2, 3 и 95, 98 и 7, 105 и 8, 113 и 138, где номер каждого следующего пакета равен номеру плюс длина предыдущего (1+2=3, 3+95=98, 98+7=105, 105+8=113, 113+138=251), сервер подтвердил 251, а номер каждого пакета совпал с позицией Lua, с которой начинается его часть, потому что приветствие это первые данные соединения, а в общем случае номер равен номеру исходного пакета плюс позиция минус один (zapret-antidpi.lua:522, zapret-lib.lua:1287); внизу проверка на бумаге для sld,endsld: Lua 102 и 109, части 101, 7 (слово example) и 142, номера 1, 102 и 109, расчёт без опыта.</desc>
