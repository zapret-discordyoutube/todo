<g class="a e22"><text class="sm" x="40" y="520">Часть из 7 байт это ровно слово example (байты 101-107). 101 + 7 + 142 = 250.</text><text class="sm mu" x="40" y="544">Номер части равен её позиции Lua: 1, 102 и 109.</text></g>
