<svg xmlns="http://www.w3.org/2000/svg" class="v00-s05-throttle" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="v00-s05-throttle-t v00-s05-throttle-d">
<title id="v00-s05-throttle-t">Замедление: когда может помочь</title>
<desc id="v00-s05-throttle-d">Про замедление в описании сказано только, что zapret2 может помочь против замедления сайтов, и в лаборатории его не воспроизводили; по общим сведениям помочь можно, когда причина видна в первых пакетах, например имя сайта или сигнатура протокола, а перегруженную линию или ограничение скорости по объёму или по адресу программа не лечит.</desc>
