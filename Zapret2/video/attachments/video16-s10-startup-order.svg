rtup-order .e10{animation-name:v16-s10-startup-order-k10}@keyframes v16-s10-startup-order-k11{0.0%{opacity:0}57.895%{opacity:0}59.079%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v16-s10-startup-order .e11{animation-name:v16-s10-startup-order-k11}@keyframes v16-s10-startup-order-k12{0.0%{opacity:0}61.842%{opacity:0}63.026%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v16-s10-startup-order .e12{animation-name:v16-s10-startup-order-k12}@keyframes v16-s10-startup-order-k13{0.0%{opacity:0}65.789%{opacity:0}66.974%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v16-s10-startup-order .e13{animation-name:v16-s10-startup-order-k13}@keyframes v16-s10-startup-order-k14{0.0%{opacity:0}71.053%{opacity:0}72.237%{opacity:1}95.526%{opacity:1}97.105%{opacity:0}100%{opacity:0}}.v16-s10-startup-order .e14{animation-name:v16-s10-startup-order-k14}</style>
<rect class="bg" x="0" y="0" width="960" height="590"/>
<g><text class="cap" x="40" y="26">что делает nfq_main до первого пакета (nfqws.c:444-531)</text></g>
<g class="a e1"><rect class="bxa" x="40" y="44" width="880" height="50" rx="6"/><rect class="pl" x="48" y="53" width="30" height="30" rx="15"/><text class="tk c" x="63" y="74">1</text><text class="tk sm" x="92" y="66">права</text><text class="mk" x="330" y="66">dropcaps()</text><text class="ix r" x="908" y="66">nfqws.c:463-464</text><text class="sm" x="92" y="86">остаются два права: NET_ADMIN и NET_RAW</text></g>
<g class="a e2"><rect class="bxa" x="40" y="100" width="880" height="50" rx="6"/><rect class="pl" x="48" y="109" width="30" height="30" rx="15"/><text class="tk c" x="63" y="130">2</text><text class="tk sm" x="92" y="122">два сырых сокета</text><text class="mk" x="330" y="122">rawsend_preinit()</text><text class="ix r" x="908" y="122">nfqws.c:474</text><text class="sm" x="92" y="142">IPv4 и IPv6: через них программа шлёт свои пакеты</text></g>
<g class="a e3"><rect class="bxr" x="40" y="156" width="880" height="50" rx="6"/><rect class="pl" x="48" y="165" width="30" height="30" rx="15"/><text class="tk c" x="63" y="186">3</text><text class="tk sm" x="92" y="178">Lua</text><text class="mk" x="330" y="178">lua_init()</text><text class="ix r" x="908" y="178">nfqws.c:486</text><text class="sm" x="92" y="198">не запустился: goto err, очередь не создаётся, выход с кодом 1</text></g>
<g class="a e4"><rect class="bxa" x="40" y="212" width="880" height="50" rx="6"/><rect class="pl" x="48" y="221" width="30" height="30" rx="15"/><text class="tk c" x="63" y="242">4</text><text class="tk sm" x="92" y="234">два буфера</text><text class="mk" x="330" y="234">malloc()</text><text class="ix r" x="908" y="234">nfqws.c:498</text><text class="sm" x="92" y="254">приёмный 65536 + 4096 = 69632 Б; для изменённого пакета 65536 Б</text></g>
<g class="a e5"><rect class="bxa" x="40" y="268" width="880" height="50" rx="6"/><rect class="pl" x="48" y="277" width="30" height="30" rx="15"/><text class="tk c" x="63" y="298">5</text><text class="tk sm" x="92" y="290">вспомогательный сокет</text><text class="mk" x="330" y="290">socket(AF_INET, SOCK_DGRAM, 0)</text><text class="ix r" x="908" y="290">nfqws.c:504</text><text class="sm" x="92" y="310">нужен приёмщику, чтобы узнавать имена интерфейсов</text></g>
<g class="a e6"><rect class="bxo" x="40" y="324" width="880" height="50" rx="6"/><rect class="pl" x="48" y="333" width="30" height="30" rx="15"/><text class="tk c" x="63" y="354">6</text><text class="tk sm" x="92" y="346">очередь</text><text class="mk" x="330" y="346">nfq_init()</text><text class="ix r" x="908" y="346">nfqws.c:510</text><text class="sm" x="92" y="366">создаётся последней: окошко открывают, когда всё готово</text></g>
<g class="a e7 tr"><rect class="bxrd" x="36" y="153" width="888" height="56" rx="8"/></g>
<g class="a e8"><text class="cap" x="40" y="398">журнал опыта: те же шаги в том же порядке</text></g>
<g class="a e9"><rect class="bx" x="40" y="408" width="880" height="24" rx="4"/><text class="m" x="50" y="425">initializing raw sockets bind-fix4=0 bind-fix6=0</text><text class="sm mu r" x="908" y="425">сырые сокеты</text></g>
<g class="a e10"><rect class="bx" x="40" y="436" width="880" height="24" rx="4"/><text class="m" x="50" y="453">set_socket_buffers … fd=3, fd=4 (две группы по три строки)</text><text class="sm mu r" x="908" y="453">буферы сырых сокетов</text></g>
<g class="a e11"><rect class="bx" x="40" y="464" width="880" height="24" rx="4"/><text class="m" x="50" y="481">LUA INIT DONE</text><text class="sm mu r" x="908" y="481">Lua готов</text></g>
<g class="a e12"><rect class="bx" x="40" y="492" width="880" height="24" rx="4"/><text class="m" x="50" y="509">opening nfq library handle … set receive buffer size to 1048576</text><text class="sm mu r" x="908" y="509">восемь строк про очередь</text></g>
<g class="a e13"><rect class="bx" x="40" y="520" width="880" height="24" rx="4"/><text class="m" x="50" y="537">packet: id=1 len=60 mark=00000000 …</text><text class="sm mu r" x="908" y="537">первый пакет</text></g>
<g class="a e14"><text class="tk sm" x="40" y="572">Окошко открывается последним: пакет не придёт к приёмщику раньше, чем готовы сокеты и Lua.</text></g>
</svg>
