.v16-s10-startup-order .fa{fill:var(--tint);stroke:none}.v16-s10-startup-order .fr{fill:var(--rejt);stroke:none}.v16-s10-startup-order .fb{fill:var(--ambt);stroke:none}.v16-s10-startup-order .fo{fill:var(--okt);stroke:none}
.v16-s10-startup-order .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v16-s10-startup-order .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v16-s10-startup-order .la{fill:none;stroke:var(--acc);stroke-width:2}
.v16-s10-startup-order .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v16-s10-startup-order .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v16-s10-startup-order .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v16-s10-startup-order .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v16-s10-startup-order .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v16-s10-startup-order .hf{fill:var(--fg2)}.v16-s10-startup-order .ha{fill:var(--acc)}.v16-s10-startup-order .hr{fill:var(--rej)}.v16-s10-startup-order .hm{fill:var(--mute)}.v16-s10-startup-order .hb{fill:var(--amb)}
.v16-s10-startup-order .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v16-s10-startup-order .a{animation-duration:38s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
