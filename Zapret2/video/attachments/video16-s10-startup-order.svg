<svg xmlns="http://www.w3.org/2000/svg" class="v16-s10-startup-order" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="v16-s10-startup-order-t v16-s10-startup-order-d">
<title id="v16-s10-startup-order-t">Порядок запуска: окошко открывается последним</title>
<desc id="v16-s10-startup-order-d">Порядок запуска главного цикла nfq_main до первого пакета, шесть шагов сверху вниз, как в коде nfqws.c: права (dropcaps, строки 463-464: остаются два права, NET_ADMIN и NET_RAW), два сырых сокета для IPv4 и IPv6 (rawsend_preinit, 474), Lua (lua_init, 486: при неудаче переход к выходу с ошибкой, очередь не создаётся), два буфера (malloc, 498: приёмный 65536 + 4096 = 69632 байта и второй для изменённого пакета 65536), вспомогательный сокет (504, нужен приёмщику для имён интерфейсов) и последней очередь (nfq_init, 510). Внизу журнал опыта: строка про сырые сокеты, две группы по три строки про их буферы, LUA INIT DONE, восемь строк про очередь, первый пакет.</desc>
<style>.v16-s10-startup-order{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v16-s10-startup-order{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
