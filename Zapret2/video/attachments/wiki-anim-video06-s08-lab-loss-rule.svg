<svg xmlns="http://www.w3.org/2000/svg" class="v06-s08-lab-loss-rule" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="v06-s08-lab-loss-rule-t v06-s08-lab-loss-rule-d">
<title id="v06-s08-lab-loss-rule-t">Потерянный пакет в лаборатории</title>
<desc id="v06-s08-lab-loss-rule-d">Лабораторная потеря пакета: сначала выдуманный пример, где почтальон потерял первую страницу, кладовщик говорит «жду первую» и ничего не отдаёт читателю, потом схема лаборатории с клиентом, роутером и сервером, на входе роутера стоит правило лаборатории выбросить ОДИН пакет длиной 156 байт, оно придумано для опыта, программа о нём не знает и это не свойство техники; кусок 146 байт доходит до сервера, а кусок с началом в 104 байта пропадает на роутере, и 156 это 104 байта данных, 20 байт заголовка IP и 32 байта заголовка TCP (20 и ещё 12 байт опций); следы такие: у входа роутера пакет виден, у выхода роутера и на сервере его нет, счётчик правила показал один пакет в 156 байт, так мы убеждаемся, что пакет не дошёл, а не просто не записался.</desc>
