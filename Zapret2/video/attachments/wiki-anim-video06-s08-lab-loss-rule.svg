<rect class="bg" x="0" y="0" width="960" height="590"/>
<g><text class="cap" x="40" y="24">потеря начала: правило лаборатории на роутере</text></g>
<g class="a e1"><rect class="bxb" x="40" y="36" width="176" height="26" rx="13"/><text class="sm c" x="128" y="54">выдуманный пример</text><text class="sm" x="228" y="54">почтальон потерял первую страницу</text></g>
<g class="a e2"><rect class="bxd" x="40" y="74" width="190" height="32" rx="4"/><text class="sm c" x="135" y="95">страница 1: потеряна</text></g>
<g class="a e3"><rect class="bxa" x="240" y="74" width="270" height="32" rx="4"/><text class="sm c" x="375" y="95">страницы 2…: лежат в коробке</text></g>
<g class="a e4"><rect class="bx" x="522" y="72" width="398" height="36" rx="18"/><text class="sm c tk" x="721" y="95">кладовщик: «жду первую», читателю ничего</text></g>
<g class="a e5"><text class="cap" x="40" y="146">лаборатория: клиент, роутер, сервер</text></g>
<g class="a e6"><rect class="bx" x="40" y="208" width="150" height="110" rx="8"/><text class="sm tk c" x="115" y="232">клиент</text></g>
<g class="a e7"><rect class="bx" x="385" y="208" width="190" height="110" rx="8"/><text class="sm tk c" x="480" y="232">роутер</text></g>
<g class="a e8"><rect class="bx" x="770" y="208" width="150" height="110" rx="8"/><text class="sm tk c" x="845" y="232">сервер</text></g>
<g class="a e9"><path class="lf" d="M190 254L385 254"/><path class="lf" d="M575 254L770 254"/><path class="lf" d="M190 296L385 296"/></g>
<g class="a e10"><rect class="bxr" x="270" y="156" width="420" height="30" rx="6"/><text class="sm c tk rej" x="480" y="176">правило: выбросить ОДИН пакет в 156 байт</text><path class="lr" d="M480 186L480 208"/></g>
<g class="a e11"><text class="sm mu c" x="480" y="340">правило стоит на входе роутера; программа о нём не знает; оно придумано для опыта, это не свойство техники</text></g>
<g class="a e12"><text class="sm c" x="288" y="246">146 байт: 105…250</text></g>
<g class="a e13"><text class="sm c" x="672" y="246">дошёл до сервера</text></g>
<g class="a e14"><text class="sm c" x="288" y="288">104 байта: 1…104</text></g>
<g class="a e15"><path class="lr" d="M373 284 L397 308 M373 308 L397 284"/><text class="sm c tk rej" x="480" y="302">пропал на роутере</text></g>
<g class="a e16"><text class="cap" x="40" y="372">почему 156 байт</text></g>
<g class="a e17"><rect class="bxb" x="40" y="382" width="332.8" height="34" rx="3"/><text class="sm c" x="206.4" y="404">104 данных</text></g>
<g class="a e18"><rect class="bxa" x="372.8" y="382" width="64" height="34" rx="3"/><text class="sm c" x="404.8" y="404">IP 20</text></g>
<g class="a e19"><rect class="bxg" x="436.8" y="382" width="102.4" height="34" rx="3"/><text class="sm c" x="488" y="404">TCP 32</text></g>
<g class="a e20"><text class="sm" x="553.2" y="404">= 156 (в TCP: 20 и ещё 12 опций)</text></g>
<g class="a e21"><text class="cap" x="40" y="444">где лежат следы</text></g>
<g class="a e22"><rect class="bxo" x="40" y="454" width="208" height="58" rx="6"/><text class="sm tk" x="52" y="476">у входа роутера</text><text class="sm" x="52" y="498">пакет виден</text></g>
<g class="a e23"><rect class="bxr" x="264" y="454" width="208" height="58" rx="6"/><text class="sm tk" x="276" y="476">у выхода роутера</text><text class="sm" x="276" y="498">пакета нет</text></g>
<g class="a e24"><rect class="bxr" x="488" y="454" width="208" height="58" rx="6"/><text class="sm tk" x="500" y="476">на сервере</text><text class="sm" x="500" y="498">пакета нет</text></g>
<g class="a e25"><rect class="bxa" x="712" y="454" width="208" height="58" rx="6"/><text class="sm tk" x="724" y="476">счётчик правила</text><text class="sm" x="724" y="498">1 пакет, 156 байт</text></g>
<g class="a e26"><rect class="bxo" x="40" y="526" width="880" height="30" rx="6"/><text class="sm tk" x="52" y="546">так мы убеждаемся, что пакет не дошёл, а не просто не записался</text></g>
</svg>
