<svg xmlns="http://www.w3.org/2000/svg" class="v00-s17-layers" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="v00-s17-layers-t v00-s17-layers-d">
<title id="v00-s17-layers-t">Другие слои: IPv6, фрагменты, HTTP, QUIC</title>
<desc id="v00-s17-layers-d">Другие слои это заголовки IPv6, фрагменты IP-пакетов, правки самого запроса HTTP и UDP с QUIC, и в нашем тесте правка запроса сделала буквы имени то большими, то маленькими, каждый кусок приветствия ушёл двумя фрагментами, а ловушка такова, что параметр для IPv4 в соединении IPv6 молча игнорируется и подделка доходит до сервера, тогда как с параметром для IPv6 всё работает, и функции для TCP датаграмму QUIC не режут.</desc>
