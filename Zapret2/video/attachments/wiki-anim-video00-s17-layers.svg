<g><text class="cap" x="24" y="24">другие слои: четыре наблюдения из лаборатории</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bx" x="24" y="44" width="450" height="268" rx="8"/><rect class="bxa" x="38" y="56" width="127" height="26" rx="13.0"/><text class="sm tk c" x="101.5" y="74">правки HTTP</text><rect class="bxo" x="177" y="56" width="108" height="26" rx="5"/><text class="lgk" x="184" y="74">http_domcase</text></g>
<g class="a e2"><text class="sm" x="38" y="112">имя в запросе:</text><rect class="bx" x="38" y="122" width="416" height="30" rx="5"/><text class="ml" x="48" y="143">www.example.com</text></g>
<g class="a e3"><path class="lf" d="M246 156L246.0 168.0"/><polygon class="hf" points="246,178 241.0,168.0 251.0,168.0"/></g>
<g class="a e4"><text class="sm" x="38" y="202">имя, которое увидел сервер:</text><rect class="bxb" x="38" y="212" width="416" height="30" rx="5"/><text class="ml" x="48" y="233">WwW.ExAmPlE.CoM</text></g>
<g class="a e5"><text class="sm tk" x="38" y="272">буквы то большие, то маленькие;</text><text class="sm" x="38" y="292">сервер получил запрос в 81 байт одним куском</text></g>
<g class="a e6"><rect class="bx" x="486" y="44" width="450" height="268" rx="8"/><rect class="bxa" x="500" y="56" width="136" height="26" rx="13.0"/><text class="sm tk c" x="568" y="74">фрагменты IP</text><rect class="bxo" x="648" y="56" width="61" height="26" rx="5"/><text class="lgk" x="655" y="74">ipfrag</text></g>
<g class="a e7"><text class="sm tk" x="500" y="112">фрагментация режет не сообщение,</text><text class="sm tk" x="500" y="132">а сам IP-пакет</text></g>
<g class="a e8"><text class="sm" x="500" y="170">кусок 104 байта</text><rect class="bxa" x="656" y="156" width="120" height="26" rx="5"/><text class="sm c" x="716" y="174">фрагмент 1</text><rect class="bxa" x="782" y="156" width="120" height="26" rx="5"/><text class="sm c" x="842" y="174">фрагмент 2</text></g>
<g class="a e9"><text class="sm" x="500" y="230">кусок 146 байт</text><rect class="bxo" x="656" y="216" width="120" height="26" rx="5"/><text class="sm c" x="716" y="234">фрагмент 1</text><rect class="bxo" x="782" y="216" width="120" height="26" rx="5"/><text class="sm c" x="842" y="234">фрагмент 2</text></g>
<g class="a e10"><text class="sm" x="500" y="276">каждый кусок ушёл двумя фрагментами;</text><text class="sm tk" x="500" y="296">сервер получил целые куски 104 и 146 байт</text></g>
<g class="a e11"><rect class="bx" x="24" y="324" width="450" height="268" rx="8"/><rect class="bxa" x="38" y="336" width="146" height="26" rx="13.0"/><text class="sm tk c" x="111" y="354">заголовки IPv6</text><text class="sm tk" x="38" y="388">подделка в соединении IPv6:</text></g>
<g class="a e12"><rect class="bxo" x="38" y="404" width="84" height="26" rx="5"/><text class="lgk" x="45" y="422">ip6_ttl=1</text><circle class="bxo" cx="148" cy="417" r="11"/><path class="lo" d="M143 417L146.5 421L153 413" style="stroke-linecap:round;stroke-linejoin:round"/><text class="sm" x="38" y="452">параметр для IPv6: подделка умерла,</text><text class="sm tk" x="38" y="472">сервер получил 250 байт</text></g>
<g class="a e13"><rect class="bxr" x="38" y="494" width="77" height="26" rx="5"/><text class="lgk" x="45" y="512">ip_ttl=1</text><circle class="bxr" cx="141" cy="507" r="11"/><path class="lr" d="M137 503L145 511M145 503L137 511" style="stroke-linecap:round;stroke-width:2"/><text class="sm" x="38" y="542">параметр для IPv4: молча игнорируется,</text><text class="sm tk" x="38" y="562">подделка дошла: 680 байт, ответа нет</text></g>
<g class="a e14"><rect class="bx" x="486" y="324" width="450" height="268" rx="8"/><rect class="bxa" x="500" y="336" width="115" height="26" rx="13.0"/><text class="sm tk c" x="557.5" y="354">UDP и QUIC</text><text class="sm tk" x="500" y="388">десять функций для TCP в одной строке</text></g>
<g class="a e15"><rect class="bxs" x="500" y="400" width="90" height="22" rx="4"/><text class="lgk" x="506" y="416">multisplit</text><rect class="bxs" x="596" y="400" width="114" height="22" rx="4"/><text class="lgk" x="602" y="416">multidisorder</text><rect class="bxs" x="716" y="400" width="90" height="22" rx="4"/><text class="lgk" x="722" y="416">fakedsplit</text><rect class="bxs" x="500" y="428" width="114" height="22" rx="4"/><text class="lgk" x="506" y="444">fakeddisorder</text><rect class="bxs" x="620" y="428" width="114" height="22" rx="4"/><text class="lgk" x="626" y="444">hostfakesplit</text><rect class="bxs" x="740" y="428" width="59" height="22" rx="4"/><text class="lgk" x="746" y="444">tcpseg</text><rect class="bxs" x="805" y="428" width="35" height="22" rx="4"/><text class="lgk" x="811" y="444">rst</text><rect class="bxs" x="846" y="428" width="67" height="22" rx="4"/><text class="lgk" x="852" y="444">syndata</text><rect class="bxs" x="500" y="456" width="35" height="22" rx="4"/><text class="lgk" x="506" y="472">oob</text><rect class="bxs" x="541" y="456" width="106" height="22" rx="4"/><text class="lgk" x="547" y="472">http_domcase</text></g>
<g class="a e16"><rect class="bxa" x="500" y="490" width="422" height="34" rx="5"/><text class="sm tk" x="510" y="513">датаграмма QUIC, 1200 байт</text></g>
<g class="a e17"><text class="sm" x="500" y="550">сервер получил её целиком, одним куском:</text><text class="sm tk" x="500" y="572">функции для TCP QUIC не режут</text><text class="sm" x="500" y="580"></text></g>
