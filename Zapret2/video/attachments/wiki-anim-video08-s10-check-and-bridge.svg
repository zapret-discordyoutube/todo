<svg xmlns="http://www.w3.org/2000/svg" class="video08-s10-check-and-bridge" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="video08-s10-check-and-bridge-t video08-s10-check-and-bridge-d">
<title id="video08-s10-check-and-bridge-t">Проверка и мостик</title>
<desc id="video08-s10-check-and-bridge-d">Проверка по итоговой таблице и мостик к следующей функции: запуск fakedsplit с позицией host, условием MD5 и выключателями nofake1 и nofake4 даёт части 97 и 153 байта и четыре пакета, настоящая первая часть, фейк первой части, фейк второй части и настоящая вторая часть, это расчёт по правилам выключателей, такого запуска в лаборатории не было; ниже две строки с шестью пакетами, у разреза с фейками первой уходит первая часть, у перемешивания с фейками fakeddisorder первой уходит вторая часть, и вопрос, что будет, если отправить вторую половину раньше первой, разбирается дальше в выпуске.</desc>
