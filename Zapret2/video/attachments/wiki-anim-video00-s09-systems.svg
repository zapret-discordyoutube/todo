<svg xmlns="http://www.w3.org/2000/svg" class="v00-s09-systems" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="v00-s09-systems-t v00-s09-systems-d">
<title id="v00-s09-systems-t">Слой перехвата по системам</title>
<desc id="v00-s09-systems-d">Слой перехвата зависит от системы: на Linux это правило файервола ядра с очередью и ограничителем первых пакетов соединения, на FreeBSD и OpenBSD правила ipfw и pf перенаправляют программе весь поток по направлению, в Windows встроенных средств нет и winws2 перехватывает сам через драйвер WinDivert, а macOS не поддерживается, зато дальше везде одно и то же: Си-часть, профили и стратегии на Lua.</desc>
<style>.v00-s09-systems{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
