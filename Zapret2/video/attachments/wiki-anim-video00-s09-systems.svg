ranslate(0px,-6px)}10%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s09-systems .e3{animation-name:v00-s09-systems-k3}@keyframes v00-s09-systems-k4{0.0%{opacity:0;transform:translate(0px,-6px)}20%{opacity:0;transform:translate(0px,-6px)}22%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s09-systems .e4{animation-name:v00-s09-systems-k4}@keyframes v00-s09-systems-k5{0.0%{opacity:0;transform:translate(0px,-6px)}32%{opacity:0;transform:translate(0px,-6px)}34%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s09-systems .e5{animation-name:v00-s09-systems-k5}@keyframes v00-s09-systems-k6{0.0%{opacity:0;transform:translate(0px,-6px)}44%{opacity:0;transform:translate(0px,-6px)}46%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s09-systems .e6{animation-name:v00-s09-systems-k6}@keyframes v00-s09-systems-k7{0.0%{opacity:0;transform:translate(0px,-6px)}56%{opacity:0;transform:translate(0px,-6px)}58%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s09-systems .e7{animation-name:v00-s09-systems-k7}@keyframes v00-s09-systems-k8{0.0%{opacity:0;transform:translate(0px,-6px)}70%{opacity:0;transform:translate(0px,-6px)}72%{opacity:1;transform:translate(0px,0px)}95.25%{opacity:1;transform:translate(0px,0px)}96.75%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v00-s09-systems .e