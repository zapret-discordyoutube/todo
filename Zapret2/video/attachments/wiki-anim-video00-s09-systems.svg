<g class="a e1"><text class="cap" x="40" y="26">слой перехвата по системам</text><rect class="bxa" x="762.8" y="8" width="157.2" height="24" rx="5"/><text class="cap acc" x="772.8" y="24.5">ДОКУМЕНТАЦИЯ</text></g>
<g class="a e2"><text class="cap" x="52" y="62">система</text><text class="cap" x="204" y="62">как перехватывает</text><text class="cap" x="624" y="62">«первые N пакетов» в правиле</text></g>
<g class="a e3"><rect class="bx" x="40" y="72" width="568" height="58" rx="8"/><text class="tk" x="52" y="107">Linux</text><text class="sm" x="204" y="97">правило файервола ядра: iptables</text><text class="sm" x="204" y="117">или nftables, очередь</text><rect class="bxo" x="624" y="72" width="296" height="58" rx="8"/><text class="tk sm ok" x="636" y="97">есть:</text><text class="sm" x="636" y="117">первые пакеты соединения</text></g>
<g class="a e4"><rect class="bx" x="40" y="138" width="568" height="58" rx="8"/><text class="tk" x="52" y="173">FreeBSD</text><text class="sm" x="204" y="163">правило ipfw с перенаправлением</text><text class="sm" x="204" y="183">пакетов программе</text><rect class="bxr" x="624" y="138" width="296" height="58" rx="8"/><text class="tk sm rej" x="636" y="163">нет:</text><text class="sm" x="636" y="183">весь поток по направлению</text></g>
<g class="a e5"><rect class="bx" x="40" y="204" width="568" height="58" rx="8"/><text class="tk" x="52" y="239">OpenBSD</text><text class="sm" x="204" y="229">правило pf с перенаправлением</text><text class="sm" x="204" y="249">пакетов программе</text><rect class="bxr" x="624" y="204" width="296" height="58" rx="8"/><text class="tk sm rej" x="636" y="229">нет:</text><text class="sm" x="636" y="249">весь поток по направлению</text></g>
<g class="a e6"><rect class="bx" x="40" y="270" width="568" height="58" rx="8"/><text class="tk" x="52" y="305">Windows</text><text class="sm" x="204" y="295">драйвер WinDivert внутри winws2;</text><text class="sm" x="204" y="315">фильтр задают параметры wf</text><rect class="bxr" x="624" y="270" width="296" height="58" rx="8"/><text class="tk sm rej" x="636" y="295">нет:</text><text class="sm" x="636" y="315">весь поток по направлению</text></g>
<g class="a e7"><rect class="bx" x="40" y="336" width="568" height="58" rx="8"/><text class="tk" x="52" y="371">macOS</text><text class="sm" x="204" y="361">не поддерживается: нет подходящего</text><text class="sm" x="204" y="381">средства перехвата</text><rect class="bxs" x="624" y="336" width="296" height="58" rx="8"/><text class="tk sm mu" x="636" y="361">—</text><text class="sm" x="636" y="381">не применимо</text></g>
<g class="a e8"><rect class="bxa" x="40" y="408" width="880" height="48" rx="10"/><text class="tk sm c" x="480" y="438">дальше везде одно и то же: Си-часть, профили и стратегии на Lua</text></g>
<g class="a e9"><rect class="bxd" x="40" y="468" width="610" height="24" rx="5"/><text class="cap mu" x="50" y="484.5">ПО ДОКУМЕНТАЦИИ И ПО КОДУ, В ЛАБОРАТОРИИ НЕ ЗАПУСКАЛИ</text><text class="sm mu" x="666" y="485">наша лаборатория: только Linux</text></g>
</svg>
