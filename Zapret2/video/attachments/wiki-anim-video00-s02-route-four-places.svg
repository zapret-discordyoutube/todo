<title id="v00-s02-route-four-places-t">Маршрут запроса и четыре места</title>
<desc id="v00-s02-route-four-places-d">Маршрут запроса от браузера через четыре места: справочник DNS, адрес и порт, имя сайта в первом сообщении и вид протокола или поток целиком; документация описывает полный блок адреса так, что не доходит ничего, нет ни пингов, ни соединения на порт, а про имя и сигнатуру известно лишь по общим сведениям, и сколько пакетов читает настоящее оборудование, неизвестно.</desc>
