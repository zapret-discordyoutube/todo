.v04-s03-name-fields .bg{fill:var(--bg)}
.v04-s03-name-fields text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v04-s03-name-fields .tk{font-weight:600;fill:var(--fg)}
.v04-s03-name-fields .sm{font-size:14.5px}
