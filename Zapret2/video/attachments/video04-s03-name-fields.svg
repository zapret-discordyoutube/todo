<g class="a e19"><rect class="bxb" x="492" y="438" width="438" height="66" rx="8"/><text class="sm tk" x="506" y="460">если идентификатор сессии пустой (по счёту)</text><text class="sm" x="506" y="480">всё после него на 32 байта левее:</text><text class="sm tk" x="506" y="498">extlen 54, sniext 60, host 97 − 32 = 65</text></g>
