<svg xmlns="http://www.w3.org/2000/svg" class="v04-s03-name-fields" viewBox="0 0 960 524" width="960" height="524" role="img" aria-labelledby="v04-s03-name-fields-t v04-s03-name-fields-d">
<title id="v04-s03-name-fields-t">Поля до имени сайта</title>
<desc id="v04-s03-name-fields-d">Расширение «имя сервера» в приветствии, байты 86–111, по полям: длина всех расширений 00 a2 = 162 на 86–87 (метка extlen = 86); тип расширения 00 00 = 0 и длина 00 14 = 20 на 88–91; данные расширения начинаются с 92 (метка sniext = 92): длина списка 00 12 = 18, тип имени 00, длина имени 00 0f = 15; имя www.example.com на байтах 97–111 (метка host = 97). В большом приветствии на 1484 байта те же 86, 92 и 97. Если бы идентификатор сессии был пустым, по счёту всё сдвинулось бы на 32 байта: extlen 54, sniext 60, host 65.</desc>
<style>
.v04-s03-name-fields{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
