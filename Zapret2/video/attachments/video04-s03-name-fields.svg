.v04-s03-name-fields .hf{fill:var(--fg2)}.v04-s03-name-fields .ha{fill:var(--acc)}.v04-s03-name-fields .hr{fill:var(--rej)}.v04-s03-name-fields .hm{fill:var(--mute)}
.v04-s03-name-fields .a{animation-duration:36s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
