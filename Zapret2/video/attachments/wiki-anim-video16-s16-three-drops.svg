<g class="a e15"><rect class="bxs" x="354" y="388" width="245.9" height="26" rx="3"/><rect class="bxs" x="599.9" y="388" width="12" height="26" rx="3"/><text class="sm tk rej" x="356" y="406">1448 + 36 = 1484: оба drop</text><path class="lf" d="M480 418L480.0 430.0"/><polygon class="hf" points="480,440 475.0,430.0 485.0,430.0"/><rect class="bxo" x="354" y="446" width="245.9" height="26" rx="3"/><rect class="bxo" x="599.9" y="446" width="12" height="26" rx="3"/><text class="mk c" x="476.9" y="464">1448</text><text class="sm" x="354" y="498">отправила программа сама</text><text class="sm tk" x="354" y="518">8 в очереди − 2 + 2 = 8</text></g>
<g class="a e16"><rect class="bxs" x="654" y="388" width="252" height="26" rx="3"/><text class="sm c tk" x="780" y="406">SYN длиной 60</text><path class="lf" d="M780 418L780.0 430.0"/><polygon class="hf" points="780,440 775.0,430.0 785.0,430.0"/><rect class="bxb" x="654" y="446" width="252" height="26" rx="3"/><text class="m c" x="780" y="464">pass modified. len 60 =&gt; 60</text><text class="sm" x="654" y="498">вместо drop программа</text><text class="sm" x="654" y="518">подменила пакет: часть 3</text></g>
<g class="a e17"><rect class="bx" x="40" y="560" width="880" height="56" rx="6"/><text class="sm" x="54" y="584">pass unmodified тоже не значит, что ничего не произошло: так пишется и когда</text><text class="sm" x="54" y="604">скрипт отработал и ничего не изменил (стратегия pcap), и когда ничего не подошло.</text></g>
<g class="a e18"><text class="sm tk" x="40" y="646">Когда в журнале drop, смотрим, что программа отправила сама:</text><text class="sm mu" x="40" y="668">в опыте t10 перед drop стоят две строки отправки, в r10 пакеты удержаны и отправлены позже.</text></g>
