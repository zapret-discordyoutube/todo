<svg xmlns="http://www.w3.org/2000/svg" class="v16-s16-three-drops" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="v16-s16-three-drops-t v16-s16-three-drops-d">
<title id="v16-s16-three-drops-t">Статистика вердиктов и три drop</title>
<desc id="v16-s16-three-drops-d">Статистика вердиктов и три смысла слова drop. По всей нашей лаборатории, 92 журнала: 1062 пакета очереди = 990 pass unmodified + 22 pass modified + 50 drop (990 + 22 = 1012, 1012 + 50 = 1062); у каждого пакета ровно одна строка с вердиктом. Пример MODIFY, опыт h12: клиент отправляет обычный HTTP-запрос, пакет 133 байта = 20 IP + 32 TCP + 81 запрос; стратегия пишет имя в Host чередующимися большими и малыми буквами, было www.example.com, стало WwW.ExAmPlE.CoM; длина прежняя: packet: id=4 pass modified. len 133 =&gt; 133. Слово drop не значит «данные потеряны». Смысл 1, запрос заменён вставленными частями (опыт t10): исходящий запрос 250 байт получил drop, но программа заранее отправила его двумя частями, 104 + 146 = 250. Смысл 2, пакет удержан, пока программа дособирает запрос (опыт r10): запрос 1484 байта ядро само поделило на 1448 и 36, оба получили drop, потом программа отправила их сама по одному; по проводу клиента: 8 в очереди − 2 выброшено + 2 отправлено = 8. Смысл 3, первый пакет соединения (опыт t40): когда стратегия выбрасывает самый первый пакет, программа подменяет его, и в журнале вместо drop стоит pass modified, у SYN длиной 60: pass modified. len 60 =&gt; 60; как это устроено, разберём в третьей части. И наоборот, pass unmodified не значит, что ничего не произошло: так пишется и когда скрипт отработал и ничего не изменил (например, стратегия pcap), и когда ничего не подошло.</desc>
