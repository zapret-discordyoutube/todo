<svg xmlns="http://www.w3.org/2000/svg" class="v16-s17-engine-stages" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v16-s17-engine-stages-t v16-s17-engine-stages-d">
<title id="v16-s17-engine-stages-t">Что движок делает с пакетом</title>
<desc id="v16-s17-engine-stages-d">Что движок делает с пакетом номер четыре до вставок, строки журнала 93-116. 1) Профиль из кэша (строка 94, desync.c:1300): профиль «1 (noname)» остался в памяти от SYN, его фильтр на порт 443 задан параметром filter-tcp. 2) Вид нагрузки (95, desync.c:41): tls_client_hello; разбор печатает TLSDebug (desync.c:121): версия записи TLS 1.0, рукопожатия TLS 1.2, расширение версий называет TLS 1.3. 3) Имя и повторный поиск профиля (102-106, desync.c:1356, 331, 339): hostname www.example.com, профиль 1 найден. 4) Стратегии профиля (108-113, desync.c:1044, 1053-1054): для каждой движок проверяет диапазон и тип нагрузки и вызывает её; pcap_1_1 только записывает пакет в файл, вердикт остаётся PASS; multisplit_1_2 вызывается следом. 5) cutoff (114, nfq2/lua.c:924): instance cutoff for multisplit_1_2 in=1 out=0, отметка внутри Lua: этот экземпляр больше не вызывается для входящих пакетов соединения; правила ядра не менялись, пакеты с 5 по 11 всё равно приходят в очередь. 6) Метка midsld, середина слова example, становится позицией 104: номером байта, перед которым запрос будет разрезан (115-116, lua/zapret-antidpi.lua:499-501).</desc>
