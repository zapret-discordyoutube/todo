.v03-s11-hostlist-walk .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s11-hostlist-walk .hf{fill:var(--fg2)}.v03-s11-hostlist-walk .ha{fill:var(--acc)}.v03-s11-hostlist-walk .hr{fill:var(--rej)}.v03-s11-hostlist-walk .hm{fill:var(--mute)}.v03-s11-hostlist-walk .ho{fill:var(--ok)}
.v03-s11-hostlist-walk .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v03-s11-hostlist-walk .a{animation-duration:43s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
