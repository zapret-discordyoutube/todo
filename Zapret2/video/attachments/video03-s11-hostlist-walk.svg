<g class="a e1"><text class="cap" x="10" y="24">список имён (hostlist): файл и сравнение имени</text></g>
<g class="a e2"><text class="sm mu" x="10" y="52">пример файла списка</text></g>
<g class="a e3"><rect class="bx" x="10" y="62" width="410" height="124" rx="7"/></g>
<g class="a e4"><text class="m" x="24" y="88"><tspan class="mu"># comment</tspan></text><text class="sm mu" x="218" y="88">пропуск: комментарий</text></g>
<g class="a e5"><text class="m" x="24" y="116"><tspan class="hb">example.com</tspan></text><text class="sm" x="218" y="116">запись: имя до пробела</text></g>
<g class="a e6"><text class="m" x="24" y="144"><tspan class="hb">^strict.example.org</tspan></text><text class="sm" x="218" y="144">«крышка»: целое имя</text></g>
<g class="a e7"><text class="m mu" x="24" y="172">(пустая строка)</text><text class="sm mu" x="218" y="172">пропуск: пустая строка</text></g>
<g class="a e8"><text class="sm mu" x="434" y="52">как подключить</text></g>
<g class="a e9"><rect class="bx" x="434" y="62" width="516" height="124" rx="7"/></g>
<g class="a e10"><text class="mk" x="448" y="88">--hostlist=файл</text><text class="sm" x="724" y="88">включающий</text></g>
<g class="a e11"><text class="mk" x="448" y="116">--hostlist-exclude=файл</text><text class="sm" x="724" y="116">исключающий</text></g>
<g class="a e12"><text class="mk" x="448" y="144">--hostlist-domains=a,b</text><text class="sm" x="724" y="144">включающий, в команде</text></g>
<g class="a e13"><text class="mk" x="448" y="172">--hostlist-exclude-domains=a,b</text><text class="sm" x="724" y="172">исключающий, в команде</text></g>
<g class="a e14"><text class="cap" x="10" y="214">как имя из запроса сравнивается со списком (по коду: SearchHostList, nfq2/hostlist.c:195-227)</text></g>
<g class="a e15"><rect class="bxa" x="195.0" y="226" width="190" height="30" rx="6"/><text class="mk c" x="290" y="247">www.example.com</text><rect class="bxa" x="415.0" y="226" width="150" height="30" rx="6"/><text class="mk c" x="490" y="247">example.com</text><rect class="bxa" x="595.0" y="226" width="90" height="30" rx="6"/><text class="mk c" x="640" y="247">com</text><path class="lf" d="M389.0 241L401.0 241.0"/><polygon class="hf" points="411.0,241 401.0,246.0 401.0,236.0"/><path class="lf" d="M569.0 241L581.0 241.0"/><polygon class="hf" points="591.0,241 581.0,246.0 581.0,236.0"/></g>
<g class="a e16"><text class="sm mu" x="10" y="247">имя из запроса</text></g>
<g class="a e17"><text class="sm mu" x="10" y="278">на каждом шаге убирается самая левая метка; запись подходит, если равна любому из этих хвостов</text></g>
<g class="a e18"><text class="mk" x="10" y="316">запись example.com</text></g>
<g class="a e19"><rect class="bxr" x="210" y="294" width="160" height="32" rx="6"/><path class="lr" d="M223 305L233 315M223 315L233 305"/><text class="mk c rej" x="300" y="316">negative</text></g>
<g class="a e20"><rect class="bxo" x="420" y="294" width="140" height="32" rx="6"/><path class="lo" d="M431 309L436 315L446 302"/><text class="mk c ok" x="502" y="316">positive</text></g>
<g class="a e21"><text class="sm mu c" x="640" y="316">не нужно</text></g>
<g class="a e22"><text class="tk ok sm" x="718" y="316">подошёл: куски 104 + 146</text></g>
