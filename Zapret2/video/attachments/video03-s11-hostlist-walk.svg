<svg xmlns="http://www.w3.org/2000/svg" class="v03-s11-hostlist-walk" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="v03-s11-hostlist-walk-t v03-s11-hostlist-walk-d">
<title id="v03-s11-hostlist-walk-t">Список имён: как сравнивается имя</title>
<desc id="v03-s11-hostlist-walk-d">Список имён: в файле комментарии и пустые строки пропускаются, имя читается до первого пробела; имя из запроса www.example.com проверяется целиком, потом без левой метки (example.com), потом com; запись example.com подошла на второй пробе и запрос разрезан на 104 и 146 байт, запись example.org не подошла ни на одной из трёх проб и запрос ушёл целым в 250 байт; запись со знаком крышки подходит только целому имени, шаблона со звёздочкой нет; исключающий список сильнее включающего, два включающих работают как «или», пустой файл означает «списка нет».</desc>
<style>.v03-s11-hostlist-walk{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
