<g class="a e28"><text class="cap" x="10" y="410">что подходит под имя www.example.com (опыты лаборатории)</text></g>
<g class="a e29"><rect class="bxo" x="10" y="420" width="180" height="82" rx="7"/><text class="mk c" x="100" y="444">example.com</text><text class="tk c ok" x="100" y="468">да</text><text class="sm mu c" x="100" y="490">хвост совпал</text></g>
<g class="a e30"><rect class="bxr" x="200" y="420" width="180" height="82" rx="7"/><text class="mk c" x="290" y="444">example.org</text><text class="tk c rej" x="290" y="468">нет</text><text class="sm mu c" x="290" y="490">три пробы negative</text></g>
<g class="a e31"><rect class="bxr" x="390" y="420" width="180" height="82" rx="7"/><text class="mk c" x="480" y="444">^example.com</text><text class="tk c rej" x="480" y="468">нет</text><text class="sm mu c" x="480" y="490">strict_mismatch</text></g>
<g class="a e32"><rect class="bxo" x="580" y="420" width="180" height="82" rx="7"/><text class="mk c" x="670" y="444">^www.example.com</text><text class="tk c ok" x="670" y="468">да</text><text class="sm mu c" x="670" y="490">целое имя совпало</text></g>
