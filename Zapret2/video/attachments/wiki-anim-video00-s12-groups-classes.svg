<g class="a e14"><text class="sm" x="24" y="392">сверх этого есть настройки для</text><rect class="gr" x="300" y="373" width="90" height="30" rx="8"/><text class="sm tk c" x="345" y="393">IPv6</text><rect class="gr" x="402" y="373" width="270" height="30" rx="8"/><text class="sm tk c" x="537" y="393">автоматических списков имён</text></g>
