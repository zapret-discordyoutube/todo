<g class="a e4"><text class="sm tk mu" x="24" y="108">первые четыре: что и как программа берёт</text></g>
<g class="a e5"><text class="sm tk mu" x="24" y="240">вторые четыре: работа с соединением и запуск</text></g>
<g class="a e6"><rect class="bx" x="24" y="116" width="216" height="98" rx="8"/><circle class="bxa" cx="44" cy="138" r="12"/><text class="tk c ns" x="44" y="143">1</text><text class="sm fg" x="62" y="143">как пакеты попадают</text><text class="sm fg" x="62" y="163">в программу</text><rect class="bxs" x="38" y="182" width="61" height="22" rx="4"/><text class="lgk" x="45" y="198">--qnum</text></g>
<g class="a e7"><rect class="bx" x="256" y="116" width="216" height="98" rx="8"/><circle class="bxa" cx="276" cy="138" r="12"/><text class="tk c ns" x="276" y="143">2</text><text class="sm fg" x="294" y="143">что загрузить</text><rect class="bxs" x="270" y="182" width="92.3" height="22" rx="4"/><text class="lgk" x="277" y="198">--lua-init</text><rect class="bxs" x="370.3" y="182" width="61" height="22" rx="4"/><text class="lgk" x="377.3" y="198">--blob</text></g>
<g class="a e8"><rect class="bx" x="488" y="116" width="216" height="98" rx="8"/><circle class="bxa" cx="508" cy="138" r="12"/><text class="tk c ns" x="508" y="143">3</text><text class="sm fg" x="526" y="143">профили</text><rect class="bxs" x="502" y="182" width="53.1" height="22" rx="4"/><text class="lgk" x="509" y="198">--new</text></g>
<g class="a e9"><rect class="bx" x="720" y="116" width="216" height="98" rx="8"/><circle class="bxa" cx="740" cy="138" r="12"/><text class="tk c ns" x="740" y="143">4</text><text class="sm fg" x="758" y="143">условия профиля</text><rect class="bxs" x="734" y="182" width="107.9" height="22" rx="4"/><text class="lgk" x="741" y="198">--filter-tcp</text></g>
<g class="a e10"><rect class="bx" x="24" y="248" width="216" height="98" rx="8"/><circle class="bxa" cx="44" cy="270" r="12"/><text class="tk c ns" x="44" y="275">5</text><text class="sm fg" x="62" y="275">какие пакеты</text><text class="sm fg" x="62" y="295">соединения брать</text><rect class="bxs" x="38" y="314" width="84.5" height="22" rx="4"/><text class="lgk" x="45" y="330">--payload</text></g>
<g class="a e11"><rect class="bx" x="256" y="248" width="216" height="98" rx="8"/><circle class="bxa" cx="276" cy="270" r="12"/><text class="tk c ns" x="276" y="275">6</text><text class="sm fg" x="294" y="275">память о соединении</text><text class="sm fg" x="294" y="295">и сборка сообщения</text><rect class="bxs" x="270" y="314" width="147.1" height="22" rx="4"/><text class="lgk" x="277" y="330">--ctrack-timeouts</text></g>
