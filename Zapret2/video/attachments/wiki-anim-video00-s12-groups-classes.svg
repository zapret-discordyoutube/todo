<svg xmlns="http://www.w3.org/2000/svg" class="v00-s12-groups-classes" viewBox="0 0 960 692" width="960" height="692" role="img" aria-labelledby="v00-s12-groups-classes-t v00-s12-groups-classes-d">
<title id="v00-s12-groups-classes-t">Восемь групп опций и три класса</title>
<desc id="v00-s12-groups-classes-d">Опции программы делятся на восемь групп, а именно как пакеты попадают в программу, что загрузить, профили, условия профиля, какие пакеты соединения брать, память о соединении и сборка, отладка и права с запуском, плюс отдельные настройки для IPv6 и автоматических списков имён, и ещё на три класса по образу выдуманного пульта печи: глобальные действуют на всё, профильные начинаются заново после слова new, а ручки задают вид данных и два диапазона для вызовов стратегий, записанных после них.</desc>
