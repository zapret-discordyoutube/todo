<g><text class="cap" x="24" y="24">опции: восемь групп и три класса</text></g>
<g class="a e1"><rect class="bxa" x="24" y="36" width="330" height="42" rx="8"/><text class="sm c" x="189" y="63">Си-часть: перехват, разбор, отправка</text></g>
