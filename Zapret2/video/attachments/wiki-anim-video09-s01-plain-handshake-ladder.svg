<svg xmlns="http://www.w3.org/2000/svg" class="video09-s01-plain-handshake-ladder" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="video09-s01-plain-handshake-ladder-t video09-s01-plain-handshake-ladder-d">
<title id="video09-s01-plain-handshake-ladder-t">Обычное рукопожатие и приветствие</title>
<desc id="video09-s01-plain-handshake-ladder-d">Четыре пакета обычного соединения без стратегий на проводе клиента: SYN с номером 0, SYN-ACK сервера через 10 мс с подтверждением 1, ACK с номером 1 и приветствие в 250 байт с номером 1, причём в первых трёх пакетах данных нет и данные начинаются только с четвёртого.</desc>
