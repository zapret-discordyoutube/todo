<svg xmlns="http://www.w3.org/2000/svg" class="v05-s08-toy-ten-cells" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="v05-s08-toy-ten-cells-t v05-s08-toy-ten-cells-d">
<title id="v05-s08-toy-ten-cells-t">Игрушка: лента из десяти клеток</title>
<desc id="v05-s08-toy-ten-cells-d">Игрушка, выдуманный пример: бумажная лента из десяти клеток, пронумерованных с единицы, и список разрезов 4 и 8 дают три части, клетки 1-3, 4-7 и 8-10; часть начинается там, где стоит её разрез, и кончается перед следующим разрезом (у первой своего разреза нет, она начинается с клетки 1, у последней следующего нет, она идёт до клетки 10), и разрезов на один меньше, чем частей.</desc>
