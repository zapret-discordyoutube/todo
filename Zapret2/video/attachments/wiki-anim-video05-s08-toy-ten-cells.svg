<g class="a e9"><text class="cap" x="40" y="230">правило</text><text class="cap" x="170" y="230">начало части</text><text class="cap" x="480" y="230">конец части</text></g>
<g class="a e10"><rect class="bxa" x="40" y="238" width="120" height="34" rx="5"/><text class="tk c" x="100" y="261">часть 1</text><rect class="bx" x="170" y="238" width="300" height="34" rx="5"/><text class="sm" x="182" y="261">1: нет разреза, с начала ленты</text><rect class="bx" x="480" y="238" width="440" height="34" rx="5"/><text class="sm" x="492" y="261">4 − 1 = 3</text></g>
<g class="a e11"><rect class="bxb" x="40" y="280" width="120" height="34" rx="5"/><text class="tk c" x="100" y="303">часть 2</text><rect class="bx" x="170" y="280" width="300" height="34" rx="5"/><text class="sm" x="182" y="303">4: здесь её разрез</text><rect class="bx" x="480" y="280" width="440" height="34" rx="5"/><text class="sm" x="492" y="303">8 − 1 = 7</text></g>
<g class="a e12"><rect class="bxo" x="40" y="322" width="120" height="34" rx="5"/><text class="tk c" x="100" y="345">часть 3</text><rect class="bx" x="170" y="322" width="300" height="34" rx="5"/><text class="sm" x="182" y="345">8: здесь её разрез</text><rect class="bx" x="480" y="322" width="440" height="34" rx="5"/><text class="sm" x="492" y="345">10: следующего разреза нет, до конца ленты</text></g>
<g class="a e13"><text class="tk sm" x="40" y="392">Часть начинается там, где стоит её разрез, и кончается перед следующим разрезом.</text><text class="tk sm" x="40" y="416">Два разреза, три части: разрезов на один меньше, чем частей.</text><text class="sm mu" x="40" y="440">Дальше то же самое делает настоящий код, на настоящих байтах.</text></g>
