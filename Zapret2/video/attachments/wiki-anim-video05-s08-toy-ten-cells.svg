<g class="a e1"><text class="cap" x="40" y="22">игрушка: выдуманный пример, не настоящий пакет</text></g>
<g class="a e2"><rect class="bx" x="40" y="78" width="88" height="44" rx="0"/><text class="mk c" x="84" y="107">1</text><rect class="bx" x="128" y="78" width="88" height="44" rx="0"/><text class="mk c" x="172" y="107">2</text><rect class="bx" x="216" y="78" width="88" height="44" rx="0"/><text class="mk c" x="260" y="107">3</text><rect class="bx" x="304" y="78" width="88" height="44" rx="0"/><text class="mk c" x="348" y="107">4</text><rect class="bx" x="392" y="78" width="88" height="44" rx="0"/><text class="mk c" x="436" y="107">5</text><rect class="bx" x="480" y="78" width="88" height="44" rx="0"/><text class="mk c" x="524" y="107">6</text><rect class="bx" x="568" y="78" width="88" height="44" rx="0"/><text class="mk c" x="612" y="107">7</text><rect class="bx" x="656" y="78" width="88" height="44" rx="0"/><text class="mk c" x="700" y="107">8</text><rect class="bx" x="744" y="78" width="88" height="44" rx="0"/><text class="mk c" x="788" y="107">9</text><rect class="bx" x="832" y="78" width="88" height="44" rx="0"/><text class="mk c" x="876" y="107">10</text><text class="sm mu" x="40" y="144">клетки пронумерованы с единицы</text></g>
<g class="a e3"><text class="mk r" x="920" y="144">список разрезов: 4, 8</text></g>
<g class="a e4"><path class="lcut" d="M304 62L304 130"/><text class="mk c rej" x="304" y="56">разрез 4</text></g>
<g class="a e5"><path class="lcut" d="M656 62L656 130"/><text class="mk c rej" x="656" y="56">разрез 8</text></g>
<g class="a e6"><rect class="fa" x="43" y="78" width="258" height="44" rx="0"/><path class="la" d="M43 164 L43 170 L301 170 L301 164"/><text class="tk sm c" x="172" y="192">клетки 1-3</text></g>
<g class="a e7"><rect class="fb" x="307" y="78" width="346" height="44" rx="0"/><path class="lb" d="M307 164 L307 170 L653 170 L653 164"/><text class="tk sm c" x="480" y="192">клетки 4-7</text></g>
