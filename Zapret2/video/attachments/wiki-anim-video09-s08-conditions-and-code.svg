}69.0%{opacity:1}69.6%{opacity:0}100%{opacity:0}}.v09-s08-conditions-and-code .e19{animation-name:v09-s08-conditions-and-code-k19}@keyframes v09-s08-conditions-and-code-k20{0.0%{opacity:0}64.6%{opacity:0}65.5%{opacity:1}96.6%{opacity:1}97.8%{opacity:0}100%{opacity:0}}.v09-s08-conditions-and-code .e20{animation-name:v09-s08-conditions-and-code-k20}@keyframes v09-s08-conditions-and-code-k21{0.0%{opacity:0}70.0%{opacity:0}70.9%{opacity:1}96.6%{opacity:1}97.8%{opacity:0}100%{opacity:0}}.v09-s08-conditions-and-code .e21{animation-name:v09-s08-conditions-and-code-k21}@keyframes v09-s08-conditions-and-code-k22{0.0%{opacity:0}76.0%{opacity:0}76.9%{opacity:1}96.6%{opacity:1}97.8%{opacity:0}100%{opacity:0}}.v09-s08-conditions-and-code .e22{animation-name:v09-s08-conditions-and-code-k22}@keyframes v09-s08-conditions-and-code-k23{0.0%{opacity:0}82.0%{opacity:0}82.9%{opacity:1}96.6%{opacity:1}97.8%{opacity:0}100%{opacity:0}}.v09-s08-conditions-and-code .e23{animation-name:v09-s08-conditions-and-code-k23}</style>
<rect class="bg" x="0" y="0" width="960" height="665"/>
<g><text class="cap" x="40" y="22">условия на synack и код функции</text></g>
<g class="a e1"><rect class="bx" x="40" y="36" width="880" height="56" rx="8"/><text class="sm tk" x="54" y="59">проверь себя: synack:ip_ttl=1, умрёт ли подложный SYN-ACK на роутере?</text></g>
<g class="a e2"><text class="sm tk ok" x="54" y="81">нет: срок жизни остаётся 64, пакет доходит до сервера, и сервер отвечает сбросом</text></g>
<g class="a e3"><text class="cap" x="54" y="120">запуск</text><text class="cap" x="232" y="120">TTL подложного:</text><text class="cap" x="232" y="136">клиент → сервер</text><text class="cap" x="430" y="120">сумма</text><text class="cap" x="430" y="136">TCP</text><text class="cap" x="540" y="120">ответ</text><text class="cap" x="540" y="136">сервера</text><text class="cap" x="722" y="120">приветствие на</text><text class="cap" x="722" y="136">проводе после ACK</text><path class="lm" d="M40 150L920 150"/></g>
<g class="a e4"><rect class="bx" x="40" y="158" width="880" height="54" rx="6"/><text class="mk" x="54" y="182">synack</text><text class="sm mu" x="54" y="202">без условий</text><text class="m fg" x="232" y="190">64 → 63</text><text class="m fg" x="430" y="190">верна</text><text class="sm tk rej" x="540" y="190">сброс, окно 0</text><text class="sm tk rej" x="722" y="190">+212,8 мс</text></g>
<g class="a e5"><rect class="bx" x="40" y="220" width="880" height="54" rx="6"/><text class="mk" x="54" y="244">synack:ip_ttl=1</text><text class="sm mu" x="54" y="264">срок 1 не действует</text><text class="m fg" x="232" y="252">64 → 63</text><text class="m fg" x="430" y="252">верна</text><text class="sm tk rej" x="540" y="252">сброс, окно 0</text><text class="sm tk rej" x="722" y="252">+213,7 мс</text></g>
<g class="a e6"><rect class="bxo" x="40" y="282" width="880" height="54" rx="6"/><text class="mk" x="54" y="306">synack:badsum</text><text class="sm mu" x="54" y="326">сумма действует</text><text class="m fg" x="232" y="314">64 → 63</text><text class="mk amb" x="430" y="314">BAD</text><text class="sm tk ok" x="540" y="314">молчит</text><text class="sm tk ok" x="722" y="314">+0,17 мс</text></g>
<g class="a e7"><text class="sm mu" x="40" y="358">во всех строках приложение сервера получило 250 байт; задержка есть только там, где сервер ответил сбросом</text></g>
<g class="a e8"><text class="sm mu" x="40" y="380">это совпадение в наших опытах, а не объяснение</text></g>
<g class="a e9"><text class="cap" x="40" y="416">код функции synack: пять строк</text><text class="ix mu r" x="920" y="416">строки 299-303</text></g>
<g class="a e10"><rect class="bx" x="40" y="428" width="590" height="144" rx="6"/><path class="lm" d="M86 434L86 566"/><text class="ix mu r" x="78" y="453">299</text><text class="ix fg" x="96" y="453">if bitand(desync.dis.tcp.th_flags, TH_SYN + TH_ACK)==TH_SYN then</text><text class="ix mu r" x="78" y="479">300</text><text class="ix fg" x="96" y="479">local dis = deepcopy(desync.dis)</text><text class="ix mu r" x="78" y="505">301</text><text class="ix fg" x="96" y="505">dis.tcp.th_flags = bitor(dis.tcp.th_flags, TH_ACK)</text><text class="ix mu r" x="78" y="531">302</text><text class="ix fg" x="96" y="531">DLOG(&quot;synack: sending&quot;)</text><text class="ix mu r" x="78" y="557">303</text><text class="ix fg" x="96" y="557">rawsend_dissect_ipfrag(dis, desync_opts(desync))</text></g>
<g class="a e11 tr"><rect class="fa" x="43" y="435" width="584" height="26" rx="3"/></g>
<g class="a e12"><text class="sm" x="650" y="453">проверка: у пакета только SYN</text></g>
<g class="a e13 tr"><rect class="fa" x="43" y="461" width="584" height="26" rx="3"/></g>
<g class="a e14"><text class="sm" x="650" y="479">копия этого SYN</text></g>
<g class="a e15 tr"><rect class="fa" x="43" y="487" width="584" height="26" rx="3"/></g>
<g class="a e16"><text class="sm" x="650" y="505">к флагам добавлен ACK</text></g>
<g class="a e17 tr"><rect class="fa" x="43" y="513" width="584" height="26" rx="3"/></g>
<g class="a e18"><text class="sm" x="650" y="531">запись в журнал</text></g>
<g class="a e19 tr"><rect class="fa" x="43" y="539" width="584" height="26" rx="3"/></g>
<g class="a e20"><text class="sm" x="650" y="557">отправка напрямую</text></g>
<g class="a e21"><text class="sm tk" x="40" y="596">вердикта функция не даёт: настоящий SYN уходит следом</text></g>
<g class="a e22"><text class="sm" x="40" y="620">срок жизни читает только apply_fooling, а его здесь нет: поэтому ip_ttl не действует</text></g>
<g class="a e23"><text class="sm" x="40" y="644">badsum и repeats входят в desync_opts (строки 423-431 общей библиотеки): поэтому badsum действует</text></g>
</svg>
