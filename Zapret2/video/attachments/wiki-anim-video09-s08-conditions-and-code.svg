<svg xmlns="http://www.w3.org/2000/svg" class="v09-s08-conditions-and-code" viewBox="0 0 960 665" width="960" height="665" role="img" aria-labelledby="v09-s08-conditions-and-code-t v09-s08-conditions-and-code-d">
<title id="v09-s08-conditions-and-code-t">Условия на synack и код приёма</title>
<desc id="v09-s08-conditions-and-code-d">Условия на приёме synack и пять строк его кода: с условием срока жизни 1 подложный SYN-ACK идёт со сроком 64 и доходит до сервера, который отвечает сбросом, с испорченной суммой он тоже доходит, но сервер молчит и приветствие уходит сразу за ACK, через 0,17 мс, а без порчи приветствие появляется на проводе через 212,8 мс и 213,7 мс, код проверяет, что у пакета только SYN, копирует его, добавляет флаг ACK, пишет в журнал и отправляет напрямую без обработки условий, поэтому срок жизни в нём не читается.</desc>
