<svg xmlns="http://www.w3.org/2000/svg" class="v00-s16-three-families" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="v00-s16-three-families-t v00-s16-three-families-d">
<title id="v00-s16-three-families-t">Три основные семьи приёмов</title>
<desc id="v00-s16-three-families-d">Три основные семьи приёмов: резать, то есть разделить приветствие на куски, перемешать, то есть отправить куски в другом порядке, и подделывать, то есть добавить ложный пакет, который получатель выбросит; семей несколько, потому что читатели бывают разные, это гипотеза, в наших игрушках она видна, и лекарства на все случаи нет.</desc>
<style>.v00-s16-three-families{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
