<rect class="bg" x="0" y="0" width="960" height="410"/>
<g><text class="cap" x="24" y="24">три основные семьи на одном и том же приветствии</text></g>
<g class="a e1"><rect class="bx" x="24" y="44" width="296" height="230" rx="10"/><text class="big tk fg" x="40" y="76">резать</text><rect class="bxa" x="40" y="104" width="106" height="56" rx="6"/><text class="sm tk c" x="93" y="128">104 байта</text><text class="sm c" x="93" y="148">байты 0–103</text><circle class="bx" cx="93" cy="94" r="10"/><text class="tk c ns" x="93" y="99">1</text><rect class="bxo" x="152" y="104" width="150" height="56" rx="6"/><text class="sm tk c" x="227" y="128">146 байт</text><text class="sm c" x="227" y="148">байты 104–249</text><circle class="bx" cx="227" cy="94" r="10"/><text class="tk c ns" x="227" y="99">2</text><text class="sm mu" x="40" y="196">порядок отправки: 1, 2</text><text class="sm tk" x="40" y="224">разделить приветствие</text><text class="sm tk" x="40" y="244">на куски</text></g>
<g class="a e2"><rect class="bx" x="332" y="44" width="296" height="230" rx="10"/><text class="big tk fg" x="348" y="76">перемешать</text><rect class="bxo" x="348" y="104" width="150" height="56" rx="6"/><text class="sm tk c" x="423" y="128">146 байт</text><text class="sm c" x="423" y="148">байты 104–249</text><circle class="bx" cx="423" cy="94" r="10"/><text class="tk c ns" x="423" y="99">1</text><rect class="bxa" x="504" y="104" width="106" height="56" rx="6"/><text class="sm tk c" x="557" y="128">104 байта</text><text class="sm c" x="557" y="148">байты 0–103</text><circle class="bx" cx="557" cy="94" r="10"/><text class="tk c ns" x="557" y="99">2</text><text class="sm mu" x="348" y="196">порядок отправки: 1, 2</text><text class="sm tk" x="348" y="224">отправить куски</text><text class="sm tk" x="348" y="244">в другом порядке</text></g>
<g class="a e3"><rect class="bx" x="640" y="44" width="296" height="230" rx="10"/><text class="big tk fg" x="656" y="76">подделывать</text><rect class="bxr" x="656" y="104" width="82" height="56" rx="6"/><text class="sm tk c" x="697" y="128">ложный</text><text class="sm c" x="697" y="148">пакет</text><circle class="bx" cx="697" cy="94" r="10"/><text class="tk c ns" x="697" y="99">1</text><rect class="bxa" x="744" y="104" width="168" height="56" rx="6"/><text class="sm tk c" x="828" y="128">настоящее</text><text class="sm c" x="828" y="148">250 байт целиком</text><circle class="bx" cx="828" cy="94" r="10"/><text class="tk c ns" x="828" y="99">2</text><text class="sm mu" x="656" y="196">порядок отправки: 1, 2</text><text class="sm tk" x="656" y="224">добавить ложный пакет,</text><text class="sm tk" x="656" y="244">который получатель выбросит</text></g>
<g class="a e4"><rect class="bxa" x="24" y="292" width="912" height="90" rx="8"/><text class="big tk" x="40" y="322">семей несколько, потому что читатели бывают разные</text><text class="sm" x="40" y="350">это гипотеза, и в наших игрушках она видна</text><text class="sm tk" x="40" y="370">лекарства на все случаи нет</text></g>
</svg>
