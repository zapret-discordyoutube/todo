<svg xmlns="http://www.w3.org/2000/svg" class="v05-s23-six-models" viewBox="0 0 960 730" width="960" height="730" role="img" aria-labelledby="v05-s23-six-models-t v05-s23-six-models-d">
<title id="v05-s23-six-models-t">Шесть игрушечных моделей</title>
<desc id="v05-s23-six-models-d">Шесть игрушечных моделей проекта, а не настоящего оборудования, читают запись пакетов, снятую в роутере: первая ищет имя целиком в одном пакете, вторая смотрит одно место со смещением 97, как правило из прошлой сцены, третья собирает пакеты по номерам как приёмник и всё левее ожидаемого номера отбрасывает, четвёртая склеивает пакеты в порядке прихода, не глядя на номера, и разбирает приветствие TLS с начала потока, пятая учитывает номера, но началом потока считает первый увиденный пакет, шестая как пятая идёт по заголовкам записей: тип, версия, длина; при накладке с узором 16 03 03 00 00 заголовок записи имеет длину 0, пятая не находит ClientHello, а шестая переступает пустую запись на 5 байт и читает настоящее начало, а при накладке из нулей первый байт не равен типу записи 16 и шестая останавливается сразу.</desc>
<style>.v05-s23-six-models{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v05-s23-six-models{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
