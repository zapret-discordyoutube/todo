.0%{opacity:0}46.97%{opacity:0}47.652%{opacity:1}97.424%{opacity:1}98.333%{opacity:0}100%{opacity:0}}.v05-s23-six-models .e11{animation-name:v05-s23-six-models-k11}@keyframes v05-s23-six-models-k12{0.0%{opacity:0}54.545%{opacity:0}55.227%{opacity:1}97.424%{opacity:1}98.333%{opacity:0}100%{opacity:0}}.v05-s23-six-models .e12{animation-name:v05-s23-six-models-k12}@keyframes v05-s23-six-models-k13{0.0%{opacity:0}60.606%{opacity:0}61.288%{opacity:1}97.424%{opacity:1}98.333%{opacity:0}100%{opacity:0}}.v05-s23-six-models .e13{animation-name:v05-s23-six-models-k13}@keyframes v05-s23-six-models-k14{0.0%{opacity:0}69.697%{opacity:0}70.379%{opacity:1}97.424%{opacity:1}98.333%{opacity:0}100%{opacity:0}}.v05-s23-six-models .e14{animation-name:v05-s23-six-models-k14}@keyframes v05-s23-six-models-k15{0.0%{opacity:0}75.758%{opacity:0}76.439%{opacity:1}97.424%{opacity:1}98.333%{opacity:0}100%{opacity:0}}.v05-s23-six-models .e15{animation-name:v05-s23-six-models-k15}</style>
<rect class="bg" x="0" y="0" width="960" height="730"/>
<g><text class="cap" x="40" y="24">игрушечные проверяющие второго вида: модели над записью пакетов</text></g>
<g class="a e1"><rect class="bxb" x="40" y="36" width="880" height="40" rx="8"/><text class="sm tk" x="54" y="61">игрушки проекта, не оборудование: «сработало» = «обошло игрушку»</text></g>
<g class="a e2"><text class="sm" x="40" y="98">они читают запись, снятую в роутере: ровно то, что дошло до проверяющего</text></g>
<g class="a e3"><rect class="bx" x="40" y="108" width="880" height="46" rx="8"/><circle class="bxa" cx="68" cy="131" r="15"/><text class="tk c ns" x="68" y="136">A</text><text class="sm tk" x="96" y="128">ищет имя целиком в одном пакете</text><text class="sm" x="96" y="146">подстрока: разрез внутри имени её сбивает</text></g>
<g class="a e4"><rect class="bx" x="40" y="160" width="880" height="46" rx="8"/><circle class="bxa" cx="68" cy="183" r="15"/><text class="tk c ns" x="68" y="188">B</text><text class="sm tk" x="96" y="180">смотрит одно место: смещение 97, как правило из прошлой сцены</text><text class="sm" x="96" y="198">в нашем тесте совпала со счётчиком правила в 12 опытах из 12</text></g>
<g class="a e5"><rect class="bx" x="40" y="212" width="880" height="46" rx="8"/><circle class="bxa" cx="68" cy="235" r="15"/><text class="tk c ns" x="68" y="240">C</text><text class="sm tk" x="96" y="232">собирает пакеты по номерам, как приёмник</text><text class="sm" x="96" y="250">всё левее ожидаемого номера отбрасывает</text></g>
<g class="a e6"><rect class="bx" x="40" y="264" width="880" height="46" rx="8"/><circle class="bxa" cx="68" cy="287" r="15"/><text class="tk c ns" x="68" y="292">D</text><text class="sm tk" x="96" y="284">склеивает пакеты в порядке прихода, номера не смотрит</text><text class="sm" x="96" y="302">приветствие TLS разбирает с начала потока</text></g>
<g class="a e7"><rect class="bx" x="40" y="316" width="880" height="46" rx="8"/><circle class="bxa" cx="68" cy="339" r="15"/><text class="tk c ns" x="68" y="344">E</text><text class="sm tk" x="96" y="336">номера учитывает, но началом потока считает первый увиденный пакет</text><text class="sm" x="96" y="354">приветствие TLS разбирает с начала потока</text></g>
<g class="a e8"><rect class="bx" x="40" y="368" width="880" height="46" rx="8"/><circle class="bxa" cx="68" cy="391" r="15"/><text class="tk c ns" x="68" y="396">F</text><text class="sm tk" x="96" y="388">как E, но идёт по заголовкам записей: тип, версия, длина</text><text class="sm" x="96" y="406">пустую запись (длина 0) переступает шагом</text></g>
<g class="a e9"><text class="cap" x="40" y="438">накладка в 5 байт: что получает разбор с начала потока (метка «в нашем тесте»)</text></g>
<g class="a e10"><text class="sm tk" x="40" y="468">узор 16 03 03 00 00</text><rect class="bxb" x="40" y="480" width="150" height="30" rx="4"/><text class="hx c" x="115" y="500">16 03 03 00 00</text><rect class="bxa" x="190" y="480" width="730" height="30" rx="0"/><text class="hx" x="205" y="500">16 03 01 00 F5 01 00 00 F1 03 03 …</text></g>
<g class="a e11"><text class="sm" x="40" y="536">D, E: поток начинается с подкладки, а не с записи приветствия: нет разбора</text></g>
<g class="a e12"><path class="la" d="M40 514Q115 530 186 514"/><polygon class="ha" points="190,512 181,507 183,520"/><text class="sm tk" x="40" y="558">F: заголовок «тип 16, версия 3.3, длина 0» это пустая запись, шаг на 5 байт</text></g>
<g class="a e13"><text class="sm" x="40" y="578">F попадает на настоящее начало и читает имя</text></g>
<g class="a e14"><text class="sm tk" x="40" y="610">нули</text><rect class="bxb" x="40" y="622" width="150" height="30" rx="4"/><text class="hx c" x="115" y="642">00 00 00 00 00</text><rect class="bxa" x="190" y="622" width="730" height="30" rx="0"/><text class="hx" x="205" y="642">16 03 01 00 F5 01 00 00 F1 03 03 …</text></g>
<g class="a e15"><text class="sm tk" x="40" y="672">F: первый байт 00 не тип записи 16, разбор останавливается</text><text class="sm" x="40" y="692">C накладку отбрасывает: всё левее начала потока приёмник не берёт</text></g>
</svg>
