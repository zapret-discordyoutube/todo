.v05-s23-six-models .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v05-s23-six-models .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v05-s23-six-models .mu{fill:var(--mute)}.v05-s23-six-models .fg{fill:var(--fg)}.v05-s23-six-models .acc{fill:var(--acc)}.v05-s23-six-models .rej{fill:var(--rej)}.v05-s23-six-models .ok{fill:var(--ok)}.v05-s23-six-models .amb{fill:var(--amb)}
.v05-s23-six-models .c{text-anchor:middle}.v05-s23-six-models .r{text-anchor:end}.v05-s23-six-models .ns{stroke:none}
.v05-s23-six-models .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v05-s23-six-models .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v05-s23-six-models .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v05-s23-six-models .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v05-s23-six-models .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v05-s23-six-models .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
