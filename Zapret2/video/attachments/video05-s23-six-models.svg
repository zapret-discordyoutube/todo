.v05-s23-six-models .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v05-s23-six-models .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v05-s23-six-models .la{fill:none;stroke:var(--acc);stroke-width:2}
.v05-s23-six-models .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v05-s23-six-models .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v05-s23-six-models .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v05-s23-six-models .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v05-s23-six-models .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v05-s23-six-models .hf{fill:var(--fg2)}.v05-s23-six-models .ha{fill:var(--acc)}.v05-s23-six-models .hr{fill:var(--rej)}.v05-s23-six-models .hm{fill:var(--mute)}.v05-s23-six-models .hb{fill:var(--amb)}
.v05-s23-six-models .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v05-s23-six-models .a{animation-duration:66s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v05-s23-six-models .a{animation:none}.v05-s23-six-models .tr{display:none}}
