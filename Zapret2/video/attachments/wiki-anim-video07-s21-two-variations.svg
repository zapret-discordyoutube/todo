<rect class="bg" x="0" y="0" width="960" height="624"/>
<g><text class="cap" x="40" y="26">две вариации получателя, проверенные нарочно</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="232" rx="8"/><text class="tk sm" x="52" y="64">1. на сервере выключены метки времени</text><text class="mk" x="640" y="64">tcp_timestamps=0</text></g>
<g class="a e2"><text class="sm" x="52" y="92">заголовок TCP клиента</text><rect class="bxa" x="260" y="76" width="120" height="24" rx="3"/><text class="ix fg c" x="320" y="93">20 B</text><rect class="bxd" x="380" y="76" width="144" height="24" rx="3"/><text class="ix mu c" x="452" y="93">нет опции времени</text><text class="ix" x="540" y="93">обычно 32 B: 20 и 12 байт опций</text></g>
<g class="a e3"><text class="sm" x="52" y="122">условие tcp_ts=−600000: в журнале программы</text><rect class="bxs" x="52" y="130" width="856" height="28" rx="4"/><text class="m" x="62" y="149">apply_fooling: timestamp tcp option not present or invalid</text></g>
<g class="a e4"><rect class="bxr" x="52" y="168" width="856" height="32" rx="6"/><text class="sm tk" x="64" y="189">подделка принята: приложение получило 680 B, клиент завис (4 с без ответа)</text></g>
<g class="a e5"><text class="sm" x="52" y="222">проверь: тот же сервер, условие tcp_md5</text><rect class="bxo" x="52" y="232" width="856" height="32" rx="6"/><text class="sm tk" x="64" y="253">TCPMD5Unexpected +1, приложение получило чистые 250 B</text></g>
<g class="a e6"><rect class="bx" x="40" y="286" width="880" height="116" rx="8"/><text class="tk sm" x="52" y="310">2. offload интерфейсов оставлен включённым</text></g>
<g class="a e7"><text class="sm mu" x="52" y="336">ожидали: плохая сумма не подействует</text><path class="lr" d="M52 331L372 331"/></g>
<g class="a e8"><rect class="bxo" x="52" y="346" width="856" height="32" rx="6"/><text class="sm tk" x="64" y="367">в нашем тесте подействовала: Tcp:InCsumErrors +1, приложение получило чистые 250 B</text></g>
<g class="a e9"><text class="sm mu" x="52" y="394">почему так, не выясняли</text></g>
<g class="a e10"><text class="cap" x="40" y="430">не проверяли</text></g>
<g class="a e11"><rect class="bxd" x="40" y="440" width="88" height="28" rx="4"/><text class="sm mu c" x="84" y="459">Windows</text></g>
<g class="a e12"><rect class="bxd" x="136" y="440" width="58" height="28" rx="4"/><text class="sm mu c" x="165" y="459">BSD</text></g>
<g class="a e13"><rect class="bxd" x="202" y="440" width="72" height="28" rx="4"/><text class="sm mu c" x="238" y="459">macOS</text></g>
<g class="a e14"><rect class="bxd" x="282" y="440" width="176" height="28" rx="4"/><text class="sm mu c" x="370" y="459">встроенные системы</text></g>
<g class="a e15"><rect class="bxd" x="466" y="440" width="252" height="28" rx="4"/><text class="sm mu c" x="592" y="459">серверы за балансировщиками</text></g>
<g class="a e16"><rect class="bxd" x="40" y="476" width="236" height="28" rx="4"/><text class="sm mu c" x="158" y="495">промежуточные устройства</text></g>
<g class="a e17"><rect class="bxs" x="40" y="520" width="880" height="96" rx="8"/><text class="sm tk" x="52" y="542">предположения, а не результаты:</text><text class="sm" x="52" y="564">другой стек может не отбросить опцию MD5, для которой у него нет ключа, или не проверять метки времени</text><text class="sm" x="52" y="586">заданный вручную ip_ttl зависит от пути, а не от стека; на других стеках мы это не проверяли</text><text class="sm" x="52" y="608">автоподбор опирается на начальный срок жизни сервера, у систем он, по общим сведениям, разный</text></g>
</svg>
