<svg xmlns="http://www.w3.org/2000/svg" class="v07-s21-two-variations" viewBox="0 0 960 624" width="960" height="624" role="img" aria-labelledby="v07-s21-two-variations-t v07-s21-two-variations-d">
<title id="v07-s21-two-variations-t">Две вариации получателя</title>
<desc id="v07-s21-two-variations-d">Две проверенные вариации получателя: при выключенных на сервере метках времени условие старой метки ни за что не цепляется, программа пишет в журнал, что опции нет, подделка принята и приложение получает 680 байт, а условие MD5 работает как прежде, а при включённом offload плохая контрольная сумма всё равно отброшена, причина не выяснена, и отдельно перечислено, чего мы не проверяли: другие системы, балансировщики и промежуточные устройства.</desc>
<style>.v07-s21-two-variations{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
