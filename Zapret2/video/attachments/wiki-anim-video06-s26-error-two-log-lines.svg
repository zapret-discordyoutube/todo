<svg xmlns="http://www.w3.org/2000/svg" class="v06-s26-error-two-log-lines" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="v06-s26-error-two-log-lines-t v06-s26-error-two-log-lines-d">
<title id="v06-s26-error-two-log-lines-t">Ошибка: две строки журнала</title>
<desc id="v06-s26-error-two-log-lines-d">Что происходит, когда tcpseg вызван без параметра pos: функция падает на строке 1051 файла zapret-antidpi.lua с текстом tcpseg: no pos specified, вызов Lua возвращает ошибку (desync.c, строка 1079), программа пишет в журнал две строки (сначала текст ошибки с файлом и номером строки, потом строка движка с пометкой ERROR о том, что пакет пропущен без изменений), результат всей цепочки заменяется на PASS (desync.c, строка 1145), поэтому оригинал в 250 байт уходит как есть, соединение остаётся обычным и приложение получает все 250 байт; в выдуманном примере приёмщик посылок с карточкой вопросов ставит на неправильно заполненную посылку штамп не принято, и посылка уходит дальше как была.</desc>
