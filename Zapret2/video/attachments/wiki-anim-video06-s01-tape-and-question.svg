<title id="video06-s01-tape-and-question-t">Лента, multisplit и вопрос</title>
<desc id="video06-s01-tape-and-question-d">Приветствие в 250 байт с именем www.example.com на байтах с 97 по 111 и меткой midsld на байте 104: multisplit из прошлого выпуска отправляет сначала первые 104 байта, потом остальные 146, и игрушечный вахтёр, которого мы написали сами, не находит разорванное имя, а вопрос этого выпуска в том, что будет, если отправить сначала конец, 146 байт, и только потом начало, 104 байта.</desc>
