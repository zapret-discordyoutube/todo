<g><text class="ix" x="24" y="62">1977</text><text class="cd" x="66" y="62">bool rawsend_preinit(bool bind_fix4, bool bind_fix6)</text><text class="ix" x="24" y="86">1979</text><text class="cdh" x="66" y="86">  b_bind_fix4 = bind_fix4;</text><text class="ix" x="24" y="110">1980</text><text class="cdh" x="66" y="110">  b_bind_fix6 = bind_fix6;</text><text class="ix" x="24" y="134">1981</text><text class="cd mu" x="66" y="134">  // allow ipv6 disabled systems</text><text class="ix" x="24" y="158">1982</text><text class="cdh" x="66" y="158">  return rawsend_socket(AF_INET)!=-1 &amp;&amp; (rawsend_socket(AF_INET6)!=-1 || errno==EAFNOSUPPORT);</text></g>
<g class="a e4"><rect class="bx" x="350" y="196" width="600" height="38" rx="7"/><text class="ix fg ns" x="362" y="220">1979-1980</text><text class="sm ns" x="456" y="220">запоминает, включена ли привязка к интерфейсу (bind-fix)</text></g>
<g class="a e5"><rect class="bx" x="350" y="240" width="600" height="38" rx="7"/><text class="ix fg ns" x="362" y="264">1982</text><text class="sm ns" x="456" y="264">сокет IPv4 обязателен: нет сокета, нет запуска (nfqws.c:474)</text></g>
<g class="a e6"><rect class="bx" x="350" y="284" width="600" height="38" rx="7"/><text class="ix fg ns" x="362" y="308">1981-1982</text><text class="sm ns" x="456" y="308">IPv6 может не создаться, только если errno == EAFNOSUPPORT</text></g>
<g class="a e7"><rect class="bxd" x="10" y="196" width="320" height="126" rx="8"/><text class="sm mu ns" x="22" y="218">игрушка, не данные лаборатории</text><rect class="bxo" x="22" y="230" width="140" height="54" rx="6"/><text class="smk c ns" x="92" y="252">место IPv4</text><text class="sm c ns" x="92" y="272">обязательное</text><rect class="bxb" x="178" y="230" width="140" height="54" rx="6"/><text class="smk c ns" x="248" y="252">место IPv6</text><text class="sm c ns" x="248" y="272">необязательное</text><text class="sm ns" x="22" y="306">оба места готовы с начала смены</text></g>
<g class="a e8"><text class="cap" x="10" y="352">журнал опыта t10, строки 19-24</text></g>
<g class="a e9"><rect class="bx" x="10" y="362" width="470" height="134" rx="8"/><text class="sm mu ns" x="22" y="386">сокет</text><text class="sm mu ns" x="150" y="386">приём (байт)</text><text class="sm mu ns" x="330" y="386">отправка (байт)</text><path class="lm" d="M16 394H474"/><text class="mk ns" x="22" y="420">fd=3</text><text class="mk ns" x="150" y="420">2048  →  4096</text><text class="mk ns" x="330" y="420">32768  →  65536</text><text class="mk ns" x="22" y="454">fd=4</text><text class="mk ns" x="150" y="454">2048  →  4096</text><text class="mk ns" x="330" y="454">32768  →  65536</text><text class="sm mu ns" x="22" y="482">слева запрошено программой, справа показано ядром</text></g>
<g class="a e10"><text class="cap" x="500" y="352">откуда числа</text></g>
<g class="a e11"><rect class="bxa" x="500" y="362" width="450" height="40" rx="7"/><text class="ml ns" x="514" y="380">64 × 1024 / 2 = 32768</text><text class="ix ns" x="514" y="396">RAW_SNDBUF / 2 (params.h:25; darkmagic.c:1885)</text></g>
<g class="a e12"><rect class="bxa" x="500" y="408" width="450" height="40" rx="7"/><text class="ml ns" x="514" y="426">2048 × 2 = 4096</text><text class="ix ns" x="514" y="442">приём: запрошено 2048 (darkmagic.c:1886)</text></g>
<g class="a e13"><rect class="bxa" x="500" y="454" width="450" height="40" rx="7"/><text class="ml ns" x="514" y="472">32768 × 2 = 65536</text><text class="ix ns" x="514" y="488">отправка: запрошено 32768</text></g>
<g class="a e14"><text class="sm mu" x="500" y="516">удвоение: знание ядра, мы не проверяли;</text><text class="sm mu" x="500" y="536">среди настроек сокета метки нет</text></g>
