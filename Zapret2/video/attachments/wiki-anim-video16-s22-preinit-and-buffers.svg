<svg xmlns="http://www.w3.org/2000/svg" class="v16-s22-preinit-and-buffers" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="v16-s22-preinit-and-buffers-t v16-s22-preinit-and-buffers-d">
<title id="v16-s22-preinit-and-buffers-t">Подготовка сокетов при запуске</title>
<desc id="v16-s22-preinit-and-buffers-d">Подготовка сокетов при запуске: функция rawsend_preinit (nfq2/darkmagic.c:1977-1983) запоминает, включена ли привязка к интерфейсу (bind-fix для IPv4 и IPv6), и создаёт два сырых сокета, для IPv4 и для IPv6. Сокет IPv4 обязателен: без него программа не запустится (nfq2/nfqws.c:474). Сокет IPv6 может не создаться только с ошибкой EAFNOSUPPORT, то есть когда система сообщает, что такие адреса не поддерживаются, как на компьютерах с выключенным IPv6 (комментарий автора «allow ipv6 disabled systems»). Игрушка, не данные лаборатории: курьер с двумя рабочими местами, готовыми с начала смены. Журнал опыта t10, строки 19-24: для каждого из двух сокетов (fd=3 и fd=4) запрошено 2048 байт на приём и 32768 на отправку, ядро показывает 4096 и 65536, то есть вдвое больше; 32768 = 64 × 1024 / 2 (RAW_SNDBUF/2, nfq2/params.h:25 и darkmagic.c:1885), 2048 × 2 = 4096, 32768 × 2 = 65536. Почему удвоение, это знание ядра, мы не проверяли; метки среди настроек сокета нет.</desc>
