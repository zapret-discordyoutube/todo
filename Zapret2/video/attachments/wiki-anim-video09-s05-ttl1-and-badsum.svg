<svg xmlns="http://www.w3.org/2000/svg" class="video09-s05-ttl1-and-badsum" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="video09-s05-ttl1-and-badsum-t video09-s05-ttl1-and-badsum-d">
<title id="video09-s05-ttl1-and-badsum-t">Условия на единственном SYN</title>
<desc id="video09-s05-ttl1-and-badsum-d">Если у SYN с данными срок жизни один, то в нашем тесте он виден только на клиенте и на входе в роутер, роутер возвращает сообщение об истёкшем сроке и клиент сразу получает ошибку «нет маршрута», а с испорченной контрольной суммой четыре таких SYN доходят до сервера без ответа и клиент завершается по таймауту, потому что оригинал выброшен и другого SYN в сети нет.</desc>
