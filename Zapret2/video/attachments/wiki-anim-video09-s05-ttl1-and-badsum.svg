<g><text class="cap" x="40" y="24">условия подделки на SYN с данными: оригинала нет, этот SYN единственный</text></g>
<g class="a video09-s05-ttl1-and-badsum-k1"><rect class="bx" x="40" y="38" width="200" height="40" rx="6"/><text class="smk c" x="140" y="63">оригинал SYN</text><path class="lr" d="M60 58L220 58"/><path class="lm" d="M246 58L291 58"/><polygon class="hm" points="300,58 291,62 291,54"/><rect class="bxb" x="306" y="38" width="330" height="40" rx="6"/><text class="smk c" x="471" y="63">SYN с данными = единственный SYN</text><text class="sm13" x="650" y="63">ударит по самому соединению</text></g>
<g class="a video09-s05-ttl1-and-badsum-k2"><rect class="bxbd" x="40" y="92" width="166" height="22" rx="4"/><text class="sm13k c amb ns" x="123" y="108">выдуманный пример</text><text class="sm13 mu" x="218" y="108">гонец с одним письмом «алло»: марка просрочена, письмо не доедет, второго «алло» нет</text></g>
<g class="a video09-s05-ttl1-and-badsum-k3"><text class="cdh" x="40" y="150">syndata:ip_ttl=1</text><text class="smk c" x="580" y="150">c0</text><text class="smk c" x="660" y="150">r0</text><text class="smk c" x="740" y="150">r1</text><text class="smk c" x="820" y="150">s0</text><path class="lm" d="M40 158L920 158"/></g>
<g class="a video09-s05-ttl1-and-badsum-k4"><text class="sm" x="48" y="185">SYN · данных 16 · TTL 1</text><text class="sm13k" x="440" y="185">0,00 мс</text><circle class="dotb" cx="580" cy="180" r="6.5"/><circle class="dotb" cx="660" cy="180" r="6.5"/><circle class="dote" cx="740" cy="180" r="6"/><circle class="dote" cx="820" cy="180" r="6"/></g>
<g class="a video09-s05-ttl1-and-badsum-k5"><text class="sm" x="48" y="211">обломок · протокол 255 · TTL 1</text><text class="sm13k" x="440" y="211">0,15 мс</text><circle class="dotr" cx="580" cy="206" r="6.5"/><circle class="dotr" cx="660" cy="206" r="6.5"/><circle class="dote" cx="740" cy="206" r="6"/><circle class="dote" cx="820" cy="206" r="6"/></g>
<g class="a video09-s05-ttl1-and-badsum-k6"><text class="sm" x="48" y="237">ICMP тип 11: роутер сообщает клиенту</text><text class="sm13k" x="440" y="237">5,11 мс</text><circle class="dot" cx="580" cy="232" r="6.5"/><circle class="dot" cx="660" cy="232" r="6.5"/><circle class="dote" cx="740" cy="232" r="6"/><circle class="dote" cx="820" cy="232" r="6"/></g>
<g class="a video09-s05-ttl1-and-badsum-k7"><rect class="bxr" x="40" y="252" width="430" height="34" rx="6"/><text class="smk rej" x="52" y="274">клиент: [Errno 113] No route to host, сразу</text><rect class="bxr" x="490" y="252" width="430" height="34" rx="6"/><text class="smk rej" x="502" y="274">сервер: ни одного пакета (r1 и s0 пусто)</text><text class="sm13 mu" x="40" y="306">в лаборатории нет правила, которое выбрасывало бы такие сообщения роутера;</text><text class="sm13 mu" x="40" y="324">что было бы с правилом из примера настроек проекта, мы не проверяли</text></g>
<g class="a video09-s05-ttl1-and-badsum-k8 tr"><text class="tk" x="40" y="350">проверь себя: дойдёт ли SYN с испорченной суммой до сервера, будет ли соединение?</text><rect class="bxd" x="40" y="364" width="880" height="70" rx="8"/><text class="big c" x="480" y="408">?</text></g>
<g class="a video09-s05-ttl1-and-badsum-k9"><text class="cdh" x="40" y="350">syndata:badsum</text><text class="smk c" x="580" y="350">c0</text><text class="smk c" x="660" y="350">r0</text><text class="smk c" x="740" y="350">r1</text><text class="smk c" x="820" y="350">s0</text><path class="lm" d="M40 358L920 358"/></g>
<g class="a video09-s05-ttl1-and-badsum-k10"><text class="sm" x="48" y="385">SYN · данных 16 · сумма TCP неверна</text><text class="sm13k" x="440" y="385">0,00 мс</text><circle class="dotb" cx="580" cy="380" r="6.5"/><circle class="dotb" cx="660" cy="380" r="6.5"/><circle class="dotb" cx="740" cy="380" r="6.5"/><circle class="dotb" cx="820" cy="380" r="6.5"/></g>
<g class="a video09-s05-ttl1-and-badsum-k11"><text class="sm" x="48" y="411">обломок · протокол 255 · TTL 1</text><text class="sm13k" x="440" y="411">0,05 мс</text><circle class="dotr" cx="580" cy="406" r="6.5"/><circle class="dotr" cx="660" cy="406" r="6.5"/><circle class="dote" cx="740" cy="406" r="6"/><circle class="dote" cx="820" cy="406" r="6"/></g>
<g class="a video09-s05-ttl1-and-badsum-k12"><text class="sm" x="48" y="437">повтор SYN, та же неверная сумма</text><text class="sm13k" x="440" y="437">1004,5 мс</text><circle class="dotb" cx="580" cy="432" r="6.5"/><circle class="dotb" cx="660" cy="432" r="6.5"/><circle class="dotb" cx="740" cy="432" r="6.5"/><circle class="dotb" cx="820" cy="432" r="6.5"/></g>
<g class="a video09-s05-ttl1-and-badsum-k13"><text class="sm" x="48" y="463">повтор SYN</text><text class="sm13k" x="440" y="463">2028,0 мс</text><circle class="dotb" cx="580" cy="458" r="6.5"/><circle class="dotb" cx="660" cy="458" r="6.5"/><circle class="dotb" cx="740" cy="458" r="6.5"/><circle class="dotb" cx="820" cy="458" r="6.5"/></g>
<g class="a video09-s05-ttl1-and-badsum-k14"><text class="sm" x="48" y="489">повтор SYN</text><text class="sm13k" x="440" y="489">3052,1 мс</text><circle class="dotb" cx="580" cy="484" r="6.5"/><circle class="dotb" cx="660" cy="484" r="6.5"/><circle class="dotb" cx="740" cy="484" r="6.5"/><circle class="dotb" cx="820" cy="484" r="6.5"/></g>
<g class="a video09-s05-ttl1-and-badsum-k15"><rect class="bxr" x="40" y="520" width="430" height="34" rx="6"/><text class="smk rej" x="52" y="542">клиент: завершился по таймауту</text><rect class="bxr" x="490" y="520" width="430" height="34" rx="6"/><text class="smk rej" x="502" y="542">сервер: 4 SYN на карте, ответов ноль</text></g>
<g class="a video09-s05-ttl1-and-badsum-k16"><text class="tk" x="40" y="584">сервер молчит: сумма неверна, настоящего SYN в сети нет вообще</text><text class="sm13 mu" x="40" y="606">клиент повторяет SYN примерно раз в секунду, и каждый повтор программа снова заменяет таким же испорченным</text></g>
</svg>
