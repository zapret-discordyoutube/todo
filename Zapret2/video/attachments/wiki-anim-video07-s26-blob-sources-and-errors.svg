<title id="v07-s26-blob-sources-and-errors-t">Источники блоба и ошибки</title>
<desc id="v07-s26-blob-sources-and-errors-d">Блоб для fake берётся из четырёх источников, встроенного, файла в 517 байт, записи 0x в строке на 10 байт и строки Lua на 13 байт, и ищется по порядку 0x, поле desync, глобальная переменная, затем ошибка blob unavailable, при этом повторное имя fake_default_tls не даёт программе запуститься, а ошибки без blob и с неизвестным именем, даже с флагом optional, оставляют серверу 0 байт, потому что игрушка блокирует целое приветствие.</desc>
