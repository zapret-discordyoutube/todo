<svg xmlns="http://www.w3.org/2000/svg" class="v05-s09-five-passes" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v05-s09-five-passes-t v05-s09-five-passes-d">
<title id="v05-s09-five-passes-t">Пять проходов цикла по частям</title>
<desc id="v05-s09-five-passes-d">Пять проходов цикла на нашем приветствии в 250 байт со списком меток 2,host,midsld,endhost: Си считает с нуля 2, 97, 104, 112, Lua получает 3, 98, 105, 113, четыре разреза дают пять частей и пять проходов; проход 0 начинается с 1 и кончается на 3 минус 1 равно 2 (2 байта), проход 1 с 3 до 97 (95 байт), проход 2 с 98 до 104 (7 байт, www.exa), проход 3 с 105 до 112 (8 байт, mple.com), проход 4 с 113 до длины данных 250 (138 байт), а сумма 2 плюс 95 плюс 7 плюс 8 плюс 138 равна 250.</desc>
