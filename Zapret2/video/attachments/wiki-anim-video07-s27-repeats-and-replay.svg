<title id="v07-s27-repeats-and-replay-t">Повторы и проигранное заново приветствие</title>
<desc id="v07-s27-repeats-and-replay-d">Повторы и длинное приветствие: при repeats=3 одна запись журнала даёт на проводе три побайтно одинаковых подделки по 680 байт с одним id 58426 и одной подписью MD5 и затем настоящие 250 байт, а настоящее приветствие в 1484 байта программа задерживает и проигрывает заново двумя кусками 1448 и 36, при этом подделка в 680 байт с флагом ACK встаёт только перед первым куском, на втором функция пишет, что не действует.</desc>
