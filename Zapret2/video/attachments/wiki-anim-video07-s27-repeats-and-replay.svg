<g><text class="cap" x="40" y="26">повторы и приветствие длиннее пакета</text></g>
<g class="a e1"><text class="tk sm" x="40" y="58">в нашем тесте, repeats=3: одна строка в журнале, на проводе четыре пакета</text></g>
<g class="a e2"><text class="mn" x="40" y="80">rawsend_dissect repeats=3 size=752</text></g>
<g class="a e3"><rect class="bxb" x="40" y="94" width="136" height="30" rx="3"/><text class="mk c" x="108" y="114">680</text><rect class="bxb" x="184" y="94" width="136" height="30" rx="3"/><text class="mk c" x="252" y="114">680</text><rect class="bxb" x="328" y="94" width="136" height="30" rx="3"/><text class="mk c" x="396" y="114">680</text><rect class="bxa" x="472" y="94" width="50" height="30" rx="3"/><text class="mk c" x="497" y="114">250</text></g>
<g class="a e4"><text class="sm" x="40" y="146">три побайтно одинаковых: номер 1, ip id 58426, одна подпись MD5(fd4f59cd…)</text><text class="sm mu" x="472" y="164">настоящее: id 58426</text></g>
<g class="a e5"><text class="tk sm" x="40" y="208">в нашем тесте: приветствие 1484 байта, два сегмента, задержаны и проиграны заново</text></g>
<g class="a e6"><rect class="bxs" x="40" y="220" width="880" height="30" rx="4"/><text class="mn" x="52" y="240">DELAY desync until reasm is complete</text><text class="sm" x="410" y="240">проигрыш: на первом куске fake действует, на втором нет</text></g>
<g class="a e7"><rect class="bxb" x="40" y="270" width="244.8" height="32" rx="3"/><text class="mk c" x="162.4" y="291">680</text><rect class="bxa" x="292.8" y="270" width="521.3" height="32" rx="3"/><text class="mk c" x="553.4" y="291">1448</text><rect class="bxa" x="822.1" y="270" width="13" height="32" rx="3"/></g>
<g class="a e8"><text class="sm amb" x="40" y="324">подделка, флаг A</text><text class="sm mu" x="40" y="342">номер 1, id 6942, MD5, заголовок 52</text></g>
<g class="a e9"><text class="sm" x="352.8" y="324">кусок 1: номер 1, ip id 6942</text><text class="sm mu" x="352.8" y="342">флаг A, заголовок 32</text></g>
<g class="a e10"><text class="sm r" x="920" y="324">кусок 2: номер 1449, 36 байт</text><text class="sm mu r" x="920" y="342">флаги AP, ip id 6943</text><path class="lm" d="M828.6 304L828.6 314"/></g>
<g class="a e11"><rect class="bx" x="40" y="362" width="430" height="58" rx="5"/><text class="sm" x="52" y="382">у подделки нет PSH: она копирует флаги</text><text class="sm" x="52" y="402">первого куска, а у него PSH нет</text><rect class="bxo" x="490" y="362" width="430" height="58" rx="5"/><text class="tk sm ok" x="502" y="382">сервер: 1484 чистых байта, кусками</text><text class="tk sm ok" x="502" y="402">1448 и 36</text></g>
<g class="a e12"><text class="mn" x="40" y="444">на втором куске в журнале: fake: not acting on further replay pieces</text><text class="mn mu" x="40" y="466">antidpi.lua:453 replay_first, 469-471; lib:1361-1364</text><text class="sm" x="40" y="488">подделка по размеру не подгоняется под то, что изображает: 680 против 1448</text></g>
<g class="a e13"><text class="cap" x="40" y="522">проверь себя: заготовка 1500 байт, из условий только ip_ttl=1</text></g>
<g class="a e14"><rect class="bxb" x="40" y="532" width="440" height="76" rx="5"/><text class="tk sm" x="52" y="554">пакетов два: 1448 и 52</text><text class="mk" x="52" y="576">1500 − 1448 = 52</text><text class="sm" x="52" y="598">в заголовке только время: 12 байт опций</text><rect class="bxs" x="490" y="532" width="430" height="76" rx="5"/><text class="sm" x="502" y="558">срок жизни опций TCP не добавляет</text><text class="sm mu" x="502" y="580">счёт по коду и прогону функций,</text><text class="sm mu" x="502" y="598">живой запуск мы не делали</text></g>
