<rect class="bg" x="0" y="0" width="960" height="520"/>
<g class="a e1"><text class="cap" x="10" y="22">один аргумент записан дважды</text></g>
<g class="a e2"><rect class="bxa" x="10" y="36" width="330" height="36" rx="6"/><text class="mk" x="24" y="60">--lua-desync=pass:a=1:a=2:a=3</text></g>
<g class="a e3"><text class="tk" x="10" y="102">1. добавление в список</text><text class="sm mu" x="10" y="122">pools.c:209-215: новый аргумент встаёт в начало</text></g>
<g class="a e4"><text class="sm mu" x="10" y="153">после a=1</text><rect class="bxb" x="110" y="134" width="50" height="26" rx="5"/><text class="mk c" x="135" y="153">a=1</text></g>
<g class="a e5"><text class="sm mu" x="10" y="187">после a=2</text><rect class="bxb" x="110" y="168" width="50" height="26" rx="5"/><text class="mk c" x="135" y="187">a=2</text><rect class="bx" x="168" y="168" width="50" height="26" rx="5"/><text class="mk c" x="193" y="187">a=1</text></g>
<g class="a e6"><text class="sm mu" x="10" y="221">после a=3</text><rect class="bxb" x="110" y="202" width="50" height="26" rx="5"/><text class="mk c" x="135" y="221">a=3</text><rect class="bx" x="168" y="202" width="50" height="26" rx="5"/><text class="mk c" x="193" y="221">a=2</text><rect class="bx" x="226" y="202" width="50" height="26" rx="5"/><text class="mk c" x="251" y="221">a=1</text></g>
<g class="a e7"><text class="sm" x="10" y="258">режим разбора печатает список развёрнутым:</text><text class="mk" x="10" y="280">pass(a=&quot;3&quot;,a=&quot;2&quot;,a=&quot;1&quot; …)</text></g>
<g class="a e8"><text class="tk" x="10" y="312">2. запись в таблицу для Lua</text><text class="sm mu" x="10" y="332">lua.c:1805: идём с начала списка, пишем по имени</text></g>
<g class="a e9"><rect class="bx" x="10" y="346" width="100" height="30" rx="6"/><text class="mk c" x="60" y="367">a ← &quot;3&quot;</text><path class="lm" d="M112 361L114.0 361.0"/><polygon class="hm" points="124,361 114.0,366.0 114.0,356.0"/></g>
<g class="a e10"><rect class="bx" x="126" y="346" width="100" height="30" rx="6"/><text class="mk c" x="176" y="367">a ← &quot;2&quot;</text><path class="lm" d="M228 361L230.0 361.0"/><polygon class="hm" points="240,361 230.0,366.0 230.0,356.0"/></g>
<g class="a e11"><rect class="bx" x="242" y="346" width="100" height="30" rx="6"/><text class="mk c" x="292" y="367">a ← &quot;1&quot;</text></g>
<g class="a e12"><path class="lf" d="M344 361L356.0 361.0"/><polygon class="hf" points="366,361 356.0,366.0 356.0,356.0"/><rect class="bxo" x="368" y="346" width="102" height="30" rx="6"/><text class="mk c ok" x="419" y="367">a = &quot;1&quot;</text></g>
<g class="a e13"><text class="sm" x="10" y="402">каждая запись затирает прежнюю: остаётся записанное</text><text class="sm" x="10" y="422">последним, то есть стоявшее в команде первым</text></g>
<g class="a e14"><text class="tk" x="500" y="56">опыт: multisplit получил pos дважды</text></g>
<g class="a e15"><rect class="bx" x="500" y="70" width="450" height="112" rx="8"/><text class="mk" x="512" y="94">multisplit:pos=2:pos=midsld</text><text class="m" x="512" y="116">LUA: multisplit: split pos: 2</text><rect class="bxa" x="512" y="128" width="3.4" height="26" rx="3"/><rect class="bxb" x="515.4" y="128" width="416.6" height="26" rx="3"/><text class="sm tk" x="512" y="172">2</text><text class="sm tk c" x="723.7" y="172">248</text></g>
<g class="a e16"><rect class="bx" x="500" y="196" width="450" height="112" rx="8"/><text class="mk" x="512" y="220">multisplit:pos=midsld:pos=2</text><text class="m" x="512" y="242">LUA: multisplit: split pos: midsld</text><rect class="bxa" x="512" y="254" width="174.7" height="26" rx="3"/><rect class="bxb" x="686.7" y="254" width="245.3" height="26" rx="3"/><text class="sm tk c" x="599.35" y="298">104</text><text class="sm tk c" x="809.35" y="298">146</text></g>
<g class="a e17"><text class="sm" x="500" y="334">первый опыт: сервер получил 2 + 248 = 250 байт</text><text class="sm" x="500" y="354">второй опыт: 104 + 146 = 250 байт, снова первый</text></g>
<g class="a e18"><rect class="bxb" x="500" y="372" width="450" height="52" rx="8"/><text class="sm" x="512" y="394">Особого правила «первый побеждает» в коде нет:</text><text class="sm" x="512" y="414">это следствие вставки в начало и записи по имени.</text></g>
<g class="a e19"><text class="sm amb" x="10" y="472">По общим сведениям, во многих программах побеждает последнее значение, а здесь наоборот.</text><text class="tk" x="10" y="500">Если аргумент записан дважды, побеждает написанный первым.</text></g>
</svg>
