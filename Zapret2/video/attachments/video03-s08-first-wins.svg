.v03-s08-first-wins .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v03-s08-first-wins .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v03-s08-first-wins .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
