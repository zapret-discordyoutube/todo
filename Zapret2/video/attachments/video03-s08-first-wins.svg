<svg xmlns="http://www.w3.org/2000/svg" class="v03-s08-first-wins" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="v03-s08-first-wins-t v03-s08-first-wins-d">
<title id="v03-s08-first-wins-t">Повторный аргумент: побеждает первый</title>
<desc id="v03-s08-first-wins-d">Если один аргумент записан дважды, побеждает записанный первым: список аргументов хранится развёрнутым (вставка в начало, nfq2/pools.c:213), а при записи в таблицу для Lua каждое значение затирает прежнее, поэтому из a=1:a=2:a=3 остаётся 1; в опыте multisplit с pos=2:pos=midsld разрезал запрос на 2 и 248 байт, а с pos=midsld:pos=2 на 104 и 146 байт.</desc>
<style>
.v03-s08-first-wins{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v03-s08-first-wins{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v03-s08-first-wins .bg{fill:var(--bg)}
.v03-s08-first-wins text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v03-s08-first-wins .tk{font-weight:600;fill:var(--fg)}
.v03-s08-first-wins .sm{font-size:14.5px}
.v03-s08-first-wins .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v03-s08-first-wins .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v03-s08-first-wins .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
