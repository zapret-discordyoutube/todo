.v03-s08-first-wins .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v03-s08-first-wins .mu{fill:var(--mute)}.v03-s08-first-wins .fg{fill:var(--fg)}.v03-s08-first-wins .acc{fill:var(--acc)}.v03-s08-first-wins .rej{fill:var(--rej)}.v03-s08-first-wins .ok{fill:var(--ok)}.v03-s08-first-wins .amb{fill:var(--amb)}
