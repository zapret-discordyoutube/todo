.v03-s08-first-wins .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v03-s08-first-wins .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s08-first-wins .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s08-first-wins .hf{fill:var(--fg2)}.v03-s08-first-wins .ha{fill:var(--acc)}.v03-s08-first-wins .hr{fill:var(--rej)}.v03-s08-first-wins .hm{fill:var(--mute)}.v03-s08-first-wins .hb{fill:var(--amb)}.v03-s08-first-wins .ho{fill:var(--ok)}
.v03-s08-first-wins .dot{fill:var(--mute);stroke:none}.v03-s08-first-wins .dota{fill:var(--acc);stroke:none}.v03-s08-first-wins .doto{fill:var(--ok);stroke:none}.v03-s08-first-wins .dotr{fill:var(--rej);stroke:none}
.v03-s08-first-wins .a{animation-duration:40s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
