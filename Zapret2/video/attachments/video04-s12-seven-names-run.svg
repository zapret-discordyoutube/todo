<title id="v04-s12-seven-names-run-t">Запуск с семью метками: восемь пакетов</title>
<desc id="v04-s12-seven-names-run-d">Второй настоящий запуск, все семь имён подряд: журнал записал 86 92 97 101 104 108 112 по возрастанию, и на проводе восемь пакетов по 86, 6, 5, 4, 3, 4, 4 и 138 байт, вместе 250. Середина разложена по четырём пакетам «www.», «exa», «mple» и «.com», а начало по границам полей: до длины расширений, длина расширений с заголовком имени, длина списка с типом и длиной имени.</desc>
