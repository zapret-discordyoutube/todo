<svg xmlns="http://www.w3.org/2000/svg" class="v16-s10-call-chain" viewBox="0 0 960 478" width="960" height="478" role="img" aria-labelledby="v16-s10-call-chain-t v16-s10-call-chain-d">
<title id="v16-s10-call-chain-t">Цепочка вызовов внутри программы</title>
<desc id="v16-s10-call-chain-d">Цепочка вызовов внутри nfqws2 в Linux. Один раз при запуске: main выбирает вариант цикла (nfqws.c:3380-3388; для BSD dvt_main и для Windows win_main, о них в конце выпуска), для Linux это nfq_main, главный цикл (nfqws.c:444), он один раз вызывает nfq_init, настройщика очереди (вызов nfqws.c:510). Дальше на каждый пакет: цикл читает сообщение ядра (recv, nfqws.c:566), отдаёт его библиотеке (nfq_handle_packet, nfqws.c:578), библиотека вызывает приёмщика nfq_cb (nfqws.c:285), тот зовёт проходную processPacketData (nfqws.c:154), проходная зовёт движок dpi_desync_packet (desync.c:2232), который запускает стратегии на Lua. Вердикт возвращается по той же цепочке к приёмщику, и он отдаёт его ядру вызовом nfq_set_verdict2 (nfqws.c:331, 334, 338).</desc>
