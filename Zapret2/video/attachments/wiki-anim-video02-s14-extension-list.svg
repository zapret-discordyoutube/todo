<g class="a e17"><rect class="bxo" x="654.1" y="138" width="242.7" height="38" rx="3"/><text class="mk c ns" x="775.9" y="162">10</text><rect class="bxo" x="10" y="444" width="10" height="18" rx="2"/><text class="mk r" x="52" y="458">10</text><text class="m" x="64" y="458">199..240</text><text class="m tk" x="150" y="458">key_share</text><text class="m r" x="374" y="458">38</text><text class="sm" x="396" y="458">доля ключа: группа 00 1d, длина 32, 32 байта</text></g>
<g class="a e18"><rect class="bxa" x="897.8" y="138" width="51.2" height="38" rx="3"/><text class="mk c ns" x="923.9" y="162">11</text><rect class="bxa" x="10" y="468" width="10" height="18" rx="2"/><text class="mk r" x="52" y="482">11</text><text class="m" x="64" y="482">241..249</text><text class="m" x="150" y="482">compress_certificate</text><text class="m r" x="374" y="482">5</text><text class="sm" x="396" y="482">умеет принимать сжатые сертификаты, два способа</text></g>
<g class="a e19"><text class="sm mu" x="10" y="508">жёлтое: имя сайта; зелёные три: на них особое внимание. «Длина» это длина данных без заголовка.</text></g>
