<rect class="bg" x="0" y="0" width="960" height="516"/>
<g class="a e1"><text class="cap" x="10" y="24">расширение: самостоятельный блок «тип, длина, данные»</text></g>
<g class="a e2"><rect class="bxa" x="10" y="36" width="170" height="40" rx="6"/><text class="tk c" x="95" y="61">тип · 2 байта</text></g>
<g class="a e3"><rect class="bxa" x="186" y="36" width="170" height="40" rx="6"/><text class="tk c" x="271" y="61">длина · 2 байта</text></g>
<g class="a e4"><rect class="bx" x="362" y="36" width="588" height="40" rx="6"/><text class="tk c" x="656" y="61">данные: столько байт, сколько сказано в длине</text></g>
<g class="a e5"><text class="sm" x="10" y="98">программа читает блоки по очереди: прочитала тип, прочитала длину, перепрыгнула на следующий</text></g>
<g class="a e6"><text class="cap" x="10" y="128">байты 88–249 по расширениям, номер в ленте = номер в списке</text><rect class="bx" x="10" y="138" width="940" height="38" rx="4"/><text class="ix" x="10" y="194">88</text><text class="ix r" x="950" y="194">249</text></g>
<g class="a e7"><text class="cap" x="10" y="222">смещения</text><text class="cap" x="146" y="222">расширение</text><text class="cap r" x="374" y="222">длина</text><text class="cap" x="396" y="222">что это</text></g>
<g class="a e8"><rect class="bxb" x="10.0" y="138" width="138.3" height="38" rx="3"/><text class="mk c ns" x="79.6" y="162">1</text><rect class="bxb" x="10" y="228" width="10" height="18" rx="2"/><text class="mk r" x="52" y="242">1</text><text class="m" x="64" y="242">88..111</text><text class="m tk" x="150" y="242">server_name</text><text class="m r" x="374" y="242">20</text><text class="sm" x="396" y="242">имя сайта (SNI): разберём в следующей сцене</text></g>
<g class="a e9"><rect class="bxa" x="149.3" y="138" width="45.4" height="38" rx="3"/><text class="mk c ns" x="172.5" y="162">2</text><rect class="bxa" x="10" y="252" width="10" height="18" rx="2"/><text class="mk r" x="52" y="266">2</text><text class="m" x="64" y="266">112..119</text><text class="m" x="150" y="266">ec_point_formats</text><text class="m r" x="374" y="266">4</text><text class="sm" x="396" y="266">форматы точек кривых для обмена ключами</text></g>
<g class="a e10"><rect class="fs" x="195.7" y="138" width="45.4" height="38" rx="3"/><text class="mk c ns" x="218.9" y="162">3</text><rect class="fs" x="10" y="276" width="10" height="18" rx="2"/><text class="mk r" x="52" y="290">3</text><text class="m" x="64" y="290">120..127</text><text class="m" x="150" y="290">supported_groups</text><text class="m r" x="374" y="290">4</text><text class="sm" x="396" y="290">группа 00 1d, одна</text></g>
