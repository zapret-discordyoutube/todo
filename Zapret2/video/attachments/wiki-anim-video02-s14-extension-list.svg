<g class="a e12"><rect class="fs" x="265.3" y="138" width="22.2" height="38" rx="3"/><text class="mk c ns" x="276.9" y="162">5</text><rect class="fs" x="10" y="324" width="10" height="18" rx="2"/><text class="mk r" x="52" y="338">5</text><text class="m" x="64" y="338">132..135</text><text class="m" x="150" y="338">encrypt_then_mac</text><text class="m r" x="374" y="338">0</text><text class="sm" x="396" y="338">пусто: «я это умею»</text></g>
<g class="a e13"><rect class="bxa" x="288.5" y="138" width="22.2" height="38" rx="3"/><text class="mk c ns" x="300.1" y="162">6</text><rect class="bxa" x="10" y="348" width="10" height="18" rx="2"/><text class="mk r" x="52" y="362">6</text><text class="m" x="64" y="362">136..139</text><text class="m" x="150" y="362">extended_master_secret</text><text class="m r" x="374" y="362">0</text><text class="sm" x="396" y="362">пусто: «я это умею»</text></g>
<g class="a e14"><rect class="fs" x="311.7" y="138" width="265.9" height="38" rx="3"/><text class="mk c ns" x="445.2" y="162">7</text><rect class="fs" x="10" y="372" width="10" height="18" rx="2"/><text class="mk r" x="52" y="386">7</text><text class="m" x="64" y="386">140..185</text><text class="m" x="150" y="386">signature_algorithms</text><text class="m r" x="374" y="386">42</text><text class="sm" x="396" y="386">список из 20 алгоритмов подписи</text></g>
