<svg xmlns="http://www.w3.org/2000/svg" class="v02-s14-extension-list" viewBox="0 0 960 516" width="960" height="516" role="img" aria-labelledby="v02-s14-extension-list-t v02-s14-extension-list-d">
<title id="v02-s14-extension-list-t">Одиннадцать расширений</title>
<desc id="v02-s14-extension-list-d">Расширение TLS это блок из двух байт типа, двух байт длины и данных такой длины; в нашем сообщении одиннадцать расширений в байтах 88–249 по порядку: server_name 88–111 (данные 20 байт), ec_point_formats 112–119 (4), supported_groups 120–127 (4), session_ticket 128–131 (0), encrypt_then_mac 132–135 (0), extended_master_secret 136–139 (0), signature_algorithms 140–185 (42), supported_versions 186–192 (3, данные 02 03 04, то есть TLS 1.3), psk_key_exchange_modes 193–198 (2), key_share 199–240 (38, группа 001d и 32 байта ключа) и compress_certificate 241–249 (5); первое из них, server_name, несёт имя сайта.</desc>
<style>.v02-s14-extension-list{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
