<svg xmlns="http://www.w3.org/2000/svg" class="v08-s22-pair-without-condition" viewBox="0 0 960 684" width="960" height="684" role="img" aria-labelledby="v08-s22-pair-without-condition-t v08-s22-pair-without-condition-d">
<title id="v08-s22-pair-without-condition-t">Пара без условия</title>
<desc id="v08-s22-pair-without-condition-d">Пара фейк и multisplit без условия: фейк в 680 байт с номером 1 без опции MD5 для сервера обычный пакет, он отвечает жду байт 681, то есть первые 680 байт у него есть, и отправляет свой короткий ответ в 14 байт, затем приходят три настоящие части в 1, 103 и 146 байт, и на каждую сервер снова отвечает жду байт 681, клиент отправил только 250 байт, его следующий байт 251, и он по-прежнему ждёт байт 1, ответ сервера не принимает, поэтому приветствие повторяется шесть кругов, а приложение сервера получило 680 байт фейкового приветствия с именем другого сайта, и у клиента нет ответа на приветствие.</desc>
