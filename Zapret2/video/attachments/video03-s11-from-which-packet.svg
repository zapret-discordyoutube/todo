<title id="v03-s11-from-which-packet-t">С какого пакета профиль видит соединение</title>
<desc id="v03-s11-from-which-packet-d">С какого пакета профиль видит соединение: список адресов 10.2.0.0/24 проверяет первые 24 бита адреса сервера 10.2.0.2 и подходит уже на SYN (в файле самописца 11 пакетов, первый в 60 байт), а список имён ждёт приветствия, где появляется имя (в файле 10 пакетов, первый в 302 байта, трёх пакетов рукопожатия нет), и до этого пакеты получает пустой профиль no_action.</desc>
