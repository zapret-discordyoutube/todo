<svg xmlns="http://www.w3.org/2000/svg" class="video09-s03-syndata-wire-ladder" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="video09-s03-syndata-wire-ladder-t video09-s03-syndata-wire-ladder-d">
<title id="video09-s03-syndata-wire-ladder-t">SYN с шестнадцатью байтами на проводе</title>
<desc id="video09-s03-syndata-wire-ladder-d">В нашем тесте стратегия syndata кладёт в SYN шестнадцать нулевых байт и заменяет оригинал обломком с номером протокола 255 и сроком жизни 1, который виден только на клиенте и на входе в роутер, сервер отвечает SYN-ACK с подтверждением 1, то есть принимает один SYN без данных, и приветствие в 250 байт идёт с номера 1 и доходит одним чтением.</desc>
