<g class="a video09-s03-syndata-wire-ladder-k9"><text class="cap" x="40" y="484">обломок: байты пакета номер 2 из лаборатории</text><text class="sm13k" x="40" y="508">заголовок IP, 20 байт</text><text class="sm13k" x="560" y="508">дальше: заголовок TCP как у настоящего SYN</text><text class="hx" x="40" y="532">45</text><text class="hx" x="63.5" y="532">00</text><text class="hx" x="87" y="532">00</text><text class="hx" x="110.5" y="532">3c</text><text class="hx" x="134" y="532">e8</text><text class="hx" x="157.5" y="532">41</text><text class="hx" x="181" y="532">40</text><text class="hx" x="204.5" y="532">00</text><rect class="fb" x="226" y="518" width="22" height="19"/><text class="hx amb" x="228" y="532">01</text><rect class="fb" x="249.5" y="518" width="22" height="19"/><text class="hx amb" x="251.5" y="532">ff</text><rect class="fr" x="273" y="518" width="22" height="19"/><text class="hx rej" x="275" y="532">3e</text><rect class="fr" x="296.5" y="518" width="22" height="19"/><text class="hx rej" x="298.5" y="532">75</text><text class="hx" x="322" y="532">0a</text><text class="hx" x="345.5" y="532">01</text><text class="hx" x="369" y="532">00</text><text class="hx" x="392.5" y="532">01</text><text class="hx" x="416" y="532">0a</text><text class="hx" x="439.5" y="532">02</text><text class="hx" x="463" y="532">00</text><text class="hx" x="486.5" y="532">02</text><text class="hx" x="560" y="532">dc</text><text class="hx" x="583.5" y="532">68</text><text class="hx" x="607" y="532">01</text><text class="hx" x="630.5" y="532">bb</text><text class="hx" x="654" y="532">1e</text><text class="hx" x="677.5" y="532">34</text><text class="hx" x="701" y="532">9f</text><text class="hx" x="724.5" y="532">bc</text><text class="hx" x="748" y="532">…</text></g>
<g class="a video09-s03-syndata-wire-ladder-k10"><text class="sm13k amb" x="40" y="556">срок жизни 01 и протокол ff (255); было 40 и 06, то есть 64 и 6</text><text class="sm13k rej" x="40" y="574">контрольная сумма IP неверна: 3e 75</text><text class="sm13 mu" x="560" y="556">dc68 порт клиента, 01bb порт сервера 443</text><text class="sm13 mu" x="560" y="574">меняется только номер протокола и срок жизни</text></g>
<g class="a video09-s03-syndata-wire-ladder-k11"><rect class="bxo" x="40" y="592" width="880" height="40" rx="8"/><text class="smk ok" x="54" y="610">приложение сервера: чтения [250], ответ SERVER-REPLY, принятые байты равны оригиналу</text><text class="sm13" x="54" y="626">сервер принял только SYN: подтверждение 1; шестнадцать байт в поток не попали</text></g>
