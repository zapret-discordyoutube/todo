<rect class="bg" x="0" y="0" width="960" height="478"/>
<g><text class="cap" x="40" y="26">Байт: одна ячейка, число от 0 до 255</text></g>
<g class="a e1"><rect class="bxa" x="40" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="60" y="78">0</text><rect class="bxa" x="84" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="104" y="78">1</text><rect class="bxa" x="128" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="148" y="78">1</text><rect class="bxa" x="172" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="192" y="78">1</text><rect class="bxb" x="230" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="250" y="78">0</text><rect class="bxb" x="274" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="294" y="78">1</text><rect class="bxb" x="318" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="338" y="78">1</text><rect class="bxb" x="362" y="48" width="40" height="44" rx="4"/><text class="ml c ns" x="382" y="78">1</text><text class="sm mu" x="40" y="114">8 битов, каждый 0 или 1</text></g>
<g class="a e2"><path class="lf" d="M126 120L126.0 140.0"/><polygon class="hf" points="126,150 121.0,140.0 131.0,140.0"/><path class="lf" d="M316 120L316.0 140.0"/><polygon class="hf" points="316,150 311.0,140.0 321.0,140.0"/><rect class="bxa" x="76" y="154" width="100" height="44" rx="4"/><text class="big c ns" x="126" y="184">7</text><rect class="bxb" x="266" y="154" width="100" height="44" rx="4"/><text class="big c ns" x="316" y="184">7</text><text class="sm mu c" x="221" y="222">каждые полбайта = одна цифра</text></g>
<g class="a e3"><text class="big c ns" x="470" y="80">=</text><rect class="bxn" x="500" y="48" width="110" height="44" rx="6"/><text class="big c ns" x="555" y="80">77</text><text class="sm" x="626" y="77">так записана буква w</text></g>
<g class="a e4"><text class="big c ns" x="470" y="184">=</text><text class="mk" x="500" y="183">7 × 16 + 7 = 119</text><text class="sm mu" x="500" y="206">то же число в обычной записи: 119</text></g>
<g class="a e5"><text class="cap" x="40" y="262">Шестнадцать цифр: 0-9 и ещё шесть букв</text></g>
<g class="a e6"><rect class="bx" x="40" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="65" y="304">0</text><text class="sm mu c ns" x="65" y="330">0</text><rect class="bx" x="95" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="120" y="304">1</text><text class="sm mu c ns" x="120" y="330">1</text><rect class="bx" x="150" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="175" y="304">2</text><text class="sm mu c ns" x="175" y="330">2</text><rect class="bx" x="205" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="230" y="304">3</text><text class="sm mu c ns" x="230" y="330">3</text><rect class="bx" x="260" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="285" y="304">4</text><text class="sm mu c ns" x="285" y="330">4</text><rect class="bx" x="315" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="340" y="304">5</text><text class="sm mu c ns" x="340" y="330">5</text><rect class="bx" x="370" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="395" y="304">6</text><text class="sm mu c ns" x="395" y="330">6</text><rect class="bx" x="425" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="450" y="304">7</text><text class="sm mu c ns" x="450" y="330">7</text><rect class="bx" x="480" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="505" y="304">8</text><text class="sm mu c ns" x="505" y="330">8</text><rect class="bx" x="535" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="560" y="304">9</text><text class="sm mu c ns" x="560" y="330">9</text><rect class="bxa" x="590" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="615" y="304">a</text><text class="sm mu c ns" x="615" y="330">10</text><rect class="bxa" x="645" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="670" y="304">b</text><text class="sm mu c ns" x="670" y="330">11</text><rect class="bxa" x="700" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="725" y="304">c</text><text class="sm mu c ns" x="725" y="330">12</text><rect class="bxa" x="755" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="780" y="304">d</text><text class="sm mu c ns" x="780" y="330">13</text><rect class="bxa" x="810" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="835" y="304">e</text><text class="sm mu c ns" x="835" y="330">14</text><rect class="bxa" x="865" y="274" width="50" height="66" rx="4"/><text class="big c ns" x="890" y="304">f</text><text class="sm mu c ns" x="890" y="330">15</text><text class="sm mu" x="40" y="362">верхняя цифра: как её пишут, нижняя: сколько она значит</text></g>
<g class="a e7"><text class="sm" x="40" y="398">Байт от 00 до ff: два знака, место на экране всегда одно и то же.</text></g>
<g class="a e8"><text class="tk sm" x="40" y="436">слово www</text><rect class="bxo" x="170" y="414" width="70" height="34" rx="4"/><text class="mk c ns" x="205" y="438">77</text><rect class="bxo" x="248" y="414" width="70" height="34" rx="4"/><text class="mk c ns" x="283" y="438">77</text><rect class="bxo" x="326" y="414" width="70" height="34" rx="4"/><text class="mk c ns" x="361" y="438">77</text><text class="sm" x="420" y="437">три байта подряд: по одной букве w на байт</text></g>
</svg>
