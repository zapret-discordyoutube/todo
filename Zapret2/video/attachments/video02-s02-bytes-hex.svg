<svg xmlns="http://www.w3.org/2000/svg" class="v02-s02-hex" viewBox="0 0 960 478" width="960" height="478" role="img" aria-labelledby="v02-s02-hex-t v02-s02-hex-d">
<title id="v02-s02-hex-t">Байт и шестнадцатеричная запись</title>
<desc id="v02-s02-hex-d">Байт это одна ячейка из восьми битов, число от 0 до 255; на экране его пишут двумя шестнадцатеричными цифрами: цифры 0-9 и буквы a-f (a=10, b=11, c=12, d=13, e=14, f=15). Пример: буква w это байт 0111 0111, то есть 77 в шестнадцатеричной записи, 7 × 16 + 7 = 119; слово www в пакете записано как 77 77 77.</desc>
<style>.v02-s02-hex{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s02-hex{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v02-s02-hex .bg{fill:var(--bg)}
.v02-s02-hex text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v02-s02-hex .tk{font-weight:600;fill:var(--fg)}
.v02-s02-hex .sm{font-size:14.5px}
.v02-s02-hex .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v02-s02-hex .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v02-s02-hex .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v02-s02-hex .ix{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--mute);stroke:none}
.v02-s02-hex .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v02-s02-hex .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s02-hex .mu{fill:var(--mute)}.v02-s02-hex .fg{fill:var(--fg)}.v02-s02-hex .acc{fill:var(--acc)}.v02-s02-hex .rej{fill:var(--rej)}.v02-s02-hex .ok{fill:var(--ok)}.v02-s02-hex .amb{fill:var(--amb)}
.v02-s02-hex .c{text-anchor:middle}.v02-s02-hex .r{text-anchor:end}.v02-s02-hex .ns{stroke:none}
.v02-s02-hex .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s02-hex .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v02-s02-hex .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v02-s02-hex .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v02-s02-hex .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v02-s02-hex .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v02-s02-hex .pl{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.v02-s02-hex .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
.v02-s02-hex .bxg{fill:var(--mute);fill-opacity:.2;stroke:var(--mute);stroke-width:1.4}
.v02-s02-hex .big{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:22px;font-weight:600;fill:var(--fg)}
.v02-s02-hex .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v02-s02-hex .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v02-s02-hex .fa{fill:var(--tint);stroke:none}.v02-s02-hex .fr{fill:var(--rejt);stroke:none}.v02-s02-hex .fb{fill:var(--ambt);stroke:none}.v02-s02-hex .fo{fill:var(--okt);stroke:none}
.v02-s02-hex .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s02-hex .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s02-hex .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s02-hex .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s02-hex .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s02-hex .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v02-s02-hex .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v02-s02-hex .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s02-hex .hf{fill:var(--fg2)}.v02-s02-hex .ha{fill:var(--acc)}.v02-s02-hex .hr{fill:var(--rej)}.v02-s02-hex .hm{fill:var(--mute)}.v02-s02-hex .hb{fill:var(--amb)}
.v02-s02-hex .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v02-s02-hex .a{animation-duration:26s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s02-hex .a{animation:none}.v02-s02-hex .tr{display:none}}
