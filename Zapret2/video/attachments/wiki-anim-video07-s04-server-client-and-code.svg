<svg xmlns="http://www.w3.org/2000/svg" class="video07-s04-server-client-and-code" viewBox="0 0 960 744" width="960" height="744" role="img" aria-labelledby="video07-s04-server-client-and-code-t video07-s04-server-client-and-code-d">
<title id="video07-s04-server-client-and-code-t">Взгляд сервера и клиента</title>
<desc id="video07-s04-server-client-and-code-d">Чем кончается фейк без условий: сервер принимает подделку за данные и подтверждает 681, то есть принято 680 байт, а клиент отправил только 250 и отвечает пустыми пакетами с номером 251 и подтверждением 1, так что ответа сервера он не получает, перед каждым из шести повторов приветствия встаёт своя подделка с ip id 191, 193, 194, 195, 197 и 199, а в коде фейк кончается без возврата, и программа читает это как пропустить, тогда как multisplit возвращала выбросить.</desc>
