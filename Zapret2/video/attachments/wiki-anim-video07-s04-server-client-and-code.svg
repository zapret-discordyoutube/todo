<g><text class="cap" x="40" y="24">в нашем тесте: что видят сервер и клиент</text></g>
<g class="a e1"><rect class="bxs" x="40" y="36" width="430" height="30" rx="8"/><text class="smk c" x="255" y="57">сервер, точка s0</text><rect class="bxs" x="490" y="36" width="430" height="30" rx="8"/><text class="smk c" x="705" y="57">клиент, точка c0</text></g>
<g class="a e2"><rect class="bx" x="40" y="78" width="430" height="44" rx="6"/><text class="smk" x="52" y="98">подтверждение после подделки: 681</text><text class="sm mu" x="52" y="116">то есть жду 681-й байт</text></g>
<g class="a e3"><rect class="bx" x="490" y="78" width="430" height="44" rx="6"/><text class="smk" x="502" y="106">отправил 250 байт, следующий номер 251</text></g>
<g class="a e4"><rect class="bx" x="40" y="130" width="430" height="44" rx="6"/><text class="smk" x="52" y="158">ответ в 14 байт, подтверждение всё ещё 681</text></g>
<g class="a e5"><rect class="bxr" x="490" y="130" width="430" height="44" rx="6"/><text class="smk" x="502" y="150">получил подтверждение 681</text><text class="sm mu" x="502" y="168">данных, которых не отправлял</text></g>
<g class="a e6"><rect class="bx" x="40" y="182" width="430" height="44" rx="6"/><text class="smk" x="52" y="202">после настоящего: 681 и SACK [1,251)</text><text class="sm mu" x="52" y="220">блок ниже подтверждения: это дубликат</text></g>
<g class="a e7"><rect class="bx" x="490" y="182" width="430" height="44" rx="6"/><text class="smk" x="502" y="202">пустые пакеты: номер 251, подтверждение 1</text><text class="sm mu" x="502" y="220">байты ответа сервера не приняты</text></g>
<g class="a e8"><rect class="bxr" x="40" y="234" width="430" height="44" rx="6"/><text class="smk" x="52" y="254">приложение: один кусок, 680 байт</text><text class="sm mu" x="52" y="272">в нём имя www.microsoft.com</text></g>
<g class="a e9"><rect class="bx" x="490" y="234" width="430" height="44" rx="6"/><text class="smk" x="502" y="254">ответ в 14 байт повторяется, ответа нет</text><text class="sm mu" x="502" y="272">тишина 4 секунды</text></g>
<g class="a e10"><text class="m" x="40" y="300">ядро клиента: TCPChallengeACK 5, TCPACKSkippedChallenge 20</text><text class="sm mu" x="40" y="320">читаем как «недопустимые подтверждения»: это наше прочтение названий</text></g>
<g><text class="cap" x="40" y="354">арифметика подтверждения</text></g>
<g class="a e11"><rect class="bx" x="40" y="366" width="280" height="50" rx="8"/><text class="smk c" x="180" y="389">сервер ждёт 681</text><text class="sm c" x="180" y="408">принял 681 − 1 = 680 байт</text><rect class="bxa" x="340" y="366" width="280" height="50" rx="8"/><text class="smk c" x="480" y="389">настоящих байт 250</text><text class="sm c" x="480" y="408">все принятые байты: подделка</text><rect class="bxo" x="640" y="366" width="280" height="50" rx="8"/><text class="smk c" x="780" y="389">без подделки ждал бы 251</text><text class="sm c" x="780" y="408">тогда 251 − 1 = 250</text></g>
<g><text class="cap" x="40" y="446">перед каждым из шести повторов приветствия своя подделка</text></g>
<g class="a e12"><rect class="bxb" x="40" y="460" width="74" height="28" rx="4"/><text class="sm tk c" x="77" y="479">680</text><rect class="bxa" x="118" y="460" width="40" height="28" rx="4"/><text class="sm tk c" x="138" y="479">250</text><text class="ix" x="40" y="512">ip id 191</text><rect class="bxb" x="190" y="460" width="74" height="28" rx="4"/><text class="sm tk c" x="227" y="479">680</text><rect class="bxa" x="268" y="460" width="40" height="28" rx="4"/><text class="sm tk c" x="288" y="479">250</text><text class="ix" x="190" y="512">ip id 193</text><rect class="bxb" x="340" y="460" width="74" height="28" rx="4"/><text class="sm tk c" x="377" y="479">680</text><rect class="bxa" x="418" y="460" width="40" height="28" rx="4"/><text class="sm tk c" x="438" y="479">250</text><text class="ix" x="340" y="512">ip id 194</text><rect class="bxb" x="490" y="460" width="74" height="28" rx="4"/><text class="sm tk c" x="527" y="479">680</text><rect class="bxa" x="568" y="460" width="40" height="28" rx="4"/><text class="sm tk c" x="588" y="479">250</text><text class="ix" x="490" y="512">ip id 195</text><rect class="bxb" x="640" y="460" width="74" height="28" rx="4"/><text class="sm tk c" x="677" y="479">680</text><rect class="bxa" x="718" y="460" width="40" height="28" rx="4"/><text class="sm tk c" x="738" y="479">250</text><text class="ix" x="640" y="512">ip id 197</text><rect class="bxb" x="790" y="460" width="74" height="28" rx="4"/><text class="sm tk c" x="827" y="479">680</text><rect class="bxa" x="868" y="460" width="40" height="28" rx="4"/><text class="sm tk c" x="888" y="479">250</text><text class="ix" x="790" y="512">ip id 199</text></g>
<g class="a e13"><text class="sm" x="40" y="540">везде номер 1; стратегия не помнит, что фейк уже был, и вызывается на каждом подходящем пакете</text></g>
<g class="a e14"><rect class="bxr" x="40" y="552" width="880" height="30" rx="6"/><text class="smk c" x="480" y="573">без игрушки тот же итог: сервер получил 680 байт, клиент молчит; беда не в инспекторе</text></g>
<g><text class="cap" x="40" y="612">в коде: почему настоящий пакет идёт следом</text></g>
<g class="a e15"><rect class="bx" x="40" y="626" width="880" height="98" rx="6"/><text class="ix" x="52" y="648">zapret-antidpi.lua:468</text><text class="cdh" x="250" y="648">rawsend_payload_segmented(desync,fake_payload)</text><text class="ix" x="52" y="670">zapret-antidpi.lua:473</text><text class="cd" x="250" y="670">end   -- конец fake, return нет</text><text class="ix" x="52" y="692">nfq2/desync.c:846</text><text class="cd" x="250" y="692">// absence of the return value or nil mean VERDICT_PASS</text><text class="ix" x="52" y="714">zapret-antidpi.lua:527</text><text class="cd" x="250" y="714">return desync.arg.nodrop and VERDICT_PASS or VERDICT_DROP  -- это multisplit</text></g>
</svg>
