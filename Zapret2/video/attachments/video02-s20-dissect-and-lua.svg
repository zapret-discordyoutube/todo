<svg xmlns="http://www.w3.org/2000/svg" class="v02-s20-dissect" viewBox="0 0 960 598" width="960" height="598" role="img" aria-labelledby="v02-s20-dissect-t v02-s20-dissect-d">
<title id="v02-s20-dissect-t">Как zapret2 разбирает пакет</title>
<desc id="v02-s20-dissect-d">Как zapret2 читает те же поля: функция proto_dissect_l3l4 (nfq2/darkmagic.c:554) разбирает пакет в 302 байта и заполняет структуру dissect (nfq2/darkmagic.h:191-208): заголовок IP (20 байт), заголовок TCP (32 байта) и данные (250 байт); в Lua-стратегиях пакет приходит таблицей с теми же числами (ip_ttl 64, th_flags 0x18, нагрузка 250 байт), опции TCP находит tcp_find_option (тип, длина, перепрыгнуть), а после изменений программа пересчитывает суммы функциями ip4_fix_checksum и tcp_fix_checksum (nfq2/checksum.c:109 и :133).</desc>
<style>.v02-s20-dissect{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s20-dissect{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v02-s20-dissect .bg{fill:var(--bg)}
.v02-s20-dissect text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v02-s20-dissect .tk{font-weight:600;fill:var(--fg)}
.v02-s20-dissect .sm{font-size:14.5px}
.v02-s20-dissect .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v02-s20-dissect .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v02-s20-dissect .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v02-s20-dissect .mt{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px}
.v02-s20-dissect .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v02-s20-dissect .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s20-dissect .mu{fill:var(--mute)}.v02-s20-dissect .fg{fill:var(--fg)}.v02-s20-dissect .acc{fill:var(--acc)}.v02-s20-dissect .rej{fill:var(--rej)}.v02-s20-dissect .ok{fill:var(--ok)}.v02-s20-dissect .amb{fill:var(--amb)}
