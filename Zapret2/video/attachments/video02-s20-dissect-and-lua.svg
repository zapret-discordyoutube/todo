.v02-s20-dissect .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s20-dissect .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s20-dissect .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s20-dissect .lad{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:5 4}
.v02-s20-dissect .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s20-dissect .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s20-dissect .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v02-s20-dissect .hf{fill:var(--fg2)}.v02-s20-dissect .ha{fill:var(--acc)}.v02-s20-dissect .hr{fill:var(--rej)}.v02-s20-dissect .hm{fill:var(--mute)}.v02-s20-dissect .ho{fill:var(--ok)}.v02-s20-dissect .hbm{fill:var(--amb)}
.v02-s20-dissect .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
