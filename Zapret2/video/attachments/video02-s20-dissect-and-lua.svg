.v02-s20-dissect .gz{transform-box:fill-box;transform-origin:0 50%}
.v02-s20-dissect .a{animation-duration:38s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s20-dissect .a{animation:none}.v02-s20-dissect .tr{display:none}}
