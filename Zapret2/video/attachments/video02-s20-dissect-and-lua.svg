.v02-s20-dissect .c{text-anchor:middle}.v02-s20-dissect .r{text-anchor:end}
.v02-s20-dissect .nos{stroke:none}
.v02-s20-dissect .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s20-dissect .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v02-s20-dissect .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
