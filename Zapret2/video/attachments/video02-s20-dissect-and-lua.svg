ssect .e11{animation-name:v02-s20-dissect-k11}@keyframes v02-s20-dissect-k12{0%{opacity:0}53.684%{opacity:0}54.868%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s20-dissect .e12{animation-name:v02-s20-dissect-k12}@keyframes v02-s20-dissect-k13{0%{opacity:0}62.105%{opacity:0}63.289%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s20-dissect .e13{animation-name:v02-s20-dissect-k13}@keyframes v02-s20-dissect-k14{0%{opacity:0}65.263%{opacity:0}66.447%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s20-dissect .e14{animation-name:v02-s20-dissect-k14}@keyframes v02-s20-dissect-k15{0%{opacity:0}68.421%{opacity:0}69.605%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s20-dissect .e15{animation-name:v02-s20-dissect-k15}@keyframes v02-s20-dissect-k16{0%{opacity:0}71.579%{opacity:0}72.763%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s20-dissect .e16{animation-name:v02-s20-dissect-k16}@keyframes v02-s20-dissect-k17{0%{opacity:0}74.737%{opacity:0}75.921%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s20-dissect .e17{animation-name:v02-s20-dissect-k17}@keyframes v02-s20-dissect-k18{0%{opacity:0}78.947%{opacity:0}80.132%{opacity:1}97.105%{opacity:1}98.684%{opacity:0}100%{opacity:0}}.v02-s20-dissect .e18{animation-name:v02-s20-dissect-k18}</style>
<rect class="bg" x="0" y="0" width="960" height="598"/>
<g class="a e1"><text class="cap" x="10" y="22">zapret2 читает те же поля, что мы разбирали вручную</text><rect class="bx" x="10" y="34" width="940" height="58" rx="8"/><text class="mk" x="26" y="58">proto_dissect_l3l4(data, len, &amp;dis, false)</text><text class="sm mu" x="26" y="80">nfq2/darkmagic.c:554; вызывается из nfq2/desync.c:2202 для каждого перехваченного пакета</text></g>
<g class="a e2"><text class="sm tk" x="10" y="114">входные байты: IP-пакет в 302 байта, длина берётся из самого заголовка IP</text><rect class="bxa" x="30" y="124" width="59.6" height="30" rx="3"/><text class="sm c" x="59.8" y="144">IP 20</text><rect class="bxb" x="89.6" y="124" width="95.4" height="30" rx="3"/><text class="sm c" x="137.3" y="144">TCP 32</text><rect class="bx" x="185" y="124" width="745" height="30" rx="3"/><text class="sm c mu" x="557.5" y="144">данные: 250 байт</text></g>
<g class="a e3"><path class="lm" d="M59.8 154L160 206"/><rect class="bxa" x="10" y="206" width="300" height="62" rx="7"/><text x="24" y="230"><tspan class="mk">dis.ip</tspan><tspan class="sm mu">  →  начало пакета</tspan></text><text class="sm m" x="24" y="254">len_l3 = 20</text></g>
<g class="a e4"><path class="lm" d="M137.3 154L480 206"/><rect class="bxb" x="330" y="206" width="300" height="62" rx="7"/><text x="344" y="230"><tspan class="mk">dis.tcp</tspan><tspan class="sm mu">  →  байт 20</tspan></text><text class="sm m" x="344" y="254">len_l4 = 32 (из поля длины)</text></g>
<g class="a e5"><path class="lm" d="M557.5 154L800 206"/><rect class="bx" x="650" y="206" width="300" height="62" rx="7"/><text x="664" y="230"><tspan class="mk">dis.data_payload</tspan><tspan class="sm mu">  →  байт 52</tspan></text><text class="sm m" x="664" y="254">len_payload = 250</text></g>
<g class="a e6"><text class="sm mu" x="10" y="292">struct dissect (nfq2/darkmagic.h:191-208): указатели и длины, которыми дальше пользуются все стадии</text></g>
<g class="a e7"><rect class="bx" x="10" y="316" width="460" height="150" rx="8"/><text class="tk sm" x="26" y="340">в Lua-стратегиях пакет приходит таблицей</text><text class="mt mu" x="26" y="456">nfq2/lua.c:1496, 1366, 1660</text></g>
<g class="a e8"><text class="mk" x="26" y="368">dis.ip.ip_ttl</text><text class="mk acc" x="250" y="368">= 64</text></g>
<g class="a e9"><text class="mk" x="26" y="389">dis.tcp.th_flags</text><text class="mk acc" x="250" y="389">= 0x18</text></g>
<g class="a e10"><text class="mk" x="26" y="410">dis.tcp.th_seq</text><text class="mk acc" x="250" y="410">= 3164320784</text></g>
<g class="a e11"><text class="mk" x="26" y="431">#dis.payload</text><text class="mk acc" x="250" y="431">= 250</text></g>
<g class="a e12"><rect class="bx" x="490" y="316" width="460" height="150" rx="8"/><text class="tk sm" x="506" y="340">tcp_find_option: идёт по опциям, как мы шли</text><text class="sm" x="506" y="358">по расширениям: тип, длина, перепрыгнуть</text><rect class="bxs" x="506" y="372" width="64" height="38" rx="5"/><text class="hx c" x="538" y="389">01</text><text class="mt c" x="538" y="405">NOP</text><rect class="bxs" x="578" y="372" width="64" height="38" rx="5"/><text class="hx c" x="610" y="389">01</text><text class="mt c" x="610" y="405">NOP</text><rect class="bxb" x="650" y="372" width="284" height="38" rx="5"/><text class="hx c" x="792" y="389">08 0a …</text><text class="mt c" x="792" y="405">метка времени, длина 10</text><text class="mt mu" x="506" y="456">nfq2/darkmagic.c:58; у нашего пакета 12 байт опций</text></g>
<g class="a e13"><text class="tk sm" x="10" y="486">если программа меняет пакет, она пересчитывает контрольные суммы</text></g>
<g class="a e14"><rect class="bxa" x="10" y="496" width="212" height="34" rx="6"/><text class="sm c" x="116" y="518">обнулить поле суммы</text></g>
<g class="a e15"><rect class="bxa" x="248" y="496" width="212" height="34" rx="6"/><text class="sm c" x="354" y="518">сложить 16-битные слова</text><path class="la" d="M223 513L236.0 513.0"/><polygon class="ha" points="246,513 236.0,518.0 236.0,508.0"/></g>
<g class="a e16"><rect class="bxa" x="486" y="496" width="212" height="34" rx="6"/><text class="sm c" x="592" y="518">добавить перенос</text><path class="la" d="M461 513L474.0 513.0"/><polygon class="ha" points="484,513 474.0,518.0 474.0,508.0"/></g>
<g class="a e17"><rect class="bxa" x="724" y="496" width="212" height="34" rx="6"/><text class="sm c" x="830" y="518">перевернуть биты</text><path class="la" d="M699 513L712.0 513.0"/><polygon class="ha" points="722,513 712.0,518.0 712.0,508.0"/></g>
<g class="a e18"><text class="sm" x="10" y="552"><tspan class="mk">ip4_fix_checksum</tspan><tspan> (nfq2/checksum.c:109): заголовок IP, 20 байт</tspan></text><text class="sm" x="10" y="574"><tspan class="mk">tcp_fix_checksum</tspan><tspan> (nfq2/checksum.c:133): то же плюс псевдозаголовок</tspan></text></g>
</svg>
