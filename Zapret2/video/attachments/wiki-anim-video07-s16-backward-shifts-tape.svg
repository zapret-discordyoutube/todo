<rect class="bg" x="0" y="0" width="960" height="640"/>
<g><text class="cap" x="40" y="26">третье условие: сдвиг порядкового номера, шаг назад (относительные номера)</text></g>
<g class="a e1"><text class="tk sm c" x="480.6" y="56">получатель ждёт номер 1</text><path class="lf" d="M480.6 62L480.6 70"/><polygon class="hf" points="480.6,80 475.6,70 485.6,70"/><path class="lm" d="M40 94L920 94"/><path class="lm" d="M40 90L40 98"/><text class="ix c" x="40" y="114">-700</text><path class="lm" d="M260 90L260 98"/><text class="ix c" x="260" y="114">-350</text><path class="lm" d="M700 90L700 98"/><text class="ix c" x="700" y="114">350</text><path class="lm" d="M920 90L920 98"/><text class="ix c" x="920" y="114">700</text><path class="lm" d="M480 90L480 98"/><text class="ix r" x="476" y="114">0</text></g>
<g class="a e2"><path class="lmd" d="M480.6 122L480.6 504"/></g>
<g class="a e3"><text class="tk sm" x="40" y="142">сдвиг -680</text><rect class="bxa" x="480.6" y="152" width="157.2" height="16" rx="4"/><text class="sm mu" x="645.8" y="165">настоящее 1…250</text></g>
<g class="a e4"><rect class="bxb" x="53.2" y="174" width="427.4" height="26" rx="4"/><text class="sm" x="63.2" y="193">подделка: -679…0, все байты старые</text></g>
<g class="a e5"><text class="tk sm ok" x="40" y="222">выброшена: ответ ACK 1 с блоком SACK на 680 байт, TCPDSACKOldSent +1</text><text class="sm" x="40" y="241">приложение сервера: 250 байт, чисто</text></g>
<g class="a e6"><text class="tk sm" x="40" y="268">сдвиг -679</text><rect class="bxa" x="480.6" y="278" width="157.2" height="16" rx="4"/><text class="sm mu" x="645.8" y="291">настоящее 1…250</text></g>
<g class="a e7"><rect class="bxb" x="53.8" y="300" width="427.5" height="26" rx="4"/><text class="sm" x="63.8" y="319">подделка: -678…1</text></g>
<g class="a e8"><text class="tk sm amb" x="40" y="348">принят один байт, последний байт подделки лёг на байт 1: ответ ACK 2</text><text class="sm" x="40" y="367">сервер получил 250 байт, но первый чужой: имя сайта не найти</text></g>
<g class="a e9"><text class="tk sm" x="40" y="394">сдвиг -1</text><rect class="bxa" x="480.6" y="404" width="157.2" height="16" rx="4"/><text class="sm mu" x="645.8" y="417">настоящее 1…250</text></g>
<g class="a e10"><rect class="bxb" x="480" y="426" width="427.4" height="26" rx="4"/><text class="sm" x="490" y="445">подделка: 0…679</text></g>
<g class="a e11"><text class="tk sm rej" x="40" y="474">новых байтов 679 (номера 1…679): ответ ACK 680</text><text class="sm" x="40" y="493">сервер получил 679 чужих байт, клиент завис</text></g>
<g class="a e12"><text class="tk sm" x="40" y="530">правило нашего теста: подделка целиком в прошлом, сдвиг не больше минус её длины</text></g>
<g class="a e13"><text class="sm" x="40" y="552">для 680 байт это -680 и меньше; -10000 лежит с запасом и тоже работает</text></g>
<g class="a e14"><rect class="bxd" x="40" y="566" width="880" height="56" rx="8"/><text class="sm" x="54" y="589">проверь себя: подделка 300 байт: 1 + сдвиг + 299 не больше 0, значит -300 и меньше.</text><text class="sm mu" x="54" y="610">При -299 останется один новый байт. Это счёт по правилу, запуска не было.</text></g>
</svg>
