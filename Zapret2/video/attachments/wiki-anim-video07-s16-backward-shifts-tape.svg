<svg xmlns="http://www.w3.org/2000/svg" class="v07-s16-backward-shifts-tape" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v07-s16-backward-shifts-tape-t v07-s16-backward-shifts-tape-d">
<title id="v07-s16-backward-shifts-tape-t">Сдвиг номера назад на ленте номеров</title>
<desc id="v07-s16-backward-shifts-tape-d">Сдвиг порядкового номера назад на ленте относительных номеров: подделка в 680 байт при сдвиге -680 занимает номера от -679 до 0 и вся лежит в прошлом, получатель выбросил её и ответил блоком SACK на 680 байт, при -679 её последний байт попадает на ожидаемый байт 1 и получатель его принял, при -1 принято 679 новых байт и клиент завис, поэтому подделка должна лежать целиком в прошлом, то есть сдвиг не больше минус её длины.</desc>
<style>.v07-s16-backward-shifts-tape{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
