<svg xmlns="http://www.w3.org/2000/svg" class="v08-s25-toy-in-router" viewBox="0 0 960 730" width="960" height="730" role="img" aria-labelledby="v08-s25-toy-in-router-t v08-s25-toy-in-router-d">
<title id="v08-s25-toy-in-router-t">Игрушка в роутере выбрасывает пакеты</title>
<desc id="v08-s25-toy-in-router-d">Живая игрушка в роутере, которая найдя имя выбрасывает этот пакет и все следующие данные клиента, это модель проекта и в лаборатории нет настоящего ТСПУ: без стратегии пакетный находит имя на первом пакете и сервер получает ноль байт; с multisplit склейщик находит имя на втором пакете, и до сервера доходят 104 байта; с hostfakesplit пакетный находит настоящее имя на третьем пакете, пакеты в 15 и 138 байт выбрасываются, и сервер получает 97 байт; в паре фейк и multisplit последний записал останавливает соединение на четвёртом пакете, фейк в 680 байт сервер выбросил по MD5, поэтому сервер получает 1 плюс 103, то есть 104 байта.</desc>
