<rect class="bg" x="0" y="0" width="960" height="730"/>
<g><text class="cap" x="40" y="22">живая игрушка в роутере: кто на каком пакете остановил соединение</text></g>
<g class="a e1"><rect class="bxb" x="40" y="32" width="880" height="30" rx="8"/><text class="sm tk" x="54" y="52">модели проекта; в лаборатории нет настоящего ТСПУ</text></g>
<g class="a e2"><text class="sm mu" x="40" y="84">игрушка (выдуманный пример): вахтёр, найдя слово, выбрасывает письмо и все следующие</text></g>
<g class="a e3"><rect class="bx" x="40" y="98" width="130" height="56" rx="8"/><text class="sm tk c" x="105" y="124">клиент</text><text class="ix mu c" x="105" y="142">шлёт данные</text><rect class="bx" x="250" y="98" width="400" height="56" rx="8"/><text class="cap" x="262" y="114">роутер</text><rect class="bxb" x="330" y="120" width="300" height="28" rx="6"/><text class="sm tk c" x="480" y="139">наша игрушка: читатель на Lua</text><rect class="bx" x="730" y="98" width="190" height="56" rx="8"/><text class="sm tk c" x="825" y="124">сервер</text><text class="ix mu c" x="825" y="142">считаем байты</text><path class="lf" d="M170 126L240.0 126.0"/><polygon class="hf" points="250,126 240.0,131.0 240.0,121.0"/><path class="lf" d="M650 126L720.0 126.0"/><polygon class="hf" points="730,126 720.0,131.0 720.0,121.0"/></g>
<g class="a e4"><text class="sm" x="40" y="176">номер пакета: номер клиентского пакета с данными, который увидела игрушка</text><text class="sm mu" x="40" y="194">пакеты без данных, например подтверждения, не считаются</text></g>
<g class="a e5"><text class="sm tk" x="40" y="250">без стратегии</text><text class="ix mu" x="40" y="268">«пакетный»</text><text class="ix mu c" x="308" y="226">пакет 1</text><rect class="bxr" x="262" y="232" width="92" height="44" rx="6"/><text class="m fg c" x="308" y="251">R250@0</text><rect class="bxr" x="268" y="276" width="80" height="18" rx="4"/><text class="ix tk c rej" x="308" y="289">DROP</text></g>
<g class="a e6"><rect class="bxr" x="764" y="232" width="156" height="44" rx="6"/><text class="ix c" x="842" y="250">сервер получил</text><text class="sm tk c" x="842" y="268">0 байт</text></g>
<g class="a e7"><text class="sm tk" x="40" y="342">multisplit, midsld</text><text class="ix mu" x="40" y="360">«склейщик»</text><text class="ix mu c" x="308" y="318">пакет 1</text><rect class="bxa" x="262" y="324" width="92" height="44" rx="6"/><text class="m fg c" x="308" y="343">R104@0</text><text class="ix c fg" x="308" y="360">не собрано</text><text class="ix mu c" x="406" y="318">пакет 2</text><rect class="bxr" x="360" y="324" width="92" height="44" rx="6"/><text class="m fg c" x="406" y="343">R146@104</text><text class="ix c fg" x="406" y="360">имя найдено</text><rect class="bxr" x="366" y="368" width="80" height="18" rx="4"/><text class="ix tk c rej" x="406" y="381">DROP</text></g>
<g class="a e8"><rect class="bxr" x="764" y="324" width="156" height="44" rx="6"/><text class="ix c" x="842" y="342">сервер получил</text><text class="sm tk c" x="842" y="360">104 байта</text></g>
<g class="a e9"><text class="sm tk" x="40" y="434">hostfakesplit</text><text class="ix mu" x="40" y="452">«пакетный»</text><text class="ix mu c" x="308" y="410">пакет 1</text><rect class="bxa" x="262" y="416" width="92" height="44" rx="6"/><text class="m fg c" x="308" y="435">R97@0</text><text class="ix c fg" x="308" y="452">имени нет</text><text class="ix mu c" x="406" y="410">пакет 2</text><rect class="bxw" x="360" y="416" width="92" height="44" rx="6"/><text class="m fg c" x="406" y="435">F15@97m</text><text class="ix c fg" x="406" y="452">двойник</text><text class="ix mu c" x="504" y="410">пакет 3</text><rect class="bxr" x="458" y="416" width="92" height="44" rx="6"/><text class="m fg c" x="504" y="435">R15@97</text><text class="ix c fg" x="504" y="452">имя найдено</text><text class="ix mu c" x="602" y="410">пакет 4</text><rect class="bxd" x="556" y="416" width="92" height="44" rx="6"/><text class="m mu c" x="602" y="435">F15@97m</text><text class="ix c mu" x="602" y="452">выброшен</text><text class="ix mu c" x="700" y="410">пакет 5</text><rect class="bxd" x="654" y="416" width="92" height="44" rx="6"/><text class="m mu c" x="700" y="435">R138@112</text><text class="ix c mu" x="700" y="452">выброшен</text><rect class="bxr" x="464" y="460" width="80" height="18" rx="4"/><text class="ix tk c rej" x="504" y="473">DROP</text></g>
<g class="a e10"><rect class="bxr" x="764" y="416" width="156" height="44" rx="6"/><text class="ix c" x="842" y="434">сервер получил</text><text class="sm tk c" x="842" y="452">97 байт</text></g>
<g class="a e11"><text class="sm tk" x="40" y="526">fake + multisplit</text><text class="ix mu" x="40" y="544">«последний записал»</text><text class="ix mu c" x="308" y="502">пакет 1</text><rect class="bxw" x="262" y="508" width="92" height="44" rx="6"/><text class="m fg c" x="308" y="527">F680@0m</text><text class="ix c fg" x="308" y="544">фейк</text><text class="ix mu c" x="406" y="502">пакет 2</text><rect class="bxa" x="360" y="508" width="92" height="44" rx="6"/><text class="m fg c" x="406" y="527">R1@0</text><text class="ix c fg" x="406" y="544">настоящая</text><text class="ix mu c" x="504" y="502">пакет 3</text><rect class="bxa" x="458" y="508" width="92" height="44" rx="6"/><text class="m fg c" x="504" y="527">R103@1</text><text class="ix c fg" x="504" y="544">настоящая</text><text class="ix mu c" x="602" y="502">пакет 4</text><rect class="bxr" x="556" y="508" width="92" height="44" rx="6"/><text class="m fg c" x="602" y="527">R146@104</text><text class="ix c fg" x="602" y="544">имя найдено</text><rect class="bxr" x="562" y="552" width="80" height="18" rx="4"/><text class="ix tk c rej" x="602" y="565">DROP</text></g>
<g class="a e12"><rect class="bxr" x="764" y="508" width="156" height="44" rx="6"/><text class="ix c" x="842" y="526">сервер получил</text><text class="sm tk c" x="842" y="544">104 байта</text></g>
<g class="a e13"><text class="sm mu" x="262" y="588">фейк 680 сервер выбросил по MD5: 1 + 103</text></g>
<g class="a e14"><text class="cap" x="40" y="618">журнал игрушки (hostfakesplit, «пакетный»)</text><rect class="bx" x="40" y="626" width="880" height="74" rx="6"/><text class="ix fg" x="52" y="646">TOY mode=perpacket seq_off=97 len=15 host_found=false</text><text class="ix fg" x="52" y="666">TOY mode=perpacket seq_off=97 len=15 host_found=true</text><text class="ix rej" x="52" y="686">TOY host name seen: dropping this packet and all later client data of the connection</text></g>
</svg>
