<svg xmlns="http://www.w3.org/2000/svg" class="v02-s04-numbers" viewBox="0 0 960 576" width="960" height="576" role="img" aria-labelledby="v02-s04-numbers-t v02-s04-numbers-d">
<title id="v02-s04-numbers-t">Как читаются числа в заголовке IP</title>
<desc id="v02-s04-numbers-d">Как читаются числа заголовка IP: первый байт 45 это две цифры по полбайта, версия 4 и длина заголовка 5 × 4 = 20 байт; длина 01 2e = 1 × 256 + 46 = 302 = 20 + 32 + 250; идентификатор fa 05 = 250 × 256 + 5 = 64005, и пакеты клиента нумеруются подряд 64003 (SYN), 64004, 64005 (данные), 64006, 64007 (FIN), 64008; флаги и смещение 40 00 = 0100 0000 0000 0000, то есть резерв 0, DF 1, MF 0 и смещение 0: пакет делить на куски нельзя.</desc>
<style>.v02-s04-numbers{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s04-numbers{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v02-s04-numbers .bg{fill:var(--bg)}
.v02-s04-numbers text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v02-s04-numbers .tk{font-weight:600;fill:var(--fg)}
.v02-s04-numbers .sm{font-size:14.5px}
.v02-s04-numbers .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v02-s04-numbers .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v02-s04-numbers .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v02-s04-numbers .ix{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--mute);stroke:none}
.v02-s04-numbers .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v02-s04-numbers .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s04-numbers .mu{fill:var(--mute)}.v02-s04-numbers .fg{fill:var(--fg)}.v02-s04-numbers .acc{fill:var(--acc)}.v02-s04-numbers .rej{fill:var(--rej)}.v02-s04-numbers .ok{fill:var(--ok)}.v02-s04-numbers .amb{fill:var(--amb)}
.v02-s04-numbers .c{text-anchor:middle}.v02-s04-numbers .r{text-anchor:end}.v02-s04-numbers .ns{stroke:none}
.v02-s04-numbers .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s04-numbers .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v02-s04-numbers .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v02-s04-numbers .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v02-s04-numbers .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v02-s04-numbers .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v02-s04-numbers .pl{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.v02-s04-numbers .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
.v02-s04-numbers .bxg{fill:var(--mute);fill-opacity:.2;stroke:var(--mute);stroke-width:1.4}
.v02-s04-numbers .big{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:22px;font-weight:600;fill:var(--fg)}
.v02-s04-numbers .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v02-s04-numbers .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v02-s04-numbers .fa{fill:var(--tint);stroke:none}.v02-s04-numbers .fr{fill:var(--rejt);stroke:none}.v02-s04-numbers .fb{fill:var(--ambt);stroke:none}.v02-s04-numbers .fo{fill:var(--okt);stroke:none}
.v02-s04-numbers .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s04-numbers .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s04-numbers .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s04-numbers .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s04-numbers .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s04-numbers .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v02-s04-numbers .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v02-s04-numbers .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s04-numbers .hf{fill:var(--fg2)}.v02-s04-numbers .ha{fill:var(--acc)}.v02-s04-numbers .hr{fill:var(--rej)}.v02-s04-numbers .hm{fill:var(--mute)}.v02-s04-numbers .hb{fill:var(--amb)}
.v02-s04-numbers .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v02-s04-numbers .a{animation-duration:36s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s04-numbers .a{animation:none}.v02-s04-numbers .tr{display:none}}
