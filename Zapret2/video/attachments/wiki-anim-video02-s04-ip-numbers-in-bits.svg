acity:0}}.v02-s04-numbers .e11{animation-name:v02-s04-numbers-k11}@keyframes v02-s04-numbers-k12{0.0%{opacity:0}36.667%{opacity:0}37.917%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e12{animation-name:v02-s04-numbers-k12}@keyframes v02-s04-numbers-k13{0.0%{opacity:0}44.444%{opacity:0}45.694%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e13{animation-name:v02-s04-numbers-k13}@keyframes v02-s04-numbers-k14{0.0%{opacity:0}47.778%{opacity:0}49.028%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e14{animation-name:v02-s04-numbers-k14}@keyframes v02-s04-numbers-k15{0.0%{opacity:0}51.111%{opacity:0}52.361%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e15{animation-name:v02-s04-numbers-k15}@keyframes v02-s04-numbers-k16{0.0%{opacity:0}55.0%{opacity:0}56.25%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e16{animation-name:v02-s04-numbers-k16}@keyframes v02-s04-numbers-k17{0.0%{opacity:0}57.222%{opacity:0}58.472%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e17{animation-name:v02-s04-numbers-k17}@keyframes v02-s04-numbers-k18{0.0%{opacity:0}69.444%{opacity:0}70.694%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e18{animation-name:v02-s04-numbers-k18}@keyframes v02-s04-numbers-k19{0.0%{opacity:0}75.0%{opacity:0}76.25%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e19{animation-name:v02-s04-numbers-k19}@keyframes v02-s04-numbers-k20{0.0%{opacity:0}80.556%{opacity:0}81.806%{opacity:1}95.278%{opacity:1}96.944%{opacity:0}100%{opacity:0}}.v02-s04-numbers .e20{animation-name:v02-s04-numbers-k20}</style>
<rect class="bg" x="0" y="0" width="960" height="576"/>
<g class="a e1"><rect class="bx" x="40" y="40" width="430" height="240" rx="8"/><text class="tk" x="56" y="68">Первый байт: 45</text></g>
<g class="a e2"><rect class="bx" x="490" y="40" width="430" height="240" rx="8"/><text class="tk" x="506" y="68">Длина пакета: 01 2e</text></g>
<g class="a e3"><rect class="bx" x="40" y="296" width="430" height="240" rx="8"/><text class="tk" x="56" y="324">Идентификатор: fa 05</text></g>
<g class="a e4"><rect class="bx" x="490" y="296" width="430" height="240" rx="8"/><text class="tk" x="506" y="324">Флаги и смещение: 40 00</text></g>
<g class="a e5"><rect class="bxa" x="56" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="73" y="111">0</text><rect class="bxa" x="90" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="107" y="111">1</text><rect class="bxa" x="124" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="141" y="111">0</text><rect class="bxa" x="158" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="175" y="111">0</text><rect class="bxb" x="208" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="225" y="111">0</text><rect class="bxb" x="242" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="259" y="111">1</text><rect class="bxb" x="276" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="293" y="111">0</text><rect class="bxb" x="310" y="86" width="34" height="36" rx="0"/><text class="ml c ns" x="327" y="111">1</text><text class="big" x="374" y="112">= 45</text></g>
<g class="a e6"><text class="big c" x="124" y="160">4</text><text class="sm c" x="124" y="184">версия IP</text><path class="lf" d="M124 126L124 138"/></g>
<g class="a e7"><text class="big c" x="276" y="160">5</text><text class="sm c" x="276" y="184">5 × 4 = 20 байт</text><text class="sm c mu" x="276" y="204">длина заголовка</text><path class="lf" d="M276 126L276 138"/></g>
<g class="a e8"><text class="sm mu" x="56" y="244">Доп. полей нет: ровно 20 байт.</text></g>
<g class="a e9"><rect class="bxb" x="506" y="88" width="44" height="32" rx="4"/><text class="mk c ns" x="528" y="110">01</text><text class="mk" x="566" y="111">= 1 × 256 = 256</text></g>
<g class="a e10"><rect class="bxb" x="506" y="130" width="44" height="32" rx="4"/><text class="mk c ns" x="528" y="152">2e</text><text class="mk" x="566" y="153">= 2 × 16 + 14 = 46</text></g>
<g class="a e11"><path class="lm" d="M506 178L890 178"/><text class="big" x="506" y="208">256 + 46 = 302</text></g>
<g class="a e12"><text class="sm" x="506" y="234">= 20 + 32 + 250: IP, TCP, данные</text><text class="sm mu" x="506" y="254">Так устройство знает, где пакет кончается.</text></g>
<g class="a e13"><rect class="bxo" x="56" y="342" width="44" height="32" rx="4"/><text class="mk c ns" x="78" y="364">fa</text><text class="mk" x="116" y="365">= 15 × 16 + 10 = 250</text></g>
<g class="a e14"><rect class="bxo" x="56" y="380" width="44" height="32" rx="4"/><text class="mk c ns" x="78" y="402">05</text><text class="mk" x="116" y="403">= 5</text></g>
<g class="a e15"><path class="lm" d="M56 424L440 424"/><text class="big" x="56" y="450">250 × 256 + 5 = 64005</text></g>
<g class="a e16"><text class="sm mu" x="56" y="474">пакеты клиента нумеруются подряд:</text></g>
<g class="a e17"><rect class="bx" x="56" y="482" width="62" height="26" rx="4"/><text class="mk c ns" x="87" y="501">64003</text><text class="ix c" x="87" y="520">SYN</text><rect class="bx" x="122" y="482" width="62" height="26" rx="4"/><text class="mk c ns" x="153" y="501">64004</text><text class="ix c" x="153" y="520">ACK</text><rect class="bxo" x="188" y="482" width="62" height="26" rx="4"/><text class="mk c ns" x="219" y="501">64005</text><text class="ix c" x="219" y="520">данные</text><rect class="bx" x="254" y="482" width="62" height="26" rx="4"/><text class="mk c ns" x="285" y="501">64006</text><text class="ix c" x="285" y="520">ACK</text><rect class="bx" x="320" y="482" width="62" height="26" rx="4"/><text class="mk c ns" x="351" y="501">64007</text><text class="ix c" x="351" y="520">FIN</text><rect class="bx" x="386" y="482" width="62" height="26" rx="4"/><text class="mk c ns" x="417" y="501">64008</text><text class="ix c" x="417" y="520">ACK</text></g>
<g class="a e18"><rect class="bxn" x="506" y="342" width="44" height="32" rx="4"/><text class="mk c ns" x="528" y="364">40</text><rect class="bxn" x="554" y="342" width="44" height="32" rx="4"/><text class="mk c ns" x="576" y="364">00</text><text class="m" x="614" y="364">= 0100 0000 0000 0000</text></g>
<g class="a e19"><rect class="bxg" x="506" y="396" width="40" height="34" rx="0"/><text class="ml c ns" x="526" y="419">0</text><rect class="bxb" x="546" y="396" width="40" height="34" rx="0"/><text class="ml c ns" x="566" y="419">1</text><rect class="bxg" x="586" y="396" width="40" height="34" rx="0"/><text class="ml c ns" x="606" y="419">0</text><rect class="bx" x="634" y="396" width="264" height="34" rx="0"/><text class="sm c" x="766" y="419">13 бит смещения: все нули</text><text class="ix c" x="526" y="450">рез.</text><text class="ix c" x="566" y="450">DF</text><text class="ix c" x="606" y="450">MF</text></g>
<g class="a e20"><text class="sm" x="506" y="478">DF = 1: пакет нельзя делить на куски</text><text class="sm" x="506" y="500">MF = 0 и смещение 0: других кусков нет</text></g>
</svg>
