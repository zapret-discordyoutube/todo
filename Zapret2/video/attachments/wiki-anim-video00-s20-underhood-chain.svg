<svg xmlns="http://www.w3.org/2000/svg" class="v00-s20-underhood-chain" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="v00-s20-underhood-chain-t v00-s20-underhood-chain-d">
<title id="v00-s20-underhood-chain-t">Блок под капотом цепочкой</title>
<desc id="v00-s20-underhood-chain-d">Остальное в курсе это блок под капотом из семи выпусков, которые идут цепочкой и каждый начинается с повтора предыдущего, он необязателен, выпуски про приёмы его не предполагают, и лучше смотреть его в конце, когда приёмы уже знакомы.</desc>
