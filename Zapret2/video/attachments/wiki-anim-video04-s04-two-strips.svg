.v04-s04-two-strips .la{fill:none;stroke:var(--acc);stroke-width:2}
.v04-s04-two-strips .lad{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4}
.v04-s04-two-strips .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v04-s04-two-strips .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v04-s04-two-strips .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v04-s04-two-strips .hf{fill:var(--fg2)}.v04-s04-two-strips .ha{fill:var(--acc)}.v04-s04-two-strips .hr{fill:var(--rej)}.v04-s04-two-strips .hm{fill:var(--mute)}
.v04-s04-two-strips .a{animation-duration:36s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v04-s04-two-strips .a{animation:none}.v04-s04-two-strips .tr{display:none}}
