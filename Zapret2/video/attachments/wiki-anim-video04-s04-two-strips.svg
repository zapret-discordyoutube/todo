.v04-s04-two-strips .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v04-s04-two-strips .mu{fill:var(--mute)}.v04-s04-two-strips .fg{fill:var(--fg)}.v04-s04-two-strips .acc{fill:var(--acc)}.v04-s04-two-strips .rej{fill:var(--rej)}.v04-s04-two-strips .ok{fill:var(--ok)}.v04-s04-two-strips .amb{fill:var(--amb)}
.v04-s04-two-strips .c{text-anchor:middle}.v04-s04-two-strips .r{text-anchor:end}
