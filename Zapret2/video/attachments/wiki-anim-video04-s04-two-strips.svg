<svg xmlns="http://www.w3.org/2000/svg" class="v04-s04-two-strips" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="v04-s04-two-strips-t v04-s04-two-strips-d">
<title id="v04-s04-two-strips-t">Одно имя в двух местах</title>
<desc id="v04-s04-two-strips-d">Одно и то же имя www.example.com, 15 байт, лежит в разных местах: в приветствии TLS на 250 байт на байтах 97–111, в запросе HTTP на 81 байт на байтах 32–46. Ниже запрос по строкам: GET /index.html HTTP/1.1 на байтах 0–23, слово Host с двоеточием на 26–30, пробел на 31, имя на 32–46, затем строки User-Agent и Accept. В приветствии имя находят ходьбой по длинам (начало на 97), в запросе поиском строки Host (начало на 32): два разбора, один результат, номер байта.</desc>
<style>
.v04-s04-two-strips{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v04-s04-two-strips{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v04-s04-two-strips .bg{fill:var(--bg)}
.v04-s04-two-strips text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v04-s04-two-strips .tk{font-weight:600;fill:var(--fg)}
.v04-s04-two-strips .sm{font-size:14.5px}
.v04-s04-two-strips .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v04-s04-two-strips .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v04-s04-two-strips .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
