<rect class="bg" x="0" y="0" width="960" height="512"/>
<g class="a e1"><text class="cap" x="30" y="26">одно имя, два места: приветствие TLS и запрос HTTP, один масштаб</text></g>
<g class="a e2"><text class="sm tk" x="30" y="54">приветствие TLS, 250 байт</text><rect class="bx" x="30" y="62" width="900" height="24" rx="4"/></g>
<g class="a e3"><rect class="bxn" x="379.2" y="59" width="54" height="30" rx="4"/><text class="sm tk c" x="406.2" y="108">имя: 97–111</text></g>
<g class="a e4"><text class="sm tk" x="30" y="140">запрос HTTP, 81 байт</text><rect class="bx" x="30" y="148" width="291.6" height="24" rx="4"/></g>
<g class="a e5"><rect class="bxn" x="145.2" y="145" width="54" height="30" rx="4"/><text class="sm tk c" x="172.2" y="194">имя: 32–46</text></g>
<g class="a e6"><text class="sm tk acc" x="345.6" y="165">те же 15 байт, другое место: 97 или 32?</text></g>
<g class="a e7"><text class="cap" x="30" y="232">запрос HTTP крупнее, по строкам, с номерами байтов</text></g>
<g class="a e8"><rect class="bx" x="30" y="276" width="264" height="34" rx="3"/><text class="m c" x="162" y="298">GET /index.html HTTP/1.1</text><rect class="bxs" x="294" y="276" width="22" height="34" rx="3"/><rect class="bxa" x="316" y="276" width="55" height="34" rx="3"/><text class="mk c" x="343.5" y="298">Host:</text><rect class="bx" x="371" y="276" width="11" height="34" rx="3"/><rect class="bxo" x="382" y="276" width="165" height="34" rx="3"/><text class="mk c" x="464.5" y="298">www.example.com</text><rect class="bxs" x="547" y="276" width="22" height="34" rx="3"/><rect class="bx" x="569" y="276" width="165" height="34" rx="3"/><text class="m c" x="651.5" y="298">User-Agent: lab</text><rect class="bxs" x="734" y="276" width="22" height="34" rx="3"/><rect class="bx" x="756" y="276" width="121" height="34" rx="3"/><text class="m c" x="816.5" y="298">Accept: */*</text><rect class="bxs" x="877" y="276" width="22" height="34" rx="3"/><rect class="bxs" x="899" y="276" width="22" height="34" rx="3"/></g>
<g class="a e9"><text class="sm mu c" x="30" y="330">0</text><text class="sm mu c" x="316" y="330">26</text><text class="sm mu c" x="382" y="330">32</text><text class="sm mu c" x="547" y="330">47</text><text class="sm mu c" x="569" y="330">49</text><text class="sm mu c" x="756" y="330">66</text><text class="sm mu c" x="899" y="330">79</text></g>
<g class="a e10"><path class="lf" d="M382 266L382 276"/><rect class="bxa" x="382" y="240" width="96.3" height="26" rx="5"/><text class="sm tk c" x="430.1" y="258">host = 32</text></g>
<g class="a e11"><rect class="bxs" x="30" y="339" width="18" height="18" rx="3"/><text class="sm" x="56" y="353">конец строки (0d 0a)</text><rect class="bxa" x="250" y="339" width="18" height="18" rx="3"/><text class="sm" x="276" y="353">Host: байты 26–30, пробел 31</text><rect class="bxo" x="530" y="339" width="18" height="18" rx="3"/><text class="sm" x="556" y="353">имя: байты 32–46</text></g>
<g class="a e12"><rect class="bx" x="30" y="376" width="440" height="84" rx="8"/><text class="tk" x="46" y="402">в приветствии: ходьба по длинам</text><text class="sm" x="46" y="426">в байтах записано, сколько пропустить;</text><text class="sm tk" x="46" y="446">результат: имя начинается на 97</text></g>
<g class="a e13"><rect class="bx" x="490" y="376" width="440" height="84" rx="8"/><text class="tk" x="506" y="402">в запросе: поиск строки Host:</text><text class="sm" x="506" y="426">длин нет, есть строки текста;</text><text class="sm tk" x="506" y="446">результат: имя начинается на 32</text></g>
<g class="a e14"><text class="tk" x="30" y="492">Два разных разбора, один результат: номер байта, с которого начинается имя.</text></g>
</svg>
