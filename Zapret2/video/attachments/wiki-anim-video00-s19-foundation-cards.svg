.v00-s19-foundation-cards .hf{fill:var(--fg2)}.v00-s19-foundation-cards .ha{fill:var(--acc)}.v00-s19-foundation-cards .hr{fill:var(--rej)}.v00-s19-foundation-cards .hm{fill:var(--mute)}.v00-s19-foundation-cards .hb{fill:var(--amb)}
