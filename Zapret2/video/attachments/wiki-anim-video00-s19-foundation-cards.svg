<rect class="bg" x="0" y="0" width="960" height="476"/>
<g><text class="cap" x="24" y="24">основы и пара про язык</text></g>
<g class="a e1"><rect class="bxa" x="24" y="44" width="912" height="26" rx="6"/><text class="sm tk" x="36" y="62">основы: два выпуска</text></g>
<g class="a e2"><rect class="bx" x="24" y="76" width="446" height="186" rx="8"/><text class="tk" x="38" y="104">«Письмо в сортировочном центре»</text><text class="sm mu" x="38" y="128">что происходит с запросом по дороге?</text><text class="sm tk acc" x="38" y="156">после выпуска вы сможете:</text><text class="sm" x="38" y="178">различать четыре симптома блокировки и понимать,</text><text class="sm" x="38" y="198">почему разрезанный пакет может пройти мимо</text><text class="sm" x="38" y="218">игрушечного инспектора, который читает пакеты по</text><text class="sm" x="38" y="238">одному</text></g>
<g class="a e3"><rect class="bx" x="490" y="76" width="446" height="186" rx="8"/><text class="tk" x="504" y="104">«Что видит наблюдатель»</text><text class="sm mu" x="504" y="128">что видно внутри пакета и где лежит имя сайта?</text><text class="sm tk acc" x="504" y="156">после выпуска вы сможете:</text><text class="sm" x="504" y="178">найти имя сайта в приветствии на 250 байт</text></g>
<g class="a e4"><rect class="bxo" x="24" y="276" width="912" height="26" rx="6"/><text class="sm tk" x="36" y="294">пара про язык</text></g>
<g class="a e5"><rect class="bx" x="24" y="308" width="446" height="146" rx="8"/><text class="tk" x="38" y="336">«Читаем командную строку zapret2»</text><text class="sm mu" x="38" y="360">как читать настоящую команду слева направо?</text><text class="sm tk acc" x="38" y="388">после выпуска вы сможете:</text><text class="sm" x="38" y="410">сказать, какие пакеты она трогает и какие функции</text><text class="sm" x="38" y="430">запускает</text></g>
<g class="a e6"><rect class="bxb" x="490" y="308" width="446" height="146" rx="8"/><text class="tk" x="504" y="336">«Где резать: метки»</text><text class="sm mu" x="504" y="360">как сказать программе, где резать?</text><text class="sm tk acc" x="504" y="388">после выпуска вы сможете:</text><text class="sm" x="504" y="410">говорить программе, где резать, и понимать, почему</text><text class="sm" x="504" y="430">это нужно до всего остального</text><rect class="bx" x="731" y="316" width="191" height="26" rx="13.0"/><text class="sm tk c" x="826.5" y="334">до всего остального</text></g>
<g class="a e7"></g>
</svg>
