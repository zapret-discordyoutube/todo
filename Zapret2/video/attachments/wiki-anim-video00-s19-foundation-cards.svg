<svg xmlns="http://www.w3.org/2000/svg" class="v00-s19-foundation-cards" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="v00-s19-foundation-cards-t v00-s19-foundation-cards-d">
<title id="v00-s19-foundation-cards-t">Основы и пара про язык</title>
<desc id="v00-s19-foundation-cards-d">Основы это два выпуска, письмо в сортировочном центре и что видит наблюдатель, а за ними пара про язык, где командная строка учит читать настоящую команду слева направо, а метки учат говорить программе, где резать, и нужны до всего остального.</desc>
