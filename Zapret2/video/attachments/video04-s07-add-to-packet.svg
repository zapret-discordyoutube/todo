<g class="a e8"><text class="sm amb tk" x="305" y="188">слово example: байты 101..107</text></g>
<g class="a e9"><text class="tk sm" x="40" y="216">Приветствие: имя с байта 97, поиск слова дал начало 4 и длину 7</text></g>
<g class="a e10"><rect class="bx" x="40" y="224" width="181" height="34" rx="4"/><text class="mk c" x="130.5" y="247">sld = 97 + 4 = 101</text></g>
<g class="a e11"><rect class="bx" x="235" y="224" width="216" height="34" rx="4"/><text class="mk c" x="343" y="247">endsld = 101 + 7 = 108</text></g>
<g class="a e12"><rect class="bxa" x="465" y="224" width="338" height="34" rx="4"/><text class="mk c" x="634" y="247">midsld = 101 + 7 / 2 = 101 + 3 = 104</text></g>
<g class="a e13"><text class="sm mu r" x="920" y="282">деление нацело: остаток отбрасывается, 7 / 2 = 3</text></g>
<g class="a e14"><text class="tk sm" x="40" y="304">Запрос HTTP: имя с байта 32, те же начало 4 и длина 7</text></g>
<g class="a e15"><rect class="bx" x="40" y="312" width="172" height="34" rx="4"/><text class="mk c" x="126" y="335">sld = 32 + 4 = 36</text></g>
<g class="a e16"><rect class="bx" x="226" y="312" width="199" height="34" rx="4"/><text class="mk c" x="325.5" y="335">endsld = 36 + 7 = 43</text></g>
<g class="a e17"><rect class="bxa" x="439" y="312" width="312" height="34" rx="4"/><text class="mk c" x="595" y="335">midsld = 36 + 7 / 2 = 36 + 3 = 39</text></g>
