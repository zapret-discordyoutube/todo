<svg xmlns="http://www.w3.org/2000/svg" class="v04-s07-add-to-packet" viewBox="0 0 960 626" width="960" height="626" role="img" aria-labelledby="v04-s07-add-to-packet-t v04-s07-add-to-packet-d">
<title id="v04-s07-add-to-packet-t">Из слова в номера пакета</title>
<desc id="v04-s07-add-to-packet-d">От слова к номерам в пакете: начало имени в приветствии 97, поиск слова вернул начало 4 и длину 7, поэтому sld = 97 + 4 = 101, endsld = 101 + 7 = 108, midsld = 101 + 7 / 2 = 101 + 3 = 104 (деление нацело, остаток отбрасывается); в запросе HTTP имя с байта 32 даёт 36, 43 и 39. Разрез на 104 ставит «…www.exa» (104 байта) и «mple.com…» (146 байт); в запросе тот же разрез между «exa» и «mple» стоит на 39. Слово из одной буквы — исключение: midsld = начало + 1.</desc>
