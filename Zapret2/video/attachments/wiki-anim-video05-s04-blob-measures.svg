<g><text class="cap" x="40" y="26">что режем: источники данных по порядку (масштаб один на все три)</text></g>
<g class="a e1"><rect class="bxa" x="40" y="46" width="403.2" height="28" rx="4"/><text class="sm" x="48" y="65">1  блоб: arg.blob</text><text class="mk r" x="435.2" y="65">680 байт</text></g>
<g class="a e2"><rect class="bx" x="40" y="90" width="880" height="28" rx="4"/><text class="sm" x="48" y="109">2  собранное приветствие: reasm_data</text><text class="mk r" x="912" y="109">1484 байта</text></g>
<g class="a e3"><rect class="bx" x="40" y="134" width="148.2" height="28" rx="4"/><text class="mk" x="48" y="153">250 байт</text><text class="sm" x="200.2" y="153">3  данные пакета: dis.payload, запасной</text></g>
<g class="a e4"><text class="sm mu" x="40" y="182">блоб 680 и собранные 1484 байта взяты из разных опытов; режется первое найденное</text></g>
<g class="a e5"><text class="cap" x="40" y="218">блоб режется по midsld</text></g>
<g class="a e6"><rect class="bx" x="40" y="232" width="880" height="40" rx="4"/><text class="sm r" x="912" y="258">блоб, 680 байт; имя www.microsoft.com</text></g>
<g class="a e7"><path class="lcut" d="M212.1 224L212.1 280"/><text class="mk" x="220.1" y="296">midsld = 133</text></g>
<g class="a e8"><text class="sm" x="220.1" y="316">в пакете 250 байт было бы 104: считается по тому, что режут</text></g>
<g class="a e9"><rect class="bxa" x="40" y="330" width="166.1" height="34" rx="4"/><text class="mk c" x="123.1" y="352">133 байта</text><rect class="bxa" x="212.1" y="330" width="707.9" height="34" rx="4"/><text class="mk c" x="566.1" y="352">547 байт</text></g>
<g class="a e10"><text class="sm tk" x="40" y="384">оригинал в 250 байт выброшен (DROP): на провод идут только куски блоба</text></g>
<g class="a e11"><text class="cap" x="40" y="410">захват клиента: пакеты с данными, относительные номера; расстояния не в масштабе</text></g>
<g class="a e12"><rect class="bxa" x="40" y="424" width="168" height="62" rx="6"/><text class="sm mu c" x="124" y="444">0 мс</text><text class="ml c" x="124" y="470">1+133</text><path class="lm" d="M124 488L124 502"/><text class="sm c" x="124" y="520">ACK 134</text></g>
<g class="a e13"><rect class="bxa" x="218" y="424" width="168" height="62" rx="6"/><text class="sm mu c" x="302" y="444">0.4 мс</text><text class="ml c" x="302" y="470">134+547</text><path class="lm" d="M302 488L302 502"/><text class="sm c" x="302" y="520">ACK 681</text></g>
<g class="a e14"><rect class="bxb" x="396" y="424" width="168" height="62" rx="6"/><text class="sm mu c" x="480" y="444">220 мс</text><text class="ml c" x="480" y="470">134+117</text><path class="lm" d="M480 488L480 502"/><text class="sm mu c" x="480" y="520">ответ с D-SACK</text></g>
<g class="a e15"><rect class="bxb" x="574" y="424" width="168" height="62" rx="6"/><text class="sm mu c" x="658" y="444">632 мс</text><text class="ml c" x="658" y="470">134+117</text><path class="lm" d="M658 488L658 502"/><text class="sm mu c" x="658" y="520">ответ с D-SACK</text></g>
<g class="a e16"><rect class="bxb" x="752" y="424" width="168" height="62" rx="6"/><text class="sm mu c" x="836" y="444">1464 мс</text><text class="ml c" x="836" y="470">134+117</text><path class="lm" d="M836 488L836 502"/><text class="sm mu c" x="836" y="520">ответ с D-SACK</text></g>
<g class="a e17"><text class="sm" x="40" y="552">пакеты 3-5: те же 117 байт, байты 133-249 настоящего приветствия; судя по захвату, повторы</text></g>
<g class="a e18"><rect class="bxs" x="40" y="566" width="880" height="70" rx="8"/><text class="sm tk" x="56" y="590">сервер: 680 байт, имя www.microsoft.com; повторы в поток не приняты</text><text class="sm" x="56" y="614">настоящее приветствие одним пакетом на провод не вышло; клиент ответ получил</text></g>
