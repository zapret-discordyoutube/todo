<svg xmlns="http://www.w3.org/2000/svg" class="v05-s04-blob-measures" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="v05-s04-blob-measures-t v05-s04-blob-measures-d">
<title id="v05-s04-blob-measures-t">Измеряется то, что режется</title>
<desc id="v05-s04-blob-measures-d">Измеряется то, что режется: функция берёт данные по порядку, сначала блоб (в нашем тесте встроенное приветствие в 680 байт), потом собранное приветствие (в другом опыте 1484 байта), потом данные пакета (250 байт); с блобом метка midsld дала 133, а не 104, и части вышли в 133 и 547 байт; настоящее приветствие в 250 байт функция выбросила, поэтому в захвате клиента пакеты 1+133 и 134+547, а потом три раза по 134+117 через 220, 632 и 1464 мс, судя по захвату это повторы хвоста настоящего приветствия, байтов с 133 по 249, которые сервер в поток не принял: он ответил на них блоками D-SACK, то есть эти номера уже считал полученными; сервер собрал 680 байт с именем www.microsoft.com, настоящее приветствие одним пакетом на провод не вышло.</desc>
