<title id="v07-s11-three-routers-check-t">Три роутера: срок 3</title>
<desc id="v07-s11-three-routers-check-d">Проверка на дороге из трёх роутеров при дельте 0: ответ сервера пришёл со сроком 61, значит переходов 64 минус 61 равно 3, срок подделки 3 плюс 0 даёт 3, подделка видна на точках c0, r0, r1 и r2, умирает на третьем роутере с ICMP типа 11 с адреса 10.9.2.2, а приложение сервера получает чистые 250 байт.</desc>
