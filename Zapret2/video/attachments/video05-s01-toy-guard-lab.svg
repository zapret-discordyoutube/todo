<rect class="bg" x="0" y="0" width="960" height="640"/>
<g><text class="cap" x="40" y="26">выдуманный пример: вахтёр с картонкой</text><rect class="bxb" x="700" y="10" width="220" height="24" rx="4"/><text class="sm amb tk c" x="810" y="27">выдуманный пример</text></g>
<g class="a e1"><rect class="bx" x="40" y="50" width="400" height="150" rx="8"/><text class="cap mu" x="56" y="74">один лист</text><rect class="bxs" x="60" y="86" width="200" height="48" rx="4"/><rect class="bxa" x="122" y="92" width="100" height="36" rx="4"/><text class="sm mu" x="66" y="117">имя</text><text class="lg" x="130" y="117">Иванов</text><text class="sm mu" x="60" y="160">окошко лежит на одном месте листа</text><rect class="bxr" x="272" y="90" width="160" height="40" rx="6"/><text class="sm rej c" x="352" y="115">шлагбаум закрыт</text></g>
<g class="a e2"><rect class="bx" x="480" y="50" width="440" height="150" rx="8"/><text class="cap mu" x="496" y="74">два листа</text><rect class="bxs" x="496" y="86" width="120" height="48" rx="4"/><rect class="bxa" x="522" y="92" width="70" height="36" rx="4"/><text class="lg c" x="557" y="117">Ива</text><rect class="bxs" x="628" y="86" width="120" height="48" rx="4"/><rect class="bxa" x="654" y="92" width="70" height="36" rx="4"/><text class="lg c" x="689" y="117">нов</text><rect class="bxo" x="756" y="90" width="150" height="40" rx="6"/><text class="sm ok c" x="831" y="115">шлагбаум поднят</text><text class="sm mu" x="496" y="160">вахтёр читает каждый лист отдельно, не склеивает</text><text class="sm tk" x="496" y="184">получатель читает листы подряд: Иванов</text></g>
<g class="a e3"><text class="cap" x="40" y="232">настоящий опыт: игрушечное правило в роутере</text><rect class="bxb" x="640" y="216" width="280" height="24" rx="4"/><text class="sm amb tk c" x="780" y="233">игрушка, а не оборудование</text></g>
<g class="a e4"><rect class="bxs" x="40" y="248" width="880" height="60" rx="6"/><text class="mk" x="56" y="272">@th,1032,120 0x7777772e6578616d706c652e636f6d counter drop</text><text class="sm mu" x="56" y="296">15 байт www.example.com: 1032 бита = 129 байт от начала TCP = 32 заголовок + 97 данных</text></g>
<g class="a e5"><rect class="bx" x="40" y="322" width="430" height="290" rx="8"/><text class="tk" x="56" y="346">без программы и без разреза</text><rect class="bxs" x="56" y="358" width="398" height="40" rx="4"/><text class="sm" x="66" y="384">один пакет, 250 байт, имя целиком в окошке</text></g>
<g class="a e6"><rect class="bxr" x="64" y="414" width="56" height="30" rx="4"/><text class="mk rej c" x="92" y="434">250</text><text class="ix c" x="92" y="462">0</text><rect class="bxr" x="130" y="414" width="56" height="30" rx="4"/><text class="mk rej c" x="158" y="434">250</text><text class="ix c" x="158" y="462">206</text><rect class="bxr" x="196" y="414" width="56" height="30" rx="4"/><text class="mk rej c" x="224" y="434">250</text><text class="ix c" x="224" y="462">414</text><rect class="bxr" x="262" y="414" width="56" height="30" rx="4"/><text class="mk rej c" x="290" y="434">250</text><text class="ix c" x="290" y="462">834</text><rect class="bxr" x="328" y="414" width="56" height="30" rx="4"/><text class="mk rej c" x="356" y="434">250</text><text class="ix c" x="356" y="462">1662</text><rect class="bxr" x="394" y="414" width="56" height="30" rx="4"/><text class="mk rej c" x="422" y="434">250</text><text class="ix c" x="422" y="462">3326</text><text class="sm mu" x="56" y="484">мс; не в масштабе; пакет каждый раз тот же</text></g>
<g class="a e7"><rect class="bxr" x="56" y="500" width="398" height="44" rx="6"/><text class="tk" x="68" y="520">счётчик правила: 6 пакетов, 1812 байт</text><text class="sm" x="68" y="538">оригинал и 5 повторных отправок клиента</text></g>
<g class="a e8"><rect class="bxr" x="56" y="554" width="398" height="44" rx="6"/><text class="tk" x="68" y="574">сервер: 0 байт, ответа нет</text><text class="sm" x="68" y="592">все шесть пакетов правило выбросило</text></g>
<g class="a e9"><rect class="bx" x="490" y="322" width="430" height="290" rx="8"/><text class="tk" x="506" y="346">multisplit:pos=midsld</text><rect class="bxs" x="506" y="358" width="398" height="40" rx="4"/><text class="sm" x="516" y="384">оригинал выброшен, на провод ушли части</text></g>
<g class="a e10"><rect class="bxa" x="506" y="414" width="150" height="30" rx="4"/><text class="mk c" x="581" y="434">104 байта</text><rect class="bxa" x="664" y="414" width="240" height="30" rx="4"/><text class="mk c" x="784" y="434">146 байт</text><text class="sm mu" x="506" y="470">правило не нашло имя ни в одном пакете</text></g>
<g class="a e11"><rect class="bxo" x="506" y="500" width="398" height="44" rx="6"/><text class="tk" x="518" y="520">счётчик правила: 0 пакетов</text><text class="sm" x="518" y="538">правило не поймало ни одного пакета</text></g>
<g class="a e12"><rect class="bxo" x="506" y="554" width="398" height="44" rx="6"/><text class="tk" x="518" y="574">сервер: 250 байт, ответ получен</text><text class="sm" x="518" y="592">части сложены подряд, как оригинал</text></g>
</svg>
