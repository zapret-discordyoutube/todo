<svg xmlns="http://www.w3.org/2000/svg" class="v05-s01-toy-guard-lab" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="v05-s01-toy-guard-lab-t v05-s01-toy-guard-lab-d">
<title id="v05-s01-toy-guard-lab-t">Вахтёр и правило-игрушка</title>
<desc id="v05-s01-toy-guard-lab-d">Игрушечный вахтёр, который смотрит в одно и то же место каждого листа, и тот же приём в нашей лаборатории: фамилия Иванов целиком в окошке закрывает шлагбаум, а разрезанная на Ива и нов не закрывает, и получатель читает её подряд целиком; настоящий опыт с игрушечным правилом в роутере, которое ищет 15 байт www.example.com на смещении 97 в данных каждого пакета: без программы и без разреза счётчик правила показал 6 пакетов (оригинал и 5 повторных отправок на 0, 206, 414, 834, 1662 и 3326 мс), сервер получил 0 байт, а с разрезом multisplit по midsld счётчик остался нулевым и сервер получил все 250 байт; это игрушка проекта, а не оборудование.</desc>
