<svg xmlns="http://www.w3.org/2000/svg" class="v03-s02-profile1" viewBox="0 0 960 468" width="960" height="468" role="img" aria-labelledby="v03-s02-profile1-t v03-s02-profile1-d">
<title id="v03-s02-profile1-t">Профиль один существует с самого начала</title>
<desc id="v03-s02-profile1-d">Профиль номер один создаётся ещё до цикла разбора опций, пока ни одной опции не прочитано: три строки кода nfq2/nfqws.c:2288, 2293 и 2294 добавляют в список пустую запись, запоминают указатель dp на неё и ставят ей номер, счётчик профилей меняется с 0 на 1; журнал опыта подтверждает: «we have 1 user defined desync profile(s)»; всё, что написано до первого --new, относится к профилю один.</desc>
