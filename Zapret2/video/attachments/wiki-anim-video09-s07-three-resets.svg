<rect class="bg" x="0" y="0" width="960" height="735"/>
<g><text class="cap" x="40" y="22">докуда доходит сброс и что делает сервер</text><rect class="pl" x="737.9" y="4" width="182.1" height="24" rx="12"/><text class="sm c" x="829" y="21">выдуманный пример</text></g>
<g class="a e1"><rect class="bx" x="40" y="38" width="880" height="52" rx="8"/><text class="sm" x="54" y="60">игрушка: «отмена» всё-таки дошла до адресата, он закрыл дверь,</text><text class="sm" x="54" y="80">и следующее письмо упёрлось в закрытую дверь</text></g>
<g class="a e2"><text class="cap c" x="345" y="112">клиент</text><text class="cap c" x="445" y="112">роутер</text><text class="cap c" x="545" y="112">сервер</text></g>
<g class="a e3"><rect class="bx" x="40" y="124" width="880" height="112" rx="8"/><text class="mk" x="54" y="160">rst:ip_ttl=1</text><text class="sm mu" x="54" y="182">для сравнения, предыдущая сцена</text><path class="lmd" d="M345 130L345 230"/><path class="lmd" d="M445 130L445 230"/><path class="lmd" d="M545 130L545 230"/><path class="lcut" d="M345 152L445 155"/><path class="lr" d="M438 148L452 162M452 148L438 162"/><text class="ix rej" x="351" y="146">RST, TTL 1</text><path class="la" d="M345 184L535.0 189.7"/><polygon class="ha" points="545,190 534.9,194.7 535.2,184.7"/><text class="ix mu" x="351" y="180">приветствие</text><text class="sm" x="590" y="150">сервер: сброс не получал</text><text class="sm" x="590" y="173">клиент: ошибки нет</text><text class="sm" x="590" y="196">приложение сервера: 250 байт</text><text class="sm tk" x="590" y="219">игрушка: FORGET, всё прошло</text></g>
<g class="a e4"><rect class="bxr" x="40" y="246" width="880" height="112" rx="8"/><text class="mk" x="54" y="282">rst:ip_ttl=2</text><text class="sm mu" x="54" y="304">роутер один, сброс его переживает</text><path class="lmd" d="M345 252L345 352"/><path class="lmd" d="M445 252L445 352"/><path class="lmd" d="M545 252L545 352"/><path class="lr" d="M345 274L535.0 279.7"/><polygon class="hr" points="545,280 534.9,284.7 535.2,274.7"/><text class="ix rej" x="351" y="268">RST</text><path class="la" d="M345 306L535.0 311.7"/><polygon class="ha" points="545,312 534.9,316.7 535.2,306.7"/><text class="ix mu" x="351" y="302">приветствие</text><path class="lr" d="M545 336L355.0 341.7"/><polygon class="hr" points="345,342 354.8,336.7 355.1,346.7"/><text class="ix rej" x="353" y="331">ответ сервера: RST, окно 0</text><text class="sm" x="590" y="272">на карте сервера сброс с TTL 1</text><text class="sm" x="590" y="295">сервер закрыл соединение: RST, окно 0</text><text class="sm" x="590" y="318">клиент: Errno 104, сброшено</text><text class="sm tk" x="590" y="341">приложение сервера: 0 байт</text></g>
<g class="a e5"><rect class="bxr" x="40" y="368" width="880" height="112" rx="8"/><text class="mk" x="54" y="404">rst</text><text class="sm mu" x="54" y="426">никакого условия, TTL 64</text><path class="lmd" d="M345 374L345 474"/><path class="lmd" d="M445 374L445 474"/><path class="lmd" d="M545 374L545 474"/><path class="lr" d="M345 396L535.0 401.7"/><polygon class="hr" points="545,402 534.9,406.7 535.2,396.7"/><text class="ix rej" x="351" y="390">RST</text><path class="la" d="M345 428L535.0 433.7"/><polygon class="ha" points="545,434 534.9,438.7 535.2,428.7"/><text class="ix mu" x="351" y="424">приветствие</text><path class="lr" d="M545 458L355.0 463.7"/><polygon class="hr" points="345,464 354.8,458.7 355.1,468.7"/><text class="ix rej" x="353" y="453">ответ сервера: RST, окно 0</text><text class="sm" x="590" y="394">сброс идёт с TTL 64, доходит</text><text class="sm" x="590" y="417">исход тот же: ответ RST, окно 0</text><text class="sm" x="590" y="440">клиент: Errno 104, сброшено</text><text class="sm tk" x="590" y="463">приложение сервера: 0 байт</text></g>
<g class="a e6"><rect class="bxo" x="40" y="490" width="880" height="112" rx="8"/><text class="mk" x="54" y="526">rst:badsum</text><text class="sm mu" x="54" y="548">неверная сумма TCP у сброса</text><path class="lmd" d="M345 496L345 596"/><path class="lmd" d="M445 496L445 596"/><path class="lmd" d="M545 496L545 596"/><path class="lb" d="M345 518L535.0 523.7"/><polygon class="hb" points="545,524 534.9,528.7 535.2,518.7"/><text class="ix amb" x="351" y="512">RST, сумма BAD</text><path class="la" d="M345 550L535.0 555.7"/><polygon class="ha" points="545,556 534.9,560.7 535.2,550.7"/><text class="ix mu" x="351" y="546">приветствие</text><text class="sm" x="590" y="516">сброс на карте сервера, сумма BAD</text><text class="sm" x="590" y="539">сервер его игнорирует</text><text class="sm" x="590" y="562">приложение сервера: 250 байт</text><text class="sm tk" x="590" y="585">игрушка: FORGET, сумму не смотрит</text></g>
<g class="a e7"><text class="cap" x="40" y="630">сброс: что делает сервер</text></g>
<g class="a e8"><rect class="bxo" x="40" y="642" width="286" height="76" rx="8"/><text class="sm tk" x="52" y="664">TTL 1</text><text class="sm" x="52" y="686">не получает сброс, соединение</text><text class="sm" x="52" y="704">целое</text></g>
<g class="a e9"><rect class="bxr" x="337" y="642" width="286" height="76" rx="8"/><text class="sm tk" x="349" y="664">TTL 2 или без условий</text><text class="sm" x="349" y="686">получает и закрывает</text><text class="sm" x="349" y="704">соединение</text></g>
<g class="a e10"><rect class="bxo" x="634" y="642" width="286" height="76" rx="8"/><text class="sm tk" x="646" y="664">badsum</text><text class="sm" x="646" y="686">получает и игнорирует,</text><text class="sm" x="646" y="704">соединение целое</text></g>
</svg>
