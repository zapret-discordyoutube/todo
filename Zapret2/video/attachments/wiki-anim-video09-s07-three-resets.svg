.v09-s07-three-resets .hf{fill:var(--fg2)}.v09-s07-three-resets .ha{fill:var(--acc)}.v09-s07-three-resets .hr{fill:var(--rej)}.v09-s07-three-resets .hm{fill:var(--mute)}.v09-s07-three-resets .hb{fill:var(--amb)}
