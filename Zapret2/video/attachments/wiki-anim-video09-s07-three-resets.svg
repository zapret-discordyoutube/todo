<svg xmlns="http://www.w3.org/2000/svg" class="v09-s07-three-resets" viewBox="0 0 960 735" width="960" height="735" role="img" aria-labelledby="v09-s07-three-resets-t v09-s07-three-resets-d">
<title id="v09-s07-three-resets-t">Три опыта со сбросом и докуда он доходит</title>
<desc id="v09-s07-three-resets-d">Три опыта со сбросом перед приветствием и то, докуда он доходит: со сроком жизни 1 сброс умирает на роутере, сервер его не получает, приложение читает 250 байт и игрушка стирает память, со сроком 2 и без условий сброс доходит до сервера, сервер отвечает сбросом с окном 0, клиент получает ошибку «соединение сброшено» и приложение сервера получает 0 байт, а с испорченной суммой сброс доходит, но сервер его игнорирует, приложение получает 250 байт и игрушка всё равно стирает память.</desc>
<style>.v09-s07-three-resets{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
