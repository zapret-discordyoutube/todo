<svg xmlns="http://www.w3.org/2000/svg" class="v01-s08-strategy-call" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="v01-s08-strategy-call-t v01-s08-strategy-call-d">
<title id="v01-s08-strategy-call-t">Стратегия: команда и функция на Lua</title>
<desc id="v01-s08-strategy-call-d">Командная строка опыта разобрана по словам: ядро на Си перехватывает пакет, а Lua-функция multisplit с параметром pos=midsld режет его на два пакета в 104 и 146 байт данных.</desc>
