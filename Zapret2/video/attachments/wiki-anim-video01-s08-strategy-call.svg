<g class="a e12"><rect class="bx" x="700" y="36" width="250" height="90" rx="7"/><text class="sm tk" x="716" y="62">Функции написаны на Lua:</text><text class="sm" x="716" y="86">стратегию можно менять</text><text class="sm" x="716" y="108">без пересборки программы</text></g>
