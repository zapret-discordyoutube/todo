<svg xmlns="http://www.w3.org/2000/svg" class="v00-s01-symptom-definition" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="v00-s01-symptom-definition-t v00-s01-symptom-definition-d">
<title id="v00-s01-symptom-definition-t">Сайт не открывается, а интернет есть</title>
<desc id="v00-s01-symptom-definition-d">Выдуманный пример: в одной вкладке браузера колёсико крутится и страница не грузится, в соседней идёт видео, значит интернет есть, а не открывается один сайт; сломанный сайт не открывается ни из какой сети, а при блокировке сайт не открывается из вашей сети, хотя из другой открывается, и рабочее определение блокировки такое: кто-то на пути запроса намеренно мешает получить один конкретный сайт.</desc>
