<title id="video06-s04-zero-one-default-t">Ноль, единица и значение по умолчанию</title>
<desc id="video06-s04-zero-one-default-d">Четыре случая для pos на приветствии и запросе: pos равен 0 и pos равен 999 не режут ничего, в журнале нет допустимых позиций и на проводе один пакет 250@0; pos равен 1,midsld даёт три пакета 146@104, 103@1 и 1@0; без pos подставляется 2, уходят 248@2 и 2@0, имя целиком остаётся внутри длинного куска; а на HTTP-запросе в 81 байт с меткой method+2 уходят 79@2 и 2@0, начало GE.</desc>
