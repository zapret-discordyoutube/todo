<rect class="bg" x="0" y="0" width="960" height="540"/>
<g><text class="cap" x="40" y="26">один подложный пакет, два читателя</text></g>
<g class="a e1"><rect class="bxs" x="40" y="52" width="90" height="56" rx="6"/><text class="tk sm c" x="85" y="86">клиент</text></g>
<g class="a e2"><path class="lm" d="M130 80L260 80"/><path class="lm" d="M480 80L600 80"/><rect class="bxa" x="260" y="46" width="220" height="68" rx="8"/><text class="cap c" x="370" y="68">читатель 1</text><text class="tk sm c" x="370" y="90">инспектор (игрушка)</text><rect class="bxr" x="600" y="46" width="220" height="68" rx="8"/><text class="cap c" x="710" y="68">читатель 2</text><text class="tk sm c" x="710" y="90">получатель, сервер</text></g>
<g class="a e3"><rect class="bxb" x="150" y="68" width="76" height="24" rx="4"/><text class="mk amb c" x="188" y="85">подделка</text></g>
<g class="a e4"><text class="sm ok tk" x="260" y="140">должен принять за настоящий пакет</text><text class="sm rej tk" x="600" y="140">не должен принять её за данные</text></g>
<g class="a e5"><text class="cap" x="40" y="188">задача</text><text class="cap" x="300" y="188">кто читает</text><text class="cap" x="450" y="188">если не вышло</text></g>
<g class="a e6"><rect class="bx" x="40" y="200" width="880" height="54" rx="6"/><rect class="bxa" x="50" y="211" width="32" height="32" rx="16"/><text class="mk c" x="66" y="233">1</text><text class="tk sm" x="94" y="233">правдоподобие</text><text class="sm" x="300" y="233">инспектор</text><text class="sm" x="450" y="233">он судит по настоящему пакету и блокирует</text></g>
<g class="a e7"><rect class="bx" x="40" y="264" width="880" height="54" rx="6"/><rect class="bxr" x="50" y="275" width="32" height="32" rx="16"/><text class="mk c" x="66" y="297">2</text><text class="tk sm" x="94" y="297">отказ получателя</text><text class="sm" x="300" y="297">сервер</text><text class="sm" x="450" y="297">он принимает подделку за данные: поток испорчен</text></g>
<g class="a e8"><rect class="bx" x="40" y="328" width="880" height="54" rx="6"/><rect class="bxb" x="50" y="339" width="32" height="32" rx="16"/><text class="mk c" x="66" y="361">3</text><text class="tk sm" x="94" y="361">безвредность</text><text class="sm" x="300" y="361">соединение</text><text class="sm" x="450" y="361">соединение путается, ответа от сервера нет</text></g>
<g class="a e9"><text class="cap" x="40" y="410">два способа отказа получателя</text></g>
<g class="a e10"><rect class="bxo" x="40" y="420" width="430" height="62" rx="8"/><text class="tk sm" x="54" y="444">пакет умирает по дороге</text><text class="sm" x="54" y="466">срок жизни, разбираем сейчас</text></g>
<g class="a e11"><rect class="bx" x="490" y="420" width="430" height="62" rx="8"/><text class="tk sm" x="504" y="444">доходит, но получатель отвергает его</text><text class="sm" x="504" y="466">по формальной причине: следующие части</text></g>
<g class="a e12"><text class="sm" x="40" y="510">Подделка стоит перед настоящим пакетом: инспектор нашей игрушки судит по первому пакету с данными.</text></g>
</svg>
