<svg xmlns="http://www.w3.org/2000/svg" class="v07-s02-three-jobs" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v07-s02-three-jobs-t v07-s02-three-jobs-d">
<title id="v07-s02-three-jobs-t">Два читателя и три задачи подделки</title>
<desc id="v07-s02-three-jobs-d">Один подложный пакет проходит двух читателей, инспектора, которого он должен обмануть, и получателя, который не должен его принять, поэтому у подделки три задачи: правдоподобие для инспектора, отказ получателя, который либо не получает пакет совсем, либо отвергает его по формальной причине, и безвредность для соединения.</desc>
<style>.v07-s02-three-jobs{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
