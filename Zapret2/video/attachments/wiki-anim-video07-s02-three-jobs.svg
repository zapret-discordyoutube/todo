.v07-s02-three-jobs .hf{fill:var(--fg2)}.v07-s02-three-jobs .ha{fill:var(--acc)}.v07-s02-three-jobs .hr{fill:var(--rej)}.v07-s02-three-jobs .hm{fill:var(--mute)}.v07-s02-three-jobs .hb{fill:var(--amb)}
.v07-s02-three-jobs .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
