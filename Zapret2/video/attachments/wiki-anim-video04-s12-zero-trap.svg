<svg xmlns="http://www.w3.org/2000/svg" class="v04-s12-zero-trap" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="v04-s12-zero-trap-t v04-s12-zero-trap-d">
<title id="v04-s12-zero-trap-t">Ловушка pos=0: журнал и провод</title>
<desc id="v04-s12-zero-trap-d">Третий настоящий запуск, ловушка pos=0: журнал пишет resolved split pos 0, следом строка no valid split positions, и на провод уходит один пакет в 250 байт без изменений. Журнал печатается раньше, чем программа вычёркивает позицию, с которой разрез невозможен. Рядом с меткой midsld ноль не мешает: pos=0,midsld и pos=host-97,midsld дают в журнале 0 104, а на проводе два пакета по 104 и 146 байт.</desc>
<style>
.v04-s12-zero-trap{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
