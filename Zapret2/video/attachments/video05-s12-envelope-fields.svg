<rect class="bg" x="0" y="0" width="960" height="580"/>
<g><text class="cap" x="40" y="24">игрушка и настоящие поля: что копируется, что меняется</text></g>
<g class="a e1"><text class="sm tk" x="40" y="52">выдуманный пример: конверт-шаблон</text></g>
<g class="a e2"><rect class="bx" x="40" y="62" width="270" height="158" rx="8"/><text class="cap" x="54" y="84">шаблон</text><rect class="bx" x="54" y="94" width="242" height="25" rx="4"/><text class="sm" x="64" y="112">от кого, кому</text><rect class="bx" x="54" y="124" width="242" height="25" rx="4"/><text class="sm" x="64" y="142">штампы</text><rect class="bxd" x="54" y="154" width="242" height="25" rx="4"/><text class="sm" x="64" y="172">письмо</text><rect class="bxd" x="54" y="184" width="242" height="25" rx="4"/><text class="sm" x="64" y="202">со страницы N</text></g>
<g class="a e3"><rect class="bxs" x="330" y="120" width="90" height="40" rx="6"/><text class="tk c" x="375" y="145">копия</text><path class="lf" d="M312 140L318.0 140.0"/><polygon class="hf" points="328,140 318.0,145.0 318.0,135.0"/><path class="lf" d="M422 140L428.0 140.0"/><polygon class="hf" points="438,140 428.0,145.0 428.0,135.0"/></g>
<g class="a e4"><rect class="bx" x="440" y="62" width="270" height="158" rx="8"/><text class="cap" x="454" y="84">копия</text><rect class="bx" x="454" y="94" width="242" height="25" rx="4"/><text class="sm" x="464" y="112">от кого, кому: те же</text><rect class="bx" x="454" y="124" width="242" height="25" rx="4"/><text class="sm" x="464" y="142">штампы: те же</text><rect class="bxb" x="454" y="154" width="242" height="25" rx="4"/><text class="sm" x="464" y="172">письмо: другой листок</text><rect class="bxb" x="454" y="184" width="242" height="25" rx="4"/><text class="sm" x="464" y="202">со страницы N + 104</text></g>
<g class="a e5"><text class="sm tk" x="720" y="112">меняется письмо и</text><text class="sm tk" x="720" y="134">номер страницы,</text><text class="sm tk" x="720" y="156">остальное копия</text></g>
<g class="a e6"><text class="cap" x="40" y="262">окно игрушки</text><text class="cap" x="262" y="262">поле настоящего пакета</text><text class="cap r" x="906" y="262">в копии</text></g>
<g class="a e7"><rect class="bx" x="40" y="272" width="880" height="32" rx="5"/><text class="sm" x="54" y="293">от кого, кому</text><text class="sm" x="262" y="293">адреса IP и порты</text><text class="sm tk r" x="906" y="293">как у исходного</text></g>
<g class="a e8"><rect class="bx" x="40" y="310" width="880" height="32" rx="5"/><text class="sm" x="54" y="331">штампы</text><text class="sm" x="262" y="331">флаги TCP, окно, номер подтверждения, опции TCP</text><text class="sm tk r" x="906" y="331">как у исходного</text></g>
<g class="a e9"><rect class="bxb" x="40" y="348" width="880" height="32" rx="5"/><text class="sm" x="54" y="369">письмо</text><text class="sm" x="262" y="369">данные пакета</text><text class="sm tk r" x="906" y="369">изменено: часть</text></g>
<g class="a e10"><rect class="bxb" x="40" y="386" width="880" height="32" rx="5"/><text class="sm" x="54" y="407">со страницы N</text><text class="sm" x="262" y="407">порядковый номер th_seq</text><text class="sm tk r" x="906" y="407">изменено: T + сдвиг</text></g>
<g class="a e11"><rect class="bxa" x="40" y="424" width="880" height="32" rx="5"/><text class="sm" x="54" y="445">нет в игрушке</text><text class="sm" x="262" y="445">идентификатор IP, ip_id</text><text class="sm tk r" x="906" y="445">ставится при отправке</text></g>
<g class="a e12"><text class="cap" x="40" y="490">вторая часть нашего опыта: 146 байт данных, сдвиг 104</text></g>
<g class="a e13"><rect class="bx" x="40" y="502" width="420" height="62" rx="8"/><text class="sm tk" x="54" y="524">исходный пакет: не меняется</text><text class="m" x="54" y="545">th_seq = T · данные: 250 байт</text></g>
<g class="a e14"><path class="lf" d="M466 533L484.0 533.0"/><polygon class="hf" points="494,533 484.0,538.0 484.0,528.0"/><rect class="bxb" x="500" y="502" width="420" height="62" rx="8"/><text class="sm tk" x="514" y="524">копия для второй части</text><text class="m" x="514" y="545">th_seq = T + 104 · данные: 146 байт</text></g>
</svg>
