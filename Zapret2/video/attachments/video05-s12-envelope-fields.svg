<svg xmlns="http://www.w3.org/2000/svg" class="v05-s12-envelope-fields" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v05-s12-envelope-fields-t v05-s12-envelope-fields-d">
<title id="v05-s12-envelope-fields-t">Конверт и поля пакета</title>
<desc id="v05-s12-envelope-fields-d">Выдуманный конверт-шаблон с окнами «от кого и кому», «штампы», «письмо» и «со страницы N» копируется, в копию кладут другой листок и исправляют номер страницы, остальное остаётся прежним, и то же самое делает отправщик части с полями пакета: адреса, порты, флаги TCP, окно, номер подтверждения и опции копируются с обрабатываемого пакета, меняются данные (часть) и порядковый номер (исходный номер плюс сдвиг), идентификатор IP ставится позже при отправке; для второй части нашего опыта копия несёт 146 байт данных и номер T + 104, а исходный пакет с 250 байтами и номером T не меняется.</desc>
<style>.v05-s12-envelope-fields{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v05-s12-envelope-fields{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v05-s12-envelope-fields .bg{fill:var(--bg)}
.v05-s12-envelope-fields text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v05-s12-envelope-fields .tk{font-weight:600;fill:var(--fg)}
.v05-s12-envelope-fields .sm{font-size:14.5px}
.v05-s12-envelope-fields .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v05-s12-envelope-fields .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v05-s12-envelope-fields .hx{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14px;font-weight:600;fill:var(--fg);stroke:none}
.v05-s12-envelope-fields .ix{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px;fill:var(--mute);stroke:none}
.v05-s12-envelope-fields .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v05-s12-envelope-fields .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v05-s12-envelope-fields .mu{fill:var(--mute)}.v05-s12-envelope-fields .fg{fill:var(--fg)}.v05-s12-envelope-fields .acc{fill:var(--acc)}.v05-s12-envelope-fields .rej{fill:var(--rej)}.v05-s12-envelope-fields .ok{fill:var(--ok)}.v05-s12-envelope-fields .amb{fill:var(--amb)}
.v05-s12-envelope-fields .c{text-anchor:middle}.v05-s12-envelope-fields .r{text-anchor:end}.v05-s12-envelope-fields .ns{stroke:none}
.v05-s12-envelope-fields .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v05-s12-envelope-fields .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v05-s12-envelope-fields .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v05-s12-envelope-fields .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v05-s12-envelope-fields .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v05-s12-envelope-fields .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v05-s12-envelope-fields .pl{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.v05-s12-envelope-fields .fs{fill:var(--mute);fill-opacity:.22;stroke:none}
.v05-s12-envelope-fields .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v05-s12-envelope-fields .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v05-s12-envelope-fields .fa{fill:var(--tint);stroke:none}.v05-s12-envelope-fields .fr{fill:var(--rejt);stroke:none}.v05-s12-envelope-fields .fb{fill:var(--ambt);stroke:none}.v05-s12-envelope-fields .fo{fill:var(--okt);stroke:none}
.v05-s12-envelope-fields .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v05-s12-envelope-fields .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v05-s12-envelope-fields .la{fill:none;stroke:var(--acc);stroke-width:2}
.v05-s12-envelope-fields .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v05-s12-envelope-fields .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v05-s12-envelope-fields .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v05-s12-envelope-fields .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v05-s12-envelope-fields .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v05-s12-envelope-fields .hf{fill:var(--fg2)}.v05-s12-envelope-fields .ha{fill:var(--acc)}.v05-s12-envelope-fields .hr{fill:var(--rej)}.v05-s12-envelope-fields .hm{fill:var(--mute)}.v05-s12-envelope-fields .hb{fill:var(--amb)}
.v05-s12-envelope-fields .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v05-s12-envelope-fields .a{animation-duration:46s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v05-s12-envelope-fields .a{animation:none}.v05-s12-envelope-fields .tr{display:none}}
