<g class="a e18"><text class="sm mu" x="40" y="430">Служебные биты маска отбрасывает. Такие значения в наших журналах не встречались: это арифметика.</text></g>
<g class="a e19"><text class="cap" x="40" y="462">приёмщик, switch (verdict &amp; VERDICT_MASK): nfqws.c:327-338</text></g>
