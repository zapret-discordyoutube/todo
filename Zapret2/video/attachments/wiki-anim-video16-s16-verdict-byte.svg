<svg xmlns="http://www.w3.org/2000/svg" class="v16-s16-verdict-byte" viewBox="0 0 960 684" width="960" height="684" role="img" aria-labelledby="v16-s16-verdict-byte-t v16-s16-verdict-byte-d">
<title id="v16-s16-verdict-byte-t">Байт вердикта и ответ ядру</title>
<desc id="v16-s16-verdict-byte-d">Проходная processPacketData (nfqws.c:154-164, одиннадцать строк) и байт вердикта. Вход: адрес метки mark, имена интерфейсов ifin и ifout, байты пакета data_pkt и len_pkt, буфер для изменённого пакета mod_pkt и адрес его длины len_mod_pkt. Выход: один байт вердикта. Строки 157-161: если у метки есть бит программы (params.desync_fwmark), пакет пропускается без обработки (VERDICT_PASS), к этому вернёмся в третьей части; строка 163: вызов движка dpi_desync_packet, его ответ возвращается. Байт вердикта: значение и служебные биты. Константы darkmagic.h:101-108: PASS 0, MODIFY 1, DROP 2, MASK 3 (оставляет два младших бита), служебные PRESERVE_NEXT 4 и NOCSUM 8. Примеры арифметики: 9 AND 3 = 1, MODIFY (хитрость с первым пакетом соединения возвращает MODIFY с битом 8); 10 AND 3 = 2, DROP; 12 AND 3 = 0, PASS; таких значений в наших журналах не было. Дальше приёмщик nfq_cb делает switch по verdict AND VERDICT_MASK (nfqws.c:327-338): MODIFY, строки 329-331, пишет «pass modified. len A =&gt; B» и зовёт nfq_set_verdict2 с шестью аргументами: ручка очереди qh, номер пакета id, вердикт NF_ACCEPT (1), метка mark, длина новых байтов и сами байты из отдельного буфера; DROP, строки 332-334, пишет «drop» и зовёт nfq_set_verdict2 с NF_DROP (0), без байтов; ветки PASS нет: всё остальное доходит до строк 337-338, «pass unmodified» и NF_ACCEPT без новых байтов, те же строки при ilen меньше нуля. Метка во всех трёх случаях возвращается та же, что пришла; что ядро делает с этим аргументом, не читали.</desc>
