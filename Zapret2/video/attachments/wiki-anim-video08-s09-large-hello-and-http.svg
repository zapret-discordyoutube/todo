<svg xmlns="http://www.w3.org/2000/svg" class="video08-s09-large-hello-and-http" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="video08-s09-large-hello-and-http-t video08-s09-large-hello-and-http-d">
<title id="video08-s09-large-hello-and-http-t">Большое приветствие и HTTP</title>
<desc id="video08-s09-large-hello-and-http-d">Длинное приветствие и запрос HTTP с fakedsplit и условием MD5: в игрушке фургон вмещает десять коробок, а с наклейкой только восемь, поэтому одну стопку делят в разных местах; приветствие в 1484 байта с меткой midsld уходит теми же шестью пакетами, фейк и настоящая часть по 104 байта, затем фейк, настоящая часть и фейк по 1380 байт, перед этим программа удерживает куски, собирает приветствие целиком и проигрывает его заново, сервер читает 1484 байта, равных оригиналу; запрос HTTP в 81 байт с меткой midsld внутри имени в заголовке Host даёт те же шесть пакетов с частями по 39 и 42 байта, и сервер читает запрос целиком с верным именем.</desc>
