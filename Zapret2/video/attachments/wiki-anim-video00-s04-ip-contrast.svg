<title id="v00-s04-ip-contrast-t">Семь стратегий против двух блокировок</title>
<desc id="v00-s04-ip-contrast-d">Сравнение на одинаковом наборе из семи стратегий проверки и одном веб-сервере в нашем тесте: когда игрушечное правило роутера выбрасывало только пакеты с именем сайта, помогли три стратегии из семи, а когда оно выбрасывало все пакеты к адресу сервера, не помогла ни одна, правило выбросило 27 пакетов и проверка не нашла рабочей стратегии; обе блокировки наши, игрушечные.</desc>
