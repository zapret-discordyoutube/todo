<g class="a e8"><path class="la" d="M642 224.0H662"/><text class="sm tk" x="670" y="219">профиль берётся из записи</text><text class="sm" x="670" y="238">о соединении</text></g>
<g class="a e9"><rect class="bx" x="40" y="262" width="600" height="228" rx="6"/><rect x="40" y="265" width="5" height="222" rx="2" fill="var(--acc)"/><text class="mn" x="56" y="282">packet contains tls_client_hello payload</text><text class="mn mk" x="56" y="304">TLS client hello is FULL</text><text class="mn" x="56" y="326">TLS record layer version : TLS 1.0</text><text class="mn" x="56" y="348">TLS handshake version : TLS 1.2</text><text class="mn" x="56" y="370">TLS supported versions ext : TLS 1.3</text><text class="mn" x="56" y="392">TLS ALPN ext : not present</text><text class="mn mk" x="56" y="414">TLS ECH ext : not present</text><text class="mn mk acc" x="56" y="436">hostname: www.example.com</text><text class="mn" x="56" y="458">discovered l7 protocol</text><text class="mn" x="56" y="480">discovered hostname</text></g>
