<title id="v00-s09-log-dissect-t">Один пакет в журнале программы: разбор, запись о соединении, имя сайта</title>
<desc id="v00-s09-log-dissect-d">В нашем тесте журнал программы по одному запросу в 250 байт показывает, что пакет пришёл с длиной 302, это 250 байт данных и 52 байта заголовков, программа разобрала слои IP и TCP, нашла профиль в записи о соединении, по сигнатуре узнала целое клиентское приветствие защищённого соединения без расширения ECH и прочитала имя сайта, и всё это сделала Си-часть программы, слов Lua в этих строках ещё нет.</desc>
