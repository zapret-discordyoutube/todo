<svg xmlns="http://www.w3.org/2000/svg" class="v02-s15-http-host" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v02-s15-http-host-t v02-s15-http-host-d">
<title id="v02-s15-http-host-t">Имя сайта в заголовке Host</title>
<desc id="v02-s15-http-host-d">Тот же 81-байтный запрос HTTP текстом, смещения с нуля: строка GET /index.html HTTP/1.1 (0–23), строка Host: www.example.com (26–46, само имя 32–46), User-Agent: lab (49–63), Accept: */* (66–76) и пустая строка (79–80), после каждой строки два байта конца строки; те же 15 байт имени лежат в TLS по смещениям 97–111 внутри трёх вложенных длин, а в HTTP по смещениям 32–46 просто текстом между пробелом и концом строки, поэтому его легче найти: программа ищет строку Host с двоеточием и читает дальше (nfq2/protocol.c:361); современные сайты работают по HTTPS, где открытое имя, как правило, есть только в TLS.</desc>
