<g class="a e1"><text class="cap" x="10" y="24">обычный запрос HTTP: 81 байт текста, смещения с нуля</text></g>
<g class="a e2"><rect class="bx" x="6" y="66" width="260" height="34" rx="5"/><text class="hx c" y="89"><tspan x="19.0">G</tspan><tspan x="29.0">E</tspan><tspan x="39.0">T</tspan><tspan x="49.0"> </tspan><tspan x="59.0">/</tspan><tspan x="69.0">i</tspan><tspan x="79.0">n</tspan><tspan x="89.0">d</tspan><tspan x="99.0">e</tspan><tspan x="109.0">x</tspan><tspan x="119.0">.</tspan><tspan x="129.0">h</tspan><tspan x="139.0">t</tspan><tspan x="149.0">m</tspan><tspan x="159.0">l</tspan><tspan x="169.0"> </tspan><tspan x="179.0">H</tspan><tspan x="189.0">T</tspan><tspan x="199.0">T</tspan><tspan x="209.0">P</tspan><tspan x="219.0">/</tspan><tspan x="229.0">1</tspan><tspan x="239.0">.</tspan><tspan x="249.0">1</tspan></text><text class="mt mu" x="278" y="88">0–23</text><rect class="bx" x="350" y="72" width="100" height="24" rx="5"/><text class="mt c mu" x="400" y="89">CRLF 24–25</text></g>
<g class="a e3"><rect class="bx" x="6" y="118" width="260" height="34" rx="5"/><rect class="bxa" x="12" y="122" width="52" height="26" rx="3"/><text class="hx c" y="141"><tspan x="19.0">H</tspan><tspan x="29.0">o</tspan><tspan x="39.0">s</tspan><tspan x="49.0">t</tspan><tspan x="59.0">:</tspan><tspan x="69.0"> </tspan><tspan x="79.0">w</tspan><tspan x="89.0">w</tspan><tspan x="99.0">w</tspan><tspan x="109.0">.</tspan><tspan x="119.0">e</tspan><tspan x="129.0">x</tspan><tspan x="139.0">a</tspan><tspan x="149.0">m</tspan><tspan x="159.0">p</tspan><tspan x="169.0">l</tspan><tspan x="179.0">e</tspan><tspan x="189.0">.</tspan><tspan x="199.0">c</tspan><tspan x="209.0">o</tspan><tspan x="219.0">m</tspan></text><text class="mt mu" x="278" y="140">26–46</text><rect class="bx" x="350" y="124" width="100" height="24" rx="5"/><text class="mt c mu" x="400" y="141">CRLF 47–48</text></g>
<g class="a e4"><rect class="bx" x="6" y="170" width="260" height="34" rx="5"/><text class="hx c" y="193"><tspan x="19.0">U</tspan><tspan x="29.0">s</tspan><tspan x="39.0">e</tspan><tspan x="49.0">r</tspan><tspan x="59.0">-</tspan><tspan x="69.0">A</tspan><tspan x="79.0">g</tspan><tspan x="89.0">e</tspan><tspan x="99.0">n</tspan><tspan x="109.0">t</tspan><tspan x="119.0">:</tspan><tspan x="129.0"> </tspan><tspan x="139.0">l</tspan><tspan x="149.0">a</tspan><tspan x="159.0">b</tspan></text><text class="mt mu" x="278" y="192">49–63</text><rect class="bx" x="350" y="176" width="100" height="24" rx="5"/><text class="mt c mu" x="400" y="193">CRLF 64–65</text></g>
<g class="a e5"><rect class="bx" x="6" y="222" width="260" height="34" rx="5"/><text class="hx c" y="245"><tspan x="19.0">A</tspan><tspan x="29.0">c</tspan><tspan x="39.0">c</tspan><tspan x="49.0">e</tspan><tspan x="59.0">p</tspan><tspan x="69.0">t</tspan><tspan x="79.0">:</tspan><tspan x="89.0"> </tspan><tspan x="99.0">*</tspan><tspan x="109.0">/</tspan><tspan x="119.0">*</tspan></text><text class="mt mu" x="278" y="244">66–76</text><rect class="bx" x="350" y="228" width="100" height="24" rx="5"/><text class="mt c mu" x="400" y="245">CRLF 77–78</text></g>
<g class="a e6"><rect class="bx" x="6" y="274" width="260" height="34" rx="5"/><text class="sm mu" x="18" y="296">пусто: конец заголовков</text><rect class="bx" x="350" y="280" width="100" height="24" rx="5"/><text class="mt c mu" x="400" y="297">CRLF 79–80</text></g>
<g class="a e7"><rect class="bxb" x="72" y="122" width="152" height="26" rx="3"/><text class="ix" x="74" y="114">32</text><text class="ix c" x="220" y="114">46</text><text class="ix" x="14" y="114">26</text></g>
<g class="a e8"><text class="sm" x="10" y="334">Host: имя заголовка (26–30), пробел (31), значение 32–46</text><text class="sm mu" x="10" y="356">CRLF: два байта 0d 0a, конец строки</text></g>
<g class="a e9"><text class="cap" x="500" y="62">одно и то же имя в двух упаковках</text></g>
<g class="a e10"><rect class="bx" x="500" y="74" width="450" height="106" rx="8"/><text class="tk" x="514" y="98">TLS: расширение SNI</text><rect class="bxa" x="514" y="110" width="48" height="28" rx="4"/><text class="hx c" x="538" y="129">00 00</text><rect class="bxb" x="566" y="110" width="48" height="28" rx="4"/><text class="hx c" x="590" y="129">00 14</text><rect class="bxb" x="618" y="110" width="48" height="28" rx="4"/><text class="hx c" x="642" y="129">00 12</text><rect class="bxa" x="670" y="110" width="48" height="28" rx="4"/><text class="hx c" x="694" y="129">00</text><rect class="bxb" x="722" y="110" width="48" height="28" rx="4"/><text class="hx c" x="746" y="129">00 0f</text><rect class="bxo" x="774" y="110" width="164" height="28" rx="4"/><text class="mk c" x="856" y="130">www.example.com</text><text class="sm mu" x="514" y="164">смещения 97–111, перед ним три длины</text></g>
<g class="a e11"><rect class="bx" x="500" y="194" width="450" height="106" rx="8"/><text class="tk" x="514" y="218">HTTP: строка Host</text><rect class="bxa" x="514" y="230" width="60" height="28" rx="4"/><text class="mk c" x="544" y="249">Host:</text><rect class="bxb" x="578" y="230" width="164" height="28" rx="4"/><text class="mk c" x="660" y="250">www.example.com</text><text class="sm mu" x="514" y="284">смещения 32–46, обычный текст до конца строки</text></g>
<g class="a e12"><rect class="bxo" x="500" y="316" width="450" height="110" rx="8"/><text class="tk" x="514" y="340">Как найти имя</text><text class="sm" x="514" y="363">TLS: пройти по длинам до блока с типом 0</text><text class="sm" x="514" y="385">HTTP: найти «Host:» и прочитать слово после него</text><text class="sm mu" x="514" y="405">поэтому в HTTP имя искать проще</text></g>
<g class="a e13"><text class="tk" x="10" y="470">Современные сайты работают по HTTPS, а там открытое имя, как правило, только в TLS.</text></g>
<g class="a e14"><text class="sm" x="10" y="494">И в TLS, и в HTTP это открытый текст: наблюдатель может его прочитать, если знает, где искать.</text></g>
<g class="a e15"><text class="sm mu" x="10" y="518">zapret2: nfq2/protocol.c:361 (HttpExtractHost, ищет «\nHost:»), nfq2/protocol.c:646 (TLSAdvanceToHostInSNI).</text></g>
</svg>
