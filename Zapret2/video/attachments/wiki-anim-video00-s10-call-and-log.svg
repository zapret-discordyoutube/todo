<g><text class="cap" x="24" y="24">вызов стратегии: Си-часть готовит таблицу, Lua отвечает</text></g>
<g class="a e1"><rect class="bxa" x="24" y="40" width="262" height="132" rx="8"/><text class="tk" x="40" y="64">Си-часть</text><text class="sm" x="40" y="86">собирает таблицу о пакете</text></g>
<g class="a e2"><rect class="bx" x="40" y="98" width="112" height="28" rx="5"/><text class="sm c" x="96" y="117">что в пакете</text><rect class="bx" x="162" y="98" width="112" height="28" rx="5"/><text class="sm c" x="218" y="117">соединение</text><rect class="bx" x="40" y="132" width="112" height="28" rx="5"/><text class="sm c" x="96" y="151">профиль</text><rect class="bx" x="162" y="132" width="112" height="28" rx="5"/><text class="sm c" x="218" y="151">направление</text></g>
<g class="a e3"><path class="lf" d="M290 106L308.0 106.0"/><polygon class="hf" points="318,106 308.0,111.0 308.0,101.0"/></g>
<g class="a e4"><rect class="bxb" x="322" y="40" width="270" height="132" rx="8"/><text class="tk" x="338" y="64">привратник</text><text class="sm" x="338" y="92">номер пакета и вид данных</text><text class="sm" x="338" y="114">проверяет Си-часть:</text><text class="sm" x="338" y="136">Lua зря не будят</text></g>
<g class="a e5"><path class="lf" d="M596 106L612.0 106.0"/><polygon class="hf" points="622,106 612.0,111.0 612.0,101.0"/></g>
<g class="a e6"><rect class="bxo" x="626" y="40" width="310" height="132" rx="8"/><text class="tk" x="642" y="64">функция на Lua</text><text class="sm" x="642" y="88">имя записано в строке профиля</text><rect class="bx" x="642" y="100" width="280" height="30" rx="5"/><text class="lg c" x="782" y="120">--lua-desync=multisplit:pos=midsld</text><text class="sm mu" x="642" y="154">Си-часть зовёт её по имени</text></g>
<g class="a e7"><text class="sm mu" x="24" y="196">одна и та же таблица идёт всем вызовам профиля по очереди</text></g>
<g class="a e8"><rect class="bxb" x="24" y="208" width="912" height="32" rx="6"/><text class="sm tk" x="40" y="229">все вызовы вне своих диапазонов: Lua до конца соединения больше не трогают</text></g>
<g class="a e9"><text class="sm tk" x="24" y="268">вторая половина журнала одного пакета</text></g>
<g class="a e10"><rect class="bxa" x="786" y="249" width="157" height="26" rx="13.0"/><text class="sm tk c" x="864.5" y="267">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e11"><rect class="bxa" x="24" y="282" width="145" height="26" rx="13.0"/><text class="sm c" x="96.5" y="300">строки Си-части</text><rect class="bxo" x="183" y="282" width="216" height="26" rx="13.0"/><text class="sm c" x="291" y="300">строки с приставкой LUA:</text></g>
<g class="a e12"><rect class="bx" x="24" y="320" width="592" height="196" rx="8"/></g>
