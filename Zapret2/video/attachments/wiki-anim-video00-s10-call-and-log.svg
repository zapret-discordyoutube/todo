<svg xmlns="http://www.w3.org/2000/svg" class="v00-s10-call-and-log" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="v00-s10-call-and-log-t v00-s10-call-and-log-d">
<title id="v00-s10-call-and-log-t">Вызов стратегии и журнал</title>
<desc id="v00-s10-call-and-log-d">Вызов стратегии: Си-часть собирает одну таблицу о пакете, сама проверяет номер пакета и вид данных и только потом вызывает функцию на Lua, имя которой записано в настройках профиля, а если все вызовы вышли за свои диапазоны, Lua до конца соединения не трогают; в нашем тесте во второй половине журнала Lua пишет, что режет посередине имени сайта, находит 104-й байт, а отправку частей в 104 и 146 байт каждый раз выполняет Си-часть, и последняя строка сообщает, что исходный пакет выброшен.</desc>
<style>.v00-s10-call-and-log{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
