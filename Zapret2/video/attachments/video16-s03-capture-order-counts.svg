<svg xmlns="http://www.w3.org/2000/svg" class="v16-s03-capture-order-counts" viewBox="0 0 960 676" width="960" height="676" role="img" aria-labelledby="v16-s03-capture-order-counts-t v16-s03-capture-order-counts-d">
<title id="v16-s03-capture-order-counts-t">Порядок записей и счёт пакетов</title>
<desc id="v16-s03-capture-order-counts-d">Как в нашей лаборатории проверено, что программа стоит на пути пакетов. Запись на интерфейсе клиента c0 видит входящий пакет раньше программы, а исходящий позже: в опыте t10 входящий SYN-ACK сначала записан интерфейсом, потом программой, исходящий SYN сначала программой, потом интерфейсом. Так во всех сопоставимых пакетах: 10 из 10 в опыте pass (t01) и 10 из 10 в t10 (11 пакетов минус один выброшенный запрос), всего 20 из 20. Счёт в t10: в очереди 6 исходящих, минус 1 выброшенный запрос, плюс 2 вставленные части (104 и 146 байт), получается 7 исходящих на интерфейсе; входящих 5 в очереди и 5 на интерфейсе. В опыте pass в очереди и на интерфейсе по 6 исходящих и 4 входящих.</desc>
