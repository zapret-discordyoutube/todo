<rect class="bg" x="0" y="0" width="960" height="676"/>
<g><text class="cap" x="40" y="26">Лаборатория: где записан пакет и сколько пакетов прошло</text></g>
<g class="a e1"><text class="tk sm" x="40" y="54">Входящий: SYN-ACK сервера (опыт t10)</text></g>
<g class="a e2"><rect class="bxa" x="40" y="76" width="260" height="42" rx="6"/><text class="tk sm c ns" x="170" y="103">запись интерфейса c0</text><circle class="pl" cx="40" cy="76" r="12"/><text class="tk c ns" x="40" y="81">1</text></g>
<g class="a e3"><path class="lf" d="M304 97L326.0 97.0"/><polygon class="hf" points="336,97 326.0,102.0 326.0,92.0"/><rect class="bxb" x="340" y="76" width="260" height="42" rx="6"/><text class="tk sm c ns" x="470" y="103">запись программы nfqws2</text><circle class="pl" cx="340" cy="76" r="12"/><text class="tk c ns" x="340" y="81">2</text></g>
<g class="a e4"><text class="sm" x="630" y="94">на интерфейс пришёл раньше,</text><text class="sm" x="630" y="114">чем к программе</text></g>
<g class="a e5"><text class="tk sm" x="40" y="144">Исходящий: SYN клиента (опыт t10)</text></g>
<g class="a e6"><rect class="bxb" x="40" y="166" width="260" height="42" rx="6"/><text class="tk sm c ns" x="170" y="193">запись программы nfqws2</text><circle class="pl" cx="40" cy="166" r="12"/><text class="tk c ns" x="40" y="171">1</text></g>
<g class="a e7"><path class="lf" d="M304 187L326.0 187.0"/><polygon class="hf" points="336,187 326.0,192.0 326.0,182.0"/><rect class="bxa" x="340" y="166" width="260" height="42" rx="6"/><text class="tk sm c ns" x="470" y="193">запись интерфейса c0</text><circle class="pl" cx="340" cy="166" r="12"/><text class="tk c ns" x="340" y="171">2</text></g>
<g class="a e8"><text class="sm" x="630" y="184">программа записала раньше,</text><text class="sm" x="630" y="204">интерфейс позже</text></g>
<g class="a e9"><text class="tk" style="font-size:44px" x="40" y="282">20 из 20</text></g>
<g class="a e10"><text class="sm" x="290" y="250">опыт pass (t01): 10 пакетов из 10</text></g>
<g class="a e11"><text class="sm" x="290" y="272">опыт t10: 11 пакетов − 1 выброшенный запрос = 10 из 10</text></g>
<g class="a e12"><text class="tk sm" x="290" y="294">10 + 10 = 20, исключений нет</text></g>
<g class="a e13"><text class="sm mu" x="40" y="332">Порядок согласуется с тем, что программа стоит на пути; прямо это показывает выброшенный запрос.</text></g>
<g class="a e14"><text class="tk" x="40" y="378">Счёт пакетов в t10 (в нашем тесте)</text></g>
<g class="a e15"><text class="cap" x="40" y="402">ИСХОДЯЩИЕ</text></g>
<g class="a e16"><rect class="bx" x="40" y="412" width="190" height="56" rx="6"/><text class="ml c ns" x="135" y="438">6</text><text class="sm c ns" x="135" y="458">исходящих в очереди</text></g>
<g class="a e17"><rect class="bxr" x="242" y="412" width="200" height="56" rx="6"/><text class="ml c ns" x="342" y="438">− 1</text><text class="sm c ns" x="342" y="458">выброшен: наш запрос</text></g>
<g class="a e18"><rect class="bxo" x="454" y="412" width="220" height="56" rx="6"/><text class="ml c ns" x="564" y="438">+ 2</text><text class="sm c ns" x="564" y="458">вставлены: 104 и 146 байт</text></g>
<g class="a e19"><rect class="bxa" x="686" y="412" width="234" height="56" rx="6"/><text class="ml c ns" x="803" y="438">= 7</text><text class="sm c ns" x="803" y="458">исходящих на c0</text></g>
<g class="a e20"><text class="cap" x="40" y="498">ВХОДЯЩИЕ</text></g>
<g class="a e21"><rect class="bx" x="40" y="508" width="190" height="56" rx="6"/><text class="ml c ns" x="135" y="534">5</text><text class="sm c ns" x="135" y="554">входящих в очереди</text></g>
<g class="a e22"><rect class="bxa" x="686" y="508" width="234" height="56" rx="6"/><text class="ml c ns" x="803" y="534">= 5</text><text class="sm c ns" x="803" y="554">входящих на c0</text></g>
<g class="a e23"><text class="sm" x="250" y="530">их программа не выбрасывала и не добавляла</text><path class="lm" d="M236 536L670.0 536.0"/><polygon class="hm" points="680,536 670.0,541.0 670.0,531.0"/></g>
<g class="a e24"><text class="sm" x="40" y="598">Опыт pass (t01): в очереди 6 исходящих и 4 входящих, на интерфейсе c0 те же 6 и 4,</text><text class="sm" x="40" y="620">ничего не вычитали и не добавляли.</text></g>
<g class="a e25"><text class="tk sm" x="40" y="652">Выброшенный запрос на провод как есть не вышел, вышли две его части.</text></g>
</svg>
