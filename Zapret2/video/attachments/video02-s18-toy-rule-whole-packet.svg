<rect class="bg" x="0" y="0" width="960" height="490"/>
<g class="a e1"><rect class="bx" x="10" y="10" width="940" height="112" rx="8"/><text class="tk" x="26" y="34">Правило в роутере (игрушка для показа идеи, не копия чьего-то оборудования)</text><text class="m" x="26" y="62">tcp dport 443  @th,1032,120  0x7777772e6578616d706c652e636f6d  counter drop</text><text class="sm" x="26" y="86">@th,1032,120 = 15 байт с байта 129 заголовка TCP; константа 0x7777772e… это www.example.com</text><text class="sm" x="26" y="108"><tspan class="hb">129</tspan><tspan> = 32 (заголовок TCP) + 97 (смещение имени в данных). Правило ничего не разбирает и ничего не помнит.</tspan></text></g>
<g class="a e2"><text class="tk sm" x="10" y="152">целый запрос: заголовок TCP и 250 байт данных, нумерация с нуля</text><rect class="bxs" x="30" y="164" width="102.1" height="30" rx="3"/><text class="sm c" x="81.05" y="184">TCP</text><rect class="bx" x="132.1" y="164" width="797.9" height="30" rx="3"/><text class="sm c mu" x="668.3" y="184">данные: 250 байт</text></g>
<g class="a e3"><rect class="bxa" x="441.7" y="161" width="47.9" height="36" rx="3"/><path class="lm" d="M441.7 198L441.7 210"/><text class="mt c" x="441.7" y="226">129</text><path class="lm" d="M489.6 198L489.6 210"/><text class="mt c" x="489.6" y="226">143</text></g>
