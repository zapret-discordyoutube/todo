<svg xmlns="http://www.w3.org/2000/svg" class="v02-s18-toy-rule" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="v02-s18-toy-rule-t v02-s18-toy-rule-d">
<title id="v02-s18-toy-rule-t">Игрушечный инспектор и целый запрос</title>
<desc id="v02-s18-toy-rule-d">Игрушечный инспектор из первого выпуска сравнивает 15 байт по фиксированному смещению 129 от начала заголовка TCP (32 + 97) с www.example.com; в целом запросе на 250 байт эти байты совпали, пакет выброшен, клиент повторил его ещё пять раз, и счётчик правила показал 6 пакетов, 1812 байт (6 × 302), а сервер не получил ни одного байта.</desc>
<style>.v02-s18-toy-rule{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
