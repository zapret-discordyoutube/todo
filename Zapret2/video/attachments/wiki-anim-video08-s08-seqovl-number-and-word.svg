<svg xmlns="http://www.w3.org/2000/svg" class="video08-s08-seqovl-number-and-word" viewBox="0 0 960 644" width="960" height="644" role="img" aria-labelledby="video08-s08-seqovl-number-and-word-t video08-s08-seqovl-number-and-word-d">
<title id="video08-s08-seqovl-number-and-word-t">Накладка: число и слово</title>
<desc id="video08-s08-seqovl-number-and-word-d">Накладка seqovl в fakedsplit записывается только числом: в игрушке перед первой пачкой подшиты пять лишних листов с номерами раньше первой страницы и получатель их откладывает; при seqovl равном 5 первая настоящая часть растёт на пять нулевых байт до 109 байт и начинается с номера минус 4, сервер отвечает подтверждением 105 и блоком дубля от минус 4 до 1, при seqovl равном 50 получается 154 байта с номером минус 49 и блоком от минус 49 до 1, а приложение в обоих запусках читает все 250 байт оригинала; если вместо числа написать слово, функция падает на сравнении числа с пустым значением уже после первого фейка, на проводе остаются фейк первой части и оригинал целиком с тем же ip id, а в журнале ошибка и запись о том, что пакет проходит без изменений.</desc>
