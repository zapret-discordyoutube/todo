<rect class="bg" x="0" y="0" width="960" height="644"/>
<g><text class="cap" x="40" y="22">накладка</text><text class="mk mu ns" x="140.930625" y="22">seqovl</text><text class="cap" x="203.30874999999997" y="22">в fakedsplit: только число</text></g>
<g class="a e1"><rect class="bxd" x="40" y="32" width="880" height="78" rx="8"/><text class="cap" x="54" y="50">игрушка (выдуманный пример): лишние листы перед первой страницей</text><rect class="bxb" x="54" y="60" width="262" height="42" rx="6"/><text class="sm c ns" x="185" y="77">пять лишних листов</text><text class="sm tk c ns" x="185" y="95">раньше первой страницы</text><path class="lm" d="M318 81L329.0 81.0"/><polygon class="hm" points="336,81 329.0,84.5 329.0,77.5"/><rect class="bx" x="340" y="60" width="262" height="42" rx="6"/><text class="sm c ns" x="471" y="77">получатель знает:</text><text class="sm tk c ns" x="471" y="95">в книге таких нет</text><path class="lm" d="M604 81L615.0 81.0"/><polygon class="hm" points="622,81 615.0,84.5 615.0,77.5"/><rect class="bxr" x="626" y="60" width="262" height="42" rx="6"/><text class="sm c ns" x="757" y="77">поэтому он откладывает</text><text class="sm tk c ns" x="757" y="95">лишние листы в сторону</text></g>
<g class="a e2"><text class="cap" x="40" y="132">на ленте номеров: относительные номера, первый байт данных это 1</text></g>
<g class="a e3"><path class="lm" d="M60 154L900 154"/><path class="lm" d="M60.0 149L60.0 159"/><text class="ix mu c" x="60.0" y="144">-49</text><path class="lm" d="M186.0 149L186.0 159"/><text class="ix mu c" x="186.0" y="144">-4</text><path class="lm" d="M200.0 149L200.0 159"/><text class="ix mu c" x="200.0" y="174">1</text><path class="lm" d="M491.2 149L491.2 159"/><text class="ix mu c" x="491.2" y="144">105</text><path class="lm" d="M900.0 149L900.0 159"/><text class="ix mu c" x="900.0" y="144">251</text></g>
<g class="a e4"><text class="mk ns" x="40" y="204">seqovl=5</text><text class="sm ns" x="170" y="204">пакет 109 байт = 5 + 104, номер 1 - 5 = -4</text><rect class="bxd" x="200.0" y="214" width="700.0" height="30" rx="3"/><text class="sm mu c ns" x="695.6" y="234">вторая часть: 146 байт</text><rect class="bxb" x="186.0" y="214" width="14.0" height="30" rx="3"/><rect class="bxa" x="200.0" y="214" width="291.2" height="30" rx="3"/><text class="sm tk c ns" x="345.6" y="234">настоящая часть: 104</text></g>
<g class="a e5"><text class="sm amb ns" x="186.0" y="262">нули × 5 (лишние)</text><rect class="bxb" x="40" y="272" width="880" height="30" rx="6"/><text class="sm ns" x="54" y="292">ответ сервера: ACK 105 и блок [-4,1): пять байт перед окном названы повтором</text></g>
<g class="a e6"><text class="mk ns" x="40" y="332">seqovl=50</text><text class="sm ns" x="170" y="332">пакет 154 байта = 50 + 104, номер 1 - 50 = -49</text><rect class="bxd" x="200.0" y="342" width="700.0" height="30" rx="3"/><text class="sm mu c ns" x="695.6" y="362">вторая часть: 146 байт</text><rect class="bxb" x="60.0" y="342" width="140.0" height="30" rx="3"/><rect class="bxa" x="200.0" y="342" width="291.2" height="30" rx="3"/><text class="sm tk c ns" x="345.6" y="362">настоящая часть: 104</text></g>
<g class="a e7"><text class="sm amb ns" x="60.0" y="390">нули × 50 (лишние)</text><rect class="bxb" x="40" y="400" width="880" height="30" rx="6"/><text class="sm ns" x="54" y="420">ответ сервера: ACK 105 и блок [-49,1); приложение в обоих запусках: 250 байт, оригинал</text></g>
<g class="a e8"><text class="cap" x="40" y="452">ловушка: слово вместо числа</text><text class="mk mu ns" x="333.6834375" y="452">seqovl=host</text></g>
<g class="a e9"><rect class="bx" x="40" y="464" width="430" height="82" rx="8"/><text class="smk ns" x="54" y="484">на проводе нашего теста</text><rect class="bxb" x="54" y="496" width="120" height="34" rx="5"/><text class="mt c ns" x="114.0" y="518.0">F104@0</text><text class="sm mu ns" x="182" y="518">потом</text><rect class="bxs" x="236" y="496" width="140" height="34" rx="5"/><text class="mt c ns" x="306.0" y="518.0">R250@0 целиком</text><text class="sm ns" x="384" y="508">один</text><text class="sm ns" x="384" y="526">ip id</text></g>
<g class="a e10"><rect class="bxr" x="490" y="464" width="430" height="82" rx="8"/><text class="smk ns" x="504" y="484">журнал программы</text><text class="cd" x="504" y="508">LUA ERROR: ...attempt to compare number with nil</text><text class="cd" x="504" y="530">desync ERROR. passing packet unmodified.</text></g>
<g class="a e11"><rect class="bx" x="40" y="556" width="880" height="34" rx="6"/><text class="ix ns" x="54" y="578">866:</text><text class="cdh" x="94" y="578">if desync.arg.seqovl and tonumber(desync.arg.seqovl)&gt;0 then</text><text class="sm mu r ns" x="906" y="578">у слова нет числа</text></g>
<g class="a e12"><text class="sm" x="40" y="616">один фейк уже ушёл, потом оригинал целиком; в другой функции выпуска это слово метка, как в multidisorder</text></g>
</svg>
