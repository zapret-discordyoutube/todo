<rect class="bg" x="0" y="0" width="960" height="470"/>
<g><text class="cap" x="24" y="24">блок инструментов: четыре выпуска</text></g>
<g class="a e1"><rect class="bxb" x="24" y="44" width="446" height="186" rx="8"/><text class="tk" x="38" y="72">выпуск про blockcheck2</text><text class="sm mu" x="38" y="96">как скрипт находит стратегию, которая открывает</text><text class="sm mu" x="38" y="116">сайт?</text><text class="sm tk acc" x="38" y="144">после выпуска вы знаете:</text><text class="sm" x="38" y="166">цикл «запустить, проверить, остановить», проверки</text><text class="sm" x="38" y="186">запросами curl, сводка, уровни проверки и свои</text><text class="sm" x="38" y="206">списки; как читать отчёт и почему он не гарантия</text></g>
<g class="a e2"><rect class="bxb" x="490" y="44" width="446" height="186" rx="8"/><text class="tk" x="504" y="72">выпуск про автоматическую смену</text><text class="tk" x="504" y="92">стратегий</text><text class="sm mu" x="504" y="116">может ли программа переключаться сама?</text><text class="sm tk acc" x="504" y="144">после выпуска вы знаете:</text><text class="sm" x="504" y="166">признаки неудачи, пороги и автоматические списки</text><text class="sm" x="504" y="186">имён, и чем они отличаются от смены стратегий</text></g>
<g class="a e3"><rect class="bxb" x="24" y="244" width="446" height="166" rx="8"/><text class="tk" x="38" y="272">выпуск про установку и запуск</text><text class="sm mu" x="38" y="296">что должно стоять вокруг программы, чтобы она</text><text class="sm mu" x="38" y="316">работала каждый день и после перезагрузки?</text><text class="sm tk acc" x="38" y="344">после выпуска вы знаете:</text><text class="sm" x="38" y="366">файл настроек, правила ядра Linux, скрипты запуска,</text><text class="sm" x="38" y="386">установщик</text></g>
<g class="a e4"><rect class="bxb" x="490" y="244" width="446" height="166" rx="8"/><text class="tk" x="504" y="272">выпуск про обфускацию</text><text class="sm mu" x="504" y="296">что делать, если подозрительным выглядит сам</text><text class="sm mu" x="504" y="316">протокол?</text><text class="sm tk acc" x="504" y="344">после выпуска вы знаете:</text><text class="sm" x="504" y="366">инструменты маскировки и случаи, когда программа</text><text class="sm" x="504" y="386">нужна на обоих концах</text></g>
<g class="a e5"><text class="sm tk" x="24" y="438">инструментам не нужны выпуски про приёмы</text><text class="sm mu" x="24" y="460">выпуск про blockcheck2 удобно смотреть сразу после приёмов, а при желании и раньше</text></g>
</svg>
