<title id="v00-s20-tools-four-t">Четыре выпуска про инструменты</title>
<desc id="v00-s20-tools-four-d">Блок инструментов состоит из четырёх выпусков: про то, как blockcheck2 находит стратегию, которая открывает сайт, про автоматическую смену стратегий, про установку и запуск, чтобы стратегия работала каждый день, и про обфускацию на случай, когда подозрительным выглядит сам протокол.</desc>
