<g class="a e2"><rect class="bx" x="40" y="98" width="880" height="52" rx="7"/><circle class="bxa" cx="62" cy="124" r="12"/><text class="tk c ns" x="62" y="129">2</text><text class="sm tk" x="88" y="119">фейк без условия в паре с multisplit: соединение встало</text><text class="sm" x="88" y="139">приложение получило 680 байт чужого приветствия</text><rect class="bxa" x="708" y="106" width="76.6" height="20" rx="10"/><text class="ix c fg ns" x="746.3" y="120.5">наш тест</text></g>
