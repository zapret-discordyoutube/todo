<title id="v07-s01-three-names-t">Три имени: одно условие подделки</title>
<desc id="v07-s01-three-names-d">Три прежних имени одного механизма, подмена полей, подделки и английское fooling, сходятся в одно слово «условие подделки», то есть намеренный дефект подделки, без которого она вредит получателю, и это не то же самое, что условия профиля, которые решают, какие пакеты достаются профилю.</desc>
