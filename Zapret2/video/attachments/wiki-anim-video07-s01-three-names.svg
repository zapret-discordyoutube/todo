<rect class="bg" x="0" y="0" width="960" height="516"/>
<g><text class="cap" x="40" y="26">три имени одного механизма, и что с ним не путать</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="280" height="70" rx="8"/><text class="tk" x="54" y="68">«подмена полей»</text><text class="ix" x="54" y="90">выпуски «multisplit: резать на</text><text class="ix" x="54" y="106">части» и «Перемешать: disorder»</text></g>
<g class="a e2"><rect class="bx" x="340" y="44" width="280" height="70" rx="8"/><text class="tk" x="354" y="68">«подделки»</text><text class="ix" x="354" y="90">выпуск «multisplit: резать на</text><text class="ix" x="354" y="106">части»</text></g>
<g class="a e3"><rect class="bx" x="640" y="44" width="280" height="70" rx="8"/><text class="mk fg" x="654" y="68">fooling</text><text class="ix" x="654" y="90">английское слово, так назван</text><text class="ix" x="654" y="106">механизм в самой программе</text></g>
<g class="a e4"><path class="lf" d="M180 118L232.3 161.6"/><polygon class="hf" points="240,168 229.1,165.4 235.5,157.8"/><path class="lf" d="M480 118L369.2 164.2"/><polygon class="hf" points="360,168 367.3,159.5 371.2,168.8"/><path class="lf" d="M780 118L489.9 166.4"/><polygon class="hf" points="480,168 489,161.4 490.7,171.3"/></g>
<g class="a e5"><rect class="bxa" x="40" y="172" width="600" height="92" rx="10"/><text class="lg" x="58" y="202">условие подделки</text><text class="sm" x="320" y="202">коротко «условие»</text><text class="sm tk" x="58" y="228">намеренный дефект подделки,</text><text class="sm tk" x="58" y="250">без которого она вредит получателю</text></g>
<g class="a e6"><rect class="bx" x="690" y="172" width="230" height="92" rx="10"/><text class="lg mu" x="704" y="200">условия профиля</text><text class="sm" x="704" y="224">это другое: решают, какие</text><text class="sm" x="704" y="244">пакеты берёт профиль</text></g>
<g class="a e7"><text class="big mu c" x="665" y="226">≠</text></g>
<g class="a e8"><text class="cap" x="40" y="296">как это выглядит</text></g>
<g class="a e9"><text class="sm" x="40" y="330">настоящий пакет</text><rect class="bxa" x="200" y="312" width="100" height="26" rx="4"/><text class="ix fg c" x="250" y="330">адреса</text><rect class="bxa" x="306" y="312" width="100" height="26" rx="4"/><text class="ix fg c" x="356" y="330">поле</text><rect class="bxa" x="412" y="312" width="100" height="26" rx="4"/><text class="ix fg c" x="462" y="330">данные</text></g>
<g class="a e10"><text class="sm" x="40" y="370">подделка</text><rect class="bxb" x="200" y="352" width="100" height="26" rx="4"/><text class="ix fg c" x="250" y="370">адреса</text><rect class="bxr" x="306" y="352" width="100" height="26" rx="4"/><text class="ix fg c" x="356" y="370">поле</text><rect class="bxb" x="412" y="352" width="100" height="26" rx="4"/><text class="ix fg c" x="462" y="370">чужие данные</text></g>
<g class="a e11"><path class="lr" d="M356 382L356 396"/><text class="sm" x="40" y="414">одно поле с дефектом: пакет отличается от настоящего,</text><text class="sm" x="40" y="434">и получатель его не принимает</text></g>
<g class="a e12"><text class="sm" x="690" y="330">на входе</text></g>
<g class="a e13"><rect class="bx" x="828" y="314" width="12" height="22" rx="2"/><rect class="bxa" x="844" y="314" width="12" height="22" rx="2"/><rect class="bx" x="860" y="314" width="12" height="22" rx="2"/><rect class="bxa" x="876" y="314" width="12" height="22" rx="2"/><rect class="bx" x="892" y="314" width="12" height="22" rx="2"/></g>
<g class="a e14"><path class="lm" d="M690 350L918 350"/><text class="sm" x="690" y="370">профиль берёт подходящие</text><rect class="bxa" x="690" y="380" width="12" height="22" rx="2"/><rect class="bxa" x="708" y="380" width="12" height="22" rx="2"/><text class="sm mu" x="730" y="397">2 из 5, пример</text></g>
<g class="a e15"><rect class="bxs" x="40" y="448" width="880" height="54" rx="8"/><text class="sm" x="56" y="470">В коде программы это fooling, условия применяет apply_fooling (lua/zapret-lib.lua:928).</text><text class="sm tk" x="56" y="492">Дальше говорим только «условие подделки», коротко «условие».</text></g>
</svg>
