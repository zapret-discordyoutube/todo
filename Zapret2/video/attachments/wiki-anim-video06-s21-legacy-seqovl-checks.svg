<svg xmlns="http://www.w3.org/2000/svg" class="v06-s21-legacy-seqovl-checks" viewBox="0 0 960 770" width="960" height="770" role="img" aria-labelledby="v06-s21-legacy-seqovl-checks-t v06-s21-legacy-seqovl-checks-d">
<title id="v06-s21-legacy-seqovl-checks-t">Накладка и проверки старой функции</title>
<desc id="v06-s21-legacy-seqovl-checks-d">Накладка в старой функции и две проверки: метка seqovl считается по всему приветствию, но накладка должна попасть в диапазон текущего пакета ядра; с seqovl=host, то есть 97, на большом приветствии на проводе 1441@7 (97 байт накладки и 1344 байта данных), 104@0 и хвост 36@1448, сервер отвечает ACK 1 с блоком с 8 по 1448 и потом ACK 1449 с блоком с 8 по 104 как дубликатом, а с seqovl=-5 метка попадает на смещение 1479, за пределы первого пакета (0-1447), накладки нет и на проводе 1344@104, 104@0, 36@1448; первая проверка: старая функция на маленьком приветствии при pos=0 и TTL 3 отправляет один пакет в 250 байт со смещения 0 с TTL 3, оригинал ядра выброшен; вторая проверка: при максимуме данных 548 и метке midsld на большом приветствии на проводе 444@104, 104@0, 548@548 и 388@1096, а приложение в этом запуске сделало три чтения 548, 548 и 388.</desc>
