<rect class="bg" x="0" y="0" width="960" height="770"/>
<g><text class="cap" x="40" y="24">старая функция: накладка и две проверки</text></g>
<g class="a e1"><text class="mk" x="40" y="54">seqovl=host</text><text class="sm" x="160" y="54">метку считают по всему приветствию (host = 97), накладка идёт в пакет ядра</text></g>
<g class="a e2"><text class="sm" x="40" y="86">первый пакет ядра</text><rect class="bx" x="300" y="70" width="600" height="22" rx="0"/><rect class="fa" x="300" y="70" width="585.4" height="22" rx="0"/><rect class="fs" x="885.4" y="70" width="14.6" height="22" rx="0"/><path class="lb" d="M339.2 66L339.2 96"/><text class="ix amb r" x="333.2" y="62">host 97</text><path class="lr" d="M342 66L342 96"/><text class="ix rej" x="354" y="62">midsld 104</text><text class="ix mu r" x="881.4" y="62">0 … 1447</text></g>
<g class="a e3"><text class="mk" x="40" y="130">1441@7</text><rect class="bx" x="300" y="114" width="600" height="22" rx="0"/><rect class="bxb" x="302.8" y="114" width="39.2" height="22" rx="0"/><rect class="bxa" x="342" y="114" width="543.4" height="22" rx="0"/><text class="ix amb" x="302.8" y="152">накладка 97 байт: другой цвет</text></g>
<g class="a e4"><text class="mk" x="40" y="184">104@0</text><rect class="bx" x="300" y="168" width="600" height="22" rx="0"/><rect class="bxa" x="300" y="168" width="42" height="22" rx="0"/></g>
<g class="a e5"><text class="mk" x="40" y="216">36@1448</text><rect class="bx" x="300" y="200" width="600" height="22" rx="0"/><rect class="bxb" x="885.4" y="200" width="14.6" height="22" rx="0"/></g>
<g class="a e6"><text class="ix mu" x="160" y="130">97 + 1344 = 1441</text></g>
<g class="a e7"><text class="sm mu" x="40" y="242">хвост без разреза: накладка только в первом пакете</text></g>
<g class="a e8"><rect class="bxo" x="40" y="254" width="880" height="52" rx="6"/><text class="sm tk" x="52" y="276">ответ сервера: ACK 1 и блок [8,1449), потом ACK 1449 и блок [8,105)</text><text class="sm" x="52" y="296">второй блок лежит ниже подтверждения: перекрытый диапазон получатель отметил как дубликат</text></g>
<g class="a e9"><path class="lm" d="M40 322L920 322"/><text class="mk" x="40" y="344">seqovl=-5</text><text class="sm" x="160" y="344">метка указала в хвост приветствия: 1479, за пределы пакета 0 … 1447</text></g>
<g class="a e10"><rect class="bxr" x="40" y="356" width="190" height="28" rx="14"/><text class="sm tk c rej" x="135" y="375">накладки нет</text><text class="sm" x="246" y="375">на проводе: 1344@104, 104@0, 36@1448, как без накладки</text></g>
<g class="a e11"><path class="lm" d="M40 400L920 400"/><circle class="bxa" cx="54" cy="422" r="13"/><text class="tk c ns" x="54" y="427">1</text><text class="sm tk" x="76" y="428">проверь себя: старая, маленькое приветствие, pos=0, TTL 3: что на проводе?</text></g>
<g class="a e12"><text class="mk" x="40" y="462">250@0</text><rect class="bx" x="170" y="446" width="730" height="22" rx="0"/><rect class="bxo" x="170" y="446" width="730" height="22" rx="0"/><text class="sm tk c" x="535" y="462">один пакет, TTL 3</text><text class="sm" x="170" y="488">оригинал ядра выброшен: резать нечего, ушла копия</text></g>
<g class="a e13"><path class="lm" d="M40 504L920 504"/><circle class="bxa" cx="54" cy="526" r="13"/><text class="tk c ns" x="54" y="531">2</text><text class="sm tk" x="76" y="532">и ещё: максимум данных 548, большое приветствие, старая, midsld: что на проводе?</text></g>
<g class="a e14"><text class="mk" x="40" y="564">444@104</text><rect class="bx" x="300" y="548" width="600" height="22" rx="0"/><rect class="bxa" x="342" y="548" width="179.5" height="22" rx="0"/><text class="sm" x="529.2" y="564"></text></g>
<g class="a e15"><text class="mk" x="40" y="594">104@0</text><rect class="bx" x="300" y="578" width="600" height="22" rx="0"/><rect class="bxa" x="300" y="578" width="42" height="22" rx="0"/><text class="sm" x="349.6" y="594"></text></g>
<g class="a e16"><text class="mk" x="40" y="624">548@548</text><rect class="bx" x="300" y="608" width="600" height="22" rx="0"/><rect class="bxo" x="521.6" y="608" width="221.6" height="22" rx="0"/><text class="sm" x="290" y="624"></text></g>
<g class="a e17"><text class="mk" x="40" y="654">388@1096</text><rect class="bx" x="300" y="638" width="600" height="22" rx="0"/><rect class="bxo" x="743.1" y="638" width="156.9" height="22" rx="0"/><text class="sm" x="290" y="654"></text></g>
<g class="a e18"><text class="sm" x="40" y="684">первый пакет ядра режется: сначала 444, потом 104; второй и третий идут целыми, по возрастанию</text></g>
<g class="a e19"><rect class="bxd" x="40" y="696" width="880" height="32" rx="6"/><text class="sm" x="52" y="717">чтения приложения в этом запуске: 548, 548, 388; их число зависит от моментов чтения</text></g>
</svg>
