<svg xmlns="http://www.w3.org/2000/svg" class="v02-s07-header-fields" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="v02-s07-header-fields-t v02-s07-header-fields-d">
<title id="v02-s07-header-fields-t">Заголовок TCP по полям</title>
<desc id="v02-s07-header-fields-d">Заголовок TCP нашего пакета в 32 байта поле за полем: порты 39220 и 443, порядковый номер 3 164 320 784, номер подтверждения 2 838 066 482, длина заголовка 8 слов (32 байта), флаги ACK и PSH, окно 63, контрольная сумма 0x6970, urgent-указатель 0 и 12 байт опций с меткой времени.</desc>
