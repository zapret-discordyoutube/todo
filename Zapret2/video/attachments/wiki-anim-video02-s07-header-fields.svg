<g class="a e12"><rect class="bxa" x="10" y="406" width="940" height="56" rx="8"/><text class="tk" x="24" y="430">Больше всего нас будут занимать два числа: порядковый номер и номер подтверждения.</text><text class="sm mu" x="24" y="452">Порт выбирает программу на устройстве, адрес IP выбирает само устройство.</text></g>
