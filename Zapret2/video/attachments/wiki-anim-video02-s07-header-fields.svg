<g class="a e9"><text class="mt mu" x="10" y="314">байты 16–17</text><rect class="bx" x="108" y="294" width="38" height="28" rx="4"/><text class="mk c" x="127" y="314">69</text><rect class="bx" x="150" y="294" width="38" height="28" rx="4"/><text class="mk c" x="169" y="314">70</text><text x="202" y="314">контрольная сумма: <tspan class="hb">0x6970</tspan></text></g>
<g class="a e10"><text class="mt mu" x="10" y="350">байты 18–19</text><rect class="bx" x="108" y="330" width="38" height="28" rx="4"/><text class="mk c" x="127" y="350">00</text><rect class="bx" x="150" y="330" width="38" height="28" rx="4"/><text class="mk c" x="169" y="350">00</text><text x="202" y="350">urgent-указатель: <tspan class="hb">0</tspan><tspan class="mu"> (срочных данных нет)</tspan></text></g>
