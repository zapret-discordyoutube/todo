<g class="a e4"><text class="mt mu" x="10" y="134">байты 4–7</text><rect class="bxa" x="108" y="114" width="38" height="28" rx="4"/><text class="mk c" x="127" y="134">bc</text><rect class="bxa" x="150" y="114" width="38" height="28" rx="4"/><text class="mk c" x="169" y="134">9b</text><rect class="bxa" x="192" y="114" width="38" height="28" rx="4"/><text class="mk c" x="211" y="134">b4</text><rect class="bxa" x="234" y="114" width="38" height="28" rx="4"/><text class="mk c" x="253" y="134">10</text><text x="286" y="134">порядковый номер: <tspan class="hb">3 164 320 784</tspan></text></g>
<g class="a e5"><text class="mt mu" x="10" y="170">байты 8–11</text><rect class="bxa" x="108" y="150" width="38" height="28" rx="4"/><text class="mk c" x="127" y="170">a9</text><rect class="bxa" x="150" y="150" width="38" height="28" rx="4"/><text class="mk c" x="169" y="170">29</text><rect class="bxa" x="192" y="150" width="38" height="28" rx="4"/><text class="mk c" x="211" y="170">75</text><rect class="bxa" x="234" y="150" width="38" height="28" rx="4"/><text class="mk c" x="253" y="170">32</text><text x="286" y="170">номер подтверждения: <tspan class="hb">2 838 066 482</tspan></text></g>
<g class="a e6"><text class="mt mu" x="10" y="206">байт 12</text><rect class="bx" x="108" y="186" width="38" height="28" rx="4"/><text class="mk c" x="127" y="206">80</text><text x="160" y="206">длина заголовка: <tspan class="hb">8</tspan> слов × 4 = 32 байта</text></g>
<g class="a e7"><text class="mt mu" x="10" y="242">байт 13</text><rect class="bxb" x="108" y="222" width="38" height="28" rx="4"/><text class="mk c" x="127" y="242">18</text><text x="160" y="242">флаги: <tspan class="hbb">ACK + PSH</tspan><tspan class="mu"> (0x10 + 0x08)</tspan></text></g>
