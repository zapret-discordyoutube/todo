<g class="a e1"><text class="cap" x="10" y="24">заголовок TCP нашего пакета: 32 байта, слева направо</text></g>
<g class="a e2"><text class="mt mu" x="10" y="62">байты 0–1</text><rect class="bx" x="108" y="42" width="38" height="28" rx="4"/><text class="mk c" x="127" y="62">99</text><rect class="bx" x="150" y="42" width="38" height="28" rx="4"/><text class="mk c" x="169" y="62">34</text><text x="202" y="62">порт отправителя: <tspan class="hb">39220</tspan><tspan class="mu"> (временный порт браузера)</tspan></text></g>
