<svg xmlns="http://www.w3.org/2000/svg" class="v16-s21-hands-and-chain" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="v16-s21-hands-and-chain-t v16-s21-hands-and-chain-d">
<title id="v16-s21-hands-and-chain-t">Путь вставки: три руки и цепочка вызовов</title>
<desc id="v16-s21-hands-and-chain-d">Путь вставки от стратегии до провода. Игрушечный конвейер из трёх рук (не данные лаборатории): рука Lua заполняет листок с полями пакета и данными, рука-переходник на C превращает листок в настоящие байты и узнаёт адрес, рука-отправщик отправляет. В программе цепочка вызовов такая: multisplit (lua/zapret-antidpi.lua:483) отдаёт кусок данных в rawsend_payload_segmented (lua/zapret-lib.lua:1282), затем rawsend_dissect_segmented (1233) и rawsend_dissect_ipfrag (1197), дальше rawsend_dissect, за этим именем стоит C-функция luacall_rawsend_dissect (nfq2/lua.c:3000), она зовёт rawsend_rep (nfq2/darkmagic.c:2047), тот rawsend (darkmagic.c:1984), а тот sendto (darkmagic.c:2032). Помощники Lua не режут данные по стратегии: режет сама стратегия. Если отправка не получилась, multisplit возвращает PASS (zapret-antidpi.lua:523).</desc>
