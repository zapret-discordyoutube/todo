<svg xmlns="http://www.w3.org/2000/svg" class="v01-s01-handshake" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="v01-s01-handshake-t v01-s01-handshake-d">
<title id="v01-s01-handshake-t">Соединение: три пакета рукопожатия</title>
<desc id="v01-s01-handshake-d">Перед запросом браузер и сервер обмениваются тремя короткими пакетами: SYN клиента в момент 0,000 мс, SYN-ACK сервера через 0,032 мс и ACK клиента через 0,045 мс, порты 39220 и 443; после этого обе стороны помнят общее состояние, это и есть соединение; если пакеты пропадают, страница крутится, если соединение обрывают, ошибка появляется сразу.</desc>
<style>.v01-s01-handshake{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#23825a;--okt:rgba(35,130,90,.12)}@media (prefers-color-scheme:dark){.v01-s01-handshake{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13);--ok:#7fd1a6;--okt:rgba(127,209,166,.12)}}
.v01-s01-handshake .bg{fill:var(--bg)}
.v01-s01-handshake text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}
.v01-s01-handshake .t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s01-handshake .tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s01-handshake .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.v01-s01-handshake .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v01-s01-handshake .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}
.v01-s01-handshake .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v01-s01-handshake .sm{font-size:14.5px}
.v01-s01-handshake .big{font-size:18px}
.v01-s01-handshake .mu{fill:var(--mute)}
.v01-s01-handshake .fg{fill:var(--fg)}
.v01-s01-handshake .acc{fill:var(--acc)}
.v01-s01-handshake .rej{fill:var(--rej)}
.v01-s01-handshake .ok{fill:var(--ok)}
.v01-s01-handshake .c{text-anchor:middle}
.v01-s01-handshake .r{text-anchor:end}
.v01-s01-handshake .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v01-s01-handshake .bxm{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v01-s01-handshake .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v01-s01-handshake .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v01-s01-handshake .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v01-s01-handshake .bxg{fill:var(--line);stroke:var(--mute);stroke-width:1.2}
.v01-s01-handshake .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 4}
.v01-s01-handshake .bxbg{fill:var(--bg);stroke:none}
.v01-s01-handshake .lf{fill:none;stroke:var(--line);stroke-width:1.4}
.v01-s01-handshake .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v01-s01-handshake .lmd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 5}
.v01-s01-handshake .lr{fill:none;stroke:var(--rej);stroke-width:2}
.v01-s01-handshake .la{fill:none;stroke:var(--acc);stroke-width:2}
.v01-s01-handshake .ld{fill:none;stroke:var(--fg2);stroke-width:2}
.v01-s01-handshake .belt{fill:var(--line);stroke:var(--mute);stroke-width:1.2}
.v01-s01-handshake .ln{stroke-dasharray:100}
.v01-s01-handshake .hd-a{fill:var(--acc)}
.v01-s01-handshake .hd-f{fill:var(--fg2)}
.v01-s01-handshake .hd-r{fill:var(--rej)}
.v01-s01-handshake .dot{fill:var(--acc)}
.v01-s01-handshake .ring{fill:var(--bg);stroke:var(--acc);stroke-width:2.2}
.v01-s01-handshake .beam{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}
.v01-s01-handshake .a{animation-duration:22s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v01-s01-handshake .a{animation:none}.v01-s01-handshake .tr{display:none}}
figure.v01-s01-handshake-fig{margin:1.6rem 0;overflow-x:auto}figure.v01-s01-handshake-fig>svg{display:block;width:100%;min-width:680px;height:auto}
