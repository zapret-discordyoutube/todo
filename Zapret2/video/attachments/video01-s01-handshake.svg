<rect class="bg" x="0" y="0" width="960" height="476"/>
<g class="a e1"><text class="cap" x="2" y="26">лаборатория: рукопожатие перед запросом, три пакета</text></g>
<g class="a e2"><rect class="bxa" x="95" y="46" width="210" height="62" rx="7"/><text class="tk c" x="200" y="72">Клиент</text><text class="m c" x="200" y="96">10.1.0.1 : порт 39220</text></g>
<g class="a e3"><rect class="bxa" x="665" y="46" width="210" height="62" rx="7"/><text class="tk c" x="770" y="72">Сервер</text><text class="m c" x="770" y="96">10.2.0.2 : порт 443</text></g>
<path class="lmd" d="M200 112V352"/><path class="lmd" d="M770 112V352"/>
<text class="cap" x="2" y="136">время, мс</text>
