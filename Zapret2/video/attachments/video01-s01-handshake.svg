<g class="a e22"><rect class="bxr" x="2" y="424" width="470" height="40" rx="7"/><text class="t c sm" x="237" y="449">не создаётся или пакеты пропали: страница крутится</text></g>
<g class="a e23"><rect class="bxr" x="488" y="424" width="470" height="40" rx="7"/><text class="t c sm" x="723" y="449">соединение оборвали: ошибка появляется сразу</text></g>
