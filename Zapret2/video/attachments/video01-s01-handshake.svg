<g class="a e5"><polygon class="hd-a" points="769,150 758,155.5 758,144.5"/></g>
<g class="a e6 tr"><circle class="dot" r="6" cx="0" cy="0"/></g>
<g class="a e7"><text class="tk r" x="479" y="141">SYN</text><text class="t sm" x="491" y="141">«давай соединимся»</text></g>
<g class="a e8"><text class="mk r" x="84" y="155">0,000</text><path class="lf" d="M92 150H197"/></g>
<path class="a e9 ln ld" pathLength="100" d="M770 252H200"/>
<g class="a e10"><polygon class="hd-f" points="201,252 212,257.5 212,246.5"/></g>
<g class="a e11 tr"><circle class="dot" r="6" cx="0" cy="0"/></g>
<g class="a e12"><text class="tk r" x="479" y="243">SYN-ACK</text><text class="t sm" x="491" y="243">«давай»</text></g>
<g class="a e13"><text class="mk r" x="84" y="257">+0,032</text><path class="lf" d="M92 252H197"/></g>
<path class="a e14 ln la" pathLength="100" d="M200 294H770"/>
<g class="a e15"><polygon class="hd-a" points="769,294 758,299.5 758,288.5"/></g>
<g class="a e16 tr"><circle class="dot" r="6" cx="0" cy="0"/></g>
<g class="a e17"><text class="tk r" x="479" y="285">ACK</text><text class="t sm" x="491" y="285">«подтверждаю»</text></g>
