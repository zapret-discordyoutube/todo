<svg xmlns="http://www.w3.org/2000/svg" class="v05-s03-four-gates" viewBox="0 0 960 692" width="960" height="692" role="img" aria-labelledby="v05-s03-four-gates-t v05-s03-four-gates-d">
<title id="v05-s03-four-gates-t">Четыре ворота функции</title>
<desc id="v05-s03-four-gates-d">Ворота функции multisplit, четыре вопроса по порядку кода из lua/zapret-antidpi.lua: есть ли у пакета заголовок TCP (строка 484; не ICMP ещё и отключение стратегии для соединения, строка 486), какие данные резать и есть ли они (строка 494 берёт первое найденное из блоба, собранного приветствия reasm_data и данных пакета, а строка 495 требует, чтобы они были не пусты), то ли направление (direction_check, по умолчанию наружу, zapret-lib.lua:1294-1297) и подходит ли тип нагрузки (payload_check, по умолчанию известные типы, 1311-1327); до остальных вопросов строка 489 отключает функцию для встречного направления, и в журнале остаётся instance cutoff; на любое нет функция выходит, ничего не отправив и не вернув, движок читает молчание как PASS, и оригинал уходит как есть; фильтров типа два: снаружи опция payload у вызова решает, звать ли функцию, внутри аргумент payload решает функция.</desc>
<style>.v05-s03-four-gates{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
