ates-k4}@keyframes v05-s03-four-gates-k5{0.0%{opacity:0;transform:translate(0px,-6px)}42.5%{opacity:0;transform:translate(0px,-6px)}44.5%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v05-s03-four-gates .e5{animation-name:v05-s03-four-gates-k5}@keyframes v05-s03-four-gates-k6{0.0%{opacity:0;transform:translate(0px,-6px)}35.5%{opacity:0;transform:translate(0px,-6px)}37.5%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v05-s03-four-gates .e6{animation-name:v05-s03-four-gates-k6}@keyframes v05-s03-four-gates-k7{0.0%{opacity:0;transform:translate(0px,-6px)}43%{opacity:0;transform:translate(0px,-6px)}45%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v05-s03-four-gates .e7{animation-name:v05-s03-four-gates-k7}@keyframes v05-s03-four-gates-k8{0.0%{opacity:0;transform:translate(0px,-6px)}52.5%{opacity:0;transform:translate(0px,-6px)}54.5%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v05-s03-four-gates .e8{animation-name:v05-s03-four-gates-k8}@keyframes v05-s03-four-gates-k9{0.0%{opacity:0;transform:translate(0px,-6px)}60%{opacity:0;transform:translate(0px,-6px)}62%{opacity:1;transform:translate(0px,0px)}95.75%{opacity:1;transform:translate(0px,0px)}97.25%{opacity:0;transform:translate(0px,-6px)}100%{opacity:0;transform:translate(0px,-6px)}}.v05-s03-four-gates .e9{animation-name:v05-s03-four-gates-k9}</style>
<rect class="bg" x="0" y="0" width="960" height="692"/>
<g><text class="cap" x="40" y="26">ворота: четыре вопроса до разреза, в порядке кода</text></g>
<g class="a e1"><rect class="bxa" x="40" y="44" width="880" height="98" rx="8"/><rect class="pl" x="52" y="54" width="32" height="32" rx="16"/><text class="ml c" x="68" y="76">1</text><text class="tk" x="96" y="72">TCP ли пакет?</text><text class="ix" x="96" y="96">484</text><text class="m" x="134" y="96"><tspan class="fg">if not desync.dis.tcp then </tspan><tspan class="mu">… return end</tspan></text><rect class="bxr" x="780" y="54" width="128" height="30" rx="6"/><text class="sm rej c" x="844" y="74">нет: выход</text><text class="sm" x="96" y="120">нет заголовка TCP: выход; не ICMP ещё и просит отключить стратегию для соединения (486, по коду)</text></g>
<g class="a e2"><rect class="bxs" x="40" y="148" width="880" height="58" rx="6"/><text class="ix" x="52" y="170">489</text><text class="m" x="90" y="170"><tspan class="fg">direction_cutoff_opposite(ctx, desync)</tspan></text><text class="sm mu" x="52" y="194">до остальных вопросов: при dir=out закрывает встречное направление; журнал: instance cutoff … in=1 out=0</text></g>
<g class="a e3"><rect class="bxa" x="40" y="214" width="880" height="140" rx="8"/><rect class="pl" x="52" y="224" width="32" height="32" rx="16"/><text class="ml c" x="68" y="246">2</text><text class="tk" x="96" y="242">какие данные режем и есть ли они?</text><text class="ix" x="96" y="266">494</text><rect class="bx" x="134" y="252" width="150" height="44" rx="4"/><text class="sm c" x="209" y="270">блоб</text><text class="ix c" x="209" y="288">arg.blob</text><text class="mk acc" x="290" y="280">or</text><rect class="bx" x="324" y="252" width="200" height="44" rx="4"/><text class="sm c" x="424" y="270">собранное приветствие</text><text class="ix c" x="424" y="288">reasm_data</text><text class="mk acc" x="530" y="280">or</text><rect class="bx" x="564" y="252" width="160" height="44" rx="4"/><text class="sm c" x="644" y="270">данные пакета</text><text class="ix c" x="644" y="288">dis.payload</text><text class="m" x="134" y="344"><tspan class="mu">if </tspan><tspan class="ha acc">#data&gt;0</tspan><tspan class="mu"> and direction_check(desync) and payload_check(desync) then</tspan></text><text class="ix" x="52" y="344">495</text><text class="sm" x="96" y="320">режется первое найденное; пустой блоб считается найденным, но резать нечего</text><rect class="bxr" x="780" y="224" width="128" height="30" rx="6"/><text class="sm rej c" x="844" y="244">пусто: выход</text></g>
<g class="a e4"><rect class="bxa" x="40" y="364" width="880" height="82" rx="8"/><rect class="pl" x="52" y="374" width="32" height="32" rx="16"/><text class="ml c" x="68" y="396">3</text><text class="tk" x="96" y="392">то ли направление?</text><text class="ix" x="96" y="416">495</text><text class="m" x="134" y="416"><tspan class="mu">if #data&gt;0 and </tspan><tspan class="acc">direction_check(desync)</tspan><tspan class="mu"> …</tspan></text><text class="sm" x="96" y="438">по умолчанию dir=out: только пакеты от клиента наружу; in входящие, any любые</text><text class="ix" x="294.6" y="392">zapret-lib.lua:1294-1297</text></g>
<g class="a e5"><rect class="bxa" x="40" y="454" width="880" height="82" rx="8"/><rect class="pl" x="52" y="464" width="32" height="32" rx="16"/><text class="ml c" x="68" y="486">4</text><text class="tk" x="96" y="482">известный ли тип нагрузки?</text><text class="ix" x="96" y="506">495</text><text class="m" x="134" y="506"><tspan class="mu">if #data&gt;0 and direction_check(desync) and </tspan><tspan class="acc">payload_check(desync)</tspan><tspan class="mu"> then</tspan></text><text class="sm" x="96" y="528">по умолчанию payload=known: любой тип, кроме unknown и empty; all пускает и их</text><text class="ix" x="370.9" y="482">zapret-lib.lua:1311-1327</text></g>
<g class="a e6"><rect class="bxr" x="780" y="374" width="128" height="30" rx="6"/><text class="sm rej c" x="844" y="394">нет: выход</text></g>
<g class="a e7"><rect class="bxr" x="780" y="464" width="128" height="30" rx="6"/><text class="sm rej c" x="844" y="484">нет: выход</text></g>
<g class="a e8"><rect class="bxo" x="40" y="548" width="880" height="66" rx="8"/><text class="tk" x="56" y="572">за закрытыми воротами: ничего не отправлено и ничего не возвращено</text><text class="sm" x="56" y="596">движок читает молчание как PASS (desync.c:849-850, 867-868): оригинал уходит как есть</text></g>
<g class="a e9"><rect class="bx" x="40" y="626" width="430" height="52" rx="6"/><text class="sm tk" x="52" y="647">снаружи: опция payload у вызова</text><text class="sm" x="52" y="667">по умолчанию любой тип; решает движок</text><rect class="bx" x="490" y="626" width="430" height="52" rx="6"/><text class="sm tk" x="502" y="647">внутри: аргумент payload функции</text><text class="sm" x="502" y="667">по умолчанию known; решает функция</text></g>
</svg>
