<rect class="bg" x="0" y="0" width="960" height="520"/>
<g class="a e1"><text class="cap" x="10" y="22">три мелкие опции вокруг разделителя --new</text></g>
<g class="a e2"><text class="ml" x="10" y="56">--skip</text><text class="sm mu" x="10" y="76">выключает тот профиль, где стоит</text></g>
<g class="a e3"><rect class="bx" x="10" y="92" width="312" height="34" rx="6"/><text class="tk" x="22" y="114">1 · без имени</text><text class="tk r ok" x="310" y="114">№ 1</text></g>
<g class="a e4"><rect class="bx" x="10" y="132" width="312" height="34" rx="6"/><text class="tk" x="22" y="154">2 · second</text><text class="tk r ok" x="310" y="154">№ 2</text></g>
<g class="a e5 tr"><rect class="bxb" x="10" y="172" width="312" height="34" rx="6"/><text class="tk" x="22" y="194">3 · skipped  +  --skip</text><text class="tk r amb" x="310" y="194">№ 3</text></g>
<g class="a e6"><rect class="bxd" x="10" y="172" width="312" height="34" rx="6"/><text class="tk mu" x="22" y="194">3 · skipped: запись стёрта</text></g>
<g class="a e7"><path class="lm" d="M22 190L22 190"/></g>
<g class="a e8"><rect class="bx" x="10" y="212" width="312" height="34" rx="6"/><text class="tk" x="22" y="234">4 · fourth</text><text class="tk r ok" x="310" y="234">№ 3 (тот же)</text></g>
<g class="a e9"><rect class="bxo" x="10" y="258" width="312" height="52" rx="6"/><text class="tk" x="22" y="280">в журнале 3 профиля:</text><text class="m" x="22" y="300">noname, second, fourth</text></g>
<g class="a e10"><text class="sm mu" x="10" y="334">nfqws.c:2769-2771: поднят флаг</text><text class="sm mu" x="10" y="354">nfqws.c:2725-2731: на следующем --new</text><text class="sm mu" x="10" y="373">запись стёрта, номер не растёт</text></g>
<g class="a e11"><rect class="bxr" x="10" y="392" width="312" height="78" rx="6"/><text class="sm fg" x="22" y="414">опечатка в пропущенном профиле</text><text class="sm fg" x="22" y="434">всё равно останавливает запуск:</text><text class="m" x="22" y="456">bad identifier &#x27;pa-ss&#x27;, выход 1</text></g>
<g class="a e12"><text class="ml" x="338" y="56">имя профиля</text><text class="sm mu" x="338" y="76">в журнале вместо «noname»</text></g>
<g class="a e13"><rect class="bxo" x="338" y="92" width="284" height="64" rx="6"/><text class="mk" x="350" y="116">--new=second</text><text class="m" x="350" y="142">profile 2 (second)</text><path class="lo" d="M592 120L598 127L609 112"/></g>
<g class="a e14"><rect class="bxo" x="338" y="166" width="284" height="64" rx="6"/><text class="mk" x="350" y="190">--name=fourth</text><text class="m" x="350" y="216">profile 3 (fourth)</text><path class="lo" d="M592 194L598 201L609 186"/></g>
<g class="a e15"><rect class="bxr" x="338" y="240" width="284" height="80" rx="6"/><text class="mk" x="350" y="264">--new second</text><text class="m" x="350" y="289">profile 2 (noname)</text><text class="sm" x="350" y="310">имя через пробел игнорируется</text><path class="lr" d="M592 260L608 276M592 276L608 260"/></g>
<g class="a e16"><text class="tk" x="338" y="346">Имя доходит до Lua</text><text class="sm" x="338" y="366">как desync.profile_name</text><text class="sm" x="338" y="386">(desync.c:996-997), а выбор профиля</text><text class="sm" x="338" y="406">имя не использует.</text></g>
<g class="a e17"><text class="ml" x="646" y="56">--template, --import</text><text class="sm mu" x="646" y="76">образец отдельно от профилей</text></g>
<g class="a e18"><rect class="bxd" x="646" y="92" width="304" height="78" rx="8"/><text class="sm mu" x="658" y="111">полка шаблонов, вне выбора</text><rect class="bxs" x="658" y="120" width="280" height="42" rx="6"/><text class="mk" x="668" y="137">T:  pass</text><text class="sm mu" x="668" y="154">n1-n3 · tls_client_hello</text></g>
<g class="a e19"><path class="la" d="M796 172L796.0 194.0"/><polygon class="ha" points="796,204 791.0,194.0 801.0,194.0"/><text class="sm acc" x="808" y="192">--import=T: копия</text></g>
<g class="a e20"><rect class="bx" x="646" y="208" width="304" height="112" rx="8"/><text class="tk" x="658" y="230">профиль 1 (real)</text><rect class="bxa" x="658" y="240" width="280" height="34" rx="6"/><text class="mk" x="668" y="261">pass</text><text class="sm" x="716" y="261">скопировано из T</text><rect class="bxb" x="658" y="280" width="280" height="32" rx="6"/><text class="mk" x="668" y="301">drop</text><text class="sm" x="716" y="301">своё: после импорта</text></g>
<g class="a e21"><text class="tk" x="646" y="346">журнал: 1 профиль и 1 шаблон</text><text class="sm" x="646" y="366">шаблон в число профилей не входит</text></g>
<g class="a e22"><text class="sm amb" x="646" y="392">образец уже закрыт разделителем;</text><text class="sm amb" x="646" y="412">имя и номер не копируются</text></g>
<g class="a e23"><path class="lm" d="M10 484L950 484"/><text class="tk" x="10" y="508">Skip убирает профиль, где стоит. Имя идёт в Lua, шаблон лежит отдельно, импорт копирует.</text></g>
</svg>
