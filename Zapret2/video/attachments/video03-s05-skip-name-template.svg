.v03-s05-skip-name-template .hl{fill:var(--tint);stroke:none}
.v03-s05-skip-name-template .hlb{fill:var(--ambt);stroke:none}
.v03-s05-skip-name-template .dim{fill:var(--bg);fill-opacity:.62;stroke:none}
.v03-s05-skip-name-template .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v03-s05-skip-name-template .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v03-s05-skip-name-template .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v03-s05-skip-name-template .la{fill:none;stroke:var(--acc);stroke-width:2}
.v03-s05-skip-name-template .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v03-s05-skip-name-template .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v03-s05-skip-name-template .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v03-s05-skip-name-template .hf{fill:var(--fg2)}.v03-s05-skip-name-template .ha{fill:var(--acc)}.v03-s05-skip-name-template .hr{fill:var(--rej)}.v03-s05-skip-name-template .hm{fill:var(--mute)}.v03-s05-skip-name-template .hb{fill:var(--amb)}.v03-s05-skip-name-template .ho{fill:var(--ok)}
.v03-s05-skip-name-template .dot{fill:var(--mute);stroke:none}.v03-s05-skip-name-template .dota{fill:var(--acc);stroke:none}.v03-s05-skip-name-template .doto{fill:var(--ok);stroke:none}.v03-s05-skip-name-template .dotr{fill:var(--rej);stroke:none}
.v03-s05-skip-name-template .a{animation-duration:38s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v03-s05-skip-name-template .a{animation:none}.v03-s05-skip-name-template .tr{display:none}}
