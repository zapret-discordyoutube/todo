.v03-s05-skip-name-template .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v03-s05-skip-name-template .mu{fill:var(--mute)}.v03-s05-skip-name-template .fg{fill:var(--fg)}.v03-s05-skip-name-template .acc{fill:var(--acc)}.v03-s05-skip-name-template .rej{fill:var(--rej)}.v03-s05-skip-name-template .ok{fill:var(--ok)}.v03-s05-skip-name-template .amb{fill:var(--amb)}
