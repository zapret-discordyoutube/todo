<rect class="bg" x="0" y="0" width="960" height="680"/>
<g><text class="cap" x="30" y="28">Два пакета рядом: подделка и настоящее приветствие</text></g>
<g class="a e1"><rect class="bxd" x="640" y="10" width="290" height="26" rx="6"/><text class="sm mu c ns" x="785" y="28">пример: один опыт, выход клиента</text></g>
<g class="a e2"><rect class="bxb" x="300" y="46" width="306" height="46" rx="8"/><text class="tk c ns" x="453.0" y="66">подделка</text><text class="sm mu c ns" x="453.0" y="84">первый пакет с данными</text><rect class="bxa" x="630" y="46" width="300" height="46" rx="8"/><text class="tk c ns" x="780.0" y="66">настоящее приветствие</text><text class="sm mu c ns" x="780.0" y="84">второй пакет с данными</text></g>
<g class="a e3"><text class="cap" x="30" y="114">совпадает</text></g>
<g class="a e4"><text class="sm ns" x="30" y="145">идентификатор IP</text><rect class="bx" x="300" y="128" width="306" height="24" rx="4"/><text class="m ns" x="310" y="146">191</text><rect class="bx" x="630" y="128" width="300" height="24" rx="4"/><text class="m ns" x="640" y="146">191</text><text class="tk c ns ok" x="618" y="146">=</text></g>
<g class="a e5"><text class="sm ns" x="30" y="173">адреса и порты</text><rect class="bx" x="300" y="156" width="306" height="24" rx="4"/><text class="m ns" x="310" y="174">10.1.0.1:46204 -&gt; 10.2.0.2:443</text><rect class="bx" x="630" y="156" width="300" height="24" rx="4"/><text class="m ns" x="640" y="174">10.1.0.1:46204 -&gt; 10.2.0.2:443</text><text class="tk c ns ok" x="618" y="174">=</text></g>
<g class="a e6"><text class="sm ns" x="30" y="201">порядковый номер (сырой)</text><rect class="bx" x="300" y="184" width="306" height="24" rx="4"/><text class="m ns" x="310" y="202">335373287 (относит. 1)</text><rect class="bx" x="630" y="184" width="300" height="24" rx="4"/><text class="m ns" x="640" y="202">335373287 (относит. 1)</text><text class="tk c ns ok" x="618" y="202">=</text></g>
<g class="a e7"><text class="sm ns" x="30" y="229">номер подтверждения (сырой)</text><rect class="bx" x="300" y="212" width="306" height="24" rx="4"/><text class="m ns" x="310" y="230">4085820611</text><rect class="bx" x="630" y="212" width="300" height="24" rx="4"/><text class="m ns" x="640" y="230">4085820611</text><text class="tk c ns ok" x="618" y="230">=</text></g>
<g class="a e8"><text class="sm ns" x="30" y="257">флаги</text><rect class="bx" x="300" y="240" width="306" height="24" rx="4"/><text class="m ns" x="310" y="258">PSH+ACK (AP)</text><rect class="bx" x="630" y="240" width="300" height="24" rx="4"/><text class="m ns" x="640" y="258">PSH+ACK (AP)</text><text class="tk c ns ok" x="618" y="258">=</text></g>
<g class="a e9"><text class="sm ns" x="30" y="285">окно</text><rect class="bx" x="300" y="268" width="306" height="24" rx="4"/><text class="m ns" x="310" y="286">63</text><rect class="bx" x="630" y="268" width="300" height="24" rx="4"/><text class="m ns" x="640" y="286">63</text><text class="tk c ns ok" x="618" y="286">=</text></g>
<g class="a e10"><text class="sm ns" x="30" y="313">параметры TCP</text><rect class="bx" x="300" y="296" width="306" height="24" rx="4"/><text class="m ns" x="310" y="314">NOP NOP TS=1629753311/65330837</text><rect class="bx" x="630" y="296" width="300" height="24" rx="4"/><text class="m ns" x="640" y="314">NOP NOP TS=1629753311/65330837</text><text class="tk c ns ok" x="618" y="314">=</text></g>
<g class="a e11"><text class="sm ns" x="30" y="341">заголовок TCP, байт</text><rect class="bx" x="300" y="324" width="306" height="24" rx="4"/><text class="m ns" x="310" y="342">32</text><rect class="bx" x="630" y="324" width="300" height="24" rx="4"/><text class="m ns" x="640" y="342">32</text><text class="tk c ns ok" x="618" y="342">=</text></g>
<g class="a e12"><text class="sm ns" x="30" y="369">срок жизни</text><rect class="bx" x="300" y="352" width="306" height="24" rx="4"/><text class="m ns" x="310" y="370">64</text><rect class="bx" x="630" y="352" width="300" height="24" rx="4"/><text class="m ns" x="640" y="370">64</text><text class="tk c ns ok" x="618" y="370">=</text></g>
<g class="a e13"><text class="cap" x="30" y="404">различается</text></g>
<g class="a e14"><text class="sm ns" x="30" y="435">данные, байт</text><rect class="bxb" x="300" y="418" width="306" height="24" rx="4"/><text class="mk ns" x="310" y="436">680</text><rect class="bxa" x="630" y="418" width="300" height="24" rx="4"/><text class="mk ns" x="640" y="436">250</text><text class="tk c ns rej" x="618" y="436">≠</text></g>
<g class="a e15"><text class="sm ns" x="30" y="463">отпечаток данных (sha256)</text><rect class="bxb" x="300" y="446" width="306" height="24" rx="4"/><text class="mk ns" x="310" y="464">11d33b3d926b</text><rect class="bxa" x="630" y="446" width="300" height="24" rx="4"/><text class="mk ns" x="640" y="464">100c2aa4206d</text><text class="tk c ns rej" x="618" y="464">≠</text></g>
<g class="a e16"><text class="sm ns" x="30" y="491">длина в заголовке IP</text><rect class="bxb" x="300" y="474" width="306" height="24" rx="4"/><text class="mk ns" x="310" y="492">732 = 20 + 32 + 680</text><rect class="bxa" x="630" y="474" width="300" height="24" rx="4"/><text class="mk ns" x="640" y="492">302 = 20 + 32 + 250</text><text class="tk c ns rej" x="618" y="492">≠</text></g>
<g class="a e17"><text class="sm ns" x="30" y="519">контрольная сумма IP</text><rect class="bxb" x="300" y="502" width="306" height="24" rx="4"/><text class="mk ns" x="310" y="520">0x2358 (верна)</text><rect class="bxa" x="630" y="502" width="300" height="24" rx="4"/><text class="mk ns" x="640" y="520">0x2506 (верна)</text><text class="tk c ns rej" x="618" y="520">≠</text></g>
<g class="a e18"><text class="sm ns" x="30" y="547">контрольная сумма TCP</text><rect class="bxb" x="300" y="530" width="306" height="24" rx="4"/><text class="mk ns" x="310" y="548">0x8028 (верна)</text><rect class="bxa" x="630" y="530" width="300" height="24" rx="4"/><text class="mk ns" x="640" y="548">0x7016 (верна)</text><text class="tk c ns rej" x="618" y="548">≠</text></g>
<g class="a e19"><rect class="bx" x="30" y="570" width="900" height="70" rx="8"/><text class="sm ns" x="48" y="596">Четыре различия, и все они следуют из того, что данные другие: сами данные, длина в заголовке IP</text><text class="sm ns" x="48" y="618">и две контрольные суммы. Суммы программа пересчитала: обе верны, это просто суммы двух разных пакетов.</text></g>
<g class="a e20"><text class="smk" x="30" y="664">Всё, что не пересчитывается заново, подделка наследует от настоящего пакета без изменений.</text></g>
</svg>
