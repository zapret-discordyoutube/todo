<svg xmlns="http://www.w3.org/2000/svg" class="v07-s05-fake-vs-real-table" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="v07-s05-fake-vs-real-table-t v07-s05-fake-vs-real-table-d">
<title id="v07-s05-fake-vs-real-table-t">Подделка и настоящее приветствие</title>
<desc id="v07-s05-fake-vs-real-table-d">Таблица сравнения подделки и настоящего приветствия из нашего опыта на выходе клиента: девять полей совпадают до последней цифры (идентификатор IP 191, адреса и порты, порядковый номер, номер подтверждения, флаги PSH и ACK, окно 63, параметры TCP с отметкой времени, заголовок TCP 32 байта, срок жизни 64), а различаются четыре вещи, связанные с другими данными: данные 680 против 250 байт, длина в заголовке IP 732 против 302, контрольная сумма IP 0x2358 против 0x2506 и контрольная сумма TCP 0x8028 против 0x7016, причём обе суммы верны.</desc>
