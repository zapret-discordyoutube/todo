<svg xmlns="http://www.w3.org/2000/svg" class="v16-s12-buffer-and-fatal" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="v16-s12-buffer-and-fatal-t v16-s12-buffer-and-fatal-d">
<title id="v16-s12-buffer-and-fatal-t">Буфер приёма и что фатально</title>
<desc id="v16-s12-buffer-and-fatal-d">Размер буфера приёма и что в настройщике фатально. Программа просит 1024 × 1024 = 1048576 байт (Q_RCVBUF, params.h:28), библиотека возвращает фактический размер, программа делит его на два и сравнивает с запрошенным (nfqws.c:414-418): равно, в журнал идёт «set receive buffer size to 1048576»; не равно, пишется «could not set … real size is», и это не фатально. Почему делить на два: на сырых сокетах в нашем журнале запрошено 2048 на приём, показано 4096, запрошено 32768 на отправку, показано 65536, ровно вдвое (darkmagic.c:1885-1886); для самой очереди удвоение отдельно не проверяли. Фатальны пять шагов: nfq_open, привязка IPv4, nfq_create_queue, режим копирования и длина очереди; только в журнал пишутся привязка IPv6, флаг fail-open, размер буфера и настройка NETLINK_NO_ENOBUFS. В журнале восемь строк по порядку вызовов, во всех 92 журналах нет ошибки флага или буфера.</desc>
