<rect class="bg" x="0" y="0" width="960" height="600"/>
<g><text class="cap" x="40" y="26">буфер приёма: nfqws.c:414-418</text></g>
<g class="a e1"><rect class="bxa" x="40" y="40" width="250" height="74" rx="6"/><text class="tk sm" x="52" y="62">просим</text><text class="m" x="52" y="84">1024 × 1024 = 1048576 Б</text><text class="ix" x="52" y="104">Q_RCVBUF, params.h:28</text></g>
<g class="a e2"><rect class="bxa" x="355" y="40" width="250" height="74" rx="6"/><text class="tk sm" x="367" y="62">библиотека отвечает</text><text class="m" x="367" y="84">фактический размер X</text><text class="ix" x="367" y="104">nfnl_rcvbufsiz(…), :414</text><path class="lf" d="M292 77L342.0 77.0"/><polygon class="hf" points="352,77 342.0,82.0 342.0,72.0"/></g>
<g class="a e3"><rect class="bxa" x="670" y="40" width="250" height="74" rx="6"/><text class="tk sm" x="682" y="62">делим на два</text><text class="m" x="682" y="84">X / 2 и сравниваем</text><text class="ix" x="682" y="104">с запрошенным 1048576</text><path class="lf" d="M607 77L657.0 77.0"/><polygon class="hf" points="667,77 657.0,82.0 657.0,72.0"/></g>
<g class="a e4"><rect class="bxo" x="40" y="130" width="430" height="56" rx="6"/><text class="tk sm ok" x="52" y="152">равно: размер выставлен</text><text class="m" x="52" y="174">set receive buffer size to 1048576</text><rect class="bxb" x="490" y="130" width="430" height="56" rx="6"/><text class="tk sm amb" x="502" y="152">не равно: пишет, какой получился</text><text class="m" x="502" y="174">could not set … real size is X</text></g>
<g class="a e5"><text class="sm c" x="480" y="204">в обоих случаях только запись, программа идёт дальше</text></g>
<g class="a e6"><text class="cap" x="40" y="232">почему на два? похожий случай в нашем журнале: сырые сокеты</text></g>
<g class="a e7"><text class="tk sm" x="40" y="268">приём</text><text class="sm" x="130" y="268">запрошено</text><rect class="bx" x="236" y="248" width="90" height="28" rx="4"/><text class="mk c" x="281" y="268">2048</text><path class="lf" d="M330 262L400.0 262.0"/><polygon class="hf" points="410,262 400.0,267.0 400.0,257.0"/><text class="tk sm c" x="370" y="254">×2</text><text class="sm" x="424" y="268">показано</text><rect class="bxb" x="516" y="248" width="90" height="28" rx="4"/><text class="mk c amb" x="561" y="268">4096</text><text class="ix r" x="910" y="268">darkmagic.c:1886</text></g>
<g class="a e8"><text class="tk sm" x="40" y="308">отправка</text><text class="sm" x="130" y="308">запрошено</text><rect class="bx" x="236" y="288" width="90" height="28" rx="4"/><text class="mk c" x="281" y="308">32768</text><path class="lf" d="M330 302L400.0 302.0"/><polygon class="hf" points="410,302 400.0,307.0 400.0,297.0"/><text class="tk sm c" x="370" y="294">×2</text><text class="sm" x="424" y="308">показано</text><rect class="bxb" x="516" y="288" width="90" height="28" rx="4"/><text class="mk c amb" x="561" y="308">65536</text><text class="ix r" x="910" y="308">darkmagic.c:1885</text></g>
<g class="a e9"><text class="sm mu" x="40" y="340">Для самой очереди удвоение отдельно не проверяли; в журнале опыта равенство выполнено.</text></g>
<g class="a e10"><text class="cap" x="40" y="366">что фатально, а что только запись</text></g>
<g class="a e11"><rect class="bxr" x="40" y="378" width="430" height="156" rx="6"/><text class="tk sm rej" x="52" y="400">фатально: сброс всего и выход с кодом 1</text><text class="sm" x="56" y="424">nfq_open</text><text class="ix r" x="458" y="424">:359-364</text><text class="sm" x="56" y="446">привязка IPv4</text><text class="ix r" x="458" y="446">:370-378</text><text class="sm" x="56" y="468">nfq_create_queue</text><text class="ix r" x="458" y="468">:391-396</text><text class="sm" x="56" y="490">режим копирования</text><text class="ix r" x="458" y="490">:398-402</text><text class="sm" x="56" y="512">длина очереди</text><text class="ix r" x="458" y="512">:403-406</text></g>
<g class="a e12"><rect class="bxs" x="490" y="378" width="430" height="156" rx="6"/><text class="tk sm" x="502" y="400">только запись в журнал</text><text class="sm" x="506" y="424">привязка IPv6</text><text class="ix r" x="908" y="424">:382-389</text><text class="sm" x="506" y="446">флаг fail-open</text><text class="ix r" x="908" y="446">:408-412</text><text class="sm" x="506" y="468">размер буфера</text><text class="ix r" x="908" y="468">:414-418</text><text class="sm" x="506" y="490">NETLINK_NO_ENOBUFS</text><text class="ix r" x="908" y="490">:423-424</text></g>
<g class="a e13"><text class="tk sm" x="40" y="562">В журнале восемь строк по порядку вызовов; во всех 92 журналах нет ошибки флага или буфера.</text></g>
</svg>
