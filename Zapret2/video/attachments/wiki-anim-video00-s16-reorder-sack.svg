<g class="a e7"><path class="la" d="M274 370L656.0 370.0"/><polygon class="ha" points="666,370 656.0,375.0 656.0,365.0"/><rect class="bxo" x="388.5" y="339" width="163" height="24" rx="5"/><text class="lgk" x="395.5" y="356">[AP] rseq=1 len=104</text><text class="sm" x="24" y="362">потом начало:</text><text class="sm" x="24" y="381">104 байта</text></g>
