<g class="a e9"></g>
<g class="a e10"><text class="sm tk" x="24" y="466">пометка SACK: получатель сообщает, какие куски уже держит</text></g>
<g class="a e11"><rect class="bxo" x="24" y="492" width="912" height="66" rx="8"/><text class="sm tk" x="40" y="518">программа сервера прочла 250 байт одним куском, как будто ничего не случилось</text><text class="lgk" x="40" y="544">SERVER conn 1 total 250 chunks [(250, 250)]</text><circle class="bxo" cx="906" cy="518" r="13"/><path class="lo" d="M901 518L904.5 522L911 514" style="stroke-linecap:round;stroke-linejoin:round"/></g>
