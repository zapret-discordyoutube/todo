<svg xmlns="http://www.w3.org/2000/svg" class="v00-s16-reorder-sack" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="v00-s16-reorder-sack-t v00-s16-reorder-sack-d">
<title id="v00-s16-reorder-sack-t">Перемешивание и ответ сервера с пометкой SACK</title>
<desc id="v00-s16-reorder-sack-d">Перемешивание отправляет куски приветствия в другом порядке, и в нашем тесте клиент сначала отправил конец в 146 байт, сервер ответил, что начала ещё нет, а вторую часть он уже держит, это видно по пометке SACK, потом пришли первые 104 байта, сервер подтвердил все 250 и программа сервера прочла их одним куском; по общим сведениям, читателя, который ждёт кусков по порядку, такая перестановка может сбить.</desc>
