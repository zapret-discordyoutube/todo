<g><text class="cap" x="24" y="24">семья вторая: перемешать</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bxb" x="24" y="40" width="196" height="26" rx="13.0"/><text class="sm tk c" x="122" y="58">пример выдуманный</text></g>
<g class="a e2"><rect class="pl" x="24" y="78" width="200" height="60" rx="6"/><rect class="bxs" x="198" y="86" width="16" height="12" rx="2"/><path class="lm" d="M36 124L114 124"/><text class="sm tk" x="38" y="106">фонтана</text><rect class="pl" x="238" y="78" width="200" height="60" rx="6"/><rect class="bxs" x="412" y="86" width="16" height="12" rx="2"/><path class="lm" d="M250 124L328 124"/><text class="sm tk" x="252" y="106">встретимся у</text><text class="sm mu" x="24" y="156">открытка 2 лежит сверху</text><text class="sm mu" x="238" y="156">открытка 1</text></g>
<g class="a e3"><text class="sm" x="470" y="102">в обычном TCP каждый кусок несёт</text><text class="sm" x="470" y="124">номер своего первого байта,</text><text class="sm tk" x="470" y="146">получатель сам сложит их по номерам</text></g>
<g class="a e4"><text class="sm tk" x="24" y="182">живой пример из нашего теста</text><rect class="bxs" x="220" y="196" width="100" height="28" rx="6"/><text class="sm tk c" x="270" y="215">клиент</text><rect class="bxs" x="620" y="196" width="100" height="28" rx="6"/><text class="sm tk c" x="670" y="215">сервер</text><path class="lmd" d="M270 224L270 446"/><path class="lmd" d="M670 224L670 446"/></g>
<g class="a e5"><path class="la" d="M274 262L656.0 262.0"/><polygon class="ha" points="666,262 656.0,267.0 656.0,257.0"/><rect class="bxa" x="381" y="231" width="178" height="24" rx="5"/><text class="lgk" x="388" y="248">[AP] rseq=105 len=146</text><text class="sm" x="24" y="254">сначала конец приветствия:</text><text class="sm" x="24" y="273">146 байт</text></g>
