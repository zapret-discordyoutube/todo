<g class="a e22"><path class="lm" d="M646 330L646 338L798 338L798 330"/><text class="sm mu c" x="722" y="358">идут мимо программы</text></g>
<g class="a e23"><text class="sm mu" x="20" y="392">исходящие пакеты клиента по порядку; предел двенадцать</text></g>
<g class="a e24"><rect class="bxr" x="20" y="410" width="920" height="110" rx="8"/><text class="sm tk" x="34" y="436">проверь себя: стратегии нужен пятнадцатый исходящий пакет,</text><text class="sm tk" x="34" y="456">предел двенадцать. Увидит ли программа этот пакет?</text><text class="sm" x="34" y="484">Нет: пятнадцатый не подходит под «от одного до двенадцати», ядро пропускает его</text><text class="sm" x="34" y="504">мимо очереди, и программа не получает его вообще.</text></g>
</svg>
