<rect class="bg" x="0" y="0" width="960" height="544"/>
<g class="a e1"><text class="cap" x="20" y="24">зачем предел: три причины</text></g>
<g class="a e2"><rect class="bx" x="20" y="40" width="300" height="202" rx="10"/><text class="tk" x="34" y="66">1 · это дорого</text><rect class="bx" x="34" y="82" width="80" height="34" rx="6"/><text class="sm c" x="74" y="104">ядро</text><path class="la" d="M118 99L200.0 99.0"/><polygon class="ha" points="210,99 200.0,104.0 200.0,94.0"/><rect class="bx" x="214" y="82" width="92" height="34" rx="6"/><text class="sm c" x="260" y="104">программа</text><text class="sm acc c" x="164" y="134">каждый пакет</text><text class="sm" x="34" y="158">руководство: лишний перехват</text><text class="sm" x="34" y="176">создаёт дополнительную нагрузку</text><text class="sm" x="34" y="194">на процессор; число подбирают</text><text class="sm" x="34" y="212">под стратегию</text><text class="sm mu" x="34" y="230">docs/manual.en.md:393</text></g>
<g class="a e3"><rect class="bx" x="330" y="40" width="300" height="202" rx="10"/><text class="tk" x="344" y="66">2 · нужное лежит в начале</text><rect class="bxo" x="344" y="86" width="84" height="26" rx="4"/><rect class="bx" x="428" y="86" width="188" height="26" rx="4"/><text class="sm c ok tk" x="386" y="104">начало</text><text class="sm c mu" x="522" y="104">всё остальное</text><text class="sm" x="344" y="158">игрушечному инспектору и нашим</text><text class="sm" x="344" y="178">стратегиям нужны имя сайта и</text><text class="sm" x="344" y="198">рукопожатие, они идут первыми</text><text class="sm mu" x="344" y="220">страница и видео им не нужны</text></g>
<g class="a e4"><rect class="bx" x="640" y="40" width="300" height="202" rx="10"/><text class="tk" x="654" y="66">3 · программа видит своё</text><rect class="bxo" x="654" y="86" width="38" height="26" rx="4"/><text class="sm c" x="673" y="104">1</text><rect class="bxo" x="700" y="86" width="38" height="26" rx="4"/><text class="sm c" x="719" y="104">2</text><rect class="bxo" x="746" y="86" width="38" height="26" rx="4"/><text class="sm c" x="765" y="104">3</text><rect class="bxo" x="792" y="86" width="38" height="26" rx="4"/><text class="sm c" x="811" y="104">4</text><rect class="bxd" x="838" y="86" width="38" height="26" rx="4"/><text class="sm c mu" x="857" y="104">5</text><rect class="bxd" x="884" y="86" width="38" height="26" rx="4"/><text class="sm c mu" x="903" y="104">6</text><text class="sm ok tk c" x="742" y="134">получены</text><text class="sm mu c" x="880" y="134">мимо</text><text class="sm" x="654" y="158">счётчики программы растут только</text><text class="sm" x="654" y="178">на пакеты, которые она получила</text><text class="sm" x="654" y="198">(ConntrackFeedPacket)</text><text class="sm mu" x="654" y="220">nfq2/conntrack.c:174-188</text></g>
<g class="a e5"><text class="cap" x="20" y="268">после двенадцатого пакета стратегия слепа (условный пример, не опыт)</text></g>
<g class="a e6"><rect class="bxo" x="20" y="284" width="46" height="34" rx="6"/><text class="sm tk c" x="43" y="307">1</text></g>
