<svg xmlns="http://www.w3.org/2000/svg" class="v16-s07-three-reasons" viewBox="0 0 960 544" width="960" height="544" role="img" aria-labelledby="v16-s07-three-reasons-t v16-s07-three-reasons-d">
<title id="v16-s07-three-reasons-t">Три причины предела</title>
<desc id="v16-s07-three-reasons-d">Зачем нужен предел в двенадцать пакетов: выносить пакеты из ядра в программу дорого (руководство: избыточный перехват создаёт лишнюю нагрузку на процессор, число подбирается под стратегию, docs/manual.en.md:393); нужное стратегиям, имя сайта и рукопожатие, лежит в начале соединения; программа увеличивает свои счётчики только на пакеты, которые получила (nfq2/conntrack.c:174-188), поэтому пакеты сверх предела для неё не существуют: в условном примере стратегии нужен 15-й исходящий пакет, а ядро пускает в очередь только первые 12, остальные идут мимо программы.</desc>
<style>.v16-s07-three-reasons{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
