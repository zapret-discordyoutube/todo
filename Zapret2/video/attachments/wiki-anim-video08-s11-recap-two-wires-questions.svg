<svg xmlns="http://www.w3.org/2000/svg" class="v08-s11-recap-two-wires-questions" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="v08-s11-recap-two-wires-questions-t v08-s11-recap-two-wires-questions-d">
<title id="v08-s11-recap-two-wires-questions-t">Повтор запусков и три вопроса</title>
<desc id="v08-s11-recap-two-wires-questions-d">Повтор двух запусков и три вопроса: разрез с фейками отправляет шесть пакетов, фейк, настоящая первая часть 104 байта, фейк, потом фейк, настоящая вторая часть 146 байт и фейк, сервер молчит на фейки и отвечает «жду байт номер 105», приложение получает 250 байт, равных оригиналу, а без условия приложение получает 250 нулевых байт; перемешивание отправляет настоящие части с конца, 146 байт, потом 104, и сервер отвечает «жду байт номер 1» с блоком со 105-го по 250-й, а затем «жду байт номер 251»; остались три вопроса, что если вторая пачка идёт первой, что если подкладывать только подложное имя и что если разрез и фейк идут двумя стратегиями подряд.</desc>
