<svg xmlns="http://www.w3.org/2000/svg" class="v00-s08-three-layers" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="v00-s08-three-layers-t v00-s08-three-layers-d">
<title id="v00-s08-three-layers-t">Три слоя zapret2: отбор, разбор, решение</title>
<desc id="v00-s08-three-layers-d">Три слоя zapret2: слой перехвата отбирает пакеты, на Linux это правило в ядре Linux, а на других системах перехват устроен иначе, Си-часть программы (движок nfqws2) разбирает пакеты, помнит соединения и выбирает профиль, а файлы на Lua решают, что сделать с пакетом; минимальный рабочий набор это именно эти три части, а всё остальное по желанию, и тот же порядок, отбор, разбор, решение, показывает выдуманный пример с проходной завода, где охранник отбирает, рабочий разбирает и записывает, а инструкция на полке решает.</desc>
