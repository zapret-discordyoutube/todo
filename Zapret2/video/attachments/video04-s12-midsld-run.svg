<title id="v04-s12-midsld-run-t">Запуск pos=midsld: настройка, журнал, провод</title>
<desc id="v04-s12-midsld-run-d">Первый настоящий запуск, pos=midsld: метка даёт правило точки, 101 плюс 7 пополам, 104. Журнал: resolved split pos 104. На проводе два пакета: 104 байта с номера 1, кончаются на www.exa, и 146 байт с номера 105, начинаются с mple.com. Сервер собрал те же 250 байт.</desc>
