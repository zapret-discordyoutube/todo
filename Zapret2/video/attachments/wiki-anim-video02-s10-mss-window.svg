<svg xmlns="http://www.w3.org/2000/svg" class="v02-s10-mss-window" viewBox="0 0 960 546" width="960" height="546" role="img" aria-labelledby="v02-s10-mss-window-t v02-s10-mss-window-d">
<title id="v02-s10-mss-window-t">Размер порции и окно</title>
<desc id="v02-s10-mss-window-d">Размер порции и окно: MSS 1460 это 1500 минус 20 байт заголовка IP минус 20 байт заголовка TCP, а с 12 байтами метки времени в пакете помещается 1448 байт данных; запрос в 1484 байта ядро режет на 1448 и 36 байт (номера 1 и 1449, кадры 1514 и 102 байта); окно это свободное место приёмника, число в поле умножается на 2 в десятой степени: 63 × 1024 = 64 512 у клиента и 64 × 1024 = 65 536 у сервера, а в самом SYN окно без множителя (64 240 и 65 160).</desc>
<style>.v02-s10-mss-window{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
@media (prefers-color-scheme:dark){.v02-s10-mss-window{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#9a9a9a);--line:var(--lightgray,#4a474a);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.14));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.14);--ok:#7fd9a1;--okt:rgba(127,217,161,.13);--amb:#f0b866;--ambt:rgba(240,184,102,.14)}}
.v02-s10-mss-window .bg{fill:var(--bg)}
.v02-s10-mss-window text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.v02-s10-mss-window .tk{font-weight:600;fill:var(--fg)}
.v02-s10-mss-window .sm{font-size:14.5px}
.v02-s10-mss-window .m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px}
.v02-s10-mss-window .mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}
.v02-s10-mss-window .ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:17px;font-weight:600;fill:var(--fg)}
.v02-s10-mss-window .mt{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:13px}
.v02-s10-mss-window .cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
.v02-s10-mss-window .mu{fill:var(--mute)}.v02-s10-mss-window .fg{fill:var(--fg)}.v02-s10-mss-window .acc{fill:var(--acc)}.v02-s10-mss-window .rej{fill:var(--rej)}.v02-s10-mss-window .ok{fill:var(--ok)}.v02-s10-mss-window .amb{fill:var(--amb)}
.v02-s10-mss-window .hb{fill:var(--acc);font-weight:700}.v02-s10-mss-window .hbr{fill:var(--rej);font-weight:700}.v02-s10-mss-window .hbo{fill:var(--ok);font-weight:700}.v02-s10-mss-window .hbb{fill:var(--amb);font-weight:700}
.v02-s10-mss-window .c{text-anchor:middle}.v02-s10-mss-window .r{text-anchor:end}
.v02-s10-mss-window .nos{stroke:none}
.v02-s10-mss-window .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}
.v02-s10-mss-window .bxs{fill:var(--bg);stroke:var(--mute);stroke-width:1.4}
.v02-s10-mss-window .bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}
.v02-s10-mss-window .bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}
.v02-s10-mss-window .bxo{fill:var(--okt);stroke:var(--ok);stroke-width:1.4}
.v02-s10-mss-window .bxb{fill:var(--ambt);stroke:var(--amb);stroke-width:1.4}
.v02-s10-mss-window .bxn{fill:none;stroke:var(--fg);stroke-width:2}
.v02-s10-mss-window .bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:5 4}
.v02-s10-mss-window .fa{fill:var(--acc);stroke:none}
.v02-s10-mss-window .fo{fill:var(--ok);stroke:none}
.v02-s10-mss-window .fr{fill:var(--rej);stroke:none}
.v02-s10-mss-window .fm{fill:var(--line);stroke:none}
.v02-s10-mss-window .lf{fill:none;stroke:var(--fg2);stroke-width:2}
.v02-s10-mss-window .lm{fill:none;stroke:var(--mute);stroke-width:1.4}
.v02-s10-mss-window .lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:5 4}
.v02-s10-mss-window .la{fill:none;stroke:var(--acc);stroke-width:2}
.v02-s10-mss-window .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v02-s10-mss-window .lr{fill:none;stroke:var(--rej);stroke-width:2.4}
.v02-s10-mss-window .hf{fill:var(--fg2)}.v02-s10-mss-window .ha{fill:var(--acc)}.v02-s10-mss-window .hr{fill:var(--rej)}.v02-s10-mss-window .hm{fill:var(--mute)}.v02-s10-mss-window .ho{fill:var(--ok)}
.v02-s10-mss-window .dot{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.v02-s10-mss-window .a{animation-duration:42s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.v02-s10-mss-window .a{animation:none}.v02-s10-mss-window .tr{display:none}}
