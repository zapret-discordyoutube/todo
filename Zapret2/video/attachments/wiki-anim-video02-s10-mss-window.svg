}38.095%{opacity:0}39.167%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e11{animation-name:v02-s10-mss-window-k11}@keyframes v02-s10-mss-window-k12{0.0%{opacity:0}42.857%{opacity:0}43.929%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e12{animation-name:v02-s10-mss-window-k12}@keyframes v02-s10-mss-window-k13{0.0%{opacity:0}47.619%{opacity:0}48.69%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e13{animation-name:v02-s10-mss-window-k13}@keyframes v02-s10-mss-window-k14{0.0%{opacity:0}50.0%{opacity:0}51.071%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e14{animation-name:v02-s10-mss-window-k14}@keyframes v02-s10-mss-window-k15{0.0%{opacity:0}53.333%{opacity:0}54.405%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e15{animation-name:v02-s10-mss-window-k15}@keyframes v02-s10-mss-window-k16{0.0%{opacity:0}59.524%{opacity:0}60.595%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e16{animation-name:v02-s10-mss-window-k16}@keyframes v02-s10-mss-window-k17{0.0%{opacity:0}65.238%{opacity:0}66.31%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e17{animation-name:v02-s10-mss-window-k17}@keyframes v02-s10-mss-window-k18{0.0%{opacity:0}71.429%{opacity:0}72.5%{opacity:1}97.381%{opacity:1}98.81%{opacity:0}100%{opacity:0}}.v02-s10-mss-window .e18{animation-name:v02-s10-mss-window-k18}</style>
<rect class="bg" x="0" y="0" width="960" height="546"/>
<g class="a e1"><text class="cap" x="10" y="24">размер порции: сколько данных помещается в один пакет</text></g>
<g class="a e2"><rect class="bx" x="10" y="36" width="150" height="56" rx="7"/><text class="ml c" x="85.0" y="62">1500</text><text class="sm c mu" x="85.0" y="82">пакет IP, предел</text><text class="ml c" x="175" y="70">−</text><rect class="bx" x="190" y="36" width="150" height="56" rx="7"/><text class="ml c" x="265.0" y="62">20</text><text class="sm c mu" x="265.0" y="82">заголовок IP</text></g>
<g class="a e3"><text class="ml c" x="355" y="70">−</text><rect class="bx" x="370" y="36" width="150" height="56" rx="7"/><text class="ml c" x="445.0" y="62">20</text><text class="sm c mu" x="445.0" y="82">заголовок TCP</text></g>
<g class="a e4"><text class="ml c" x="535" y="70">=</text><rect class="bxa" x="550" y="36" width="150" height="56" rx="7"/><text class="ml c" x="625.0" y="62">1460</text><text class="sm c mu" x="625.0" y="82">MSS</text></g>
<g class="a e5"><rect class="bxa" x="10" y="106" width="150" height="56" rx="7"/><text class="ml c" x="85.0" y="132">1460</text><text class="sm c mu" x="85.0" y="152">MSS</text><text class="ml c" x="175" y="140">−</text><rect class="bx" x="190" y="106" width="150" height="56" rx="7"/><text class="ml c" x="265.0" y="132">12</text><text class="sm c mu" x="265.0" y="152">метка времени</text><text class="ml c" x="355" y="140">=</text><rect class="bxa" x="370" y="106" width="150" height="56" rx="7"/><text class="ml c" x="445.0" y="132">1448</text><text class="sm c mu" x="445.0" y="152">данных в пакете</text></g>
<g class="a e6"><text class="sm mu" x="544" y="132">метка времени есть</text><text class="sm mu" x="544" y="152">в каждом пакете после рукопожатия</text></g>
<g class="a e7"><text class="cap" x="10" y="190">запрос длиннее: большой ClientHello, 1484 байта</text></g>
<g class="a e8"><rect class="bxa" x="10" y="202" width="915.1967654986523" height="40" rx="5"/><text class="tk c" x="468.59838274932616" y="228">1448 байт · seq 1 · кадр 1514</text></g>
<g class="a e9"><rect class="bxb" x="929.1967654986523" y="202" width="20.803234501347674" height="40" rx="3"/></g>
<g class="a e10"><path class="lm" d="M939.1967654986523 244L939.1967654986523 260"/><text class="tk r" x="940" y="274">36 байт · seq 1449 · кадр 102</text></g>
<g class="a e11"><text class="ml" x="10" y="274">1448 + 36 = 1484</text></g>
<g class="a e12"><text class="sm mu" x="10" y="302">Здесь запрос режет сама система, не zapret2 и не мы. Запомним это на будущее.</text></g>
<g class="a e13"><text class="cap" x="10" y="332">окно: сколько байт приёмник готов принять, не дожидаясь подтверждения</text></g>
<g class="a e14"><path class="bxs" d="M40 354L54 450L124 450L138 354"/><path class="fa" d="M44 392L54 448L124 448L134 392Z" style="opacity:.35"/><path class="lm" d="M44 392L134 392"/><text class="sm c mu" x="89" y="472">свободное место</text><text class="sm c mu" x="89" y="490">в приёмном буфере</text></g>
<g class="a e15"><text x="214" y="372">масштаб <tspan class="hb">10</tspan> договорились в начале: множитель 2 в десятой степени = <tspan class="hb">1024</tspan></text></g>
<g class="a e16"><text x="214" y="408"><tspan class="tk">клиент: </tspan><tspan class="hb">63</tspan> × 1024 = <tspan class="hb">64 512</tspan> байт</text></g>
<g class="a e17"><text x="214" y="440"><tspan class="tk">сервер: </tspan><tspan class="hb">64</tspan> × 1024 = <tspan class="hb">65 536</tspan> байт</text></g>
<g class="a e18"><rect class="bxb" x="206" y="456" width="744" height="66" rx="8"/><text class="tk" x="220" y="482">Сам SYN несёт окно без множителя: клиент 64 240, сервер 65 160.</text><text class="sm mu" x="220" y="507">В поле всего два байта, поэтому без множителя окно не больше 65 тысяч.</text></g>
</svg>
