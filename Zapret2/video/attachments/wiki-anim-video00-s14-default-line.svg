<rect class="bg" x="0" y="0" width="960" height="798"/>
<g><text class="cap" x="24" y="24">строка из коробки: профили, вызовы, аргументы</text></g>
<g><rect class="bxa" x="779" y="8" width="157" height="26" rx="13"/><text class="sm tk c" x="857.5" y="26">В НАШЕМ ТЕСТЕ</text></g>
<g class="a e1"><rect class="bxa" x="24" y="42" width="167" height="26" rx="13.0"/><text class="sm tk c" x="107.5" y="60">условия профиля</text></g>
<g class="a e2"><rect class="bxb" x="201" y="42" width="120" height="26" rx="13.0"/><text class="sm tk c" x="261" y="60">вид данных</text></g>
<g class="a e3"><rect class="bxo" x="331" y="42" width="158" height="26" rx="13.0"/><text class="sm tk c" x="410" y="60">вызов стратегии</text></g>
<g class="a e4"><text class="sm mu" x="507" y="60">профили разделяет слово --new</text></g>
<g class="a e5"><rect class="bx" x="24" y="78" width="912" height="160" rx="8"/><text class="big tk fg" x="40" y="116">HTTP</text><text class="sm mu" x="40" y="140">профиль 1</text></g>
<g class="a e6"><rect class="bxa" x="150" y="88" width="131" height="26" rx="5"/><text class="lgk" x="157" y="106">--filter-tcp=80</text><rect class="bxa" x="289" y="88" width="139" height="26" rx="5"/><text class="lgk" x="296" y="106">--filter-l7=http</text><rect class="bxb" x="436" y="88" width="155" height="26" rx="5"/><text class="lgk" x="443" y="106">--payload=http_req</text></g>
<g class="a e7"><circle class="bx" cx="162" cy="139" r="11"/><text class="tk c ns" x="162" y="144">1</text><rect class="bxo" x="176" y="126" width="390" height="26" rx="5"/><text class="lgk" x="183" y="144">--lua-desync=fake:blob=fake_default_http:tcp_md5</text><text class="sm" x="176" y="171">сначала поддельный запрос с обманкой MD5</text></g>
<g class="a e8"><circle class="bx" cx="162" cy="195" r="11"/><text class="tk c ns" x="162" y="200">2</text><rect class="bxo" x="176" y="182" width="296" height="26" rx="5"/><text class="lgk" x="183" y="200">--lua-desync=multisplit:pos=method+2</text><text class="sm" x="176" y="227">потом настоящий запрос, разрезанный после первых двух букв метода</text></g>
<g class="a e9"><text class="lgk c" x="480" y="256">--new</text><path class="lmd" d="M24 251L430 251"/><path class="lmd" d="M530 251L936 251"/></g>
<g class="a e10"><rect class="bx" x="24" y="264" width="912" height="160" rx="8"/><text class="big tk fg" x="40" y="302">TLS</text><text class="sm mu" x="40" y="326">профиль 2</text></g>
<g class="a e11"><rect class="bxa" x="150" y="274" width="139" height="26" rx="5"/><text class="lgk" x="157" y="292">--filter-tcp=443</text><rect class="bxa" x="297" y="274" width="131" height="26" rx="5"/><text class="lgk" x="304" y="292">--filter-l7=tls</text><rect class="bxb" x="436" y="274" width="218" height="26" rx="5"/><text class="lgk" x="443" y="292">--payload=tls_client_hello</text></g>
<g class="a e12"><circle class="bx" cx="162" cy="325" r="11"/><text class="tk c ns" x="162" y="330">1</text><rect class="bxo" x="176" y="312" width="499" height="26" rx="5"/><text class="lgk" x="183" y="330">--lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000</text><text class="sm" x="176" y="357">сначала поддельное приветствие с MD5 и сдвигом номера: обе обманки</text></g>
<g class="a e13"><circle class="bx" cx="162" cy="381" r="11"/><text class="tk c ns" x="162" y="386">2</text><rect class="bxo" x="176" y="368" width="319" height="26" rx="5"/><text class="lgk" x="183" y="386">--lua-desync=multidisorder:pos=1,midsld</text><text class="sm" x="176" y="413">потом настоящее приветствие: две позиции, куски в обратном порядке</text></g>
<g class="a e14"><text class="lgk c" x="480" y="442">--new</text><path class="lmd" d="M24 437L430 437"/><path class="lmd" d="M530 437L936 437"/></g>
<g class="a e15"><rect class="bx" x="24" y="450" width="912" height="112" rx="8"/><text class="big tk fg" x="40" y="488">QUIC</text><text class="sm mu" x="40" y="512">профиль 3</text></g>
<g class="a e16"><rect class="bxa" x="150" y="460" width="139" height="26" rx="5"/><text class="lgk" x="157" y="478">--filter-udp=443</text><rect class="bxa" x="297" y="460" width="139" height="26" rx="5"/><text class="lgk" x="304" y="478">--filter-l7=quic</text><rect class="bxb" x="444" y="460" width="186" height="26" rx="5"/><text class="lgk" x="451" y="478">--payload=quic_initial</text></g>
<g class="a e17"><circle class="bx" cx="162" cy="511" r="11"/><text class="tk c ns" x="162" y="516">1</text><rect class="bxo" x="176" y="498" width="405" height="26" rx="5"/><text class="lgk" x="183" y="516">--lua-desync=fake:blob=fake_default_quic:repeats=6</text><text class="sm" x="176" y="543">поддельный пакет, который повторяется несколько раз</text></g>
<g class="a e18"><rect class="gr" x="24" y="566" width="912" height="126" rx="8"/><text class="sm tk" x="40" y="590">в строке нет служебных опций: их добавляет скрипт запуска</text></g>
<g class="a e19"><rect class="bx" x="40" y="602" width="116" height="26" rx="5"/><text class="lgk" x="47" y="620">--user=daemon</text><rect class="bx" x="164" y="602" width="163" height="26" rx="5"/><text class="lgk" x="171" y="620">--fwmark=0x40000000</text><rect class="bx" x="335" y="602" width="92" height="26" rx="5"/><text class="lgk" x="342" y="620">--qnum=300</text><text class="sm mu" x="439" y="620">очередь 300: так в лаборатории</text><rect class="bx" x="40" y="636" width="218" height="26" rx="5"/><text class="lgk" x="47" y="654">--lua-init=@zapret-lib.lua</text><rect class="bx" x="266" y="636" width="249" height="26" rx="5"/><text class="lgk" x="273" y="654">--lua-init=@zapret-antidpi.lua</text><rect class="bx" x="523" y="636" width="225" height="26" rx="5"/><text class="lgk" x="530" y="654">--lua-init=@zapret-auto.lua</text></g>
<g class="a e20"><text class="sm mu" x="40" y="678">и подставляет списки имён на место заглушек</text></g>
<g class="a e21"><rect class="bxr" x="24" y="706" width="470" height="70" rx="8"/><text class="ml" x="40" y="734">NFQWS2_ENABLE=0</text><text class="sm" x="40" y="760">свежая установка ничего не делает, пока не включить</text></g>
<g class="a e22"><rect class="bxd" x="514" y="706" width="422" height="70" rx="8"/><text class="sm tk c" x="725" y="736">помогают ли такие настройки</text><text class="sm tk c" x="725" y="756">в настоящей сети, не проверяли</text></g>
</svg>
