<svg xmlns="http://www.w3.org/2000/svg" class="v00-s14-default-line" viewBox="0 0 960 798" width="960" height="798" role="img" aria-labelledby="v00-s14-default-line-t v00-s14-default-line-d">
<title id="v00-s14-default-line-t">Строка стратегий из коробки</title>
<desc id="v00-s14-default-line-d">Настоящая строка стратегий из файла настроек из коробки состоит из трёх профилей, для HTTP, TLS и QUIC, у каждого есть условия профиля, вид данных и вызовы стратегий с аргументами: для TLS сначала идёт поддельное приветствие с обманками MD5 и сдвигом номера, потом настоящее приветствие, разрезанное по двум позициям в обратном порядке; очередь, пользователя, метку и три файла Lua добавляет скрипт запуска, а свежая установка ничего не делает, пока её не включат.</desc>
<style>.v00-s14-default-line{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
