<svg xmlns="http://www.w3.org/2000/svg" class="v16-s18-time-one-run" viewBox="0 0 960 670" width="960" height="670" role="img" aria-labelledby="v16-s18-time-one-run-t v16-s18-time-one-run-d">
<title id="v16-s18-time-one-run-t">Время одного прохода пакета</title>
<desc id="v16-s18-time-one-run-d">Время одного прохода пакета с запросом, повтор опыта t10 на локальном диске, миллисекунды от первого SYN на проводе. Стратегия pcap записала запрос через 0,520 мс; часть 1 появилась на проводе в 1,216 мс (+0,696 после записи), часть 2 в 1,624 мс (+0,408 после первой); от записи запроса до выхода второй части 1,624 − 0,520 = 1,104 мс. В шести повторах тот же отрезок от 0,87 до 1,98 мс (0,867; 0,886; 1,182; 1,247; 1,432; 1,984), медиана 1,21; показанные 1,104 лежат внутри разброса, но это один прогон, а не медиана. В прогоне, записанном раньше (журнал и файл с пакетами на медленном диске), тот же отрезок 24,792 мс, около 20 раз больше медианы повтора; по нашему объяснению из-за диска, какой из двух файлов виноват, не разделяли. Порядок событий в повторе тот же, масштаб другой. Один прогон на одной машине, ориентир, не измерение; для настоящих компьютеров и сетей цифр у нас нет.</desc>
