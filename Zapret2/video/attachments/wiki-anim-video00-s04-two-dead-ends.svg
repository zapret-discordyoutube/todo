<title id="v00-s04-two-dead-ends-t">Ложный справочник и заваренная дверь</title>
<desc id="v00-s04-two-dead-ends-d">Выдуманный пример: справочник дал ложный адрес магазина и вы пришли в чужой дом, а у другого магазина дверь заварена, и как бы вы ни переписывали записку у двери, это ничего не изменит; записка здесь соответствует началу соединения, которое умеет менять zapret2, а подмена справочника и закрытый адрес лежат вне его возможностей.</desc>
