<svg xmlns="http://www.w3.org/2000/svg" class="v09-s06-forget-and-code" viewBox="0 0 960 775" width="960" height="775" role="img" aria-labelledby="v09-s06-forget-and-code-t v09-s06-forget-and-code-d">
<title id="v09-s06-forget-and-code-t">Игрушка стирает память и код функции rst</title>
<desc id="v09-s06-forget-and-code-d">Игрушка «сброс стирает память» и код функции rst: без стратегии игрушка блокирует приветствие и сервер получает 0 байт, а сброс со сроком жизни 1 умирает на роутере и стирает её память, поэтому приветствие проходит и сервер получает 250 байт, восемь строк основного блока копируют приветствие без данных, заменяют флаги на единственный RST, применяют условия строки запуска и отправляют сброс без вердикта, а аргумент rstack меняет только флаг, подтверждение остаётся равным 1.</desc>
