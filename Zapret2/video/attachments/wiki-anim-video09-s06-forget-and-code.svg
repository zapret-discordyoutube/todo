<g><text class="cap" x="40" y="22">игрушка «сброс стирает память» и код функции rst</text><rect class="pl" x="737.9" y="4" width="182.1" height="24" rx="12"/><text class="sm c" x="829" y="21">выдуманный пример</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="112" rx="8"/><text class="sm tk" x="54" y="64">третий характер игрушки: сброс стирает память</text><text class="sm" x="54" y="86">любой RST в любую сторону: забыть соединение навсегда; пока сброса нет, имя сайта ищется в каждом</text><text class="sm" x="54" y="107">клиентском пакете</text><text class="sm" x="54" y="130">аналогия: клерк рвёт папку дела на слове «отмена», а адресат слова не услышал</text></g>
<g class="a e2"><rect class="bxr" x="40" y="170" width="430" height="190" rx="8"/><text class="sm tk" x="54" y="194">без стратегии</text><rect class="bx" x="54" y="208" width="88" height="30" rx="6"/><text class="sm c" x="98" y="228">клиент</text><rect class="bxb" x="211" y="208" width="88" height="30" rx="6"/><text class="sm c" x="255" y="228">роутер</text><rect class="bx" x="368" y="208" width="88" height="30" rx="6"/><text class="sm c" x="412" y="228">сервер</text><path class="la" d="M144 270L199.0 270.0"/><polygon class="ha" points="209,270 199.0,275.0 199.0,265.0"/><path class="lr" d="M210 263L224 277M224 263L210 277"/><text class="sm c" x="176.5" y="260">приветствие</text><text class="sm tk rej c" x="255" y="326">игрушка: BLOCK</text><text class="sm tk rej c" x="412" y="326">0 байт</text><text class="sm mu" x="54" y="348">игрушка блокирует приветствие</text></g>
<g class="a e3"><rect class="bxo" x="490" y="170" width="430" height="190" rx="8"/><text class="mk" x="504" y="194">rst:ip_ttl=1</text><rect class="bx" x="504" y="208" width="88" height="30" rx="6"/><text class="sm c" x="548" y="228">клиент</text><rect class="bxb" x="661" y="208" width="88" height="30" rx="6"/><text class="sm c" x="705" y="228">роутер</text><rect class="bx" x="818" y="208" width="88" height="30" rx="6"/><text class="sm c" x="862" y="228">сервер</text><path class="lcut" d="M594 262L659 262"/><path class="lr" d="M660 255L674 269M674 255L660 269"/><text class="sm tk c" x="626.5" y="254">RST</text><path class="la" d="M594 290L806.0 290.0"/><polygon class="ha" points="816,290 806.0,295.0 806.0,285.0"/><text class="sm c" x="725" y="307">приветствие</text><text class="sm tk ok c" x="705" y="326">игрушка: FORGET</text><text class="sm tk ok c" x="862" y="326">250 байт</text><text class="sm mu" x="504" y="348">RST стёр память, приветствие прошло</text></g>
<g class="a e4"><text class="cap" x="40" y="388">код функции rst: основной блок, восемь строк</text><text class="ix mu r" x="920" y="388">строки 430-437</text></g>
<g class="a e5"><rect class="bx" x="40" y="400" width="590" height="222" rx="6"/><path class="lm" d="M86 406L86 616"/><text class="ix mu r" x="78" y="425">430</text><text class="ix fg" x="96" y="425">local dis = deepcopy(desync.dis)</text><text class="ix mu r" x="78" y="451">431</text><text class="ix fg" x="96" y="451">dis.payload = &quot;&quot;</text><text class="ix mu r" x="78" y="477">432</text><text class="ix fg" x="96" y="477">dis.tcp.th_flags = TH_RST + (desync.arg.rstack and TH_ACK or 0)</text><text class="ix mu r" x="78" y="503">433</text><text class="ix fg" x="96" y="503">apply_fooling(desync, dis)</text><text class="ix mu r" x="78" y="529">434</text><text class="ix fg" x="96" y="529">apply_ip_id(desync, dis, nil, &quot;none&quot;)</text><text class="ix mu r" x="78" y="555">435</text><text class="ix fg" x="96" y="555">DLOG(&quot;rst&quot;)</text><text class="ix mu r" x="78" y="581">436</text><text class="ix fg mu" x="96" y="581">-- it uses rawsend, reconstruct and ipfrag options</text><text class="ix mu r" x="78" y="607">437</text><text class="ix fg" x="96" y="607">rawsend_dissect_ipfrag(dis, desync_opts(desync))</text></g>
