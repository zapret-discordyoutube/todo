<svg xmlns="http://www.w3.org/2000/svg" class="v08-s12-six-packets-ladder" viewBox="0 0 960 618" width="960" height="618" role="img" aria-labelledby="v08-s12-six-packets-ladder-t v08-s12-six-packets-ladder-d">
<title id="v08-s12-six-packets-ladder-t">Перемешивание с фейками: шесть пакетов</title>
<desc id="v08-s12-six-packets-ladder-d">Перемешивание с фейками, шесть пакетов клиента по порядку: фейк второй половины с номером 105 и длиной 146, настоящая вторая половина с теми же номером и длиной, ещё фейк второй половины, потом фейк первой половины с номером 1 и длиной 104, настоящая первая половина и ещё фейк первой, сервер молчит на фейки, на настоящую вторую отвечает «жду байт номер 1» с блоком со 105-го по 250-й, а когда приходит первая половина, отвечает «жду байт номер 251», и приложение читает 250 байт, равных оригиналу, с именем сайта.</desc>
