<g><text class="cap" x="40" y="26">после «нет» в таблице блокировок: другой путь</text></g>
<g class="a e1"><rect class="bxb" x="699.5" y="10" width="220.5" height="22" rx="11"/><text class="cap amb c" x="809.7" y="25.5">по общим сведениям</text></g>
<g class="a e2"><rect class="bxs" x="40" y="44" width="880" height="70" rx="8"/><text class="sm mu" x="54" y="66">zapret2 их не лечит: он меняет только начало соединения</text></g>
<g class="a e3"><rect class="bxr" x="54" y="78" width="120.4" height="26" rx="13.0"/><text class="sm rej" x="63" y="96">подмена DNS</text></g>
<g class="a e4"><rect class="bxr" x="186.4" y="78" width="135" height="26" rx="13.0"/><text class="sm rej" x="195.4" y="96">блок по адресу</text></g>
<g class="a e5"><rect class="bxr" x="333.4" y="78" width="126" height="26" rx="13.0"/><text class="sm rej" x="342.4" y="96">блок по порту</text></g>
<g class="a e6"><path class="lf" d="M473.4 91L550 91"/><polygon class="hf" points="560,91 550,96 550,86"/></g>
<g class="a e7"><rect class="bxa" x="570" y="76" width="323" height="30" rx="15.0"/><text class="sm tk" x="579" y="96">нужен другой путь: VPN или прокси</text></g>
<g class="a e8"><text class="tk" x="40" y="156">что лечат</text><rect class="bxb" x="249.5" y="140" width="220.5" height="22" rx="11"/><text class="cap amb c" x="359.7" y="155.5">по общим сведениям</text></g>
<g class="a e9"><text class="tk" x="490" y="156">чем платят</text><rect class="bxb" x="699.5" y="140" width="220.5" height="22" rx="11"/><text class="cap amb c" x="809.7" y="155.5">по общим сведениям</text></g>
<g class="a e10"><rect class="bxo" x="40" y="170" width="430" height="54" rx="8"/><text class="tk" x="54" y="193">подмену DNS</text><text class="sm mu" x="54" y="213">если запросы к DNS идут через них</text></g>
<g class="a e11"><rect class="bxo" x="40" y="232" width="430" height="54" rx="8"/><text class="tk" x="54" y="255">блок по адресу</text><text class="sm mu" x="54" y="275">пакеты идут на адрес посредника</text></g>
<g class="a e12"><rect class="bxo" x="40" y="294" width="430" height="54" rx="8"/><text class="tk" x="54" y="317">блок по порту</text><text class="sm mu" x="54" y="337">пакеты идут на адрес посредника</text></g>
<g class="a e13"><rect class="bxo" x="40" y="356" width="430" height="54" rx="8"/><text class="tk" x="54" y="379">скрыть посещаемый сайт</text><text class="sm mu" x="54" y="399">от местной сети; зависит от вида</text></g>
<g class="a e14"><rect class="bxb" x="490" y="170" width="430" height="54" rx="8"/><text class="tk" x="504" y="193">сервер: арендовать или довериться</text><text class="sm mu" x="504" y="213">кто его держит, видит, куда вы ходите</text></g>
<g class="a e15"><rect class="bxb" x="490" y="232" width="430" height="54" rx="8"/><text class="tk" x="504" y="255">путь длиннее</text><text class="sm mu" x="504" y="275">скорость иногда ниже</text></g>
<g class="a e16"><rect class="bxb" x="490" y="294" width="430" height="54" rx="8"/><text class="tk" x="504" y="317">туннель или адрес сервера</text><text class="sm mu" x="504" y="337">тоже могут заблокировать</text></g>
