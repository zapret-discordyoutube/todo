<svg xmlns="http://www.w3.org/2000/svg" class="v00-s06-cures-costs" viewBox="0 0 960 626" width="960" height="626" role="img" aria-labelledby="v00-s06-cures-costs-t v00-s06-cures-costs-d">
<title id="v00-s06-cures-costs-t">Что лечат VPN и прокси и чем платят</title>
<desc id="v00-s06-cures-costs-d">По общим сведениям, VPN и прокси лечат подмену DNS, если запросы к DNS идут через них, а также блок по адресу и по порту, потому что пакеты идут на адрес посредника, и иногда скрывают от местной сети посещаемые сайты, а платят арендой сервера или доверием к нему, более длинным путём и риском, что туннель или адрес сервера тоже заблокируют; в документации zapret2 слово VPN встречается один раз, в описании назначения, слова прокси там нет, и раздела о том, чем zapret2 отличается от VPN, тоже нет.</desc>
