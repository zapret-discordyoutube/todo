<g><text class="cap" x="40" y="26">nfq_init, вторая половина: nfqws.c:398-425</text></g>
<g class="a e1"><rect class="bx" x="40" y="40" width="880" height="50" rx="5"/><text class="ix" x="48" y="61">399</text><rect class="bxr" x="92" y="46" width="96" height="23" rx="4"/><text class="tk sm c rej" x="140" y="62">фатально</text><text class="m" x="200" y="62">nfq_set_mode(*qh, NFQNL_COPY_PACKET, 0xffff)</text><text class="tk sm r" x="910" y="62">копировать пакет целиком</text><text class="ix" x="200" y="81">0xffff это 65535 байт; наш запрос в 302 байта помещается</text></g>
<g class="a e2"><rect class="bx" x="40" y="96" width="880" height="50" rx="5"/><text class="ix" x="48" y="117">403</text><rect class="bxr" x="92" y="102" width="96" height="23" rx="4"/><text class="tk sm c rej" x="140" y="118">фатально</text><text class="m" x="200" y="118">nfq_set_queue_maxlen(*qh, Q_MAXLEN)</text><text class="tk sm r" x="910" y="118">длина очереди: 4096 пакетов</text><text class="ix" x="200" y="137">по общим сведениям, столько пакетов ждут вердикта в ядре</text></g>
<g class="a e3"><rect class="bx" x="40" y="152" width="880" height="50" rx="5"/><text class="ix" x="48" y="173">408</text><rect class="bxs" x="92" y="158" width="96" height="23" rx="4"/><text class="tk sm c mu" x="140" y="174">запись</text><text class="m" x="200" y="174">nfq_set_queue_flags(*qh, NFQA_CFG_F_FAIL_OPEN, …)</text><text class="tk sm r" x="910" y="174">fail-open: не выбрасывать</text><text class="ix" x="200" y="193">комментарий автора: accept packets if they cant be handled; в деле не видели</text></g>
<g class="a e4"><rect class="bx" x="40" y="208" width="880" height="50" rx="5"/><text class="ix" x="48" y="229">414</text><rect class="bxs" x="92" y="214" width="96" height="23" rx="4"/><text class="tk sm c mu" x="140" y="230">запись</text><text class="m" x="200" y="230">nfnl_rcvbufsiz(nfq_nfnlh(*h), Q_RCVBUF) / 2</text><text class="tk sm r" x="910" y="230">буфер приёма: 1048576 Б</text><text class="ix" x="200" y="249">ответ библиотеки делится на два и сравнивается с запрошенным</text></g>
<g class="a e5"><rect class="bx" x="40" y="264" width="880" height="50" rx="5"/><text class="ix" x="48" y="285">423</text><rect class="bxs" x="92" y="270" width="96" height="23" rx="4"/><text class="tk sm c mu" x="140" y="286">запись</text><text class="m" x="200" y="286">setsockopt(fd, SOL_NETLINK, NETLINK_NO_ENOBUFS, …)</text><text class="tk sm r" x="910" y="286">не сообщать о переполнении</text><text class="ix" x="200" y="305">по общим сведениям; как это работает, не проверяли</text></g>
<g class="a e6"><text class="cap" x="40" y="344">что значит «копия до 65535 байт»</text><rect class="bxa" x="40" y="356" width="880" height="26" rx="3"/><text class="sm c ns" x="560" y="374">от 0 до 65535 байт</text></g>
<g class="a e7"><rect class="bxo" x="40" y="356" width="4" height="26" rx="0"/><path class="lf" d="M42 382L42 412"/><text class="tk sm" x="52" y="426">наш запрос: 302 байта от заголовка IP, помещается целиком</text></g>
<g class="a e8"><rect class="bxa" x="40" y="444" width="340" height="70" rx="6"/><text class="ml" x="56" y="474">4096</text><text class="tk sm" x="116" y="474">пакетов (Q_MAXLEN)</text><text class="ix" x="56" y="498">params.h:27</text></g>
<g class="a e9"><rect class="bxd" x="400" y="444" width="520" height="70" rx="6"/><text class="sm" x="414" y="466">что при переполнении, мы не проверяли;</text><text class="sm" x="414" y="486">в 92 журналах переполнения не видели:</text><text class="sm" x="414" y="506">за опыт в очередь попадало не больше 24 пакетов</text></g>
</svg>
