<svg xmlns="http://www.w3.org/2000/svg" class="v16-s12-queue-conditions" viewBox="0 0 960 534" width="960" height="534" role="img" aria-labelledby="v16-s12-queue-conditions-t v16-s12-queue-conditions-d">
<title id="v16-s12-queue-conditions-t">Условия работы очереди: пять вызовов</title>
<desc id="v16-s12-queue-conditions-d">Вторая половина nfq_init: условия работы очереди, пять вызовов по строкам nfqws.c. 399 nfq_set_mode(…, NFQNL_COPY_PACKET, 0xffff): копировать пакет целиком, до 65535 байт (сбой фатален); 403 nfq_set_queue_maxlen(…, Q_MAXLEN): длина очереди 4096 пакетов (сбой фатален); 408 nfq_set_queue_flags(…, NFQA_CFG_F_FAIL_OPEN, …): флаг fail-open, комментарий автора «accept packets if they cant be handled», только запись; 414 nfnl_rcvbufsiz(…, Q_RCVBUF) / 2: буфер приёма 1048576 байт, только запись; 423 setsockopt(…, NETLINK_NO_ENOBUFS, …): про ошибку переполнения, только запись. Лента: копия от 0 до 65535 байт, наш запрос в 302 байта от заголовка IP помещается целиком. Предел 4096 пакетов: что при переполнении, не проверяли, в 92 журналах не видели, за опыт в очередь попадало не больше 24 пакетов.</desc>
<style>.v16-s12-queue-conditions{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
