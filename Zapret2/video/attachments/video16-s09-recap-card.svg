.v16-s09-recap-card .lcut{fill:none;stroke:var(--rej);stroke-width:1.8;stroke-dasharray:6 4}
.v16-s09-recap-card .lb{fill:none;stroke:var(--amb);stroke-width:2}
.v16-s09-recap-card .lo{fill:none;stroke:var(--ok);stroke-width:2.4}
.v16-s09-recap-card .hf{fill:var(--fg2)}.v16-s09-recap-card .ha{fill:var(--acc)}.v16-s09-recap-card .hr{fill:var(--rej)}.v16-s09-recap-card .hm{fill:var(--mute)}.v16-s09-recap-card .hb{fill:var(--amb)}
.v16-s09-recap-card .fun{fill:var(--tint);stroke:var(--acc);stroke-width:1;stroke-opacity:.55}
.v16-s09-recap-card .a{animation-duration:38s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
