<rect class="bg" x="0" y="0" width="960" height="556"/>
<g><text class="cap" x="40" y="26">итог первой части: карточка маршрута пакета</text></g>
<g class="a e1"><rect class="bx" x="40" y="44" width="880" height="32" rx="5"/><rect class="fa" x="40" y="44" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="65">Где стоит пункт досмотра</text><text class="sm" x="300" y="65">ядро (здание) → окошко очереди → программа nfqws2 (соседняя контора)</text></g>
<g class="a e2"><rect class="bx" x="40" y="80" width="880" height="32" rx="5"/><rect class="fa" x="40" y="80" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="101">Номер очереди</text><text class="sm" x="300" y="101">от 0 до 65535; в правиле queue num 200, в программе --qnum=200</text></g>
<g class="a e3"><rect class="bx" x="40" y="116" width="880" height="32" rx="5"/><rect class="fa" x="40" y="116" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="137">Вердикт</text><rect class="bxo" x="300" y="120" width="88" height="24" rx="4"/><text class="mk c ok" x="344" y="137">PASS</text><rect class="bxb" x="396" y="120" width="88" height="24" rx="4"/><text class="mk c amb" x="440" y="137">MODIFY</text><rect class="bxr" x="492" y="120" width="88" height="24" rx="4"/><text class="mk c rej" x="536" y="137">DROP</text><text class="sm" x="596" y="137">пропустить · заменить · выбросить</text></g>
<g class="a e4"><rect class="bx" x="40" y="152" width="880" height="32" rx="5"/><rect class="fo" x="40" y="152" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="173">Проверено</text><text class="sm" x="300" y="173">20 из 20 пакетов: программа стоит на пути пакета (наш тест)</text></g>
<g class="a e5"><rect class="bx" x="40" y="188" width="880" height="32" rx="5"/><rect class="fb" x="40" y="188" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="209">Цена захода</text><text class="sm" x="300" y="209">порядка 130 мкс: наша оценка, один компьютер, журнал включён</text></g>
<g class="a e6"><rect class="bx" x="40" y="224" width="880" height="32" rx="5"/><rect class="fa" x="40" y="224" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="245">Точка и приоритет</text><text class="sm" x="300" y="245">post: postrouting, 101 · pre: prerouting, −101 · predefrag: output, −401</text></g>
<g class="a e7"><rect class="bx" x="40" y="260" width="880" height="32" rx="5"/><rect class="fa" x="40" y="260" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="281">Метка</text><text class="sm" x="300" y="281">бит 30 (0x40000000): так помечены пакеты самой программы</text></g>
<g class="a e8"><rect class="bx" x="40" y="296" width="880" height="32" rx="5"/><rect class="fa" x="40" y="296" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="317">Порт</text><text class="sm" x="300" y="317">80 и 443</text></g>
<g class="a e9"><rect class="bx" x="40" y="332" width="880" height="32" rx="5"/><rect class="fa" x="40" y="332" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="353">Очередь и bypass</text><text class="sm" x="300" y="353">queue num 200 bypass: если очередь никто не слушает, пакет проходит</text></g>
<g class="a e10"><rect class="bx" x="40" y="368" width="880" height="32" rx="5"/><rect class="fa" x="40" y="368" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="389">Набор</text><text class="sm" x="300" y="389">5 правил в 3 цепочках: post, pre и predefrag</text></g>
<g class="a e11"><rect class="bx" x="40" y="404" width="880" height="32" rx="5"/><rect class="fb" x="40" y="404" width="7" height="32" rx="3"/><text class="tk sm" x="60" y="425">Предел</text><text class="sm" x="300" y="425">первые 12 пакетов каждого направления; 12 не значение по умолчанию</text></g>
<g class="a e12"><text class="cap" x="40" y="458">следующая часть: что происходит внутри программы</text></g>
<g class="a e13"><rect class="bx" x="40" y="468" width="196" height="34" rx="6"/><text class="tk sm c" x="138" y="490">настройщик очереди</text><path class="lf" d="M238 485L254.0 485.0"/><polygon class="hf" points="264,485 254.0,490.0 254.0,480.0"/><rect class="bx" x="266" y="468" width="196" height="34" rx="6"/><text class="tk sm c" x="364" y="490">главный цикл</text><path class="lf" d="M464 485L480.0 485.0"/><polygon class="hf" points="490,485 480.0,490.0 480.0,480.0"/><rect class="bx" x="492" y="468" width="196" height="34" rx="6"/><text class="tk sm c" x="590" y="490">приёмщик</text><path class="lf" d="M690 485L706.0 485.0"/><polygon class="hf" points="716,485 706.0,490.0 706.0,480.0"/><rect class="bx" x="718" y="468" width="196" height="34" rx="6"/><text class="tk sm c" x="816" y="490">вердикт ядру</text></g>
</svg>
