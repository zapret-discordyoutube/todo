<svg xmlns="http://www.w3.org/2000/svg" class="v16-s09-recap-card" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="v16-s09-recap-card-t v16-s09-recap-card-d">
<title id="v16-s09-recap-card-t">Карточка маршрута пакета: итог первой части</title>
<desc id="v16-s09-recap-card-d">Растущая карточка маршрута пакета, итог первой части: ядро, окошко очереди и программа nfqws2 в соседней конторе; номер очереди от 0 до 65535 (в правиле queue num 200, в программе --qnum=200); три вердикта PASS, MODIFY и DROP; в нашем тесте 20 пакетов из 20 прошли через программу; цена захода порядка 130 мкс (наша оценка, один компьютер, журнал включён); цепочки post (postrouting, 101), pre (prerouting, −101) и predefrag (output, −401); метка бит 30 (0x40000000) у пакетов самой программы; порты 80 и 443; слово bypass; пять правил в трёх цепочках; предел первых 12 пакетов каждого направления, число 12 не значение по умолчанию. Внизу стрелка к следующей части: настройщик очереди, главный цикл, приёмщик, вердикт ядру.</desc>
<style>.v16-s09-recap-card{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
