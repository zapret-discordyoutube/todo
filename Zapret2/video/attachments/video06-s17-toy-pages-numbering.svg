<svg xmlns="http://www.w3.org/2000/svg" class="v06-s17-toy-pages-numbering" viewBox="0 0 960 468" width="960" height="468" role="img" aria-labelledby="v06-s17-toy-pages-numbering-t v06-s17-toy-pages-numbering-d">
<title id="v06-s17-toy-pages-numbering-t">Статья на двух страницах: своя нумерация</title>
<desc id="v06-s17-toy-pages-numbering-d">Выдуманный пример про окна кусков: статья в 20 строк напечатана на двух страницах (строки с 1 по 12 и с 13 по 20), каждая типография нумерует строки своей страницы заново с единицы, отметка на строке 15 не находит строки на первой странице и даёт на второй строку 15 − 13 + 1 = 3, отметка на строке 5 попадает на первую страницу и не находит строки на второй, а отметка на строке 13 даёт на второй странице строку 1, и разрез перед первой строкой страницы разрезом не считается.</desc>
<style>.v06-s17-toy-pages-numbering{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#767676);--line:var(--lightgray,#d4d4d4);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10);--ok:#237a4b;--okt:rgba(35,122,75,.11);--amb:#a8610a;--ambt:rgba(168,97,10,.13)}
