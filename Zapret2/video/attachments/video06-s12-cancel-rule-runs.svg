<g><text class="cap" x="40" y="26">когда накладка отменяется</text></g>
<g class="a e1"><rect class="bxo" x="43.5" y="88" width="362.6" height="26" rx="3"/><rect class="bxr" x="406.1" y="88" width="513.9" height="26" rx="3"/><rect class="bxb" x="40" y="88" width="3.5" height="26" rx="0"/><text class="sm c" x="224.8" y="106">метка левее разреза: 1…103</text><text class="sm c" x="663" y="106">на разрезе или правее: отмена</text></g>
<g class="a e2"><text class="ix" x="40" y="134">0</text><text class="ix r" x="399.6" y="134">103</text><text class="ix" x="409.1" y="134">104: первый разрез</text><text class="ix r" x="920" y="134">250</text><path class="lcut" d="M406.08 78L406.08 120"/><text class="sm mu" x="40" y="158">0 — ноль накладок: не ошибка, но и накладки нет</text><text class="sm mu r" x="920" y="158">999: за концом сообщения, не разрешается</text></g>
<g class="a e3 tr"><polygon class="ha" points="36.5,52 50.5,52 43.5,66"/><text class="sm acc" x="55.5" y="60">метка</text></g>
<g class="a e4"><path class="lr" d="M398.08 94L414.08 108"/><path class="lr" d="M414.08 94L398.08 108"/></g>
<g class="a e5"><rect class="bxb" x="40" y="186" width="880" height="82" rx="8"/><text class="tk" x="54" y="208">выдуманный пример: писец</text><text class="sm" x="54" y="228">черновые строки пишутся только поверх первой страницы;</text><text class="sm" x="54" y="246">перед ними должна остаться хотя бы одна настоящая строка;</text><text class="sm" x="54" y="262">иначе писец откладывает перо и отправляет страницу как есть</text></g>
<g class="a e6"><rect class="bx" x="40" y="284" width="880" height="108" rx="8"/><text class="mk" x="54" y="308">seqovl=midsld</text><text class="sm mu" x="181.5" y="308">метка 104, разрез 104</text></g>
<g class="a e7"><text class="m rej" x="54" y="330">seqovl cancelled because seqovl 104 is not less than the first split pos 104</text></g>
<g class="a e8"><rect class="bxa" x="54" y="340" width="110" height="24" rx="3"/><text class="sm c" x="109" y="357">146@104</text><rect class="bxo" x="172" y="340" width="110" height="24" rx="3"/><text class="sm c" x="227" y="357">104@0</text><text class="m" x="296" y="357">ack 1 S[105,251), ack 251</text></g>
<g class="a e9"><text class="sm" x="54" y="383">функция не падает: работает как без seqovl</text></g>
<g class="a e10"><rect class="bxo" x="780" y="340" width="126" height="24" rx="4"/><text class="sm ok c" x="843" y="357">как без seqovl</text></g>
<g class="a e11"><rect class="bx" x="40" y="402" width="880" height="108" rx="8"/><text class="mk" x="54" y="426">seqovl=999</text><text class="sm mu" x="155.3" y="426">метка не разрешается</text></g>
<g class="a e12"><text class="m rej" x="54" y="448">seqovl cancelled because could not resolve marker '999'</text></g>
<g class="a e13"><rect class="bxa" x="54" y="458" width="110" height="24" rx="3"/><text class="sm c" x="109" y="475">146@104</text><rect class="bxo" x="172" y="458" width="110" height="24" rx="3"/><text class="sm c" x="227" y="475">104@0</text><text class="m" x="296" y="475">ack 1 S[105,251), ack 251</text></g>
