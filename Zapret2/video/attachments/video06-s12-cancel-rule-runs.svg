<svg xmlns="http://www.w3.org/2000/svg" class="v06-s12-cancel-rule-runs" viewBox="0 0 960 684" width="960" height="684" role="img" aria-labelledby="v06-s12-cancel-rule-runs-t v06-s12-cancel-rule-runs-d">
<title id="v06-s12-cancel-rule-runs-t">Отмена накладки: правило и три опыта</title>
<desc id="v06-s12-cancel-rule-runs-d">Когда функция multidisorder отменяет накладку: метка seqovl должна стоять строго левее первого разреза, то есть на смещении от 1 до 103 при разрезе на 104, а метка на самом разрезе или правее него отменяет накладку; в трёх опытах на нашем приветствии seqovl=midsld даёт в журнале строку об отмене с числами 104 и 104, seqovl=999 не разрешается и тоже отменяется, а seqovl=0 даёт ноль накладок без строки об отмене, и во всех трёх случаях на проводе те же два пакета, 146@104 и 104@0, ответы сервера без дублирующего блока (ack 1 с блоком с 105 по 250, затем ack 251), приложение читает 250 байт с равным хэшем.</desc>
