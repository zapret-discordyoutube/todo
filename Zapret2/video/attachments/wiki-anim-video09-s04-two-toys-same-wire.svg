<svg xmlns="http://www.w3.org/2000/svg" class="video09-s04-two-toys-same-wire" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="video09-s04-two-toys-same-wire-t video09-s04-two-toys-same-wire-d">
<title id="video09-s04-two-toys-same-wire-t">Один пакет и два исхода</title>
<desc id="video09-s04-two-toys-same-wire-d">В нашем тесте SYN с шестнадцатью нулевыми байтами без имени сайта обманул игрушку «первый решает», которая объявила поток чистым, и приветствие дошло до сервера, а игрушку «данные SYN не читает» он не обманул: она пропустила SYN, нашла имя в приветствии и заблокировала его вместе с четырьмя повторами, так что сервер получил 0 байт.</desc>
