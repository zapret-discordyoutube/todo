<svg xmlns="http://www.w3.org/2000/svg" class="video08-s01-cut-and-two-runs" viewBox="0 0 960 574" width="960" height="574" role="img" aria-labelledby="video08-s01-cut-and-two-runs-t video08-s01-cut-and-two-runs-d">
<title id="video08-s01-cut-and-two-runs-t">Разрез и правило игрушки</title>
<desc id="video08-s01-cut-and-two-runs-d">Приветствие в 250 байт с именем сайта на байтах 97–111 режется перед байтом 104 на пакеты в 104 и 146 байт, и в нашем тесте игрушечное правило, которое смотрит одно и то же место каждого пакета, без разреза находит имя и сервер получает 0 байт, а с разрезом не находит имени ни в одном пакете и сервер получает все 250 байт.</desc>
