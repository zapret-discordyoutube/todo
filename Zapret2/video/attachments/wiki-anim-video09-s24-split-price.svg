<svg xmlns="http://www.w3.org/2000/svg" class="v09-s24-split-price" viewBox="0 0 960 786" width="960" height="786" role="img" aria-labelledby="v09-s24-split-price-t v09-s24-split-price-d">
<title id="v09-s24-split-price-t">Цена расщепления SYN-ACK</title>
<desc id="v09-s24-split-price-d">Расщепление SYN-ACK стоит серверу один круг, в нашем тесте пауза между ACK клиента и приветствием у обычного сервера 0,09 мс, а в режиме synack около 11 мс при круге в 10 мс, в режимах syn и acksyn клиент шлёт приветствие пять раз с паузами 216, 216, 463 и 849 мс, сервер подтверждает данные только после пятой копии примерно через 1,8 с после первого SYN, а счётчики сервера показывают четыре отвергнутых эха метки времени, один повтор SYN-ACK и один тайм-аут, причём это наше чтение, ядро сервера мы не открывали.</desc>
