<title id="dsh-awg3-wire-t">Пакеты AmneziaWG 3.0 на проводе: nonce и псевдослучайность</title>
<desc id="dsh-awg3-wire-d">В 3.0 пакет открывается 12 байтами nonce, остаток префикса S случайный, а заголовок и сообщение зашифрованы ChaCha20: на проводе сплошная псевдослучайность. Размер Init всегда S1 + 148 байт для данной конфигурации.</desc>
