<text class="dsh-dpi-gates-mu dsh-dpi-gates-sm" x="182" y="188">IP в подсети или AS</text><text class="dsh-dpi-gates-mu dsh-dpi-gates-sm" x="182" y="206">дата-центра под</text><text class="dsh-dpi-gates-mu dsh-dpi-gates-sm" x="182" y="224">анализом</text>
