<svg xmlns="http://www.w3.org/2000/svg" class="dsh-dpi-gates" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="dsh-dpi-gates-t dsh-dpi-gates-d">
<title id="dsh-dpi-gates-t">Блокировка включается, только если совпали все три условия</title>
<desc id="dsh-dpi-gates-d">ТСПУ оценивает ClientHello по трём косвенным признакам: маршрут, TLS-отпечаток, поведение. Если совпали все три — заморозка всех TLS-соединений к узлу на 120 секунд. Достаточно сломать любое одно условие: другой отпечаток (Firefox), HTTP/2 вместо лавины соединений или сайт вне подозрительной подсети.</desc>
