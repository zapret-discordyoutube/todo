<g class="a dsh-dpi-gates-e15"><text class="dsh-dpi-gates-tk dsh-dpi-gates-sm" x="2" y="384">Двойная ловушка: если во время заморозки сменить отпечаток, ТСПУ добавляет штраф — 600 секунд.</text></g>
