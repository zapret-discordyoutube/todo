<svg xmlns="http://www.w3.org/2000/svg" class="dsh-dpi-http2" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="dsh-dpi-http2-t dsh-dpi-http2-d">
<title id="dsh-dpi-http2-t">HTTP/2 сворачивает лавину рукопожатий в одно</title>
<desc id="dsh-dpi-http2-d">HTTP/1.1 открывает от 6 до примерно 30 параллельных TCP-соединений, в каждом свой TLS-хендшейк: лимит около трёх за 60 секунд превышен, ТСПУ замораживает узел на 120 секунд. HTTP/2 мультиплексирует всё в одно соединение с одним хендшейком, лимит не превышен.</desc>
<style>.dsh-dpi-http2{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-dpi-http2{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-dpi-http2 .dsh-dpi-http2-bg{fill:var(--bg)}.dsh-dpi-http2 text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-dpi-http2 .dsh-dpi-http2-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-dpi-http2 .dsh-dpi-http2-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-dpi-http2 .dsh-dpi-http2-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-dpi-http2 .dsh-dpi-http2-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-dpi-http2 .dsh-dpi-http2-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-dpi-http2 .dsh-dpi-http2-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-dpi-http2 .dsh-dpi-http2-sm{font-size:14.5px}.dsh-dpi-http2 .dsh-dpi-http2-mu{fill:var(--mute)}.dsh-dpi-http2 .dsh-dpi-http2-fg{fill:var(--fg)}.dsh-dpi-http2 .dsh-dpi-http2-acc{fill:var(--acc)}.dsh-dpi-http2 .dsh-dpi-http2-rej{fill:var(--rej)}.dsh-dpi-http2 .dsh-dpi-http2-c{text-anchor:middle}.dsh-dpi-http2 .dsh-dpi-http2-r{text-anchor:end}.dsh-dpi-http2 .dsh-dpi-http2-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-dpi-http2 .dsh-dpi-http2-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-dpi-http2 .dsh-dpi-http2-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-dpi-http2 .dsh-dpi-http2-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-dpi-http2 .dsh-dpi-http2-bxn{fill:none;stroke:none}.dsh-dpi-http2 .dsh-dpi-http2-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-dpi-http2 .dsh-dpi-http2-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-dpi-http2 .dsh-dpi-http2-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-dpi-http2 .dsh-dpi-http2-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-dpi-http2 .dsh-dpi-http2-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-dpi-http2 .dsh-dpi-http2-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-dpi-http2 .dsh-dpi-http2-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-dpi-http2 .dsh-dpi-http2-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-dpi-http2 .dsh-dpi-http2-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-dpi-http2 .dsh-dpi-http2-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-dpi-http2 .dsh-dpi-http2-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-dpi-http2 .dsh-dpi-http2-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-dpi-http2 .dsh-dpi-http2-bxbg{fill:var(--bg);stroke:none}.dsh-dpi-http2 .dsh-dpi-http2-hd-a{fill:var(--acc)}.dsh-dpi-http2 .dsh-dpi-http2-hd-f{fill:var(--fg2)}.dsh-dpi-http2 .dsh-dpi-http2-hd-r{fill:var(--rej)}.dsh-dpi-http2 .dsh-dpi-http2-dot{fill:var(--acc)}.dsh-dpi-http2 .dsh-dpi-http2-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-dpi-http2 .dsh-dpi-http2-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-dpi-http2 .dsh-dpi-http2-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-dpi-http2 .dsh-dpi-http2-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-dpi-http2 .a{animation-duration:14s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-dpi-http2 .a{animation:none}.dsh-dpi-http2 .tr{display:none}}figure.dsh-dpi-http2-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-dpi-http2-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-dpi-http2-k1{0.0%{opacity:0;transform:translate(-60px,0px)}5.714%{opacity:0;transform:translate(-60px,0px)}7.143%{opacity:1;transform:translate(-60px,0px)}10.714%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-http2 .dsh-dpi-http2-e1{animation-name:dsh-dpi-http2-k1}@keyframes dsh-dpi-http2-k2{0.0%{opacity:0;transform:translate(-60px,0px)}8.214%{opacity:0;transform:translate(-60px,0px)}9.643%{opacity:1;transform:translate(-60px,0px)}13.214%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-http2 .dsh-dpi-http2-e2{animation-name:dsh-dpi-http2-k2}@keyframes dsh-dpi-http2-k3{0.0%{opacity:0;transform:translate(-60px,0px)}10.714%{opacity:0;transform:translate(-60px,0px)}12.143%{opacity:1;transform:translate(-60px,0px)}15.714%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-http2 .dsh-dpi-http2-e3{animation-name:dsh-dpi-http2-k3}@keyframes dsh-dpi-http2-k4{0.0%{opacity:0;transform:translate(-60px,0px)}13.214%{opacity:0;transform:translate(-60px,0