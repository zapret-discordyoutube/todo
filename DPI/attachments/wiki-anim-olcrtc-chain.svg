<svg xmlns="http://www.w3.org/2000/svg" class="dsh-olcrtc-chain" viewBox="0 0 960 200" width="960" height="200" role="img" aria-labelledby="dsh-olcrtc-chain-t dsh-olcrtc-chain-d">
<title id="dsh-olcrtc-chain-t">Как olcrtc прячет трафик в звонок WebRTC</title>
<desc id="dsh-olcrtc-chain-d">Приложение отправляет трафик в SOCKS5 на 127.0.0.1:8808, клиент olcrtc cnc передаёт его через WebRTC и SFU-сервис вроде Jitsi, Телемоста или WbStream на сервер olcrtc srv, который выходит в интернет.</desc>
