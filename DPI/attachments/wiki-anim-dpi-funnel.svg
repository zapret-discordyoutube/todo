<g class="a dsh-dpi-funnel-e12"><path class="dsh-dpi-funnel-sl-f" d="M150.0 456L150.0 476"/><polygon class="dsh-dpi-funnel-hd-f" points="150.0,476.0 145.0,466.0 155.0,466.0"/></g>
