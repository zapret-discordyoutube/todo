<svg xmlns="http://www.w3.org/2000/svg" class="dsh-dpi-funnel" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="dsh-dpi-funnel-t dsh-dpi-funnel-d">
<title id="dsh-dpi-funnel-t">Анализ трафика идёт воронкой: чем дальше, тем дороже</title>
<desc id="dsh-dpi-funnel-d">DPI проверяет поток по ступеням: первые пакеты дают отпечаток ОС, первые байты — протокольный маркер, ClientHello — JA3 и JA4, далее сертификат, метаанализ потока и после 16 КБ поведенческий ML-классификатор. Итог — пропустить, RST, drop или throttle.</desc>
<style>.dsh-dpi-funnel{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-dpi-funnel{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-dpi-funnel .dsh-dpi-funnel-bg{fill:var(--bg)}.dsh-dpi-funnel text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-dpi-funnel .dsh-dpi-funnel-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-dpi-funnel .dsh-dpi-funnel-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-dpi-funnel .dsh-dpi-funnel-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-dpi-funnel .dsh-dpi-funnel-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-dpi-funnel .dsh-dpi-funnel-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-dpi-funnel .dsh-dpi-funnel-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-dpi-funnel .dsh-dpi-funnel-sm{font-size:14.5px}.dsh-dpi-funnel .dsh-dpi-funnel-mu{fill:var(--mute)}.dsh-dpi-funnel .dsh-dpi-funnel-fg{fill:var(--fg)}.dsh-dpi-funnel .dsh-dpi-funnel-acc{fill:var(--acc)}.dsh-dpi-funnel .dsh-dpi-funnel-rej{fill:var(--rej)}.dsh-dpi-funnel .dsh-dpi-funnel-c{text-anchor:middle}.dsh-dpi-funnel .dsh-dpi-funnel-r{text-anchor:end}.dsh-dpi-funnel .dsh-dpi-funnel-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-dpi-funnel .dsh-dpi-funnel-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-dpi-funnel .dsh-dpi-funnel-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-dpi-funnel .dsh-dpi-funnel-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-dpi-funnel .dsh-dpi-funnel-bxn{fill:none;stroke:none}.dsh-dpi-funnel .dsh-dpi-funnel-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-dpi-funnel .dsh-dpi-funnel-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-dpi-funnel .dsh-dpi-funnel-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-dpi-funnel .dsh-dpi-funnel-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-dpi-funnel .dsh-dpi-funnel-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-dpi-funnel .dsh-dpi-funnel-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-dpi-funnel .dsh-dpi-funnel-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-dpi-funnel .dsh-dpi-funnel-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-dpi-funnel .dsh-dpi-funnel-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-dpi-funnel .dsh-dpi-funnel-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-dpi-funnel .dsh-dpi-funnel-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-dpi-funnel .dsh-dpi-funnel-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-dpi-funnel .dsh-dpi-funnel-bxbg{fill:var(--bg);stroke:none}.dsh-dpi-funnel .dsh-dpi-funnel-hd-a{fill:var(--acc)}.dsh-dpi-funnel .dsh-dpi-funnel-hd-f{fill:var(--fg2)}.dsh-dpi-funnel .dsh-dpi-funnel-hd-r{fill:var(--rej)}.dsh-dpi-funnel .dsh-dpi-funnel-dot{fill:var(--acc)}.dsh-dpi-funnel .dsh-dpi-funnel-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-dpi-funnel .dsh-dpi-funnel-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-dpi-funnel .dsh-dpi-funnel-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-dpi-funnel .dsh-dpi-funnel-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-dpi-funnel .a{animation-duration:12.6s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-dpi-funnel .a{animation:none}.dsh-dpi-funnel .tr{display:none}}figure.dsh-dpi-funnel-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-dpi-funnel-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-dpi-funnel-k1{0.0%{opacity:0;transform:translate(-10px,0px)}3.175%{opacity:0;transform:translate(-10px,0px)}5.556%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e1{animation-name:dsh-dpi-funnel-k1}@keyframes dsh-dpi-funnel-k2{0.0%{opacity:0;transform:translate(0px,0px)}6.349%{opacity:0;transform:translate(0px,0px)}7.937%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e2{animation-name:dsh-dpi-funnel-k2}@keyframes dsh-dpi-funnel-k3{0.0%{opacity:0;transform:translate(-10px,0px)}12.698%{opacity:0;transform:translate(-10px,0px)}15.079%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e3{animation-name:dsh-dpi-funnel-k3}@keyframes dsh-dpi-funnel-k4{0.0%{opacity:0;transform:translate(0px,0px)}15.873%{opacity:0;transform:translate(0px,0px)}17.46%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e4{animation-name:dsh-dpi-funnel-k4}@keyframes dsh-dpi-funnel-k5{0.0%{opacity:0;transform:translate(-10px,0px)}22.222%{opacity:0;transform:translate(-10px,0px)}24.603%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e5{animation-name:dsh-dpi-funnel-k5}@keyframes dsh-dpi-funnel-k6{0.0%{opacity:0;transform:translate(0px,0px)}25.397%{opacity:0;transform:translate(0px,0px)}26.984%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e6{animation-name:dsh-dpi-funnel-k6}@keyframes dsh-dpi-funnel-k7{0.0%{opacity:0;transform:translate(-10px,0px)}31.746%{opacity:0;transform:translate(-10px,0px)}34.127%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e7{animation-name:dsh-dpi-funnel-k7}@keyframes dsh-dpi-funnel-k8{0.0%{opacity:0;transform:translate(0px,0px)}34.921%{opacity:0;transform:translate(0px,0px)}36.508%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e8{animation-name:dsh-dpi-funnel-k8}@keyframes dsh-dpi-funnel-k9{0.0%{opacity:0;transform:translate(-10px,0px)}41.27%{opacity:0;transform:translate(-10px,0px)}43.651%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e9{animation-name:dsh-dpi-funnel-k9}@keyframes dsh-dpi-funnel-k10{0.0%{opacity:0;transform:translate(0px,0px)}44.444%{opacity:0;transform:translate(0px,0px)}46.032%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e10{animation-name:dsh-dpi-funnel-k10}@keyframes dsh-dpi-funnel-k11{0.0%{opacity:0;transform:translate(-10px,0px)}50.794%{opacity:0;transform:translate(-10px,0px)}53.175%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e11{animation-name:dsh-dpi-funnel-k11}@keyframes dsh-dpi-funnel-k12{0.0%{opacity:0;transform:translate(0px,0px)}53.968%{opacity:0;transform:translate(0px,0px)}55.556%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e12{animation-name:dsh-dpi-funnel-k12}@keyframes dsh-dpi-funnel-k13{0.0%{opacity:0;transform:translate(-10px,0px)}60.317%{opacity:0;transform:translate(-10px,0px)}62.698%{opacity:1;transform:translate(0px,0px)}95.635%{opacity:1;transform:translate(0px,0px)}98.81%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-dpi-funnel .dsh-dpi-funnel-e13{animation-name:dsh-dpi-funnel-k13}.dsh-dpi-funnel .dsh-dpi-funnel-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-dpi-funnel-bg" x="0" y="0" width="960" height="560"/>
<g class="a dsh-dpi-funnel-e1"><rect class="dsh-dpi-funnel-bx" x="2" y="10" width="300" height="54" rx="8"/><text class="dsh-dpi-funnel-tk dsh-dpi-funnel-sm" x="16" y="42.0">пакеты 1–5 (TCP/IP)</text><text class="dsh-dpi-funnel-mu dsh-dpi-funnel-sm" x="324" y="42.0">TTL, TCP-опции (MSS/WS/SACK/TS) → отпечаток ОС</text></g>
<g class="a dsh-dpi-funnel-e2"><path class="dsh-dpi-funnel-sl-f" d="M150.0 66L150.0 86"/><polygon class="dsh-dpi-funnel-hd-f" points="150.0,86.0 145.0,76.0 155.0,76.0"/></g>
<g class="a dsh-dpi-funnel-e3"><rect class="dsh-dpi-funnel-bx" x="2" y="88" width="300" height="54" rx="8"/><text class="dsh-dpi-funnel-tk dsh-dpi-funnel-sm" x="16" y="120.0">байты 0–5 (сигнатура)</text><text class="dsh-dpi-funnel-mu dsh-dpi-funnel-sm" x="324" y="120.0">протокольный маркер: 16 03 01… / SSH-2.0- / …</text></g>
<g class="a dsh-dpi-funnel-e4"><path class="dsh-dpi-funnel-sl-f" d="M150.0 144L150.0 164"/><polygon class="dsh-dpi-funnel-hd-f" points="150.0,164.0 145.0,154.0 155.0,154.0"/></g>
<g class="a dsh-dpi-funnel-e5"><rect class="dsh-dpi-funnel-bx" x="2" y="166" width="300" height="54" rx="8"/><text class="dsh-dpi-funnel-tk dsh-dpi-funnel-sm" x="16" y="198.0">байты 6–300 (TLS hello)</text><text class="dsh-dpi-funnel-mu dsh-dpi-funnel-sm" x="324" y="198.0">ClientHello → JA3 / JA4, фингерпринт клиента</text></g>
<g class="a dsh-dpi-funnel-e6"><path class="dsh-dpi-funnel-sl-f" d="M150.0 222L150.0 242"/><polygon class="dsh-dpi-funnel-hd-f" points="150.0,242.0 145.0,232.0 155.0,232.0"/></g>
<g class="a dsh-dpi-funnel-e7"><rect class="dsh-dpi-funnel-bx" x="2" y="244" width="300" height="54" rx="8"/><text class="dsh-dpi-funnel-tk dsh-dpi-funnel-sm" x="16" y="276.0">байты 300–3000</text><text class="dsh-dpi-funnel-mu dsh-dpi-funnel-sm" x="324" y="267.0">сертификат: CT-логи, ASN, CN/SAN ↔ SNI; в TLS 1.3 он шифруется,</text><text class="dsh-dpi-funnel-mu dsh-dpi-funnel-sm" x="324" y="285.0">остаются SNI и ASN</text></g>
<g class="a dsh-dpi-funnel-e8"><path class="dsh-dpi-funnel-sl-f" d="M150.0 300L150.0 320"/><polygon class="dsh-dpi-funnel-hd-f" points="150.0,320.0 145.0,310.0 155.0,310.0"/></g>
<g class="a dsh-dpi-funnel-e9"><rect class="dsh-dpi-funnel-bx" x="2" y="322" width="300" height="54" rx="8"/><text class="dsh-dpi-funnel-tk dsh-dpi-funnel-sm" x="16" y="354.0">байты 3000–16000</text><text class="dsh-dpi-funnel-mu dsh-dpi-funnel-sm" x="324" y="345.0">метаанализ потока: размеры, тайминги, соотношение in/out,</text><text class="dsh-dpi-funnel-mu dsh-dpi-funnel-sm" x="324" y="363.0">длительность</text></g>
<g class="a dsh-dpi-funnel-e10"><path class="dsh-dpi-funnel-sl-f" d="M150.0 378L150.0 398"/><polygon class="dsh-dpi-funnel-hd-f" points="150.0,398.0 145.0,388.0 155.0,388.0"/></g>
