<svg xmlns="http://www.w3.org/2000/svg" class="dsh-dpi-tls-gates" viewBox="0 0 960 262" width="960" height="262" role="img" aria-labelledby="dsh-dpi-tls-gates-t dsh-dpi-tls-gates-d">
<title id="dsh-dpi-tls-gates-t">Правило срабатывает, только если выполнены все три условия</title>
<desc id="dsh-dpi-tls-gates-d">TLS-соединение попадает под заморозку на 120 секунд, если подсеть сервера в списке, фингерпринт подозрительный и к одному SNI больше трёх соединений за короткое время. Достаточно разорвать любое одно звено.</desc>
