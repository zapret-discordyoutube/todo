<svg xmlns="http://www.w3.org/2000/svg" class="dsh-tls-in-tls" viewBox="0 0 960 152" width="960" height="152" role="img" aria-labelledby="dsh-tls-in-tls-t dsh-tls-in-tls-d">
<title id="dsh-tls-in-tls-t">«TLS в TLS»: два вложенных соединения</title>
<desc id="dsh-tls-in-tls-d">Внешний TLS или REALITY-туннель идёт от вас к вашему VPS, а внутри него идёт внутренний TLS от браузера до google.com; эта вложенность и называется TLS в TLS.</desc>
