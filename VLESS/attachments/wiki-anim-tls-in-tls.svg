pacity:1;transform:translate(0px,0px)}97.541%{opacity:0;transform:translate(8px,0px)}100%{opacity:0;transform:translate(8px,0px)}}.dsh-tls-in-tls .dsh-tls-in-tls-e4{animation-name:dsh-tls-in-tls-k4}.dsh-tls-in-tls .dsh-tls-in-tls-dsh{stroke-dasharray:5 5}</style>
