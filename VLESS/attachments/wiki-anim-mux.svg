<svg xmlns="http://www.w3.org/2000/svg" class="dsh-mux" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="dsh-mux-t dsh-mux-d">
<title id="dsh-mux-t">Mux: одно внешнее TLS-соединение несёт несколько подпотоков</title>
<desc id="dsh-mux-d">Внутри одного внешнего TLS-соединения идут подпотоки к разным сайтам, у каждого внутри свой TLS. Снаружи цензор видит только одно соединение.</desc>
<style>.dsh-mux{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-mux{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-mux .dsh-mux-bg{fill:var(--bg)}.dsh-mux text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-mux .dsh-mux-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-mux .dsh-mux-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-mux .dsh-mux-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-mux .dsh-mux-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-mux .dsh-mux-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-mux .dsh-mux-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-mux .dsh-mux-sm{font-size:14.5px}.dsh-mux .dsh-mux-mu{fill:var(--mute)}.dsh-mux .dsh-mux-fg{fill:var(--fg)}.dsh-mux .dsh-mux-acc{fill:var(--acc)}.dsh-mux .dsh-mux-rej{fill:var(--rej)}.dsh-mux .dsh-mux-c{text-anchor:middle}.dsh-mux .dsh-mux-r{text-anchor:end}.dsh-mux .dsh-mux-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-mux .dsh-mux-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-mux .dsh-mux-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-mux .dsh-mux-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-mux .dsh-mux-bxn{fill:none;stroke:none}.dsh-mux .dsh-mux-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-mux .dsh-mux-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-mux .dsh-mux-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-mux .dsh-mux-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-mux .dsh-mux-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-mux .dsh-mux-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-mux .dsh-mux-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-mux .dsh-mux-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-mux .dsh-mux-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-mux .dsh-mux-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-mux .dsh-mux-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-mux .dsh-mux-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-mux .dsh-mux-bxbg{fill:var(--bg);stroke:none}.dsh-mux .dsh-mux-hd-a{fill:var(--acc)}.dsh-mux .dsh-mux-hd-f{fill:var(--fg2)}.dsh-mux .dsh-mux-hd-r{fill:var(--rej)}.dsh-mux .dsh-mux-dot{fill:var(--acc)}.dsh-mux .dsh-mux-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-mux .dsh-mux-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-mux .dsh-mux-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-mux .dsh-mux-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-mux .a{animation-duration:9s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-mux .a{animation:none}.dsh-mux .tr{display:none}}figure.dsh-mux-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-mux-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-mux-k1{0.0%{opacity:0;transform:translate(-10px,0px)}6.667%{opacity:0;transform:translate(-10px,0px)}10.556%{opacity:1;transform:translate(0px,0px)}93.889%{opacity:1;transform:translate(0px,0px)}98.333%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-mux .dsh-mux-e1{animation-name:dsh-mux-k1}@keyframes dsh-mux-k2{0.0%{opacity:0;transform:translate(-10px,0px)}16.667%{opacity:0;transform:translate(-10px,0px)}20.556%{opacity:1;transform:translate(0px,0px)}93.889%{opacity:1;transform:translate(0px,0px)}98.333%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-mux .dsh-mux-e2{animation-name:dsh-mux-k2}@keyframes dsh-mux-k3{0.0%{opacity:0;transform:translate(-10px,0px)}26.667%{opacity:0;transform:translate(-10px,0px)}30.556%{opacity:1;transform:translate(0px,0px)}93.889%{opacity:1;transform:translate(0px,0px)}98.333%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-mux .dsh-mux-e3{animation-name:dsh-mux-k3}.dsh-mux .dsh-mux-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-mux-bg" x="0" y="0" width="960" height="250"/>
<rect class="dsh-mux-bxa" x="2" y="10" width="940" height="220" rx="12"/><text class="dsh-mux-tk" x="18" y="38">ОДНО внешнее TLS-соединение</text>
<g class="a dsh-mux-e1"><rect class="dsh-mux-bx" x="40" y="64" width="560" height="40" rx="8"/><text class="dsh-mux-tk dsh-mux-sm" x="56" y="89">подпоток 1 → сайт A</text><text class="dsh-mux-mu dsh-mux-sm" x="620" y="89">внутри свой TLS</text></g>
<g class="a dsh-mux-e2"><rect class="dsh-mux-bx" x="40" y="118" width="560" height="40" rx="8"/><text class="dsh-mux-tk dsh-mux-sm" x="56" y="143">подпоток 2 → сайт B</text><text class="dsh-mux-mu dsh-mux-sm" x="620" y="143">внутри свой TLS</text></g>
<g class="a dsh-mux-e3"><rect class="dsh-mux-bx" x="40" y="172" width="560" height="40" rx="8"/><text class="dsh-mux-tk dsh-mux-sm" x="56" y="197">подпоток 3 → сайт C</text><text class="dsh-mux-mu dsh-mux-sm" x="620" y="197">внутри свой TLS</text></g>
</svg>
