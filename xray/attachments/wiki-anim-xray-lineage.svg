<svg xmlns="http://www.w3.org/2000/svg" class="dsh-xray-lineage" viewBox="0 0 960 228" width="960" height="228" role="img" aria-labelledby="dsh-xray-lineage-t dsh-xray-lineage-d">
<title id="dsh-xray-lineage-t">От Shadowsocks до Xray: родословная</title>
<desc id="dsh-xray-lineage-d">Shadowsocks 2012 года стал идейным предшественником V2Ray 2015 года, который написан с нуля. После исчезновения автора V2Ray продолжило сообщество как v2fly в 2020, а в ноябре 2020 из-за лицензионного спора об XTLS от коммита 9a03cc5 отделился Xray-core с VLESS, XTLS-Vision, REALITY и XHTTP.</desc>
<style>.dsh-xray-lineage{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-xray-lineage{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-xray-lineage .dsh-xray-lineage-bg{fill:var(--bg)}.dsh-xray-lineage text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-xray-lineage .dsh-xray-lineage-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-xray-lineage .dsh-xray-lineage-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-xray-lineage .dsh-xray-lineage-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-xray-lineage .dsh-xray-lineage-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-xray-lineage .dsh-xray-lineage-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-xray-lineage .dsh-xray-lineage-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-xray-lineage .dsh-xray-lineage-sm{font-size:14.5px}.dsh-xray-lineage .dsh-xray-lineage-mu{fill:var(--mute)}.dsh-xray-lineage .dsh