<svg xmlns="http://www.w3.org/2000/svg" class="dsh-xhttp-modes" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="dsh-xhttp-modes-t dsh-xhttp-modes-d">
<title id="dsh-xhttp-modes-t">XHTTP: как разложены аплинк и даунлинк в трёх режимах</title>
<desc id="dsh-xhttp-modes-d">packet-up: аплинк нарезан на много коротких POST с номером seq, даунлинк — отдельный длинный GET. stream-up: один длинный POST вверх и отдельный GET вниз. stream-one: аплинк и даунлинк в одном HTTP-обмене. Общий sessionId склеивает запросы в один туннель.</desc>
<style>.dsh-xhttp-modes{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-xhttp-modes{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-xhttp-modes .dsh-xhttp-modes-bg{fill:var(--bg)}.dsh-xhttp-modes text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-xhttp-modes .dsh-xhttp-modes-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-xhttp-modes .dsh-xhttp-modes-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-xhttp-modes .dsh-xhttp-modes-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-xhttp-modes .dsh-xhttp-modes-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-xhttp-modes .dsh-xhttp-modes-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-xhttp-modes .dsh-xhttp-modes-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-xhttp-modes .dsh-xhttp-modes-sm{font-size:14.5px}.dsh-xhttp-modes .dsh-xhttp-modes-mu{fill:var(--mute)}.dsh-xhttp-modes .dsh-xhttp-modes-fg{fill:v