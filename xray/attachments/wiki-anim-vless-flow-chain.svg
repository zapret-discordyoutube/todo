<svg xmlns="http://www.w3.org/2000/svg" class="dsh-vless-flow-chain" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="dsh-vless-flow-chain-t dsh-vless-flow-chain-d">
<title id="dsh-vless-flow-chain-t">Почему «без flow лучше»: цепочка причин</title>
<desc id="dsh-vless-flow-chain-d">Цель — уменьшить число внешних TLS-соединений к серверу. Это делает Mux.Cool, но он несовместим с Vision, поэтому flow приходится оставить пустым. Соединений становится меньше, и фильтр по их количеству не срабатывает.</desc>
