<title id="dsh-vless-encryption-layers-t">VLESS Encryption — ещё один слой поверх открытого соединения</title>
<desc id="dsh-vless-encryption-layers-d">Приложение со своим TLS до сайта передаёт данные протоколу VLESS (версия, UUID, адрес назначения), затем идёт новый слой VLESS Encryption, который шифрует всё, что выше, потом транспорт и слой безопасности.</desc>
