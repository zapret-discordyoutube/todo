name: Published content check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: linux
    timeout-minutes: 10
    steps:
      - name: Checkout committed files only
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate static content
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi
          test -f index.html
          test -s index.html
          test -f wizard.html
          test -s wizard.html

      - name: Reject legacy links to our GitHub account
        shell: bash
        run: |
          set -euo pipefail
          legacy_pattern='github\.com/(youtubediscord|zapretdiscordyoutube)(/|$)|raw\.githubusercontent\.com/(youtubediscord|zapretdiscordyoutube)(/|$)|gist\.github(usercontent)?\.com/loop-uh(/|$)|api\.github\.com/repos/(youtubediscord|zapretdiscordyoutube)(/|$)|youtubediscord\.github\.io(/|$)|img\.shields\.io/github/[^[:space:]]*youtubediscord|git@github\.com:youtubediscord'
          if git grep -n -I -i -E -- "$legacy_pattern" -- . ':!.forgejo/workflows/content-check.yml'; then
            echo 'Found a legacy link to our deleted GitHub account; use git.zapret.moe instead.' >&2
            exit 1
          fi
