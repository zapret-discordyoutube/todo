name: Published content check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: linux
    timeout-minutes: 10
    steps:
      - name: Checkout committed files only
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate static content
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi
          test -f index.html
          test -s index.html
