l:var(--acc)}.dsh-awg2-wire .dsh-awg2-wire-rej{fill:var(--rej)}.dsh-awg2-wire .dsh-awg2-wire-c{text-anchor:middle}.dsh-awg2-wire .dsh-awg2-wire-r{text-anchor:end}.dsh-awg2-wire .dsh-awg2-wire-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-awg2-wire .dsh-awg2-wire-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-awg2-wire .dsh-awg2-wire-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-awg2-wire .dsh-awg2-wire-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-awg2-wire .dsh-awg2-wire-bxn{fill:none;stroke:none}.dsh-awg2-wire .dsh-awg2-wire-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-awg2-wire .dsh-awg2-wire-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-awg2-wire .dsh-awg2-wire-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-awg2-wire .dsh-awg2-wire-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-awg2-wire .dsh-awg2-wire-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-awg2-wire .dsh-awg2-wire-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-awg2-wire .dsh-awg2-wire-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-awg2-wire .dsh-awg2-wire-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-awg2-wire .dsh-awg2-wire-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-awg2-wire .dsh-awg2-wire-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-awg2-wire .dsh-awg2-wire-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-awg2-wire .dsh-awg2-wire-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-awg2-wire .dsh-awg2-wire-bxbg{fill:var(--bg);stroke:none}.dsh-awg2-wire .dsh-awg2-wire-hd-a{fill:var(--acc)}.dsh-awg2-wire .dsh-awg2-wire-hd-f{fill:var(--fg2)}.dsh-awg2-wire .dsh-awg2-wire-hd-r{fill:var(--rej)}.dsh-awg2-wire .dsh-awg2-wire-dot{fill:var(--acc)}.dsh-awg2-wire .dsh-awg2-wire-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-awg2-wire .dsh-awg2-wire-nd{fill