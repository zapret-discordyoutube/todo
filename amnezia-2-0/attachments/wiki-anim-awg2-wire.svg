<g class="a dsh-awg2-wire-e2"><rect class="dsh-awg2-wire-bxa" x="30" y="34" width="314.9014084507042" height="34" rx="4"/><text class="dsh-awg2-wire-mk dsh-awg2-wire-c dsh-awg2-wire-sm" x="187.4507042253521" y="56">S4</text><line class="dsh-awg2-wire-lm" x1="188.4507042253521" y1="68" x2="188.4507042253521" y2="72"/><text class="dsh-awg2-wire-tk dsh-awg2-wire-sm dsh-awg2-wire-c" x="188.4507042253521" y="86">S4 random</text></g>
