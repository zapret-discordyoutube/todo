<svg xmlns="http://www.w3.org/2000/svg" class="dsh-awg2-wire" viewBox="0 0 960 214" width="960" height="214" role="img" aria-labelledby="dsh-awg2-wire-t dsh-awg2-wire-d">
<title id="dsh-awg2-wire-t">Transport-пакет AmneziaWG 2.0 на проводе</title>
<desc id="dsh-awg2-wire-d">Пакет состоит из S4 случайных байт, заголовка WireGuard Transport в 16 байт (H4, получатель, nonce), зашифрованной нагрузки с выравниванием и тега Poly1305 16 байт.</desc>
