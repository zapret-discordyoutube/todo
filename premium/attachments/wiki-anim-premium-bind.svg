<svg xmlns="http://www.w3.org/2000/svg" class="dsh-premium-bind" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="dsh-premium-bind-t dsh-premium-bind-d">
<title id="dsh-premium-bind-t">Привязка Zapret Premium: код из программы — в бот</title>
<desc id="dsh-premium-bind-d">Пользователь покупает тариф в боте, создаёт в Zapret GUI код из 8 символов, отправляет его боту; программа каждые несколько секунд спрашивает сервер и после привязки показывает Premium. Бот отвечает одним из пяти сообщений.</desc>
