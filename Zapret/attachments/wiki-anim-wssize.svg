<svg xmlns="http://www.w3.org/2000/svg" class="dsh-wssize" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="dsh-wssize-t dsh-wssize-d">
<title id="dsh-wssize-t">wssize срабатывает до того, как известен сайт</title>
<desc id="dsh-wssize-d">wssize вмешивается во время TCP-рукопожатия, когда данных приложения ещё нет и неизвестны SNI и протокол. Поэтому хостлисты и l7-фильтр к нему не применимы, доступна лишь фильтрация по IP и портам. Обычные стратегии работают позже, на первом сообщении с данными.</desc>
<style>.dsh-wssize{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-wssize{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-wssize .dsh-wssize-bg{fill:var(--bg)}.dsh-wssize text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-wssize .dsh-wssize-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-wssize .dsh-wssize-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-wssize .dsh-wssize-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-wssize .dsh-wssize-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-wssize .dsh-wssize-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-wssize .dsh-wssize-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-wssize .dsh-wssize-sm{font-size:14.5px}.dsh-wssize .dsh-wssize-mu{fill:var(--mute)}.dsh-wssize .dsh-wssize-fg{fill:var(--fg)}.dsh-wssize .dsh-wssize-acc{fill:var(--acc)}.dsh-wssize .dsh-wssize-rej{fill:var(--rej)}.dsh-wssize .dsh-wssize-c{text-anchor:middle}.dsh-wssize .dsh-wssize-r{text-anchor:end}.dsh-wssize .dsh-wssize-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-wssize .dsh-wssize-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-wssize .dsh-wssize-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-wssize .dsh-wssize-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-wssize .dsh-wssize-bxn{fill:none;stroke:none}.dsh-wssize .dsh-wssize-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-wssize .dsh-wssize-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-wssize .dsh-wssize-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-wssize .dsh-wssize-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-wssize .dsh-wssize-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-wssize .dsh-wssize-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-wssize .dsh-wssize-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-wssize .dsh-wssize-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-wssize .dsh-wssize-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-wssize .dsh-wssize-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-wssize .dsh-wssize-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-wssize .dsh-wssize-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-wssize .dsh-wssize-bxbg{fill:var(--bg);stroke:none}.dsh-wssize .dsh-wssize-hd-a{fill:var(--acc)}.dsh-wssize .dsh-wssize-hd-f{fill:var(--fg2)}.dsh-wssize .dsh-wssize-hd-r{fill:var(--rej)}.dsh-wssize .dsh-wssize-dot{fill:var(--acc)}.dsh-wssize .dsh-wssize-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-wssize .dsh-wssize-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-wssize .dsh-wssize-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-wssize .dsh-wssize-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-wssize .a{animation-duration:14s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-wssize .a{animation:none}.dsh-wssize .tr{display:none}}figure.dsh-wssize-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-wssize-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-wssize-k1{0.0%{opacity:0;transform:translate(-30px,0px)}4.286%{opacity:0;transform:translate(-30px,0px)}5.714%{opacity:1;transform:translate(-30px,0px)}10.0%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wssize .dsh-wssize-e1{animation-name:dsh-wssize-k1}@keyframes dsh-wssize-k2{0.0%{opacity:0;transform:translate(-30px,0px)}10.714%{opacity:0;transform:translate(-30px,0px)}12.143%{opacity:1;transform:translate(-30px,0px)}16.429%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wssize .dsh-wssize-e2{animation-name:dsh-wssize-k2}@keyframes dsh-wssize-k3{0.0%{opacity:0;transform:translate(-30px,0px)}17.143%{opacity:0;transform:translate(-30px,0px)}18.571%{opacity:1;transform:translate(-30px,0px)}22.857%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wssize .dsh-wssize-e3{animation-name:dsh-wssize-k3}@keyframes dsh-wssize-k4{0.0%{opacity:0;transform:translate(-30px,0px)}23.571%{opacity:0;transform:translate(-30px,0px)}25.0%{opacity:1;transform:translate(-30px,0px)}29.286%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wssize .dsh-wssize-e4{animation-name:dsh-wssize-k4}@keyframes dsh-wssize-k5{0.0%{opacity:0;transform:translate(0px,0px)}30.0%{opacity:0;transform:translate(0px,0px)}32.5%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wssize .dsh-wssize-e5{animation-name:dsh-wssize-k5}@keyframes dsh-wssize-k6{0.0%{opacity:0;transform:translate(0px,0px)}40.0%{opacity:0;transform:translate(0px,0px)}42.5%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wssize .dsh-wssize-e6{animation-name:dsh-wssize-k6}@keyframes dsh-wssize-k7{0.0%{opacity:0;transform:translate(0px,8px)}51.429%{opacity:0;transform:translate(0px,8px)}53.929%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-wssize .dsh-wssize-e7{animation-name:dsh-wssize-k7}@keyframes dsh-wssize-k8{0.0%{opacity:0;transform:translate(0px,8px)}57.143%{opacity:0;transform:translate(0px,8px)}59.643%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-wssize .dsh-wssize-e8{animation-name:dsh-wssize-k8}@keyframes dsh-wssize-k9{0.0%{opacity:0;transform:translate(0px,8px)}62.857%{opacity:0;transform:translate(0px,8px)}65.357%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-wssize .dsh-wssize-e9{animation-name:dsh-wssize-k9}@keyframes dsh-wssize-k10{0.0%{opacity:0;transform:translate(0px,0px)}74.286%{opacity:0;transform:translate(0px,0px)}76.786%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-wssize .dsh-wssize-e10{animation-name:dsh-wssize-k10}.dsh-wssize .dsh-wssize-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-wssize-bg" x="0" y="0" width="960" height="430"/>
<text class="dsh-wssize-cap" x="2" y="28">время жизни TCP-соединения</text>
<path class="dsh-wssize-sl-f" d="M2 90L950 90"/><polygon class="dsh-wssize-hd-f" points="950.0,90.0 940.0,95.0 940.0,85.0"/>
<g class="a dsh-wssize-e1"><rect class="dsh-wssize-bxbg" x="55.0" y="73.0" width="90" height="34" rx="6"/><rect class="dsh-wssize-bx" x="55.0" y="73.0" width="90" height="34" rx="6"/><text class="dsh-wssize-mk dsh-wssize-sm dsh-wssize-c" x="100" y="95">SYN</text></g>
<g class="a dsh-wssize-e2"><rect class="dsh-wssize-bxbg" x="205.0" y="73.0" width="90" height="34" rx="6"/><rect class="dsh-wssize-bx" x="205.0" y="73.0" width="90" height="34" rx="6"/><text class="dsh-wssize-mk dsh-wssize-sm dsh-wssize-c" x="250" y="95">SYN-ACK</text></g>
<g class="a dsh-wssize-e3"><rect class="dsh-wssize-bxbg" x="355.0" y="73.0" width="90" height="34" rx="6"/><rect class="dsh-wssize-bx" x="355.0" y="73.0" width="90" height="34" rx="6"/><text class="dsh-wssize-mk dsh-wssize-sm dsh-wssize-c" x="400" y="95">ACK</text></g>
<g class="a dsh-wssize-e4"><rect class="dsh-wssize-bxbg" x="525.0" y="73.0" width="230" height="34" rx="6"/><rect class="dsh-wssize-bxa" x="525.0" y="73.0" width="230" height="34" rx="6"/><text class="dsh-wssize-mk dsh-wssize-sm dsh-wssize-c" x="640" y="95">ClientHello (виден SNI)</text></g>
<g class="a dsh-wssize-e5"><line class="dsh-wssize-la" x1="18" y1="134" x2="450" y2="134"/><line class="dsh-wssize-la" x1="18" y1="128" x2="18" y2="140"/><line class="dsh-wssize-la" x1="450" y1="128" x2="450" y2="140"/><text class="dsh-wssize-acc dsh-wssize-tk dsh-wssize-c dsh-wssize-sm" x="234" y="162">рукопожатие: данных приложения ещё нет</text><text class="dsh-wssize-acc dsh-wssize-tk dsh-wssize-c dsh-wssize-sm" x="234" y="182">здесь работает wssize</text></g>
<g class="a dsh-wssize-e6"><line class="dsh-wssize-lm" x1="520" y1="134" x2="760" y2="134"/><line class="dsh-wssize-lm" x1="520" y1="128" x2="520" y2="140"/><line class="dsh-wssize-lm" x1="760" y1="128" x2="760" y2="140"/><text class="dsh-wssize-tk dsh-wssize-c dsh-wssize-sm" x="640" y="162">первое сообщение с данными:</text><text class="dsh-wssize-tk dsh-wssize-c dsh-wssize-sm" x="640" y="182">SNI и протокол известны</text><text class="dsh-wssize-mu dsh-wssize-c dsh-wssize-sm" x="640" y="202">здесь работают обычные стратегии</text></g>
<line class="dsh-wssize-lf" x1="2" y1="228" x2="950" y2="228"/>
<text class="dsh-wssize-cap" x="2" y="256">поэтому у wssize нет</text>
<g class="a dsh-wssize-e7"><rect class="dsh-wssize-bxr" x="2" y="270" width="306" height="68" rx="7"/><text class="dsh-wssize-rej dsh-wssize-tk dsh-wssize-sm" x="14" y="296">хостлистов</text><text class="dsh-wssize-mu dsh-wssize-sm" x="14" y="318">SNI в рукопожатии ещё не передан</text></g>
<g class="a dsh-wssize-e8"><rect class="dsh-wssize-bxr" x="320" y="270" width="306" height="68" rx="7"/><text class="dsh-wssize-rej dsh-wssize-tk dsh-wssize-sm" x="332" y="296">l7-фильтра</text><text class="dsh-wssize-mu dsh-wssize-sm" x="332" y="318">протокол опознаётся позже</text></g>
<g class="a dsh-wssize-e9"><rect class="dsh-wssize-bxr" x="638" y="270" width="306" height="68" rx="7"/><text class="dsh-wssize-rej dsh-wssize-tk dsh-wssize-sm" x="650" y="296">точной цели</text><text class="dsh-wssize-mu dsh-wssize-sm" x="650" y="318">бьёт по всем под фильтром</text></g>
<g class="a dsh-wssize-e10"><text class="dsh-wssize-t dsh-wssize-sm" x="2" y="372">Сервер из-за подмены окна шлёт ответ крошечными порциями: DPI без пересборки потока не видит его</text><text class="dsh-wssize-t dsh-wssize-sm" x="2" y="392">целиком, но замедляются все такие соединения.</text></g>
</svg>
