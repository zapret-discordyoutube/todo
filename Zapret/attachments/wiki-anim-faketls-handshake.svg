<svg xmlns="http://www.w3.org/2000/svg" class="dsh-faketls-handshake" viewBox="0 0 960 314" width="960" height="314" role="img" aria-labelledby="dsh-faketls-handshake-t dsh-faketls-handshake-d">
<title id="dsh-faketls-handshake-t">FakeTLS handshake в MTProxy: клиент и сервер изображают обычный TLS</title>
<desc id="dsh-faketls-handshake-d">Клиент отправляет фейковый TLS ClientHello на 517 байт с SNI из секрета и HMAC-SHA256 в поле Random. Сервер отвечает фейковым ServerHello и ChangeCipherSpec, копируя размер ответа реального сертификата. Дальше идут записи Application Data с зашифрованным MTProto до 16408 байт.</desc>
