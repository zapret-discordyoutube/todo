font-size:14.5px}.dsh-faketls-handshake .dsh-faketls-handshake-mu{fill:var(--mute)}.dsh-faketls-handshake .dsh-faketls-handshake-fg{fill:var(--fg)}.dsh-faketls-handshake .dsh-faketls-handshake-acc{fill:var(--acc)}.dsh-faketls-handshake .dsh-faketls-handshake-rej{fill:var(--rej)}.dsh-faketls-handshake .dsh-faketls-handshake-c{text-anchor:middle}.dsh-faketls-handshake .dsh-faketls-handshake-r{text-anchor:end}.dsh-faketls-handshake .dsh-faketls-handshake-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-faketls-handshake .dsh-faketls-handshake-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-faketls-handshake .dsh-faketls-handshake-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-faketls-handshake .dsh-faketls-handshake-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-faketls-handshake .dsh-faketls-handshake-bxn{fill:none;stroke:none}.dsh-faketls-handshake .dsh-faketls-handshake-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-faketls-handshake .dsh-faketls-handshake-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-faketls-handshake .dsh-faketls-handshake-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-faketls-handshake .dsh-faketls-handshake-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-faketls-handshake .dsh-faketls-handshake-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-faketls-handshake .dsh-faketls-handshake-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-faketls-handshake .dsh-faketls-handshake-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-faketls-handshake .dsh-faketls-handshake-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-faketls-handshake .dsh-faketls-handshake-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-faketls-handshake .dsh-faketls-handshake-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-faketls-handshake .dsh-faketls-handshake-sl-f