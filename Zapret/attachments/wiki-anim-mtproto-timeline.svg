<title id="dsh-mtproto-timeline-t">Хронология: от блокировки звонков к приватному FakeTLS</title>
<desc id="dsh-mtproto-timeline-d">Август 2025 блокировка звонков Telegram и WhatsApp, сентябрь 2025 блокировка VMess, декабрь 2025 закон об установке ТСПУ на трансграничные каналы, январь 2026 замедление медиа Telegram до 128 КБ/с, 17 февраля 2026 массовые сбои VLESS+Reality, 1 марта 2026 контроль над магистральным трафиком, март 2026 MTProxy с FakeTLS на приватных серверах работает.</desc>
