:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-asn-match .dsh-asn-match-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-asn-match .dsh-asn-match-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-asn-match .a{animation-duration:12s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-asn-match .a{animation:none}.dsh-asn-match .tr{display:none}}figure.dsh-asn-match-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-asn-match-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-asn-match-k1{0.0%{opacity:0;transform:translate(0px,0px)}4.167%{opacity:0;transform:translate(0px,0px)}6.667%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e1{animation-name:dsh-asn-match-k1}@keyframes dsh-asn-match-k2{0.0%{opacity:0;transform:translate(0px,0px)}8.333%{opacity:0;transform:translate(0px,0px)}10.417%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e2{animation-name:dsh-asn-match-k2}@keyframes dsh-asn-match-k3{0.0%{opacity:0;transform:translate(0px,0px)}12.5%{opacity:0;transform:translate(0px,0px)}14.583%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e3{animation-name:dsh-asn-match-k3}@keyframes dsh-asn-match-k4{0.0%{opacity:0;transform:translate(0px,0px)}16.667%{opacity:0;transform:translate(0px,0px)}18.75%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e4{animation-name:dsh-asn-match-k4}@keyframes dsh-asn-match-k5{0.0%{opacity:0;transform:translate(0px,0px)}29.167%{opacity:0;transform:translate(0px,0px)}31.667%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e5{animation-name:dsh-asn-match-k5}@keyframes dsh-asn-match-k6{0.0%{opacity:0;transform:translate(0px,0px)}33.333%{opacity:0;transform:translate(0px,0px)}35.417%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e6{animation-name:dsh-asn-match-k6}@keyframes dsh-asn-match-k7{0.0%{opacity:0;transform:translate(0px,0px)}37.5%{opacity:0;transform:translate(0px,0px)}39.583%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e7{animation-name:dsh-asn-match-k7}@keyframes dsh-asn-match-k8{0.0%{opacity:0;transform:translate(0px,0px)}41.667%{opacity:0;transform:translate(0px,0px)}43.75%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-asn-match .dsh-asn-match-e8{animation-name:dsh-asn-match-k8}.dsh-asn-match .dsh-asn-match-dsh{stroke-dasharray:5 5}</style>
