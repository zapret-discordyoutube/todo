<svg xmlns="http://www.w3.org/2000/svg" class="dsh-ipset-check" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="dsh-ipset-check-t dsh-ipset-check-d">
<title id="dsh-ipset-check-t">Сначала исключения, потом включения: так профиль проверяет адрес</title>
<desc id="dsh-ipset-check-d">Профиль с --ipset-exclude=10.1.0.0/16 и --ipset=10.0.0.0/8,1.2.3.4. Адрес из исключений профиль не берёт, даже если он входит во включающий список. Адрес вне включающего списка профиль тоже не берёт. Остальные профили проверяются дальше.</desc>
