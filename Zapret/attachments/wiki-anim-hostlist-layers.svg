<g class="a dsh-hostlist-layers-e8"><text class="dsh-hostlist-layers-tk" x="2" y="398">Вывод: ваша строка «!youtube.com» отключает встроенную «youtube.com», «^vk.com» сужает</text><text class="dsh-hostlist-layers-tk" x="2" y="420">встроенную «vk.com» до самого домена.</text></g>
