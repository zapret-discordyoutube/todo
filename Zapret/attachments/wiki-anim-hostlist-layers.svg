<svg xmlns="http://www.w3.org/2000/svg" class="dsh-hostlist-layers" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="dsh-hostlist-layers-t dsh-hostlist-layers-d">
<title id="dsh-hostlist-layers-t">Ваши записи идут первыми — поэтому они перебивают встроенные</title>
<desc id="dsh-hostlist-layers-d">Программа собирает итоговый файл списка: сначала строки пользователя из lists/user, затем встроенные из lists/base. Домен в одном файле учитывается один раз, по первой записи, поэтому повтор встроенной строки отбрасывается вместе с префиксом.</desc>
<style>.dsh-hostlist-layers{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-hostlist-layers{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-hostlist-layers .dsh-hostlist-layers-bg{fill:var(--bg)}.dsh-hostlist-layers text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-hostlist-layers .dsh-hostlist-layers-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-hostlist-layers .dsh-hostlist-layers-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-hostlist-layers .dsh-hostlist-layers-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-hostlist-layers .dsh-hostlist-layers-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-hostlist-layers .dsh-hostlist-layers-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-hostlist-layers .dsh-hostlist-layers-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-hostlist-layers .dsh-hostlist-layers-sm{font-size:14.5px}.dsh-hostlist-layers .dsh-hostlist-layers-mu{fill:var(--mute)}.dsh-hostlist-layers .dsh-hostlist-layers-fg{fill:var(--fg)}.dsh-hostlist-layers .dsh-hostlist-layers-acc{fill:var(--acc)}.dsh-hostlist-layers .dsh-hostlist-layers-rej{fill:var(--rej)}.dsh-hostlist-layers .dsh-hostlist-layers-c{text-anchor:middle}.dsh-hostlist-layers .dsh-hostlist-layers-r{text-anchor:end}.dsh-hostlist-layers .dsh-hostlist-layers-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-hostlist-layers .dsh-hostlist-layers-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-hostlist-layers .dsh-hostlist-layers-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-hostlist-layers .dsh-hostlist-layers-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-hostlist-layers .dsh-hostlist-layers-bxn{fill:none;stroke:none}.dsh-hostlist-layers .dsh-hostlist-layers-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-hostlist-layers .dsh-hostlist-layers-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-hostlist-layers .dsh-hostlist-layers-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-hostlist-layers .dsh-hostlist-layers-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-hostlist-layers .dsh-hostlist-layers-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-hostlist-layers .dsh-hostlist-layers-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-hostlist-layers .dsh-hostlist-layers-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-hostlist-layers .dsh-hostlist-layers-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-hostlist-layers .dsh-hostlist-layers-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-hostlist-layers .dsh-hostlist-layers-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-hostlist-layers .dsh-hostlist-layers-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-hostlist-layers .dsh-hostlist-layers-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-hostlist-layers .dsh-hostlist-layers-bxbg{fill:var(--bg);stroke:none}.dsh-hostlist-layers .dsh-hostlist-layers-hd-a{fill:var(--acc)}.dsh-hostlist-layers .dsh-hostlist-layers-hd-f{fill:var(--fg2)}.dsh-hostlist-layers .dsh-hostlist-layers-hd-r{fill:var(--rej)}.dsh-hostlist-layers .dsh-hostlist-layers-dot{fill:var(--acc)}.dsh-hostlist-layers .dsh-hostlist-layers-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-hostlist-layers .dsh-hostlist-layers-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-hostlist-layers .dsh-hostlist-layers-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-hostlist-layers .dsh-hostlist-layers-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-hostlist-layers .a{animation-duration:13s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-hostlist-layers .a{animation:none}.dsh-hostlist-layers .tr{display:none}}figure.dsh-hostlist-layers-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-hostlist-layers-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-hostlist-layers-k1{0.0%{opacity:0;transform:translate(-300px,0px)}6.154%{opacity:0;transform:translate(-300px,0px)}6.923%{opacity:1;transform:translate(-300px,0px)}11.538%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-hostlist-layers .dsh-hostlist-layers-e1{animation-name:dsh-hostlist-layers-k1}@keyframes dsh-hostlist-layers-k2{0.0%{opacity:0;transform:translate(-300px,0px)}16.154%{opacity:0;transform:translate(-300px,0px)}16.923%{opacity:1;transform:translate(-300px,0px)}21.538%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-hostlist-layers .dsh-hostlist-layers-e2{animation-name:dsh-hostlist-layers-k2}@keyframes dsh-hostlist-layers-k3{0.0%{opacity:0;transform:translate(-300px,0px)}26.154%{opacity:0;transform:translate(-300px,0px)}26.923%{opacity:1;transform:translate(-300px,0px)}31.538%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-hostlist-layers .dsh-hostlist-layers-e3{animation-name:dsh-hostlist-layers-k3}@keyframes dsh-hostlist-layers-k4{0.0%{opacity:0;transform:translate(0px,0px)}32.308%{opacity:0;transform:translate(0px,0px)}33.846%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-hostlist-layers .dsh-hostlist-layers-e4{animation-name:dsh-hostlist-layers-k4}@keyframes dsh-hostlist-layers-k5{0.0%{opacity:0;transform:translate(-300px,0px)}36.154%{opacity:0;transform:translate(-300px,0px)}36.923%{opacity:1;transform:translate(-300px,0px)}41.538%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-hostlist-layers .dsh-hostlist-layers-e5{animation-name:dsh-hostlist-layers-k5}@keyframes dsh-hostlist-layers-k6{0.0%{opacity:0;transform:translate(0px,0px)}42.308%{opacity:0;transform:translate(0px,0px)}43.846%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,0px)}98.846%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-hostlist-layers .dsh-hostlist-layers-e6{animation-name:dsh-hostlist-layers-k6}@keyframes dsh-hostlist-layers-k7{0.0%{opacity:0;transform:translate(-300px,0px)}46.154%{opacity:0;transform:translate(-300px,0px)}46.923%{opacity:1;transform:translate(-300px,0px)}51.538%{opacity:1;transform:translate(0px,0px)}95.769%{opacity:1;transform:translate(0px,