<rect class="dsh-hostlist-layers-bg" x="0" y="0" width="960" height="440"/>
<text class="dsh-hostlist-layers-cap" x="2" y="30">ваши записи · lists/user</text>
<text class="dsh-hostlist-layers-cap" x="2" y="200">встроенные · lists/base</text>
<text class="dsh-hostlist-layers-cap" x="560" y="30">итоговый файл для движка</text>
