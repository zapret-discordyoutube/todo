<g class="a dsh-hostlist-layers-e2"><text class="dsh-hostlist-layers-mk" x="582" y="136">^vk.com</text><text class="dsh-hostlist-layers-acc dsh-hostlist-layers-sm" x="760" y="136">ваша запись — работает</text></g>
<g class="a dsh-hostlist-layers-e3"><text class="dsh-hostlist-layers-mk" x="582" y="188">youtube.com</text><text class="dsh-hostlist-layers-rej dsh-hostlist-layers-sm" x="760" y="188">повтор — отброшен</text></g>
