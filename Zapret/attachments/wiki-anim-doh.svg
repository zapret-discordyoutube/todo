<svg xmlns="http://www.w3.org/2000/svg" class="dsh-doh" viewBox="0 0 960 458" width="960" height="458" role="img" aria-labelledby="dsh-doh-t dsh-doh-d">
<title id="dsh-doh-t">Поможет ли zapret с заблокированным DoH</title>
<desc id="dsh-doh-d">Если DoH-сервер блокируют по имени (SNI виден в начале соединения), zapret поможет: домен резолвера добавляют в хостлист. Если блокируют по адресу или порту, соединение даже не начинается, и zapret бессилен: нужен другой адрес резолвера.</desc>
<style>.dsh-doh{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-doh{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-doh .dsh-doh-bg{fill:var(--bg)}.dsh-doh text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-doh .dsh-doh-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-doh .dsh-doh-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-doh .dsh-doh-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-doh .dsh-doh-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-doh .dsh-doh-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-doh .dsh-doh-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-doh .dsh-doh-sm{font-size:14.5px}.dsh-doh .dsh-doh-mu{fill:var(--mute)}.dsh-doh .dsh-doh-fg{fill:var(--fg)}.dsh-doh .dsh-doh-acc{fill:var(--acc)}.dsh-doh .dsh-doh-rej{fill:var(--rej)}.dsh-doh .dsh-doh-c{text-anchor:middle}.dsh-doh .dsh-doh-r{text-anchor:end}.dsh-doh .dsh-doh-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-doh .dsh-doh-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-doh .dsh-doh-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-doh .dsh-doh-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-doh .dsh-doh-bxn{fill:none;stroke:none}.dsh-doh .dsh-doh-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-doh .dsh-doh-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-doh .dsh-doh-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-doh .dsh-doh-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-doh .dsh-doh-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-doh .dsh-doh-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-doh .dsh-doh-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-doh .dsh-doh-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-doh .dsh-doh-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-doh .dsh-doh-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-doh .dsh-doh-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-doh .dsh-doh-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-doh .dsh-doh-bxbg{fill:var(--bg);stroke:none}.dsh-doh .dsh-doh-hd-a{fill:var(--acc)}.dsh-doh .dsh-doh-hd-f{fill:var(--fg2)}.dsh-doh .dsh-doh-hd-r{fill:var(--rej)}.dsh-doh .dsh-doh-dot{fill:var(--acc)}.dsh-doh .dsh-doh-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-doh .dsh-doh-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-doh .dsh-doh-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-doh .dsh-doh-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-doh .a{animation-duration:14s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-doh .a{animation:none}.dsh-doh .tr{display:none}}figure.dsh-doh-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-doh-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-doh-k1{0.0%{opacity:0;transform:translate(0px,0px)}7.143%{opacity:0;transform:translate(0px,0px)}8.571%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e1{animation-name:dsh-doh-k1}@keyframes dsh-doh-k2{0.0%{opacity:0;transform:translate(0px,0px)}10.0%{opacity:0;transform:translate(0px,0px)}12.5%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e2{animation-name:dsh-doh-k2}@keyframes dsh-doh-k3{0.0%{opacity:0;transform:translate(0px,0px)}15.714%{opacity:0;transform:translate(0px,0px)}17.143%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e3{animation-name:dsh-doh-k3}@keyframes dsh-doh-k4{0.0%{opacity:0;transform:translate(0px,0px)}17.857%{opacity:0;transform:translate(0px,0px)}20.357%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e4{animation-name:dsh-doh-k4}@keyframes dsh-doh-k5{0.0%{opacity:0;transform:translate(0px,0px)}30.0%{opacity:0;transform:translate(0px,0px)}31.429%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e5{animation-name:dsh-doh-k5}@keyframes dsh-doh-k6{0.0%{opacity:0;transform:translate(0px,0px)}32.857%{opacity:0;transform:translate(0px,0px)}35.357%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e6{animation-name:dsh-doh-k6}@keyframes dsh-doh-k7{0.0%{opacity:0;transform:translate(0px,0px)}38.571%{opacity:0;transform:translate(0px,0px)}40.0%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e7{animation-name:dsh-doh-k7}@keyframes dsh-doh-k8{0.0%{opacity:0;transform:translate(0px,0px)}40.714%{opacity:0;transform:translate(0px,0px)}43.214%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e8{animation-name:dsh-doh-k8}@keyframes dsh-doh-k9{0.0%{opacity:0;transform:translate(0px,0px)}57.143%{opacity:0;transform:translate(0px,0px)}59.643%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e9{animation-name:dsh-doh-k9}@keyframes dsh-doh-k10{0.0%{opacity:0;transform:translate(0px,0px)}65.714%{opacity:0;transform:translate(0px,0px)}68.214%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e10{animation-name:dsh-doh-k10}@keyframes dsh-doh-k11{0.0%{opacity:0;transform:translate(0px,0px)}74.286%{opacity:0;transform:translate(0px,0px)}76.786%{opacity:1;transform:translate(0px,0px)}96.071%{opacity:1;transform:translate(0px,0px)}98.929%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-doh .dsh-doh-e11{animation-name:dsh-doh-k11}.dsh-doh .dsh-doh-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-doh-bg" x="0" y="0" width="960" height="458"/>
<rect class="dsh-doh-bxa" x="300" y="12" width="360" height="54" rx="7"/><text class="dsh-doh-tk dsh-doh-c" x="480" y="38">Как заблокирован DoH-сервер?</text><text class="dsh-doh-mu dsh-doh-sm dsh-doh-c" x="480" y="56">случаев два, действия противоположны</text>
<g class="a dsh-doh-e1"><path class="dsh-doh-sl-f" d="M480 70L240 110"/><polygon class="dsh-doh-hd-f" points="240.0,110.0 249.0,103.4 250.7,113.3"/></g>
<g class="a dsh-doh-e2"><rect class="dsh-doh-bx" x="20" y="114" width="440" height="76" rx="7"/><text class="dsh-doh-tk dsh-doh-sm" x="34" y="140">Случай 1: по имени</text><text class="dsh-doh-mu dsh-doh-sm" x="34" y="160">SNI dns.google виден в начале HTTPS-соединения</text></g>
<g class="a dsh-doh-e3"><path class="dsh-doh-sl-a" d="M240 192L240 220"/><polygon class="dsh-doh-hd-a" points="240.0,220.0 235.0,210.0 245.0,210.0"/></g>
<g class="a dsh-doh-e4"><rect class="dsh-doh-bxa" x="20" y="224" width="440" height="92" rx="7"/><text class="dsh-doh-acc dsh-doh-tk" x="34" y="252">zapret поможет</text><text class="dsh-doh-sm" x="34" y="276">домен резолвера — в хостлист, дальше подбор</text><text class="dsh-doh-sm" x="34" y="295">стратегии</text></g>
<g class="a dsh-doh-e5"><path class="dsh-doh-sl-f" d="M480 70L720 110"/><polygon class="dsh-doh-hd-f" points="720.0,110.0 709.3,113.3 711.0,103.4"/></g>
<g class="a dsh-doh-e6"><rect class="dsh-doh-bx" x="500" y="114" width="440" height="76" rx="7"/><text class="dsh-doh-tk dsh-doh-sm" x="514" y="140">Случай 2: по адресу</text><text class="dsh-doh-mu dsh-doh-sm" x="514" y="160">соединение к IP или порту (например, 8.8.8.8) не</text><text class="dsh-doh-mu dsh-doh-sm" x="514" y="177">проходит</text></g>
<g class="a dsh-doh-e7"><path class="dsh-doh-sl-r" d="M720 192L720 220"/><polygon class="dsh-doh-hd-r" points="720.0,220.0 715.0,210.0 725.0,210.0"/></g>
<g class="a dsh-doh-e8"><rect class="dsh-doh-bxr" x="500" y="224" width="440" height="92" rx="7"/><text class="dsh-doh-rej dsh-doh-tk" x="514" y="252">zapret бессилен</text><text class="dsh-doh-sm" x="514" y="276">портить нечего: соединение не начинается;</text><text class="dsh-doh-sm" x="514" y="295">другой адрес (8.8.4.4) или другой резолвер</text></g>
<line class="dsh-doh-lf" x1="2" y1="338" x2="950" y2="338"/>
<text class="dsh-doh-cap" x="2" y="364">как понять, какой случай у вас</text>
<g class="a dsh-doh-e9"><text class="dsh-doh-t dsh-doh-sm" x="2" y="390">1.  сменить адрес резолвера (8.8.4.4 вместо 8.8.8.8): заработало — случай 2</text></g>
<g class="a dsh-doh-e10"><text class="dsh-doh-t dsh-doh-sm" x="2" y="414">2.  недоступен по любому адресу, обычные сайты открываются — похоже на случай 1</text></g>
<g class="a dsh-doh-e11"><text class="dsh-doh-t dsh-doh-sm" x="2" y="438">3.  ничего не помогло — включить DoH внутри VPN или прокси-туннеля</text></g>
</svg>
