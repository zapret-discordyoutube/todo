<svg xmlns="http://www.w3.org/2000/svg" class="dsh-mtproto-layers" viewBox="0 0 960 522" width="960" height="522" role="img" aria-labelledby="dsh-mtproto-layers-t dsh-mtproto-layers-d">
<title id="dsh-mtproto-layers-t">Шесть слоёв, которыми ТСПУ ищет MTProto</title>
<desc id="dsh-mtproto-layers-d">Каскад методов детекции: сигнатуры, TLS-отпечаток, проверка IP и ASN, активные пробы, поведенческий анализ, ML. Каждый следующий слой дороже по вычислениям. От активных проб telemt и mtg защищают, официальный MTProxy нет; от поведенческого анализа адресует mtg Doppelganger.</desc>
