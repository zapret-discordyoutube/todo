<title id="dsh-mtproto-status-t">Что блокируют, а что ещё работает (март 2026)</title>
<desc id="dsh-mtproto-status-d">Заблокированы OpenVPN, WireGuard, Shadowsocks, Trojan и VMess; массовые сбои у VLESS+TCP/TLS; VLESS+Reality детектируется поведенческим анализом; MTProto ванильный замедляется, публичный FakeTLS блокируется за часы или дни; работают приватный FakeTLS с telemt или mtg и SSH-туннели. Статусы на март 2026.</desc>
