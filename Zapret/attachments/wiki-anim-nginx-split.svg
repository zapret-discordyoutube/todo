<svg xmlns="http://www.w3.org/2000/svg" class="dsh-nginx-split" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="dsh-nginx-split-t dsh-nginx-split-d">
<title id="dsh-nginx-split-t">nginx stream разводит трафик по SNI: сайт отдельно, MTProto отдельно</title>
<desc id="dsh-nginx-split-d">Порт 443 принимает nginx stream или haproxy на уровне L4 с ssl_preread. Если SNI равен example.com, соединение уходит на настоящий HTTPS-сайт на 127.0.0.1:8443; если SNI пустой или неизвестный (iOS, Android, Desktop), на MTProto Proxy с FakeTLS на 127.0.0.1:2443.</desc>
