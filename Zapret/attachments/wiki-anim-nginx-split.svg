ar(--fg)}.dsh-nginx-split .dsh-nginx-split-acc{fill:var(--acc)}.dsh-nginx-split .dsh-nginx-split-rej{fill:var(--rej)}.dsh-nginx-split .dsh-nginx-split-c{text-anchor:middle}.dsh-nginx-split .dsh-nginx-split-r{text-anchor:end}.dsh-nginx-split .dsh-nginx-split-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-nginx-split .dsh-nginx-split-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-nginx-split .dsh-nginx-split-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-nginx-split .dsh-nginx-split-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-nginx-split .dsh-nginx-split-bxn{fill:none;stroke:none}.dsh-nginx-split .dsh-nginx-split-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-nginx-split .dsh-nginx-split-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-nginx-split .dsh-nginx-split-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-nginx-split .dsh-nginx-split-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-nginx-split .dsh-nginx-split-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-nginx-split .dsh-nginx-split-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-nginx-split .dsh-nginx-split-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-nginx-split .dsh-nginx-split-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-nginx-split .dsh-nginx-split-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-nginx-split .dsh-nginx-split-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-nginx-split .dsh-nginx-split-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-nginx-split .dsh-nginx-split-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-nginx-split .dsh-nginx-split-bxbg{fill:var(--bg);stroke:none}.dsh-nginx-split .dsh-nginx-split-hd-a{fill:var(--acc)}.dsh-nginx-split .dsh-nginx-split-hd-f{fill:var(--fg2)}.dsh-nginx-split .dsh-nginx-split-hd-r{fill:var(--rej)}.dsh-nginx-split .dsh