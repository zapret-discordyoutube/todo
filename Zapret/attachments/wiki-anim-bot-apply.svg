:translate(0px,0px)}}.dsh-bot-apply .dsh-bot-apply-e4{animation-name:dsh-bot-apply-k4}@keyframes dsh-bot-apply-k5{0.0%{opacity:0;transform:translate(0px,0px)}29.167%{opacity:0;transform:translate(0px,0px)}31.667%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-bot-apply .dsh-bot-apply-e5{animation-name:dsh-bot-apply-k5}@keyframes dsh-bot-apply-k6{0.0%{opacity:0;transform:translate(0px,0px)}33.333%{opacity:0;transform:translate(0px,0px)}35.417%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-bot-apply .dsh-bot-apply-e6{animation-name:dsh-bot-apply-k6}@keyframes dsh-bot-apply-k7{0.0%{opacity:0;transform:translate(0px,0px)}37.5%{opacity:0;transform:translate(0px,0px)}39.583%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-bot-apply .dsh-bot-apply-e7{animation-name:dsh-bot-apply-k7}@keyframes dsh-bot-apply-k8{0.0%{opacity:0;transform:translate(0px,0px)}41.667%{opacity:0;transform:translate(0px,0px)}43.75%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-bot-apply .dsh-bot-apply-e8{animation-name:dsh-bot-apply-k8}.dsh-bot-apply .dsh-bot-apply-dsh{stroke-dasharray:5 5}</style>
