<svg xmlns="http://www.w3.org/2000/svg" class="dsh-bot-apply" viewBox="0 0 960 210" width="960" height="210" role="img" aria-labelledby="dsh-bot-apply-t dsh-bot-apply-d">
<title id="dsh-bot-apply-t">Как бот меняет секреты прокси: сейчас и в цели</title>
<desc id="dsh-bot-apply-d">Сейчас бот по SSH дописывает секрет в secrets.conf и перезапускает mtproxy. Цель — отправлять HTTP POST на /v1/users, и telemt применяет пользователя на лету без перезапуска.</desc>
