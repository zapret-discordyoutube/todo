<g class="a dsh-bot-apply-e2"><text class="dsh-bot-apply-sm" x="18" y="74">Бот → SSH</text></g>
<g class="a dsh-bot-apply-e3"><text class="dsh-bot-apply-sm" x="18" y="114">echo secret &gt;&gt; secrets.conf</text></g>
<g class="a dsh-bot-apply-e4"><text class="dsh-bot-apply-sm" x="18" y="154">systemctl restart mtproxy</text></g>
<g class="a dsh-bot-apply-e5"><rect class="dsh-bot-apply-bxa" x="490" y="8" width="466" height="190" rx="10"/><text class="dsh-bot-apply-acc dsh-bot-apply-tk" x="506" y="38">Цель</text></g>
