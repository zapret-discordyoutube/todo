<title id="dsh-ja4-sni-order-t">Почему JA4 и SNI меняются только на стороне клиента</title>
<desc id="dsh-ja4-sni-order-d">Telegram сам генерирует ClientHello с JA4 и SNI, цензор видит этот почерк, и только после этого пакет приходит на сервер-прокси, который ничего изменить уже не может.</desc>
