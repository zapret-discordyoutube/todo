<svg xmlns="http://www.w3.org/2000/svg" class="dsh-telegram-wss-stack" viewBox="0 0 960 368" width="960" height="368" role="img" aria-labelledby="dsh-telegram-wss-stack-t dsh-telegram-wss-stack-d">
<title id="dsh-telegram-wss-stack-t">Из каких слоёв состоит соединение Telegram по WebSocket</title>
<desc id="dsh-telegram-wss-stack-d">Соединение открывается на TCP 443 к адресу релея, поверх идёт настоящий TLS с именем сервера kwsN.web.telegram.org, затем HTTP/1.1 Upgrade до WebSocket, бинарные кадры, obfuscated2 с шифром AES-256-CTR и внутри MTProto с шифрованием ключом авторизации.</desc>
