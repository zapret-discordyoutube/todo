<svg xmlns="http://www.w3.org/2000/svg" class="dsh-mtproxy-latency" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="dsh-mtproxy-latency-t dsh-mtproxy-latency-d">
<title id="dsh-mtproxy-latency-t">Сеть не добавляет задержки: на одном релее цифры одинаковы</title>
<desc id="dsh-mtproxy-latency-d">Время в миллисекундах для трёх отрезков соединения: tcp до релея, faketls — ответ релея, respq — путь через релей до Telegram и обратно. Релей B даёт почти те же цифры в фильтрованной и в чистой сети: фильтрация задержки не добавляет. «За релеем» — примерно respq минус tcp.</desc>
