<svg xmlns="http://www.w3.org/2000/svg" class="dsh-zig-wire" viewBox="0 0 960 386" width="960" height="386" role="img" aria-labelledby="dsh-zig-wire-t dsh-zig-wire-d">
<title id="dsh-zig-wire-t">Что происходит на проводе: карта защит mtproto.zig</title>
<desc id="dsh-zig-wire-d">ClientHello несёт почерк клиента, ТСПУ снимает отпечаток, сервер тоже пишет его в лог. ServerHello сервер дробит desync. Затем идёт 64-байтный MTProto-хендшейк, и если соединение живо, сервер проксирует его в DC.</desc>
