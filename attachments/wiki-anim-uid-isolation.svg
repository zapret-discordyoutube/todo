--acc)}.dsh-uid-isolation .dsh-uid-isolation-hd-f{fill:var(--fg2)}.dsh-uid-isolation .dsh-uid-isolation-hd-r{fill:var(--rej)}.dsh-uid-isolation .dsh-uid-isolation-dot{fill:var(--acc)}.dsh-uid-isolation .dsh-uid-isolation-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-uid-isolation .dsh-uid-isolation-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-uid-isolation .dsh-uid-isolation-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-uid-isolation .dsh-uid-isolation-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-uid-isolation .a{animation-duration:12s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-uid-isolation .a{animation:none}.dsh-uid-isolation .tr{display:none}}figure.dsh-uid-isolation-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-uid-isolation-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-uid-isolation-k1{0.0%{opacity:0;transform:translate(0px,0px)}4.167%{opacity:0;transform:translate(0px,0px)}6.667%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-uid-isolation .dsh-uid-isolation-e1{animation-name:dsh-uid-isolation-k1}@keyframes dsh-uid-isolation-k2{0.0%{opacity:0;transform:translate(0px,0px)}8.333%{opacity:0;transform:translate(0px,0px)}10.417%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-uid-isolation .dsh-uid-isolation-e2{animation-name:dsh-uid-isolation-k2}@keyframes dsh-uid-isolation-k3{0.0%{opacity:0;transform:translate(0px,0px)}12.5%{opacity:0;transform:translate(0px,0px)}14.583%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-uid-isolation .dsh-uid-isolation-e3{animation-name:dsh-uid-isolation-k3}@keyframes dsh-uid-isolation-k4{0.0%{opacity:0;transform:translate(0px,0px)}16.667%{opacity:0;transform:translate(0px,0px)}18.75%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-uid-isolation .dsh-uid-isolation-e4{animation-name:dsh-uid-isolation-k4}@keyframes dsh-uid-isolation-k5{0.0%{opacity:0;transform:translate(0px,0px)}29.167%{opacity:0;transform:translate(0px,0px)}31.667%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-uid-isolation .dsh-uid-isolation-e5{animation-name:dsh-uid-isolation-k5}@keyframes dsh-uid-isolation-k6{0.0%{opacity:0;transform:translate(0px,0px)}33.333%{opacity:0;transform:translate(0px,0px)}35.417%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-uid-isolation .dsh-uid-isolation-e6{animation-name:dsh-uid-isolation-k6}@keyframes dsh-uid-isolation-k7{0.0%{opacity:0;transform:translate(0px,0px)}37.5%{opacity:0;transform:translate(0px,0px)}39.583%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-uid-isolation .dsh-uid-isolation-e7{animation-name:dsh-uid-isolation-k7}.dsh-uid-isolation .dsh-uid-isolation-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-uid-isolation-bg" x="0" y="0" width="960" height="210"/>
<g class="a dsh-uid-isolation-e1"><rect class="dsh-uid-isolation-bxa" x="2" y="8" width="466" height="190" rx="10"/><text class="dsh-uid-isolation-acc dsh-uid-isolation-tk" x="18" y="38">VPN-клиент (UID 10150)</text></g>
<g class="a dsh-uid-isolation-e2"><text class="dsh-uid-isolation-sm" x="18" y="74">TCP → 127.0.0.1:10808</text></g>
<g class="a dsh-uid-isolation-e3"><text class="dsh-uid-isolation-sm" x="18" y="114">«user=abc pass=xyz» — открытым текстом</text></g>
<g class="a dsh-uid-isolation-e4"><text class="dsh-uid-isolation-sm" x="18" y="154">ядро: только UID 10150 видит эти данные</text></g>
<g class="a dsh-uid-isolation-e5"><rect class="dsh-uid-isolation-bxr" x="490" y="8" width="466" height="190" rx="10"/><text class="dsh-uid-isolation-rej dsh-uid-isolation-tk" x="506" y="38">Шпион (UID 10200)</text></g>
