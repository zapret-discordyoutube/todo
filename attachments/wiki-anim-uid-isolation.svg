<svg xmlns="http://www.w3.org/2000/svg" class="dsh-uid-isolation" viewBox="0 0 960 210" width="960" height="210" role="img" aria-labelledby="dsh-uid-isolation-t dsh-uid-isolation-d">
<title id="dsh-uid-isolation-t">Пароль на localhost защищён изоляцией процессов Android</title>
<desc id="dsh-uid-isolation-d">VPN-клиент с UID 10150 подключается к 127.0.0.1:10808 с паролем открытым текстом, но данные видит только ядро и этот UID. Шпион с UID 10200 может сделать connect к порту, но ему нужен пароль, а читать чужой сокет он не может.</desc>
<style>.dsh-uid-isolation{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-uid-isolation{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-uid-isolation .dsh-uid-isolation-bg{fill:var(--bg)}.dsh-uid-isolation text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-uid-isolation .dsh-uid-isolation-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-uid-isolation .dsh-uid-isolation-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-uid-isolation .dsh-uid-isolation-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-uid-isolation .dsh-uid-isolation-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-uid-isolation .dsh-uid-isolation-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-uid-isolation .dsh-uid-isolation-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-uid-isolation .dsh-uid-isolation-sm{font-size:14.5px}.dsh-uid-isolation .dsh-uid-isolation-mu{fill:var(--mute)}.