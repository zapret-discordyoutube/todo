<g class="a dsh-loopback-e1"><rect class="dsh-loopback-bx" x="40" y="20" width="220" height="62" rx="8"/><text class="dsh-loopback-tk dsh-loopback-c dsh-loopback-sm" x="150" y="48">Приложение A</text><text class="dsh-loopback-mu dsh-loopback-sm dsh-loopback-c" x="150" y="68">Яндекс</text><path class="dsh-loopback-sl-f" d="M150 86L150 124"/><polygon class="dsh-loopback-hd-f" points="150.0,124.0 145.0,114.0 155.0,114.0"/></g>
<g class="a dsh-loopback-e2"><rect class="dsh-loopback-bxr" x="340" y="20" width="220" height="62" rx="8"/><text class="dsh-loopback-rej dsh-loopback-tk dsh-loopback-c dsh-loopback-sm" x="450" y="48">Приложение B</text><text class="dsh-loopback-mu dsh-loopback-sm dsh-loopback-c" x="450" y="68">шпион</text><path class="dsh-loopback-sl-r" d="M450 86L450 124"/><polygon class="dsh-loopback-hd-r" points="450.0,124.0 445.0,114.0 455.0,114.0"/></g>
