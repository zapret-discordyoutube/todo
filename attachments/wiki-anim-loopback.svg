<svg xmlns="http://www.w3.org/2000/svg" class="dsh-loopback" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="dsh-loopback-t dsh-loopback-d">
<title id="dsh-loopback-t">127.0.0.1 общий для всех процессов устройства</title>
<desc id="dsh-loopback-d">Яндекс, шпионское приложение и браузер обращаются к одному и тому же 127.0.0.1. Этот адрес общий для всех процессов, не маршрутизируется через VPN или TUN, не изолирован между профилями и не требует специальных разрешений.</desc>
<style>.dsh-loopback{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-loopback{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-loopback .dsh-loopback-bg{fill:var(--bg)}.dsh-loopback text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-loopback .dsh-loopback-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-loopback .dsh-loopback-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-loopback .dsh-loopback-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-loopback .dsh-loopback-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-loopback .dsh-loopback-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-loopback .dsh-loopback-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-loopback .dsh-loopback-sm{font-size:14.5px}.dsh-loopback .dsh-loopback-mu{fill:var(--mute)}.dsh-loopback .dsh-loopback-fg{fill:var(--fg)}.dsh-loopback .dsh-loopback-acc{fill:var(--acc)}.dsh-loopback .dsh-loopback-rej{fill:var(--rej)}.dsh-loopback .dsh-loopback-c{text-anchor:middle}.dsh-loopback .dsh-loopback-r{text-anchor:end}.dsh-loopback .dsh-loopback-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-loopback .dsh-loopback-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-loopback .dsh-loopback-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-loopback .dsh-loopback-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-loopback .dsh-loopback-bxn{fill:none;stroke:none}.dsh-loopback .dsh-loopback-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-loopback .dsh-loopback-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-loopback .dsh-loopback-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-loopback .dsh-loopback-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-loopback .dsh-loopback-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-loopback .dsh-loopback-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-loopback .dsh-loopback-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-loopback .dsh-loopback-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-loopback .dsh-loopback-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-loopback .dsh-loopback-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-loopback .dsh-loopback-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-loopback .dsh-loopback-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-loopback .dsh-loopback-bxbg{fill:var(--bg);stroke:none}.dsh-loopback .dsh-loopback-hd-a{fill:var(--acc)}.dsh-loopback .dsh-loopback-hd-f{fill:var(--fg2)}.dsh-loopback .dsh-loopback-hd-r{fill:var(--rej)}.dsh-loopback .dsh-loopback-dot{fill:var(--acc)}.dsh-loopback .dsh-loopback-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-loopback .dsh-loopback-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-loopback .dsh-loopback-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-loopback .dsh-loopback-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-loopback .a{animation-duration:11s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-loopback .a{animation:none}.dsh-loopback .tr{display:none}}figure.dsh-loopback-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-loopback-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-loopback-k1{0.0%{opacity:0;transform:translate(0px,-8px)}3.636%{opacity:0;transform:translate(0px,-8px)}6.818%{opacity:1;transform:translate(0px,0px)}95.0%{opacity:1;transform:translate(0px,0px)}98.636%{opacity:0;transform:translate(0px,-8px)}100%{opacity:0;transform:translate(0px,-8px)}}.dsh-loopback .dsh-loopback-e1{animation-name:dsh-loopback-k1}@keyframes dsh-loopback-k2{0.0%{opacity:0;transform:translate(0px,-8px)}10.0%{opacity:0;transform:translate(0px,-8px)}13.182%{opacity:1;transform:translate(0px,0px)}95.0%{opacity:1;transform:translate(0px,0px)}98.636%{opacity:0;transform:translate(0px,-8px)}100%{opacity:0;transform:translate(0px,-8px)}}.dsh-loopback .dsh-loopback-e2{animation-name:dsh-loopback-k2}@keyframes dsh-loopback-k3{0.0%{opacity:0;transform:translate(0px,-8px)}16.364%{opacity:0;transform:translate(0px,-8px)}19.545%{opacity:1;transform:translate(0px,0px)}95.0%{opacity:1;transform:translate(0px,0px)}98.636%{opacity:0;transform:translate(0px,-8px)}100%{opacity:0;transform:translate(0px,-8px)}}.dsh-loopback .dsh-loopback-e3{animation-name:dsh-loopback-k3}@keyframes dsh-loopback-k4{0.0%{opacity:0;transform:translate(0px,0px)}27.273%{opacity:0;transform:translate(0px,0px)}30.455%{opacity:1;transform:translate(0px,0px)}95.0%{opacity:1;transform:translate(0px,0px)}98.636%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-loopback .dsh-loopback-e4{animation-name:dsh-loopback-k4}@keyframes dsh-loopback-k5{0.0%{opacity:0;transform:translate(0px,0px)}45.455%{opacity:0;transform:translate(0px,0px)}48.636%{opacity:1;transform:translate(0px,0px)}95.0%{opacity:1;transform:translate(0px,0px)}98.636%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-loopback .dsh-loopback-e5{animation-name:dsh-loopback-k5}.dsh-loopback .dsh-loopback-dsh{stroke-dasharray:5 5}</style>
