y .dsh-socks5-spy-acc{fill:var(--acc)}.dsh-socks5-spy .dsh-socks5-spy-rej{fill:var(--rej)}.dsh-socks5-spy .dsh-socks5-spy-c{text-anchor:middle}.dsh-socks5-spy .dsh-socks5-spy-r{text-anchor:end}.dsh-socks5-spy .dsh-socks5-spy-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-socks5-spy .dsh-socks5-spy-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-socks5-spy .dsh-socks5-spy-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-socks5-spy .dsh-socks5-spy-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-socks5-spy .dsh-socks5-spy-bxn{fill:none;stroke:none}.dsh-socks5-spy .dsh-socks5-spy-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-socks5-spy .dsh-socks5-spy-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-socks5-spy .dsh-socks5-spy-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-socks5-spy .dsh-socks5-spy-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-socks5-spy .dsh-socks5-spy-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-socks5-spy .dsh-socks5-spy-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-socks5-spy .dsh-socks5-spy-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-socks5-spy .dsh-socks5-spy-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-socks5-spy .dsh-socks5-spy-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-socks5-spy .dsh-socks5-spy-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-socks5-spy .dsh-socks5-spy-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-socks5-spy .dsh-socks5-spy-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-socks5-spy .dsh-socks5-spy-bxbg{fill:var(--bg);stroke:none}.dsh-socks5-spy .dsh-socks5-spy-hd-a{fill:var(--acc)}.dsh-socks5-spy .dsh-socks5-spy-hd-f{fill:var(--fg2)}.dsh-socks5-spy .dsh-socks5-spy-hd-r{fill:var(--rej)}.dsh-socks5-spy .dsh-socks5-spy-dot{fill:var(--acc)}.dsh-socks5-spy .dsh-socks5-spy-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-socks5-spy .dsh-socks5-spy-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-socks5-spy .dsh-socks5-spy-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-socks5-spy .dsh-socks5-spy-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-socks5-spy .a{animation-duration:10.0s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-socks5-spy .a{animation:none}.dsh-socks5-spy .tr{display:none}}figure.dsh-socks5-spy-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-socks5-spy-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-socks5-spy-k1{0.0%{opacity:0;transform:translate(-10px,0px)}4.0%{opacity:0;transform:translate(-10px,0px)}7.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e1{animation-name:dsh-socks5-spy-k1}@keyframes dsh-socks5-spy-k2{0.0%{opacity:0;transform:translate(0px,0px)}8.0%{opacity:0;transform:translate(0px,0px)}10.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e2{animation-name:dsh-socks5-spy-k2}@keyframes dsh-socks5-spy-k3{0.0%{opacity:0;transform:translate(-10px,0px)}16.0%{opacity:0;transform:translate(-10px,0px)}19.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e3{animation-name:dsh-socks5-spy-k3}@keyframes dsh-socks5-spy-k4{0.0%{opacity:0;transform:translate(0px,0px)}20.0%{opacity:0;transform:translate(0px,0px)}22.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e4{animation-name:dsh-socks5-spy-k4}@keyframes dsh-socks5-spy-k5{0.0%{opacity:0;transform:translate(-10px,0px)}28.0%{opacity:0;transform:translate(-10px,0px)}31.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e5{animation-name:dsh-socks5-spy-k5}@keyframes dsh-socks5-spy-k6{0.0%{opacity:0;transform:translate(0px,0px)}32.0%{opacity:0;transform:translate(0px,0px)}34.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e6{animation-name:dsh-socks5-spy-k6}@keyframes dsh-socks5-spy-k7{0.0%{opacity:0;transform:translate(-10px,0px)}40.0%{opacity:0;transform:translate(-10px,0px)}43.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e7{animation-name:dsh-socks5-spy-k7}@keyframes dsh-socks5-spy-k8{0.0%{opacity:0;transform:translate(0px,0px)}44.0%{opacity:0;transform:translate(0px,0px)}46.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-socks5-spy .dsh-socks5-spy-e8{animation-name:dsh-socks5-spy-k8}@keyframes dsh-socks5-spy-k9{0.0%{opacity:0;transform:translate(-10px,0px)}52.0%{opacity:0;transform:translate(-10px,0px)}55.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(-10px,0px)}100%{opacity:0;transform:translate(-10px,0px)}}.dsh-socks5-spy .dsh-socks5-spy