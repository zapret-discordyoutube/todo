<svg xmlns="http://www.w3.org/2000/svg" class="dsh-socks5-spy" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="dsh-socks5-spy-t dsh-socks5-spy-d">
<title id="dsh-socks5-spy-t">Как шпионский модуль получает выходной IP через открытый SOCKS5</title>
<desc id="dsh-socks5-spy-d">Модуль в приложении сканирует порты localhost, находит SOCKS5 без аутентификации на 127.0.0.1:10808, проводит handshake с методом 0x00, открывает CONNECT на ifconfig.me:80 и получает ответ с выходным IP VPN-сервера.</desc>
