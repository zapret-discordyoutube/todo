<svg xmlns="http://www.w3.org/2000/svg" class="dsh-own-socks5" viewBox="0 0 960 210" width="960" height="210" role="img" aria-labelledby="dsh-own-socks5-t dsh-own-socks5-d">
<title id="dsh-own-socks5-t">Где включать пароль, если вы не владелец подписки</title>
<desc id="dsh-own-socks5-d">Сервер VLESS Reality принадлежит владельцу подписки, и вы его не контролируете. Локальный SOCKS5 inbound на localhost:10808 находится на вашем устройстве: именно там вы меняете настройку auth: password.</desc>
