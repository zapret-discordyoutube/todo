<svg xmlns="http://www.w3.org/2000/svg" class="dsh-android-localhost" viewBox="0 0 960 170" width="960" height="170" role="img" aria-labelledby="dsh-android-localhost-t dsh-android-localhost-d">
<title id="dsh-android-localhost-t">Без root блокировщики не видят localhost</title>
<desc id="dsh-android-localhost-d">Приложение A обращается на 127.0.0.1:10808 к xray или sing-box: это localhost, он не проходит через VPN API. NetGuard и RethinkDNS как VPN перехватывают только реальные интерфейсы eth0, wlan0 и rmnet0, поэтому трафик приложения B к google.com они видят, а локальные обращения нет.</desc>
<style>.dsh-android-localhost{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-android-localhost{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-android-localhost .dsh-android-localhost-bg{fill:var(--bg)}.dsh-android-localhost text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-android-localhost .dsh-android-localhost-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-android-localhost .dsh-android-localhost-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-android-localhost .dsh-android-localhost-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-android-localhost .dsh-android-localhost-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-android-localhost .dsh-android-localhost-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-android-localhost .dsh-android-localhost-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-android-localhost .dsh-android-localhost-sm{font-size:14.5px}.dsh-android-localhost .dsh-android-localhost-mu{fill:var(--mute)}.dsh-android-localhost .dsh-android-localhost-fg{fill:var(--fg)}.dsh-android-localhost .dsh-android-localhost-acc{fill:var(--acc)}.dsh-android-localhost .dsh-android-localhost-rej{fill:var(--rej)}.dsh-android-localhost .dsh-android-localhost-c{text-anchor:middle}.dsh-android-localhost .dsh-android-localhost-r{text-anchor:end}.dsh-android-localhost .dsh-android-localhost-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-android-localhost .dsh-android-localhost-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-android-localhost .dsh-android-localhost-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-android-localhost .dsh-android-localhost-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-android-localhost .dsh-android-localhost-bxn{fill:none;stroke:none}.dsh-android-localhost .dsh-android-localhost-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-android-localhost .dsh-android-localhost-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-android-localhost .dsh-android-localhost-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-android-localhost .dsh-android-localhost-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-android-localhost .dsh-android-localhost-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-android-localhost .dsh-android-localhost-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-android-localhost .dsh-android-localhost-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-android-localhost .dsh-android-localhost-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-android-localhost .dsh-android-localhost-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-android-localhost .dsh-android-localhost-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-android-localhost .dsh-android-localhost-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-android-localhost .dsh-android-localhost-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-android-localhost .dsh-android-localhost-bxbg{fill:var(--bg);stroke:none}.dsh-android-localhost .dsh-android-localhost-hd-a{fill:var(--acc)}.dsh-android-localhost .dsh-android-localhost-hd-f{fill:var(--fg2)}.dsh-android-localhost .dsh-android-localhost-hd-r{fill:var(--rej)}.dsh-android-localhost .dsh-android-localhost-dot{fill:var(--acc)}.dsh-android-localhost .dsh-android-localhost-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-android-localhost .dsh-android-localhost-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-android-localhost .dsh-android-localhost-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-android-localhost .dsh-android-localhost-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-android-localhost .a{animation-duration:12s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-android-localhost .a{animation:none}.dsh-android-localhost .tr{display:none}}figure.dsh-android-localhost-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-android-localhost-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-android-localhost-k1{0.0%{opacity:0;transform:translate(0px,0px)}4.167%{opacity:0;transform:translate(0px,0px)}6.667%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-android-localhost .dsh-android-localhost-e1{animation-name:dsh-android-localhost-k1}@keyframes dsh-android-localhost-k2{0.0%{opacity:0;transform:translate(0px,0px)}8.333%{opacity:0;transform:translate(0px,0px)}10.417%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-android-localhost .dsh-android-localhost-e2{animation-name:dsh-android-localhost-k2}@keyframes dsh-android-localhost-k3{0.0%{opacity:0;transform:translate(0px,0px)}12.5%{opacity:0;transform:translate(0px,0px)}14.583%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-android-localhost .dsh-android-localhost-e3{animation-name:dsh-android-localhost-k3}@keyframes dsh-android-localhost-k4{0.0%{opacity:0;transform:translate(0px,0px)}29.167%{opacity:0;transform:translate(0px,0px)}31.667%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-android-localhost .dsh-android-localhost-e4{animation-name:dsh-android-localhost-k4}@keyframes dsh-android-localhost-k5{0.0%{opacity:0;transform:translate(0px,0px)}33.333%{opacity:0;transform:translate(0px,0px)}35.417%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-android-localhost .dsh-android-localhost-e5{animation-name:dsh-android-localhost-k5}@keyframes dsh-android-localhost-k6{0.0%{opacity:0;transform:translate(0px,0px)}37.5%{opacity:0;transform:translate(0px,0px)}39.583%{opacity:1;transform:translate(0px,0px)}95.417%{opacity:1;transform:translate(0px,0px)}98.75%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-android-localhost .dsh-android-localhost-e6{animation-name:dsh-android-localhost-k6}.dsh-android-localhost .dsh-android-localhost-dsh{stroke-dasharray:5 5}</style>
<rect class="dsh-android-localhost-bg" x="0" y="0" width="960" height="170"/>
<g class="a dsh-android-localhost-e1"><rect class="dsh-android-localhost-bxr" x="2" y="8" width="466" height="150" rx="10"/><text class="dsh-android-localhost-rej dsh-android-localhost-tk" x="18" y="38">Приложение A → 127.0.0.1:10808</text></g>
