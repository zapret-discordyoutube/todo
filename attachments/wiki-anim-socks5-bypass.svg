<svg xmlns="http://www.w3.org/2000/svg" class="dsh-socks5-bypass" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="dsh-socks5-bypass-t dsh-socks5-bypass-d">
<title id="dsh-socks5-bypass-t">Шпион идёт мимо VpnService, поэтому per-app split tunneling не помогает</title>
<desc id="dsh-socks5-bypass-d">Обычное приложение проходит VpnService, tun2socks и SOCKS5 xray до VPN-сервера и интернета. Шпион обращается прямо на 127.0.0.1:10808 минуя VpnService, поэтому исключение приложений из туннеля его не останавливает.</desc>
