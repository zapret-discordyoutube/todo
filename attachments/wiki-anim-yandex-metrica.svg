<svg xmlns="http://www.w3.org/2000/svg" class="dsh-yandex-metrica" viewBox="0 0 960 314" width="960" height="314" role="img" aria-labelledby="dsh-yandex-metrica-t dsh-yandex-metrica-d">
<title id="dsh-yandex-metrica-t">Яндекс.Метрика: браузер узнаёт идентификаторы у приложения по localhost</title>
<desc id="dsh-yandex-metrica-d">JavaScript Яндекс.Метрики в браузере обращается по HTTP на локальные порты 29009 и 30102 (HTTPS — 29010 и 30103), где слушает SDK Метрики в нативном приложении Яндекса. Приложение отвечает 200 OK с AAID и зашифрованными ID, а браузер отправляет их на mc.yango.com.</desc>
