<svg xmlns="http://www.w3.org/2000/svg" class="dsh-grpc-chain" viewBox="0 0 960 200" width="960" height="200" role="img" aria-labelledby="dsh-grpc-chain-t dsh-grpc-chain-d">
<title id="dsh-grpc-chain-t">Цепочка атаки через открытый gRPC API прокси-ядра</title>
<desc id="dsh-grpc-chain-d">Шпион сканирует порты, находит gRPC API без авторизации, через ReflectionService узнаёт список методов, через HandlerService выгружает конфиг outbound и получает ключ шифрования, IP сервера и SNI; вместе со второй уязвимостью конфигурации это позволяет расшифровать трафик.</desc>
<style>.dsh-grpc-chain{--fg:var(--dark,#2b2b2b);--fg2:var(--darkgray,#4e4e4e);--mute:var(--gray,#8a8a8a);--line:var(--lightgray,#e5e5e5);--acc:var(--secondary,#1f7fb5);--tint:var(--highlight,rgba(178,225,255,.28));--bg:var(--light,#faf8f8);--rej:#c4372b;--rejt:rgba(196,55,43,.10)}@media (prefers-color-scheme:dark){.dsh-grpc-chain{--fg:var(--dark,#ebebec);--fg2:var(--darkgray,#d4d4d4);--mute:var(--gray,#8c8c8c);--line:var(--lightgray,#393639);--acc:var(--secondary,#b2e1ff);--tint:var(--highlight,rgba(178,225,255,.12));--bg:var(--light,#161618);--rej:#ff8f80;--rejt:rgba(255,143,128,.13)}}.dsh-grpc-chain .dsh-grpc-chain-bg{fill:var(--bg)}.dsh-grpc-chain text{font-family:var(--bodyFont,'Source Sans 3'),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;fill:var(--fg2)}.dsh-grpc-chain .dsh-grpc-chain-t{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-grpc-chain .dsh-grpc-chain-tk{font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-grpc-chain .dsh-grpc-chain-m{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.dsh-grpc-chain .dsh-grpc-chain-mk{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:14.5px;font-weight:600;fill:var(--fg)}.dsh-grpc-chain .dsh-grpc-chain-ml{font-family:var(--codeFont,'JetBrains Mono'),ui-monospace,'Cascadia Code',Consolas,monospace;font-size:18px;font-weight:600;fill:var(--fg)}.dsh-grpc-chain .dsh-grpc-chain-cap{font-family:var(--headerFont,Inter),system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}.dsh-grpc-chain .dsh-grpc-chain-sm{font-size:14.5px}.dsh-grpc-chain .dsh-grpc-chain-mu{fill:var(--mute)}.dsh-grpc-chain .dsh-grpc-chain-fg{fill:var(--fg)}.dsh-grpc-chain .dsh-grpc-chain-acc{fill:var(--acc)}.dsh-grpc-chain .dsh-grpc-chain-rej{fill:var(--rej)}.dsh-grpc-chain .dsh-grpc-chain-c{text-anchor:middle}.dsh-grpc-chain .dsh-grpc-chain-r{text-anchor:end}.dsh-grpc-chain .dsh-grpc-chain-bx{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.dsh-grpc-chain .dsh-grpc-chain-bxa{fill:var(--tint);stroke:var(--acc);stroke-width:1.4}.dsh-grpc-chain .dsh-grpc-chain-bxr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.4}.dsh-grpc-chain .dsh-grpc-chain-bxd{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:3 3}.dsh-grpc-chain .dsh-grpc-chain-bxn{fill:none;stroke:none}.dsh-grpc-chain .dsh-grpc-chain-lf{fill:none;stroke:var(--line);stroke-width:1.2}.dsh-grpc-chain .dsh-grpc-chain-lfd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}.dsh-grpc-chain .dsh-grpc-chain-lm{fill:none;stroke:var(--mute);stroke-width:1.4}.dsh-grpc-chain .dsh-grpc-chain-lmd{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:4 5}.dsh-grpc-chain .dsh-grpc-chain-lr{fill:none;stroke:var(--rej);stroke-width:2}.dsh-grpc-chain .dsh-grpc-chain-la{fill:none;stroke:var(--acc);stroke-width:2}.dsh-grpc-chain .dsh-grpc-chain-ln-a{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:100}.dsh-grpc-chain .dsh-grpc-chain-ln-f{fill:none;stroke:var(--fg2);stroke-width:2;stroke-dasharray:100}.dsh-grpc-chain .dsh-grpc-chain-ln-r{fill:none;stroke:var(--rej);stroke-width:2;stroke-dasharray:100}.dsh-grpc-chain .dsh-grpc-chain-sl-a{fill:none;stroke:var(--acc);stroke-width:2}.dsh-grpc-chain .dsh-grpc-chain-sl-f{fill:none;stroke:var(--fg2);stroke-width:2}.dsh-grpc-chain .dsh-grpc-chain-sl-r{fill:none;stroke:var(--rej);stroke-width:2}.dsh-grpc-chain .dsh-grpc-chain-bxbg{fill:var(--bg);stroke:none}.dsh-grpc-chain .dsh-grpc-chain-hd-a{fill:var(--acc)}.dsh-grpc-chain .dsh-grpc-chain-hd-f{fill:var(--fg2)}.dsh-grpc-chain .dsh-grpc-chain-hd-r{fill:var(--rej)}.dsh-grpc-chain .dsh-grpc-chain-dot{fill:var(--acc)}.dsh-grpc-chain .dsh-grpc-chain-ring{fill:none;stroke:var(--acc);stroke-width:1.8}.dsh-grpc-chain .dsh-grpc-chain-nd{fill:var(--bg);stroke:var(--mute);stroke-width:1.5}.dsh-grpc-chain .dsh-grpc-chain-ndr{fill:var(--rejt);stroke:var(--rej);stroke-width:1.8}.dsh-grpc-chain .dsh-grpc-chain-nda{fill:var(--tint);stroke:var(--acc);stroke-width:1.8}.dsh-grpc-chain .a{animation-duration:10.0s;animation-timing-function:cubic-bezier(.3,.6,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.dsh-grpc-chain .a{animation:none}.dsh-grpc-chain .tr{display:none}}figure.dsh-grpc-chain-fig{margin:1.6rem 0;overflow-x:auto}figure.dsh-grpc-chain-fig>svg{display:block;width:100%;min-width:680px;height:auto}@keyframes dsh-grpc-chain-k1{0.0%{opacity:0;transform:translate(0px,8px)}4.0%{opacity:0;transform:translate(0px,8px)}7.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-grpc-chain .dsh-grpc-chain-e1{animation-name:dsh-grpc-chain-k1}@keyframes dsh-grpc-chain-k2{0.0%{opacity:0;transform:translate(0px,0px)}8.0%{opacity:0;transform:translate(0px,0px)}10.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-grpc-chain .dsh-grpc-chain-e2{animation-name:dsh-grpc-chain-k2}@keyframes dsh-grpc-chain-k3{0.0%{opacity:0;transform:translate(0px,8px)}16.0%{opacity:0;transform:translate(0px,8px)}19.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-grpc-chain .dsh-grpc-chain-e3{animation-name:dsh-grpc-chain-k3}@keyframes dsh-grpc-chain-k4{0.0%{opacity:0;transform:translate(0px,0px)}20.0%{opacity:0;transform:translate(0px,0px)}22.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-grpc-chain .dsh-grpc-chain-e4{animation-name:dsh-grpc-chain-k4}@keyframes dsh-grpc-chain-k5{0.0%{opacity:0;transform:translate(0px,8px)}28.0%{opacity:0;transform:translate(0px,8px)}31.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-grpc-chain .dsh-grpc-chain-e5{animation-name:dsh-grpc-chain-k5}@keyframes dsh-grpc-chain-k6{0.0%{opacity:0;transform:translate(0px,0px)}32.0%{opacity:0;transform:translate(0px,0px)}34.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-grpc-chain .dsh-grpc-chain-e6{animation-name:dsh-grpc-chain-k6}@keyframes dsh-grpc-chain-k7{0.0%{opacity:0;transform:translate(0px,8px)}40.0%{opacity:0;transform:translate(0px,8px)}43.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-grpc-chain .dsh-grpc-chain-e7{animation-name:dsh-grpc-chain-k7}@keyframes dsh-grpc-chain-k8{0.0%{opacity:0;transform:translate(0px,0px)}44.0%{opacity:0;transform:translate(0px,0px)}46.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.dsh-grpc-chain .dsh-grpc-chain-e8{animation-name:dsh-grpc-chain-k8}@keyframes dsh-grpc-chain-k9{0.0%{opacity:0;transform:translate(0px,8px)}52.0%{opacity:0;transform:translate(0px,8px)}55.0%{opacity:1;transform:translate(0px,0px)}94.5%{opacity:1;transform:translate(0px,0px)}98.5%{opacity:0;transform:translate(0px,8px)}100%{opacity:0;transform:translate(0px,8px)}}.dsh-grpc-chain .dsh-grpc-chain-e9{animation-name:dsh-grpc-chain-k9}.ds